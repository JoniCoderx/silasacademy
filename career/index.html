<style>
/* Silas Academy. Modern study product: ink-blue structure, one highlighter-yellow signal (the marked answer), soft elevated cards on a cool paper ground. Display: Rubik. Text: IBM Plex Sans Hebrew. Numbers: Plex Mono. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#eceff7; --ink:#0f1430; --muted:#5d6482; --line:#e1e5f0;
  --accent:#2337b4; --accent-ink:#ffffff; --accent-soft:#e8ebfc; --gold:#8a6a00; --gold-soft:#fdf3c8;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#0c1234; --deep-2:#1a2580;
  --good:#16794a; --good-soft:#e1f3e9; --bad:#c0352b; --bad-soft:#fde6e3;
  --shadow:0 1px 2px rgb(15 20 48/.06),0 8px 24px rgb(15 20 48/.06);
  --display:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  --body:"IBM Plex Sans Hebrew", "Rubik", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h3,h4{font-family:var(--body);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:2.1rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0}
b,strong{font-weight:700}
a{color:var(--accent);text-underline-offset:3px}
bdi{unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.note{color:var(--muted);font-size:.9rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;flex:none}
.brand .names{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.75rem;line-height:1.05}
.brand .sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.brand .cd{margin-inline-start:auto;font-size:.8rem;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:3px 12px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:.98rem}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:700;border-color:var(--gold)}

/* layout */
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
header.page{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
header.page p{color:var(--muted);max-width:62ch}
.sec-title{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.crumbs{display:flex;gap:8px;font-size:.9rem;color:var(--muted)}
.crumbs a{text-decoration:none;font-weight:600}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.field input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;font-size:1rem}
input[type="number"],input[type="date"]{font-family:var(--mono)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);padding:10px 14px;border-radius:10px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:400}
details.more[open] summary::after{content:"−"}
details.more[open]{padding-bottom:18px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center}

/* onboarding */
.welcome{background:linear-gradient(160deg,#0f6476,#082a33);color:#fff;border-radius:20px;padding:clamp(22px,5vw,40px);display:flex;flex-direction:column;gap:14px}
.welcome .eyebrow{color:rgba(255,255,255,.75)}
.welcome h2{font-size:clamp(2rem,6vw,2.7rem)}
.welcome p{max-width:52ch;color:rgba(255,255,255,.88)}
.wl-top{display:flex;align-items:center;gap:10px}.wl-logo{width:34px;height:34px}
.wl-feats{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wl-feats li{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wl-feats b{color:#f0cd87;font-size:1.02rem}.wl-feats span{color:rgba(255,255,255,.85);font-size:.92rem;line-height:1.6}
.wl-facts{display:flex;flex-wrap:wrap;gap:8px}.wl-facts span{font-size:.85rem;padding:4px 12px;border-radius:999px;background:rgba(240,205,135,.16);color:#f6dfae}
.wl-level{border:0;padding:0;margin:0;flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.wl-level legend{color:rgba(255,255,255,.85);font-size:.9rem;margin-bottom:6px;padding:0}
.wl-level label{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;cursor:pointer}
.wl-level label:has(input:checked){border-color:#f0cd87;background:rgba(240,205,135,.14)}
.wl-level input{accent-color:#c8963f;margin-top:5px}.wl-level span{display:flex;flex-direction:column;font-size:.86rem;color:rgba(255,255,255,.8)}.wl-level span b{color:#fff;font-size:.98rem}
.wl-note{font-size:.82rem;color:rgba(255,255,255,.65)!important;margin:0}
.onb{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.onb .field{color:rgba(255,255,255,.85);flex:1 1 180px}
.onb input{background:#fff;color:#0f2a33;border:0}
.onb .btn{background:#c8963f;border-color:#c8963f;color:#1d1406;padding:10px 26px}

/* home */
.hello h2{font-size:clamp(2rem,6vw,2.6rem)}
.hello p{color:var(--muted);margin-top:4px}
.today{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.today h3{font-size:1.45rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .acts{display:flex;gap:6px;flex-wrap:wrap}
.today .todo{font-weight:500}
.today .book{color:var(--muted);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.45rem;font-weight:500}
.stats span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:12px 16px}
ol.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
ol.plan li{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
ol.plan li:first-child{border-top:0}
ol.plan .pd{color:var(--muted);font-size:.85rem}
ol.plan .pdate{color:var(--muted);font-size:.82rem;white-space:nowrap}
ol.plan .ok{color:var(--good);font-weight:700}
ol.plan li.now{background:var(--gold-soft)}
ol.plan li.now .pt{font-weight:700}
ol.plan li.done .pt{color:var(--muted)}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.mastery .eyebrow{margin-top:10px}
@media (max-width:640px){.mastery{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 3rem;gap:10px;align-items:center;padding:6px 0;background:none;border:0;width:100%;text-align:start}
.mrow.static{cursor:default}
.mname{font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.lo{background:var(--bad)} .bar i.mid{background:var(--gold)}
.mpct{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:left}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:480px){.settings{grid-template-columns:1fr}}
.booklist{display:flex;flex-direction:column;margin-top:8px}
.bookrow{display:grid;grid-template-columns:1.6fr .6fr .6fr 1fr;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.bk-t{display:flex;flex-direction:column}
@media (max-width:640px){.bookrow{grid-template-columns:1fr 1fr}.bk-t,.bk-w{grid-column:1/-1}}

/* learn */
.vrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:start;scroll-snap-align:start}
.vcard:hover{border-color:var(--accent)}
.vcard .vt{font-weight:600;padding:0 4px 4px;font-size:.95rem}
.vcard .vdur{padding:0 4px 4px;margin-top:-6px;font-size:.8rem;direction:rtl}
.vthumb{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--bg);aspect-ratio:16/9}
.vthumb svg{width:100%;height:100%;display:block;opacity:.7}
.vplayico{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.05rem;padding-inline-start:3px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ch-h{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--sunk);font-size:.88rem;font-weight:700}
.lrow{display:grid;grid-template-columns:12px 1fr 1.4rem 3rem;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;text-align:start;font-size:1rem}
.ch-h + .lrow{border-top:0}
.lrow:hover .lt{color:var(--accent)}
.lrow .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.lrow .dot.on{background:var(--good);border-color:var(--good)}
.lrow .vid{color:var(--gold);font-size:.8rem}
.lrow .lp{font-size:.82rem;color:var(--muted);text-align:left}
.glsearch{max-width:280px;margin-bottom:12px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px}
.gloss div{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}

/* lesson */
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px}
article.lesson h2{font-size:clamp(2rem,6vw,2.6rem)}
article.lesson > h4{font-size:1.15rem;margin-top:14px}
article.lesson p,article.lesson li{max-width:66ch}
article.lesson ul,article.lesson ol{margin:0;padding-inline-start:22px}
article.lesson li{margin:4px 0}
.zero{background:var(--accent-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.zero .why{font-size:1.06rem;font-weight:500}
.zcols{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.zcols h4{margin-bottom:6px;font-size:.95rem;color:var(--accent)}
.zero dl{margin:0;display:flex;flex-direction:column;gap:2px}
.zero dt{font-weight:700}
.zero dd{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.zero ol{margin:0;padding-inline-start:20px}
@media (max-width:640px){.zcols{grid-template-columns:1fr}}
.fx{font-family:var(--mono);font-size:.92rem;background:var(--sunk);border-inline-start:3px solid var(--gold);padding:10px 14px;border-radius:6px;direction:ltr;text-align:left;overflow-x:auto;line-height:1.85;unicode-bidi:isolate}
span.fx{display:inline;padding:2px 6px;border:0;line-height:1.6}
.ex,.plain,.trap{border-radius:12px;padding:14px 18px;line-height:1.85}
.ex{background:var(--sunk)}
.plain{background:var(--gold-soft)}
.trap{background:var(--bad-soft)}
.trap ul{margin:6px 0 0}
.tbl-wrap{overflow-x:auto;background:linear-gradient(to left,var(--surface) 30%,transparent),linear-gradient(to left,transparent,var(--surface) 70%) 100% 0,radial-gradient(farthest-side at 0 50%,rgb(0 0 0/.14),transparent),radial-gradient(farthest-side at 100% 50%,rgb(0 0 0/.14),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
table.mini{border-collapse:collapse;font-size:.92rem}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.mini td{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
table.mini th{background:var(--sunk);font-weight:600}
.endrow{margin-top:10px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* questions */
.qcard{scroll-margin-top:calc(var(--hdr,150px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead .btn{margin-inline-start:auto}
.qcard>*,.review>*,.qtext{min-width:0;max-width:100%}.tbl-wrap{max-width:100%}
.qtext{font-size:1.1rem;font-weight:500;line-height:1.8}
.qn{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;line-height:1.6}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);min-width:1.1em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{border-radius:12px;padding:14px 16px;background:var(--sunk);line-height:1.85}
.expl b.ok{color:var(--good)} .expl b.no{color:var(--bad)}
.expl p{margin:0 0 8px}.expl .vd{font-size:1.02rem}

@media (prefers-reduced-motion:no-preference){

  body.vchange:not([data-view="admin"]) #main > *{animation:rise .38s var(--ease) both}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

  .bar i,.minibar i,.prog i,.pbar i{transition:width .7s var(--ease)}

  .toast{animation:pop .28s var(--ease)}

  let db = {users: {}, current: null};
  try { const s = JSON.parse(localStorage.getItem(K)); if (s && s.users) db = s; } catch (e) {}

  async function loadMe(user) {

  const putGeo = (id, country, city, flag, lat, lng, acc) => {

  };

לה היא \"<b>כמה מקצועות</b> יש לו?\" (שניים ומעלה, במקביל). ב-Gig השאלה היא \"<b>איך</b> הוא מועסק?\" (משימות קצרות, בלי מעסיק קבוע). מעצבת שעושה רק עיצוב, אבל בפרויקטים קצרים דרך פלטפורמה → Gig. עורכת דין שהיא גם מדריכת פילאטיס → סלשרים."},{"t":"h","x":"כלים לפיתוח הקריירה"},{"t":"p","x":"ארגונים ועובדים משתמשים בכמה כלים כדי לקדם קריירה. במבחן צריך לזהות איזה כלי מתואר:"},{"t":"table","head":["כלי","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>Upskilling</b>","שדרוג ועדכון ידע ומיומנויות <b>לאותו תפקיד</b>.","\"כדי להישאר מעודכן\", \"ללמוד כלי חדש לעבודה הנוכחית\"","מנהלת חשבונות לומדת להשתמש ב-AI בהנהלת החשבונות."],["<b>Reskilling</b>","הכשרה מחדש <b>לתפקיד אחר</b>.","\"כדי שישתלב בהמשך בתפקיד...\", \"הסבה\", \"מעבר למחלקה אחרת\"","מנהלת חשבונות יוצאת לקורס משא ומתן כדי להפוך לקניינית."],["<b>Job Crafting</b>","<b>התאמת התפקיד לעובד ולהפך</b>: העובד (לבד או עם הארגון) משנה את המשימות, הקשרים או המשמעות של התפקיד.","\"הוסיפו לתפקיד שלה...\", \"עיצב מחדש את התפקיד לפי החוזקות שלו\"","אח שאוהב ללמד קיבל, בנוסף לעבודה במחלקה, אחריות על חניכת אחים חדשים."],["<b>Mentoring</b> (מנטורינג)","<b>אדם</b> ותיק ומנוסה מלווה, מייעץ ומכוון עובד אחר.","\"מנטור\", \"ותיק שמלווה אותה\", \"נפגשים פעם בחודש לייעוץ\"","מהנדסת חדשה נפגשת כל שבועיים עם מהנדס בכיר שמכוון אותה."]]},{"t":"p","x":"שאלת המפתח כדי להבדיל בין Upskilling ל-Reskilling: <b>האם התפקיד משתנה?</b>"},{"t":"list","x":["לומד משהו חדש ו<b>נשאר באותו תפקיד</b> → Upskilling.","לומד משהו חדש כדי <b>לעבור לתפקיד אחר</b> → Reskilling.","לא לומד קורס, אלא <b>משנים את התפקיד עצמו</b> כדי שיתאים לו → Job Crafting.","יש <b>אדם מלווה</b> (מנטור) → Mentoring."]},{"t":"trap","x":"המילה \"קורס\" לא אומרת Upskilling! במבחן לדוגמה מנהלת חשבונות נשלחה לקורס משא ומתן כדי להשתלב <b>כקניינית</b> → התשובה הנכונה היא <b>Reskilling</b>, כי המטרה היא תפקיד אחר."},{"t":"example","title":"ארבעה עובדים, ארבעה כלים","x":"דנה, מורה, לומדת להשתמש בלוח חכם בכיתה → Upskilling. אבי, נהג אוטובוס, לומד תכנות כדי לעבוד כמתכנת → Reskilling. שירה, פקידה שאוהבת לכתוב, קיבלה גם את כתיבת הניוזלטר של החברה → Job Crafting. תומר, איש מכירות חדש, מלווה על ידי איש מכירות ותיק → Mentoring."},{"t":"p","x":"<b>נטוורקינג</b> = בניית קשרים מקצועיים. הוא חשוב במיוחד בקריירה נטולת גבולות, כי המעברים בין ארגונים מגיעים הרבה פעמים דרך קשרים."},{"t":"exam","x":"השאלות בנושא הזה בנויות כסיפור קצר + \"התנהלותה ממחישה מגמת קריירה המכונה ___\" או \"הכלי בו השתמשה מחלקת משאבי האנוש הינו ___\". לפעמים משלבים שני מודלים בשאלה אחת (למשל סלשרים + בקרה עצמית), ואז שתי המילים בתשובה צריכות להיות נכונות."},{"t":"exam","x":"מסיחים נפוצים: לשים Gig Economy במקום סלשרים, Upskilling במקום Reskilling, \"מודרנית\" ו\"פרוטיאנית\" כשהסיפור מסורתי, או מונח ממודל אחר (דרייבר) שנשמע דומה."}],"cheat":["קריירה = רצף של עבודות וחוויות עבודה לאורך כל החיים","מסורתית = ארגון אחד + טיפוס הדרגתי + שכר עולה; הארגון מנהל","פרוטיאנית (הול) = העובד מנהל, לפי ערכים; הצלחה = סיפוק (פסיכולוגית)","מודרנית ≈ פרוטיאנית; שתיהן שגויות כשהסיפור מסורתי","נטולת גבולות = עובר בין ארגונים, תחומים ומדינות; נשען על קשרים","סלשרים = כמה מקצועות במקביל (עו\"ד/מדריכת פילאטיס)","Gig Economy = משימות קצרות לפי פרויקט/אפליקציה, בלי מעסיק קבוע","Upskilling = לומד חדש לאותו תפקיד","Reskilling = לומד חדש לתפקיד אחר (גם אם זה \"קורס\")","Job Crafting = מתאימים את התפקיד לעובד ולהפך","Mentoring = אדם ותיק מלווה ומכוון","ליניארית/משתנה/ספיראלית/יציבה = דרייבר, לא מסורתית/מודרנית"],"mcq":[{"id":"c1-1","q":"רינה עובדת כבר 27 שנה בחברת ביטוח גדולה. היא התחילה כפקידת קבלה, קודמה לראש צוות, אחר כך לסגנית מנהל אגף, וכיום היא מנהלת האגף. לאורך השנים השכר שלה עלה, והחברה היא שקבעה מתי ולאן תקודם. תיאור הקריירה של רינה מתאים ל-","o":["קריירה פרוטיאנית","קריירה נטולת גבולות","קריירה מסורתית","קריירה מודרנית"],"a":2,"why":"ארגון אחד, טיפוס הדרגתי בהיררכיה, שכר עולה, והארגון מנהל את הקריירה – אלה סימני ההיכר של קריירה מסורתית.","w":["בקריירה פרוטיאנית העובד מנהל את הקריירה לפי ערכיו; כאן החברה קבעה הכול.","נטולת גבולות = מעברים בין ארגונים; רינה נשארה בארגון אחד.","","\"מודרנית\" היא כמעט שם נרדף לפרוטיאנית ולכן שגויה מאותה סיבה."]},{"id":"c1-2","q":"עמית, מנהל פרויקטים בבנק, קיבל הצעה לקידום משמעותי. הוא דחה אותה ועבר לעבוד בעמותה קטנה לאיכות הסביבה בשכר נמוך יותר. \"אני מחליט לאן אני הולך, ומה שחשוב לי זה שאני מאמין במה שאני עושה\", אמר. הקריירה של עמית מתאימה לתיאור של קריירה ___ לפי הול.","o":["פרוטיאנית","מסורתית","ליניארית","יציבה"],"a":0,"why":"העובד מנהל את הקריירה בעצמו (\"אני מחליט\"), לפי ערכים, וההצלחה נמדדת בסיפוק ובמשמעות ולא בקידום – זו קריירה פרוטיאנית של הול.","w":["","במסורתית הארגון מנהל וההצלחה = קידום ושכר; עמית דווקא ויתר על קידום.","\"ליניארית\" היא מסלול של דרייבר (טיפוס במדרג), ועמית בדיוק ירד מהמדרג.","\"יציבה\" היא מסלול של דרייבר (מומחיות בתחום אחד לאורך החיים), לא החלוקה של הול."]},{"id":"c1-3","q":"נועה היא מפתחת תוכנה. ב-9 שנים היא עבדה ב-5 חברות שונות, שנתיים מתוכן בלונדון, ובין לבין גם בפרויקט משותף של שתי חברות. כמעט כל מעבר הגיע דרך אנשים שהכירה בתעשייה. הקריירה של נועה מתאימה במיוחד לתיאור של:","o":["קריירה מסורתית","Job Crafting","סלשרים","קריירה נטולת גבולות"],"a":3,"why":"מעברים רבים בין ארגונים ומדינות, הסתמכות על רשת קשרים מחוץ לארגון – זו קריירה נטולת גבולות.","w":["מסורתית = ארגון אחד; נועה עברה בין 5 ארגונים.","Job Crafting = שינוי התפקיד בתוך ארגון; לא זה מה שמתואר.","סלשרים = כמה מקצועות במקביל; נועה עוסקת במקצוע אחד בכל פעם.",""]},{"id":"c1-4","q":"רון עובד כרואה חשבון בשעות היום, בערבים הוא צלם חתונות, ובסופי שבוע הוא תקליטן במסיבות. כשהוא מציג את עצמו הוא אומר: \"רו\"ח/צלם/DJ\". התנהלותו של רון ממחישה מגמת קריירה המכונה:","o":["Gig Economy","סלשרים","Reskilling","קריירה מסורתית"],"a":1,"why":"כמה מקצועות שונים במקביל, ואפילו הסימן \"/\" בהצגה העצמית – זו מגמת הסלשרים.","w":["Gig Economy מתאר משימות קצרות לפי פרויקט בלי מעסיק קבוע; כאן הדגש הוא על שלושה מקצועות שונים במקביל.","","Reskilling = הכשרה מחדש לתפקיד אחר; רון לא עזב מקצוע אחד לטובת אחר.","מסורתית = ארגון אחד וטיפוס הדרגתי."]},{"id":"c1-5","q":"שני היא מעצבת גרפית. אין לה מעסיק קבוע: היא מקבלת עבודות דרך אתר Fiverr, כל עבודה נמשכת כמה ימים, ובכל פעם הלקוח אחר. זה המקצוע היחיד שלה. דרך ההעסקה של שני ממחישה את מגמת ה-","o":["סלשרים","Upskilling","Gig Economy","Mentoring"],"a":2,"why":"משימות קצרות לפי פרויקט, דרך פלטפורמה, בלי מעסיק קבוע – Gig Economy. יש לה מקצוע אחד, ולכן זה לא סלשרים.","w":["סלשרים = כמה מקצועות במקביל, ובסיפור כתוב שזה המקצוע היחיד שלה.","Upskilling = לימוד ושדרוג ידע; לא מתואר כאן לימוד.","","Mentoring = ליווי של מנטור; אין מנטור בסיפור."]},{"id":"c1-6","q":"לימור היא מנהלת חשבונות בחברת שיווק כבר 12 שנה. כדי להישאר מעודכנת, החברה שלחה אותה לקורס על שימוש בכלי בינה מלאכותית בהנהלת חשבונות. לימור תמשיך באותו תפקיד בדיוק. הכלי שבו השתמשה החברה הוא:","o":["Upskilling","Reskilling","Job Crafting","Gig Economy"],"a":0,"why":"היא לומדת מיומנות חדשה ונשארת באותו תפקיד (\"תמשיך באותו תפקיד בדיוק\") – זה Upskilling.","w":["","Reskilling הוא הכשרה לתפקיד אחר, ולימור נשארת מנהלת חשבונות.","Job Crafting = שינוי התפקיד עצמו; התפקיד לא השתנה, רק הידע.","Gig Economy היא מגמת העסקה, לא כלי פיתוח."]},{"id":"c1-7","q":"אבי עבד 15 שנה כפקיד בנק. כשהסניף נסגר, הבנק מימן לו קורס בניתוח נתונים, מתוך מטרה שישתלב בהמשך כאנליסט במחלקת הסיכונים. הכלי שבו השתמש הבנק הוא:","o":["Mentoring","Job Crafting","Upskilling","Reskilling"],"a":3,"why":"המטרה של הקורס היא מעבר לתפקיד אחר (מפקיד לאנליסט) – Reskilling, הכשרה מחדש.","w":["אין מנטור שמלווה את אבי, יש קורס.","Job Crafting = התאמת התפקיד הקיים; כאן אבי עובר לתפקיד חדש לגמרי.","Upskilling = שדרוג לאותו תפקיד; כאן התפקיד משתנה. המילה \"קורס\" לבדה לא אומרת Upskilling.",""]},{"id":"c1-8","q":"מירב היא אחות במחלקה פנימית. היא אוהבת מאוד ללמד, ולכן סיכמה עם האחות הראשית שחלק מהמשמרות שלה יוקדשו לחניכת אחיות חדשות. כך התפקיד שלה מתאים יותר לחוזקות שלה. מדובר ב-","o":["Reskilling","Job Crafting","Mentoring","סלשרים"],"a":1,"why":"לא מדובר בקורס ולא במעבר תפקיד: משנים את התפקיד הקיים כדי שיתאים לחוזקות של העובדת – Job Crafting.","w":["Reskilling = הכשרה לתפקיד אחר; מירב נשארת אחות במחלקה.","","מירב היא זו שמלמדת, אבל השאלה על מה שקרה לתפקיד שלה – הוא עוצב מחדש. זה Job Crafting.","סלשרים = כמה מקצועות שונים במקביל; כאן זה מקצוע אחד."]},{"id":"c1-9","q":"גיא התקבל כמהנדס צעיר בחברת תשתיות. החברה צירפה אליו מהנדסת בכירה, שנפגשת איתו פעם בשבועיים, עונה על שאלות, מייעצת לו לגבי ההתקדמות שלו ומכוונת אותו. הכלי שבו השתמשה החברה הוא:","o":["Upskilling","Job Crafting","Mentoring","Gig Economy"],"a":2,"why":"יש אדם ותיק ומנוסה שמלווה, מייעץ ומכוון – Mentoring.","w":["Upskilling הוא שדרוג ידע (קורס, הכשרה); כאן הדגש הוא על ליווי אישי של אדם.","Job Crafting = שינוי התפקיד; התפקיד של גיא לא השתנה.","","Gig Economy היא מגמת העסקה בעבודות קצרות, לא קשורה."]},{"id":"c1-10","q":"גל עובדת כאחות בבית חולים, ובערבים היא מופיעה כסטנדאפיסטית. לאחרונה בית החולים שלח אותה להשתלמות על מכשיר ניטור חדש, כדי שתוכל להפעיל אותו במחלקה שבה היא עובדת. התנהלותה של גל ממחישה מגמת ___, והכלי שבו השתמש בית החולים הוא ___, בהתאמה:","o":["Gig Economy, Reskilling","סלשרים, Reskilling","Gig Economy, Upskilling","סלשרים, Upskilling"],"a":3,"why":"אחות + סטנדאפיסטית = שני מקצועות במקביל → סלשרים. ההשתלמות נועדה לאותו תפקיד במחלקה → Upskilling.","w":["גם המגמה וגם הכלי שגויים: יש שני מקצועות (סלשרים), וההשתלמות לאותו תפקיד (Upskilling).","החלק הראשון נכון, אבל ההשתלמות היא לאותו תפקיד ולכן Upskilling ולא Reskilling.","הכלי נכון, אבל שני מקצועות במקביל הם סלשרים ולא Gig Economy.",""]},{"id":"c1-11","q":"לפי הגישה של הול (Hall) לקריירה הפרוטיאנית, מי אחראי לנהל את הקריירה, ואיך נמדדת ההצלחה?","o":["הארגון; לפי הדרגה והשכר","העובד; לפי הצלחה פסיכולוגית – סיפוק ומשמעות","העובד; לפי מספר הקידומים בארגון","הארגון; לפי שביעות הרצון של הממונה"],"a":1,"why":"בקריירה פרוטיאנית העובד מנהל את הקריירה, וההצלחה נמדדת בתחושה הפנימית – הצלחה פסיכולוגית.","w":["זה תיאור של קריירה מסורתית.","","החלק הראשון נכון, אבל מספר קידומים הוא מדד מסורתי ולא הצלחה פסיכולוגית.","בפרוטיאנית הארגון לא מנהל את הקריירה."]},{"id":"c1-12","q":"משה עבד 22 שנה במפעל טקסטיל. הוא התחיל כפועל ייצור, קודם לאחראי משמרת ואחר כך למנהל קו, והשכר שלו עלה בהדרגה. כשהמפעל עבר לייצור ממוחשב, המפעל שלח אותו להכשרה כדי שיעבור לתפקיד חדש של מתכנת מכונות. מסלול הקריירה של משה עד ההכשרה הוא ___, והכלי שהמפעל הפעיל הוא ___, בהתאמה:","o":["מסורתית, Reskilling","פרוטיאנית, Reskilling","מסורתית, Upskilling","נטולת גבולות, Job Crafting"],"a":0,"why":"ארגון אחד + טיפוס הדרגתי + שכר עולה → מסורתית. ההכשרה נועדה לתפקיד חדש ושונה → Reskilling.","w":["","משה לא ניהל את הקריירה לפי ערכיו – המפעל קידם אותו; זו מסורתית.","הקריירה אכן מסורתית, אבל ההכשרה היא לתפקיד חדש ולכן Reskilling.","משה נשאר בארגון אחד, ולא שינו את התפקיד הקיים אלא הכשירו אותו לתפקיד אחר."]},{"id":"c1-13","q":"מיכל עבדה 3 שנים כמלצרית, אחר כך 5 שנים כפקידה, ואז עשתה הסבה והיום היא גננת. חבר אמר לה: \"אין לך בעצם קריירה, רק עבודות\". לפי ההגדרה המקובלת של המושג קריירה:","o":["החבר צודק, כי קריירה היא רק טיפוס בתוך ארגון אחד","החבר צודק, כי רק עבודה עם קידום נחשבת קריירה","החבר טועה, כי קריירה היא רצף העבודות וחוויות העבודה של האדם לאורך החיים","החבר טועה, כי רק מי שיש לו תואר אקדמי נחשב בעל קריירה"],"a":2,"why":"קריירה מוגדרת כרצף של עבודות וחוויות הקשורות לעבודה לאורך החיים – גם מעברים והסבות הם קריירה.","w":["זו התפיסה הישנה והצרה; ההגדרה המקובלת רחבה יותר.","קידום אינו תנאי לקריירה.","","אין קשר בין תואר להגדרה של קריירה."]}]},{"id":"c2","title":"אישיות וקריירה","short":"אישיות וקריירה","blurb":"חמשת הגדולים (Big Five), ארבעת הממדים של MBTI, בקרה עצמית וצורך בהישג – ואיך מזהים כל אחד מהם בסיפור.","mnemonic":"Big Five = OCEAN (פתיחות, מצפוניות, מוחצנות, נעימות, יציבות רגשית); MBTI = ארבעה זוגות אותיות E/I, S/N, T/F, J/P; בקרה עצמית גבוהה = זיקית שמחליפה צבע לפי הקהל, נמוכה = \"מה שרואים זה מה שיש\"; צורך בהישג = רץ שמציב לעצמו שיא חדש.","blocks":[{"t":"h","x":"למה אישיות קשורה לקריירה?"},{"t":"p","x":"לכל אדם יש תכונות אישיות קבועות יחסית. התכונות האלה משפיעות על איזה תפקיד יתאים לו, איך הוא יעבוד ואיך יתנהג מול אנשים."},{"t":"p","x":"בקורס לומדים ארבעה כלים: <b>חמשת הגדולים</b>, <b>MBTI</b>, <b>בקרה עצמית</b> ו<b>צורך בהישג</b>. במבחן מתארים אדם, ואתם צריכים לתרגם את התיאור לשם התכונה."},{"t":"h","x":"מודל חמשת הגדולים (Big Five)"},{"t":"p","x":"לפי המודל, אפשר לתאר כל אדם לפי 5 תכונות. כל תכונה היא סקאלה: אפשר להיות <b>גבוה</b> או <b>נמוך</b> בה. באנגלית: OCEAN."},{"t":"table","head":["תכונה","מה זה אומר","איך זה נראה בסיפור (גבוה / נמוך)","דוגמה"],"rows":[["<b>פתיחות להתנסות</b>","סקרנות, דמיון, אהבה לרעיונות ולחוויות חדשות","גבוה: \"סקרן\", \"אוהב לנסות דברים חדשים\", \"מלא רעיונות\", \"אוהב אמנות וטיולים\". נמוך: \"מעדיף שגרה\", \"מתנגד לשינויים\", \"עושה הכול כמו תמיד\"","טל תמיד הראשונה לנסות תוכנה חדשה ומציעה רעיונות מקוריים → פתיחות גבוהה."],["<b>מצפוניות</b>","אחריות, סדר, התמדה, מסירות, מיקוד ביעדים, מהימנות","גבוה: \"אחראי\", \"מאורגן\", \"מסור\", \"עומד בזמנים\", \"ממוקד ביעדים\", \"מהימן\". נמוך: \"מפספס דדליינים\", \"מבולגן\", \"לא אמין\"","ליאור עובד שעות רבות ומתמקד ביעדים של תוכנית העבודה → מצפוניות גבוהה."],["<b>מוחצנות</b>","חברותיות, דיבור, אנרגיה, אוהב להיות בין אנשים","גבוה: \"חברותי\", \"מדבר הרבה\", \"נשמת המסיבה\", \"אנרגטי\". נמוך: \"מופנם\", \"שקט\", \"לא מרבה לתקשר עם הקולגות\", \"מעדיף לעבוד לבד\"","דנה מארגנת את כל אירועי הצוות ומדברת עם כולם → מוחצנות גבוהה."],["<b>נעימות / נועם</b>","נחמדות כלפי אחרים: נימוס, התחשבות, שיתוף פעולה, אמון","גבוה: \"מנומס\", \"מתחשב\", \"משתף פעולה\", \"עוזר לכולם\". נמוך: \"מתווכח\", \"ביקורתי\", \"תחרותי\", \"קר\"","אפרת מתחשבת בחבריה ונעימה לכולם → נעימות גבוהה."],["<b>יציבות רגשית</b>","רוגע וביטחון עצמי (ההפך מ<b>נוירוטיות</b>)","גבוה: \"רגוע תחת לחץ\", \"לא נלחץ\", \"שומר על קור רוח במשבר\". נמוך: \"חרד\", \"דואג כל הזמן\", \"מתוח\", \"מצבי רוח משתנים\"","בזמן תקלה גדולה רועי נשאר רגוע ומחלק משימות → יציבות רגשית גבוהה."]]},{"t":"trap","x":"\"<b>מקצוענות</b>\" אינה תכונה במודל חמשת הגדולים! היא הופיעה כמסיח במבחן לדוגמה. גם \"אחריות\" או \"מסירות\" לא שמות של תכונה – הן <b>סימנים</b> של <b>מצפוניות</b>."},{"t":"trap","x":"\"מופנם ושקט\" = <b>מוחצנות נמוכה</b>, ולא \"נועם נמוך\". מופנם יכול להיות אדם נעים מאוד. נועם נמוך = מתווכח, לא מתחשב."},{"t":"trap","x":"\"עצבני\" ו\"לחוץ\" שייכים ל<b>יציבות רגשית נמוכה</b>. \"לא מנומס\" שייך ל<b>נעימות נמוכה</b>. אל תערבבו."},{"t":"example","title":"קריאת סיפור צעד אחר צעד","x":"\"ענבל אחראית, מגיעה תמיד בזמן ומסיימת כל משימה. עם זאת, היא נלחצת מאוד לפני כל פגישה עם לקוח.\" → \"אחראית, בזמן, מסיימת משימות\" = <b>מצפוניות גבוהה</b>. \"נלחצת מאוד\" = <b>יציבות רגשית נמוכה</b>."},{"t":"h","x":"MBTI – ארבעה זוגות של העדפות"},{"t":"p","x":"MBTI הוא שאלון שמסווג אנשים לפי <b>4 ממדים</b>. בכל ממד יש שני קצוות, וכל אדם נוטה לאחד מהם. יוצא קוד של 4 אותיות, למשל ENTJ."},{"t":"table","head":["ממד","מה הוא בודק","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>E – מוחצן / I – מופנם</b>","מאיפה האדם שואב אנרגיה","E: מקבל אנרגיה מאנשים, אוהב לדבר. I: נטען לבד, חושב לפני שמדבר","אחרי יום מלא פגישות שירה צריכה זמן לבד כדי להיטען → I."],["<b>S – חושי (Sensing) / N – אינטואיטיבי (Intuitive)</b>","איך האדם קולט מידע","S: עובדות, פרטים, מה שקורה עכשיו, מעשי. N: דמיון, יצירתיות, תמונה גדולה, אפשרויות לעתיד","עומר ניחן בדמיון מפותח ובחשיבה יצירתית → N."],["<b>T – חשיבה (Thinking) / F – רגש (Feeling)</b>","איך האדם מקבל החלטות","T: לפי היגיון, נתונים וקריטריונים אובייקטיביים. F: לפי ערכים ולפי איך ההחלטה תשפיע על אנשים","יואב בוחר ספק לפי טבלת מחיר ואיכות בלבד → T."],["<b>J – Judger (שופט) / P – Perceiver (קולט)</b>","איך האדם מתנהל ביום-יום","J: מאורגן, מתכנן מראש, נצמד למשימות וללוחות זמנים, אוהב לסגור דברים. P: גמיש, ספונטני, משאיר אפשרויות פתוחות, ברגע האחרון","עומר נוטה להיצמד למשימות וללוחות הזמנים → J."]]},{"t":"trap","x":"ב-MBTI האות של אינטואיטיבי היא <b>N</b>, כי I כבר תפוסה למופנם. אל תבלבלו בין Intuitive (דמיון, תמונה גדולה) לבין Introvert (מופנם)."},{"t":"trap","x":"Judger לא אומר \"שיפוטי כלפי אנשים\"! J = <b>מאורגן ומתכנן</b>. ו-Thinking לא אומר \"חכם\" – זה רק אומר שהוא מחליט לפי היגיון."},{"t":"trap","x":"מסיח נפוץ: לערבב שני ממדים לא קשורים. אם בסיפור יש \"דמיון\" ו\"נצמד ללוחות זמנים\" – התשובה היא Intuitive + Judger. Thinking לא הוזכר, ולכן כל תשובה עם Thinking שגויה."},{"t":"h","x":"בקרה עצמית (Self-monitoring) – סניידר"},{"t":"p","x":"בקרה עצמית בודקת <b>עד כמה האדם משנה את ההתנהגות שלו לפי הסיטואציה והקהל</b>."},{"t":"table","head":["רמה","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>בקרה עצמית גבוהה</b>","קורא את הסביבה ומתאים את ההתנהגות שלו לכל מצב ולכל קהל (\"זיקית\")","\"מתנהג אחרת מול כל לקוח\", \"מדבר בשפה של הקהל\", \"מתאים את עצמו לצרכים של כל אחד\"","איש מכירות שמדבר בשפה מקצועית מול מהנדסים ובשפה פשוטה מול לקוחות פרטיים."],["<b>בקרה עצמית נמוכה</b>","מתנהג אותו דבר בכל מצב, לפי מה שהוא מרגיש ומאמין (\"מה שרואים זה מה שיש\")","\"מתנהג אותו דבר מול כולם\", \"לא משנה את הסגנון שלו\", \"מצופה להתאים את עצמו אבל בפועל לא עושה את זה\"","עורכת דין שמצופה להתאים את עצמה לכל לקוח, אבל מתנהגת אותו דבר מול כולם."]]},{"t":"trap","x":"במבחן לדוגמה: \"מצופה שתתנהל מול כל לקוח באופן שונה... אבל בפועל היא לא מתנהלת כך\" → <b>בקרה עצמית נמוכה</b>. מה שקובע הוא מה שהיא <b>עושה בפועל</b>, לא מה שמצופה ממנה."},{"t":"h","x":"צורך בהישג – מקללנד (McClelland)"},{"t":"p","x":"<b>צורך בהישג</b> הוא המוטיבציה להצטיין, להגיע ליעדים מאתגרים ולעשות דברים טוב יותר מבעבר."},{"t":"list","x":["מציב לעצמו <b>יעדים מאתגרים</b> (קשים אבל אפשריים).","רוצה <b>משוב</b> כדי לדעת איך הוא מתקדם.","לוקח <b>אחריות אישית</b> על התוצאה.","בסיפור: \"רוצה להיות הטוב ביותר\", \"שובר שיאים\", \"מציבה לעצמה יעדים גבוהים\", \"שואל כל חודש איך הוא עומד ביעדים\"."]},{"t":"trap","x":"צורך בהישג ≠ עוגן <b>אתגר טהור</b> של שיין. אם השאלה אומרת \"מודל עוגני הקריירה של שיין\" → אתגר טהור. אם היא שואלת על תכונת אישיות/מוטיבציה, ובתשובות מופיעים \"בקרה עצמית\" ו\"צורך בהישג\" → צורך בהישג."},{"t":"trap","x":"צורך בהישג ≠ בקרה עצמית. הישג = <b>כמה הוא רוצה להצליח</b>. בקרה עצמית = <b>כמה הוא מתאים את ההתנהגות לקהל</b>. במבחן הן מופיעות יחד כזוג מסיחים."},{"t":"exam","x":"השאלות בנויות כך: תיאור של עובד (מה הממונה אומר עליו, מה עלה בשאלון) + \"לפי מודל ___ הוא מאופיין כ-\". הרבה פעמים צריך <b>שתי</b> תכונות (למשל \"מצפוניות גבוהה ומוחצנות נמוכה\"). בדקו שכל אחת משתי התכונות מופיעה בסיפור ושהכיוון (גבוה/נמוך) נכון."},{"t":"exam","x":"טיפ: סמנו בסיפור כל תואר (\"מסור\", \"שקט\", \"מנומס\") ותרגמו אותו לתכונה לפני שאתם קוראים את התשובות."}],"cheat":["Big Five = פתיחות להתנסות, מצפוניות, מוחצנות, נעימות/נועם, יציבות רגשית","מצפוניות = אחראי, מאורגן, מסור, ממוקד יעדים, מהימן","מוחצנות נמוכה = מופנם ושקט (לא נועם נמוך!)","נעימות = מנומס, מתחשב, משתף פעולה; נמוך = מתווכח, ביקורתי","יציבות רגשית נמוכה = חרד, לחוץ, מצבי רוח (נוירוטיות)","פתיחות = סקרן, יצירתי, אוהב חדש; נמוך = אוהב שגרה","\"מקצוענות\" – לא תכונה בביג פייב (מסיח)","MBTI · E/I = מאיפה אנרגיה; S/N = עובדות מול דמיון ותמונה גדולה","MBTI · T/F = היגיון מול ערכים ורגש; J/P = מתכנן ונצמד ללו\"ז מול גמיש וספונטני","Intuitive = N (לא I!)","בקרה עצמית גבוהה = משנה התנהגות לפי הקהל; נמוכה = אותו דבר מול כולם","מה שקובע בבקרה עצמית = מה שעושה בפועל, לא מה שמצופה","צורך בהישג (מקללנד) = יעדים מאתגרים, משוב, אחריות אישית"],"mcq":[{"id":"c2-1","q":"סתיו, מנהלת אירועים, היא נשמת המסיבה: מדברת עם כולם, אוהבת להיות במרכז ומלאת אנרגיה. עם זאת, לפני כל אירוע היא נלחצת מאוד, לא ישנה בלילה ודואגת שמשהו ישתבש. לפי מודל \"חמשת הגדולים\" סתיו מאופיינת כ-","o":["בעלת מוחצנות גבוהה ונעימות נמוכה","בעלת פתיחות להתנסות גבוהה ומצפוניות נמוכה","בעלת מוחצנות גבוהה ויציבות רגשית נמוכה","בעלת מוחצנות נמוכה ויציבות רגשית נמוכה"],"a":2,"why":"\"נשמת המסיבה, מדברת עם כולם, אנרגטית\" = מוחצנות גבוהה. \"נלחצת, לא ישנה, דואגת\" = יציבות רגשית נמוכה.","w":["המוחצנות נכונה, אבל אין בסיפור סימן לחוסר נימוס או חוסר התחשבות; הלחץ שייך ליציבות רגשית.","אין בסיפור סימנים לסקרנות או לחוסר אחריות.","","סתיו מאוד חברותית, ולכן המוחצנות שלה גבוהה ולא נמוכה."]},{"id":"c2-2","q":"יונתן, מעצב מוצר, סקרן מאוד, אוהב לנסות כל טכנולוגיה חדשה ומציע כל הזמן רעיונות מקוריים. מצד שני, הממונה שלו מתלוננת שהוא מפספס דדליינים, שולחן העבודה שלו מבולגן ואי אפשר לסמוך עליו שיסיים משימה בזמן. לפי מודל \"חמשת הגדולים\" יונתן מאופיין כ-","o":["בעל פתיחות להתנסות גבוהה ומצפוניות נמוכה","בעל פתיחות להתנסות גבוהה ומקצוענות נמוכה","בעל מוחצנות גבוהה ומצפוניות נמוכה","בעל נעימות נמוכה ויציבות רגשית נמוכה"],"a":0,"why":"\"סקרן, מנסה דברים חדשים, רעיונות מקוריים\" = פתיחות גבוהה. \"מפספס דדליינים, מבולגן, לא אמין\" = מצפוניות נמוכה.","w":["","\"מקצוענות\" אינה תכונה במודל חמשת הגדולים.","לא נאמר שיונתן חברותי או מדבר הרבה – הסקרנות שייכת לפתיחות, לא למוחצנות.","אין סימן לחוסר נימוס או ללחץ ולחרדה."]},{"id":"c2-3","q":"אלון, ראש צוות, ידוע כמי שמתווכח עם כולם, מבקר בחריפות את הקולגות ולא מוכן לשתף פעולה עם צוותים אחרים. עם זאת, כשהשרתים קרסו ביום שישי בלילה, הוא היחיד שנשאר רגוע לגמרי וטיפל בבעיה בקור רוח. לפי מודל \"חמשת הגדולים\" אלון מאופיין כ-","o":["בעל מוחצנות נמוכה ויציבות רגשית גבוהה","בעל נעימות נמוכה ויציבות רגשית גבוהה","בעל מצפוניות נמוכה ונעימות נמוכה","בעל נעימות גבוהה ויציבות רגשית נמוכה"],"a":1,"why":"\"מתווכח, מבקר, לא משתף פעולה\" = נעימות (נועם) נמוכה. \"רגוע לגמרי, קור רוח במשבר\" = יציבות רגשית גבוהה.","w":["אלון לא מתואר כשקט או מופנם; הבעיה שלו היא חוסר נועם.","","אין סימן לחוסר אחריות – הוא דווקא טיפל בתקלה.","הכיוונים הפוכים: הנועם שלו נמוך והיציבות גבוהה."]},{"id":"c2-4","q":"עדי, רכזת לוגיסטיקה, מגיעה תמיד בזמן, מתכננת כל שבוע מראש, עומדת בכל היעדים שהוגדרו לה והממונה אומרת שאפשר לסמוך עליה ב-100%. לפי מודל \"חמשת הגדולים\", התכונה הבולטת אצל עדי היא:","o":["מקצוענות גבוהה","נעימות גבוהה","פתיחות להתנסות גבוהה","מצפוניות גבוהה"],"a":3,"why":"דייקנות, תכנון, עמידה ביעדים ומהימנות הם הסימנים המובהקים של מצפוניות גבוהה.","w":["\"מקצוענות\" אינה תכונה במודל – זה מסיח מוכר.","נעימות = נימוס והתחשבות באחרים; הסיפור מדבר על אחריות ועמידה ביעדים.","אין בסיפור סקרנות או אהבה לחידושים.",""]},{"id":"c2-5","q":"בשאלון MBTI עלה שאורנה, מנהלת תקציבים, מתמקדת בעובדות ובפרטים המדויקים ופחות בחזון כללי. כשהיא מקבלת החלטות היא משתמשת בקריטריונים אובייקטיביים ובניתוח לוגי, ולא מתחשבת ברגשות של המעורבים. מכאן שטיפוסי האישיות שלה לפי MBTI הם:","o":["Intuitive ו-Thinking","Sensing ו-Thinking","Sensing ו-Feeling","Judger ו-Feeling"],"a":1,"why":"עובדות ופרטים = Sensing (חושי). החלטות לפי היגיון וקריטריונים אובייקטיביים = Thinking.","w":["Intuitive = דמיון ותמונה גדולה, ואורנה דווקא פחות מתמקדת בחזון.","","היא לא מחליטה לפי רגשות, ולכן לא Feeling.","לא נאמר שהיא מאורגנת או צמודה ללו\"ז, והיא בפירוש לא Feeling."]},{"id":"c2-6","q":"בשאלון MBTI עלה שאיתי מקבל אנרגיה מעבודה עם אנשים ונהנה לדבר עם הרבה קולגות. כשהוא צריך לבחור בין שתי חלופות, הוא שואל את עצמו קודם כל איך כל החלטה תשפיע על האנשים בצוות ועל האווירה. מכאן שטיפוסי האישיות שלו לפי MBTI הם:","o":["Extravert ו-Feeling","Extravert ו-Thinking","Introvert ו-Feeling","Perceiver ו-Thinking"],"a":0,"why":"שואב אנרגיה מאנשים = Extravert. מחליט לפי ההשפעה על אנשים ועל האווירה = Feeling.","w":["","Thinking = החלטה לפי היגיון אובייקטיבי; איתי מחליט לפי השפעה על אנשים.","איתי שואב אנרגיה מאנשים, ולכן הוא Extravert ולא Introvert.","לא תוארה גמישות או ספונטניות, וההחלטות שלו לא לפי Thinking."]},{"id":"c2-7","q":"מיה, קופירייטרית, לא אוהבת לתכנן מראש: היא משאירה אפשרויות פתוחות, משנה תוכניות ברגע האחרון ועובדת בצורה ספונטנית. היא חושבת בתמונה גדולה ומדמיינת כל הזמן אפשרויות חדשות לעתיד. לפי MBTI מיה היא:","o":["Judger ו-Intuitive","Perceiver ו-Sensing","Perceiver ו-Intuitive","Judger ו-Sensing"],"a":2,"why":"גמישה, ספונטנית, משאירה אפשרויות פתוחות = Perceiver. תמונה גדולה, דמיון ואפשרויות לעתיד = Intuitive.","w":["Judger = מאורגן ומתכנן, וזה ההפך ממיה.","Sensing = עובדות ופרטים בהווה; מיה חושבת בתמונה גדולה ובדמיון.","","שתי האותיות הפוכות."]},{"id":"c2-8","q":"ממד ה-S/N (חושי / אינטואיטיבי) בשאלון MBTI בודק:","o":["מאיפה האדם שואב את האנרגיה שלו","איך האדם קולט ומעבד מידע – עובדות ופרטים מול דמיון ותמונה גדולה","איך האדם מקבל החלטות – היגיון מול רגש","עד כמה האדם מתאים את ההתנהגות שלו לקהל"],"a":1,"why":"S/N עוסק באופן קליטת המידע: Sensing מתמקד בעובדות ובפרטים, Intuitive בדמיון ובתמונה הגדולה.","w":["זה ממד E/I.","","זה ממד T/F.","זו בקרה עצמית, מושג שאינו חלק מ-MBTI."]},{"id":"c2-9","q":"קרן היא נציגת מכירות בחברת תוכנה. מול מנהלי IT היא מדברת בשפה טכנית ומקצועית, מול בעלי עסקים קטנים היא מדברת בפשטות ובחום, ומול מנכ\"לים היא קצרה ועניינית. הממונה שלה משבח אותה על כך שהיא \"קוראת את הלקוח\". לפי המושגים שנלמדו, לקרן יש:","o":["צורך בהישג ברמה גבוהה","בקרה עצמית ברמה נמוכה","מוחצנות ברמה נמוכה","בקרה עצמית ברמה גבוהה"],"a":3,"why":"קרן משנה את ההתנהגות שלה לפי הקהל והסיטואציה (\"קוראת את הלקוח\") – זו בקרה עצמית גבוהה.","w":["לא מתואר רצון להצטיין או יעדים מאתגרים; מתואר שינוי התנהגות לפי קהל.","בקרה נמוכה = אותה התנהגות מול כולם, וקרן עושה בדיוק את ההפך.","אין סימן לכך שקרן מופנמת.",""]},{"id":"c2-10","q":"ירון הוא מנהל מחלקה. בישיבות הנהלה, מול עובדים חדשים ומול לקוחות כועסים – הוא מתנהג בדיוק אותו דבר ואומר בדיוק מה שהוא חושב. אחרי סדנה, יועץ ההדרכה המליץ לו להתאים את הסגנון לכל קהל, אבל ירון ממשיך בדרכו. לפי המושגים שנלמדו, לירון יש ___ ברמה ___.","o":["בקרה עצמית, נמוכה","בקרה עצמית, גבוהה","צורך בהישג, נמוכה","צורך בהישג, גבוהה"],"a":0,"why":"ירון מתנהג אותו דבר בכל מצב ולא משנה את הסגנון לפי הקהל, גם כשממליצים לו – בקרה עצמית נמוכה.","w":["","בקרה עצמית גבוהה = התאמת התנהגות לקהל, וירון לא עושה זאת.","הסיפור לא עוסק במוטיבציה להצטיין, אלא בהתאמת ההתנהגות.","הסיפור לא עוסק במוטיבציה להצטיין, אלא בהתאמת ההתנהגות."]},{"id":"c2-11","q":"הדס, סוכנת נדל\"ן, מציבה לעצמה בכל רבעון יעד מכירות גבוה יותר מהרבעון הקודם. היא מבקשת מהמנהל שלה משוב כל חודש כדי לדעת איך היא מתקדמת, ולוקחת אחריות אישית על כל עסקה שלא נסגרה. התכונה הבולטת אצל הדס היא:","o":["בקרה עצמית גבוהה","נעימות גבוהה","צורך בהישג גבוה","מוחצנות גבוהה"],"a":2,"why":"יעדים מאתגרים שעולים כל פעם, בקשת משוב ואחריות אישית על התוצאה – אלה המאפיינים של צורך בהישג (מקללנד).","w":["לא מתואר שהיא משנה את ההתנהגות לפי הקהל.","לא מתוארים נימוס והתחשבות באחרים.","","לא מתוארת חברותיות; מתוארת שאיפה להצטיין."]},{"id":"c2-12","q":"שגיא הוא יועץ ארגוני. מול מנכ\"לים הוא מדבר בשפה עסקית, מול עובדי ייצור הוא מדבר בגובה העיניים ובשפה פשוטה, והוא מקפיד להתאים את עצמו לכל קבוצה. בנוסף, הוא מציב לעצמו יעד להיות היועץ המוביל בחברה, ומבקש משוב אחרי כל פרויקט כדי להשתפר. לפי המושגים שנלמדו, לשגיא יש ___ ו-___, בהתאמה:","o":["בקרה עצמית נמוכה, צורך בהישג גבוה","בקרה עצמית גבוהה, צורך בהישג גבוה","בקרה עצמית גבוהה, מוחצנות נמוכה","מצפוניות נמוכה, צורך בהישג גבוה"],"a":1,"why":"התאמת השפה וההתנהגות לכל קהל = בקרה עצמית גבוהה. יעד להיות המוביל ובקשת משוב = צורך בהישג גבוה.","w":["שגיא מתאים את עצמו לכל קבוצה, ולכן הבקרה העצמית שלו גבוהה ולא נמוכה.","","אין סימן למופנמות, והחלק השני (צורך בהישג) לא מופיע בתשובה.","אין סימן לחוסר אחריות או לבלגן."]},{"id":"c2-13","q":"שלמה, פקיד ותיק בעירייה, עושה את העבודה שלו באותה דרך כבר 18 שנה. כשהוצגה מערכת ממוחשבת חדשה הוא סירב לנסות אותה, ואמר: \"למה לשנות משהו שעובד? אני אוהב שהכול קבוע וידוע\". לפי מודל \"חמשת הגדולים\" שלמה מאופיין כבעל:","o":["מצפוניות נמוכה","יציבות רגשית נמוכה","מוחצנות נמוכה","פתיחות להתנסות נמוכה"],"a":3,"why":"העדפת שגרה, התנגדות לחידושים ו\"אני אוהב שהכול קבוע\" הם סימנים של פתיחות להתנסות נמוכה.","w":["לא נאמר שהוא לא אחראי או לא עומד בזמנים – הוא עושה את עבודתו באופן קבוע.","לא מתוארים חרדה או לחץ.","לא נאמר שהוא שקט או מופנם.",""]}]},{"id":"c3","title":"טיפוסי האישיות של הולנד (המשושה)","short":"הולנד – המשושה","blurb":"ששת טיפוסי האישיות של הולנד (RIASEC), המקצועות והפעלים שמסגירים כל טיפוס, המשושה (שכנים דומים, מנוגדים שונים) והמלכודות של המבחן.","mnemonic":"RIASEC מסביב למשושה: ריאלי-חקרני-אמנותי-חברתי-יזמי-קונבנציונלי. משפט לזכירה: \"<b>ר</b>ק <b>ח</b>כמים <b>א</b>והבים <b>ח</b>ברים <b>י</b>שרים <b>ק</b>בועים\" (ר-ח-א-ח-י-ק). ידיים, ראש, לב יוצר, לב עוזר, פה משכנע, טבלת אקסל.","blocks":[{"t":"h","x":"הרעיון של הולנד"},{"t":"p","x":"ג׳ון הולנד (Holland) טען שאפשר לחלק אנשים ל<b>6 טיפוסי אישיות</b>, וגם סביבות עבודה ל-6 אותם סוגים."},{"t":"p","x":"כשיש <b>התאמה</b> בין טיפוס האישיות של האדם לבין סביבת העבודה, האדם יהיה מרוצה יותר ויצליח יותר."},{"t":"p","x":"בקיצור באנגלית: <b>RIASEC</b> – לפי האות הראשונה של כל טיפוס באנגלית."},{"t":"h","x":"ששת הטיפוסים"},{"t":"table","head":["טיפוס","מה זה אומר","איך זה נראה בסיפור (פעלים ומילים)","מקצועות אופייניים"],"rows":[["<b>ריאלי</b> (Realistic)","אוהב עבודה מעשית עם <b>ידיים, כלים, מכונות</b>, הרבה פעמים בחוץ","מתקן, בונה, מרכיב, מפעיל מכונות, עובד בשטח, \"אוהב לעבוד עם הידיים\"","חשמלאי, מכונאי, נגר, חקלאי, טכנאי, נהג"],["<b>חקרני</b> (Investigative)","אוהב <b>לחקור, לנתח, להבין</b>, סקרן, אוהב ללמוד","חוקר, מנתח, בודק השערות, מעבדה, מדע, \"אוהבת ללמוד דברים חדשים\"","חוקרת במעבדה, מדען, ביולוג, מתמטיקאי, כימאי"],["<b>אמנותי</b> (Artistic)","אוהב <b>ליצור ולהתבטא</b>, מעדיף חופש ו<b>חוסר מבנה</b>","יוצר, מעצב, כותב, מלחין, משחק, \"לא סובל כללים קבועים\"","מעצבת גרפית, שחקן, מוזיקאי, סופרת, צלם"],["<b>חברתי</b> (Social)","אוהב <b>לעזור, ללמד, לטפל, לייעץ</b> לאנשים","מלמד, מטפל, מלווה, מייעץ, משקם, \"רואה בעבודה שליחות לעזור לאנשים\"","מורה, גננת, עובד סוציאלי, יועץ חינוכי, אחות, פסיכולוג"],["<b>יזמי</b> (Enterprising)","אוהב <b>להוביל, לשכנע, למכור, לנהל</b>; מחפש השפעה, כוח ורווח","מוכר, משכנע, מנהל, מוביל צוות, \"הגדיל את המכירות\", \"מנהל מכירות\"","מנהל מכירות, סוכן נדל\"ן, יזם, מנהל שיווק, פוליטיקאי"],["<b>קונבנציונלי</b> (Conventional)","אוהב <b>סדר, נתונים, נהלים, מסמכים</b> ועבודה מובנית","מארגן, מתייק, מקליד נתונים, עוקב אחרי נהלים, \"אוהב שהכול מסודר בטבלה\"","מנהלת חשבונות, פקיד בנק, מזכיר, אחראית שכר, ארכיונאי"]]},{"t":"example","title":"שלושה חברים (בסגנון המבחן)","x":"יועץ חינוכי בפנימייה שרואה בעבודה שליחות → <b>חברתי</b>. חוקרת עם תואר שני במדעי החיים שמחפשת תרופה → <b>חקרני</b>. מנהל מכירות שמגדיל את היקף המכירות → <b>יזמי</b>."},{"t":"h","x":"המשושה"},{"t":"p","x":"הולנד סידר את ששת הטיפוסים על <b>משושה</b>, בסדר קבוע: ריאלי → חקרני → אמנותי → חברתי → יזמי → קונבנציונלי → וחזרה לריאלי."},{"t":"list","x":["<b>שכנים</b> במשושה = טיפוסים <b>דומים</b> (למשל ריאלי וחקרני, חברתי ויזמי).","<b>מנוגדים</b> (מול זה בדיוק) = טיפוסים <b>שונים מאוד</b>.","הזוגות המנוגדים: <b>ריאלי ↔ חברתי</b>, <b>חקרני ↔ יזמי</b>, <b>אמנותי ↔ קונבנציונלי</b>."]},{"t":"table","head":["טיפוס","השכנים (דומים)","המנוגד (הכי שונה)"],"rows":[["ריאלי","חקרני, קונבנציונלי","חברתי"],["חקרני","ריאלי, אמנותי","יזמי"],["אמנותי","חקרני, חברתי","קונבנציונלי"],["חברתי","אמנותי, יזמי","ריאלי"],["יזמי","חברתי, קונבנציונלי","חקרני"],["קונבנציונלי","יזמי, ריאלי","אמנותי"]]},{"t":"p","x":"למה זה הגיוני? <b>אמנותי</b> אוהב חופש וחוסר מבנה, ו<b>קונבנציונלי</b> אוהב סדר ונהלים – ולכן הם בצדדים מנוגדים. <b>ריאלי</b> עובד עם חפצים ו<b>חברתי</b> עם אנשים – גם הם מנוגדים."},{"t":"p","x":"בדרך כלל לאדם יש <b>קוד של 3 אותיות</b> (למשל SEA): הטיפוס הכי חזק, אחריו השני והשלישי. ככל שהאותיות שכנות במשושה, הפרופיל עקבי יותר."},{"t":"h","x":"מלכודות של המבחן"},{"t":"trap","x":"\"<b>חינוכי</b>\" ו\"<b>תומך</b>\" <b>אינם</b> טיפוסים של הולנד! הם הופיעו כמסיחים במבחן לדוגמה. מורה, יועץ חינוכי, עובד סוציאלי, מטפלת → <b>חברתי</b>."},{"t":"trap","x":"\"<b>טכני</b>\", \"<b>מדעי</b>\", \"<b>ניהולי</b>\", \"<b>יצירתי</b>\" – גם הם לא שמות של טיפוסים. התשובה תמיד אחת משש: ריאלי, חקרני, אמנותי, חברתי, יזמי, קונבנציונלי."},{"t":"trap","x":"חוקרת שמחפשת תרופה לילדים חולים \"עוזרת לאנשים\" – אבל מה שהיא <b>עושה</b> כל יום זה מחקר → <b>חקרני</b>, לא חברתי. תסתכלו על <b>הפעולה</b> בעבודה, לא על המטרה הסופית."},{"t":"trap","x":"מנהל מכירות בחברה לדיור מוגן עובד עם אנשים – אבל הוא <b>מוכר ומשכנע</b> → <b>יזמי</b>, לא חברתי."},{"t":"trap","x":"<b>יזמי</b> של הולנד ≠ עוגן <b>יזמי</b> של שיין. אצל הולנד יזמי = כל מי שמשכנע, מוכר ומנהל (גם שכיר). אצל שיין יזמי = מי שרוצה <b>להקים משהו משלו</b>."},{"t":"trap","x":"<b>קונבנציונלי</b> מול <b>חקרני</b>: שניהם עובדים עם נתונים. קונבנציונלי <b>מסדר ומתעד</b> נתונים לפי נהלים (הנהלת חשבונות, שכר). חקרני <b>מנתח</b> נתונים כדי לגלות משהו חדש (מחקר)."},{"t":"trap","x":"<b>ריאלי</b> לא אומר \"מציאותי\" או \"פרקטי בחשיבה\". הוא אומר עבודה <b>פיזית ומעשית</b> עם ידיים, כלים ומכונות."},{"t":"exam","x":"הצורה הנפוצה: 2–3 אנשים בסיפור + \"טיפוסי האישיות שלהם בהתאמה הם:\". המסיחים מחליפים טיפוס אחד בשם מומצא (חינוכי, תומך) או בטיפוס שכן. בדקו כל אדם לחוד, לפי הסדר."},{"t":"exam","x":"שאלה משולבת: \"עוגן הקריירה שלו לפי שיין הוא ___ וטיפוס האישיות שלו לפי הולנד הוא ___ בהתאמה\". פתרו כל מודל לחוד, ואז חפשו את הזוג המדויק."}],"cheat":["הולנד = 6 טיפוסים, RIASEC, התאמה אדם-סביבה = שביעות רצון","ריאלי = ידיים, כלים, מכונות, חוץ (חשמלאי, מכונאי, חקלאי)","חקרני = מחקר, מדע, ניתוח, סקרנות (חוקרת, מדען)","אמנותי = יצירה, ביטוי, בלי מבנה (מעצבת, שחקן)","חברתי = לעזור, ללמד, לטפל, לייעץ (מורה, עו\"ס, יועץ חינוכי)","יזמי = להוביל, לשכנע, למכור, לנהל (מנהל מכירות)","קונבנציונלי = סדר, נתונים, נהלים, מסמכים (מנהלת חשבונות)","סדר המשושה: ר-ח-א-ח-י-ק (\"רק חכמים אוהבים חברים ישרים קבועים\")","שכנים = דומים; מנוגדים = שונים","מנוגדים: ריאלי↔חברתי, חקרני↔יזמי, אמנותי↔קונבנציונלי","\"חינוכי\", \"תומך\", \"טכני\" – לא טיפוסים (מסיחים)","מסתכלים על מה שהוא עושה ביום-יום, לא על המטרה הסופית"],"mcq":[{"id":"c3-1","q":"אסף, נועה ורוני הם חברים מהצבא. אסף הוא חשמלאי שמתקין לוחות חשמל באתרי בנייה. נועה היא מנהלת חשבונות שאוהבת שכל המסמכים מסודרים ותואמים לנהלים. רוני היא מעצבת גרפית שעובדת בלי שעות קבועות ושונאת כללים. ע\"פ מודל המשושה של הולנד, טיפוסי האישיות שלהם בהתאמה הם:","o":["ריאלי, קונבנציונלי, אמנותי","טכני, קונבנציונלי, אמנותי","ריאלי, חקרני, אמנותי","ריאלי, קונבנציונלי, יזמי"],"a":0,"why":"חשמלאי שעובד בידיים בשטח = ריאלי. מסמכים, סדר ונהלים = קונבנציונלי. עיצוב בלי כללים = אמנותי.","w":["","\"טכני\" אינו טיפוס במודל של הולנד.","נועה לא חוקרת – היא מסדרת מסמכים לפי נהלים, ולכן קונבנציונלית.","רוני יוצרת ולא משכנעת או מוכרת – היא אמנותית, לא יזמית."]},{"id":"c3-2","q":"ליאת היא עובדת סוציאלית שמלווה משפחות במצוקה. דורון הוא חוקר במעבדה לחקר הסרטן ומנתח תוצאות ניסויים. מאיה היא סוכנת נדל\"ן שמשכנעת קונים וסוגרת עסקאות. לפי הולנד, טיפוסי האישיות שלהם בהתאמה הם:","o":["תומך, חקרני, יזמי","חברתי, קונבנציונלי, יזמי","חברתי, חקרני, יזמי","חברתי, חקרני, חברתי"],"a":2,"why":"ליווי משפחות = חברתי. מחקר וניתוח ניסויים = חקרני. שכנוע וסגירת עסקאות = יזמי.","w":["\"תומך\" אינו טיפוס של הולנד.","דורון מנתח כדי לגלות משהו חדש – זה חקרני, לא קונבנציונלי.","","מאיה מוכרת ומשכנעת – זה יזמי, גם אם היא עובדת עם אנשים."]},{"id":"c3-3","q":"עידן אוהב לפרק ולהרכיב מנועים, עובד במוסך עם כלים כל היום ונהנה לראות את התוצאה של העבודה שלו בידיים. לפי מודל הולנד, טיפוס האישיות של עידן הוא:","o":["חקרני","טכני","קונבנציונלי","ריאלי"],"a":3,"why":"עבודה מעשית עם ידיים, כלים ומכונות היא הסימן המובהק של הטיפוס הריאלי.","w":["עידן לא חוקר ולא מנתח – הוא עובד עם הידיים.","\"טכני\" אינו שם של טיפוס במודל.","קונבנציונלי = נתונים, מסמכים ונהלים, לא מנועים.",""]},{"id":"c3-4","q":"לפי המשושה של הולנד, איזה טיפוס נמצא מול טיפוס ה\"חקרני\", כלומר הוא השונה ממנו ביותר?","o":["אמנותי","יזמי","ריאלי","חברתי"],"a":1,"why":"הזוגות המנוגדים במשושה הם ריאלי↔חברתי, חקרני↔יזמי, אמנותי↔קונבנציונלי. לכן המנוגד לחקרני הוא יזמי.","w":["אמנותי הוא שכן של חקרני, כלומר דומה לו.","","ריאלי הוא שכן של חקרני, כלומר דומה לו.","חברתי מנוגד לריאלי, לא לחקרני."]},{"id":"c3-5","q":"לפי המשושה של הולנד, איזה מהטיפוסים הבאים הוא שכן של הטיפוס ה\"אמנותי\", כלומר דומה לו?","o":["קונבנציונלי","יזמי","חקרני","ריאלי"],"a":2,"why":"השכנים של אמנותי במשושה הם חקרני וחברתי. מבין התשובות רק חקרני מופיע.","w":["קונבנציונלי הוא המנוגד לאמנותי – הכי שונה ממנו.","יזמי אינו שכן של אמנותי (הוא שכן של חברתי וקונבנציונלי).","","ריאלי אינו שכן של אמנותי (הוא שכן של חקרני וקונבנציונלי)."]},{"id":"c3-6","q":"שרית היא גננת כבר 15 שנה. היא אוהבת ללמד ילדים, לעזור להם להתפתח ולתמוך בהורים. לפי מודל הולנד, טיפוס האישיות של שרית הוא:","o":["חינוכי","חברתי","תומך","אמנותי"],"a":1,"why":"ללמד, לעזור ולתמוך באנשים – אלה הסימנים של הטיפוס החברתי. גננת ומורה הן מקצועות חברתיים מובהקים.","w":["\"חינוכי\" אינו טיפוס במודל של הולנד – זה מסיח מהמבחן לדוגמה.","","\"תומך\" אינו טיפוס במודל של הולנד.","לא מתוארת יצירה או ביטוי עצמי; מתוארים הוראה ועזרה."]},{"id":"c3-7","q":"אורית אחראית על השכר בחברה גדולה. היא אוהבת לעבוד עם טבלאות אקסל, להקפיד על נהלים מסודרים ולוודא שכל מסמך מתויק במקום. לפי הולנד, טיפוס האישיות של אורית הוא:","o":["קונבנציונלי","חקרני","ריאלי","יזמי"],"a":0,"why":"סדר, נתונים, נהלים ומסמכים = קונבנציונלי.","w":["","היא לא מנתחת כדי לגלות משהו חדש; היא מסדרת ומתעדת לפי נהלים.","אין עבודה עם ידיים, כלים או מכונות.","אין שכנוע, מכירה או הובלה."]},{"id":"c3-8","q":"רונן הוא יועץ חינוכי בתיכון (טיפוס חברתי). הוא שוקל שינוי קריירה, ורוצה לעבור לסביבת עבודה שתהיה הכי דומה לסביבה הנוכחית שלו. לפי המשושה של הולנד, איזה טיפוס סביבה יתאים לו מבין הבאים?","o":["ריאלי","חקרני","יזמי","קונבנציונלי"],"a":2,"why":"השכנים של חברתי במשושה הם אמנותי ויזמי. מבין התשובות, יזמי הוא השכן ולכן הדומה ביותר.","w":["ריאלי הוא המנוגד לחברתי – הכי שונה.","חקרני אינו שכן של חברתי (יש ביניהם את אמנותי).","","קונבנציונלי אינו שכן של חברתי (יש ביניהם את יזמי)."]},{"id":"c3-9","q":"קרן היא מנהלת מכירות בחברה שמוכרת ציוד רפואי לבתי אבות. היא מובילה צוות של 10 אנשים, משכנעת לקוחות גדולים לחתום על עסקאות, ונהנית מההשפעה ומהרווחים שהיא מביאה לחברה. לפי הולנד, טיפוס האישיות של קרן הוא:","o":["חברתי","יזמי","קונבנציונלי","ניהולי"],"a":1,"why":"להוביל, לשכנע, למכור, ולחפש השפעה ורווח – זה הטיפוס היזמי. העובדה שהלקוחות הם בתי אבות לא הופכת אותה לחברתית.","w":["היא לא מטפלת או עוזרת לאנשים – היא מוכרת ומשכנעת.","","אין בסיפור עבודה עם מסמכים ונהלים.","\"ניהולי\" אינו טיפוס של הולנד (זה עוגן של שיין)."]},{"id":"c3-10","q":"ד\"ר אלה עובדת בחברת תרופות. כל היום היא מתכננת ניסויים, מנתחת נתונים סטטיסטיים כדי לבדוק אם תרופה חדשה עובדת, וכותבת מאמרים מדעיים. המטרה של העבודה שלה היא לעזור לחולים. לפי הולנד, טיפוס האישיות שלה הוא:","o":["חברתי","קונבנציונלי","ריאלי","חקרני"],"a":3,"why":"תכנון ניסויים, ניתוח נתונים ומחקר מדעי = חקרני. מה שקובע הוא מה שהיא עושה בפועל, לא המטרה הסופית (לעזור לחולים).","w":["היא לא מטפלת בחולים בעצמה – היא חוקרת. המטרה לעזור לא הופכת אותה לחברתית.","היא מנתחת נתונים כדי לגלות משהו חדש, ולא מסדרת אותם לפי נהלים.","אין עבודה פיזית עם כלים ומכונות.",""]},{"id":"c3-11","q":"יואב הוא שחקן ומחזאי. הוא כותב הצגות, מופיע על הבמה, ומעדיף לעבוד בלי מבנה קבוע ובלי שעות מסודרות. כשניסה לעבוד במשרד עם נהלים נוקשים הוא לא החזיק מעמד. לפי הולנד, טיפוס האישיות שלו הוא ___, והטיפוס המנוגד לו במשושה הוא ___:","o":["אמנותי, קונבנציונלי","אמנותי, חברתי","יצירתי, קונבנציונלי","חברתי, ריאלי"],"a":0,"why":"כתיבה, הופעה וחוסר מבנה = אמנותי. המנוגד לאמנותי במשושה הוא קונבנציונלי (סדר ונהלים) – ולכן הוא לא החזיק מעמד במשרד.","w":["","חברתי הוא שכן של אמנותי, לא המנוגד לו.","\"יצירתי\" אינו שם של טיפוס במודל.","יואב יוצר ומופיע, לא עוזר או מטפל; ולכן אינו חברתי."]},{"id":"c3-12","q":"איתן הוא מכונאי רכב. לפני 5 שנים עזב את המוסך שבו עבד והקים מוסך משלו, כי חלם לבנות עסק שנושא את השם שלו. כיום הוא עדיין מתקן רכבים בעצמו כל יום. על פי מודל עוגני הקריירה של שיין ומודל הולנד, העוגן שלו והטיפוס שלו הם ___ ו-___, בהתאמה:","o":["אוטונומיה, יזמי","יזמי, ריאלי","טכני-פונקציונלי, קונבנציונלי","יזמי, יזמי"],"a":1,"why":"אצל שיין: החלום להקים עסק משלו שנושא את שמו = עוגן יזמי. אצל הולנד: מתקן רכבים בידיים כל יום = ריאלי.","w":["המניע של איתן הוא ליצור משהו משלו, לא רק עצמאות. וטיפוס הולנד שלו ריאלי, כי הוא עובד בידיים.","","המניע המרכזי הוא הקמת עסק משלו (יזמי), ותיקון רכבים אינו קונבנציונלי.","החלק של שיין נכון, אבל אצל הולנד הוא ריאלי – הוא מתקן רכבים, לא מוכר ומשכנע."]},{"id":"c3-13","q":"לפי התאוריה של הולנד, מתי אדם צפוי להיות מרוצה ומצליח יותר בעבודתו?","o":["כשהוא עובד בסביבה מהטיפוס המנוגד לו, כדי להשלים חסרים","כשהוא מחליף סביבת עבודה כל כמה שנים","כשיש התאמה בין טיפוס האישיות שלו לבין סוג סביבת העבודה","כשהוא נמצא בסביבה עם כמה שיותר טיפוסים שונים"],"a":2,"why":"הרעיון המרכזי של הולנד הוא התאמה בין האדם לסביבה: כשהטיפוס האישי תואם את הסביבה, יש יותר שביעות רצון והצלחה.","w":["ההפך: סביבה מנוגדת היא הכי פחות מתאימה.","זה לא קשור למודל של הולנד (זה מזכיר את המסלולים של דרייבר).","","המודל מדבר על התאמה, לא על גיוון."]}]},{"id":"c4","title":"עוגני הקריירה של שיין","short":"עוגני שיין","blurb":"שמונת עוגני הקריירה של אדגר שיין, \"המשפט המסגיר\" של כל עוגן, והזוגות שהכי קל לבלבל ביניהם במבחן.","mnemonic":"\"מה הדבר האחד שלא תוותר עליו?\" – זה העוגן. שמונה עוגנים: מומחה, מנהל, חופשי, בטוח, יזם, שליח, לוחם, משפחתי (טכני-פונקציונלי, ניהול, אוטונומיה, ביטחון, יזמי, שירות, אתגר, סגנון חיים).","blocks":[{"t":"h","x":"מה זה עוגן קריירה?"},{"t":"p","x":"אדגר שיין (Schein) טען שלכל אדם יש <b>עוגן קריירה</b>: הדבר שהכי חשוב לו בעבודה."},{"t":"p","x":"העוגן בנוי מ-3 דברים: מה אני <b>טוב</b> בו, מה <b>מניע</b> אותי, ומה ה<b>ערכים</b> שלי."},{"t":"p","x":"הסימן הכי חזק לעוגן: <b>על מה האדם לא מוכן לוותר</b> כשהוא חייב לבחור. כמו עוגן של ספינה – הוא \"מחזיק\" את האדם במקום."},{"t":"p","x":"לפי שיין יש <b>8 עוגנים</b>. לכל אדם יש עוגן מרכזי אחד."},{"t":"p","x":"העוגן מתגבש אחרי כמה שנים של ניסיון בעבודה, כשהאדם לומד מה הוא באמת אוהב ובמה הוא טוב. כשמתאימים את העבודה לעוגן, האדם מרוצה יותר."},{"t":"h","x":"שמונת העוגנים"},{"t":"table","head":["עוגן","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>טכני-פונקציונלי / התמחות מקצועית</b>","רוצה להיות <b>מומחה</b> ולהתפתח בתחום המקצועי שלו","\"מתעדכן כל הזמן\", \"קורסים והשתלמויות\", \"ויתר על ניהול כדי להמשיך להתמקצע\"","רופא אורתופד שוויתר על ניהול יחידה כדי להמשיך להתמחות בניתוחי ברך."],["<b>ניהול כללי / ניהולי</b>","רוצה <b>לנהל</b>: להוביל אנשים, לחבר בין תחומים ולהיות אחראי לתוצאה הכוללת","\"רוצה להגיע לתפקיד מנכ\"ל\", \"אחראי על כמה מחלקות\", \"רוצה שהתוצאות של הארגון יהיו עליו\"","מהנדסת שמבקשת לעבור לניהול כדי להיות אחראית על חטיבה שלמה."],["<b>אוטונומיה / עצמאות</b>","רוצה <b>חופש</b>: לעבוד בדרך שלו, בקצב שלו, בלי כללים ושעות של אחרים","\"לא סובל שאומרים לו מה לעשות\", \"פרילנסר\", \"קובע לבד מתי ואיך לעבוד\"","מתרגמת שעזבה משרה קבועה כדי לעבוד מהבית מתי שהיא רוצה."],["<b>ביטחון ויציבות (ביטחון תעסוקתי)</b>","רוצה <b>עבודה בטוחה ויציבה</b>: קביעות, פנסיה, משכורת קבועה, מעט הפתעות","\"קביעות\", \"פנסיה\", \"שירות המדינה\", \"העדיף משרה בטוחה על פני שכר גבוה יותר בסטארט-אפ\"","פקיד שבחר בעבודה בעירייה בגלל הקביעות."],["<b>יזמי (יצירתיות יזמית)</b>","רוצה <b>להקים משהו משלו</b>: חברה, מוצר, עסק – משהו שהוא יצר","\"הקים חברה משלו\", \"חלם על עסק שנושא את שמו\", \"כדי לממש את הרעיונות שלו\"","מעצבת שהקימה סטודיו משלה כדי לממש את הרעיונות שלה."],["<b>שירות ומחויבות למטרה</b>","רוצה <b>לעזור לאחרים ולהשפיע על העולם</b> לפי הערכים שלו","\"רואה בעבודה שליחות\", \"לסייע לאוכלוסיות מוחלשות\", \"לא יעבוד בחברה שפוגעת בסביבה\"","עובד סוציאלי שעבודתו קריטית לעזרה לאוכלוסיות מוחלשות."],["<b>אתגר טהור</b>","רוצה <b>לפתור בעיות קשות</b>, להתגבר על מכשולים \"בלתי אפשריים\" ו<b>לנצח</b>","\"לוקח רק את המקרים הכי קשים\", \"משתעמם כשקל\", \"אוהב לנצח מתחרים\"","יועצת שלוקחת רק חברות על סף קריסה, כי זה מה שמרגש אותה."],["<b>סגנון חיים</b>","רוצה <b>איזון בין העבודה לבית ולמשפחה</b>","\"רוצה להיות בבית בארבע\", \"סירב לקידום שדורש מעבר דירה\", \"גמישות בשביל הילדים\"","מנהלת שסירבה לקידום שדורש נסיעות לחו״ל, כדי להיות עם המשפחה."]]},{"t":"trap","x":"\"<b>תרומה לקהילה</b>\" אינו שם של עוגן! השם הנכון: <b>שירות ומחויבות למטרה</b>. זה הופיע כמסיח במבחן לדוגמה (יחד עם \"תומך\", שגם הוא לא קיים)."},{"t":"p","x":"שימו לב לשמות החלופיים שמופיעים במבחן: \"טכני-פונקציונאלי\" / \"טכנו-פונקציונלי\" / \"התמחות מקצועית\" – אותו עוגן. \"ניהול\" / \"ניהולי\" – אותו עוגן. \"ביטחון\" / \"ביטחון תעסוקתי\" / \"יציבות\" – אותו עוגן. \"אתגר\" = אתגר טהור."},{"t":"h","x":"המשפט המסגיר – משפט אחד לכל עוגן"},{"t":"list","x":["<b>טכני-פונקציונלי</b>: \"אני רוצה להיות הכי טוב במקצוע שלי – גם אם זה אומר לוותר על ניהול.\"","<b>ניהול</b>: \"אני רוצה לנהל אנשים ולהיות אחראי על התוצאה של כולם.\"","<b>אוטונומיה</b>: \"אל תגידו לי מתי ואיך לעבוד.\"","<b>ביטחון ויציבות</b>: \"העיקר שתהיה לי קביעות ופנסיה.\"","<b>יזמי</b>: \"אני רוצה להקים משהו שהוא שלי.\"","<b>שירות ומחויבות למטרה</b>: \"אני רוצה שהעבודה שלי תעזור לאחרים ותשנה את העולם.\"","<b>אתגר טהור</b>: \"תביאו לי את הבעיה שאף אחד לא הצליח לפתור.\"","<b>סגנון חיים</b>: \"העבודה צריכה להתאים למשפחה – לא להפך.\""]},{"t":"h","x":"הזוגות שהכי קל לבלבל"},{"t":"table","head":["זוג","איך מבדילים","משפט מבחן"],"rows":[["<b>טכני-פונקציונלי מול ניהול</b>","שניהם יכולים להיות עובדים מצטיינים. השאלה: מה הוא בוחר כשמציעים לו לנהל? מוותר על ניהול כדי להישאר בתחום → טכני-פונקציונלי. רוצה לנהל ולהיות אחראי על התמונה הכללית → ניהול.","\"הוצע לו לנהל יחידה אבל הוא העדיף לוותר כדי להמשיך להתמקצע\" → טכני-פונקציונלי."],["<b>יזמי מול אוטונומיה</b>","שניהם יכולים \"לעבוד לבד\". יזמי = רוצה <b>ליצור ולבנות</b> משהו חדש משלו (חברה, מוצר) ולגדול. אוטונומיה = רוצה <b>חופש</b> מכללים ומשעות; לא אכפת לו לבנות עסק.","\"הקימה חברה כדי לממש את הרעיונות שלה\" → יזמי. \"עבר לעבוד כפרילנסר כי לא סבל שעון נוכחות\" → אוטונומיה."],["<b>שירות מול אתגר</b>","שניהם יכולים לפתור בעיות קשות. שירות = <b>למה</b>: כדי לעזור לאחרים ולפי ערכים. אתגר = <b>הקושי עצמו</b> מרגש אותו, הרצון לנצח.","\"מטפל בחולים במדינות עניות כי הוא מאמין שכל אדם זכאי לטיפול\" → שירות. \"לוקח רק תיקים שאף אחד לא הצליח לנצח בהם\" → אתגר."],["<b>סגנון חיים מול ביטחון</b>","שניהם נשמעים \"שקטים\". ביטחון = <b>קביעות, פנסיה, יציבות</b> של המשרה. סגנון חיים = <b>איזון עם המשפחה והחיים</b> – שעות, גמישות, לא לעבור דירה.","\"בחר במשרה ממשלתית בגלל הקביעות והפנסיה\" → ביטחון. \"סירבה לקידום כי לא תוכל לאסוף את הילדים מהגן\" → סגנון חיים."]]},{"t":"trap","x":"<b>המניע המרכזי</b> קובע, לא תוצאה צדדית. במבחן לדוגמה עדי הקימה חברה משלה כדי לממש את הרעיונות שלה, ו\"<b>בכך</b> הפכה עצמאית יותר בניהול זמנה\" – העצמאות והגמישות הן תוצאה, והמניע הוא להקים משהו משלה → <b>יזמי</b> (לא אוטונומיה ולא סגנון חיים)."},{"t":"trap","x":"עובד מקצועי שלוקח קורסים \"כדי להישאר מעודכן\" ולעשות את העבודה באופן מיטבי → <b>טכני-פונקציונלי</b>, לא אתגר."},{"t":"trap","x":"<b>יזמי</b> של שיין ≠ <b>יזמי</b> של הולנד. אצל שיין = להקים משהו משלו. אצל הולנד = לשכנע, למכור, להוביל (גם שכיר). <b>אתגר טהור</b> של שיין ≠ <b>צורך בהישג</b> של מקללנד – תסתכלו באיזה מודל השאלה עוסקת."},{"t":"h","x":"שיטת פתרון בשלושה צעדים"},{"t":"list","x":["1. מצאו את <b>רגע הבחירה</b> או את המשפט שמסביר <b>למה</b> הוא עושה את מה שהוא עושה.","2. שאלו: מה המניע המרכזי – מומחיות? ניהול? חופש? ביטחון? להקים משהו? לעזור? קושי? משפחה?","3. בדקו שהשם בתשובה הוא השם המדויק של העוגן, ושאין עוגן מיותר או שם מומצא."]},{"t":"example","title":"איך פותרים שאלה","x":"\"אלון עובד רווחה, וחושב שעבודתו קריטית ביכולת לסייע לאוכלוסיות מוחלשות.\" 1) מה הדבר שהכי חשוב לו? לעזור לאחרים. 2) איזה עוגן? <b>שירות ומחויבות למטרה</b>. 3) בודקים שהשם מדויק – לא \"תרומה לקהילה\"."},{"t":"exam","x":"לרוב השאלה מתארת 2 אנשים ושואלת \"עוגני הקריירה שלהם בהתאמה הינם\". שימו לב גם לתשובות עם <b>שלושה</b> עוגנים לשני אנשים – הן שגויות כי יש עוגן מיותר. ויש שאלות משולבות: עוגן של שיין + טיפוס של הולנד."},{"t":"exam","x":"טיפ: חפשו בסיפור את <b>רגע הבחירה</b> – \"ויתר על\", \"העדיף\", \"סירב\", \"עזב כי\". שם מסתתר העוגן."}],"cheat":["עוגן = הדבר האחד שלא תוותר עליו כשאתה חייב לבחור","שיין · טכני-פונקציונלי = רוצה להיות הכי טוב במקצוע, מוותר על ניהול","שיין · ניהול כללי = רוצה לנהל אנשים ולהיות אחראי על התוצאה הכוללת","שיין · אוטונומיה = חופש מכללים, שעות וממונים (פרילנסר)","שיין · ביטחון ויציבות = קביעות, פנסיה, משרה בטוחה","שיין · יזמי = להקים משהו משלו (חברה, מוצר) ולממש רעיונות","שיין · שירות ומחויבות למטרה = לעזור, להשפיע על העולם, ערכים","שיין · אתגר טהור = בעיות \"בלתי אפשריות\", לנצח, משתעמם כשקל","שיין · סגנון חיים = איזון עבודה-משפחה, לא עובר דירה בשביל קידום","\"תרומה לקהילה\" – לא עוגן (מסיח); השם הוא שירות ומחויבות למטרה","יזמי = לבנות משהו; אוטונומיה = רק חופש","שירות = בשביל אחרים; אתגר = בשביל הקושי והניצחון","ביטחון = קביעות ופנסיה; סגנון חיים = זמן למשפחה","המניע המרכזי קובע, לא תוצאה צדדית (עדי הקימה חברה → יזמי)"],"mcq":[{"id":"c4-1","q":"ד\"ר רועי הוא מהנדס תוכנה בכיר, שנחשב למומחה העולמי בתחום אבטחת שבבים. החברה הציעה לו לנהל מחלקה של 40 עובדים, אבל הוא סירב: \"אני רוצה להמשיך לכתוב קוד ולהעמיק בתחום שלי, לא לשבת בישיבות\". לפי שיין, עוגן הקריירה של רועי הוא:","o":["ניהול","טכני-פונקציונלי / התמחות מקצועית","אתגר טהור","אוטונומיה"],"a":1,"why":"רועי מוותר על ניהול כדי להמשיך להעמיק ולהתמחות בתחום שלו – הסימן המובהק של עוגן טכני-פונקציונלי.","w":["רועי בדיוק סירב לתפקיד ניהולי.","","לא מתואר רצון לפתור בעיות \"בלתי אפשריות\" או לנצח, אלא להתמחות בתחום.","לא מתואר רצון לחופש משעות וכללים; הוא רוצה להישאר בתחום המקצועי."]},{"id":"c4-2","q":"מיכל, מהנדסת תעשייה וניהול, אומרת: \"המטרה שלי היא להגיע לתפקיד מנכ\"לית. אני רוצה לנהל כמה מחלקות, לחבר בין כולן ולהיות זו שאחראית על התוצאות של כל הארגון\". לפי שיין, עוגן הקריירה של מיכל הוא:","o":["יזמי","אתגר טהור","ניהול כללי","טכני-פונקציונלי"],"a":2,"why":"רצון לנהל אנשים, לחבר בין תחומים ולהיות אחראית על התוצאה הכוללת של הארגון = עוגן ניהול כללי.","w":["מיכל לא רוצה להקים משהו משלה – היא רוצה לנהל ארגון קיים.","לא מתואר רצון לפתור בעיות קשות או לנצח, אלא לנהל.","","היא לא רוצה להעמיק בתחום אחד, אלא לנהל כמה תחומים יחד."]},{"id":"c4-3","q":"שירה עבדה כמתרגמת בחברת הייטק. היא לא סבלה את שעון הנוכחות, את הנהלים ואת הממונה שקבע לה מה לעשות. היא עזבה ועכשיו היא מתרגמת פרילנסרית שעובדת מתי, איפה ואיך שהיא רוצה. אין לה שום רצון לפתוח משרד או לגייס עובדים. לפי שיין, עוגן הקריירה של שירה הוא:","o":["יזמי","סגנון חיים","ביטחון ויציבות","אוטונומיה / עצמאות"],"a":3,"why":"המניע הוא חופש מכללים, משעות ומממונה (\"מתי, איפה ואיך שהיא רוצה\"), בלי רצון לבנות עסק – עוגן אוטונומיה.","w":["יזמי = רצון להקים ולבנות משהו משלו; כתוב במפורש שאין לה רצון לפתוח משרד.","לא מוזכרים משפחה או איזון עם הבית; המניע הוא חופש מכללים.","היא דווקא עזבה משרה קבועה.",""]},{"id":"c4-4","q":"יובל הקים כבר שלושה סטארט-אפים. הוא אומר: \"מה שמניע אותי זה לקחת רעיון שלי ולהפוך אותו לחברה שאני בניתי. אני מוכן לקחת סיכונים כדי שזה יהיה שלי\". לפי שיין, עוגן הקריירה של יובל הוא:","o":["יזמי","אוטונומיה","אתגר טהור","ניהול כללי"],"a":0,"why":"הקמת חברות מרעיון שלו, ורצון שהדבר \"יהיה שלי\" – זה עוגן יזמי (יצירתיות יזמית).","w":["","המניע הוא לבנות משהו משלו, לא רק חופש מכללים.","לא מדובר בפתרון בעיות קשות לשמן או בניצחון, אלא ביצירה של משהו שלו.","הוא לא מדבר על ניהול אנשים בארגון קיים, אלא על הקמה של משהו חדש."]},{"id":"c4-5","q":"אבי, רואה חשבון, קיבל שתי הצעות: משרה בסטארט-אפ עם שכר גבוה ואופציות, ומשרה ברשות המסים עם קביעות, פנסיה תקציבית ומשכורת קבועה. הוא בחר ברשות המסים: \"אני רוצה לישון בשקט בלילה ולדעת שהמשרה שלי בטוחה\". לפי שיין, עוגן הקריירה של אבי הוא:","o":["סגנון חיים","ביטחון ויציבות","טכני-פונקציונלי","שירות ומחויבות למטרה"],"a":1,"why":"קביעות, פנסיה, משכורת קבועה ו\"שהמשרה שלי בטוחה\" – עוגן ביטחון ויציבות (ביטחון תעסוקתי).","w":["לא מוזכרים משפחה, שעות או איזון עם הבית; המניע הוא הבטחון של המשרה.","","לא מתואר רצון להתמחות ולהתפתח מקצועית.","לא מתואר רצון לעזור לאחרים או ערכים."]},{"id":"c4-6","q":"דנה, ביולוגית ימית, עובדת בעמותה להגנה על שוניות האלמוגים. היא קיבלה הצעה מחברת אנרגיה עם שכר כפול, אבל סירבה: \"החברה הזו מזהמת את הים. אני כאן כדי להציל את הסביבה\". לפי שיין, עוגן הקריירה של דנה הוא:","o":["תרומה לקהילה","אתגר טהור","שירות ומחויבות למטרה","חקרני"],"a":2,"why":"היא פועלת לפי ערכים ורוצה להשפיע על העולם (\"להציל את הסביבה\"), ומוותרת על כסף בשביל זה – עוגן שירות ומחויבות למטרה.","w":["\"תרומה לקהילה\" אינו שם של עוגן במודל של שיין – זה מסיח.","לא מתואר רצון בקושי עצמו או בניצחון; מתואר רצון לפעול לפי ערכים.","","\"חקרני\" הוא טיפוס של הולנד, לא עוגן של שיין."]},{"id":"c4-7","q":"נטע היא יועצת להבראת חברות. היא מסכימה לקחת רק חברות על סף קריסה, שיועצים אחרים ויתרו עליהן. \"כשהמשימה קלה אני משתעממת. מה שמדליק אותי זה להצליח במקום שכולם אמרו שאי אפשר\". לפי שיין, עוגן הקריירה של נטע הוא:","o":["שירות ומחויבות למטרה","ניהול כללי","יזמי","אתגר טהור"],"a":3,"why":"בעיות \"בלתי אפשריות\", שעמום כשקל, והרצון להצליח במקום שאחרים נכשלו – עוגן אתגר טהור.","w":["היא לא מדברת על ערכים או על עזרה לאחרים; מה שמרגש אותה הוא הקושי.","היא לא מבקשת לנהל ארגון; היא מחפשת משימות קשות.","היא לא מקימה משהו משלה.",""]},{"id":"c4-8","q":"אורנה היא מנהלת צוות בחברת ביטוח. הוצע לה קידום לסגנית מנהל אגף, אבל התפקיד דורש לעבור לעיר אחרת ולהישאר במשרד עד שעות הערב. היא סירבה: \"אני רוצה להיות עם הילדים אחר הצהריים, ובעלי צריך גם הוא זמן לקריירה שלו\". לפי שיין, עוגן הקריירה של אורנה הוא:","o":["סגנון חיים","ביטחון ויציבות","אוטונומיה","טכני-פונקציונלי"],"a":0,"why":"סירוב לקידום כדי לשמור על איזון בין העבודה למשפחה ולקריירה של בן הזוג – עוגן סגנון חיים.","w":["","לא מוזכרות קביעות או פנסיה; המניע הוא זמן עם המשפחה.","היא לא מבקשת חופש מכללים ומממונים, אלא זמן לילדים.","היא לא מוותרת על הקידום כדי להתמחות בתחום."]},{"id":"c4-9","q":"גיל ורותם עובדים במשרד ממשלתי. גיל אומר: \"עברתי לכאן מחברה פרטית בגלל הקביעות והפנסיה. חשוב לי לדעת שאף אחד לא יפטר אותי\". רותם אומרת: \"הסיבה שאני כאן היא שבארבע אני יוצאת הביתה, ויש לי זמן לילדים ולתחביבים\". על פי עוגני הקריירה של שיין, העוגנים שלהם בהתאמה הם:","o":["סגנון חיים, ביטחון ויציבות","ביטחון ויציבות, סגנון חיים","ביטחון ויציבות, אוטונומיה","אוטונומיה, סגנון חיים"],"a":1,"why":"גיל: קביעות, פנסיה, \"שאף אחד לא יפטר אותי\" = ביטחון ויציבות. רותם: זמן לילדים ולתחביבים = סגנון חיים.","w":["הזוג נכון, אבל בסדר הפוך.","","רותם לא מבקשת חופש מכללים – היא מבקשת זמן למשפחה, ולכן סגנון חיים.","גיל רוצה ביטחון בעבודה, לא חופש מכללים."]},{"id":"c4-10","q":"שני חברות: נוי פתחה מאפייה והיא חולמת להפוך אותה לרשת ארצית שנושאת את המותג שלה. הילה היא יועצת ארגונית שעובדת לבד, בקצב שלה ובשעות שהיא בוחרת. היא דוחה הצעות להצטרף לחברות ייעוץ כי לא רוצה ממונה מעליה, ואין לה עניין להגדיל את העסק. לפי שיין, העוגנים שלהן בהתאמה הם:","o":["אוטונומיה, יזמי","יזמי, יזמי","יזמי, אוטונומיה","אתגר טהור, אוטונומיה"],"a":2,"why":"נוי רוצה לבנות ולהגדיל משהו משלה (מותג, רשת) = יזמי. הילה רוצה חופש מממונה ומשעות, בלי רצון להגדיל = אוטונומיה.","w":["הזוג נכון אבל בסדר הפוך.","הילה לא רוצה לבנות או להגדיל עסק – רק חופש. זו אוטונומיה.","","נוי לא מחפשת קושי וניצחון אלא לבנות מותג משלה."]},{"id":"c4-11","q":"ד\"ר אסף מתנדב כבר שנים במרפאות בכפרים עניים באפריקה, \"כי כל אדם זכאי לטיפול רפואי\". אחיו עומר הוא האקר שמשתתף בתחרויות פריצה בינלאומיות, ובוחר תמיד את המשימות הכי קשות \"כי הכי כיף לנצח במקום שאף אחד לא הצליח\". לפי שיין, העוגנים שלהם בהתאמה הם:","o":["שירות ומחויבות למטרה, אתגר טהור","אתגר טהור, שירות ומחויבות למטרה","שירות ומחויבות למטרה, טכני-פונקציונלי","תרומה לקהילה, אתגר טהור"],"a":0,"why":"אסף פועל לפי ערך (\"כל אדם זכאי לטיפול\") ורוצה לעזור = שירות ומחויבות למטרה. עומר נמשך לקושי ולניצחון = אתגר טהור.","w":["","הזוג נכון אבל בסדר הפוך – הערך והעזרה הם של אסף.","עומר לא מדבר על התמחות בתחום אלא על משימות קשות וניצחון.","\"תרומה לקהילה\" אינו שם של עוגן."]},{"id":"c4-12","q":"לפי שיין, איזה מהמשפטים הבאים מתאר בצורה הטובה ביותר מהו \"עוגן קריירה\"?","o":["התפקיד הראשון שאדם מקבל אחרי הלימודים","הדבר שהכי חשוב לאדם בקריירה, שהוא לא יוותר עליו כשיצטרך לבחור","סוג הארגון שבו האדם עובד הכי הרבה שנים","מסלול הקידום שהארגון קובע לעובד"],"a":1,"why":"עוגן הקריירה הוא שילוב של כישורים, מניעים וערכים, והוא הדבר שהאדם לא יוותר עליו כשהוא נאלץ לבחור.","w":["העוגן לא קשור לתפקיד הראשון.","","העוגן הוא מה שחשוב לאדם, לא סוג הארגון.","העוגן הוא של האדם, לא משהו שהארגון קובע."]},{"id":"c4-13","q":"נגה היא מנהלת חשבונות שאוהבת לעבוד עם טבלאות, מסמכים ונהלים מסודרים. היא קיבלה הצעה ממשרד פרטי עם שכר גבוה יותר, אבל העדיפה להישאר במשרד ממשלתי בגלל הקביעות והפנסיה. לפי מודל הולנד ועוגני הקריירה של שיין, הטיפוס והעוגן שלה הם ___ ו-___, בהתאמה:","o":["חקרני, ביטחון ויציבות","קונבנציונלי, סגנון חיים","קונבנציונלי, טכני-פונקציונלי","קונבנציונלי, ביטחון ויציבות"],"a":3,"why":"אצל הולנד: טבלאות, מסמכים ונהלים = קונבנציונלי. אצל שיין: קביעות ופנסיה = ביטחון ויציבות.","w":["נגה לא חוקרת – היא מסדרת נתונים לפי נהלים, ולכן קונבנציונלית.","לא מוזכרים משפחה או איזון; המניע הוא קביעות ופנסיה.","היא לא בחרה כדי להתמחות בתחום, אלא בגלל הקביעות.",""]},{"id":"c4-14","q":"טל הוא פיזיותרפיסט. לפני שנה עזב את בית החולים ופתח קליניקה קטנה בבית. \"עשיתי את זה רק כדי שאוכל לאסוף את הבנות מבית הספר ולהיות איתן אחר הצהריים. אין לי שום רצון להגדיל את הקליניקה או להעסיק עובדים\". לפי שיין, עוגן הקריירה של טל הוא:","o":["יזמי","אתגר טהור","סגנון חיים","ניהול כללי"],"a":2,"why":"למרות שטל פתח קליניקה, המניע המרכזי הוא זמן עם הבנות ואיזון עם המשפחה – עוגן סגנון חיים. אין לו רצון לבנות ולהגדיל עסק.","w":["פתיחת הקליניקה היא רק אמצעי; כתוב במפורש שאין לו רצון להגדיל אותה, והמניע הוא המשפחה.","לא מתוארים קושי או רצון לנצח.","","הוא לא רוצה לנהל אנשים – הוא לא רוצה אפילו להעסיק עובדים."]}]},{"id":"c5","title":"מסלולי קריירה: דרייבר ומסורתית מול מודרנית","short":"מסלולי קריירה","blurb":"ארבעת דפוסי הקריירה של דרייבר (ליניארית, יציבה, ספיראלית, משתנה) וההבדל בין קריירה מסורתית לקריירה מודרנית/פרוטיאנית.","mnemonic":"ליניארית עולה בסולם, יציבה נשארת במקום, ספיראלית מסתובבת ליד (כל 5–10 שנים), משתנה קופצת לכל מקום (כל 2–4 שנים). ובמסורתית – הארגון מנהל אותי; בפרוטיאנית – אני מנהל את עצמי.","blocks":[{"t":"h","x":"מה זה מודל דרייבר?"},{"t":"p","x":"דרייבר (Driver) שואל שתי שאלות פשוטות על הקריירה של אדם: <b>לאן הוא זז?</b> (למעלה בסולם, נשאר באותו תחום, או עובר לתחום אחר) ו<b>כל כמה זמן הוא משנה כיוון?</b>"},{"t":"p","x":"מהתשובות יוצאים <b>ארבעה דפוסי קריירה</b>: ליניארית, יציבה, ספיראלית ומשתנה. במבחן מקבלים סיפור קצר על מסלול של אדם, וצריך לבחור איזה דפוס זה."},{"t":"table","head":["קטגוריה","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>ליניארית</b>","טיפוס במדרג ההיררכי. כל צעד הוא קידום לתפקיד בכיר יותר.","עובד → ראש צוות → מנהל מחלקה → סמנכ״ל. מילים: קודם, מונה, דרגה, בכיר יותר.","מוכר שהפך לראש צוות, אחר כך למנהל אזור ולבסוף למנהל מכירות ארצי."],["<b>יציבה</b>","נשאר כל החיים באותו מקצוע ומעמיק בו. המטרה: להיות מומחה, לא לטפס.","עשרות שנים באותו תחום, משתלם, נחשב מומחה, לפעמים אפילו מוותר על תפקיד ניהולי.","נגר שעובד 30 שנה כנגר, לומד טכניקות חדשות ומסרב להיות מנהל עבודה."],["<b>ספיראלית</b>","כל <b>5–10 שנים</b> מעבר לתחום <b>קרוב</b>, שנשען על הניסיון הקודם.","תקופות ארוכות בכל תחנה. כל תחום חדש קשור לקודם ומשתמש בידע שנצבר.","אחות 8 שנים → מדריכה בבית ספר לסיעוד → מקימה חברה לסימולציות רפואיות."],["<b>משתנה</b>","כל <b>2–4 שנים</b> מעבר לתחום <b>שונה ולא קשור</b>.","תקופות קצרות. תחומים שאין ביניהם קשר. מילים: מיצוי, שעמום, משהו חדש לגמרי.","יועצת משפטית 2 שנים → מורה למתמטיקה 3 שנים → מדריכת יוגה."]]},{"t":"steps","title":"איך מזהים את הדפוס – 4 שאלות לפי הסדר","x":["האם האדם נשאר באותו תחום ובעיקר <b>קיבל קידומים</b> לתפקידים בכירים יותר? → <b>ליניארית</b>.","האם הוא נשאר באותו תחום, <b>מעמיק ומתמחה</b>, ובלי שאיפה לטפס? → <b>יציבה</b>.","האם הוא <b>החליף תחומים</b>? אם כן – בדוק: התחום החדש <b>קשור</b> לקודם ונשען עליו, ועבר זמן רב (5–10 שנים)? → <b>ספיראלית</b>.","התחומים <b>לא קשורים</b> זה לזה, והמעברים מהירים (2–4 שנים)? → <b>משתנה</b>."]},{"t":"h","x":"ספיראלית מול משתנה – ההבחנה הכי חשובה"},{"t":"p","x":"בשני הדפוסים האדם מחליף תחום. ההבדל הוא <b>בקשר בין התחומים</b> וב<b>קצב</b>."},{"t":"table","head":["שאלה","ספיראלית","משתנה"],"rows":[["האם התחום החדש קשור לקודם?","כן. הוא בנוי על הידע והניסיון הקודמים.","לא. התחלה חדשה, בלי קשר."],["כמה זמן בכל תחנה?","ארוך: 5–10 שנים.","קצר: 2–4 שנים."],["האם הניסיון הקודם עוזר?","מאוד. הוא הבסיס לצעד הבא.","כמעט לא."],["איך זה מרגיש?","צמיחה הדרגתית, \"כמו ספירלה\" – מתקדם ומתרחב סביב אותו ציר.","גיוון, ריגוש, \"מיציתי, עוברת למשהו אחר\"."]]},{"t":"example","title":"ספיראלית","x":"רונן היה קצין מודיעין 9 שנים. אחר כך עבד 7 שנים כאנליסט סייבר בחברת הייטק. היום הוא מנהל חברת ייעוץ משלו לאבטחת מידע. כל צעד נשען על הקודם, והתחנות ארוכות → <b>ספיראלית</b>."},{"t":"example","title":"משתנה","x":"נועה עבדה 3 שנים כמעצבת אופנה, 2 שנים כספרית, ועכשיו היא סוכנת נדל״ן. אין קשר בין התחומים, והתחנות קצרות → <b>משתנה</b>."},{"t":"trap","x":"<b>דרגות וקידום לא אומרים תמיד ליניארית.</b> אם האדם טיפס בצבא ואז עבר לתחום קרוב (למשל ניהול אבטחה) ואחר כך פתח חברה משלו – זו <b>ספיראלית</b> (כך גם במבחן לדוגמה, שאלה 3). שאלו: האם התחום התחלף?"},{"t":"trap","x":"<b>החלפת מקום עבודה לא אומרת משתנה.</b> אם מישהו עבר בין חברות אבל כל פעם קיבל תפקיד בכיר יותר באותו תחום – זו <b>ליניארית</b>. משתנה = החלפת <b>תחום</b>, לא החלפת מעסיק."},{"t":"trap","x":"<b>יציבה מול ליניארית:</b> אם הסיפור מדגיש <b>קידומים</b> בסולם – ליניארית. אם הוא מדגיש <b>התמקצעות</b> ועבודה באותו תפקיד מקצועי (ואולי ויתור על ניהול) – יציבה."},{"t":"p","x":"<b>בונוס – מה מניע כל דפוס</b> (עוזר לזכור): ליניארית – כוח והישג; יציבה – ביטחון ומומחיות; ספיראלית – צמיחה אישית ויצירתיות; משתנה – גיוון ועצמאות."},{"t":"h","x":"קריירה מסורתית מול קריירה מודרנית (פרוטיאנית)"},{"t":"p","x":"זה מודל אחר, שמשווה בין <b>הקריירה של פעם</b> לבין <b>הקריירה של היום</b>. השאלה המרכזית: <b>מי מנהל את הקריירה – הארגון או העובד?</b>"},{"t":"table","head":["נושא","קריירה מסורתית","קריירה מודרנית / פרוטיאנית"],"rows":[["מי מנהל את הקריירה?","הארגון.","העובד עצמו."],["כמה ארגונים?","בדרך כלל ארגון אחד לאורך שנים.","כמה ארגונים, פרויקטים ותחומים."],["איך מתקדמים?","טיפוס הדרגתי בסולם, לפי ותק.","תנועה לכל הכיוונים, לפי מה שמתאים לי."],["מה נחשב הצלחה?","קידום ושכר שעולה.","<b>הצלחה פסיכולוגית</b>: משמעות, סיפוק, התאמה לערכים."],["מה העסקה עם הארגון?","נאמנות תמורת ביטחון תעסוקתי.","אני מביא ערך ולומד כל הזמן; אין הבטחה לכל החיים."],["מה מוביל את ההחלטות?","מה שהארגון צריך.","הערכים והצרכים שלי."]]},{"t":"list","x":["<b>פרוטיאנית</b> – מונח של <b>הול (Hall)</b>. על שם האל פרוטאוס, שיכול לשנות צורה. העובד \"משנה צורה\" לפי הצרכים והערכים שלו.","<b>נטולת גבולות</b> – קריירה שחוצה גבולות של ארגונים ותחומים. גם היא בצד ה\"מודרני\".","במבחן, <b>מודרנית</b> ו<b>פרוטיאנית</b> נמצאות באותו צד – שתיהן ההפך ממסורתית."]},{"t":"example","title":"מסורתית","x":"רינה עובדת 30 שנה במפעל אחד. קודמה בהדרגה לפי ותק, השכר שלה עלה כל כמה שנים, ומחלקת משאבי אנוש החליטה לאילו קורסים לשלוח אותה. היא מחכה לפנסיה מהמפעל → <b>מסורתית</b>."},{"t":"example","title":"פרוטיאנית","x":"עמית עזב משרה בטוחה בבנק כי היא לא התאימה לערכים שלו. היום הוא עובד כפרילנסר עם כמה ארגונים, בוחר פרויקטים לפי המשמעות שלהם, ומשלם בעצמו על קורסים. הוא מודד הצלחה לפי סיפוק, לא לפי תואר תפקיד → <b>פרוטיאנית / מודרנית</b>."},{"t":"trap","x":"<b>שימו לב לשם המודל בשאלה.</b> \"לפי דרייבר\" → התשובה היא אחד מארבעת הדפוסים. \"קריירה מסורתית או מודרנית\" → התשובה היא מסורתית / מודרנית / פרוטיאנית. במבחן לדוגמה (שאלה 15) רופא שעובד 25 שנה באותו בית חולים, קודם בהדרגה והשכר שלו עלה = <b>קריירה מסורתית</b>, ו\"משתנה\" הופיעה רק כמסיח."},{"t":"exam","x":"איך שואלים: \"לפי מודל מסלולי הקריירה של דרייבר, סוג הקריירה של X הוא:\" (4 הדפוסים כאופציות), או \"תיאור מסלול הקריירה של X מתאים ל-\" (מודרנית / מסורתית / משתנה / פרוטיאנית)."},{"t":"steps","title":"טכניקה לקריאת הסיפור","x":["סמנו כמה שנים האדם היה בכל תחנה.","סמנו את התחום בכל תחנה.","שאלו: אותו תחום או תחום אחר? אם אחר – קשור או לא קשור?","רק אז בחרו. אל תיתנו למילה אחת (\"מנהל\", \"חברה אחרת\") להטעות אתכם."]}],"cheat":["ליניארית = סולם: קידום אחרי קידום.","יציבה = מומחה כל החיים באותו תחום, בלי לטפס.","ספיראלית = תחום קרוב שנשען על הקודם, כל 5–10 שנים.","משתנה = תחום לא קשור, כל 2–4 שנים.","דרגות בצבא ואז תחום קרוב ואז חברה משלו = ספיראלית.","החלפת מעסיק באו
