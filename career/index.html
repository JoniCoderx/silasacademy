ויועץ חינוכי הם חברתי."},{"s":"מהנדי","x":"מלכודת שנייה: מסתכלים על מה שהאדם עושה ביום יום, לא על המטרה. נגיד שחוקרת בשם אלה מחפשת תרופה לחולים. כל היום היא עושה מחקר, ולכן חקרני."},{"s":"מהנדי","x":"מלכודת שלישית: מנהלת מכירות שמוכרת ציוד לבתי אבות עובדת עם אנשים. אבל היא מוכרת ומשכנעת, ולכן היא יזמית, לא חברתית."},{"s":"חגית","x":"ומה ההבדל בין קונבנציונלי לחקרני? שניהם עובדים עם נתונים."},{"s":"מהנדי","x":"קונבנציונלי מסדר ומתעד נתונים לפי נהלים, כמו הנהלת חשבונות. חקרני מנתח נתונים כדי לגלות משהו חדש. וריאלי לא אומר מציאותי, אלא עבודה בידיים."},{"s":"חגית","x":"ושמעתי שיש בלבול גם עם שיין."},{"s":"מהנדי","x":"נכון. יזמי של הולנד זה מי שמשכנע, מוכר ומנהל, גם שכיר. יזמי של שיין זה מי שמקים משהו משלו. פותרים כל מודל לחוד."},{"s":"חגית","x":"אז בקיצור. ריאלי ידיים, חקרני מחקר, אמנותי יצירה, חברתי עזרה, יזמי שכנוע, קונבנציונלי סדר. שכנים דומים, מנוגדים שונים, וחינוכי לא קיים."},{"s":"מהנדי","x":"ושאלה קצרה. איזה טיפוס עומד מול חקרני במשושה, כלומר הכי שונה ממנו?"},{"s":"חגית","x":"יזמי."},{"s":"מהנדי","x":"נכון. חקרני רוצה להבין ולחקור, ויזמי רוצה להשפיע, לשכנע ולהרוויח. אלה כיוונים הפוכים, ולכן הם מנוגדים."}]},"c4":{"title":"פרק רביעי: עוגני הקריירה של שיין","lines":[{"s":"חגית","x":"בפרק הרביעי: שמונת עוגני הקריירה של אדגר שיין. למה זה חשוב למבחן?"},{"s":"מהנדי","x":"כי כמעט תמיד יש שאלה עם שני אנשים, ושואלים מה העוגן של כל אחד בהתאמה. והמסיחים שם מאוד דומים זה לזה."},{"s":"חגית","x":"אז מה זה בכלל עוגן?"},{"s":"מהנדי","x":"עוגן קריירה הוא הדבר שהכי חשוב לאדם בעבודה. הדבר שהוא לא מוותר עליו כשהוא חייב לבחור. כמו עוגן שמחזיק ספינה במקום."},{"s":"מהנדי","x":"העוגן בנוי משלושה דברים: במה אני טוב, מה מניע אותי, ומה הערכים שלי. ולכל אדם יש עוגן מרכזי אחד."},{"s":"חגית","x":"בוא נעבור על השמונה."},{"s":"מהנדי","x":"הראשון: טכני פונקציונלי, שנקרא גם התמחות מקצועית. נגיד שיש מהנדס בשם רועי, שסירב לנהל מחלקה כי הוא רוצה להמשיך לכתוב קוד ולהעמיק בתחום."},{"s":"מהנדי","x":"השני: ניהול כללי. נגיד שיש מהנדסת בשם מיכל, שרוצה לנהל כמה מחלקות, לחבר ביניהן, ולהיות אחראית על התוצאות של כל הארגון."},{"s":"מהנדי","x":"השלישי: אוטונומיה, או עצמאות. נגיד שיש מתרגמת בשם שירה, שלא סבלה שעון נוכחות וממונה. היא עברה לעבוד כפרילנסרית, מתי ואיך שהיא רוצה."},{"s":"מהנדי","x":"הרביעי: ביטחון ויציבות. נגיד שיש רואה חשבון בשם אבי, שבחר ברשות המסים ולא בסטארט אפ, בגלל הקביעות והפנסיה."},{"s":"מהנדי","x":"החמישי: יזמי. נגיד שיש יזם בשם יובל, שהקים כבר שלושה סטארט אפים, כי מה שמניע אותו זה להפוך רעיון שלו לחברה שהוא בנה."},{"s":"מהנדי","x":"השישי: שירות ומחויבות למטרה. נגיד שיש ביולוגית בשם דנה, שסירבה לשכר כפול בחברה שמזהמת את הים, כי היא כאן כדי להציל את הסביבה."},{"s":"מהנדי","x":"השביעי: אתגר טהור. נגיד שיש יועצת בשם נטע, שלוקחת רק חברות על סף קריסה. כשקל לה היא משתעממת, והיא רוצה לנצח במקום שכולם ויתרו."},{"s":"מהנדי","x":"והשמיני: סגנון חיים. נגיד שיש מנהלת צוות בשם אורנה, שסירבה לקידום שדורש מעבר לעיר אחרת, כי היא רוצה להיות עם הילדים אחר הצהריים."},{"s":"חגית","x":"יש מלכודת בשמות עצמם?"},{"s":"מהנדי","x":"כן. תרומה לקהילה אינו שם של עוגן. השם הנכון הוא שירות ומחויבות למטרה. גם תומך הופיע כמסיח, והוא לא קיים."},{"s":"חגית","x":"ואיזה זוגות הכי מבלבלים?"},{"s":"מהנדי","x":"זוג ראשון: טכני פונקציונלי מול ניהול. בודקים מה הוא בוחר כשמציעים לו לנהל. אם הוא מוותר על ניהול כדי להתמקצע, זה טכני פונקציונלי."},{"s":"מהנדי","x":"זוג שני: יזמי מול אוטונומיה. שניהם עובדים לבד. יזמי רוצה לבנות משהו משלו ולגדול. אוטונומיה רוצה רק חופש, בלי עניין להגדיל עסק."},{"s":"מהנדי","x":"זוג שלישי: שירות מול אתגר. שירות זה בשביל לעזור לאחרים, לפי ערכים. אתגר זה הקושי עצמו, והרצון לנצח."},{"s":"מהנדי","x":"זוג רביעי: ביטחון מול סגנון חיים. ביטחון זה קביעות ופנסיה. סגנון חיים זה זמן למשפחה, שעות נוחות וגמישות."},{"s":"חגית","x":"ומה עם מישהי שהקימה חברה, ובזכות זה נהייתה עצמאית יותר בזמן שלה?"},{"s":"מהנדי","x":"זו בדיוק מלכודת מהמבחן לדוגמה. המניע המרכזי קובע, לא תוצאה צדדית. היא הקימה חברה כדי לממש את הרעיונות שלה, ולכן העוגן הוא יזמי."},{"s":"מהנדי","x":"ועוד מלכודת. יזמי של שיין זה להקים משהו משלך, ויזמי של הולנד זה לשכנע ולמכור. ואתגר טהור הוא לא צורך בהישג של מקללנד."},{"s":"חגית","x":"יש שיטה לפתור מהר?"},{"s":"מהנדי","x":"כן. חפשי את רגע הבחירה, מילים כמו ויתר, העדיף, סירב, או עזב כי. שם מסתתר העוגן. ובסוף בדקי שהשם בתשובה מדויק, ושאין עוגן מיותר."},{"s":"חגית","x":"אז בקיצור. עוגן זה מה שלא מוותרים עליו. מומחה, מנהל, חופשי, בטוח, יזם, שליח, לוחם ומשפחתי. ותרומה לקהילה לא קיימת."},{"s":"מהנדי","x":"ושאלה קצרה. גיל עבר למשרד ממשלתי בגלל הקביעות והפנסיה. רותם עובדת שם כי בארבע היא יוצאת הביתה לילדים. מה העוגנים שלהם?"},{"s":"חגית","x":"גיל הוא ביטחון ויציבות, ורותם היא סגנון חיים."},{"s":"מהנדי","x":"נכון. שניהם באותו משרד, אבל המניע שונה. אצל גיל זו יציבות המשרה, ואצל רותם זה הזמן למשפחה ולחיים."}]},"c5":{"title":"מסלולי קריירה לפי דרייבר, ומסורתית מול מודרנית","lines":[{"s":"חגית","x":"שלום לכולם, המבחן כבר מחר. היום אנחנו מדברים על מסלולי קריירה. למה זה חשוב למבחן?"},{"s":"מהנדי","x":"כי במבחן נותנים סיפור קצר על מסלול של אדם, ושואלים איזה דפוס זה. אלה נקודות קלות, אם יודעים להבחין."},{"s":"מהנדי","x":"יש פה שני מודלים. הראשון של דרייבר, עם ארבעה דפוסים. השני משווה בין קריירה מסורתית לקריירה מודרנית, שנקראת גם פרוטיאנית."},{"s":"חגית","x":"נתחיל מדרייבר. מה הוא בעצם שואל?"},{"s":"מהנדי","x":"שתי שאלות. לאן האדם זז, למעלה בסולם, עמוק באותו תחום, או לתחום אחר. וכל כמה זמן הוא משנה כיוון."},{"s":"חגית","x":"אוקיי, מה הדפוס הראשון?"},{"s":"מהנדי","x":"ליניארית. זה טיפוס בסולם ההיררכי. נגיד שיש עובדת בשם מיכל, שהתחילה כפקידה בבנק, הפכה לראש צוות, למנהלת מחלקה, ובסוף למנהלת הכספים של הבנק."},{"s":"מהנדי","x":"כל צעד הוא קידום לתפקיד בכיר יותר, באותו תחום. מילים כמו קודם, מונה, דרגה, הן רמז לליניארית."},{"s":"חגית","x":"והדפוס השני?"},{"s":"מהנדי","x":"יציבה. נגיד שיש נגר בשם יוסי, שעובד שלושים שנה כנגר. הוא לומד כל הזמן טכניקות חדשות, ומסרב להיות מנהל עבודה."},{"s":"מהנדי","x":"יוסי מעמיק באותו מקצוע ונהיה מומחה. המטרה שלו היא להתמקצע, לא לטפס."},{"s":"חגית","x":"ועכשיו השניים שתמיד מבלבלים אותי, ספיראלית ומשתנה."},{"s":"מהנדי","x":"בשניהם מחליפים תחום. בספיראלית, כל חמש עד עשר שנים עוברים לתחום קרוב, שנשען על הניסיון הקודם."},{"s":"מהנדי","x":"נגיד שיש אחות בשם תמר. שמונה שנים בחדר ניתוח, אחר כך מדריכה בבית ספר לסיעוד, ובסוף מקימה חברה לסימולציות רפואיות."},{"s":"מהנדי","x":"במשתנה, כל שנתיים עד ארבע שנים עוברים לתחום שונה לגמרי. נגיד גיא, שהיה בריסטה, אחר כך סוכן דירות, מדריך טיולים, ועכשיו מאמן כושר."},{"s":"חגית","x":"אז ההבדל הוא בקשר בין התחומים ובקצב."},{"s":"מהנדי","x":"בדיוק. ספיראלית מסתובבת ליד, תחום קרוב ותחנות ארוכות. משתנה קופצת לכל מקום, תחום לא קשור ותחנות קצרות."},{"s":"חגית","x":"איפה המלכודות?"},{"s":"מהנדי","x":"מלכודת ראשונה, דרגות בצבא. נגיד שארז הגיע לדרגה בכירה בחיל ההנדסה, אחר כך ניהל בטיחות בחברת בנייה, ובסוף פתח משרד לייעוץ הנדסי."},{"s":"מהנדי","x":"זו ספיראלית, לא ליניארית. הקידומים היו רק בצבא, ואחר כך הוא עבר לתחומים קרובים. תמיד תשאלו, האם התחום התחלף."},{"s":"מהנדי","x":"מלכודת שנייה, החלפת מעסיק. אם שי עבר בין שלוש חברות מזון, וכל פעם קיבל תפקיד מכירות בכיר יותר, זו ליניארית. משתנה זה החלפת תחום."},{"s":"מהנדי","x":"ויציבה מול ליניארית. אם הסיפור מדגיש קידומים, ליניארית. אם הוא מדגיש התמקצעות, ואולי ויתור על ניהול, יציבה."},{"s":"חגית","x":"עכשיו המודל השני, מסורתית מול מודרנית."},{"s":"מהנדי","x":"השאלה שם היא מי מנהל את הקריירה. במסורתית הארגון מנהל. ארגון אחד, טיפוס הדרגתי לפי ותק, שכר שעולה, ונאמנות תמורת ביטחון."},{"s":"מהנדי","x":"נגיד רינה, שעובדת שלושים שנה באותו מפעל. משאבי אנוש מחליטים לאן היא תתקדם, והיא אומרת, הייתי נאמנה למפעל והוא דאג לי. זו מסורתית."},{"s":"חגית","x":"ובמודרנית אני מנהלת את עצמי?"},{"s":"מהנדי","x":"כן. פרוטיאנית זה מונח של הול, על שם האל פרוטאוס שמשנה צורה. העובד מנהל לפי הערכים שלו, וההצלחה היא פסיכולוגית, סיפוק ומשמעות."},{"s":"מהנדי","x":"יש גם קריירה נטולת גבולות, שחוצה ארגונים ותחומים. גם היא בצד המודרני. ותבדקו את שם המודל בשאלה, כי משתנה מופיעה לפעמים רק כמסיח."},{"s":"מהנדי","x":"אז בקיצור. ליניארית עולה בסולם. יציבה נשארת ומעמיקה. ספיראלית עוברת לתחום קרוב כל חמש עד עשר שנים. משתנה קופצת לתחום לא קשור כל שנתיים עד ארבע."},{"s":"מהנדי","x":"ובמודל השני, במסורתית הארגון מנהל אותי, ובמודרנית או פרוטיאנית אני מנהל את עצמי. ועכשיו שאלה. דור היה מתכנת שלוש שנים, שף שנתיים, ועכשיו סוכן ביטוח. איזה דפוס?"},{"s":"חגית","x":"משתנה. התחומים לא קשורים זה לזה, והתחנות קצרות."},{"s":"מהנדי","x":"נכון. אין שום קשר בין תכנות, מטבח וביטוח, והוא מחליף כל שנתיים שלוש. אם התחומים היו נשענים זה על זה, זו הייתה ספיראלית."}]},"c6":{"title":"מודל ניהול הקריירה של גרינהאוס","lines":[{"s":"חגית","x":"בפרק הזה מודל גרינהאוס. שמונה שלבים, שבע אסטרטגיות וסוגי מטרות. למה זה כל כך חשוב?"},{"s":"מהנדי","x":"כי במבחן שואלים עליו הרבה. באיזה שלב האדם נמצא, מה השלב הבא, באיזו אסטרטגיה הוא משתמש, ואיזה סוג מטרה הוא הציב."},{"s":"מהנדי","x":"גרינהאוס מתאר איך אדם מנהל בעצמו את הקריירה שלו. זה מעגל של שמונה שלבים, ובסוף חוזרים להתחלה."},{"s":"מהנדי","x":"נגיד שיש בודקת תוכנה בשם מאיה. שלב אחד, חקר קריירה. היא ממלאת שאלונים ובודקת ערכים, תחומי עניין, חוזקות וחולשות. היא גם משוחחת עם אנשים על מקצועות."},{"s":"מהנדי","x":"שלב שתיים, מודעות לעצמי ולסביבה, רגע ההבנה. מאיה אומרת, הבנתי שאני נהנית להוביל אנשים. שלב שלוש, הצבת מטרות. בתוך שנתיים אהיה ראש צוות בדיקות."},{"s":"מהנדי","x":"שלב ארבע, פיתוח אסטרטגיית קריירה. היא מתכננת איך להגיע לשם, קורס בהובלת צוותים ופגישות עם מנטור."},{"s":"מהנדי","x":"שלב חמש, יישום האסטרטגיה. היא נרשמת לקורס ומתחילה להיפגש עם המנטור. שלב שש, התקדמות לעבר המטרה. היא מקבלת להוביל פרויקט קטן."},{"s":"מהנדי","x":"שלב שבע, משוב מהעבודה או מחוץ לעבודה. המנהלת אומרת לה שהיא מתקדמת יפה, אבל צריכה לשפר הצגה מול ההנהלה."},{"s":"מהנדי","x":"שלב שמונה, הערכת קריירה. מאיה עוצרת ובודקת אם המטרה והדרך עדיין מתאימות לה. ומשם חוזרים לחקר."},{"s":"חגית","x":"יש דרך לזכור את הסדר?"},{"s":"מהנדי","x":"כן. האות חית ואחריה שבע פעמים מם. חוקרים, מבינים, מציבים, מתכננים, מבצעים, מתקדמים, מקבלים משוב, מעריכים."},{"s":"חגית","x":"ואיפה נופלים במבחן?"},{"s":"מהנדי","x":"חקר מול מודעות. חקר זה פעולה, ממלאים שאלון ומדברים עם אנשים. מודעות זה התוצאה, הרגע שבו נופל האסימון."},{"s":"מהנדי","x":"שאלונים, ערכים, חוזקות וחולשות, זה תמיד חקר. ובשאלה מה השלב הבא, אל תסמנו את השלב שהאדם כבר נמצא בו. אם כתוב שהבינה, הבא הוא הצבת מטרות."},{"s":"מהנדי","x":"ועוד זוג. משוב זה מה שאחרים אומרים לי. הערכה זה מה שאני מסיק מזה על המטרה ועל הדרך."},{"s":"חגית","x":"עכשיו האסטרטגיות. שבע, נכון?"},{"s":"מהנדי","x":"נכון. אחת, שיפור ביצועים בעבודה הנוכחית. נגיד אפרת, סוכנת מכירות, משפרת את אחוז הסגירה, מפחיתה טעויות ועוקפת את היעדים."},{"s":"מהנדי","x":"שתיים, הרחבת מעורבות בעבודה. שעות נוספות, ערבים ושבתות, השקעה מעבר למה שכתוב בחוזה. שלוש, פיתוח מיומנויות וכישורים. קורס, תואר, הכשרה."},{"s":"מהנדי","x":"ארבע, פיתוח הזדמנויות. ליהי מספרת למנהלת שהיא רוצה לעבור לשיווק, בונה קשרים, ומתנדבת לפרויקט משותף עם השיווק כדי שיכירו אותה."},{"s":"מהנדי","x":"חמש, פיתוח מנטור ובריתות תומכות. נגיד נועם, שנפגש כל חודש עם מנהל ותיק שמלמד אותו ומעודד אותו."},{"s":"מהנדי","x":"שש, בניית תדמית של הצלחה. רון דואג שההנהלה תשמע על כל הצלחה שלו, ומתלבש ומדבר כמו מנהל."},{"s":"מהנדי","x":"שבע, פוליטיקה ארגונית. בונים בריתות עם בעלי השפעה ומתיישרים עם עמדות המנהל, כדי להשיג יתרון."},{"s":"חגית","x":"ומה המלכודות כאן?"},{"s":"מהנדי","x":"שעות נוספות זה הרחבת מעורבות, גם אם כתוב שהיא רוצה להראות שהיא מסורה. זה לא בניית תדמית. ונטוורקינג זה פיתוח הזדמנויות, לא פוליטיקה ארגונית."},{"s":"חגית","x":"ונשארו סוגי המטרות."},{"s":"מהנדי","x":"יש שני זוגות. מושגית, שנקראת גם קונספטואלית, היא רשימת תנאים, כמו שעות גמישות ומנהל שנותן אמון. אופרטיבית היא תפקיד מסוים, כמו מנהל מוצר."},{"s":"מהנדי","x":"הזוג השני. אינסטרומנטלית היא אמצעי, קרש קפיצה למטרה אחרת. אקספרסיבית, או ביטוי עצמי, מהנה ומספקת בפני עצמה. ויש גם טווח קצר וטווח ארוך."},{"s":"מהנדי","x":"שימו לב, מטרה יכולה להיות גם אקספרסיבית וגם אינסטרומנטלית. ומטרה ריאלית לא קיימת במודל, היא מסיח."},{"s":"מהנדי","x":"אז בקיצור. חוקרים, מבינים, מציבים, מתכננים, מבצעים, מתקדמים, מקבלים משוב, מעריכים, וחוזרים לחקר. שבע אסטרטגיות, ושני זוגות של מטרות."},{"s":"מהנדי","x":"שאלה. עידו קרא על מקצועות, דיבר עם אנשים, ואמר, עכשיו ברור לי שאני רוצה לעבוד בעיצוב חוויית משתמש. מה השלב הבא?"},{"s":"חגית","x":"הצבת מטרות. הוא כבר עשה חקר, וכבר הגיע למודעות."},{"s":"מהנדי","x":"נכון. המשפט עכשיו ברור לי מסמן שהמודעות הושלמה. לכן לא מודעות ולא אסטרטגיה, אלא השלב שבאמצע, הצבת מטרות."}]},"c7":{"title":"קבלת החלטות בקריירה לפי פיליפס ודינקלייג׳","lines":[{"s":"חגית","x":"בפרק הזה, איך אנשים מקבלים החלטות בקריירה. מה צריך לדעת למבחן?"},{"s":"מהנדי","x":"שני מודלים. פיליפס, עם שלושה סגנונות, ודינקלייג׳, עם שמונה. במבחן מתארים איך מישהו בחר עבודה, ושואלים מה הסגנון שלו."},{"s":"חגית","x":"נתחיל מפיליפס."},{"s":"מהנדי","x":"הכי קל לזכור ראש, בטן ואחרים. רציונלי, אינטואיטיבי ותלוי."},{"s":"מהנדי","x":"רציונלי. נגיד שיש מהנדסת בשם שירה עם שתי הצעות. היא בונה טבלה ונותנת ציון לפי שכר, קידום, זמן נסיעה ואופי הצוות."},{"s":"מהנדי","x":"אינטואיטיבי. נגיד עומר, שנכנס לראיון במשרד קטן, הרגיש מיד בבית ודמיין את עצמו שם. הוא בחר בלי שום השוואה."},{"s":"מהנדי","x":"תלוי. נגיד נטע, שלמדה ראיית חשבון כי הדוד שלה אמר שזה בטוח. והיא אומרת, אם זה לא יצליח, לפחות לא אני אשמה."},{"s":"חגית","x":"אז בתלוי מעבירים את האחריות לאחרים."},{"s":"מהנדי","x":"בדיוק. והשאלה היא מי החליט, לא כמה מסודר היה התהליך. גם מי שנרשם ללימודים מסודרים בגלל ההורים, הוא תלוי."},{"s":"מהנדי","x":"ומלכודת חשובה. אמוציונלי ורגשי לא קיימים אצל פיליפס. מי שהחליט לפי הלב והבטן, זה אינטואיטיבי."},{"s":"חגית","x":"עכשיו דינקלייג׳. שמונה זה הרבה."},{"s":"מהנדי","x":"הטריק הוא המשפט שהאדם אומר לעצמו. תכנוני אומר, אבדוק, אשקול ואחליט. נגיד ניר, שרשם אפשרויות, בדק כל אחת ובחר תוך שבוע."},{"s":"מהנדי","x":"מתייסר, או מתלבט, אומר, צריך עוד קצת מידע. נגיד שני, שקוראת כל ערב עוד ביקורות ועוד פורומים, ורק מתבלבלת יותר."},{"s":"מהנדי","x":"דוחה אומר, אחשוב על זה אחרי החגים. משותק אומר, אני יודע שאני חייב להחליט, אבל אני פשוט לא מסוגל."},{"s":"מהנדי","x":"אימפולסיבי אומר, העיקר להחליט מהר. נגיד אור, שלקח את ההצעה הראשונה בלי לבדוק, רק כדי שהלחץ ייגמר."},{"s":"מהנדי","x":"אינטואיטיבי אומר, זה מרגיש לי נכון, ואני לא יודע להסביר למה. פאטליסטי אומר, מה שיהיה יהיה, אם זה נועד לי זה יגיע."},{"s":"מהנדי","x":"וצייתני אומר, מה שאבא או המנהל יחליטו, בסדר מבחינתי. נגיד מירב, שאומרת למנהל, מה שתחליט מתאים לי."},{"s":"חגית","x":"אילו זוגות מתבלבלים?"},{"s":"מהנדי","x":"אימפולסיבי מול אינטואיטיבי. האימפולסיבי ממהר כדי להיפטר מהלחץ. האינטואיטיבי סומך על תחושה פנימית שזה נכון."},{"s":"מהנדי","x":"פאטליסטי מול צייתני. פאטליסטי משאיר את ההחלטה לגורל ולמזל. צייתני משאיר אותה לאנשים אחרים."},{"s":"מהנדי","x":"מתייסר מול משותק. המתייסר עסוק כל הזמן באיסוף מידע. המשותק קפוא ולא עושה כלום. ודוחה אומר אחר כך, ומשותק אומר אני לא מסוגל."},{"s":"מהנדי","x":"ומתייסר מול תכנוני. שניהם אוספים מידע, אבל רק התכנוני מגיע להחלטה."},{"s":"חגית","x":"ומה קורה כשההורים מחליטים?"},{"s":"מהנדי","x":"זו המלכודת הגדולה. אצל פיליפס זה תלוי, ואצל דינקלייג׳ זה צייתני. אותו רעיון בשני שמות. לכן תמיד תבדקו את שם המודל בשאלה."},{"s":"מהנדי","x":"ועוד דבר. אינטואיטיבי קיים בשני המודלים. רציונלי ותלוי קיימים רק אצל פיליפס. כל שאר השמות קיימים רק אצל דינקלייג׳."},{"s":"מהנדי","x":"אז בקיצור. פיליפס זה ראש, בטן ואחרים. דינקלייג׳ זה שמונה משפטים בראש. אשקול ואחליט, עוד מידע, מחר, קפאתי, העיקר מהר, מרגיש נכון, מה שיהיה יהיה, ושיחליטו בשבילי."},{"s":"מהנדי","x":"שאלה. לפי דינקלייג׳, קרן התקבלה לשני תפקידים ולא בחרה. היא אומרת, אם התפקיד נועד לי, הם יתקשרו שוב. מה הסגנון שלה?"},{"s":"חגית","x":"פאטליסטי. היא משאירה את ההחלטה לגורל."},{"s":"מהנדי","x":"נכון. היא לא מחכה שאדם אחר יחליט, ולכן זה לא צייתני. היא סומכת על הגורל, אם זה נועד לי, וזה פאטליסטי."}]},"c8":{"title":"רשתות קשרים ופוליטיקה ארגונית","lines":[{"s":"חגית","x":"בפרק האחרון, רשתות קשרים ופוליטיקה ארגונית. מה מחכה לנו במבחן?"},{"s":"מהנדי","x":"שני מודלים. שלוש הרשתות של ליינבק והיל, וארבע החיות של ג׳יימס ובדלי. במבחן מקבלים סיפור ובוחרים רשת או חיה."},{"s":"חגית","x":"קודם כל, מה זה נטוורקינג?"},{"s":"מהנדי","x":"זה לבנות ולשמור קשרים עם אנשים שיכולים לעזור לנו, ושאנחנו יכולים לעזור להם. ובמודל של גרינהאוס, נטוורקינג שייך לאסטרטגיה פיתוח הזדמנויות."},{"s":"חגית","x":"ומה הן שלוש הרשתות?"},{"s":"מהנדי","x":"כל רשת עונה על שאלה אחרת. בשביל מה אני צריך את הקשר הזה. הראשונה היא הרשת הטקטית."},{"s":"מהנדי","x":"טקטית זה קשרים בתוך הארגון, עם אנשים שאני תלוי בהם לעבודה השוטפת ולשיתופי פעו       <section class="panel"><div class="ulist">${UNITS.map((u, i) => { const e = episode(u); return `<button class="urow" data-go="listen" data-arg="${u.id}"><span class="un">🎧</span><span class="ut"><b>${i + 1}. ${esc(e.title)}</b><span class="note">${rec(u.id) ? 'פרק מוקלט' : e.talk ? 'שיחה' : 'הקראת השיעור'} · כ־${rec(u.id) ? Math.round(AUD[u.id].d / 60) : Math.max(2, Math.round(e.lines.reduce((a, l) => a + plain(l.x).split(' ').length, 0) / 140))} דק׳</span></span></button>`; }).join('')}</div></section>
      ${'speechSynthesis' in window || UNITS.every(u => rec(u.id)) ? '' : '<section class="panel"><p class="note">הדפדפן הזה לא תומך בהקראה. נסו בכרום, בספארי או באדג׳.</p></section>'}`;
    return;
  }
  drawTalk();
}
function drawTalk() {
  const m = $('#main'); if (view !== 'listen') return; const u = U[T.u], ep = episode(u), i = UNITS.indexOf(u);
  m.innerHTML = crumbs(['האזנה', 'listen'], [esc(ep.title)]) + `<header class="page"><span class="eyebrow">פרק ${i + 1} מתוך ${UNITS.length}</span><h2>${esc(ep.title)}</h2>
    ${!T.voices.length && !rec(u.id) ? '<p class="note">לא מצאנו בדפדפן קול בעברית, ננסה בכל זאת. אם לא שומעים: בטלפון אנדרואיד – כרום; באייפון – ספארי; במחשב – אדג׳ או כרום.</p>' : ''}</header>
    <div class="tbar"><button class="btn primary" id="t_play">${T.on ? '⏸ השהיה' : '▶ האזנה'}</button><button class="btn ghost sm" id="t_prev" aria-label="משפט קודם">→</button><button class="btn ghost sm" id="t_next" aria-label="משפט הבא">←</button>
      <label class="note">מהירות <select id="t_rate">${[0.85, 1, 1.15, 1.3, 1.5].map(r => `<option value="${r}" ${T.rate === r ? 'selected' : ''}>${r}×</option>`).join('')}</select></label>
      <label class="note"><input type="checkbox" id="t_auto" ${T.auto ? 'checked' : ''}> להמשיך לפרק הבא</label></div>
    <section class="panel talk">${ep.lines.map((l, k) => `<p class="tline ${l.s === F_HOST ? 'noa' : 'itai'} ${k === T.i ? 'on' : ''}" data-k="${k}"><b>${esc(l.s)}</b> ${esc(plain(l.x))}</p>`).join('')}</section>
    <div class="row"><button class="btn" data-go="unit" data-arg="${u.id}">לשיעור הכתוב</button>${UNITS[i + 1] ? `<button class="btn ghost" data-go="listen" data-arg="${UNITS[i + 1].id}">לפרק הבא ‹</button>` : ''}</div>`;
  $('#t_play').onclick = () => { if (T.on) { stopTalk(); markLine(); } else { if (T.i >= ep.lines.length) T.i = 0; T.on = true; sayLine(); } };
  $('#t_auto').onchange = e => { T.auto = e.target.checked; };
  $('#t_prev').onclick = () => { T.i = Math.max(0, T.i - 1); if (T.on) sayLine(); else markLine(); };
  $('#t_next').onclick = () => { T.i = Math.min(ep.lines.length - 1, T.i + 1); if (T.on) sayLine(); else markLine(); };
  $('#t_rate').onchange = e => { T.rate = +e.target.value; if (A.el) A.el.playbackRate = T.rate; if (T.on && !rec(T.u)) sayLine(); };
  m.querySelectorAll('.tline').forEach(el => el.onclick = () => { T.i = +el.dataset.k; T.on = true; sayLine(); });
}

// ---------- quick-recall sheet ----------
const C = {quiz: false};
function vCheat(m) {
  const line = c => { const k = c.indexOf('='); if (!C.quiz || k < 0) return `<li>${rich(c)}</li>`; return `<li><span>${rich(c.slice(0, k))}=</span> <button class="reveal" aria-label="הצגת התשובה">הצגה</button><span class="ans" hidden>${rich(c.slice(k + 1))}</span></li>`; };
  m.innerHTML = crumbs(['שליפים', 'cheat']) + `<header class="page"><h2>שליפים</h2><p class="note">כל המודלים בעמוד אחד, במשפטים קצרים. <b>מצב שינון</b> מסתיר את מה שאחרי ה־"=", כדי לבדוק את עצמכם.</p>
    <div class="row"><button class="btn ${C.quiz ? 'primary' : 'ghost'}" id="c_quiz">${C.quiz ? 'מצב שינון: פועל' : 'מצב שינון'}</button>${C.quiz ? '<button class="btn ghost" id="c_all">הצגת הכל</button>' : ''}<button class="btn ghost" onclick="print()">הדפסה</button></div></header>
    ${UNITS.map((u, i) => `<section class="panel cheatbox"><h4>${i + 1}. ${esc(u.title)}</h4>${u.mnemonic ? `<p class="note">💡 ${rich(u.mnemonic)}</p>` : ''}<ul class="ll cheat">${(u.cheat || []).map(line).join('')}</ul></section>`).join('')}`;
  $('#c_quiz').onclick = () => { C.quiz = !C.quiz; vCheat(m); };
  const all = $('#c_all'); if (all) all.onclick = () => m.querySelectorAll('.reveal').forEach(b => { b.nextElementSibling.hidden = false; b.remove(); });
  m.querySelectorAll('.reveal').forEach(b => b.onclick = () => { b.nextElementSibling.hidden = false; b.remove(); });
}

// ---------- practice ----------
const P = {filter: 'all', q: null, chosen: null, done: false, seen: new Set()};
function pool() {
  if (view === 'mistakes') return MCQ.filter(q => S.mcq[q.id] && !S.mcq[q.id].ok);
  return P.filter === 'all' ? MCQ : P.filter === 'new' ? MCQ.filter(q => !S.mcq[q.id]) : P.filter === 'exam' ? MCQ.filter(q => q.unit === 'exam') : unitMcq(P.filter);
}
function pickQ() {
  const list = pool(); if (!list.length) return null;
  const fresh = list.filter(q => !P.seen.has(q.id)); const from = fresh.length ? fresh : (P.seen.clear(), list);
  const rank = q => (S.mcq[q.id] ? (S.mcq[q.id].ok ? 2 : 1) : 0) + Math.random();
  return from.slice().sort((a, b) => rank(a) - rank(b))[0];
}
function explain(q, chosen) {
  const right = q.a, ok = chosen === right;
  const others = (q.w || []).map((w, i) => i !== right && i !== chosen && w ? `<li><b>${HEB[i]}.</b> ${rich(w)}</li>` : '').join('');
  return `<p class="vd">${ok ? '<b class="ok">נכון!</b>' : chosen == null ? `<b class="no">לא נבחרה תשובה.</b> הנכונה: ${HEB[right]}.` : `<b class="no">לא הפעם.</b> בחרתם ${HEB[chosen]}, הנכונה היא ${HEB[right]}.`}</p>
    ${chosen != null && !ok && q.w && q.w[chosen] ? `<section class="whywrong"><b>למה ${HEB[chosen]} לא?</b><p>${rich(q.w[chosen])}</p></section>` : ''}
    <div class="sol"><section class="sb s-right"><h5>למה ${HEB[right]} נכונה?</h5><p>${rich(q.why)}</p></section>
    ${others ? `<section class="sb s-way"><h5>ושאר התשובות</h5><ul class="ll">${others}</ul></section>` : ''}</div>`;
}
function vPractice(m) {
  const mis = view === 'mistakes';
  if (!P.q || (!pool().some(q => q.id === P.q.id) && !P.done)) { P.q = pickQ(); P.chosen = null; P.done = false; }
  const list = pool(), q = P.q;
  const filters = [['all', 'הכל'], ['new', 'שעוד לא ניסיתי'], ['exam', 'המבחן לדוגמה']].concat(UNITS.map(u => [u.id, u.short || u.title]));
  m.innerHTML = crumbs(['תרגול', 'practice'], ...(mis ? [['הטעויות שלי']] : [])) + `<header class="page"><h2>${mis ? 'הטעויות שלי' : 'תרגול'}</h2><p class="note">${mis ? 'תשובה נכונה מוציאה את השאלה מהרשימה.' : '4 תשובות, אחת נכונה, והסבר לכל אחת.'}</p></header>
    ${mis ? '' : `<div class="row"><select id="pf" aria-label="בחירת נושא">${filters.map(([v, l]) => `<option value="${v}" ${P.filter === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select><span class="note">${okCount(list)}/${list.length} נכון</span>${Object.values(S.mcq).some(v => !v.ok) ? '<button class="btn sm ghost" data-go="mistakes">הטעויות שלי</button>' : ''}</div>`}
    ${q ? `<div class="qcard"><div class="qhead"><span class="chip">${q.unit === 'exam' ? 'המבחן לדוגמה' : esc((U[q.unit] || {}).short || '')}</span></div><div class="qtext">${rich(q.q)}</div>
      <div class="opts">${q.o.map((o, i) => { let c = ''; if (P.done) { if (i === q.a) c = 'right'; else if (i === P.chosen) c = 'wrong'; } return `<button class="opt ${c}" data-opt="${i}" ${P.done ? 'disabled' : ''}><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`; }).join('')}</div>
      ${P.done ? `<div class="expl">${explain(q, P.chosen)}</div><div class="row"><button class="btn primary" id="pnext">לשאלה הבאה</button></div>` : ''}</div>`
      : `<section class="panel"><p>${mis ? 'אין טעויות פתוחות. כל הכבוד! 🎉' : 'אין שאלות כאן.'}</p></section>`}`;
  const pf = $('#pf'); if (pf) pf.onchange = e => { P.filter = e.target.value; P.q = null; P.seen.clear(); vPractice(m); };
  m.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { if (P.done) return; P.chosen = +b.dataset.opt; P.done = true; P.seen.add(q.id); S.mcq[q.id] = {ok: P.chosen === q.a, n: ((S.mcq[q.id] || {}).n || 0) + 1}; save(); vPractice(m); const ex = m.querySelector('.expl'); if (ex) ex.scrollIntoView({behavior: 'smooth', block: 'nearest'}); });
  const nx = $('#pnext'); if (nx) nx.onclick = () => { P.q = pickQ(); P.chosen = null; P.done = false; vPractice(m); window.scrollTo(0, 0); };
}

// ---------- exams ----------
const X = {id: null, ex: null, start: 0, ans: {}, done: false, t: null};
function vExam(m) {
  if (X.id && !X.done) return drawExam(m);
  if (X.id && X.done) return drawResult(m);
  const best = id => { const r = S.exams.filter(e => e.id === id); return r.length ? Math.max(...r.map(e => e.score)) : null; };
  m.innerHTML = crumbs(['מבחנים', 'exam']) + `<header class="page"><h2>מבחנים</h2><p class="note">כמו במבחן האמיתי: 25 שאלות, 4 נקודות לשאלה, שעתיים, בלי חומר עזר. בסוף: ציון והסבר לכל שאלה.</p></header>
    <section class="panel"><div class="ulist">${CAR.exams.map(x => `<button class="urow" data-start="${x.id}"><span class="un">★</span><span class="ut"><b>${esc(x.title)}</b><span class="note">${esc(x.note || '')}</span></span><span class="up">${best(x.id) != null ? `<span class="done">הכי טוב: ${best(x.id)}</span>` : ''}</span></button>`).join('')}
    ${BANK.length >= 25 ? `<button class="urow" data-start="mock"><span class="un">✦</span><span class="ut"><b>מבחן אימון חדש</b><span class="note">25 שאלות אקראיות מכל המודלים, בכל פעם אחרות</span></span><span class="up">${best('mock') != null ? `<span class="done">הכי טוב: ${best('mock')}</span>` : ''}</span></button>` : ''}</div></section>`;
  m.querySelectorAll('[data-start]').forEach(b => b.onclick = () => startExam(b.dataset.start));
}
function startExam(id) {
  let ex = CAR.exams.find(e => e.id === id);
  if (!ex) { // spread the mock over the units so every model shows up
    const per = {}; const sh = BANK.slice().sort(() => Math.random() - .5), mc = [];
    for (const q of sh) { if (mc.length >= 25) break; if ((per[q.unit] || 0) < Math.ceil(25 / UNITS.length)) { mc.push(q); per[q.unit] = (per[q.unit] || 0) + 1; } }
    for (const q of sh) { if (mc.length >= 25) break; if (!mc.includes(q)) mc.push(q); }
    ex = {id: 'mock', title: 'מבחן אימון', mc};
  }
  Object.assign(X, {id, ex, start: Date.now(), ans: {}, done: false}); clearInterval(X.t);
  keepX(); X.t = setInterval(tickX, 1000); render(); window.scrollTo(0, 0);
}
const tickX = () => { const el = $('#xclock'); if (el) el.textContent = clock(); if (left() <= 0 && !X.done) finish(); };
const XK = () => ACC.key(CCOURSE) + ':exam', QID = Object.fromEntries((typeof ALL !== 'undefined' ? ALL : MCQ).map(q => [q.id, q]));
function keepX() { try { if (X.id && !X.done) localStorage.setItem(XK(), JSON.stringify({id: X.id, title: X.ex.title, mc: X.ex.mc.map(q => q.id), tf: (X.ex.tf || []).map(q => q.id), start: X.start, ans: X.ans, tfa: X.tf, why: X.why})); else localStorage.removeItem(XK()); } catch (e) {} }
function restoreX() { // an exam that was open when the page was refreshed or closed
  let k = null; try { k = JSON.parse(localStorage.getItem(XK())); } catch (e) {}
  if (!k || !k.id || !Array.isArray(k.mc)) return false;
  const mc = k.mc.map(i => QID[i]), tf = (k.tf || []).map(i => QID[i]); if (mc.some(q => !q) || tf.some(q => !q)) { try { localStorage.removeItem(XK()); } catch (e) {} return false; }
  Object.assign(X, {id: k.id, ex: {id: k.id, title: k.title, mc, tf}, start: +k.start || Date.now(), ans: k.ans || {}, done: false}); if ('tf' in X) Object.assign(X, {tf: k.tfa || {}, why: k.why || {}, self: {}});
  clearInterval(X.t); X.t = setInterval(tickX, 1000); if (left() <= 0) finish(); return true;
}
window.addEventListener('beforeunload', e => { if (X.id && !X.done) { keepX(); e.preventDefault(); e.returnValue = ''; } });
const left = () => Math.max(0, 120 * 60 - Math.floor((Date.now() - X.start) / 1000));
function clock() { const l = left(); return `${Math.floor(l / 3600)}:${String(Math.floor(l % 3600 / 60)).padStart(2, '0')}:${String(l % 60).padStart(2, '0')}`; }
function drawExam(m) {
  const ex = X.ex, n = Object.keys(X.ans).length;
  m.innerHTML = `<div class="exam-bar"><b>${esc(ex.title)}</b><span class="note">${n}/${ex.mc.length} נענו</span><span class="num" id="xclock">${clock()}</span><button class="btn sm" id="xend">הגשה</button></div>
    ${ex.mc.map((q, k) => `<div class="qcard" id="xq${k}"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.q)}</div><div class="opts">${q.o.map((o, i) => `<button class="opt ${X.ans[k] === i ? 'sel' : ''}" data-xm="${k}:${i}"><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`).join('')}</div></div>`).join('')}
    <div class="row"><button class="btn primary big" id="xend2">הגשת המבחן</button></div>`;
  m.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => { const [k, i] = b.dataset.xm.split(':').map(Number); X.ans[k] = i; keepX(); m.querySelectorAll(`[data-xm^="${k}:"]`).forEach(x => x.classList.toggle('sel', x === b)); const c = m.querySelector('.exam-bar .note'); if (c) c.textContent = `${Object.keys(X.ans).length}/${ex.mc.length} נענו`; });
  const end = () => { const miss = ex.mc.length - Object.keys(X.ans).length; if (!confirm(miss ? `נשארו ${miss} שאלות בלי תשובה. להגיש בכל זאת?` : 'להגיש את המבחן?')) return; finish(); };
  $('#xend').onclick = end; $('#xend2').onclick = end;
}
// time ran out while the student was elsewhere on the site: the exam is handed in, and they are told so
function doneMsg() { if (view === 'exam') { render(); window.scrollTo(0, 0); } else { nav(); toast('הזמן נגמר והמבחן הוגש. התוצאות מחכות בלשונית מבחנים.'); } }
function finish() {
  X.done = true; clearInterval(X.t);
  const ex = X.ex, right = ex.mc.filter((q, k) => X.ans[k] === q.a).length, score = ex.mc.length ? Math.round(right * 100 / ex.mc.length) : 0;
  ex.mc.forEach((q, k) => { if (X.ans[k] != null) S.mcq[q.id] = {ok: X.ans[k] === q.a, n: ((S.mcq[q.id] || {}).n || 0) + 1}; });
  S.exams.push({id: X.id, ts: Date.now(), score, right, sec: Math.round((Date.now() - X.start) / 1000)}); save(); keepX(); doneMsg();
}
function drawResult(m) {
  const ex = X.ex, right = ex.mc.filter((q, k) => X.ans[k] === q.a).length, score = Math.round(right * 100 / ex.mc.length);
  const byUnit = {}; ex.mc.forEach((q, k) => { if (X.ans[k] !== q.a && q.unit !== 'exam') byUnit[q.unit] = (byUnit[q.unit] || 0) + 1; });
  const weak = Object.entries(byUnit).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u]) => U[u]).filter(Boolean);
  m.innerHTML = crumbs(['מבחנים', 'exam'], ['תוצאות']) + `<header class="page"><h2>ציון: ${score}</h2><p class="lead">${right} מתוך ${ex.mc.length} נכונות. ${score >= 85 ? 'מצוין! 🎉' : score >= 70 ? 'טוב מאוד. עוברים על ההסברים של הטעויות וזה יעלה עוד.' : 'בשביל זה מתרגלים: קראו כל הסבר, ואז את השליפים של המודלים שנפלתם בהם.'}</p>
    ${weak.length ? `<p class="note">כדאי לחזור על: ${weak.map(u => `<a href="#unit/${u.id}" data-go="unit" data-arg="${u.id}">${esc(u.title)}</a>`).join(' · ')}</p>` : ''}</header>
    ${ex.mc.map((q, k) => `<div class="qcard"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.q)}</div><div class="opts">${q.o.map((o, i) => `<button class="opt ${i === q.a ? 'right' : i === X.ans[k] ? 'wrong' : ''}" disabled><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`).join('')}</div><div class="expl">${explain(q, X.ans[k] ?? null)}</div></div>`).join('')}
    <div class="row"><button class="btn primary" id="xback">חזרה למבחנים</button></div>`;
  $('#xback').onclick = () => { X.id = null; X.done = false; go('exam'); };
}

// another tab or device may have moved on: take its newer progress when this tab comes back (not during an exam or while listening)
async function resyncC() {
  if (!ACC.user() || (X.id && !X.done) || resyncC.busy) return; resyncC.busy = true;
  try { const b = S._at; await sync(); if (S._at !== b && view !== 'listen') { nav(); render(); } } finally { resyncC.busy = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resyncC(); });
window.addEventListener('storage', e => { if (ACC.user() && e.key === ACC.key(CCOURSE) && !(X.id && !X.done) && view !== 'listen') { loadS(); nav(); render(); } });
// ---------- boot ----------
$('#main').innerHTML = '<p class="note" style="text-align:center;padding:40px 0">טוען…</p>';
(function () { const b = $('#cbar b'); if (b) b.textContent = 'ניהול קריירות בארגונים'; const a = $('#cbar a'); if (a) { a.href = '/'; a.removeAttribute('data-go'); } const bl = $('.brandlink'); if (bl) { bl.href = '/'; bl.removeAttribute('data-go'); } })();
ACC.ready().catch(() => {}).then(async () => {
  if (!ACC.user()) { try { sessionStorage.setItem('silas_return', location.pathname + location.hash); } catch (e) {} location.replace('/'); return; }
  if (ACC.user().blocked) { location.replace('/'); return; }
  ACC.onBlocked = () => location.replace('/');
  loadS(); await sync();
  const p = parseHash(); view = p.v; arg = p.a; if (!VIEWS.some(v => v[0] === view) && !PARENT[view]) view = 'dash';
  if (restoreX() && !X.done) { view = 'exam'; arg = null; try { history.replaceState(null, '', '#exam'); } catch (e) {} }
  nav(); render();
});
</script>
