תו תחום עם קידום = ליניארית, לא משתנה.","ויתור על ניהול כדי להמשיך להתמקצע = יציבה.","מסורתית = ארגון אחד, ותק, שכר עולה, הארגון מנהל.","מודרנית/פרוטיאנית (הול) = אני מנהל, ערכים, הצלחה פסיכולוגית.","פרוטיאנית = פרוטאוס, משנה צורה.","נטולת גבולות = חוצה ארגונים ותחומים (צד מודרני).","קודם לבדוק את שם המודל בשאלה, ואז לבחור."],"mcq":[{"id":"c5-1","q":"מיכל התחילה לעבוד בבנק כפקידה זוטרה במחלקת הכספים. אחרי ארבע שנים מונתה לראש צוות, לאחר מכן למנהלת המחלקה, וכיום, אחרי 25 שנה, היא סמנכ״לית הכספים של אותו בנק. לפי מודל דפוסי הקריירה של דרייבר (Driver), דפוס הקריירה של מיכל הוא:","o":["קריירה ספיראלית","קריירה ליניארית","קריירה יציבה","קריירה משתנה"],"a":1,"why":"מיכל נשארה באותו תחום (כספים) וכל צעד היה קידום לתפקיד בכיר יותר: פקידה → ראש צוות → מנהלת מחלקה → סמנכ״לית. טיפוס בסולם ההיררכי = ליניארית.","w":["בספיראלית עוברים לתחום קרוב חדש כל 5–10 שנים. מיכל לא החליפה תחום, רק עלתה בדרגה.","","ביציבה האדם מעמיק במקצוע בלי לטפס. אצל מיכל העיקר הוא הקידומים.","במשתנה עוברים בין תחומים לא קשורים כל 2–4 שנים. מיכל נשארה בכספים ובאותו בנק."]},{"id":"c5-2","q":"יוסי הוא נגר כבר 30 שנה. הוא לומד כל הזמן טכניקות חדשות בעיבוד עץ ונחשב לאחד הנגרים הטובים באזור. כשהציעו לו להיות מנהל העבודה של הנגרייה, הוא סירב, כי רצה להמשיך לעבוד בידיים. לפי מודל דרייבר, דפוס הקריירה של יוסי הוא:","o":["קריירה ליניארית","קריירה משתנה","קריירה ספיראלית","קריירה יציבה"],"a":3,"why":"יוסי נשאר כל חייו באותו מקצוע, מעמיק ומתמחה, ואף מוותר על תפקיד ניהולי. התמקצעות לאורך החיים בלי טיפוס = יציבה.","w":["ליניארית היא טיפוס בסולם. יוסי סירב לקידום לניהול.","משתנה היא מעברים בין תחומים לא קשורים. יוסי לא החליף תחום.","ספיראלית היא מעבר לתחום קרוב כל 5–10 שנים. יוסי נשאר נגר.",""]},{"id":"c5-3","q":"תמר עבדה 8 שנים כאחות בחדר ניתוח. לאחר מכן עברה ללמד בבית ספר לסיעוד ושימשה מדריכה קלינית במשך 7 שנים. לפני שנתיים הקימה חברה שמפתחת סימולציות לאימון צוותים רפואיים. לפי מודל דרייבר, דפוס הקריירה של תמר הוא:","o":["קריירה ספיראלית","קריירה משתנה","קריירה ליניארית","קריירה יציבה"],"a":0,"why":"תמר החליפה תחום כל 7–8 שנים, וכל תחום חדש נשען על הקודם (סיעוד → הוראת סיעוד → סימולציות רפואיות). תחום קרוב ותחנות ארוכות = ספיראלית.","w":["","במשתנה התחומים לא קשורים והמעברים מהירים (2–4 שנים). אצל תמר יש קשר ברור בין התחנות, והן ארוכות.","ליניארית היא טיפוס בתוך אותו תחום. תמר החליפה תחום, לא רק דרגה.","יציבה היא אותו מקצוע לאורך כל החיים. תמר עברה בין כמה תפקידים שונים."]},{"id":"c5-4","q":"גיא עבד שנתיים כבריסטה, אחר כך שלוש שנים כסוכן נדל״ן, ואז שנתיים כמדריך טיולים בתאילנד. בחודש שעבר התחיל לעבוד כמאמן כושר. ״אחרי כמה שנים אני מרגיש מיצוי ורוצה משהו חדש לגמרי״, הוא מסביר. לפי מודל דרייבר, דפוס הקריירה של גיא הוא:","o":["קריירה ספיראלית","קריירה ליניארית","קריירה משתנה","קריירה יציבה"],"a":2,"why":"גיא מחליף תחום כל 2–3 שנים, והתחומים לא קשורים זה לזה (קפה, נדל״ן, טיולים, כושר). מעברים מהירים לתחומים לא קשורים = משתנה.","w":["בספיראלית התחום החדש קשור לקודם והתחנות ארוכות (5–10 שנים). אצל גיא אין קשר והתחנות קצרות.","ליניארית היא קידום בתוך תחום אחד. גיא לא התקדם בסולם.","","יציבה היא אותו תחום כל החיים. גיא החליף ארבעה תחומים."]},{"id":"c5-5","q":"אלה וגלי למדו יחד תקשורת. אלה עבדה 6 שנים ככתבת כלכלית, אחר כך 8 שנים כדוברת של משרד ממשלתי, וכיום יש לה משרד יחסי ציבור משלה. גלי עבדה שנתיים ככתבת, אחר כך שלוש שנים כשפית במסעדה, וכיום היא מורה ליוגה. לפי מודל דרייבר, דפוסי הקריירה של אלה ושל גלי בהתאמה הם:","o":["ליניארית, משתנה","משתנה, ספיראלית","ספיראלית, יציבה","ספיראלית, משתנה"],"a":3,"why":"אצל אלה כל תחנה ארוכה וקשורה לקודמת (עיתונות → דוברות → יחסי ציבור) = ספיראלית. אצל גלי התחנות קצרות והתחומים לא קשורים (עיתונות → מטבח → יוגה) = משתנה.","w":["אלה לא טיפסה בסולם של תחום אחד – היא עברה לתחומים קרובים. לכן זו לא ליניארית.","זה הפוך: אלה ספיראלית וגלי משתנה.","גלי לא נשארה באותו תחום, ולכן היא לא יציבה.",""]},{"id":"c5-6","q":"ארז שירת בצבא הקבע בחיל ההנדסה עד גיל 42, והגיע לדרגת אלוף משנה. אחרי השחרור עבד 7 שנים כמנהל הבטיחות בחברת בנייה גדולה, ולאחרונה פתח משרד משלו לייעוץ הנדסי לפרויקטים של בנייה. לפי מודל מסלולי הקריירה של דרייבר, סוג הקריירה של ארז הוא:","o":["קריירה ליניארית","קריירה ספיראלית","קריירה משתנה","קריירה יציבה"],"a":1,"why":"ארז החליף תחום כמה פעמים, אבל כל תחום קרוב לקודם ונשען עליו (הנדסה צבאית → בטיחות בבנייה → ייעוץ הנדסי), והתחנות ארוכות. זו ספיראלית, למרות הדרגות בצבא.","w":["הקידומים היו רק בתוך הצבא. אחר כך ארז החליף תחום, ולכן כל המסלול אינו טיפוס בסולם אחד. זו המלכודת.","","במשתנה התחומים לא קשורים והתחנות קצרות. אצל ארז הכל קשור להנדסה ובנייה.","ארז לא נשאר באותו תפקיד מקצועי כל חייו."]},{"id":"c5-7","q":"שי התחיל כנציג מכירות בחברת מזון. אחרי שלוש שנים מונה לראש צוות מכירות, ואחר כך עבר לחברת מזון אחרת כמנהל מכירות אזורי. כיום הוא מנהל המכירות הארצי של חברת מזון שלישית. לפי מודל דרייבר, דפוס הקריירה של שי הוא:","o":["קריירה ליניארית","קריירה משתנה","קריירה ספיראלית","קריירה יציבה"],"a":0,"why":"שי נשאר באותו תחום (מכירות מזון), וכל מעבר היה קידום לתפקיד בכיר יותר. הוא החליף מעסיק, לא תחום. טיפוס בסולם = ליניארית.","w":["","משתנה היא החלפת תחום לתחום לא קשור. שי החליף רק חברות, ונשאר במכירות.","ספיראלית היא מעבר לתחום חדש וקרוב. שי לא החליף תחום, רק עלה בדרגה.","ביציבה האדם לא מטפס. אצל שי העיקר הוא הקידומים."]},{"id":"c5-8","q":"רינה עובדת 30 שנה באותו מפעל. היא התקדמה בהדרגה לפי ותק, השכר שלה עלה כל כמה שנים, ומחלקת משאבי האנוש היא שקבעה לאילו קורסים תצא ולאיזה תפקיד תעבור. רינה אומרת: ״הייתי נאמנה למפעל, והוא דאג לי״. תיאור מסלול הקריירה של רינה מתאים ל-","o":["קריירה פרוטיאנית","קריירה משתנה","קריירה מסורתית","קריירה מודרנית"],"a":2,"why":"ארגון אחד, התקדמות הדרגתית לפי ותק, שכר שעולה, והארגון הוא שמנהל את הקריירה (נאמנות תמורת ביטחון) = קריירה מסורתית.","w":["בפרוטיאנית העובד מנהל את הקריירה לפי הערכים שלו. אצל רינה הארגון מחליט.","משתנה (דרייבר) היא מעברים מהירים בין תחומים לא קשורים. רינה לא החליפה תחום.","","מודרנית היא ההפך ממסורתית: העובד מנהל ועובר בין ארגונים."]},{"id":"c5-9","q":"עמית עזב משרה קבועה בבנק כי הרגיש שהיא לא מתאימה לערכים שלו. כיום הוא עובד עם כמה ארגונים חברתיים כפרילנסר, בוחר פרויקטים לפי המשמעות שלהם ומשלם בעצמו על קורסים כדי להמשיך ללמוד. ״הצלחה מבחינתי היא סיפוק, לא תואר בכרטיס ביקור״. תיאור הקריירה של עמית מתאים ל-","o":["קריירה מסורתית","קריירה ליניארית","קריירה יציבה","קריירה פרוטיאנית"],"a":3,"why":"עמית מנהל את הקריירה בעצמו, לפי הערכים שלו, עובד עם כמה ארגונים, אחראי ללמידה שלו ומודד הצלחה פסיכולוגית (סיפוק) = קריירה פרוטיאנית (מודרנית).","w":["במסורתית הארגון מנהל והעובד נשאר בו שנים. עמית עזב והוא מנהל את עצמו.","ליניארית היא טיפוס בסולם (מודל דרייבר). עמית לא מחפש קידום.","יציבה (דרייבר) היא התמקצעות כל החיים באותו תחום. הסיפור מדגיש ערכים וניהול עצמי, לא התמקצעות.",""]},{"id":"c5-10","q":"בסדנה לניהול קריירה המרצה אמרה: ״היום אתם האחראים לקריירה שלכם, לא הארגון. אתם צריכים להמשיך ללמוד, לזוז בין ארגונים כשצריך, ולמדוד הצלחה לפי התחושה שאתם עושים משהו משמעותי ומתאים לכם״. המרצה מתארת:","o":["קריירה מודרנית (פרוטיאנית)","קריירה מסורתית","קריירה ספיראלית","קריירה ליניארית"],"a":0,"why":"העובד אחראי לקריירה, לומד כל הזמן, עובר בין ארגונים ומודד הצלחה פסיכולוגית – אלה המאפיינים של הקריירה המודרנית/הפרוטיאנית של הול.","w":["","במסורתית הארגון אחראי לקריירה וההצלחה נמדדת בקידום ובשכר.","ספיראלית היא דפוס של דרייבר (מעבר לתחום קרוב כל 5–10 שנים). המרצה לא מתארת מסלול כזה.","ליניארית היא טיפוס בסולם. המרצה מדברת על משמעות, לא על קידום."]},{"id":"c5-11","q":"דור עבד שלוש שנים כמפתח תוכנה, אחר כך שנתיים כשף, ועכשיו הוא סוכן ביטוח. חברו בן הוא מפתח תוכנה כבר 25 שנה, מתמחה באותה שפת תכנות, וסירב פעמיים להיות ראש צוות כי ״אני אוהב לכתוב קוד״. לפי מודל דרייבר, דפוסי הקריירה של דור ושל בן בהתאמה הם:","o":["ספיראלית, ליניארית","משתנה, יציבה","משתנה, ליניארית","יציבה, משתנה"],"a":1,"why":"דור מחליף תחום לא קשור כל 2–3 שנים = משתנה. בן נשאר באותו מקצוע, מתמחה בו ומוותר על ניהול = יציבה.","w":["דור לא עבר לתחומים קרובים, אז הוא לא ספיראלי. בן סירב לקידום, אז הוא לא ליניארי.","","דור אכן משתנה, אבל בן לא ליניארי – הוא סירב לטפס בסולם.","זה הפוך: דור משתנה ובן יציב."]},{"id":"c5-12","q":"משה, בן 62, מספר: ״כשהתחלתי לעבוד בחברת התעופה לפני 35 שנה, ידעתי שאם אהיה נאמן לחברה, היא תדאג לי: כל כמה שנים קידום, העלאה בשכר ובסוף פנסיה טובה. בכל השנים האלה לא חשבתי לעבור לארגון אחר״. התיאור של משה מתאים ל-","o":["קריירה פרוטיאנית","קריירה נטולת גבולות","קריירה מסורתית","קריירה משתנה"],"a":2,"why":"ארגון אחד לאורך כל הדרך, נאמנות תמורת ביטחון, קידום הדרגתי ושכר שעולה = קריירה מסורתית.","w":["בפרוטיאנית העובד מנהל את הקריירה ועובר בין ארגונים. משה נשען על הארגון.","נטולת גבולות היא קריירה שחוצה ארגונים ותחומים. משה נשאר בארגון אחד.","","משתנה היא מעברים מהירים בין תחומים לא קשורים. משה לא החליף תחום."]},{"id":"c5-13","q":"הדס עבדה 6 שנים כפיזיותרפיסטית. אחר כך עברה לעבוד 8 שנים כיועצת ארגונומיה למפעלים, ולאחרונה הצטרפה לחברה שמפתחת כיסאות משרדיים ארגונומיים כמנהלת פיתוח המוצר. לפי מודל דרייבר, דפוס הקריירה של הדס הוא:","o":["קריירה ליניארית","קריירה יציבה","קריירה משתנה","קריירה ספיראלית"],"a":3,"why":"הדס החליפה תחום פעם ב-6–8 שנים, וכל צעד בנוי על הידע הקודם (גוף ותנועה → ארגונומיה → מוצרים ארגונומיים). תחום קרוב ותחנות ארוכות = ספיראלית.","w":["הדס לא טיפסה בסולם של אותו תחום; היא עברה לתחומים חדשים.","הדס לא נשארה כפיזיותרפיסטית כל חייה.","במשתנה התחומים לא קשורים והמעברים כל 2–4 שנים. אצל הדס יש קשר ברור והתחנות ארוכות.",""]}]},{"id":"c6","title":"מודל ניהול הקריירה של גרינהאוס","short":"מודל גרינהאוס","blurb":"שמונת השלבים של ניהול קריירה לפי גרינהאוס, שבע אסטרטגיות הקריירה וסוגי מטרות הקריירה.","mnemonic":"ח' ואחריו שבע מ': חוקרים → מבינים (מודעות) → מציבים מטרות → מתכננים אסטרטגיה → מבצעים (יישום) → מתקדמים → מקבלים משוב → מעריכים – וחוזרים לחקור.","blocks":[{"t":"h","x":"מה זה מודל גרינהאוס?"},{"t":"p","x":"גרינהאוס (Greenhouse) מתאר איך אדם <b>מנהל בעצמו</b> את הקריירה שלו. זה תהליך של <b>8 שלבים</b> שחוזר על עצמו כמו מעגל: בסוף מעריכים מה קרה וחוזרים להתחלה."},{"t":"p","x":"במבחן שואלים שלושה סוגי שאלות: <b>באיזה שלב</b> האדם נמצא, <b>מה השלב הבא</b>, ו<b>באיזו אסטרטגיה</b> הוא משתמש. בנוסף שואלים על <b>סוגי המטרות</b>."},{"t":"steps","title":"שמונת השלבים – לפי הסדר","x":["<b>חקר קריירה</b> – אוספים מידע. על עצמי: ערכים, תחומי עניין, חוזקות וחולשות, שאלונים, אבחון תעסוקתי. ועל הסביבה: מקצועות, ארגונים, שיחות עם אנשים.","<b>מודעות לעצמי ולסביבה</b> – רגע ההבנה: \"עכשיו אני מבין מה אני רוצה ומה מתאים לי\".","<b>הצבת מטרות</b> – מחליטים מה רוצים להשיג: \"אני רוצה להיות X\" או \"אני רוצה עבודה עם Y\".","<b>פיתוח אסטרטגיית קריירה</b> – מתכננים איך להגיע למטרה: אילו צעדים לעשות (קורס, מנטור, נטוורקינג...).","<b>יישום האסטרטגיה</b> – עושים בפועל את מה שתכננו: נרשמים לקורס, פונים למנטור.","<b>התקדמות לעבר המטרה</b> – מתקרבים למטרה בזכות הפעולות.","<b>משוב מהעבודה או מחוץ לעבודה</b> – מקבלים תגובות מאחרים: מנהל, עמיתים, בן/בת זוג, חברים.","<b>הערכת קריירה</b> – בודקים בעזרת המשוב: האם המטרה והאסטרטגיה עדיין נכונות? ומשם חוזרים ל<b>חקר</b>."]},{"t":"table","head":["שלב","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>חקר קריירה</b>","איסוף מידע על עצמי ועל הסביבה.","שאלונים, אבחון, יועץ קריירה, בדיקת ערכים, חוזקות וחולשות, שיחות עם אנשים, קריאה על מקצועות.","ענבל ממלאת אצל יועץ שאלון על החוזקות והחולשות שלה."],["<b>מודעות לעצמי ולסביבה</b>","ההבנה שנוצרת מהמידע.","\"היא הבינה ש...\", \"התברר לו ש...\", \"זה אכן מה שהיא רוצה\".","אחרי השיחות עידו מבין שהוא רוצה לעבוד בעיצוב חוויית משתמש."],["<b>הצבת מטרות</b>","קובעים יעד.","\"החליטה שבתוך שנתיים תהיה...\", \"שם לעצמו מטרה...\".","מאיה מחליטה להיות ראש צוות QA."],["<b>פיתוח אסטרטגיית קריירה</b>","תכנון הדרך ליעד.","\"בונה תוכנית\", \"חושב אילו צעדים לעשות\".","מאיה מתכננת קורס הובלת צוותים ופגישות עם מנטור."],["<b>יישום האסטרטגיה</b>","ביצוע התוכנית.","נרשם, מתחיל, עושה בפועל.","מאיה נרשמת לקורס ומתחילה להיפגש עם המנטור."],["<b>התקדמות לעבר המטרה</b>","התקרבות ליעד.","\"מתקרבת\", \"קיבלה אחריות נוספת\".","מאיה מקבלת להוביל פרויקט קטן."],["<b>משוב מהעבודה או מחוץ לעבודה</b>","תגובות מאחרים על ההתקדמות.","שיחת הערכה, מנהל שאומר, בן זוג או חברים שמגיבים.","המנהלת אומרת למאיה שהיא מתקדמת יפה אבל צריכה לשפר הצגה מול הנהלה."],["<b>הערכת קריירה</b>","בדיקה עצמית: האם להמשיך כך?","\"עוצרת לבדוק אם המטרה עדיין מתאימה\".","מאיה שוקלת אם ניהול צוות עדיין מתאים לה."]]},{"t":"h","x":"חקר מול מודעות – ההבדל שהכי חשוב למבחן"},{"t":"p","x":"<b>חקר</b> הוא <b>פעולה</b>: ממלאים שאלון, מדברים עם אנשים, בודקים. <b>מודעות</b> היא <b>תוצאה</b>: הרגע שבו \"נופל האסימון\"."},{"t":"example","title":"מה השלב הבא? (בסגנון שאלה 25 במבחן לדוגמה)","x":"שלומית לקחה חל״ת, ניהלה שיחות עם חברות, בן הזוג וההורים (= <b>חקר</b>). אחר כך <b>הבינה שזה אכן מה שהיא רוצה</b> (= <b>מודעות</b>, השלב הזה כבר הושלם). לכן <b>השלב הבא</b> הוא <b>הצבת המטרות</b>."},{"t":"trap","x":"בשאלת \"מה השלב הבא\" – אל תסמנו את השלב שהאדם <b>כבר נמצא בו</b>. מצאו את השלב האחרון שתואר בסיפור, וסמנו את <b>השלב שאחריו</b>. אם כתוב \"הבינה\" – המודעות הושלמה, והבא הוא הצבת מטרות."},{"t":"trap","x":"<b>אבחון ערכים, תחומי עניין, חוזקות וחולשות, שאלונים</b> = תמיד <b>חקר קריירה</b> (שאלות 9 ו-19 במבחן לדוגמה). לא \"מודעות\" ולא \"הערכת קריירה\"."},{"t":"trap","x":"<b>משוב מול הערכה:</b> משוב = מה <b>אחרים</b> אומרים לי. הערכת קריירה = מה <b>אני</b> מסיק מזה על המטרה והאסטרטגיה. אחרי הערכה – חוזרים לחקר."},{"t":"h","x":"שבע אסטרטגיות הקריירה"},{"t":"p","x":"אסטרטגיה היא <b>הדרך</b> להשיג את המטרה. גרינהאוס מונה 7 אסטרטגיות. בסיפור מחפשים את <b>הפעולה</b> שהאדם עושה."},{"t":"table","head":["קטגוריה","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>שיפור ביצועים בעבודה הנוכחית</b>","להיות מצוין במה שאני עושה עכשיו.","משפר תפוקה, עומד ביעדים ועוקף אותם, פחות טעויות.","אפרת מעלה את אחוז הסגירה שלה ועוקפת את היעד הרבעוני."],["<b>הרחבת מעורבות בעבודה</b>","להשקיע יותר זמן ומאמץ ממה שנדרש.","שעות נוספות, סופי שבוע, \"מעבר למכסה בחוזה\", לוקח משימות נוספות.","ירדן נשארת שעות נוספות כדי להראות כמה היא מסורה."],["<b>פיתוח מיומנויות וכישורים</b>","ללמוד ולהכשיר את עצמי.","קורס, תואר (MBA), הכשרה, השתלמות.","אייל לומד MBA כדי להיות גזבר ראשי."],["<b>פיתוח הזדמנויות</b>","לייצר לעצמי אפשרויות.","מספר למנהל מה הוא רוצה, נטוורקינג, בונה קשרים, מתנדב לפרויקט כדי להיחשף, מגיש מועמדות.","ליהי אומרת למנהלת שהיא רוצה לעבור לשיווק, ומצטרפת לפרויקט משותף עם מחלקת השיווק."],["<b>פיתוח מנטור ובריתות תומכות</b>","להיעזר באדם ותיק ומנוסה.","\"התחבר למנהל ותיק כדי ללמוד ממנו ולקבל עידוד\", חונך, מלווה.","נועם נפגש כל חודש עם סמנכ״ל ותיק שמייעץ לו."],["<b>בניית תדמית של הצלחה</b>","לדאוג שיראו אותי כמצליח.","מקפיד שמנהלים ישמעו על ההצלחות שלו, מתלבש ומדבר \"כמו מנהל\", מציג הישגים.","רון שולח להנהלה סיכום של כל פרויקט שהצליח."],["<b>פוליטיקה ארגונית</b>","להשיג השפעה דרך יחסי כוח.","בונה בריתות עם בעלי השפעה, מתיישר עם עמדות המנהל, משתמש בקשרים כדי להשיג יתרון.","בועז מצטרף בפומבי לכל יוזמה של המנכ״ל כדי להיות \"בצד הנכון\"."]]},{"t":"trap","x":"<b>שעות נוספות = הרחבת מעורבות</b>, גם אם המטרה בסיפור היא \"להראות שהיא מסורה\". אל תתבלבלו עם בניית תדמית (שאלה 23 במבחן לדוגמה)."},{"t":"trap","x":"<b>קורס או תואר = פיתוח מיומנויות וכישורים</b> (שאלה 11 במבחן לדוגמה, MBA). <b>ללמוד מאדם ותיק ולקבל ממנו עידוד = פיתוח מנטור</b>."},{"t":"trap","x":"<b>נטוורקינג וחשיפת רצונות = פיתוח הזדמנויות</b>, לא פוליטיקה ארגונית."},{"t":"h","x":"סוגי מטרות קריירה"},{"t":"table","head":["קטגוריה","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>מושגית / קונספטואלית</b>","סוג החוויות והסביבה שאני רוצה, בלי תפקיד מסוים.","רשימת תנאים: חופש פעולה, שעות נוחות, ממונה גמיש, חברה קטנה.","ליעד רוצה עבודה עם חופש פעולה וקולגות צעירים."],["<b>אופרטיבית</b>","משרה או תפקיד ספציפי.","שם של תפקיד: \"מנהלת השקעות\", \"גזבר ראשי\".","ירדן רוצה להיות מנהלת השקעות."],["<b>אינסטרומנטלית</b>","אמצעי להשגת מטרה אחרת.","\"כדי ל...\", \"קרש קפיצה\", \"אמצעי\", \"שלב בדרך\".","תפקיד ראש צוות כקרש קפיצה לניהול מחלקה."],["<b>אקספרסיבית / ביטוי עצמי</b>","מהנה ומספקת בפני עצמה.","\"מעניין אותה\", \"נהנה\", \"סיפוק\", \"חוויה\".","דנה רוצה להיות מדריכת פילאטיס כי זה מסב לה הנאה."],["<b>טווח קצר / טווח ארוך</b>","מטרה קרובה או רחוקה בזמן.","\"בשנה הקרובה\" מול \"בעוד שנים רבות\".","לסיים קורס השנה (קצר) / לנהל את החברה (ארוך)."]]},{"t":"p","x":"שני זוגות של ניגודים: <b>מושגית ↔ אופרטיבית</b> (מה רוצים: סביבה או תפקיד) ו<b>אינסטרומנטלית ↔ אקספרסיבית</b> (למה רוצים: אמצעי או הנאה)."},{"t":"trap","x":"<b>מטרה יכולה להיות גם אקספרסיבית וגם אינסטרומנטלית.</b> אם הסיפור מתאר משהו מהנה וחוויתי <b>וגם</b> אמצעי להגיע למשהו אחר – בחרו את התשובה ששמה את שתיהן (שאלה 24 במבחן לדוגמה)."},{"t":"trap","x":"\"מטרה ריאלית\" אינה סוג מטרה במודל – מסיח."},{"t":"exam","x":"איך שואלים: \"לפי מודל גרינהאוס, X מצוי בשלב ה-\", \"מהו השלב הבא ש-X צריך ליישם?\", \"באיזו אסטרטגיה מדובר?\", \"X נקט באסטרטגיות הבאות:\" (שלוש בבת אחת), \"X הציב לעצמו מטרה ____\"."}],"cheat":["8 שלבים: חקר → מודעות → מטרות → אסטרטגיה → יישום → התקדמות → משוב → הערכה → (חזרה לחקר).","ח' ואחריו שבע מ': חוקרים, מבינים, מציבים, מתכננים, מבצעים, מתקדמים, מקבלים משוב, מעריכים.","שאלון, ערכים, חוזקות וחולשות, שיחות = חקר קריירה.","\"הבינה שזה מה שהיא רוצה\" = מודעות הושלמה → הבא: הצבת מטרות.","משוב = אחרים אומרים. הערכה = אני מסיק.","קורס/תואר = פיתוח מיומנויות וכישורים.","שעות נוספות = הרחבת מעורבות.","נטוורקינג, לספר למנהל מה רוצים = פיתוח הזדמנויות.","ותיק שמלמד ומעודד = פיתוח מנטור.","להראות הצלחות להנהלה = בניית תדמית של הצלחה.","מושגית = רשימת תנאים; אופרטיבית = תפקיד מסוים.","אינסטרומנטלית = אמצעי; אקספרסיבית = הנאה בפני עצמה.","גם וגם (אקספרסיבית + אינסטרומנטלית) – אפשרי!","\"מטרה ריאלית\" = מסיח."],"mcq":[{"id":"c6-1","q":"יעל מרגישה תקועה בעבודתה. היא פנתה ליועצת קריירה, שביקשה ממנה למלא שאלון תחומי עניין ולדרג אילו ערכים חשובים לה בעבודה. לפי מודל ניהול הקריירה של גרינהאוס, יעל מצויה בשלב ה-","o":["הצבת מטרות","חקר קריירה","הערכת קריירה","פיתוח אסטרטגיית קריירה"],"a":1,"why":"יעל אוספת מידע על עצמה – תחומי עניין וערכים – בעזרת שאלונים. זה השלב הראשון: חקר קריירה.","w":["בהצבת מטרות כבר יודעים מה רוצים וקובעים יעד. יעל עוד אוספת מידע.","","הערכת קריירה מגיעה בסוף, אחרי משוב. השאלון הוא איסוף מידע בתחילת הדרך.","אסטרטגיה מתכננים רק אחרי שיש מטרה. ליעל עוד אין מטרה."]},{"id":"c6-2","q":"עידו עובד כמורה כבר 10 שנים. הוא לקח שנת שבתון, קרא על מקצועות בהייטק, דיבר עם חברים שעובדים בתחום ועם יועץ קריירה, ובדק מה הוא אוהב לעשות. בסוף התהליך אמר: ״עכשיו ברור לי – אני רוצה לעבוד בעיצוב חוויית משתמש״. לפי מודל גרינהאוס, מהו השלב הבא שעל עידו ליישם?","o":["שלב החקר","שלב המודעות לעצמי ולסביבה","שלב פיתוח אסטרטגיית קריירה","שלב הצבת המטרות"],"a":3,"why":"עידו כבר עשה חקר (קרא, דיבר עם אנשים) והגיע למודעות (״עכשיו ברור לי״). השלב שאחרי המודעות הוא הצבת המטרות.","w":["את החקר עידו כבר עשה – קרא ודיבר עם אנשים.","במודעות עידו כבר נמצא (״עכשיו ברור לי״). השאלה היא על השלב הבא.","אסטרטגיה מגיעה רק אחרי שמציבים מטרה. מדלגים כאן על שלב.",""]},{"id":"c6-3","q":"אחרי כמה שבועות של שיחות ושאלונים, רוני אומרת ליועצת: ״הבנתי שאני הכי נהנית כשאני עובדת עם אנשים, ושיש היום ביקוש גדול לאנשי משאבי אנוש בחברות הייטק״. לפי מודל גרינהאוס, באיזה שלב רוני נמצאת עכשיו?","o":["מודעות לעצמי ולסביבה","חקר קריירה","הצבת מטרות","משוב מהעבודה או מחוץ לעבודה"],"a":0,"why":"רוני מתארת הבנה – על עצמה (נהנית לעבוד עם אנשים) ועל הסביבה (ביקוש בשוק). הרגע של ״הבנתי״ הוא שלב המודעות לעצמי ולסביבה.","w":["","החקר (השיחות והשאלונים) כבר הסתיים. עכשיו היא מדברת על התובנה שיצאה ממנו.","רוני עוד לא קבעה יעד מסוים; היא רק הבינה מה מתאים לה.","משוב הוא תגובה של אחרים על ההתקדמות לעבר מטרה. רוני מתארת תובנה שלה."]},{"id":"c6-4","q":"מאיה, בודקת תוכנה, החליטה: ״בתוך שנתיים אני רוצה להיות ראש צוות QA״. לפי מודל גרינהאוס, מהו השלב הבא שעל מאיה ליישם?","o":["יישום האסטרטגיה","חקר קריירה","פיתוח אסטרטגיית קריירה","הערכת קריירה"],"a":2,"why":"מאיה הציבה מטרה. השלב שאחרי הצבת המטרות הוא פיתוח אסטרטגיית קריירה – לתכנן איך להגיע למטרה.","w":["יישום מגיע אחרי שיש אסטרטגיה. קודם צריך לתכנן ורק אז לבצע.","החקר הוא השלב הראשון, והוא כבר מאחוריה.","","הערכה היא השלב האחרון, אחרי יישום, התקדמות ומשוב."]},{"id":"c6-5","q":"רון פועל כבר שנה כדי להיות מנהל פרויקטים. בשיחת ההערכה השנתית המנהלת שלו אמרה שהוא מתקדם יפה, אבל צריך לשפר את ההצגה מול ההנהלה. גם אשתו העירה לו שהוא נראה לחוץ מאוד בתקופה האחרונה. לפי מודל גרינהאוס, רון נמצא בשלב ה-","o":["חקר קריירה","משוב מהעבודה או מחוץ לעבודה","הצבת מטרות","מודעות לעצמי ולסביבה"],"a":1,"why":"רון מקבל תגובות מאחרים על ההתקדמות שלו – מהמנהלת (מהעבודה) ומאשתו (מחוץ לעבודה). זה שלב המשוב מהעבודה או מחוץ לעבודה.","w":["חקר הוא איסוף מידע לפני שיש מטרה. לרון כבר יש מטרה והוא באמצע הדרך.","","את המטרה רון כבר הציב לפני שנה.","מודעות היא הבנה עצמית בתחילת הדרך. כאן אחרים נותנים לרון תגובה על ההתקדמות."]},{"id":"c6-6","q":"אחרי שקיבלה משוב מהמנהל ומחברים, שרית ישבה עם עצמה ובדקה: האם המטרה להיות מנהלת סניף עדיין מתאימה לה? האם הדרך שבחרה עובדת? לפי מודל גרינהאוס, שרית נמצאת בשלב ה-","o":["הערכת קריירה","התקדמות לעבר המטרה","חקר קריירה","יישום האסטרטגיה"],"a":0,"why":"אחרי המשוב שרית בודקת בעצמה אם המטרה והאסטרטגיה עדיין נכונות. זה השלב האחרון: הערכת קריירה.","w":["","התקדמות היא ההתקרבות למטרה בזכות הפעולות. שרית עוצרת ובודקת, היא לא מתארת התקדמות.","חקר הוא איסוף מידע בתחילת התהליך. שרית בוחנת תהליך שכבר עשתה, אחרי משוב.","ביישום מבצעים את התוכנית. שרית לא מבצעת – היא שוקלת אם להמשיך."]},{"id":"c6-7","q":"לפי מודל גרינהאוס, אחרי שאדם מסיים את שלב הערכת הקריירה, הוא:","o":["מסיים את התהליך – המודל הוא קו ישר שנגמר בהערכה","עובר לשלב המשוב מהעבודה או מחוץ לעבודה","חוזר לשלב יישום האסטרטגיה בלבד","חוזר לשלב חקר הקריירה, והמעגל מתחיל מחדש"],"a":3,"why":"המודל הוא מעגל. ההערכה מזינה חקר חדש: אוספים מידע מעודכן על עצמי ועל הסביבה, וממשיכים.","w":["המודל אינו קו ישר – הוא מתחדש כל הזמן.","המשוב מגיע לפני ההערכה, לא אחריה.","אחרי ההערכה חוזרים לתחילת המעגל, לא ישר ליישום.",""]},{"id":"c6-8","q":"נועם עובד כאנליסט במחלקת הכספים ורוצה להיות מנהל מערך הנתונים בחברה. לשם כך נרשם ללימודי תואר שני במדעי הנתונים. על פי מודל ניהול הקריירה של גרינהאוס, באיזו אסטרטגיה מדובר?","o":["שיפור ביצועים בעבודה הנוכחית","הרחבת מעורבות בעבודה","פיתוח מיומנויות וכישורים","פיתוח הזדמנויות"],"a":2,"why":"לימודים לתואר הם הכשרה שמוסיפה ידע ויכולות – אסטרטגיית פיתוח מיומנויות וכישורים.","w":["שיפור ביצועים הוא להצטיין בתפקיד הנוכחי. נועם לומד משהו חדש לתפקיד עתידי.","הרחבת מעורבות היא השקעת זמן מעבר לנדרש בעבודה (שעות נוספות). כאן מדובר בלימודים.","","פיתוח הזדמנויות הוא חשיפה, קשרים וסיפור למנהלים על הרצונות. נועם לומד."]},{"id":"c6-9","q":"ליהי עובדת בשירות לקוחות ורוצה לעבור למחלקת השיווק. היא סיפרה למנהלת שלה על הרצון שלה, הגיעה לכנס פנים-ארגוני כדי להכיר את אנשי השיווק, והתנדבה לפרויקט משותף עם מחלקת השיווק כדי שיכירו אותה. לפי מודל גרינהאוס, ליהי נוקטת באסטרטגיה של:","o":["פיתוח הזדמנויות","פוליטיקה ארגונית","בניית תדמית של הצלחה","פיתוח מנטור ובריתות תומכות"],"a":0,"why":"ליהי חושפת את הרצונות שלה, בונה קשרים (נטוורקינג) ומחפשת חשיפה לתפקיד הרצוי. אלה הסימנים של פיתוח הזדמנויות.","w":["","פוליטיקה ארגונית היא שימוש ביחסי כוח ובבריתות כדי להשיג יתרון. ליהי פשוט מייצרת לעצמה אפשרויות.","תדמית של הצלחה היא לדאוג שיראו אותך כמצליח. ליהי לא מציגה הישגים; היא מספרת מה היא רוצה ונחשפת.","אין כאן אדם ותיק שמלווה אותה ומלמד אותה."]},{"id":"c6-10","q":"אבי, מהנדס תהליך, רוצה להיות מנהל המפעל. הוא נשאר בעבודה בערבים ובשבתות הרבה מעבר לשעות שבחוזה, נפגש פעם בשבועיים עם סמנכ״ל התפעול הוותיק שמלמד אותו ומעודד אותו, ומקפיד שהנהלת המפעל תשמע על כל הצלחה שלו – הוא אף התחיל להתלבש ולדבר כמו המנהלים. מהתיאור עולה כי אבי נקט באסטרטגיות הקריירה הבאות:","o":["פיתוח מיומנויות וכישורים, פיתוח מנטור, פוליטיקה ארגונית","הרחבת מעורבות בעבודה, פיתוח מנטור, בניית תדמית של הצלחה","שיפור ביצועים בעבודה הנוכחית, פיתוח הזדמנויות, בניית תדמית של הצלחה","הרחבת מעורבות בעבודה, פיתוח הזדמנויות, פוליטיקה ארגונית"],"a":1,"why":"שעות נוספות מעבר לחוזה = הרחבת מעורבות. סמנכ״ל ותיק שמלמד ומעודד = פיתוח מנטור. לדאוג שישמעו על ההצלחות ולהיראות כמו מנהל = בניית תדמית של הצלחה.","w":["אבי לא לומד בקורס או בתואר, ולכן אין כאן פיתוח מיומנויות.","","אין בסיפור שיפור של התפוקה בתפקיד הנוכחי, ואין חשיפת רצונות או נטוורקינג.","השעות הנוספות נכונות, אבל הסמנכ״ל הוא מנטור (לא פיתוח הזדמנויות), והצגת ההצלחות היא תדמית (לא פוליטיקה)."]},{"id":"c6-11","q":"אפרת היא סוכנת מכירות. היא רוצה להתקדם, ולכן התמקדה בשנה האחרונה בעבודה שלה: הקפידה על כל שיחה, שיפרה את אחוז הסגירה, הפחיתה טעויות בהזמנות ועקפה את יעדי המכירות. לפי מודל גרינהאוס, אפרת נוקטת באסטרטגיה של:","o":["פיתוח מיומנויות וכישורים","בניית תדמית של הצלחה","שיפור ביצועים בעבודה הנוכחית","הרחבת מעורבות בעבודה"],"a":2,"why":"אפרת משפרת את התוצאות בתפקיד שהיא כבר עושה – יותר סגירות, פחות טעויות, עקיפת יעדים. זה שיפור ביצועים בעבודה הנוכחית.","w":["היא לא יצאה לקורס או ללימודים.","היא לא עוסקת בהצגת ההצלחות שלה לאחרים, אלא בשיפור העבודה עצמה.","","הסיפור לא מדבר על שעות נוספות או השקעה מעבר לנדרש, אלא על איכות העבודה."]},{"id":"c6-12","q":"ליעד שם לעצמו מטרה: ״אני רוצה להיות מנהל המוצר של אפליקציית התשלומים בחברה שלנו״. לפי סוגי מטרות הקריירה, ליעד הציב לעצמו מטרה:","o":["מושגית/קונספטואלית","אקספרסיבית/ביטוי עצמי","ריאלית","אופרטיבית"],"a":3,"why":"ליעד מציין תפקיד ספציפי ומוגדר (מנהל מוצר של אפליקציה מסוימת). מטרה שהיא משרה מסוימת = אופרטיבית.","w":["מושגית מתארת את סוג הסביבה והחוויות (חופש פעולה, שעות נוחות), לא תפקיד מסוים.","הסיפור לא אומר שהתפקיד מהנה לו בפני עצמו; הוא רק מגדיר משרה.","\"מטרה ריאלית\" אינה סוג מטרה במודל – מסיח.",""]},{"id":"c6-13","q":"גל אומרת ליועצת הקריירה: ״אני מחפשת עבודה שתהיה קרובה לבית, עם שעות גמישות, אווירה של צוות ומנהל שנותן אמון ולא עומד לי על הראש״. לפי סוגי מטרות הקריירה, גל הציבה לעצמה מטרה:","o":["מושגית/קונספטואלית","אופרטיבית","אינסטרומנטלית","לטווח ארוך"],"a":0,"why":"גל מתארת את סוג הסביבה והחוויות שהיא רוצה, בלי לציין תפקיד מסוים. רשימת תנאים כזו = מטרה מושגית/קונספטואלית.","w":["","אופרטיבית היא משרה ספציפית. גל לא נקבה בשום תפקיד.","אינסטרומנטלית היא אמצעי להשגת מטרה אחרת. גל לא מתארת את העבודה כקרש קפיצה.","אין בסיפור רמז לטווח הזמן של המטרה."]},{"id":"c6-14","q":"הדס, אחות במחלקה פנימית, רוצה להיות האחות האחראית במחלקה. היא אומרת: ״התפקיד עצמו לא מושך אותי במיוחד, אבל בלעדיו לא אוכל להגיע אף פעם להנהלת הסיעוד של בית החולים״. לפי סוגי מטרות הקריירה, המטרה של הדס היא:","o":["אקספרסיבית/ביטוי עצמי","אינסטרומנטלית","מושגית/קונספטואלית","אקספרסיבית/ביטוי עצמי ואינסטרומנטלית"],"a":1,"why":"התפקיד הוא אמצעי בלבד – שלב בדרך להנהלת הסיעוד – והדס אומרת במפורש שהוא לא מושך אותה בפני עצמו. אמצעי להשגת מטרה אחרת = אינסטרומנטלית.","w":["אקספרסיבית היא מטרה מהנה ומספקת בפני עצמה. הדס אומרת שהתפקיד לא מושך אותה.","","מושגית מתארת סביבה וחוויות רצויות. הדס מדברת על תפקיד מסוים כאמצעי.","אין כאן הנאה מהתפקיד עצמו, ולכן זו לא גם אקספרסיבית."]},{"id":"c6-15","q":"ערן, מתכנת, רוצה ללמד תכנות בהתנדבות בערבים. ״אני פשוט נהנה ללמד, זה ממלא אותי״, הוא אומר, ״וזה גם יעזור לי להיכנס לתחום ההייטק החינוכי, שאליו אני רוצה לעבור בעתיד״. שאיפה זו מבטאת:","o":["מטרה מושגית","מטרה ריאלית","מטרה אקספרסיבית/ביטוי עצמי ומטרה אינסטרומנטלית","מטרה אינסטרומנטלית"],"a":2,"why":"יש כאן שני רמזים: ״נהנה, זה ממלא אותי״ = אקספרסיבית; ״יעזור לי להיכנס לתחום שאליו אני רוצה לעבור״ = אינסטרומנטלית (אמצעי). מטרה יכולה להיות גם וגם.","w":["מושגית היא רשימת תנאים לסביבת עבודה. ערן מתאר פעילות מהנה שהיא גם אמצעי.","\"מטרה ריאלית\" אינה סוג מטרה במודל – מסיח.","","התשובה חלקית: היא מתעלמת מכך שערן נהנה מההוראה עצמה (אקספרסיבית)."]}]},{"id":"c7","title":"קבלת החלטות בקריירה","short":"קבלת החלטות","blurb":"שלושת סגנונות קבלת ההחלטות של פיליפס ושמונת סגנונות הקבלה ואי-הקבלה של החלטות של דינקלייג', עם המשפט הפנימי של כל סגנון.","mnemonic":"פיליפס = ראש, בטן, אחרים (רציונלי, אינטואיטיבי, תלוי). דינקלייג' = 8 משפטים בראש: \"אשקול ואחליט\", \"עוד מידע...\", \"מחר\", \"קפאתי\", \"העיקר מהר\", \"מרגיש נכון\", \"מה שיהיה יהיה\", \"שיחליטו בשבילי\".","blocks":[{"t":"h","x":"למה צריך את זה?"},{"t":"p","x":"כל אדם מקבל החלטות קריירה בדרך אחרת: יש מי שמחשב, יש מי שהולך עם הבטן, ויש מי שנותן לאחרים להחליט. בקורס יש <b>שני מודלים</b>: <b>פיליפס</b> (3 סגנונות) ו<b>דינקלייג'</b> (8 סגנונות)."},{"t":"p","x":"במבחן מתארים איך אדם בחר עבודה או מקצוע (או מה הוא אמר לעצמו), ושואלים מה הסגנון שלו לפי אחד המודלים."},{"t":"h","x":"פיליפס (Phillips) – 3 סגנונות"},{"t":"table","head":["קטגוריה","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>רציונלי</b>","שיטתי והגיוני. אוסף מידע ומשווה חלופות לפי קריטריונים.","טבלה, השוואה לפי פרמטרים (שכר, קידום, מרחק מהבית, תנאים), שקילת יתרונות וחסרונות.","חנן משווה שלוש הצעות עבודה לפי שכר, קידום, קרבה לבית ותנאים סוציאליים."],["<b>אינטואיטיבי</b>","מחליט לפי תחושת בטן, רגש ודמיון.","\"הרגשתי שזה נכון\", \"התאהבתי במקום\", \"דמיינתי את עצמי שם\", בלי השוואה מסודרת.","עומר נכנס למשרד והרגיש מיד בבית, ובחר בו."],["<b>תלוי</b>","נותן לאחרים (הורים, חברים, בן זוג) להחליט, ומעביר אליהם את האחריות.","\"ההורים רצו ש...\", \"כדי לרצות את...\", \"אם לא יצליח – זו אשמתם\".","ליאב למד רפואה כי ההורים חלמו שיהיה מנתח."]]},{"t":"steps","title":"איך מזהים סגנון לפי פיליפס","x":["<b>מי</b> קיבל את ההחלטה? אם אחרים (הורים, דוד, בן זוג) → <b>תלוי</b>.","אם האדם החליט בעצמו – <b>איך</b>? השוואה מסודרת לפי קריטריונים → <b>רציונלי</b>.","החליט בעצמו לפי תחושה, רגש או דמיון, בלי השוואה → <b>אינטואיטיבי</b>."]},{"t":"example","title":"רציונלי (בסגנון שאלה 20 במבחן לדוגמה)","x":"חנן התקבל לשלוש חברות. הוא השווה את ההצעות לפי גובה השכר, אפשרויות קידום, קרבה לבית ותנאים סוציאליים → <b>רציונלי</b>."},{"t":"example","title":"תלוי (בסגנון שאלה 10 במבחן לדוגמה)","x":"ההורים של ליאב חלמו שיהיה מנתח לב. ליאב פעל כדי לרצות אותם ונרשם לרפואה. רק בסוף ההתמחות גילה שזה לא מתאים לו → בתחילת הקריירה הסגנון שלו היה <b>תלוי</b>."},{"t":"trap","x":"<b>\"אמוציונלי\" ו\"רגשי\" אינם סגנונות במודל של פיליפס</b> – הם מסיחים. מי שמחליט לפי רגש ובטן = <b>אינטואיטיבי</b> (שאלות 10 ו-20 במבחן לדוגמה)."},{"t":"trap","x":"מי שבחר לפי ההורים אבל <b>גם</b> נרשם ללימודים מסודרים – עדיין <b>תלוי</b>. השאלה היא <b>מי קיבל את ההחלטה</b>, לא כמה מסודר היה התהליך."},{"t":"h","x":"דינקלייג' (Dinklage) – 8 סגנונות של קבלה ואי-קבלה של החלטות"},{"t":"p","x":"דינקלייג' מתארת 8 סגנונות. חלקם הם בעצם <b>הימנעות</b> מהחלטה (למשל לדחות או לקפוא). הדרך הכי קלה לזהות: <b>המשפט שהאדם אומר לעצמו</b>."},{"t":"table","head":["סגנון","מה זה אומר","המשפט הפנימי","דוגמה"],"rows":[["<b>תכנוני</b>","מאוזן ושיטתי: אוסף מידע במידה, שוקל, ומחליט.","\"אבדוק את האפשרויות, אשקול יתרונות וחסרונות ואחליט.\"","ניר רשם את האפשרויות, בדק כל אחת ובחר תוך שבועיים."],["<b>מתייסר / מתלבט</b>","אוסף מידע בלי סוף, מוצף, ולא מצליח להחליט.","\"צריך עוד קצת מידע... ועוד השוואה אחת... ככל שאני קורא אני מבולבל יותר.\"","שני קוראת כל ערב עוד ביקורות ועוד פורומים ולא בוחרת."],["<b>דוחה</b>","יודע שצריך להחליט אבל דוחה למועד מאוחר יותר.","\"אחשוב על זה מחר / אחרי החגים / בסמסטר הבא.\"","בר דוחה שוב ושוב את ההרשמה ללימודים."],["<b>משותק</b>","מבין שצריך להחליט, אבל קופא ולא מסוגל.","\"אני יודע שאני חייב להחליט, אבל אני פשוט לא מסוגל. זה משתק אותי.\"","דנה מול שתי הצעות, יודעת שמחר הדדליין, ולא מצליחה לעשות כלום."],["<b>אימפולסיבי</b>","מחליט מהר, בלי לבדוק, כדי להיפטר מהלחץ.","\"העיקר להחליט מהר ושההתלבטות תיגמר.\"","אור לקח את ההצעה הראשונה שהגיעה, רק כדי שזה ייגמר."],["<b>אינטואיטיבי</b>","מחליט לפי תחושה פנימית.","\"זה מרגיש לי נכון, אני לא יודע להסביר למה.\"","טל בחרה במשרה כי ״משהו בפנים אמר לה שזה זה״."],["<b>פאטליסטי</b>","משאיר את ההחלטה לגורל ולמזל.","\"מה שיהיה יהיה. אם זה נועד לי – זה יגיע.\"","קרן לא בוחרת ומחכה לראות ״מה הגורל יביא״."],["<b>צייתני</b>","מקבל את מה שאחרים מחליטים בשבילו.","\"מה שאבא / המנהל יחליט – בסדר מבחינתי.\"","יואב נרשם למקצוע שההורים בחרו לו."]]},{"t":"h","x":"זוגות שמתבלבלים ביניהם"},{"t":"table","head":["זוג","איך מבדילים"],"rows":[["אימפולסיבי מול אינטואיטיבי","אימפולסיבי מחליט מהר <b>כדי להיפטר מהלחץ</b>. אינטואיטיבי מחליט לפי <b>תחושה פנימית</b> שזה נכון."],["פאטליסטי מול צייתני","פאטליסטי משאיר את ההחלטה ל<b>גורל ומזל</b>. צייתני משאיר אותה ל<b>אנשים אחרים</b>."],["מתייסר מול משותק","מתייסר <b>עסוק כל הזמן באיסוף מידע</b> ומוצף. משותק <b>לא עושה כלום</b> – קפוא."],["מתייסר מול תכנוני","שניהם אוספים מידע. תכנוני <b>מגיע להחלטה</b>; מתייסר <b>לא מגיע</b>."],["דוחה מול משותק","דוחה אומר \"<b>אחר כך</b>\". משותק אומר \"<b>אני לא מסוגל</b>\"."]]},{"t":"trap","x":"<b>פיליפס מול דינקלייג':</b> אותו רעיון מופיע בשמות שונים. מי שנותן להורים להחליט = <b>תלוי</b> אצל פיליפס, אבל <b>צייתני</b> אצל דינקלייג'. בדקו את שם המודל בשאלה!"},{"t":"trap","x":"\"אינטואיטיבי\" קיים <b>בשני</b> המודלים. \"רציונלי\" ו\"תלוי\" קיימים רק אצל פיליפס. \"פאטליסטי\", \"אימפולסיבי\", \"צייתני\" ושאר השמות קיימים רק אצל דינקלייג'."},{"t":"example","title":"בסגנון שאלה 21 במבחן לדוגמה","x":"\"מה שיהיה יהיה, אקווה למזל טוב\" = <b>פאטליסטי</b>. \"אקבל החלטה מהירה, העיקר שההתלבטות תפסיק להציק לי\" = <b>אימפולסיבי</b>."},{"t":"steps","title":"איך פותרים שאלה כזו","x":["בדקו את שם המודל: פיליפס (3) או דינקלייג' (8)?","מצאו בסיפור את המשפט שהאדם אומר לעצמו, או מי ומה הכריע.","התאימו למשפט הפנימי מהטבלה.","פסלו מסיחים: \"אמוציונלי\"/\"רגשי\" לא קיימים בפיליפס."]},{"t":"exam","x":"איך שואלים: \"ע״פ המודל של Phillips ניתן לאפיין את סגנון קבלת ההחלטות של X כ-\" או \"ע״פ המודל של דינקלייג', הסגנון של X הוא ___ והסגנון של Y הוא ___\"."}],"cheat":["פיליפס = 3: רציונלי (ראש), אינטואיטיבי (בטן), תלוי (אחרים).","השוואה לפי פרמטרים = רציונלי.","לרצות את ההורים = תלוי (פיליפס).","\"אמוציונלי\" / \"רגשי\" = מסיחים!","דינקלייג' = 8 סגנונות, מזהים לפי המשפט הפנימי.","\"אשקול ואחליט\" = תכנוני.","\"עוד מידע... ועוד...\" = מתייסר/מתלבט.","\"מחר / אחרי החגים\" = דוחה.","\"חייב אבל לא מסוגל\" = משותק.","\"העיקר להחליט מהר\" = אימפולסיבי.","\"מרגיש לי נכון\" = אינטואיטיבי.","\"מה שיהיה יהיה\" = פאטליסטי.","\"שיחליטו בשבילי\" = צייתני.","הורים מחליטים: פיליפס = תלוי; דינקלייג' = צייתני."],"mcq":[{"id":"c7-1","q":"שירה קיבלה שתי הצעות עבודה כמהנדסת. היא בנתה טבלה, נתנה ציון לכל הצעה לפי שכר, אפשרויות קידום, זמן נסיעה ואופי הצוות, וחישבה איזו הצעה קיבלה את הציון הגבוה ביותר. ע״פ המודל של פיליפס (Phillips), סגנון קבלת ההחלטות של שירה הוא:","o":["תלוי","אינטואיטיבי","אמוציונלי","רציונלי"],"a":3,"why":"שירה אוספת מידע ומשווה את החלופות לפי קריטריונים בצורה שיטתית (טבלה וציונים). זה הסגנון הרציונלי.","w":["אף אחד אחר לא החליט בשבילה; היא עשתה את ההשוואה בעצמה.","אינטואיטיבי מחליט לפי תחושת בטן. שירה חישבה ציונים.","\"אמוציונלי\" אינו סגנון במודל של פיליפס – מסיח.",""]},{"id":"c7-2","q":"עומר התלבט בין שני משרדי אדריכלים. כשנכנס לראיון במשרד הקטן, הרגיש מיד ״בבית״ ודמיין את עצמו עובד שם. הוא לא השווה בין התנאים והודיע שהוא בוחר בו. ע״פ המודל של פיליפס, סגנון קבלת ההחלטות של עומר הוא:","o":["אינטואיטיבי","רציונלי","תלוי","רגשי"],"a":0,"why":"עומר החליט לפי תחושה ודמיון (״הרגיש בבית״, ״דמיין את עצמו שם״) ובלי השוואה מסודרת. זה הסגנון האינטואיטיבי.","w":["","עומר לא השווה בין חלופות לפי קריטריונים.","אף אחד אחר לא החליט בשבילו.","\"רגשי\" אינו סגנון במודל של פיליפס – מסיח. החלטה לפי רגש ותחושה נקראת אינטואיטיבית."]},{"id":"c7-3","q":"נטע בחרה ללמוד ראיית חשבון כי דודה שלה, רואה חשבון מצליח, אמר לה שזה ״המקצוע הכי בטוח״. ״אם זה לא יצליח, לפחות לא אני אשמה״, היא אמרה לחברה. ע״פ המודל של Phillips, ניתן לאפיין את סגנון קבלת ההחלטות של נטע כ-","o":["רציונלי","אמוציונלי","תלוי","אינטואיטיבי"],"a":2,"why":"נטע נתנה לדוד שלה להחליט ומעבירה אליו את האחריות (״לא אני אשמה״). זה הסגנון התלוי.","w":["נטע לא אספה מידע ולא השוותה חלופות בעצמה.","\"אמוציונלי\" אינו סגנון במודל של פיליפס – מסיח.","","נטע לא החליטה לפי תחושת בטן שלה, אלא לפי מה שאדם אחר אמר."]},{"id":"c7-4","q":"יואב נרשם ללימודי משפטים כי הוריו החליטו שזה המקצוע המתאים לו. הוא עצמו לא בדק אפשרויות אחרות. לפי המודל של פיליפס סגנון קבלת ההחלטות של יואב הוא ______, ולפי המודל של דינקלייג' הסגנון שלו הוא ______.","o":["רציונלי, תכנוני","תלוי, צייתני","תלוי, פאטליסטי","אינטואיטיבי, צייתני"],"a":1,"why":"ההורים החליטו ויואב קיבל. אצל פיליפס זה נקרא תלוי, ואצל דינקלייג' זה נקרא צייתני – אותו רעיון בשני שמות.","w":["יואב לא אסף מידע ולא שקל חלופות.","","תלוי נכון, אבל פאטליסטי הוא השארת ההחלטה לגורל ולמזל, לא לאנשים אחרים.","צייתני נכון, אבל יואב לא החליט לפי תחושת בטן שלו – אחרים החליטו."]},{"id":"c7-5","q":"יועצת קריירה ליוותה את בר ואת דנה. בר אמרה לעצמה: ״אני אחשוב על זה אחרי החגים, עכשיו זה לא הזמן״. דנה אמרה לעצמה: ״אני יודעת שאני חייבת להחליט עד מחר, אבל אני פשוט קופאת ולא מסוגלת לעשות כלום״. ע״פ המודל של דינקלייג' (Dinklage), הסגנון של בר הוא ____ והסגנון של דנה הוא ____.","o":["דוחה, משותק","משותק, דוחה","פאטליסטי, מתייסר","דוחה, אימפולסיבי"],"a":0,"why":"״אחשוב על זה אחרי החגים״ = דחייה למועד מאוחר = דוחה. ״חייבת להחליט אבל קופאת ולא מסוגלת״ = משותק.","w":["","זה הפוך: בר דוחה ודנה משותקת.","בר לא משאירה את ההחלטה לגורל, ודנה לא אוספת מידע בלי סוף – היא קפואה.","בר אכן דוחה, אבל דנה לא מחליטה מהר – היא לא מחליטה בכלל."]},{"id":"c7-6","q":"שני מתלבטת באיזה תואר לבחור. כל ערב היא קוראת עוד ביקורות, עוד פורומים ועוד דירוגים של מוסדות. ״ככל שאני אוספת יותר מידע, אני מבולבלת יותר, ותמיד נראה לי שחסר עוד משהו״, היא אומרת, ועדיין לא בחרה. ע״פ המודל של דינקלייג', הסגנון של שני הוא:","o":["תכנוני","משותק","מתייסר/מתלבט","דוחה"],"a":2,"why":"שני אוספת מידע בלי סוף, מוצפת, ולא מגיעה להחלטה. זה הסגנון המתייסר/המתלבט.","w":["גם התכנוני אוסף מידע, אבל הוא מגיע להחלטה. שני לא מגיעה.","המשותק קפוא ולא עושה כלום. שני פעילה מאוד באיסוף מידע.","","הדוחה אומר ״אחר כך״. שני עסוקה בזה כל ערב, היא לא דוחה."]},{"id":"c7-7","q":"אור חיפש עבודה כבר חודשיים והרגיש לחץ גדול. כשהגיעה ההצעה הראשונה, הוא קיבל אותה מיד, בלי לבדוק את התנאים. ״העיקר שזה נגמר ואני לא צריך להתלבט יותר״, אמר. ע״פ המודל של דינקלייג', הסגנון של אור הוא:","o":["אינטואיטיבי","פאטליסטי","צייתני","אימפולסיבי"],"a":3,"why":"אור החליט מהר ובלי בדיקה כדי להיפטר מהלחץ (״העיקר שזה נגמר״). זה הסגנון האימפולסיבי.","w":["אינטואיטיבי מחליט לפי תחושה פנימית שזה נכון. אור החליט כדי שהלחץ ייגמר, לא כי הרגיש שזה נכון.","פאטליסטי משאיר את ההחלטה לגורל. אור החליט בעצמו, ומהר.","צייתני מקבל את מה שאחרים מחליטים. אור החליט לבד.",""]},{"id":"c7-8","q":"ניר קיבל הצעה לעבור לתפקיד חדש. הוא רשם את האפשרויות, אסף מידע על כל אחת בתוך שבוע, שקל יתרונות וחסרונות והחליט. ע״פ המודל של דינקלייג', הסגנון של ניר הוא:","o":["תכנוני","מתייסר/מתלבט","אימפולסיבי","אינטואיטיבי"],"a":0,"why":"ניר פועל בצורה מאוזנת ושיטתית: אוסף מידע במידה, שוקל ומחליט. זה הסגנון התכנוני.","w":["","המתייסר אוסף מידע בלי סוף ולא מחליט. ניר החליט אחרי שבוע.","האימפולסיבי מחליט מהר בלי לבדוק. ניר בדק ושקל.","ניר לא החליט לפי תחושה פנימית אלא לפי שקילה מסודרת."]},{"id":"c7-9","q":"טל קיבלה שתי הצעות כמעט זהות בתנאים. ״אני לא יודעת להסביר למה, אבל משהו בפנים אומר לי שהחברה הקטנה היא המקום שלי״, אמרה, ובחרה בה בשקט. ע״פ המודל של דינקלייג', הסגנון של טל הוא:","o":["אימפולסיבי","אינטואיטיבי","פאטליסטי","תכנוני"],"a":1,"why":"טל מחליטה לפי תחושה פנימית שהיא לא יודעת להסביר (״משהו בפנים אומר לי״). זה הסגנון האינטואיטיבי.","w":["האימפולסיבי מחליט מהר כדי להיפטר מלחץ. טל לא בלחץ – היא סומכת על התחושה.","","הפאטליסטי משאיר את ההחלטה לגורל. טל מחליטה בעצמה.","התכנוני שוקל יתרונות וחסרונות. טל לא עשתה שקילה כזו."]},{"id":"c7-10","q":"קרן התקבלה לשני תפקידים ולא בחרה באף אחד. ״אם התפקיד בחברה הגדולה נועד לי, הם יתקשרו שוב. מה שצריך לקרות – יקרה״, אמרה לחברתה. ע״פ המודל של דינקלייג', הסגנון של קרן הוא:","o":["צייתני","דוחה","משותק","פאטליסטי"],"a":3,"why":"קרן משאירה את ההחלטה לגורל (״מה שצריך לקרות – יקרה״, ״אם זה נועד לי״). זה הסגנון הפאטליסטי.","w":["צייתני משאיר את ההחלטה לאנשים אחרים. קרן משאירה אותה לגורל.","הדוחה מתכוון להחליט בעצמו אחר כך. קרן לא מתכוונת להחליט בכלל.","המשותק רוצה להחליט ולא מסוגל. קרן לא מנסה – היא סומכת על הגורל.",""]},{"id":"c7-11","q":"מנהל משאבי האנוש הציע למירב לעבור לאחד משני סניפים. מירב אמרה לו: ״מה שאתה תחליט מתאים לי, אתה יודע יותר טוב ממני״. ע״פ המודל של דינקלייג', הסגנון של מירב הוא:","o":["פאטליסטי","צייתני","דוחה","תלוי"],"a":1,"why":"מירב מקבלת את מה שאדם אחר (המנהל) יחליט בשבילה. בשמות של דינקלייג' זה הסגנון הצייתני.","w":["פאטליסטי משאיר את ההחלטה לגורל ולמזל, לא לאדם אחר.","","מירב לא דוחה את ההחלטה – היא מוסרת אותה למנהל.","\"תלוי\" הוא שם הסגנון אצל פיליפס, לא אצל דינקלייג'. השאלה שואלת על דינקלייג'."]},{"id":"c7-12","q":"יועץ קריירה ראיין את גיל ואת רותם, שהתלבטו בין משרות. גיל אמר: ״אני אבדוק כל הצעה, אשווה ואחליט עד סוף החודש״. רותם אמרה: ״אני לא מתכוונת לבחור. אם זה נועד לי, זה יגיע״. ע״פ המודל של דינקלייג', הסגנון של גיל הוא ____ והסגנון של רותם הוא ____.","o":["מתייסר, פאטליסטי","תכנוני, צייתני","תכנוני, פאטליסטי","אינטואיטיבי, דוחה"],"a":2,"why":"גיל בודק, משווה ומחליט בזמן סביר = תכנוני. רותם משאירה את ההחלטה לגורל (״אם זה נועד לי״) = פאטליסטי.","w":["גיל מתכנן להגיע להחלטה עד סוף החודש, ולכן הוא לא מתייסר.","רותם לא נותנת לאנשים אחרים להחליט, ולכן היא לא צייתנית.","","גיל לא מחליט לפי תחושה, ורותם לא אומרת ״אחר כך״ – היא סומכת על הגורל."]},{"id":"c7-13","q":"דפנה מספרת: ״לא עשיתי שום השוואה. ברגע שראיתי את הסטודיו לעיצוב הרגשתי התרגשות, הלב אמר לי שזה המקום, ולכן בחרתי ללמוד שם״. ע״פ המודל של פיליפס, סגנון קבלת ההחלטות של דפנה הוא:","o":["אמוציונלי","רציונלי","תלוי","אינטואיטיבי"],"a":3,"why":"דפנה החליטה לפי רגש ותחושת בטן (״הלב אמר לי״), בלי השוואה. אצל פיליפס הסגנון הזה נקרא אינטואיטיבי.","w":["\"אמוציונלי\" נשמע מתאים, אבל הוא אינו סגנון במודל של פיליפס – מסיח.","דפנה אומרת במפורש שלא עשתה השוואה.","אף אחד אחר לא החליט בשבילה.",""]},{"id":"c7-14","q":"בר רוצה ללמוד תואר ראשון. במשך שלושה סמסטרים ברציפות הוא אמר לעצמו: ״אני אסגור את זה בסמסטר הבא, עכשיו יש לי יותר מדי דברים על הראש״. ע״פ המודל של דינקלייג', הסגנון של בר הוא:","o":["דוחה","משותק","פאטליסטי","מתייסר/מתלבט"],"a":0,"why":"בר מעביר את ההחלטה שוב ושוב למועד מאוחר יותר (״בסמסטר הבא״). זה הסגנון הדוחה.","w":["","המשותק אומר ״אני לא מסוגל״. בר אומר ״אחר כך״.","בר לא משאיר את ההחלטה לגורל; הוא מתכוון להחליט בעצמו – רק לא עכשיו.","המתייסר אוסף מידע בלי סוף. בר לא עוסק באיסוף מידע; הוא פשוט דוחה."]}]},{"id":"c8","title":"רשתות קשרים ופוליטיקה ארגונית","short":"קשרים ופוליטיקה","blurb":"שלוש רשתות הקשרים של Lineback & Hill (טקטית, אסטרטגית, אישית) וארבע החיות של James & Baddeley בפוליטיקה ארגונית.","mnemonic":"רשתות: טקטית = היום (העבודה השוטפת), אסטרטגית = המחר (כיוון ועתיד), אישית = אני (תמיכה והתפתחות). חיות: ינשוף = חכם וישר, שועל = חכם ולא ישר, כבשה = ישרה ולא קוראת את המפה, פרד = לא קורא ולא ישר.","blocks":[{"t":"h","x":"נטוורקינג – מה זה?"},{"t":"p","x":"<b>נטוורקינג</b> הוא בנייה ושמירה של קשרים עם אנשים שיכולים לעזור לנו בעבודה ובקריירה, ושאנחנו יכולים לעזור להם. זה לא רק \"להכיר אנשים\" – זה לבנות אמון לאורך זמן."},{"t":"p","x":"במודל של גרינהאוס, נטוורקינג הוא חלק מהאסטרטגיה <b>פיתוח הזדמנויות</b>."},{"t":"h","x":"שלוש רשתות הקשרים של Lineback & Hill"},{"t":"p","x":"לפי Lineback & Hill, למנהל ולעובד כדאי לבנות <b>שלוש רשתות</b> שונות. כל רשת עונה על שאלה אחרת: <b>למה אני צריך את הקשר הזה?</b>"},{"t":"table","head":["קטגוריה","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>הטקטית</b>","קשרים <b>בתוך הארגון</b> עם אנשים שאני תלוי בהם לעבודה השוטפת ולשיתופי פעולה.","מנהלים של מחלקות אחרות, עמיתים שעובדים איתי, \"כדי לקדם שיתופי פעולה\", \"כדי שהעבודה תזרום\".","מנהלת שיווק חדשה בונה קשר עם מנהל התפעול בחברה כדי לקדם שיתופי פעולה עתידיים."],["<b>האסטרטגית</b>","קשרים שעוזרים <b>לראות את העתיד</b> ולהשפיע על הכיוון. לרוב מחוץ ליחידה או לארגון.","כנסים בתעשייה, מובילי דעה, מנהלים בכירים בחברות אחרות, \"להבין לאן השוק הולך\", \"לקבוע כיוון\".","ראש מחלקת פיתוח נפגשת עם מובילי התעשייה כדי להבין מגמות ולכוון את היחידה שלה."],["<b>האישית</b>","קשרים לטובת <b>התמיכה, הייעוץ וההתפתחות האישית</b> שלי.","חברים למקצוע, פורום מקצועי, מרצה לשעבר, מאמן, \"לקבל עצה\", \"תמיכה בתקופה קשה\".","מנהלת מצטרפת לפורום נשים מנהלות כדי לקבל עצות ותמיכה."]]},{"t":"steps","title":"איך מזהים את הרשת","x":["הקשר נועד לעבודה <b>של היום</b> – לתאם, לשתף פעולה, שהעבודה תזוז? → <b>טקטית</b>.","הקשר נועד להבין <b>לאן העולם הולך</b> ולהשפיע על הכיוון של היחידה או הארגון? → <b>אסטרטגית</b>.","הקשר נועד <b>לי כאדם</b> – עצה, תמיכה, צמיחה אישית? → <b>אישית</b>."]},{"t":"trap","x":"<b>המילה \"עתידיים\" לא הופכת קשר לאסטרטגי.</b> קשר עם מנהל התפעול <b>באותה חברה</b> לצורך שיתופי פעולה = <b>הטקטית</b> (שאלה 14 במבחן לדוגמה). אסטרטגית = לראות את התמונה הגדולה ולקבוע כיוון."},{"t":"trap","x":"<b>\"המשולבת\" אינה רשת במודל</b> – מסיח. יש רק שלוש: טקטית, אסטרטגית, אישית."},{"t":"h","x":"פוליטיקה ארגונית – James & Baddeley"},{"t":"p","x":"<b>פוליטיקה ארגונית</b> היא הדרך שבה אנשים משיגים השפעה בארגון: מי תומך במי, למי יש כוח, איך מעבירים החלטות. James & Baddeley מתארים <b>ארבעה טיפוסים</b> ונותנים לכל אחד שם של חיה."},{"t":"p","x":"הטיפוסים נקבעים לפי <b>שני צירים</b>:"},{"t":"list","x":["<b>ציר 1 – קריאת המצב הפוליטי:</b> האם האדם <b>מודע</b> למפה הפוליטית (מי משפיע, מה האינטרסים) או <b>לא מודע</b>?","<b>ציר 2 – התנהלות:</b> האם האדם פועל מתוך <b>יושרה</b> (לטובת הארגון, בגלוי) או מתוך <b>אינטרס אישי</b> (לטובת עצמו)?"]},{"t":"table","head":["","יושרה (לטובת הארגון)","אינטרס אישי (לטובת עצמי)"],"rows":[["<b>מודע</b> – קורא את המצב הפוליטי","<b>הינשוף הנבון</b>","<b>השועל הערמומי</b>"],["<b>לא מודע</b> – לא קורא את המצב הפוליטי","<b>הכבשה נותנת האמון</b>","<b>הפרד הנחוש</b>"]]},{"t":"table","head":["קטגוריה","מה זה אומר","איך זה נראה בסיפור","דוגמה"],"rows":[["<b>הינשוף הנבון</b>","מבין את המפה הפוליטית ופועל ביושרה לטובת הארגון.","נפגש מראש עם בעלי העניין, מקשיב, בונה תמיכה, שקוף והוגן.","מנהלת שרוצה מערכת חדשה נפגשת לפני הישיבה עם כל מנהל, שומעת חששות ומתאימה את ההצעה."],["<b>השועל הערמומי</b>","מבין את המפה הפוליטית היטב ומנצל אותה לטובת עצמו.","מניפולציות, שמועות, לוקח קרדיט, מסתיר מידע, בריתות רק בשביל הקידום שלו.","עובד שמפיץ שמועות על מתחרה לתפקיד ומבטיח לכל מנהל משהו אחר."],["<b>הכבשה נותנת האמון</b>","פועלת ביושרה לטובת הארגון, אבל בתמימות – לא קוראת את המפה הפוליטית.","בטוחה שהעובדות וההיגיון ידברו בעד עצמם, מציגה טיעונים טובים, לא מגייסת תמיכה מראש – ונכשלת.","סמנכ״לית שמציגה בישיבה טיעונים משכנעים למיזוג שיטיב עם החברה, והצוות לא משתכנע."],["<b>הפרד הנחוש</b>","לא קורא את המפה הפוליטית ופועל לטובת עצמו.","עקשן, דוחף את האינטרס שלו בכוח ובגלוי, לא שם לב למי יש כוח, יוצר אויבים.","מנהל שמתעקש בכל ישיבה על תקציב גדול לצוות שלו, מרים את הקול ולא קולט שהמנכ״ל תומך בפרויקט אחר."]]},{"t":"trap","x":"<b>טיעונים טובים לטובת הארגון ≠ ינשוף.</b> אם האדם פעל לטובת הארגון אבל <b>לא הכין את הקרקע</b> פוליטית ונכשל – זו <b>הכבשה נותנת האמון</b> (שאלה 16 במבחן לדוגמה). הינשוף היה בונה תמיכה לפני הישיבה."},{"t":"trap","x":"<b>שועל מול ינשוף:</b> שניהם קוראים את המפה היטב. השאלה היא <b>בשביל מי</b>: ינשוף – בשביל הארגון, בגלוי; שועל – בשביל עצמו, בתחבולות."},{"t":"trap","x":"<b>כבשה מול פרד:</b> שניהם לא קוראים את המפה. כבשה – טובת הארגון, תמימה. פרד – טובת עצמו, עקשן."},{"t":"p","x":"טיפ: הינשוף והכבשה <b>ישרים</b>; השועל והפרד <b>דואגים לעצמם</b>. הינשוף והשועל <b>חכמים פוליטית</b>; הכבשה והפרד <b>לא</b>."},{"t":"exam","x":"איך שואלים: \"לפי Lineback & Hill, X פיתחה את הרשת ____\" (טקטית / אסטרטגית / משולבת / אישית), \"ע״פ James & Baddeley, סגנון הפוליטיקה הארגונית המאפיין את X הוא:\" (ארבע החיות)."},{"t":"example","title":"בסגנון המבחן","x":"סיפור: עובדת בונה קשר עם מנהל התפעול <b>באותה חברה</b> לשיתופי פעולה → <b>הטקטית</b>. סיפור: סמנכ״לית מציגה טיעונים מצוינים לטובת החברה, לא בונה תמיכה, וההצעה נדחית → <b>הכבשה נותנת האמון</b>."}],"cheat":["Lineback & Hill = 3 רשתות: טקטית, אסטרטגית, אישית.","טקטית = בתוך הארגון, עבודה שוטפת ושיתופי פעולה.","אסטרטגית = לראות את העתיד ולכוון, לרוב מחוץ ליחידה/לארגון.","אישית = תמיכה, עצה והתפתחות אישית.","קשר עם מנהל אחר באותה חברה לשיתוף פעולה = טקטית (גם אם \"עתידי\").","\"המשולבת\" = מסיח.","James & Baddeley: מודע/לא מודע × יושרה/אינטרס אישי.","ינשוף הנבון = מודע + יושרה.","שועל ערמומי = מודע + אינטרס אישי.","כבשה נותנת האמון = לא מודעת + יושרה (תמימה, טיעונים טובים, נכשלת).","פרד נחוש = לא מודע + אינטרס אישי (עקשן).","נטוורקינג בגרינהאוס = פיתוח הזדמנויות."],"mcq":[{"id":"c8-1","q":"שלומי מונה למנהל הרכש במפעל מזון. כבר בשבועות הראשונים קבע פגישות קבועות עם מנהל המחסנים ועם החשב של המפעל, שאיתם הוא עובד כל יום, כדי שההזמנות והתשלומים יזרמו בלי תקלות. לפי Lineback & Hill, שלומי פיתח את הרשת ____.","o":["האסטרטגית","הטקטית","האישית","המשולבת"],"a":1,"why":"מדובר בקשרים בתוך הארגון עם אנשים ששלומי תלוי בהם לעבודה השוטפת. זו הרשת הטקטית.","w":["הרשת האסטרטגית נועדה לראות את העתיד ולכוון. כאן המטרה היא שהעבודה היומיומית תזרום.","","הרשת האישית נועדה לתמיכה ולהתפתחות אישית. כאן מדובר בקשרי עבודה.","\"המשולבת\" אינה רשת במודל – מסיח."]},{"id":"c8-2","q":"עדי היא ראש מחלקת המחקר והפיתוח בחברת מכשור רפואי. היא מגיעה לכנסים בינלאומיים, נפגשת עם מנהלים בכירים בחברות אחרות ועם משקיעים כדי להבין לאן התחום הולך בשנים הקרובות, וכך לקבוע את הכיוון של המחלקה שלה. לפי Lineback & Hill, עדי מפתחת את הרשת ____.","o":["הטקטית","האישית","המשולבת","האסטרטגית"],"a":3,"why":"הקשרים הם לרוב מחוץ לארגון, ומטרתם לראות את העתיד ולהשפיע על הכיוון של המחלקה. זו הרשת האסטרטגית.","w":["הרשת הטקטית היא קשרים בתוך הארגון לעבודה השוטפת. עדי פונה החוצה כדי להבין מגמות.","הרשת האישית נועדה לתמיכה ולהתפתחות אישית. עדי מחפשת כיוון למחלקה.","\"המשולבת\" אינה רשת במודל – מסיח.",""]},{"id":"c8-3","q":"ירדן מנהלת צוות בפעם הראשונה ומרגישה בודדה בתפקיד. היא הצטרפה לפורום של מנהלות צעירות מחברות שונות, ונפגשת מדי פעם עם המרצה שלה מהתואר כדי לקבל עצות על ההתפתחות שלה ותמיכה בתקופה הקשה. לפי Lineback & Hill, ירדן פיתחה את הרשת ____.","o":["האישית","הטקטית","האסטרטגית","המשולבת"],"a":0,"why":"הקשרים נועדו לתמיכה, לעצה ולהתפתחות האישית של ירדן. זו הרשת האישית.","w":["","הקשרים לא קשורים לעבודה השוטפת עם עמיתים בארגון.","ירדן לא מחפשת להבין לאן התחום הולך או לקבוע כיוון לארגון; היא מחפשת תמיכה לעצמה.","\"המשולבת\" אינה רשת במודל – מסיח."]},{"id":"c8-4","q":"טל התחילה לעבוד כמנהלת משאבי אנוש בחברת תעשייה. כבר בחודש הראשון יצרה קשר טוב עם מנהל הייצור בחברה, מתוך מטרה לבנות איתו בעתיד תוכניות הדרכה משותפות לעובדי הייצור. לפי Lineback & Hill, טל פיתחה את הרשת ____.","o":["האסטרטגית","המשולבת","הטקטית","האישית"],"a":2,"why":"זה קשר בתוך הארגון עם מנהל של מחלקה אחרת, לצורך שיתוף פעולה בעבודה. זו הרשת הטקטית – גם אם שיתוף הפעולה הוא בעתיד.","w":["המילה ״בעתיד״ היא המלכודת. הרשת האסטרטגית נועדה לראות את התמונה הגדולה ולכוון את הארגון, לא לשיתוף פעולה עם עמית.","\"המשולבת\" אינה רשת במודל – מסיח.","","הקשר לא נועד לתמיכה או להתפתחות האישית של טל, אלא לעבודה."]},{"id":"c8-5","q":"גיל, מנהל מחסן, נפגש כל שבוע עם מנהלת הלוגיסטיקה בחברה כדי לתאם משלוחים. בנוסף, בתקופה האחרונה, שבה הוא שוקל לעבור תפקיד, הוא נפגש עם חבר ותיק שהוא מאמן קריירה, כדי לקבל עצה ותמיכה. לפי Lineback & Hill, גיל מפתח את הרשתות ____ ו-____.","o":["האסטרטגית, האישית","הטקטית, האסטרטגית","הטקטית, המשולבת","הטקטית, האישית"],"a":3,"why":"התיאום עם מנהלת הלוגיסטיקה בחברה לעבודה השוטפת = טקטית. הפגישות עם החבר לקבלת עצה ותמיכה = אישית.","w":["התיאום השבועי בחברה הוא עבודה שוטפת, לא ראייה של העתיד – לכן זו לא אסטרטגית.","הפגישה עם החבר נועדה לתמיכה אישית, לא לקביעת כיוון לארגון.","\"המשולבת\" אינה רשת במודל – מסיח.",""]},{"id":"c8-6","q":"מיכל, מנהלת הכספים, רוצה להכניס מערכת תקציב חדשה שתחסוך לחברה כסף רב. לפני ישיבת ההנהלה היא נפגשה עם כל אחד מהמנהלים, הקשיבה לחששות שלהם, שינתה את ההצעה בהתאם וגייסה תמיכה. היא פעלה בשקיפות ולא הסתירה מידע. ע״פ James & Baddeley, סגנון הפוליטיקה הארגונית של מיכל הוא:","o":["הכבשה נותנת האמון","הינשוף הנבון","השועל הערמומי","הפרד הנחוש"],"a":1,"why":"מיכל קוראת היטב את המפה הפוליטית (נפגשת מראש, שומעת חששות, מגייסת תמיכה) ופועלת ביושרה לטובת הארגון. מודעת + יושרה = הינשוף הנבון.","w":["הכבשה לא קוראת את המפה הפוליטית ולא מגייסת תמיכה מראש. מיכל עשתה בדיוק את זה.","","השועל פועל לטובת עצמו ובתחבולות. מיכל פועלת לטובת החברה ובשקיפות.","הפרד לא קורא את המצב ופועל לטובת עצמו. מיכל עושה את ההפך בשני הצירים."]},{"id":"c8-7","q":"רן רוצה להתמנות לראש הצוות. הוא יודע בדיוק למי בארגון יש השפעה, מפיץ בשקט שמועות על המתחרה שלו, לוקח קרדיט על רעיונות של אחרים ומבטיח לכל מנהל משהו אחר כדי לזכות בתמיכתו. ע״פ James & Baddeley, סגנון הפוליטיקה הארגונית של רן הוא:","o":["השועל הערמומי","הינשוף הנבון","הפרד הנחוש","הכבשה נותנת האמון"],"a":0,"why":"רן קורא היטב את המפה הפוליטית (יודע למי יש השפעה) ומנצל אותה בתחבולות לטובת עצמו. מודע + אינטרס אישי = השועל הערמומי.","w":["","גם הינשוף קורא את המפה, אבל הוא פועל ביושרה ולטובת הארגון. רן פועל במניפולציות לטובת עצמו.","הפרד לא קורא את המפה הפוליטית. רן קורא אותה היטב.","הכבשה תמימה ופועלת לטובת הארגון. רן לא תמים ולא פועל לטובת הארגון."]},{"id":"c8-8","q":"דנה, מהנדסת בטיחות, גילתה ליקוי במערך הייצור. היא כתבה דוח טכני מפורט ומשכנע ושלחה אותו לכל ההנהלה, בטוחה שהעובדות ידברו בעד עצמן. היא לא בדקה מי עלול להתנגד או למה, ולא דיברה עם אף מנהל לפני כן. ההצעה שלה נקברה. ע״פ James & Baddeley, סגנון הפוליטיקה הארגונית של דנה הוא:","o":["הינשוף הנבון","הפרד הנחוש","הכבשה נותנת האמון","השועל הערמומי"],"a":2,"why":"דנה פועלת ביושרה לטובת הארגון, אבל בתמימות – סומכת על העובדות ולא קוראת את המפה הפוליטית. לא מודעת + יושרה = הכבשה נותנת האמון.","w":["הינשוף היה בודק מראש מי בעד ומי נגד ומגייס תמיכה. דנה לא עשתה זאת.","הפרד פועל לטובת עצמו. דנה פועלת לטובת הארגון והבטיחות.","","השועל קורא את המפה ופועל לטובת עצמו. דנה לא קוראת את המפה ופועלת לטובת הארגון."]},{"id":"c8-9","q":"קובי, מנהל צוות פיתוח, מתעקש בכל ישיבה לקבל את רוב התקציב לצוות שלו, כדי שהצוות שלו ייראה הכי טוב. הוא מרים את הקול, לא שם לב שהמנכ״ל תומך דווקא בפרויקט אחר, ומסתכסך עם מנהלים אחרים. ע״פ James & Baddeley, סגנון הפוליטיקה הארגונית של קובי הוא:","o":["השועל הערמומי","הכבשה נותנת האמון","הינשוף הנבון","הפרד הנחוש"],"a":3,"why":"קובי לא קורא את המפה הפוליטית (לא שם לב למה המנכ״ל תומך) ודוחף בעקשנות את האינטרס שלו. לא מודע + אינטרס אישי = הפרד הנחוש.","w":["השועל קורא את המפה היטב ופועל בתחבולות. קובי לא קורא את המצב ופועל בגלוי ובעקשנות.","הכבשה פועלת לטובת הארגון. קובי פועל לטובת הצוות שלו ולטובת עצמו.","הינשוף קורא את המפה ופועל ביושרה לטובת הארגון. קובי לא עושה אף אחד מהשניים.",""]},{"id":"c8-10","q":"לפי James & Baddeley, אילו שני טיפוסים פועלים מתוך יושרה ולטובת הארגון, וההבדל ביניהם הוא רק ביכולת לקרוא את המצב הפוליטי?","o":["השועל הערמומי והפרד הנחוש","הינשוף הנבון והשועל הערמומי","הינשוף הנבון והכבשה נותנת האמון","הכבשה נותנת האמון והפרד הנחוש"],"a":2,"why":"בטבלה 2×2, עמודת היושרה כוללת את הינשוף (מודע) ואת הכבשה (לא מודעת). שניהם ישרים; רק הינשוף קורא את המפה הפוליטית.","w":["השועל והפרד שניהם פועלים לטובת עצמם, לא מתוך יושרה.","הינשוף והשועל שניהם קוראים את המפה; ההבדל ביניהם הוא ביושרה, לא בקריאת המצב.","","הכבשה והפרד שניהם לא קוראים את המפה; ההבדל ביניהם הוא ביושרה."]},{"id":"c8-11","q":"הילה, סמנכ״לית, הציגה בישיבת הנהלה טיעונים מצוינים לפתיחת סניף חדש שיטיב עם החברה, אבל לא דיברה עם אף מנהל לפני הישיבה, וההצעה נדחתה. בפעם הבאה, עם הצעה אחרת לטובת החברה, נפגשה מראש עם כל המנהלים, הקשיבה להם, התאימה את ההצעה ופעלה בשקיפות – וההצעה אושרה. ע״פ James & Baddeley, בפעם הראשונה הילה פעלה כ-____ ובפעם השנייה כ-____.","o":["הכבשה נותנת האמון, הינשוף הנבון","הינשוף הנבון, השועל הערמומי","הפרד הנחוש, הינשוף הנבון","הכבשה נותנת האמון, השועל הערמומי"],"a":0,"why":"בפעם הראשונה: יושרה וטיעונים טובים, אבל בלי לקרוא את המפה הפוליטית = כבשה. בפעם השנייה: עדיין יושרה, אבל עכשיו קוראת את המפה ובונה תמיכה = ינשוף.","w":["","בפעם הראשונה הילה לא הכינה את הקרקע, ולכן היא לא ינשוף. בפעם השנייה היא פעלה בשקיפות לטובת החברה, ולכן היא לא שועל.","הפרד פועל לטובת עצמו. הילה פעלה לטובת החברה גם בפעם הראשונה.","בפעם השנייה הילה פעלה ביושרה ובשקיפות, לא בתחבולות לטובת עצמה."]},{"id":"c8-12","q":"נדב רוצה לקבל את תפקיד מנהל המחלקה. לפני ישיבת ההנהלה הוא נפגש עם כל אחד מבעלי ההשפעה, אבל מסתיר מהם מידע שעלול להזיק לו ומבטיח לכל אחד מהם משהו אחר, כדי שיתמכו בו. ע״פ James & Baddeley, סגנון הפוליטיקה הארגונית של נדב הוא:","o":["הינשוף הנבון","השועל הערמומי","הכבשה נותנת האמון","הפרד הנחוש"],"a":1,"why":"נדב קורא היטב את המפה הפוליטית ונפגש עם בעלי ההשפעה, אבל פועל בהסתרה ובמניפולציה לטובת עצמו. מודע + אינטרס אישי = השועל הערמומי.","w":["פגישות מראש עם בעלי עניין מזכירות ינשוף, אבל הינשוף פועל בשקיפות ולטובת הארגון. נדב מסתיר מידע ופועל בשביל עצמו.","","הכבשה לא קוראת את המפה. נדב קורא אותה היטב.","הפרד לא קורא את המפה הפוליטית. נדב יודע בדיוק למי יש השפעה."]},{"id":"c8-13","q":"שירה רוצה לעבור בעתיד לתפקיד ניהולי. היא מספרת למנהלים על השאיפות שלה, מגיעה לאירועים מקצועיים ובונה קשרים עם אנשים שיכולים לפתוח לה דלתות. על פי מודל ניהול הקריירה של גרינהאוס, באיזו אסטרטגיה מדובר?","o":["פוליטיקה ארגונית","פיתוח מנטור ובריתות תומכות","פיתוח הזדמנויות","בניית תדמית של הצלחה"],"a":2,"why":"חשיפת השאיפות בפני מנהלים ובניית קשרים (נטוורקינג) כדי לייצר אפשרויות הן הסימנים של אסטרטגיית פיתוח הזדמנויות.","w":["פוליטיקה ארגונית היא שימוש ביחסי כוח ובבריתות כדי להשיג יתרון. שירה מייצרת לעצמה אפשרויות דרך קשרים.","אין בסיפור אדם ותיק אחד שמלווה אותה ומלמד אותה.","","תדמית של הצלחה היא הצגת הישגים כדי שיראו אותך כמצליח. שירה מספרת מה היא רוצה ובונה קשרים."]}]}],"exams":[{"id":"sample","title":"המבחן לדוגמה של המכללה (25 שאלות)","note":"אותן שאלות ואותו מפתח כמו בקובץ המכללה, בניסוח שלנו, עם הסבר לכל תשובה","mc":[{"id":"s1","q":"גיל עובד בסטארט-אפ שמפתח אפליקציות. המנהל שלו מתאר אותו כמסור מאוד, עובד שעות רבות וממוקד בהשגת היעדים שהוגדרו לו. הוא גם שקט ומופנם, ולא מרבה לדבר עם הקולגות. לפי מודל \"חמשת הגדולים\", גיל מאופיין כ:","o":["בעל מצפוניות גבוהה ונועם נמוך","בעל מצפוניות גבוהה ומוחצנות נמוכה","בעל יציבות רגשית גבוהה ונועם נמוך","בעל מוחצנות נמוכה ומקצוענות גבוהה"],"a":1,"why":"<b>מסור, ממוקד ביעדים</b> = מצפוניות גבוהה. <b>שקט ומופנם, לא מתקשר</b> = מוחצנות נמוכה (מופנמות היא הקצה הנמוך של מוחצנות).","w":["\"לא מדבר עם קולגות\" זה מופנמות, לא חוסר נועם. נועם נמוך = לא מתחשב, עוין, לא משתף פעולה.","","אין בסיפור רמז ליציבות רגשית, וגם לא לנועם נמוך.","\"מקצוענות\" אינה אחת מחמש התכונות. זה המסיח הקבוע."]},{"id":"s2","q":"רונן, עובד סוציאלי, עבד שנים עם נוער ברחוב ומנע מעשרות ילדים להידרדר לפשע. הוא גם ליווה משפחות עד שהשתלבו בעבודה, ורבים שומרים איתו קשר עד היום. עוגן הקריירה שלו לפי שיין וטיפוס האישיות שלו לפי הולנד הם, בהתאמה:","o":["אתגר, ריאלי","תרומה לקהילה, תומך","סגנון חיים, חברתי","שירות ומחויבות למטרה, חברתי"],"a":3,"why":"הוא מונע מ<b>שליחות</b> – לעזור ולשנות חיים: עוגן <b>שירות ומחויבות למטרה</b>. עבודה עם אנשים, טיפול ועזרה = טיפוס <b>חברתי</b> של הולנד.","w":["אתגר = לנצח בעיות קשות; ריאלי = עבודה עם ידיים וכלים. לא מתאים.","\"תרומה לקהילה\" אינו שם של עוגן, ו\"תומך\" אינו טיפוס במשושה. מסיח שנשמע נכון.","סגנון חיים = איזון בית-עבודה. אין לכך רמז בסיפור.",""]},{"id":"s3","q":"עמית, בן 45, שירת כקצין בצבא קבע עד גיל 40: התחיל כמפקד כיתה, עבר תפקידי פיקוד, ובדרגת סגן אלוף פיקד על קורס מדריכים. אחרי השחרור מונה למנהל האבטחה של חברת הייטק, ואחרי כחמש שנים הקים חברה משלו לאבטחת מוסדות חינוך. לפי מודל דרייבר, הקריירה שלו:","o":["קריירה ספיראלית","קריירה יציבה","קריירה משתנה","קריירה ליניארית"],"a":0,"why":"כל כמה שנים הוא עובר לתפקיד <b>חדש אבל קרוב</b>, שנשען על מה שלמד קודם (פיקוד ← אבטחה בהייטק ← חברת אבטחה משלו). מעבר בין תחומים קשורים = <b>ספיראלית</b>.","w":["","יציבה = אותה מומחיות לאורך כל החיים. הוא החליף תפקידים וארגונים.","משתנה = קפיצות בין תחומים שאין ביניהם קשר, כל 2–4 שנים. כאן יש קשר ברור.","ליניארית = טיפוס במדרג באותו מסלול. יציאה מהצבא, ואז הקמת חברה, אינן טיפוס במדרג אחד."]},{"id":"s4","q":"נועה רוצה לעבוד כמדריכת פילאטיס, תחום שמעניין אותה ומעניק לה הנאה וסיפוק. מטרת הקריירה של נועה היא:","o":["מטרה אקספרסיבית/ביטוי עצמי","מטרה אינסטרומנטלית","מטרה לטווח ארוך","ב+ג נכונות"],"a":0,"why":"המטרה <b>מהנה ומספקת בפני עצמה</b>, ואינה אמצעי למשהו אחר. זו מטרה <b>אקספרסיבית</b> (ביטוי עצמי).","w":["","אינסטרומנטלית = אמצעי להשגת מטרה אחרת (למשל קורס כדי לקבל קידום). כאן העבודה היא המטרה עצמה.","אין בסיפור שום רמז לטווח הזמן.","ב שגויה, ולכן גם הצירוף."]},{"id":"s5","q":"אחרי אבחון תעסוקתי, ליה עובדת כעורכת דין, ובערבים ובסופי שבוע היא גם מדריכת פילאטיס. בשיחת הערכה אמר לה הממונה שהיא אמורה להתאים את ההתנהלות שלה לכל לקוח, אבל בפועל היא מתנהגת אותו דבר מול כולם. מגמת הקריירה של ליה היא ______, ויש לה ______ ברמה ______:","o":["סלשרים, בקרה עצמית, נמוכה","סלשרים, צורך בהישג, גבוהה","Gig Economy, בקרה עצמית, נמוכה","Gig Economy, צורך בהישג, גבוהה"],"a":0,"why":"<b>כמה עיסוקים במקביל</b> (עורכת דין/מדריכת פילאטיס) = <b>סלשרים</b>. <b>לא מתאימה את ההתנהגות לסיטואציה ולקהל</b> = <b>בקרה עצמית נמוכה</b>.","w":["","הקושי שלה הוא בהתאמת ההתנהגות ללקוח (בקרה עצמית), לא במוטיבציה להצטיין (צורך בהישג).","Gig Economy = עבודות קצרות לפי פרויקט או פלטפורמה. היא מחזיקה שתי קריירות קבועות במקביל.","גם המגמה וגם התכונה שגויות."]},{"id":"s6","q":"שלושה חברים: אורי יועץ חינוכי בפנימייה לנוער בסיכון ורואה בעבודה שליחות. מיכל אוהבת ללמוד, יש לה תואר שני במדעי החיים, והיא חוקרת תרופה למחלה נדירה. תום מונה למנהל מכירות בחברה לדיור מוגן ומגדיל את המכירות. לפי המשושה של הולנד, הטיפוסים שלהם הם, בהתאמה:","o":["חברתי, ריאלי, קונבנציונלי","חינוכי, חקרני, יזמי","חינוכי, ריאלי, קונבנציונלי","חברתי, חקרני, יזמי"],"a":3,"why":"לעזור ולייעץ לאנשים = <b>חברתי</b>. מחקר, סקרנות ולמידה = <b>חקרני</b>. מכירות, שכנוע והובלה = <b>יזמי</b>.","w":["מחקר מדעי הוא חקרני, לא ריאלי. מכירות הן יזמי, לא קונבנציונלי.","\"חינוכי\" אינו טיפוס במודל. יועץ ומורה הם טיפוס חברתי.","גם \"חינוכי\" וגם ריאלי וקונבנציונלי שגויים.",""]},{"id":"s7","q":"יעלי, מנהלת מוצר, מתוארת על ידי חבריה כמנומסת ומתחשבת. בהערכה השנתית נכתב שהיא אחראית ומהימנה. לפי \"חמשת הגדולים\" היא מתאימה לתפקיד כי היא:","o":["גבוהה ביציבות רגשית","גבוהה בנעימות ובמצפוניות","גבוהה בנעימות ובפתיחות להתנסות","גבוהה בנעימות וביציבות רגשית"],"a":1,"why":"<b>מנומסת ומתחשבת</b> = נעימות (נועם). <b>אחראית ומהימנה</b> = מצפוניות.","w":["אין רמז לרוגע תחת לחץ, שזו יציבות רגשית.","","פתיחות = סקרנות ורעיונות חדשים. \"אחראית ומהימנה\" זו מצפוניות.","מנומסת ומתחשבת זו נעימות, אבל \"אחראית\" שייכת למצפוניות ולא ליציבות רגשית."]},{"id":"s8","q":"בני, מתכנת מערכות מידע, נחשב מקצוען, חשוב לו לעבוד באופן מיטבי, והוא לוקח קורסים כדי להישאר מעודכן. שירה, עובדת רווחה, מרגישה שעבודתה קריטית לעזרה לאוכלוסיות מוחלשות. עוגני הקריירה שלהם לפי שיין הם, בהתאמה:","o":["טכני-פונקציונלי/התמחות מקצועית, שירות ומחויבות למטרה","יזמי, ביטחון תעסוקתי","ניהול, שירות","טכני-פונקציונלי/התמחות מקצועית, שירות ומחויבות למטרה, סגנון חיים"],"a":0,"why":"בני רוצה להיות <b>מומחה בתחום שלו</b> = טכני-פונקציונלי. שירה רואה <b>שליחות בעזרה לאחרים</b> = שירות ומחויבות למטרה.","w":["","אין רמז להקמת עסק (יזמי) או לחיפוש יציבות (ביטחון).","בני לא רוצה לנהל, הוא רוצה להתמחות.","שלושה עוגנים לשני אנשים, ו\"סגנון חיים\" לא מופיע בסיפור."]},{"id":"s9","q":"לפי מודל ניהול הקריירה של גרינהאוס, אבחון ערכי העבודה שלי צריך להתבצע בשלב:","o":["חקר קריירה","מודעות לסביבה","הצבת המטרות","הערכת קריירה"],"a":0,"why":"בשלב <b>חקר הקריירה</b> אוספים מידע על עצמי (ערכים, תחומי עניין, חוזקות) ועל הסביבה. מודעות היא <b>התוצאה</b> של החקר.","w":["","מודעות היא התוצר של החקר, לא השלב שבו מאבחנים.","מטרות מציבים אחרי שיש מודעות.","הערכת קריירה היא השלב האחרון: בדיקה בדיעבד של ההתקדמות."]},{"id":"s10","q":"הוריו של איתי עודדו אותו מגיל צעיר ללמוד רפואה וחלמו שיהיה מנתח לב. איתי, שרצה לרצות אותם, נרשם לרפואה, ורק בסוף ההתמחות גילה שהתחום לא מתאים לו. לפי המודל של פיליפס, סגנון ההחלטה של איתי בתחילת הדרך היה:","o":["רציונלי","אמוציונלי","רגשי","תלוי"],"a":3,"why":"הוא קיבל את ההחלטה <b>לפי ההורים</b> והעביר אליהם את האחריות = סגנון <b>תלוי</b>.","w":["רציונלי = איסוף מידע והשוואת חלופות. הוא לא בדק בעצמו.","\"אמוציונלי\" אינו סגנון במודל. זה מסיח.","\"רגשי\" אינו סגנון במודל. הסגנון הקרוב הוא אינטואיטיבי, וגם הוא לא מתאים כאן.",""]},{"id":"s11","q":"דור עובד היום בגבייה ורוצה להתקדם בארגון שלו לתפקיד גזבר ראשי, ולכן נרשם לתואר MBA. לפי גרינהאוס, זו אסטרטגיית:","o":["שיפור ביצועים בעבודה הנוכחית","הרחבת מעורבות בעבודה","פיתוח מיומנויות וכישורים","פיתוח הזדמנויות"],"a":2,"why":"לימודים, קורס או תואר כדי לרכוש ידע לתפקיד הבא = <b>פיתוח מיומנויות וכישורים</b>.","w":["שיפור ביצועים הוא להצטיין בתפקיד הנוכחי, לא ללמוד לתפקיד אחר.","הרחבת מעורבות = שעות והשקעה מעבר לנדרש בעבודה.","","פיתוח הזדמנויות = לחשוף רצונות, להכיר אנשים, להיחשף לתפקידים."]},{"id":"s12","q":"יונתן, מפתח בינה מלאכותית, ממלא שאלון MBTI. עולה ממנו שהוא נצמד למשימות וללוחות הזמנים שקבע הממונה, ושיש לו דמיון מפותח וחשיבה יצירתית. לפי MBTI הוא:","o":["Judger ו-Intuitive","Judger ו-Thinking","Perceiver ו-Intuitive","Perceiver ו-Thinking"],"a":0,"why":"<b>נצמד לתוכנית ולוחות זמנים</b> = Judger. <b>דמיון ויצירתיות</b> = Intuitive (N).","w":["","Thinking עוסק בהחלטות לפי היגיון. הסיפור מדגיש דמיון, כלומר Intuitive.","Perceiver = גמיש וספונטני. הוא דווקא נצמד ללוחות זמנים.","גם Perceiver וגם Thinking לא מתאימים."]},{"id":"s13","q":"שני ורון נשואים. רון, אורתופד, אוהב את התחום, נוסע לכנסים, ממוקד בהתמקצעות, ואפילו ויתר על ניהול יחידה כי היה מרחיק אותו מהשיטה החדשה שלמד. שני, מעצבת גרפית, נתקלה כשכירה בחוסר פתיחות לרעיונות שלה, והקימה חברה משלה כדי לממש אותם. לפי שיין:","o":["לשני עוגן סגנון חיים, ולרון עוגן ניהולי","לשניהם עוגן אתגר","לשני עוגן יזמי, ולרון עוגן טכני-פונקציונלי/התמחות מקצועית","לשני עוגן טכני-פונקציונלי/התמחות מקצועית, ולרון עוגן יזמי"],"a":2,"why":"שני <b>הקימה משהו משלה כדי לממש רעיונות</b> = יזמי. רון <b>ויתר על ניהול לטובת התמקצעות</b>. זה הסימן המובהק של עוגן טכני-פונקציונלי.","w":["רון ויתר על ניהול, ולכן הוא ההפך מעוגן ניהולי. הגמישות של שני היא תוצאה, לא המניע.","אתגר = לנצח בעיות קשות. המניע של כל אחד מהם שונה.","","הפוך: שני היא היזמית, ורון הוא המומחה."]},{"id":"s14","q":"הדס, מנהלת שיווק דיגיטלי בחברת תיירות, מתחילה כבר בחודשים הראשונים לבנות קשר טוב עם מנהל התפעול בחברה, כדי לקדם שיתופי פעולה בהמשך. לפי Lineback & Hill היא בונה את הרשת:","o":["הטקטית","האסטרטגית","המשולבת","האישית"],"a":0,"why":"קשרים <b>בתוך הארגון</b> עם אנשים שהעבודה שלה תלויה בהם = הרשת <b>הטקטית</b>.","w":["","האסטרטגית = קשרים שעוזרים לראות את העתיד והכיוון, לרוב מחוץ לארגון.","\"המשולבת\" אינה רשת במודל.","האישית = תמיכה והתפתחות אישית, לא שיתוף פעולה עם מנהל התפעול."]},{"id":"s15","q":"ד\"ר אבי, בן 58, עובד 25 שנה באותו בית חולים ממשלתי. הוא התחיל כמתמחה, התמחה בגסטרו, קודם לסגן מנהל המכון ואחר כך למנהל המכון, והשכר שלו עלה לאורך השנים. הקריירה שלו היא:","o":["קריירה מודרנית","קריירה מסורתית","קריירה משתנה","קריירה פרוטיאנית"],"a":1,"why":"<b>ארגון אחד, טיפוס הדרגתי במדרג ושכר שעולה עם הוותק</b>. זה בדיוק הקריירה <b>המסורתית</b>.","w":["מודרנית = העובד מנהל את הקריירה, עם מעברים בין ארגונים.","","משתנה (דרייבר) = קפיצות בין תחומים לא קשורים.","פרוטיאנית = קריירה שהעובד מעצב לפי ערכיו, עם גמישות ושינויים."]},{"id":"s16","q":"קרן, סמנכ\"לית פיתוח עסקי, משוכנעת שמיזוג עם מתחרה יטיב עם החברה. היא מציגה בהנהלה נימוקים משכנעים והצלחה דומה מהעבר, אבל לא מגייסת תמיכה מראש, וההנהלה דוחה את המיזוג. לפי James & Baddeley, הסגנון הפוליטי שלה:","o":["השועל הערמומי","הפרד הנחוש","הינשוף הנבון","הכבשה נותנת האמון"],"a":3,"why":"היא פועלת <b>ביושרה ולטובת הארגון</b>, אבל <b>לא קוראת את המפה הפוליטית</b>: לא מגייסת בעלי ברית ומסתמכת רק על טיעונים. יושרה בלי מודעות פוליטית = <b>הכבשה</b>.","w":["שועל = מודע פוליטית ופועל לטובת עצמו. היא פעלה לטובת החברה.","פרד = לא מודע ופועל לטובת עצמו. היא פעלה לטובת החברה.","ינשוף = יושרה עם מודעות פוליטית, ולכן מצליח לגייס תמיכה. היא נכשלה בגלל חוסר המודעות.",""]},{"id":"s17","q":"ליאת התחילה כיועצת משפטית בהייטק. אחרי שנתיים עברה להוראת מתמטיקה בתיכון, ואחרי שלוש שנים נוספות הפכה למדריכת יוגה. לפי דרייבר, דפוס הקריירה שלה:","o":["יציבה","משתנה","ליניארית","ספיראלית"],"a":1,"why":"מעברים <b>כל 2–3 שנים</b> בין תחומים <b>שאין ביניהם קשר</b> (משפטים, הוראה, יוגה) = <b>משתנה</b>.","w":["יציבה = אותה מומחיות כל החיים.","","ליניארית = טיפוס במדרג באותו תחום.","ספיראלית = מעברים לתחומים קרובים שנשענים על הקודם, כל 5–10 שנים."]},{"id":"s18","q":"מירב, מנהלת חשבונות 20 שנה אצל יצרנית רכב, חשה שחיקה. משאבי אנוש שולחים אותה לקורס במשא ומתן, כדי שתעבור לתפקיד קניינית ברכש. באיזה כלי השתמשו?","o":["Upskilling: עדכון ידע ומיומנויות לאותו תפקיד","Job Crafting: התאמת התפקיד לעובד ולהפך","Mentoring: ליווי והכוונה ממנטור","Reskilling: הכשרה מחדש לתפקיד אחר"],"a":3,"why":"היא לומדת <b>מקצוע אחר</b> כדי לעבור ל<b>תפקיד חדש</b> = <b>Reskilling</b>.","w":["Upskilling משדרג את הידע לאותו תפקיד (למשל AI למנהלי חשבונות). היא עוברת תפקיד.","Job Crafting מעצב מחדש את התפקיד הנוכחי. כאן היא עוזבת אותו.","אין בסיפור מנטור.",""]},{"id":"s19","q":"שירן פונה ליועץ קריירה כדי לבדוק איזה מקצוע מתאים לה. היועץ נותן לה שאלון שבודק את החוזקות והחולשות התעסוקתיות שלה. לפי גרינהאוס, היא בשלב:","o":["חקר קריירה","פיתוח אסטרטגיות קריירה","הערכת קריירה","משוב מהעבודה או מחוץ לעבודה"],"a":0,"why":"איסוף מידע על עצמי (חוזקות, חולשות, שאלונים) = <b>חקר קריירה</b>, השלב הראשון.","w":["","אסטרטגיה בונים רק אחרי שיש מטרה.","הערכה היא בדיקה בדיעבד של קריירה שכבר מתקדמת.","משוב מגיע תוך כדי יישום האסטרטגיה, לא בתחילת הדרך."]},{"id":"s20","q":"אלון התקבל לשלוש משרות של מנהל שיווק. כדי להחליט, הוא משווה את ההצעות לפי שכר, אפשרויות קידום, מרחק מהבית ותנאים סוציאליים. לפי פיליפס, הסגנון שלו:","o":["רציונלי","תלוי","אמוציונלי","אינטואיטיבי"],"a":0,"why":"<b>השוואה שיטתית של חלופות לפי קריטריונים</b> = <b>רציונלי</b>.","w":["","תלוי = ההחלטה לפי אחרים. הוא מחליט בעצמו.","\"אמוציונלי\" אינו סגנון במודל.","אינטואיטיבי = תחושת בטן. כאן יש ניתוח מסודר."]},{"id":"s21","q":"יועצת קריירה בודקת שתי מועמדות לתפקיד ניהולי. אורית אומרת: \"מה שיהיה יהיה, נקווה למזל\". ענבר אומרת: \"אחליט מהר, העיקר שההתלבטות תפסיק להציק לי\". לפי דינקלייג', הסגנון של אורית ______ ושל ענבר ______:","o":["אינטואיטיבי, תכנוני","צייתני, אימפולסיבי","פאטליסטי, תכנוני","פאטליסטי, אימפולסיבי"],"a":3,"why":"<b>\"מה שיהיה יהיה\", גורל ומזל</b> = פאטליסטי. <b>\"מהר, העיקר לגמור עם זה\"</b> = אימפולסיבי.","w":["אורית לא סומכת על תחושה פנימית, היא סומכת על מזל. וענבר לא מתכננת.","צייתני = נותן לאחרים להחליט עבורו. אורית לא מעבירה את ההחלטה לאחרים.","ענבר לא שוקלת חלופות באופן מאוזן, ולכן אינה תכנונית.",""]},{"id":"s22","q":"תמר מציבה לעצמה מטרה: לעבוד בארגון קטן עם חופש פעולה, שעות נוחות, ממונה גמיש וקולגות צעירים. זו מטרה:","o":["אופרטיבית","אינסטרומנטלית","אקספרסיבית/ביטוי עצמי","קונספטואלית/מושגית"],"a":3,"why":"היא מתארת את <b>סוג הסביבה והחוויה</b> שהיא רוצה, בלי משרה מסוימת = מטרה <b>מושגית</b>.","w":["אופרטיבית = משרה או תפקיד ספציפי (למשל \"מנהלת שיווק בחברה X\").","אינה אמצעי למטרה אחרת.","אקספרסיבית עוסקת בהנאה מהעבודה עצמה. כאן מתוארים מאפייני הסביבה.",""]},{"id":"s23","q":"גלית, אנליסטית בבית השקעות, רוצה להיות מנהלת השקעות. היא יוצאת לקורס מנהלי תיקים, עובדת שעות נוספות כדי להראות מסירות, ומתחברת למנהל השקעות ותיק כדי ללמוד ממנו ולקבל עידוד. אילו אסטרטגיות היא נוקטת?","o":["שיפור ביצועים בעבודה הנוכחית, פיתוח הזדמנויות, פיתוח מנטור","בניית תדמית של הצלחה, הרחבת מעורבות במקום העבודה, פיתוח הזדמנויות","פיתוח מיומנויות וכישורים, הרחבת מעורבות במקום העבודה, פיתוח מנטור","הרחבת מעורבות במקום העבודה, פיתוח מיומנויות וכישורים, פיתוח הזדמנויות"],"a":2,"why":"קורס = <b>פיתוח מיומנויות</b>. שעות נוספות = <b>הרחבת מעורבות</b>. מנהל ותיק שמלמד ומעודד = <b>פיתוח מנטור</b>.","w":["הקורס אינו שיפור ביצועים, והקשר עם המנהל הוא מנטור, לא פיתוח הזדמנויות.","אין בניית תדמית ואין פיתוח הזדמנויות; חסרים הקורס והמנטור.","","הקשר עם המנהל הוא מנטור, לא פיתוח הזדמנויות."]},{"id":"s24","q":"רוני רוצה ללמוד משחק בשנה הבאה בסטודיו למשחק. היא רואה בלימודים דרך חווייתית ומהנה להיכנס לעולם חדש ומרתק. השאיפה הזו מבטאת:","o":["מטרה אקספרסיבית/ביטוי עצמי ומטרה אינסטרומנטלית","מטרה אינסטרומנטלית","מטרה ריאלית","מטרה אופרטיבית"],"a":0,"why":"הלימודים <b>מהנים בפני עצמם</b> (אקספרסיבית), וגם <b>אמצעי להיכנס לעולם המשחק</b> (אינסטרומנטלית). מטרה יכולה להיות שניהם.","w":["","נכון רק בחלקו: היא גם נהנית מהלימודים עצמם, ולכן זו גם מטרה אקספרסיבית.","\"ריאלית\" אינה סוג מטרה במודל. ריאלי שייך להולנד.","אופרטיבית = משרה ספציפית. כאן מדובר בלימודים."]},{"id":"s25","q":"אסנת, מנהלת הדרכה, מסיימת חופשת לידה. היא מרגישה שחסרים לה חום ועבודה טיפולית מול אנשים, ולוקחת חל\"ת כדי לברר. היא מדברת עם חברות, עם בן זוגה ועם הוריה, ובודקת מה נדרש לשינוי. בסוף היא מבינה שזה באמת מה שהיא רוצה. לפי גרינהאוס, השלב הבא שלה:","o":["שלב החקר","שלב המודעות לעצמי ולסביבה","שלב הצבת המטרות","משוב מהעבודה או מחוץ לעבודה"],"a":2,"why":"היא כבר <b>חקרה</b> (שיחות ובירורים) והגיעה ל<b>מודעות</b> (\"הבינה שזה מה שהיא רוצה\"). לכן השלב <b>הבא</b> הוא <b>הצבת המטרות</b>.","w":["את החקר היא כבר עשתה.","המודעות היא השלב שבו היא נמצאת עכשיו. השאלה שואלת על השלב הבא.","","משוב מגיע רק אחרי שמציבים מטרה ומיישמים אסטרטגיה."]}]}],"talk":{"c1":{"title":"פרק ראשון: מהי קריירה ומה המגמות החדשות","lines":[{"s":"חגית","x":"ברוכים הבאים. היום אנחנו בפרק הראשון: מהי קריירה, ומה המגמות החדשות בעולם העבודה."},{"s":"מהנדי","x":"וזה פרק חשוב למבחן. יש סיפור קצר על עובד, וצריך לזהות את סוג הקריירה, את המגמה או את הכלי."},{"s":"חגית","x":"אז נתחיל מהבסיס. מה זו בכלל קריירה?"},{"s":"מהנדי","x":"קריירה היא רצף של עבודות, תפקידים וחוויות שקשורים לעבודה, לאורך כל החיים של האדם."},{"s":"חגית","x":"גם מי שהייתה מלצרית, אחר כך פקידה, ועכשיו היא גננת?"},{"s":"מהנדי","x":"בדיוק. גם מעברים והסבות הם חלק מהקריירה. לכל מי שעובד יש קריירה. עכשיו לשלושת הסוגים, ונתחיל בקריירה מסורתית."},{"s":"מהנדי","x":"נגיד שיש עובדת בשם רינה. היא התחילה כפקידה בבנק, הפכה לראש צוות, ואחרי עשרים ושמונה שנה היא מנהלת סניף באותו בנק."},{"s":"חגית","x":"ארגון אחד, טיפוס בסולם, והשכר עולה. ומי מחליט מתי היא מתקדמת?"},{"s":"מהנדי","x":"הארגון. זה הסימן של קריירה מסורתית. הארגון מנהל את הקריירה, וההצלחה נמדדת בדרגה ובשכר."},{"s":"חגית","x":"ומה ההפך?"},{"s":"מהנדי","x":"קריירה פרוטיאנית, של החוקר הול. נגיד שיש עובד בשם עמית. הוא ויתר על קידום בחברת ביטוח ועבר לחברה ירוקה קטנה, כי הוא מאמין בה."},{"s":"מהנדי","x":"כאן העובד מנהל את הקריירה, לפי הערכים שלו. וההצלחה היא הצלחה פסיכולוגית, כלומר סיפוק ומשמעות. השם בא מהאל פרוטאוס, שמשנה צורה."},{"s":"חגית","x":"והסוג השלישי?"},{"s":"מהנדי","x":"קריירה נטולת גבולות. נגיד שיש מפתחת בשם שירן. בשמונה שנים היא עבדה בארבע חברות, חלק מהזמן בברלין, וכל מעבר הגיע דרך אנשים שהכירה."},{"s":"מהנדי","x":"הקריירה חוצה גבולות בין ארגונים, תחומים ומדינות, ונשענת על רשת קשרים. לכן נטוורקינג, כלומר בניית קשרים מקצועיים, חשוב כאן במיוחד."},{"s":"חגית","x":"ואיפה המלכודת בחלק הזה?"},{"s":"מהנדי","x":"במבחן המילים מודרנית ופרוטיאנית מופיעות יחד כמסיחים. אם בסיפור יש ארגון אחד, קידום הדרגתי ושכר עולה, שתיהן שגויות. התשובה היא מסורתית."},{"s":"מהנדי","x":"ועוד מלכודת. ליניארית, יציבה, ספיראלית ומשתנה הן שמות מהמודל של דרייבר. הן לא חלק מהחלוקה למסורתית ומודרנית."},{"s":"חגית","x":"עכשיו למגמות. שמעתי על סלשרים ועל גיג אקונומי. מה ההבדל?"},{"s":"מהנדי","x":"סלשרים הם אנשים עם כמה מקצועות במקביל. נגיד שיש עובד בשם רון. ביום הוא רואה חשבון, בערב צלם חתונות, ובסוף השבוע תקליטן."},{"s":"מהנדי","x":"גיג אקונומי זה עבודות קצרות לפי פרויקט, לרוב דרך אפליקציה, בלי מעסיק קבוע. נגיד שמעצבת בשם שני מקבלת עבודות דרך אתר, כל פעם מלקוח אחר."},{"s":"מהנדי","x":"שואלים: כמה מקצועות יש לו? אם כמה במקביל, סלשרים. איך הוא מועסק? אם במשימות קצרות בלי מעסיק קבוע, גיג. שני רק מעצבת, ולכן גיג."},{"s":"חגית","x":"ועכשיו הכלים לפיתוח קריירה. יש ארבעה, נכון?"},{"s":"מהנדי","x":"נכון. אפסקילינג זה ללמוד משהו חדש ולהישאר באותו תפקיד. נגיד שיש מנהלת חשבונות בשם לימור, שלומדת כלי בינה מלאכותית לעבודה הנוכחית שלה."},{"s":"מהנדי","x":"ריסקילינג זו הכשרה מחדש לתפקיד אחר. נגיד שאבי, פקיד בנק, לומד ניתוח נתונים כדי לעבור לתפקיד של אנליסט."},{"s":"מהנדי","x":"ג'וב קרפטינג זו התאמת התפקיד לעובד. נגיד שמירב, אחות שאוהבת ללמד, מקבלת גם חניכה של אחיות חדשות. ומנטורינג זה ותיק שמלווה ומכוון."},{"s":"חגית","x":"ומה המלכודת הכי גדולה בכלים?"},{"s":"מהנדי","x":"המילה קורס לא אומרת אפסקילינג. במבחן לדוגמה מנהלת חשבונות נשלחה לקורס משא ומתן כדי להפוך לקניינית. התפקיד משתנה, ולכן התשובה היא ריסקילינג."},{"s":"חגית","x":"אז בקיצור. מסורתית, הארגון מנהל. פרוטיאנית, אני מנהל. נטולת גבולות, עובר בין ארגונים. סלשרים כמה מקצועות, גיג משימות קצרות. אפ נשאר, רי עובר."},{"s":"מהנדי","x":"מצוין. ושאלה קצרה. גל היא אחות, ובערבים היא סטנדאפיסטית. בית החולים שלח אותה להשתלמות על מכשיר חדש במחלקה שלה. מה המגמה ומה הכלי?"},{"s":"חגית","x":"המגמה היא סלשרים, והכלי הוא אפסקילינג."},{"s":"מהנדי","x":"נכון. יש לה שני מקצועות במקביל, אז סלשרים. וההשתלמות נועדה לאותו תפקיד בדיוק, ולכן אפסקילינג ולא ריסקילינג."}]},"c2":{"title":"פרק שני: אישיות וקריירה","lines":[{"s":"חגית","x":"היום בפרק השני: אישיות וקריירה. מה נלמד?"},{"s":"מהנדי","x":"ארבעה כלים: חמשת הגדולים, שנקרא ביג פייב, שאלון אם בי טי איי, בקרה עצמית, וצורך בהישג. במבחן מתארים עובד, וצריך לתרגם את התיאור לשם התכונה."},{"s":"חגית","x":"נתחיל בביג פייב. מה הן חמש התכונות?"},{"s":"מהנדי","x":"פתיחות להתנסות, מצפוניות, מוחצנות, נעימות, ויציבות רגשית. כל תכונה היא סקאלה, ואפשר להיות גבוה או נמוך בה."},{"s":"מהנדי","x":"פתיחות להתנסות זו סקרנות ודמיון. נגיד שיש עובדת בשם טל, שתמיד ראשונה לנסות תוכנה חדשה. פתיחות גבוהה. מי שאוהב שגרה, פתיחות נמוכה."},{"s":"מהנדי","x":"מצפוניות זה אחראי, מאורגן, מסור, ממוקד יעדים ומהימן. נגיד שעדי מגיעה תמיד בזמן, מתכננת מראש ועומדת בכל היעדים. מצפוניות גבוהה."},{"s":"חגית","x":"ומוחצנות זה פשוט מי שמדבר הרבה?"},{"s":"מהנדי","x":"חברותי, מדבר ואנרגטי. נגיד שדנה מארגנת את כל אירועי הצוות. מוחצנות גבוהה. ומי שמופנם ושקט, זו מוחצנות נמוכה."},{"s":"מהנדי","x":"נעימות, שנקראת גם נועם, זה מנומס, מתחשב ומשתף פעולה. נגיד שאלון מתווכח עם כולם ומבקר בחריפות. נעימות נמוכה."},{"s":"מהנדי","x":"ויציבות רגשית היא ההפך מנוירוטיות. נגיד שרועי נשאר רגוע בזמן תקלה גדולה. יציבות גבוהה. מי שחרד, לחוץ ודואג כל הזמן, יציבות נמוכה."},{"s":"חגית","x":"איפה מפילים אותנו בביג פייב?"},{"s":"מהנדי","x":"מלכודת ראשונה: מקצוענות אינה תכונה במודל. היא הופיעה כמסיח במבחן לדוגמה. גם אחריות ומסירות הן לא שמות של תכונה, אלא סימנים של מצפוניות."},{"s":"מהנדי","x":"מלכודת שנייה: מופנם ושקט זה מוחצנות נמוכה, לא נועם נמוך. מופנם יכול להיות אדם נעים מאוד. ולחוץ זו יציבות רגשית נמוכה, לא נעימות נמוכה."},{"s":"חגית","x":"עכשיו אם בי טי איי. זה עם ארבע אותיות, נכון?"},{"s":"מהנדי","x":"נכון, ארבעה זוגות. הראשון: מוחצן מול מופנם. כלומר, מאיפה האדם שואב אנרגיה. מאנשים, או מזמן לבד."},{"s":"מהנדי","x":"השני: חושי מול אינטואיטיבי. חושי מתמקד בעובדות ובפרטים. אינטואיטיבי חושב בדמיון, ביצירתיות ובתמונה הגדולה."},{"s":"מהנדי","x":"השלישי: חשיבה מול רגש. חשיבה מחליט לפי היגיון וקריטריונים אובייקטיביים. רגש מחליט לפי ערכים, ולפי ההשפעה על אנשים."},{"s":"מהנדי","x":"הרביעי: ג'אדג'ר מול פרסיבר. ג'אדג'ר מאורגן, מתכנן, ונצמד למשימות וללוחות זמנים. פרסיבר גמיש וספונטני."},{"s":"חגית","x":"ואם יש עובד בשם עומר, עם דמיון מפותח, שגם נצמד ללוחות הזמנים?"},{"s":"מהנדי","x":"אז הוא אינטואיטיבי וג'אדג'ר. ושימי לב, חשיבה לא הוזכרה בסיפור. לכן כל תשובה שכוללת חשיבה שגויה."},{"s":"מהנדי","x":"עוד מלכודת: אינטואיטיבי מסומן באות אן, ולא באות איי, כי איי שמורה למופנם. וג'אדג'ר לא אומר שיפוטי כלפי אנשים. הוא פשוט מאורגן."},{"s":"חגית","x":"ומה זו בקרה עצמית?"},{"s":"מהנדי","x":"מושג של סניידר. עד כמה האדם משנה את ההתנהגות שלו לפי הקהל. נגיד שקרן מדברת טכני מול מהנדסים ופשוט מול בעלי עסקים. בקרה עצמית גבוהה."},{"s":"מהנדי","x":"בקרה נמוכה זה מי שמתנהג אותו דבר מול כולם. במבחן לדוגמה מצופה מעורכת דין להתאים את עצמה, אבל בפועל לא. מה שקובע זה הבפועל, לכן נמוכה."},{"s":"חגית","x":"והאחרון, צורך בהישג?"},{"s":"מהנדי","x":"מושג של מקללנד. המוטיבציה להצטיין ולעמוד ביעדים מאתגרים. נגיד שהדס מציבה כל רבעון יעד גבוה יותר, מבקשת משוב ולוקחת אחריות אישית."},{"s":"מהנדי","x":"במבחן בקרה עצמית וצורך בהישג מופיעים יחד כזוג מסיחים. הישג זה כמה הוא רוצה להצליח. בקרה עצמית זה כמה הוא מתאים את עצמו לקהל."},{"s":"חגית","x":"אז בקיצור. ביג פייב זה חמש תכונות, בלי מקצוענות. אם בי טי איי זה ארבעה זוגות. בקרה עצמית זו התאמה לקהל, והישג זה רצון להצטיין."},{"s":"מהנדי","x":"מעולה. ושאלה קצרה. סתיו היא נשמת המסיבה ומדברת עם כולם. אבל לפני כל אירוע היא נלחצת מאוד ולא ישנה. מה היא לפי ביג פייב?"},{"s":"חגית","x":"מוחצנות גבוהה, ויציבות רגשית נמוכה."},{"s":"מהנדי","x":"נכון. נשמת המסיבה זו מוחצנות גבוהה. ולחץ ודאגה הם יציבות רגשית נמוכה, ולא נעימות נמוכה."}]},"c3":{"title":"פרק שלישי: טיפוסי האישיות של הולנד והמשושה","lines":[{"s":"חגית","x":"בפרק השלישי: ששת טיפוסי האישיות של הולנד, והמשושה שלו. למה זה חשוב?"},{"s":"מהנדי","x":"כי במבחן מתארים שניים או שלושה אנשים, ושואלים מה הטיפוס של כל אחד בהתאמה. ויש שם מסיחים עם שמות מומצאים."},{"s":"חגית","x":"מה הרעיון של הולנד?"},{"s":"מהנדי","x":"הולנד חילק אנשים לשישה טיפוסים, וגם סביבות עבודה לאותם שישה. כשיש התאמה בין האדם לסביבה, הוא מרוצה יותר ומצליח יותר."},{"s":"חגית","x":"יופי. בוא נעבור עליהם אחד אחד."},{"s":"מהנדי","x":"הראשון הוא ריאלי. עבודה מעשית עם ידיים, כלים ומכונות, הרבה פעמים בחוץ. נגיד שיש מכונאי בשם עידן, שמפרק ומרכיב מנועים כל היום. ריאלי."},{"s":"מהנדי","x":"השני הוא חקרני. אוהב לחקור, לנתח וללמוד. נגיד שיש חוקר בשם דורון, שמנתח תוצאות ניסויים במעבדה. חקרני."},{"s":"מהנדי","x":"השלישי הוא אמנותי. יצירה, ביטוי וחוסר מבנה. נגיד שיש מעצבת בשם רוני, שעובדת בלי שעות קבועות ושונאת כללים. אמנותי."},{"s":"מהנדי","x":"הרביעי הוא חברתי. לעזור, ללמד, לטפל ולייעץ. נגיד שיש גננת בשם שרית, שאוהבת ללמד ילדים ולתמוך בהורים. חברתי."},{"s":"מהנדי","x":"החמישי הוא יזמי. להוביל, לשכנע, למכור ולנהל, ולחפש השפעה ורווח. נגיד שיש סוכנת דירות בשם מאיה, שמשכנעת קונים וסוגרת עסקאות. יזמי."},{"s":"מהנדי","x":"והשישי הוא קונבנציונלי. סדר, נתונים, נהלים ומסמכים. נגיד שיש אחראית שכר בשם אורית, שאוהבת טבלאות ושכל מסמך יהיה מתויק במקום. קונבנציונלי."},{"s":"חגית","x":"איך זוכרים את הסדר?"},{"s":"מהנדי","x":"יש משפט: רק חכמים אוהבים חברים ישרים קבועים. ריאלי, חקרני, אמנותי, חברתי, יזמי, קונבנציונלי. וזה גם הסדר מסביב למשושה."},{"s":"חגית","x":"ומה המשושה בעצם אומר?"},{"s":"מהנדי","x":"טיפוסים שכנים במשושה דומים זה לזה. טיפוסים שעומדים זה מול זה הם הכי שונים."},{"s":"מהנדי","x":"יש שלושה זוגות מנוגדים. ריאלי מול חברתי, כי חפצים מול אנשים. חקרני מול יזמי. ואמנותי מול קונבנציונלי, כי חופש מול סדר."},{"s":"חגית","x":"אז יועץ חינוכי, שהוא חברתי, ורוצה סביבה הכי דומה לשלו?"},{"s":"מהנדי","x":"יחפש שכן. השכנים של חברתי הם אמנותי ויזמי. ולמשל השכנים של ריאלי הם חקרני וקונבנציונלי."},{"s":"חגית","x":"עכשיו המלכודות."},{"s":"מהנדי","x":"מלכודת ראשונה: חינוכי ותומך אינם טיפוסים של הולנד. הם הופיעו כמסיחים במבחן לדוגמה. מורה
