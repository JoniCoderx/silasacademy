<style>
/* Silas Academy. Modern study product: ink-blue structure, one highlighter-yellow signal (the marked answer), soft elevated cards on a cool paper ground. Display: Rubik. Text: IBM Plex Sans Hebrew. Numbers: Plex Mono. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#eceff7; --ink:#0f1430; --muted:#5d6482; --line:#e1e5f0;
  --accent:#2337b4; --accent-ink:#ffffff; --accent-soft:#e8ebfc; --gold:#8a6a00; --gold-soft:#fdf3c8;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#0c1234; --deep-2:#1a2580;
  --good:#16794a; --good-soft:#e1f3e9; --bad:#c0352b; --bad-soft:#fde6e3;
  --shadow:0 1px 2px rgb(15 20 48/.06),0 8px 24px rgb(15 20 48/.06);
  --display:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  --body:"IBM Plex Sans Hebrew", "Rubik", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h3,h4{font-family:var(--body);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:2.1rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0}
b,strong{font-weight:700}
a{color:var(--accent);text-underline-offset:3px}
bdi{unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.note{color:var(--muted);font-size:.9rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;flex:none}
.brand .names{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.75rem;line-height:1.05}
.brand .sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.brand .cd{margin-inline-start:auto;font-size:.8rem;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:3px 12px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:.98rem}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:700;border-color:var(--gold)}

/* layout */
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
header.page{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
header.page p{color:var(--muted);max-width:62ch}
.sec-title{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.crumbs{display:flex;gap:8px;font-size:.9rem;color:var(--muted)}
.crumbs a{text-decoration:none;font-weight:600}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.field input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;font-size:1rem}
input[type="number"],input[type="date"]{font-family:var(--mono)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);padding:10px 14px;border-radius:10px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:400}
details.more[open] summary::after{content:"−"}
details.more[open]{padding-bottom:18px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center}

/* onboarding */
.welcome{background:linear-gradient(160deg,#0f6476,#082a33);color:#fff;border-radius:20px;padding:clamp(22px,5vw,40px);display:flex;flex-direction:column;gap:14px}
.welcome .eyebrow{color:rgba(255,255,255,.75)}
.welcome h2{font-size:clamp(2rem,6vw,2.7rem)}
.welcome p{max-width:52ch;color:rgba(255,255,255,.88)}
.wl-top{display:flex;align-items:center;gap:10px}.wl-logo{width:34px;height:34px}
.wl-feats{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wl-feats li{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wl-feats b{color:#f0cd87;font-size:1.02rem}.wl-feats span{color:rgba(255,255,255,.85);font-size:.92rem;line-height:1.6}
.wl-facts{display:flex;flex-wrap:wrap;gap:8px}.wl-facts span{font-size:.85rem;padding:4px 12px;border-radius:999px;background:rgba(240,205,135,.16);color:#f6dfae}
.wl-level{border:0;padding:0;margin:0;flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.wl-level legend{color:rgba(255,255,255,.85);font-size:.9rem;margin-bottom:6px;padding:0}
.wl-level label{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;cursor:pointer}
.wl-level label:has(input:checked){border-color:#f0cd87;background:rgba(240,205,135,.14)}
.wl-level input{accent-color:#c8963f;margin-top:5px}.wl-level span{display:flex;flex-direction:column;font-size:.86rem;color:rgba(255,255,255,.8)}.wl-level span b{color:#fff;font-size:.98rem}
.wl-note{font-size:.82rem;color:rgba(255,255,255,.65)!important;margin:0}
.onb{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.onb .field{color:rgba(255,255,255,.85);flex:1 1 180px}
.onb input{background:#fff;color:#0f2a33;border:0}
.onb .btn{background:#c8963f;border-color:#c8963f;color:#1d1406;padding:10px 26px}

/* home */
.hello h2{font-size:clamp(2rem,6vw,2.6rem)}
.hello p{color:var(--muted);margin-top:4px}
.today{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.today h3{font-size:1.45rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .acts{display:flex;gap:6px;flex-wrap:wrap}
.today .todo{font-weight:500}
.today .book{color:var(--muted);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.45rem;font-weight:500}
.stats span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:12px 16px}
ol.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
ol.plan li{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
ol.plan li:first-child{border-top:0}
ol.plan .pd{color:var(--muted);font-size:.85rem}
ol.plan .pdate{color:var(--muted);font-size:.82rem;white-space:nowrap}
ol.plan .ok{color:var(--good);font-weight:700}
ol.plan li.now{background:var(--gold-soft)}
ol.plan li.now .pt{font-weight:700}
ol.plan li.done .pt{color:var(--muted)}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.mastery .eyebrow{margin-top:10px}
@media (max-width:640px){.mastery{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 3rem;gap:10px;align-items:center;padding:6px 0;background:none;border:0;width:100%;text-align:start}
.mrow.static{cursor:default}
.mname{font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.lo{background:var(--bad)} .bar i.mid{background:var(--gold)}
.mpct{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:left}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:480px){.settings{grid-template-columns:1fr}}
.booklist{display:flex;flex-direction:column;margin-top:8px}
.bookrow{display:grid;grid-template-columns:1.6fr .6fr .6fr 1fr;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.bk-t{display:flex;flex-direction:column}
@media (max-width:640px){.bookrow{grid-template-columns:1fr 1fr}.bk-t,.bk-w{grid-column:1/-1}}

/* learn */
.vrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:start;scroll-snap-align:start}
.vcard:hover{border-color:var(--accent)}
.vcard .vt{font-weight:600;padding:0 4px 4px;font-size:.95rem}
.vcard .vdur{padding:0 4px 4px;margin-top:-6px;font-size:.8rem;direction:rtl}
.vthumb{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--bg);aspect-ratio:16/9}
.vthumb svg{width:100%;height:100%;display:block;opacity:.7}
.vplayico{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.05rem;padding-inline-start:3px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ch-h{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--sunk);font-size:.88rem;font-weight:700}
.lrow{display:grid;grid-template-columns:12px 1fr 1.4rem 3rem;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;text-align:start;font-size:1rem}
.ch-h + .lrow{border-top:0}
.lrow:hover .lt{color:var(--accent)}
.lrow .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.lrow .dot.on{background:var(--good);border-color:var(--good)}
.lrow .vid{color:var(--gold);font-size:.8rem}
.lrow .lp{font-size:.82rem;color:var(--muted);text-align:left}
.glsearch{max-width:280px;margin-bottom:12px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px}
.gloss div{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}

/* lesson */
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px}
article.lesson h2{font-size:clamp(2rem,6vw,2.6rem)}
article.lesson > h4{font-size:1.15rem;margin-top:14px}
article.lesson p,article.lesson li{max-width:66ch}
article.lesson ul,article.lesson ol{margin:0;padding-inline-start:22px}
article.lesson li{margin:4px 0}
.zero{background:var(--accent-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.zero .why{font-size:1.06rem;font-weight:500}
.zcols{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.zcols h4{margin-bottom:6px;font-size:.95rem;color:var(--accent)}
.zero dl{margin:0;display:flex;flex-direction:column;gap:2px}
.zero dt{font-weight:700}
.zero dd{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.zero ol{margin:0;padding-inline-start:20px}
@media (max-width:640px){.zcols{grid-template-columns:1fr}}
.fx{font-family:var(--mono);font-size:.92rem;background:var(--sunk);border-inline-start:3px solid var(--gold);padding:10px 14px;border-radius:6px;direction:ltr;text-align:left;overflow-x:auto;line-height:1.85;unicode-bidi:isolate}
span.fx{display:inline;padding:2px 6px;border:0;line-height:1.6}
.ex,.plain,.trap{border-radius:12px;padding:14px 18px;line-height:1.85}
.ex{background:var(--sunk)}
.plain{background:var(--gold-soft)}
.trap{background:var(--bad-soft)}
.trap ul{margin:6px 0 0}
.tbl-wrap{overflow-x:auto;background:linear-gradient(to left,var(--surface) 30%,transparent),linear-gradient(to left,transparent,var(--surface) 70%) 100% 0,radial-gradient(farthest-side at 0 50%,rgb(0 0 0/.14),transparent),radial-gradient(farthest-side at 100% 50%,rgb(0 0 0/.14),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
table.mini{border-collapse:collapse;font-size:.92rem}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.mini td{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
table.mini th{background:var(--sunk);font-weight:600}
.endrow{margin-top:10px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* questions */
.qcard{scroll-margin-top:calc(var(--hdr,150px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead .btn{margin-inline-start:auto}
.qcard>*,.review>*,.qtext{min-width:0;max-width:100%}.tbl-wrap{max-width:100%}
.qtext{font-size:1.1rem;font-weight:500;line-height:1.8}
.qn{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;line-height:1.6}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);min-width:1.1em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{border-radius:12px;padding:14px 16px;background:var(--sunk);line-height:1.85}
.expl b.ok{color:var(--good)} .expl b.no{color:var(--bad)}
.expl p{margin:0 0 8px}.expl .vd{font-size:1.02rem}

בטחה בהייטק ← חברת אבטחה משלו). מעבר בין תחומים קשורים = <b>ספיראלית</b>.","w":["","יציבה = אותה מומחיות לאורך כל החיים. הוא החליף תפקידים וארגונים.","משתנה = קפיצות בין תחומים שאין ביניהם קשר, כל 2–4 שנים. כאן יש קשר ברור.","ליניארית = טיפוס במדרג באותו מסלול. יציאה מהצבא, ואז הקמת חברה, אינן טיפוס במדרג אחד."]},{"id":"s4","q":"נועה רוצה לעבוד כמדריכת פילאטיס, תחום שמעניין אותה ומעניק לה הנאה וסיפוק. מטרת הקריירה של נועה היא:","o":["מטרה אקספרסיבית/ביטוי עצמי","מטרה אינסטרומנטלית","מטרה לטווח ארוך","ב+ג נכונות"],"a":0,"why":"המטרה <b>מהנה ומספקת בפני עצמה</b>, ואינה אמצעי למשהו אחר. זו מטרה <b>אקספרסיבית</b> (ביטוי עצמי).","w":["","אינסטרומנטלית = אמצעי להשגת מטרה אחרת (למשל קורס כדי לקבל קידום). כאן העבודה היא המטרה עצמה.","אין בסיפור שום רמז לטווח הזמן.","ב שגויה, ולכן גם הצירוף."]},{"id":"s5","q":"אחרי אבחון תעסוקתי, ליה עובדת כעורכת דין, ובערבים ובסופי שבוע היא גם מדריכת פילאטיס. בשיחת הערכה אמר לה הממונה שהיא אמורה להתאים את ההתנהלות שלה לכל לקוח, אבל בפועל היא מתנהגת אותו דבר מול כולם. מגמת הקריירה של ליה היא ______, ויש לה ______ ברמה ______:","o":["סלשרים, בקרה עצמית, נמוכה","סלשרים, צורך בהישג, גבוהה","Gig Economy, בקרה עצמית, נמוכה","Gig Economy, צורך בהישג, גבוהה"],"a":0,"why":"<b>כמה עיסוקים במקביל</b> (עורכת דין/מדריכת פילאטיס) = <b>סלשרים</b>. <b>לא מתאימה את ההתנהגות לסיטואציה ולקהל</b> = <b>בקרה עצמית נמוכה</b>.","w":["","הקושי שלה הוא בהתאמת ההתנהגות ללקוח (בקרה עצמית), לא במוטיבציה להצטיין (צורך בהישג).","Gig Economy = עבודות קצרות לפי פרויקט או פלטפורמה. היא מחזיקה שתי קריירות קבועות במקביל.","גם המגמה וגם התכונה שגויות."]},{"id":"s6","q":"שלושה חברים: אורי יועץ חינוכי בפנימייה לנוער בסיכון ורואה בעבודה שליחות. מיכל אוהבת ללמוד, יש לה תואר שני במדעי החיים, והיא חוקרת תרופה למחלה נדירה. תום מונה למנהל מכירות בחברה לדיור מוגן ומגדיל את המכירות. לפי המשושה של הולנד, הטיפוסים שלהם הם, בהתאמה:","o":["חברתי, ריאלי, קונבנציונלי","חינוכי, חקרני, יזמי","חינוכי, ריאלי, קונבנציונלי","חברתי, חקרני, יזמי"],"a":3,"why":"לעזור ולייעץ לאנשים = <b>חברתי</b>. מחקר, סקרנות ולמידה = <b>חקרני</b>. מכירות, שכנוע והובלה = <b>יזמי</b>.","w":["מחקר מדעי הוא חקרני, לא ריאלי. מכירות הן יזמי, לא קונבנציונלי.","\"חינוכי\" אינו טיפוס במודל. יועץ ומורה הם טיפוס חברתי.","גם \"חינוכי\" וגם ריאלי וקונבנציונלי שגויים.",""]},{"id":"s7","q":"יעלי, מנהלת מוצר, מתוארת על ידי חבריה כמנומסת ומתחשבת. בהערכה השנתית נכתב שהיא אחראית ומהימנה. לפי \"חמשת הגדולים\" היא מתאימה לתפקיד כי היא:","o":["גבוהה ביציבות רגשית","גבוהה בנעימות ובמצפוניות","גבוהה בנעימות ובפתיחות להתנסות","גבוהה בנעימות וביציבות רגשית"],"a":1,"why":"<b>מנומסת ומתחשבת</b> = נעימות (נועם). <b>אחראית ומהימנה</b> = מצפוניות.","w":["אין רמז לרוגע תחת לחץ, שזו יציבות רגשית.","","פתיחות = סקרנות ורעיונות חדשים. \"אחראית ומהימנה\" זו מצפוניות.","מנומסת ומתחשבת זו נעימות, אבל \"אחראית\" שייכת למצפוניות ולא ליציבות רגשית."]},{"id":"s8","q":"בני, מתכנת מערכות מידע, נחשב מקצוען, חשוב לו לעבוד באופן מיטבי, והוא לוקח קורסים כדי להישאר מעודכן. שירה, עובדת רווחה, מרגישה שעבודתה קריטית לעזרה לאוכלוסיות מוחלשות. עוגני הקריירה שלהם לפי שיין הם, בהתאמה:","o":["טכני-פונקציונלי/התמחות מקצועית, שירות ומחויבות למטרה","יזמי, ביטחון תעסוקתי","ניהול, שירות","טכני-פונקציונלי/התמחות מקצועית, שירות ומחויבות למטרה, סגנון חיים"],"a":0,"why":"בני רוצה להיות <b>מומחה בתחום שלו</b> = טכני-פונקציונלי. שירה רואה <b>שליחות בעזרה לאחרים</b> = שירות ומחויבות למטרה.","w":["","אין רמז להקמת עסק (יזמי) או לחיפוש יציבות (ביטחון).","בני לא רוצה לנהל, הוא רוצה להתמחות.","שלושה עוגנים לשני אנשים, ו\"סגנון חיים\" לא מופיע בסיפור."]},{"id":"s9","q":"לפי מודל ניהול הקריירה של גרינהאוס, אבחון ערכי העבודה שלי צריך להתבצע בשלב:","o":["חקר קריירה","מודעות לסביבה","הצבת המטרות","הערכת קריירה"],"a":0,"why":"בשלב <b>חקר הקריירה</b> אוספים מידע על עצמי (ערכים, תחומי עניין, חוזקות) ועל הסביבה. מודעות היא <b>התוצאה</b> של החקר.","w":["","מודעות היא התוצר של החקר, לא השלב שבו מאבחנים.","מטרות מציבים אחרי שיש מודעות.","הערכת קריירה היא השלב האחרון: בדיקה בדיעבד של ההתקדמות."]},{"id":"s10","q":"הוריו של איתי עודדו אותו מגיל צעיר ללמוד רפואה וחלמו שיהיה מנתח לב. איתי, שרצה לרצות אותם, נרשם לרפואה, ורק בסוף ההתמחות גילה שהתחום לא מתאים לו. לפי המודל של פיליפס, סגנון ההחלטה של איתי בתחילת הדרך היה:","o":["רציונלי","אמוציונלי","רגשי","תלוי"],"a":3,"why":"הוא קיבל את ההחלטה <b>לפי ההורים</b> והעביר אליהם את האחריות = סגנון <b>תלוי</b>.","w":["רציונלי = איסוף מידע והשוואת חלופות. הוא לא בדק בעצמו.","\"אמוציונלי\" אינו סגנון במודל. זה מסיח.","\"רגשי\" אינו סגנון במודל. הסגנון הקרוב הוא אינטואיטיבי, וגם הוא לא מתאים כאן.",""]},{"id":"s11","q":"דור עובד היום בגבייה ורוצה להתקדם בארגון שלו לתפקיד גזבר ראשי, ולכן נרשם לתואר MBA. לפי גרינהאוס, זו אסטרטגיית:","o":["שיפור ביצועים בעבודה הנוכחית","הרחבת מעורבות בעבודה","פיתוח מיומנויות וכישורים","פיתוח הזדמנויות"],"a":2,"why":"לימודים, קורס או תואר כדי לרכוש ידע לתפקיד הבא = <b>פיתוח מיומנויות וכישורים</b>.","w":["שיפור ביצועים הוא להצטיין בתפקיד הנוכחי, לא ללמוד לתפקיד אחר.","הרחבת מעורבות = שעות והשקעה מעבר לנדרש בעבודה.","","פיתוח הזדמנויות = לחשוף רצונות, להכיר אנשים, להיחשף לתפקידים."]},{"id":"s12","q":"יונתן, מפתח בינה מלאכותית, ממלא שאלון MBTI. עולה ממנו שהוא נצמד למשימות וללוחות הזמנים שקבע הממונה, ושיש לו דמיון מפותח וחשיבה יצירתית. לפי MBTI הוא:","o":["Judger ו-Intuitive","Judger ו-Thinking","Perceiver ו-Intuitive","Perceiver ו-Thinking"],"a":0,"why":"<b>נצמד לתוכנית ולוחות זמנים</b> = Judger. <b>דמיון ויצירתיות</b> = Intuitive (N).","w":["","Thinking עוסק בהחלטות לפי היגיון. הסיפור מדגיש דמיון, כלומר Intuitive.","Perceiver = גמיש וספונטני. הוא דווקא נצמד ללוחות זמנים.","גם Perceiver וגם Thinking לא מתאימים."]},{"id":"s13","q":"שני ורון נשואים. רון, אורתופד, אוהב את התחום, נוסע לכנסים, ממוקד בהתמקצעות, ואפילו ויתר על ניהול יחידה כי היה מרחיק אותו מהשיטה החדשה שלמד. שני, מעצבת גרפית, נתקלה כשכירה בחוסר פתיחות לרעיונות שלה, והקימה חברה משלה כדי לממש אותם. לפי שיין:","o":["לשני עוגן סגנון חיים, ולרון עוגן ניהולי","לשניהם עוגן אתגר","לשני עוגן יזמי, ולרון עוגן טכני-פונקציונלי/התמחות מקצועית","לשני עוגן טכני-פונקציונלי/התמחות מקצועית, ולרון עוגן יזמי"],"a":2,"why":"שני <b>הקימה משהו משלה כדי לממש רעיונות</b> = יזמי. רון <b>ויתר על ניהול לטובת התמקצעות</b>. זה הסימן המובהק של עוגן טכני-פונקציונלי.","w":["רון ויתר על ניהול, ולכן הוא ההפך מעוגן ניהולי. הגמישות של שני היא תוצאה, לא המניע.","אתגר = לנצח בעיות קשות. המניע של כל אחד מהם שונה.","","הפוך: שני היא היזמית, ורון הוא המומחה."]},{"id":"s14","q":"הדס, מנהלת שיווק דיגיטלי בחברת תיירות, מתחילה כבר בחודשים הראשונים לבנות קשר טוב עם מנהל התפעול בחברה, כדי לקדם שיתופי פעולה בהמשך. לפי Lineback & Hill היא בונה את הרשת:","o":["הטקטית","האסטרטגית","המשולבת","האישית"],"a":0,"why":"קשרים <b>בתוך הארגון</b> עם אנשים שהעבודה שלה תלויה בהם = הרשת <b>הטקטית</b>.","w":["","האסטרטגית = קשרים שעוזרים לראות את העתיד והכיוון, לרוב מחוץ לארגון.","\"המשולבת\" אינה רשת במודל.","האישית = תמיכה והתפתחות אישית, לא שיתוף פעולה עם מנהל התפעול."]},{"id":"s15","q":"ד\"ר אבי, בן 58, עובד 25 שנה באותו בית חולים ממשלתי. הוא התחיל כמתמחה, התמחה בגסטרו, קודם לסגן מנהל המכון ואחר כך למנהל המכון, והשכר שלו עלה לאורך השנים. הקריירה שלו היא:","o":["קריירה מודרנית","קריירה מסורתית","קריירה משתנה","קריירה פרוטיאנית"],"a":1,"why":"<b>ארגון אחד, טיפוס הדרגתי במדרג ושכר שעולה עם הוותק</b>. זה בדיוק הקריירה <b>המסורתית</b>.","w":["מודרנית = העובד מנהל את הקריירה, עם מעברים בין ארגונים.","","משתנה (דרייבר) = קפיצות בין תחומים לא קשורים.","פרוטיאנית = קריירה שהעובד מעצב לפי ערכיו, עם גמישות ושינויים."]},{"id":"s16","q":"קרן, סמנכ\"לית פיתוח עסקי, משוכנעת שמיזוג עם מתחרה יטיב עם החברה. היא מציגה בהנהלה נימוקים משכנעים והצלחה דומה מהעבר, אבל לא מגייסת תמיכה מראש, וההנהלה דוחה את המיזוג. לפי James & Baddeley, הסגנון הפוליטי שלה:","o":["השועל הערמומי","הפרד הנחוש","הינשוף הנבון","הכבשה נותנת האמון"],"a":3,"why":"היא פועלת <b>ביושרה ולטובת הארגון</b>, אבל <b>לא קוראת את המפה הפוליטית</b>: לא מגייסת בעלי ברית ומסתמכת רק על טיעונים. יושרה בלי מודעות פוליטית = <b>הכבשה</b>.","w":["שועל = מודע פוליטית ופועל לטובת עצמו. היא פעלה לטובת החברה.","פרד = לא מודע ופועל לטובת עצמו. היא פעלה לטובת החברה.","ינשוף = יושרה עם מודעות פוליטית, ולכן מצליח לגייס תמיכה. היא נכשלה בגלל חוסר המודעות.",""]},{"id":"s17","q":"ליאת התחילה כיועצת משפטית בהייטק. אחרי שנתיים עברה להוראת מתמטיקה בתיכון, ואחרי שלוש שנים נוספות הפכה למדריכת יוגה. לפי דרייבר, דפוס הקריירה שלה:","o":["יציבה","משתנה","ליניארית","ספיראלית"],"a":1,"why":"מעברים <b>כל 2–3 שנים</b> בין תחומים <b>שאין ביניהם קשר</b> (משפטים, הוראה, יוגה) = <b>משתנה</b>.","w":["יציבה = אותה מומחיות כל החיים.","","ליניארית = טיפוס במדרג באותו תחום.","ספיראלית = מעברים לתחומים קרובים שנשענים על הקודם, כל 5–10 שנים."]},{"id":"s18","q":"מירב, מנהלת חשבונות 20 שנה אצל יצרנית רכב, חשה שחיקה. משאבי אנוש שולחים אותה לקורס במשא ומתן, כדי שתעבור לתפקיד קניינית ברכש. באיזה כלי השתמשו?","o":["Upskilling: עדכון ידע ומיומנויות לאותו תפקיד","Job Crafting: התאמת התפקיד לעובד ולהפך","Mentoring: ליווי והכוונה ממנטור","Reskilling: הכשרה מחדש לתפקיד אחר"],"a":3,"why":"היא לומדת <b>מקצוע אחר</b> כדי לעבור ל<b>תפקיד חדש</b> = <b>Reskilling</b>.","w":["Upskilling משדרג את הידע לאותו תפקיד (למשל AI למנהלי חשבונות). היא עוברת תפקיד.","Job Crafting מעצב מחדש את התפקיד הנוכחי. כאן היא עוזבת אותו.","אין בסיפור מנטור.",""]},{"id":"s19","q":"שירן פונה ליועץ קריירה כדי לבדוק איזה מקצוע מתאים לה. היועץ נותן לה שאלון שבודק את החוזקות והחולשות התעסוקתיות שלה. לפי גרינהאוס, היא בשלב:","o":["חקר קריירה","פיתוח אסטרטגיות קריירה","הערכת קריירה","משוב מהעבודה או מחוץ לעבודה"],"a":0,"why":"איסוף מידע על עצמי (חוזקות, חולשות, שאלונים) = <b>חקר קריירה</b>, השלב הראשון.","w":["","אסטרטגיה בונים רק אחרי שיש מטרה.","הערכה היא בדיקה בדיעבד של קריירה שכבר מתקדמת.","משוב מגיע תוך כדי יישום האסטרטגיה, לא בתחילת הדרך."]},{"id":"s20","q":"אלון התקבל לשלוש משרות של מנהל שיווק. כדי להחליט, הוא משווה את ההצעות לפי שכר, אפשרויות קידום, מרחק מהבית ותנאים סוציאליים. לפי פיליפס, הסגנון שלו:","o":["רציונלי","תלוי","אמוציונלי","אינטואיטיבי"],"a":0,"why":"<b>השוואה שיטתית של חלופות לפי קריטריונים</b> = <b>רציונלי</b>.","w":["","תלוי = ההחלטה לפי אחרים. הוא מחליט בעצמו.","\"אמוציונלי\" אינו סגנון במודל.","אינטואיטיבי = תחושת בטן. כאן יש ניתוח מסודר."]},{"id":"s21","q":"יועצת קריירה בודקת שתי מועמדות לתפקיד ניהולי. אורית אומרת: \"מה שיהיה יהיה, נקווה למזל\". ענבר אומרת: \"אחליט מהר, העיקר שההתלבטות תפסיק להציק לי\". לפי דינקלייג', הסגנון של אורית ______ ושל ענבר ______:","o":["אינטואיטיבי, תכנוני","צייתני, אימפולסיבי","פאטליסטי, תכנוני","פאטליסטי, אימפולסיבי"],"a":3,"why":"<b>\"מה שיהיה יהיה\", גורל ומזל</b> = פאטליסטי. <b>\"מהר, העיקר לגמור עם זה\"</b> = אימפולסיבי.","w":["אורית לא סומכת על תחושה פנימית, היא סומכת על מזל. וענבר לא מתכננת.","צייתני = נותן לאחרים להחליט עבורו. אורית לא מעבירה את ההחלטה לאחרים.","ענבר לא שוקלת חלופות באופן מאוזן, ולכן אינה תכנונית.",""]},{"id":"s22","q":"תמר מציבה לעצמה מטרה: לעבוד בארגון קטן עם חופש פעולה, שעות נוחות, ממונה גמיש וקולגות צעירים. זו מטרה:","o":["אופרטיבית","אינסטרומנטלית","אקספרסיבית/ביטוי עצמי","קונספטואלית/מושגית"],"a":3,"why":"היא מתארת את <b>סוג הסביבה והחוויה</b> שהיא רוצה, בלי משרה מסוימת = מטרה <b>מושגית</b>.","w":["אופרטיבית = משרה או תפקיד ספציפי (למשל \"מנהלת שיווק בחברה X\").","אינה אמצעי למטרה אחרת.","אקספרסיבית עוסקת בהנאה מהעבודה עצמה. כאן מתוארים מאפייני הסביבה.",""]},{"id":"s23","q":"גלית, אנליסטית בבית השקעות, רוצה להיות מנהלת השקעות. היא יוצאת לקורס מנהלי תיקים, עובדת שעות נוספות כדי להראות מסירות, ומתחברת למנהל השקעות ותיק כדי ללמוד ממנו ולקבל עידוד. אילו אסטרטגיות היא נוקטת?","o":["שיפור ביצועים בעבודה הנוכחית, פיתוח הזדמנויות, פיתוח מנטור","בניית תדמית של הצלחה, הרחבת מעורבות במקום העבודה, פיתוח הזדמנויות","פיתוח מיומנויות וכישורים, הרחבת מעורבות במקום העבודה, פיתוח מנטור","הרחבת מעורבות במקום העבודה, פיתוח מיומנויות וכישורים, פיתוח הזדמנויות"],"a":2,"why":"קורס = <b>פיתוח מיומנויות</b>. שעות נוספות = <b>הרחבת מעורבות</b>. מנהל ותיק שמלמד ומעודד = <b>פיתוח מנטור</b>.","w":["הקורס אינו שיפור ביצועים, והקשר עם המנהל הוא מנטור, לא פיתוח הזדמנויות.","אין בניית תדמית ואין פיתוח הזדמנויות; חסרים הקורס והמנטור.","","הקשר עם המנהל הוא מנטור, לא פיתוח הזדמנויות."]},{"id":"s24","q":"רוני רוצה ללמוד משחק בשנה הבאה בסטודיו למשחק. היא רואה בלימודים דרך חווייתית ומהנה להיכנס לעולם חדש ומרתק. השאיפה הזו מבטאת:","o":["מטרה אקספרסיבית/ביטוי עצמי ומטרה אינסטרומנטלית","מטרה אינסטרומנטלית","מטרה ריאלית","מטרה אופרטיבית"],"a":0,"why":"הלימודים <b>מהנים בפני עצמם</b> (אקספרסיבית), וגם <b>אמצעי להיכנס לעולם המשחק</b> (אינסטרומנטלית). מטרה יכולה להיות שניהם.","w":["","נכון רק בחלקו: היא גם נהנית מהלימודים עצמם, ולכן זו גם מטרה אקספרסיבית.","\"ריאלית\" אינה סוג מטרה במודל. ריאלי שייך להולנד.","אופרטיבית = משרה ספציפית. כאן מדובר בלימודים."]},{"id":"s25","q":"אסנת, מנהלת הדרכה, מסיימת חופשת לידה. היא מרגישה שחסרים לה חום ועבודה טיפולית מול אנשים, ולוקחת חל\"ת כדי לברר. היא מדברת עם חברות, עם בן זוגה ועם הוריה, ובודקת מה נדרש לשינוי. בסוף היא מבינה שזה באמת מה שהיא רוצה. לפי גרינהאוס, השלב הבא שלה:","o":["שלב החקר","שלב המודעות לעצמי ולסביבה","שלב הצבת המטרות","משוב מהעבודה או מחוץ לעבודה"],"a":2,"why":"היא כבר <b>חקרה</b> (שיחות ובירורים) והגיעה ל<b>מודעות</b> (\"הבינה שזה מה שהיא רוצה\"). לכן השלב <b>הבא</b> הוא <b>הצבת המטרות</b>.","w":["את החקר היא כבר עשתה.","המודעות היא השלב שבו היא נמצאת עכשיו. השאלה שואלת על השלב הבא.","","משוב מגיע רק אחרי שמציבים מטרה ומיישמים אסטרטגיה."]}]}]};
// date picker shared with the main app (copied from app.js): day.month.year with a Hebrew calendar
const iso = d => d.toISOString().slice(0, 10);
const todayISO = () => iso(new Date());
// ---------- date picker: day.month.year (20.6.2026), typed or picked from a Hebrew calendar ----------
const dmy = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return `${d}.${m}.${y}`; };
function parseDMY(t) {
  const m = String(t || '').trim().match(/^(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{2}|\d{4})$/); if (!m) return null;
  let [, d, mo, y] = m.map(Number); if (y < 100) y += 2000;
  const dt = new Date(Date.UTC(y, mo - 1, d)); if (dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
  return dt.toISOString().slice(0, 10);
}
const dateField = (id, label, iso) => `<div class="field dp"><label for="${id}">${label}</label>
  <div class="dpwrap"><input id="${id}" type="text" inputmode="decimal" dir="ltr" placeholder="יום.חודש.שנה" value="${dmy(iso)}" autocomplete="off" aria-describedby="${id}-h">
  <button type="button" class="dpbtn" data-dp="${id}" aria-label="בחירה מלוח השנה" aria-expanded="false" aria-controls="${id}-cal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button></div>
  <span class="dphint" id="${id}-h">לדוגמה: 20.6.2026</span>
  <div class="dpop" id="${id}-cal" role="dialog" aria-label="לוח שנה" hidden></div></div>`;
const dateValue = id => parseDMY($('#' + id).value);
const HMONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];
function dpDraw(id, y, mo) {
  const box = $('#' + id + '-cal'), sel = dateValue(id), today = todayISO();
  const first = new Date(Date.UTC(y, mo, 1)), lead = first.getUTCDay(), n = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate();
  const cells = [...Array(lead)].map(() => '<span></span>').concat([...Array(n)].map((_, i) => {
    const iso = new Date(Date.UTC(y, mo, i + 1)).toISOString().slice(0, 10);
    return `<button type="button" data-day="${iso}" class="${iso === sel ? 'sel' : ''} ${iso === today ? 'istoday' : ''}" aria-label="${i + 1} ב${HMONTHS[mo]} ${y}" ${iso === sel ? 'aria-current="date"' : ''}>${i + 1}</button>`;
  }));
  box.innerHTML = `<div class="dphead"><button type="button" data-nav="-1" aria-label="לחודש הקודם">›</button><b>${HMONTHS[mo]} ${y}</b><button type="button" data-nav="1" aria-label="לחודש הבא">‹</button></div>
    <div class="dpgrid">${['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'].map(d => `<span class="wd">${d}</span>`).join('')}${cells.join('')}</div>
    <div class="dpfoot"><button type="button" data-day="${today}">היום</button><button type="button" data-close>סגירה</button></div>`;
  box.dataset.y = y; box.dataset.m = mo;
}
function dpOpen(id, open) {
  const box = $('#' + id + '-cal'), btn = document.querySelector(`[data-dp="${id}"]`); if (!box) return;
  if (open) { const v = dateValue(id) || todayISO(), [y, m] = v.split('-').map(Number); dpDraw(id, y, m - 1); }
  box.hidden = !open; btn.setAttribute('aria-expanded', open);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dp]'); if (b) { const box = $('#' + b.dataset.dp + '-cal'); dpOpen(b.dataset.dp, box.hidden); return; }
  const pop = e.target.closest('.dpop');
  if (!pop) { document.querySelectorAll('.dpop:not([hidden])').forEach(p => dpOpen(p.id.replace(/-cal$/, ''), false)); return; }
  const id = pop.id.replace(/-cal$/, ''), inp = $('#' + id);
  const nv = e.target.closest('[data-nav]'); if (nv) { let y = +pop.dataset.y, m = +pop.dataset.m + +nv.dataset.nav; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } dpDraw(id, y, m); return; }
  const dy = e.target.closest('[data-day]'); if (dy) { inp.value = dmy(dy.dataset.day); dpOpen(id, false); inp.dispatchEvent(new Event('change', {bubbles: true})); inp.focus(); return; }
  if (e.target.closest('[data-close]')) dpOpen(id, false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.dpop:not([hidden])').forEach(p => { const id = p.id.replace(/-cal$/, ''); dpOpen(id, false); $('#' + id).focus(); }); });

  const ex = X.ex, n = Object.keys(X.ans).length;
  m.innerHTML = `<div class="exam-bar"><b>${esc(ex.title)}</b><span class="note">${n}/${ex.mc.length} נענו</span><span class="num" id="xclock">${clock()}</span><button class="btn sm" id="xend">הגשה</button></div>
    ${ex.mc.map((q, k) => `<div class="qcard" id="xq${k}"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.q)}</div><div class="opts">${q.o.map((o, i) => `<button class="opt ${X.ans[k] === i ? 'sel' : ''}" data-xm="${k}:${i}"><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`).join('')}</div></div>`).join('')}
    <div class="row"><button class="btn primary big" id="xend2">הגשת המבחן</button></div>`;
  m.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => { const [k, i] = b.dataset.xm.split(':').map(Number); X.ans[k] = i; m.querySelectorAll(`[data-xm^="${k}:"]`).forEach(x => x.classList.toggle('sel', x === b)); const c = m.querySelector('.exam-bar .note'); if (c) c.textContent = `${Object.keys(X.ans).length}/${ex.mc.length} נענו`; });
  const end = () => { const miss = ex.mc.length - Object.keys(X.ans).length; if (!confirm(miss ? `נשארו ${miss} שאלות בלי תשובה. להגיש בכל זאת?` : 'להגיש את המבחן?')) return; finish(); };
  $('#xend').onclick = end; $('#xend2').onclick = end;
}
function finish() {
  X.done = true; clearInterval(X.t);
  const ex = X.ex, right = ex.mc.filter((q, k) => X.ans[k] === q.a).length, score = ex.mc.length ? Math.round(right * 100 / ex.mc.length) : 0;
  ex.mc.forEach((q, k) => { if (X.ans[k] != null) S.mcq[q.id] = {ok: X.ans[k] === q.a, n: ((S.mcq[q.id] || {}).n || 0) + 1}; });
  S.exams.push({id: X.id, ts: Date.now(), score, right, sec: Math.round((Date.now() - X.start) / 1000)}); save(); render(); window.scrollTo(0, 0);
}
function drawResult(m) {
  const ex = X.ex, right = ex.mc.filter((q, k) => X.ans[k] === q.a).length, score = Math.round(right * 100 / ex.mc.length);
  const byUnit = {}; ex.mc.forEach((q, k) => { if (X.ans[k] !== q.a && q.unit !== 'exam') byUnit[q.unit] = (byUnit[q.unit] || 0) + 1; });
  const weak = Object.entries(byUnit).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u]) => U[u]).filter(Boolean);
  m.innerHTML = crumbs(['מבחנים', 'exam'], ['תוצאות']) + `<header class="page"><h2>ציון: ${score}</h2><p class="lead">${right} מתוך ${ex.mc.length} נכונות. ${score >= 85 ? 'מצוין! 🎉' : score >= 70 ? 'טוב מאוד. עוברים על ההסברים של הטעויות וזה יעלה עוד.' : 'בשביל זה מתרגלים: קראו כל הסבר, ואז את השליפים של המודלים שנפלתם בהם.'}</p>
    ${weak.length ? `<p class="note">כדאי לחזור על: ${weak.map(u => `<a href="#unit/${u.id}" data-go="unit" data-arg="${u.id}">${esc(u.title)}</a>`).join(' · ')}</p>` : ''}</header>
    ${ex.mc.map((q, k) => `<div class="qcard"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.q)}</div><div class="opts">${q.o.map((o, i) => `<button class="opt ${i === q.a ? 'right' : i === X.ans[k] ? 'wrong' : ''}" disabled><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`).join('')}</div><div class="expl">${explain(q, X.ans[k] ?? null)}</div></div>`).join('')}
    <div class="row"><button class="btn primary" id="xback">חזרה למבחנים</button></div>`;
  $('#xback').onclick = () => { X.id = null; X.done = false; go('exam'); };
}

// ---------- boot ----------
$('#main').innerHTML = '<p class="note" style="text-align:center;padding:40px 0">טוען…</p>';
(function () { const b = $('#cbar b'); if (b) b.textContent = 'ניהול קריירות בארגונים'; const a = $('#cbar a'); if (a) { a.href = '/'; a.removeAttribute('data-go'); } const bl = $('.brandlink'); if (bl) { bl.href = '/'; bl.removeAttribute('data-go'); } })();
ACC.ready().catch(() => {}).then(async () => {
  if (!ACC.user()) { try { sessionStorage.setItem('silas_return', location.pathname + location.hash); } catch (e) {} location.replace('/'); return; }
  if (ACC.user().blocked) { location.replace('/'); return; }
  ACC.onBlocked = () => location.replace('/');
  loadS(); await sync();
  const p = parseHash(); view = p.v; arg = p.a; if (!VIEWS.some(v => v[0] === view) && !PARENT[view]) view = 'dash';
  nav(); render();
});
</script>
