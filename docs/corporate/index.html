<style>
/* Silas Academy. Modern study product: ink-blue structure, one highlighter-yellow signal (the marked answer), soft elevated cards on a cool paper ground. Display: Rubik. Text: IBM Plex Sans Hebrew. Numbers: Plex Mono. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#eceff7; --ink:#0f1430; --muted:#5d6482; --line:#e1e5f0;
  --accent:#2337b4; --accent-ink:#ffffff; --accent-soft:#e8ebfc; --gold:#8a6a00; --gold-soft:#fdf3c8;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#0c1234; --deep-2:#1a2580;
  --good:#16794a; --good-soft:#e1f3e9; --bad:#c0352b; --bad-soft:#fde6e3;
  --shadow:0 1px 2px rgb(15 20 48/.06),0 8px 24px rgb(15 20 48/.06);
  --display:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  --body:"IBM Plex Sans Hebrew", "Rubik", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h3,h4{font-family:var(--body);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:2.1rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0}
b,strong{font-weight:700}
a{color:var(--accent);text-underline-offset:3px}
bdi{unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.note{color:var(--muted);font-size:.9rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;flex:none}
.brand .names{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.75rem;line-height:1.05}
.brand .sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.brand .cd{margin-inline-start:auto;font-size:.8rem;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:3px 12px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:.98rem}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:700;border-color:var(--gold)}

/* layout */
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
header.page{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
header.page p{color:var(--muted);max-width:62ch}
.sec-title{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.crumbs{display:flex;gap:8px;font-size:.9rem;color:var(--muted)}
.crumbs a{text-decoration:none;font-weight:600}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.field input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;font-size:1rem}
input[type="number"],input[type="date"]{font-family:var(--mono)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);padding:10px 14px;border-radius:10px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:400}
details.more[open] summary::after{content:"−"}
details.more[open]{padding-bottom:18px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center}

/* onboarding */
.welcome{background:linear-gradient(160deg,#0f6476,#082a33);color:#fff;border-radius:20px;padding:clamp(22px,5vw,40px);display:flex;flex-direction:column;gap:14px}
.welcome .eyebrow{color:rgba(255,255,255,.75)}
.welcome h2{font-size:clamp(2rem,6vw,2.7rem)}
.welcome p{max-width:52ch;color:rgba(255,255,255,.88)}
.wl-top{display:flex;align-items:center;gap:10px}.wl-logo{width:34px;height:34px}
.wl-feats{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wl-feats li{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wl-feats b{color:#f0cd87;font-size:1.02rem}.wl-feats span{color:rgba(255,255,255,.85);font-size:.92rem;line-height:1.6}
.wl-facts{display:flex;flex-wrap:wrap;gap:8px}.wl-facts span{font-size:.85rem;padding:4px 12px;border-radius:999px;background:rgba(240,205,135,.16);color:#f6dfae}
.wl-level{border:0;padding:0;margin:0;flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.wl-level legend{color:rgba(255,255,255,.85);font-size:.9rem;margin-bottom:6px;padding:0}
.wl-level label{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;cursor:pointer}
.wl-level label:has(input:checked){border-color:#f0cd87;background:rgba(240,205,135,.14)}
.wl-level input{accent-color:#c8963f;margin-top:5px}.wl-level span{display:flex;flex-direction:column;font-size:.86rem;color:rgba(255,255,255,.8)}.wl-level span b{color:#fff;font-size:.98rem}
.wl-note{font-size:.82rem;color:rgba(255,255,255,.65)!important;margin:0}
.onb{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.onb .field{color:rgba(255,255,255,.85);flex:1 1 180px}
.onb input{background:#fff;color:#0f2a33;border:0}
.onb .btn{background:#c8963f;border-color:#c8963f;color:#1d1406;padding:10px 26px}

/* home */
.hello h2{font-size:clamp(2rem,6vw,2.6rem)}
.hello p{color:var(--muted);margin-top:4px}
.today{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.today h3{font-size:1.45rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .acts{display:flex;gap:6px;flex-wrap:wrap}
.today .todo{font-weight:500}
.today .book{color:var(--muted);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.45rem;font-weight:500}
.stats span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:12px 16px}
ol.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
ol.plan li{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
ol.plan li:first-child{border-top:0}
ol.plan .pd{color:var(--muted);font-size:.85rem}
ol.plan .pdate{color:var(--muted);font-size:.82rem;white-space:nowrap}
ol.plan .ok{color:var(--good);font-weight:700}
ol.plan li.now{background:var(--gold-soft)}
ol.plan li.now .pt{font-weight:700}
ol.plan li.done .pt{color:var(--muted)}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.mastery .eyebrow{margin-top:10px}
@media (max-width:640px){.mastery{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 3rem;gap:10px;align-items:center;padding:6px 0;background:none;border:0;width:100%;text-align:start}
.mrow.static{cursor:default}
.mname{font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.lo{background:var(--bad)} .bar i.mid{background:var(--gold)}
.mpct{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:left}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:480px){.settings{grid-template-columns:1fr}}
.booklist{display:flex;flex-direction:column;margin-top:8px}
.bookrow{display:grid;grid-template-columns:1.6fr .6fr .6fr 1fr;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.bk-t{display:flex;flex-direction:column}
@media (max-width:640px){.bookrow{grid-template-columns:1fr 1fr}.bk-t,.bk-w{grid-column:1/-1}}

/* learn */
.vrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:start;scroll-snap-align:start}
.vcard:hover{border-color:var(--accent)}
.vcard .vt{font-weight:600;padding:0 4px 4px;font-size:.95rem}
.vcard .vdur{padding:0 4px 4px;margin-top:-6px;font-size:.8rem;direction:rtl}
.vthumb{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--bg);aspect-ratio:16/9}
.vthumb svg{width:100%;height:100%;display:block;opacity:.7}
.vplayico{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.05rem;padding-inline-start:3px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ch-h{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--sunk);font-size:.88rem;font-weight:700}
.lrow{display:grid;grid-template-columns:12px 1fr 1.4rem 3rem;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;text-align:start;font-size:1rem}
.ch-h + .lrow{border-top:0}
.lrow:hover .lt{color:var(--accent)}
.lrow .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.lrow .dot.on{background:var(--good);border-color:var(--good)}
.lrow .vid{color:var(--gold);font-size:.8rem}
.lrow .lp{font-size:.82rem;color:var(--muted);text-align:left}
.glsearch{max-width:280px;margin-bottom:12px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px}
.gloss div{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}

/* lesson */
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px}
article.lesson h2{font-size:clamp(2rem,6vw,2.6rem)}
article.lesson > h4{font-size:1.15rem;margin-top:14px}
article.lesson p,article.lesson li{max-width:66ch}
article.lesson ul,article.lesson ol{margin:0;padding-inline-start:22px}
article.lesson li{margin:4px 0}
.zero{background:var(--accent-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.zero .why{font-size:1.06rem;font-weight:500}
.zcols{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.zcols h4{margin-bottom:6px;font-size:.95rem;color:var(--accent)}
.zero dl{margin:0;display:flex;flex-direction:column;gap:2px}
.zero dt{font-weight:700}
.zero dd{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.zero ol{margin:0;padding-inline-start:20px}
@media (max-width:640px){.zcols{grid-template-columns:1fr}}
.fx{font-family:var(--mono);font-size:.92rem;background:var(--sunk);border-inline-start:3px solid var(--gold);padding:10px 14px;border-radius:6px;direction:ltr;text-align:left;overflow-x:auto;line-height:1.85;unicode-bidi:isolate}
span.fx{display:inline;padding:2px 6px;border:0;line-height:1.6}
.ex,.plain,.trap{border-radius:12px;padding:14px 18px;line-height:1.85}
.ex{background:var(--sunk)}
.plain{background:var(--gold-soft)}
.trap{background:var(--bad-soft)}
.trap ul{margin:6px 0 0}
.tbl-wrap{overflow-x:auto;background:linear-gradient(to left,var(--surface) 30%,transparent),linear-gradient(to left,transparent,var(--surface) 70%) 100% 0,radial-gradient(farthest-side at 0 50%,rgb(0 0 0/.14),transparent),radial-gradient(farthest-side at 100% 50%,rgb(0 0 0/.14),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
table.mini{border-collapse:collapse;font-size:.92rem}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.mini td{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
table.mini th{background:var(--sunk);font-weight:600}
.endrow{margin-top:10px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* questions */
.qcard{scroll-margin-top:calc(var(--hdr,150px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead .btn{margin-inline-start:auto}
.qcard>*,.review>*,.qtext{min-width:0;max-width:100%}.tbl-wrap{max-width:100%}
.qtext{font-size:1.1rem;font-weight:500;line-height:1.8}
.qn{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;line-height:1.6}

/* video player */

.vcap .ha b{color:var(--accent)} .vcap .hb b{color:var(--gold)}

.chip{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

.bar.big{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}.bar.big i{display:block;height:100%;background:var(--accent);border-radius:4px}

.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}.alogo{width:52px;height:52px}.auth-brand div{display:flex;flex-direction:column}.auth-brand b{font-family:var(--display);font-size:1.5rem;font-weight:400;direction:ltr;text-align:right}.auth-brand span{color:var(--muted);font-size:.85rem}

/* ===== modern layer ===== */

h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.015em;line-height:1.15}

mark.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);color:inherit;padding:0 .08em}
.top{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{padding:10px 16px 0;gap:4px}
.brand .logo{width:38px;height:38px;filter:drop-shadow(0 4px 10px rgb(35 55 180/.25))}

nav.tabs{gap:6px;padding:6px 0 10px}

nav.tabs button:hover{background:var(--sunk);color:var(--ink)}
nav.tabs button[aria-current="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.cbar{font-size:.8rem}
.btn{border-radius:12px;font-family:var(--display);font-weight:600;transition:transform .12s,box-shadow .15s,background .15s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover{transform:translateY(-1px)}
.btn:focus-visible,nav.tabs button:focus-visible,a:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.panel,.qcard,.course,.today,.stats>div{border-radius:var(--r);box-shadow:var(--shadow);border-color:transparent}
.chip{border-radius:8px;font-family:var(--display);font-weight:600}
/* dark ink stage used by home hero, login, course welcome */
.stage{position:relative;overflow:hidden;color:#fff;background:radial-gradient(120% 90% at 85% 0%,#2b3fd0 0%,transparent 55%),radial-gradient(60% 50% at 0% 100%,rgb(142 156 255/.18) 0%,transparent 60%),linear-gradient(160deg,var(--deep-2),var(--deep));border-radius:28px}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255/.05) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.05) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000 10%,transparent 85%);pointer-events:none}
.stage>*{position:relative}
.stage .eyebrow{color:rgb(255 255 255/.7);text-transform:none;letter-spacing:.02em}
.stage p{color:rgb(255 255 255/.82)}
.stage mark.hl{color:#fff;background:linear-gradient(transparent 58%,rgb(245 213 71/.85) 58%,rgb(245 213 71/.85) 90%,transparent 90%)}
/* home */

@media (max-width:520px){.brand h1{font-size:1.12rem}.brand .sub{display:none}.brand .logo{width:32px;height:32px}.brandlink{gap:8px}.brand .cd{font-size:.7rem;padding:3px 8px}}

table.adm{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:12px}table.adm th{text-align:start;font-weight:600;color:var(--muted);font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.adm td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}table.adm tbody tr[data-uid]{cursor:pointer}table.adm tbody tr[data-uid]:hover{background:var(--sunk)}
#ad_q{flex:1 1 220px;border-radius:12px;padding:10px 12px;background:var(--sunk);border:1.5px solid transparent}

/* ===== UX polish layer: entry, course card, practice, explanations, lessons, footer ===== */
:root{--ease:cubic-bezier(.2,.7,.2,1);--lift:0 2px 4px rgb(15 20 48/.06),0 14px 34px rgb(15 20 48/.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lift:0 2px 4px rgb(0 0 0/.35),0 16px 40px rgb(0 0 0/.35)}}
:root[data-theme="dark"]{--lift:0 2px 4px rgb(0 0 0/.35),0 16px 40px rgb(0 0 0/.35)}
.btn{transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .15s,border-color .15s,color .15s}
.btn:hover:not([disabled]){transform:translateY(-1px)}
.btn:active:not([disabled]){transform:translateY(0) scale(.98)}
.btn.primary:hover{box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{padding:14px 18px;font-size:1.06rem}
/* entry */
.auth-value{margin:0;font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px;line-height:1.55}
.auth h2{margin-top:4px}
.auth .hint{color:var(--muted);font-weight:400;font-size:.82rem}
.auth-pitch{display:flex;flex-direction:column;gap:12px}
.stage .lead{font-size:1.08rem;line-height:1.75;color:rgb(255 255 255/.9);max-width:34ch;margin:0}
.authf .field{gap:6px}
@media (max-width:760px){.authwrap .stage{gap:16px}.stage .lead{font-size:1rem}}
/* course card */
.course.open{cursor:pointer;transition:transform .2s var(--ease),box-shadow .25s var(--ease)}
.course.open:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.course.open:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
.course.open:hover .cover svg path:first-of-type{stroke:#b9c3ff}
.myprog{display:flex;flex-direction:column;gap:7px;background:var(--sunk);border-radius:12px;padding:11px 13px}
.myprog b{font-family:var(--display);font-weight:600;font-size:.88rem}.myprog .cnt{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar2{height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 80%,transparent);overflow:hidden}
.pbar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--hl)));transition:width .5s var(--ease)}
/* practice */
.qprog{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.qprog b{font-family:var(--display);font-weight:600}
.qprog .note{font-size:.84rem}
.opts{gap:10px}
.opt{align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:54px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--ease),box-shadow .2s var(--ease);font-size:1.02rem}
.opt .k{display:grid;place-items:center;width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--sunk);color:var(--ink);font-family:var(--display);font-weight:700;font-size:.9rem;transition:background .15s,color .15s}
.opt:hover:not([disabled]){border-color:var(--accent);box-shadow:0 6px 18px -10px color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-1px)}
.opt:hover:not([disabled]) .k{background:var(--accent);color:var(--accent-ink)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good)}.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad)}.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]:not(.right):not(.wrong){opacity:.6}
/* explanation */
.expl{background:transparent;padding:0;display:flex;flex-direction:column;gap:12px;line-height:1.85}
.expl .vd{margin:0;background:var(--sunk);border-radius:14px;padding:12px 16px;font-size:1.02rem}
.whywrong{margin:0;border-radius:14px;padding:14px 16px;border-inline-start:4px solid var(--bad)}
.whywrong b:first-child{display:block;color:var(--bad);font-family:var(--display);margin-bottom:2px}
.sol{display:flex;flex-direction:column;gap:10px}
.sb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;flex-direction:column;gap:6px}
.sb h5{margin:0;font-family:var(--display);font-size:.8rem;font-weight:700;letter-spacing:.01em;display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.sb h5::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.sb p{margin:0}
.s-ask h5{color:var(--accent)}
.s-way{background:var(--sunk);border-color:transparent}.s-way h5{color:var(--ink)}
.s-way .sf{background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:.92rem;overflow-x:auto}
.s-right h5{color:var(--good)}
.s-right .sres{background:var(--good-soft);border-radius:10px;padding:8px 12px;font-weight:600}
.s-tip{background:var(--gold-soft);border-color:transparent}.s-tip h5{color:var(--gold)}
.ssteps{margin:2px 0 0;padding-inline-start:1.5em;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.ssteps li{padding-inline-start:4px}
.ssteps li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}
/* lessons: learning blocks */
article.lesson{background:transparent;border:0;box-shadow:none;padding:0;gap:16px}
article.lesson>h2{padding-inline:4px}
.lbody{display:flex;flex-direction:column;gap:14px}
.lsec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:10px}
.lsec h4{font-size:1.12rem;margin:0}
.lsec p{margin:0;line-height:1.9}
.lsec .fx{margin:4px 0}
.lcall{border-radius:var(--r);padding:16px clamp(16px,3vw,22px);line-height:1.9;display:block}
.lcall>.ltag{display:table;margin-bottom:8px}
.lcall>*{max-width:66ch}
.ltag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 11px;margin-bottom:2px}
.ltag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-short{background:var(--surface);color:var(--accent)}
.t-ex{background:var(--surface);color:var(--ink)}
.t-trap{background:var(--surface);color:var(--bad)}
.t-tip{background:var(--surface);color:var(--gold)}
.zero{border-radius:var(--r);padding:18px clamp(16px,3vw,24px)}
.lesson-nav{border-top:0;padding-top:4px}
.fx.fxd{display:flex;flex-direction:column;gap:6px;direction:ltr;text-align:left}
.fxr{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:4px 10px;overflow-x:auto}
.fxlab{direction:rtl;font-family:var(--body);font-size:.84rem;color:var(--muted);order:2;white-space:nowrap}
.fxf{white-space:nowrap;order:1}
/* footer: quiet */
footer.site{border-top:1px solid var(--line);margin-top:28px}
footer.site div{justify-content:center;text-align:center;font-size:.76rem;padding:16px;gap:6px 14px}
/* mobile spacing */
@media (max-width:520px){
  .qprog,.lsec,.sb{border-radius:14px}
  .opt{padding:12px;font-size:1rem}
  .course .cbody{padding:16px}
  .ahero{padding:22px;border-radius:22px}
}
@media (prefers-reduced-motion:reduce){.btn,.opt,.course.open,.pbar2 i{transition:none}.btn:hover,.opt:hover,.course.open:hover{transform:none}}

/* QA round 2 */
bdi.mnw{white-space:nowrap}
.nobr{white-space:nowrap}.nobr>bdi.mlong{white-space:normal}
bdi.mlong{display:inline-block;max-width:100%;white-space:normal;text-align:left;vertical-align:bottom;overflow-wrap:anywhere}
.examgrid .panel{display:flex;flex-direction:column;gap:10px}.examgrid .panel .btn.primary{width:100%;justify-content:center;margin-top:auto}.examgrid .panel .btn.ghost{align-self:center}
.vrow{mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent);-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent);padding-inline-end:40px;margin-top:12px}
.vplayico{inset:auto;bottom:8px;inset-inline-start:8px;margin:0;width:34px;height:34px;font-size:.8rem;box-shadow:0 4px 12px rgb(0 0 0/.2)}
.vpill{display:inline-block;font-size:.72rem;font-weight:600;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle;white-space:nowrap}
nav.tabs{mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);padding-inline-end:24px}
@media (min-width:640px){nav.tabs{mask-image:none;-webkit-mask-image:none}}
.vplayer{border-radius:var(--r);box-shadow:var(--shadow);border:0}
@media (max-width:520px){.vplayer{margin-inline:0;border-radius:18px}}
@media (max-width:520px){table.mini th,table.mini td{padding:5px 6px;font-size:.8rem}}
:root{--btn:#2337b4;--btn-ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--btn:#4256e6;--btn-ink:#ffffff}}
:root[data-theme="dark"]{--btn:#4256e6;--btn-ink:#ffffff}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.vbig{background:var(--btn);color:var(--btn-ink)}

/* password field, forgot link, toast */
.pw{position:relative;display:flex}.pw input{width:100%;padding-inline-end:46px}
.eye{position:absolute;inset-block:0;inset-inline-end:4px;margin:auto 0;width:38px;height:38px;border:0;background:none;border-radius:10px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{background:var(--surface);color:var(--ink)}.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.eye[aria-pressed="false"] .slash{display:none}
.forgot{align-self:flex-start;font-size:.88rem;margin-top:-4px}
.authwrap.single{grid-template-columns:1fr;max-width:460px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;box-shadow:var(--lift);z-index:20;font-weight:500;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(8px)}
/* admin */
.user{display:flex;align-items:center;gap:8px}
.adbtn{font:600 .85rem var(--display);border:1.5px solid var(--hl);background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:5px 12px;cursor:pointer}
.adbtn[aria-current="true"]{background:var(--hl);color:var(--hl-ink)}
.kpis.six{grid-template-columns:repeat(6,1fr)}
@media (max-width:900px){.kpis.six{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kpis.six{grid-template-columns:repeat(2,1fr)}}
.adchart{width:100%;height:auto;margin-top:10px;direction:ltr}
.adchart .grid{stroke:var(--line);stroke-dasharray:3 4}.adchart .base{stroke:var(--line)}
.adchart .ax{font:500 10px var(--mono);fill:var(--muted)}
.adchart .b-act{fill:color-mix(in srgb,var(--accent) 55%,transparent)}.adchart .b-su{fill:var(--hl)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.lg-act::before{background:color-mix(in srgb,var(--accent) 55%,transparent)}.lg-su::before{background:var(--hl)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 .86rem var(--display);cursor:pointer}
.chipbtn .cnt{font:600 .75rem var(--mono);background:var(--sunk);border-radius:999px;padding:1px 7px;margin-inline-start:4px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chipbtn[aria-pressed="true"] .cnt{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.adtools{gap:10px}
.dotst{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-inline-end:8px;vertical-align:1px}.dotst.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.minibar{display:inline-block;width:52px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;vertical-align:middle;margin-inline-end:4px}.minibar i{display:block;height:100%;background:var(--accent)}

/* date picker */
.dp{position:relative}
.dpwrap{position:relative;display:flex}.dpwrap input{width:100%;padding-inline-end:46px;text-align:right;font-family:var(--mono)}
.dpwrap input[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.dpbtn{position:absolute;inset-block:0;inset-inline-end:4px;margin:auto 0;width:38px;height:38px;border:0;background:none;border-radius:10px;color:var(--accent);cursor:pointer;display:grid;place-items:center}
.dpbtn:hover{background:var(--accent-soft)}.dpbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.dphint{font-size:.76rem;color:var(--muted)}
.onb .dphint{color:rgb(255 255 255/.65)}
.dpop{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:15;width:288px;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:var(--lift);border:1px solid var(--line);padding:12px}
.dphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.dphead b{font-family:var(--display)}
.dphead button,.dpfoot button{border:0;background:var(--sunk);color:var(--ink);border-radius:10px;min-width:36px;height:34px;font:600 1rem var(--display);cursor:pointer}
.dpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dpgrid .wd{font-size:.75rem;color:var(--muted);padding:4px 0}
.dpgrid button{border:0;background:none;color:var(--ink);border-radius:10px;height:34px;font:500 .92rem var(--body);cursor:pointer}
.dpgrid button:hover{background:var(--accent-soft)}
.dpgrid button.istoday{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dpgrid button.sel{background:var(--btn);color:var(--btn-ink);font-weight:700}
.dpfoot{display:flex;justify-content:space-between;margin-top:8px}.dpfoot button{padding:0 12px;font-size:.85rem}

/* blocked account + admin block controls */
.auth.blocked{text-align:center;align-items:center;gap:12px}
.lockic{width:64px;height:64px;border-radius:20px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center}.lockic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--sunk);border-radius:12px;padding:10px 14px}
.contact .sel{user-select:all}
.chip.blk{background:var(--bad-soft);color:var(--bad)}
.blockbox{margin-top:14px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.blockbox.on{border-color:var(--bad);background:var(--bad-soft)}
.blockbox textarea{width:100%;border-radius:10px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);font:inherit;color:var(--ink);resize:vertical}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bg)}

/* polish round 3: password eye off the text, admin on phones */
.pw input{padding-inline-end:12px;padding-left:48px}
.eye{inset-inline-end:auto;left:4px}
.dpwrap input{padding-inline-end:12px;padding-left:48px}
.dpbtn{inset-inline-end:auto;left:4px}
.bars{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:3px;height:140px;margin-top:12px;padding:0 2px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 34px,var(--line) 34px,var(--line) 35px)}
.bcol{flex:1;height:100%;display:flex;flex-direction:row-reverse;align-items:flex-end;justify-content:center;gap:1px}
.bcol .ba{display:block;flex:1;max-width:14px;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--accent) 60%,transparent)}
.bcol .bs{display:block;flex:1;max-width:14px;border-radius:3px 3px 0 0;background:var(--hl)}
.bax{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:4px}
.bsum{margin:8px 0 0}
.page.row.between{flex-wrap:nowrap;align-items:center}
@media (max-width:640px){
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chipbtn{flex:none}
  .adtools{flex-direction:column;align-items:stretch}.adtools .row{justify-content:space-between}#ad_q{flex:none;width:100%}

}

/* WhatsApp support */

.ghost.sm[href]{text-decoration:none}
.placebox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}
.placebox .pl{font-weight:600}
.placebox .pl .acc{font-weight:400;font-size:.8rem;margin:0}

/* admin page layout: header, numbers, live + recent, chart, learners, side panel */
.adhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 16px}

.adacts{display:flex;gap:8px}
.adkpis .kpi b{font-size:1.35rem;white-space:nowrap}
.adgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.adgrid .panel{margin:0}
.panel h4 .cnt,.adtitle .cnt{font:600 .75rem var(--mono);background:var(--good-soft);color:var(--good);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.adlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.adlist li{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:9px 8px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line)}
.adlist li:last-child{border-bottom:0}
.adlist li:hover,.adlist li:focus-visible{background:var(--sunk)}
.adlist li b{margin-inline-end:10px}
.adlist li .note{margin:0;font-size:.82rem}
.adempty{margin:10px 0 0}
.adtitle{margin-bottom:10px}.adtitle h4{margin:0}.adtitle .note{margin:0;font-size:.8rem}

/* ===== motion layer: hovers and small effects. Only on devices with a mouse, and never for people who asked for less motion ===== */
@media (prefers-reduced-motion:no-preference){
  /* screens slide in softly when you move between them (not the admin page, which refreshes itself every minute) */
  body.vchange:not([data-view="admin"]) #main > *{animation:rise .38s var(--ease) both}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(2){animation-delay:.04s}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(3){animation-delay:.08s}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(n+4){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* answers: the right one glows, a wrong one gives a small shake */
  .opt.right{animation:glow .7s var(--ease)}
  .opt.wrong.sel{animation:shake .38s ease}
  @keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
  @keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  /* progress bars fill instead of jumping */
  .bar i,.minibar i,.prog i,.pbar i{transition:width .7s var(--ease)}
  /* toast pops in */
  .toast{animation:pop .28s var(--ease)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  /* buttons lift, and the main one gets a light sweep across it */
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgb(15 20 48/.45)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.primary,.btn.wabtn{position:relative;overflow:hidden}
  .btn.primary::after,.btn.wabtn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgb(255 255 255/.28) 50%,transparent 65%);transform:translateX(120%);transition:transform .6s var(--ease);pointer-events:none}
  .btn.primary:hover::after,.btn.wabtn:hover::after{transform:translateX(-120%)}
  /* cards rise toward the pointer */
  .course,.vcard,.adlist li,.mslist li,.advisits li{transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .2s,background .15s}
  .course:hover,.vcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgb(15 20 48/.45);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
  .kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 12px 26px -16px rgb(15 20 48/.4)}
  .vcard:hover img,.vcard:hover svg{transform:scale(1.03)}.vcard img,.vcard svg{transition:transform .35s var(--ease)}
  /* answer options lean in */
  .opt:not(.right):not(.wrong):hover{border-color:var(--accent);transform:translateX(-3px);box-shadow:0 8px 20px -14px color-mix(in srgb,var(--accent) 70%,transparent)}
  /* lesson rows and lists */
  .mrow{transition:background .15s,transform .2s var(--ease)}.mrow:hover{transform:translateX(-3px)}
  .adlist li:hover,.mslist li:hover{transform:translateX(-3px)}
  /* the logo winks */
  .brand .logo{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
  .brandlink:hover .logo{transform:rotate(-8deg) scale(1.08)}
  /* tabs and links */
  nav.tabs button:not([aria-current="true"]):hover{background:var(--sunk);color:var(--ink)}
  .flink,.crumbs a,.cbar a{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .3s var(--ease)}
  .flink:hover,.crumbs a:hover,.cbar a:hover{background-size:100% 1.5px}
  .flink{text-decoration:none}
  /* the support button breathes a little when pointed at */
  .wafab:hover svg{animation:wiggle .5s ease}
  @keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}
  .washare{transition:transform .2s var(--ease)}.washare:hover{transform:scale(1.12)}
  table.adm tbody tr[data-uid]{transition:background .15s}
}

  const LEGACY = 'fs-prep-v1', idOf = email => 'u' + [...norm(email)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36);

  function pwProblem(pw, email) {
    pw = String(pw || ''); const low = pw.toLowerCase(), user = norm(email).split('@')[0];
    if (pw.length < 8) return 'הסיסמה צריכה להיות באורך 8 תווים לפחות.';
    if (!/[A-Za-z\u05D0-\u05EA]/.test(pw) || !/\d/.test(pw)) return 'הסיסמה צריכה לכלול לפחות אות אחת ומספר אחד.';

  const lockCheck = () => { const t = lockLeft(); if (t) throw new Error(`יותר מדי ניסיונות כניסה. נסו שוב בעוד ${t > 90 ? Math.ceil(t / 60) + ' דקות' : t + ' שניות'}.`); };

  const K = 'silas-accounts-v1';
  let db = {users: {}, current: null};
  try { const s = JSON.parse(localStorage.getItem(K)); if (s && s.users) db = s; } catch (e) {}
  const store = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch (e) {} };

  const local = {
    async ready() {},
    user: () => db.current && db.users[db.current] ? {id: db.current, name: db.users[db.current].name, email: db.users[db.current].email, isAdmin: false} : null,
    async signup(name, email, pw) {
      check(name, email, pw, true); email = norm(email);

  async function loadMe(user) {

  const SID_KEY = 'silas_sid', GEO_KEY = 'silas_geo', VISITS = '_visits';

  let vis = null; // {u, d: {s: {sessionId: {c, ci, f, lat, lng, e}}}}
  const loadVis = async () => {
    const uid = me && me.id; if (!uid) return null;
    if (vis && vis.u === uid) return vis;

    return (vis = {u: uid, d});
  };
  const noteVisit = (id, patch) => {
    if (!me || !id) return; const uid = me.id;
    const write = v => { if (!v || v.u !== uid) return; const s = v.d.s; s[id] = Object.assign(s[id] || {}, patch);
      Object.keys(s).sort((a, b) => b - a).slice(40).forEach(k => delete s[k]); // keep the latest 40 visits

  };
  const putGeo = (id, country, city, flag, lat, lng, acc) => {
    sb.rpc('set_session_geo', {p_session: id, p_country: country || '', p_city: city || '', p_flag: flag || ''}).then(() => {}, () => {});
    noteVisit(id, Object.assign({c: country || '', ci: city || '', f: flag || '', at: new Date().toISOString()}, lat != null ? {lat, lng, acc} : {}));
  };
  const endVisit = id => { if (!id) return; sb.rpc('end_session', {p_session: id}).then(() => {}, () => {}); noteVisit(id, {e: new Date().toISOString()}); };
  // where the visit comes from: the city of the internet connection right away,
  // then the exact city and neighborhood from the device once the learner allows location
  // the exact device point (the learner allowed it, and the sign-up screen says it is saved), named in Hebrew
  function devicePlace(id, done, fresh) {

      try { localStorage.setItem(GEO_KEY, 'ok'); } catch (e) {}

        const fl = g.countryCode && g.countryCode.length === 2 ? String.fromCodePoint(...[...g.countryCode.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '';

      }).catch(() => {});

  }

    geoAt = Date.now();

  };
  function locate(id) {
    geoAt = Date.now();
    let flag = '', precise = false;
    fetch('https://ipwho.is/?fields=success,country,city,flag.emoji').then(r => r.json()).then(g => { if (g && g.success) { flag = (g.flag && g.flag.emoji) || ''; if (!precise) putGeo(id, g.country, g.city, flag); } }).catch(() => {});

    let asked = null; try { asked = localStorage.getItem(GEO_KEY); } catch (e) {}

 את כל כספם, והיתרה מתחלקת בין בעלי המניות (ס' 342כד). (2) <b>פירוק בידי בית המשפט</b> – למשל כשהחברה החליטה על כך בהחלטה מיוחדת, כשלא התחילה לפעול שנה מרישומה או הפסיקה לפעול שנה, או כשמן הצדק והיושר לפרק אותה (ס' 342ו). הבקשה מוגשת לבית המשפט <b>המחוזי</b> (ס' 342ה). (3) <b>הליכי חדלות פירעון</b> – כשהחברה אינה יכולה לשלם את חובותיה. הם מתנהלים לפי חוק חדלות פירעון ושיקום כלכלי, ולא לפי פרק הפירוק בחוק החברות (ס' 342ד)."},{"t":"law","law":"חוק החברות","sec":"342כה","x":"תצהיר כושר פירעון יינתן בידי כל הדירקטורים בחברה או רובם, ובו יצהירו כי בדקו היטב את מצב עסקי החברה ולדעתם החברה יכולה לשלם את חובותיה במלואם בתוך 12 חודשים מתחילת פירוקה"},{"t":"p","x":"ההחלטה על פירוק מרצון היא סמכות של <b>האסיפה הכללית</b> (ס' 57(8)), והיא מתקבלת ב<b>החלטה מיוחדת</b>: רוב של שלושה רבעים מקולות המשתתפים בהצבעה, בהזמנה שנמסרה 21 ימים מראש לפחות, כשהפירוק נכלל בסדר היום (ס' 342ב). האסיפה מתכנסת רק אחרי שהדירקטורים נתנו תצהיר כושר פירעון, ובתוך 90 ימים ממנו (ס' 342כו). לחברה ״לא פעילה״, שאין לה נכסים, חובות או הליכים תלויים, יש מסלול מזורז, בהסכמת כל בעלי המניות המשתתפים באסיפה (ס' 342מא–342מב)."},{"t":"trap","x":"<b>פירוק מרצון אינו פתרון לחברה שקועה בחובות.</b> המסלול מרצון מיועד לחברה שיכולה לשלם לכולם. אם מתברר שהחברה בחדלות פירעון, ההליך עובר למסלול של חוק חדלות פירעון (ס' 342ד(ג)). וזכרו את הסדר: קודם הנושים, ורק אחריהם בעלי המניות מקבלים את מה שנשאר."},{"t":"h","x":"סוגי התאגידים הפרטיים"},{"t":"p","x":"נבחין בין <b>תאגידים ציבוריים</b>, שהוקמו בחוק מיוחד וממלאים תפקיד ציבורי (למשל בנק ישראל), ובין <b>תאגידים פרטיים</b>, שהם עיקר הקורס. התאגידים הפרטיים העיקריים בישראל הם: חברה, חברה לתועלת הציבור (חל״צ), עמותה, שותפות (כללית או מוגבלת) ואגודה שיתופית."},{"t":"table","head":["סוג התאגיד","החוק החל","מתי נולד","מינימום מייסדים","חלוקת רווחים","אחריות החברים לחובות","ציון בשם"],"rows":[["חברה","חוק החברות","ברישום אצל רשם החברות (ס' 5, 10)","אחד (ס' 3)","מותרת, בכפוף למבחני החלוקה (ס' 302)","מוגבלת או לא מוגבלת לפי התקנון (ס' 35)","״בע״מ״ אם האחריות מוגבלת (ס' 26)"],["חברה לתועלת הציבור (חל״צ)","חוק החברות, ס' 345א ואילך","ברישום, באישור רשם ההקדשות (ס' 345ב)","כמו בחברה","אסורה (ס' 345ז)","כמו בחברה","״חברה לתועלת הציבור״ או ״(חל״צ)״ (ס' 345ד)"],["עמותה","חוק העמותות","ברישום בפנקס העמותות (עמ' 1, 8)","שני בגירים (עמ' 1)","אסורה (עמ' 34ג)","העמותה היא תאגיד נפרד (עמ' 8)","״עמותה״, ״עמותה רשומה״ או ״(ע״ר)״ (עמ' 8א)"],["שותפות כללית","פקודת השותפויות","מכוח ההסכם בין השותפים; הרישום חובה אך אינו תנאי לקיום (שות' 4, 6)","שניים; עד 20 שותפים כלליים (שות' 3)","הרווחים מתחלקים בין השותפים","כל שותף חב ביחד ולחוד (שות' 20)","אסור ״בע״מ״ (שות' 10)"],["שותפות מוגבלת","פקודת השותפויות","הסכם בכתב והיתר שר המשפטים לרישום (שות' 61)","שותף כללי אחד ושותף מוגבל אחד לפחות (שות' 57)","הרווחים מתחלקים בין השותפים","הכללי – בלתי מוגבלת; המוגבל – עד סכום השקעתו","אסור ״בע״מ״"],["אגודה שיתופית","פקודת האגודות השיתופיות","ברישום אצל רשם האגודות השיתופיות","לפי חומר הקורס – שבעה חברים","מבוססת על עזרה הדדית ושוויון בין החברים","תאגיד נפרד מחבריו","—"]]},{"t":"trap","x":"<b>שותפות אינה ״נולדת״ ברישום.</b> חברה ועמותה קיימות רק מרגע הרישום, אבל שותפות קיימת מרגע שאנשים מנהלים יחד עסק לשם רווח. אי-רישום שותפות הוא עבירה, אך ״לא ישפיע בשיקול אם השותפות קיימת״ (שות' 6). רק שותפות <b>רשומה</b> היא תאגיד (שות' 66), ובכל מקרה השותפים הכלליים חבים אישית בחובותיה."},{"t":"p","x":"<b>אגודה שיתופית</b> היא התאגדות של אנשים בעלי אינטרס כלכלי משותף, שמטרתה עזרה הדדית, חיסכון ושיפור תנאי החיים והעבודה של חבריה. היא מוסדרת בפקודת האגודות השיתופיות (פקודה מנדטורית), ולפי חומר הקורס נדרשים לפחות <b>שבעה</b> חברים כדי לייסד אותה. כמו חברה, היא קיימת רק מרגע ה<b>רישום</b> אצל רשם האגודות השיתופיות, והיא אישיות משפטית נפרדת מחבריה. דוגמאות: קיבוצים, מושבים, יישובים קהילתיים וקואופרטיבים של תחבורה ציבורית."},{"t":"table","head":["","חברה","אגודה שיתופית"],"rows":[["העיקרון המארגן","השקעת הון; הכוח לפי כמות המניות","שיתוף ושוויון בין החברים; ניהול עצמי דמוקרטי"],["מי הבעלים","בעלי המניות, דרך המניות","החברים עצמם הם הבעלים של האגודה ונכסיה"],["מטרה","בדרך כלל השאת רווחים (ס' 11(א))","רווחת החברים ועזרה הדדית, לא רווח במובן העסקי"],["מייסדים","אחד ומעלה (ס' 3)","לפי חומר הקורס – שבעה לפחות"],["רישום","רשם החברות (ס' 5)","רשם האגודות השיתופיות"]]},{"t":"trap","x":"<b>״הכוח לפי ההון״ אינו העיקרון באגודה שיתופית.</b> בחברה מי שמחזיק יותר מניות משפיע יותר. באגודה השיתופית הרעיון הוא שוויון בין החברים. מסיח כמו ״באגודה שיתופית ההשפעה נקבעת לפי גובה ההשקעה של כל חבר״ הוא תיאור של חברה, לא של אגודה."},{"t":"h","x":"חברה ציבורית וחברה פרטית"},{"t":"law","law":"חוק החברות","sec":"1","x":"”חברה ציבורית“ – חברה שמניותיה רשומות למסחר בבורסה או שהוצעו לציבור על פי תשקיף כמשמעותו בחוק ניירות ערך … ומוחזקות בידי הציבור; … ”חברה פרטית“ – חברה שאינה חברה ציבורית;"},{"t":"p","x":"ההגדרה ״שלילית״: כל חברה שאינה ציבורית היא פרטית. ההבחנה חשובה כי על חברה ציבורית חלה רגולציה מחמירה בהרבה: חובה למנות לפחות שני דירקטורים חיצוניים (ס' 239), ועדת ביקורת (ס' 114) וועדת תגמול (ס' 118א), מנכ״ל (ס' 119(א)), ואיסור על כהונה משולבת של יו״ר ומנכ״ל (ס' 95). חלק מהכללים האלה חלים גם על <b>חברת איגרות חוב</b> – חברה פרטית שאיגרות החוב שלה נסחרות או הוצעו לציבור."},{"t":"h","x":"״בע״מ״: אחריות מוגבלת"},{"t":"law","law":"חוק החברות","sec":"35","x":"אחריות בעלי המניות לחובות החברה יכול שתהיה לא מוגבלת, והדבר יצוין בתקנון; היתה אחריות בעלי המניות מוגבלת, יפורט אופן ההגבלה בתקנון. … היו מניות החברה בעלות ערך נקוב, אחראים בעלי המניות לפירעון הערך הנקוב לפחות, אלא אם כן נתקיים האמור בסעיף 304."},{"t":"law","law":"חוק החברות","sec":"26","x":"שמה של חברה, שאחריות בעלי המניות בה מוגבלת, כאמור בסעיף 35, יכלול בסופו את הציון ”בערבון מוגבל“ או ”בע״מ“."},{"t":"p","x":"משמעות האחריות המוגבלת: בעל המניות מסכן רק את מה שהשקיע (ואת יתרת הערך הנקוב שטרם שילם על מניותיו). מעבר לכך נושי החברה אינם יכולים לפנות אליו. זהו ״המסך״ שבין החברה לבעליה."},{"t":"list","x":["<b>ערבות אישית</b> – בעל מניות שחתם כערב לחוב החברה חב מכוח הערבות, לא מכוח היותו בעל מניות.","<b>הון שלא נפרע</b> – יתרת הערך הנקוב שבעל המניות טרם שילם היא חוב שלו לחברה (ס' 35(ב)).","<b>אחריות אישית כנושא משרה או כמזיק</b> – ייחוס הפעולה לחברה אינו גורע מאחריותו האישית של מי שפעל (ס' 54(א)).","<b>הרמת מסך</b> – במקרים חריגים בית המשפט רשאי לייחס חוב של החברה לבעל מניה (ס' 6; ראו יחידת הרמת מסך)."]},{"t":"example","title":"דוגמה: מי משלם את החוב?","x":"דנה הקימה את ״פרחי דנה בע״מ״ והשקיעה בה 100,000 ₪. החברה נקלעה לחובות של 2 מיליון ₪ לספקים. <b>פתרון:</b> החובות הם של החברה (ס' 4). אחריותה של דנה מוגבלת (ס' 35, 26), ולכן הספקים אינם יכולים לגבות ממנה אישית, מלבד: יתרת ערך נקוב שלא שילמה, ערבות אישית אם חתמה עליה, או הרמת מסך אם תוכח עילה לפי ס' 6. ההפסד של דנה מוגבל ל-100,000 ₪ שהשקיעה."},{"t":"trap","x":"<b>״אחריות מוגבלת״ אינה אחריות מוגבלת של החברה.</b> החברה עצמה חבה בכל חובותיה, בכל נכסיה. מה שמוגבל הוא אחריות <b>בעלי המניות</b>. ועוד: לא כל חברה היא בע״מ. החוק מאפשר חברה שאחריות בעליה אינה מוגבלת (ס' 35(א)), ואז אסור לה לציין ״בע״מ״."},{"t":"trap","x":"<b>חברת יחיד אינה ״אותו אדם״.</b> בבחינה מופיע לעיתים מסיח כמו ״מאחר שלחברה בעל מניה אחד, חובות החברה הם חובותיו״. זה שגוי: ס' 3 מתיר חברת אדם אחד, וס' 4 מעניק לה אישיות נפרדת. בעל מניה יחיד מוגן במסך כמו כל בעל מניות."},{"t":"h","x":"תכלית החברה"},{"t":"law","law":"חוק החברות","sec":"11(א)","x":"תכלית חברה היא לפעול על פי שיקולים עסקיים להשאת רווחיה, וניתן להביא בחשבון במסגרת שיקולים אלה, בין השאר, את עניניהם של נושיה, עובדיה ואת ענינו של הציבור;"},{"t":"p","x":"החברה העסקית נועדה להשיא רווחים, אך מותר לה לשקול גם אינטרסים של נושים, עובדים והציבור. תרומה בסכום סביר למטרה ראויה מותרת גם ללא שיקול עסקי, אם יש לכך הוראה בתקנון. ההוראה אינה חלה על חל״צ (ס' 11(ב)), שתכליתה ציבורית."},{"t":"h","x":"בעיית הנציג בקצרה"},{"t":"p","x":"בחברה מי שמנהל את הכסף (הנציג) אינו תמיד מי שהכסף שלו (הבעלים). מכאן נוצר חשש שהנציג יקדם את האינטרס שלו על חשבון האחרים. זו <b>בעיית הנציג</b>, ויש לה שלוש גרסאות עיקריות:"},{"t":"list","x":["<b>בעלות מפוזרת</b> (נפוצה בארה״ב): המנהלים מול בעלי המניות. למשל שכר מופרז או ״בניית אימפריה״.","<b>בעלות מרוכזת</b> (נפוצה בישראל): בעל השליטה מול בעלי מניות המיעוט. למשל העברת ערך מהחברה לבעל השליטה בעסקאות עמו (״מנהור״).","<b>בעלי המניות מול הנושים</b>: בעלי המניות, שמוגנים באחריות מוגבלת, מעדיפים לפעמים סיכון יתר שהנושים נושאים בתוצאותיו."]},{"t":"p","x":"רוב דיני החברות הם תשובה לבעיה הזו: חובות זהירות ואמונים של נושאי משרה (ס' 252–254), חובות בעלי מניות ובעל שליטה (ס' 192–193), אישור מיוחד לעסקאות עם בעלי עניין (ס' 270–275), דירקטורים חיצוניים (ס' 239), תביעה נגזרת (ס' 194 ואילך) ומבחני חלוקה שמגנים על נושים (ס' 302)."},{"t":"steps","title":"איך מזהים את סוג התאגיד בשאלה","x":["מי ייסד ולפי איזה חוק? חוק החברות, חוק העמותות, פקודת השותפויות או פקודת האגודות השיתופיות.","האם נדרש רישום כדי שהגוף יתקיים? בחברה ובעמותה כן; בשותפות לא (שות' 6).","האם מותר לחלק רווחים? בחברה כן (במבחני חלוקה); בעמותה ובחל״צ לא (עמ' 34ג, ס' 345ז).","מה היקף האחריות של החברים? בע״מ – מוגבלת; שותף כללי – בלתי מוגבלת, ביחד ולחוד.","ומה הסיומת בשם? בע״מ, חל״צ, ע״ר, או אף אחת מהן (שותפות)."]},{"t":"example","title":"דוגמה: מסעדה בלי רישום","x":"יוסי ורונה פתחו יחד מסעדה וחולקים ברווחים, בלי לחתום על מסמך ובלי לרשום דבר. ספק לא קיבל תשלום. <b>פתרון:</b> מתקיימים ״קשרי שותפות״: בני אדם המנהלים יחד עסק לשם הפקת רווחים (שות' 1). השותפות קיימת גם בלי רישום (שות' 6), אך היא אינה תאגיד, שכן רק שותפות רשומה היא תאגיד (שות' 66). כל אחד מהשניים חב ביחד ולחוד בחוב (שות' 20). אילו התאגדו כחברה בע״מ, אחריותם הייתה מוגבלת."},{"t":"exam","x":"הנושא נבחן בעיקר בשאלות אמריקאיות: מה פירוש אישיות נפרדת (ס' 4), חברת יחיד (ס' 3), הגדרת חברה ציבורית (ס' 1), הבחנה בין סוגי תאגידים, ובעיית הנציג (בעלות מרוכזת מול מפוזרת). בשאלה פתוחה, כשנושה מבקש לגבות מבעל מניות, פתחו תמיד בעיקרון: חברה היא אישיות נפרדת (ס' 4) ואחריות בעלי המניות מוגבלת (ס' 35). רק אחר כך עברו לחריגים: ערבות, הון שלא נפרע, אחריות אישית (ס' 54) והרמת מסך (ס' 6)."}],"mcq":[{"id":"u1-1","q":"אורי מחזיק ב-100% ממניות ״אורי שיווק בע״מ״ ומכהן כדירקטור היחיד שלה. ספק של החברה טוען שמאחר שלחברה בעל מניה אחד, אורי חב אישית בכל חובותיה. מה נכון?","o":["הטענה שגויה: החוק מתיר חברה עם בעל מניה אחד, והיא אישיות משפטית נפרדת ממנו.","הטענה נכונה רק אם אורי הוא גם הדירקטור היחיד.","הטענה נכונה: בחברת יחיד אין הפרדה בין החברה לבעליה.","הטענה שגויה רק אם הון החברה עולה על מיליון ₪.","הטענה נכונה, משום שחברת יחיד אינה יכולה להיות חברה בערבון מוגבל."],"a":0,"why":"ס' 3 מתיר חברה עם בעל מניה אחד, וס' 4 קובע שחברה היא אישיות משפטית נפרדת. האחריות המוגבלת (ס' 35) חלה גם על בעל מניה יחיד. אורי ייחשף לחוב רק בערבות, בהון שלא נפרע או בהרמת מסך (ס' 6).","w":["","כהונה כדירקטור אינה מבטלת את המסך. דירקטור אחראי אישית רק בשל הפרת חובותיו או מעשה עוולה שלו (ס' 54), לא מעצם התפקיד.","אין בחוק חריג כזה; ס' 3 ו-4 קובעים במפורש אחרת.","אין בחוק דרישת הון מינימלי לאישיות נפרדת.","חברת יחיד יכולה להיות בע״מ; היקף האחריות נקבע בתקנון (ס' 35), לא לפי מספר בעלי המניות."],"secs":["3","4","35"]},{"id":"u1-2","q":"מה מהבאים מתאר נכון את היקף הכשרות של חברה לפי חוק החברות?","o":["חברה כשרה לזכויות קנייניות בלבד, אך אינה יכולה לשאת באחריות פלילית.","לחברה כשרות משפטית רק לאחר שקיימה אסיפה שנתית ראשונה.","חברה כשרה לכל זכות, חובה ופעולה המתיישבת עם אופייה וטבעה כגוף מואגד.","חברה כשרה רק לפעולות המנויות במפורש בתקנונה.","לחברה אותה כשרות בדיוק כמו לאדם, ללא כל סייג."],"a":2,"why":"זו לשון ס' 4. הסייג ״המתיישבת עם אופייה וטבעה כגוף מואגד״ מוציא פעולות שרק אדם יכול לעשות (נישואין, מאסר).","w":["חברה יכולה לשאת באחריות פלילית (קנס) מכוח תורת האורגנים; ס' 4 כולל ״כל … חובה״.","קיום החברה מתחיל ביום ההתאגדות שבתעודה (ס' 5), לא באסיפה השנתית.","","ס' 4 אינו מגביל את הכשרות לתקנון. המטרות שבתקנון (ס' 32) נוגעות לתוקף פעולה כלפי החברה (ס' 55–56), לא לכשרות עצמה.","יש סייג מפורש: רק מה שמתיישב עם טבעה כגוף מואגד."],"secs":["4","5"]},{"id":"u1-3","q":"״אלפא בע״מ״ רשומה אצל רשם החברות. מניותיה אינן נסחרות בבורסה, אך איגרות החוב שלה הוצעו לציבור בתשקיף ומוחזקות בידי הציבור. מה סיווגה?","o":["חברה לתועלת הציבור.","חברה פרטית שהיא חברת איגרות חוב.","חברה פרטית רגילה, שלא חלים עליה כללי ממשל תאגידי כלל.","חברה ציבורית, משום שהציעה ניירות ערך לציבור.","חברה ציבורית, משום שיש לה נושים מהציבור."],"a":1,"why":"״חברה ציבורית״ (ס' 1) נבחנת לפי המניות: רשומות למסחר או שהוצעו לציבור בתשקיף ומוחזקות בידי הציבור. כאן רק איגרות החוב הוצעו, ולכן החברה פרטית, ובפרט ״חברת איגרות חוב״ (ס' 1). חלק מכללי החברה הציבורית חלים גם עליה (למשל ס' 239(א), 119(א)).","w":["חל״צ מוגדרת לפי מטרות ציבוריות ואיסור חלוקה בתקנון (ס' 345א), לא לפי הנפקה לציבור.","","זו חברת איגרות חוב, ועליה חלים כללים מחמירים: דירקטורים חיצוניים (ס' 239(א)), ועדת ביקורת (ס' 114) ועוד.","ההגדרה מתייחסת להצעת מניות, לא לכל נייר ערך.","קיום נושים מהציבור אינו הופך חברה לציבורית."],"secs":["1","239","114"]},{"id":"u1-4","q":"מה נכון לגבי ציון ״בע״מ״ בשם התאגיד?","o":["חברה שאחריות בעלי מניותיה מוגבלת תכלול בסוף שמה ״בערבון מוגבל״ או ״בע״מ״, ושותפות לא תירשם בשם המכיל מילים אלה.","שותפות מוגבלת חייבת לציין ״בע״מ״ כדי להגן על השותפים המוגבלים.","עמותה רשאית לבחור בין ״ע״ר״ ובין ״בע״מ״.","כל חברה חייבת לציין ״בע״מ״ בסוף שמה.","חל״צ מציינת ״בע״מ״ במקום ״חל״צ״."],"a":0,"why":"ס' 26 מחייב ציון ״בע״מ״ רק בחברה שאחריות בעליה מוגבלת. לפי שות' 10(א)(1) לא תירשם שותפות בשם המכיל ״בערבון מוגבל״ או ״בע״מ״.","w":["","שות' 10(א)(1) אוסר זאת; בשותפות מוגבלת יש לפחות שותף כללי החב בכל חיוביה (שות' 57).","עמותה מציינת ״עמותה״, ״עמותה רשומה״ או ״(ע״ר)״ (עמ' 8א).","חברה יכולה להיות בלתי מוגבלת באחריות (ס' 35(א)), ואז אסור לה לציין ״בע״מ״.","חל״צ מציינת ״חברה לתועלת הציבור״ או ״(חל״צ)״ בצד שמה (ס' 345ד)."],"secs":["26","35","שות' 10"]},{"id":"u1-5","q":"גל רכש 1,000 מניות בערך נקוב של 10 ₪ כל אחת ושילם בינתיים 4,000 ₪ בלבד. החברה (בע״מ) נקלעה לחדלות פירעון. מה היקף חשיפתו של גל לחובות החברה, בהנחה שאין עילה להרמת מסך ושלא חתם על ערבות?","o":["עד 10,000 ₪ – מלוא הערך הנקוב, נוסף על מה ששילם.","אין לו חשיפה כלל, כי הוא בעל מניות בחברה בע״מ.","עד שווי השוק של מניותיו ביום חדלות הפירעון.","חשיפה בלתי מוגבלת, כי לא שילם את מלוא התמורה.","עד 6,000 ₪ – יתרת הערך הנקוב שטרם שילם."],"a":4,"why":"לפי ס' 35(ב), בעלי מניות בעלות ערך נקוב אחראים ״לפירעון הערך הנקוב לפחות״. גל שילם 4,000 ₪ מתוך 10,000 ₪, ולכן יתרת 6,000 ₪ היא חוב שלו לחברה. מעבר לזה הוא מוגן באחריות המוגבלת.","w":["הוא חייב רק את היתרה שלא שילם. 4,000 ₪ כבר שולמו.","האחריות המוגבלת אינה פוטרת מתשלום הערך הנקוב שטרם נפרע (ס' 35(ב)).","החשיפה נמדדת לפי הערך הנקוב שלא נפרע, לא לפי שווי השוק.","אי-תשלום מלוא התמורה אינו מבטל את הגבלת האחריות; הוא יוצר חוב ביתרה בלבד.",""],"secs":["35"]},{"id":"u1-6","q":"בחברה ציבורית ישראלית טיפוסית יש בעל שליטה המחזיק 60% מהמניות, והיתר מפוזרות בציבור. איזו בעיית נציג מרכזית צפויה בה?","o":["אין בעיית נציג כשיש בעל שליטה, כי האינטרסים זהים.","ניגוד עניינים בין רשם החברות לבין הדירקטוריון.","ניגוד עניינים בין העובדים לבין הלקוחות.","ניגוד עניינים בין מנהלים חסרי בעלות לבין בעלי מניות מפוזרים שאין להם כוח לפקח עליהם.","ניגוד עניינים בין בעל השליטה לבין בעלי מניות המיעוט, למשל העברת ערך לבעל השליטה בעסקאות עמו."],"a":4,"why":"בבעלות מרוכזת הבעיה המרכזית היא בין בעל השליטה, שיכול להפיק טובות הנאה פרטיות, לבין המיעוט. לכן החוק מחייב אישור מיוחד לעסקאות עם בעל שליטה (ס' 270(4), 275) וחובת הגינות של בעל השליטה (ס' 193).","w":["דווקא לבעל השליטה יש אינטרס פרטי שעלול להתנגש באינטרס המיעוט.","רשם החברות אינו צד ליחסי בעלות ושליטה בחברה.","זה אינו יחס של בעלות ושליטה בחברה.","זו הבעיה האופיינית לבעלות מפוזרת. בחברה עם בעל שליטה, בעל השליטה יכול לפקח על המנהלים.",""],"secs":["193","270","275"]},{"id":"u1-7","q":"איזה מהתאגידים הבאים אינו יכול להיות מוקם בידי אדם אחד בלבד?","o":["חברה בע״מ.","עמותה.","חברת יחיד שמניותיה ללא ערך נקוב.","חברה לתועלת הציבור.","חברה שאחריות בעלי מניותיה אינה מוגבלת."],"a":1,"why":"לפי עמ' 1, ״שני בני אדם או יותר, שהם בגירים״ רשאים לייסד עמותה. חברה מכל סוג, ובכלל זה חל״צ, יכולה להיות עם בעל מניה אחד (ס' 3).","w":["ס' 3 מתיר חברה עם בעל מניה אחד.","","מניות ללא ערך נקוב (ס' 34) אינן משנות את ס' 3.","חל״צ היא חברה לפי חוק החברות, וס' 3 חל עליה.","גם חברה בלתי מוגבלת היא חברה, וס' 3 חל עליה."],"secs":["3","עמ' 1"]},{"id":"u1-8","q":"מה ההבדל המרכזי בין חל״צ לבין עמותה?","o":["חל״צ רשאית לחלק רווחים, ועמותה לא.","עמותה חייבת לפעול למטרות ציבוריות בלבד, וחל״צ רשאית לפעול לכל מטרה חוקית.","אין הבדל; אלה שני שמות לאותו תאגיד.","עמותה אינה תאגיד, וחל״צ היא תאגיד.","חל״צ היא חברה לפי חוק החברות שבתקנונה מטרות ציבוריות בלבד; עמותה קמה לפי חוק העמותות למטרה חוקית, שאינה חייבת להיות ציבורית."],"a":4,"why":"ס' 345א(א): חל״צ היא חברה שבתקנונה נקבעו ״מטרות ציבוריות בלבד״ (מהתוספת השנייה) ואיסור חלוקה. עמ' 1: עמותה קמה ״למטרה חוקית שאינה מכוונת לחלוקת רווחים״, ומטרתה העיקרית אינה עשיית רווחים. שתיהן אינן מחלקות רווחים.","w":["גם בחל״צ חלוקת רווחים אסורה (ס' 345ז).","זה הפוך: חל״צ מוגבלת למטרות ציבוריות, ועמותה – למטרה חוקית כלשהי.","החוקים, הרשמים ודרישות המטרה שונים.","עמותה היא תאגיד מיום הרישום (עמ' 8).",""],"secs":["345א","עמ' 1"]},{"id":"u1-9","q":"שלושה מהנדסים מנהלים יחד משרד תכנון לשם רווח כבר שנתיים, ולא רשמו דבר אצל רשם השותפויות. מה נכון?","o":["אין ביניהם שותפות, כי שותפות קמה רק ברישום.","קיימת ביניהם שותפות; אי-הרישום הוא עבירה אך אינו משפיע על קיומה, והיא אינה תאגיד כל עוד לא נרשמה.","קיימת ביניהם שותפות, והיא תאגיד לכל דבר.","השותפות בטלה, והם חבים רק כל אחד על מעשיו.","הם חברה בע״מ, כי הם פועלים כגוף עסקי."],"a":1,"why":"קשרי שותפות הם קשרים בין בני אדם המנהלים יחד עסק לשם הפקת רווחים (שות' 1). הרישום חובה (שות' 4), אבל אי-רישום ״לא ישפיע בשיקול אם השותפות קיימת״ (שות' 6). רק שותפות רשומה היא תאגיד (שות' 66).","w":["שות' 6 קובע במפורש שאי-רישום אינו משפיע על קיום השותפות.","","לפי שות' 66 רק שותפות רשומה היא תאגיד.","השותפות קיימת, והשותפים חבים ביחד ולחוד בחיוביה (שות' 20).","חברה קיימת רק מכוח רישום אצל רשם החברות (ס' 5, 10)."],"secs":["שות' 1","שות' 4","שות' 6","שות' 66"]},{"id":"u1-10","q":"ממתי קיימת חברה כאישיות משפטית?","o":["מיום תחילת הפעילות העסקית בפועל.","מיום כינוס האסיפה הכללית הראשונה.","מיום חתימת התקנון בידי בעלי המניות הראשונים.","מיום ההתאגדות המצוין בתעודת ההתאגדות.","מיום הגשת הבקשה לרשם."],"a":3,"why":"ס' 5: ״קיומה של חברה הוא מיום ההתאגדות המצוין בתעודת ההתאגדות ועד לפקיעת ההתאגדות״.","w":["פעולות לפני ההתאגדות הן פעולות יזם (ס' 12–14), והחברה טרם קיימת.","אין תנאי של אסיפה ראשונה.","חתימת התקנון היא שלב בהכנת הבקשה (ס' 23), לא מועד הלידה.","","הגשת הבקשה (ס' 8) עדיין אינה רישום."],"secs":["5","8","12"]},{"id":"u1-11","q":"דירקטוריון ״גלים בע״מ״ (חברה עסקית) שוקל לתרום 50,000 ₪ לעמותה לקידום ספורט נוער, תרומה שאין לה הצדקה עסקית. בתקנון יש הוראה המתירה תרומות. מה נכון?","o":["מותר בכל סכום, כל עוד הדירקטוריון אישר.","מותר רק באישור בית המשפט.","אסור, כי תכלית החברה היא השאת רווחים בלבד.","מותר: חברה רשאית לתרום סכום סביר למטרה ראויה גם ללא שיקול עסקי, אם נקבעה לכך הוראה בתקנון.","מותר רק אם החברה היא חל״צ."],"a":3,"why":"ס' 11(א) סיפה: חברה ״רשאית לתרום סכום סביר למטרה ראויה, אף אם התרומה אינה במסגרת שיקולים עסקיים״, אם נקבעה לכך הוראה בתקנון.","w":["הדרישה היא ל״סכום סביר״, לא לכל סכום.","אין דרישה לאישור בית משפט.","ס' 11(א) מתיר במפורש תרומה כזו.","","ס' 11 חל על חברה עסקית; על חל״צ הוא אינו חל (ס' 11(ב))."],"secs":["11"]},{"id":"u1-12","q":"מה מהבאים אינו נובע מעיקרון האישיות המשפטית הנפרדת של חברה בע״מ?","o":["בעל מניות יחיד יכול להיות עובד של החברה.","מותו של בעל מניות אינו מביא לסיום קיום החברה.","נכסי החברה שייכים לחברה ולא לבעלי מניותיה.","החברה יכולה לתבוע ולהיתבע בשמה.","בעל מניות שחתם על ערבות אישית לחוב החברה אינו חב בו."],"a":4,"why":"ערבות אישית יוצרת התחייבות חוזית עצמאית של הערב. המסך אינו מגן מפניה, ולכן הקביעה שהערב אינו חב שגויה ואינה נובעת מהאישיות הנפרדת.","w":["בעל המניות והחברה הם שני אנשים נפרדים (ס' 3–4), ולכן יכולים להתקיים ביניהם יחסי עבודה.","החברה קיימת עד לחיסולה (ס' 5), ללא קשר לגורל בעליה.","הנכסים שייכים לחברה כאישיות נפרדת.","זה ביטוי ישיר לאישיות נפרדת (ס' 4).",""],"secs":["4","5"]},{"id":"u1-13","q":"מה מהבאים מאפיין אגודה שיתופית, להבדיל מחברה בע״מ?","o":["אגודה שיתופית מבוססת על שוויון ועזרה הדדית בין חבריה, וחבריה הם הבעלים שלה.","אגודה שיתופית קיימת מרגע שחבריה הסכימו לפעול יחד, גם בלי רישום.","אגודה שיתופית אינה אישיות משפטית נפרדת מחבריה.","אדם אחד רשאי לייסד אגודה שיתופית.","באגודה שיתופית כוח ההצבעה של כל חבר נקבע לפי גובה ההון שהשקיע."],"a":0,"why":"אגודה שיתופית נועדה לעזרה הדדית ולרווחת החברים, היא בנויה על שוויון וניהול עצמי דמוקרטי, וחבריה הם הבעלים שלה ושל נכסיה. בחברה, לעומת זאת, הכוח נגזר מכמות המניות (ס' 82(ג)).","w":["","כמו חברה, אגודה שיתופית קיימת רק מרגע הרישום אצל רשם האגודות השיתופיות. רק שותפות קמה בלי רישום (שות' 6).","אגודה שיתופית רשומה היא אישיות משפטית נפרדת מחבריה, בדומה לחברה.","לפי חומר הקורס נדרשים לפחות שבעה חברים. אדם אחד יכול לייסד חברה (ס' 3), לא אגודה.","זה תיאור של חברה, שבה ההשפעה לפי המניות. באגודה העיקרון הוא שוויון בין החברים."],"secs":["3","82"]},{"id":"u1-14","q":"״גל אחזקות בע״מ״ מכרה את כל פעילותה. יש לה 5 מיליון ₪ במזומן וחובות של 1 מיליון ₪ בלבד. בעלי המניות רוצים לסגור את החברה ולקבל את היתרה. מה נכון?","o":["הדירקטוריון רשאי להחליט לבדו על פירוק החברה, כי זו החלטה עסקית.","אפשר לפרק את החברה מרצון: הדירקטורים (כולם או רובם) נותנים תצהיר כושר פירעון, והאסיפה הכללית מחליטה בהחלטה מיוחדת של שלושה רבעים מקולות המשתתפים.","חברה סולבנטית אינה יכולה להתפרק; פירוק אפשרי רק בהליכי חדלות פירעון.","די בהחלטה של האסיפה הכללית ברוב רגיל, בלי תצהיר.","את תצהיר כושר הפירעון נותן רואה החשבון המבקר, ולא הדירקטורים."],"a":1,"why":"פירוק מרצון נועד לחברה שיכולה לשלם את כל חובותיה. ההחלטה בסמכות האסיפה (ס' 57(8)) והיא ״החלטה מיוחדת״ – רוב של שלושה רבעים מקולות המשתתפים, בהזמנה של 21 יום לפחות (ס' 342ב, 342כד). קודם לכן הדירקטורים, כולם או רובם, מצהירים שהחברה תוכל לשלם את חובותיה במלואם בתוך 12 חודשים (ס' 342כה).","w":["פירוק מרצון הוא סמכות של האסיפה הכללית (ס' 57(8), 342כד), ואי אפשר להעביר אותה לדירקטוריון (ס' 58(א)).","","להפך: פירוק מרצון מיועד דווקא לחברה סולבנטית. הליכי חדלות פירעון מיועדים לחברה שאינה יכולה לשלם (ס' 342ד).","נדרשת החלטה מיוחדת של שלושה רבעים (ס' 342ב) ותצהיר כושר פירעון מראש (ס' 342כד–342כו).","ס' 342כה קובע שהתצהיר ניתן בידי הדירקטורים, כולם או רובם."],"secs":["57","342ב","342כד","342כה"]}],"cases":[{"id":"u1-c1","title":"פיצה של מאיר ותמר","facts":"מאיר ותמר מתכננים לפתוח רשת פיצריות. מאיר ישקיע 300,000 ₪ ותמר תנהל את הסניפים. הם מתלבטים בין ״שותפות״ בלי רישום לבין הקמת ״פיצה מ.ת. בע״מ״, שבה מאיר יחזיק 70% מהמניות ותמר 30%. לבסוף פתחו את הסניף הראשון כשותפות בלי לרשום אותה. כעבור שנה ספק הקמח ״טחנות הגליל בע״מ״ תובע 400,000 ₪ שלא שולמו, ומבקש לגבות את מלוא הסכום מביתה של תמר. תמר טוענת שהיא ״רק מנהלת״ ושהכסף הושקע על ידי מאיר.","parts":[{"q":"האם הספק רשאי לגבות מתמר את מלוא החוב? נמקו והפנו לדין.","pts":15,"model":["1. השאלה הראשונה היא אם נוצרו קשרי שותפות. מאיר ותמר מנהלים יחד עסק לשם הפקת רווחים, ולכן מתקיימת ההגדרה ״קשרי שותפות״ (שות' 1).","2. העובדה שתמר תורמת עבודה ומאיר הון אינה שוללת שותפות. השיקולים בשות' 2 אינם מוציאים שותף פעיל שחולק ברווחים.","3. אי-רישום השותפות מנוגד לחובה שבשות' 4, אך ״לא ישפיע בשיקול אם השותפות קיימת״ (שות' 6). השותפות קיימת גם אם אינה תאגיד (שות' 66).","4. כל שותף חב ביחד ולחוד בכל חיובי השותפות (שות' 20(א)). לכן הספק רשאי לגבות מתמר את מלוא החוב.","5. סייג: צו הוצאה לפועל נגד שותף לחוד יינתן רק אם השותפות פורקה, או אם הנושה קיבל פסק דין נגדה שלא קוים במלואו (שות' 20(ב)). תמר שתשלם יותר מחלקה זכאית להשתתפות יחסית מהשותפות ומשאר השותפים.","6. מסקנה: לטענת ״רק מנהלת״ אין משקל. אחריותה בלתי מוגבלת, ביחד ולחוד."],"check":["זיהוי קשרי שותפות לפי שות' 1","אי-רישום אינו שולל קיום (שות' 6)","אחריות ביחד ולחוד (שות' 20(א))","מגבלת ההוצאה לפועל (שות' 20(ב))","מסקנה ברורה"]},{"q":"האם המצב היה שונה אילו הקימו את ״פיצה מ.ת. בע״מ״? הסבירו את ההבדלים העיקריים.","pts":15,"model":["1. חברה קמה ברישום, והיא אישיות משפטית נפרדת מבעליה (ס' 4, 5). החוב לספק היה חוב של החברה בלבד.","2. בחברה בע״מ אחריות בעלי המניות מוגבלת (ס' 35, 26). מאיר ותמר חשופים רק ליתרת ערך נקוב שטרם שילמו (ס' 35(ב)).","3. חריגים: ערבות אישית שחתמו עליה; אחריות אישית של תמר אם ביצעה עוולה כנושאת משרה (ס' 54(א)); והרמת מסך לפי ס' 6, אם הוכחו הונאה, קיפוח נושה או נטילת סיכון בלתי סביר תוך פגיעה בתכלית החברה, ומודעות בעלי המניות.","4. בנוסף, בחברה ההחלטות מתקבלות באורגנים (אסיפה, דירקטוריון, מנכ״ל) ולא בהסכמה אישית בין השותפים, והיחסים מוסדרים בתקנון, שדינו כחוזה (ס' 17).","5. מסקנה: בחברה בע״מ הספק לא היה יכול, ככלל, לגבות מביתה של תמר."],"check":["אישיות נפרדת (ס' 4)","אחריות מוגבלת (ס' 35, 26)","חריגים: ערבות, ס' 54, הרמת מסך ס' 6","הבחנה במבנה הניהול/תקנון"]}]}]},{"id":"u2","title":"הקמת חברה, תקנון והון","short":"הקמה, תקנון והון","blurb":"תוכלו לתאר את שלבי רישום חברה, לזהות את הוראות החובה בתקנון, לחשב את הרוב הדרוש לשינוי תקנון ולהבחין בין הון רשום, מונפק ונפרע ובין סוגי הקצאות המניות.","secs":["8","9","10","17","18","20","22","26","27","32","33","34","40","286","288","304","224א","224ב","227"],"blocks":[{"t":"h","x":"איך ״נולדת״ חברה?"},{"t":"p","x":"חברה אינה קמה מעצמה. היא נולדת ב<b>רישום</b> אצל רשם החברות. עד הרישום יש רק יזמים, ומה שהם עושים בשם החברה העתידית נקרא ״פעולת יזם״ (ס' 12–14). החברה רשאית לאשר פעולה כזו בדיעבד אחרי שהתאגדה."},{"t":"law","law":"חוק החברות","sec":"8(א)","x":"המבקש לרשום חברה יגיש לרשם בקשה בדרך של תקשורת אלקטרונית לפי טופס שקבע השר ולה יצורפו: … עותק של התקנון; … הצהרה של הדירקטורים הראשונים על נכונותם לכהן כדירקטורים, כפי שקבע השר."},{"t":"steps","title":"שלבי רישום חברה","x":["בוחרים <b>שם</b> שאינו מטעה, אינו דומה לשם של תאגיד רשום או לסימן מסחר רשום ואינו פוגע בתקנת הציבור (ס' 25–28).","מנסחים <b>תקנון</b> שכולל את ארבעת פרטי החובה (ס' 18). בעלי המניות הראשונים חותמים עליו, וזהותם מאומתת בידי עורך דין או באופן מקוון (ס' 23).","מצרפים <b>הצהרת דירקטורים ראשונים</b> על נכונותם לכהן (ס' 8(א)(2)).","מגישים את הבקשה לרשם באופן מקוון ומשלמים <b>אגרת רישום</b> (ס' 8, 9(א)).","הרשם בודק שהתקיימו כל הדרישות, רושם את החברה, נותן לה מספר רישום ומוסר לה <b>תעודת התאגדות</b> (ס' 10(א)–(ג)).","החברה קיימת מיום ההתאגדות המצוין בתעודה (ס' 5). מכאן היא משלמת גם אגרה שנתית (ס' 9(ב))."]},{"t":"p","x":"<b>הדירקטורים הראשונים</b> הם אלה שמינו המייסדים ושנתנו את ההצהרה. כהונתם מסתיימת בתום האסיפה השנתית הראשונה, אלא אם נקבע אחרת בתקנון (ס' 220)."},{"t":"p","x":"<b>מה כוללת ההצהרה?</b> לפי ס' 8, הדירקטורים הראשונים מצהירים על <b>נכונותם לכהן</b>, בנוסח שקבע השר. ההצהרה נוספה לחוק כדי להדגיש שדירקטור הוא תפקיד עם אחריות אישית, ולא ״שם על נייר״: מי שמסכים לכהן נושא בחובות הזהירות והאמונים (ס' 252–254). בחברה ציבורית ובחברת איגרות חוב הדרישה מחמירה: כל מועמד לדירקטור מצהיר שיש לו <b>הכישורים</b> וה<b>זמן</b> הדרושים, מפרט את כישוריו, ומצהיר שאין לגביו מגבלות מינוי (ס' 224א–224ב)."},{"t":"law","law":"חוק החברות","sec":"224א","x":"לא ימונה לדירקטור בחברה ציבורית או בחברה פרטית שהיא חברת איגרות חוב ולא יכהן בחברה כאמור כדירקטור, מי שאין לו הכישורים הדרושים והיכולת להקדיש את הזמן הראוי, לשם ביצוע תפקיד של דירקטור בחברה"},{"t":"list","x":["<b>בכל חברה</b> לא ימונה לדירקטור קטין, פסול דין, מי שניתן לגביו צו לפתיחת הליכי חדלות פירעון כל עוד לא הופטר, ותאגיד שהחליט על פירוקו מרצון או שניתן לגביו צו פירוק או צו לפתיחת הליכים (ס' 227(א)). מועמד כזה חייב לגלות זאת למי שממנה אותו (ס' 227(ב)).","<b>בחברה ציבורית ובחברת איגרות חוב</b> לא ימונה מי שהורשע בעבירות מסוימות (כגון מרמה, שוחד ועבירות ניירות ערך), אלא אם חלפו חמש שנים מפסק הדין (ס' 226(א))."]},{"t":"law","law":"חוק החברות","sec":"10(ד)","x":"תעודת התאגדות שנמסרה לחברה תשמש ראיה חלוטה לכך כי נתמלאו כל הדרישות לפי חוק זה לענין הרישום ולכל ענין שהוא תנאי לכך. … אין בהוראת סעיף קטן (ד) כדי לרפא פגם בתקנון, או למנוע את הצורך בתיקונו."},{"t":"trap","x":"תעודת ההתאגדות היא ״ראיה חלוטה״ לכך שהליך הרישום תקין, ולכן אי אפשר לטעון שהחברה ״לא קמה כדין״. אבל היא <b>אינה מכשירה תקנון פגום</b> (ס' 10(ה)). הוראה בתקנון שסותרת את החוק נשארת פגומה ויש לתקן אותה."},{"t":"h","x":"התקנון – החוזה של החברה"},{"t":"law","law":"חוק החברות","sec":"17(א)","x":"דין התקנון כדין חוזה בין החברה ובין בעלי מניותיה ובינם לבין עצמם."},{"t":"p","x":"מכאן נובעות שלוש מסקנות: (1) בעל מניה יכול לתבוע את החברה, או בעל מניה אחר, על הפרת התקנון. (2) מפרשים את התקנון לפי דיני החוזים, בכפוף לחוק החברות. (3) הצדדים לחוזה הם <b>החברה ובעלי המניות בלבד</b>, ולא דירקטורים, עובדים או נושים בכובעם זה."},{"t":"law","law":"חוק החברות","sec":"18","x":"תקנון החברה יכלול את הפרטים הבאים: … שם החברה; … מטרות החברה; … פרטים בדבר הון המניות הרשום כאמור בסעיפים 33 ו־34; … פרטים בדבר הגבלת האחריות, כאמור בסעיף 35."},{"t":"p","x":"מעבר לארבעת פרטי החובה, החברה רשאית לכלול בתקנון כל נושא אחר הנוגע לה ולבעלי מניותיה, כגון זכויות בעלי המניות, דרכי ניהול ומספר הדירקטורים (ס' 19). כך, למשל, ״מספר הדירקטורים״ הוא פרט <b>רשות</b> ולא חובה."},{"t":"h","x":"שם ומטרות"},{"t":"p","x":"לא תירשם חברה בשם של תאגיד רשום או בשם דומה לו עד כדי להטעות, בשם הדומה לסימן מסחר רשום בתחום דומה בלי הסכמת בעליו (ס' 27), או בשם העלול לפגוע בתקנת הציבור (ס' 28). מי שנפגע יכול לבקש צו מניעה (ס' 30). שינוי שם טעון אישור הרשם (ס' 31), ותוקפו רק מרגע הרישום (ס' 40(1))."},{"t":"law","law":"חוק החברות","sec":"27(א)","x":"לא תרשם חברה בשם שהוא – … שמו של תאגיד הרשום כדין בישראל או הדומה לו עד כדי להטעות"},{"t":"example","title":"דוגמה: שם דומה","x":"״אורנים תוכנה בע״מ״ רשומה כבר שנים. יזם מבקש לרשום ״אורנים תכנה בע״מ״, שתעסוק גם היא בפיתוח תוכנה. <b>פתרון:</b> השאלה היא אם השם דומה לשם תאגיד רשום <b>עד כדי להטעות</b> (ס' 27(א)(1)). המבחן אובייקטיבי: האם אדם סביר עלול להתבלבל בין שתי החברות. כאן ההבדל הוא באות אחת והתחום זהה, ולכן הרשם צריך לסרב. אם החברה בכל זאת נרשמה, ״אורנים תוכנה״ רשאית לבקש מבית המשפט צו שיורה לחברה החדשה להימנע מהשימוש בשם (ס' 30). לעומת זאת, כשהתחומים שונים לגמרי (למשל ״אורנים תוכנה״ מול ״אורנים מעדניות״), הסיכוי להטעיה קטן בהרבה."},{"t":"law","law":"חוק החברות","sec":"32","x":"חברה תציין את מטרותיה בתקנונה על ידי קביעה של אחת ממטרות אלה: … לעסוק בכל עיסוק חוקי; … לעסוק בכל עיסוק חוקי למעט בסוגי עיסוקים שפורטו בתקנון; … לעסוק בסוגי עיסוקים שפורטו בתקנון."},{"t":"p","x":"מה קורה כשהחברה פועלת <b>מחוץ למטרותיה</b>? פעולה כזו אין לה תוקף כלפי החברה, אלא אם החברה אישרה אותה בדיעבד, או שהצד השני לא ידע ולא היה עליו לדעת על החריגה (ס' 56(א)). אישור בדיעבד ניתן באסיפה הכללית ברוב הדרוש לשינוי המטרות (ס' 56(ב)). שינוי מטרות, כמו שינוי שם, תקף רק מרגע הרישום (ס' 40(2))."},{"t":"h","x":"שינוי התקנון"},{"t":"law","law":"חוק החברות","sec":"20(א)","x":"חברה רשאית לשנות את תקנונה בהחלטה שהתקבלה ברוב רגיל באסיפה הכללית של החברה, אלא אם כן נקבע בתקנון כי דרוש רוב אחר או אם נתקבלה החלטה כאמור בסעיף 22."},{"t":"law","law":"חוק החברות","sec":"20(ב)","x":"נקבעה בחוק זה הוראה שניתן להתנות עליה, או נקבעה הוראה בתקנון לפיה דרוש רוב מסוים לשינוי הוראות התקנון, כולן או מקצתן, לא תהא החברה רשאית לשנות את ההוראה האמורה אלא בהחלטה שתתקבל באסיפה הכללית באותו רוב מסוים או ברוב המוצע, לפי הגבוה מבין השניים."},{"t":"example","title":"דוגמה: הרוב המשוריין","x":"בתקנון ״נוף בע״מ״ נקבע ששינוי התקנון טעון 75%. בעל השליטה (65%) מציע לקבוע שמעתה יספיק רוב רגיל. <b>פתרון:</b> לפי ס' 20(ב) נדרש הגבוה מבין הרוב הקיים (75%) לבין הרוב המוצע (רוב רגיל), כלומר 75%. ל-65% של בעל השליטה זה לא מספיק. אילו בתקנון היה 90% וההצעה הייתה להוריד ל-80%, היה נדרש 90%. כך ״השריון״ מגן על עצמו."},{"t":"law","law":"חוק החברות","sec":"20(ג)","x":"היו מניות החברה מחולקות לסוגים, לא ייעשה שינוי בתקנון שיפגע בזכויותיו של סוג מניות ללא אישור אסיפת אותו סוג, אלא אם כן נקבע אחרת בתקנון;"},{"t":"law","law":"חוק החברות","sec":"20(ד)","x":"על אף הוראות סעיף זה, שינוי בתקנון המחייב בעל מניה לרכוש מניות נוספות או להגדיל את היקף אחריותו, לא יחייב את בעל המניה ללא הסכמתו."},{"t":"list","x":["<b>תוקף:</b> שינוי התקנון תקף מיום ההחלטה או ממועד מאוחר שנקבע בה. יש למסור את ההחלטה לרשם בתוך 14 ימים (ס' 21). <b>חריג:</b> שינוי שם, שינוי מטרות והפיכה לחל״צ תקפים רק מרגע הרישום (ס' 40).","<b>הגבלה חוזית:</b> חברה רשאית להגביל בתקנון או בחוזה אחר את סמכותה לשנות את התקנון, בהחלטת אסיפה ברוב הדרוש לשינוי (ס' 22).","<b>סמכות בלעדית לאסיפה:</b> שינוי תקנון הוא סמכות של האסיפה הכללית שאי אפשר להתנות עליה (ס' 57(1), 58(א)).","<b>חובות בעלי המניות:</b> בהצבעה על שינוי תקנון על בעל המניה לנהוג בתום לב ולהימנע מקיפוח (ס' 192(א)(1), (ב))."]},{"t":"trap","x":"שני מלכודות נפוצות ב-20(ב): (1) בוחרים את הרוב ה<b>נמוך</b> במקום הגבוה. (2) מניחים שבעל שליטה עם יותר מ-50% יכול תמיד לשנות תקנון. אם יש רוב משוריין, הוא צריך להגיע לרוב המשוריין."},{"t":"h","x":"הון המניות: רשום, מונפק ונפרע"},{"t":"p","x":"<b>הון רשום</b> הוא ״תקרת ההנפקה״: מספר המניות (ולפעמים גם ערכן הנקוב) שהחברה רשאית להקצות לפי התקנון (ס' 33). <b>הון מונפק</b> הוא החלק שכבר הוקצה בפועל לבעלי מניות. ההפרש הוא הון רשום שטרם הונפק. <b>הון נפרע</b> הוא מה שבעלי המניות כבר שילמו על המניות שהוקצו להם. יתרת הערך הנקוב שלא שולמה היא חוב של בעל המניה לחברה (ס' 35(ב))."},{"t":"law","law":"חוק החברות","sec":"34","x":"מניות החברה יכול שיהיו כולן בעלות ערך נקוב או כולן ללא ערך נקוב. … היו מניות החברה ללא ערך נקוב, יחולו הוראות חוק זה המתייחסות להון מניות רשום או מונפק, בשינויים המחויבים, באופן שהון המניות הרשום יהיה מספר המניות הקבוע בתקנון וההון המונפק יהיה מספר המניות שהקצתה החברה."},{"t":"p","x":"מי מחליט? <b>הגדלת</b> ההון הרשום היא סמכות של האסיפה הכללית (ס' 286, 57(6)), משום שהיא פותחת פתח לדילול. <b>הקצאת</b> מניות בתוך גבולות ההון הרשום היא סמכות של הדירקטוריון (ס' 288(א), 92(א)(9)). בחברה פרטית עם סוג מניות אחד, ברירת המחדל היא זכות קדימה: מציעים קודם לבעלי המניות הקיימים לפי חלקם (ס' 290(א))."},{"t":"table","head":["סוג ההקצאה","מה זה","הכלל"],"rows":[["בערך נקוב (Par)","התמורה שווה לערך הנקוב","אין בעיה מיוחדת"],["בפרמיה","התמורה גבוהה מהערך הנקוב; ההפרש הוא ״פרמיה״ (ס' 1)","מותר; הפרמיה נרשמת בהון העצמי ואינה ״עודפים״ לצורך חלוקה (ס' 302(ב))"],["בניכיון (מתחת לערך הנקוב)","התמורה נמוכה מהערך הנקוב","מותר רק אם החברה הופכת להון מניות סכום השווה להפרש מרווחים, מפרמיה או ממקור אחר בהונה העצמי (ס' 304(א)), או באישור בית המשפט (ס' 304(ב))"],["מניות הטבה","מניות שמוקצות ללא תמורה לבעלי המניות הזכאים (ס' 1)","זו הקצאה בפחות מהערך הנקוב, ולכן חל ס' 304 (״לרבות מניות הטבה״). מחולקות לפי הערך הנקוב (ס' 306(ב))"],["מניות ללא ערך נקוב","אין ערך נקוב כלל (ס' 34)","אין ״ניכיון״, ולכן אין צורך בהליך של ס' 304"]]},{"t":"law","law":"חוק החברות","sec":"304(א)","x":"החליטה חברה להקצות מניות שלהן ערך נקוב, בתמורה הנמוכה מערכן הנקוב, לרבות מניות הטבה, עליה להפוך להון מניות חלק מרווחיה, כמשמעותם בסעיף 302(ב), מפרמיה על מניות, או מכל מקור אחר הכלול בהונה העצמי, האמורים בדוחות הכספיים האחרונים שלה, בסכום השווה להפרש שבין הערך הנקוב לבין התמורה."},{"t":"example","title":"דוגמה: הקצאה בניכיון","x":"ל״סלע בע״מ״ מניות בערך נקוב של 1 ₪. משקיע מוכן לשלם 0.60 ₪ למניה עבור 100,000 מניות. <b>פתרון:</b> ההפרש הוא 0.40 ₪ × 100,000 = 40,000 ₪. לפי ס' 304(א), החברה צריכה להפוך להון מניות 40,000 ₪ מרווחים, מפרמיה או ממקור אחר בהונה העצמי, לפי הדוחות האחרונים. אם אין לה מקור כזה, היא צריכה אישור בית
