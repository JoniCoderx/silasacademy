להם עניין אישי המשתתפים בהצבעה (בלי נמנעים), או שהמתנגדים מקרבם לא עולים על 2% מכלל זכויות ההצבעה.","<b>3 שנים</b>: חוזה ל־5 שנים טעון אישור מחדש כל 3 שנים (ס׳ 275(א1)(1)). החריג (ס׳ 275(א1)(2)) מאפשר תקופה ארוכה אם ועדת הביקורת קבעה שזה סביר – אבל השאלה ביקשה את המחמירה: אישור מחדש כל 3 שנים.","<b>פגמים</b>: אין אישור אסיפה; בעל השליטה וקרובו והיו\"ר אינם יכולים להיות חברים בוועדת הביקורת (ס׳ 115(ב)–(ג)); דנה לא רשאית להשתתף ולהצביע (ס׳ 278); וחובת גילוי (ס׳ 269).","<b>תוצאה</b>: העסקה חסרת תוקף כלפי החברה ודנה, וגם כלפי \"תמציות הגליל\" אם ידעה – והבעלים הוא אחיה (ס׳ 280). דנה הפרה גם את חובת ההגינות של בעל שליטה (ס׳ 193). ובתביעה – בעסקה עם בעל שליטה <b>הנטל עובר לבעלי השליטה</b> להוכיח הגינות מלאה (<b>גדיש נ׳ אלסינט</b>, ע״א 2718/09)."],"check":["בעלת שליטה לפי ס׳ 268 (25%)","עניין אישי דרך האח","עסקה חריגה + סיווג (ס׳ 117(1א)); ס׳ 270(4)","ועדת ביקורת ← דירקטוריון ← אסיפה ברוב מיוחד (ס׳ 275)","אישור מחדש כל 3 שנים (ס׳ 275(א1))","פגמים: אסיפה, הרכב ועדה, ס׳ 278","ס׳ 280 + ס׳ 193"]},{"q":"דונו בסוגיות שמעוררת התנהלותו של אסף. התבססו על הדין והפסיקה.","pts":20,"model":["בזמן כהונתו אסף היה נושא משרה וחב <b>חובת אמונים</b> (ס׳ 254): להימנע מתחרות (254(א)(2)), מניצול הזדמנות עסקית של החברה (254(א)(3)), ולמסור לחברה מידע (254(א)(4)).","<b>ההזדמנות של החברה</b>: אסף ניהל את המגעים <b>בשם החברה</b>, והם היו מתקדמים – ההזדמנות הבשילה בתוך החברה ובזכות תפקידו. לפי <b>דהן נ׳ דהן</b> (המחלקה הכלכלית, 2019) בודקים קודם את תחום הפעילות המוסכם של החברה, ולצדו את מבחן התחרות והמבחן הקנייני – וכאן כולם מצביעים על החברה.","<b>אחרי ההתפטרות</b>: הפסיקה קובעת שחובת האמונים לא נעלמת ברגע העזיבה. נושא משרה לא יכול להתפטר כדי \"לקטוף\" הזדמנות שהבשילה בזמן כהונתו, או לנצל מידע וקשרים שרכש בחברה (לבית המשפט העליון טרם הייתה הכרעה מפורשת בנושא, ולכן מנמקים מתכלית החובה).","<b>יישום</b>: אותה רשת, זמן קצר אחרי העזיבה, דרך חברה מתחרה עם מוצרים דומים – גם תחרות וגם ניצול הזדמנות, בלי גילוי ובלי אישור לפי ס׳ 255.","<b>תרופות</b> (ס׳ 256): דיני החוזים – פיצוי, <b>השבת הרווח</b>, נאמנות קונסטרוקטיבית על ההסכם, צו מניעה. כלפי החברה החדשה אפשר לשקול עשיית עושר ולא במשפט ועוולות מסחריות (אם נוצל מידע סודי)."],"check":["חובת אמונים ס׳ 254(א)(2)–(4)","ההזדמנות \"הבשילה\" בחברה","החובה נמשכת אחרי התפטרות (פסיקה)","יישום: אותה רשת, זמן קצר, מתחרה","תרופות: ס׳ 256, השבה, נאמנות קונסטרוקטיבית"]},{"q":"מה צריך לקרות כדי שדנה תקבל את השכר וההטבות?","pts":20,"model":["<b>כפל תפקידים</b>: בחברה ציבורית היו\"ר לא יכהן כמנכ\"ל (ס׳ 95). כדי שדנה תכהן בשני התפקידים צריך <b>החלטת אסיפה</b> ברוב מיוחד (רוב מקרב מי שאינם בעלי שליטה ואין להם עניין אישי, או מתנגדים עד 2%), לתקופות של עד 3 שנים כל אחת (ס׳ 121(ג)).","<b>תנאי כהונה של בעלת שליטה</b>: דנה היא בעלת שליטה (ס׳ 268), ולכן ההתקשרות איתה בתנאי כהונה והעסקה היא עסקה לפי <b>ס׳ 270(4)</b>.","<b>מסלול</b> (ס׳ 275(א)): <b>ועדת התגמול ← דירקטוריון ← אסיפה ברוב מיוחד</b>. נדרש <b>אישור</b> של ועדת התגמול, לא רק \"המלצה\". האישורים לפי מדיניות התגמול (ס׳ 275(ג1)).","יותר מ־3 שנים – אישור מחדש כל 3 שנים (ס׳ 275(א1)(1)). דנה לא משתתפת ולא מצביעה (ס׳ 278) וחייבת לגלות את עניינה (ס׳ 269).","<b>בעובדות</b>: חסרים אישור ועדת התגמול, אישור האסיפה ברוב מיוחד ואישור כפל התפקידים – לכן ההתקשרות <b>חסרת תוקף</b> (ס׳ 280).","<b>פסקת ההתגברות לא חלה</b>: ס׳ 272(ג)(3) היא לנושאי משרה לפי ס׳ 270(2), לא לבעל שליטה לפי ס׳ 270(4)."],"check":["כפל תפקידים: ס׳ 95 + ס׳ 121(ג)","בעלת שליטה, ס׳ 270(4)","ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד (ס׳ 275)","אישור ולא המלצה; מדיניות תגמול","ס׳ 278, 269; כל 3 שנים","חסרי תוקף (ס׳ 280)","אין פסקת התגברות לבעל שליטה"]},{"q":"דונו בסוגיות שמעוררות חלוקת הדיבידנד וההתנהלות הכספית של דנה.","pts":20,"model":["דיבידנד הוא \"חלוקה\" (ס׳ 1). מותר לחלק רק אם מתקיימים <b>שני מבחנים מצטברים</b> (ס׳ 302(א)).","<b>מבחן הרווח</b> (ס׳ 302(ב)): יתרת עודפים, או עודפים שנצברו בשנתיים האחרונות, לפי הגבוה. כאן – <b>מתקיים</b>.","<b>מבחן יכולת הפירעון</b>: אין חשש סביר שהחלוקה תמנע מהחברה לעמוד בחבויותיה <b>הקיימות והצפויות</b>. כאן – <b>נכשל</b>: 12 מיליון לפירעון בקרוב מול 3 מיליון במזומן, ובכל זאת חולקו 10 מיליון. <b>חלוקה אסורה.</b>","<b>הדירקטורים</b> (ס׳ 311): כל מי שהיה דירקטור בעת החלוקה נחשב כמי שהפר את ס׳ 252–254, אלא אם התנגד ונקט אמצעים סבירים, הסתמך בתום לב על מידע מטעה, או לא ידע ולא היה עליו לדעת. <b>אין פטור</b> לדירקטור בשל חלוקה (ס׳ 259(ב)).","<b>השבה מבעלי המניות</b> (ס׳ 310): בעל מניה משיב את מה שקיבל אם ידע או היה עליו לדעת. בחברה ציבורית חזקה שמי שאינו דירקטור, מנכ\"ל או בעל שליטה לא ידע (ס׳ 310(ב)) – החזקה לא חלה על דנה.","<b>המשיכות</b>: שימוש בכספי החברה לצרכים פרטיים – הפרת אמונים (ס׳ 254(א)(1)) וחובת ההגינות (ס׳ 193), ואולי גם \"חלוקה\" אסורה.","<b>הרמת מסך</b> לטובת הספק (ס׳ 6(א)): ערבוב כספים ושימוש בחברה ככיס פרטי כשהיא בקשיים – שימוש באישיות הנפרדת לקיפוח נושה, ודנה מודעת לכך. אפשר גם להשעות את חובות החברה כלפיה (ס׳ 6(ג)).","<b>מסלולים</b>: תביעת החברה, <b>תביעה נגזרת</b> (ס׳ 194 – בלי דרישה מוקדמת אם לאורגן המחליט עניין אישי, ס׳ 194(ד)(1)), ובחדלות פירעון – נאמן."],"check":["שני מבחנים מצטברים (ס׳ 302)","מבחן הרווח מתקיים","מבחן יכולת הפירעון נכשל","אחריות דירקטורים ס׳ 311 + אין פטור ס׳ 259(ב)","השבה ס׳ 310 + חזקה לציבור","המשיכות: ס׳ 254, 193","הרמת מסך ס׳ 6","תביעה נגזרת"]}]},"mc":[{"id":"x2m1","q":"במרץ החליט דירקטוריון של חברה על דיבידנד של 5 מיליון ₪, על סמך דוחות של השנתיים האחרונות שמראים עודפים של 10 מיליון ₪. באותה ישיבה הציג סמנכ\"ל הכספים תחזית: בגלל משבר בענף צפוי הפסד של 12 מיליון ₪ ברבעון הקרוב, ואחר כך התאוששות. האם החלוקה חוקית?","o":["מותרת, כי מבחן הרווח נשען רק על דוחות של תקופות שחלפו.","אסורה, כי הדירקטורים חייבים להתחשב בהפסד הצפוי ברבעון הקרוב.","אסורה, כי החברה חייבת להבטיח עמידה בחובותיה בשנתיים הקרובות, וההפסד מוכיח שאינה יכולה.","מותרת רק אם ההתאוששות תכסה את ההפסד של הרבעון.","תלויה באישור בית המשפט בגלל ההפסד הצפוי."],"a":1,"why":"מבחן הרווח אכן מתקיים, אבל חלוקה מחייבת גם את <b>מבחן יכולת הפירעון</b>, שמסתכל <b>קדימה</b>: אסור לחלק אם יש חשש סביר שהחברה לא תעמוד בחבויותיה <b>הקיימות והצפויות</b> (ס׳ 302(א)). הדירקטורים קיבלו תחזית להפסד גדול מהעודפים – הם חייבים לשקלל אותה, ובעובדות האלה החלוקה אסורה.","w":["מבחן הרווח לבדו לא מספיק – יש שני מבחנים מצטברים (ס׳ 302(א)).","","אין בחוק \"הבטחה לשנתיים\"; המבחן הוא חשש סביר. וגם ההפסד לא \"מוכיח\" אי־יכולת.","אין כלל כזה. בוחנים חשש סביר לעמידה בחבויות.","אישור בית משפט (ס׳ 303) הוא מסלול לחלוקה שאינה עומדת במבחן <b>הרווח</b>, לא פתרון לבעיה ביכולת הפירעון."],"secs":["302(א)","302(ב)","303"]},{"id":"x2m2","q":"בחברה עם <b>בעלות מרוכזת</b> (בעל שליטה), מה המקור המרכזי ל\"בעיית הנציג\"?","o":["החשש שבעל השליטה יעביר עושר אל מחוץ לחברה על חשבון המיעוט.","החשש שהמנהלים יעדיפו את טובתם על פני טובת בעלי המניות.","האחריות האישית שהחוק מטיל על נושאי משרה.","א׳ ו־ב׳ נכונות.","כל התשובות נכונות."],"a":0,"why":"כשיש בעל שליטה, הוא שולט גם במנהלים, ולכן הבעיה המרכזית עוברת ליחסים <b>בין בעל השליטה למיעוט</b>: \"מנהור\" – העברת ערך לבעל השליטה בעסקאות בעלי עניין, שכר וכו׳. לכן החוק מטיל עליו חובת הגינות (ס׳ 193) ומסלולי אישור מחמירים (ס׳ 270(4), 275).","w":["","זו בעיית הנציג בחברה עם <b>בעלות מפוזרת</b> (מנהלים מול בעלי המניות).","חובות זהירות ואמונים הן <b>פתרון</b> לבעיה, לא מקורה.","ב׳ מתאימה לבעלות מפוזרת, לא מרוכזת.","ב׳ ו־ג׳ אינן נכונות כאן."],"secs":["193","270(4)","275"]},{"id":"x2m3","q":"בחברה ציבורית: <b>יעל</b> 60%, <b>עידו</b> 20%, <b>נועם</b> 10% והציבור 10%. החברה רוצה להעסיק את אחיה של יעל כמהנדס לחמש שנים. באסיפה הצביעו מהציבור בעלי 2% מהמניות. מה נכון?","o":["אם עידו ונועם הצביעו בעד, ההחלטה תתקבל גם אם כל המשתתפים מהציבור הצביעו נגד.","אם הציבור הצביע נגד, ההחלטה לא תתקבל.","ההחלטה לא תתקבל כי החוזה ליותר מ־3 שנים.","אם עידו ונועם נמנעו, ההחלטה לא תתקבל בשום מקרה.","לא נדרש אישור מיוחד."],"a":0,"why":"הרוב המיוחד (ס׳ 275(א)(3)(א)) נספר רק בקרב בעלי המניות <b>שאין להם עניין אישי</b> המשתתפים בהצבעה. עידו (20%) ונועם (10%) – 30% בעד – מול 2% נגד: יש רוב. יעל, בעלת העניין האישי, לא נספרת.","w":["","הציבור הוא רק 2% מהמשתתפים; 30% בעד מנצחים.","חוזה ארוך אפשרי – רק צריך לאשר אותו מחדש כל 3 שנים (ס׳ 275(א1)(1)).","אם נמנעו, נמנעים לא נספרים. נשארים 2% מהציבור, וגם אם התנגדו – זה לא עולה על 2% מכלל זכויות ההצבעה (ס׳ 275(א)(3)(ב)), ולכן ייתכן שההחלטה תתקבל.","העסקת קרוב של בעל שליטה טעונה מסלול ס׳ 275."],"secs":["275(א)(3)","275(א1)","270(4)"]},{"id":"x2m4","q":"בתקנון של חברה פרטית נקבע ששינוי ההון הרשום טעון רוב של 75%. ההוראה עצמה הוכנסה לתקנון לפני שלוש שנים ברוב של 90%. עכשיו רוצים לשנות אותה כך ששינוי ההון יאושר ברוב רגיל. איזה רוב נדרש?","o":["75%","רוב רגיל","90%","שני שלישים","אין צורך בשינוי."],"a":0,"why":"כשהתקנון קובע רוב מיוחד להחלטה מסוימת, שינוי ההוראה הזו טעון <b>הגבוה מבין</b> הרוב שנקבע בה לבין הרוב שמבקשים לקבוע (ס׳ 20(ב)). כאן: 75% מול רוב רגיל → <b>75%</b>. הרוב שבו ההוראה התקבלה בעבר (90%) לא רלוונטי.","w":["","ברוב רגיל אפשר היה \"לעקוף\" את ההגנה – בדיוק מה שס׳ 20(ב) מונע.","הרוב שבו ההוראה הוכנסה לתקנון לא קובע.","אין מקור לשני שלישים.","ההוראה בתקנון מחייבת עד שתשונה."],"secs":["20(ב)"]}]},{"id":"x3","title":"מבחן לדוגמה 3 · חובת זהירות, פיקוח ופטור","note":"במבנה מועד ג׳ תשפ״ו: שאלת מקרה אחת (80 נק׳) על מנכ\"ל שהסתיר תקלות, תכנית ציות ופטור","open":{"facts":"חברת <b>\"נתיב אוויר מערכות בע\"מ\"</b> היא חברה ציבורית שמייצרת מערכות אלקטרוניקה לתעשיית התעופה. <b>גיל</b> מחזיק 60% מהמניות, ומכהן גם כמנכ\"ל וכדירקטור.\nהחברה מכרה לחברות תעופה מערכת ניווט חדשה. אחרי כשלושה חודשי שימוש הגיעו דיווחים על תקלות שעלולות לפגוע בבטיחות הטיסה. גיל קיבל את הדיווחים הראשונים, אבל החליט להמשיך לשווק את המוצר ולא לדווח לדירקטוריון, כי לדעתו מדובר בתקלות נקודתיות וזניחות.\nחודש אחר כך התברר שהתקלות נרחבות, ורשות התעופה הורתה להפסיק את השימוש במערכת. החברה נאלצה להחזיר את כל המערכות שנמכרו, בעלות של 10 מיליון ₪, וחלק מחברות התעופה תבעו אותה בנזיקין.\nבדיון בדירקטוריון אחרי האירוע התברר שגיל לא העביר את המידע הראשוני, ושאילו פעל מיד, אפשר היה למנוע חלק ניכר מהנזק. עוד התברר שהחברה לא יישמה תכנית ציות ואכיפה פנימית בנושא בטיחות, אף שהדירקטוריון החליט לאמץ תכנית כזו לפני שנתיים.\nבתקנון אין הוראה שמאפשרת פטור לנושאי משרה, והדירקטוריון מעולם לא דן בפטור לגיל.","parts":[{"q":"נתחו את הסוגיות שמתעוררות, כולל ההשלכות על סיכויי תביעה ועל הסעדים. נמקו לפי החומר הנלמד, הדין והפסיקה.","pts":80,"model":["<b>מעמד גיל</b>: מנכ\"ל ודירקטור, ולכן <b>נושא משרה</b> (ס׳ 1), וגם <b>בעל שליטה</b> (60%). חלות עליו חובות הזהירות והאמונים (ס׳ 252–254), וכבעל מניות גם חובת תום הלב וההגינות (ס׳ 192–193).","<b>חובת הזהירות</b> (ס׳ 252–253): נושא משרה סביר באותה עמדה ובאותן נסיבות היה בודק דיווחי בטיחות, משיג מידע ומביא אותו לדירקטוריון. גיל המשיך לשווק מוצר שעלול לסכן טיסות, בלי בדיקה. זו התנהגות שאינה סבירה.","<b>חובת דיווח של המנכ\"ל</b>: המנכ\"ל חייב להודיע ליו\"ר על כל עניין חריג שהוא מהותי לחברה (ס׳ 122(א)). תקלות בטיחות במוצר הדגל הן בדיוק עניין כזה – גיל הפר חובה מפורשת.","<b>כלל שיקול הדעת העסקי</b> לא יגן על גיל: הוא מגן על החלטה עסקית שהתקבלה <b>בתום לב, בלי ניגוד עניינים ועל סמך מידע מספק</b>. כאן ההחלטה התקבלה בלי בירור, תוך הסתרת מידע מהדירקטוריון, ובאופן שעוקף את האורגן המוסמך. לכן בית המשפט יבחן את סבירותה לגופה.","<b>נזק וקשר סיבתי</b>: נקבע שפעולה מיידית הייתה מונעת חלק ניכר מהנזק (עלות ההחזרה, 10 מיליון ₪, והחשיפה לתביעות). ההפרה גרמה לפחות לחלק מהנזק – וזה החלק שאפשר לתבוע מגיל.","<b>חובת האמונים</b>: הרצון לשמור על ערך המניות שלו אינו \"עניין אישי\" – ההגדרה בס׳ 1 מוציאה עניין שנובע מעצם החזקת מניות – ולכן לא כאן עיקר הטענה. אבל חובת האמונים כוללת גם <b>מסירת כל מידע</b> הנוגע לעניני החברה שהגיע אליו בתוקף מעמדו (ס׳ 254(א)(4)), וגיל הסתיר דיווחי בטיחות מהדירקטוריון.","<b>הדירקטוריון – חובת פיקוח</b>: הדירקטוריון מתווה מדיניות ו<b>מפקח</b> על המנכ\"ל (ס׳ 92(א)). הוא החליט לאמץ תכנית ציות ולא דאג ליישם אותה במשך שנתיים. כשל פיקוח מתמשך כזה עשוי להיות הפרה של חובת הזהירות של הדירקטורים עצמם, וכלל שיקול הדעת העסקי לא מגן על <b>מחדל</b> שאין מאחוריו החלטה מודעת. על אחריות דירקטורים שלא פיקחו ראו <b>בוכבינדר</b> (ע״א 610/94, דירקטורי בנק צפון אמריקה, 2003). דוקטרינת Caremark האמריקאית טרם אומצה בפסק דין מחייב, אבל המחלקה הכלכלית רמזה שהיא צפויה להיות מאומצת. מנגד, הדירקטורים יטענו שגיל הסתיר מהם את המידע.","<b>פטור</b>: אין פטור, משתי סיבות. אין הוראה בתקנון (ס׳ 259(א)), ופטור ניתן רק <b>מראש</b> – אי אפשר לאשר אותו עכשיו על אירוע שכבר קרה. וגם אילו היה: פטור לבעל שליטה כנושא משרה טעון את מסלול ס׳ 275 (ס׳ 270(4)), ואינו חל על הפרה בכוונה או בפזיזות (ס׳ 263). הסתרה מודעת של דיווחי בטיחות קרובה לפזיזות.","<b>ביטוח ושיפוי</b> (ס׳ 260–261): אפשריים רק לפי התקנון, ולא על פעולה בכוונה או בפזיזות (ס׳ 263) – ולכן ייתכן שגם הביטוח לא יכסה את גיל.","<b>כלפי חברות התעופה</b>: החברה אחראית בנזיקין (אחריות אורגנית ושילוחית). גיל עשוי לשאת באחריות אישית בנזיקין לצד שלישי (ס׳ 252(ב)), כי הוא עצמו קיבל את ההחלטה המסוכנת.","<b>מי תובע ואיך</b>: החברה רשאית לתבוע את גיל, אבל הוא שולט בה, ולכן המסלול המעשי הוא <b>תביעה נגזרת</b> של בעל מניה או דירקטור (ס׳ 194). לא נדרשת דרישה מוקדמת כשלאורגן המחליט יש עניין אישי (ס׳ 194(ד)(1)). אפשר לתבוע גם דירקטורים שכשלו בפיקוח.","<b>סעדים</b>: פיצוי לחברה בגובה החלק שהיה נמנע (מגיל, ואולי מהדירקטורים); בהפרת אמונים – גם השבת רווחים (ס׳ 256).","<b>מסקנה</b>: לתביעה נגד גיל סיכוי טוב. היא נשענת על הפרת חובת הזהירות וחובת הדיווח (ס׳ 122), ואין פטור ואין הגנה של שיקול הדעת העסקי. לתביעה נגד הדירקטורים סיכוי בינוני, והיא תלויה במידת ידיעתם ובסבירות הפיקוח."],"check":["גיל: נושא משרה + בעל שליטה","הפרת זהירות (ס׳ 252–253) + יישום","חובת דיווח ליו\"ר (ס׳ 122)","כלל שיקול הדעת העסקי – למה לא חל","נזק וקשר סיבתי (החלק שהיה נמנע)","אמונים: חובת מסירת מידע (ס׳ 254(א)(4)); החזקת מניות אינה עניין אישי","חובת פיקוח של הדירקטוריון; תכנית הציות שלא יושמה","אין פטור: תקנון + רק מראש + ס׳ 263","ביטוח ושיפוי (ס׳ 260–261)","אחריות כלפי צד שלישי","תביעה נגזרת (ס׳ 194) ופטור מדרישה","סעדים + מסקנה"]}]},"mc":[{"id":"x3m1","q":"חברה ציבורית מוכרת 2,000 מניות במכרז אחיד (כל הזוכים משלמים אותו מחיר). הביקושים: 5,000 מניות ב־100 ₪, 2,000 מניות ב־250 ₪, 1,000 מניות ב־300 ₪ ו־600 מניות ב־500 ₪. מה נכון?","o":["כל 2,000 המניות יימכרו ב־250 ₪ למניה.","משקיע שביקש 30 מניות ב־250 ₪ יקבל רק 6.","החברה לא תוכל לענות על כל הביקושים, אלא אם תגדיל את הכמות המוצעת.","משקיעה שביקשה 70 מניות ב־500 ₪ תקבל את כולן ב־250 ₪.","כל התשובות נכונות."],"a":4,"why":"מסדרים מהמחיר הגבוה: 600 (ב־500) + 1,000 (ב־300) = 1,600. ב־250 מצטברים עוד 2,000 → 3,600 ≥ 2,000. לכן <b>מחיר הסליקה 250</b>, וכולם משלמים 250 (א׳ ו־ד׳ נכונות). מי שהציע יותר מ־250 מקבל הכול; נשארו 400 מניות ל־2,000 שביקשו ב־250 → <b>20%</b> מכל הזמנה: 30 × 20% = 6 (ב׳). הביקוש במחיר הסליקה ומעליו (3,600) גדול מההיצע (ג׳).","w":["נכונה, אבל לא לבד.","נכונה, אבל לא לבד.","נכונה, אבל לא לבד.","נכונה, אבל לא לבד.",""],"secs":[]},{"id":"x3m2","q":"דירקטוריון החליט על דיבידנד של 10 מיליון ₪, על סמך עודפים של 20 מיליון ₪ בשנתיים האחרונות. באותה ישיבה הציג המנכ\"ל תחזית להפסד של 15 מיליון ₪ ברבעון הקרוב, ואחר כך התאוששות. האם החלוקה חוקית?","o":["מותרת, כי מבחן הרווח נשען רק על דוחות של תקופות שחלפו.","אסורה, כי הדירקטורים חייבים להתחשב בהפסד הצפוי ברבעון הקרוב.","אסורה, כי החברה חייבת להבטיח עמידה בחובותיה בשנתיים הקרובות, וההפסד מעיד <b>בהכרח</b> שאינה יכולה.","מותרת רק אם ההתאוששות תכסה את ההפסד.","תלויה באישור בית המשפט."],"a":1,"why":"אותו עיקרון כמו במבחן 2: מבחן יכולת הפירעון מסתכל <b>קדימה</b> – על חבויות קיימות <b>וצפויות</b> (ס׳ 302(א)). הדירקטורים חייבים לשקלל את התחזית. ג׳ שגויה בגלל המילה \"בהכרח\" ובגלל \"חובת הבטחה לשנתיים\" שאינה בחוק.","w":["שני מבחנים מצטברים (ס׳ 302(א)); מבחן הרווח לבדו לא מספיק.","","\"בהכרח\" ו\"הבטחה לשנתיים\" – לא כך המבחן. המבחן הוא חשש סביר.","אין כלל כזה.","ס׳ 303 עוסק בחלוקה שאינה עומדת במבחן הרווח."],"secs":["302(א)","303"]},{"id":"x3m3","q":"בתקנון של חברה פרטית משנת 2005 נקבע ששינוי התקנון יהיה ברוב של 90%. בעל מניות שמחזיק 85% רוצה לשנות את ההוראה כך שיידרש רוב של 80% לשינוי התקנון. איזה רוב נדרש?","o":["90%","רוב רגיל (מעל 50%)","75%","80%","פה אחד (100%)"],"a":0,"why":"ס׳ 20(ב): שינוי הוראה שקובעת רוב מיוחד – <b>באותו רוב או ברוב המוצע, לפי הגבוה</b>. 90% מול 80% → <b>90%</b>. לבעל ה־85% אין די קולות לבד.","w":["","ברירת המחדל (ס׳ 20(א)) לא חלה כשהתקנון קבע רוב מיוחד.","אין מקור ל־75% כאן.","80% הוא הרוב המוצע, אבל הגבוה מבין השניים קובע.","אין דרישה לפה אחד."],"secs":["20(ב)"]},{"id":"x3m4","q":"אפי רכש מהחברה 50,000 מניות ב־50 ₪ למניה, על פי תשקיף. כעבור 3 שנים המחיר צנח ל־10 ₪, ואפי גילה שבתשקיף היה פרט מטעה. הוא רוצה לבטל את הרכישה. מה נכון?","o":["אפי לא יכול לבטל את הרכישה, אבל יכול לתבוע את הנזק שנגרם לו מירידת המחיר.","אפי יכול לבטל את הרכישה וגם לתבוע את הנזק.","אפי יכול לבטל, אבל לא לתבוע נזק.","אפי יכול לבטל, כי רכש ישירות מהמנפיק.","אפי לא יכול לבטל ולא לתבוע, כי אינו יכול להוכיח הסתמכות."],"a":0,"why":"<b>ביטול</b> (ס׳ 35(א) לחוק ניירות ערך): רק למי שרכש מהמציע, תוך זמן סביר מהגילוי, ו<b>לא יאוחר משנתיים</b> מהרכישה. עברו 3 שנים – אין ביטול. <b>פיצוי</b> (ס׳ 31): החותמים על התשקיף, הדירקטורים, המנכ\"ל ובעל השליטה אחראים לנזק בשל פרט מטעה, ו<b>הסתמכות אינה תנאי</b> לתביעת הנזק (בשונה מביטול). זו התשובה שהמבחן מכוון אליה. שימו לב: ס׳ 31(ב) קובע תקופת התיישנות מיוחדת – כדאי להזכיר אותה בתשובה פתוחה.","w":["","עברו יותר משנתיים, ולכן אין ביטול (ס׳ 35(א)).","גם הביטול חסום (שנתיים), וגם תביעת נזק אפשרית.","רכישה מהמנפיק היא תנאי לביטול, אבל לא מספיקה – המועד חלף.","לתביעת נזק לפי ס׳ 31 לא צריך להוכיח הסתמכות."],"secs":["ני\"ע 31","ני\"ע 35"]}]}],"law":[{"sec":"1","title":"הגדרות","law":"חוק החברות","text":"בחוק זה –\n ”איגרת חוב“ – מסמך שהנפיקה חברה המעיד על קיומה של התחייבות כספית שחבה החברה, ומגדיר את תנאיה, למעט שטרי חוב או שטרי חליפין שנתנה חברה במהלך עסקיה;\n ”איגרת חוב מובטחת“ – איגרת חוב שהתחייבות החברה לפיה מובטחת במשכון על נכסי החברה, כולם או מקצתם;\n ”אמצעי שליטה“ – כל אחד מאלה:\n(1) זכות ההצבעה באסיפה כללית של חברה;\n(2) הזכות למנות דירקטור של חברה;\n ”אסיפה כללית“ – אסיפה שנתית או אסיפה מיוחדת של בעלי המניות;\n ”אסיפה מיוחדת“ – אסיפה כללית של בעלי המניות שאינה אסיפה שנתית;\n ”אסיפת סוג“ – אסיפה של בעלי סוג מניות;\n ”אסיפה שנתית“ – אסיפה של בעלי המניות לפי סעיף 60;\n ”בורסה“ – בורסה בישראל, בורסה מחוץ לישראל שקיבלה אישור מידי מי שרשאי לתתו על פי דין במדינה שבה היא פועלת, וכן שוק מוסדר כהגדרתו בחוק השקעות משותפות בנאמנות, התשנ״ד–1994;\n ”בורסה בישראל“ – בורסה כהגדרתה בחוק ניירות ערך;\n ”בעל איגרת חוב“, בחברת איגרות חוב – בעל איגרת חוב של החברה, הרשומה למסחר בבורסה או שהוצעה לציבור על פי תשקיף כמשמעותו בחוק ניירות ערך או שהוצעה לציבור מחוץ לישראל על פי מסמך הצעה לציבור הנדרש לפי הדין מחוץ לישראל;\n ”בית המשפט“ – \n ”בעל מניה מהותי“ – מי שמחזיק בחמישה אחוזים או יותר מהון המניות המונפק של החברה או מזכויות ההצבעה בה;\n ”בעל ענין“ – בעל מניות מהותי, מי שיש לו הסמכות למנות דירקטור אחד או יותר או את המנהל הכללי, ומי שמכהן בחברה כדירקטור או כמנהל כללי;\n ”דבוקת שליטה“ – מניות המקנות עשרים וחמישה אחוזים או יותר מכלל זכויות ההצבעה באסיפה הכללית;\n ”דיבידנד“ – כל נכס הניתן על ידי החברה לבעל מניה מכוח זכותו כבעל מניה, בין במזומן ובין בכל דרך אחרת, לרבות העברה ללא תמורה שוות ערך ולמעט מניות הטבה;\n ”דירקטור“ – חבר בדירקטוריון של חברה;\n ”דירקטור בלתי תלוי“ – דירקטור חיצוני או יחיד המכהן כדירקטור שמתקיימים לגביו התנאים המפורטים להלן, אשר מונה או סווג ככזה לפי הוראות פרק ראשון לחלק השישי:\n(1) מתקיימים לגביו תנאי הכשירות למינוי דירקטור חיצוני הקבועים בסעיף 240(ב) עד (ו) וועדת הביקורת אישרה זאת;\n(2) הוא אינו מכהן כדירקטור בחברה מעל תשע שנים רצופות, ולעניין זה לא יראו בהפסקת כהונה שאינה עולה על שנתיים כמפסיקה את רצף הכהונה;\n ”דירקטור חיצוני“ – כמשמעותו בחלק שישי, פרק ראשון, בסימן ה׳;\n ”דמי פיגורים“ ו”ריבית שקלית“ – כהגדרתם בחוק פסיקת ריבית והצמדה;\n ”החזקה“ ו”רכישה“ – כמשמעותן בחוק ניירות ערך;\n ”הליכי חדלות פירעון“ – כהגדרתם בחוק חדלות פירעון ושיקום כלכלי;\n ”הצעה פרטית“ – הצעה להנפקת ניירות ערך של חברה ציבורית שאינה הצעה לציבור, או הצעה של חברה ציבורית למכירה של ניירות ערך שלה אשר נרכשו על ידה לפי סעיף 308, שאינה הצעה לציבור;\n ”הצעה פרטית מהותית“ – הצעה פרטית שמתקיים בה האמור בסעיף 270(5);\n ”הצעת רכש“ – הצעה לרכישת מניות, המופנית לציבור בעלי המניות של חברה;\n ”ועדת דירקטוריון“ – ועדה שהקים הדירקטוריון לפי הוראות סעיף 110;\n ”חבר בורסה“ – מי שהוא חבר בורסה בהתאם לתקנון הבורסה כמשמעותו בסעיף 46 לחוק ניירות ערך;\n ”חברה“ – חברה שהתאגדה לפי חוק זה, לפי פקודת החברות, פקודת החברות 1921 או פקודת החברות 1919;\n ”חברת איגרות חוב“ – חברה שאיגרות חוב שלה רשומות למסחר בבורסה או שהוצעו לציבור על פי תשקיף כמשמעותו בחוק ניירות ערך, או שהוצעו לציבור מחוץ לישראל על פי מסמך הצעה לציבור הנדרש לפי הדין מחוץ לישראל, ומוחזקות בידי הציבור;\n ”חברה בת“ – כמשמעותה בחוק ניירות ערך;\n ”חברה לרישומים“ – כמשמעותה בחוק ניירות ערך;\n ”חברה לתועלת הציבור“ – כמשמעותה בפרק ראשון א׳ בחלק התשיעי;\n ”חברה ממשלתית“ ו”חברת בת ממשלתית“ – כהגדרתן בחוק החברות הממשלתיות, התשל״ה–1975;\n ”חברה מתמזגת“ – חברת יעד וחברה קולטת;\n ”חברה פרטית“ – חברה שאינה חברה ציבורית;\n ”חברה ציבורית“ – חברה שמניותיה רשומות למסחר בבורסה או שהוצעו לציבור על פי תשקיף כמשמעותו בחוק ניירות ערך, או שהוצעו לציבור מחוץ לישראל על פי מסמך הצעה לציבור הנדרש לפי הדין מחוץ לישראל, ומוחזקות בידי הציבור;\n ”חברה קולטת“ – חברה שכל נכסיה והתחייבויותיה של חברת היעד עוברים אליה במיזוג;\n ”חברה קשורה“ – כמשמעותה בחוק ניירות ערך;\n ”חברת חוץ“ – תאגיד, למעט שותפות, שהתאגד מחוץ לישראל;\n ”חברת יעד“ – חברה, אחת או יותר, האמורה להתמזג עם חברה קולטת באופן שיביא לחיסולה של החברה;\n ”חברת מטרה“ – חברה שהצעת רכש מופנית לבעלי מניותיה;\n ”חוק הנאמנות“ – חוק הנאמנות, התשל״ט–1979;\n ”חוק העמותות“ – חוק העמותות, התש״ם–1980;\n ”חוק חדלות פירעון ושיקום כלכלי“ – חוק חדלות פירעון ושיקום כלכלי, התשע״ח–2018;\n ”חוק ניירות ערך“ – חוק ניירות ערך, התשכ״ח–1968;\n ”חוק פסיקת ריבית והצמדה“ – חוק פסיקת ריבית והצמדה, התשכ״א–1961;\n ”חוק תקשורת דיגיטלית עם גופים ציבוריים“ – חוק תקשורת דיגיטלית עם גופים ציבוריים, התשע״ח–2018;\n ”חלוקה“ – מתן דיבידנד או התחייבות לתיתו, במישרין או בעקיפין, וכן רכישה; ולענין זה, ”רכישה“ – רכישה או מתן מימון לרכישה, במישרין או בעקיפין, בידי חברה או בידי חברה בת שלה או בידי תאגיד אחר בשליטתה, של מניות החברה או של ניירות ערך שניתן להמירם למניות החברה או שניתן לממשם במניות החברה, או פדיון של ניירות ערך בני פדיון שהם חלק מהונה העצמי של החברה בהתאם לסעיף 312(ד), ולרבות התחייבות לעשיית כל אחד מאלה, והכל, ובלבד שהמוכר אינו החברה עצמה או תאגיד אחר בבעלותה המלאה של החברה;\n ”יום ההתאגדות“ – התאריך שקבע הרשם כיום ההתאגדות של החברה בתעודת ההתאגדות;\n ”יזם“ – מי שעושה פעולה, בשמה או במקומה של חברה שטרם התאגדה;\n ”מדד“ – מדד המחירים לצרכן שמפרסמת הלשכה המרכזית לסטטיסטיקה;\n ”מיזוג“, לענין החלק השמיני – העברה של כלל הנכסים והחיובים, לרבות חיובים מותנים, עתידיים, ידועים ובלתי ידועים, של חברת יעד לחברה קולטת, אשר כתוצאה ממנה מתחסלת חברת היעד, בהתאם לסעיף 323;\n ”מניה“ – אגד של זכויות בחברה הנקבעות בדין ובתקנון;\n ”מניות הטבה“ – מניות שמקצה החברה ללא תמורה לבעלי מניותיה הזכאים לכך;\n ”מנין קולות“ – מנין קולות המצביעים, בהתאם לזכויות ההצבעה הקבועות למניות שמכוחן מצביעים בעלי המניות המשתתפים באסיפה;\n ”מספר זהות“ –\n(1) לגבי חברה הרשומה בישראל – מספר הרישום;\n(2) לגבי חברה רשומה הרשומה מחוץ לישראל – המדינה שבה היא רשומה ומספר הרישום, אם יש לה מספר רישום;\n(3) לגבי תאגיד אחר שיש לו מספר רישום על פי דין – מספר הרישום שלו;\n(4) לגבי יחיד תושב ישראל – מספר זהותו במרשם האוכלוסין;\n(5) לגבי יחיד שאינו תושב ישראל – המדינה שבה הוצא הדרכון ומספר הדרכון;\n ”מען“ –\n(1) לגבי יחיד תושב ישראל – מענו כפי שהוא רשום במרשם האוכלוסין, ואם מסר מען אחר – המען שמסר;\n(2) לגבי יחיד שאינו תושב ישראל – מען מגוריו, ואם מסר מען אחר – המען שמסר;\n(3) לגבי חברה הרשומה בישראל – מען משרדה הרשום;\n(4) לגבי חברה הרשומה מחוץ לישראל – מען משרדה מחוץ לישראל, ואם מסרה מען בישראל – המען שמסרה;\n(5) לגבי תאגיד אחר שיש לו מען רשום על פי דין – מענו הרשום;\n ”מען דיגיטלי“ – כל אחד מהפרטים המנויים בתוספת הרביעית;\n ”מענק פרישה“ – מענק, תשלום, גמול, פיצוי או כל הטבה אחרת הניתנים לנושא משרה בזיקה לסיום תפקידו בחברה;\n ”מציע“, בהצעת רכש – מי שמציע הצעת רכש;\n ”משכון“ – כמשמעותו בחוק המשכון, התשכ״ז–1967, וכן שעבוד צף;\n ”נוכחות בעל מניות“, באסיפה כללית – נוכחות בעל המניות בעצמו או באמצעות שלוח, או באמצעות כתב הצבעה כאמור בסעיף 87;\n ”נושא משרה“ – מנהל כללי, מנהל עסקים ראשי, משנה למנהל כללי, סגן מנהל כללי, כל ממלא תפקיד כאמור בחברה אף אם תוארו שונה, וכן דירקטור או מנהל הכפוף במישרין למנהל הכללי;\n ”נייר ערך“ – לרבות מניה, איגרת חוב, או זכויות לרכוש, להמיר או למכור כל אחת מאלה;\n ”ניצע“, בהצעת רכש – בעל המניות שמוצע לרוכשן בהצעת רכש;\n ”סדרת איגרות חוב“ – שתי איגרות חוב או יותר שהן שוות־דרגה לענין ההתחייבות הכספית והערובה לתשלומה;\n ”ענין אישי“ – ענין אישי של אדם בפעולה או בעסקה של חברה, לרבות ענין אישי של קרובו ושל תאגיד אחר שהוא או שקרובו הם בעלי ענין בו, ולמעט ענין אישי הנובע מעצם החזקת מניות בחברה, לרבות עניין אישי של אדם המצביע על פי ייפוי כוח שניתן לו מאת אדם אחר אף אם אין לאחר עניין אישי, וכן יראו הצבעה של מי שקיבל ייפוי כוח להצביע בשם מי שיש לו עניין אישי כהצבעה של בעל העניין אישי, והכל בין אם שיקול הדעת בהצבעה הוא בידי המצביע ובין אם לאו;\n ”עסקה“ – חוזה או התקשרות וכן החלטה חד צדדית של חברה בדבר הענקת זכות או טובת הנאה אחרת;\n ”עסקה חריגה“ – עסקה שאינה במהלך העסקים הרגיל של החברה, עסקה שאינה בתנאי שוק או עסקה העשויה להשפיע באופן מהותי על רווחיות החברה, רכושה או התחייבויותיה;\n ”פעולה“ – פעולה משפטית, בין במעשה ובין במחדל;\n ”פעולה מהותית“ – פעולה העשויה להשפיע באופן מהותי על רווחיות החברה, רכושה או התחייבויותיה;\n ”פקודת החברות“ – פקודת החברות [נוסח חדש], התשמ״ג–1983;\n ”פרמיה“ – סכום שבו עולה תמורת ההקצאה של מניות החברה על ערכן הנקוב של המניות;\n ”צו לפתיחת הליכים“ – צו לפתיחת הליכים שניתן לפי חוק חדלות פירעון ושיקום כלכלי;\n ”קרוב“ – בן זוג, אח או אחות, הורה, הורי הורה, צאצא וכן צאצא, אח, אחות או הורה של בן הזוג או בן זוגו של כל אחד מאלה;\n ”רואה חשבון מבקר“ – רואה חשבון שמונה לשם ביצוע פעולת ביקורת כאמור בסעיף 154;\n ”רשות ניירות ערך“ – הרשות כמשמעותה בחוק ניירות ערך;\n ”רשם ההקדשות“ ו”הקדש ציבורי“ – כמשמעותם בחוק הנאמנות;\n ”רשם החברות“, ”הרשם“ – רשם החברות כאמור בסעיף 36;\n ”שטר מניה“ – \n ”שעבוד צף“ – כמשמעותו בפקודת החברות;\n ”שליטה“ – כמשמעותה בחוק ניירות ערך;\n ”תאגיד מדווח“ – תאגיד מדווח כהגדרתו בחוק ניירות ערך או תאגיד שהוראות פרק ה׳3 לחוק האמור חלות עליו;\n ”תביעה נגזרת“ – תובענה שהגיש תובע בשם חברה בשל עילת תביעה שלה;\n ”תזכיר“ – כמשמעותו בפקודת החברות כנוסחה ערב תחילתו של חוק זה;\n ”תנאי כהונה והעסקה“, של נושא משרה – תנאי כהונה או העסקה של נושא משרה, לרבות מתן פטור, ביטוח, התחייבות לשיפוי או שיפוי לפי היתר שיפוי, מענק פרישה, וכל הטבה, תשלום אחר או התחייבות לתשלום כאמור, הניתנים בשל כהונה או העסקה כאמור;\n ”תעודת התאגדות“ – תעודה בחתימת הרשם המעידה על רישומה של חברה;\n ”תעודת מניה“ – תעודה שבה מצוין שמו של הבעלים הרשום במרשמי החברה בציון מספר המניות שבבעלותו;\n ”תקנון“ – תקנון של חברה כפי שהוגש לרשם בראשונה עם התאגדותה או כפי ששונה לפי דין;\n ”השר“ – שר המשפטים."},{"sec":"2","title":"זכות ההתאגדות","law":"חוק החברות","text":"כל אדם רשאי לייסד חברה, ובלבד שמטרה ממטרות החברה אינה נוגדת את החוק, אינה בלתי מוסרית או אינה נוגדת את תקנת הציבור."},{"sec":"3","title":"חברת אדם אחד","law":"חוק החברות","text":"לחברה יכול שיהיה בעל מניה אחד."},{"sec":"4","title":"האישיות המשפטית של החברה","law":"חוק החברות","text":"חברה היא אישיות משפטית כשרה לכל זכות, חובה ופעולה המתיישבת עם אופייה וטבעה כגוף מואגד."},{"sec":"5","title":"קיום חברה","law":"חוק החברות","text":"קיומה של חברה הוא מיום ההתאגדות המצוין בתעודת ההתאגדות ועד לפקיעת ההתאגדות, כתוצאה מחיסולה של החברה."},{"sec":"6","title":"הרמת מסך","law":"חוק החברות","text":"בית משפט רשאי לייחס חוב של חברה לבעל מניה בה, אם מצא כי בנסיבות הענין צודק ונכון לעשות כן, במקרים החריגים שבהם השימוש באישיות המשפטית הנפרדת נעשה באחד מאלה:\n(א) באופן שיש בו כדי להונות אדם או לקפח נושה של החברה;\n(ב) באופן הפוגע בתכלית החברה ותוך נטילת סיכון בלתי סביר באשר ליכולתה לפרוע את חובותיה,\n ובלבד שבעל המניה היה מודע לשימוש כאמור, ובשים לב לאחזקותיו ולמילוי חובותיו כלפי החברה לפי סעיפים 192 ו־193 ובשים לב ליכולת החברה לפרוע את חובותיה.\n(2) לענין סעיף קטן זה, יראו אדם כמודע לשימוש כאמור בפסקה (1)(א) או (ב) גם אם חשד בדבר טיב ההתנהגות או בדבר אפשרות קיום הנסיבות, שגרמו לשימוש כאמור, אך נמנע מלבררן, למעט אם נהג ברשלנות בלבד.\n(ב) בית משפט רשאי לייחס תכונה, זכות או חובה של בעל מניה לחברה או זכות של החברה לבעל מניה בה, אם מצא כי בנסיבות הענין, צודק ונכון לעשות כן בהתחשב בכוונת הדין או ההסכם החלים על הענין הנדון לפניו.\n(ג) בית משפט רשאי להשעות זכותו של בעל מניה לפירעון חובו מאת החברה עד לאחר שהחברה פרעה במלואן את כל התחייבויותיה כלפי נושים אחרים של החברה, אם מצא כי התקיימו התנאים לייחוס חוב של החברה לבעל המניה כאמור בסעיף קטן (א).\n(ד) בסעיף זה ובסעיף 7, ”בית המשפט“ – בית המשפט שלו הסמכות לדון בתובענה."},{"sec":"7","title":"הגבלת עיסוקים","law":"חוק החברות","text":"(א) הורה בית משפט כי יש ליחס חובות של חברה לבעל מניה בה, לפי הוראות סעיף 6(א), רשאי הוא להורות, כי במשך תקופה שיקבע ושלא תעלה על חמש שנים (בסעיף זה – תקופת ההגבלה), לא יוכל אותו בעל מניה להיות דירקטור או מנהל כללי של חברה או להיות מעורב, במישרין או בעקיפין, בייסוד חברה או בניהולה (בסעיף זה – צו הגבלה).\n(ב) בית משפט שנתן צו הגבלה ישלח לרשם החברות הודעה על הצו ופרטיו.\n(ג) בלי לגרוע מהוראות סעיף 6, המפר צו הגבלה חב בחובות החברה שלגביה הופר הצו ושנוצרו בתקופת ההגבלה."},{"sec":"8","title":"בקשה לרישום","law":"חוק החברות","text":"(א) המבקש לרשום חברה יגיש לרשם בקשה בדרך של תקשורת אלקטרונית לפי טופס שקבע השר ולה יצורפו:\n(1) עותק של התקנון;\n(2) הצהרה של הדירקטורים הראשונים על נכונותם לכהן כדירקטורים, כפי שקבע השר.\n(ב) על אף האמור בסעיף קטן (א), הרשם רשאי לאפשר הגשת בקשה כאמור באותו סעיף קטן שלא בדרך של תקשורת אלקטרונית אם התקיימו נסיבות שמצדיקות זאת."},{"sec":"9","title":"אגרות","law":"חוק החברות","text":"(א) המבקש לרשום חברה ישלם בעת הגשת הבקשה אגרה (להלן – אגרת רישום).\n(ב) חברה תשלם בכל שנה אגרה שנתית.\n(ג) בסעיף זה, ”חברה“ – לרבות חברת חוץ."},{"sec":"10","title":"תעודת התאגדות","law":"חוק החברות","text":"(א) הרשם ירשום חברה אם מצא כי קוימו כל הדרישות לפי חוק זה בקשר לרישום ולכל ענין שהוא תנאי לכך.\n(ב) הרשם ייתן לכל חברה מספר רישום, כאמור בסעיף 38(ג), ויציין אותו בתעודת ההתאגדות.\n(ג) משנרשמה חברה, ימסור לה הרשם תעודת התאגדות.\n(ד) תעודת התאגדות שנמסרה לחברה תשמש ראיה חלוטה לכך כי נתמלאו כל הדרישות לפי חוק זה לענין הרישום ולכל ענין שהוא תנאי לכך.\n(ה) אין בהוראת סעיף קטן (ד) כדי לרפא פגם בתקנון, או למנוע את הצורך בתיקונו."},{"sec":"11","title":"תכלית החברה","law":"חוק החברות","text":"(א) תכלית חברה היא לפעול על פי שיקולים עסקיים להשאת רווחיה, וניתן להביא בחשבון במסגרת שיקולים אלה, בין השאר, את עניניהם של נושיה, עובדיה ואת ענינו של הציבור; כמו כן רשאית חברה לתרום סכום סביר למטרה ראויה, אף אם התרומה אינה במסגרת שיקולים עסקיים כאמור, אם נקבעה לכך הוראה בתקנון.\n(ב) הוראת סעיף קטן (א) לא תחול על חברה לתועלת הציבור."},{"sec":"15","title":"תקנון החברה","law":"חוק החברות","text":"לכל חברה יהיה תקנון כמפורט בסימן זה."},{"sec":"16","title":"תוקף התקנון","law":"חוק החברות","text":"תקנונה של חברה, כפי שנרשם עם התאגדותה, תקף מעת התאגדותה."},{"sec":"17","title":"תקנון כחוזה","law":"חוק החברות","text":"(א) דין התקנון כדין חוזה בין החברה ובין בעלי מניותיה ובינם לבין עצמם.\n(ב) שינוי התקנון ייעשה בדרכים הקבועות בחוק זה."},{"sec":"18","title":"פרטים שחובה לכלול בתקנון","law":"חוק החברות","text":"תקנון החברה יכלול את הפרטים הבאים:\n(1) שם החברה;\n(2) מטרות החברה;\n(3) פרטים בדבר הון המניות הרשום כאמור בסעיפים 33 ו־34;\n(4) פרטים בדבר הגבלת האחריות, כאמור בסעיף 35."},{"sec":"19","title":"פרטים שניתן לכלול בתקנון","law":"חוק החברות","text":"חברה רשאית לכלול בתקנון נושאים הנוגעים לחברה או לבעלי מניותיה, ובכלל זה:\n(1) הזכויות והחובות של בעלי המניות ושל החברה;\n(2) הוראות לעניין דרכי ניהול החברה ומספר הדירקטורים;\n(2א) הוראות ממשל תאגידי מההוראות המומלצות המפורטות בתוספת הראשונה, כולן או חלקן; השר, באישור ועדת החוקה חוק ומשפט של הכנסת, רשאי לשנות את התוספת הראשונה, ובלבד ששינוי הנוגע לחברות ציבוריות או לחברות איגרות חוב, ייקבע בהתייעצות עם יושב ראש רשות ניירות ערך;\n(3) כל נושא אחר שבעלי המניות ראו לנכון להסדירו בתקנון."},{"sec":"20","title":"שינוי תקנון","law":"חוק החברות","text":"(א) חברה רשאית לשנות את תקנונה בהחלטה שהתקבלה ברוב רגיל באסיפה הכללית של החברה, אלא אם כן נקבע בתקנון כי דרוש רוב אחר או אם נתקבלה החלטה כאמור בסעיף 22.\n(ב) נקבעה בחוק זה הוראה שניתן להתנות עליה, או נקבעה הוראה בתקנון לפיה דרוש רוב מסוים לשינוי הוראות התקנון, כולן או מקצתן, לא תהא החברה רשאית לשנות את ההוראה האמורה אלא בהחלטה שתתקבל באסיפה הכללית באותו רוב מסוים או ברוב המוצע, לפי הגבוה מבין השניים.\n(ג) היו מניות החברה מחולקות לסוגים, לא ייעשה שינוי בתקנון שיפגע בזכויותיו של סוג מניות ללא אישור אסיפת אותו סוג, אלא אם כן נקבע אחרת בתקנון; לענין קבלת החלטות באסיפת סוג יחולו הוראות סעיפים קטנים (א) ו־(ב), בשינויים המחויבים.\n(ד) על אף הוראות סעיף זה, שינוי בתקנון המחייב בעל מניה לרכוש מניות נוספות או להגדיל את היקף אחריותו, לא יחייב את בעל המניה ללא הסכמתו."},{"sec":"21","title":"תוקף השינוי ודיווח","law":"חוק החברות","text":"(א) שינוי התקנון, למעט שינויים כאמור בסעיף 40, תקף מיום קבלת ההחלטה על כך בחברה או במועד מאוחר יותר שקבעה החברה בהחלטתה.\n(ב) חברה שקיבלה החלטה על שינוי תקנונה, תמסור לרשם את נוסח ההחלטה בתוך ארבעה עשר ימים ממועד ההחלטה."},{"sec":"22","title":"הגבלת אפשרות שינוי התקנון","law":"חוק החברות","text":"(א) חברה רשאית להגביל בתקנון או בחוזה אחר את סמכותה לשנות את התקנון או הוראה מהוראותיו, אם נתקבלה על כך החלטה באסיפה כללית, ברוב הדרוש לשינוי הוראות התקנון.\n(ב) דין החלטה שנתקבלה כאמור בסעיף קטן (א), כדין החלטה לשינוי התקנון ויחולו עליה הוראות סימן זה."},{"sec":"23","title":"חתימה על התקנון","law":"חוק החברות","text":"(א) התקנון ייחתם בידי בעלי המניות הראשונים ויצויינו בו המניות המוקצות להם וכן שמו, מענו ומספר הזהות של כל בעל מניה.\n(ב) עורך דין יאמת את זהות החותמים על התקנון או שהיא תאומת בדרך מקוונת כפי שייקבע בתקנות."},{"sec":"24","title":"הוראות מעבר לגבי תזכיר ותקנון","law":"חוק החברות","text":"חברה שהתאגדה לפני תחילתו של חוק זה רשאית –\n(1) לשנות את ההוראות הקבועות בתזכירה בדרך ובתנאים הקבועים לכך בפקודת החברות, כנוסחה ערב תחילתו של חוק זה, בכפוף להוראת פסקה (5), ואולם על אף הוראות פקודת החברות, רשאית חברה לשנות את ההוראות הקבועות בתזכירה, לענין ההון ולענין שם החברה, ברוב של שבעים וחמישה אחוזים מן המשתתפים בהצבעה, למעט הנמנעים; שינוי ההון הרשום תקף מיום קבלת ההחלטה בדבר השינוי ושינוי שם החברה אינו טעון הסכמת השר;\n(2) לשנות את תזכירה או לבטלו בדרך הקבועה לפי סעיף 350;\n(3) לשנות את ההוראות הקבועות בתקנונה בהחלטה שנתקבלה באסיפה הכללית ברוב של שבעים וחמישה אחוזים מן המשתתפים בהצבעה, למעט הנמנעים, או ברוב אחר אם נקבע בתזכיר החברה או בתקנונה;\n(4) לקבוע בתקנון, כפוף להוראת סעיף 20(ב), הוראה בדבר הרוב הדרוש לשינוי הוראות התקנון, בהחלטה שנתקבלה באסיפה הכללית ברוב של שבעים וחמישה אחוזים מן המשתתפים בהצבעה, למעט הנמנעים, וברוב גדול יותר אם נקבע רוב זה בתזכיר החברה או בתקנונה; נקבעה הוראה חדשה כאמור, יחולו על שינויה הוראות סעיף 20(ב);\n(5) לקבוע בתזכיר, בהחלטה שנתקבלה באסיפה הכללית ברוב של שבעים וחמישה אחוזים מן המשתתפים בהצבעה, למעט הנמנעים, הוראה בדבר שינוי הרוב הדרוש לשינוי הוראות בתזכיר שהאסיפה הכללית מוסמכת לשנותן; הוראות סעיף 20(ב) יחולו לענין זה, בשינויים המחויבים."},{"sec":"25","title":"בחירת שם","law":"חוק החברות","text":"חברה רשאית להירשם בכל שם, בכפוף להוראות סימן זה ולהוראות כל דין."},{"sec":"46","title":"האורגנים","law":"חוק החברות","text":"האורגנים של החברה הם האסיפה הכללית, הדירקטוריון, המנהל הכללי וכל מי שעל פי דין, או מכוח התקנון רואים את פעולתו בענין פלוני כפעולת החברה לאותו ענין."},{"sec":"47","title":"מעשי אורגן כמעשי החברה","law":"חוק החברות","text":"פעולותיו של אורגן וכוונותיו הן פעולותיה של החברה וכוונותיה."},{"sec":"48","title":"סמכויות האורגנים","law":"חוק החברות","text":"(א) לאסיפה הכללית יהיו הסמכויות המפורטות בסימן א׳ של הפרק השני.\n(ב) לדירקטוריון יהיו הסמכויות המפורטות בסימן א׳ של הפרק השלישי.\n(ג) למנהל הכללי יהיו הסמכויות המפורטות בפרק הרביעי.\n(ד) לכל האורגנים בחברה נתונות כל סמכויות העזר הדרושות להפעלת סמכויותיהם."},{"sec":"49","title":"סמכות שיורית","law":"חוק החברות","text":"סמכות של החברה שלא הוקנתה בחוק או בתקנון לאורגן אחר, רשאי הדירקטוריון להפעילה."},{"sec":"50","title":"העברת סמכויות בין האורגנים לפי התקנון","law":"חוק החברות","text":"(א) חברה רשאית לקבוע בתקנונה הוראות לפיהן רשאית האסיפה הכללית ליטול סמכויות הנתונות לאורגן אחר וכן כי סמכויות הנתונות למנהל הכללי יועברו לסמכות הדירקטוריון, הכל לענין מסוים, או לפרק זמן מסוים שלא יעלה על פרק הזמן הנדרש בנסיבות העניין.\n(ב) נטלה האסיפה הכללית סמכויות הנתונות לפי חוק זה לדירקטוריון, יחולו על בעלי המניות הזכויות, החובות והאחריות החלות על דירקטורים לענין הפעלת אותן סמכויות, בשינויים המחויבים, ובכלל זה יחולו עליהם, בשים לב להחזקותיהם בחברה, להשתתפותם באסיפה ולאופן הצבעתם, הוראות הפרקים השלישי, הרביעי והחמישי של החלק השישי."},{"sec":"51","title":"נטילת סמכויות המנהל הכללי","law":"חוק החברות","text":"דירקטוריון רשאי להורות למנהל הכללי כיצד לפעול לענין מסוים; לא קיים המנהל הכללי את ההוראה, רשאי הדירקטוריון להפעיל את הסמכות הנדרשת לביצוע ההוראה במקומו, אף אם לא נקבעה לכך הוראה בתקנון."},{"sec":"52","title":"אורגן שנבצר ממנו למלא תפקידו","law":"חוק החברות","text":"(א) נבצר מן הדירקטוריון להפעיל את סמכויותיו והפעלת סמכות מסמכויותיו חיונית לניהולה התקין של החברה, רשאית האסיפה הכללית להפעילה במקומו, אף אם לא נקבעה לכך הוראה בתקנון, כל עוד נבצר ממנו הדבר, ובלבד שהאסיפה הכללית קבעה, כי אכן נבצר מן הדירקטוריון לעשות כן וכי הפעלת הסמכות חיונית כאמור; האמור בסעיף 50(ב) יחול על הפעלת סמכויות הדירקטוריון בידי האסיפה הכללית.\n(ב) נבצר מן המנהל הכללי להפעיל את סמכויותיו, רשאי הדירקטוריון להפעילן במקומו, אף אם לא נקבעה לכך הוראה בתקנון."},{"sec":"53","title":"אחריות בנזיקין של חברה","law":"חוק החברות","text":"(א) חברה חבה במישרין באחריות בנזיקין על עוולה שבוצעה בידי אורגן שלה.\n(ב) אין בהוראת סעיף קטן (א) כדי לגרוע מאחריותה השילוחית של חברה בנזיקין על פי כל דין."},{"sec":"54","title":"אחריות יחידי האורגן","law":"חוק החברות","text":"(א) אין בייחוס פעולה או כוונה של אורגן, לחברה, כדי לגרוע מהאחריות האישית שיחידי האורגן היו נושאים בה אילולא אותו ייחוס.\n(ב)"},{"sec":"55","title":"פעולה בחריגה מההרשאה","law":"חוק החברות","text":"(א) חברה ומי שפועל מטעמה לא יבצעו פעולה שיש בה חריגה מן המטרות הקבועות בתקנון וכן לא יבצעו פעולה בלא הרשאה או פעולה בחריגה מן ההרשאה.\n(ב) נעשית או שיש יסוד להניח שעומדת להיעשות פעולה כאמור בסעיף קטן (א), רשאי בית המשפט, לבקשת החברה, בעל מניה, או נושה של החברה שיש חשש לפגיעה בזכויותיו, לתת צו להפסקתה או למניעתה של הפעולה."},{"sec":"56","title":"פעולה בחריגה מהמטרות או בלא הרשאה","law":"חוק החברות","text":"(א) פעולה שנעשתה עבור חברה בחריגה ממטרות החברה, או שנעשתה בלא הרשאה או בחריגה מן ההרשאה, אין לה תוקף כלפי החברה, אלא אם כן אישרה החברה את הפעולה בדרכים הקבועות בסעיף קטן (ב), או אם הצד שכלפיו נעשתה הפעולה לא ידע ולא היה עליו לדעת על החריגה או על העדר ההרשאה.\n(ב) אישור החברה בדיעבד לפעולה בחריגה ממטרות החברה יינתן בידי האסיפה הכללית בהחלטה שתתקבל ברוב הדרוש לשינוי מטרות החברה; אישור כאמור לענין פעולה בלא הרשאה או בחריגה מן ההרשאה יינתן בידי האורגן המוסמך לתת את ההרשאה.\n(ג) אישור כאמור בסעיף קטן (ב), לא יפגע בזכות שרכש אדם אחר בתום לב ובתמורה לפני מתן האישור."},{"sec":"57","title":"הסמכויות המוקנות לאסיפה הכללית","law":"חוק החברות","text":"החלטות החברה בענינים הבאים יתקבלו באסיפה הכללית:\n(1) שינויים בתקנון כאמור בסעיף 20;\n(2) הפעלת סמכויות הדירקטוריון בהתאם להוראות סעיף 52(א);\n(3) מינוי רואה החשבון המבקר של החברה, תנאי העסקתו והפסקת העסקתו בהתאם להוראות סעיפים 154 עד 167;\n(4) מינוי דירקטורים חיצוניים בהתאם להוראות סעיף 239;\n(5) אישור פעולות ועסקאות הטעונות אישור האסיפה הכללית לפי הוראות סעיפים 255 ו־268 עד 275;\n(6) הגדלת הון המניות הרשום והפחתתו בהתאם להוראות סעיפים 286 ו־287;\n(7) מיזוג כאמור בסעיף 320(א);\n(8) פירוק החברה בידי בית המשפט לפי סעיף 342ו(1), פירוקה מרצון לפי סעיף 342כד, או פירוקה מרצון בהליך מזורז לפי סעיף 342מב."},{"sec":"58","title":"איסור התניה","law":"חוק החברות","text":"(א) חברה אינה רשאית להתנות על הוראות סעיף 57.\n(ב) חברה רשאית להוסיף בתקנון נושאים שהחלטות בהם יתקבלו באסיפה הכללית; ואולם, העברת סמכויות בתקנון לאסיפה הכללית, בנושאים שבהם הוקנתה הסמכות בחוק זה לאורגן אחר בלא אפשרות להתנאה על כך בתקנון, תעשה לפי הוראות סעיף 50."},{"sec":"59","title":"מינוי דירקטורים","law":"חוק החברות","text":"האסיפה הכללית השנתית תמנה את הדירקטורים, אלא אם כן נקבע אחרת בתקנון."},{"sec":"60","title":"כינוס אסיפה שנתית","law":"חוק החברות","text":"(א) חברה תקיים אסיפה שנתית בכל שנה ולא יאוחר מתום חמישה עשר חודשים לאחר האסיפה השנתית האחרונה.\n(ב) סדר היום באסיפה השנתית יכלול דיון בדוחות הכספיים ובדיווח הדירקטוריון; סדר היום יכול שיכלול מינוי דירקטורים, מינוי רואה חשבון מבקר וכן נושא שנקבע בתקנון שיידון באסיפה שנתית, או כל נושא אחר שנקבע על סדר היום כאמור בסעיף 66."},{"sec":"61","title":"אי קיום אסיפה שנתית","law":"חוק החברות","text":"(א) חברה פרטית רשאית לקבוע בתקנונה הוראה, לפיה אינה חייבת לקיים אסיפה שנתית כאמור בסעיף 60, אלא ככל שהדבר נחוץ למינוי רואה חשבון מבקר; נקבעה הוראה כאמור, רשאית החברה שלא לקיים אסיפה שנתית אלא אם כן אחד מבעלי המניות או הדירקטורים דרש מהחברה לקיימה.\n(ב) לא התקיימה אסיפה שנתית, תשלח החברה לבעלי המניות הרשומים במרשם בעלי המניות, פעם בשנה, דוחות כספיים כאמור בסעיף 172 לא יאוחר מן המועד האחרון שבו היה עליה לקיים אסיפה שנתית אלמלא קבעה בתקנונה הוראה כאמור בסעיף קטן (א)."},{"sec":"62","title":"כינוס אסיפה שנתית על ידי בית המשפט","law":"חוק החברות","text":"(א) לא התקיימה אסיפה שנתית כאמור בסעיף 60, או לאחר שנדרש קיומה כאמור בסעיף 61, רשאי בית המשפט, לבקשת בעל מניה או דירקטור בחברה, להורות על כינוסה.\n(ב) הורה בית המשפט כאמור תישא החברה בהוצאות סבירות שהוציא המבקש בהליך בבית המשפט, כפי שקבע בית המשפט, והדירקטורים האחראים לאי כינוסה יהיו חייבים להשיבן לחברה."},{"sec":"63","title":"כינוס אסיפה מיוחדת","law":"חוק החברות","text":"(א) דירקטוריון חברה פרטית יכנס אסיפה מיוחדת על פי החלטתו וכן לדרישת כל אחד מאלה:\n(1) דירקטור אחד;\n(2) בעל מניה, אחד או יותר, שלו לפחות עשרה אחוזים מההון המונפק ואחוז אחד לפחות מזכויות ההצבעה בחברה, או בעל מניה, אחד או יותר, שלו לפחות עשרה אחוזים מזכויות ההצבעה בחברה.\n(ב) דירקטוריון חברה ציבורית יכנס אסיפה מיוחדת על פי החלטתו, וכן לדרישת כל אחד מאלה:\n(1) שני דירקטורים או רבע מן הדירקטורים המכהנים;\n(2) בעל מניה, אחד או יותר, שלו לפחות חמישה אחוזים מההון המונפק ואחוז אחד לפחות מזכויות ההצבעה בחברה או בעל מניה, אחד או יותר, שלו לפחות חמישה אחוזים מזכויות ההצבעה בחברה.\n(ג) דירקטוריון שנדרש לזמן אסיפה מיוחדת, יזמנה בתוך עשרים ואחד ימים מיום שהוגשה לו הדרישה, למועד שיקבע בהזמנה לפי סעיף 67 או בהודעה לפי סעיף 69, ובלבד שלגבי חברה ציבורית, מועד הכינוס יהיה לא יאוחר משלושים וחמישה ימים ממועד פרסום ההודעה, אלא אם כן נקבע אחרת לענין אסיפה שחל לגביה סימן ז׳, ולגבי חברה פרטית יחולו הוראות סעיף 67."},{"sec":"64","title":"כינוס אסיפה על ידי בעלי מניות","law":"חוק החברות","text":"(א) לא זימן הדירקטוריון אסיפה מיוחדת שנדרשה לפי סעיף 63, רשאי הדורש, וכשמדובר בבעלי מניות – גם חלק מהם שיש לו יותר ממחצית מזכויות ההצבעה שלהם, לכנס את האסיפה בעצמו, ובלבד שלא תתקיים אחרי עבור שלושה חודשים מהיום שהוגשה הדרישה כאמור, והיא תכונס, ככל האפשר, באותו האופן שבו מכונסות אסיפות בידי הדירקטוריון.\n(ב) כונסה אסיפה כללית כאמור בסעיף קטן (א), תכסה החברה את ההוצאות הסבירות שהוציא הדורש והדירקטורים האחראים לאי כינוסה חייבים להשיבן לחברה."},{"sec":"82","title":"חופש הגיוון","law":"חוק החברות","text":"(א) חברה רשאית לקבוע בתקנונה זכויות הצבעה שונות לסוגים שונים של מניות.\n(ב) אין בהוראת סעיף קטן (א) כדי לגרוע מהוראת חיקוק אחרת.\n(ג) לא קבעה החברה בתקנונה זכויות הצבעה שונות, יהיה לכל מניה קול אחד."},{"sec":"83","title":"אופן ההצבעה באסיפה","law":"חוק החברות","text":"(א) בעל מניה בחברה ציבורית רשאי להצביע בעצמו או באמצעות שלוח וכן בכתב הצבעה לפי הוראות סימן ז׳.\n(ב) בעל מניה בחברה פרטית רשאי להצביע בעצמו או באמצעות שלוח אלא אם כן נקבע אחרת בתקנון.\n(ג) בעל מניה בחברה פרטית רשאי להצביע בכתב אם נקבעו לכך הוראות בתקנון.\n(ד) הצביע בעל מניה ביותר מדרך אחת, תימנה הצבעתו המאוחרת; לעניין זה, הצבעה של בעל מניה בעצמו או באמצעות שלוח תיחשב מאוחרת להצבעה באמצעות כתב הצבעה."},{"sec":"84","title":"הצבעה במנין קולות","law":"חוק החברות","text":"החלטה באסיפה הכללית תתקבל בהצבעה במנין קולות; חברה פרטית רשאית לקבוע בתקנונה כלל הכרעה שונה."},{"sec":"85","title":"רוב באסיפה כללית","law":"חוק החברות","text":"החלטות האסיפה הכללית יתקבלו ברוב רגיל, אלא אם כן נקבע רוב אחר בחוק או בתקנון."},{"sec":"86","title":"הכרזה כראיה","law":"חוק החברות","text":"הכרזת היושב ראש שהחלטה באסיפה כללית נתקבלה או נדחתה, בין פה אחד ובין ברוב פלוני, תהיה ראיה לכאורה לאמור בה."},{"sec":"92","title":"סמכויות הדירקטוריון ותפקידיו","law":"חוק החברות","text":"(א) הדירקטוריון יתווה את מדיניות החברה ויפקח על ביצוע תפקידי המנהל הכללי ופעולותיו, ובכלל זה –\n(1) יקבע את תכניות הפעולה של החברה, עקרונות למימונן וסדרי עדיפויות ביניהן;\n(2) יבדוק את מצבה הכספי של החברה, ויקבע את מסגרת האשראי שהחברה רשאית ליטול;\n(3) יקבע את המבנה הארגוני ואת מדיניות השכר והתגמול;\n(4) רשאי להחליט על הנפקה של סדרת איגרות חוב;\n(5) אחראי לעריכת הדוחות הכספיים ולאישורם, כאמור בסעיף 171;\n(6) ידווח לאסיפה השנתית על מצב עניני החברה ועל התוצאות העיסקיות כאמור בסעיף 173;\n(7) ימנה ויפטר את המנהל הכללי כאמור בסעיף 250;\n(8) יחליט בפעולות ובעסקאות הטעונות אישורו לפי התקנון או לפי הוראות סעיפים 255 ו־268 עד 275:\n(9) רשאי להקצות מניות וניירות ערך המירים למניות עד גבול הון המניות הרשום של החברה, לפי הוראות סעיף 288;\n(10) רשאי להחליט על חלוקה כאמור בסעיפים 307 ו־308;\n(11) יחווה דעתו על הצעת רכש מיוחדת כאמור בסעיף 329;\n(12) בחברה ציבורית ובחברה פרטית שהיא חברת איגרות חוב – יקבע את המספר המזערי הנדרש של דירקטורים בדירקטוריון, שעליהם להיות בעלי מומחיות חשבונאית ופיננסית, כמשמעותה לפי סעיף 240 (בחוק זה – דירקטורים בעלי מומחיות חשבונאית ופיננסית); הדירקטוריון יקבע את המספר המזערי כאמור בהתחשב, בין השאר, בסוג החברה, גודלה, היקף פעילות החברה ומורכבות פעילותה, ובכפוף למספר הדירקטורים שנקבע בתקנון לפי סעיף 219.\n(ב) סמכויות הדירקטוריון לפי סעיף זה אינן ניתנות לאצילה למנהל הכללי, למעט כמפורט בסעיף 288(ב)(2)."},{"sec":"93","title":"דירקטוריון המונה אדם אחד","law":"חוק החברות","text":"(א) בחברה פרטית שאינה חברת איגרות חוב יכול שיהיה דירקטוריון המונה אדם אחד.\n(ב) על דירקטוריון המונה אדם אחד יחולו הוראות סימן זה; על החלטות דירקטוריון כאמור יחולו הוראות סימן ו׳, בשינויים המחויבים; יתר הוראות פרק זה לא יחולו על דירקטוריון המונה אדם אחד."},{"sec":"94","title":"בחירת יושב ראש דירקטוריון","law":"חוק החברות","text":"(א) דירקטוריון חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב יבחר אחד מחבריו לכהן כיושב ראש הדירקטוריון, אלא אם כן נקבע אופן מינוי אחר בתקנון.\n(ב) בחברה פרטית שאינה חברת איגרות חוב אין חובה למנות יושב ראש דירקטוריון; לא מונה יושב ראש דירקטוריון בחברה פרטית שאינה חברת איגרות חוב, יהיה כל אחד מהדירקטורים, זכאי לכנס את הדירקטוריון ולקבוע את סדר היום שלו, אלא אם כן נקבע אחרת בתקנון."},{"sec":"95","title":"סייג לבחירת יושב ראש דירקטוריון","law":"חוק החברות","text":"(א) בחברה ציבורית לא יכהן כיושב ראש הדירקטוריון מנהלה הכללי של החברה או קרובו, אלא לפי הוראות סעיף 121(ג); לא יכהן כיושב ראש הדירקטוריון בחברה ציבורית מי שכפוף למנהל הכללי, במישרין או בעקיפין; דירקטור בתאגיד בשליטת חברה ציבורית רשאי לכהן כיושב ראש הדירקטוריון בחברה הציבורית.\n(ב) בחברה ציבורית לא יוקנו ליושב ראש הדירקטוריון או לקרובו סמכויות המנהל הכללי, אלא לפי הוראות סעיף 121(ג); לא יוקנו ליושב ראש הדירקטוריון בחברה ציבורית סמכויות הנתונות למי שכפוף למנהל הכללי, במישרין או בעקיפין; יושב ראש הדירקטוריון בחברה ציבורית לא יכהן כבעל תפקיד אחר באותה חברה או בתאגיד בשליטתה, אך רשאי הוא לכהן כיושב ראש דירקטוריון או כדירקטור בתאגיד בשליטת החברה.\n(ג) הוראות סעיף קטן (א) לא יחולו שלושה חדשים מהמועד שבו הפכה חברה לחברה ציבורית.\n(ד) הוראות סעיף זה יחולו על חברה פרטית שהיא חברת איגרות חוב, בשינויים המחויבים ובשינוי זה: בכל מקום, במקום ”סעיף 121(ג)“ יקראו ”סעיף 121(ד)“."},{"sec":"96","title":"ניהול ישיבת דירקטוריון","law":"חוק החברות","text":"(א) יושב ראש הדירקטוריון ינהל את ישיבות הדירקטוריון.\n(ב) נעדר יושב ראש הדירקטוריון מישיבה, יבחר הדירקטוריון באחד מחבריו לנהל את הישיבה ולחתום על פרוטוקול הדיון, ואולם לא יהיה למי שנבחר קול נוסף בהצבעות הדירקטוריון כאמור בסעיף 107, והכל אם לא נקבע אחרת בתקנון."},{"sec":"97","title":"ישיבות הדירקטוריון","law":"חוק החברות","text":"הדירקטוריון יתכנס לישיבות לפי צורכי החברה, ולפחות אחת לשנה, ובחברה ציבורית וכן בחברה פרטית שהיא חברת איגרות חוב, לפחות אחת לשלושה חודשים."},{"sec":"98","title":"כינוס הדירקטוריון","law":"חוק החברות","text":"(א) יושב ראש הדירקטוריון רשאי לכנס את הדירקטוריון בכל עת.\n(ב) הדירקטוריון יקיים ישיבה, בנושא שיפורט, לדרישת כל אחד מאלה:\n(1) שני דירקטורים, ובחברה שבה מונה הדירקטוריון עד חמישה דירקטורים – דירקטור אחד;\n(2) דירקטור אחד, אם נקבעה הוראה כאמור בתקנון החברה או נתקיים האמור בסעיף 257.\n(ג) יושב ראש הדירקטוריון יכנס את הדירקטוריון לפי דרישה כאמור בסעיף קטן (ב) או אם התקיים האמור בסעיף 122(ד) בשל הודעה או דיווח של המנהל הכללי או בשל הודעת רואה החשבון המבקר של החברה לפי סעיף 169.\n(ד) לא כונסה ישיבת דירקטוריון בתוך ארבעה עשר ימים ממועד הדרישה כאמור בסעיף קטן (ב), או ממועד ההודעה או הדיווח של המנהל הכללי שהתקיים בהם האמור בסעיף 122(ד), או ממועד הודעת רואה החשבון המבקר לפי סעיף 169, יהיו רשאים כל אחד מהמנויים בסעיפים קטנים (ב) ו־(ג), לכנס ישיבת דירקטוריון שתדון בנושא שפורט בדרישה בהודעה או בדיווח, לפי הענין, אלא אם כן נקבעה בתקנון הוראה אחרת לענין מועד הכינוס."},{"sec":"99","title":"סדר יום","law":"חוק החברות","text":"סדר היום של ישיבות הדירקטוריון ייקבע בידי יושב ראש הדירקטוריון, והוא יכלול:\n(1) נושאים שקבע יושב ראש הדירקטוריון;\n(2) נושאים שנקבעו כאמור בסעיף 98;\n(3) כל נושא שדירקטור או שהמנהל הכללי ביקש מיושב ראש הדירקטוריון, זמן סביר בטרם כינוס ישיבת דירקטוריון, לכללו בסדר היום, אלא אם כן נקבע אחרת בתקנון."},{"sec":"100","title":"הודעה על ישיבת דירקטוריון","law":"חוק החברות","text":"(א) הודעה על ישיבת דירקטוריון תימסר לכל חבריו זמן סביר לפני מועד הישיבה, זולת אם נקבעה בתקנון הוראה אחרת הקובעת את מועד המסירה.\n(ב) הודעה לפי סעיף קטן (א) תימסר למענו של הדירקטור שנמסר מראש לחברה, ויצוין בה מועד הישיבה והמקום שבו תתכנס, וכן פירוט סביר של כל הנושאים שעל סדר היום, והכל אם לא נקבע אחרת בתקנון.\n(ג) בחברה ציבורית ובחברה פרטית שהיא חברת איגרות חוב לא ניתן להתנות בתקנון על החובה למתן פירוט סביר של כל הנושאים שעל סדר היום במסגרת ההודעה על כינוס ישיבת הדירקטוריון וכן על החובה לפי סעיף קטן (א)."},{"sec":"101","title":"קיום ישיבה באמצעי תקשורת","law":"חוק החברות","text":"הדירקטוריון רשאי לקיים ישיבות באמצעות שימוש בכל אמצעי תקשורת, ובלבד שכל הדירקטורים המשתתפים יכולים לשמוע זה את זה בו בזמן, אלא אם כן נשללה רשות זו בתקנון."},{"sec":"102","title":"כינוס דירקטוריון ללא הודעה","law":"חוק החברות","text":"על אף הוראת סעיף 100 בחברה פרטית שאינה חברת איגרות חוב, רשאי הדירקטוריון, בהסכמת כל הדירקטורים, להתכנס לישיבה ללא הודעה, אלא אם כן נשללה רשות זו בתקנון וכן רשאי דירקטוריון בחברה פרטית או ציבורית, במקרים דחופים ובהסכמת רוב הדירקטורים, להתכנס לישיבה בלא הודעה."},{"sec":"103","title":"קבלת החלטות ללא התכנסות","law":"חוק החברות","text":"(א) הדירקטוריון רשאי לקבל החלטות אף ללא התכנסות בפועל, ובלבד שכל הדירקטורים הזכאים להשתתף בדיון ולהצביע בענין שהובא להחלטה הסכימו שלא להתכנס לדיון באותו ענין, אלא אם כן נשללה רשות זו בתקנון.\n(ב) התקבלו החלטות כאמור בסעיף קטן (א), ייערך פרוטוקול ההחלטות, לרבות ההחלטה שלא להתכנס, וייחתם בידי יושב ראש הדירקטוריון.\n(ג) על החלטה כאמור בסעיף קטן (א) יחולו הוראות סעיף 108, בשינויים המחויבים.\n(ד) יושב ראש הדירקטוריון אחראי לביצוע הוראות סעיף זה."},{"sec":"104","title":"מנין חוקי בישיבות דירקטוריון","law":"חוק החברות","text":"המנין החוקי לפתיחת ישיבת דירקטוריון יהיה רוב חברי הדירקטוריון, אלא אם כן נקבע אחרת בתקנון."},{"sec":"105","title":"הצבעה בדירקטוריון","law":"חוק החברות","text":"בהצבעה בדירקטוריון יהיה קול אחד לכל דירקטור, אלא אם כן נקבע אחרת בתקנון."},{"sec":"106","title":"שיקול דעת עצמאי והסכמי הצבעה","law":"חוק החברות","text":"(א) דירקטור, בכשירותו ככזה יפעיל שיקול דעת עצמאי בהצבעה בדירקטוריון, לא יהיה צד להסכם הצבעה ויראו באי־הפעלת שיקול דעת עצמאי כאמור או בהסכם הצבעה הפרת חובת אמונים.\n(ב) לא ימלא אדם תפקיד מתפקידיו של דירקטור אלא אם כן מונה כדין לתפקיד דירקטור ולא יפגע אדם בשיקול הדעת העצמאי של דירקטור.\n(ג) בלי לגרוע מהוראות כל דין, על מי שהפר את הוראת סעיף קטן (ב) יחולו החובות והאחריות החלות על דירקטורים לפי כל דין."},{"sec":"107","title":"קבלת החלטות","law":"חוק החברות","text":"החלטות בדירקטוריון יתקבלו ברוב רגיל; היו הקולות שקולים יהיה ליושב ראש הדירקטוריון קול נוסף, והכל אם לא נקבע אחרת בתקנון."},{"sec":"108","title":"פרוטוקולים בישיבות דירקטוריון","law":"חוק החברות","text":"(א) חברה תערוך פרוטוקולים של ההליכים בישיבות הדירקטוריון, ותשמור אותם במשרדה הרשום או במען אחר בישראל, שעליו הודיעה החברה לרשם, לתקופה של שבע שנים ממועד הישיבה.\n(ב) פרוטוקול שאושר ונחתם בידי הדירקטור שניהל את הישיבה, ישמש ראיה לכאורה לאמור בו."},{"sec":"109","title":"פגמים בכינוס הישיבה","law":"חוק החברות","text":"(א) החלטה שהתקבלה בישיבת דירקטוריון שהתכנסה בלא שנתקיימו התנאים המוקדמים לכינוסה (להלן – פגם בכינוס) ניתנת לביטול לדרישת כל אחד מאלה:\n(1) דירקטור שנכח בישיבה, ובלבד שדרש להימנע מקבלת ההחלטה שלגביה נתקיים הפגם, בטרם נתקבלה;\n(2) דירקטור שהיה זכאי להיות מוזמן לישיבה אך לא נכח בה, וזאת תוך זמן סביר לאחר שנודע לו על ההחלטה ולא יאוחר מישיבת הדירקטוריון הראשונה שתתקיים לאחר שנודע לו על ההחלטה;\n(3) היה הפגם בכינוס נוגע להודעה לגבי מקום כינוס הישיבה או מועדה, לא יהיה רשאי דירקטור שהגיע לישיבה על אף הפגם האמור לדרוש את ביטולן של ההחלטות.\n(ב) אין בהוראות סעיף קטן (א) כדי לפגוע בתוקפה של פעולה שנעשתה עבור החברה ושהתקיימו בה הוראות סעיף 56(א) סיפה."},{"sec":"110","title":"הקמת ועדות","law":"חוק החברות","text":"(א) הדירקטוריון רשאי להקים ועדות דירקטוריון, אלא אם כן נקבע אחרת בתקנון.\n(ב) בועדת דירקטוריון שהדירקטוריון אצל לה מסמכויותיו, לא יכהן מי שאינו חבר דירקטוריון.\n(ג) בועדת דירקטוריון שתפקידה לייעץ לדירקטוריון או להמליץ בלבד, יכול שיכהנו גם מי שאינם חברי דירקטוריון אלא אם כן נקבע אחרת בתקנון."},{"sec":"111","title":"פעולת ועדה","law":"חוק החברות","text":"(א) החלטה שהתקבלה או פעולה שנעשתה בועדת דירקטוריון על פי סמכות שהואצלה לה מסמכויות הדירקטוריון, כמוה כהחלטה שהתקבלה או פעולה שנעשתה בדירקטוריון, אלא אם כן נקבע אחרת בתקנון.\n(ב) ועדת דירקטוריון תדווח לדירקטוריון באורח שוטף על החלטותיה או המלצותיה; החלטות או המלצות של ועדת דירקטוריון הטעונות את אישור הדירקטוריון, יובאו לידיעת הדירקטורים זמן סביר לפני הדיון בדירקטוריון.\n(ג) סימנים ב׳ עד ז׳ יחולו, בשינויים המחויבים, גם על כינוס ישיבות הועדות ואופן ניהולן.\n(ד) פרוטוקולים של ועדות הדירקטוריון ייערכו ויישמרו כאמור בסעיף 108."},{"sec":"112","title":"סייג לאצילת סמכויות","law":"חוק החברות","text":"(א) דירקטוריון לא רשאי להאציל מסמכויותיו לועדת דירקטוריון בנושאים שלהלן:\n(1) קביעת מדיניות כללית לחברה;\n(2) חלוקה, אלא אם כן מדובר ברכישה של מניות החברה בהתאם למסגרת שהותוותה מראש בידי הדירקטוריון;\n(3) קביעת עמדת הדירקטוריון בענין הטעון אישור האסיפה הכללית או מתן חוות דעת כאמור בסעיף 329;\n(4) מינוי דירקטורים, אם הדירקטוריון רשאי למנותם;\n(5) הנפקה או הקצאה של מניות או של ניירות ערך המירים למניות או הניתנים למימוש למניות, או של סדרת איגרות חוב, למעט כמפורט בסעיף 288(ב);\n(6) אישור דוחות כספיים;\n(7) אישור דירקטוריון לעסקאות ופעולות הטעונות אישור הדירקטוריון לפי הוראות סעיפים 255 ו־268 עד 275.\n(ב) חברה אינה רשאית להתנות בתקנונה על הוראות סעיף קטן (א), ואולם רשאית היא לקבוע בתקנונה נושאים נוספים שבהם יתקבלו החלטות בידי הדירקטוריון בלבד.\n(ג) הדירקטוריון רשאי להקים ועדות בנושאים המנויים בסעיף קטן (א) לשם המלצה בלבד."},{"sec":"113","title":"ביטול החלטות ועדה","law":"חוק החברות","text":"הדירקטוריון רשאי לבטל החלטה של ועדה שמונתה על ידיו, ואולם אין בביטול כדי לפגוע בתוקפה של החלטה של ועדה שהחברה פעלה על פיה כלפי אדם אחר, שלא ידע על ביטולה."},{"sec":"114","title":"מינוי הועדה","law":"חוק החברות","text":"דירקטוריון חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב ימנה מבין חבריו ועדת ביקורת, והוראות סימן ח׳ יחולו עליה, בשינויים המחויבים."},{"sec":"115","title":"חברי הועדה","law":"חוק החברות","text":"(א) מספר חבריה של ועדת ביקורת לא יפחת משלושה, כל הדירקטורים החיצונים יהיו חברים בה ורוב חבריה יהיו דירקטורים בלתי תלויים.\n אלה לא יהיו חברים בוועדת ביקורת: יושב ראש הדירקטוריון וכל דירקטור המועסק בידי החברה או המועסק בידי בעל שליטה בה או בידי תאגיד בשליטת בעל שליטה כאמור, דירקטור הנותן שירותים, דרך קבע, לחברה, לבעל שליטה בה או לתאגיד בשליטת בעל שליטה כאמור, וכן דירקטור שעיקר פרנסתו על בעל השליטה.\n(2) הוראות פסקה (1) לא יחולו על עובד המדינה לעניין חברות בוועדת ביקורת בחברה ממשלתית או בחברת בת ממשלתית, ובלבד שהשר האחראי לענייני החברה אינו השר האחראי על המשרד שבו מועסק עובד המדינה האמור.\n(ג) בעל השליטה או קרובו לא יהיו חברים בועדת הביקורת.\n(ד) יושב ראש ועדת הביקורת יהיה דירקטור חיצוני, או עובד המדינה כאמור בסעיף קטן (ב)(2) שאינו מכהן כיושב ראש הוועדה מעל תשע שנים.\n(ה) מי שאינו רשאי להיות חבר בוועדת ביקורת לא יהיה נוכח בישיבות הוועדה בעת הדיון ובעת קבלת ההחלטות, אלא אם כן קבע יושב ראש הוועדה כי הוא נדרש לשם הצגת נושא מסוים; ואולם –\n(1) עובד החברה שאינו בעל שליטה או קרובו, רשאי להיות נוכח בישיבות הוועדה בעת הדיון אם ביקשה זאת הוועדה, ובלבד שההחלטה תתקבל בלא נוכחותו;\n(2) בלי לגרוע מפסקה (1), היועץ המשפטי ומזכיר החברה שאינם בעל שליטה או קרובו רשאים להיות נוכחים בעת הדיון ובעת קבלת ההחלטות, אם ביקשה זאת הוועדה.\n(ו) על אף הוראות סעיף קטן (ה), על ועדת ביקורת המשמשת כוועדה לבחינת הדוחות הכספיים לפי סעיף 171(ה), יחולו ההוראות לפי אותו סעיף בעת הדיון בדוחות הכספיים."},{"sec":"116","title":"זימון לישיבות","law":"חוק החברות","text":"(א) המבקר הפנימי של החברה יקבל הודעות על קיום ישיבות ועדת ביקורת ויהיה רשאי להשתתף בהן.\n(ב) המבקר הפנימי רשאי לבקש מיושב ראש ועדת הביקורת לכנס את הועדה לדיון בנושא שפירט בדרישתו, ויושב ראש ועדת הביקורת יכנסה בתוך זמן סביר ממועד הבקשה, אם ראה טעם לכך.\n(ג) הודעה על קיום ישיבת ועדת ביקורת שבה עולה נושא הנוגע לביקורת הדוחות הכספיים תומצא לרואה החשבון המבקר שיהיה רשאי להשתתף בה."},{"sec":"116א","title":"מניין חוקי לקבלת החלטה בוועדת הביקורת","law":"חוק החברות","text":"המניין החוקי לדיון ולקבלת החלטות בוועדת הביקורת יהיה רוב חברי הוועדה, ובלבד שרוב הנוכחים הם דירקטורים בלתי תלויים ואחד מהם לפחות דירקטור חיצוני."},{"sec":"117","title":"תפקידי ועדת הביקורת","law":"חוק החברות","text":"אלה תפקידי ועדת הביקורת:\n(1) לעמוד על ליקויים בניהול העסקי של החברה, בין השאר תוך התייעצות עם המבקר הפנימי של החברה או עם רואה החשבון המבקר, ולהציע לדירקטוריון דרכים לתיקונם; מצאה ועדת הביקורת ליקוי כאמור שהוא ליקוי מהותי, תקיים ישיבה אחת לפחות לעניין הליקוי הנדון, בנוכחות המבקר הפנימי או רואה החשבון המבקר, לפי העניין, ובלא נוכחות של נושאי משרה בחברה שאינם חברי הוועדה; על אף האמור בסעיף זה, נושא משרה רשאי להיות נוכח לשם הצגת עמדה בנושא שבתחומי אחריותו, אם ביקשה זאת הוועדה;\n(1א) להחליט על יסוד נימוקים שיפורטו, לגבי פעולות כאמור בסעיף 255 אם הן פעולות מהותיות או פעולות שאינן מהותיות, ולגבי עסקאות כאמור בסעיף 270(1), (4) ו־(4א) אם הן עסקאות חריגות או עסקאות שאינן חריגות, לצורך אישורן לפי חוק זה, ורשאית ועדת הביקורת להחליט כאמור לגבי סוג של פעולות או עסקאות, לפי אמות מידה שתקבע אחת לשנה מראש;\n(1ב) לקבוע לגבי עסקאות כאמור בסעיף 270(4) או (4א), אף אם אינן עסקאות חריגות, חובה לקיים הליך תחרותי, בפיקוחה של הוועדה או מי שתקבע לעניין זה ולפי אמות מידה שתקבע, או לקבוע כי יקוימו הליכים אחרים שתקבע ועדת הביקורת, בטרם התקשרות בעסקאות כאמור, והכול בהתאם לסוג העסקה, ורשאית היא לקבוע לעניין זה אמות מידה אחת לשנה מראש;\n(2) להחליט אם לאשר פעולות ועיסקאות הטעונות אישור ועדת ביקורת לפי סעיפים 255 ו־268 עד 275;\n(2א) לקבוע את אופן האישור של עסקאות שאינן זניחות, ובכלל זה לקבוע סוגי עסקאות כאמור שיהיו טעונות את אישורה של ועדת הביקורת; לעניין זה, ”עסקה שאינה זניחה“ – עסקה כאמור בסעיף 270(4) רישה או (4א) רישה, שוועדת הביקורת החליטה לגביה לפי הוראות פסקה (1א) כי היא עסקה שאינה חריגה וכן סיווגה אותה כעסקה שאינה זניחה, ורשאית ועדת הביקורת להחליט על סיווג כאמור לגבי סוג של עסקאות, לפי אמות מידה שתקבע אחת לשנה מראש;\n(3) בחברה שבה תכנית העבודה של המבקר הפנימי מאושרת בידי הדירקטוריון לפי סעיף 149 – לבחון את תכנית העבודה לפני הגשתה לאישור הדירקטוריון ולהציע שינויים בה;\n(4) לבחון את מערך הביקורת הפנימית של החברה ואת תפקודו של המבקר הפנימי וכן אם עומדים לרשותו המשאבים והכלים הנחוצים לו לצורך מילוי תפקידו, בשים לב, בין השאר, לצרכיה המיוחדים של החברה ולגודלה;\n(5) לבחון את היקף עבודתו של רואה החשבון המבקר ואת שכרו, ולהביא את המלצותיה לפני מי שקובע את שכרו לפי סעיפים 155 ו־165; מינתה החברה ועדה לבחינת דוחות כספיים לפי סעיף 171(ה), רשאית היא לקבוע כי הבחינה לפי פסקה זו תיעשה בידי הוועדה האמורה;\n(6) לקבוע הסדרים לגבי אופן הטיפול בתלונות של עובדי החברה בקשר לליקויים בניהול עסקיה ולגבי ההגנה שתינתן לעובדים שהתלוננו כאמור."},{"sec":"118","title":"ועדת ביקורת בחברה פרטית","law":"חוק החברות","text":"(א) בחברה פרטית שאינה חברת איגרות חוב רשאי הדירקטוריון למנות מבין חבריו ועדת ביקורת והוראות סעיף 115 לא יחולו, ואולם לא יכהן בה דירקטור המועסק בידי החברה או נותן לה שירותים דרך קבע, ובעל השליטה או קרובו לא יהיה יושב ראש הוועדה; תפקידי ועדת הביקורת יהיו כמפורט בסעיף 117.\n(ב) לא תמונה ועדת ביקורת בחברה פרטית שאינה חברת איגרות חוב, שתפקידה כאמור בסעיף 117(2), שרוב חבריה או קרוביהם הם בעלי מניות מהותיים."},{"sec":"118א","title":"מינוי ועדת תגמול","law":"חוק החברות","text":"(א) דירקטוריון חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב ימנה מבין חבריו ועדת תגמול (בחוק זה – ועדת תגמול).\n(ב) מספר חבריה של ועדת תגמול לא יפחת משלושה, כל הדירקטורים החיצוניים יהיו חברים בה והם יהיו רוב חבריה, ושאר חבריה יהיו דירקטורים שתנאי כהונתם והעסקתם הם בהתאם להוראות שנקבעו לפי סעיף 244 ובחברה ממשלתית – בהתאם להוראות שנקבעו לפי סעיף 19 לחוק החברות הממשלתיות, התשל״ה–1975, לפי העניין; יושב ראש הוועדה יהיה דירקטור חיצוני.\n(ג) הוראות סימן ח׳ וסעיף 115(ב) עד (ה) יחולו על ועדת תגמול, בשינויים המחויבים.\n(ד) ועדת ביקורת שמתקיימים בה התנאים האמורים בסעיף קטן (ב) יכולה לשמש גם ועדת תגמול."},{"sec":"118ב","title":"תפקידי ועדת התגמול","law":"חוק החברות","text":"תפקידיה של ועדת התגמול הם:\n(1) להמליץ לדירקטוריון על מדיניות התגמול לנושאי משרה, כמשמעותה בסעיף 267א(א), וכן להמליץ לו, אחת לשלוש שנים, בעניין אישור המשך תוקפה של מדיניות תגמול שנקבעה לתקופה העולה על שלוש שנים, כאמור בסעיף 267א(ד);\n(2) להמליץ לדירקטוריון על עדכונה, מעת לעת, של מדיניות התגמול ולבחון את יישומה;\n(3) להחליט אם לאשר עסקאות באשר לתנאי כהונה והעסקה של נושאי משרה הטעונות אישור של ועדת התגמול לפי סעיפים 272, 273 ו־275;\n(4) לפטור עסקה מאישור האסיפה הכללית, כאמור בסעיף 272(ג1)(3)."},{"sec":"119","title":"מינוי המנהל הכללי","law":"חוק החברות","text":"(א) חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב תמנה מנהל כללי, ורשאית היא למנות יותר ממנהל כללי אחד.\n(ב) חברה פרטית שאינה חברת איגרות חוב רשאית למנות מנהל כללי אחד או יותר; לא מונה מנהל כללי, תנוהל החברה בידי הדירקטוריון."},{"sec":"120","title":"אחריות המנהל הכללי","law":"חוק החברות","text":"המנהל הכללי אחראי לניהול השוטף של עניני החברה במסגרת המדיניות שקבע הדירקטוריון ובכפוף להנחיותיו."},{"sec":"121","title":"סמכויות המנהל הכללי","law":"חוק החברות","text":"(א) למנהל הכללי יהיו כל סמכויות הניהול והביצוע שלא הוקנו בחוק זה או בתקנון לאורגן אחר של החברה, והוא יהיה נתון לפיקוחו של הדירקטוריון.\n(ב) המנהל הכללי רשאי, באישור הדירקטוריון, לאצול לאחר, הכפוף לו, מסמכויותיו.\n(ג) על אף הוראות סעיף 95, רשאית האסיפה הכללית של חברה ציבורית להחליט, כי לתקופות שכל אחת מהן לא תעלה על שלוש שנים ממועד קבלת ההחלטה ניתן להסמיך את יושב ראש הדירקטוריון או קרובו למלא את תפקיד המנהל הכללי או להפעיל את סמכויותיו וכן להסמיך את המנהל הכללי או קרובו למלא את תפקיד יושב ראש הדירקטוריון או להפעיל את סמכויותיו, ובלבד שיתקיים אחד מאלה:\n(1) במנין קולות הרוב באסיפה הכללית ייכללו לפחות רוב מקולות בעלי המניות שאינם בעלי השליטה בחברה וכן מי שאינם בעלי עניין אישי באישור ההחלטה המשתתפים בהצבעה; במנין הקולות של בעלי המניות האמורים לא יובאו בחשבון קולות הנמנעים; על מי שיש לו עניין אישי, יחולו הוראות סעיף 276, בשינויים המחויבים;\n(2) סך קולות המתנגדים מקרב בעלי המניות האמורים בפסקה (1) לא עלה על שני אחוזים מכלל זכויות ההצבעה בחברה.\n(ד) על אף הוראות סעיף 95, רשאי דירקטוריון חברה פרטית שהיא חברת איגרות חוב להחליט כי לתקופות שכל אחת מהן לא תעלה על שלוש שנים ממועד קבלת ההחלטה, ניתן להסמיך את יושב ראש הדירקטוריון או קרובו למלא את תפקיד המנהל הכללי או להפעיל את סמכויותיו וכן להסמיך את המנהל הכללי או את קרובו למלא את תפקיד יושב ראש הדירקטוריון או להפעיל את סמכויותיו, ובלבד שניתן לכך אישור מאת ועדת הביקורת.\n(ה) על אף הוראות סעיפים קטנים (ג) ו־(ד) רשאי השר, בהתייעצות עם רשות ניירות ערך, לקבוע כי החלטה לפי אותם סעיפים קטנים תינתן לתקופות העולות על שלוש שנים, לסוגי חברות ובתנאים שיקבע."},{"sec":"122","title":"חובת דיווח לדירקטוריון","law":"חוק החברות","text":"(א) המנהל הכללי חייב להודיע ליושב ראש הדירקטוריון על כל ענין חריג שהוא מהותי לחברה; לא היה לחברה יושב ראש דירקטוריון או שנבצר ממנו למלא את תפקידו, יודיע המנהל הכללי כאמור לכל חברי הדירקטוריון.\n(ב) המנהל הכללי יגיש לדירקטוריון דיווחים בנושאים, במועדים ובהיקף שיקבע הדירקטוריון.\n(ג) יושב ראש הדירקטוריון רשאי, בכל עת, מיוזמתו או לפי החלטת הדירקטוריון, לדרוש דיווחים מהמנהל הכללי בענינים הנוגעים לעסקי החברה.\n(ד) הצריכו הודעה או דיווח של המנהל הכללי פעולה של הדירקטוריון, יזמן יושב ראש הדירקטוריון, ללא דיחוי, ישיבה של הדירקטוריון."},{"sec":"123","title":"המשרד הרשום","law":"חוק החברות","text":"(א) מיום שנרשמה חברה עליה לקיים משרד רשום בישראל, שאליו ניתן להפנות כל הודעה לחברה.\n(ב) הודעה על מען המשרד הרשום תימסר לרשם עם הבקשה לרישום החברה; הודעה על שינוי במענו של המשרד הרשום תימסר לרשם בתוך ארבעה עשר ימים לאחר השינוי; הרשם ירשום את מענו של משרדה הרשום של החברה.\n(ג) המצאת מסמך לחברה תהיה בהנחה במשרדה הרשום של החברה כפי שהוא רשום אצל הרשם בשעת המסירה, או במשלוח אליו בדואר.\n(ד) המצאת מסמך מרשם החברות לחברה או מרשות ניירות ערך לחברה שהיא תאגיד מדווח, יכול שתהיה, על אף הוראות סעיף קטן (ג), בהנחה במקום ששוכנע הרשם או ששוכנעה רשות ניירות ערך, לפי הענין, ששם מנהלת החברה בפועל את עסקיה או באופן אחר שנקבע לפי חוק ניירות ערך."},{"sec":"123א","title":"המען הדיגיטלי","law":"חוק החברות","text":"(א) מיום שנרשמה חברה, חובה שיהיה לה מען דיגיטלי, אחד מכל פרט המנוי בתוספת הרביעית.\n(ב) הודעה על מען דיגיטלי של חברה כאמור בסעיף קטן (א), תימסר לרשם עם הבקשה לרישום החברה; הודעה על שינוי במען דיגיטלי כאמור תימסר לרשם בתוך 14 ימים לאחר השינוי.\n(ג) הרשם ירשום את המען הדיגיטלי שעליו הודיעה החברה לפי הוראות סעיף קטן (ב), לאחר קיום הוראות סעיף 3ב(א)(1) ו־(3) לחוק תקשורת דיגיטלית עם גופים ציבוריים, ולאחר שווידא שהמען הדיגיטלי תקין ופעיל.\n(ד) השר, באישור ועדת החוקה, חוק ומשפט של הכנסת, רשאי, בצו, לשנות את התוספת הרביעית."},{"sec":"176","title":"בעל מניה בחברה פרטית","law":"חוק החברות","text":"בעל מניה בחברה פרטית הוא מי שרשום ככזה במרשם בעלי המניות."},{"sec":"177","title":"בעל מניה בחברה ציבורית","law":"חוק החברות","text":"בעל מניה בחברה ציבורית הוא אחד מאלה:\n(1) מי שלזכותו רשומה אצל חבר בורסה מניה ואותה מניה נכללת בין המניות הרשומות במרשם בעלי המניות על שם חברה לרישומים;\n(2) מי שרשום כבעל מניה במרשם בעלי המניות;\n(3)"},{"sec":"178","title":"תעודת מניה","law":"חוק החברות","text":"(א) בעל מניה שרשום במרשם בעלי המניות זכאי לקבל מהחברה תעודה המעידה על בעלותו במניה.\n(ב) חברה לרישומים זכאית לקבל מהחברה תעודה המעידה על מספר המניות וסוג המניות הרשומות על שמה במרשם בעלי המניות."},{"sec":"180","title":"נוסח תעודת מניה","law":"חוק החברות","text":"השר רשאי לקבוע הוראות בדבר הנוסח של תעודת מניה צורתה, אופן עריכתה והדפוס שלה."},{"sec":"181","title":"חילוט","law":"חוק החברות","text":"(א) חברה רשאית לקבוע בתקנונה או בהסכם הקצאה, הוראה ולפיה רשאי הדירקטוריון לחלט מניה שהקצתה החברה ולמכור אותה, אם התמורה שהתחייב לה בעל המניה (להלן – החייב), כולה או מקצתה, לא ניתנה במועד ובתנאים שנקבעו בהסכם או בתקנון.\n(ב) מניות שחולטו וטרם נמכרו יהיו מניות רדומות, כמשמעותן בסעיף 308.\n(ג) החייב ימשיך לחוב לחברה, אלא אם כן נמכרו המניות שחולטו והחברה קיבלה את מלוא התמורה שלה התחייב, בתוספת ההוצאות שנלוו למכירה.\n(ד) עלתה התמורה שנתקבלה בשל מכירת המניות שחולטו על התמורה שלה התחייב החייב, יהיה זכאי החייב להשבת התמורה החלקית שנתן בעבורן, אם היתה כזו, כפוף להוראות התקנון או הסכם ההקצאה, ובלבד שהתמורה שתיוותר בידי החברה לא תפחת ממלוא התמורה שלה התחייב החייב, בתוספת ההוצאות שנלוו למכירה.\n(ה) אין בהוראות סעיף זה כדי לגרוע מכל סעד אחר של החברה כלפי החייב."},{"sec":"182","title":"המועד הקובע לבעלות במניה","law":"חוק החברות","text":"(א) בעלי המניות הזכאים לדיבידנד, כאמור בסעיף 306, הם בעלי המניות במועד ההחלטה על הדיבידנד או במועד מאוחר יותר אם נקבע מועד אחר באותה החלטה.\n(ב) בעלי המניות בחברה ציבורית הזכאים להשתתף ולהצביע באסיפה הכללית הם בעלי המניות במועד שייקבע בהחלטה לזמן אסיפה כללית, ובלבד שמועד זה לא יעלה על עשרים ואחד ימים לפני מועד הכינוס של האסיפה הכללית, ולא יפחת מארבעה ימים לפני מועד הכינוס.\n(ג) השר רשאי לקבוע הוראות אחרות לענין המועדים האמורים בסעיף קטן (ב), אם נדרש הדבר לצורך הצבעה באמצעות כתבי הצבעה, כאמור בסעיף 87."},{"sec":"183","title":"זכויותיו וחובותיו של בעל מניה","law":"חוק החברות","text":"זכויותיו וחובותיו של בעל מניה הן כקבוע בחוק זה, בתקנון החברה ולפי כל דין."},{"sec":"191","title":"הזכות במקרה של קיפוח","law":"חוק החברות","text":"(א) התנהל ענין מענייניה של חברה בדרך שיש בה משום קיפוח של בעלי המניות שלה, כולם או חלקם, או שיש חשש מהותי שיתנהל בדרך זו, רשאי בית המשפט, לפי בקשת בעל מניה, לתת הוראות הנראות לו לשם הסרתו של הקיפוח או מניעתו, ובהן הוראות שלפיהן יתנהלו עניני החברה בעתיד, או הוראות לבעלי המניות בחברה, לפיהן ירכשו הם או החברה בכפוף להוראות סעיף 301, מניות ממניותיה.\n(ב) הורה בית המשפט כאמור בסעיף קטן (א), יובאו בתקנון החברה ובהחלטותיה השינויים המתחייבים מכך, כפי שיקבע בית המשפט, ויראו שינויים אלה כאילו נתקבלו כדין בידי החברה; עותק מן ההחלטה יישלח לרשם החברות, ואם החברה היא חברה ציבורית – לרשות ניירות ערך."},{"sec":"192","title":"חובות בעלי מניות","law":"חוק החברות","text":"(א) בעל מניה ינהג בהפעלת זכויותיו ובמילוי חובותיו כלפי החברה וכלפי בעלי המניות האחרים בתום לב ובדרך מקובלת, ויימנע מניצול לרעה של כוחו בחברה, בין היתר, בהצבעתו באסיפה הכללית ובאסיפות סוג, בענינים הבאים:\n(1) שינוי התקנון;\n(2) הגדלת הון המניות הרשום;\n(3) מיזוג;\n(4) אישור פעולות ועסקאות הטעונות אישור האסיפה הכללית לפי הוראות סעיפים 255 ו־268 עד 275.\n(ב) בעל מניה יימנע מלקפח בעלי מניות אחרים.\n(ג) על הפרת הוראות סעיפים קטנים (א) ו־(ב) יחולו הדינים החלים על הפרת חוזה, בשינויים המחויבים, ועל הפרת הוראת סעיף קטן (ב), יחולו גם הוראות סעיף 191, בשינויים המחויבים."},{"sec":"193","title":"חובת בעל שליטה וכח הכרעה לפעול בהגינות","law":"חוק החברות","text":"(א) על המפורטים להלן מוטלת החובה לפעול בהגינות כלפי החברה:\n(1) בעל השליטה בחברה;\n(2) בעל מניה היודע שאופן הצבעתו יכריע בענין החלטת אסיפה כללית או אסיפת סוג של החברה;\n(3) בעל מניה שלפי הוראות התקנון יש לו כוח למנות או למנוע מינוי של נושא משרה בחברה או כוח אחר כלפי החברה.\n(ב) על הפרת חובת הגינות יחולו הדינים החלים על הפרת חוזה, בשינויים המחויבים, בשים לב למעמדם בחברה של המנויים בסעיף קטן (א)."},{"sec":"194","title":"תנאים מוקדמים להגשת תביעה","law":"חוק החברות","text":"(א) כל בעל מניה וכל דירקטור בחברה (בפרק זה – תובע) רשאים להגיש תביעה נגזרת אם התקיימו הוראות סימן זה.\n(ב) המעונין להגיש תביעה נגזרת יפנה לחברה בכתב וידרוש ממנה כי תמצה את זכויותיה בדרך של הגשת תובענה (בפרק זה – דרישה).\n(ג) דרישה תופנה ליושב ראש דירקטוריון החברה, ויפורטו בה העובדות היוצרות את עילת התביעה והנימוקים להגשתה.\n(ד) על אף הוראות סעיף קטן (ב), המעוניין להגיש תביעה נגזרת אינו חייב לפנות בדרישה לחברה לפי הוראות אותו סעיף קטן, בהתקיים אחד מאלה:\n(1) לאורגן החברה המוסמך להחליט על הגשת התביעה, עניין אישי בהחלטה, ואם האורגן כאמור מורכב מכמה יחידים – למחצית או יותר מיחידי האורגן עניין אישי בהחלטה;\n(2) קיים חשש סביר כי פנייה בדרישה לחברה תפגע באפשרות לקבל את הסעד המבוקש."},{"sec":"195","title":"תגובת החברה","law":"חוק החברות","text":"חברה שקיבלה דרישה רשאית לפעול באחת הדרכים הבאות:\n(1) לבצע פעולה או לקבל החלטה אשר כתוצאה ממנה נשמטת עילת התביעה;\n(2) לדחות את דרישת התובע בנימוקים שיפורטו בהחלטתה;\n(3) להחליט על הגשת תביעה."},{"sec":"196","title":"תשובת החברה לתובע","law":"חוק החברות","text":"החברה תודיע לתובע על הדרך שנקטה כאמור בסעיף 195 בתוך ארבעים וחמישה ימים מיום קבלת הדרישה, תוך מתן פרטים על הפעולה שננקטה והגורם שהחליט עליה, לרבות שמות המשתתפים בקבלת ההחלטה; היה למשתתף או לנושא משרה בחברה ענין אישי בהחלטה יצוין הדבר בהחלטה ובהודעה לתובע."},{"sec":"197","title":"הזכות להגיש תביעה נגזרת","law":"חוק החברות","text":"תובע רשאי להגיש תביעה נגזרת באישור בית המשפט לפי הוראות סעיף 198, אם התקיים אחד מאלה:\n(1) הפעולה שננקטה או ההחלטה שנתקבלה לפי סעיף 195(1) לא השמיטה, לדעתו, את עילת התביעה;\n(2) החברה דחתה את דרישת התובע כאמור בסעיף 195(2);\n(3) החברה הודיעה לתובע כי החליטה להגיש תביעה, כאמור בסעיף 195(3), אך התביעה לא הוגשה בתוך שבעים וחמישה ימים מיום ההודעה;\n(4) החברה לא השיבה לדרישה בהתאם להוראות סעיף 196;\n(5) התובע פטור מהגשת דרישה לחברה לפי הוראות סעיף 194(ד)."},{"sec":"198","title":"אישור תביעה נגזרת","law":"חוק החברות","text":"(א) תביעה נגזרת טעונה אישור בית המשפט והוא יאשרה אם שוכנע כי לכאורה התביעה וניהולה הן לטובת החברה וכי התובע אינו פועל בחוסר תום לב.\n(ב) בית המשפט רשאי לאשר הגשת תביעה נגזרת המוגשת בטרם חלפו המועדים הקבועים בסעיפים 196 או 197 אם מצא כי אי הגשת התביעה באותו מועד תגרום להתיישנותה, ורשאי הוא להתנות את האישור במילוי תנאים הקבועים בסימן זה להגשת תביעה נגזרת.\n(ג)"},{"sec":"198א","title":"בקשה לגילוי מסמכים","law":"חוק החברות","text":"(א) מי שרשאי להגיש תביעה נגזרת לפי סעיף 197, רשאי לבקש מבית המשפט, לפני הגשת הבקשה לאישור התביעה או לאחר הגשתה, כי יורה לחברה לגלות מסמכים הנוגעים להליך אישור התביעה הנגזרת.\n(ב) בית המשפט רשאי לאשר בקשה כאמור בסעיף קטן (א) אם שוכנע כי המבקש העמיד תשתית ראייתית ראשונית לגבי קיומם של התנאים לאישור התביעה הנגזרת המנויים בסעיף 198(א)."},{"sec":"199","title":"אגרה והוצאות","law":"חוק החברות","text":"(א) בעת הגשת תביעה נגזרת, ישלם התובע רק חלק מאגרת בית משפט בשיעור שקבע השר.\n(ב) אישר בית המשפט תביעה נגזרת, תשיב החברה לתובע את האגרה ששילם ותשלם את יתרת אגרת בית המשפט בשל התביעה הנגזרת באופן ובשיעור שקבע השר, ועל אף האמור בכל דין אי תשלום יתרת אגרת בית המשפט לא יעכב את הדיון בתביעה; בית המשפט רשאי –\n(1) (2) להורות לחברה לשלם לתובע סכומים שיקבע לכיסוי הוצאותיו או להפקיד ערובה לתשלומם;\n(3) להטיל על החברה להפקיד ערובה לכיסוי הוצאות הנתבע."},{"sec":"200","title":"הוצאות","law":"חוק החברות","text":"פסק בית המשפט בתביעה הנגזרת ופסק הוצאות לטובת הנתבע, תשלם החברה את ההוצאות שנפסקו כאמור, אלא אם כן קבע מטעמים מיוחדים שיירשמו, כי ההוצאות ישולמו בידי התובע, ורשאי הוא להטיל על החברה את תשלום הוצאותיו של התובע וכן רשאי הוא להטיל על התובע תשלום הוצאות שנגרמו לחברה, כולן או מקצתן, בשים לב לפסק הדין וליתר נסיבות הענין."},{"sec":"200א","title":"שכר טרחת עורך דין בתביעה נגזרת","law":"חוק החברות","text":"(א) בית המשפט יקבע את שכר הטרחה של עורך הדין שייצג את התובע בתביעה הנגזרת; עורך הדין לא יקבל שכר טרחה בסכום העולה על הסכום שקבע בית המשפט.\n(ב) שכר הטרחה ישולם על ידי החברה אלא אם כן קבע בית המשפט, מטעמים מיוחדים שיירשמו, כי על התובע לשלם את שכר הטרחה."},{"sec":"201","title":"גמול","law":"חוק החברות","text":"פסק בית המשפט לטובת החברה, רשאי הוא להורות על תשלום גמול לתובע, שטרח בהגשת התביעה הנגזרת ובהוכחתה."},{"sec":"202","title":"הסדר או פשרה","law":"חוק החברות","text":"(א) תובע לא יסתלק מתביעה נגזרת, ולא יעשה הסדר או פשרה עם נתבע, אלא באישור בית המשפט; בבקשה לאישור יפורטו כל פרטי ההסדר או הפשרה לרבות כל תמורה המוצעת לתובע.\n(ב) נתבקש בית המשפט לאשר פשרה או הסדר כאמור בסעיף קטן (א), יורה על פרסום הודעה על פרטי ההסדר או הפשרה; בעל מניה, דירקטור, וכן נושה לעניין תביעה נגזרת לפי סעיף 204, רשאים להגיש, בתוך מועד שיקבע בית המשפט, התנגדות לאישור ההסדר או הפשרה."},{"sec":"203","title":"הגנה נגזרת","law":"חוק החברות","text":"(א) הוגשה תובענה נגד חברה, רשאי בית המשפט לבקשת בעל מניה או דירקטור (בפרק זה – מתגונן), להתיר לו להתגונן בשם החברה (להלן – הגנה נגזרת) ובלבד שהשתכנע, כי ניהול ההגנה הנגזרת הוא לטובת החברה, וכי המתגונן אינו פועל בחוסר תום לב.\n(ב) הוראות סימן זה בענין תביעה נגזרת יחולו, ככל שלא נקבעו הוראות על ידי השר, על הגנה נגזרת, בשינויים המחויבים."},{"sec":"204","title":"חלוקה אסורה ועסקה עם בעל שליטה","law":"חוק החברות","text":"נושה של חברה רשאי להגיש תביעה נגזרת בשם החברה בשל חלוקה אסורה שבוצעה בחברה נושה שהוא בעל איגרת חוב בחברת איגרות חוב רשאי להגיש תביעה נגזרת בשם החברה גם בשל אי־קיום הוראות סעיפים 275(ג) ו־(ד), והוראות סימן זה יחולו, בשינויים המחויבים."},{"sec":"205","title":"חברה בפירוק או בהליכי חדלות פירעון","law":"חוק החברות","text":"לא תוגש תביעה נגזרת או הגנה נגזרת בשמה של חברה שמונה לה נאמן לפי פרק ב׳ לחלק שמיני א׳ או לפי חוק חדלות פירעון ושיקום כלכלי."},{"sec":"205א","title":"מימון הרשות","law":"חוק החברות","text":"(א) מי שמבקש להגיש תביעה נגזרת בשם חברה שהיא תאגיד מדווח, או תובע בתביעה כאמור, רשאי לבקש מרשות ניירות ערך להשתתף בהוצאותיו.\n(ב) שוכנעה רשות ניירות ערך כי יש בתביעה עניין לציבור וכי יש סיכוי סביר שבית המשפט יאשר אותה כתביעה נגזרת, רשאית היא להשתתף בהוצאות התובע, בסכום ובתנאים שתקבע; החלטות הרשות לפי סעיף זה לא ישמשו ראיה, ולא יהיה ניתן להגישן לבית המשפט.\n(ג) פסק בית המשפט לטובת החברה, רשאי הוא להורות בפסק הדין על שיפוי רשות ניירות ערך בשל הוצאותיה."},{"sec":"206","title":"תקנות","law":"חוק החברות","text":"השר רשאי לקבוע הוראות לענין תביעה נגזרת והגנה נגזרת, לרבות לענין ההליכים לאישורן, שיעור אגרת בית המשפט והמועדים והדרכים לגבייתה."},{"sec":"239","title":"חובת מינוי","law":"חוק החברות","text":"(א) בחברה ציבורית ובחברה פרטית שהיא חברת איגרות חוב יכהנו לפחות שני דירקטורים חיצוניים.\n(ב) הדירקטורים החיצוניים בחברה ציבורית ימונו על ידי האסיפה הכללית, ובלבד שיתקיים אחד מאלה:\n(1) במנין קולות הרוב באסיפה הכללית ייכללו רוב מכלל קולות בעלי המניות שאינם בעלי השליטה בחברה או בעלי עניין אישי באישור המינוי למעט עניין אישי שאינו כתוצאה מקשריו עם בעל השליטה, המשתתפים בהצבעה; במנין כלל הקולות של בעלי המניות האמורים לא יובאו בחשבון קולות הנמנעים; על מי שיש לו עניין אישי יחולו הוראות סעיף 276, בשינויים המחויבים;\n(2) סך קולות המתנגדים מקרב בעלי המניות האמורים בפסקה (1) לא עלה על שיעור של שני אחוזים מכלל זכויות ההצבעה בחברה.\n(ג) השר רשאי לקבוע שיעורים שונים מן השיעור האמור בסעיף קטן (ב)(2).\n(ד) בחברה שבמועד מינוי דירקטור חיצוני כל חברי הדירקטוריון שלה שאינם בעלי השליטה בחברה או קרוביהם הם בני מין אחד, יהיה הדירקטור החיצוני הממונה בן המין השני.\n(ה) לא ימונה דירקטור חיצוני בחברה פרטית שהיא חברת איגרות חוב אלא לאחר שהמועמד הצהיר כי מתקיימים בו התנאים הנדרשים למינויו כדירקטור חיצוני וועדת הביקורת אישרה כי מתקיימים בו התנאים כאמור, ויחולו על ההצהרה הוראות סעיף 241(ב) ו־(ג)."},{"sec":"240","title":"כשירות למנוי","law":"חוק החברות","text":"(א) כדירקטור חיצוני ימונה יחיד תושב ישראל הכשיר להתמנות לדירקטור, ואולם חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב, שמניותיה או שאיגרות החוב שלה, לפי העניין, או חלק מהן הוצעו לציבור מחוץ לישראל או שהן רשומות בבורסה מחוץ לישראל, רשאית למנות דירקטורים חיצוניים שאינם תושבי ישראל; השר רשאי לקבוע סוגים נוספים של חברות שבהן יהיה ניתן למנות דירקטורים חיצוניים שאינם תושבי ישראל.\n \n כדירקטור חיצוני ימונה מי שהוא בעל כשירות מקצועית או מי שהוא בעל מומחיות חשבונאית ופיננסית, ובלבד שלפחות אחד הדירקטורים החיצוניים יהיה בעל מומחיות חשבונאית ופיננסית.\n(2) השר, בהתייעצות עם רשות ניירות ערך, יקבע תנאים ומבחנים לדירקטור בעל מומחיות חשבונאית ופיננסית ולדירקטור בעל כשירות מקצועית.\n \n(ב) לא ימונה לדירקטור חיצוני יחיד, שהוא קרוב של בעל השליטה, וכן מי שיש לו, לקרובו, לשותפו, למעבידו, למי שהוא כפוף לו במישרין או בעקיפין או לתאגיד שהוא בעל השליטה בו, במועד המינוי או בשנתיים שקדמו למועד המינוי, זיקה לחברה, לבעל השליטה בחברה או לקרוב של בעל השליטה, במועד המינוי, או לתאגיד אחר, ובחברה שאין בה בעל שליטה או מי שמחזיק בדבוקת שליטה – גם זיקה למי שהוא, במועד המינוי, יושב ראש הדירקטוריון, המנהל הכללי, בעל מניות מהותי או נושא המשרה הבכיר ביותר בתחום הכספים; לענין סעיף קטן זה –\n(סוג=הגדרה)  ”זיקה“ – קיום יחסי עבודה, קיום קשרים עיסקיים או מקצועיים דרך כלל או שליטה, וכן כהונה כנושא משרה, למעט כהונה של דירקטור שמונה כדי לכהן כדירקטור חיצוני בחברה שעומדת להציע לראשונה מניות לציבור; השר, בהתייעצות עם רשות ניירות ערך, רשאי לקבוע כי ענינים מסוימים, בתנאים שקבע, לא יהוו זיקה;\n \n(סוג=הגדרה)  ”תאגיד אחר“ – תאגיד שבעל השליטה בו, במועד המינוי או בשנתיים שקדמו למועד המינוי, הוא החברה או בעל השליטה בה.\n(ג) לא ימונה יחיד כדירקטור חיצוני אם תפקידיו או עיסוקיו האחרים יוצרים או עלולים ליצור ניגוד ענינים עם תפקידו כדירקטור, או אם יש בהם כדי לפגוע ביכולתו לכהן כדירקטור.\n(ד) לא ימונה דירקטור בחברה פלונית כדירקטור חיצוני בחברה אחרת אם אותה שעה מכהן דירקטור בחברה האחרת כדירקטור חיצוני בחברה הפלונית.\n(ה) לא ימונה יחיד כדירקטור חיצוני בחברה ציבורית או בחברה פרטית שהיא חברת איגרות חוב, אם הוא עובד של רשות ניירות ערך או עובד של בורסה בישראל.\n(ו) בלי לגרוע מהוראות סעיף קטן (ב) לא יכהן כדירקטור חיצוני יחיד שיש לו, לקרובו, לשותפו, למעבידו, למי שהוא כפוף לו במישרין או בעקיפין או לתאגיד שהוא בעל השליטה בו, קשרים עסקיים או מקצועיים למי שאסורה זיקה אליו לפי הוראות סעיף קטן (ב), גם אם הקשרים כאמור אינם דרך כלל, למעט קשרים זניחים, וכן יחיד שקיבל תמורה בניגוד להוראות סעיף 244(ב); קוימו קשרים או התקבלה תמורה כאמור בעת כהונת הדירקטור החיצוני, יראו בכך, לעניין סעיפים 245א, 246 ו־247 הפרת תנאי מן התנאים הדרושים למינויו או לכהונתו כדירקטור חיצוני."},{"sec":"241","title":"הצהרה","law":"חוק החברות","text":"(א) לא תזומן אסיפה כללית שעל סדר יומה מינוי דירקטור חיצוני אלא אם כן הצהיר המועמד כי מתקיימים בו התנאים הנדרשים למינויו כדירקטור חיצוני (להלן – ההצהרה).\n(ב) ההצהרה תישמר במשרדה הרשום של החברה ותהיה פתוחה לעיונו של כל אדם.\n(ג) השר רשאי לקבוע הוראות לענין ההצהרה."},{"sec":"242","title":"דירקטורים חיצוניים ראשונים","law":"חוק החברות","text":"(א) דירקטורים חיצוניים ראשונים בחברה ציבורית ימונו על ידי האסיפה הכללית שתכונס לא יאוחר משלושה חודשים מהמועד שבו הפכה החברה לחברה ציבורית; ואולם בחברה פרטית שהיא חברת איגרות חוב שהפכה לחברה ציבורית רשאי דירקטור חיצוני שכיהן ערב המועד שבו הפכה לחברה ציבורית, להמשיך ולכהן כדירקטור חיצוני בחברה הציבורית עד תום תקופת כהונתו לפי סעיף 245.\n(ב) דירקטורים חיצוניים ראשונים בחברה פרטית שהיא חברת איגרות חוב, ימונו לא יאוחר מתום שלושה חודשים מהמועד שבו הפכה החברה לחברה פרטית שהיא חברת איגרות חוב; במינוי דירקטורים כאמור, במקום אישור ועדת הביקורת על התקיימות תנאי הכשירות למינוי דירקטור חיצוני לפי סעיף 239 יבוא אישור הדירקטוריון לעניין זה."},{"sec":"243","title":"השתתפות בועדות","law":"חוק החברות","text":"בכל ועדה הרשאית להפעיל סמכות מסמכויות הדירקטוריון יכהן לפחות דירקטור חיצוני אחד."},{"sec":"244","title":"גמול והחזר הוצאות","law":"חוק החברות","text":"(א) דירקטור חיצוני זכאי לגמול ולהחזר הוצאות, כפי שיקבע השר בהתייעצות עם רשות ניירות ערך.\n \n(ב) דירקטור חיצוני לא יקבל, נוסף על הגמול שלו הוא זכאי ולהחזר ההוצאות, כל תמורה, במישרין או בעקיפין, בשל כהונתו כדירקטור בחברה; לענין סעיף קטן זה לא יראו כתמורה מתן פטור, התחייבות לשיפוי, שיפוי או ביטוח לפי הוראות סימן ג׳ לפרק השלישי."},{"sec":"245","title":"משך כהונה","law":"חוק החברות","text":"(א) תקופת כהונתו של דירקטור חיצוני תהא שלוש
