טבה אחרת.\n(ג) הדו״ח הכספי ייערך על פי כללי חשבונאות ודיווח מקובלים המתאימים למצבה ולנסיבותיה של העמותה, ויתן ביטוי נאות לנתונים הכלולים בפנקסי החשבונות המנוהלים כאמור בסעיף 35(א).\n(ד) הדו״ח הכספי המקורי או העתקו המאושר כדין יוגש לרשם לא יאוחר מיום 30 ביוני בשנה שלאחר תום תקופת הדו״ח, חתום בידי שנים מחברי הועד, ורשאי הרשם, להאריך את המועד להגשתם."},{"sec":"36א","title":"תרומה מישות מדינית זרה","law":"חוק העמותות","text":"(א) בסעיף זה –\n(סוג=הגדרה)  ”ישות מדינית זרה“ – כל אחד מאלה:\n(1) מדינה זרה, לרבות –\n(א) איחוד, ארגון או חבר של מדינות זרות (בסעיף זה – איחוד מדינות זרות);\n(ב) אורגן, רשות או נציגות של מדינה זרה או של איחוד מדינות זרות;\n(ג) רשות מקומית או מחוזית, רשות שלטונית של מדינה זרה או של מדינה שחברה בברית מדינות במדינה זרה (בסעיף זה – גוף זר);\n(ד) איחוד, ארגון או חבר של גופים זרים;\n(2) הרשות הפלסטינית, כמשמעותה בחוק להארכת תוקפן של תקנות שעת חירום (יהודה והשומרון – שיפוט בעבירות ועזרה משפטית), התשכ״ח–1967;\n(3) תאגיד שהוקם בחיקוק של אחד מהגופים המפורטים בפסקאות (1) או (2), או שגוף כאמור מחזיק ביותר ממחצית מסוג מסוים של אמצעי השליטה בתאגיד או שהוא מינה את התאגיד לפעול בשמו; לעניין זה, ”אמצעי שליטה“, ”החזקה“ – כמשמעותם בחוק ניירות ערך, התשכ״ח–1968;\n(4) חברת חוץ שמחזורה בשנת הכספים האחרונה שלגביה היה עליה להגיש דוח כספי, היה ברובו מגופים המנויים בפסקאות (1) עד (3);\n(סוג=הגדרה)  ”תרומה“ – למעט הקלת מס, מלאה או חלקית, שניתנה מחוץ לישראל.\n עמותה שמחזורה עולה על 300,000 שקלים חדשים, תציין בדוח הכספי לפי סעיף 36, אם קיבלה או לא קיבלה בשנה שאליה מתייחס הדוח הכספי, תרומות מישויות מדיניות זרות ששוויין המצטבר עולה על סכום של 20,000 שקלים חדשים; בפסקה זו, ”מחזור“ – כהגדרתו בתוספת השניה;\n(2) קיבלה העמותה תרומות כאמור בפסקה (1), יצוינו בדוח הכספי כל אלה, לגבי כל תרומה מישות מדינית זרה:\n(א) זהות נותן התרומה;\n(ב) סכום התרומה;\n(ג) מטרת התרומה או ייעודה;\n(ד) התנאים לתרומה, לרבות ההתחייבויות שנתנה העמותה בנוגע לתרומה, בעל פה או בכתב, במישרין או בעקיפין, אם יש כאלה;\n(3) על העמותה לעשות כל שביכולתה כדי לדעת אם התרומה הגיעה מישות מדינית זרה, וחובת הדיווח כאמור בסעיף זה תחול אם ידעה או היה עליה לדעת שהתרומה היא מישות מדינית זרה כאמור.\n(ג) העמותה תפרסם באתר האינטרנט שלה מידע כאמור בסעיף קטן (ב); הודיעה העמותה לרשם כי אין לה אתר אינטרנט, יפרסם הרשם את המידע כאמור באתר האינטרנט של משרד המשפטים."}]};

    $('#lres').innerHTML = hits.map(s => `<details class="lawsec"><summary>${secTag(s.sec)} <b>${esc(s.title)}</b> <span class="note">${esc(s.law)}</span></summary><div class="lawtext">${esc(s.text).replace(/\n/g, '<br>')}</div></details>`).join('') || '<p class="note">לא נמצא. נסו מספר סעיף אחר או מילה אחרת.</p>';
  };
  draw(''); $('#lq').oninput = e => draw(e.target.value);
}
const RS = {co: 'pub', who: 'ctrl', what: 'extra'};
function routeUI() {
  return `<section class="panel route">${Object.entries(ROUTE_Q).map(([k, q]) => `<fieldset><legend>${q.label}</legend>${q.opts.map(([v, l]) => `<label class="ropt"><input type="radio" name="r_${k}" value="${v}" ${RS[k] === v ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</fieldset>`).join('')}</section><section class="panel" id="rout"></section>`;
}
function bindRoute() {
  const draw = () => {
    const r = approvalRoute(RS.co, RS.who, RS.what), o = $('#rout');
    if (r.na) { o.innerHTML = `<p>${esc(r.na)}</p>`; return; }
    o.innerHTML = `<h4>סדר האישורים</h4><ol class="rsteps">${r.steps.map(s => `<li><b>${esc(s.org)}</b><span class="note">${esc(s.note)}</span></li>`).join('')}</ol>
      ${r.notes.length ? `<h4>חשוב לזכור</h4><ul class="ll">${r.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}<p>${r.secs.map(secTag).join(' ')}</p>`;
  };
  document.querySelectorAll('.route input').forEach(i => i.onchange = () => { RS[i.name.slice(2)] = i.value; draw(); });
  draw();
}

async function resyncC() {
  if (!ACC.user() || (X.id && !X.done) || resyncC.busy) return; resyncC.busy = true;
  try { const b = S._at; await sync(); if (S._at !== b) { nav(); render(); } } finally { resyncC.busy = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resyncC(); });
window.addEventListener('storage', e => { if (ACC.user() && e.key === ACC.key(CCOURSE) && !(X.id && !X.done)) { loadS(); nav(); render(); } });
// ---------- boot ----------
$('#main').innerHTML = '<p class="note" style="text-align:center;padding:40px 0">טוען…</p>';
(function () { const b = $('#cbar b'); if (b) b.textContent = 'דיני תאגידים'; const a = $('#cbar a'); if (a) { a.href = '/'; a.removeAttribute('data-go'); } const bl = $('.brandlink'); if (bl) { bl.href = '/'; bl.removeAttribute('data-go'); } })();
ACC.ready().catch(() => {}).then(async () => {
  if (!ACC.user()) { try { sessionStorage.setItem('silas_return', location.pathname + location.hash); } catch (e) {} location.replace('/'); return; }
  // a blocked account sees the blocked screen on the main site, not the course
  if (ACC.user().blocked) { location.replace('/'); return; }
  ACC.onBlocked = () => location.replace('/');
  loadS(); await sync();
  const p = parseHash(); view = p.v; arg = p.a; if (!VIEWS.some(v => v[0] === view) && !PARENT[view]) view = 'dash';
  if (restoreX() && !X.done) { view = 'exam'; arg = null; try { history.replaceState(null, '', '#exam'); } catch (e) {} }
  nav(); render();
});
</script>
