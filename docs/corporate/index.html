 המשפט (ס' 304(ב)). כך נשמר העיקרון שהערך הנקוב ״מגובה״ בהון, כפי שמתחייב מס' 35(ב)."},{"t":"example","title":"דוגמה: חריגה מההון הרשום","x":"ההון הרשום של ״אופק בע״מ״ הוא 1,000,000 מניות, ומתוכן הונפקו 600,000. הדירקטוריון רוצה להקצות 500,000 מניות למשקיע. <b>פתרון:</b> נותרו רק 400,000 מניות רשומות שטרם הונפקו, והדירקטוריון רשאי להקצות רק עד גבול ההון הרשום (ס' 288(א)). לכן יש להגדיל קודם את ההון הרשום בהחלטת אסיפה כללית (ס' 286, 57(6)), ורק אחר כך הדירקטוריון יקצה."},{"t":"trap","x":"<b>הון רשום אינו הכסף של החברה.</b> זו רק תקרה בתקנון. גם ״ערך נקוב״ אינו המחיר ששולם בפועל. בשאלות אמריקאיות מבלבלים בכוונה בין מספר מניות, ערך נקוב ומחיר רכישה. זכרו: <b>הצבעה לפי מספר מניות</b> (ס' 82(ג)), ו<b>דיבידנד ומניות הטבה לפי ערך נקוב</b> (ס' 306(ב))."},{"t":"exam","x":"בבחינה מופיעה כמעט תמיד שאלה אמריקאית על ס' 20(ב): נותנים רוב משוריין ורוב מוצע ושואלים מה הרוב הדרוש (התשובה: הגבוה מביניהם). בשאלה פתוחה על שינוי תקנון ציינו: האורגן המוסמך הוא האסיפה (ס' 20(א), 57(1)); הרוב הדרוש (ס' 20(ב)); אסיפת סוג אם נפגעות זכויות של סוג (ס' 20(ג)); אין חיוב להשקיע עוד בלי הסכמה (ס' 20(ד)); מועד התוקף (ס' 21, 40); ומגבלת תום הלב והקיפוח (ס' 192). בשאלות הון ציינו מי מגדיל (אסיפה, ס' 286) ומי מקצה (דירקטוריון, ס' 288), ואת ס' 304 בהקצאה בניכיון."}],"mcq":[{"id":"u2-1","q":"בתקנון ״מגדלי הים בע״מ״ נקבע כי כל שינוי בתקנון טעון רוב של 75% מהמשתתפים בהצבעה. בעל השליטה מבקש לתקן את התקנון כך שמעתה יידרש רוב רגיל לשינויו. איזה רוב נדרש לאישור התיקון?","o":["רוב מיוחד הכולל רוב מקרב בעלי המניות שאינם בעלי שליטה.","פה אחד.","ממוצע בין שני הרובים.","75%.","רוב רגיל."],"a":3,"why":"ס' 20(ב): כשבתקנון נקבע רוב מסוים לשינוי הוראותיו, השינוי טעון ״אותו רוב מסוים או … הרוב המוצע, לפי הגבוה מבין השניים״. הגבוה הוא 75%.","w":["זהו מנגנון הרוב המיוחד של עסקאות עם בעלי עניין (ס' 275), לא של שינוי תקנון.","אין דרישה לפה אחד.","אין בחוק ״ממוצע״.","","רוב רגיל הוא הנמוך מבין השניים; החוק דורש את הגבוה."],"secs":["20"]},{"id":"u2-2","q":"בתקנון חברה נקבע ששינוי התקנון טעון 90%. מוצע להוריד את הרוב ל-80%. בעלי 85% מהקולות תומכים. מה התוצאה?","o":["ההצעה נדחית, כי נדרש 90%.","ההצעה מתקבלת, כי 85% עולה על 80%.","ההצעה טעונה אישור בית המשפט.","ההצעה מתקבלת, כי די ברוב רגיל לשינוי תקנון.","ההצעה מתקבלת רק אם גם הדירקטוריון מאשר."],"a":0,"why":"לפי ס' 20(ב) נדרש הגבוה מבין הרוב הקיים (90%) לבין המוצע (80%), כלומר 90%. ל-85% זה לא מספיק.","w":["","הרוב המוצע אינו קובע כשהוא נמוך מהרוב הקיים.","אין דרישה לאישור בית משפט לשינוי תקנון.","ס' 20(א) קובע רוב רגיל רק כשלא נקבע רוב אחר בתקנון.","שינוי תקנון הוא סמכות האסיפה (ס' 57(1)), ולא נדרש אישור דירקטוריון."],"secs":["20"]},{"id":"u2-3","q":"בחברה שני סוגי מניות: רגילות ובכורה. האסיפה הכללית החליטה ברוב של 80% לבטל את זכות הקדימה בדיבידנד של מניות הבכורה. בתקנון אין הוראה מיוחדת. מה נכון?","o":["השינוי בטל, כי אסור לפגוע בזכויות סוג בשום מקרה.","השינוי טעון אישור רשם החברות בלבד.","השינוי טעון אישור בית המשפט.","השינוי תקף, כי התקבל ברוב העולה על הרוב הרגיל.","השינוי טעון גם אישור אסיפת סוג של בעלי מניות הבכורה."],"a":4,"why":"ס' 20(ג): שינוי שיפגע בזכויות סוג מניות לא ייעשה ״ללא אישור אסיפת אותו סוג, אלא אם כן נקבע אחרת בתקנון״.","w":["מותר לפגוע בזכויות סוג, אבל רק באישור אסיפת הסוג.","הרשם אינו מאשר את מהות השינוי. ההחלטה רק נמסרת לו (ס' 21(ב)).","החוק אינו מחייב אישור בית משפט.","הרוב באסיפה הכללית אינו מחליף את אישור אסיפת הסוג.",""],"secs":["20"]},{"id":"u2-4","q":"האסיפה הכללית שינתה את התקנון כך שכל בעל מניות חייב להשקיע 50,000 ₪ נוספים ולרכוש מניות נוספות. רונית הצביעה נגד. מה נכון?","o":["רונית חייבת רק אם ההחלטה התקבלה ב-75%.","רונית חייבת, אך רשאית לתבוע פיצוי מבעל השליטה.","השינוי בטל כלפי כל בעלי המניות.","השינוי אינו מחייב את רונית ללא הסכמתה.","רונית חייבת, כי ההחלטה התקבלה כדין."],"a":3,"why":"ס' 20(ד): שינוי בתקנון המחייב בעל מניה לרכוש מניות נוספות או להגדיל את היקף אחריותו לא יחייב אותו ללא הסכמתו.","w":["גם רוב מיוחד אינו מספיק; נדרשת הסכמתה האישית.","היא פשוט אינה חייבת; אין צורך בפיצוי.","השינוי אינו מחייב את מי שלא הסכים, אבל אין קביעה שהוא בטל כלפי מי שהסכים.","","ס' 20(ד) גובר ״על אף הוראות סעיף זה״."],"secs":["20"]},{"id":"u2-5","q":"איזה מהפרטים הבאים אינו פרט חובה בתקנון חברה?","o":["פרטים בדבר הגבלת האחריות.","מספר הדירקטורים.","שם החברה.","פרטים בדבר הון המניות הרשום.","מטרות החברה."],"a":1,"why":"ס' 18 מונה ארבעה פרטי חובה: שם, מטרות, הון רשום והגבלת אחריות. מספר הדירקטורים הוא פרט רשות (ס' 19(2), 219(א)).","w":["ס' 18(4).","","ס' 18(1).","ס' 18(3).","ס' 18(2)."],"secs":["18","19"]},{"id":"u2-6","q":"מה מהבאים אינו ניסוח מותר של מטרות חברה לפי ס' 32?","o":["לעסוק בכל עיסוק שהדירקטוריון יקבע מעת לעת, לרבות עיסוק שאינו חוקי אם הוא רווחי.","לעסוק בכל עיסוק חוקי.","לעסוק בייצור מזון ובשיווקו בלבד.","לעסוק בסוגי עיסוקים שפורטו בתקנון.","לעסוק בכל עיסוק חוקי למעט בסוגי עיסוקים שפורטו בתקנון."],"a":0,"why":"ס' 32 מתיר שלוש חלופות בלבד, וכולן מוגבלות לעיסוק חוקי. מטרה בלתי חוקית אסורה גם לפי ס' 2.","w":["","חלופה (1) בס' 32.","זה ניסוח מותר לפי חלופה (3) בס' 32: סוגי עיסוקים שפורטו בתקנון.","חלופה (3) בס' 32.","חלופה (2) בס' 32."],"secs":["32","2"]},{"id":"u2-7","q":"מה מהבאים חובה לצרף לבקשה לרישום חברה?","o":["אישור רואה חשבון על שווי הנכסים שיועברו לחברה.","אישור על הפקדת הון מינימלי בבנק.","עותק של התקנון והצהרת הדירקטורים הראשונים על נכונותם לכהן.","פרוטוקול אסיפה כללית ראשונה.","תכנית עסקית ודוח כספי פתיחה."],"a":2,"why":"ס' 8(א): לבקשה יצורפו עותק של התקנון והצהרת הדירקטורים הראשונים. בנוסף משולמת אגרת רישום (ס' 9(א)).","w":["אין דרישה כזו בחברה רגילה.","אין בחוק דרישת הון מינימלי.","","החברה טרם קיימת, ולכן אין לה עדיין אסיפה כללית.","אין דרישה כזו בחוק."],"secs":["8","9"]},{"id":"u2-8","q":"לאחר רישום חברה התברר שבתקנונה יש הוראה הסותרת הוראה קוגנטית בחוק. מה מעמדה של תעודת ההתאגדות?","o":["התעודה היא ראיה חלוטה שנתמלאו דרישות הרישום, אך אינה מרפאת את הפגם בתקנון.","הפגם מתרפא אם לא הוגשה התנגדות בתוך 14 ימים.","התעודה מרפאת את הפגם, כי היא ראיה חלוטה.","הרשם חייב לבטל את רישום החברה.","התעודה בטלה, והחברה לא התאגדה כדין."],"a":0,"why":"ס' 10(ד) – התעודה היא ראיה חלוטה שנתמלאו דרישות הרישום; ס' 10(ה) – אין בכך ״כדי לרפא פגם בתקנון, או למנוע את הצורך בתיקונו״.","w":["","אין מנגנון כזה בחוק.","ס' 10(ה) שולל זאת במפורש.","אין חובה כזו; יש לתקן את התקנון.","קיום החברה אינו נפגע; התעודה היא ראיה חלוטה לתקינות הרישום."],"secs":["10"]},{"id":"u2-9","q":"לחברה מניות בערך נקוב של 1 ₪. היא מבקשת להקצות מניות למשקיע ב-0.70 ₪ למניה. מה נכון?","o":["ההקצאה מותרת רק בחברה ציבורית.","ההקצאה מותרת אם החברה הופכת להון מניות, מרווחים, מפרמיה או ממקור אחר בהונה העצמי, סכום השווה להפרש, או באישור בית המשפט.","ההקצאה מותרת בהחלטת דירקטוריון רגילה בלבד, ללא תנאי נוסף.","ההקצאה מותרת רק אם המשקיע חותם על ערבות להפרש.","ההקצאה אסורה בכל מקרה."],"a":1,"why":"ס' 304(א): בהקצאה בתמורה נמוכה מהערך הנקוב יש להפוך להון מניות מרווחים, מפרמיה או ממקור אחר בהון העצמי סכום השווה להפרש. ס' 304(ב): לחלופין, באישור בית המשפט.","w":["ס' 304 חל על כל חברה.","","נדרש גם ההליך של ס' 304.","אין בחוק מנגנון כזה.","החוק מתיר בתנאים."],"secs":["304"]},{"id":"u2-10","q":"ההון הרשום של חברה הוא 500,000 מניות, ומתוכן הונפקו 450,000. הדירקטוריון החליט להקצות 100,000 מניות למשקיע אסטרטגי. מה נכון?","o":["ההחלטה תקפה, כי הקצאת מניות היא סמכות הדירקטוריון.","המנכ״ל רשאי להחליט על הגדלת ההון הרשום.","יש להגדיל תחילה את ההון הרשום בהחלטת אסיפה כללית, כי הדירקטוריון רשאי להקצות רק עד גבול ההון הרשום.","יש לקבל אישור רשם החברות להקצאה.","הדירקטוריון רשאי להגדיל בעצמו את ההון הרשום."],"a":2,"why":"ס' 288(א): הדירקטוריון רשאי להקצות ״עד גבול הון המניות הרשום״. נותרו רק 50,000 מניות רשומות, ולכן יש להגדיל את ההון הרשום באסיפה הכללית (ס' 286, 57(6)).","w":["הסמכות קיימת רק עד גבול ההון הרשום.","למנכ״ל אין סמכות כזו.","","אין דרישה לאישור הרשם. בחברה פרטית מדווחים לו על ההקצאה בדיעבד, בתוך 14 ימים (ס' 292).","הגדלת ההון הרשום שמורה לאסיפה (ס' 57(6)), ואי אפשר להתנות על כך (ס' 58(א))."],"secs":["286","288","57"]},{"id":"u2-11","q":"״שקד בע״מ״ החליטה לשנות את שמה ל״שקד גלובל בע״מ״, וההחלטה התקבלה כדין באסיפה. ממתי תקף השינוי?","o":["מיום פרסום השם החדש בעיתון.","מיום מסירת ההחלטה לרשם.","רק מיום רישום השינוי אצל הרשם.","מיום קבלת ההחלטה באסיפה.","מתום 14 ימים מההחלטה."],"a":2,"why":"ס' 40(1): לשינוי שם חברה ״לא יהיה תוקף אלא אם כן נרשמו״. זה חריג לכלל של ס' 21(א), לפיו שינוי תקנון תקף מיום ההחלטה.","w":["אין דרישה כזו.","מסירה אינה רישום.","","זה הכלל הרגיל (ס' 21(א)), אבל שינוי שם הוא אחד החריגים שבס' 40.","14 הימים הם המועד למסירת ההחלטה לרשם (ס' 21(ב)), לא מועד התוקף."],"secs":["40","21","31"]},{"id":"u2-12","q":"מה מהבאים נכון לגבי מניות הטבה?","o":["אלה מניות שמוקצות בהנחה לעובדים בלבד.","מניות הטבה נחשבות דיבידנד, ולכן חלים עליהן רק מבחני החלוקה של ס' 302.","מניות הטבה מחולקות לפי מספר המניות שבידי כל בעל מניה, ולא לפי הערך הנקוב.","הקצאת מניות הטבה היא סמכות בלעדית של האסיפה הכללית.","אלה מניות שמוקצות ללא תמורה לבעלי המניות הזכאים; מאחר שהן מוקצות בפחות מערכן הנקוב, חל עליהן ס' 304."],"a":4,"why":"הגדרת ״מניות הטבה״ בס' 1: מניות שמקצה החברה ללא תמורה לבעלי מניותיה הזכאים. ס' 304(א) חל במפורש ״לרבות מניות הטבה״.","w":["ההגדרה מתייחסת לבעלי המניות הזכאים, לא לעובדים.","הגדרת ״דיבידנד״ בס' 1 מחריגה במפורש מניות הטבה.","ס' 306(ב): מחולקות באופן יחסי לערך הנקוב, אלא אם נקבע אחרת בתקנון.","הקצאת מניות היא סמכות הדירקטוריון (ס' 288).",""],"secs":["1","304","306"]},{"id":"u2-13","q":"בחברה ציבורית מוצע למנות את רון לדירקטור (שאינו דירקטור חיצוני). מה נכון?","o":["אין צורך בהצהרה כלשהי, כי הצהרת כשירות נדרשת רק מדירקטור חיצוני.","לא תזומן אסיפה שעל סדר יומה מינויו, ולא ימונה, עד שיצהיר שיש לו הכישורים הדרושים והיכולת להקדיש את הזמן הראוי, יפרט את כישוריו ויצהיר שאין לגביו מגבלות מינוי.","די בהצהרה שנתן רון כשהחברה נרשמה לפני עשר שנים, כדירקטור ראשון.","רון יכול להתמנות גם אם הורשע במרמה לפני שנתיים, כי ההגבלה חלה רק על חברות פרטיות.","רון יכול להתמנות גם אם הוא קטין, אם הוריו הסכימו בכתב."],"a":1,"why":"ס' 224ב(א): בחברה ציבורית ובחברת איגרות חוב לא תזומן אסיפה למינוי דירקטור ולא ימונה דירקטור עד שהמועמד הצהיר על כישוריו וזמנו, פירט אותם, והצהיר שלא חלות עליו המגבלות שבס' 226–227. זה משלים את דרישת הכשירות שבס' 224א.","w":["ס' 224ב חל על כל מועמד לדירקטור בחברה ציבורית. ס' 241 הוא דרישה נוספת לדירקטור חיצוני.","","ההצהרה של ס' 8 ניתנת ברישום ונוגעת לנכונות לכהן. מינוי חדש בחברה ציבורית טעון הצהרה לפי ס' 224ב.","להפך: ס' 226(א) מונע מינוי כזה דווקא בחברה ציבורית ובחברת איגרות חוב, עד שיחלפו חמש שנים מפסק הדין.","ס' 227(א) אוסר למנות קטין לדירקטור, בלי חריג של הסכמת הורים."],"secs":["224א","224ב","226","227"]},{"id":"u2-14","q":"״אורנים תוכנה בע״מ״ רשומה. יזם ביקש לרשום ״אורנים תכנה בע״מ״, שתפעל באותו תחום, והרשם רשם אותה בטעות. מה נכון?","o":["אין בעיה: השמות שונים באות אחת, ולכן אינם זהים.","רק בעל סימן מסחר רשום יכול להתנגד לשם של חברה.","השם דומה לשם תאגיד רשום עד כדי להטעות; ״אורנים תוכנה״ רשאית לבקש מבית המשפט צו שיורה לחברה החדשה להימנע מהשימוש בשם.","משנרשמה החברה, תעודת ההתאגדות היא ראיה חלוטה ולכן אין כל דרך להתנגד לשם.","השם פסול רק אם הוא פוגע בתקנת הציבור."],"a":2,"why":"ס' 27(א)(1) אוסר רישום חברה בשם הדומה לשם תאגיד רשום עד כדי להטעות. המבחן אובייקטיבי: האם אדם סביר עלול להתבלבל, וחשיבות מיוחדת לכך שהחברות פועלות באותו תחום. ס' 30 מאפשר לחברה שנפגעה לבקש צו מניעה נגד השימוש בשם.","w":["האיסור אינו רק על שם זהה, אלא גם על שם ״הדומה לו עד כדי להטעות״ (ס' 27(א)(1)).","ס' 27(א)(2) מגן על סימני מסחר, אבל ס' 27(א)(1) מגן גם על שמות של תאגידים רשומים.","","ס' 10(ד) עוסק בתקינות הליך הרישום. הוא אינו שולל צו מניעה לפי ס' 30 נגד שימוש בשם מטעה.","תקנת הציבור היא עילה נפרדת (ס' 28). שם מטעה פסול גם בלי לפגוע בתקנת הציבור (ס' 27)."],"secs":["27","30"]}],"cases":[{"id":"u2-c1","title":"מטבחי גורמה בע״מ","facts":"״מטבחי גורמה בע״מ״ היא חברה פרטית. בעלי מניותיה: אבי (60%), בתיה (25%) וגדי (15%). כל המניות רגילות, בערך נקוב של 1 ₪. בתקנון נקבע: ״מטרת החברה: ייצור וממכר מטבחים״, וכן ״שינוי תקנון זה טעון רוב של 75% מקולות המשתתפים בהצבעה״. ההון הרשום הוא 1,000,000 מניות, ומתוכן הונפקו 800,000. אבי מבקש: (1) לשנות את המטרות כך שהחברה תעסוק בכל עיסוק חוקי; (2) לתקן את התקנון כך שכל שינוי עתידי יאושר ברוב רגיל; (3) להקצות לחברת ״מימון א.ב. בע״מ״, שבשליטתו, 300,000 מניות במחיר 0.50 ₪ למניה; (4) לחייב את כל בעלי המניות להעמיד לחברה הלוואה של 100,000 ₪ כל אחד. בתיה וגדי מתנגדים.","parts":[{"q":"דונו בבקשות (1) ו-(2) של אבי. נמקו והפנו לסעיפי החוק.","pts":20,"model":["1. שינוי מטרות הוא שינוי תקנון, והוא בסמכות האסיפה הכללית (ס' 20(א), 57(1)). החלופה ״לעסוק בכל עיסוק חוקי״ מותרת לפי ס' 32(1).","2. בתקנון נקבע רוב משוריין של 75%. לאבי 60% בלבד, ולכן בלי בתיה או גדי הוא אינו יכול לשנות את המטרות.","3. ביטול השריון (מעבר לרוב רגיל) טעון, לפי ס' 20(ב), את הגבוה מבין הרוב הקיים (75%) לבין המוצע (רוב רגיל), כלומר 75%. גם זה לא בהישג ידו של אבי לבדו.","4. גם אם יושג הרוב, שינוי המטרות יהיה תקף רק מרגע רישומו אצל הרשם (ס' 40(2)). שינויים אחרים בתקנון תקפים מיום ההחלטה, וההחלטה תימסר לרשם בתוך 14 ימים (ס' 21).","5. בהצבעתו על שינוי התקנון חייב אבי לנהוג בתום לב ולהימנע מקיפוח המיעוט (ס' 192(א)(1), (ב)). כבעל שליטה חלה עליו גם חובת הגינות (ס' 193)."],"check":["סמכות האסיפה (ס' 20, 57(1))","ס' 32 – חלופות המטרות","ס' 20(ב) – הגבוה מבין הרובים, יישום 75%","תוקף מרישום – ס' 40","תום לב והגינות – ס' 192–193"]},{"q":"דונו בבקשות (3) ו-(4). נמקו והפנו לסעיפי החוק.","pts":20,"model":["1. הקצאת מניות היא סמכות הדירקטוריון, עד גבול ההון הרשום (ס' 288(א)). נותרו רק 200,000 מניות רשומות שטרם הונפקו, ולכן להקצאת 300,000 מניות יש להגדיל קודם את ההון הרשום באסיפה הכללית (ס' 286, 57(6)).","2. המחיר (0.50 ₪) נמוך מהערך הנקוב (1 ₪). לכן חל ס' 304(א): יש להפוך להון מניות 150,000 ₪ (0.50 × 300,000) מרווחים, מפרמיה או ממקור אחר בהון העצמי, או לקבל אישור בית המשפט (ס' 304(ב)).","3. בחברה פרטית עם סוג מניות אחד, ברירת המחדל היא שהמניות מוצעות קודם לבעלי המניות לפי חלקם (ס' 290(א)). בתיה וגדי זכאים להשתתף, אלא אם התקנון קבע אחרת.","4. ההקצאה מיטיבה עם חברה בשליטת אבי, ולכן היא מעוררת חשש לקיפוח ולניגוד עניינים. מסלול האישור המיוחד של ס' 270(4) ו-275 חל רק על חברה ציבורית (ובחברת איגרות חוב: ס' 270(4א)), ולא על ״מטבחי גורמה״, שהיא חברה פרטית. כאן ההגנה על המיעוט היא חובת ההגינות של אבי כבעל שליטה (ס' 193), איסור הקיפוח (ס' 192(ב)) וסעד הקיפוח (ס' 191). אם אבי מכהן גם כדירקטור, זו עסקה עם אדם אחר שלנושא משרה יש בה עניין אישי (ס' 270(1)), הטעונה אישור לפי ס' 271–272.","5. חיוב בעלי המניות להעמיד הלוואה דרך שינוי תקנון מגדיל את מחויבותם, ולפי ס' 20(ד) אינו מחייב בעל מניה שלא הסכים. בתיה וגדי אינם חייבים."],"check":["סמכות דירקטוריון וגבול ההון הרשום (ס' 288)","הגדלת הון באסיפה (ס' 286)","הקצאה בניכיון – ס' 304 וחישוב ההפרש","זכות קדימה – ס' 290(א)","ס' 20(ד) – אין חיוב ללא הסכמה"]}]}]},{"id":"u3","title":"הרמת מסך","short":"הרמת מסך","blurb":"תוכלו לנתח לפי ס' 6 לחוק החברות אם ניתן לייחס חוב של חברה לבעל מניה, לייחס תכונה או חובה או להשעות חוב של בעל מניה, ולהבחין בין עילות תקפות לבין טענות שאינן מספיקות.","secs":["4","6","7","192","193"],"blocks":[{"t":"h","x":"המסך ולמה צריך להרים אותו"},{"t":"p","x":"חברה היא אישיות משפטית נפרדת (ס' 4), ובעלי מניותיה בחברה בע״מ אינם חבים בחובותיה (ס' 35). בין החברה לבעליה עומד מעין <b>״מסך״</b> משפטי. הנושה של החברה רואה מולו רק את החברה, ואינו יכול להגיע אל בעלי המניות."},{"t":"p","x":"העיקרון התבסס במשפט האנגלי כבר בסוף המאה ה-19. נקבע אז שחברה שהוקמה כדין היא ישות נפרדת גם כשאדם אחד שולט בה כמעט לחלוטין, ושהנושים אינם יכולים לגבות ממנו את חובותיה. העיקרון הזה מאפשר יזמות: אפשר לקחת סיכון עסקי בלי לסכן את כל הרכוש הפרטי. המחיר הוא סיכון לנושים. בעלי המניות נהנים מהרווחים, ואת ההפסדים מעבר להון החברה סופגים הנושים. כשמשתמשים במסך ל<b>רעה</b>, החוק מאפשר ״להרים״ אותו, אבל ההרמה היא <b>חריג</b> ולא הכלל."},{"t":"list","x":["<b>לפני שמגיעים להרמת מסך</b>, בדקו דרכים אחרות לחייב את בעל המניות:","ערבות אישית שחתם עליה לטובת הנושה.","יתרת ערך נקוב שטרם נפרעה (ס' 35(ב)).","אחריות אישית שלו כנושא משרה או כמזיק, למשל מצג שווא כלפי הנושה (ס' 54(א)).","הסכם חוזי מפורש עם הנושה."]},{"t":"h","x":"ס' 6(א): ייחוס חוב של החברה לבעל מניה"},{"t":"law","law":"חוק החברות","sec":"6(א)(1)","x":"בית משפט רשאי לייחס חוב של חברה לבעל מניה בה, אם מצא כי בנסיבות הענין צודק ונכון לעשות כן, במקרים החריגים שבהם השימוש באישיות המשפטית הנפרדת נעשה באחד מאלה: (א) באופן שיש בו כדי להונות אדם או לקפח נושה של החברה; (ב) באופן הפוגע בתכלית החברה ותוך נטילת סיכון בלתי סביר באשר ליכולתה לפרוע את חובותיה, … ובלבד שבעל המניה היה מודע לשימוש כאמור, ובשים לב לאחזקותיו ולמילוי חובותיו כלפי החברה לפי סעיפים 192 ו־193 ובשים לב ליכולת החברה לפרוע את חובותיה."},{"t":"steps","title":"ניתוח הרמת מסך לפי ס' 6(א) – שלב אחר שלב","x":["<b>מי הנתבע?</b> הסעיף מייחס חוב ל<b>בעל מניה</b>. לא לדירקטור או למנכ״ל בכובעם זה.","<b>יש עילה?</b> (א) הונאת אדם או קיפוח נושה; או (ב) פגיעה בתכלית החברה <b>וגם</b> נטילת סיכון בלתי סביר לגבי יכולתה לפרוע חובות.","<b>מודעות:</b> בעל המניה היה מודע לשימוש לרעה. עצימת עיניים נחשבת מודעות, רשלנות בלבד לא (ס' 6(א)(2)).","<b>שיקולים:</b> גובה אחזקותיו; האם מילא את חובותיו לפי ס' 192 (תום לב, איסור קיפוח) ו-193 (חובת הגינות של בעל שליטה); ויכולת החברה לפרוע את חובותיה.","<b>שיקול דעת:</b> גם כשהעילה הוכחה, בית המשפט ״רשאי״ ולא חייב. הוא מרים את המסך רק אם ״צודק ונכון לעשות כן״, ״במקרים החריגים״.","<b>תוצאה:</b> ייחוס חוב מסוים, כולו או חלקו, לבעל המניה. בנוסף אפשר צו הגבלה (ס' 7) והשעיית חובו של בעל המניה (ס' 6(ג))."]},{"t":"h","x":"עילה (א): הונאה או קיפוח נושה"},{"t":"p","x":"זו העילה הקלאסית: משתמשים בחברה <b>ככלי</b> כדי לרמות. למשל: בעל המניות מבריח את נכסי החברה לחברה אחרת שבבעלותו ומשאיר לנושים ״קליפה ריקה״. או: הוא מערבב בין נכסיו לנכסי החברה עד שאי אפשר לדעת מה של מי, ומושך כספים כרצונו."},{"t":"example","title":"דוגמה: העברת נכסים לחברה חדשה","x":"״אור בנייה בע״מ״ חייבת 3 מיליון ₪ לספק. יום לפני פסק הדין מעביר בעל המניות היחיד את הציוד ואת חוזי הלקוחות, בלי תמורה, ל״אור בנייה 2026 בע״מ״, שגם בה הוא מחזיק לבדו. <b>פתרון:</b> השימוש באישיות הנפרדת נעשה כדי לקפח נושה (ס' 6(א)(1)(א)), ובעל המניה מודע לכך, שהרי הוא ביצע את ההעברה. הוא גם הפר את חובת תום הלב (ס' 192) ואת חובת ההגינות (ס' 193). בית המשפט רשאי לייחס לו את החוב, ולשקול גם צו הגבלה (ס' 7)."},{"t":"case","name":"ע\"א 4606/90 מוברמן נ' תל מר בע\"מ","x":"תכלית הרמת המסך היא למנוע שימוש לרעה באישיות המשפטית הנפרדת לשם מטרה בלתי כשרה של בעל המניות. כשבעלי השליטה משתמשים בחברה ככלי להתחמק מהתחייבות אישית שלהם, בית המשפט ייטה להרים את המסך. זו הלכת יסוד מלפני חוק החברות, ובסעיף 6 עוגנה גישה דומה."},{"t":"h","x":"עילה (ב): פגיעה בתכלית החברה וסיכון בלתי סביר"},{"t":"p","x":"תכלית החברה היא להשיא רווחים (ס' 11(א)). העילה השנייה חלה כשהשימוש בחברה פוגע בתכלית הזו <b>ובמקביל</b> לוקח סיכון בלתי סביר לגבי יכולתה לשלם לנושים. המקרה הטיפוסי הוא <b>מימון דק</b> (Thin Capitalization): חברה שעוסקת בפעילות מסוכנת ויקרה עם הון עצמי זעום, וכל המימון מגיע מהלוואות בעלים או מאשראי של ספקים. כך הסיכון ״מגולגל״ לנושים."},{"t":"law","law":"חוק החברות","sec":"6(א)(2)","x":"לענין סעיף קטן זה, יראו אדם כמודע לשימוש כאמור בפסקה (1)(א) או (ב) גם אם חשד בדבר טיב ההתנהגות או בדבר אפשרות קיום הנסיבות, שגרמו לשימוש כאמור, אך נמנע מלבררן, למעט אם נהג ברשלנות בלבד."},{"t":"trap","x":"<b>״לא ידעתי״ אינו מספיק.</b> בעל מניה שחשד ובחר לא לבדוק נחשב מודע (עצימת עיניים, ס' 6(א)(2)). מנגד, <b>רשלנות בלבד</b>, כלומר מצב שבו היה צריך לחשוד אבל בפועל לא חשד, אינה מספיקה. במבחן נבחנת היכולת להבחין בין שני המצבים."},{"t":"h","x":"ס' 6(ב): ייחוס תכונה, זכות או חובה"},{"t":"law","law":"חוק החברות","sec":"6(ב)","x":"בית משפט רשאי לייחס תכונה, זכות או חובה של בעל מניה לחברה או זכות של החברה לבעל מניה בה, אם מצא כי בנסיבות הענין, צודק ונכון לעשות כן בהתחשב בכוונת הדין או ההסכם החלים על הענין הנדון לפניו."},{"t":"p","x":"כאן לא מדובר בגביית חוב, אלא ב<b>זיהוי</b> בין החברה לבעליה לצורך חוק או חוזה מסוים, כדי שלא יתחמקו מהם דרך החברה. המבחן הוא <b>תכלית הדין או ההסכם</b>: האם הם התכוונו לחול גם על פעולה שנעשתה דרך חברה."},{"t":"example","title":"דוגמה: התחייבות לאי-תחרות","x":"רן מכר את המסעדה שלו והתחייב בחוזה שלא לפתוח מסעדה מתחרה ברחוב במשך שנתיים. כעבור חודש הקים ״רן אוכל בע״מ״ (100% שלו) והחברה פתחה מסעדה ממול. <b>פתרון:</b> לפי ס' 6(ב), בית המשפט רשאי לייחס לחברה את <b>חובתו</b> של רן מכוח החוזה, משום שכוונת ההסכם הייתה למנוע תחרות מצד רן, בין שהוא פועל בעצמו ובין שהוא פועל דרך חברה. לחלופין אפשר לראות את פעולת החברה כהפרה של רן עצמו."},{"t":"h","x":"ס' 6(ג): השעיית חוב של בעל מניה"},{"t":"law","law":"חוק החברות","sec":"6(ג)","x":"בית משפט רשאי להשעות זכותו של בעל מניה לפירעון חובו מאת החברה עד לאחר שהחברה פרעה במלואן את כל התחייבויותיה כלפי נושים אחרים של החברה, אם מצא כי התקיימו התנאים לייחוס חוב של החברה לבעל המניה כאמור בסעיף קטן (א)."},{"t":"p","x":"זו ״הרמת מסך רכה״, המכונה גם <b>נחיתות</b>. בעל המניות ״מימן״ את החברה בהלוואות במקום בהון, ובחדלות פירעון הוא מבקש להיפרע יחד עם שאר הנושים. אם התקיימו תנאי ס' 6(א), בית המשפט רשאי לדחוק אותו לסוף התור, אחרי כל הנושים האחרים."},{"t":"case","name":"ע\"א 4263/04 קיבוץ משמר העמק נ' עו\"ד טומי מנור, מפרק אפרוחי הצפון בע\"מ","x":"הרמת מסך או דחיית חוב בעלים אינן נעשות כדרך שגרה, אלא רק במצבים חריגים ומטעמים מיוחדים. דעת הרוב קבעה שמימון דק כשלעצמו עשוי להצדיק דחיית חוב בעלים (נחיתות). פסק הדין עסק בעיקר בנוסח הקודם של ס' 6, לפני שתיקון 2005 קבע בו עילות סגורות."},{"t":"h","x":"ס' 7: צו הגבלה"},{"t":"law","law":"חוק החברות","sec":"7(א)","x":"הורה בית משפט כי יש ליחס חובות של חברה לבעל מניה בה, לפי הוראות סעיף 6(א), רשאי הוא להורות, כי במשך תקופה שיקבע ושלא תעלה על חמש שנים (בסעיף זה – תקופת ההגבלה), לא יוכל אותו בעל מניה להיות דירקטור או מנהל כללי של חברה או להיות מעורב, במישרין או בעקיפין, בייסוד חברה או בניהולה"},{"t":"p","x":"מי שמפר צו הגבלה חב בחובות החברה שלגביה הופר הצו, שנוצרו בתקופת ההגבלה (ס' 7(ג)). שימו לב: הצו אפשרי רק אחרי <b>ייחוס חוב לפי ס' 6(א)</b>, ולא אחרי ייחוס תכונה לפי ס' 6(ב)."},{"t":"table","head":["הכלי","מה בית המשפט עושה","תנאי"],"rows":[["ס' 6(א)","מייחס חוב של החברה לבעל מניה","הונאה או קיפוח נושה; או פגיעה בתכלית + סיכון בלתי סביר; מודעות; צודק ונכון; מקרה חריג"],["ס' 6(ב)","מייחס תכונה, זכות או חובה של בעל מניה לחברה, או זכות של החברה לבעל מניה","צודק ונכון בהתחשב בכוונת הדין או ההסכם"],["ס' 6(ג)","משעה את חובו של בעל המניה עד שיפרעו כל הנושים האחרים","התקיימו התנאים של ס' 6(א)"],["ס' 7","צו הגבלה: איסור לכהן כדירקטור או מנכ״ל או להיות מעורב בייסוד ובניהול חברה","ניתן ייחוס חוב לפי ס' 6(א); עד חמש שנים"]]},{"t":"h","x":"מה אינו עילה להרמת מסך"},{"t":"list","x":["<b>הפסדים, גם ממושכים</b>. כישלון עסקי בתום לב הוא בדיוק הסיכון שהאחריות המוגבלת נועדה להגן עליו.","<b>חדלות פירעון כשלעצמה</b>. ״החברה לא יכולה לשלם״ אינו עילה בלי שימוש לרעה.","<b>חברת יחיד או שליטה מלאה</b>. ס' 3 מתיר זאת במפורש.","<b>בעל המניות הוא גם הדירקטור או המנכ״ל</b>. זה מצב מקובל, לא שימוש לרעה.","<b>רשלנות בלבד</b> של בעל המניה, בלי מודעות (ס' 6(א)(2))."]},{"t":"trap","x":"שאלה אמריקאית חוזרת: ״מה מהבאים <b>אינו</b> סיבה תקפה להרמת מסך?״ התשובה הנכונה היא כמעט תמיד ״החברה הפסידה כסף במשך שנים״. הונאה, קיפוח נושה, עקיפת הוראות דין (ס' 6(ב)) והון בלתי מספיק ביחס לסיכון (ס' 6(א)(1)(ב)) הם עילות מוכרות."},{"t":"trap","x":"<b>אל תבלבלו בין הרמת מסך לאחריות אישית של נושא משרה.</b> הרמת מסך מייחסת לבעל <b>מניה</b> חוב של החברה. מנהל שהטעה ספק נתבע אישית בגלל מעשיו שלו (ס' 54(א), דיני הנזיקין), בלי צורך להרים מסך. אם אותו אדם הוא גם בעל המניות, דונו בשני המסלולים בנפרד."},{"t":"h","x":"הליך: איפה ואיך"},{"t":"p","x":"ס' 6(ד) מגדיר ״בית המשפט״ לעניין ס' 6 ו-7 כ״בית המשפט שלו הסמכות לדון בתובענה״. מכאן שאין צורך לפנות דווקא לבית המשפט המחוזי. בקשה להרמת מסך מוגשת לבית המשפט שמוסמך לדון בתביעה עצמה, לפי סכום התביעה ועניינה, ויכולה להיות חלק מתביעת החוב: הנושה תובע את החברה ואת בעל המניה יחד. היא עולה לעיתים קרובות גם בהליכי חדלות פירעון. נטל ההוכחה על מי שמבקש להרים את המסך."},{"t":"exam","x":"בשאלה פתוחה, למשל ״ספק לא קיבל תשלום ומבקש לגבות מבעל השליטה״, בנו את התשובה כך: (1) הכלל: אישיות נפרדת ואחריות מוגבלת (ס' 4, 35). (2) מסלולים אחרים: ערבות, הון שלא נפרע, אחריות אישית (ס' 54). (3) ס' 6(א): זהו את העילה, (א) או (ב), לפי העובדות (משיכות כספים, הברחת נכסים, הון דק); הראו מודעות או עצימת עיניים (ס' 6(א)(2)); התייחסו לשיקולים: אחזקות, ס' 192–193, יכולת פירעון. (4) שיקול דעת: ״צודק ונכון״, מקרה חריג. (5) סעדים נלווים: ס' 6(ג) וס' 7. הבודק מחפש ציטוט מדויק של שתי העילות ושל דרישת המודעות."}],"mcq":[{"id":"u3-1","q":"מה מהבאים אינו סיבה תקפה להרמת מסך לפי הדין?","o":["החברה חוותה הפסדים כספיים במשך חמש שנים רצופות.","החברה שימשה מכשיר לביצוע הונאה.","החברה פעלה באופן עקבי עם הון בלתי מספיק ביחס לסיכונים, ובעל המניות היה מודע לכך.","החברה הוקמה בעיקר כדי לעקוף התחייבות או הוראת דין החלה על בעל המניות.","כל הסיבות בתשובות א–ד תקפות."],"a":0,"why":"הפסדים לבדם אינם שימוש לרעה במסך. ס' 6(א) דורש הונאה או קיפוח נושה, או פגיעה בתכלית תוך נטילת סיכון בלתי סביר, ובנוסף מודעות של בעל המניה.","w":["","הונאה היא העילה של ס' 6(א)(1)(א).","מימון דק עם מודעות מתאים לעילה של ס' 6(א)(1)(ב).","עקיפת דין או הסכם מטופלת בייחוס תכונה, זכות או חובה לפי ס' 6(ב).","ההפסדים לבדם (אחת התשובות) אינם עילה, ולכן לא כל הסיבות תקפות."],"secs":["6"]},{"id":"u3-2","q":"דוד, בעל 80% ממניות ״דוד הובלות בע״מ״, שמע מרואה החשבון שהחברה לוקחת הלוואות שהיא כנראה לא תוכל להחזיר. דוד החליט ״לא להיכנס לזה״ ולא בירר את המצב. לגבי דרישת המודעות בס' 6, מה נכון?","o":["דוד אינו מודע, כי לא ידע בפועל על הסיכון.","דרישת המודעות חלה רק בעילת ההונאה.","די ברשלנות של דוד כדי לקיים את דרישת המודעות.","דרישת המודעות חלה רק על דירקטורים.","דוד ייחשב מודע, כי חשד ונמנע מלברר."],"a":4,"why":"ס' 6(א)(2): אדם ייחשב מודע ״גם אם חשד … אך נמנע מלבררן, למעט אם נהג ברשלנות בלבד״. זו עצימת עיניים.","w":["החוק משווה עצימת עיניים למודעות בפועל.","דרישת המודעות חלה על שתי העילות, (א) ו-(ב).","רשלנות בלבד מוחרגת במפורש.","הסעיף עוסק בבעל מניה, לא בדירקטור.",""],"secs":["6"]},{"id":"u3-3","q":"״מעוף בע״מ״ פועלת בענף מסוכן עם הון מניות של 1,000 ₪, וכל מימונה מהלוואות בעלים. בעלי המניות מודעים לכך שהחברה לא תוכל לעמוד בהתחייבויות סבירות. באיזו עילה הנושים יוכלו להיעזר בעיקר?","o":["ס' 6(א)(1)(ב) – שימוש באופן הפוגע בתכלית החברה ותוך נטילת סיכון בלתי סביר לגבי יכולתה לפרוע את חובותיה.","ס' 4 – מעצם היותה אישיות משפטית.","ס' 7 – צו הגבלה, כעילה עצמאית לייחוס חוב.","אין עילה, כי מימון בהלוואות בעלים מותר.","ס' 6(ב) – ייחוס תכונה של בעל מניה לחברה."],"a":0,"why":"מימון דק (Thin Capitalization) מתאים לעילה השנייה בס' 6(א)(1)(ב): פגיעה בתכלית החברה ונטילת סיכון בלתי סביר, יחד עם מודעות של בעלי המניות.","w":["","ס' 4 קובע את הכלל, ולא את החריג.","צו הגבלה ניתן רק אחרי ייחוס חוב לפי ס' 6(א). הוא אינו עילה.","מימון בהלוואות מותר כשלעצמו, אך מימון דק תוך נטילת סיכון בלתי סביר ומודעות עשוי לבסס עילה.","ס' 6(ב) עוסק בייחוס תכונה או חובה לצורך דין או הסכם, לא בגביית חוב."],"secs":["6"]},{"id":"u3-4","q":"בעל השליטה בחברה בחדלות פירעון הלווה לה 2 מיליון ₪, ומבקש להיפרע יחד עם שאר הנושים. בית המשפט מצא שהתקיימו התנאים לייחוס חוב לפי ס' 6(א). מה בית המשפט רשאי לעשות לגבי ההלוואה?","o":["להמיר את ההלוואה למניות בכפייה.","להורות שההלוואה תיפרע ראשונה, לפני נושים אחרים.","לבטל את ההלוואה ולהעביר את הסכום לקופת המדינה.","אין לו סמכות לגבי ההלוואה.","להשעות את זכותו להיפרע עד לאחר שהחברה תפרע במלואן את התחייבויותיה לנושים האחרים."],"a":4,"why":"ס' 6(ג) מסמיך להשעות את זכות בעל המניה לפירעון חובו ״עד לאחר שהחברה פרעה במלואן את כל התחייבויותיה כלפי נושים אחרים״, אם התקיימו תנאי ס' 6(א).","w":["אין בס' 6 סמכות כזו.","זה ההפך מתכלית ס' 6(ג).","אין בס' 6 סמכות כזו.","ס' 6(ג) מקנה סמכות מפורשת.",""],"secs":["6"]},{"id":"u3-5","q":"לאחר שבית המשפט ייחס חוב של חברה לבעל מניה לפי ס' 6(א), הוא שוקל צו הגבלה. מה התקופה המרבית?","o":["חמש שנים.","ללא הגבלה.","עשר שנים.","שבע שנים.","שלוש שנים."],"a":0,"why":"ס' 7(א): תקופת ההגבלה ״לא תעלה על חמש שנים״.","w":["","הסעיף קובע תקרה מפורשת.","אין בסיס לכך.","אין בסיס לכך.","שלוש שנים היא תקופה מוכרת מהקשרים אחרים (כהונת דירקטור חיצוני, ס' 245; 121(ג)), לא מצו הגבלה."],"secs":["7"]},{"id":"u3-6","q":"ספק תובע מחברה חוב של 400,000 ₪ ומבקש באותה תביעה להרים את המסך ולחייב את בעל המניות. לאיזה בית משפט עליו לפנות?","o":["רק לבית המשפט המחוזי, שהוא בית המשפט לעניין חוק החברות.","רק לרשם החברות.","לבית המשפט שלו הסמכות לדון בתובענה.","רק לבית הדין לעבודה.","רק לבית המשפט העליון."],"a":2,"why":"ס' 6(ד): לעניין ס' 6 ו-7, ״בית המשפט״ הוא ״בית המשפט שלו הסמכות לדון בתובענה״.","w":["ס' 6(ד) קובע הגדרה מיוחדת שגוברת על הכלל.","הרשם אינו מוסמך להרים מסך.","","אין בסיס לכך.","אין בסיס לכך."],"secs":["6"]},{"id":"u3-7","q":"שרה מכרה את סטודיו הצילום שלה והתחייבה שלא להתחרות בקונה. לאחר מכן הקימה חברה שבבעלותה המלאה, שפתחה סטודיו מתחרה. באיזה כלי בית המשפט יכול להשתמש, לכאורה, כדי לאכוף את ההתחייבות?","o":["ס' 6(ב) – ייחוס חובה של בעל מניה (שרה) לחברה, בהתחשב בכוונת ההסכם.","ס' 6(ג) – השעיית חוב.","ס' 6(א) – ייחוס חוב של החברה לשרה.","ס' 7 – צו הגבלה.","אין כלי, כי החברה אינה צד להסכם."],"a":0,"why":"ס' 6(ב) מאפשר לייחס ״תכונה, זכות או חובה של בעל מניה לחברה״, אם צודק ונכון בהתחשב ״בכוונת … ההסכם״. כאן ההסכם נועד למנוע תחרות של שרה, גם דרך חברה.","w":["","אין כאן חוב של בעל מניה לחברה.","כאן לא מבקשים לגבות חוב של החברה משרה, אלא להחיל על החברה את חובתה של שרה.","צו הגבלה מותנה בייחוס חוב לפי ס' 6(א).","בדיוק לשם כך נועד ס' 6(ב)."],"secs":["6"]},{"id":"u3-8","q":"התקיימו לכאורה כל רכיבי עילת ההונאה בס' 6(א). מה נכון?","o":["בית המשפט רשאי להרים את המסך אם מצא שבנסיבות העניין צודק ונכון לעשות כן, ובמקרים החריגים.","בית המשפט חייב להרים את המסך.","המסך מורם אוטומטית ללא החלטה שיפוטית.","בית המשפט רשאי להרים את המסך רק כלפי דירקטורים.","בית המשפט חייב לייחס את כל חובות החברה לכל בעלי המניות."],"a":0,"why":"לשון ס' 6(א)(1): ״בית משפט רשאי … אם מצא כי בנסיבות הענין צודק ונכון לעשות כן, במקרים החריגים״. זו סמכות שבשיקול דעת, ובית המשפט שוקל גם את אחזקות בעל המניה ואת מילוי חובותיו לפי ס' 192–193.","w":["","הלשון היא ״רשאי״, לא ״חייב״.","נדרשת החלטה של בית משפט.","הסעיף עוסק בבעל מניה.","ייחוס החוב פרטני: לבעל מניה מסוים ולחוב מסוים, בהתחשב באחזקותיו ובמודעותו."],"secs":["6"]},{"id":"u3-9","q":"איזו טענה של נושה, כשלעצמה, אינה מספיקה להרמת המסך מעל בעל מניות יחיד?","o":["בעל המניות ערבב בין נכסיו לנכסי החברה כך שאי אפשר להבחין ביניהם, כדי להתחמק מנושים.","בעל המניות העביר את נכסי החברה בלי תמורה לחברה אחרת שלו, כדי שהנושה לא יוכל לגבות.","בעל המניות משך כספים מחשבון החברה לצרכיו הפרטיים, בידיעה שהחברה לא תוכל לשלם לספקים.","בעל המניות הקים את החברה כדי להתחמק מהתחייבות חוזית אישית שלו.","בעל המניות הוא הדירקטור היחיד והמנכ״ל של החברה."],"a":4,"why":"ריכוז כל התפקידים בידי אדם אחד מותר (ס' 3) ואינו שימוש לרעה במסך. שאר האפשרויות מתארות הונאה או קיפוח נושה (ס' 6(א)(1)(א)), או התחמקות מחובה (ס' 6(ב)).","w":["עירוב נכסים כדי להתחמק מנושים הוא עילה.","הברחת נכסים לקיפוח נושה היא עילה לפי ס' 6(א)(1)(א).","משיכת כספים ביודעין, תוך קיפוח נושים, היא עילה.","התחמקות מהתחייבות אישית באמצעות חברה מטופלת בס' 6(ב).",""],"secs":["6","3"]},{"id":"u3-10","q":"לפי ס' 6(א), מה שוקל בית המשפט, בין היתר, כשהוא מחליט אם לייחס חוב לבעל מניה?","o":["את אחזקותיו, את מילוי חובותיו כלפי החברה לפי ס' 192 ו-193, ואת יכולת החברה לפרוע את חובותיה.","את שכרו של בעל המניה בחברה.","את גובה הערך הנקוב של מניות החברה בלבד.","את מספר הדירקטורים בחברה.","רק אם החברה ציבורית או פרטית."],"a":0,"why":"הסיפא של ס' 6(א)(1): ״ובשים לב לאחזקותיו ולמילוי חובותיו כלפי החברה לפי סעיפים 192 ו־193 ובשים לב ליכולת החברה לפרוע את חובותיה״.","w":["","אינו שיקול שנזכר בסעיף.","הערך הנקוב אינו שיקול שנזכר בס' 6.","אינו שיקול שנזכר בסעיף.","ס' 6 חל על כל חברה."],"secs":["6","192","193"]},{"id":"u3-11","q":"מנכ״ל ״אלון סחר בע״מ״, שאינו בעל מניות, הציג לספק מצג כוזב על מצבה הכספי של החברה, והספק נפגע. מה הדרך הנכונה לחייב את המנכ״ל אישית?","o":["אי אפשר לחייב אותו, כי פעל בשם החברה.","תביעה אישית בשל מעשיו, שכן ייחוס הפעולה לחברה אינו גורע מאחריותו האישית (ס' 54(א)).","השעיית חוב לפי ס' 6(ג).","צו הגבלה לפי ס' 7 בלבד.","הרמת מסך לפי ס' 6(א)."],"a":1,"why":"המנכ״ל אינו בעל מניה, ולכן ס' 6 אינו רלוונטי. אחריותו האישית נובעת ממעשיו (נזיקין, מצג שווא), וס' 54(א) קובע שייחוס הפעולה לחברה אינו גורע מאחריותו האישית.","w":["ס' 54(א) קובע את ההפך.","","ס' 6(ג) עוסק בחוב של בעל מניה לחברה.","צו הגבלה מותנה בייחוס חוב לפי ס' 6(א).","ס' 6 מייחס חוב לבעל מניה בלבד."],"secs":["6","54"]},{"id":"u3-12","q":"מה מהבאים מבטא נכון את עקרון ״המסך״ שהתבסס במשפט האנגלי בסוף המאה ה-19?","o":["נושי החברה רשאים תמיד לגבות מבעלי המניות את מה שלא נפרע מהחברה.","האחריות המוגבלת חלה רק על חברות ציבוריות.","חברה שהתאגדה כדין היא ישות נפרדת מבעליה, גם כשאדם אחד שולט בה כמעט לחלוטין, ונושיה אינם יכולים לגבות ממנו את חובותיה.","המסך חל רק על חברות שאין בהן בעל שליטה.","חברה שבעליה שולט בה לבדו אינה ישות נפרדת."],"a":2,"why":"זה לב העיקרון, והוא מעוגן היום בס' 4 (אישיות נפרדת), בס' 3 (חברת אדם אחד) ובס' 35 (הגבלת אחריות).","w":["זה הפוך מהעיקרון. רק במקרים חריגים אפשר להרים מסך (ס' 6).","הגבלת האחריות אינה תלויה בסיווג החברה (ס' 35).","","המסך חל גם בחברה שיש בה בעל שליטה.","ס' 3 מתיר חברת יחיד, וס' 4 מעניק לה אישיות נפרדת."],"secs":["3","4","35"]}],"cases":[{"id":"u3-c1","title":"בונים בשקט בע״מ","facts":"״בונים בשקט בע״מ״ היא חברה פרטית העוסקת בשיפוצים. רמי מחזיק 90% ממניותיה ומכהן כדירקטור יחיד וכמנכ״ל. אחיו שאול מחזיק 10%, ואינו מעורב בניהול. הון המניות שנפרע הוא 100 ₪, וכל מימון החברה מגיע מהלוואות שרמי העמיד לה (1.5 מיליון ₪). בשנה האחרונה התחייבה החברה בפרויקטים בהיקף 8 מיליון ₪, אף שרואה החשבון התריע בפני רמי שהתזרים אינו מאפשר לעמוד בהם. במקביל העביר רמי ציוד בשווי 600,000 ₪ לחברה חדשה שהקים, ״בונים בשקט 2 בע״מ״, בלי תמורה. כעת החברה בחדלות פירעון. הספק ״בלוקים בע״מ״ חייב לו 900,000 ₪. רמי הגיש תביעת חוב על ההלוואות שהעמיד. שאול טוען שאין לו קשר לדבר.","parts":[{"q":"האם הספק יוכל לגבות את החוב מרמי ומשאול? דונו בעילות ובשיקולים. נמקו והפנו לסעיפי החוק.","pts":25,"model":["1. הכלל: החברה היא אישיות נפרדת (ס' 4), ואחריות בעלי המניות מוגבלת (ס' 35). ייחוס חוב לבעל מניה אפשרי רק לפי ס' 6(א), במקרים חריגים.","2. עילה (א), קיפוח נושה: העברת ציוד בשווי 600,000 ₪ בלי תמורה לחברה אחרת של רמי, כשהחברה קורסת, היא שימוש באישיות הנפרדת כדי לקפח נושים (ס' 6(א)(1)(א)).","3. עילה (ב), מימון דק: הון נפרע של 100 ₪, מימון מלא בהלוואות בעלים והתחייבויות של 8 מיליון ₪ בניגוד להתראת רואה החשבון. זו פגיעה בתכלית החברה ונטילת סיכון בלתי סביר לגבי יכולתה לפרוע חובות (ס' 6(א)(1)(ב)).","4. מודעות רמי: הוא ביצע בעצמו את ההעברה, והתריעו בפניו על התזרים. לכן הוא מודע, ולכל הפחות עצם עיניים (ס' 6(א)(2)).","5. שיקולים: רמי מחזיק 90%, שולט ומנהל, הפר את חובת תום הלב ואיסור הקיפוח (ס' 192) ואת חובת ההגינות כבעל שליטה (ס' 193), והחברה אינה יכולה לפרוע. כל אלה תומכים בייחוס החוב לרמי. ״צודק ונכון״ במקרה חריג.","6. שאול: מחזיק 10% ואינו מעורב. לא הוכחה מודעות או חשד שבחר לא לברר. לכל היותר מדובר ברשלנות, ו״רשלנות בלבד״ אינה מספיקה (ס' 6(א)(2)). ככל הנראה לא ייוחס לו החוב.","7. מסקנה: בית המשפט רשאי לייחס לרמי את החוב לספק, כולו או חלקו, אך לא לשאול. בנוסף ייתכן מסלול נפרד נגד רמי כדירקטור ומנכ״ל בשל הפרת חובותיו (ס' 54(א)), וכן תקיפת ההעברה לחברה החדשה במסגרת הליכי חדלות הפירעון."],"check":["כלל האישיות הנפרדת והאחריות המוגבלת (ס' 4, 35)","עילה (א) – הברחת ציוד, קיפוח נושה","עילה (ב) – מימון דק וסיכון בלתי סביר","מודעות ועצימת עיניים (ס' 6(א)(2))","שיקולים: אחזקות, ס' 192–193, יכולת פירעון","הבחנה בין רמי לשאול – רשלנות בלבד אינה מספיקה","שיקול דעת ״צודק ונכון״"]},{"q":"מה דינה של תביעת החוב של רמי על ההלוואות, ואילו סעדים נוספים עומדים לנושים?","pts":10,"model":["1. אם התקיימו תנאי ס' 6(א), בית המשפט רשאי להשעות את זכות רמי להיפרע על ההלוואות עד שהחברה תפרע במלואן את התחייבויותיה לנושים האחרים (ס' 6(ג)).","2. ההצדקה: רמי בחר לממן את החברה בהלוואות במקום בהון, ואסור לו להתחרות בנושים החיצוניים על נכסי החברה.","3. לאחר ייחוס החוב לפי ס' 6(א) רשאי בית המשפט גם להוציא נגד רמי צו הגבלה לתקופה של עד חמש שנים, שיאסור עליו לכהן כדירקטור או מנכ״ל ולהיות מעורב בייסוד חברה או בניהולה (ס' 7(א)). אם יפר את הצו, יחוב בחובות החברה שנוצרו בתקופת ההגבלה (ס' 7(ג)).","4. הבקשות יוגשו לבית המשפט שמוסמך לדון בתובענה, או במסגרת הליך חדלות הפירעון (ס' 6(ד))."],"check":["השעיית חוב – ס' 6(ג)","צו הגבלה עד 5 שנים – ס' 7","ערכאה – ס' 6(ד)"]}]}]},{"id":"u4","title":"האורגנים: אסיפה, דירקטוריון, מנכ״ל","short":"האורגנים בחברה","blurb":"תוכלו לזהות את אורגני החברה ואת סמכויותיהם, להכריע מי מוסמך להחליט בכל עניין (כולל סמכות שיורית, נבצרות ונטילת סמכויות), ולהחיל את כללי ההצבעה, הפרדת יו״ר ומנכ״ל והדירקטורים החיצוניים בחברה ציבורית.","secs":["46","47","49","50","51","52","53","54","57","60","82","84","85","92","95","107","120","121","239","245","115","118א","55","56","66","67","78","79","146","154","158","160"],"blocks":[{"t":"h","x":"תורת האורגנים: איך חברה ״פועלת״?"},{"t":"p","x":"לחברה אין ידיים ואין ראש. היא פועלת דרך בני אדם. <b>תורת האורגנים</b> קובעת שפעולות ומחשבות של גופים ובעלי תפקיד מסוימים הן <b>פעולות ומחשבות של החברה עצמה</b>, ולא רק פעולות של שלוחים מטעמה. שימו לב: האורגן הוא <b>האסיפה</b> כגוף ו<b>הדירקטוריון</b> כגוף, ולא בעל מניה בודד או דירקטור בודד. המנכ״ל הוא אורגן מכוח תפקידו. ״סעיף הסל״ מכניס גם אחרים, למשל סמנכ״ל שהוסמך לחתום על חוזים, כשבתחום הזה רואים בפעולתו את פעולת החברה."},{"t":"law","law":"חוק החברות","sec":"46","x":"האורגנים של החברה הם האסיפה הכללית, הדירקטוריון, המנהל הכללי וכל מי שעל פי דין, או מכוח התקנון רואים את פעולתו בענין פלוני כפעולת החברה לאותו ענין."},{"t":"law","law":"חוק החברות","sec":"47","x":"פעולותיו של אורגן וכוונותיו הן פעולותיה של החברה וכוונותיה."},{"t":"list","x":["<b>אחריות אזרחית:</b> ״חברה חבה במישרין באחריות בנזיקין על עוולה שבוצעה בידי אורגן שלה״ (ס' 53(א)), ואחריותה השילוחית לעובדים נשמרת (ס' 53(ב)).","<b>אחריות פלילית:</b> אפשר להעמיד חברה לדין ולהטיל עליה קנס. אחריות החברה היא <b>אישית</b> ולא שילוחית: מעשיו ומחשבתו הפלילית של האורגן הם מעשי החברה ומחשבתה.","<b>אחריות אישית נשמרת:</b> ״אין בייחוס פעולה או כוונה של אורגן, לחברה, כדי לגרוע מהאחריות האישית שיחידי האורגן היו נושאים בה אילולא אותו ייחוס״ (ס' 54(א))."]},{"t":"case","name":"ע\"פ 3027/90 חברת מודיעים בינוי ופיתוח בע\"מ נ' מדינת ישראל","x":"תאגיד נושא באחריות פלילית אישית, ולא שילוחית, דרך תורת האורגנים. האורגן מזוהה לפי מבחן משולב, היררכי ופונקציונלי, ותורת האורגנים תוחל בפלילים כשהדבר מתיישב עם תכליות דיני העונשין, ובראשן הרתעה."},{"t":"case","name":"ע\"א 407/89 צוק אור בע\"מ נ' קאר סקיוריטי בע\"מ","x":"מעשה של אורגן מיוחס לחברה, אבל האורגן אינו ״נבלע״ בה. כשהוא עצמו מקיים את יסודות העוולה, הוא עשוי לשאת באחריות אישית לצד החברה. היום הכלל מעוגן בס' 47, 53 ו-54(א)."},{"t":"p","x":"<b>אחריות פלילית של חברה, בפירוט.</b> חברה אינה יכולה לשבת בכלא, אבל אפשר להרשיע אותה ולהטיל עליה קנס, פיצוי לנפגע, או צווים (למשל צו הריסה של מבנה שנבנה שלא כדין). הרשעה היא ״כתם״: היא פוגעת במוניטין ועלולה לפסול את החברה ממכרזים ציבוריים. בפלילים מבחינים בין שני סוגי עבירות: (1) <b>עבירות של אחריות קפידה</b> (עבירות קלות, ללא דרישה למחשבה פלילית). די בכך שעובד ביצע אותן במסגרת תפקידו כדי שגם החברה תואשם. (2) <b>עבירות שדורשות מחשבה פלילית</b>. כאן מעמידים לדין את החברה רק אם מבצע העבירה הוא אורגן, כלומר מי שבשל תפקידו וסמכויותיו אפשר לראות במחשבתו את מחשבת החברה. בנוסף, גם האורגן עצמו נושא באחריות אישית (ס' 54(א))."},{"t":"law","law":"חוק החברות","sec":"56(א)","x":"פעולה שנעשתה עבור חברה בחריגה ממטרות החברה, או שנעשתה בלא הרשאה או בחריגה מן ההרשאה, אין לה תוקף כלפי החברה, אלא אם כן אישרה החברה את הפעולה … או אם הצד שכלפיו נעשתה הפעולה לא ידע ולא היה עליו לדעת על החריגה או על העדר ההרשאה."},{"t":"p","x":"כלומר, <b>חריגה מסמכות</b> אינה פוטרת את החברה כלפי צד שלישי בתום לב. החברה תוכל להתנער מהפעולה רק אם תוכיח שהצד השלישי ידע, או היה עליו לדעת, על החריגה. החברה גם רשאית לאשר את הפעולה בדיעבד: את החריגה מההרשאה מאשר האורגן שמוסמך לתת אותה, ואת החריגה מהמטרות – האסיפה הכללית ברוב הדרוש לשינוי מטרות (ס' 56(ב)). לפני שהפעולה בוצעה, החברה, בעל מניה או נושה שעלול להיפגע רשאים לבקש מבית המשפט צו שימנע אותה (ס' 55(ב))."},{"t":"example","title":"דוגמה: מנהל רכש שחרג מהסמכות","x":"סמנכ״ל הרכש של ״אלמוג בע״מ״ הוסמך לחתום על הזמנות עד 100,000 ₪. הוא חתם על חוזה של 2 מיליון ₪ עם ספק. הספק לא ידע על המגבלה, והחוזה נראה רגיל לחלוטין. <b>פתרון:</b> פעולה בחריגה מההרשאה אין לה תוקף כלפי החברה, <b>אלא אם</b> הצד השני לא ידע ולא היה עליו לדעת על החריגה (ס' 56(א)). כאן הספק בתום לב, ולכן החוזה מחייב את החברה. החברה יכולה לתבוע את הסמנכ״ל על הנזק (ס' 54(א), 252)."},{"t":"h","x":"מי מחליט על מה? מפת הסמכויות"},{"t":"table","head":["האורגן","סמכויות עיקריות","סעיפים"],"rows":[["האסיפה הכללית","שינוי תקנון; מינוי רואה חשבון מבקר; מינוי דירקטורים חיצוניים; אישור עסקאות עם בעלי עניין כשנדרש; הגדלת וביטול הון רשום; מיזוג; פירוק; הפעלת סמכויות הדירקטוריון בנבצרות; מינוי דירקטורים באסיפה השנתית, אלא אם נקבע אחרת בתקנון","57, 58, 59"],["הדירקטוריון","התוויית מדיניות ופיקוח על המנכ״ל; תכניות פעולה ומסגרת אשראי; דוחות כספיים; מינוי ופיטורי המנכ״ל; הקצאת מניות עד גבול ההון הרשום; החלטה על חלוקה (דיבידנד); סמכות שיורית","92, 49, 250, 288"],["המנכ״ל","ניהול שוטף במסגרת המדיניות שקבע הדירקטוריון; כל סמכויות הניהול והביצוע שלא הוקנו לאורגן אחר","120, 121(א)"]]},{"t":"p","x":"אי אפשר להתנות על סמכויות האסיפה שבס' 57 (ס' 58(א)), אבל מותר להוסיף לה סמכויות בתקנון (ס' 58(ב)). שימו לב: <b>חלוקת דיבידנד</b> ו<b>מינוי המנכ״ל</b> הם סמכויות של הדירקטוריון (ס' 92(א)(10), 250), ולא של האסיפה."},{"t":"law","law":"חוק החברות","sec":"49","x":"סמכות של החברה שלא הוקנתה בחוק או בתקנון לאורגן אחר, רשאי הדירקטוריון להפעילה."},{"t":"law","law":"חוק החברות","sec":"121(א)","x":"למנהל הכללי יהיו כל סמכויות הניהול והביצוע שלא הוקנו בחוק זה או בתקנון לאורגן אחר של החברה, והוא יהיה נתון לפיקוחו של הדירקטוריון."},{"t":"trap","x":"<b>שתי ״סמכויות שיוריות״.</b> הסמכות השיורית ה<b>כללית</b> של החברה שייכת לדירקטוריון (ס' 49). למנכ״ל יש סמכות שיורית <b>רק בתחום הניהול והביצוע</b> (ס' 121(א)), והוא כפוף לפיקוח הדירקטוריון. בשאלה ״מי מוסמך כשהחוק והתקנון שותקים?״ התשובה היא בדרך כלל הדירקטוריון. אם מדובר בפעולה ניהולית שוטפת, היא בסמכות המנכ״ל."},{"t":"h","x":"האסיפה הכללית: כינוס והצבעה"},{"t":"p","x":"<b>אסיפה שנתית</b> מתקיימת בכל שנה, ולא יאוחר מתום 15 חודשים מהאסיפה השנתית הקודמת (ס' 60(א)). על סדר יומה דיון בדוחות הכספיים ובדיווח הדירקטוריון (ס' 60(ב)). חברה פרטית רשאית לקבוע בתקנון שלא תקיים אסיפה שנתית, אלא לצורך מינוי רואה חשבון או לפי דרישה (ס' 61). כל אסיפה אחרת היא <b>אסיפה מיוחדת</b>. בחברה ציבורית הדירקטוריון חייב לכנס אסיפה מיוחדת לדרישת שני דירקטורים או רבע מהדירקטורים, או לדרישת בעלי 5% מההון ו-1% מזכויות ההצבעה, או 5% מזכויות ההצבעה. בחברה פרטית הספים הם דירקטור אחד, או 10% מההון ו-1% מזכויות ההצבעה, או 10% מזכויות ההצבעה (ס' 63)."},{"t":"law","law":"חוק החברות","sec":"82(ג)","x":"לא קבעה החברה בתקנונה זכויות הצבעה שונות, יהיה לכל מניה קול אחד."},{"t":"law","law":"חוק החברות","sec":"84","x":"החלטה באסיפה הכללית תתקבל בהצבעה במנין קולות; חברה פרטית רשאית לקבוע בתקנונה כלל הכרעה שונה."},{"t":"p","x":"״מניין קולות״ פירושו מניין קולות <b>המצביעים</b> לפי זכויות ההצבעה של מניותיהם (הגדרה בס' 1), ולא מניין ראשים. החלטות האסיפה מתקבלות ב<b>רוב רגיל</b>, אלא אם נקבע רוב אחר בחוק או בתקנון (ס' 85)."},{"t":"law","law":"חוק החברות","sec":"78","x":"המנין החוקי לקיום אסיפה כללית הוא נוכחות של לפחות שני בעלי מניות שלהם עשרים וחמישה אחוזים לפחות מזכויות ההצבעה, תוך מחצית השעה מן המועד שנקבע לפתיחת האסיפה. … לא נכח באסיפה כללית בתום מחצית השעה מהמועד שנקבע לתחילת האסיפה מנין חוקי, תידחה האסיפה לשבוע ימים, לאותו יום, לאותה שעה ולאותו מקום"},{"t":"list","x":["<b>הזמנה בחברה פרטית:</b> נמסרת לכל מי שזכאי להשתתף, לא פחות משבעה ימים ולא יותר מ-45 ימים לפני האסיפה, אלא אם נקבע אחרת בתקנון (ס' 67). ההזמנה מציינת מועד, מקום, סדר יום ופירוט סביר של הנושאים, ואם מוצע לשנות את התקנון – גם את נוסח השינוי (ס' 68). בחברה ציבורית ההודעה מתפרסמת כפי שקבע השר וכוללת את סדר היום, ההחלטות המוצעות והסדרי הצבעה בכתב (ס' 69).","<b>סדר היום:</b> הדירקטוריון קובע אותו. בעל 1% מזכויות ההצבעה רשאי לבקש להוסיף נושא (ס' 66(א)–(ב)). האסיפה מחליטה <b>רק</b> בנושאים שבסדר היום (ס' 66(ג)).","<b>מניין חוקי:</b> שני בעלי מניות לפחות, שמחזיקים יחד לפחות 25% מזכויות ההצבעה, בתוך חצי שעה מהמועד שנקבע (ס' 78(א)). אין מניין – האסיפה נדחית בשבוע (ס' 78(ב)).","<b>אסיפה נדחית:</b> אם גם בה אין מניין חוקי כעבור חצי שעה, היא מתקיימת <b>בכל מספר משתתפים</b> (ס' 79(א)). חריג: אסיפה שכונסה לדרישת בעלי מניות (ס' 63–64) מתקיימת רק אם נכחו בעלי מניות בשיעור הדרוש לדרישת כינוס (ס' 79(ב)).","<b>חופש התנאה:</b> את כללי הזמנה, מניין ודחייה אפשר לשנות בתקנון (ס' 81). כללי המניין אינם חלים על חברה שיש לה בעל מניה אחד (ס' 78(ג)).","<b>יו״ר האסיפה</b> נבחר בתחילת כל אסיפה (ס' 80(א)). חברה פרטית רשאית לקיים אסיפה באמצעי תקשורת, אלא אם התקנון שולל זאת (ס' 77)."]},{"t":"example","title":"דוגמה: אסיפה בלי מניין","x":"בחברה ציבורית, בתקנון אין הוראה על מניין. לאסיפה שנקבעה ליום שני ב-10:00 הגיעו עד 10:30 שלושה בעלי מניות שמחזיקים יחד 18% מזכויות ההצבעה. <b>פתרון:</b> אין מניין חוקי, כי נדרשים 25% (ס' 78(א)). האסיפה נדחית ליום שני הבא ב-10:00, באותו מקום (ס' 78(ב)). אם גם אז לא יהיה מניין בתוך חצי שעה, האסיפה תתקיים בכל מספר משתתפים (ס' 79(א)), אלא אם היא כונסה לדרישת בעלי מניות (ס' 79(ב))."},{"t":"example","title":"דוגמה: קולות מול דיבידנד","x":"בתקנון ״אלפא בע״מ״ ברירות המחדל של החוק. בני מחזיק 500 מניות בערך נקוב 10 ₪, וגדי מחזיק 1,000 מניות בערך נקוב 5 ₪. <b>הצבעה:</b> לכל מניה קול אחד (ס' 82(ג)), ולכן לגדי 1,000 קולות מתוך 1,500, כלומר שני שלישים, והוא בעל השליטה. <b>דיבידנד:</b> מחולק לפי הערך הנקוב (ס' 306(ב)). לכל אחד ערך נקוב כולל של 5,000 ₪, ולכן הדיבידנד מתחלק חצי-חצי. המחיר ששילמו אינו רלוונטי."},{"t":"h","x":"הדירקטוריון"},{"t":"p","x":"בחברה פרטית די בדירקטור אחד (ס' 219(ב)), ואין חובה למנות יו״ר (ס' 94(ב)). בחברה ציבורית חייבים לכהן לפחות שני דירקטורים חיצוניים (ס' 239(א)), והדירקטוריון בוחר יו״ר (ס' 94(א)). הדירקטוריון מתכנס לפחות פעם בשנה, ובחברה ציבורית לפחות פעם בשלושה חודשים (ס' 97). המניין החוקי הוא רוב חברי הדירקטוריון (ס' 104), ולכל דירקטור קול אחד (ס' 105). כל ברירות המחדל האלה כפופות לתקנון. דירקטור מפעיל שיקול דעת עצמאי ואסור לו להיות צד להסכם הצבעה (ס' 106(א)). אם היו״ר נעדר מהישיבה, הדירקטוריון בוחר אחד מחבריו לנהל אותה, אבל <b>אין לו קול נוסף</b>, אלא אם נקבע אחרת בתקנון (ס' 96(ב))."},{"t":"law","law":"חוק החברות","sec":"107","x":"החלטות בדירקטוריון יתקבלו ברוב רגיל; היו הקולות שקולים יהיה ליושב ראש הדירקטוריון קול נוסף, והכל אם לא נקבע אחרת בתקנון."},{"t":"h","x":"המנכ״ל"},{"t":"law","law":"חוק החברות","sec":"120","x":"המנהל הכללי אחראי לניהול השוטף של עניני החברה במסגרת המדיניות שקבע הדירקטוריון ובכפוף להנחיותיו."},{"t":"p","x":"בחברה ציבורית חובה למנות מנכ״ל. בחברה פרטית זו רשות, ואם לא מונה מנכ״ל, הדירקטוריון מנהל את החברה (ס' 119). את המנכ״ל ממנה ומפטר הדירקטוריון, אלא אם נקבע אחרת בתקנון (ס' 250). המנכ״ל חייב להודיע ליו״ר על כל עניין חריג שהוא מהותי לחברה (ס' 122(א)), והוא רשאי לאצול מסמכויותיו לכפופים לו באישור הדירקטוריון (ס' 121(ב))."},{"t":"h","x":"הפרדת יו״ר ומנכ״ל בחברה ציבורית"},{"t":"law","law":"חוק החברות","sec":"121(ג)","x":"על אף הוראות סעיף 95, רשאית האסיפה הכללית של חברה ציבורית להחליט, כי לתקופות שכל אחת מהן לא תעלה על שלוש שנים ממועד קבלת ההחלטה ניתן להסמיך את יושב ראש הדירקטוריון או קרובו למלא את תפקיד המנהל הכללי או להפעיל את סמכויותיו … ובלבד שיתקיים אחד מאלה: … במנין קולות הרוב באסיפה הכללית ייכללו לפחות רוב מקולות בעלי המניות שאינם בעלי השליטה בחברה וכן מי שאינם בעלי עניין אישי באישור ההחלטה המשתתפים בהצבעה; … סך קולות המתנגדים מקרב בעלי המניות האמורים בפסקה (1) לא עלה על שני אחוזים מכלל זכויות ההצבעה בחברה."},{"t":"steps","title":"איך מאשרים שיו״ר הדירקטוריון יכהן גם כמנכ״ל בחברה ציבורית","x":["נקודת המוצא: אסור. המנכ״ל או קרובו לא יכהנו כיו״ר, וליו״ר לא יוקנו סמכויות המנכ״ל (ס' 95(א)–(ב)). שלושת החודשים הראשונים מהפיכת החברה לציבורית הם חריג לס' 95(א) (ס' 95(ג)).","האורגן המוסמך לאשר חריגה: <b>האסיפה הכללית</b> (ס' 121(ג)), ולא הדירקטוריון.","רוב מיוחד: הרוב כולל לפחות רוב מקולות בעלי המניות שאינם בעלי שליטה ואינם בעלי עניין אישי, מבין המשתתפים בהצבעה, בלי לספור נמנעים; <b>או</b> שסך המתנגדים מקרבם אינו עולה על 2% מכלל זכויות ההצבעה (ס' 121(ג)(1)–(2)).","משך: כל החלטה לתקופה של עד <b>שלוש שנים</b> ממועד קבלתה. אפשר לחדש לתקופות נוספות, כל אחת עד שלוש שנים.","בעלי המניות מצביעים גם באמצעות כתב הצבעה (ס' 87(א)(3א))."]},{"t":"h","x":"דירקטורים חיצוניים וועדות"},{"t":"list","x":["<b>חובה:</b> בחברה ציבורית ובחברת איגרות חוב יכהנו לפחות שני דירקטורים חיצוניים (ס' 239(א)), ולפחות אחד מהם בעל מומחיות חשבונאית ופיננסית (ס' 219(ג)).","<b>מינוי:</b> באסיפה הכללית, ברוב מיוחד שכולל רוב מקרב מי שאינם בעלי שליטה או בעלי עניין אישי, או שהמתנגדים מקרבם אינם עולים על 2% (ס' 239(ב)).","<b>כהונה:</b> שלוש שנים, ואפשר למנותו לשתי תקופות נוספות של שלוש שנים כל אחת (ס' 245(א)).","<b>אי-זיקה:</b> אסור שתהיה לו זיקה לחברה, לבעל השליטה או לקרובו, בהווה או בשנתיים שקדמו למינוי (ס' 240(ב)).","<b>ועדת ביקורת</b> (חובה בציבורית, ס' 114): לפחות שלושה חברים; כל הדירקטורים החיצוניים חברים בה; רובם בלתי תלויים; היו״ר שלה דירקטור חיצוני. יו״ר הדירקטוריון, בעל השליטה וקרובו אינם חברים בה (ס' 115).","<b>ועדת תגמול</b> (ס' 118א): לפחות שלושה חברים; כל החיצוניים חברים בה והם רוב חבריה; היו״ר שלה דירקטור חיצוני. ועדת ביקורת שעומדת בתנאים האלה יכולה לשמש גם ועדת תגמול."]},{"t":"h","x":"רואה החשבון המבקר, המבקר הפנימי וממשל תאגידי"},{"t":"p","x":"<b>רואה החשבון המבקר</b> הוא גורם חיצוני שמבקר את הדוחות הכספיים השנתיים ומחווה עליהם דעה (ס' 154(א)). הוא ״העיניים״ של בעלי המניות: הם אינם מנהלים את החברה בעצמם, ולכן צריכים בודק אובייקטיבי. מכאן הכללים: <b>חובה</b> למנות רואה חשבון מבקר בכל חברה, פרטית וציבורית (ס' 154(א)); <b>האסיפה הכללית</b> ממנה אותו, קובעת את תנאי העסקתו ומפסיקה אותה (ס' 57(3)); הוא מתמנה בכל אסיפה שנתית עד תום האסיפה השנתית הבאה, ואם התקנון מתיר – לתקופה ארוכה יותר, עד תום האסיפה השנתית השלישית שלאחר המינוי (ס' 154(ב)). את רואה החשבון ה<b>ראשון</b> רשאי למנות הדירקטוריון, עד האסיפה השנתית הראשונה (ס' 155(א)). והוא חייב להיות <b>בלתי תלוי</b> בחברה, במישרין ובעקיפין (ס' 160(א))."},{"t":"law","law":"חוק החברות","sec":"158(א)","x":"חברה פרטית שמחזור עסקיה בשנה אינו עולה על 500,000 שקלים חדשים … רשאית לקבוע באסיפה כללית, כי לא יתמנה לה רואה חשבון מבקר, אלא אם כן בעלי מניות שלהם 10 אחוזים או יותר מההון המונפק של החברה התנגדו לכך"},{"t":"p","x":"זו ״<b>חברה לא פעילה</b>״. שימו לב לשלושה תנאים: חברה <b>פרטית</b> (ולא חברת איגרות חוב, ס' 158(ג)); מחזור שנתי עד 500,000 ₪ (הסכום צמוד למדד ומתעדכן כל שנה); והחלטת אסיפה שבעלי <b>10%</b> או יותר מההון המונפק לא התנגדו לה. החברה שולחת את ההחלטה לרשם בתוך 14 ימים (ס' 158(א1))."},{"t":"law","law":"חוק החברות","sec":"146","x":"דירקטוריון של חברה ציבורית או של חברה פרטית שהיא חברת איגרות חוב ימנה מבקר פנימי; המבקר הפנימי ימונה לפי הצעת ועדת הביקורת. … לא יכהן כמבקר פנימי בחברה מי שהוא בעל ענין בחברה, נושא משרה בחברה, קרוב של כל אחד מאלה, וכן רואה החשבון המבקר או מי מטעמו."},{"t":"table","head":["","רואה החשבון המבקר","המבקר הפנימי"],"rows":[["באיזו חברה","בכל חברה (ס' 154), למעט חברה לא פעילה שפטרה את עצמה (ס' 158)","חברה ציבורית וחברת איגרות חוב (ס' 146(א))"],["מי ממנה","האסיפה הכללית (ס' 57(3), 154(ב)); את הראשון – הדירקטוריון (ס' 155)","הדירקטוריון, לפי הצעת ועדת הביקורת (ס' 146(א))"],["מה בודק","את הדוחות הכספיים השנתיים (ס' 154(א))","את התנהלות החברה מבפנים: תקינות, יעילות וליקויים בניהול"],["מי לא יכול לכהן","מי שתלוי בחברה (ס' 160)","בעל עניין, נושא משרה, קרוב שלהם, ורואה החשבון המבקר או מי מטעמו (ס' 146(ב))"]]},{"t":"p","x":"<b>דירקטור בלתי תלוי וממשל תאגידי מומלץ.</b> ״דירקטור בלתי תלוי״ הוא דירקטור חיצוני, או דירקטור שעומד בתנאי האי-זיקה של דירקטור חיצוני (ועדת הביקורת אישרה זאת) ואינו מכהן בחברה יותר מתשע שנים רצופות (הגדרה בס' 1, ס' 249ב). הוא ממונה באסיפה הכללית ברוב רגיל, ולכן הוא ״באמצע״ בין דירקטור רגיל לדירקטור חיצוני. בנוסף, החוק כולל <b>תוספת ראשונה</b> של ״הוראות ממשל תאגידי מומלצות״, שחברה רשאית לאמץ בתקנון (ס' 19(2א)). למשל: בחברה שאין בה בעל שליטה או מחזיק בדבוקת שליטה (25% מזכויות ההצבעה), רוב הדירקטורים יהיו בלתי תלויים; בחברה שיש בה בעל שליטה – לפחות שליש. אלה <b>המלצות</b> ולא חובה. לפי חומר הקורס, רשות ניירות ערך דורשת מחברה ציבורית לגלות בדיווחיה אילו המלצות אימצה ומדוע לא אימצה אחרות (״אמץ או גלה״)."},{"t":"trap","x":"<b>אל תבלבלו בין שני המבקרים.</b> רואה החשבון ה<b>מבקר</b> נדרש בכל חברה, ממונה בידי האסיפה ובודק את הדוחות הכספיים. המבקר ה<b>פנימי</b> נדרש רק בחברה ציבורית ובחברת איגרות חוב, ממונה בידי הדירקטוריון לפי הצעת ועדת הביקורת, ורואה החשבון המבקר אינו יכול למלא את התפקיד הזה (ס' 146(ב))."},{"t":"h","x":"נטילת סמכויות ונבצרות"},{"t":"law","law":"חוק החברות","sec":"50(א)","x":"חברה רשאית לקבוע בתקנונה הוראות לפיהן רשאית האסיפה הכללית ליטול סמכויות הנתונות לאורגן אחר וכן כי סמכויות הנתונות למנהל הכללי יועברו לסמכות הדירקטוריון, הכל לענין מסוים, או לפרק זמן מסוים שלא יעלה על פרק הזמן הנדרש בנסיבות העניין."},{"t":"law","law":"חוק החברות","sec":"52(א)","x":"נבצר מן הדירקטוריון להפעיל את סמכויותיו והפעלת סמכות מסמכויותיו חיונית לניהולה התקין של החברה, רשאית האסיפה הכללית להפעילה במקומו, אף אם לא נקבעה לכך הוראה בתקנון, כל עוד נבצר ממנו הדבר, ובלבד שהאסיפה הכללית קבעה, כי אכן נבצר מן הדירקטוריון לעשות כן וכי הפעלת הסמכות חיונית כאמור;"},{"t":"trap","x":"<b>הסמכויות זורמות רק ״כלפי מעלה״.</b> האסיפה יכולה ליטול מהדירקטוריון, והדירקטוריון מהמנכ״ל. אבל <b>אף אורגן אינו נוטל את סמכויות האסיפה</b>, והמנכ״ל אינו נוטל סמכויות של הדירקטוריון. הבחינו גם בין המסלולים: לפי <b>ס' 50</b> נדרשת הוראה בתקנון; לפי <b>ס' 51 ו-52</b> (סירוב המנכ״ל להוראה, נבצרות) לא נדרשת. ובנבצרות המנכ״ל, הדירקטוריון מפעיל את סמכויותיו (ס' 52(ב)). כשהאסיפה מפעילה סמכויות של הדירקטוריון, בעלי המניות נושאים בחובות ובאחריות של דירקטורים (ס' 50(ב))."},{"t":"example","title":"דוגמה: מנכ״ל שמסרב והדירקטוריון שמשותק","x":"(1) הדירקטוריון הורה למנכ״ל לבטל חוזה הפסדי, והמנכ״ל מסרב. <b>פתרון:</b> לפי ס' 51 הדירקטוריון רשאי לבטל את החוזה בעצמו, גם בלי הוראה בתקנון. (2) כל הדירקטורים הורחקו בצו בית משפט, ויש לאשר דוחות כספיים בדחיפות. <b>פתרון:</b> האסיפה קובעת שנבצר מהדירקטוריון לפעול ושהפעולה חיונית, ומפעילה את הסמכות בעצמה, כל עוד הנבצרות נמשכת (ס' 52(א)). בעלי המניות שמצביעים נושאים באחריות של דירקטורים (ס' 50(ב))."},{"t":"exam","x":"שאלות ״מי מוסמך?״ חוזרות בבחינה בשני החלקים. בתשובה פתוחה: (1) זהו את האורגן לפי החוק (ס' 57 לאסיפה; ס' 92 ו-49 לדירקטוריון; ס' 120–121 למנכ״ל). (2) בדקו אם התקנון יכול לשנות זאת (ס' 58, 50). (3) בנבצרות או בסירוב: ס' 51–52. (4) בחברה ציבורית: איסור יו״ר-מנכ״ל (ס' 95) והחריג בס' 121(ג), כולל הרוב המיוחד ותקופת שלוש השנים; דירקטורים חיצוניים (ס' 239, 245) וועדות (ס' 115, 118א). באמריקאיות זכרו: הצבעה לפי מספר מניות (ס' 82(ג)), דיבידנד לפי ערך נקוב (ס' 306(ב)), וקול מכריע ליו״ר (ס' 107)."}],"mcq":[{"id":"u4-1","q":"לפי ס' 46 לחוק החברות, מה מהבאים אינו אורגן של החברה?","o":["האסיפה הכללית.","דירקטור בודד שפועל לבדו, בלי הסמכה מהדירקטוריון.","המנהל הכללי.","הדירקטוריון.","מי שמכוח התקנון רואים את פעולתו בעניין מסוים כפעולת החברה."],"a":1,"why":"ס' 46 מונה את האסיפה הכללית, הדירקטוריון, המנהל הכללי, וכל מי שעל פי דין או מכוח התקנון רואים את פעולתו כפעולת החברה. הדירקטוריון הוא אורגן כגוף, ודירקטור בודד אינו אורגן מעצם תפקידו.","w":["מנויה במפורש בס' 46.","","מנוי במפורש בס' 46.","מנוי במפורש בס' 46.","זה ״סעיף הסל״ בס' 46."],"secs":["46"]},{"id":"u4-2","q":"בתקנון ״ביתא בע״מ״ ברירות המחדל של החוק. רינה מחזיקה 2,000 מניות בערך נקוב 1 ₪, ויואב מחזיק 500 מניות בערך נקוב 10 ₪. מה נכון?","o":["לשניהם קולות שווים, ודיבידנד שווה.","לרינה רוב בהצבעה וגם רוב בדיבידנד.","ההצבעה והדיבידנד נקבעים לפי המחיר ששילמו.","ליואב רוב בהצבעה, כי הערך הנקוב שלו גבוה יותר.","לרינה רוב בהצבעה, ויואב יקבל את רוב הדיבידנד."],"a":4,"why":"הצבעה: לכל מניה קול אחד (ס' 82(ג)), ולכן לרינה 2,000 קולות מול 500. דיבידנד: לפי הערך הנקוב (ס' 306(ב)). לרינה 2,000 ₪ ערך נקוב, ליואב 5,000 ₪, ולכן יואב יקבל 5/7 מהדיבידנד.","w":["מספר המניות והערך הנקוב שונים, ולכן הקולות והדיבידנד שונים.","הדיבידנד לפי ערך נקוב, ובזה יואב מוביל.","המחיר ששולם אינו רלוונטי לשניהם.","ההצבעה לפי מספר מניות, לא לפי ערך נקוב.",""],"secs":["82","306"]},{"id":"u4-3","q":"בחברה עולה צורך להחליט בעניין שלא הוקנה בחוק או בתקנון לאף אורגן. מי רשאי להפעיל את הסמכות?","o":["יו״ר הדירקטוריון לבדו.","הדירקטוריון.","רק בית המשפט.","האסיפה הכללית.","המנכ״ל, בכל עניין."],"a":1,"why":"ס' 49: ״סמכות של החברה שלא הוקנתה בחוק או בתקנון לאורגן אחר, רשאי הדירקטוריון להפעילה״.","w":["היו״ר אינו אורגן נפרד בעל סמכות שיורית.","","אין צורך בבית משפט.","לאסיפה אין סמכות שיורית כללית; סמכויותיה מנויות (ס' 57–58).","למנכ״ל סמכות שיורית רק בענייני ניהול וביצוע (ס' 121(א))."],"secs":["49","121"]},{"id":"u4-4","q":"בחברה ציבורית, בעל השליטה (55%) מציע שיו״ר הדירקטוריון יכהן גם כמנכ״ל לחמש שנים. מה נכון?","o":["זה אסור בכל מקרה בחברה ציבורית.","די באישור ועדת הביקורת.","הדירקטוריון רשאי לאשר זאת ברוב רגיל.","האסיפה הכללית רשאית לאשר, בתנאי רוב מיוחד, לתקופה של עד שלוש שנים; תקופה של חמש שנים בהחלטה אחת אינה אפשרית.","האסיפה הכללית רשאית לאשר זאת ברוב רגיל לחמש שנים."],"a":3,"why":"ס' 95(א) אוסר כהונה משולבת, אלא לפי ס' 121(ג): האסיפה הכללית רשאית להחליט לתקופות שכל אחת מהן לא תעלה על שלוש שנים, ברוב שכולל רוב מקרב מי שאינם בעלי שליטה ואינם בעלי עניין אישי, או שהמתנגדים מקרבם אינם עולים על 2%.","w":["ס' 121(ג) מאפשר חריג.","אישור ועדת ביקורת רלוונטי לחברת איגרות חוב פרטית (ס' 121(ד)), לא לחברה ציבורית.","הסמכות שייכת לאסיפה, לא לדירקטוריון.","","נדרש רוב מיוחד, ותקופה של עד שלוש שנים בכל החלטה."],"secs":["95","121"]},{"id":"u4-5","q":"בדירקטוריון בן שישה חברים התחלקו הקולות 3 מול 3. היו״ר הצביע עם הצד ״בעד״. בתקנון אין הוראה מיוחדת. מה התוצאה?","o":["יש להעביר את ההחלטה לאסיפה הכללית.","ההחלטה מתקבלת, כי ליו״ר קול נוסף כשהקולות שקולים.","ההכרעה נתונה למנכ״ל.","ההחלטה נדחית, כי אין רוב.","יש לכנס ישיבה נוספת ולהצביע שוב."],"a":1,"why":"ס' 107: ״היו הקולות שקולים יהיה ליושב ראש הדירקטוריון קול נוסף״, אלא אם נקבע אחרת בתקנון.","w":["אין העברה אוטומטית לאסיפה.","","המנכ״ל אינו מכריע בהצבעות הדירקטוריון.","הקול הנוסף של היו״ר מכריע.","אין חובה כזו."],"secs":["107"]},{"id":"u4-6","q":"בעלי המניות של חברה פרטית רוצים שהאסיפה הכללית תחליט על חלוקת דיבידנד, במקום הדירקטוריון. בתקנון אין הוראה בעניין. מה נכון?","o":["בית המשפט מחליט על חלוקה.","האסיפה מוסמכת, כי היא ״האורגן העליון״.","ההחלטה על חלוקה היא בסמכות הדירקטוריון (ס' 92(א)(10)). כדי להעבירה לאסיפה יש לפעול לפי ס' 50 (הוראה בתקנון), או בתנאי נבצרות (ס' 52).","המנכ״ל מוסמך להחליט על דיבידנד.","האסיפה מוסמכת, כי ס' 57 מונה את חלוקת הדיבידנד בין סמכויותיה."],"a":2,"why":"ס' 92(א)(10): הדירקטוריון ״רשאי להחליט על חלוקה״. סמכויות שהחוק מקנה לאורגן אחר מועברות לאסיפה רק לפי ס' 50 (ס' 58(ב)), או במקרה נבצרות (ס' 52(א)).","w":["בית המשפט מאשר רק חלוקה שאינה עומדת במבחן הרווח (ס' 303).","אין סמכות כללית כזו. האסיפה נוטלת סמכויות רק לפי ס' 50 או 52.","","זו אינה סמכות של המנכ״ל.","ס' 57 אינו כולל חלוקת דיבידנד."],"secs":["92","50","52","58"]},{"id":"u4-7","q":"דירקטור חיצוני בחברה ציבורית מונה לראשונה. מה משך הכהונה המרבי שלו בחברה, בהנחה שאין בתקנון הוראה מגבילה?","o":["חמש שנים.","שלוש שנים, ללא אפשרות הארכה.","ללא הגבלה, כל עוד האסיפה מאשרת.","שש שנים: שלוש ועוד תקופה נוספת אחת.","תשע שנים: שלוש ועוד שתי תקופות נוספות של שלוש שנים."],"a":4,"why":"ס' 245(א): תקופת הכהונה היא שלוש שנים, והחברה רשאית למנותו ״לשתי תקופות נוספות, של שלוש שנים כל אחת״. ס' 245(א3) מאפשר לקבוע בתקנון תקרה של שש שנים, אבל בשאלה אין הוראה כזו.","w":["אין בסיס לכך.","החוק מאפשר הארכה.","החוק קובע תקרה.","שש שנים היא תקרה אפשרית רק אם נקבעה בתקנון (ס' 245(א3)).",""],"secs":["245"]},{"id":"u4-8","q":"מי מהבאים רשאי להיות חבר בוועדת הביקורת של חברה ציבורית?","o":["דירקטור חיצוני.","בעל השליטה.","אחיו של בעל השליטה.","יו״ר הדירקטוריון.","דירקטור המועסק בידי החברה."],"a":0,"why":"ס' 115: כל הדירקטורים החיצוניים חברים בוועדת הביקורת, ויו״ר הוועדה הוא דירקטור חיצוני.","w":["","ס' 115(ג): בעל השליטה או קרובו לא יהיו חברים.","אח הוא ״קרוב״ (ס' 1), ולכן מוחרג (ס' 115(ג)).","ס' 115 מוציא את יו״ר הדירקטוריון.","ס' 115 מוציא דירקטור המועסק בידי החברה."],"secs":["115"]},{"id":"u4-9","q":"כל חברי הדירקטוריון של חברה פרטית נעצרו, ואין מי שיאשר הסכם הלוואה חיוני. בתקנון אין הוראה בעניין. מה נכון?","o":["האסיפה רשאית לפעול רק אם יש בתקנון הוראה לפי ס' 50.","המנכ״ל רשאי להפעיל את סמכויות הדירקטוריון.","אין דרך לפעול עד שהדירקטורים ישתחררו.","האסיפה הכללית רשאית להפעיל את הסמכות, לאחר שקבעה שנבצר מהדירקטוריון לפעול ושהפעלת הסמכות חיונית, גם בלי הוראה בתקנון.","יש לפנות לרשם החברות."],"a":3,"why":"ס' 52(א): נבצר מהדירקטוריון והפעלת הסמכות חיונית, ״רשאית האסיפה הכללית להפעילה במקומו, אף אם לא נקבעה לכך הוראה בתקנון״, בתנאי שקבעה שנבצר ושהדבר חיוני.","w":["בנבצרות לא נדרשת הוראה בתקנון.","המנכ״ל אינו נוטל סמכויות של הדירקטוריון.","ס' 52(א) נותן פתרון.","","הרשם אינו מוסמך לכך."],"secs":["52"]},{"id":"u4-10","q":"הדירקטוריון הורה למנכ״ל להפסיק מגעים עם ספק מסוים. המנכ״ל ממשיך במגעים. בתקנון אין הוראה בעניין. מה רשאי הדירקטוריון לעשות?","o":["לפנות לאסיפה הכללית, שרק היא מוסמכת.","להפעיל את הסמכות רק אם התקנון מתיר זאת לפי ס' 50.","להפעיל בעצמו את הסמכות הנדרשת לביצוע ההוראה, גם בלי הוראה בתקנון.","דבר, כי ניהול שוטף הוא סמכות בלעדית של המנכ״ל.","רק לפטר את המנכ״ל."],"a":2,"why":"ס' 51: הדירקטוריון רשאי להורות למנכ״ל כיצד לפעול בעניין מסוים, ואם המנכ״ל לא קיים את ההוראה, הדירקטוריון רשאי להפעיל את הסמכות במקומו, ״אף אם לא נקבעה לכך הוראה בתקנון״.","w":["הדירקטוריון מוסמך בעצמו.","ס' 51 אינו מותנה בתקנון.","","המנכ״ל כפוף להנחיות הדירקטוריון (ס' 120, 121(א)).","פיטורים אפשריים (ס' 250), אבל אינם הדרך היחידה."],"secs":["51","120"]},{"id":"u4-11","q":"בחברה ציבורית התקיימה האסיפה השנתית האחרונה ב-1 במרץ 2025. מה המועד האחרון לקיום האסיפה השנתית הבאה?","o":["1 בספטמבר 2026.","אין מועד, אם הדירקטוריון החליט על דחייה.","1 ביוני 2026.","31 בדצמבר 2025.","1 במרץ 2026."],"a":2,"why":"ס' 60(א): אסיפה שנתית בכל שנה, ״ולא יאוחר מתום חמישה עשר חודשים לאחר האסיפה השנתית האחרונה״. 15 חודשים מ-1 במרץ 2025 הם 1 ביוני 2026.","w":["זה יותר מ-15 חודשים.","הדירקטוריון אינו רשאי לדחות מעבר למועד החוקי. האפשרות שלא לקיים אסיפה שנתית (ס' 61) קיימת רק בחברה פרטית ובהוראה בתקנון.","","אין דרישה שהאסיפה תתקיים בשנה הקלנדרית שבה התקיימה הקודמת.","זה 12 חודשים, והחוק מאפשר עד 15."],"secs":["60","61"]},{"id":"u4-12","q":"בחברה ציבורית, בעלי מניות שמחזיקים יחד 6% מזכויות ההצבעה דרשו מהדירקטוריון לכנס אסיפה מיוחדת. מה נכון?","o":["הדירקטוריון רשאי לסרב, כי הסף הוא 10%.","בעלי המניות רשאים לכנס בעצמם מיד, בלי לפנות לדירקטוריון.","רק המנכ״ל רשאי לכנס אסיפה מיוחדת.","הדירקטוריון חייב לכנס את האסיפה, כי הסף בחברה ציבורית הוא 5% מזכויות ההצבעה.","הדירקטוריון חייב לכנס רק אם גם שני דירקטורים דורשים זאת."],"a":3,"why":"ס' 63(ב)(2): בחברה ציבורית הדירקטוריון יכנס אסיפה מיוחדת לדרישת בעל מניה, אחד או יותר, ״שלו לפחות חמישה אחוזים מזכויות ההצבעה״ (או 5% מההון ו-1% מזכויות ההצבעה).","w":["10% הוא הסף בחברה פרטית (ס' 63(א)(2)).","רק אם הדירקטוריון לא זימן אסיפה בתוך 21 ימים רשאים הדורשים לכנס אותה בעצמם (ס' 63(ג), 64).","הכינוס בידי הדירקטוריון.","","אלה עילות דרישה חלופיות, לא מצטברות."],"secs":["63","64"]},{"id":"u4-13","q":"מנכ״ל חברה, במסגרת תפקידו, גרם ברשלנות לנזק גוף לעובר אורח. מה נכון לגבי האחריות?","o":["רק החברה אחראית, כי פעולות האורגן הן פעולות החברה.","אף אחד אינו אחראי, כי מדובר בפעולה במסגרת תפקיד.","רק המנכ״ל אחראי, כי הוא ביצע את העוולה.","החברה חבה במישרין בשל עוולת האורגן שלה, ובנוסף המנכ״ל נושא באחריות אישית.","החברה אחראית רק אם האסיפה הכללית אישרה את הפעולה."],"a":3,"why":"ס' 53(א): ״חברה חבה במישרין באחריות בנזיקין על עוולה שבוצעה בידי אורגן שלה״. ס' 54(א): הייחוס לחברה אינו גורע מהאחריות האישית של יחידי האורגן.","w":["הייחוס אינו פוטר את המנכ״ל (ס' 54(א)).","שניהם עשויים להיות אחראים.","החברה חבה גם היא, במישרין (ס' 53(א)).","","אין דרישה כזו לאחריות בנזיקין."],"secs":["53","54"]},{"id":"u4-14","q":"בחברה ציבורית אין בתקנון הוראות על מניין חוקי. לאסיפה כללית (שלא כונסה לדרישת בעלי מניות) הגיעו בתוך חצי שעה שלושה בעלי מניות שמחזיקים יחד 20% מזכויות ההצבעה. מה הדין?","o":["האסיפה מתקיימת, כי נכחו יותר משני בעלי מניות.","האסיפה מבוטלת, והדירקטוריון חייב לכנס אסיפה חדשה בהודעה חדשה.","אין מניין חוקי; האסיפה נדחית לשבוע, לאותו יום, שעה ומקום, ואם גם אז לא יהיה מניין בתוך חצי שעה – היא תתקיים בכל מספר משתתפים.","אין מניין חוקי; האסיפה נדחית לשבוע, ובאסיפה הנדחית נדרש שוב מניין של 25%.","יו״ר הדירקטוריון רשאי להכריז שהאסיפה תתקיים בכל זאת, כי מדובר בחברה ציבורית."],"a":2,"why":"מניין חוקי הוא שני בעלי מניות לפחות שלהם 25% לפחות מזכויות ההצבעה (ס' 78(א)). 20% אינם מספיקים, ולכן האסיפה נדחית לשבוע (ס' 78(ב)). באסיפה הנדחית, אם אין מניין כעבור חצי שעה, היא מתקיימת בכל מספר משתתפים (ס' 79(א)).","w":["נדרשים גם שני בעלי מניות וגם 25% מזכויות ההצבעה (ס' 78(א)). כאן התנאי השני לא התקיים.","החוק קובע דחייה אוטומטית לשבוע (ס' 78(ב)), לא ביטול.","","באסיפה הנדחית אין דרישת 25%: היא מתקיימת בכל מספר משתתפים (ס' 79(א)). החריג של ס' 79(ב) חל רק על אסיפה שכונסה לדרישת בעלי מניות.","אין ליו״ר סמכות כזו. המניין קבוע בחוק או בתקנון (ס' 78, 81)."],"secs":["78","79"]},{"id":"u4-15","q":"בחברה פרטית, שבתקנונה אין הוראות על הזמנה לאסיפה, מבקשים לכנס אסיפה כללית שעל סדר יומה שינוי התקנון. מה נכון?","o":["ההזמנה תימסר לפחות 21 ימים מראש, ואין צורך לפרט את נוסח השינוי.","ההזמנה תימסר לא פחות משבעה ימים ולא יותר מ-45 ימים לפני האסיפה, ותפרט את נוסח השינוי המוצע.","אין צורך בהזמנה בחברה פרטית; די בהודעה טלפונית ביום האסיפה.","ההזמנה תימסר לפחות 35 ימים מראש, כמו בחברה ציבורית.","האסיפה רשאית להחליט גם בנושאים שלא נכללו בסדר היום, אם רוב בעלי המניות מסכימים."],"a":1,"why":"ס' 67: בחברה פרטית ההזמנה נמסרת לא יאוחר משבעה ימים ולא מוקדם מ-45 ימים לפני האסיפה, אם התקנון לא קבע אחרת. ס' 68: ההזמנה מציינת מועד, מקום וסדר יום, וכשמוצע שינוי תקנון – גם את נוסח השינוי.","w":["21 ימים הם הדרישה ב״החלטה מיוחדת״ על פירוק (ס' 342ב), לא ברירת המחדל. וחובה לפרט את נוסח שינוי התקנון (ס' 68(ב)).","","ס' 67 מחייב מסירת הזמנה לכל מי שזכאי להשתתף, במועדים שנקבעו בו.","35 ימים הם מגבלה בחברה ציבורית לעניין אסיפה מיוחדת (ס' 63(ג)). בחברה פרטית חל ס' 67.","האסיפה מחליטה רק בנושאים שפורטו בסדר היום (ס' 66(ג))."],"secs":["66","67","68"]},{"id":"u4-16","q":"״ניצן בע״מ״ היא חברה פרטית (לא חברת איגרות חוב) שמחזור עסקיה השנתי 300,000 ₪. האסיפה הכללית החליטה שלא למנות רואה חשבון מבקר. בעלי מניות שמחזיקים 12% מההון המונפק התנגדו. מה נכון?","o":["ההחלטה תקפה, כי התקבלה ברוב רגיל.","ההחלטה תקפה, כי חברה פרטית אינה חייבת לעולם ברואה חשבון מבקר.","ההחלטה אינה תקפה, כי בעלי 10% או יותר מההון המונפק התנגדו לה, ולכן החברה חייבת למנות רואה חשבון מבקר.","ההחלטה אינה תקפה, כי הפטור חל רק כשמחזור העסקים אפס.","ההחלטה בסמכות הדירקטוריון בלבד, ולכן החלטת האסיפה בטלה."],"a":2,"why":"כל חברה חייבת במינוי רואה חשבון מבקר (ס' 154). חריג: ״חברה לא פעילה״, חברה פרטית שמחזורה עד 500,000 ₪ (צמוד), רשאית להחליט באסיפה שלא למנות, ״אלא אם כן בעלי מניות שלהם 10 אחוזים או יותר מההון המונפק של החברה התנגדו לכך״ (ס' 158(א)). כאן התנגדו בעלי 12%.","w":["הפטור אינו תלוי רק ברוב: התנגדות של 10% מההון המונפק מונעת אותו (ס' 158(א)).","ס' 154(א) מחייב כל חברה, פרטית וציבורית. ס' 158 הוא חריג מצומצם בלבד.","","התקרה היא 500,000 ₪ (צמוד), לא אפס (ס' 158(א)).","ס' 158(א) מסמיך את האסיפה הכללית, והמינוי עצמו בסמכותה (ס' 57(3))."],"secs":["154","158"]},{"id":"u4-17","q":"דירקטוריון חברה ציבורית צריך למנות מבקר פנימי. מי מהבאים כשיר לכהן בתפקיד?","o":["שותף במשרד רואי החשבון שמשמש רואה החשבון המבקר של החברה.","אחיו של בעל השליטה, שהוא רואה חשבון מנוסה.","סמנכ״לית הכספים של החברה, במקביל לתפקידה.","רואה חשבון עצמאי שאין לו ולקרוביו קשר לחברה, שמונה לפי הצעת ועדת הביקורת.","בעל מניות שמחזיק 6% ממניות החברה."],"a":3,"why":"ס' 146(א): הדירקטוריון ממנה מבקר פנימי לפי הצעת ועדת הביקורת. ס' 146(ב): לא יכהן כמבקר פנימי בעל עניין, נושא משרה, קרוב של אחד מהם, וכן רואה החשבון המבקר או מי מטעמו. רואה חשבון עצמאי ללא קשר לחברה כשיר.","w":["רואה החשבון המבקר ״או מי מטעמו״ אינו כשיר (ס' 146(ב)).","בעל השליטה הוא בעל עניין, ואחיו הוא ״קרוב״ שלו, ולכן אינו כשיר (ס' 146(ב), הגדרות ״בעל ענין״ ו״קרוב״ בס' 1).","סמנכ״לית הכספים היא נושאת משרה, ולכן אינה כשירה (ס' 146(ב)).","","מי שמחזיק 5% או יותר הוא ״בעל מניה מהותי״ ולכן ״בעל ענין״ (ס' 1), ואינו כשיר (ס' 146(ב))."],"secs":["146","1"]},{"id":"u4-18","q":"סמנכ״ל הרכש של ״אלמוג בע״מ״ הוסמך לחתום על הזמנות עד 100,000 ₪. הוא חתם בשם החברה על חוזה של 2 מיליון ₪ עם ספק שלא ידע ולא היה עליו לדעת על המגבלה. מה הדין?","o":["החוזה בטל תמיד, כי נחתם בלי הרשאה.","החוזה מחייב את החברה, כי הספק לא ידע ולא היה עליו לדעת על החריגה מההרשאה.","החוזה מחייב את החברה רק אם בית המשפט יאשר אותו.","החוזה מחייב רק את הסמנכ״ל באופן אישי, ולא את החברה.","החוזה מחייב את החברה רק אם האסיפה הכללית תאשר אותו ברוב של שלושה רבעים."],"a":1,"why":"ס' 56(א): לפעולה בחריגה מההרשאה אין תוקף כלפי החברה, אלא אם החברה אישרה אותה, או שהצד השני לא ידע ולא היה עליו לדעת על החריגה. הספק כאן בתום לב, ולכן החוזה מחייב את החברה.","w":["הכלל של ס' 56(א) מגן על צד שלישי בתום לב.","","אין צורך באישור בית משפט. בית המשפט מעורב רק בבקשה לצו מניעה לפני הפעולה (ס' 55(ב)).","הפעולה נעשתה עבור החברה, והחוק קובע שהיא מחייבת אותה כלפי צד תם לב (ס' 56(א)). הסמנכ״ל עשוי לחוב כלפי החברה בנפרד.","אישור בדיעבד אינו נדרש כשהצד השני תם לב. ואישור של חריגה מהרשאה ניתן בידי האורגן המוסמך לתת אותה, לא באסיפה ברוב מיוחד (ס' 56(ב))."],"secs":["55","56"]}],"cases":[{"id":"u4-c1","title":"אורות הצפון בע״מ","facts":"״אורות הצפון בע״מ״ היא חברה ציבורית. משפחת אלון (בעלת השליטה) מחזיקה 52% מהמניות, קרן ״גשר״ מחזיקה 8%, והיתר בידי הציבור. בדירקטוריון שישה חברים, ובהם שני דירקטורים חיצוניים. היו״ר הוא נתן אלון. לפני חודש התפטר המנכ״ל, והדירקטוריון החליט, ברוב של 4 מול 2, למנות את נתן למנכ״ל ״עד להודעה חדשה״ ולהשאירו גם כיו״ר. נתן מינה את אחיו, אהוד, לחבר ועדת הביקורת. בנוסף, האסיפה הכללית, בקולות משפחת אלון בלבד, החליטה לחלק דיבידנד ולשנות את התקנון כך שהמנכ״ל יוכל להחליט לבדו על עסקאות של עד 50 מיליון ₪.","parts":[{"q":"דונו בחוקיות מינויו של נתן למנכ״ל ובמינוי אהוד לוועדת הביקורת. נמקו והפנו לסעיפי החוק.","pts":20,"model":["1. בחברה ציבורית המנכ״ל לא יכהן כיו״ר, וליו״ר לא יוקנו סמכויות המנכ״ל, אלא לפי ס' 121(ג) (ס' 95(א)–(ב)).","2. הסמכות לאשר כהונה משולבת שייכת לאסיפה הכללית, ולא לדירקטוריון (ס' 121(ג)). לכן החלטת הדירקטוריון אינה מספיקה.","3. נדרש רוב מיוחד: הרוב כולל לפחות רוב מקולות מי שאינם בעלי שליטה ואינם בעלי עניין אישי (קרן ״גשר״ והציבור), בלי לספור נמנעים, או שהמתנגדים מקרבם אינם עולים על 2% מכלל זכויות ההצבעה (ס' 121(ג)(1)–(2)).","4. התקופה ״עד להודעה חדשה״ פסולה. כל החלטה לתקופה של עד שלוש שנים ממועד קבלתה (ס' 121(ג)).","5. ועדת הביקורת: אהוד הוא ״קרוב״ של נתן (אח, ס' 1). אם נתן נמנה עם בעלי השליטה, אהוד הוא קרוב של בעל השליטה ואינו רשאי להיות חבר בוועדה (ס' 115(ג)). יו״ר הדירקטוריון עצמו מנוע מלהיות חבר בה (ס' 115). בנוסף, את חברי הוועדה ממנה הדירקטוריון מבין חבריו (ס' 114), ולא היו״ר לבדו, וכל הדירקטורים החיצוניים חייבים להיות חברים בה, ואחד מהם היו״ר שלה (ס' 115).","6. מסקנה: יש לכנס אסיפה כללית לאישור לפי ס' 121(ג), ולהרכיב מחדש את ועדת הביקורת כדין."],"check":["ס' 95 – האיסור","ס' 121(ג) – אסיפה, רוב מיוחד (שתי החלופות)","תקופה עד 3 שנים","ס' 115 – קרוב של בעל שליטה ויו״ר מנועים; חיצוני כיו״ר הוועדה","ס' 114 – מינוי בידי הדירקטוריון"]},{"q":"דונו בהחלטות האסיפה הכללית על חלוקת הדיבידנד ועל תיקון התקנון. נמקו והפנו לסעיפי החוק.","pts":15,"model":["1. החלטה על חלוקה היא סמכות הדירקטוריון (ס' 92(א)(10)), והיא אינה מנויה בסמכויות האסיפה (ס' 57). האסיפה רשאית ליטול את הסמכות רק אם יש בתקנון הוראה לפי ס' 50(א) (ראו ס' 58(ב)), או בנבצרות של הדירקטוריון (ס' 52(א)). אחרת ההחלטה בחוסר סמכות.","2. גם אם תינטל הסמכות כדין, החלוקה כפופה למבחני החלוקה (ס' 302), ובעלי המניות שהצביעו יישאו באחריות של דירקטורים (ס' 50(ב)).","3. שינוי תקנון הוא סמכות האסיפה, ברוב רגיל אלא אם נקבע אחרת (ס' 20(א), 57(1)). לכן הוא אפשרי פורמלית בקולות משפחת אלון (52%).","4. אבל אי אפשר ״להאציל״ למנכ״ל סמכויות שהחוק מקנה לדירקטוריון בלי אפשרות אצילה, כגון מסגרת האשראי ותכניות הפעולה (ס' 92(א), 92(ב)). המנכ״ל פועל במסגרת המדיניות שקבע הדירקטוריון ובכפוף להנחיותיו (ס' 120), ועסקאות חריגות עם בעלי עניין טעונות אישורים מיוחדים (ס' 270 ואילך).","5. בהצבעה על שינוי התקנון חייבים בעלי השליטה לנהוג בתום לב, להימנע מקיפוח (ס' 192) ולפעול בהגינות (ס' 193)."],"check":["דיבידנד בסמכות הדירקטוריון – ס' 92(א)(10)","נטילת סמכות – ס' 50/52; ס' 58(ב)","שינוי תקנון בסמכות האסיפה – ס' 20, 57(1)","מגבלת ס' 92(ב), 120 – כפיפות המנכ״ל","ס' 192–193"]}]}]},{"id":"u5","title":"חובות נושאי משרה: זהירות ואמונים","short":"חובות נושאי משרה","blurb":"לזהות נושא משרה, לנתח הפרה של חובת הזהירות ושל חובת האמונים (כולל כלל שיקול הדעת העסקי, פיקוח והזדמנות עסקית), ולהציע דרך אישור, תרופות ומסלול אכיפה.","secs":["1","252","253","254","255","256","194"],"blocks":[{"t":"h","x":"מי חב בחובות? \"נושא משרה\""},{"t":"p","x":"חובות הזהירות והאמונים בחוק החברות מוטלות על <b>נושא משרה</b>. לכן כל תשובה בנושא מתחילה בשאלה: האם האדם שבעובדות הוא נושא משרה? ההגדרה בס' 1 היא <b>מהותית ולא פורמלית</b>. קובע התפקיד שהאדם ממלא בפועל, לא התואר שקיבל."},{"t":"law","law":"חוק החברות","sec":"1","x":"”נושא משרה“ – מנהל כללי, מנהל עסקים ראשי, משנה למנהל כללי, סגן מנהל כללי, כל ממלא תפקיד כאמור בחברה אף אם תוארו שונה, וכן דירקטור או מנהל הכפוף במישרין למנהל הכללי;"},{"t":"list","x":["<b>בכירי ההנהלה</b>: מנכ\"ל, משנה למנכ\"ל, סגן מנכ\"ל, וכל מי שממלא תפקיד כזה גם אם תוארו שונה (למשל \"נשיא\" או \"מנהל תפעול ראשי\").","<b>כל דירקטור</b>: גם דירקטור חיצוני, וגם דירקטור שמונה מטעם בעל השליטה.","<b>מנהל הכפוף במישרין למנכ\"ל</b>: סמנכ\"ל כספים, סמנכ\"ל שיווק, יועץ משפטי ראשי וכדומה. מנהל שכפוף לסמנכ\"ל (דרג שלישי) <b>אינו</b> נושא משרה לפי ההגדרה.","<b>בעל שליטה</b> שאינו מכהן בתפקיד כזה אינו נושא משרה. עליו חלה חובת ההגינות (ס' 193), ולא חובת האמונים של ס' 254. אם הוא גם מנכ\"ל או דירקטור, חלות עליו שתי מערכות החובות."]},{"t":"table","head":["","חובת זהירות","חובת אמונים"],"rows":[["מקור","ס' 252–253 (מפנה לרשלנות בס' 35–36 לפקודת הנזיקין)","ס' 254"],["השאלה","האם פעל כנושא משרה <b>סביר</b>: מיומן, מיודע וקשוב?","האם פעל <b>בתום לב ולטובת החברה</b>, בלי לשים את טובתו לפני טובתה?"],["אופי ההפרה","רשלנות: החלטה לא מיודעת, היעדר פיקוח, התעלמות מנורות אדומות","ניגוד עניינים, תחרות, ניצול הזדמנות עסקית, הסתרת מידע"],["אישור מראש","אין מסלול אישור. החברה יכולה לפטור מראש לפי ס' 259","אפשר לאשר פעולה מסוימת לפי ס' 255 (גילוי ותום לב)"],["פטור, שיפוי, ביטוח","פטור, שיפוי וביטוח אפשריים בגבולות ס' 258–263","אין פטור (ס' 258(א)). ביטוח ושיפוי רק במקרה של תום לב לפי ס' 261(2) ו-263(1)"],["תרופה","פיצויי נזיקין","דיני הפרת חוזה (ס' 256): פיצוי, השבת רווחים, ביטול ועוד"]]},{"t":"h","x":"חובת הזהירות (ס' 252–253)"},{"t":"law","law":"חוק החברות","sec":"252","x":"(א) נושא משרה חב כלפי החברה חובת זהירות כאמור בסעיפים 35 ו־36 לפקודת הנזיקין [נוסח חדש]. (ב) אין בהוראת סעיף קטן (א) כדי למנוע קיומה של חובת זהירות של נושא משרה כלפי אדם אחר."},{"t":"law","law":"חוק החברות","sec":"253","x":"נושא משרה יפעל ברמת מיומנות שבה היה פועל נושא משרה סביר, באותה עמדה ובאותן נסיבות, ובכלל זה ינקוט, בשים לב לנסיבות הענין, באמצעים סבירים לקבלת מידע הנוגע לכדאיות העסקית של פעולה המובאת לאישורו או של פעולה הנעשית על ידיו בתוקף תפקידו, ולקבלת כל מידע אחר שיש לו חשיבות לענין פעולות כאמור."},{"t":"p","x":"ס' 252(א) מפנה ל<b>עוולת הרשלנות</b>. לכן ההפרה נבחנת ביסודות הרגילים: חובה, הפרה (סטייה מרמת הזהירות), נזק וקשר סיבתי. ס' 253 קובע את <b>רמת הזהירות</b>: המבחן <b>אובייקטיבי</b> (\"נושא משרה סביר\") ובו בזמן <b>תלוי הקשר</b> (\"באותה עמדה ובאותן נסיבות\"). מסמנכ\"ל כספים מצפים לבקיאות פיננסית רבה יותר מאשר מדירקטור שאינו בעל מומחיות כזו. דירקטור אינו יכול להתגונן בטענה \"לא הבנתי\" או \"סמכתי על המנכ\"ל\"."},{"t":"p","x":"הדגש בס' 253 הוא על <b>תהליך קבלת ההחלטה</b>, ובעיקר על חובת ההתעדכנות: לנקוט \"אמצעים סבירים לקבלת מידע\" על הכדאיות העסקית ועל כל מידע אחר שיש לו חשיבות. ההחלטה עצמה אולי התבררה בדיעבד כשגויה, אבל לא זו השאלה. השאלה היא אם התקבלה כמו שנושא משרה סביר היה מקבל אותה."},{"t":"list","x":["<b>מה עושה נושא משרה סביר?</b> קורא את החומר לפני הישיבה, ודורש חומר אם לא הועבר.","שואל שאלות, ובמקרה הצורך מבקש חוות דעת של מומחה (שמאי, יועץ משפטי, רו\"ח).","מקדיש לדיון זמן שמתאים להיקף ההחלטה, ולא מאשר עסקה של מאות מיליונים בישיבה של עשר דקות.","מתעד את הדיון ואת הנימוקים בפרוטוקול.","כשהוא נתקל ב\"נורה אדומה\", מברר אותה ופועל לתקן. דירקטור שנודע לו על ליקוי חייב לפעול לכינוס ישיבת דירקטוריון בלי דיחוי (ס' 257)."]},{"t":"h","x":"כלל שיקול הדעת העסקי"},{"t":"p","x":"בית המשפט אינו \"מנהל העסקים\" של החברה, ואינו בוחן החלטות עסקיות בחוכמה שלאחר מעשה. מטעם זה <b>אימצה הפסיקה בישראל את כלל שיקול הדעת העסקי</b>. אם ההחלטה התקבלה <b>בהיעדר ניגוד עניינים</b>, <b>בתום לב</b> ו<b>באופן מיודע</b>, בית המשפט לא יתערב בתוכנה ולא יקבע שנושאי המשרה הפרו את חובת הזהירות רק משום שההחלטה התבררה כשגויה. הוא יתערב רק במקרים קיצוניים, שבהם ההחלטה בלתי סבירה בעליל."},{"t":"p","x":"הכלל הוא <b>חזקה לטובת נושאי המשרה</b>. התובע יכול לסתור אותה אם יראה שאחד התנאים לא התקיים. בפועל הפסיקה מבחינה בין <b>שלוש רמות ביקורת</b>: (1) <b>כלל שיקול הדעת העסקי</b>: בית המשפט אינו בוחן את תוכן ההחלטה. (2) <b>בחינה מוגברת</b>: סטנדרט ביניים, למשל כשלבעל השליטה אינטרס בהחלטה שאינה עסקה שבה יש לו עניין אישי. (3) <b>הגינות מלאה</b>: בעסקאות שבהן לבעל השליטה עניין אישי ולא אושרו כדין, הנטל עובר אליו להוכיח הליך תקין ומחיר הוגן."},{"t":"case","name":"ע\"א 7735/14 ורדניקוב נ' אלוביץ'","x":"בית המשפט העליון אימץ באופן רשמי את כלל שיקול הדעת העסקי. החלטה שהתקבלה בתום לב, באופן מיודע ובלי ניגוד עניינים, חוסה תחת הכלל, ובית המשפט לא יבחן את תוכנה. נקבע גם סטנדרט ביניים של \"בחינה מוגברת\", בין הכלל לבין מבחן ההגינות המלאה."},{"t":"steps","title":"יישום כלל שיקול הדעת העסקי על עובדות","x":["<b>האם הייתה החלטה?</b> הכלל מגן על החלטה מודעת. מחדל, שינה או אי-קבלת החלטה אינם \"שיקול דעת עסקי\".","<b>ניגוד עניינים:</b> האם למי מהמחליטים היה עניין אישי? אם כן, ההגנה לא חלה וממשיכים לדיני האמונים ולפרק החמישי.","<b>תום לב:</b> האם ההחלטה התקבלה לטובת החברה, ולא כדי להסתיר, להטעות או לרצות גורם מסוים?","<b>החלטה מיודעת (ס' 253):</b> האם נאסף מידע סביר (חוות דעת, נתונים, זמן דיון)? זה המבחן שבו נכשלים רוב הדירקטוריונים בשאלות הבחינה.","<b>מסקנה:</b> אם כל התנאים מתקיימים, ההחלטה מוגנת גם אם הסתיימה בהפסד. אם תנאי חסר, בית המשפט בוחן את סבירות ההחלטה ואת הגינותה, ותיתכן אחריות לפי ס' 252–253."]},{"t":"trap","x":"<b>מלכודת:</b> לכתוב \"ההחלטה גרמה להפסד, ולכן הופרה חובת הזהירות\". הפסד כשלעצמו אינו הפרה. בודקים את <b>התהליך</b> (מידע, זמן, ייעוץ), ולא את <b>התוצאה</b>. ולהפך: כלל שיקול הדעת העסקי אינו מגן על החלטה שהתקבלה בלי מידע, או על דירקטור שלא קיבל החלטה כלל."},{"t":"h","x":"חובת הפיקוח ותכנית ציות (אכיפה פנימית)"},{"t":"p","x":"הדירקטוריון אינו מנהל את החברה ביום-יום, אבל מוטלת עליו חובה <b>לפקח</b>: \"הדירקטוריון יתווה את מדיניות החברה ויפקח על ביצוע תפקידי המנהל הכללי ופעולותיו\" (ס' 92(א)). הפסיקה רואה בחובת הפיקוח חלק מחובת הזהירות. הדירקטוריון חייב לוודא שבחברה קיימים <b>מנגנוני דיווח, בקרה וציות</b> שמתאימים לסיכוניה, למשל בטיחות מוצר, ניירות ערך, הגבלים עסקיים והגנת הסביבה. הוא גם חייב לבדוק שהמנגנונים <b>פועלים בפועל</b>."},{"t":"law","law":"חוק החברות","sec":"122(א)","x":"(א) המנהל הכללי חייב להודיע ליושב ראש הדירקטוריון על כל ענין חריג שהוא מהותי לחברה; לא היה לחברה יושב ראש דירקטוריון או שנבצר ממנו למלא את תפקידו, יודיע המנהל הכללי כאמור לכל חברי הדירקטוריון."},{"t":"list","x":["<b>מנכ\"ל שמסתיר מידע מהותי</b> מהדירקטוריון מפר את חובת הדיווח (ס' 122(א)) ואת חובת הזהירות. הסתרה מכוונת עלולה להיות גם הפרה של חובת האמונים, שכן החובה לגלות לחברה כל ידיעה שבאה לידיו בתוקף מעמדו קבועה בס' 254(א)(4).","<b>דירקטוריון שהחליט לאמץ תכנית ציות ולא וידא את יישומה</b> לא קיים את חובת הפיקוח. ההחלטה \"על הנייר\" אינה מספיקה, וכלל שיקול הדעת העסקי לא יגן על מחדל מתמשך של אי-מעקב.","<b>תכנית ציות אפקטיבית</b> פועלת לטובת נושאי המשרה. היא ראיה לכך שפעלו כנושאי משרה סבירים, והיא מצמצמת את הסיכון לאחריות אישית."]},{"t":"example","title":"דוגמה: נורה אדומה שלא טופלה","x":"<b>עובדות:</b> חברה ציבורית מייצרת ציוד רפואי. המנכ\"ל קיבל שלושה דיווחים על תקלה במכשיר, החליט שהם \"זניחים\" ולא העבירם לדירקטוריון. לפני שנה החליט הדירקטוריון לאמץ תכנית ציות, אך מעולם לא מונה ממונה ציות ולא הוגש דיווח. בהמשך נדרשה החזרת מוצרים שעלתה 8 מיליון ₪.\n<b>פתרון:</b> (1) <b>המנכ\"ל</b> הוא נושא משרה (ס' 1). הוא הפר את חובת הדיווח (ס' 122(א)) ואת חובת הזהירות (ס' 252–253): מנכ\"ל סביר היה בודק את הדיווחים ומעביר אותם לדירקטוריון. כלל שיקול הדעת העסקי לא יגן עליו, משום שההחלטה לא הייתה מיודעת, ויש בסיס לטענה שלא היה תום לב (הסתרה). (2) <b>הדירקטורים</b> הפרו את חובת הפיקוח: הם אימצו תכנית ולא בדקו את יישומה. זה מחדל, לא החלטה מוגנת. (3) <b>קשר סיבתי</b>: אילו הדיווח היה מועבר בזמן, אפשר היה למנוע חלק מהנזק, ולכן יש נזק שבר-תביעה."},{"t":"case","name":"ע\"א 610/94 בוכבינדר נ' כונס הנכסים הרשמי בתפקידו כמפרק בנק צפון אמריקה","x":"פסק דין היסוד בעניין חובת הפיקוח: דירקטורים \"פסיביים\" שלא פיקחו ולא פעלו מול סימני אזהרה הפרו את חובת הזהירות, ונשאו באחריות אישית לנזקי הבנק שקרס. דירקטור חייב לפקח באופן פעיל, והסטנדרט הוא אובייקטיבי."},{"t":"h","x":"חובת זהירות כלפי צדדים שלישיים (ס' 252(ב))"},{"t":"p","x":"ס' 252(ב) מבהיר שחובת הזהירות כלפי החברה <b>אינה שוללת</b> חובת זהירות של נושא המשרה <b>כלפי אחרים</b>: נושים, ספקים, לקוחות ומשקיעים. הכלל הוא שכאשר נושא משרה פועל כאורגן, הפעולה מיוחסת לחברה והחברה אחראית. אבל לפי הפסיקה, נושא המשרה עשוי לשאת גם <b>באחריות אישית</b> כשהוא עצמו ביצע עוולה, ולא רק \"חתם בשם החברה\". דוגמאות: מצג שווא רשלני או במרמה כלפי צד שלישי, או יצירת התחייבויות כשהוא <b>יודע</b> שאין לחברה אפשרות לעמוד בהן. במקרים כאלה הנפגע יכול לתבוע גם את החברה וגם את נושא המשרה."},{"t":"case","name":"ע\"א 407/89 צוק אור בע\"מ נ' קאר סקיוריטי בע\"מ","x":"מעשה האורגן מיוחס לחברה, אבל האורגן אינו \"נבלע\" בה. כשהוא עצמו מקיים את יסודות העוולה, הוא עשוי לשאת באחריות אישית לצד החברה."},{"t":"h","x":"חובת האמונים (ס' 254)"},{"t":"law","law":"חוק החברות","sec":"254(א)","x":"(א) נושא משרה חב חובת אמונים לחברה, ינהג בתום לב ויפעל לטובתה, ובכלל זה – (1) יימנע מכל פעולה שיש בה ניגוד ענינים בין מילוי תפקידו בחברה לבין מילוי תפקיד אחר שלו או לבין עניניו האישיים; (2) יימנע מכל פעולה שיש בה תחרות עם עסקי החברה; (3) יימנע מניצול הזדמנות עסקית של החברה במטרה להשיג טובת הנאה לעצמו או לאחר; (4) יגלה לחברה כל ידיעה וימסור לה כל מסמך הנוגעים לעניניה, שבאו לידיו בתוקף מעמדו בחברה."},{"t":"p","x":"חובת האמונים מחייבת <b>זהות אינטרסים</b>: כשנושא משרה פועל בתפקידו, טובת החברה קודמת לטובתו האישית. זו רמה
