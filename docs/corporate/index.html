עסקאות עם בעל שליטה, גם כשאינן חריגות (ס' 117(1ב)), וקביעת אופן האישור של עסקאות \"שאינן זניחות\" (ס' 117(2א))."]},{"t":"h","x":"הימנעות, הצבעה ואישורים מצטברים (ס' 276–278)"},{"t":"law","law":"חוק החברות","sec":"278","x":"(א) מי שיש לו ענין אישי באישור עסקה, למעט עסקה כאמור בסעיף 271, המובאת לאישור ועדת הביקורת או הדירקטוריון, לא יהיה נוכח בדיון ולא ישתתף בהצבעה בועדת הביקורת ובדירקטוריון ואולם נושא משרה שיש לו עניין אישי, רשאי להיות נוכח לשם הצגת העסקה, אם יושב ראש ועדת הביקורת או יושב ראש הדירקטוריון, לפי העניין, קבע כי הוא נדרש לשם הצגתה. (ב) על אף האמור בסעיף קטן (א), רשאי דירקטור להיות נוכח בדיון בועדת ביקורת ולהשתתף בהצבעה, אם לרוב חברי ועדת הביקורת יש ענין אישי באישור העסקה, וכן רשאי דירקטור להיות נוכח בדיון בדירקטוריון ולהשתתף בהצבעה, אם לרוב הדירקטורים בחברה יש ענין אישי באישור העסקה. (ג) היה לרוב הדירקטורים בדירקטוריון החברה ענין אישי באישור עסקה כאמור בסעיף קטן (א), טעונה העסקה גם אישור האסיפה הכללית."},{"t":"list","x":["<b>ס' 276</b>: בעל מניה שמצביע לפי ס' 275 מודיע לפני ההצבעה, או בכתב ההצבעה, אם יש לו עניין אישי. אם לא הודיע, הוא לא יצביע וקולו לא יימנה.","<b>ס' 277</b>: עסקה שנופלת ביותר מחלופה אחת של ס' 270 טעונה את האישורים של <b>כל</b> החלופות. לדוגמה: בעל שליטה שהוא גם מנכ\"ל.","<b>ס' 278(ג)</b>: כשלרוב הדירקטורים עניין אישי, הם רשאים להשתתף כדי שיהיה קוורום (ס' 278(ב)), אבל העסקה עוברת גם לאסיפה הכללית."]},{"t":"h","x":"עסקה שלא אושרה כדין (ס' 280–282)"},{"t":"law","law":"חוק החברות","sec":"280","x":"(א) לעסקה של חברה עם נושא משרה בה או לעסקה כאמור בסעיף 270(4) ו־(4א) עם בעל שליטה בה לא יהיה תוקף כלפי החברה וכלפי נושא המשרה או בעל השליטה, אם העסקה לא אושרה בהתאם לקבוע בפרק זה לרבות אם נפל בהליך האישור פגם מהותי, או אם העסקה נעשתה בחריגה מהותית מן האישור. (ב) לעסקה כאמור בסעיף קטן (א) לא יהיה תוקף גם כלפי אדם אחר אם אותו אדם ידע על ענינו האישי של נושא המשרה או של בעל השליטה באישור העסקה, וידע או היה עליו לדעת על העדר אישור לעסקה כנדרש לפי פרק זה."},{"t":"p","x":"<b>שלוש עילות לבטלות</b> (ס' 280(א)): העסקה לא אושרה; נפל בהליך האישור <b>פגם מהותי</b>, למשל ועדה בהרכב פסול או השתתפות של בעל העניין; או שהעסקה בוצעה ב<b>חריגה מהותית</b> מהאישור. כלפי <b>צד שלישי</b> העסקה בטלה רק אם ידע על העניין האישי, <b>וגם</b> ידע או היה עליו לדעת על היעדר האישור (ס' 280(ב)). במקרה כזה החברה רשאית גם לבטל את העסקה ולתבוע פיצויים (ס' 281). צד שלישי שקיבל <b>אישור דירקטוריון</b> שכל האישורים התקבלו נהנה מחזקת תום לב (ס' 282). בנוסף, נושא משרה שפעל כך מפר את חובת האמונים (ס' 254, 256), ובעל שליטה מפר את חובת ההגינות (ס' 193)."},{"t":"case","name":"ע\"א 2718/09 \"גדיש\" קרנות גמולים בע\"מ נ' אלסינט בע\"מ","x":"כשעסקה של בעל שליטה, או עסקה שבעל השליטה מעוניין בה, לא הובאה לאישור הנדרש, <b>נטל ההוכחה עובר לבעלי השליטה</b> להוכיח את \"הגינותה המלאה\" של העסקה: הליך אישור תקין ומחיר הולם. \"ריקון\" קופת החברה לטובת בעלי השליטה מקים חשש סביר לקיפוח המיעוט."},{"t":"example","title":"דוגמה: הסכם אספקה עם חברת האח","x":"<b>עובדות:</b> נעמה מחזיקה 48% ומכהנת כיו\"ר בחברה ציבורית. הדירקטוריון אישר הסכם אספקה בלעדי לחמש שנים, בהיקף של מיליוני שקלים, עם חברה שבבעלות מלאה של אחיה. ההסכם אושר אחרי שכונסה ועדת ביקורת, שנעמה חברה בה. ההסכם לא הובא לאסיפה.\n<b>פתרון:</b> (1) נעמה היא בעלת שליטה, כי יש לה 25% ומעלה ואין מחזיק ביותר מ-50% (ס' 268). (2) לנעמה עניין אישי, כי אחיה הוא קרוב והבעלים של הצד שכנגד (ס' 1). (3) העסקה <b>חריגה</b>: בלעדיות לחמש שנים בהיקף של מיליונים עשויה להשפיע מהותית (ס' 1, 117(1א)). לכן זו עסקה לפי ס' 270(4) רישה. (4) המסלול: ועדת ביקורת ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 275(א)). (5) הפגמים: לא הובא לאסיפה; היו\"ר ובעלת השליטה ישבה בוועדה (ס' 115(ב)(1), (ג)), ולכן הוועדה לא הייתה מוסמכת (ס' 279); נעמה לא נמנעה מהדיון (ס' 278). (6) משך: חמש שנים, ולכן אישור מחדש כל שלוש שנים (ס' 275(א1)(1)). אפשר לאשר לחמש שנים רק אם ועדת הביקורת תקבע שהתקופה סבירה (ס' 275(א1)(2)). אם השאלה מבקשת את המסלול <b>המחמיר</b>, כותבים: כל שלוש שנים. (7) התוצאה: העסקה חסרת תוקף כלפי החברה ונעמה (ס' 280(א)), וגם כלפי חברת האח, שידעה (ס' 280(ב))."},{"t":"exam","x":"<b>איך זה נשאל:</b> זה הנושא הנפוץ ביותר במבחנים. הוא מופיע בשאלה פתוחה (\"דונו בסוגיות… יש לבחור בפרוצדורה המחמירה ביותר\"), וגם בשאלות אמריקאיות (העסקת אח של בעל שליטה, חישוב הרוב המיוחד, כלל שלוש השנים). \n<b>מבנה תשובה בחמישה צעדים:</b> (1) <b>מי</b>: נושא משרה (ס' 1), או בעל שליטה (ס' 268, כולל כלל 25%). (2) <b>עניין אישי</b>: קרוב או תאגיד (ס' 1), וחובת גילוי (ס' 269). (3) <b>סיווג</b>: חלופת ס' 270, האם העסקה חריגה (ס' 1), ומי מסווג (ס' 117(1א)). (4) <b>מסלול</b>: ס' 271, 272(א) או 275(א), כולל הרוב המיוחד (א)/(ב) וכלל שלוש השנים עם החריג. בנוסף: הרכב הוועדה (ס' 115, 279), הימנעות (ס' 278), והודעה על עניין אישי (ס' 276). (5) <b>תוצאה</b>: בטלות (ס' 280(א)–(ב)), ביטול ופיצוי (ס' 281), וחובות אמונים או הגינות (ס' 254, 193). \n<b>מה מוריד ניקוד:</b> לבחור ועדה לא נכונה (ביקורת או תגמול); לשכוח את כלל שלוש השנים, או להחיל את החריג על העסקה או על שירותים; לחשב את הרוב המיוחד כולל קולות בעל השליטה."}],"mcq":[{"id":"u7-1","q":"מי מהבאים הוא \"קרוב\" של נושא משרה, לפי חוק החברות?","o":["שותפו העסקי הוותיק","אחיה של אשתו","דודו","בן דודו","חברו הקרוב מילדות"],"a":1,"why":"\"קרוב\" (ס' 1) כולל \"צאצא, אח, אחות או הורה של בן הזוג\". לכן אחיה של אשתו הוא קרוב.","w":["שותף עסקי אינו קרוב. ייתכן שתהיה לו זיקה אחרת, אבל לא \"קרבה\".","","דוד אינו מופיע בהגדרה הסגורה.","בן דוד אינו מופיע בהגדרה.","חבר אינו קרוב."],"secs":["1"]},{"id":"u7-2","q":"בעל מניות המחזיק 3% ממניות חברה ציבורית מצביע באסיפה על עסקה עם בעל השליטה. העסקה טובה מאוד לחברה, ולכן \"תעלה את ערך מניותיו\". האם יש לו עניין אישי באישור העסקה?","o":["לא, כי הוא מחזיק פחות מ-5%","כן, אם הצביע בעד","לא, כי עניין שנובע רק מעצם החזקת מניות בחברה אינו \"עניין אישי\"","כן, כי כל בעל מניה בחברה ציבורית הוא בעל עניין","כן, כי ערך מניותיו יעלה"],"a":2,"why":"ההגדרה בס' 1 מחריגה \"ענין אישי הנובע מעצם החזקת מניות בחברה\".","w":["שיעור ההחזקה אינו המבחן. מחזיק של 30% יכול להיות לא נגוע, ומחזיק של 1% יכול להיות נגוע, למשל אם הוא קרוב של בעל השליטה.","אופן ההצבעה אינו קובע אם יש עניין אישי.","","\"בעל עניין\" (5% ומעלה, דירקטור וכו') הוא מושג אחר. גם בעל 5% אינו נגוע רק בשל ההחזקה.","עליית ערך המניות נובעת מעצם ההחזקה, וזה מוחרג במפורש."],"secs":["1"]},{"id":"u7-3","q":"חברה לייצור ריהוט רוכשת מבעל השליטה בה מכונה מהסוג שהיא רוכשת דרך שגרה, במחיר שוק, בהיקף לא מהותי. בנוסף, החברה רוכשת ממנו דירת נופש לשימוש העובדים, במחיר שוק. מה נכון?","o":["רכישת הדירה אינה חריגה, כי היא במחיר שוק","שתי העסקאות חריגות, כי הן עם בעל השליטה","שתי העסקאות אינן חריגות, כי הן במחיר שוק","עסקה עם בעל שליטה לעולם אינה טעונה אישור אם היא במחיר שוק","רכישת המכונה אינה חריגה, ורכישת הדירה עשויה להיות חריגה כי אינה במהלך העסקים הרגיל"],"a":4,"why":"\"עסקה חריגה\" (ס' 1) מוגדרת בשלוש חלופות. די באחת: שלא במהלך העסקים הרגיל, שלא בתנאי שוק, או השפעה מהותית. רכישת נדל\"ן לנופש אינה במהלך העסקים הרגיל של יצרנית ריהוט, ולכן עשויה להיות חריגה גם במחיר שוק. ועדת הביקורת מסווגת (ס' 117(1א)).","w":["החלופות הן חלופות. מחיר שוק אינו מספיק אם העסקה אינה במהלך העסקים הרגיל.","הזהות של הצד שכנגד אינה הופכת עסקה לחריגה. המבחנים מהותיים (ס' 1).","כאמור, רכישת הדירה אינה במהלך העסקים הרגיל.","עסקה חריגה עם בעל שליטה טעונה אישור לפי ס' 275 גם במחיר שוק.",""],"secs":["1","270"]},{"id":"u7-4","q":"בחברה ציבורית: רמי מחזיק 30% ממניות החברה, יעל 20%, והשאר מפוזר בציבור (אף אחד מבעלי המניות מהציבור אינו מחזיק יותר מ-1%). רמי אינו נושא משרה. האם רמי הוא \"בעל שליטה\" לעניין עסקאות עם בעלי עניין?","o":["לא, כי אינו מחזיק ביותר מ-50%","לא, כי יעל מחזיקה יותר מ-10%","כן, אבל רק אם יעל מסכימה","לא, כי אינו נושא משרה","כן, כי הוא מחזיק 25% או יותר מזכויות ההצבעה ואין אדם אחר המחזיק בלמעלה מ-50%"],"a":4,"why":"לפי ס' 268, \"בעל שליטה\" לעניין הפרק כולל מי שמחזיק 25% או יותר מזכויות ההצבעה, אם אין אדם אחר המחזיק ביותר מ-50%.","w":["ס' 268 מרחיב את ההגדרה ל-25% בתנאי שאין מחזיק ביותר מ-50%.","המגבלה היחידה היא קיומו של מחזיק ביותר מ-50%.","המבחן הוא מבחן ההחזקה, לא הסכמת אחרים.","שליטה אינה תלויה בכהונה כנושא משרה.",""],"secs":["268"]},{"id":"u7-5","q":"בחברה ציבורית, רינה מחזיקה 65% מהמניות. החברה מבקשת להעסיק את בתה של רינה כמנהלת מעבדה (תפקיד שאינו נושא משרה) לארבע שנים, בשכר שוק. מה נכון?","o":["נדרש אישור ועדת הביקורת והדירקטוריון בלבד, לכל ארבע השנים","נדרש אישור ועדת התגמול, הדירקטוריון והאסיפה הכללית ברוב מיוחד, והאישור טעון חידוש אחת לשלוש שנים","נדרש אישור הדירקטוריון בלבד, כי הבת אינה נושאת משרה","אין צורך באישור מיוחד, כי ההעסקה בשכר שוק ואינה חריגה","נדרש אישור כל הגופים, אבל אם ועדת הביקורת קבעה שהתקופה סבירה, האישור תקף לארבע שנים"],"a":1,"why":"העסקת קרוב של בעל השליטה כעובד היא עסקה לפי ס' 270(4) סיפא, ואינה תלויה בכך שהיא חריגה. מסלולה: ועדה (בתנאי העסקה: ועדת התגמול) ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 275(א)). מעל שלוש שנים נדרש אישור אחת לשלוש שנים (ס' 275(א1)(1)), והחריג אינו חל.","w":["חסר אישור האסיפה ברוב מיוחד (ס' 275(א)(3)), וחסר כלל שלוש השנים.","","מה שקובע הוא הזיקה לבעל השליטה (ס' 270(4)), לא מעמדה של הבת.","ס' 270(4) סיפא חל גם כשההעסקה אינה חריגה.","החריג של ס' 275(א1)(2) חל רק על עסקה חריגה לפי ס' 270(4) רישה, ולא על העסקה."],"secs":["270","275"]},{"id":"u7-6","q":"בחברה ציבורית: אלון (בעל השליטה) 55%, קרן השקעות 15%, וציבור 30%. באסיפה שמאשרת עסקה חריגה עם חברה שבבעלות אלון השתתפו: אלון (בעד), הקרן (נגד), ומהציבור 10% (בעד) ו-1% (נגד). לאף אחד מלבד אלון אין עניין אישי. האם ההחלטה התקבלה?","o":["כן, כי המתנגדים מהציבור הם רק 1%","כן, כי הקרן אינה \"ציבור\"","כן, כי 65% הצביעו בעד","לא. בקרב הלא-נגועים 10% בעד מול 16% נגד, והמתנגדים עולים על 2%","לא, כי נדרש רוב של שני שלישים"],"a":3,"why":"לפי ס' 275(א)(3)(א), סופרים רק את מי שאינם בעלי עניין אישי: 10% בעד מול 15% + 1% = 16% נגד. אין רוב. לפי חלופה (ב), המתנגדים (16%) עולים על 2% מכלל זכויות ההצבעה. לכן ההחלטה לא התקבלה.","w":["בחלופה (ב) סופרים את <b>כל</b> המתנגדים הלא-נגועים, כולל הקרן (16%).","הקרן היא בעלת מניות שאינה בעלת עניין אישי, ולכן נספרת.","קולות אלון, בעל העניין, אינם נספרים בחלופה (א).","","החוק אינו דורש שני שלישים, אלא רוב מיוחד בקרב הלא-נגועים או כלל 2%."],"secs":["275"]},{"id":"u7-7","q":"סמנכ\"ל השיווק בחברה ציבורית מחזיק 30% מחברת פרסום, שהחברה רוצה להתקשר עמה בעסקה חריגה. מה מסלול האישור?","o":["דירקטוריון בלבד","ועדת ביקורת, דירקטוריון ואסיפה ברוב מיוחד","אסיפה כללית ברוב רגיל","ועדת ביקורת ולאחר מכן דירקטוריון","ועדת תגמול ולאחר מכן דירקטוריון"],"a":3,"why":"לסמנכ\"ל עניין אישי, כי הוא בעל עניין (5% ומעלה) בתאגיד שהוא הצד שכנגד (ס' 1). זו עסקה לפי ס' 270(1). עסקה חריגה כזו מאושרת בוועדת הביקורת ולאחר מכן בדירקטוריון (ס' 272(א)).","w":["דירקטוריון בלבד מספיק לעסקה <b>שאינה</b> חריגה (ס' 271).","אסיפה ברוב מיוחד נדרשת בעסקה עם בעל שליטה (ס' 275).","המסלול אינו דרך האסיפה.","","ועדת תגמול עוסקת בתנאי כהונה (ס' 270(2)), ולא בעסקה מסחרית."],"secs":["270","272"]},{"id":"u7-8","q":"בת זוגו של המנכ\"ל היא בעלת חברת הסעדה שמספקת לחברה ארוחות בתנאי שוק, בהיקף שגרתי ולא מהותי. מה נכון?","o":["העסקה טעונה אישור הדירקטוריון, אלא אם נקבעה בתקנון דרך אחרת","העסקה טעונה אישור ועדת התגמול","העסקה טעונה ועדת ביקורת ← דירקטוריון ← אסיפה","העסקה אסורה, כי יש בה ניגוד עניינים","העסקה אינה טעונה אישור כלל, כי אינה חריגה"],"a":0,"why":"לנושא המשרה עניין אישי דרך קרוב (ס' 1), ולכן זו עסקה לפי ס' 270(1). עסקה שאינה חריגה טעונה אישור הדירקטוריון, אלא אם נקבעה בתקנון דרך אחרת (ס' 271). בנוסף, חובת הגילוי אינה חלה כשהעניין נובע רק מקרוב בעסקה שאינה חריגה (ס' 269(ב)).","w":["","ועדת התגמול עוסקת בתנאי כהונה, לא בעסקה כזו.","זה מסלול של עסקה עם בעל שליטה (ס' 275).","החוק אינו אוסר עסקאות כאלה, אלא מסדיר את אישורן.","גם עסקה שאינה חריגה לפי ס' 270(1) טעונה אישור (ס' 271)."],"secs":["269","270","271"]},{"id":"u7-9","q":"חברה ציבורית רוצה לחתום עם חברה שבבעלות בעל השליטה על חוזה שכירות ל-10 שנים, שסווג כעסקה חריגה. מה נכון?","o":["אי אפשר לאשר את החוזה ליותר משלוש שנים בשום מקרה","אפשר לאשר אותו לכל תקופה, אם התקבל רוב של 75% באסיפה","החוזה אינו טעון אישור אסיפה, כי מדובר בשכירות","אפשר לאשר אותו ל-10 שנים, אם ועדת הביקורת אישרה שההתקשרות לתקופה כזו סבירה בנסיבות העניין, בנוסף למסלול ס' 275(א)","אפשר לאשר אותו ל-10 שנים באישור הדירקטוריון בלבד"],"a":3,"why":"הכלל הוא אישור מחדש אחת לשלוש שנים (ס' 275(א1)(1)). אבל לעסקה לפי ס' 270(4) רישה, כלומר עסקה חריגה, מותר אישור לתקופה ארוכה יותר אם ועדת הביקורת אישרה שהתקופה סבירה (ס' 275(א1)(2)).","w":["קיים החריג של ס' 275(א1)(2).","הרוב הנדרש הוא הרוב המיוחד של ס' 275(א)(3). ההיתר לתקופה ארוכה תלוי בקביעת ועדת הביקורת.","עסקה חריגה עם בעל שליטה טעונה אסיפה ברוב מיוחד (ס' 275(א)(3)).","","נדרש מסלול ס' 275(א) המלא: ועדה, דירקטוריון ואסיפה ברוב מיוחד."],"secs":["275"]},{"id":"u7-10","q":"מי מהבאים <b>רשאי</b> להיות חבר בוועדת הביקורת של חברה ציבורית?","o":["דירקטור בלתי תלוי שאין לו זיקה לחברה או לבעל השליטה","יו\"ר הדירקטוריון","דירקטור המועסק בידי חברה בשליטת בעל השליטה","דירקטור שעיקר פרנסתו על בעל השליטה","בנו של בעל השליטה, המכהן כדירקטור"],"a":0,"why":"לפי ס' 115(א), רוב חברי הוועדה יהיו דירקטורים בלתי תלויים. דירקטור כזה רשאי לכהן בה. כל האחרים פסולים לפי ס' 115(ב)(1) או 115(ג).","w":["","יו\"ר הדירקטוריון פסול (ס' 115(ב)(1)).","דירקטור המועסק בידי תאגיד בשליטת בעל השליטה פסול (ס' 115(ב)(1)).","דירקטור שעיקר פרנסתו על בעל השליטה פסול (ס' 115(ב)(1)).","בעל השליטה או קרובו לא יהיו חברים בוועדה (ס' 115(ג))."],"secs":["115"]},{"id":"u7-11","q":"בדירקטוריון של חברה ציבורית 7 דירקטורים. ל-5 מהם יש עניין אישי בעסקה חריגה עם נושא משרה. מה נכון?","o":["הדירקטורים בעלי העניין רשאים להשתתף ולהצביע בדירקטוריון, אבל העסקה טעונה גם אישור האסיפה הכללית","רק שני הדירקטורים הלא-נגועים מצביעים, ואישורם מספיק","העסקה עוברת לאישור בית המשפט","העסקה לא תאושר בשום מקרה, כי אין קוורום","העסקה טעונה אישור ועדת התגמול במקום הדירקטוריון"],"a":0,"why":"ס' 278(ב) מתיר לדירקטור להשתתף כשלרוב הדירקטורים עניין אישי, וס' 278(ג) קובע שבמקרה כזה העסקה טעונה גם אישור האסיפה הכללית.","w":["","כשלרוב הדירקטורים עניין אישי, האסיפה נדרשת (ס' 278(ג)).","אין מסלול של אישור בית משפט.","החוק פותר את בעיית הקוורום בס' 278(ב).","ועדת התגמול אינה מחליפה את הדירקטוריון."],"secs":["278"]},{"id":"u7-12","q":"עסקה חריגה עם חברה שבבעלות בעל השליטה אושרה בוועדת הביקורת ובדירקטוריון, אבל לא באסיפה. הצד שכנגד ידע על העניין האישי של בעל השליטה ועל כך שהעסקה לא הובאה לאסיפה. מה נכון?","o":["העסקה חסרת תוקף רק אם נגרם לחברה נזק","העסקה תקפה כלפי הצד שכנגד, כי הוא צד שלישי","העסקה חסרת תוקף כלפי החברה ובעל השליטה, וגם כלפי הצד שכנגד","העסקה תקפה, אבל בעל השליטה ישלם פיצוי","העסקה תקפה, כי אושרה בדירקטוריון"],"a":2,"why":"ס' 280(א): עסקה לפי ס' 270(4) שלא אושרה לפי הפרק חסרת תוקף כלפי החברה ובעל השליטה. ס' 280(ב): היא חסרת תוקף גם כלפי אדם אחר שידע על העניין האישי וידע או היה עליו לדעת על היעדר האישור.","w":["הבטלות אינה מותנית בנזק.","הצד שכנגד ידע, ולכן אינו מוגן (ס' 280(ב)).","","התוצאה הקבועה בחוק היא בטלות (ס' 280), ולא רק פיצוי.","חסר אישור האסיפה ברוב מיוחד (ס' 275(א)(3)), ולכן העסקה לא אושרה כדין."],"secs":["280"]},{"id":"u7-13","q":"בעל מניות השתתף בהצבעה באסיפה על עסקה לפי ס' 275, ולא הודיע אם יש לו עניין אישי באישור העסקה. מה הדין?","o":["קולו נספר כקול של מי שאינו בעל עניין אישי","קולו נספר רק אם הצביע נגד","קולו נספר כקול של בעל עניין אישי","ההחלטה כולה בטלה","הוא לא יצביע וקולו לא יימנה"],"a":4,"why":"ס' 276: בעל מניה שמשתתף בהצבעה לפי ס' 275 יודיע אם יש לו עניין אישי. \"לא הודיע בעל מניה כאמור, לא יצביע וקולו לא יימנה\".","w":["גם זה סיווג שהחוק לא קבע.","כיוון ההצבעה אינו רלוונטי.","החוק אינו מסווג אותו. קולו פשוט אינו נספר.","רק קולו של המצביע נפסל, לא ההחלטה כולה.",""],"secs":["276"]},{"id":"u7-14","q":"מי מחליט אם עסקה של חברה ציבורית עם חברה שלבעל השליטה עניין אישי בה היא \"עסקה חריגה\"?","o":["הדירקטוריון","ועדת הביקורת, על יסוד נימוקים שיפורטו","בעל השליטה","רשות ניירות ערך","האסיפה הכללית"],"a":1,"why":"ס' 117(1א): ועדת הביקורת מחליטה, בנימוקים, לגבי עסקאות לפי ס' 270(1), (4) ו-(4א) אם הן חריגות. היא רשאית לעשות זאת גם לגבי סוג של עסקאות, לפי אמות מידה שתקבע אחת לשנה מראש.","w":["הסיווג מסור לוועדת הביקורת (ס' 117(1א)).","","לבעל השליטה עניין אישי, והוא אינו מוסמך לסווג.","הרשות אינה מסווגת עסקאות.","האסיפה אינה מסווגת."],"secs":["117"]}],"cases":[{"id":"u7-c1","title":"\"שחר תקשורת\" – בעלת שליטה, שירותים והעסקת בן","facts":"\"שחר תקשורת בע\"מ\" היא חברה ציבורית שמספקת שירותי אינטרנט. דנה שחר מחזיקה 34% ממניותיה ומכהנת כיו\"ר הדירקטוריון. קרן \"אופק\" מחזיקה 16%, והשאר (50%) בידי הציבור. אין מחזיק אחר ביותר מ-5%.\nלפני חודש אישר הדירקטוריון הסכם בלעדי לשש שנים עם \"ענן בע\"מ\", שבבעלות מלאה של בן זוגה של דנה. ענן תספק לחברה שירותי אחסון בהיקף של כ-8 מיליון ₪ בשנה, שהם כ-15% מהוצאות החברה. ההסכם אושר קודם בוועדת הביקורת. חברי הוועדה היו שני הדירקטורים החיצוניים, ויוסי, גיסה של דנה (אחיו של בן זוגה), שמכהן כדירקטור. דנה השתתפה בדיון בדירקטוריון \"כדי לענות על שאלות\", והצביעה.\nבנוסף, החברה מבקשת להעסיק את בנה של דנה כראש צוות פיתוח (תפקיד שאינו נושא משרה), בחוזה לארבע שנים.","parts":[{"q":"דונו בסוגיות המשפטיות שמעוררת ההתקשרות עם \"ענן\". יש לבחור בפרוצדורת האישור המחמירה ביותר. [עד 15 שורות]","pts":20,"model":["1. דנה היא \"בעלת שליטה\" לעניין הפרק: היא מחזיקה 34%, כלומר 25% ומעלה, ואין אדם אחר שמחזיק ביותר מ-50% (ס' 268).","2. לדנה עניין אישי, כי בן זוגה הוא \"קרוב\" והבעלים של ענן (ס' 1). עליה לגלות זאת (ס' 269(א)).","3. סיווג: זו התקשרות לקבלת שירותים מקרוב של בעל השליטה, באמצעות חברה שבשליטתו. לכן היא נופלת בסיפת ס' 270(4) גם בלי קשר לחריגותה. סביר שהיא גם חריגה (ס' 1), כי היא בלעדית, לשש שנים, ובהיקף מהותי של 15% מההוצאות. את הסיווג קובעת ועדת הביקורת (ס' 117(1א)).","4. מסלול: ועדת ביקורת ← דירקטוריון ← אסיפה כללית ברוב מיוחד, כלומר רוב מקרב שאינם בעלי עניין אישי המשתתפים בהצבעה, או מתנגדים לא-נגועים עד 2% מכלל זכויות ההצבעה (ס' 275(א)).","5. תקופה: חוזה לשש שנים טעון אישור מחדש כל שלוש שנים (ס' 275(א1)(1)). לפי הפרוצדורה המחמירה בוחרים בכך. החריג של ס' 275(א1)(2) חל רק אם העסקה מסווגת כחריגה לפי הרישה ועדת הביקורת קבעה שהתקופה סבירה. כאן העסקה היא גם קבלת שירותים מבעל השליטה (הסיפא), והסעיף מגביל את החריג לרישה \"בלבד\" – ולכן הדעה העדיפה היא שהחריג אינו חל, וממילא התשובה המחמירה היא אישור מחדש כל 3 שנים.","6. ועדת הביקורת עשויה גם לקבוע הליך תחרותי או הליכים אחרים לפני ההתקשרות (ס' 117(1ב)).","7. בעלי המניות שיצביעו יודיעו אם יש להם עניין אישי (ס' 276). דנה לא תיספר בחלופה (א)."],"check":["דנה בעלת שליטה: ס' 268, כלל 25%","עניין אישי דרך קרוב: ס' 1, וגילוי: ס' 269","ס' 270(4): שירותים (סיפא) או עסקה חריגה (רישה), וסיווג לפי ס' 117(1א)","מסלול ס' 275(א), כולל הרוב המיוחד (א)/(ב)","כלל 3 השנים והחריג שלו: ס' 275(א1)","ס' 276"]},{"q":"אילו פגמים נפלו בהליך האישור, ומה תוצאתם? [עד 15 שורות]","pts":20,"model":["1. הרכב ועדת הביקורת: יוסי, אחיו של בן זוגה של דנה, הוא \"קרוב\" שלה (ס' 1: אח של בן הזוג). בעל השליטה וקרובו לא יהיו חברים בוועדה (ס' 115(ג)).","2. ועדה שאינה עומדת בס' 115 אינה רשאית לתת אישור לפי הפרק (ס' 279). לכן אישור הוועדה פגום. בנוסף, ייתכן שליוסי עצמו עניין אישי (ס' 278(א)).","3. דנה השתתפה והצביעה בדירקטוריון. בעלת עניין אישי לא תהיה נוכחת ולא תצביע. היא רשאית להיות נוכחת רק לשם הצגה, אם היו\"ר קבע זאת (ס' 278(א)). אבל דנה עצמה היא היו\"ר, ובכל מקרה ההצבעה אסורה.","4. ההסכם לא הובא לאסיפה הכללית ברוב מיוחד (ס' 275(א)(3)).","5. תוצאה: העסקה לא אושרה כדין, ונפלו בה פגמים מהותיים. לכן היא חסרת תוקף כלפי החברה וכלפי דנה (ס' 280(א)).","6. כלפי ענן: בעליה הוא בן זוגה של דנה, ולכן ידע על העניין האישי, ומן הסתם ידע או היה עליו לדעת שאין אישור. לכן העסקה חסרת תוקף גם כלפיה (ס' 280(ב)), והחברה רשאית לבטל ולתבוע פיצויים (ס' 281).","7. דנה הפרה את חובת האמונים כנושאת משרה (ס' 254(א)(1), 256), ואת חובת ההגינות כבעלת שליטה (ס' 193)."],"check":["יוסי קרוב (ס' 1), ולכן פסול לוועדה (ס' 115(ג))","ס' 279: ועדה פסולה אינה מאשרת","השתתפות דנה: ס' 278(א)","היעדר אישור האסיפה: ס' 275(א)(3)","בטלות: ס' 280(א)–(ב), וביטול ופיצוי: ס' 281","אחריות דנה: ס' 254, 193"]},{"q":"מה נדרש כדי להעסיק את בנה של דנה? הניחו שבאסיפה השתתפו דנה (בעד), קרן \"אופק\" (נגד), ו-6% מהציבור (בעד). האם ההחלטה תתקבל? [עד 15 שורות]","pts":20,"model":["1. העסקת קרוב (בן, כלומר צאצא, ס' 1) של בעלת השליטה כעובד, כשאינו נושא משרה, היא עסקה לפי ס' 270(4) סיפא: \"ואם הוא עובד החברה ואינו נושא משרה בה – באשר להעסקתו\". היא טעונה אישור גם אם אינה חריגה.","2. מסלול: ועדת תגמול (בעניין תנאי העסקה) ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 275(א)).","3. חוזה לארבע שנים טעון אישור מחדש אחת לשלוש שנים (ס' 275(א1)(1)). החריג של (א1)(2) אינו חל, כי אינו עסקה חריגה לפי הרישה.","4. דנה לא תשתתף בדיונים בוועדה ובדירקטוריון (ס' 278(א)). עליה לגלות את עניינה (ס' 269).","5. ההצבעה באסיפה: לדנה עניין אישי, ולכן קולה אינו נספר בחלופה (א). בקרב הלא-נגועים יש 6% בעד מול 16% נגד (הקרן), ולכן אין רוב.","6. חלופה (ב): המתנגדים הלא-נגועים הם 16%, יותר מ-2% מכלל זכויות ההצבעה, ולכן גם היא לא מתקיימת.","7. מסקנה: ההחלטה לא תתקבל, ואם הבן יועסק בכל זאת, ההתקשרות חסרת תוקף (ס' 280(א))."],"check":["ס' 270(4) סיפא: העסקת קרוב, בלי צורך בחריגות","ועדת תגמול ← דירקטוריון ← אסיפה: ס' 275(א)","3 שנים, והחריג אינו חל","הימנעות: ס' 278","חישוב נכון של שתי החלופות: ס' 275(א)(3)(א)–(ב)","מסקנה ותוצאה: ס' 280"]}]},{"id":"u7-c2","title":"\"רימון פארם\" – עסקאות עם נושאי משרה","facts":"\"רימון פארם בע\"מ\" היא חברה ציבורית בתחום הפרמצבטיקה. אין בה בעל שליטה: המחזיק הגדול ביותר מחזיק 12%. בדירקטוריון 7 דירקטורים.\n(1) גלית, סמנכ\"לית הכספים, נשואה לבעלים של חברת הסעדה. חברת ההסעדה סיפקה לחברה ארוחות לעובדים בהיקף של 300,000 ₪ בשנה, במחיר השוק. גלית לא דיווחה על כך.\n(2) הדירקטוריון מבקש לרכוש מבנה מעבדות ב-60 מיליון ₪ מקבוצת \"אורנים נכסים\". ארבעה מהדירקטורים מחזיקים כל אחד 8% במניות אורנים. ועדת הביקורת סיווגה את העסקה כחריגה.\n(3) מנהל הרכש, שכפוף לסמנכ\"ל התפעול, הוא אחיו של אחד הספקים של החברה.","parts":[{"q":"דונו בהתקשרות עם חברת ההסעדה ובחובותיה של גלית. [עד 15 שורות]","pts":20,"model":["1. גלית היא נושאת משרה, כי היא כפופה במישרין למנכ\"ל (ס' 1).","2. בעלה הוא \"קרוב\", ולכן לגלית עניין אישי בעסקה של החברה עם תאגיד שקרובה בעל עניין בו (ס' 1). זו עסקה לפי ס' 270(1).","3. סיווג: ועדת הביקורת מסווגת (ס' 117(1א)). ארוחות לעובדים, במחיר שוק ובהיקף לא מהותי, הן ככל הנראה עסקה שאינה חריגה (ס' 1).","4. עסקה שאינה חריגה מאושרת בדירקטוריון, אלא אם נקבעה בתקנון דרך אחרת (ס' 271).","5. חובת גילוי: העניין נובע רק מקרוב, בעסקה שאינה חריגה, ולכן חובת הגילוי לפי ס' 269(א) אינה חלה (ס' 269(ב)). עם זאת, אם העסקה תסווג כחריגה, החובה חלה. חובת האמונים (ס' 254(א)(1), (4)) מצדיקה בכל מקרה גילוי.","6. אם העסקה חריגה: ועדת ביקורת ← דירקטוריון (ס' 272(א)), וגלית נמנעת (ס' 278(א)).","7. בלי אישור: העסקה חסרת תוקף כלפי החברה וכלפי נושאת המשרה (ס' 280(א)), וכלפי חברת ההסעדה אם ידעה (ס' 280(ב))."],"check":["גלית נושאת משרה: ס' 1","עניין אישי דרך קרוב: ס' 1, ס' 270(1)","סיווג: ס' 117(1א), ומסלול: ס' 271","ס' 269(ב): פטור מגילוי והסייג לו","מסלול חלופי אם העסקה חריגה: ס' 272(א), 278","ס' 280"]},{"q":"מהו מסלול האישור לרכישת המבנה? [עד 15 שורות]","pts":20,"model":["1. כל אחד מארבעת הדירקטורים הוא נושא משרה (ס' 1), ומחזיק 8% באורנים, כלומר הוא \"בעל עניין\" בתאגיד (5% ומעלה). לכן לכל אחד מהם עניין אישי (ס' 1). זו עסקה לפי ס' 270(1).","2. אין בחברה בעל שליטה, ולכן ס' 270(4) אינו חל. גם צירוף החזקות לפי ס' 268 נוגע להחזקה בחברה עצמה, ולא בצד שכנגד.","3. ועדת הביקורת סיווגה את העסקה כחריגה, ולכן המסלול הוא ועדת ביקורת ← דירקטוריון (ס' 272(א)).","4. הימנעות: בעלי העניין האישי לא יהיו נוכחים ולא יצביעו בוועדה ובדירקטוריון (ס' 278(א)). אבל ל-4 מתוך 7 הדירקטורים, כלומר לרובם, יש עניין אישי. לכן הם רשאים להשתתף בדיון ובהצבעה בדירקטוריון (ס' 278(ב)), ובמקרה כזה העסקה טעונה גם אישור האסיפה הכללית (ס' 278(ג)).","5. אם בוועדת הביקורת יש חברים מבין ארבעת הדירקטורים, יש לבחון אם לרוב חבריה עניין אישי (ס' 278(ב)), ולוודא שהוועדה עומדת בס' 115 (ס' 279).","6. ארבעת הדירקטורים חייבים לגלות את עניינם בלי דיחוי (ס' 269(א)). העסקה חייבת להיות לטובת החברה (רישת ס' 270).","7. כלפי צד שלישי: אורנים תהיה מוגנת אם תקבל אישור דירקטוריון שכל האישורים התקבלו (ס' 282)."],"check":["עניין אישי דרך החזקה בתאגיד: ס' 1, ס' 270(1)","ס' 270(4) אינו חל, כי אין בעל שליטה","עסקה חריגה: ס' 272(א)","ס' 278(ב)–(ג): רוב הדירקטורים נגועים, ולכן נדרשת גם אסיפה","גילוי: ס' 269","ס' 282"]},{"q":"האם ההתקשרויות עם הספק שאחיו הוא מנהל הרכש כפופות לפרק העסקאות עם בעלי עניין? [עד 15 שורות]","pts":20,"model":["1. הפרק חל על עסקאות שלנושא משרה עניין אישי בהן (ס' 270(1)).","2. מנהל הרכש כפוף לסמנכ\"ל התפעול, ולא במישרין למנכ\"ל. לכן אינו \"נושא משרה\" (ס' 1), אלא אם הוא ממלא בפועל תפקיד של סגן מנכ\"ל או תפקיד מקביל.","3. לכן מסלולי ס' 271–272 אינם חלים, אף שאחיו הוא \"קרוב\".","4. עם זאת, מנהל הרכש הוא עובד, וחלות עליו חובות אמון לפי דיני העבודה והשליחות, וחובת תום הלב. ניגוד עניינים מצדיק נהלים פנימיים: גילוי, הרחקתו מההחלטה ובקרת מחירים.","5. ועדת הביקורת רשאית לקבוע הסדרים לתלונות על ליקויים (ס' 117(6)), ולהציע לדירקטוריון דרכים לתיקון ליקויים בניהול (ס' 117(1)).","6. מסקנה: הפרק אינו חל, אבל החברה צריכה לטפל בניגוד העניינים במסגרת הבקרה הפנימית."],"check":["מבחן נושא המשרה: כפיפות במישרין למנכ\"ל (ס' 1)","לכן ס' 270(1) אינו חל","התייחסות לחובות כעובד ולבקרה פנימית","ס' 117(1), (6)"]}]}]},{"id":"u8","title":"תגמול נושאי משרה","short":"תגמול נושאי משרה","blurb":"לבנות ולאשר מדיניות תגמול, ולבחור את מסלול האישור הנכון לתנאי כהונה של סמנכ\"ל, מנכ\"ל, דירקטור ובעל שליטה, כולל פסקת ההתגברות וחריגיה.","secs":["267א","267ב","118א","118ב","272","273","275"],"blocks":[{"t":"h","x":"למה התגמול מוסדר בנפרד?"},{"t":"p","x":"שכר הבכירים הוא המקום שבו בעיית הנציג בולטת במיוחד: נושאי המשרה \"קובעים לעצמם\" את התגמול, או שבעל השליטה קובע אותו למקורביו. תיקון 20 לחוק (תשע\"ג) יצר לחברות ציבוריות ולחברות איגרות חוב מנגנון בשלוש שכבות: (1) <b>ועדת תגמול</b> בלתי תלויה; (2) <b>מדיניות תגמול</b> כללית, שמאושרת בדירקטוריון ובאסיפה; (3) <b>אישור פרטני</b> של כל התקשרות, במסלול שתלוי בזהות נושא המשרה. התגמול כולל הרבה יותר משכר:"},{"t":"law","law":"חוק החברות","sec":"1","x":"”תנאי כהונה והעסקה“, של נושא משרה – תנאי כהונה או העסקה של נושא משרה, לרבות מתן פטור, ביטוח, התחייבות לשיפוי או שיפוי לפי היתר שיפוי, מענק פרישה, וכל הטבה, תשלום אחר או התחייבות לתשלום כאמור, הניתנים בשל כהונה או העסקה כאמור;"},{"t":"h","x":"ועדת התגמול (ס' 118א–118ב)"},{"t":"law","law":"חוק החברות","sec":"118א(ב)","x":"(ב) מספר חבריה של ועדת תגמול לא יפחת משלושה, כל הדירקטורים החיצוניים יהיו חברים בה והם יהיו רוב חבריה, ושאר חבריה יהיו דירקטורים שתנאי כהונתם והעסקתם הם בהתאם להוראות שנקבעו לפי סעיף 244"},{"t":"list","x":["<b>חובה</b> בחברה ציבורית ובחברה פרטית שהיא חברת איגרות חוב (ס' 118א(א)).","<b>הרכב</b>: לפחות שלושה חברים. כל הדירקטורים החיצוניים חברים בה, והם <b>רוב</b> חבריה. היו\"ר הוא דירקטור חיצוני (ס' 118א(ב)).","<b>פסולים</b>: ס' 115(ב)–(ה) חלים עליה בשינויים המחויבים (ס' 118א(ג)). לכן יו\"ר הדירקטוריון, בעל השליטה וקרובו, ודירקטור שמועסק בחברה או אצל בעל השליטה, אינם חברים בה.","<b>ועדת ביקורת</b> שעומדת בתנאי ההרכב של ועדת תגמול יכולה לשמש גם כוועדת תגמול (ס' 118א(ד))."]},{"t":"law","law":"חוק החברות","sec":"118ב","x":"(1) להמליץ לדירקטוריון על מדיניות התגמול לנושאי משרה, כמשמעותה בסעיף 267א(א), וכן להמליץ לו, אחת לשלוש שנים, בעניין אישור המשך תוקפה של מדיניות תגמול שנקבעה לתקופה העולה על שלוש שנים, כאמור בסעיף 267א(ד); (2) להמליץ לדירקטוריון על עדכונה, מעת לעת, של מדיניות התגמול ולבחון את יישומה; (3) להחליט אם לאשר עסקאות באשר לתנאי כהונה והעסקה של נושאי משרה הטעונות אישור של ועדת התגמול לפי סעיפים 272, 273 ו־275; (4) לפטור עסקה מאישור האסיפה הכללית, כאמור בסעיף 272(ג1)(3)."},{"t":"trap","x":"<b>\"ממליצה\" או \"מאשרת\"?</b> במדיניות התגמול הוועדה <b>ממליצה</b> והדירקטוריון <b>קובע</b> (ס' 118ב(1), 267א(א)). בעסקה פרטנית, הוועדה <b>מחליטה אם לאשר</b> (ס' 118ב(3)), וזה שלב חובה. \"הדירקטוריון אישר לאחר המלצת ועדת התגמול\" הוא ניסוח שמסמן פגם בבחינה: נדרש <b>אישור</b> של הוועדה, ולעיתים גם אישור האסיפה."},{"t":"case","name":"תנ\"ג 18994-07-15 דה לנגה נ' החברה לישראל בע\"מ ואח'","x":"בעלי השליטה שילמו לנושאי המשרה מענקים של כ-55 מיליון ₪ \"באופן פרטי\". נקבע שתגמול נושאי משרה בתאגיד מדווח כפוף להסדר המפורט בחוק (מדיניות תגמול, ועדת תגמול ואישורים), ושבעל שליטה אינו רשאי לעקוף אותו בתשלום \"פרטי\". החלטת הדירקטוריון שלא לתבוע לא חסתה תחת כלל שיקול הדעת העסקי, כי לא הוכח שהתקבלה באופן מיודע ובלי ניגוד עניינים. התביעה הנגזרת אושרה."},{"t":"h","x":"מדיניות התגמול (ס' 267א)"},{"t":"law","law":"חוק החברות","sec":"267א(א)","x":"(א) דירקטוריון חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב יקבע מדיניות לעניין תנאי כהונה והעסקה של נושאי משרה בחברה (בחוק זה – מדיניות התגמול), לאחר ששקל את המלצות ועדת התגמול שהוגשו לו לפי סעיף 118ב(1); מדיניות התגמול טעונה אישור האסיפה הכללית."},{"t":"law","law":"חוק החברות","sec":"267א(ב)","x":"(ב) באישור האסיפה הכללית בחברה ציבורית, לפי סעיף קטן (א), יתקיים אחד מאלה: (1) במניין קולות הרוב באסיפה הכללית ייכללו רוב מכלל קולות בעלי המניות שאינם בעלי השליטה בחברה או בעלי עניין אישי באישור מדיניות התגמול, המשתתפים בהצבעה; במניין כלל הקולות של בעלי המניות האמורים לא יובאו בחשבון קולות הנמנעים; … (2) סך קולות המתנגדים מקרב בעלי המניות האמורים בפסקה (1) לא עלה על שיעור של שני אחוזים מכלל זכויות ההצבעה בחברה;"},{"t":"law","law":"חוק החברות","sec":"267א(ג)","x":"(ג) על אף האמור בסעיפים קטנים (א) ו־(ב), דירקטוריון החברה, למעט בחברה נכדה ציבורית, רשאי לקבוע את מדיניות התגמול גם אם האסיפה הכללית התנגדה לאישורה, ובלבד שוועדת התגמול ולאחריה הדירקטוריון החליטו, על יסוד נימוקים מפורטים ולאחר שדנו מחדש במדיניות התגמול, כי אישור מדיניות התגמול על אף התנגדות האסיפה הכללית הוא לטובת החברה;"},{"t":"steps","title":"קביעת מדיניות התגמול","x":["<b>ועדת התגמול ממליצה</b> על מדיניות (ס' 118ב(1)).","<b>הדירקטוריון קובע</b> את המדיניות, אחרי ששקל את ההמלצות (ס' 267א(א)), ולפי השיקולים והתכנים של ס' 267ב ותוספת ראשונה א'.","<b>האסיפה הכללית מאשרת ברוב מיוחד</b>: רוב מקרב מי שאינם בעלי השליטה ואינם בעלי עניין אישי המשתתפים בהצבעה, בלי למנות נמנעים, <b>או</b> מתנגדים מקרבם שאינם עולים על 2% מכלל זכויות ההצבעה (ס' 267א(ב)).","<b>אם האסיפה מתנגדת</b>: ועדת התגמול ואחריה הדירקטוריון דנים מחדש, ורשאים לקבוע את המדיניות בכל זאת, אם החליטו בנימוקים מפורטים שהדבר לטובת החברה (ס' 267א(ג)). זו <b>\"פסקת ההתגברות\" על המדיניות</b>. היא <b>אינה חלה</b> בחברה נכדה ציבורית.","<b>תוקף</b>: מדיניות לתקופה של יותר משלוש שנים טעונה אישור <b>אחת לשלוש שנים</b>, באותה דרך (ס' 267א(ד)). הדירקטוריון גם בוחן אותה מעת לעת, ובמיוחד כשחל שינוי מהותי בנסיבות (ס' 267א(ה))."]},{"t":"p","x":"<b>\"חברה נכדה ציבורית\"</b> (ס' 267א(ג)) היא חברה ציבורית שנשלטת בידי חברה ציבורית (או חברת איגרות חוב), שנשלטת בעצמה בידי חברה ציבורית או חברת איגרות חוב אחרת, שיש לה בעל שליטה. כלומר, זו הקומה <b>השלישית</b> בפירמידה. המחוקק שלל ממנה את ההתגברות, כי בפירמידה ההון של בעל השליטה בקומה התחתונה קטן מאוד, וקול המיעוט שם חשוב במיוחד."},{"t":"h","x":"מה כוללת המדיניות? (ס' 267ב ותוספת ראשונה א')"},{"t":"law","law":"חוק החברות","sec":"267ב(א)","x":"(א) מדיניות התגמול תיקבע בין השאר לפי שיקולים אלה: (1) קידום מטרות החברה, תכנית העבודה שלה ומדיניותה בראייה ארוכת טווח; (2) יצירת תמריצים ראויים לנושאי המשרה בחברה, בהתחשב, בין השאר, במדיניות ניהול הסיכונים של החברה; (3) גודל החברה ואופי פעילותה; (4) לעניין תנאי כהונה והעסקה הכוללים רכיבים משתנים – תרומתו של נושא המשרה להשגת יעדי החברה ולהשאת רווחיה, והכל בראייה ארוכת טווח ובהתאם לתפקידו של נושא המשרה."},{"t":"table","head":["תוספת ראשונה א' – חלק א' (עניינים שחובה להתייחס אליהם)","תוספת ראשונה א' – חלק ב' (הוראות שחובה לקבוע)"],"rows":[["השכלה, כישורים, מומחיות, ניסיון והישגים","רכיבים משתנים: מבוססים על ביצועים ארוכי טווח וקריטריונים מדידים. חריג: חלק לא מהותי, או עד שלוש משכורות בשנה, לפי קריטריונים שאינם מדידים. הפרט אינו חל על נושא משרה הכפוף למנכ\"ל"],["התפקיד, תחומי האחריות והסכמי שכר קודמים","יחס בין הרכיבים המשתנים לקבועים, ותקרה לשווי הרכיבים המשתנים"],["היחס בין עלות התגמול לשכר הממוצע והחציוני של שאר העובדים ועובדי הקבלן, והשפעת הפערים על יחסי העבודה","תניית השבה (Clawback): החזר סכומים ששולמו על בסיס נתונים שהתבררו כמוטעים והוצגו מחדש בדוחות"],["ברכיבים משתנים: אפשרות להפחתה לפי שיקול דעת הדירקטוריון, ותקרה לשווי המימוש של רכיבים הוניים","תקופת החזקה או הבשלה מזערית לרכיבים הוניים"],["במענקי פרישה: תקופת הכהונה, ביצועי החברה, תרומת נושא המשרה ונסיבות הפרישה","תקרה למענקי פרישה"]]},{"t":"h","x":"מסלולי אישור של התקשרות פרטנית"},{"t":"p","x":"אחרי שקיימת מדיניות, כל התקשרות עם נושא משרה בעניין תנאי כהונתו מאושרת במסלול שתלוי ב<b>זהותו</b>. השאלה הראשונה בבחינה היא אפוא: <b>מי</b> נושא המשרה? אחר כך שואלים <b>האם התנאים תואמים את המדיניות</b>."},{"t":"table","head":["נושא המשרה (חברה ציבורית)","תואם מדיניות","חורג מהמדיניות","התגברות על האסיפה?"],"rows":[["נושא משרה שאינו דירקטור ואינו מנכ\"ל (ס' 270(2), 272(ג))","ועדת תגמול ← דירקטוריון","ועדת תגמול ← דירקטוריון (שיקולי ס' 267ב ותוספת ראשונה א') ← אסיפה ברוב מיוחד (ס' 272(ג)(2))","<b>כן</b>, ס' 272(ג)(3), למעט בחברה נכדה ציבורית"],["מנכ\"ל (ס' 272(ג1))","ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד","כנ\"ל, וגם שיקולי ס' 272(ג)(2)(א)","<b>כן</b>, ס' 272(ג1)(1)(ג) מחיל את ס' 272(ג)(3)"],["מועמד למנכ\"ל שעומד בתנאי אי-התלות של ס' 240(ב)","ועדת תגמול ← דירקטוריון. הוועדה רשאית לפטור מאסיפה אם הבאה לאסיפה תסכל את ההתקשרות (ס' 272(ג1)(3))","אין פטור מאסיפה: הפטור מותנה בהתאמה למדיניות","—"],["דירקטור (ס' 270(3), 273)","ועדת תגמול ← דירקטוריון ← אסיפה (רוב רגיל)","כנ\"ל, ובאסיפה רוב מיוחד (ס' 273(ב))","<b>לא</b>"],["בעל שליטה או קרובו (כנושא משרה או כעובד) (ס' 270(4), 275)","ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 275(א)); אישור מחדש כל 3 שנים (ס' 275(א1)(1))","כנ\"ל, וגם שיקולי ס' 272(ג)(2)(א) (ס' 275(ג1))","<b>לא</b>"],["שינוי לא מהותי בעסקה קיימת לפי ס' 270(2), כולל מנכ\"ל (ס' 272(ד))","ועדת התגמול בלבד, אם אישרה שהשינוי אינו מהותי","—","—"]]},{"t":"steps","title":"נושא משרה שאינו דירקטור ואינו מנכ\"ל (למשל סמנכ\"ל)","x":["<b>ועדת התגמול</b> ← <b>הדירקטוריון</b>, בהתאם למדיניות (ס' 272(ג)(1)–(2)).","<b>חריגה מהמדיניות \"במקרים מיוחדים\"</b>: הוועדה והדירקטוריון שוקלים את ס' 267ב(א) ואת התוספת (ס' 272(ג)(2)(א)), ו<b>האסיפה</b> מאשרת ברוב מיוחד לפי ס' 267א(ב) (ס' 272(ג)(2)(ב)).","<b>האסיפה התנגדה?</b> ועדת התגמול ולאחריה הדירקטוריון רשאים לאשר בכל זאת \"במקרים מיוחדים\", בנימוקים מפורטים, אחרי שדנו מחדש ובחנו את התנגדות האסיפה (ס' 272(ג)(3)). אין התגברות בחברה נכדה ציבורית."]},{"t":"law","law":"חוק החברות","sec":"272(ג)(3)","x":"(3) על אף הוראות פסקה (2), בחברה, למעט חברה נכדה ציבורית כהגדרתה בסעיף 267א(ג), ועדת התגמול ולאחריה הדירקטוריון רשאים, במקרים מיוחדים, לאשר עסקה כאמור באותה פסקה גם אם האסיפה הכללית התנגדה לאישור העסקה, ובלבד שוועדת התגמול ולאחריה הדירקטוריון החליטו על כך, על יסוד נימוקים מפורטים, לאחר שדנו מחדש בעסקה ובחנו בדיון כאמור, בין השאר, את התנגדות האסיפה הכללית."},{"t":"steps","title":"המנכ\"ל (ס' 272(ג1))","x":["<b>ועדת התגמול ← דירקטוריון ← אסיפה ברוב מיוחד</b>. האסיפה נדרשת <b>גם כשהתנאים תואמים את המדיניות</b> (ס' 272(ג1)(1)), בכפוף לפטור למועמד חיצוני (ס' 272(ג1)(3)) ולפסקת ההתגברות (ס' 272(ג1)(1)(ג)), שמפורטים להלן.","<b>חריגה מהמדיניות</b>: אפשרית במקרים מיוחדים, בכפוף לשיקולים של ס' 272(ג)(2)(א) (ס' 272(ג1)(2)).","<b>התנגדות האסיפה</b>: \"יחולו הוראות סעיף קטן (ג)(3)\", כלומר פסקת ההתגברות חלה גם על המנכ\"ל (ס' 272(ג1)(1)(ג)).","<b>מועמד חיצוני</b>: ועדת התגמול רשאית לפטור מאישור האסיפה התקשרות עם מועמד למנכ\"ל שאין לו זיקה כאמור בס' 240(ב), אם מצאה בנימוקים שהבאה לאסיפה תסכל את ההתקשרות, ובלבד שהעסקה תואמת את המדיניות (ס' 272(ג1)(3), 118ב(4))."]},{"t":"law","law":"חוק החברות","sec":"272(ג1)(3)","x":"(3) על אף הוראות פסקה (1)(ג), ועדת התגמול רשאית לפטור מאישור האסיפה הכללית עסקה עם מי שמועמד לכהן כמנהל כללי של החברה שמתקיים לגביו האמור בסעיף 240(ב), אם מצאה, על יסוד נימוקים שפירטה, כי הבאת העסקה לאישור האסיפה הכללית תסכל את ההתקשרות, ובלבד שהעסקה תואמת את מדיניות התגמול."},{"t":"case","name":"ע\"ע 28404-12-22 ו-ע\"ע 2603-02-23 ג. וילי-פוד אינטרנשיונל בע\"מ ואח' נ' אירם גרייבר","x":"הסכם ההעסקה של מנכ\"ל חברה ציבורית סטה ממדיניות התגמול ולא קיבל את האישור המשולש הנדרש, ובכלל זה את אישור האסיפה הכללית. לכן נקבע שהוא חסר תוקף במישור דיני החברות (ס' 280). בית הדין בחן גם את ההשלכות במישור דיני העבודה, ובכלל זה את השבת התשלומים."},{"t":"p","x":"<b>דירקטור</b> (ס' 273): תנאי כהונה של דירקטור, כולל העסקתו בתפקיד נוסף, טעונים ועדת תגמול ← דירקטוריון ← <b>אסיפה כללית</b>. אם התנאים תואמים את המדיניות, די ברוב רגיל באסיפה. בחריגה מהמדיניות נדרש רוב מיוחד לפי ס' 267א(ב) (ס' 273(ב)). <b>אין</b> פסקת התגברות. בחברה פרטית שאינה חברת איגרות חוב, המסלול הוא דירקטוריון ← אסיפה (ס' 273(א))."},{"t":"p","x":"<b>בעל שליטה או קרובו</b> (ס' 270(4), 275): תנאי כהונתו כנושא משרה, או העסקתו כעובד, טעונים ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד לפי ס' 275(א)(3), כלומר רוב מקרב שאינם בעלי עניין אישי, או מתנגדים עד 2%. ההתקשרות כפופה למדיניות (ס' 275(ג1)), ו<b>מחודשת כל שלוש שנים</b> אם היא ארוכה מזה (ס' 275(א1)(1)). החריג של ס' 275(א1)(2) חל רק על עסקה חריגה, ולא על תנאי כהונה. <b>אין</b> פסקת התגברות: ס' 272(ג)(3) חל רק על עסקאות לפי ס' 270(2). כשבעל השליטה הוא גם מנכ\"ל או דירקטור, חלים במצטבר כל המסלולים (ס' 277)."},{"t":"law","law":"חוק החברות","sec":"272(ד)","x":"(ד) על אף האמור בסעיפים קטנים (א), (ג) ו־(ג1), עסקה שמתקיים בה האמור בסעיף 270(2) והיא שינוי של עסקה קיימת, טעונה אישור של ועדת ביקורת או ועדת תגמול, לפי העניין בלבד, אם הוועדה האמורה אישרה כי השינוי בתנאי העסקה אינו מהותי ביחס לעסקה הקיימת."},{"t":"table","head":["פסקת ההתגברות","חלה?","מקור"],"rows":[["מדיניות התגמול שהאסיפה דחתה","כן, למעט בחברה נכדה ציבורית","ס' 267א(ג)"],["נושא משרה שאינו דירקטור ואינו מנכ\"ל","כן, למעט בחברה נכדה ציבורית","ס' 272(ג)(3)"],["מנכ\"ל","כן, מכוח ההפניה, ובכפוף לאותו סייג","ס' 272(ג1)(1)(ג)"],["דירקטור","לא","ס' 273"],["בעל שליטה או קרובו","לא","ס' 275"]]},{"t":"example","title":"דוגמה: שכר ליו\"ר בעלת השליטה שתכהן גם כמנכ\"לית","x":"<b>עובדות:</b> נעמה מחזיקה 48% בחברה ציבורית ומכהנת כיו\"ר. הדירקטוריון החליט, \"לאחר המלצת ועדת התגמול\", לשלם לה 150,000 ₪ לחודש, רכב ואופציות, בתמורה לכהונה כיו\"ר וכמנכ\"לית.\n<b>פתרון:</b> (1) <b>כפל תפקידים</b>: בחברה ציבורית המנכ\"ל לא יכהן כיו\"ר (ס' 95(א)–(ב)), אלא אם האסיפה החליטה כך ברוב מיוחד, לתקופות של עד שלוש שנים כל אחת (ס' 121(ג)). (2) נעמה היא <b>בעלת שליטה</b> (ס' 268), ולכן תנאי כהונתה הם עסקה לפי ס' 270(4). (3) המסלול: <b>אישור</b> ועדת התגמול, ולא רק המלצה ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 275(א)), לפי מדיניות התגמול (ס' 275(ג1)). חלים במצטבר גם ס' 272(ג1) כמנכ\"לית וס' 273 כדירקטורית (ס' 277). (4) אישור מחדש כל שלוש שנים (ס' 275(א1)(1)). (5) נעמה נמנעת (ס' 278) ומגלה (ס' 269). (6) בלי אישורים, ההתקשרות חסרת תוקף (ס' 280(א)). <b>אין</b> התגברות, כי ס' 272(ג)(3) אינו חל על בעל שליטה."},{"t":"example","title":"דוגמה: סמנכ\"ל שהאסיפה דחתה את תנאיו","x":"<b>עובדות:</b> חברה ציבורית, שאינה חברה נכדה ציבורית, רוצה לגייס סמנכ\"ל טכנולוגיות במענק חתימה שחורג מהתקרה שבמדיניות. האסיפה דחתה את ההתקשרות.\n<b>פתרון:</b> הסמנכ\"ל הוא נושא משרה שאינו דירקטור (ס' 270(2)). החריגה מהמדיניות חייבה את שיקולי ס' 267ב ואת אישור האסיפה ברוב מיוחד (ס' 272(ג)(2)). אחרי הדחייה, ועדת התגמול ולאחריה הדירקטוריון רשאים לאשר \"במקרים מיוחדים\", על יסוד נימוקים מפורטים, אחרי שדנו מחדש ובחנו את התנגדות האסיפה (ס' 272(ג)(3)). אילו הייתה זו חברה נכדה ציבורית, ההתגברות לא הייתה אפשרית."},{"t":"trap","x":"<b>מלכודת \"התגברות לכולם\":</b> פסקת ההתגברות חלה על מדיניות התגמול (ס' 267א(ג)), על נושא משרה שאינו דירקטור (ס' 272(ג)(3)) ועל המנכ\"ל (ס' 272(ג1)(1)(ג)). היא <b>לא</b> חלה על דירקטור, <b>לא</b> על בעל שליטה או קרובו, ו<b>לא</b> בחברה נכדה ציבורית."},{"t":"trap","x":"<b>מלכודת \"שינוי לא מהותי\":</b> ההקלה של ס' 272(ד), שלפיה די באישור הוועדה בלבד, חלה רק על <b>שינוי</b> של עסקה <b>קיימת</b> לפי ס' 270(2), כלומר נושא משרה שאינו דירקטור, כולל מנכ\"ל. היא אינה חלה על דירקטור (ס' 273) או על בעל שליטה (ס' 275)."},{"t":"exam","x":"<b>איך זה נשאל:</b> \"פרטו מה צריך לקרות בחברה כדי ש-X יקבל את השכר וההטבות\" (מבחן \"טבעונית\"), או שאלה אמריקאית על \"פסקת ההתגברות\" (מבחן \"יוחנן עוף\"). \n<b>מבנה תשובה:</b> (1) <b>זהות X</b>: נושא משרה (ס' 1), ואיזה סוג: מנכ\"ל, דירקטור, בעל שליטה (ס' 268) או קרוב. (2) <b>הסיווג</b>: \"תנאי כהונה והעסקה\" (ס' 1), ולכן ס' 270(2), (3) או (4). (3) <b>המסלול</b>: ס' 272(ג), 272(ג1), 273 או 275, כולל \"אישור\" ועדת התגמול ולא רק המלצה, רוב מיוחד (ס' 267א(ב) או 275(א)(3)), ושלוש שנים (ס' 275(א1)). (4) <b>מדיניות התגמול</b>: התאמה או חריגה (ס' 267א, 267ב). (5) <b>התגברות</b>: האם קיימת? (6) <b>היבטים נלווים</b>: כפל יו\"ר ומנכ\"ל (ס' 95, 121(ג)), הימנעות (ס' 278), תוצאת היעדר אישור (ס' 280). \n<b>מה מוריד ניקוד:</b> להחיל את ההתגברות על בעל שליטה; לשכוח שבמנכ\"ל האסיפה נדרשת גם כשהתנאים תואמים את המדיניות (למעט הפטור של ס' 272(ג1)(3)); לבלבל בין ועדת ביקורת לוועדת תגמול בתנאי כהונה."}],"mcq":[{"id":"u8-1","q":"מה מבטא את הרעיון של \"פסקת ההתגברות\" בדיני התאגידים?","o":["היכולת של האסיפה הכללית לבטל החלטת דירקטוריון שאושרה ברוב רגיל","היכולת של הדירקטוריון לאשר תנאי כהונה של דירקטור על אף התנגדות האסיפה","היכולת של ועדת התגמול ולאחריה הדירקטוריון לאשר, במקרים מיוחדים ובנימוקים מפורטים, תנאי כהונה של מנכ\"ל חברה ציבורית, על אף התנגדות האסיפה הכללית","היכולת של בעל השליטה לאשר את שכרו בניגוד לעמדת ועדת התגמול","היכולת לאשר עסקה עם בעל שליטה לתקופה של יותר משלוש שנים, אם ועדת הביקורת קבעה שהדבר סביר"],"a":2,"why":"ס' 272(ג)(3) מאפשר לוועדת התגמול ולדירקטוריון לאשר עסקה לפי ס' 270(2) גם אם האסיפה התנגדה. ס' 272(ג1)(1)(ג) מחיל זאת על המנכ\"ל. החריג: חברה נכדה ציבורית.","w":["אין בחוק \"פסקת התגברות\" כזו לטובת האסיפה.","על דירקטור אין התגברות. האסיפה נדרשת (ס' 273).","","בעל שליטה אינו \"מתגבר\", ותנאיו טעונים אסיפה ברוב מיוחד (ס' 275).","זה החריג לכלל שלוש השנים (ס' 275(א1)(2)), ולא פסקת ההתגברות."],"secs":["272"]},{"id":"u8-2","q":"באישור מדיניות התגמול באסיפה הכללית של חברה ציבורית, מה נדרש?","o":["רוב של 75% מכלל בעלי המניות","אישור בעל השליטה בלבד","רוב של שני שלישים","רוב מקרב בעלי המניות שאינם בעלי השליטה ואינם בעלי עניין אישי באישור המדיניות המשתתפים בהצבעה (בלי נמנעים), או שהמתנגדים מקרבם לא עלו על 2% מכלל זכויות ההצבעה","רוב רגיל של כל המשתתפים"],"a":3,"why":"ס' 267א(ב)(1)–(2) קובע את הרוב המיוחד לאישור המדיניות.","w":["החוק אינו קובע 75%.","קולות בעל השליטה אינם נספרים ברוב המיוחד (ס' 267א(ב)(1)).","החוק אינו קובע שני שלישים.","","נדרש רוב מיוחד (ס' 267א(ב))."],"secs":["267א"]},{"id":"u8-3","q":"האסיפה הכללית של חברה ציבורית, שאינה חברה נכדה ציבורית, דחתה את מדיניות התגמול שהציע הדירקטוריון. מה נכון?","o":["המדיניות לא תיכנס לתוקף בשום מקרה","המדיניות תיכנס לתוקף אוטומטית כעבור 90 יום","הדירקטוריון רשאי לקבוע את המדיניות בכל זאת, אם ועדת התגמול ולאחריה הדירקטוריון החליטו, אחרי דיון מחדש ועל יסוד נימוקים מפורטים, שהדבר לטובת החברה","הדירקטוריון רשאי לקבוע את המדיניות רק באישור בית המשפט","בעל השליטה רשאי לאשר את המדיניות לבדו"],"a":2,"why":"ס' 267א(ג) מאפשר לדירקטוריון, למעט בחברה נכדה ציבורית, לקבוע את המדיניות על אף התנגדות האסיפה, אם ועדת התגמול ולאחריה הדירקטוריון דנו מחדש והחליטו בנימוקים מפורטים שהדבר לטובת החברה.","w":["קיימת התגברות לפי ס' 267א(ג).","אין בחוק מנגנון כזה.","","אין צורך בבית משפט.","בעל השליטה אינו מוסמך לכך."],"secs":["267א"]},{"id":"u8-4","q":"חברה ציבורית קבעה מדיניות תגמול לחמש שנים. מה נכון?","o":["המדיניות טעונה אישור שנתי של הדירקטוריון בלבד","אסור לקבוע מדיניות ליותר משנה","המדיניות תקפה לחמש שנים בלי צורך באישור נוסף","המדיניות טעונה אישור מחדש רק אם בעל השליטה התחלף","המדיניות טעונה אישור אחת לשלוש שנים, באותה דרך שבה נקבעה"],"a":4,"why":"ס' 267א(ד): מדיניות לתקופה העולה על שלוש שנים טעונה אישור אחת לשלוש שנים, באותה דרך שבה נקבעה. בנוסף, ועדת התגמול ממליצה על המשך התוקף (ס' 118ב(1)).","w":["האישור התלת-שנתי נעשה באותה דרך: ועדה, דירקטוריון ואסיפה (ס' 267א(ד)). הבחינה השוטפת של הדירקטוריון (ס' 267א(ה)) אינה מחליפה אותו.","החוק אינו קובע מגבלה כזו.","נדרש אישור אחת לשלוש שנים (ס' 267א(ד)).","החוק אינו מתנה זאת בחילופי שליטה.",""],"secs":["267א"]},{"id":"u8-5","q":"מה נכון לגבי הרכב ועדת התגמול בחברה ציבורית?","o":["בעל השליטה רשאי לכהן בה אם אינו מקבל שכר","ועדת הביקורת אינה יכולה לשמש לעולם כוועדת תגמול","לפחות שני חברים, ויו\"ר הדירקטוריון יכול לעמוד בראשה","כל חבריה חייבים להיות דירקטורים בלתי תלויים, ואין צורך בדירקטורים חיצוניים","לפחות שלושה חברים. כל הדירקטורים החיצוניים חברים בה והם רוב חבריה, והיו\"ר הוא דירקטור חיצוני"],"a":4,"why":"ס' 118א(ב) קובע את ההרכב. ס' 118א(ג) מחיל את ס' 115(ב)–(ה), ולכן היו\"ר ובעל השליטה פסולים. ס' 118א(ד) מאפשר לוועדת ביקורת שעומדת בתנאים לשמש כוועדת תגמול.","w":["בעל השליטה פסול (ס' 118א(ג) עם ס' 115(ג)).","ס' 118א(ד) מתיר זאת.","המינימום הוא שלושה, ויו\"ר הדירקטוריון פסול (ס' 118א(ב)–(ג), 115(ב)).","כל הדירקטורים החיצוניים חייבים להיות חברים בה, והם רוב חבריה (ס' 118א(ב)).",""],"secs":["118א"]},{"id":"u8-6","q":"חברה ציבורית רוצה להעלות את שכרה של סמנכ\"לית השיווק (שאינה דירקטורית) בהתאם למדיניות התגמול. איזה אישור נדרש?","o":["דירקטוריון בלבד","ועדת תגמול ← דירקטוריון","ועדת ביקורת ← דירקטוריון","המנכ\"ל בלבד, כי הסמנכ\"לית כפופה לו","ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד"],"a":1,"why":"עסקה לפי ס' 270(2) בחברה ציבורית, שאינה עם המנכ\"ל, טעונה אישור ועדת התגמול ולאחר מכן אישור הדירקטוריון, בהתאם למדיניות (ס' 272(ג)(1)–(2)). אם השינוי אינו מהותי, ייתכן שדי באישור הוועדה (ס' 272(ד)).","w":["נדרש קודם אישור ועדת התגמול.","","ועדת ביקורת ← דירקטוריון הוא המסלול בחברה פרטית שאינה חברת איגרות חוב (ס' 272(א)).","תנאי כהונה של נושא משרה אינם בסמכות המנכ\"ל לבדו (ס' 272(ג)).","אסיפה נדרשת רק בחריגה מהמדיניות (ס' 272(ג)(2)(ב))."],"secs":["272"]},{"id":"u8-7","q":"חברה ציבורית מציעה לסמנכ\"ל הכספים מענק שחורג מהתקרה שבמדיניות התגמול. האסיפה הכללית התנגדה. החברה אינה חברה נכדה ציבורית. מה נכון?","o":["הדירקטוריון רשאי לאשר את המענק לבדו, בלי ועדת התגמול","המענק לא יאושר בשום מקרה","המנכ\"ל רשאי לאשר את המענק בכל מקרה","ועדת התגמול ולאחריה הדירקטוריון רשאים לאשר את המענק במקרים מיוחדים, על יסוד נימוקים מפורטים, אחרי דיון מחדש שבחן את התנגדות האסיפה","די בכך שהסמנכ\"ל יוותר על חלק מהמענק"],"a":3,"why":"זו פסקת ההתגברות של ס' 272(ג)(3). היא חלה על עסקה לפי ס' 272(ג)(2), חוץ מבחברה נכדה ציבורית.","w":["ההתגברות מחייבת את ועדת התגמול ולאחריה את הדירקטוריון.","קיימת התגברות (ס' 272(ג)(3)).","המנכ\"ל אינו מוסמך.","","אין בחוק מנגנון כזה."],"secs":["272"]},{"id":"u8-8","q":"חברה ציבורית מתקשרת עם המנכ\"ל החדש שלה, שהוא מעובדי החברה הוותיקים. התנאים תואמים את מדיניות התגמול. מה נדרש?","o":["ועדת התגמול רשאית לפטור את ההתקשרות מאסיפה בכל מקרה שבו התנאים תואמים את המדיניות","דירקטוריון ← אסיפה ברוב רגיל","ועדת תגמול ← דירקטוריון בלבד, כי התנאים תואמים את המדיניות","ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד","ועדת ביקורת ← דירקטוריון ← אסיפה"],"a":3,"why":"במנכ\"ל נדרש אישור האסיפה ברוב מיוחד, גם כשהתנאים תואמים את המדיניות (ס' 272(ג1)(1)). הפטור מאסיפה (ס' 272(ג1)(3)) חל רק על מועמד שעומד בתנאי ס' 240(ב), כלומר בלי זיקה לחברה. עובד ותיק של החברה הוא בעל זיקה, ולכן הפטור אינו חל.","w":["הפטור מוגבל למועמד שמתקיים בו ס' 240(ב), ולמקרה שבו הבאה לאסיפה תסכל את ההתקשרות (ס' 272(ג1)(3)).","חסרה ועדת התגמול, והאסיפה נדרשת ברוב מיוחד.","במנכ\"ל האסיפה נדרשת גם כשהתנאים תואמים את המדיניות (ס' 272(ג1)(1)(ג)). הפטור היחיד הוא זה של ס' 272(ג1)(3), והוא אינו חל על עובד ותיק.","","בתנאי כהונה מאשרת ועדת התגמול, לא ועדת הביקורת."],"secs":["272"]},{"id":"u8-9","q":"חברה ציבורית מגייסת מנכ\"ל מחברה זרה. אין לו כל זיקה לחברה או לבעל השליטה בה. התנאים תואמים את מדיניות התגמול, והמועמד הודיע שלא יחכה לאסיפה. מה נכון?","o":["ועדת התגמול רשאית לפטור את ההתקשרות מאישור האסיפה, אם מצאה בנימוקים שהבאה לאסיפה תסכל את ההתקשרות","בעל השליטה רשאי לאשר במקום האסיפה","אין דרך להימנע מאישור האסיפה","האסיפה תאשר בדיעבד, ועד אז ההתקשרות תקפה","הדירקטוריון רשאי לפטור מאסיפה גם אם התנאים חורגים מהמדיניות"],"a":0,"why":"ס' 272(ג1)(3) ו-118ב(4): ועדת התגמול רשאית לפטור מאישור האסיפה עסקה עם מועמד למנכ\"ל שמתקיים לגביו ס' 240(ב), אם הבאה לאסיפה תסכל את ההתקשרות, ובלבד שהעסקה תואמת את המדיניות.","w":["","אין בחוק סמכות כזו לבעל השליטה.","קיים פטור כזה (ס' 272(ג1)(3)).","אין בחוק אישור בדיעבד כזה.","הפטור הוא של ועדת התגמול, ומותנה בהתאמה למדיניות."],"secs":["272","118ב"]},{"id":"u8-10","q":"חברה ציבורית רוצה לשלם לדירקטור, שאינו בעל שליטה, תגמול נוסף על ייעוץ אסטרטגי שהוא נותן לחברה. התגמול תואם את המדיניות. מה נדרש?","o":["אסיפה כללית ברוב מיוחד בלבד","ועדת תגמול ← דירקטוריון ← אסיפה כללית","דירקטוריון בלבד","ועדת ביקורת ← דירקטוריון","ועדת תגמול ← דירקטוריון בלבד"],"a":1,"why":"התקשרות עם דירקטור לגבי כהונתו כדירקטור ולגבי העסקתו בתפקידים אחרים (ס' 270(3)) טעונה ועדת תגמול ← דירקטוריון ← אסיפה כללית (ס' 273(א)). רוב מיוחד נדרש רק בחריגה מהמדיניות (ס' 273(ב)).","w":["המסלול כולל את ועדת התגמול ואת הדירקטוריון לפני האסיפה.","","חסרים ועדת התגמול והאסיפה.","בתנאי כהונה מאשרת ועדת התגמול.","בדירקטור נדרש גם אישור האסיפה (ס' 273(א))."],"secs":["273"]},{"id":"u8-11","q":"גדעון מחזיק 70% ממניות חברה ציבורית ומכהן כמנכ\"ל. החברה רוצה לחתום עמו על הסכם העסקה לחמש שנים. האסיפה דחתה את ההסכם. מה נכון?","o":["ההסכם טעון אישור הדירקטוריון בלבד, כי גדעון הוא בעל הרוב","ועדת התגמול והדירקטוריון רשאים להתגבר על התנגדות האסיפה","האסיפה אינה רלוונטית, כי גדעון מחזיק 70%","ההסכם יאושר אם ועדת הביקורת תקבע שהתקופה סבירה","ההסכם טעון אישור ועדת התגמול, הדירקטוריון והאסיפה ברוב מיוחד, ואין התגברות. אם יאושר, יש לאשרו מחדש אחת לשלוש שנים"],"a":4,"why":"תנאי כהונה של בעל שליטה הם עסקה לפי ס' 270(4), ומסלולם ס' 275(א): ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד (גדעון אינו נספר). פסקת ההתגברות חלה רק על ס' 270(2), ולא על בעל שליטה. תקופה של יותר משלוש שנים טעונה אישור אחת לשלוש שנים (ס' 275(א1)(1)).","w":["נדרש מסלול ס' 275 המלא.","ההתגברות אינה חלה על בעל שליטה.","קולותיו אינם נספרים ברוב המיוחד (ס' 275(א)(3)).","החריג של ס' 275(א1)(2) חל רק על עסקה חריגה (רישה), ובכל מקרה אינו מחליף את אישור האסיפה.",""],"secs":["275"]},{"id":"u8-12","q":"ועדת התגמול של חברה ציבורית אישרה שעדכון של כיסוי ביטוח הבריאות של סמנכ\"לית הכספים אינו שינוי מהותי ביחס להסכם הקיים. מה נדרש?","o":["אישור ועדת התגמול בלבד","אין צורך בשום אישור","אישור האסיפה הכללית","אישור הדירקטוריון בנוסף","אישור ועדת הביקורת והדירקטוריון"],"a":0,"why":"ס' 272(ד): שינוי של עסקה קיימת לפי ס' 270(2) טעון אישור ועדת התגמול בלבד, אם הוועדה אישרה שהשינוי אינו מהותי.","w":["","נדרש אישור הוועדה, כולל קביעה שהשינוי אינו מהותי.","האסיפה אינה נדרשת בשינוי לא מהותי.","לפי ס' 272(ד), הוועדה לבדה מספיקה.","בחברה ציבורית מאשרת ועדת התגמול."],"secs":["272"]},{"id":"u8-13","q":"\"ממן בע\"מ\" היא חברה ציבורית שבשליטת \"ממן החזקות\" (חברה ציבורית), שבשליטת \"ממן גלובל\" (חברה ציבורית), שבשליטת משפחת ממן. האסיפה הכללית של \"ממן בע\"מ\" דחתה את תנאי ההעסקה של סמנכ\"ל התפעול. מה נכון?","o":["\"ממן בע\"מ\" היא חברה נכדה ציבורית, ולכן אין בה פסקת התגברות, וההתקשרות לא תאושר","החברה האם רשאית לאשר במקום האסיפה","ועדת התגמול והדירקטוריון רשאים להתגבר על ההתנגדות","ההתגברות אפשרית, אבל רק באישור בית המשפט","ההתקשרות מאושרת אוטומטית, כי החברה האם תומכת בה"],"a":0,"why":"\"חברה נכדה ציבורית\" (ס' 267א(ג)) היא חברה ציבורית שנשלטת בידי חברה ציבורית, שנשלטת בעצמה בידי חברה ציבורית אחרת שיש לה בעל שליטה. ס' 272(ג)(3) מחריג חברה כזו מפסקת ההתגברות.","w":["","החברה האם אינה אורגן של \"ממן בע\"מ\".","בחברה נכדה ציבורית אין התגברות (ס' 272(ג)(3)).","אין בחוק מסלול של בית משפט.","אין בחוק אישור אוטומטי."],"secs":["272","267א"]},{"id":"u8-14","q":"איזה מהבאים <b>אינו</b> שיקול או הוראה שהחוק מחייב לכלול במדיניות התגמול?","o":["היחס בין עלות התגמול לשכר הממוצע והחציוני של עובדי החברה","תניה להחזר סכומים ששולמו על בסיס נתונים שהתבררו כמוטעים והוצגו מחדש בדוחות","הצרכים הכלכליים האישיים של בעל השליטה ומשפחתו","קידום מטרות החברה ותכנית העבודה שלה בראייה ארוכת טווח","תקרה למענקי פרישה"],"a":2,"why":"השיקולים בס' 267ב(א) ובתוספת ראשונה א' נוגעים לחברה ולנושא המשרה: מטרות, תמריצים, גודל, תרומה, יחס לשכר העובדים, השבה ותקרות. צרכיו האישיים של בעל השליטה אינם שיקול לגיטימי.","w":["זה מופיע בחלק א' לתוספת ראשונה א'.","תניית השבה מופיעה בחלק ב' לתוספת ראשונה א'.","","זה שיקול בס' 267ב(א)(1).","תקרה למענקי פרישה מופיעה בחלק ב' לתוספת ראשונה א'."],"secs":["267ב"]}],"cases":[{"id":"u8-c1","title":"\"אלה ביומד\" – סמנכ\"ל, מנכ\"ל חדש ובן בעל השליטה","facts":"\"אלה ביומד בע\"מ\" היא חברה ציבורית בתחום המכשור הרפואי. משה אלה מחזיק 52% ממניותיה. היתר בידי הציבור. בחברה קיימת מדיניות תגמול שאושרה לפני שנתיים לתקופה של שלוש שנים. אין לחברה חברת אם.\n(1) החברה רוצה לגייס סמנכ\"לית מו\"פ, ד\"ר נוי. היא דורשת מענק חתימה של 2 מיליון ₪, בעוד שבמדיניות קבועה תקרה של מיליון ₪. ועדת התגמול והדירקטוריון אישרו, אבל באסיפה הכללית רוב בעלי המניות מהציבור שהשתתפו הצביעו נגד.\n(2) המנכ\"ל פרש, והחברה איתרה מועמד מחו\"ל, ד\"ר קליין, שאין לו כל זיקה לחברה או למשה. תנאי ההעסקה שלו תואמים את המדיניות, אבל הוא מבקש תשובה תוך שבועיים.\n(3) משה מבקש למנות את בנו, עידו, ליו\"ר הדירקטוריון בשכר חודשי של 80,000 ₪, לארבע שנים.","parts":[{"q":"האם ד\"ר נוי תוכל לקבל את מענק החתימה? פרטו את ההליך הנדרש. [עד 15 שורות]","pts":20,"model":["1. ד\"ר נוי תהיה מנהלת הכפופה במישרין למנכ\"ל, ולכן נושאת משרה (ס' 1). מענק חתימה הוא \"תנאי כהונה והעסקה\" (ס' 1), ולכן זו עסקה לפי ס' 270(2).","2. המסלול הרגיל: ועדת תגמול ← דירקטוריון, בהתאם למדיניות (ס' 272(ג)(1)–(2)).","3. המענק חורג מהתקרה במדיניות. לכן נדרשים אישור הוועדה והדירקטוריון לפי שיקולי ס' 267ב(א) ותוספת ראשונה א' (ס' 272(ג)(2)(א)), וגם אישור האסיפה ברוב מיוחד לפי ס' 267א(ב) (ס' 272(ג)(2)(ב)).","4. הרוב המיוחד לא התקבל: רוב המשתתפים שאינם בעלי השליטה ואינם בעלי עניין אישי הצביעו נגד.","5. פסקת ההתגברות: ועדת התגמול ולאחריה הדירקטוריון רשאים לאשר בכל זאת, \"במקרים מיוחדים\", על יסוד נימוקים מפורטים, אחרי שדנו מחדש ובחנו את התנגדות האסיפה (ס' 272(ג)(3)).","6. \"אלה ביומד\" אינה חברה נכדה ציבורית, כי אין לה חברת אם, ולכן ההתגברות אפשרית.","7. ד\"ר נוי לא תשתתף בדיונים (ס' 278). התשובה: כן, אם יתקיים הליך ההתגברות כדין."],"check":["נושאת משרה (ס' 1), ומענק כ\"תנאי כהונה\" (ס' 1, 270(2))","מסלול: ס' 272(ג)(1)","חריגה מהמדיניות: ס' 272(ג)(2)(א)–(ב), ס' 267ב","רוב מיוחד: ס' 267א(ב)","פסקת התגברות: ס' 272(ג)(3)","בדיקת חריג החברה הנכדה"]},{"q":"מה נדרש כדי לחתום עם ד\"ר קליין בתוך שבועיים? [עד 15 שורות]","pts":20,"model":["1. התקשרות עם המנכ\"ל בעניין תנאי כהונתו היא עסקה לפי ס' 270(2), ומסלולה: ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 272(ג1)(1)).","2. כינוס אסיפה מצריך זמן, ולכן עלול לסכל את ההתקשרות.","3. פטור מאסיפה: ועדת התגמול רשאית לפטור מאישור האסיפה עסקה עם מועמד למנכ\"ל שמתקיים לגביו ס' 240(ב), כלומר שאין לו ולקרוביו זיקה לחברה או לבעל השליטה. לשם כך עליה למצוא, בנימוקים, שהבאה לאסיפה תסכל את ההתקשרות (ס' 272(ג1)(3), 118ב(4)).","4. תנאי נוסף הוא שהעסקה תואמת את מדיניות התגמול. כאן התנאי מתקיים.","5. ד\"ר קליין חסר זיקה, והוא דורש תשובה בתוך שבועיים. לכן הוועדה יכולה לנמק שהבאה לאסיפה תסכל את ההתקשרות.","6. גם במקרה של פטור, נדרשים אישור ועדת התגמול ואישור הדירקטוריון.","7. אילו התנאים היו חורגים מהמדיניות, הפטור לא היה חל, והיה צורך באסיפה ברוב מיוחד, עם אפשרות התגברות (ס' 272(ג1)(1)(ג), (ג1)(2))."],"check":["מנכ\"ל: ס' 272(ג1)(1), ועדה ← דירקטוריון ← אסיפה","פטור למועמד: ס' 272(ג1)(3), 118ב(4)","תנאי ס' 240(ב): היעדר זיקה","נימוק של סיכול ההתקשרות","התאמה למדיניות","ועדה ודירקטוריון עדיין נדרשים"]},{"q":"מה נדרש כדי שעידו יכהן כיו\"ר בשכר המוצע? [עד 15 שורות]","pts":20,"model":["1. עידו הוא \"קרוב\" של משה, בעל השליטה (בן, כלומר צאצא, ס' 1). כיו\"ר הוא דירקטור, ולכן נושא משרה.","2. התקשרות של חברה ציבורית עם קרוב של בעל השליטה, שהוא נושא משרה, לגבי תנאי כהונתו, היא עסקה לפי ס' 270(4) סיפא (\"עם בעל השליטה בה או עם קרובו\"). היא טעונה אישור גם אם אינה חריגה.","3. המסלול: ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד, כלומר רוב מקרב בעלי המניות שאינם בעלי עניין אישי המשתתפים בהצבעה, או מתנגדים עד 2% (ס' 275(א)). משה, שיש לו עניין אישי, אינו נספר.","4. כדירקטור חל גם ס' 273, ולכן נדרשים אישורים מצטברים (ס' 277). מסלול ס' 275 מכסה אותם.","5. ההתקשרות תהיה בהתאם למדיניות התגמול. חריגה ממנה מחייבת את שיקולי ס' 272(ג)(2)(א) (ס' 275(ג1)).","6. ארבע שנים: ההתקשרות טעונה אישור מחדש אחת לשלוש שנים (ס' 275(א1)(1)). החריג של (א1)(2) אינו חל, כי זו אינה עסקה חריגה לפי הרישה.","7. אין פסקת התגברות לבעל שליטה או לקרובו. משה ועידו נמנעים מהדיונים (ס' 278(א)), ומגלים את עניינם (ס' 269). עידו, כקרוב של בעל השליטה, לא יהיה חבר בוועדת הביקורת או בוועדת התגמול (ס' 115(ג), 118א(ג)), וכיו\"ר הוא ממילא פסול להן."],"check":["עידו קרוב (ס' 1) ונושא משרה","ס' 270(4) סיפא: תנאי כהונה של קרוב","מסלול ס' 275(א), כולל רוב מיוחד","מצטבר עם ס' 273 (ס' 277)","מדיניות: ס' 275(ג1)","כלל 3 השנים: ס' 275(א1)","אין התגברות; הימנעות: ס' 278"]}]},{"id":"u8-c2","title":"\"גפן קמעונאות\" – מדיניות תגמול בחברה נכדה","facts":"\"גפן קמעונאות בע\"מ\" היא חברה ציבורית שמפעילה רשת סופרמרקטים. 60% ממניותיה מוחזקים בידי \"גפן אחזקות בע\"מ\", חברה ציבורית ש-55% ממניותיה מוחזקים בידי \"גפן השקעות בע\"מ\". גם גפן השקעות היא חברה ציבורית, ובעל השליטה בה הוא רוני גפן.\nועדת התגמול של גפן קמעונאות המליצה על מדיניות תגמול חדשה לחמש שנים. המדיניות כוללת מענק שנתי למנכ\"ל \"לפי שיקול דעת הדירקטוריון\", בלי קריטריונים מדידים, בלי תקרה ובלי הוראת השבה. הדירקטוריון אישר את המדיניות. באסיפה הצביעו גפן אחזקות בעד, והציבור שהשתתף נגד ברוב גדול.\nהדירקטוריון שוקל לקבוע את המדיניות \"על אף התנגדות האסיפה\". כמו כן, לאחר מכן מבקשת החברה להגדיל ב-3% את רכיב רכב החברה של סמנכ\"ל הכספים.","parts":[{"q":"האם הדירקטוריון רשאי לקבוע את המדיניות על אף התנגדות האסיפה? [עד 15 שורות]","pts":20,"model":["1. גפן קמעונאות היא חברה ציבורית, ולכן חייבת במדיניות תגמול (ס' 267א(א)). המדיניות נקבעת בדירקטוריון אחרי המלצת ועדת התגמול (ס' 118ב(1)), וטעונה אישור האסיפה ברוב מיוחד (ס' 267א(ב)).","2. הרוב המיוחד: נספרים רק בעלי המניות שאינם בעלי השליטה ואינם בעלי עניין אישי. גפן אחזקות היא בעלת השליטה, ולכן אינה נספרת. הציבור הצביע נגד ברוב גדול, ולכן לא התקבל רוב, ומן הסתם גם המתנגדים עולים על 2%.","3. ככלל, הדירקטוריון רשאי לקבוע את המדיניות על אף ההתנגדות, אחרי דיון מחדש בוועדה ובדירקטוריון ובנימוקים מפורטים שהדבר לטובת החברה (ס' 267א(ג)).","4. אבל ההתגברות אינה חלה ב\"חברה נכדה ציבורית\". גפן קמעונאות נשלטת בידי חברה ציבורית (גפן אחזקות), שנשלטת בידי חברה ציבורית אחרת (גפן השקעות), שיש לה בעל שליטה (רוני). לכן היא חברה נכדה ציבורית (ס' 267א(ג)).","5. מסקנה: הדירקטוריון אינו רשאי להתגבר. עליו לגבש מדיניות מתוקנת ולהביא אותה שוב לאסיפה.","6. בנוסף, מדיניות לחמש שנים טעונה אישור אחת לשלוש שנים (ס' 267א(ד))."],"check":["חובה במדיניות: ס' 267א(א), והמלצת ועדה: ס' 118ב(1)","רוב מיוחד: ס' 267א(ב), כולל אי-מניית בעל השליטה","התגברות: ס' 267א(ג)","זיהוי חברה נכדה ציבורית, ולכן אין התגברות","ס' 267א(ד): 3 שנים"]},{"q":"אילו פגמים יש בתוכן המדיניות המוצעת? [עד 15 שורות]","pts":20,"model":["1. המדיניות תיקבע לפי שיקולי ס' 267ב(א): מטרות ארוכות טווח, תמריצים ראויים בהתחשב בניהול סיכונים, גודל החברה, ותרומת נושא המשרה ברכיבים משתנים.","2. המדיניות חייבת לכלול את ההוראות שבחלק ב' לתוספת ראשונה א' (ס' 267ב(ב)).","3. רכיבים משתנים חייבים להתבסס על ביצועים ארוכי טווח ועל קריטריונים מדידים. הדרישה חלה על המנכ\"ל, כי הפרט אינו חל רק על נושא משרה הכפוף למנכ\"ל. מותר לקבוע שחלק לא מהותי מהרכיבים, או רכיבים בסך של עד שלוש משכורות חודשיות בשנה, יוענקו לפי קריטריונים שאינם מדידים. מענק שכולו \"לפי שיקול דעת\", בלי קריטריונים ובלי תקרה, אינו עומד בדרישה.","4. חובה לקבוע יחס בין הרכיבים המשתנים לקבועים, ותקרה לשווי הרכיבים המשתנים. היעדר תקרה הוא פגם.","5. חובה לכלול תניית השבה (Clawback) של סכומים ששולמו על בסיס נתונים שהתבררו כמוטעים והוצגו מחדש בדוחות. גם היעדרה הוא פגם.","6. בנוסף, חובה להתייחס ליחס שבין עלות התגמול לשכר הממוצע והחציוני של העובדים ועובדי הקבלן (חלק א'). ברשת קמעונאית עם עובדים רבים בשכר נמוך, זה שיקול משמעותי.","7. מדיניות שאינה עומדת בדרישות חשופה לתקיפה, והדירקטורים עלולים להפר את חובת הזהירות (ס' 252–253)."],"check":["שיקולי ס' 267ב(א)","חלק ב' לתוספת ראשונה א': קריטריונים מדידים","יחס בין משתנה לקבוע ותקרה","תניית השבה","יחס לשכר העובדים (חלק א')"]},{"q":"מה נדרש להגדלת רכיב הרכב של סמנכ\"ל הכספים? [עד 15 שורות]","pts":20,"model":["1. סמנכ\"ל הכספים הוא נושא משרה שאינו דירקטור ואינו מנכ\"ל (ס' 1). רכב הוא \"הטבה\" בגדר \"תנאי כהונה והעסקה\" (ס' 1), ולכן זו עסקה לפי ס' 270(2).","2. מסלול רגיל: ועדת תגמול ← דירקטוריון, בהתאם למדיניות (ס' 272(ג)(1)).","3. שינוי לא מהותי: זה שינוי של עסקה קיימת. אם ועדת התגמול תאשר שהשינוי אינו מהותי ביחס להסכם הקיים, יידרש רק אישורה (ס' 272(ד)). תוספת של 3% לרכיב רכב היא ככל הנראה לא מהותית.","4. ההתקשרות כפופה למדיניות התגמול. כל עוד לא אושרה מדיניות חדשה, נבחנת ההתאמה למדיניות התקפה. אם אין מדיניות תקפה, ההחלטה תחייב גם את שיקולי ס' 267ב ואישור האסיפה ברוב מיוחד (ס' 272(ג)(2)), ובחברה נכדה ציבורית אין התגברות (ס' 272(ג)(3)).","5. הסמנכ\"ל לא יהיה נוכח בדיון (ס' 278(א))."],"check":["ס' 270(2) ו\"תנאי כהונה\" (ס' 1)","מסלול: ס' 272(ג)(1)","שינוי לא מהותי: ס' 272(ד)","קשר למדיניות, וחריגה ממנה: ס' 272(ג)(2)","אין התגברות בחברה נכדה","הימנעות: ס' 278"]}]}]},{"id":"u9","title":"בעלי מניות: זכויות, חובות ותביעות","short":"בעלי מניות","blurb":"תדעו לזהות את זכויות בעל המניה ואת חובותיו, להבחין בין הצבעה לפי מספר מניות לבין דיבידנד לפי ערך נקוב, ולבחור בין תביעת קיפוח, תביעה אישית ותביעה נגזרת.","secs":["1","82","176","177","183","184","188","189","190","191","192","193","194","197","198","204","290","306"],"blocks":[{"t":"h","x":"מיהו בעל מניה, ומאיפה באות הזכויות שלו"},{"t":"p","x":"בעל מניה הוא הבעלים של <b>מניה</b>. החוק לא מגדיר מניה כ״חתיכה מהחברה״ אלא כ<b>חבילת זכויות</b>: זכות להצביע, זכות לקבל דיבידנד אם הוחלט על חלוקה, זכות למידע, זכות ליתרת הנכסים בפירוק ועוד. מכאן נובע עיקרון חשוב לבחינה: כדי לדעת מה מגיע לבעל מניה, בודקים <b>מה קובע החוק ומה קובע התקנון</b>, ולא מה ״הוגן״ בעיני הסטודנט."},{"t":"law","law":"חוק החברות","sec":"1","x":"”מניה“ – אגד של זכויות בחברה הנקבעות בדין ובתקנון;"},{"t":"law","law":"חוק החברות","sec":"183","x":"זכויותיו וחובותיו של בעל מניה הן כקבוע בחוק זה, בתקנון החברה ולפי כל דין."},{"t":"p","x":"מי נחשב בעל מניה? <b>בחברה פרטית</b> – מי שרשום במרשם בעלי המניות (ס' 176). <b>בחברה ציבורית</b> – גם מי שהמניה רשומה לזכותו אצל חבר בורסה, כשהמניה רשומה במרשם על שם חברה לרישומים (ס' 177(1)). כך גם משקיע ״מהציבור״ שמחזיק מניות דרך הבנק הוא בעל מניה לכל דבר."},{"t":"h","x":"מפת הזכויות של בעל המניה"},{"t":"table","head":["הזכות","הסעיף","מה חשוב לזכור"],"rows":[["השתתפות והצבעה באסיפה הכללית","ס' 188, ס' 82","בכפוף לזכויות ההצבעה שבתקנון; בהיעדר הוראה – קול אחד לכל מניה (ס' 82(ג))."],["דיבידנד","ס' 190, ס' 306","אין זכות ״לדרוש״ דיבידנד; הזכות קמה רק אם החברה החליטה לחלק (ס' 306(א)). החלוקה לפי ערך נקוב (ס' 306(ב))."],["מידע ועיון","ס' 184–187","פרוטוקולים של האסיפות, מרשם בעלי המניות, תקנון ודוחות כספיים, ומסמכים בתנאי ס' 185."],["הסכמי הצבעה","ס' 189","מותרים, בכפוף לחובות בעלי המניות לפי החוק."],["זכות קדימה בהקצאות","ס' 290(א)","רק בחברה פרטית עם סוג אחד של מניות, ואם התקנון לא קבע אחרת."],["הגנה על זכויות סוג","ס' 20(ג)","שינוי תקנון שפוגע בסוג מניות טעון אישור אסיפת הסוג, אלא אם נקבע אחרת בתקנון."],["אין חיוב להשקיע עוד","ס' 20(ד)","שינוי תקנון שמחייב לרכוש מניות נוספות או מגדיל אחריות לא מחייב בלי הסכמה."],["סעדים","ס' 191, ס' 194 ואילך","תביעת קיפוח (אישית) ותביעה נגזרת (בשם החברה)."]]},{"t":"h","x":"מלכודת קלאסית: הצבעה לפי מספר מניות, דיבידנד לפי ערך נקוב"},{"t":"p","x":"בחוק יש <b>שתי ברירות מחדל שונות</b>, וכל אחת מהן חלה רק אם התקנון לא קבע אחרת. בהצבעה סופרים <b>מניות</b>: לכל מניה קול אחד, בלי קשר לערכה הנקוב או למחיר ששולם עבורה. בדיבידנד ובמניות הטבה מחלקים <b>לפי הערך הנקוב</b>: מניה של 10 ₪ ע.נ. מקבלת פי עשרה ממניה של 1 ₪ ע.נ."},{"t":"law","law":"חוק החברות","sec":"82(ג)","x":"לא קבעה החברה בתקנונה זכויות הצבעה שונות, יהיה לכל מניה קול אחד."},{"t":"law","law":"חוק החברות","sec":"306(ב)","x":"היו בהון החברה מניות שלהן ערכים נקובים שונים, יחולקו דיבידנד או מניות הטבה באופן יחסי לערך הנקוב של כל מניה, אלא אם כן נקבע אחרת בתקנון."},{"t":"example","title":"דוגמה מספרית: מי שולט ומי מקבל יותר דיבידנד?","x":"בחברת ״אורן בע״מ״ שני בעלי מניות, ובתקנון אין הוראה על זכויות הצבעה או על חלוקת דיבידנד. דני מחזיק 400 מניות בנות 10 ₪ ע.נ. כל אחת, ורינה מחזיקה 1,600 מניות בנות 1 ₪ ע.נ. כל אחת. <b>הצבעה (ס' 82(ג))</b>: יש 2,000 קולות. לרינה 1,600 קולות (80%) ולדני 400 (20%). רינה מחזיקה ביותר ממחצית זכויות ההצבעה, ולכן חזקה שהיא בעלת שליטה (הגדרת ״שליטה״ בחוק ניירות ערך, שאליה מפנה ס' 1 לחוק החברות). <b>דיבידנד (ס' 306(ב))</b>: הערך הנקוב של דני 4,000 ₪, של רינה 1,600 ₪, ובסך הכול 5,600 ₪. אם יחולק דיבידנד של 560,000 ₪, דני יקבל 400,000 ₪ (5/7) ורינה 160,000 ₪ (2/7). <b>מסקנה</b>: רינה שולטת בחברה, אבל דני מקבל את רוב הדיבידנד."},{"t":"trap","x":"במבחן מופיעות תשובות כמו ״הדיבידנד יחולק לפי מספר המניות״, ״ההצבעה לפי הערך הנקוב״ או ״לפי הסכום ששילם כל אחד עבור מניותיו״. שלושתן שגויות כשהתקנון שותק. המחיר ששולם בפועל (כולל פרמיה) לא משנה דבר. בדקו תמיד קודם אם יש הוראה בתקנון: ס' 82(א) מתיר לקבוע זכויות הצבעה שונות לסוגי מניות, ו-ס' 306(ב) מסתיים במילים ״אלא אם כן נקבע אחרת בתקנון״."},{"t":"h","x":"חובות בעלי המניות"},{"t":"p","x":"בעבר רווחה הגישה שבעל מניה הוא ״בעל קניין״ שמצביע כרצונו ולטובתו בלבד. חוק החברות שינה זאת: בעל מניה הוא חלק ממערכת יחסים חוזית (התקנון הוא חוזה), ולכן הוא חייב לנהוג <b>בתום לב ובדרך מקובלת</b>. על בעלי כוח (בעל שליטה ובעל ״קול מכריע״) מוטלת חובה מחמירה יותר: <b>חובת הגינות</b>."},{"t":"law","law":"חוק החברות","sec":"192(א)","x":"בעל מניה ינהג בהפעלת זכויותיו ובמילוי חובותיו כלפי החברה וכלפי בעלי המניות האחרים בתום לב ובדרך מקובלת, ויימנע מניצול לרעה של כוחו בחברה, בין היתר, בהצבעתו באסיפה הכללית ובאסיפות סוג, בענינים הבאים: … שינוי התקנון; … הגדלת הון המניות הרשום; … מיזוג; … אישור פעולות ועסקאות הטעונות אישור האסיפה הכללית לפי הוראות סעיפים 255 ו־268 עד 275."},{"t":"law","law":"חוק החברות","sec":"192(ב)","x":"בעל מניה יימנע מלקפח בעלי מניות אחרים."},{"t":"law","law":"חוק החברות","sec":"193(א)","x":"על המפורטים להלן מוטלת החובה לפעול בהגינות כלפי החברה: … בעל השליטה בחברה; … בעל מניה היודע שאופן הצבעתו יכריע בענין החלטת אסיפה כללית או אסיפת סוג של החברה; … בעל מניה שלפי הוראות התקנון יש לו כוח למנות או למנוע מינוי של נושא משרה בחברה או כוח אחר כלפי החברה."},{"t":"table","head":["מי","החובה","כלפי מי","התרופה"],"rows":[["כל בעל מניה","תום לב, דרך מקובלת, איסור ניצול לרעה של כוח (ס' 192(א))","החברה ובעלי המניות האחרים","דיני הפרת חוזה (ס' 192(ג))"],["כל בעל מניה","הימנעות מקיפוח (ס' 192(ב))","בעלי המניות האחרים","דיני הפרת חוזה וגם הסעדים של ס' 191 (ס' 192(ג))"],["בעל שליטה; בעל ״קול מכריע״; בעל כוח מינוי לפי התקנון","חובת הגינות (ס' 193(א))","החברה","דיני הפרת חוזה, בשים לב למעמדו (ס' 193(ב))"]]},{"t":"p","x":"<b>מה ההבדל בין הרמות?</b> תום לב הוא רף מינימלי: אסור לפעול בזדון או בחוסר יושר. הגינות היא רף גבוה יותר: בעל השליטה רשאי לשקול גם את האינטרס שלו, אבל אסור לו לנצל את השליטה כדי להעביר לעצמו ערך על חשבון החברה. חובת ההגינות נמוכה מחובת האמונים של נושא משרה (ס' 254), שמחייבת לפעול לטובת החברה בלבד. כשבעל השליטה הוא גם נושא משרה (למשל מנכ״ל), חלות עליו שתי החובות במקביל."},{"t":"trap","x":"״בעל שליטה״ לצורך ס' 193 הוא מי שיש לו <b>היכולת לכוון</b> את פעילות החברה (חזקה: מחצית או יותר מאמצעי השליטה). אל תבלבלו עם ס' 268, שמרחיב את ההגדרה ל-25% כשאין מחזיק אחר ביותר מ-50%, אבל רק ״בפרק זה״, כלומר לעניין אישור עסקאות עם בעל שליטה. וזכרו את ס' 193(א)(2): גם בעל מניות קטן שיודע שקולו יכריע חב חובת הגינות."},{"t":"case","name":"ע\"א 817/79 קוסוי נ' בנק י.ל. פויכטונגר בע\"מ","x":"הלכת היסוד על חובת בעל השליטה: בעל שליטה שמוכר את מניותיו חב חובה (כיום: חובת הגינות) כלפי החברה בקשר למכירה. הוא מפר אותה אם הוא מוכר את השליטה לקונה שלמיטב ידיעתו ירוקן את החברה מנכסיה ויביא אותה לחדלות פירעון."},{"t":"case","name":"ע\"א 7657/17 רו\"ח חן ברדיצ'ב, הנאמן על הסדר הנושים של פויכטונגר תעשיות בע\"מ נ' עזריאל פויכטונגר","x":"הדיון הראשון של בית המשפט העליון בהלכת קוסוי מאז נחקק ס' 193. נקבע שבעל השליטה שמכר את השליטה לא הפר את חובת ההגינות, כי לא הוכח שידע או שהיה עליו לדעת על כוונת הרוכשים. פרמיית שליטה גבוהה כשלעצמה אינה מעידה על ידיעה כזו."},{"t":"h","x":"קיפוח: ס' 191"},{"t":"p","x":"תביעת קיפוח היא הסעד המרכזי של בעל מניות מיעוט שנפגע מהדרך שבה מתנהלים ענייני החברה. היא <b>תביעה אישית</b> של בעל המניה, לא תביעה בשם החברה. הפסיקה פירשה ״קיפוח״ כפגיעה בציפיות הסבירות של בעל המניה, ובחברה פרטית ״משפחתית״ או ״מעין שותפות״ היא בוחנת גם את ההבנות שהיו בין המייסדים."},{"t":"law","law":"חוק החברות","sec":"191(א)","x":"התנהל ענין מענייניה של חברה בדרך שיש בה משום קיפוח של בעלי המניות שלה, כולם או חלקם, או שיש חשש מהותי שיתנהל בדרך זו, רשאי בית המשפט, לפי בקשת בעל מניה, לתת הוראות הנראות לו לשם הסרתו של הקיפוח או מניעתו"},{"t":"steps","title":"ניתוח טענת קיפוח במבחן","x":["<b>מי טוען?</b> בעל מניה (ס' 191(א)). מספיק גם ״חשש מהותי״ לקיפוח עתידי.","<b>מה קרה?</b> זהו את ההתנהלות: נישול מניהול, הקצאה מדללת, הימנעות שיטתית מחלוקה כשבעלי השליטה מושכים כספים בדרך של שכר, העברת עסקים לחברה אחרת וכו'.","<b>האם יש פגיעה בציפיות סבירות?</b> הסבירו למה בעל המניה ציפה (למשל לכהן כדירקטור או ליהנות מהרווחים) ולמה הציפייה נפגעה.","<b>חיבור לחובות</b>: הפרת ס' 192(ב) (איסור קיפוח), ואם הפוגע הוא בעל שליטה – גם ס' 193 (הגינות).","<b>סעד</b>: בית המשפט רשאי לתת ״הוראות הנראות לו״: הוראות לניהול העניינים בעתיד, או הוראה שבעלי מניות או החברה ירכשו מניות. רכישה בידי החברה כפופה ל<b>ס' 301</b> (היא ״חלוקה״). השינויים נרשמים בתקנון ובהחלטות החברה (ס' 191(ב))."]},{"t":"case","name":"ע\"א 2718/09 \"גדיש\" קרנות גמולים בע\"מ נ' אלסינט בע\"מ","x":"קיפוח נבחן בין היתר לפי סטייה מהציפיות הסבירות של המשקיעים, ו״ריקון״ החברה לטובת בעלי השליטה מקים חשש סביר לקיפוח. כשעסקה שבעל השליטה מעוניין בה לא הובאה לאישור הנדרש, הנטל עובר לבעלי השליטה להוכיח את ״הגינותה המלאה״: הליך תקין ומחיר הולם. תביעת קיפוח יכולה להתנהל גם כתובענה ייצוגית."},{"t":"h","x":"התביעה הנגזרת: ס' 194 ואילך"},{"t":"p","x":"כשנגרם נזק <b>לחברה</b> (למשל מנכ״ל שהפר אמונים או בעל שליטה שהעביר לעצמו נכס), עילת התביעה שייכת לחברה. בדרך כלל הדירקטוריון מחליט אם לתבוע. הבעיה: כשהמזיק הוא בעל השליטה או מקורביו, הדירקטוריון לא ימהר לתבוע. התביעה הנגזרת מאפשרת לבעל מניה או לדירקטור ״להיכנס בנעלי החברה״ ולתבוע <b>בשמה</b>. מה שייפסק <b>ישולם לחברה</b>, והתובע יכול לקבל גמול והוצאות."},{"t":"steps","title":"המסלול של תביעה נגזרת","x":["<b>מי רשאי</b>: כל בעל מניה וכל דירקטור (ס' 194(א)); נושה רשאי לתבוע בשל חלוקה אסורה (ס' 204).","<b>דרישה מוקדמת</b>: פנייה בכתב לחברה, ליו״ר הדירקטוריון, עם העובדות והנימוקים (ס' 194(ב)–(ג)).","<b>תגובת החברה</b> (ס' 195): לרפא את העילה, לדחות בנימוקים, או להחליט לתבוע; עליה להשיב תוך 45 ימים (ס' 196).","<b>הזכות לפנות לבית המשפט</b> (ס' 197): הדרישה נדחתה, לא נענתה, העילה לא נרפאה, החברה החליטה לתבוע ולא הגישה תוך 75 ימים, או שהתובע פטור מדרישה (ס' 194(ד)).","<b>אישור בית המשפט</b> (ס' 198(א)): לכאורה התביעה וניהולה לטובת החברה, והתובע אינו פועל בחוסר תום לב. אפשר לבקש גילוי מסמכים כבר בשלב זה (ס' 198א).","<b>אחרי האישור</b>: הסתלקות, הסדר או פשרה רק באישור בית המשפט (ס' 202); הוצאות וגמול (ס' 199–201)."]},{"t":"law","law":"חוק החברות","sec":"194(ד)","x":"על אף הוראות סעיף קטן (ב), המעוניין להגיש תביעה נגזרת אינו חייב לפנות בדרישה לחברה לפי הוראות אותו סעיף קטן, בהתקיים אחד מאלה: … לאורגן החברה המוסמך להחליט על הגשת התביעה, עניין אישי בהחלטה, ואם האורגן כאמור מורכב מכמה יחידים – למחצית או יותר מיחידי האורגן עניין אישי בהחלטה; … קיים חשש סביר כי פנייה בדרישה לחברה תפגע באפשרות לקבל את הסעד המבוקש."},{"t":"law","law":"חוק החברות","sec":"198(א)","x":"תביעה נגזרת טעונה אישור בית המשפט והוא יאשרה אם שוכנע כי לכאורה התביעה וניהולה הן לטובת החברה וכי התובע אינו פועל בחוסר תום לב."},{"t":"case","name":"ע\"א 4857/16 מנשה נ' יוויז'ן אייר בע\"מ","x":"כלל שיקול הדעת העסקי חל גם על החלטת הדירקטוריון אם להגיש תביעה בשם החברה, כולל החלטה שלא לתבוע, במיוחד כשהתביעה נגד צד שלישי. החלטה כזו, שהתקבלה בהליך תקין, מוגנת מפני התערבות שיפוטית בבקשה לאישור תביעה נגזרת. המסקנה למבחן: דחייה מנומקת של הדרישה בידי דירקטוריון לא נגוע מקשה על אישור התביעה; דירקטוריון נגוע לא נהנה מההגנה הזו."},{"t":"table","head":["","תביעת קיפוח / תביעה אישית","תביעה נגזרת"],"rows":[["למי הנזק","לבעל המניה עצמו (פגיעה בזכויותיו או בציפיותיו)","לחברה (וממנה, בעקיפין, לכל בעלי המניות)"],["בשם מי","בשם בעל המניה","בשם החברה"],["לאן הולך הכסף","לבעל המניה","לחברה"],["תנאים מוקדמים","אין דרישה מוקדמת","דרישה (או פטור לפי ס' 194(ד)) ואישור בית המשפט (ס' 198)"],["מקור","ס' 191, ס' 192(ב)","ס' 194–206"]]},{"t":"trap","x":"שתי טעויות חוזרות: (1) ״בעל המניה יקבל את הפיצוי״ בתביעה נגזרת. לא נכון: הפיצוי שייך לחברה. (2) ״חובה תמיד לפנות קודם לחברה״. לא נכון כשלאורגן המוסמך להחליט על התביעה יש עניין אישי בהחלטה (בדירקטוריון: למחצית או יותר מהדירקטורים, למשל כשרובם מקורבי הנתבע), או כשיש חשש סביר שהפנייה תסכל את הסעד (ס' 194(ד)). שימו לב גם: אין תביעה נגזרת בשם חברה שמונה לה נאמן לפי פרק ב' לחלק שמיני א' או לפי חוק חדלות פירעון (ס' 205); שם הנאמן הוא שתובע."},{"t":"example","title":"דוגמה: אישית או נגזרת?","x":"בחברת ״גפן בע״מ״ (ציבורית) בעל השליטה, המחזיק 70%, מכר לחברה מגרש במחיר כפול משוויו, בלי האישורים לפי ס' 275. נועה מחזיקה 1% מהמניות. <b>הנזק</b> נגרם לחברה, שילמה יותר מדי. ההפרש ״זלג״ לבעל השליטה. לכן הדרך הנכונה היא <b>תביעה נגזרת</b> בשם החברה, נגד בעל השליטה (הפרת ס' 193, ואם הוא גם נושא משרה – גם ס' 254) ונגד הדירקטורים שאישרו. האם נועה חייבת לפנות קודם לדירקטוריון? אם לפחות מחצית מהדירקטורים בעלי עניין אישי בהחלטה, למשל מקורבים לבעל השליטה, היא פטורה מדרישה (ס' 194(ד)(1)). בנוסף, העסקה בלי אישור כדין חסרת תוקף (ס' 280(א)). אם בהמשך בעל השליטה ינשל אותה באופן אישי מזכויותיה, זו כבר עילה לתביעת קיפוח אישית לפי ס' 191."},{"t":"h","x":"בעיית הנציג: מי שומר על השומרים?"},{"t":"p","x":"״בעיית הנציג״ (Agency) נוצרת כשמי שמנהל כסף אינו מי שהכסף שייך לו. בחברה יש שני מבנים עיקריים, ולכל אחד בעיה אחרת. במבחן נשאלתם, למשל, מהו המקור המרכזי לבעיה ב<b>בעלות מרוכזת</b>, כלומר מבנה שבו יש בעל שליטה, המבנה הנפוץ בישראל."},{"t":"table","head":["","בעלות מבוזרת (אין בעל שליטה)","בעלות מרוכזת (יש בעל שליטה)"],"rows":[["מי ה״נציג״ ומי ה״שולח״","המנהלים מול כלל בעלי המניות","בעל השליטה מול בעלי מניות המיעוט"],["החשש המרכזי","המנהלים יעדיפו את טובתם (שכר מופרז, ״בניית אימפריה״, נוחות) על פני השאת הערך לבעלי המניות","בעל השליטה ״יתעל״ (Tunneling) עושר מהחברה אליו, על חשבון המיעוט: עסקאות בעלי עניין, שכר לקרובים, ניצול הזדמנויות"],["למה השוק לא פותר","פיזור: לאף בעל מניות אין תמריץ לפקח (בעיית ״הנוסע החופשי״)","בעל השליטה ממנה את הדירקטוריון ולכן ״מפקח על עצמו״"],["כלים משפטיים מרכזיים","חובות זהירות ואמונים של נושאי משרה (ס' 252–254), מדיניות תגמול (ס' 267א), תביעה נגזרת","אישור משולש ורוב מיוחד בעסקאות עם בעל שליטה (ס' 270(4), 275), חובת הגינות (ס' 193), דירקטורים חיצוניים, תביעה נגזרת וקיפוח"]]},{"t":"p","x":"<b>מה זה ״תיעול״ (Tunneling)?</b> כל דרך שבה בעל השליטה מוציא לעצמו ערך מהחברה שלא באופן יחסי לכל בעלי המניות: החברה קונה ממנו ביוקר או מוכרת לו בזול, מעסיקה את קרוביו בשכר מנופח, או ״מוותרת״ על הזדמנות עסקית שעוברת לחברה אחרת שלו. דיבידנד רגיל, שמתחלק לכולם באופן יחסי, אינו תיעול. אבל ״העברה ללא תמורה שוות ערך״ לבעל מניה בגלל היותו בעל מניה היא ״דיבידנד״ לפי ההגדרה בס' 1, ולכן כפופה גם לכללי החלוקה (ס' 302)."},{"t":"h","x":"חברה פרטית וחברה ציבורית: מה משתנה?"},{"t":"table","head":["נושא","חברה פרטית","חברה ציבורית"],"rows":[["הגדרה (ס' 1)","״חברה שאינה חברה ציבורית״","מניותיה רשומות למסחר בבורסה או הוצעו לציבור על פי תשקיף (או לפי מסמך הצעה בחו״ל), ומוחזקות בידי הציבור"],["מיהו בעל מניה","הרשום במרשם (ס' 176)","גם מי שהמניה רשומה לזכותו אצל חבר בורסה (ס' 177(1))"],["זכות קדימה בהקצאה","קיימת בחברה עם סוג מניות אחד, אם התקנון לא קבע אחרת (ס' 290(א))","אין זכות קדימה מכוח ס' 290"],["עסקאות עם בעל שליטה","ס' 270(4) לא חל (חל רק על חברה ציבורית; לחברת איגרות חוב פרטית – ס' 270(4א))","אישור ועדה, דירקטוריון ואסיפה ברוב מיוחד (ס' 275)"],["השבת דיבידנד אסור","הכלל של ס' 310(א)","חזקה שבעל מניה מן הציבור לא ידע (ס' 310(ב))"],["יו״ר ומנכ״ל","אין איסור כפל (למעט חברת איגרות חוב, ס' 95(ד))","הפרדה, אלא באישור לפי ס' 121(ג) (ס' 95)"]]},{"t":"exam","x":"איך זה נשאל: (1) שאלה אמריקאית מספרית על הצבעה מול דיבידנד (ס' 82(ג) מול ס' 306(ב)): חשבו בנפרד אחוז קולות ואחוז ערך נקוב. (2) שאלה אמריקאית תיאורטית על בעיית הנציג בבעלות מרוכזת: התשובה היא תיעול בידי בעל השליטה, לא ״מנהלים מול בעלי מניות״. (3) בשאלה הפתוחה, כמעט בכל תרחיש של בעל שליטה שמפיק טובת הנאה, הבודק מצפה לפסקת ״מסלולים״: חובת הגינות (ס' 193), תביעה נגזרת (ס' 194: דרישה, פטור לפי ס' 194(ד), אישור לפי ס' 198) וקיפוח (ס' 191, ס' 192(ב)). הקפידו לציין <b>מי תובע, בשם מי, ולאן הולך הכסף</b>."}],"mcq":[{"id":"u9-1","q":"בחברת ״ברוש בע״מ״ אין בתקנון הוראות מיוחדות על הצבעה או על דיבידנד. משה מחזיק 300 מניות בנות 20 ₪ ע.נ. כל אחת, ושירה מחזיקה 1,200 מניות בנות 5 ₪ ע.נ. כל אחת. משה שילם 50 ₪ לכל מניה ושירה 6 ₪ לכל מניה. מה נכון?","o":["לשירה 80% מהקולות, ומשה ושירה יקבלו דיבידנד בחלקים שווים.","למשה 80% מהקולות כי שילם יותר עבור מניותיו, והדיבידנד יחולק לפי הסכום ששולם.","משה ושירה שולטים יחד, ולכל אחד מהם מחצית מהקולות ומחצית מהדיבידנד.","לשירה 80% מהקולות ו-80% מהדיבידנד, כי היא מחזיקה 80% מהמניות.","למשה ולשירה מחצית מהקולות כל אחד, כי הערך הנקוב של אחזקותיהם זהה (6,000 ₪)."],"a":0,"why":"הצבעה: ברירת המחדל היא קול אחד לכל מניה (ס' 82(ג)). שירה מחזיקה 1,200 מתוך 1,500 מניות, כלומר 80% מהקולות. דיבידנד: לפי הערך הנקוב (ס' 306(ב)). ע.נ. של משה 300×20 = 6,000 ₪ ושל שירה 1,200×5 = 6,000 ₪, ולכן חלוקה שווה.","w":["","המחיר ששולם עבור המניות לא קובע לא את ההצבעה ולא את הדיבידנד.","השליטה לא משותפת: לשירה לבדה 80% מהקולות.","דיבידנד לא מחולק לפי מספר המניות אלא לפי הערך הנקוב (ס' 306(ב)), ולכן שירה מקבלת 50% ולא 80%.","הערך הנקוב קובע את הדיבידנד, לא את ההצבעה. ההצבעה לפי מספר המניות (ס' 82(ג))."],"secs":["82(ג)","306(ב)"]},{"id":"u9-2","q":"בתקנון חברת ״תמר בע״מ״ נקבעו שני סוגי מניות: מניות רגילות ומניות הנהלה. למניות ההנהלה ניתנו 10 קולות למניה, ולמניות הרגילות קול אחד. על הדיבידנד התקנון שותק. למניות ערך נקוב זהה. מה נכון?","o":["ההוראה בטלה, כי לפי ס' 82(ג) לכל מניה קול אחד בכל מקרה.","הדיבידנד יחולק לפי מספר הקולות, כי התקנון קבע זכויות הצבעה שונות.","חברה רשאית לקבוע זכויות הצבעה שונות רק באישור בית המשפט.","ההוראה תקפה; הדיבידנד יחולק לפי הערך הנקוב, ולכן כל מניה, רגילה או של הנהלה, מקבלת אותו סכום.","מניות ההנהלה אינן זכאיות לדיבידנד, כי מניות הנהלה מקנות זכויות ניהול בלבד."],"a":3,"why":"ס' 82(א) מתיר לקבוע בתקנון זכויות הצבעה שונות לסוגי מניות, וס' 82(ג) הוא רק ברירת מחדל. הדיבידנד מחולק לפי ערך נקוב (ס' 306(ב)), אלא אם התקנון קבע אחרת. כאן הוא שותק והערך הנקוב שווה.","w":["ס' 82(ג) חל רק כשהתקנון לא קבע זכויות הצבעה שונות.","אין קשר בין זכויות הצבעה לזכויות לדיבידנד; כל אחת נקבעת לפי הכלל שלה.","אין דרישה לאישור בית משפט; זה עניין לתקנון (ס' 82(א)).","","זכויות סוג נקבעות בתקנון. כשהתקנון לא שולל דיבידנד ממניות ההנהלה, הן זכאיות לו כמו כל מניה (ס' 190, ס' 306(ב))."],"secs":["82(א)","306(ב)"]},{"id":"u9-3","q":"יעל מחזיקה 30% ממניות חברה פרטית רווחית מאוד. שלוש שנים לא חולק דיבידנד, והדירקטוריון, שבעל השליטה מינה, מסרב לחלק. יעל פונה לבית המשפט ודורשת ״את חלקה ברווחים״ על סמך ס' 190. מה נכון?","o":["יעל זכאית לדיבידנד מכוח ס' 190 בכל שנה שבה יש רווחים.","אין לבעל מניה זכות לחייב חלוקה; הזכות לדיבידנד קמה רק אם החברה החליטה לחלק. אם המדיניות נועדה לפגוע במיעוט, יעל יכולה לטעון לקיפוח לפי ס' 191.","מבחן הרווח מתקיים, ולכן החברה חייבת לחלק דיבידנד.","יעל רשאית להגיש תביעה נגזרת כדי לחייב את החברה לשלם לה דיבידנד.","האסיפה הכללית מוסמכת תמיד להחליט על חלוקה במקום הדירקטוריון, ולכן יעל צריכה לזמן אסיפה."],"a":1,"why":"לפי ס' 306(א) ו-ס' 190, הזכות לדיבידנד קיימת ״אם החליטה על כך החברה״. ההחלטה בידי הדירקטוריון, אלא אם התקנון קובע אחרת (ס' 307). אי-חלוקה שיטתית שנועדה לדחוק את המיעוט עשויה להיות קיפוח, ובית המשפט רשאי לתת הוראות להסרתו (ס' 191, ס' 192(ב)).","w":["ס' 190 מפנה לס' 306: אין דיבידנד בלי החלטה.","","מבחן הרווח הוא תנאי שמתיר חלוקה, לא חובה לחלק (ס' 302(א) ״רשאית״).","תביעה נגזרת היא בשם החברה ולטובתה; הכסף הולך לחברה. היא לא כלי לגבות דיבידנד אישי.","ההחלטה בדירקטוריון (ס' 307); לאסיפה יש תפקיד רק אם התקנון קבע זאת."],"secs":["306(א)","307"]},{"id":"u9-4","q":"בחברה ציבורית אין בעל שליטה. בעל מניות המחזיק 6% יודע מסקר קולות שהצבעתו תכריע בשאלת אישור מיזוג. מה נכון לגבי חובותיו?","o":["אין לו חובות מיוחדות, כי אינו בעל שליטה ואינו נושא משרה.","הוא חב חובת אמונים כלפי החברה, כמו נושא משרה.","הוא חב חובת הגינות רק אם הוא מחזיק לפחות 25% מזכויות ההצבעה.","הוא חייב לנהוג בתום לב, אבל רק כלפי החברה ולא כלפי בעלי המניות האחרים.","הוא חייב לנהוג בתום לב ובדרך מקובלת בהצבעה על המיזוג, ובנוסף מוטלת עליו חובת הגינות כלפי החברה כבעל ״קול מכריע״."],"a":4,"why":"כל בעל מניה חייב לנהוג בתום לב ובדרך מקובלת, כלפי החברה וכלפי בעלי המניות האחרים, ובכלל זה בהצבעה על מיזוג (ס' 192(א)(3)). מי שיודע שקולו יכריע חב גם חובת הגינות (ס' 193(א)(2)).","w":["ס' 192 חל על כל בעל מניה, וס' 193(א)(2) חל על בעל קול מכריע בלי קשר לשליטה.","חובת אמונים (ס' 254) מוטלת על נושאי משרה, לא על בעלי מניות.","אין רף של 25% בס' 193; הרף של 25% בס' 268 נוגע לאישור עסקאות.","ס' 192(א) מטיל את החובה ״כלפי החברה וכלפי בעלי המניות האחרים״.",""],"secs":["192","193"]},{"id":"u9-5","q":"מהי התרופה שקובע החוק להפרת חובת ההגינות של בעל שליטה?","o":["עונש פלילי בלבד.","ביטול אוטומטי של כל החלטת אסיפה שבה הצביע.","הדינים החלים על הפרת חוזה, בשינויים המחויבים ובשים לב למעמדו בחברה.","הרמת מסך אוטומטית וייחוס כל חובות החברה אליו.","שלילת זכויות ההצבעה שלו לשלוש שנים."],"a":2,"why":"ס' 193(ב) קובע שעל הפרת חובת הגינות יחולו הדינים החלים על הפרת חוזה, בשינויים המחויבים, בשים לב למעמדו של המפר בחברה.","w":["החוק לא קובע עבירה פלילית על הפרת ס' 193; התרופה חוזית.","אין ביטול אוטומטי; ההחלטה עשויה להיפגע לפי דיני החוזים או בתביעה מתאימה, אבל זו לא ״תרופה אוטומטית״.","","הרמת מסך (ס' 6) דורשת תנאים משלה ונתונה לשיקול דעת בית המשפט; היא לא תוצאה אוטומטית של הפרת הגינות.","אין בחוק סנקציה כזו."],"secs":["193(ב)","192(ג)"]},{"id":"u9-6","q":"איזו מהטענות הבאות נכונה לגבי תביעת קיפוח לפי ס' 191?","o":["אפשר להגיש אותה גם כשיש רק ״חשש מהותי״ לקיפוח, ובית המשפט רשאי להורות, בין השאר, שהחברה או בעלי מניות ירכשו מניות, כשרכישה בידי החברה כפופה לס' 301.","יש להגיש קודם דרישה בכתב לדירקטוריון, ורק אחרי 45 ימים לפנות לבית המשפט.","בית המשפט מוסמך רק לבטל את ההחלטה המקפחת.","רק בעל מניות המחזיק לפחות 5% רשאי להגיש אותה.","הסעד בתביעת קיפוח ניתן לחברה, ובעל המניה מקבל רק גמול."],"a":0,"why":"ס' 191(א) חל גם כשיש ״חשש מהותי״, ומקנה לבית המשפט סמכות רחבה: הוראות לניהול עניינים בעתיד ורכישת מניות בידי בעלי המניות או החברה, ״בכפוף להוראות סעיף 301״.","w":["","דרישה מוקדמת ופרק 45 הימים שייכים לתביעה הנגזרת (ס' 194, ס' 196).","בית המשפט רשאי לתת ״הוראות הנראו
