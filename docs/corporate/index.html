גבוהה מחובת תום הלב של בעל מניה רגיל (ס' 192) ומחובת ההגינות של בעל שליטה (ס' 193). ארבע הפסקאות של ס' 254(א) הן <b>דוגמאות</b> (\"ובכלל זה\") ולא רשימה סגורה. גם שימוש בנכסי החברה לצרכים פרטיים הוא הפרה, אף שאינו מופיע במפורש ברשימה."},{"t":"table","head":["פסקה","מה אסור / מה חובה","דוגמה טיפוסית בבחינה"],"rows":[["254(א)(1) ניגוד עניינים","לפעול כשיש ניגוד בין התפקיד בחברה לבין תפקיד אחר או עניין אישי","סמנכ\"לית שממליצה להתקשר עם חברה של בן זוגה; דירקטור שמכהן גם בחברה הצד השני לעסקה"],["254(א)(2) תחרות","לעסוק בפעילות מתחרה בעסקי החברה","מנכ\"ל שמקים \"בצד\" עסק שמוכר מוצרים דומים"],["254(א)(3) הזדמנות עסקית","לנצל לעצמו או לאחר הזדמנות ששייכת לחברה","נושא משרה שרוכש לעצמו נכס בתחום פעילות החברה שהוצע לו בזכות תפקידו"],["254(א)(4) גילוי","חובה חיובית: לגלות ולמסור לחברה ידיעות ומסמכים שהגיעו בתוקף התפקיד","מנכ\"ל שמסתיר מהדירקטוריון דיווחי תקלות או הצעה שהגיעה לחברה"]]},{"t":"h","x":"ניצול הזדמנות עסקית: איך מזהים \"הזדמנות של החברה\"?"},{"t":"p","x":"החוק אינו מגדיר \"הזדמנות עסקית של החברה\", ובית המשפט העליון טרם הכריע בסוגיה. המחלקה הכלכלית גיבשה מבחנים, ובבחינה כדאי להפעיל את כולם ולשקלל:"},{"t":"list","x":["<b>מבחן ההסכמה (תחום הפעילות):</b> מהו תחום הפעילות שעליו הסכימו הצדדים, או שהחברה הציגה כתחומה, למשל בתשקיף או בהסכם תיחום? האם ההזדמנות נמצאת בתוכו?","<b>מבחן התחרות:</b> האם ניצול ההזדמנות בידי נושא המשרה יעמיד אותו בתחרות עם החברה?","<b>המבחן הקנייני:</b> האם ההזדמנות \"שייכת\" לחברה? למשל, החברה ניהלה מגעים או הביעה עניין, המידע הגיע לנושא המשרה <b>בתוקף תפקידו</b> (ס' 254(א)(4)), או שנעשה שימוש במשאבי החברה.","<b>החלטת החברה:</b> אם החברה שקלה את ההזדמנות לגופה והחליטה עניינית לוותר עליה, היא אינה עוד הזדמנות שלה. לעומת זאת, הטענה ש\"החברה ממילא לא הייתה יכולה לנצל\" <b>אינה פוטרת</b> כשלעצמה. ההחלטה נתונה לחברה, אחרי גילוי מלא, ולא לנושא המשרה."]},{"t":"case","name":"תנ\"ג 61475-07-14 דהן נ' דהן","x":"פסק דין מרכזי לזיהוי הזדמנות \"של החברה\" לפי ס' 254(א)(3). המבחן הראשון הוא מבחן ההסכמה, כלומר תחום הפעילות שעליו הסכימו הצדדים, ולצדו מבחני עזר: מבחן התחרות והמבחן הקנייני. יחסים עכורים בין בעלי המניות אינם פוטרים מהחובה שלא לנצל הזדמנות של החברה."},{"t":"case","name":"תנ\"ג 31523-06-20 שאלתיאל נ' חברת רני צים מרכזי קניות בע\"מ","x":"כשהחברה החליטה עניינית שלא להתקשר בעסקה, ההזדמנות אינה \"הזדמנות עסקית\" שלה, ובעל השליטה, שהוא גם המנכ\"ל, רשאי לבצע אותה בעצמו. לא כל עסקה שמובאת בפני החברה היא הזדמנות שלה."},{"t":"example","title":"דוגמה: נדל\"ן ליד המחסנים","x":"<b>עובדות:</b> סמנכ\"ל התפעול בחברה ציבורית לשיווק מזון קיבל הצעה לרכוש מגרש מסחרי באזור התעשייה שבו נמצאים מחסני החברה. ההצעה הגיעה אליו ממתווך שמכיר אותו מעבודתו מול החברה.\n<b>פתרון:</b> המגרש קשור לתחום הפעילות של החברה (אחסון והתרחבות), ולחברה ציפייה סבירה לנכסים באזור. בנוסף, המידע הגיע לסמנכ\"ל בזכות תפקידו. לכן זו ככל הנראה <b>הזדמנות של החברה</b> (ס' 254(א)(3)). עליו להציג אותה לחברה (ס' 254(א)(4)). רק אם החברה תוותר, והפעולה תאושר לפי ס' 255, הוא יוכל לרכוש את המגרש לעצמו. אם ירכוש בלי זאת, החברה זכאית לתרופות לפי ס' 256, כולל השבת הרווח ונאמנות קונסטרוקטיבית על הנכס."},{"t":"h","x":"אישור פעולה שיש בה ניגוד עניינים (ס' 255)"},{"t":"p","x":"חובת האמונים אינה איסור מוחלט. חברה <b>רשאית לאשר</b> פעולה מהפעולות שבס' 254(א), כגון ניצול הזדמנות שהחברה החליטה לוותר עליה או כהונה בתאגיד מתחרה, אם מתקיימים התנאים של ס' 255."},{"t":"law","law":"חוק החברות","sec":"255","x":"(א) חברה רשאית לאשר פעולה מהפעולות המנויות בסעיף 254(א) ובלבד שנתקיימו כל התנאים האלה: (1) נושא המשרה פועל בתום לב והפעולה או אישורה אינן פוגעות בטובת החברה; (2) נושא המשרה גילה לחברה, זמן סביר לפני המועד לדיון באישור, את מהות ענינו האישי בפעולה, לרבות כל עובדה או מסמך מהותיים. (ב) אישור החברה לפעולות שאינן פעולות מהותיות יינתן לפי הוראות הפרק החמישי לענין אישור עסקאות, ואישור החברה לפעולות מהותיות יינתן לפי הוראות הפרק החמישי לענין אישור עסקאות חריגות;"},{"t":"steps","title":"מסלול אישור פעולה לפי ס' 255","x":["<b>גילוי:</b> נושא המשרה מגלה את מהות עניינו האישי, לרבות כל עובדה ומסמך מהותיים, <b>זמן סביר לפני</b> הדיון (ס' 255(א)(2)).","<b>סיווג:</b> ועדת הביקורת מחליטה, בנימוקים, אם הפעולה <b>מהותית</b> או <b>אינה מהותית</b> (ס' 117(1א)).","<b>פעולה שאינה מהותית:</b> מאושרת כמו עסקה רגילה עם נושא משרה, כלומר <b>בדירקטוריון</b>, אלא אם התקנון קבע אחרת (ס' 255(ב) עם ס' 271).","<b>פעולה מהותית:</b> מאושרת כמו עסקה חריגה, כלומר <b>ועדת ביקורת ← דירקטוריון</b> (ס' 255(ב) עם ס' 272(א)). אם לרוב הדירקטורים עניין אישי באישור, נדרש גם אישור האסיפה הכללית (ס' 278(ג)).","<b>הימנעות:</b> בפעולה מהותית, בעל העניין האישי אינו נוכח בדיון בוועדה ובדירקטוריון ואינו מצביע. נושא משרה רשאי להיות נוכח רק לשם הצגה, אם יו\"ר הוועדה או הדירקטוריון קבע שזה נדרש (ס' 278(א)). ס' 278(א) מחריג עסקאות לפי ס' 271, ולכן בפעולה שאינה מהותית הוא אינו מחייב הימנעות, אך מומלץ להימנע.","<b>תוכן:</b> האישור תקף רק אם נושא המשרה פעל בתום לב והפעולה אינה פוגעת בטובת החברה (ס' 255(א)(1)). פעולה שלא אושרה כדין היא הפרת אמונים, ותוקפה נבחן לפי ס' 280 (ס' 255(ב) סיפא)."]},{"t":"trap","x":"<b>מלכודת:</b> \"הדירקטוריון אישר, ולכן אין הפרה\". אישור תקף רק אם קדם לו <b>גילוי מלא</b> בזמן סביר, אם התקבל ב<b>אורגן הנכון</b> (ועדת ביקורת לפני הדירקטוריון בפעולה מהותית), ואם בעל העניין <b>לא השתתף</b>. אישור אינו מכשיר פעולה שנעשתה בחוסר תום לב או שפוגעת בטובת החברה."},{"t":"h","x":"תרופות על הפרת חובת האמונים (ס' 256)"},{"t":"law","law":"חוק החברות","sec":"256","x":"(א) על הפרת חובת אמונים של נושא משרה כלפי החברה יחולו הדינים החלים על הפרת חוזה, בשינויים המחויבים. (ב) בלי לגרוע מכלליות האמור בסעיף קטן (א), רואים נושא משרה שהפר חובת אמונים כלפי החברה כמי שהפר את התקשרותו עם החברה. (ג) חברה רשאית לבטל פעולה שעשה נושא משרה בשם החברה כלפי אדם אחר או לתבוע מאותו אדם את הפיצויים המגיעים לה מנושא המשרה, אף בלא ביטול הפעולה, אם אותו אדם ידע על הפרת חובת האמונים של נושא המשרה, וידע או היה עליו לדעת על היעדר אישור לפעולה. (ד) חזקה על אדם שלא היה עליו לדעת על העדר אישור לפעולה כנדרש לפי פרק זה אם קיבל את אישור הדירקטוריון לכך שנתקבלו כל האישורים הנדרשים לפעולה."},{"t":"list","x":["<b>כלפי נושא המשרה</b> (ס' 256(א)–(ב)): כל תרופות הפרת חוזה. פיצויים על הנזק, אכיפה וצו מניעה (למשל לחדול מתחרות), והשבה. הפסיקה מכירה גם בחובה <b>להשיב את הרווח</b> שהפיק נושא המשרה מההפרה, גם אם לחברה לא נגרם נזק מוכח, וב<b>נאמנות קונסטרוקטיבית</b>: הנכס או ההזדמנות שנלקחו מוחזקים בעבור החברה.","<b>כלפי הצד השלישי</b> (ס' 256(ג)): החברה רשאית לבטל את הפעולה מול הצד השלישי, או לתבוע ממנו פיצוי בלי לבטל. התנאים <b>מצטברים</b>: הוא <b>ידע</b> על הפרת האמונים, <b>וגם</b> ידע או היה עליו לדעת שאין לפעולה אישור.","<b>הגנת הצד השלישי</b> (ס' 256(ד)): צד שלישי שקיבל <b>אישור דירקטוריון</b> שכל האישורים הנדרשים התקבלו, נהנה מחזקה שלא היה עליו לדעת על היעדר האישור."]},{"t":"h","x":"חובות אחרי סיום הכהונה"},{"t":"p","x":"חובת האמונים צומחת מהכהונה. בית המשפט העליון טרם קבע במפורש מה היקפה אחרי ההתפטרות, אבל הגישה המקובלת בפסיקת המחלקה הכלכלית ובספרות היא שהיא <b>אינה פוקעת אוטומטית</b> ביום העזיבה. נושא משרה לשעבר אינו רשאי לנצל הזדמנות עסקית שנולדה או \"הבשילה\" בחברה בזמן כהונתו, ובוודאי שאינו רשאי להתפטר <b>כדי</b> לנצל אותה. הוא גם אינו רשאי להשתמש במידע סודי של החברה. מנגד, חופש העיסוק מאפשר לו, ככלל, להתחרות בחברה אחרי שעזב. תניית אי-תחרות תיאכף רק אם היא מגינה על אינטרס לגיטימי. ככל שעבר זמן רב יותר מהעזיבה וההזדמנות רחוקה יותר ממה שטיפל בו, כך החובה נחלשת."},{"t":"case","name":"ע\"א 6601/96 AES System Inc. נ' משה סער","x":"נקבע לגבי עובדים לשעבר: תניית אי-תחרות אחרי סיום העבודה תיאכף רק אם היא מגינה על \"אינטרס לגיטימי\" של המעסיק, כמו סוד מסחרי. אחרת היא נוגדת את תקנת הציבור ואת חופש העיסוק. זה הרקע לאיזון שבין חובת האמונים של נושא משרה לשעבר לבין חופש העיסוק שלו."},{"t":"trap","x":"<b>מלכודת:</b> \"איתי כבר התפטר, ולכן חובת האמונים לא חלה עליו\". זו טעות כשההזדמנות היא <b>אותה עסקה</b> שניהל בשם החברה, הוא פנה אליה <b>זמן קצר</b> אחרי העזיבה, ועשה זאת דרך חברה <b>מתחרה</b>. כאן החובה חלה, והתרופות של ס' 256 עומדות לחברה."},{"t":"h","x":"האכיפה: מי תובע את נושא המשרה?"},{"t":"p","x":"עילת התביעה בגין הפרת חובות נושא משרה היא <b>של החברה</b>, ולכן התובעת הטבעית היא החברה עצמה, באמצעות הדירקטוריון. אבל כשהמפר הוא המנכ\"ל, בעל השליטה או דירקטורים, החברה לרוב לא תתבע. לכן החוק מאפשר <b>תביעה נגזרת</b>: בעל מניה או דירקטור תובעים בשם החברה, והפיצוי משולם לחברה."},{"t":"steps","title":"תביעה נגזרת בקצרה","x":["<b>דרישה בכתב</b> לחברה, שמופנית ליו\"ר הדירקטוריון ומפרטת את העובדות והנימוקים (ס' 194(ב)–(ג)).","<b>פטור מדרישה</b> במקרים האלה: לאורגן המוסמך עניין אישי (או למחצית ומעלה מחבריו), או שיש חשש סביר שהפנייה תסכל את הסעד (ס' 194(ד)).","<b>תגובת החברה:</b> לסלק את העילה, לדחות בנימוקים, או לתבוע בעצמה (ס' 195). עליה להשיב בתוך 45 ימים (ס' 196).","<b>אישור בית המשפט:</b> הוא יאשר אם שוכנע שלכאורה התביעה וניהולה <b>לטובת החברה</b>, ושהתובע <b>אינו פועל בחוסר תום לב</b> (ס' 198(א))."]},{"t":"case","name":"ע\"א 4857/16 מנשה נ' יוויז'ן אייר בע\"מ","x":"כלל שיקול הדעת העסקי חל גם על החלטת הדירקטוריון אם להגיש תביעה בשם החברה, כולל החלטה שלא לתבוע, במיוחד כשהתביעה היא נגד צד שלישי. החלטה שהתקבלה בהליך תקין מוגנת מפני התערבות בבקשה לאישור תביעה נגזרת. אבל כשהדירקטורים עצמם נגועים, למשל כשהתביעה היא נגדם או נגד בעל השליטה, ההגנה אינה חלה."},{"t":"exam","x":"<b>איך זה נשאל:</b> כמעט בכל מבחן יש שאלה פתוחה על נושא משרה (סמנכ\"לית, מנכ\"ל או מנכ\"ל לשעבר) שעשה אחד הדברים האלה: יצר התחייבויות ברשלנות, הסתיר מידע, הציע עסקה עם קרוב, ניצל הזדמנות או התפטר ומיד התחרה. \n<b>מבנה מומלץ (עד 15 שורות):</b> (1) מעמד: נושא משרה לפי ס' 1. (2) החובה הרלוונטית: זהירות (ס' 252–253) ו/או אמונים (ס' 254(א)(1)–(4)), כולל ציון הפסקה המדויקת. (3) יישום: בזהירות, כלל שיקול הדעת העסקי ומבחן התהליך; בהזדמנות, מבחני הפסיקה. (4) האם הייתה דרך חוקית? גילוי ואישור לפי ס' 255, סיווג בוועדת הביקורת (ס' 117(1א)) והימנעות (ס' 278). (5) תוצאה ותרופות: ס' 256(א)–(ג), השבת רווחים, נאמנות קונסטרוקטיבית, ואחריות כלפי צד שלישי לפי ס' 252(ב). (6) מסלול אכיפה: החברה או תביעה נגזרת (ס' 194, 198). אם רלוונטי, ציינו שאין פטור (ס' 259 ו-263).\n<b>מה מוריד ניקוד:</b> לבלבל בין חובת זהירות לחובת אמונים, לשכוח את ס' 255 כ\"דרך החוקית\", ולכתוב \"הדירקטוריון אישר\" בלי לבדוק גילוי, אורגן והימנעות."}],"mcq":[{"id":"u5-1","q":"בחברה ציבורית מכהנים: מנכ\"ל; סמנכ\"לית כספים הכפופה ישירות למנכ\"ל; מנהל אזור צפון הכפוף לסמנכ\"ל השיווק; דירקטור חיצוני; ו\"נשיא\" שממלא בפועל את תפקיד המשנה למנכ\"ל. מי מהם <b>אינו</b> \"נושא משרה\" לפי חוק החברות?","o":["הנשיא, כי תוארו אינו מופיע בהגדרה","סמנכ\"לית הכספים, כי אינה דירקטורית","הדירקטור החיצוני, כי אינו קשור לבעל השליטה","כולם נושאי משרה","מנהל אזור צפון"],"a":4,"why":"ההגדרה בס' 1 כוללת דירקטור, מנכ\"ל ובכירים מקבילים \"אף אם תוארו שונה\", ומנהל \"הכפוף במישרין למנהל הכללי\". מנהל אזור כפוף לסמנכ\"ל, ולא ישירות למנכ\"ל, ולכן אינו נושא משרה.","w":["ההגדרה מהותית: \"כל ממלא תפקיד כאמור בחברה אף אם תוארו שונה\" (ס' 1).","מנהל הכפוף במישרין למנכ\"ל הוא נושא משרה גם אם אינו דירקטור (ס' 1).","כל דירקטור, כולל דירקטור חיצוני, הוא נושא משרה (ס' 1).","מנהל אזור הכפוף לסמנכ\"ל אינו כפוף במישרין למנכ\"ל, ולכן אינו נושא משרה.",""],"secs":["1"]},{"id":"u5-2","q":"דירקטוריון חברה אישר רכישת מפעל אחרי שני דיונים, לאחר שקיבל חוות דעת שמאי ובדיקת נאותות, ואף אחד מהדירקטורים לא היה בעל עניין אישי. כעבור שנה התברר שהרכישה הסבה הפסד כבד. מה נכון?","o":["סביר שההחלטה מוגנת בכלל שיקול הדעת העסקי, כי התקבלה בהיעדר ניגוד עניינים, בתום לב ובאופן מיודע","הדירקטורים אחראים, אלא אם בתקנון יש הוראת פטור, והפטור יכול להינתן גם עכשיו","הדירקטורים הפרו את חובת האמונים, כי פעלו בניגוד לטובת החברה","הדירקטורים הפרו את חובת הזהירות, כי ההחלטה הסבה הפסד","ההחלטה מוגנת רק אם אושרה גם באסיפה הכללית"],"a":0,"why":"כלל שיקול הדעת העסקי, שאומץ בפסיקה, מגן על החלטה שהתקבלה בלי ניגוד עניינים, בתום לב ועל בסיס מידע סביר (ס' 253). בודקים את תהליך קבלת ההחלטה, לא את תוצאתה.","w":["","פטור ניתן רק <b>מראש</b> (ס' 259(א)). פטור בדיעבד חסר תוקף. בנוסף, נראה שאין כאן הפרה.","אין בעובדות ניגוד עניינים או חוסר תום לב, ולכן אין הפרת אמונים (ס' 254).","הפסד כשלעצמו אינו הפרה. בודקים את התהליך (ס' 253), לא את התוצאה.","הכלל אינו מותנה באישור האסיפה הכללית."],"secs":["252","253"]},{"id":"u5-3","q":"מהו המבחן לרמת הזהירות הנדרשת מנושא משרה לפי ס' 253?","o":["מבחן תוצאתי: האם ההחלטה הניבה רווח לחברה","רמת זהירות הקבועה בתקנון החברה","רמת המיומנות של מומחה בכיר בתחום, ללא קשר לתפקיד","רמת המיומנות של נושא משרה סביר באותה עמדה ובאותן נסיבות, לרבות נקיטת אמצעים סבירים לקבלת מידע","מבחן סובייקטיבי: מה נושא המשרה עצמו ידע ויכול היה לעשות"],"a":3,"why":"ס' 253 קובע מבחן אובייקטיבי (\"נושא משרה סביר\") שמותאם לעמדה ולנסיבות, ומטיל חובה לנקוט אמצעים סבירים לקבלת מידע.","w":["המבחן הוא מבחן התנהגות ותהליך, לא מבחן תוצאה.","התקנון אינו קובע את רמת הזהירות. הוא יכול לכל היותר לאפשר פטור מראש (ס' 259).","המבחן מותאם לעמדה ולנסיבות, ואינו \"מומחה עליון\" כללי.","","המבחן אובייקטיבי. \"לא ידעתי\" אינה הגנה (ס' 253)."],"secs":["253"]},{"id":"u5-4","q":"דנה, סמנכ\"לית פיתוח עסקי בחברת \"סולאריס בע\"מ\" שמקימה שדות סולאריים, נפגשה בשם החברה עם בעל קרקע שהציע להחכיר שטח מתאים לשדה סולארי. דנה החכירה את הקרקע לעצמה דרך חברה פרטית שבבעלותה. היא טוענת שהחברה ממילא לא הייתה יכולה לממן את הפרויקט. מה נכון?","o":["מותר לדנה לפעול כך, כי פעלה דרך תאגיד נפרד ולא בעצמה","ההזדמנות שייכת לחברה רק אם הדירקטוריון כבר החליט רשמית להתקשר עם בעל הקרקע","דנה ניצלה הזדמנות עסקית של החברה. היה עליה לגלות אותה לחברה ולקבל אישור לפי ס' 255, ו\"חוסר היכולת\" של החברה אינו פוטר אותה כשלעצמו","דנה לא הפרה חובה, כי החברה לא הייתה יכולה לנצל את ההזדמנות","דנה הפרה רק את חובת הזהירות"],"a":2,"why":"ההזדמנות היא בתחום הפעילות של החברה, והגיעה לדנה בתוקף תפקידה. לכן זו הזדמנות של החברה (ס' 254(א)(3)), ודנה חייבת לגלות אותה (ס' 254(א)(4)). ההחלטה אם לוותר נתונה לחברה, אחרי גילוי ואישור לפי ס' 255.","w":["האיסור חל על ניצול הזדמנות \"להשיג טובת הנאה לעצמו או לאחר\" (ס' 254(א)(3)). פעולה דרך תאגיד אינה מכשירה.","אין צורך בהחלטה פורמלית. די בקשר לתחום הפעילות, בציפייה סבירה ובכך שהמידע הגיע בתוקף התפקיד.","","הטענה שהחברה לא הייתה יכולה לנצל את ההזדמנות אינה פוטרת כשלעצמה. ההחלטה שייכת לחברה.","זו הפרה של חובת האמונים (ס' 254(א)(3)–(4)), לא רק של חובת הזהירות."],"secs":["254","255"]},{"id":"u5-5","q":"דירקטור בחברה ציבורית מבקש אישור לכהן גם כדירקטור בחברה שפועלת בתחום סמוך לתחום החברה. ועדת הביקורת סיווגה את הפעולה כ\"מהותית\". איזה אישור נדרש?","o":["אישור ועדת הביקורת ולאחר מכן אישור הדירקטוריון, אחרי שהדירקטור גילה את עניינו זמן סביר לפני הדיון ובכפוף לתום לב ולהיעדר פגיעה בחברה","אי אפשר לאשר פעולה שיש בה תחרות עם עסקי החברה","אישור ועדת התגמול ולאחר מכן אישור הדירקטוריון","אישור האסיפה הכללית ברוב מיוחד בלבד","אישור הדירקטוריון בלבד"],"a":0,"why":"לפי ס' 255(ב), פעולה מהותית מאושרת לפי כללי העסקה החריגה בפרק החמישי, כלומר ועדת ביקורת ← דירקטוריון (ס' 272(א)). התנאים המהותיים הם ס' 255(א)(1)–(2).","w":["","ס' 255(א) מתיר במפורש לאשר פעולה מהפעולות שבס' 254(א), כולל תחרות.","ועדת התגמול עוסקת בתנאי כהונה והעסקה (ס' 118ב), לא בפעולות שיש בהן ניגוד עניינים.","אסיפה ברוב מיוחד היא מסלול של עסקאות בעל שליטה (ס' 275), לא של אישור לפי ס' 255.","דירקטוריון בלבד הוא המסלול לפעולה <b>שאינה</b> מהותית (ס' 255(ב) עם ס' 271)."],"secs":["255","272"]},{"id":"u5-6","q":"איזה גוף בחברה ציבורית מחליט אם פעולה של נושא משרה, שנדרש לה אישור לפי ס' 255, היא \"מהותית\" או \"אינה מהותית\"?","o":["ועדת התגמול","ועדת הביקורת, על יסוד נימוקים שיפורטו","המנכ\"ל","הדירקטוריון","האסיפה הכללית"],"a":1,"why":"ס' 117(1א) מסמיך את ועדת הביקורת להחליט, על יסוד נימוקים, לגבי פעולות לפי ס' 255 אם הן מהותיות. היא רשאית לעשות זאת גם לגבי סוג של פעולות, לפי אמות מידה שתקבע אחת לשנה מראש.","w":["ועדת התגמול עוסקת בתגמול (ס' 118ב), לא בסיווג פעולות לפי ס' 255.","","למנכ\"ל אין סמכות סיווג, וייתכן שהוא עצמו בעל העניין.","הדירקטוריון מאשר אחרי הסיווג, אבל הסיווג עצמו בידי ועדת הביקורת (ס' 117(1א)).","האסיפה אינה מסווגת פעולות."],"secs":["117","255"]},{"id":"u5-7","q":"סמנכ\"ל רכש הפר את חובת האמונים: הוא התקשר בשם החברה עם ספק שמשלם לו \"עמלה\" בסתר, בלי שהעסקה אושרה. הספק ידע על ההפרה. מה נכון?","o":["החברה רשאית לבטל רק אם הספק הוא \"קרוב\" של הסמנכ\"ל","הספק מוגן תמיד, כי התקשר עם נושא משרה שפעל בשם החברה","החברה רשאית לבטל את החוזה רק אם הוכיחה נזק של יותר מ-10% משווי העסקה","החברה יכולה לתבוע רק את הסמנכ\"ל, והחוזה עם הספק תקף בכל מקרה","החברה רשאית לבטל את הפעולה כלפי הספק, או לתבוע ממנו פיצויים בלי לבטל, אם הספק ידע על ההפרה וידע או היה עליו לדעת שאין אישור"],"a":4,"why":"ס' 256(ג) מאפשר לחברה לבטל את הפעולה מול הצד השלישי, או לתבוע ממנו את הפיצויים המגיעים לה מנושא המשרה, אם ידע על הפרת האמונים וידע או היה עליו לדעת על היעדר אישור.","w":["הקרבה אינה תנאי. התנאי הוא ידיעת הצד השלישי (ס' 256(ג)).","הצד השלישי מוגן רק אם לא ידע, או אם קיבל אישור דירקטוריון שכל האישורים התקבלו (ס' 256(ד)).","אין בחוק רף נזק כזה.","ס' 256(ג) מקנה תרופה גם כלפי הצד השלישי שידע.",""],"secs":["256"]},{"id":"u5-8","q":"על הפרת חובת האמונים של נושא משרה כלפי החברה חלים:","o":["דיני העונשין בלבד","דיני הפרת חוזה, בשינויים המחויבים","דיני עשיית עושר בלבד, ורק אם הנושא התעשר","דיני הנזיקין בלבד","הוראות התקנון בלבד"],"a":1,"why":"ס' 256(א)–(ב): על הפרת חובת אמונים חלים דיני הפרת חוזה, ונושא המשרה נחשב כמי שהפר את התקשרותו עם החברה. בנוסף, הפסיקה מכירה בהשבת רווחים ובנאמנות קונסטרוקטיבית.","w":["הסנקציה האזרחית היא לפי דיני החוזים. אחריות פלילית נבחנת בנפרד.","","השבת רווחים היא תרופה אפשרית, אבל המסגרת הקבועה בחוק היא דיני החוזים (ס' 256(א)).","נזיקין הם המסגרת של חובת הזהירות (ס' 252), לא של חובת האמונים.","החובה קוגנטית ואינה נגזרת מהתקנון. אי אפשר לפטור ממנה (ס' 258(א))."],"secs":["256"]},{"id":"u5-9","q":"בעל מניות מיעוט בחברה ציבורית רוצה להגיש תביעה נגזרת נגד המנכ\"ל, שהוא גם בעל השליטה, בטענה שניצל הזדמנות עסקית. רוב חברי הדירקטוריון מונו על ידי המנכ\"ל, ולשניים מתוך חמשת הדירקטורים יש עניין אישי בהחלטה. מה נכון?","o":["עליו לפנות קודם בדרישה בכתב ליו\"ר הדירקטוריון, אלא אם יוכיח חשש סביר שהפנייה תפגע באפשרות לקבל את הסעד","בעל המניות פטור מדרישה מוקדמת, כי הדירקטורים מונו בידי המנכ\"ל","בעל המניות רשאי לתבוע בשמו האישי ולקבל לכיסו את הפיצוי","תביעה נגזרת אינה דורשת אישור בית המשפט","רק דירקטור רשאי להגיש תביעה נגזרת"],"a":0,"why":"לפי ס' 194(ב)–(ג) נדרשת דרישה בכתב ליו\"ר. הפטור לפי ס' 194(ד)(1) חל רק אם לאורגן המוסמך, או למחצית ומעלה מחבריו, עניין אישי. כאן מדובר ב-2 מתוך 5, ולכן הפטור לא חל. נשאר הפטור של \"חשש סביר\" לפי ס' 194(ד)(2).","w":["","עצם המינוי בידי המנכ\"ל אינו \"עניין אישי בהחלטה\". נדרשת מחצית או יותר מחברי האורגן (ס' 194(ד)(1)).","התביעה נגזרת: היא מוגשת בשם החברה, והסעד שייך לחברה.","תביעה נגזרת טעונה אישור בית המשפט (ס' 198(א)).","גם בעל מניה רשאי (ס' 194(א))."],"secs":["194","198"]},{"id":"u5-10","q":"מנהל כספים יצר בשם החברה התחייבויות כלפי ספק, כשהוא יודע שאין בקופה כסף לשלם במועד. הספק נפגע. מה נכון לגבי אחריות מנהל הכספים כלפי הספק?","o":["הספק יכול לתבוע רק בתביעה נגזרת","אין אחריות אישית, כי פעל כאורגן ופעולתו מיוחסת לחברה בלבד","ייתכן שתהיה לו אחריות אישית כלפי הספק, כי חובת הזהירות של נושא משרה אינה מוגבלת לחברה (ס' 252(ב)), ויצירת התחייבות ביודעין עלולה להיות מצג רשלני או אף מרמה","אחריות אישית קיימת רק אם הספק יוכיח שהרים את המסך","אין אחריות, כי חובת האמונים חלה רק כלפי החברה"],"a":2,"why":"ס' 252(ב) קובע שאין מניעה לקיומה של חובת זהירות של נושא משרה כלפי אדם אחר. לפי הפסיקה, אורגן שביצע בעצמו עוולה, למשל מצג או התחייבות ביודעין שלא תיפרע, עשוי לשאת באחריות אישית לצד אחריות החברה.","w":["תביעה נגזרת היא תביעה בשם החברה. הספק תובע בשמו.","ייחוס הפעולה לחברה אינו שולל אחריות אישית של האורגן שביצע את העוולה (ס' 252(ב)).","","אחריות אישית בנזיקין אינה תלויה בהרמת מסך, שעניינה ייחוס חוב החברה לבעל מניה (ס' 6).","גם חובת האמונים יכולה לחול כלפי אחר (ס' 254(ב)). ומעבר לכך, העילה כאן היא בעיקר רשלנות או מרמה."],"secs":["252"]},{"id":"u5-11","q":"לפני שנתיים החליט דירקטוריון חברה ציבורית לאמץ תכנית ציות בתחום הבטיחות. התכנית מעולם לא יושמה, ואף דירקטור לא שאל על כך. כעת אירעה תקלה בטיחותית שגרמה לנזק כבד. מה נכון?","o":["הדירקטורים מוגנים בכלל שיקול הדעת העסקי, כי קיבלו החלטה לאמץ תכנית","ייתכן שהדירקטורים הפרו את חובת הזהירות (חובת הפיקוח): הם לא וידאו שהתכנית מיושמת, ומחדל מתמשך כזה אינו מוגן בכלל שיקול הדעת העסקי","האחריות מוטלת על בעל השליטה בלבד","הדירקטורים הפרו את חובת האמונים, ולכן לא ניתן לבטח אותם","אין אחריות, כי יישום התכנית הוא תפקיד ההנהלה בלבד"],"a":1,"why":"הדירקטוריון \"יפקח על ביצוע תפקידי המנהל הכללי\" (ס' 92(א)). הפיקוח הוא חלק מחובת הזהירות (ס' 252–253). החלטה על הנייר בלי מעקב היא מחדל, וכלל שיקול הדעת העסקי אינו מגן על היעדר החלטה או על חוסר מודעות.","w":["הכלל מגן על החלטה מיודעת, לא על מחדל מתמשך לאחריה.","","חובות הזהירות חלות על כל דירקטור באופן אישי (ס' 252).","מחדל פיקוחי בתום לב הוא בעיקרו הפרת זהירות. בנוסף, ביטוח על הפרת זהירות מותר (ס' 261(1)).","הפיקוח על ההנהלה הוא תפקיד של הדירקטוריון עצמו (ס' 92(א))."],"secs":["92","252","253"]},{"id":"u5-12","q":"איתי כיהן כמנכ\"ל וניהל בשם החברה מגעים מתקדמים לחתימה על הסכם הפצה בלעדי. הוא התפטר, ושבוע אחר כך חתם על אותו הסכם בשם חברה חדשה שהקים, שמשווקת מוצרים מתחרים. מה נכון?","o":["יש הפרה רק אם בחוזה העבודה של איתי הייתה תניית אי-תחרות","מדובר בהפרת חובת זהירות בלבד","אין הפרה, כי חובת האמונים פוקעת עם סיום הכהונה","לפי הפסיקה, חובת האמונים אינה פוקעת אוטומטית עם ההתפטרות. ניצול הזדמנות שהבשילה בחברה בזמן כהונתו הוא הפרה, והחברה זכאית לתרופות לפי ס' 256","מדובר בהפרה רק אם איתי הוא גם בעל מניות בחברה"],"a":3,"why":"הפסיקה קבעה שנושא משרה אינו רשאי לנצל, גם אחרי עזיבה, הזדמנות שנולדה ובשלה בחברה בזמן כהונתו, ובוודאי לא להתפטר כדי לנצלה (ס' 254(א)(2)–(3)). התרופות: ס' 256, כולל השבת רווחים ונאמנות קונסטרוקטיבית.","w":["המקור הוא חובת האמונים עצמה (ס' 254), ולא רק תניה חוזית. התניה רלוונטית לתחרות כללית שאינה קשורה להזדמנות מסוימת.","ניצול הזדמנות ותחרות הם רכיבים של חובת האמונים (ס' 254(א)(2)–(3)).","החובה ממשיכה לחול על הזדמנות שבשלה בזמן הכהונה.","","החובה נובעת ממעמדו כנושא משרה, לא מהחזקת מניות."],"secs":["254","256"]},{"id":"u5-13","q":"איזה מהתנאים הבאים <b>אינו</b> נדרש כדי שחברה תאשר כדין פעולה של נושא משרה לפי ס' 255?","o":["נושא המשרה גילה את מהות עניינו האישי זמן סביר לפני הדיון","הפעולה או אישורה אינם פוגעים בטובת החברה","נושא המשרה פועל בתום לב","הפעולה אושרה בדיעבד באסיפה הכללית ברוב של שני שלישים","נושא המשרה גילה כל עובדה או מסמך מהותיים"],"a":3,"why":"ס' 255(א) דורש תום לב, היעדר פגיעה בטובת החברה, וגילוי מראש של מהות העניין, כולל עובדות ומסמכים מהותיים. דרך האישור קבועה בפרק החמישי (ס' 255(ב)). אין דרישה לאישור אסיפה ברוב של שני שלישים.","w":["הגילוי מראש הוא תנאי (ס' 255(א)(2)).","היעדר פגיעה בטובת החברה הוא תנאי (ס' 255(א)(1)).","תום לב הוא תנאי (ס' 255(א)(1)).","","גילוי העובדות והמסמכים המהותיים הוא תנאי (ס' 255(א)(2))."],"secs":["255"]},{"id":"u5-14","q":"ספק קיבל מהחברה אישור דירקטוריון לכך שהתקבלו כל האישורים הנדרשים להתקשרות, שבה לנושא משרה היה עניין אישי. בדיעבד התברר שוועדת הביקורת לא אישרה את העסקה. מה מעמדו של הספק?","o":["הספק חייב להשיב את כל מה שקיבל","הספק מוגן רק אם האסיפה הכללית אישרה את העסקה","חזקה שלא היה עליו לדעת על היעדר האישור, ולכן החברה תתקשה לבטל את הפעולה כלפיו","הספק אינו מוגן בשום מקרה","הספק מוגן רק אם שילם מחיר שוק מלא"],"a":2,"why":"ס' 256(ד), וגם ס' 282 לגבי עסקאות: חזקה על אדם שלא היה עליו לדעת על היעדר האישור, אם קיבל אישור דירקטוריון שכל האישורים הנדרשים התקבלו.","w":["חובת השבה כלפי צד שלישי קיימת רק אם ידע על ההפרה וידע או היה עליו לדעת על היעדר האישור (ס' 256(ג)).","החזקה מבוססת על אישור הדירקטוריון שהתקבלו כל האישורים, לא על אישור האסיפה.","","החוק מעניק לו חזקה מגינה (ס' 256(ד)).","החוק אינו מתנה את ההגנה במחיר."],"secs":["256","282"]}],"cases":[{"id":"u5-c1","title":"\"מדיקור\" – תקלות שהוסתרו ותכנית ציות שלא יושמה","facts":"\"מדיקור מערכות בע\"מ\" היא חברה ציבורית שמייצרת משאבות עירוי לבתי חולים. גיל אורן מחזיק ב-55% ממניותיה ומכהן כמנכ\"ל וכדירקטור. היתר מוחזקות בידי הציבור. לפני כשנתיים החליט הדירקטוריון לאמץ \"תכנית ציות ובקרת איכות\", אך לא מונה ממונה, לא נקבע נוהל דיווח, והנושא לא עלה שוב בדירקטוריון.\nבמהלך השנה קיבל גיל ארבעה דיווחים ממהנדסי החברה על תקלה במנגנון המינון. הוא החליט שמדובר ב\"תקלות נקודתיות\", המשיך בשיווק ולא דיווח לדירקטוריון. כעבור חודשיים הורה משרד הבריאות על השבתת המשאבות. החברה נאלצה להחזיר את כל המשאבות שמכרה, בעלות של 12 מיליון ₪, ושני בתי חולים הגישו נגדה תביעות.\nבאותה תקופה אישר הדירקטוריון, בישיבה של 25 דקות ועל סמך מצגת של גיל בלבד, רכישה של חברת סטארט-אפ ב-40 מיליון ₪, בלי הערכת שווי ובלי בדיקת נאותות. לאחר מכן התברר שהטכנולוגיה של הסטארט-אפ אינה פועלת.\nבתקנון החברה אין הוראה בדבר פטור, שיפוי או ביטוח. בעל מניות מהציבור, יואב, מבקש לפעול נגד גיל ונגד הדירקטורים.","parts":[{"q":"דונו באחריותו של גיל כלפי החברה בקשר עם התקלות במשאבות. נמקו והפנו לסעיפי החוק ולפסיקה. [עד 15 שורות]","pts":20,"model":["1. גיל הוא נושא משרה, שכן הוא מנכ\"ל ודירקטור (ס' 1). לכן חלות עליו חובות הזהירות (ס' 252–253) והאמונים (ס' 254). כבעל שליטה חלה עליו גם חובת הגינות (ס' 193).","2. חובת זהירות: מנכ\"ל סביר באותן נסיבות היה בודק ארבעה דיווחים חוזרים על תקלה בטיחותית במוצר רפואי, עוצר או מגביל את השיווק, ומעביר את המידע לדירקטוריון (ס' 253: נקיטת אמצעים סבירים לקבלת מידע). גיל לא עשה זאת.","3. חובת דיווח: המנכ\"ל חייב להודיע ליו\"ר הדירקטוריון על כל עניין חריג שהוא מהותי לחברה (ס' 122(א)). תקלה בטיחותית במוצר הליבה היא עניין כזה, וההסתרה היא הפרה.","4. כלל שיקול הדעת העסקי לא יגן על גיל. ההחלטה לא הייתה מיודעת, כי לא נעשתה בדיקה מקצועית. קיים גם חשש לחוסר תום לב, שכן מדובר בהסתרה מכוונת מהדירקטוריון. לעומת זאת, האינטרס של גיל להמשיך במכירות כבעל 55% נובע מעצם החזקת המניות ומשותף לכל בעלי המניות, ולכן כשלעצמו אינו \"עניין אישי\" (ס' 1). עיקר הטענה הוא אפוא היעדר יידוע וחוסר תום לב.","5. חובת אמונים: הסתרת ידיעה שבאה לידיו בתוקף מעמדו מפרה את חובת הגילוי (ס' 254(א)(4)), ולא רק את חובת הזהירות.","6. נזק וקשר סיבתי: לפי העובדות, פעולה מיידית הייתה מונעת חלק מהנזק (ההחזרה, התביעות). לכן גיל אחראי לפחות לחלק המיוחס לעיכוב.","7. אין פטור: בתקנון אין הוראת פטור (ס' 259(א)), ופטור ממילא אינו ניתן בדיעבד. בנוסף, הפרה בכוונה או בפזיזות, וכן הפרת אמונים, אינן ניתנות לפטור (ס' 263)."],"check":["זיהוי גיל כנושא משרה (ס' 1) וכבעל שליטה (ס' 193)","חובת זהירות ורמת זהירות: ס' 252–253","חובת דיווח של המנכ\"ל: ס' 122(א)","כלל שיקול הדעת העסקי ומדוע לא חל: לא מיודע, תום לב, ניגוד עניינים","הפרת חובת הגילוי: ס' 254(א)(4)","קשר סיבתי ונזק","היעדר פטור: ס' 259, 263"]},{"q":"דונו באחריות הדירקטורים בשל אי-יישום תכנית הציות ובשל אישור רכישת הסטארט-אפ. [עד 15 שורות]","pts":20,"model":["1. כל דירקטור הוא נושא משרה (ס' 1) וחב חובת זהירות (ס' 252–253).","2. חובת פיקוח: הדירקטוריון \"יפקח על ביצוע תפקידי המנהל הכללי ופעולותיו\" (ס' 92(א)). קבלת החלטה לאמץ תכנית ציות בלי לוודא את יישומה, במשך שנתיים ובתחום רגיש של בטיחות מוצר רפואי, היא מחדל פיקוחי.","3. כלל שיקול הדעת העסקי אינו מגן על מחדל מתמשך ועל היעדר מעקב. הוא מגן על החלטה מיודעת שהתקבלה בתום לב.","4. רכישת הסטארט-אפ: ההחלטה התקבלה בישיבה קצרה, על סמך מצגת של המנכ\"ל בלבד, בלי הערכת שווי ובלי בדיקת נאותות, בעסקה של 40 מיליון ₪. זו החלטה לא מיודעת, ולכן הדירקטורים הפרו את ס' 253 ואינם נהנים מכלל שיקול הדעת העסקי.","5. מאחר שההגנה אינה חלה, בית המשפט יבחן את ההחלטה לגופה. יש בסיס לאחריות לנזק, כלומר לפער בין המחיר ששולם לשווי האמיתי.","6. גם אחרי שנודע לדירקטור על ליקוי, עליו לפעול לכינוס הדירקטוריון בלי דיחוי (ס' 257). שתיקה מתמשכת מחזקת את ההפרה.","7. ביטוח ושיפוי: גם אילו היו הוראות בתקנון, הם היו אפשריים על רשלנות בלבד (ס' 260–261, 263(2)). כיוון שאין הוראות בתקנון, אין להם כיסוי."],"check":["חובת הפיקוח: ס' 92(א) כחלק מחובת הזהירות","אי-יישום תכנית הציות כמחדל","כלל שיקול הדעת העסקי ותנאיו, ויישום על הרכישה: החלטה לא מיודעת","ס' 253: קבלת מידע, זמן דיון, חוות דעת","ס' 257: חובת דירקטור לפעול בגילוי ליקוי","התייחסות לפטור, שיפוי וביטוח (אין הוראה בתקנון)"]},{"q":"כיצד יכול יואב לפעול, ומה הסיכויים והסעדים? האם לבתי החולים עומדת עילה ישירה נגד גיל? [עד 15 שורות]","pts":20,"model":["1. העילה בגין הפרת חובות נושאי משרה כלפי החברה שייכת לחברה. התובעת הטבעית היא החברה באמצעות הדירקטוריון, אך זה בשליטת גיל והדירקטורים עצמם הם נתבעים.","2. תביעה נגזרת: יואב, כבעל מניה, רשאי להגישה (ס' 194(א)). עליו לפנות בדרישה בכתב ליו\"ר הדירקטוריון (ס' 194(ב)–(ג)).","3. ייתכן פטור מדרישה: אם לאורגן המוסמך להחליט על התביעה, או למחצית ומעלה מחבריו, עניין אישי (ס' 194(ד)(1)). כאן הדירקטורים עצמם נתבעים, ולכן יש בסיס לטענה שלמחצית מהם לפחות עניין אישי בהחלטה.","4. בית המשפט יאשר את התביעה אם שוכנע שלכאורה היא לטובת החברה ושהתובע אינו פועל בחוסר תום לב (ס' 198(א)). כאן הנזק גדול והעילות חזקות.","5. סעדים: פיצויים בנזיקין על הפרת הזהירות (ס' 252), ותרופות של דיני החוזים על הפרת חובת האמונים בהסתרת המידע (ס' 256). הסכומים ישולמו לחברה.","6. בתי החולים: חובת הזהירות של נושא משרה אינה מוגבלת לחברה (ס' 252(ב)). מנכ\"ל שהמשיך לשווק ביודעין מוצר רפואי שעלול להיות פגום ביצע בעצמו התנהגות עוולתית, ולכן עשוי לשאת באחריות אישית לצד אחריות החברה."],"check":["תביעה נגזרת: ס' 194(א)","דרישה מוקדמת ופטור ממנה: ס' 194(ב)–(ד)","אישור בית המשפט: ס' 198(א)","סעדים: נזיקין, ס' 256, והפיצוי לחברה","אחריות אישית כלפי צד שלישי: ס' 252(ב)"]}]},{"id":"u5-c2","title":"\"גלבוע אנרגיה\" – הזדמנות, תחרות והתפטרות","facts":"\"גלבוע אנרגיה בע\"מ\" היא חברה ציבורית שמקימה ומפעילה שדות סולאריים. אין בה בעל שליטה. מירב כיהנה כסמנכ\"לית פיתוח עסקי, כפופה ישירות למנכ\"ל. במסגרת תפקידה ניהלה מירב בשם החברה מגעים עם מושב בצפון להחכרת 300 דונם לשדה סולארי. המגעים היו מתקדמים, וטיוטת הסכם הוכנה בחברה.\nלפני שהוצגה הטיוטה לדירקטוריון, הודיעה מירב על התפטרותה. שלושה שבועות אחר כך חתמה עם המושב על הסכם חכירה זהה, בשם \"שמש מירב בע\"מ\", חברה שהקימה עם אחיה. החברה של מירב פנתה גם לשני לקוחות של גלבוע והציעה להם מחירים נמוכים. נציג המושב ידע שמירב ניהלה עד לאחרונה את המגעים בשם גלבוע, ושהיא עזבה את החברה זמן קצר קודם לכן.\nבנוסף, אחד הדירקטורים בגלבוע, רון, מכהן מזה שנה גם כדירקטור בחברה פרטית שמתחרה בגלבוע על מכרזי אנרגיה. רון לא סיפר על כך לדירקטוריון.","parts":[{"q":"האם מירב הפרה חובה כלפי גלבוע? התייחסו גם לטענתה שהתפטרה לפני החתימה. [עד 15 שורות]","pts":20,"model":["1. בזמן כהונתה מירב הייתה נושאת משרה, כמנהלת הכפופה במישרין למנכ\"ל (ס' 1). לכן חבה חובת אמונים (ס' 254(א)).","2. הזדמנות עסקית של החברה: לפי מבחן ההסכמה, החכירה היא בליבת תחום הפעילות של גלבוע. לפי מבחן התחרות, ניצולה בידי מירב מעמיד אותה בתחרות עם החברה. לפי המבחן הקנייני, החברה ניהלה מגעים מתקדמים והכינה טיוטה, והמידע הגיע למירב בתוקף תפקידה. כל המבחנים מצביעים על כך שזו הזדמנות של החברה (ס' 254(א)(3)). החברה גם לא החליטה עניינית לוותר עליה.","3. חובות לאחר ההתפטרות: בית המשפט העליון טרם הכריע בכך במפורש, אבל לפי הגישה המקובלת חובת האמונים אינה פוקעת אוטומטית עם העזיבה כשמדובר בהזדמנות שהבשילה בזמן הכהונה. ההתפטרות לפני הצגת הטיוטה לדירקטוריון, והחתימה שלושה שבועות אחר כך על אותו הסכם, מלמדות על התפטרות שמטרתה לנצל את ההזדמנות.","4. חובת גילוי: מירב הייתה חייבת לגלות לחברה ולמסור לה את כל המידע והמסמכים שהגיעו אליה בתוקף מעמדה (ס' 254(א)(4)), ולא להשתמש בהם לטובתה.","5. תחרות: פנייה ללקוחות גלבוע תוך שימוש במידע שצברה בחברה עשויה להיות הפרה, בייחוד בסמוך לעזיבה (ס' 254(א)(2)). תחרות כללית אחרי העזיבה מותרת בדרך כלל, מכוח חופש העיסוק, אלא אם יש בה שימוש במידע סודי או תניית אי-תחרות סבירה.","6. לא היה גילוי ולא היה אישור לפי ס' 255, ולכן אין לה הגנה. מסקנה: מירב הפרה את חובת האמונים."],"check":["מירב נושאת משרה: ס' 1","זיהוי הפרת ס' 254(א)(3) לפי מבחני הפסיקה","חובה לאחר ההתפטרות: הזדמנות שהבשילה בזמן הכהונה","ס' 254(א)(4): גילוי ומסירת מסמכים","תחרות: ס' 254(א)(2), כולל הבחנה בין תחרות כללית מותרת לשימוש במידע","היעדר אישור לפי ס' 255"]},{"q":"אילו תרופות עומדות לגלבוע כלפי מירב, כלפי \"שמש מירב\" וכלפי המושב? [עד 15 שורות]","pts":20,"model":["1. כלפי מירב: על הפרת חובת אמונים חלים דיני הפרת חוזה (ס' 256(א)–(ב)). התרופות הן פיצויים, צו מניעה נגד המשך הפנייה ללקוחות, והשבת הרווחים שהופקו מההפרה גם בלי להוכיח נזק.","2. נאמנות קונסטרוקטיבית: הפסיקה מכירה באפשרות להורות שזכויות החכירה מוחזקות בנאמנות עבור החברה, ולחייב את העברתן לגלבוע.","3. כלפי \"שמש מירב\": החברה הוקמה ככלי לניצול ההזדמנות, ולכן אפשר לשקול נגדה תביעה בעילת עשיית עושר ולא במשפט. אפשר גם לבקש שהנאמנות הקונסטרוקטיבית תחול על הזכויות שבידיה, משום שבעליה, מירב ואחיה, ידעו על מקור ההזדמנות.","4. כלפי המושב: ס' 256(ג) חל על פעולה שעשה נושא משרה <b>בשם החברה</b>. כאן מירב חתמה בשם חברתה, ולכן התרופה המרכזית מופנית אליה ואל חברתה. עם זאת, ידיעת המושב שמירב ניהלה את המגעים בשם גלבוע יכולה לחזק טענות בדבר חוסר תום לב במשא ומתן.","5. מי יתבע: גלבוע, באמצעות הדירקטוריון. אם הדירקטוריון לא יפעל, בעל מניה או דירקטור רשאים להגיש תביעה נגזרת (ס' 194)."],"check":["ס' 256(א)–(ב): דיני החוזים","השבת רווחים ונאמנות קונסטרוקטיבית","צו מניעה","התייחסות לצד השלישי ולס' 256(ג) ותנאיו","מסלול התביעה: החברה או תביעה נגזרת (ס' 194)"]},{"q":"האם רון הפר את חובותיו? מה היה עליו לעשות כדי לכהן כדין בחברה המתחרה? [עד 15 שורות]","pts":20,"model":["1. רון הוא דירקטור, ולכן נושא משרה (ס' 1) וחב חובת אמונים (ס' 254).","2. כהונה בתאגיד מתחרה מעוררת גם ניגוד עניינים בין תפקידו בגלבוע לבין \"תפקיד אחר שלו\" (ס' 254(א)(1)), וגם פעולה שיש בה תחרות (ס' 254(א)(2)). בנוסף, ייתכן שמידע של גלבוע ידלוף למתחרה.","3. ההסתרה מפרה גם את חובת הגילוי (ס' 254(א)(4)), ולכן רון הפר את חובת האמונים.","4. הדרך החוקית: אישור לפי ס' 255. על רון היה לגלות זמן סביר לפני הדיון את מהות עניינו, לרבות כל עובדה ומסמך מהותיים (ס' 255(א)(2)).","5. ועדת הביקורת הייתה מסווגת את הפעולה כמהותית או כלא מהותית (ס' 117(1א)). פעולה מהותית: ועדת ביקורת ← דירקטוריון (ס' 255(ב) עם ס' 272(א)). פעולה שאינה מהותית: דירקטוריון (ס' 271).","6. בפעולה מהותית, רון לא היה נוכח בדיון ולא מצביע (ס' 278(א)). האישור מותנה בכך שהוא פועל בתום לב ושהפעולה אינה פוגעת בטובת החברה (ס' 255(א)(1)). בכהונה בתאגיד מתחרה ישיר, ייתכן שהתנאי האחרון לא יתקיים.","7. בלי אישור: החברה זכאית לתרופות לפי ס' 256. רון גם עלול להיות מושעה או מודח, לפי ההסדרים בחוק ובתקנון."],"check":["רון נושא משרה: ס' 1","ס' 254(א)(1)–(2) ו-(4)","מסלול ס' 255: גילוי, תום לב, היעדר פגיעה","סיווג מהותיות: ס' 117(1א)","האורגנים הנכונים: ס' 271 או ס' 272(א)","הימנעות: ס' 278"]}]}]},{"id":"u6","title":"פטור, שיפוי וביטוח","short":"פטור, שיפוי וביטוח","blurb":"לקבוע אם ניתן לפטור, לשפות או לבטח נושא משרה בגין הפרה מסוימת, ולפרט את כל השלבים הנדרשים בחברה: תיקון תקנון, מסלול אישור ומגבלות תוכן.","secs":["258","259","260","261","262","263","264","1"],"blocks":[{"t":"h","x":"למה החוק מאפשר \"להגן\" על נושאי משרה?"},{"t":"p","x":"נושאי משרה חשופים לתביעות בסכומים גדולים, גם כשפעלו בתום לב וטעו טעות \"רגילה\". בלי הגנה, אנשים מוכשרים יירתעו מלכהן כדירקטורים, ומי שיכהן ינקוט זהירות-יתר ויוותר על סיכונים עסקיים סבירים. מנגד, הגנה רחבה מדי תרוקן מתוכן את החובות. החוק מאזן בין השיקולים באמצעות <b>שלושה כלים</b> מוגבלים: <b>פטור</b>, <b>שיפוי</b> ו<b>ביטוח</b>. הכלים האלה מגינים בעיקר מפני <b>רשלנות</b>, ולעולם לא מפני חוסר תום לב."},{"t":"law","law":"חוק החברות","sec":"258","x":"(א) חברה אינה רשאית לפטור נושא משרה מאחריותו בשל הפרת חובת האמונים כלפיה. (ב) חברה רשאית לפטור נושא משרה מאחריותו בשל הפרת חובת הזהירות כלפיה, בהתאם לקבוע בפרק זה בלבד. (ג) חברה רשאית לבטח את אחריותו של נושא משרה בה או לשפותו, בהתאם לקבוע בפרק זה בלבד."},{"t":"table","head":["","פטור (ס' 259)","שיפוי (ס' 260)","ביטוח (ס' 261)"],"rows":[["מה זה?","החברה מוותרת מראש על זכותה לתבוע את נושא המשרה","החברה משלמת במקומו חבות או הוצאה שהוטלה עליו","חברת ביטוח משלמת לפי פוליסה שהחברה רכשה"],["מי \"נפגע\" כלכלית?","החברה, שמאבדת את עילת התביעה","החברה, מכספה","המבטח (החברה משלמת פרמיה)"],["מועד","<b>רק מראש</b>","מראש (התחייבות לשיפוי) או בדיעבד (היתר לשיפוי)","מראש (חוזה ביטוח)"],["כלפי מי האחריות?","<b>רק כלפי החברה</b>","בעיקר כלפי <b>אדם אחר</b>, וכן הוצאות התדיינות","כלפי החברה או כלפי אדם אחר"],["אילו הפרות?","רק <b>הפרת זהירות</b>","לפי רשימת ס' 260(א), בכפוף לס' 263","הפרת זהירות; הפרת אמונים בתום לב וביסוד סביר; חבות כספית לאחר"],["תנאי סף","הוראה בתקנון","הוראה בתקנון","הוראה בתקנון"]]},{"t":"h","x":"פטור (ס' 259)"},{"t":"law","law":"חוק החברות","sec":"259","x":"(א) חברה רשאית לפטור, מראש, נושא משרה בה מאחריותו, כולה או מקצתה, בשל נזק עקב הפרת חובת הזהירות כלפיה, אם נקבעה הוראה לכך בתקנון. (ב) על אף הוראות סעיף קטן (א), חברה אינה רשאית לפטור מראש דירקטור מאחריותו כלפיה עקב הפרת חובת הזהירות בחלוקה."},{"t":"list","x":["<b>רק מראש:</b> פטור שניתן אחרי האירוע חסר תוקף. מה שקרה לפני מתן כתב הפטור לא מכוסה בו.","<b>רק חובת זהירות:</b> אין פטור מהפרת אמונים (ס' 258(א)).","<b>רק כלפי החברה:</b> פטור הוא ויתור של החברה על זכותה. הוא אינו יכול לשלול תביעה של צד שלישי, כמו נושה או ספק.","<b>רק אם התקנון מתיר:</b> בלי הוראה בתקנון אין פטור, ויש לתקן קודם את התקנון (ס' 20).","<b>לא לדירקטור בחלוקה:</b> אי אפשר לפטור דירקטור מאחריות להפרת זהירות בחלוקה, כמו דיבידנד או רכישה עצמית (ס' 259(ב)). האיסור חל על <b>דירקטור</b>. נושא משרה שאינו דירקטור, למשל סמנכ\"לית כספים, אינו בגדר האיסור.","<b>לא במקרים של ס' 263:</b> אין פטור על הפרה בכוונה או בפזיזות, על פעולה מתוך כוונה להפיק רווח אישי שלא כדין, או על קנס, עיצום כספי או כופר."]},{"t":"trap","x":"<b>מלכודת קלאסית (מבחן \"יוחנן עוף\"):</b> אחרי שנושאת המשרה כבר התרשלה, החברה רוצה \"לתת לה כתב פטור\". הכתב יחול <b>רק על העתיד</b> ולא על הפרשה שכבר אירעה. בנוסף, אם הפעולה נעשתה <b>ביודעין</b> (בכוונה או בפזיזות), גם פטור שניתן מראש לא היה מכסה אותה (ס' 263(2))."},{"t":"h","x":"שיפוי (ס' 260)"},{"t":"p","x":"שיפוי פירושו שהחברה <b>מחזירה</b> לנושא המשרה סכום שנאלץ לשלם, או <b>משלמת</b> אותו במקומו. ס' 260(א) מונה שלושה סוגים של חבויות והוצאות שמותר לשפות עליהן, ובכל המקרים רק אם נבעו \"עקב פעולה שעשה בתוקף היותו נושא משרה\":"},{"t":"law","law":"חוק החברות","sec":"260(א)","x":"(1) חבות כספית שהוטלה עליו לטובת אדם אחר על פי פסק דין, לרבות פסק דין שניתן בפשרה או פסק בורר שאושר בידי בית משפט; … (2) הוצאות התדיינות סבירות, לרבות שכר טרחת עורך דין, שהוציא נושא המשרה או שחוייב בהן בידי בית משפט, בהליך שהוגש נגדו בידי החברה או בשמה או בידי אדם אחר, או באישום פלילי שממנו זוכה, או באישום פלילי שבו הורשע בעבירה שאינה דורשת הוכחת מחשבה פלילית."},{"t":"list","x":["<b>ס' 260(א)(1) – חבות כספית לטובת אדם אחר:</b> פסק דין, פשרה שקיבלה תוקף של פסק דין, או פסק בורר שאושר. שימו לב: מדובר בחבות כלפי <b>אדם אחר</b>. החברה אינה \"משפה\" על חוב של נושא המשרה כלפי החברה עצמה, כי זה היה פטור בדיעבד במסווה.","<b>ס' 260(א)(1א) – הוצאות התדיינות בחקירה או בהליך של רשות</b> (למשל רשות ניירות ערך) שהסתיים בלי כתב אישום ובלי חבות כספית כחלופה להליך פלילי, או שהסתיים בלי כתב אישום אך בחבות כספית כחלופה בעבירה שאינה דורשת מחשבה פלילית או בקשר לעיצום כספי. מותר לשפות על ההוצאות, אבל לא על העיצום או הקנס עצמו (ס' 263(4)).","<b>ס' 260(א)(2) – הוצאות התדיינות סבירות</b> בהליך אזרחי, גם אם הגישה אותו החברה; באישום פלילי שממנו <b>זוכה</b>; או באישום שבו הורשע בעבירה <b>שאינה דורשת מחשבה פלילית</b>, כלומר עבירת אחריות קפידה או רשלנות."]},{"t":"law","law":"חוק החברות","sec":"260(ב)","x":"(ב) הוראה בתקנון לענין שיפוי יכול שתהיה כל אחת מאלה: (1) הוראה המתירה לחברה לתת התחייבות מראש לשפות נושא משרה בה, בכל אחד מאלה (בחוק זה – התחייבות לשיפוי) – (א) כמפורט בסעיף קטן א(1), ובלבד שההתחייבות לשיפוי תוגבל לאירועים שלדעת הדירקטוריון צפויים לאור פעילות החברה בפועל בעת מתן ההתחייבות לשיפוי וכן לסכום או לאמת מידה שהדירקטוריון קבע כי הם סבירים בנסיבות הענין, … (ב) כמפורט בסעיף קטן א(1א) או (2); (2) הוראה המתירה לחברה לשפות נושא משרה בה בדיעבד (להלן – היתר לשיפוי)."},{"t":"table","head":["","התחייבות לשיפוי (מראש)","היתר לשיפוי (בדיעבד)"],"rows":[["מקור","ס' 260(ב)(1)","ס' 260(ב)(2)"],["מתי ניתנת","לפני האירוע, כחלק מתנאי הכהונה","אחרי שהחבות או ההוצאה כבר נוצרו"],["מגבלות על חבות לאדם אחר (ס' 260(א)(1))","חובה לפרט את <b>האירועים</b> שלדעת הדירקטוריון צפויים לאור פעילות החברה בפועל, ו<b>סכום או אמת מידה</b> שהדירקטוריון קבע כסבירים. שניהם יצוינו בהתחייבות עצמה","אין דרישה לרשימת אירועים מראש. החברה מחליטה לגבי המקרה הקונקרטי"],["הוצאות התדיינות (ס' 260(א)(1א), (2))","בלי חובה לרשימת אירועים ולתקרה (ס' 260(ב)(1)(ב))","מותר"],["תכלית","ודאות לנושא המשרה, ומשיכת מועמדים טובים","גמישות לחברה, אך בלי ודאות לנושא המשרה"]]},{"t":"trap","x":"<b>מלכודת:</b> \"החברה התחייבה מראש לשפות את הדירקטורים על כל חבות, בלי הגבלה\". התחייבות כזו פגומה. בהתחייבות מראש על חבות כלפי אחר חובה לציין <b>אירועים צפויים</b> ו<b>סכום או אמת מידה סבירים</b> (ס' 260(ב)(1)(א)). התחייבות גורפת אינה עומדת בדרישה."},{"t":"h","x":"ביטוח (ס' 261)"},{"t":"law","law":"חוק החברות","sec":"261","x":"חברה רשאית, אם נקבעה לכך הוראה בתקנון, להתקשר בחוזה לביטוח אחריותו של נושא משרה בה בשל חבות שתוטל עליו עקב פעולה שעשה בתוקף היותו נושא משרה בה, בכל אחד מאלה: (1) הפרת חובת זהירות כלפי החברה או כלפי אדם אחר; (2) הפרת חובת אמונים כלפי החברה, ובלבד שנושא המשרה פעל בתום לב והיה לו יסוד סביר להניח שהפעולה לא תפגע בטובת החברה; (3) חבות כספית שתוטל עליו לטובת אדם אחר."},{"t":"p","x":"ביטוח הוא הכלי <b>הרחב ביותר</b>. הוא מכסה רשלנות גם כלפי החברה וגם כלפי צד שלישי. הוא מכסה <b>אפילו הפרת אמונים</b>, אבל רק במצב \"רך\" שבו נושא המשרה פעל <b>בתום לב</b> והיה לו <b>יסוד סביר</b> להניח שהפעולה לא תפגע בחברה (ס' 261(2)). דוגמה: דירקטור שלא זיהה שיש לו עניין אישי עקיף בעסקה, והאמין באופן סביר שהיא טובה לחברה."},{"t":"h","x":"הקו האדום: מה לעולם אי אפשר (ס' 263–264)"},{"t":"law","law":"חוק החברות","sec":"263","x":"לא יהיה תוקף להוראה בתקנון, המתירה לחברה להתקשר בחוזה לביטוח אחריותו של נושא משרה בה, להוראה בתקנון או להחלטת דירקטוריון המתירה לשפות נושא משרה, או להוראה בתקנון הפוטרת נושא משרה מאחריותו כלפי החברה, בשל כל אחד מאלה: (1) הפרת חובת אמונים, למעט לענין שיפוי וביטוח בשל הפרת חובת אמונים כאמור בסעיף 261(2); (2) הפרת חובת זהירות שנעשתה בכוונה או בפזיזות, למעט אם נעשתה ברשלנות בלבד; (3) פעולה מתוך כוונה להפיק רווח אישי שלא כדין; (4) קנס, קנס אזרחי, עיצום כספי או כופר שהוטל עליו."},{"t":"law","law":"חוק החברות","sec":"264(ב)","x":"(ב) לא יהיה תוקף להתחייבות לשיפוי או לביטוח אחריותו של נושא משרה עקב הפרת חובת אמונים כלפי החברה, למעט הפרת חובת אמונים כאמור בסעיף 261(2), ונושא משרה לא יקבל, במישרין או בעקיפין, התחייבות כאמור; קבלת התחייבות כאמור היא הפרה של חובת אמונים."},{"t":"table","head":["סוג ההפרה / החבות","פטור","שיפוי","ביטוח"],"rows":[["רשלנות כלפי החברה","✓ מראש, לפי התקנון (ס' 259(א))","הוצאות התדיינות בלבד (ס' 260(א)(2)). אין שיפוי על חבות כלפי החברה עצמה","✓ (ס' 261(1))"],["רשלנות כלפי צד שלישי","✗ (הפטור הוא רק כלפי החברה)","✓ (ס' 260(א)(1)), בכפוף להגבלות של התחייבות מראש","✓ (ס' 261(1), (3))"],["הפרת אמונים בתום לב וביסוד סביר שלא תפגע","✗ (ס' 258(א))","רק במסגרת ס' 260, מכוח החריג בס' 263(1) ובס' 264(ב)","✓ (ס' 261(2))"],["הפרת אמונים אחרת","✗","✗ (ס' 263(1))","✗ (ס' 263(1))"],["הפרת זהירות בכוונה או בפזיזות","✗ (ס' 263(2))","✗","✗"],["פעולה בכוונה להפיק רווח אישי שלא כדין","✗ (ס' 263(3))","✗","✗"],["קנס, קנס אזרחי, עיצום כספי, כופר","✗ (ס' 263(4))","✗ (מותר רק לשפות על הוצאות ההליך לפי ס' 260(א)(1א))","✗"],["דירקטור: הפרת זהירות בחלוקה","✗ (ס' 259(ב))","לפי הכללים הרגילים","לפי הכללים הרגילים"]]},{"t":"h","x":"איך מעניקים בפועל? שני שלבים"},{"t":"steps","title":"מתן פטור, שיפוי או ביטוח לנושא משרה מסוים","x":["<b>שלב 1: הוראה בתקנון.</b> בלי הוראה מסמיכה אין פטור, שיפוי או ביטוח (ס' 259(א), 260(א), 261). אם ההוראה חסרה, מתקנים את התקנון באסיפה הכללית ברוב רגיל, אלא אם התקנון קובע רוב אחר. רוב כזה מחייב את הרוב שנקבע או את הרוב המוצע, לפי הגבוה (ס' 20(א)–(ב)).","<b>תוספות לשלב 1:</b> בחברה פרטית שמניותיה מחולקות לסוגים, נדרש גם אישור אסיפות הסוג להוספת הוראת פטור או שיפוי (ס' 262(א)). בחברה ציבורית שבה נושא משרה הוא בעל שליטה (ס' 268), נדרש גם רוב מיוחד מקרב בעלי המניות שאינם בעלי עניין אישי, כמו בס' 275(א)(3) (ס' 262(ב)).","<b>שלב 2: ההענקה לנושא המשרה הספציפי.</b> פטור, ביטוח, התחייבות לשיפוי ושיפוי הם \"תנאי כהונה והעסקה\" (ס' 1). לכן מאשרים אותם <b>במסלול התגמול</b> שמתאים לזהות נושא המשרה. ראו את הטבלה בהמשך ואת יחידת התגמול.","<b>שלב 3: הימנעות וגילוי.</b> נושא המשרה מגלה את עניינו (ס' 269) ואינו משתתף בדיון ובהצבעה, אלא לשם הצגה (ס' 278(א)).","<b>שלב 4: בדיקת תוכן.</b> הכתב עצמו חייב לעמוד בגבולות ס' 259–263: מראש, זהירות בלבד, רשימת אירועים ותקרה בהתחייבות לשיפוי, ובלי החריגים של ס' 263."]},{"t":"law","law":"חוק החברות","sec":"1","x":"”תנאי כהונה והעסקה“, של נושא משרה – תנאי כהונה או העסקה של נושא משרה, לרבות מתן פטור, ביטוח, התחייבות לשיפוי או שיפוי לפי היתר שיפוי, מענק פרישה, וכל הטבה, תשלום אחר או התחייבות לתשלום כאמור, הניתנים בשל כהונה או העסקה כאמור;"},{"t":"table","head":["מי מקבל את הפטור / השיפוי / הביטוח?","מסלול האישור (חברה ציבורית)"],"rows":[["נושא משרה שאינו דירקטור ואינו מנכ\"ל (למשל סמנכ\"לית כספים)","ועדת תגמול ← דירקטוריון, בהתאם למדיניות התגמול (ס' 270(2), 272(ג)(1)). חריגה מהמדיניות מחייבת גם אישור אסיפה ברוב מיוחד (ס' 272(ג)(2)), וקיימת פסקת התגברות (ס' 272(ג)(3))"],["מנכ\"ל","ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 272(ג1))"],["דירקטור","ועדת תגמול ← דירקטוריון ← אסיפה כללית (ס' 270(3), 273). חריגה מהמדיניות מחייבת רוב מיוחד (ס' 273(ב))"],["בעל שליטה או קרובו שהוא נושא משרה","ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד, ואישור מחדש כל 3 שנים אם התקופה ארוכה מזה (ס' 270(4), 275(א), (א1))"],["חברה פרטית (שאינה חברת איגרות חוב): נושא משרה שאינו דירקטור","ועדת ביקורת ← דירקטוריון (ס' 272(א)). אם אין ועדת ביקורת, דירקטוריון בלבד (ס' 272(ב))"],["חברה פרטית: דירקטור","דירקטוריון ← אסיפה כללית (ס' 273(א))"]]},{"t":"law","law":"חוק החברות","sec":"262(ב)","x":"(ב) בחברה ציבורית אשר נושא משרה בה הוא בעל שליטה כהגדרתו בסעיף 268, טעונה החלטת האסיפה הכללית לכלול הוראה בתקנון בדבר פטור, שיפוי או ביטוח, נוסף על הרוב הדרוש לשינוי התקנון, גם אישור של בעלי מניות שאינם בעלי ענין אישי באישור ההחלטה, כנדרש לגבי עסקה חריגה, לפי הוראות סעיף 275(א)(3)."},{"t":"example","title":"דוגמה: כתב פטור לסמנכ\"לית כספים","x":"<b>עובדות:</b> חברה ציבורית רוצה לתת כתב פטור לסמנכ\"לית הכספים רונית. בתקנון אין הוראת פטור. בעל השליטה הוא המנכ\"ל, ורונית אינה דירקטורית.\n<b>פתרון:</b> (1) רונית נושאת משרה, כי היא כפופה במישרין למנכ\"ל (ס' 1). (2) <b>תיקון תקנון</b> שיתיר פטור (ס' 259(א)), ברוב רגיל או ברוב שנקבע בתקנון (ס' 20). בעל השליטה מכהן כנושא משרה, ולכן נדרש גם רוב מיוחד מקרב מי שאינם בעלי עניין אישי (ס' 262(ב)). (3) הפטור הוא \"תנאי כהונה והעסקה\" (ס' 1), ולכן מאשרים אותו במסלול של ס' 270(2) ו-272(ג)(1): <b>ועדת תגמול ← דירקטוריון</b>, בהתאם למדיניות התגמול. חריגה מהמדיניות מחייבת גם אישור אסיפה ברוב מיוחד (ס' 272(ג)(2)), ואם האסיפה מתנגדת אפשר להפעיל את פסקת ההתגברות (ס' 272(ג)(3)). (4) רונית לא תשתתף בדיונים (ס' 278). (5) <b>היקף</b>: רק הפרת זהירות כלפי החברה, ורק מכאן והלאה. הפטור לא יחול על התנהלות שכבר אירעה."},{"t":"example","title":"דוגמה: התחייבות לשיפוי לדירקטורים","x":"<b>עובדות:</b> החברה פועלת בתחום התשתיות ומבקשת להתחייב מראש לשפות את הדירקטורים \"על כל חבות שתוטל עליהם, ללא הגבלה\".\n<b>פתרון:</b> התחייבות מראש על חבות כספית כלפי אחר מותרת רק אם היא מוגבלת ל<b>אירועים</b> שלדעת הדירקטוריון צפויים לאור הפעילות בפועל, למשל תביעות בגין עיכובים בפרויקטים, תאונות באתרים או הנפקת ניירות ערך, ול<b>סכום או אמת מידה</b> סבירים, ששניהם מצוינים בכתב ההתחייבות (ס' 260(ב)(1)(א)). התחייבות גורפת פגומה. בנוסף, אין שיפוי על קנס או עיצום כספי (ס' 263(4)). כיוון שמדובר בדירקטורים, המסלול הוא ועדת תגמול ← דירקטוריון ← אסיפה כללית (ס' 273)."},{"t":"trap","x":"<b>מלכודת:</b> לחשוב ש\"התקנון מתיר פטור\" מספיק. התקנון רק <b>מסמיך</b>. ההענקה לנושא משרה מסוים היא עסקה בתנאי כהונה, ומחייבת את מסלול האישור המלא לפי זהותו. ובכיוון ההפוך: גם אישור מושלם של ועדת התגמול והדירקטוריון חסר ערך אם בתקנון אין הוראה מסמיכה."},{"t":"exam","x":"<b>איך זה נשאל:</b> \"פרטו מה צריך לקרות בחברה כדי ש-X תקבל כתב פטור, שיפוי או ביטוח\". לעיתים מצורפת עובדה מכשילה: בתקנון אין הוראה, ההפרה כבר אירעה, מדובר בהפרת אמונים, X הוא דירקטור והנושא הוא חלוקה, או שהוטל עיצום כספי.\n<b>מבנה תשובה מלא:</b> (1) מעמד X: נושא משרה (ס' 1), ואיזה סוג (דירקטור, מנכ\"ל, בעל שליטה). (2) <b>תקנון</b>: האם יש הוראה (ס' 259(א), 260(א), 261)? אם לא, תיקון לפי ס' 20, וגם ס' 262 אם רלוונטי. (3) <b>היקף</b>: מראש, זהירות בלבד, כלפי החברה בלבד, ס' 259(ב), ס' 263. (4) <b>מסלול אישור</b>: \"תנאי כהונה והעסקה\" (ס' 1), ואז ס' 272(ג), 272(ג1), 273 או 275, לפי מדיניות התגמול (ס' 267א). (5) <b>הימנעות</b> (ס' 278). (6) <b>מסקנה על העובדות</b>: למשל, \"הכתב לא יחול על פרשת קרטונים שכבר אירעה\". \n<b>מה מוריד ניקוד:</b> לשכוח את שלב התקנון; לתת פטור בדיעבד; לפטור מהפרת אמונים; לבלבל בין פטור, שהוא רק כלפי החברה, לבין שיפוי, שהוא בעיקר כלפי צד שלישי."}],"mcq":[{"id":"u6-1","q":"בתקנון חברה יש הוראה המתירה פטור. סמנכ\"ל השיווק התרשל בקמפיין שגרם לחברה נזק של 2 מיליון ₪. חודש אחר כך החליטה החברה לתת לו כתב פטור \"לרבות בגין הקמפיין\". מה נכון?","o":["הפטור תקף, כי מדובר ברשלנות בלבד","הפטור תקף, כי בתקנון יש הוראה מתאימה","הפטור אינו תקף, כי סמנכ\"ל השיווק אינו נושא משרה","הפטור תקף רק אם אושר באסיפה הכללית ברוב מיוחד","הפטור אינו חל על הקמפיין, כי פטור ניתן רק מראש"],"a":4,"why":"ס' 259(א): חברה רשאית לפטור \"מראש\". פטור על אירוע שכבר קרה הוא ויתור בדיעבד, והוא אינו תקף. הכתב יכול לחול רק על פעולות עתידיות.","w":["גם על רשלנות אין פטור בדיעבד.","הוראה בתקנון היא תנאי הכרחי, אבל לא מספיק. הפטור מוגבל לפטור מראש (ס' 259(א)).","סמנכ\"ל הכפוף במישרין למנכ\"ל הוא נושא משרה (ס' 1).","אישור האסיפה אינו הופך פטור בדיעבד לתקף.",""],"secs":["259"]},{"id":"u6-2","q":"איזה מהבאים <b>אסור</b> לחברה לעשות גם אם בתקנון יש הוראה מתאימה?","o":["לבטח נושא משרה מפני הפרת אמונים כשפעל בתום לב והיה לו יסוד סביר להניח שהפעולה לא תפגע בחברה","לשפות בדיעבד נושא משרה על חבות כספית לטובת אדם אחר לפי פסק דין","לפטור מראש סמנכ\"לית מאחריות בשל הפרת חובת אמונים","להתחייב מראש לשפות מנכ\"ל על הוצאות התדיינות סבירות","לבטח דירקטור מפני הפרת זהירות כלפי צד שלישי"],"a":2,"why":"ס' 258(א): \"חברה אינה רשאית לפטור נושא משרה מאחריותו בשל הפרת חובת האמונים כלפיה\". גם ס' 263(1) שולל תוקף מהוראה כזו.","w":["ביטוח כזה מותר במפורש (ס' 261(2)).","היתר לשיפוי בדיעבד מותר אם יש הוראה בתקנון (ס' 260(ב)(2)).","","התחייבות לשיפוי על הוצאות התדיינות מותרת (ס' 260(א)(2), 260(ב)(1)(ב)).","ביטוח מפני הפרת זהירות כלפי אחר מותר (ס' 261(1))."],"secs":["258","263"]},{"id":"u6-3","q":"בתקנון של חברה ציבורית יש הוראה כללית המתירה פטור לנושאי משרה. האם החברה רשאית לפטור מראש דירקטור מאחריותו בשל הפרת חובת הזהירות בהחלטה על חלוקת דיבידנד?","o":["כן, אבל רק עד תקרה של 25% מההון העצמי","כן, כי מדובר בהפרת זהירות ולא בהפרת אמונים","לא. אסור לפטור מראש דירקטור מאחריותו עקב הפרת חובת זהירות בחלוקה","לא, כי דירקטורים אינם נושאי משרה","כן, אם האסיפה הכללית אישרה את הפטור ברוב מיוחד"],"a":2,"why":"ס' 259(ב): \"חברה אינה רשאית לפטור מראש דירקטור מאחריותו כלפיה עקב הפרת חובת הזהירות בחלוקה\". האיסור משתלב באחריות הדירקטורים לחלוקה אסורה (ס' 311).","w":["אין בחוק מסלול של \"פטור עד תקרה\" לעניין חלוקה.","זה החריג הקבוע בס' 259(ב): גם הפרת זהירות בחלוקה אינה ניתנת לפטור לדירקטור.","","דירקטור הוא נושא משרה (ס' 1).","אישור האסיפה אינו גובר על האיסור."],"secs":["259"]},{"id":"u6-4","q":"חברה רוצה לתת לסמנכ\"לית שלה התחייבות מראש לשפות אותה על חבות כספית שתוטל עליה לטובת צד שלישי. מה נדרש בהתחייבות עצמה?","o":["שההתחייבות תכסה רק פעולות שנעשו בכוונה","שהסמנכ\"לית תפקיד ערובה בגובה השיפוי","שום דבר מיוחד, די בהוראה כללית בתקנון","שההתחייבות תאושר בבית המשפט","שההתחייבות תוגבל לאירועים שלדעת הדירקטוריון צפויים לאור פעילות החברה בפועל, ולסכום או אמת מידה סבירים, ושניהם יצוינו בהתחייבות"],"a":4,"why":"ס' 260(ב)(1)(א) מחייב להגביל התחייבות מראש לשיפוי על חבות לפי ס' 260(א)(1) לאירועים צפויים ולסכום או לאמת מידה סבירים, ולציין את שניהם בהתחייבות.","w":["פעולה בכוונה מוחרגת מכיסוי (ס' 263(2)).","אין בחוק דרישה לערובה.","התחייבות מראש על חבות כלפי אחר מחייבת אירועים ותקרה (ס' 260(ב)(1)(א)).","אין בחוק דרישה לאישור בית משפט.",""],"secs":["260"]},{"id":"u6-5","q":"בתקנון חברה יש הוראה המתירה \"היתר לשיפוי\". נגד דירקטור ניתן פסק דין לטובת ספק, בגין פעולה שעשה בתוקף כהונתו, ולא ניתנה לו התחייבות מראש. מה נכון?","o":["שיפוי בדיעבד מותר רק על הוצאות משפט, ולא על פסק הדין עצמו","אי אפשר לשפות אותו, כי לא ניתנה התחייבות מראש","החברה רשאית לשפות אותו בדיעבד, מכוח ההיתר בתקנון ובכפוף למסלול האישור ולס' 263","שיפוי בדיעבד מותר רק אם הדירקטור זוכה","החברה חייבת לשפות אותו"],"a":2,"why":"ס' 260(ב)(2) מתיר הוראה בתקנון שמאפשרת לשפות בדיעבד (\"היתר לשיפוי\"). החבות כלפי אדם אחר לפי פסק דין נכללת בס' 260(א)(1). ההחלטה בדבר השיפוי היא \"תנאי כהונה והעסקה\" (ס' 1), ומאושרת במסלול המתאים.","w":["ס' 260(א)(1) כולל חבות כספית לפי פסק דין.","החוק מכיר במפורש בשיפוי בדיעבד (ס' 260(ב)(2)).","","זיכוי הוא תנאי לשיפוי על הוצאות באישום פלילי (ס' 260(א)(2)), לא לשיפוי על פסק דין אזרחי.","היתר הוא רשות ולא חובה."],"secs":["260"]},{"id":"u6-6","q":"דירקטור הצביע בעד עסקה שבה, כפי שהתברר בדיעבד, היה לו עניין אישי עקיף שלא היה מודע לו. הוא האמין, על בסיס חוות דעת, שהעסקה טובה לחברה. האם פוליסת הביטוח של החברה יכולה לכסות את אחריותו?","o":["כן, ואף בלי הוראה בתקנון","לא, כי אי אפשר לבטח על הפרת אמונים בשום מקרה","כן, אבל רק אם בית המשפט יאשר זאת","כן, אם בתקנון יש הוראה מתאימה, כי מותר לבטח הפרת חובת אמונים כשנושא המשרה פעל בתום לב והיה לו יסוד סביר להניח שהפעולה לא תפגע בחברה","לא, כי ביטוח אפשרי רק על אחריות כלפי צד שלישי"],"a":3,"why":"ס' 261(2) מתיר ביטוח על הפרת חובת אמונים כלפי החברה, אם נושא המשרה פעל בתום לב והיה לו יסוד סביר להניח שהפעולה לא תפגע בטובתה. ס' 263(1) ו-264(ב) מחריגים מקרה זה מהאיסור.","w":["ביטוח מחייב הוראה בתקנון (ס' 261, \"אם נקבעה לכך הוראה בתקנון\").","זה בדיוק החריג שבס' 261(2).","אין בחוק דרישה לאישור בית משפט.","","ביטוח מכסה גם אחריות כלפי החברה (ס' 261(1)–(2))."],"secs":["261","263"]},{"id":"u6-7","q":"רשות ניירות ערך הטילה על מנכ\"ל חברה ציבורית עיצום כספי של 300,000 ₪. התקנון מתיר שיפוי וביטוח במלוא ההיקף שהחוק מתיר. מה נכון?","o":["החברה אינה רשאית לשפות או לבטח אותו על העיצום עצמו, אך ייתכן שיפוי על הוצאות ההתדיינות הסבירות בהליך בקשר לעיצום","העיצום יבוטל אם החברה תשלם אותו במקומו","החברה רשאית לפטור את המנכ\"ל מהעיצום","החברה רשאית לשפות אותו על העיצום, כי ניתן לשפות על כל חבות כספית","החברה רשאית לבטח את העיצום אם המנכ\"ל פעל ברשלנות בלבד"],"a":0,"why":"ס' 263(4) שולל תוקף מהוראה המתירה שיפוי, ביטוח או פטור על \"קנס, קנס אזרחי, עיצום כספי או כופר\". מנגד, ס' 260(א)(1א) מתיר שיפוי על הוצאות התדיינות סבירות בהליך שהסתיים בחבות כספית כחלופה להליך פלילי בעבירה שאינה דורשת מחשבה פלילית, או בקשר לעיצום כספי.","w":["","תשלום בידי החברה אינו \"מבטל\" את העיצום, והוא שיפוי אסור.","פטור הוא ויתור של החברה על זכותה, ואינו יכול לבטל עיצום שהטילה רשות (ס' 259, 263(4)).","עיצום כספי מוחרג במפורש (ס' 263(4)).","ס' 263(4) חל על העיצום עצמו, בלי קשר לרמת האשם."],"secs":["263","260"]},{"id":"u6-8","q":"בתקנון חברה נקבע: \"החברה תבטח את נושאי המשרה בגין כל הפרה של חובת הזהירות, לרבות הפרה שנעשתה בכוונה\". מה דינה של ההוראה?","o":["תקפה, אם הפרמיה שולמה בידי נושא המשרה","תקפה במלואה","תקפה רק לגבי דירקטורים חיצוניים","חסרת תוקף לגבי הפרה בכוונה או בפזיזות, ותקפה לגבי רשלנות","חסרת תוקף לגמרי, כי אסור לבטח הפרת זהירות"],"a":3,"why":"ס' 263(2): אין תוקף להוראה המתירה ביטוח בשל הפרת זהירות \"שנעשתה בכוונה או בפזיזות, למעט אם נעשתה ברשלנות בלבד\". ביטוח על רשלנות מותר (ס' 261(1)).","w":["זהות המשלם אינה משנה את האיסור שבס' 263.","החלק שנוגע להפרה בכוונה חסר תוקף (ס' 263(2)).","הסעיף חל על כל נושאי המשרה בלי הבחנה.","","ביטוח הפרת זהירות מותר (ס' 261(1))."],"secs":["261","263"]},{"id":"u6-9","q":"חברה ציבורית רוצה לתת כתב פטור לסמנכ\"לית הכספים שלה, שאינה דירקטורית. בתקנון יש הוראת פטור, והפטור תואם את מדיניות התגמול. איזה אישור נדרש?","o":["דירקטוריון בלבד","ועדת ביקורת ← דירקטוריון","ועדת תגמול ← דירקטוריון ← אסיפה כללית ברוב מיוחד","אסיפה כללית ברוב רגיל בלבד","ועדת תגמול ← דירקטוריון"],"a":4,"why":"פטור הוא \"תנאי כהונה והעסקה\" (ס' 1). עסקה של חברה ציבורית עם נושא משרה שאינו דירקטור ואינו מנכ\"ל לגבי תנאי כהונתו (ס' 270(2)) מאושרת בוועדת התגמול ולאחר מכן בדירקטוריון, בהתאם למדיניות התגמול (ס' 272(ג)(1)–(2)).","w":["בחברה ציבורית נדרש קודם אישור ועדת התגמול (ס' 272(ג)(1)).","ועדת ביקורת ← דירקטוריון הוא מסלול של חברה פרטית לעניין ס' 270(2) (ס' 272(א)), או של עסקה חריגה לפי ס' 270(1).","אסיפה נדרשת רק בחריגה ממדיניות התגמול (ס' 272(ג)(2)(ב)), או במנכ\"ל (ס' 272(ג1)).","הסמכות היא של ועדת התגמול והדירקטוריון, לא של האסיפה בלבד.",""],"secs":["272","1"]},{"id":"u6-10","q":"בתקנון של חברה פרטית אין הוראה המתירה שיפוי, ובתקנון לא נקבע רוב מיוחד לשינויו. מה הצעד הראשון כדי לתת לדירקטור התחייבות לשיפוי?","o":["החלטת דירקטוריון בלבד","תיקון התקנון בהחלטת האסיפה הכללית ברוב רגיל","תיקון התקנון ברוב של 75%","אין צורך בהוראה בתקנון לשיפוי, רק לפטור","אישור בית המשפט"],"a":1,"why":"שיפוי אפשרי רק \"אם נקבעה בתקנונה הוראה\" (ס' 260(א)). שינוי תקנון נעשה בהחלטה ברוב רגיל באסיפה הכללית, אלא אם נקבע בתקנון רוב אחר (ס' 20(א)). אם מניות החברה מחולקות לסוגים, נדרש גם אישור אסיפות הסוג (ס' 262(א)).","w":["הדירקטוריון אינו מוסמך לשנות את התקנון.","","רוב של 75% אינו ברירת המחדל (ס' 20(א)).","גם שיפוי (ס' 260(א)) וגם ביטוח (ס' 261) מחייבים הוראה בתקנון.","אין צורך בבית משפט."],"secs":["20","260"]},{"id":"u6-11","q":"בחברה ציבורית, בעל מניות המחזיק 40% (ואין מחזיק אחר ביותר מ-50%) מכהן כיו\"ר הדירקטוריון. החברה רוצה להוסיף לתקנון הוראה המתירה ביטוח נושאי משרה. מה נדרש באסיפה הכללית?","o":["הרוב הדרוש לשינוי התקנון, ובנוסף אישור של בעלי מניות שאינם בעלי עניין אישי כנדרש בס' 275(א)(3)","רוב רגיל בלבד","אישור פה אחד","החלטת דירקטוריון במקום אסיפה","רוב של 75% בלבד"],"a":0,"why":"בחברה ציבורית שבה נושא משרה הוא \"בעל שליטה\" כהגדרתו בס' 268 (כאן 40%, ואין מחזיק ביותר מ-50%), נדרש להוספת הוראת פטור, שיפוי או ביטוח גם אישור מקרב מי שאינם בעלי עניין אישי, לפי ס' 275(א)(3) (ס' 262(ב)).","w":["","ס' 262(ב) מוסיף דרישה על הרוב הרגיל.","אין דרישה לאישור פה אחד.","שינוי תקנון הוא סמכות האסיפה (ס' 20).","החוק אינו קובע 75%. נדרש הרוב לשינוי התקנון ובנוסף הרוב המיוחד."],"secs":["262","268"]},{"id":"u6-12","q":"לסמנכ\"ל התפעול יש כתב פטור תקף מראש. ספק תובע אותו אישית בגין רשלנות שגרמה לספק נזק. מה נכון?","o":["הפטור חל, אבל רק עד 50% מהנזק","כתב הפטור אינו רלוונטי לתביעת הספק, כי פטור חל רק על אחריות כלפי החברה. ייתכן כיסוי בשיפוי או בביטוח","כתב הפטור חוסם את התביעה רק אם הסמנכ\"ל הוא דירקטור","הספק חייב לתבוע את החברה בלבד","כתב הפטור חוסם את תביעת הספק"],"a":1,"why":"הפטור הוא ויתור של החברה על זכותה: \"מאחריותו… בשל נזק עקב הפרת חובת הזהירות כלפיה\" (ס' 259(א)). הוא אינו משפיע על זכויות של צד שלישי. מפני צד שלישי מגנים שיפוי (ס' 260(א)(1)) וביטוח (ס' 261(1), (3)).","w":["אין בחוק כלל כזה.","","מעמד הדירקטור אינו מרחיב את הפטור לצד שלישי.","לנושא משרה עשויה להיות חובת זהירות גם כלפי אחר (ס' 252(ב)).","החברה אינה יכולה לוותר על זכויות של צד שלישי."],"secs":["259","252"]},{"id":"u6-13","q":"בתקנון חברה יש הוראה המתירה שיפוי על הוצאות התדיינות. נגד מנהל הכספים הוגש כתב אישום. על אילו מההוצאות הבאות מותר לשפות אותו?","o":["אסור לשפות על הוצאות בהליך פלילי בשום מקרה","על הוצאות ההגנה, גם אם הורשע בעבירת מרמה","על הקנס שהוטל עליו בגזר הדין","על הוצאות ההגנה, אם זוכה, או אם הורשע בעבירה שאינה דורשת הוכחת מחשבה פלילית","על כל ההוצאות, אם הדירקטוריון שוכנע שפעל בתום לב"],"a":3,"why":"ס' 260(א)(2) מתיר שיפוי על הוצאות התדיינות סבירות \"באישום פלילי שממנו זוכה, או באישום פלילי שבו הורשע בעבירה שאינה דורשת הוכחת מחשבה פלילית\".","w":["החוק מתיר שיפוי במצבים המנויים בס' 260(א)(2).","מרמה דורשת מחשבה פלילית, ולכן אין שיפוי (ס' 260(א)(2)).","אין שיפוי על קנס (ס' 263(4)).","","הסייגים קבועים בחוק. שכנוע הדירקטוריון אינו מחליף אותם."],"secs":["260"]},{"id":"u6-14","q":"יוסי מחזיק 60% ממניות חברה ציבורית ומכהן בה כמנכ\"ל. בתקנון יש הוראה המתירה פטור. החברה רוצה לתת ליוסי כתב פטור לחמש שנים. מה נכון?","o":["נדרש אישור ועדת התגמול והדירקטוריון בלבד","נדרש אישור ועדת התגמול, הדירקטוריון והאסיפה הכללית ברוב מיוחד מקרב שאינם בעלי עניין אישי. ההתקשרות טעונה אישור מחדש אחת לשלוש שנים","נדרש אישור ועדת הביקורת והדירקטוריון בלבד, כי מדובר בעסקה שאינה חריגה","כתב פטור לבעל שליטה אסור בכל מקרה","נדרש אישור של האסיפה הכללית ברוב רגיל בלבד, לתקופה בלתי מוגבלת"],"a":1,"why":"פטור הוא \"תנאי כהונה והעסקה\" (ס' 1). התקשרות של חברה ציבורית עם בעל השליטה לגבי תנאי כהונתו כנושא משרה היא עסקה לפי ס' 270(4). מסלולה: ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 275(א)). התקשרות ליותר משלוש שנים טעונה אישור אחת לשלוש שנים (ס' 275(א1)(1)), והחריג של ס' 275(א1)(2) חל רק על עסקה חריגה לפי \"רישה\".","w":["בבעל שליטה חסר אישור האסיפה ברוב מיוחד (ס' 275(א)(3)).","","תנאי כהונה של בעל שליטה טעונים את מסלול ס' 275 ללא קשר לסיווג כ\"חריגה\". והוועדה היא ועדת התגמול.","החוק אינו אוסר פטור לבעל שליטה, אלא מחמיר את מסלול האישור.","נדרש רוב מיוחד (ס' 275(א)(3)), ואישור מחדש כל 3 שנים (ס' 275(א1)(1))."],"secs":["275","270"]}],"cases":[{"id":"u6-c1","title":"\"נווה תעשיות\" – חבילת הגנה לנושאי משרה","facts":"\"נווה תעשיות בע\"מ\" היא חברה ציבורית שמייצרת רכיבי בטון. אבי נווה מחזיק 38% ממניותיה ומכהן כיו\"ר הדירקטוריון. אין בעל מניות אחר שמחזיק ביותר מ-10%, והיתר בידי הציבור. בתקנון החברה יש הוראה המתירה ביטוח אחריות נושאי משרה, אבל אין בו הוראות בדבר פטור או שיפוי.\nהחברה גייסה סמנכ\"לית כספים חדשה, ליאת, הכפופה למנכ\"ל. היא מתנה את הצטרפותה בקבלת כתב פטור ובהתחייבות לשיפוי \"על כל חבות שתוטל עליי, ללא הגבלה\". הדירקטוריון מבקש לתת כתבים דומים גם לכל הדירקטורים, כולל אבי.\nכעבור שנה התברר שליאת אישרה עסקת גידור מטבע בלי לבדוק את הסיכון כראוי, והחברה הפסידה 3 מיליון ₪. בנוסף, בנק שנפגע מדיווח שגוי שליאת חתמה עליו תבע אותה אישית, ורשות ניירות ערך הטילה עליה עיצום כספי בשל הדיווח.","parts":[{"q":"פרטו מה צריך לקרות בחברה כדי שליאת תקבל כתב פטור והתחייבות לשיפוי. נמקו והפנו לסעיפי החוק. [עד 15 שורות]","pts":20,"model":["1. ליאת היא נושאת משרה, כמנהלת הכפופה במישרין למנכ\"ל (ס' 1).","2. בתקנון אין הוראת פטור ואין הוראת שיפוי. בלעדיהן אין פטור (ס' 259(א)) ואין שיפוי (ס' 260(א)). לכן השלב הראשון הוא תיקון תקנון באסיפה, ברוב רגיל או ברוב שנקבע בתקנון (ס' 20(א)–(ב)).","3. אבי מחזיק 38%, ואין מחזיק אחר ביותר מ-50%, ולכן הוא \"בעל שליטה\" לעניין ס' 268. הוא גם נושא משרה (יו\"ר, דירקטור). לכן ההחלטה לכלול בתקנון הוראות פטור ושיפוי טעונה גם רוב מיוחד מקרב בעלי המניות שאינם בעלי עניין אישי, לפי ס' 275(א)(3) (ס' 262(ב)).","4. פטור והתחייבות לשיפוי הם \"תנאי כהונה והעסקה\" (ס' 1). התקשרות עם נושאת משרה שאינה דירקטורית ואינה מנכ\"לית (ס' 270(2)) מאושרת כך: ועדת תגמול ← דירקטוריון, בהתאם למדיניות התגמול (ס' 272(ג)(1)). חריגה מהמדיניות מחייבת גם שיקולי ס' 267ב ואישור אסיפה ברוב מיוחד (ס' 272(ג)(2)). אם האסיפה מתנגדת, ניתן להפעיל את פסקת ההתגברות (ס' 272(ג)(3)).","5. התוכן: הפטור רק מראש, ורק על הפרת זהירות כלפי החברה (ס' 259(א)). דרישתה ל\"שיפוי ללא הגבלה\" אינה חוקית. בהתחייבות מראש על חבות כלפי אחר יש לפרט את האירועים הצפויים לאור הפעילות בפועל, ואת הסכום או אמת המידה הסבירים (ס' 260(ב)(1)(א)). אין כיסוי למקרים שבס' 263.","6. ליאת לא תשתתף בדיונים (ס' 278(א)), ותגלה את עניינה (ס' 269)."],"check":["ליאת נושאת משרה: ס' 1","צורך בתיקון תקנון: ס' 259(א), 260(א), 20","ס' 262(ב) וזיהוי אבי כבעל שליטה (ס' 268)","\"תנאי כהונה והעסקה\" (ס' 1) ומסלול ס' 272(ג)(1)–(3)","מגבלות התוכן: מראש, זהירות בלבד, אירועים ותקרה (ס' 260(ב)(1)(א)), ס' 263","הימנעות: ס' 278"]},{"q":"מה מסלול האישור לכתבי פטור ושיפוי לדירקטורים, ובפרט לאבי? [עד 15 שורות]","pts":20,"model":["1. תיקון התקנון, כאמור, כולל הרוב המיוחד לפי ס' 262(ב).","2. דירקטור רגיל: התקשרות לגבי תנאי כהונתו (ס' 270(3)) מאושרת כך: ועדת תגמול ← דירקטוריון ← אסיפה כללית (ס' 273(א)), בהתאם למדיניות התגמול. חריגה מהמדיניות מחייבת רוב מיוחד באסיפה (ס' 273(ב)).","3. אבי הוא בעל שליטה (ס' 268), ולכן ההתקשרות עמו לגבי תנאי כהונתו היא עסקה לפי ס' 270(4). מסלולה: ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד, כלומר רוב מקרב שאינם בעלי עניין אישי המשתתפים בהצבעה, או מתנגדים עד 2% (ס' 275(א)).","4. אם הכתבים ניתנים ליותר משלוש שנים, יש לאשרם מחדש אחת לשלוש שנים (ס' 275(א1)(1)). החריג של ס' 275(א1)(2) אינו חל, כי אינו חל על תנאי כהונה.","5. מבחינת אבי חלים במצטבר שני מסלולים: ס' 273 וס' 275 (ס' 277). בפועל, מסלול ס' 275 המחמיר מקיים את שניהם.","6. כל דירקטור נמנע מהדיון בעניין שלו (ס' 278(א)). אם לרוב הדירקטורים עניין אישי, למשל כשמאשרים כתבים לכולם, הם רשאים להשתתף (ס' 278(ב)), אבל נדרש גם אישור האסיפה (ס' 278(ג)), שנדרש כאן ממילא.","7. בעל מניה שמשתתף בהצבעה לפי ס' 275 חייב להודיע אם יש לו עניין אישי. אם לא הודיע, קולו לא יימנה (ס' 276)."],"check":["ס' 270(3) ו-273: ועדת תגמול ← דירקטוריון ← אסיפה","אבי בעל שליטה: ס' 268, 270(4), 275(א)","רוב מיוחד: ס' 275(א)(3)(א)/(ב)","אישור מחדש כל 3 שנים: ס' 275(א1)","אישורים מצטברים: ס' 277","ס' 278(ב)–(ג) כשלרוב הדירקטורים עניין אישי"]},{"q":"נניח שהכתבים ניתנו כדין לפני אירועי השנה. מה הכיסוי שעומד לליאת בשל ההפסד בעסקת הגידור, תביעת הבנק והעיצום הכספי? [עד 15 שורות]","pts":20,"model":["1. ההפסד בגידור: זו הפרת זהירות כלפי החברה, שכן ליאת לא בדקה את הסיכון (ס' 252–253). הפטור שניתן מראש חל עליה (ס' 259(א)), בתנאי שלא פעלה בכוונה או בפזיזות (ס' 263(2)). לפי העובדות מדובר ברשלנות, ולכן החברה לא תוכל לתבוע אותה.","2. תביעת הבנק: הפטור אינו רלוונטי, כי הוא חל רק כלפי החברה. לליאת עשויה להיות חובת זהירות כלפי הבנק (ס' 252(ב)).","3. אם ייפסק נגדה פיצוי לבנק, מדובר ב\"חבות כספית לטובת אדם אחר\" (ס' 260(א)(1)). ההתחייבות לשיפוי תכסה אותה רק אם האירוע נכלל ברשימת האירועים ובגבול התקרה (ס' 260(ב)(1)(א)). הוצאות ההתדיינות הסבירות ניתנות לשיפוי (ס' 260(א)(2)).","4. ביטוח: בתקנון יש הוראת ביטוח. אם רכשה החברה פוליסה, היא יכולה לכסות רשלנות כלפי הבנק ואף כלפי החברה (ס' 261(1), (3)).","5. העיצום הכספי: אסור לשפות, לבטח או לפטור על העיצום עצמו (ס' 263(4)). מותר לשפות על הוצאות ההתדיינות הסבירות בהליך בקשר לעיצום, אם יש התחייבות או היתר בתקנון (ס' 260(א)(1א)).","6. אם יתברר שליאת פעלה ביודעין, כלומר בכוונה או בפזיזות, הכיסויים לא יחולו (ס' 263(2))."],"check":["ההפסד בגידור: רשלנות כלפי החברה, הפטור חל (ס' 259(א))","פטור אינו חל על צד שלישי","שיפוי לבנק: ס' 260(א)(1) בתוך האירועים והתקרה","ביטוח: ס' 261(1), (3)","עיצום כספי: ס' 263(4), והוצאות לפי ס' 260(א)(1א)","הסתייגות לגבי כוונה או פזיזות: ס' 263(2)"]}]},{"id":"u6-c2","title":"\"גליל מזון\" – החלטות פגומות","facts":"\"גליל מזון בע\"מ\" היא חברה פרטית. מניותיה מחולקות לשני סוגים: מניות רגילות ומניות בכורה. דירקטוריון החברה קיבל לאחרונה שלוש החלטות:\n(1) \"כל הדירקטורים פטורים מכל אחריות כלפי החברה בגין כל פעולה שעשו מיום הקמתה ועד היום, ומכל פעולה בעתיד\". ההחלטה התקבלה סמוך לאחר שבדיקה פנימית העלתה שהדירקטורים אישרו לפני חצי שנה חלוקת דיבידנד בלי לבחון את יכולת הפירעון, וכן ששני דירקטורים קיבלו \"דמי תיווך\" מספק.\n(2) הדירקטוריון החליט לרכוש פוליסת ביטוח שתכסה את היועץ המשפטי של החברה, בין השאר, \"בגין הפרת חובת אמונים מכל סוג\".\n(3) הדירקטוריון החליט לשפות את מנהל המכירות על קנס שהוטל עליו בהליך פלילי, בגין עבירה שנעברה במסגרת עבודתו.\nבתקנון החברה יש הוראה כללית: \"החברה רשאית לפטור, לשפות ולבטח נושאי משרה בהתאם לחוק\". ההוראה אושרה רק באסיפה הכללית, בלי אסיפות סוג.","parts":[{"q":"דונו בתוקף החלטה (1). [עד 15 שורות]","pts":20,"model":["1. הוראת הפטור והשיפוי בתקנון של חברה פרטית שמניותיה מחולקות לסוגים טעונה גם אישור אסיפות סוג (ס' 262(א)). כיוון שלא התקבל אישור כזה, יש ספק אם הוראת הפטור בתקנון תקפה. בלי הוראה תקפה, אין פטור כלל (ס' 259(א)).","2. פטור \"מיום הקמתה ועד היום\" הוא פטור בדיעבד, וחסר תוקף. ס' 259(א) מתיר פטור רק \"מראש\".","3. חלוקת הדיבידנד: אסור לפטור מראש דירקטור מהפרת זהירות בחלוקה (ס' 259(ב)), ולכן גם לגבי העתיד ההחלטה פגומה בהיקפה. בנוסף, הדירקטורים חשופים לאחריות לפי ס' 311 בשל חלוקה אסורה.","4. \"דמי התיווך\" מספק הם הפרת חובת אמונים ופעולה מתוך כוונה להפיק רווח אישי שלא כדין. אין עליהן פטור (ס' 258(א), 263(1), (3)).","5. \"מכל אחריות\" כולל גם הפרת אמונים והפרות בכוונה, ולכן חסר תוקף (ס' 263). פטור תקף יכול לחול רק על הפרת זהירות ברשלנות, מראש.","6. הפטור הוא תנאי כהונה של דירקטורים (ס' 1). בחברה פרטית הוא טעון אישור דירקטוריון ולאחריו אישור האסיפה הכללית (ס' 273(א)). החלטת הדירקטוריון לבדה אינה מספיקה. הדירקטורים גם החליטו בעניינם (ס' 278), ובמצב כזה נדרש ממילא אישור האסיפה (ס' 278(ג)).","7. מסקנה: ההחלטה חסרת תוקף לגבי העבר כולו. לגבי העתיד, היא יכולה להיות תקפה רק אחרי תיקון הפגם בתקנון (ס' 262(א)) ואישור האסיפה (ס' 273), ורק לגבי רשלנות שאינה בחלוקה."],"check":["ס' 262(א): אסיפות סוג","פטור רק מראש: ס' 259(א)","חלוקה: ס' 259(ב)","הפרת אמונים ורווח אישי: ס' 258(א), 263","מסלול אישור לדירקטורים בחברה פרטית: ס' 273(א)","ס' 278(ג)"]},{"q":"דונו בתוקף החלטות (2) ו-(3), והציעו כיצד לתקן. [עד 15 שורות]","pts":20,"model":["1. החלטה (2): ביטוח על הפרת חובת אמונים מותר רק אם נושא המשרה פעל בתום לב והיה לו יסוד סביר להניח שהפעולה לא תפגע בטובת החברה (ס' 261(2)). ביטוח על \"הפרת אמונים מכל סוג\" חסר תוקף מעבר לכך (ס' 263(1), 264(ב)).","2. נושא משרה שמקבל במישרין או בעקיפין התחייבות לביטוח על הפרת אמונים שלא במסגרת ס' 261(2) מפר בעצם הקבלה את חובת האמונים (ס' 264(ב)).","3. תיקון: לנסח את הפוליסה כך שתכסה רשלנות כלפי החברה וכלפי אחרים, חבות כספית לאחר, והפרת אמונים רק בתנאי ס' 261(2). ההחלטה מאושרת כ\"תנאי כהונה והעסקה\" (ס' 1). בחברה פרטית, ליועץ משפטי שאינו דירקטור: ועדת ביקורת ← דירקטוריון (ס' 272(א)), או דירקטוריון בלבד אם אין ועדת ביקורת (ס' 272(ב)).","4. החלטה (3): אין תוקף להחלטת דירקטוריון המתירה לשפות נושא משרה על קנס (ס' 263(4)). ההחלטה בטלה.","5. מותר לשפות על הוצאות ההתדיינות, אבל רק אם זוכה או הורשע בעבירה שאינה דורשת מחשבה פלילית (ס' 260(א)(2)), ובכפוף להוראה תקפה בתקנון.","6. דירקטורים שאישרו תשלום אסור עלולים להפר בעצמם את חובת הזהירות כלפי החברה (ס' 252–253)."],"check":["ס' 261(2): תנאי הביטוח לאמונים","ס' 263(1), 264(ב): הקבלה עצמה כהפרה","מסלול האישור ליועץ המשפטי בחברה פרטית: ס' 272(א)–(ב)","ס' 263(4): קנס","ס' 260(א)(2): הוצאות בלבד ובתנאים"]}]}]},{"id":"u7","title":"עסקאות עם בעלי עניין","short":"עסקאות בעלי עניין","blurb":"לזהות עניין אישי, קרוב, עסקה חריגה ובעל שליטה, לבחור את מסלול האישור הנכון (ס' 271, 272 או 275, כולל הרוב המיוחד וכלל שלוש השנים), ולקבוע את תוצאת היעדר האישור.","secs":["1","268","269","270","271","272","275","276","277","278","280","115","117"],"blocks":[{"t":"h","x":"למה צריך פרק מיוחד לעסקאות עם בעלי עניין?"},{"t":"p","x":"כשהחברה מתקשרת עם מי ששולט בה, או עם מי שמנהל אותה, יש לו אינטרס להעביר אליו ערך מהחברה. זו \"<b>בעיית הנציג</b>\". בחברה עם בעלות מרוכזת, כמו רוב החברות הציבוריות בישראל, הסיכון המרכזי הוא ש<b>בעל השליטה</b> ינצל את כוחו על חשבון בעלי מניות המיעוט, למשל בהתקשרות במחיר מנופח עם חברה שבבעלותו. הפרק החמישי בחלק השישי לחוק (ס' 268–284) אינו אוסר עסקאות כאלה. הוא מחייב <b>גילוי</b>, ו<b>מסלול אישור</b> בגופים שאינם נגועים בעניין האישי."},{"t":"h","x":"מושגי יסוד (ס' 1)"},{"t":"law","law":"חוק החברות","sec":"1","x":"”ענין אישי“ – ענין אישי של אדם בפעולה או בעסקה של חברה, לרבות ענין אישי של קרובו ושל תאגיד אחר שהוא או שקרובו הם בעלי ענין בו, ולמעט ענין אישי הנובע מעצם החזקת מניות בחברה,"},{"t":"law","law":"חוק החברות","sec":"1","x":"”קרוב“ – בן זוג, אח או אחות, הורה, הורי הורה, צאצא וכן צאצא, אח, אחות או הורה של בן הזוג או בן זוגו של כל אחד מאלה;"},{"t":"law","law":"חוק החברות","sec":"1","x":"”עסקה חריגה“ – עסקה שאינה במהלך העסקים הרגיל של החברה, עסקה שאינה בתנאי שוק או עסקה העשויה להשפיע באופן מהותי על רווחיות החברה, רכושה או התחייבויותיה;"},{"t":"list","x":["<b>עניין אישי</b> כולל גם עניין של <b>קרוב</b>, ועניין של <b>תאגיד</b> שהאדם או קרובו הם \"בעלי עניין\" בו. \"בעל עניין\" (ס' 1) הוא מי שמחזיק 5% או יותר, מי שמוסמך למנות דירקטור או מנכ\"ל, ומי שמכהן כדירקטור או כמנכ\"ל. לדוגמה: לסמנכ\"לית יש עניין אישי בעסקה עם חברה שבעלה הוא המנכ\"ל שלה.","<b>לא נחשב עניין אישי</b>: עניין שנובע <b>רק</b> מהחזקת מניות בחברה עצמה. כל בעל מניה \"מרוויח\" מעסקה טובה לחברה, וזה לא הופך אותו לנגוע.","<b>הצבעה לפי ייפוי כוח</b>: לפי סוף ההגדרה, מי שמצביע לפי ייפוי כוח של בעל עניין אישי נחשב כבעל עניין אישי.","<b>עסקה</b> (ס' 1) היא חוזה או התקשרות, וגם החלטה חד-צדדית של החברה על הענקת זכות או טובת הנאה."]},{"t":"trap","x":"<b>מלכודת \"קרוב\":</b> ההגדרה סגורה. <b>דוד</b>, <b>בן דוד</b>, <b>שותף עסקי</b> ו<b>חבר קרוב</b> אינם \"קרובים\". מנגד, <b>אח של בן הזוג</b> (גיס), <b>הורה של בן הזוג</b> (חותן או חמות), <b>סב</b>, ו<b>בן זוגו של אח</b> (גיסה) הם קרובים. שימו לב: \"הורי הורה\" מופיעים, אבל נכדים נכללים רק בתוך \"צאצא\"."},{"t":"case","name":"ת\"א (כלכלית ת\"א) 36962-05-23 חיים צוף נ' דניאל כהן","x":"\"עניין אישי\" מזוהה לפי מבחן \"הזיקה העודפת המשמעותית\": בוחנים כמה עמוק הפער בין הזיקה האישית לבין טובת החברה, ומה עוצמת הזיקה. אצל בעל שליטה נדרשת זיקה עודפת בעוצמה גבוהה במיוחד. הרצון של בעל השליטה לשמור על שליטתו ולא להידלל נובע \"מעצם החזקת מניות\", ולכן אינו עניין אישי שמחייב אישור משולש."},{"t":"table","head":["מבחן \"עסקה חריגה\" (מספיק אחד)","שאלת המפתח","דוגמה"],"rows":[["שלא במהלך העסקים הרגיל","האם זו פעילות שגרתית של החברה?","חברת מזון שרוכשת בניין משרדים"],["שלא בתנאי שוק","האם המחיר והתנאים זהים למה שהיה מוסכם עם צד זר?","רכישה מספק במחיר גבוה ב-20% ממחיר השוק"],["עשויה להשפיע מהותית","האם היא עשויה להשפיע מהותית על הרווחיות, הרכוש או ההתחייבויות?","הסכם אספקה בלעדי לחמש שנים בהיקף של מיליונים"]]},{"t":"case","name":"ע\"א 7735/14 ורדניקוב נ' אלוביץ'","x":"בהקשר של עסקה חריגה נקבע: חלוקה שוויונית לכלל בעלי המניות אינה \"עסקה חריגה\" עם בעל השליטה, ולכן אינה טעונה אישור משולש, גם כשלבעל השליטה יש אינטרס מובהק בה. במצב כזה חל סטנדרט של \"בחינה מוגברת\"."},{"t":"h","x":"\"בעל שליטה\" לעניין הפרק (ס' 268)"},{"t":"law","law":"חוק החברות","sec":"268","x":"בפרק זה, ”בעל שליטה“ – בעל השליטה כמשמעותה בסעיף 1, לרבות מי שמחזיק בעשרים וחמישה אחוזים או יותר מזכויות ההצבעה באסיפה הכללית של החברה אם אין אדם אחר המחזיק בלמעלה מחמישים אחוזים מזכויות ההצבעה בחברה; לענין החזקה, יראו שניים או יותר, המחזיקים בזכויות הצבעה בחברה ואשר לכל אחד מהם יש ענין אישי באישור אותה עסקה המובאת לאישור החברה, כמחזיקים יחד."},{"t":"list","x":["<b>שליטה \"רגילה\"</b>: לפי ס' 1, \"שליטה\" היא כמשמעותה בחוק ניירות ערך, כלומר <b>היכולת לכוון את פעילות התאגיד</b>. חזקה שמי שמחזיק <b>מחצית או יותר</b> מסוג מסוים של אמצעי השליטה (זכויות הצבעה או זכות למנות דירקטורים או מנכ\"ל) הוא בעל שליטה.","<b>הרחבה של 25%</b>: לעניין הפרק, גם מי שמחזיק <b>25% או יותר</b> מזכויות ההצבעה הוא בעל שליטה, <b>אם אין</b> אדם אחר שמחזיק <b>יותר מ-50%</b>.","<b>צירוף החזקות</b>: שניים או יותר, שלכל אחד מהם עניין אישי באותה עסקה, נחשבים כמחזיקים יחד. לדוגמה: שני אחים, כל אחד עם 15%, שמוכרים נכס משותף לחברה."]},{"t":"example","title":"דוגמה: מי בעל השליטה?","x":"(1) נעמה 48%, קרן פנסיה 10%, והשאר מפוזר: נעמה היא בעלת שליטה, כי יש לה 25% ומעלה ואין מחזיק ביותר מ-50% (ס' 268). סביר שהיא שולטת גם לפי ס' 1. \n(2) אורי 30%, ודני 55%: דני בעל שליטה. אורי <b>אינו</b> בעל שליטה לפי כלל 25%, כי יש אדם אחר שמחזיק ביותר מ-50%. \n(3) שני אחים מחזיקים 13% ו-14%, ושניהם בעלי עניין אישי במכירת מגרש משפחתי לחברה. יחד הם מחזיקים 27%, ולכן לעניין אותה עסקה הם בעלי שליטה, אם אין מחזיק אחר ביותר מ-50%."},{"t":"h","x":"חובת הגילוי (ס' 269)"},{"t":"law","law":"חוק החברות","sec":"269","x":"(א) נושא משרה בחברה או בעל שליטה בחברה ציבורית או בחברה פרטית שהיא חברת איגרות חוב היודע שיש לו ענין אישי בעסקה קיימת או מוצעת של החברה, יגלה לחברה, בלא דיחוי, ולא יאוחר מישיבת הדירקטוריון שבה נדונה העסקה לראשונה, את מהות ענינו האישי, לרבות כל עובדה או מסמך מהותיים. (ב) הוראת סעיף קטן (א) לא תחול כאשר הענין האישי נובע רק מקיום ענין אישי של קרוב בעסקה שאינה חריגה."},{"t":"h","x":"סוגי העסקאות ומסלולי האישור (ס' 270)"},{"t":"p","x":"ס' 270 מונה את העסקאות שטעונות אישור מיוחד, ובפתחו קובע תנאי מהותי לכולן: \"<b>ובלבד שהעסקה היא לטובת החברה</b>\". גם אישור פרוצדורלי מושלם אינו מכשיר עסקה שאינה לטובת החברה."},{"t":"case","name":"ע\"א 7594/16 מולכו, המנהל המיוחד נ' בנק מזרחי טפחות בע\"מ","x":"ס' 280(א) משלים את מנגנון אישור עסקאות בעלי עניין: עסקה שלא אושרה כנדרש חסרת תוקף כלפי החברה וכלפי בעל העניין. תנאי מוקדם לאישור הוא \"שהעסקה היא לטובת החברה\", ולכן גם אישורים פורמליים אינם מכשירים עסקה שאינה לטובתה."},{"t":"table","head":["סוג העסקה (ס' 270)","מסלול האישור בחברה ציבורית","סעיף"],"rows":[["(1) עם נושא משרה, או עסקה שלנושא משרה עניין אישי בה, <b>לא חריגה</b>","דירקטוריון, אלא אם נקבעה בתקנון דרך אחרת","271"],["(1) כנ\"ל, <b>חריגה</b>","ועדת ביקורת ← דירקטוריון","272(א)"],["(2) תנאי כהונה של נושא משרה שאינו דירקטור (ומנכ\"ל)","ועדת תגמול ← דירקטוריון (מנכ\"ל: + אסיפה ברוב מיוחד)","272(ג), (ג1)"],["(3) תנאי כהונה של דירקטור","ועדת תגמול ← דירקטוריון ← אסיפה","273"],["(4) רישה: עסקה <b>חריגה</b> עם בעל שליטה, או שלבעל שליטה עניין אישי בה (כולל הצעה פרטית)","ועדת ביקורת ← דירקטוריון ← אסיפה ברוב מיוחד","275(א)"],["(4) סיפא: <b>קבלת שירותים</b> מבעל שליטה או מקרובו; <b>תנאי כהונה</b> של בעל שליטה שהוא נושא משרה; <b>העסקה</b> של בעל שליטה או קרובו כעובד (גם כשאינה חריגה)","ועדת ביקורת (בתנאי כהונה והעסקה: ועדת תגמול) ← דירקטוריון ← אסיפה ברוב מיוחד","275(א)"],["(5) הצעה פרטית מהותית","דירקטוריון ← אסיפה","274"]]},{"t":"h","x":"עסקאות עם נושא משרה (ס' 271–272(א))"},{"t":"steps","title":"נושא משרה שיש לו עניין אישי בעסקה","x":["<b>זיהוי:</b> האם זו עסקה של החברה עם נושא המשרה, או עם אדם אחר שלנושא המשרה עניין אישי בה, כמו חברה של בן זוגו (ס' 270(1))?","<b>גילוי:</b> נושא המשרה מגלה בלי דיחוי, ולא יאוחר מישיבת הדירקטוריון הראשונה שבה העסקה נדונה (ס' 269(א)). אין חובה כשהעניין נובע רק מקרוב בעסקה שאינה חריגה (ס' 269(ב)).","<b>סיווג:</b> ועדת הביקורת מחליטה, בנימוקים, אם העסקה חריגה (ס' 117(1א)).","<b>לא חריגה:</b> אישור הדירקטוריון, אלא אם נקבעה בתקנון דרך אחרת (ס' 271). חובת ההימנעות של ס' 278(א) אינה חלה על עסקה כזו.","<b>חריגה:</b> ועדת ביקורת ← דירקטוריון (ס' 272(א)). נושא המשרה אינו נוכח ואינו מצביע, אלא לשם הצגה (ס' 278(א)).","<b>תוכן:</b> העסקה חייבת להיות לטובת החברה (רישת ס' 270). אחרת היא פסולה, ונושא המשרה מפר גם את חובת האמונים (ס' 254(א)(1))."]},{"t":"h","x":"עסקאות עם בעל שליטה (ס' 275)"},{"t":"law","law":"חוק החברות","sec":"275(א)","x":"(א) עסקה שמתקיים בה האמור בסעיף 270(4) טעונה אישורם של אלה בסדר הבא: (1) ועדת הביקורת ובעסקה באשר לתנאי כהונה והעסקה – ועדת התגמול; (2) הדירקטוריון; (3) האסיפה הכללית, ובלבד שיתקיים אחד מאלה: (א) במנין קולות הרוב באסיפה הכללית ייכללו רוב מכלל קולות בעלי המניות שאינם בעלי ענין אישי באישור העסקה, המשתתפים בהצבעה; במנין כלל הקולות של בעלי המניות האמורים לא יובאו בחשבון קולות הנמנעים; (ב) סך קולות המתנגדים מקרב בעלי המניות האמורים בפסקת משנה (א) לא עלה על שיעור של שני אחוזים מכלל זכויות ההצבעה בחברה."},{"t":"law","law":"חוק החברות","sec":"275(א1)","x":"עסקה כאמור בסעיף קטן (א) לתקופה העולה על שלוש שנים, טעונה אישור כאמור באותו סעיף קטן, אחת לשלוש שנים. (2) על אף האמור בפסקה (1), עסקה כאמור בסעיף 270(4) רישה, בלבד, יכול שתאושר לתקופה העולה על שלוש שנים, ובלבד שוועדת הביקורת אישרה כי התקשרות לתקופה כאמור סבירה בנסיבות העניין."},{"t":"steps","title":"עסקה עם בעל שליטה: צעד אחר צעד","x":["<b>האם יש \"בעל שליטה\"?</b> לפי ס' 268: שליטה, או 25% כשאין מחזיק ביותר מ-50%, או צירוף של בעלי עניין אישי.","<b>האם לבעל השליטה עניין אישי?</b> עסקה עמו ישירות, או עם קרוב או עם תאגיד שהוא או קרובו בעלי עניין בו (ס' 1).","<b>איזו חלופה של ס' 270(4)?</b> עסקה <b>חריגה</b> (רישה), שהוועדה מסווגת לפי ס' 117(1א); או <b>שירותים, תנאי כהונה או העסקה</b> (סיפא), שטעונים אישור <b>גם אם אינם חריגים</b>.","<b>גילוי</b> בידי בעל השליטה (ס' 269(א)).","<b>ועדה</b>: ועדת ביקורת. בתנאי כהונה והעסקה: ועדת תגמול (ס' 275(א)(1)). הוועדה חייבת לעמוד בדרישות ההרכב של ס' 115, אחרת אינה רשאית לאשר (ס' 279).","<b>דירקטוריון</b> (ס' 275(א)(2)). בעלי העניין האישי אינם משתתפים (ס' 278(א)).","<b>אסיפה כללית ברוב מיוחד</b> (ס' 275(א)(3)): רוב מקרב בעלי המניות שאינם בעלי עניין אישי המשתתפים בהצבעה, בלי למנות נמנעים, <b>או</b> מתנגדים מקרבם שאינם עולים על 2% מכלל זכויות ההצבעה. כל מצביע מודיע אם יש לו עניין אישי, ואם לא הודיע, קולו לא נמנה (ס' 276).","<b>משך</b>: עסקה ליותר משלוש שנים טעונה אישור מחדש <b>אחת לשלוש שנים</b> (ס' 275(א1)(1)). <b>חריג</b>: עסקה חריגה לפי ס' 270(4) <b>רישה בלבד</b> יכולה להיות מאושרת לתקופה ארוכה יותר, אם ועדת הביקורת אישרה שהתקופה סבירה בנסיבות (ס' 275(א1)(2))."]},{"t":"table","head":["","חלופה (א): רוב מקרב הלא-נגועים","חלופה (ב): \"כלל 2%\""],"rows":[["מי נספר","רק בעלי מניות <b>שאינם בעלי עניין אישי</b> שהשתתפו בהצבעה","רק המתנגדים מקרב שאינם בעלי עניין אישי"],["נמנעים","לא נספרים","לא רלוונטי"],["המבחן","בעד > נגד, בתוך קבוצת הלא-נגועים","סך המתנגדים הלא-נגועים ≤ 2% <b>מכלל זכויות ההצבעה בחברה</b>"],["שימוש","כשהמיעוט השתתף והצביע","כשההשתתפות של המיעוט נמוכה, וההתנגדות זניחה"]]},{"t":"example","title":"דוגמה: חישוב הרוב המיוחד","x":"<b>עובדות:</b> בחברה ציבורית ברוריה מחזיקה 60%, שרגא 20%, משה 10%, והציבור 10%. החברה רוצה להעסיק את אחיה של ברוריה כמהנדס לחמש שנים.\n<b>ניתוח:</b> העסקת קרוב של בעל השליטה כעובד היא עסקה לפי ס' 270(4) סיפא. היא טעונה אישור <b>גם אם אינה חריגה</b>, במסלול ס' 275(א): ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד. בוועדה, ההחלטה בדבר תנאי העסקה מתקבלת בוועדת התגמול. \n<b>באסיפה</b>: לברוריה עניין אישי, ולכן קולותיה אינם נספרים בחלופה (א). אם שרגא ומשה (30%) הצביעו בעד, ומהציבור הצביעו נגד 2%, אז בקרב הלא-נגועים 30% בעד מול 2% נגד, וההחלטה עוברת. \n<b>משך</b>: חמש שנים, ולכן נדרש אישור מחדש אחת לשלוש שנים (ס' 275(א1)(1)). החריג של ס' 275(א1)(2) <b>אינו חל</b>, כי זו העסקה (סיפא), ולא עסקה חריגה (רישה)."},{"t":"trap","x":"<b>מלכודת 1, \"רק אם חריגה\":</b> העסקת קרוב של בעל השליטה, קבלת שירותים ממנו, ותנאי הכהונה שלו, טעונים את מסלול ס' 275 <b>גם כשאינם חריגים</b>. הדרישה \"עסקה חריגה\" חלה רק על רישת ס' 270(4). \n<b>מלכודת 2, \"האישור תקף לכל התקופה\":</b> עסקה של יותר משלוש שנים מאושרת מחדש אחת לשלוש שנים. החריג, שמאפשר תקופה ארוכה אם ועדת הביקורת קבעה שהיא סבירה, חל <b>רק</b> על עסקה חריגה לפי ס' 270(4) רישה."},{"t":"h","x":"ועדת הביקורת: סיווג, הרכב ותפקידים"},{"t":"law","law":"חוק החברות","sec":"117(1א)","x":"(1א) להחליט על יסוד נימוקים שיפורטו, לגבי פעולות כאמור בסעיף 255 אם הן פעולות מהותיות או פעולות שאינן מהותיות, ולגבי עסקאות כאמור בסעיף 270(1), (4) ו־(4א) אם הן עסקאות חריגות או עסקאות שאינן חריגות, לצורך אישורן לפי חוק זה, ורשאית ועדת הביקורת להחליט כאמור לגבי סוג של פעולות או עסקאות, לפי אמות מידה שתקבע אחת לשנה מראש;"},{"t":"list","x":["<b>הרכב</b> (ס' 115(א)): לפחות שלושה חברים. כל הדירקטורים החיצוניים חברים בה, ורוב חבריה דירקטורים בלתי תלויים.","<b>מי פסול</b> (ס' 115(ב)(1), (ג)): יו\"ר הדירקטוריון; דירקטור שמועסק בידי החברה, בידי בעל השליטה או בידי תאגיד בשליטתו; דירקטור שנותן להם שירותים דרך קבע; דירקטור שעיקר פרנסתו על בעל השליטה; <b>בעל השליטה וקרובו</b>.","<b>יו\"ר הוועדה</b> הוא דירקטור חיצוני (ס' 115(ד)). מי שפסול לחברות אינו נוכח בדיון ובהחלטה, אלא אם היו\"ר קבע שהוא נדרש להצגת נושא מסוים (ס' 115(ה)).","<b>תוצאה</b>: ועדה שאינה עומדת בס' 115 אינה רשאית לתת אישור לפי הפרק (ס' 279).","<b>תפקידים נוספים בפרק</b>: קביעת הליך תחרותי או הליכים אחרים ל
