ם להוראות הסעיף האמור, רשאי בית המשפט, לבקשת התאגיד, לצוות עליו שיגיש את ההודעה או שיתקנה תוך זמן שיקבע בית המשפט."},{"sec":"1","title":"הגדרות","law":"פקודת השותפויות","text":"(א) בפקודה זו –\n(סוג=הגדרה)  ”עסק“ – כל משלח־יד שמותר לעסוק בו;\n(סוג=הגדרה)  ”קשרי שותָפות“ – הקשרים שבין בני אדם המנהלים יחד עסק לשם הפקת רווחים, למעט את הקשרים שבין חברי תאגיד שהואגד לפי כל דין אחר;\n(סוג=הגדרה)  ”שותָפות“ – חבר בני האדם שהתקשרו בקשרי שותפות;\n(סוג=הגדרה)  ”שותף“ – כל מי שהתקשר עם זולתו בקשרי שותפות;\n(סוג=הגדרה)  ”שותף מוגבל“ – מי שהכניס לשותפות בשעת ההתקשרות הון, בכסף או בנכס שהוערך בסכום מפורש, על מנת שלא יהא אחראי לחיוביה של השותפות למעלה מן הסכום שהכניס כאמור;\n(סוג=הגדרה)  ”שותף כללי“ – שותף שאינו שותף מוגבל;\n(סוג=הגדרה)  ”שם השותָפות“ – השם שבו מנהלת שותפות את עסקיה;\n(סוג=הגדרה)  ”בית משפט“ – בית המשפט המוסמך לצוות על פירוק שותפות;\n(סוג=הגדרה)  ”רשם“ – מי שממלא לפי פקודה זו תפקידו של רשם השותפויות.\n(ב) דיני היושר והמשפט המקובל האנגליים החלים על שותָפויות יחולו בישראל, ככל שאין בהם סתירה להוראה מפורשת של פקודה זו."},{"sec":"2","title":"צורות שיתוף שאינן קשרי שותפות","law":"פקודת השותפויות","text":"לשם הכרעה אם קיימים קשרי שותפות ואם לאו, יש ליתן את הדעת על כללים אלה:\n(1) שיתוף מכל צורה או הגדר בנכס או בכל זכות בו – אין בכך בלבד כדי ליצור קשרי שותפות בין בעלי הנכס או הזכות, ואפילו הם נוטלים חלק ברווחים המגיעים מן השימוש בהם;\n(2) נטילת חלק בהכנסה ברוטו מנכס, היא בלבד אינה יוצרת קשרי שותפות, בין שנוטלי החלק יש להם בנכס זכות או טובת הנאה משותפות ובין שאין להם;\n(3) הנפרע חוב או סכום קצוב אחר, בין בשיעורין ובין בצורה אחרת, מתוך רווחיו הנצמחים של עסק, איננו נעשה בשל כך בלבד שותף בעסק או חב כשותף בו;\n(4) חוזה, שעל פיו עובדו או שלוחו של בעל עסק יקבל את גמולו בחלק מרווחיו של העסק, אין בו בלבד כדי לעשות את העובד או את השלוח שותף בעסק או חב כשותף בו;\n(5) בן זוגו או ילדו של שותף שנפטר או התלוי בנפטר, המקבל בדרך של אנונה חלק מרווחי העסק שהנפטר היה שותף בו, אינו נעשה משום כך בלבד לשותף בעסק או חב כשותף בו;\n(6) המלווה כסף למי שעושה עסק או עומד לעשות עסק, ועל פי החוזה שביניהם יקבל המלווה ריבית בשיעור משתנה לפי רווחי העסק, או יקבל חלק ברווחים – אין המלווה נעשה משום כך בלבד שותף בעסק או חב כשותף בו;\n(7) המקבל, בדרך של אנונה או בדרך אחרת, חלק ברווחי עסק כתמורה בעד מכירת המוניטין של העסק, אינו נעשה משום כך בלבד לשותף בעסק או חב כשותף בו;\n(8) חוץ מן האמור לעיל בסעיף זה, תהא קבלת חלק ברווחי עסק, או כל תשלום התלוי ברווחי עסק או המשתנה לפיהם, ראיה לכאורה שהמקבל הוא שותף בעסק, אלא שניתן לסתור ראיה זו בשים לב לכל נסיבות העסקה שבין הצדדים."},{"sec":"3","title":"סייג למספר השותפים הכלליים","law":"פקודת השותפויות","text":"מספר השותפים הכלליים בשותפות לא יעלה על עשרים."},{"sec":"3א","title":"שותפות מקצועית","law":"פקודת השותפויות","text":"על אף האמור בסעיף 3 –\n(1) שותפות של עורכי דין או של רואי חשבון לשם עיסוק במקצועם, יכול שיהיו בה יותר מעשרים חברים;\n(2) שר המשפטים, באישור ועדת החוקה חוק ומשפט של הכנסת, רשאי להחיל את הוראות פסקה (1) על שותפויות אחרות של בעלי מקצוע מסוימים לשם עיסוק במקצועם, ורשאי הוא לקבוע את המספר המרבי של החברים בשותפויות כאמור."},{"sec":"4","title":"רישום חובה","law":"פקודת השותפויות","text":"שותפות שנתכוננה לשם ניהול עסק, חייבת ברישום לפי הוראות פקודה זו תוך חודש מן היום שנתכוננה; להוציא שותפות בין חקלאים לשם מיזם משותף בקשר עם עיבוד אדמה."},{"sec":"5","title":"רישום ברשות","law":"פקודת השותפויות","text":"שותפות שאינה חייבת ברישום רשאית להירשם כשותפות לפי פקודה זו, אם ביקשו זאת שותפיה, ואם נרשמה תחול עליה פקודה זו."},{"sec":"13","title":"שינוי השם","law":"פקודת השותפויות","text":"(א) שותפות רשאית, באישור הרשם, לשנות את שמה.\n(ב) שינוי שמה של שותפות אינו משפיע על שום זכות או התחייבות ואינו פוגם בשום הליך משפטי שלה או נגדה."},{"sec":"14","title":"כוחו של שותף לחייב את השותפות","law":"פקודת השותפויות","text":"כל שותף הוא שלוח של השותפות ושל שאר שותפיו לכל ענין של עסקי השותפות; ופעולותיו של כל שותף, כשהוא עושה בדרך הרגילה עסק מן הסוג שעושה השותפות שהוא חבר בה, יחייבו את השותפות ואת שותפיו, זולת אם למעשה אין לו הרשאה לפעול בשם השותפות באותו עסק, והאדם שעמו נשא ונתן יודע שאין לשותף הרשאה לכך, או שאינו יודע, או אינו מאמין, שהוא שותף."},{"sec":"15","title":"פעולות ותעודות בשם השותפות","law":"פקודת השותפויות","text":"פעולה או תעודה הנוגעת לעסקי השותפות, שנעשתה או נערכה בידי אדם מורשה לכך, בשם השותפות או בדרך אחרת המראה כוונה לחייב את השותפות, בין שהאדם הוא שותף ובין אם לאו – יחייבו את השותפות ואת כל השותפים; אין הוראה זו גורעת מכל הוראת דין כללית לענין עריכתם של מסמכים סחירים או עריכת תעודות בפני נוטריון ציבורי."},{"sec":"16","title":"שימוש לרעה באשראי השותפות","law":"פקודת השותפויות","text":"שותף המשעבד את אשראי השותפות, או המתאמר לחייב אותה בדרך אחרת, למטרה שאין לה לכאורה כל קשר לעסקיה הרגילים של השותפות, אין מעשהו מחייב אותה, אלא אם שאר השותפים הרשוהו לכך במיוחד; אין הוראה זו גורעת מכל חבות אישית שחב בה שותף כפרט."},{"sec":"17","title":"הגבלת הרשאתם של שותפים","law":"פקודת השותפויות","text":"הוסכם בין השותפים להגביל הרשאתו של שותף לחייב את השותפות – כל מעשה שנעשה שלא כמוסכם לא יחייב את השותפות כלפי אדם שידע על ההסכמה."},{"sec":"18","title":"חבות בשל עוולה","law":"פקודת השותפויות","text":"שותף הפועל במהלך הרגיל של עסקי השותפות, או בהרשאתם של השותפים, ותוך פעולתו הוא גורם במעשה או במחדל שלא כדין נזק או פגיעה לאדם שאינו שותף – תהא השותפות חבה באותה מידה שחב בה השותף."},{"sec":"19","title":"חבות בשל פגיעה בנכסי הזולת","law":"פקודת השותפויות","text":"שותף שהשתמש שלא כדין בכסף או בנכס שקיבל בתחום הרשאתו הנחזית מידי מי שאינו שותף, או בכסף או בנכס שקיבלה השותפות במהלך עסקיה מידי מי שאינו שותף ועדיין הם ברשותה – תהא השותפות חבה להיטיב את הנזק."},{"sec":"20","title":"השותפים חבים יחד ולחוד","law":"פקודת השותפויות","text":"(א) כל שותף חב, יחד עם שאר השותפים ולחוד, בכל החיובים שהשותפות חבה בהם בהיותו שותף, לרבות בכל דבר שהשותפות חבה בו לפי סעיפים 18 ו־19 בהיותו שותף, ואם נפטר השותף יהא עזבונו חב כאמור באותם חיובים במידה שעדיין לא סולקו.\n(ב) לא יינתן צו של הוצאה לפועל נגד שותף, מכוח היותו חב לחוד בחיוביה של השותפות כאמור בסעיף קטן (א), אלא אם פורקה השותפות, או אם הנושה בה קיבל פסק דין נגדה בשל החיוב ופסק הדין לא קויים במלואו; במקרה אחרון זה יהא השותף שפרע זכאי לסעד בשיעור יחסי מן השותפות ומשאר השותפים."},{"sec":"21","title":"הגשת תביעות בפשיטת רגל","law":"פקודת השותפויות","text":"השותפות וכל שותף בה לא יהיו זכאים לתבוע, בפשיטת רגל של שותף, אלא לאחר נושי השותפות, ושותף לא יהיה זכאי לתבוע, בפשיטת רגל של השותפות, אלא לאחר נושי השותפות; ואולם –\n(1) מקום ששותף נטל במעשה מרמה ולשימוש עצמו מרכוש השותפות, והמעשה לא הוכשר, יהא הנאמן בפשיטת רגל של השותפות זכאי לתבוע מנכסיו הפרטיים של השותף כדי שוויו של הרכוש שנטל;\n(2) מקום שחלק מנכסיו הפרטיים של שותף נעשו נכסי השותפות במעשה מרמה שהשותפות אחראית לו, יהא השותף המרומה זכאי לתבוע בפשיטת רגל של השותפות כדי השיעור שניטל במרמה מנכסיו הפרטיים;\n(3) מקום ששותפים אחדים ניהלו עסק נפרד בהון נפרד ותוך כך נעשו לנושים או לחייבים של השותפות, יהיו הנאמנים בפשיטת רגל, לפי הענין, זכאים לתבוע כדרך שהיו זכאים אילולא היתה זהות אישית של שותפים."},{"sec":"22","title":"חבות בשל הפרת נאמנות","law":"פקודת השותפויות","text":"אחד השותפים שנתמנה נאמן והשתמש שלא כראוי בנכס של הנאמנות לעסקי השותפות או לצרכיה, לא יהיה שותף אחר חב בשל נכס הנאמנות כלפי מי שיש לו טובת הנאה באותו נכס; אולם אין הוראה זו גורעת מחבותו של שותף שידע על הפרת הנאמנות, ואינה מונעת לעקוב אחר כספי הנאמנות ולגבותם מן השותפות אם הם עדיין בהחזקתה או בשליטתה."},{"sec":"23","title":"התחזות","law":"פקודת השותפויות","text":"(א) המתחזה כשותף בשותפות פלונית, על ידי שהוא מתייצג כך בעל פה, בכתב או בהתנהגות, או שהוא מניח ביודעין שיציגוהו כך, יהא חב כשותף כלפי כל אדם שנתן אשראי לשותפות מתוך אמון באותה התחזות, ואין הבדל אם ההתחזות הגיעה לנותן האשראי מאת המתחזה עצמו או בידיעת המתחזה, או שהגיעה אליו שלא ממנו או שלא בידיעתו.\n(ב) על אף האמור בסעיף קטן (א), שותפות המוסיפה להשתמש לעסקיה בשמה הקודם אחרי מותו של שותף או בשמו של השותף המת כחלק משמה – אין בהמשך השימוש בשם זה כדי להחיב את מבצע צוואתו או מנהל עזבונו או את נכסי עזבונו בשל חובות שנתחייבה בהם השותפות לאחר מותו."},{"sec":"58","title":"רישום שותפות מוגבלת","law":"פקודת השותפויות","text":"רישומה של שותפות מוגבלת יהיה במשלוח הודעה בדואר לרשם או במסירתה לו כשהיא חתומה בידי השותפים ומכילה, בנוסף על הפרטים הנדרשים משותפות רגילה, הודעה שהשותפות היא מוגבלת, ופרטים על כל שותף מוגבל ועל הסכום שהכניס ואם שולם במזומנים או בדרך אחרת."},{"sec":"59","title":"רישום שינויים","law":"פקודת השותפויות","text":"(א) חל בתקופת קיומה של שותפות מוגבלת שינוי בסכום שהכניס שותף מוגבל, או בחבותו של שותף מחמת שנהפך משותף כללי לשותף מוגבל או להיפך – תישלח לרשם בדואר או תימסר לו, תוך שבעה ימים לאחר השינוי, הודעה על כך חתומה ביד השותפות המפרשת את מהות השינוי.\n(ב) הופרה הוראת סעיף זה, דינו של כל שותף כללי – קנס 15 לירות לכל יום שבו נמשכה העבירה."},{"sec":"60","title":"שינויים שיש לפרסם ברשומות","law":"פקודת השותפויות","text":"כל סידור או עסקה שעל פיהם יחדל אדם להיות שותף כללי בשותפות ויהיה לשותף מוגבל בה, או שעל פיהם תעבור זכות בשותפות משותף מוגבל לאדם אחר, לא יהיה להם כל תוצָא לענין פקודה זו כל עוד לא פורסמה הודעה על כך ברשומות."},{"sec":"61","title":"כינון שותפות מוגבלת","law":"פקודת השותפויות","text":"(א) שותפות מוגבלת תתכונן על פי הסכם בכתב (להלן – תקנות השותפות).\n(ב) עם כל בקשה לרישום שותפות מוגבלת יש למסור לרשם, או לשלוח אליו בדואר, עותק של תקנות השותפות.\n(ג) הרשם יגיש את תקנות השותפות לשר המשפטים והוא רשאי, לפי שיקול דעתו המוחלט, להתיר את הרישום או לסרב.\n(ד) משנתקבל היתר שר המשפטים לרישום השותפות יודיע הרשם על כך לשותפות, ירשום את התקנות וישמור אותן אצלו.\n(ה) שותפות מוגבלת לא תתחיל בעסקיה לפני שקיבלה מן הרשם הודעה ששר המשפטים התיר את רישומה.\n(ו) הופרה הוראת סעיף קטן (ה), דינו של כל שותף – קנס 750 לירות."},{"sec":"62","title":"שינוי תקנות של שותפות מוגבלת","law":"פקודת השותפויות","text":"(א) שותפות מוגבלת רשאית לשנות את תקנות השותפות, בכפוף להוראות סעיף זה; לשינוי לא יהיה תוקף אלא לאחר היתר שר המשפטים.\n(ב) רצו השותפים לשנות את התקנות, ימסרו לרשם, או ישלחו אליו בדואר, עותק של התקנות כפי ששונו; הרשם יגישו לשר המשפטים והוא רשאי, לפי שיקול דעתו המוחלט, להתיר את רישום התקנות ששונו או לסרב.\n(ג) קיבל הרשם את היתר שר המשפטים לרשום את תקנות השותפות ששונו, יודיע על כך לשותפות, ירשום את התקנות וישמור אותן אצלו."},{"sec":"63","title":"מעמדו של שותף מוגבל","law":"פקודת השותפויות","text":"(א) שותף מוגבל לא ישתתף בניהול עסקי השותפות ואין כוחו יפה לחייב את השותפות, אולם רשאי הוא בכל עת, בעצמו או על ידי שלוחו, לעיין בפנקסי השותפות, לבחון מצבה וסיכוייה ולהתייעץ בענין זה עם השותפים.\n(ב) שותף מוגבל אינו רשאי, במשך קיומה של השותפות, למשוך או לקבל, במישרין או בעקיפין, שום חלק מהשקעתו, ואם עשה כן, יהא חב בחיוביה של השותפות כדי הסכומים שמשך או שקיבל.\n(ג) שותף מוגבל המשתתף בניהול עסקי השותפות, יהא אחראי לכל חיוביה, כאילו היה שותף כללי, כל עוד הוא משתתף בניהולה.\n(ד) בכפוף לתקנות השותפות המוגבלת –\n(1) מותר לקבל אדם כשותף בלי הסכמתם של השותפים המוגבלים;\n(2) אין שותף מוגבל יכול לפרק את השותפות במסירת הודעה על כוונתו זו;\n(3) שותף מוגבל רשאי, בהסכמת השותפים הכלליים, להמחות את חלקו בשותפות, ומשהמחה כך יהיה הנמחה לשותף מוגבל עם כל הזכויות שהיו לממחה;\n(4) הניח שותף מוגבל, שחלקו בשותפות ישועבד בשל חובותיו הפרטיים, אין שאר השותפים רשאים בגלל זאת לפרק את השותפות;\n(5) חילוקי דעות שנתגלעו בענינים רגילים הנוגעים לשותפות יוכרעו ברוב דעות של השותפים הכלליים."},{"sec":"64","title":"סייגים לפירוק שותפות מוגבלת","law":"פקודת השותפויות","text":"(א) שותפות מוגבלת לא תפורק במותו של שותף מוגבל או כשהוכרז פושט רגל; נטרפה דעתו של שותף מוגבל לא ישמש הדבר עילה לפירוק על פי צו בית המשפט אלא אם אין דרך אחרת לברר מה חלקו בשותפות וכיצד לממש אותו.\n(ב) הוחלט על פירוקה של שותפות מוגבלת, יפרקו השותפים הכלליים את עסקיה, זולת אם הורה בית המשפט על דרך אחרת."},{"sec":"65","title":"פרסום פרטים על שותפות מוגבלת","law":"פקודת השותפויות","text":"(א) שותפות מוגבלת שנרשמה לפי הוראות פקודה זו, בין שנתכוננה בישראל ובין מחוץ לה, חייבת להביא, בכל דבר דפוס שמופיע בה שמה, הודעה באותיות נוחות לקריאה, שהיא שותפות מוגבלת ולנקוב בשמו של כל שותף מוגבל ושל כל שותף שאינו מוגבל.\n(ב) לא נתמלאה הוראת סעיף זה, דינם של השותפות ושל כל שותף לחוד – קנס 75 לירות בעד כל עבירה."},{"sec":"65א","title":"הגדרות {{ח:הערה","law":"פקודת השותפויות","text":"פרק ו׳1|תיקון: תשע״ה}}\n(א) בפרק זה –\n(סוג=הגדרה)  ”אסיפה כללית“ – אסיפה שנתית או אסיפה מיוחדת;\n(סוג=הגדרה)  ”אסיפה מיוחדת“ – אסיפה כללית של מחזיקי יחידות השתתפות שאינה אסיפה שנתית;\n(סוג=הגדרה)  ”אסיפה שנתית“ – אסיפה של מחזיקי יחידות השתתפות לפי סעיף 65כח;\n(סוג=הגדרה)  ”דירקטור בעל מומחיות חשבונאית ופיננסית“ ו”דירקטור בעל כשירות מקצועית“ – כמשמעותם לפי סעיף 240(א1)(2) לחוק החברות;\n(סוג=הגדרה)  ”דמי יוזמה“ – כל נכס הניתן על ידי השותפות המוגבלת הציבורית לחברת השותף הכללי, לבעל השליטה בה או לחברה בשליטתו, בהתאם לתקנות השותפות, הנגזר מנכסים, מהכנסות או מרווחי השותפות, בין במזומן ובין בכל דרך אחרת;\n(סוג=הגדרה)  ”הסכם הנאמנות“ – הסכם שנחתם בין השותף המוגבל כנאמן בעבור מחזיקי יחידות השתתפות המקנות זכויות בשותף המוגבל, ובין המפקח, כפי שיתוקן מזמן לזמן;\n(סוג=הגדרה)  ”ועדת ביקורת“ – ועדת ביקורת שמונתה לפי סעיף 65ה(א);\n(סוג=הגדרה)  ”ועדת תגמול“ – ועדת תגמול שמונתה לפי סעיף 65ו(א);\n(סוג=הגדרה)  ”חברת השותף הכללי“ – חברה שהיא השותף הכללי בשותפות מוגבלת ציבורית לפי סעיף 65ב;\n(סוג=הגדרה)  ”חוק החברות“ – חוק החברות, התשנ״ט–1999;\n(סוג=הגדרה)  ”חוק ניירות ערך“ – חוק ניירות ערך, התשכ״ח–1968;\n(סוג=הגדרה)  ”יחידת השתתפות“ – אגד של זכויות המקנה זכות כשותף מוגבל בשותפות מוגבלת ציבורית או אגד של זכויות בשותף מוגבל בשותפות מוגבלת ציבורית, הנקבעות בדין, בהסכם הנאמנות ובתקנות השותפות;\n(סוג=הגדרה)  ”מחזיק יחידת השתתפות“ – כל אחד מאלה:\n(1) מי שרשום במרשם מחזיקי יחידות השתתפות לפי סימן ז׳;\n(2) מי שלזכותו רשומה אצל חבר בורסה יחידת השתתפות ואותה יחידת השתתפות נכללת בין יחידות ההשתתפות הרשומות במרשם מחזיקי יחידות השתתפות לפי סימן ז׳ על שם חברה לרישומים;\n(סוג=הגדרה)  ”מפקח“ – מי שהתמנה לפי סעיפים 65יז ו־65יח לפקח על זכויות המחזיקים ביחידות השתתפות;\n(סוג=הגדרה)  ”נושא משרה“, בשותפות מוגבלת ציבורית – נושא משרה כהגדרתו בחוק החברות, בשינויים המחויבים;\n(סוג=הגדרה)  ”עניין אישי“ – כהגדרתו בחוק החברות, בשינויים המחויבים, ולמעט עניין אישי הנובע מזכות של חברת השותף הכללי, של בעל השליטה בה או של חברה בשליטתו לקבלת דמי יוזמה;\n(סוג=הגדרה)  ”שותפות מוגבלת ציבורית“ – שותפות מוגבלת שיחידות השתתפות שלה או יחידות השתתפות בשותף מוגבל בה רשומות למסחר בבורסה או שהוצעו לציבור על פי תשקיף כמשמעותו בחוק ניירות ערך, או שהוצעו לציבור מחוץ לישראל על פי מסמך הצעה לציבור הנדרש לפי דין מחוץ לישראל, ומוחזקות בידי הציבור;\n(סוג=הגדרה)  ”השר“ – שר המשפטים.\n(ב) לכל מונח אחר בפרק זה תהיה המשמעות הנודעת לו בחוק החברות, אלא אם כן נקבע במפורש אחרת.\n(ג) בהוראות חוק החברות המוחלות בפרק זה בשינויים, תהיה לכל מונח המשמעות הנודעת לו בסעיף קטן (א), אלא אם כן נקבע במפורש אחרת."},{"sec":"65ב","title":"חברת השותף הכללי","law":"פקודת השותפויות","text":"(א) בשותפות מוגבלת ציבורית השותף הכללי יהיה חברה פרטית שאינה חברת איגרות חוב, שהתאגדה בישראל ושעיסוקה הבלעדי הוא ניהול עסקי השותפות המוגבלת.\n(ב) ההוראות לפי חוק החברות החלות על חברה פרטית יחולו על חברת השותף הכללי, כל עוד לא נקבע אחרת בפרק זה."},{"sec":"65ג","title":"הדירקטוריון בחברת השותף הכללי","law":"פקודת השותפויות","text":"הוראות סימן א׳ לפרק השלישי בחלק השלישי לחוק החברות, יחולו על חברת השותף הכללי כאילו היתה חברה ציבורית, בשינויים המחויבים ובשינויים אלה: בכל מקום, במקום ”החברה“ יקראו ”השותפות המוגבלת הציבורית וחברת השותף הכללי“."},{"sec":"65ד","title":"יושב ראש הדירקטוריון וישיבות הדירקטוריון, כינוסן ואופן ניהולן","law":"פקודת השותפויות","text":"הוראות סימנים ב׳, ג׳ ו־ד׳ לפרק השלישי בחלק השלישי לחוק החברות, יחולו על חברת השותף הכללי כאילו היתה חברה ציבורית, בשינויים המחויבים ובשינויים אלה: יושב ראש הדירקטוריון יכנס את הדירקטוריון כאמור בסעיף 98(ג) לחוק החברות, גם בשל הודעת המפקח לפי סעיף 65כא(ד), ואם לא כונסה ישיבת דירקטוריון כאמור בסעיף 98(ד) לחוק האמור, יהיה רשאי גם המפקח לכנסה."},{"sec":"65ה","title":"מינוי ועדת ביקורת ותפקידיה","law":"פקודת השותפויות","text":"(א) בחברת השותף הכללי תכהן ועדת ביקורת, ויחולו לעניין זה ההוראות לפי סימן ט׳ לפרק השלישי בחלק השלישי לחוק החברות, כאילו היתה חברת השותף הכללי חברה ציבורית, בשינויים המחויבים ובשינויים אלה:\n(1) נוסף על האמור בסעיף 115(ה)(2), גם המפקח רשאי להיות נוכח בישיבות ועדת הביקורת כאמור באותו סעיף;\n(2) המפקח רשאי לבקש מיושב ראש ועדת הביקורת לכנס את הוועדה לדיון לפי סעיף 116(ב).\n(ב) ועדת הביקורת תמלא את התפקידים המוטלים עליה לפי סימן ט׳ לפרק השלישי בחלק השלישי לחוק החברות, כלפי השותפות המוגבלת הציבורית וכלפי חברת השותף הכללי, וכן תמלא את התפקידים המוטלים עליה בפרק זה."},{"sec":"65ו","title":"מינוי ועדת תגמול ותפקידיה","law":"פקודת השותפויות","text":"(א) בחברת השותף הכללי תכהן ועדת תגמול, ויחולו לעניין זה ההוראות לפי סימן י׳ לפרק השלישי בחלק השלישי לחוק החברות, כאילו היתה חברת השותף הכללי חברה ציבורית, בשינויים המחויבים.\n(ב) ועדת התגמול תמלא את התפקידים המוטלים עליה לפי סימן י׳ לפרק השלישי בחלק השלישי לחוק החברות, כלפי השותפות המוגבלת הציבורית וכלפי חברת השותף הכללי, וכן תמלא את התפקידים המוטלים עליה בפרק זה."},{"sec":"65ז","title":"המנהל הכללי","law":"פקודת השותפויות","text":"הוראות הפרק הרביעי בחלק השלישי לחוק החברות יחולו על חברת השותף הכללי כאילו היתה חברה ציבורית, בשינויים המחויבים ובשינויים אלה:\n(1) בסעיף 120, במקום ”החברה“ יקראו ”השותפות המוגבלת הציבורית וחברת השותף הכללי“;\n(2) בסעיף 121 –\n(א) בסעיף קטן (א), במקום ”החברה“ יקראו ”השותפות המוגבלת הציבורית או חברת השותף הכללי“;\n(ב) בסעיף קטן (ג) –\n(1) הסמכויות הנתונות לאסיפה הכללית של חברה ציבורית יהיו נתונות לאסיפה הכללית של מחזיקי יחידות ההשתתפות;\n(2) במקום ”בעלי המניות“ יקראו ”מחזיקי יחידות ההשתתפות“;\n(3) במקום ”שאינם בעלי השליטה בחברה“ יקראו ”שאינם חברת השותף הכללי או בעל השליטה בה“;\n(4) במקום ”זכויות ההצבעה בחברה“ יקראו ”זכויות ההצבעה בשותפות המוגבלת הציבורית“;\n(3) בסעיף 122 –\n(א) בסעיף קטן (א), במקום ”מהותי לחברה“ יקראו ”מהותי לשותפות המוגבלת הציבורית או לחברת השותף הכללי“;\n(ב) בסעיף קטן (א), במקום ”החברה“ יקראו ”השותפות המוגבלת הציבורית או חברת השותף הכללי“."},{"sec":"65ח","title":"כהונה וסיום כהונה, הגבלות על מינויים ופקיעת כהונה של נושא משרה","law":"פקודת השותפויות","text":"ההוראות לפי סימנים א׳ עד ד׳ לפרק הראשון והפרק השני בחלק השישי לחוק החברות, יחולו על חברת השותף הכללי כאילו היתה חברה ציבורית, בשינויים המחויבים ובשינויים אלה: בסעיף 233, אחרי ”בעל מניה“ יקראו ”מחזיקי יחידת השתתפות“, ובסעיף 234, במקום ”לחברה“ יקראו ”לחברת השותף הכללי או לשותפות המוגבלת הציבורית, לפי העניין“."},{"sec":"65ט","title":"דירקטור חיצוני","law":"פקודת השותפויות","text":"ההוראות לפי סימן ה׳ לפרק הראשון בחלק השישי לחוק החברות, יחולו על חברת השותף הכללי כאילו היתה חברה ציבורית, בשינויים המחויבים ובשינויים אלה:\n(1) הסמכויות הנתונות לאסיפה הכללית של חברה ציבורית יהיו נתונות לאסיפה הכללית של מחזיקי יחידות ההשתתפות;\n(2) במקום ”בעל מניות“ ו”בעלי מניות“ יקראו ”מחזיק יחידות השתתפות“ ו”מחזיקי יחידות השתתפות“ בהתאמה;\n(3) במקום ”שאינם בעלי השליטה בחברה“ יקראו ”שאינם חברת השותף הכללי או בעל השליטה בה“;\n(4) במקום ”זכויות ההצבעה בחברה“ יקראו ”זכויות ההצבעה בשותפות המוגבלת הציבורית“."},{"sec":"65י","title":"חובת זהירות וחובת אמונים","law":"פקודת השותפויות","text":"חברת השותף הכללי ונושאי משרה בחברת השותף הכללי או בשותפות מוגבלת הציבורית חבים כלפי השותפות המוגבלת הציבורית חובת זהירות וחובת אמונים, ויחולו לעניין זה הוראות סימנים א׳ ו־ב׳ לפרק השלישי בחלק השישי לחוק החברות, בשינויים המחויבים; נושאי המשרה בחברת השותף הכללי יעדיפו את טובת השותפות המוגבלת הציבורית על פני טובת חברת השותף הכללי."},{"sec":"65יא","title":"פטור, שיפוי וביטוח","law":"פקודת השותפויות","text":"הוראות סימן ג׳ לפרק השלישי בחלק השישי לחוק החברות יחולו על השותפות המוגבלת הציבורית בשינויים המחויבים ובשינויים אלה: בכל מקום, במקום ”חברה“ יקראו ”שותפות מוגבלת ציבורית או חברת שותף כללי“, במקום ”נושא משרה“ יקראו ”חברת שותף כללי או נושא משרה בשותפות המוגבלת הציבורית או בחברת השותף הכללי“ ובמקום ”תקנון“ יקראו ”תקנות השותפות“."},{"sec":"65יב","title":"זכויותיו של דירקטור בחברת השותף הכללי","law":"פקודת השותפויות","text":"(א) זכותו של דירקטור בחברת השותף הכללי לקבל מידע לפי סעיף 265 לחוק החברות תחול גם לגבי מסמכי השותפות המוגבלת הציבורית ולגבי נכסיה.\n(ב) זכותו של דירקטור בחברת השותף הכללי לקבל ייעוץ מקצועי לפי סעיף 266 לחוק החברות לצורך ביצוע תפקידו כלפי השותפות המוגבלת הציבורית תהיה על חשבון השותפות המוגבלת הציבורית, אלא אם כן נקבע בתקנות השותפות כי חברת השותף הכללי תישא בהוצאות הייעוץ.\n(ג) זכות תביעה של דירקטור בחברת השותף הכללי לפי סעיף 267 לחוק החברות, תחול גם לגבי פעולה או הפרת חובה כאמור באותו סעיף, של נושא משרה בשותפות המוגבלת הציבורית."},{"sec":"65יג","title":"חובת הגינו של בעל שליטה ושל בעלי כוח הכרעה ומינוי","law":"פקודת השותפויות","text":"(א) על המפורטים להלן מוטלת החובה לפעול בהגינות כלפי השותפות המוגבלת הציבורית:\n(1) בעל השליטה בחברת השותף הכללי;\n(2) בעל מניה בחברת השותף הכללי היודע שאופן הצבעתו יכריע בעניין החלטת אסיפה כללית או אסיפת סוג של החברה הנוגעת לשותפות המוגבלת הציבורית;\n(3) בעל מניה בחברת השותף הכללי שלפי הוראות התקנון יש לו כוח למנות או למנוע מינוי של נושא משרה בחברת השותף הכללי או בשותפות המוגבלת הציבורית או כוח אחר כלפי החברה או השותפות.\n(ב) על הפרת חובת הגינות יחולו הוראות סעיף 193(ב) לחוק החברות, בשינויים המחויבים."},{"sec":"65יד","title":"חובת מינוי מבקר פנימי","law":"פקודת השותפויות","text":"(א) הוראות הפרק הרביעי בחלק הרביעי לחוק החברות יחולו על חברת השותף הכללי כאילו היתה חברה ציבורית, בשינויים המחויבים, ואולם הביקורת בחברת השותף הכללי תיערך בענייני השותפות המוגבלת הציבורית בלבד.\n(ב) המבקר הפנימי של חברת השותף הכללי שמונה בהתאם להוראות לפי סעיף קטן (א) יבקר בין היתר את תקינותן של פעולות השותפות המוגבלת הציבורית מבחינת השמירה על החוק ונוהל עסקים תקין."},{"sec":"65טו","title":"חובת מינוי רואה חשבון מבקר","law":"פקודת השותפויות","text":"הוראות הפרק החמישי בחלק הרביעי לחוק החברות, למעט הוראת סעיף 159, יחולו על השותפות המוגבלת הציבורית כאילו היתה חברה ציבורית, בשינויים המחויבים ובשינויים אלה:\n(1) בכל מקום, תהיה למונחים ”אסיפה כללית“, ”אסיפה שנתית“ ו”אסיפה מיוחדת“ המשמעות הנודעת להם בסעיף 65א;\n(2) בכל מקום, במקום ”בתקנון“ יקראו ”בתקנות השותפות“;\n(3) בסעיפים 160(א) ו־163(ב), במקום ”בחברה“ יקראו ”בשותפות המוגבלת הציבורית ובחברת השותף הכללי“."},{"sec":"65טז","title":"דוחות כספיים","law":"פקודת השותפויות","text":"(א) שותפות מוגבלת ציבורית שהיא תאגיד מדווח תנהל חשבונות, וכמו כן תערוך דוחות כספיים לפי חוק ניירות ערך.\n(ב) הדוחות הכספיים של השותפות המוגבלת הציבורית יאושרו בידי דירקטוריון חברת השותף הכללי, ייחתמו בשמו ויובאו לפני האסיפה השנתית.\n(ג) דירקטוריון חברת השותף הכללי ימנה מבין חבריו ועדה לאישור הדוחות הכספיים של השותפות המוגבלת הציבורית, ויחולו לעניין זה ההוראות לפי סעיף 171(ה) לחוק החברות, בשינויים המחויבים.\n(ד) בשותפות מוגבלת ציבורית רשאי השר, לאחר התייעצות עם רשות ניירות ערך, לקבוע הוראות ותנאים לעניין הליך אישור דוחות נוספים שחייבת השותפות לערוך, ובכלל זה לעניין חובת דירקטוריון חברת השותף הכללי למנות ועדת דירקטוריון לבחינת דוחות אלה, כשירות החברים בוועדה האמורה ומידת זיקתם לשותפות, לחברת השותף הכללי או לבעל השליטה בה."},{"sec":"65יז","title":"חובת מינוי מפקח, חובותיו ותפקידיו","law":"פקודת השותפויות","text":"(א) בשותפות מוגבלת ציבורית יכהן מפקח שימונה לפי סימן זה.\n(ב) המפקח חייב לפעול לטובת המחזיקים ביחידות ההשתתפות שאינם חברת השותף הכללי או בעל השליטה בה, והוא ינהג בזהירות, באמונה ובשקידה.\n(ג) המפקח ינקוט את הפעולות הדרושות לשם הבטחת מילוי חובותיה והתחייבויותיה של חברת השותף הכללי על פי תקנות השותפות ומילוי חובותיו והתחייבויותיו של הנאמן על פי הסכם הנאמנות.\n(ד) השר רשאי לקבוע פעולות שעל המפקח לנקוט בהתאם להוראות סעיפים קטנים (ב) ו־(ג), ורשאי הוא לקבוע פעולות שונות כאמור לגבי סוגים שונים של שותפויות מוגבלות ציבוריות."},{"sec":"65יח","title":"דרך מינוי מפקח ותקופת כהונתו","law":"פקודת השותפויות","text":"(א) מפקח ראשון ימונה בידי חברת השותף הכללי לפני ההצעה לראשונה של יחידות ההשתתפות לציבור, והוא יכהן עד מועד כינוסה של האסיפה השנתית השנייה של מחזיקי יחידות ההשתתפות.\n(ב) האסיפה הכללית תמנה מפקח, ברוב קולות, ובלבד שהתקיימו כל אלה:\n(1) במניין כלל הקולות של מחזיקי יחידות ההשתתפות באסיפה הכללית לא הובאו בחשבון קולות חברת השותף הכללי או בעל השליטה בה או בעלי עניין אישי באישור המינוי, למעט עניין אישי שאינו כתוצאה מקשר עם חברת השותף הכללי או בעל השליטה בה, וכן קולות הנמנעים;\n(2) סך קולות התומכים מקרב מחזיקי יחידות ההשתתפות שאינם חברת השותף הכללי או בעל השליטה בה או בעלי עניין אישי באישור המינוי, למעט עניין אישי שאינו כתוצאה מקשרים עם חברת השותף הכללי או בעל השליטה בה, עולה על שני אחוזי מכלל זכויות ההצבעה של מחזיקי יחידות ההשתתפות; השר רשאי לקבוע שיעורים שונים מן השיעור האמור.\n(ג) האסיפה הכללית תקבע, ברוב כאמור בסעיף קטן (ב), את תנאי כהונתו והעסקתו של מפקח ואת תקופת כהונתו, ובלבד שלא תעלה על שלוש שנים, והיא רשאית לשוב ולמנותו לתקופות כהונה נוספות.\n(ד) על אף האמור בסעיף 65יז(א), האסיפה הכללית רשאית להחליט כי לתקופות שכל אחת מהן לא תעלה על שלוש שנים ממועד קבלת ההחלטה, לא יכהן מפקח בשותפות המוגבלת הציבורית, ובלבד שהתקיימו לעניין זה הוראות פסקאות (1) ו־(2) של סעיף קטן (ב)."},{"sec":"65יט","title":"כשירות לכהונה כמפקח","law":"פקודת השותפויות","text":"(א) כשיר לכהן כמפקח כל אחד מאלה:\n(1) יחיד תושב ישראל הכשיר להתמנות לדירקטור בעל מומחיות חשבונאית ופיננסית;\n(2) יחיד תושב ישראל שהוא רואה חשבון או עורך דין המורשה לעסוק בעיסוק כאמור בישראל;\n(3) שותפות רואי חשבון, חברת רואי חשבון, שותפות עורכי דין או חברת עורכי דין הרשומות בישראל (בסעיף זה – תאגיד).\n(ב) תאגיד המכהן כמפקח ימנה יחיד הכשיר להתמנות כמפקח, שהוא שותף, נושא משרה או עובד בתאגיד, לפי העניין, לכהן מטעמו, ורשאי הוא להחליפו, והכול בכפוף לחובותיו של התאגיד כלפי מחזיקי יחידות ההשתתפות.\n(ג) על יחיד המכהן מטעם תאגיד ועל התאגיד יחולו החובות החלות על מפקח, יחד ולחוד."},{"sec":"65כ","title":"הגבלות על מינוי מפקח","law":"פקודת השותפויות","text":"(א) ההוראות לפי סעיפים 224א עד 227 לחוק החברות, יחולו על מפקח בשינויים המחויבים ובשינויים אלה:\n(1) בכל מקום, למעט בסעיפים 225(א)(3) ו־226א, במקום ”דירקטור“ או ”דירקטור חיצוני“ יקראו ”מפקח“, במקום ”כדירקטור“ יקראו ”כמפקח“ ובמקום ”חברה ציבורית“ יקראו ”שותפות מוגבלת ציבורית“;\n(2) בסעיף 226א, במקום הסיפה החל במילה ”לדירקטור“ יקראו ”למפקח בשותפות מוגבלת ציבורית“.\n(ב) לא ימונה מפקח שהוא קרוב של בעל השליטה בחברת השותף הכללי, וכן מי שיש לו, לקרובו, לשותפו, למעבידו, למי שהוא כפוף לו במישרין או בעקיפין או לתאגיד שהוא בעל השליטה בו, במועד המינוי או בשנתיים שקדמו למועד המינוי, זיקה לשותפות המוגבלת הציבורית, לחברת השותף הכללי, לבעל השליטה בה או לקרוב של בעל השליטה, במועד המינוי או לתאגיד אחר; לעניין סעיף קטן זה, ”זיקה“ ו”תאגיד אחר“ – כהגדרתם בסעיף 240(ב) לחוק החברות.\n(ג) לא ימונה מפקח אם תפקידיו או עיסוקיו האחרים יוצרים או עלולים ליצור ניגוד עניינים עם תפקידו כמפקח, או אם יש בהם כדי לפגוע ביכולתו לכהן כמפקח.\n(ד) לא ימונה דירקטור בחברת שותף כללי של שותפות מוגבלת ציבורית פלונית כמפקח בשותפות מוגבלת ציבורית אחרת (בסעיף זה – השותפות האחרת), אם אותה שעה מכהן דירקטור בחברת השותף הכללי של השותפות האחרת כמפקח בשותפות המוגבלת הציבורית האמורה.\n(ה) לא ימונה יחיד כמפקח בשותפות מוגבלת ציבורית אם הוא עובד של רשות ניירות ערך או עובד של בורסה בישראל.\n(ו) בלי לגרוע מהוראות סעיף קטן (ב), לא יכהן כמפקח מי שיש לו, לקרובו, לשותפו, למעבידו, למי שהוא כפוף לו במישרין או בעקיפין או לתאגיד שהוא בעל השליטה בו, קשרים עסקיים מקצועיים למי שאסורה זיקה אליו לפי הוראות סעיף קטן (ב), גם אם הקשרים כאמור אינם דרך כלל, למעט קשרים זניחים; קוימו קשרים כאמור בעת כהונת המפקח, יראו בכך, לעניין סעיף 65כו(א)(3), (ב) ו־(ג), הפרת תנאי מן התנאים הדרושים למינויו או לכהונתו כמפקח."},{"sec":"65כא","title":"כינוס אסיפה כללית וישיבת דירקטוריון בידי מפקח","law":"פקודת השותפויות","text":"(א) המפקח רשאי לדרוש מדירקטוריון חברת השותף הכללי לזמן אסיפה כללית שעל סדר יומה הנושאים שיבקש.\n(ב) דירקטוריון שנדרש לזמן אסיפה כללית כאמור בסעיף קטן (א), יזמנה בתוך 21 ימים מיום שהוגשה לו הדרישה, ובלבד שמועד הכינוס יהיה לא יאוחר מ־35 ימים ממועד פרסום ההודעה בדבר כינוס האסיפה, אלא אם כן נקבע אחרת לעניין אסיפה שחלות לגביה הוראות סעיף 65לא(ב).\n(ג) לא זימן הדירקטוריון אסיפה כללית לפי דרישת המפקח, במועדים כאמור בסעיף קטן (ב), רשאי המפקח לכנס את האסיפה, וחברת השותף הכללי תישא בהוצאות שהוציא המפקח לצורך כינוס האסיפה.\n(ד) נודע למפקח, אגב ביצוע תפקידו, על ליקויים מהותיים בפעילות השותפות המוגבלת הציבורית או בפעילות חברת השותף הכללי בענייני השותפות המוגבלת הציבורית שיש בהם כדי לקפח את מחזיקי היחידות שאינם חברת השותף הכללי או בעל השליטה בה, ידווח על כך ליושב ראש הדירקטוריון; הודיע המפקח על ליקויים כאמור, יזמן יושב ראש הדירקטוריון, בלא דיחוי, ישיבת דירקטוריון לדיון בנושאים שהובאו לידיעתו."},{"sec":"65כב","title":"זכות המפקח לקבל מידע, להעסיק יועצים ולהשתתף בישיבות","law":"פקודת השותפויות","text":"(א) הוראות סעיפים 265 ו־266 לחוק החברות יחולו על המפקח, בשינויים המחויבים ובשינויים אלה:\n(1) בכל מקום, במקום ”דירקטור“ או ”דירקטור חיצוני“ יקראו ”מפקח“ ובמקום ”דירקטוריון החברה“ או ”הדירקטוריון“ יקראו ”דירקטוריון חברת השותף הכללי“;\n(2) בכל מקום, במקום ”החברה“ יקראו ”חברת השותף הכללי או השותפות המוגבלת הציבורית“, ובסעיף 266(א), במקום ”על חשבון החברה“ יקראו ”על חשבון השותפות המוגבלת הציבורית“.\n(ב) המפקח רשאי להשתתף בכל ישיבת דירקטוריון ובכל אסיפה כללית; דירקטוריון חברת השותף הכללי יודיע למפקח על המקום והמועד שבו תתכנס האסיפה הכללית או ישיבת הדירקטוריון."},{"sec":"65כג","title":"זכות תביעה של מפקח","law":"פקודת השותפויות","text":"(א) היה למפקח יסוד סביר להניח שמתבצעת פעולה או שעומדת להתבצעא פעולה של השותפות המוגבלת הציבורית, של חברת השותף הכללי או של נושא משרה במי מהן, או של הנאמן, העלולה לקפח את מחזיקי יחידות ההשתתפות, יפנה אליהם בדרישה לחדול או להימנע מפעולה כאמור.\n(ב) לא נענתה הפנייה לפי סעיף קטן (א) או שנסיבות העניין אינן מאפשרות פנייה כאמור, רשאי המפקח לפנות לבית המשפט בבקשה שיסיר את הקיפוח או שימנע את הפעולה; בית המשפט רשאי לתת צו שימנע את הפעולה או כל סעד אחר שייראה לו בנסיבות העניין.\n(ג) אלא אם כן קבע בית המשפט אחרת, תישא חברת השותף הכללי בכל ההוצאות שהוציא המפקח לפי הוראות סעיף זה, לרבות אגרות בית משפט ושכר טרחת עורך דין, במועד כפי שיקבע בית המשפט."},{"sec":"65כד","title":"סמירת סמכויות וחובות","law":"פקודת השותפויות","text":"(א) אין באמור בסימן זה כדי לגרוע מסמכויותיו, מחובותיו או מהתחייבויותיו של מפקח לפי תקנות השותפות, לפי הסכם הנאמנות או לפי כל דין.\n(ב) תיקון תקנות השותפות או הסכם הנאמנות שיש בו גריעה מסמכויות המפקח טעון אישור האסיפה הכללית, ברוב כאמור בסעיף 65יח(ב)."},{"sec":"65כה","title":"התפטרות מפקח","law":"פקודת השותפויות","text":"(א) מפקח רשאי להתפטר בהודעה לחברת השותף הכללי (בסימן זה – הודעת התפטרות), שבה יפורטו הטעמים להתפטרותו.\n(ב) מפקח שמסר הודעת התפטרות, יזמן אסיפה מיוחדת שעל סדר יומה מינוי מפקח תחתיו, וימשיך לכהן בתפקידו עד למינוי מפקח אחר תחתיו."},{"sec":"65כו","title":"פקיעת כהונה של מפקח","law":"פקודת השותפויות","text":"(א) בית המשפט רשאי, לבקשת השותפות המוגבלת הציבורית, חברת השותף הכללי, דירקטור בחברת השותף הכללי, מחזיק יחידת השתתפות או נושה, להורות על פקיעת כהונתו של מפקח אם מצא כי התקיים אחד מאלה:\n(1) נבצר מהמפקח למלא את תפקידו דרך קבע;\n(2) במהלך כהונתו הוא הורשע בבית משפט מחוץ לישראל בעבירות כמפורט בסעיף 226(א)(2) לחוק החברות;\n(3) הוא חדל לקיים תנאי מן התנאים הדרושים לפי סימן זה למינויו למפקח;\n(4) הוא הפר חובה מחובותיו לפי סעיף 65יז(ב).\n נוגע לדירקטוריון חברת השותף הכללי כי קיים חשש שמפקח חדל לקיים תנאי מן התנאים הדרושים לפי סימן זה למינויו למפקח, או כי קיים חשש כי המפקח הפר חובה מחובותיו לפי סעיף 65יז(ב), ידון בכך הדירקטוריון בישיבה שתכונס לראשונה לאחר שנודע לו על כך;\n(2) קבע הדירקטוריון כי המפקח חדל לקיים תנאי מן התנאים הדרושים לפי סימן זה למינויו למפקח או כי הוא הפר חובה מחובותיו לפי סעיף 65יז(ב), יזמן הדירקטוריון אסיפה מיוחדת שעל סדר יומה הפסקת כהונתו של המפקח;\n(3) נימוקי הדירקטוריון יובאו לפני האסיפה המיוחדת ותינתן למפקח הזדמנות סבירה להביא את עמדתו; החלטת האסיפה המיוחדת בדבר הפסקת כהונתו של המפקח תתקבל ברוב הדרוש למינויו.\n(ג) מפקח שחדל להתקיים בו תנאי הדרוש לפי סימן זה למינויו למפקח, יודיע על כך מיד לשותפות המוגבלת הציבורית וכהונתו תפקע במועד מתן ההודעה.\n(ד) הורשע מפקח בפסק דין בעבירה כאמור בסעיף 226(א)(1) או (א1) לחוק החברות, כפי שהוחלו בסעיף 65ב, יודיע על כך לשותפות המוגבלת הציבורית ולחברת השותף הכללי; כהונתו של מפקח כאמור תפקע במועד מתן ההודעה, ולא ניתן לשוב ולמנותו לכהונת מפקח, אלא אם כן חלפה התקופה שבה אסור לו לכהן כמפקח לפי סעיף 226 לחוק החברות כפי שהוחל כאמור.\n(ה) החליטה ועדת האכיפה המינהלית להטיל על מפקח אמצעי אכיפה האוסר עליו לכהן כדירקטור בכל חברה ציבורית, יודיע על כך לשותפות המוגבלת הציבורית ולחברת השותף הכללי; כהונתו של מפקח כאמור תפקע במועד מתן ההודעה ולא ניתן לשוב ולמנותו לכהונה כמפקח אלא אם כן חלפה תקופת האיסור כאמור."},{"sec":"65כז","title":"כינוס אסיפה לצורך מינוי מפקח","law":"פקודת השותפויות","text":"(א) הסתיימה או פקעה כהונתו של מפקח, יזמן דירקטוריון חברת השותף הכללי אסיפה מיוחדת שעל סדר יומה מינוי מפקח, במועד מוקדם ככל האפשר.\n(ב) לא כונסה אסיפה מיוחדת לפי סעיף קטן (א) בתוך זמן סביר, רשאי בית המשפט, לבקשת מחזיק יחידת השתתפות, למנות מפקח לתקופה ובתנאים שייראו לו."},{"sec":"65כח","title":"אסיפה שנתית של מחזיקי יחידות ההשתתפות","law":"פקודת השותפויות","text":"(א) שותפות מוגבלת ציבורית תקיים אסיפה שנתית של מחזיקי יחידות ההשתתפות בכל שנה ולא יאוחר מתום 15 חודשים לאחר האסיפה השנתית האחרונה.\n(ב) סדר היום באסיפה השנתית יכלול דיון בדוחות הכספיים, ובדיווח דירקטוריון חברת השותף הכללי; סדר היום יכול שיכלול מינוי רואה חשבון מבקר, וכן נושא שבתקנות השותפות נקבע שיידון באסיפה השנתית או נושא אחר שנקבע על סדר היום כאמור בסעיף 65ל."},{"sec":"65כט","title":"אסיפה מיוחדת של מחזיקי יחידות ההשתתפות","law":"פקודת השותפויות","text":"(א) דירקטוריון חברת השותף הכללי יכנס אסיפה מיוחדת על פי החלטתו, וכן לדרישת כל אחד מאלה:\n(1) שני דירקטורים או רבע מן הדירקטוריון המכהנים;\n(2) מחזיק יחידת השתתפות, אחד או יותר, שלו חמישה אחוזים לפחות מכלל יחידות ההשתתפות בשותפות המוגבלת הציבורית.\n(ב) דירקטוריון שנדרש לזמן אסיפה מיוחדת כאמור בסעיף קטן (א), יזמנה בתוך 21 ימים מיום שהוגשה לו הדרישה, למועד כאמור בסעיף 63(ג) לחוק החברות החל לגבי אסיפה מיוחדת בחברה ציבורית.\n(ג) לא זימן הדירקטוריון אסיפה מיוחדת לפי הוראות סעיף זה, יחולו הוראות סעיפים 64 ו־65 לחוק החברות, בשינויים המחויבים."},{"sec":"65ל","title":"סדר היום באסיפה כללית","law":"פקודת השותפויות","text":"(א) סדר היום באסיפה כללית ייקבע בידי דירקטוריון חברת השותף הכללי, וייכללו בו גם נושאים שבשלהם נדרש כינוסה של אסיפה מיוחדת לפי סעיף 65כט, וכן נושא שהתבקש כאמור בסעיף קטן (ב).\n(ב) מחזיק יחידת השתתפות, אחד או יותר, שלו אחוז אחד לפחות מכלל יחידות ההשתתפות בשותפות מוגבלת ציבורית, וכן המפקח, רשאים לבקש מהדירקטוריון לכלול נושא בסדר היום של אסיפה כללית שתתכנס בעתיד, ובלבד שהנושא מתאים להיות נדון באסיפה כאמור; השר רשאי לקבוע הוראות לעניין סעיף קטן זה, לרבות לעניין המועד להגשת הבקשה.\n(ג) באסיפה כללית יתקבלו החלטות בנושאים שפורטו בסדר היום בלבד."},{"sec":"65לא","title":"הצבעה באסיפת מחזיקי יחידות השתתפות","law":"פקודת השותפויות","text":"(א) מחזיק יחידת השתתפות רשאי להצביע בעצמו או באמצעות שלוח וכן בכתב הצבעה לפי הוראות סעיף קטן (ב).\n(ב) מחזיק יחידת השתתפות רשאי להצביע באסיפה כללית באמצעות כתב הצבעה שבו יציין את אופן הצבעתו, בהחלטות בנושאים אלה:\n(1) מינויים ופיטורים של דירקטורים חיצוניים בחברת השותף הכללי;\n(2) הסמכת יושב ראש הדירקטוריון של חברת השותף הכללי או קרובו למלא את תפקיד המנהל הכללי של חברת השותף הכללי או להפעיל את סמכויותיו, והסמכת המנהל הכללי של חברת השותף הכללי או קרובו למלא את תפקיד יושב ראש הדירקטוריון של חברת השותף הכללי או להפעיל את סמכויותיו לפי סעיף 65ז;\n(3) אישור פעולות או עסקאות הטעונות אישור האסיפה הכללית של מחזיקי יחידות ההשתתפות וכן אישור מדיניות התגמול, לפי סעיפים 65מה ו־65מז עד 65נא;\n(4) אישור מיזוג לפי סעיף 320 לחוק החברות כפי שהוחל בסעיף 65נח;\n(5) נושאים נוספים שפורטו בתקנות השותפות או שהשר קבע לפי סעיף 65לב.\n(ג) נוסף על הוראות סעיף קטן (ב), מחזיק יחידת השתתפות כאמור בפסקה (2) להגדרה ”מחזיק יחידת השתתפות“, רשאי להצביע באסיפה כללית באמצעות כתב הצבעה שיועבר לשותפות המוגבלת הציבורית במערכת ההצבעה האלקטרונית לפי סימן ב׳ לפרק ז׳2 בחוק ניירות ערך, גם בהחלטות בכל נושא אחר שעל סדר יומה של אסיפה כאמור.\n(ד) הצביע מחזיק יחידת השתתפות ביותר מדרך אחת, תימנה הצבעתו המאוחרת; לעניין זה, הצבעה של מחזיק יחידת השתתפות בעצמו או באמצעות שלוח תיחשב מאוחרת להצבעה באמצעות כתב הצבעה."},{"sec":"65לב","title":"תחולת הוראות {{ח:חיצוני","law":"פקודת השותפויות","text":"לעניין אסיפה כללית|תיקון: תשע״ה}}\n ההוראות לפי סעיפים 62, 69 עד 74, 78 עד 81, 84 עד 86, 87(ב) עד (ד), 88 עד 91 ו־182(ב) ו־(ג) לחוק החברות, יחולו לעניין אסיפה כללית לפי פרק זה, בשינויים המחויבים ובשינויים אלה:\n(1) בסעיף 62(א), במקום ”דירקטור בחברה“ יקראו ”דירקטור בחברת השותף הכללי“;\n(2) בסעיף 72, במקום ”תקנון“ יקראו ”תקנות השותפות“, ובמקום ”דירקטור“ יקראו ”דירקטור בחברת השותף הכללי“;\n(3) בסעיפים 81, 85 ו־91(א), בכל מקום, במקום ”בתקנון“ יקראו ”בתקנות השותפות“."},{"sec":"65לג","title":"מרשם מחזיקי יחידות השתתפות","law":"פקודת השותפויות","text":"שותפות מוגבלת ציבורית תנהל מרשם מחזיקי יחידות השתתפות."},{"sec":"65לד","title":"עיון במרשם מחזיקי יחידות השתתפות","law":"פקודת השותפויות","text":"מרשם מחזיקי יחידות השתתפות יהיה פתוח לעיון הציבור."},{"sec":"65לה","title":"תוכן מרשם מחזיקי יחידות השתתפות","law":"פקודת השותפויות","text":"(א) במרשם מחזיקי יחידות השתתפות יירשמו –\n(1) שמו, מספר זהותו ומענו של כל מחזיק יחידת השתתפות, הכול כפי שנמסר לשותפות המוגבלת הציבורית;\n(2) כמות יחידות ההשתתפות שבבעלות כל מחזיק, בציון ערכן הנקוב, אם קיים, ואם טרם שולם על חשבון התמורה שנקבעה ליחידת השתתפות סכום כלשהו – הסכום שטרם שולם;\n(3) תאריך הקצאתן של יחידות ההשתתפות או מועד העברתן למחזיק, לפי העניין;\n(4) לצד שמו של המחזיק, מספרי יחידות ההשתתפות הרשומות על שמו – אם סומנו יחידות ההשתתפות במספרים סידוריים.\n(ב) הוראות סעיפים 130(ב) ו־131 עד 134 לחוק החברות יחולו על מרשם מחזיקי יחידות השתתפות, בשינויים המחויבים."},{"sec":"65לו","title":"זכויותיו וחובותיו של מחזיק יחידת השתתפות","law":"פקודת השותפויות","text":"זכויותיו וחובותיו של מחזיק יחידת השתתפות הן כקבוע בפקודה זו, בתקנות השותפות ולפי כל דין."},{"sec":"65לז","title":"הזכות למידע על השותפות","law":"פקודת השותפויות","text":"למחזיקי יחידות השתתפות זכות עיון במסמכי השותפות המוגבלת הציבורית המפורטים להלן:\n(1) פרוטוקולים של האסיפות הכלליות של מחזיקי יחידות ההשתתפות, כאמור בסעיף 65לב;\n(2) מרשם מחזיקי יחידות ההשתתפות, כאמור בסעיף 65לג;\n(3) מסמך שברשות השותפות, כאמור בסעיף 65לח;\n(4) תקנות השותפות, הסכם הנאמנות ודוחות כספיים הערוכים לפי חוק ניירות ערך או לפי דין אחר החל על השותפות המוגבלת הציבורית;\n(5) כל מסמך שעל השותפות המוגבלת הציבורית להגיש לפי פקודה זו ולפי כל דין לרשם השותפויות או לרשות ניירות ערך, העומד לעיון הציבור ברשם השותפויות או ברשות ניירות ערך, לפי העניין."},{"sec":"65לח","title":"עיון במסמכי השותפות","law":"פקודת השותפויות","text":"מחזיק יחידת השתתפות זכאי לדרוש מחברת השותף הכללי, תוך ציון מטרת הדרישה, לעיין בכל מסמך הנמצא ברשות חברת השותף הכללי או ברשות השותפות המוגבלת הציבורית הנוגע לפעולה או לעסקה הטעונה אישור לפי הוראות סעיפים 65י ו־65מז עד 65נב, ואולם הוראות סעיף 185(ב) לחוק החברות יחולו, בשינויים המחויבים, לגבי הרשות לסרב לבקשה כאמור."},{"sec":"65לט","title":"הזכות לקבל דוחות כספיים","law":"פקודת השותפויות","text":"מחזיק יחידת השתתפות זכאי לקבל מחברת השותף הכללי, לפי בקשתו, העתק מן הדוחות הכספיים, אם הדוחות לא פורסמו בהתאם להוראות לפי פרק ז׳1 לחוק ניירות ערך."},{"sec":"65מ","title":"הזכות במקרה של קיפוח","law":"פקודת השותפויות","text":"הוראות סעיף 191 לחוק החברות יחולו, בשינויים המחויבים, לעניין התנהלות עניין מענייניה של שותפות מוגבלת ציבורית בדרך שיש בה משום קיפוח או חשש מהותי לקיפוח של מחזיקי יחידות ההשתתפות בה, כולם או חלקם."},{"sec":"65מא","title":"הזכות להגיש תביעה נגזרת והגנה נגזרת","law":"פקודת השותפויות","text":"כל מחזיק יחידת השתתפות וכל דירקטור בחברת השותף הכללי רשאים להגיש תביעה בשם השותפות המוגבלת הציבורית בשל עילת תביעה שלה או להתגונן מפני תובענה בשם השותפות המוגבלת הציבורית, ונושה של שותפות מוגבלת ציבורית רשאי להגיש תביעה נגזרת בשם השותפות בשל חלוקה אסורה שבוצעה בשותפות, ויחולו לעניין זה הוראות הפרק השלישי בחלק החמישי לחוק החברות, בשינויים המחויבים, ובשינוי זה: בסעיף 205, במקום ”שמונה לה מפרק לפי פרק י״ב לפקודת החברות“ יקראו ”שמונה לה נאמן לפי סעיף 45 לפקודת פשיטת הרגל [נוסח חדש], התש״ם–1980“."},{"sec":"65מב","title":"חובתו של בעל כוח הכרעה לפעול בהגינות","law":"פקודת השותפויות","text":"(א) על מחזיק יחידת השתתפות היודע שאופן הצבעתו יכריע בעניין החלטת אסיפה כללית, ועל מחזיק יחידת השתתפות שלפי הוראות תקנות השותפות יש לו כוח למנות או למנוע מינוי של נושא משרה בחברת השותף הכללי או בשותפות המוגבלת הציבורית או כוח אחר כלפי השותפות המוגבלת הציבורית, מוטלת החובה לנהוג בהגינות כלפי השותפות המוגבלת הציבורית.\n(ב) על הפרת חובת הגינות יחולו הוראות סעיף 193(ב) לחוק החברות, בשינויים המחויבים."},{"sec":"65מג","title":"חובות מחזיק יחידת השתתפות","law":"פקודת השותפויות","text":"(א) מחזיק יחידת השתתפות ינהג בהפעלת זכויותיו ובמילוי חובותיו כלפי מחזיקי יחידות ההשתתפות האחרים, כלפי חברת השותף הכללי וכלפי השותפות המוגבלת הציבורית בתום לב ובדרך מקובלת, ויימנע מניצול לרעה של כוחו בשותפות המוגבלת הציבורית, ובכלל זה בהצבעתו באסיפה כללית.\n(ב) מחזיק יחידת השתתפות יימנע מלקפח מחזיקי יחידות השתתפות אחרים.\n(ג) על הפרת הוראות סעיפים קטנים (א) ו־(ב) יחולו הוראות סעיף 192(ג) לחוק החברות, בשינויים המחויבים."},{"sec":"65מד","title":"מדיניות תגמול ועסקאות הטעונות אישור מיוחד","law":"פקודת השותפויות","text":"(א) מדיניות התגמול של חברת השותף הכללי ושל השותפות המוגבלת הציבורית וכן העסקאות המנויות בסימן זה, טעונות אישורים כמפורט בסימן זה, ובלבד שהן לטובת השותפות המוגבלת הציבורית.\n(ב) השר, לאחר התייעצות עם רשות ניירות ערך, רשאי לקבוע כי הוראות סימן זה לעניין מדיניות התגמול לא יחולו על סוגים של שותפויות מוגבלות ציבוריות, כפי שיקבע."},{"sec":"65מה","title":"קביעת מדיניות התגמול לנושאי משרה","law":"פקודת השותפויות","text":"(א) דירקטוריון חברת השותף הכללי יקבע מדיניות לעניין תנאי כהונה והעסקה של נושאי משרה בשותפות המוגבלת הציבורית ובחברת השותף הכללי (בפקודה זו – מדיניות התגמול), לאחר ששקל את המלצות ועדת התגמול שהוגשו לו לפי סעיף 65ו; מדיניות התגמול טעונה אישור של האסיפה הכללית.\n(ב) באישור האסיפה הכללית לפי סעיף קטן (א), יתקיים אחד מאלה:\n(1) במניין קולות הרוב באסיפה הכללית, ייכללו רוב מכלל קולות מחזיקי יחידות ההשתתפות המשתתפים בהצבעה שאינם חברת השותף הכללי או בעל השליטה בה או בעלי עניין אישי באישור המדיניות; במניין כלל הקולות של מחזיקי יחידות ההשתתפות האמורים לא יובאו בחשבון קולות הנמנעים;\n(2) סך קולות המתנגדים בהצבעה מקרב מחזיקי יחידות ההשתתפות האמורים בפסקה (1), לא יעלה על שיעור של שני אחוזים מכלל זכויות ההצבעה של מחזיקי יחידות ההשתתפות; השר רשאי לקבוע שיעורים שונים מן השיעור האמור בפסקה זו.\n(ג) על אף האמור בסעיפים קטנים (א) ו־(ב), דירקטוריון חברת השותף הכללי רשאי לקבוע את מדיניות התגמול גם אם האסיפה הכללית התנגדה לאישורה, ובלבד שוועדת התגמול ולאחריה הדירקטוריון החליטו, על יסוד נימוקים מפורטים ולאחר שדנו מחדש במדיניות התגמול, כי אישור מדיניות התגמול על אף התנגדות האסיפה הכללית הוא לטובת השותפות המוגבלת הציבורית.\n(ד) מדיניות תגמול שנקבעה לתקופה העולה על שלוש שנים, טעונה אישור אחת לשלוש שנים; אישור לפי סעיף קטן זה יינתן בדרך שבה נקבעת מדיניות התגמול לפי סעיפים קטנים (א) עד (ג).\n(ה) בלי לגרוע מהוראות סעיף קטן (ד), הדירקטוריון יבחן, מזמן לזמן, את מדיניות התגמול וכן את הצורך בהתאמתה להוראות סעיף 65מו אם חל שינוי מהותי בנסיבות שהיו קיימות בעת קביעתה או מטעמים אחרים."},{"sec":"65מו","title":"שיקולים בקביעת מדיניות התגמול","law":"פקודת השותפויות","text":"(א) מדיניות התגמול תיקבע, בין השאר, לפי השיקולים המפורטים בסעיף 267ב(א) לחוק החברות, בשינויים המחויבים.\n(ב) מדיניות התגמול תכלול, בין השאר, התייחסות לעניינים המפורטים בחלק א׳ לתוספת ראשונה א׳ לחוק החברות וייקבעו בה, בין השאר, הוראות כמפורט בחלק ב׳ לתוספת האמורה, בשינויים המחויבים."},{"sec":"65מז","title":"עסקה עם נושא משרה","law":"פקודת השותפויות","text":"עסקה של השותפות המוגבלת הציבורית עם נושא משרה בשותפות המוגבלת הציבורית או בחברת השותף הכללי, או עסקה של השותפות המוגבלת הציבורית עם אדם אחר שלנושא משרה כאמור יש בה עניין אישי, למעט עניין אישי כמפורט בפסקאות משנה (א) ו־(ב) שבסעיף 270(1) לחוק החברות בשינויים המחויבים, טעונה אישורים אלה:\n(1) לגבי עסקה שאינה חריגה – אישור הדירקטוריון של חברת השותף הכללי, אלא אם כן נקבעה דרך אישור אחרת בתקנות השותפות;\n(2) לגבי עסקה חריגה – אישור ועדת הביקורת ולאחר מכן אישור הדירקטוריון של חברת השותף הכללי."},{"sec":"65מח","title":"הסכם תגמול עם נושא משרה שאינו דירקטור","law":"פקודת השותפויות","text":"(א) התקשרות של שותפות מוגבלת ציבורית או של חברת השותף הכללי עם נושא משרה בשותפות המוגבלת הציבורית או בחברת השותף הכללי שאינו דירקטור, באשר לתנאי כהונתו והעסקתו, למעט התקשרות עם המנהל הכללי של השותפות המוגבלת הציבורית או של חברת השותף הכללי, טעונה אישור של ועדת התגמול ולאחר מכן אישור של הדירקטוריון של חברת השותף הכללי.\n(ב) אישור ועדת התגמול ואישור הדירקטוריון כאמור בסעיף קטן (א), יהיו בהתאם למדיניות התגמול שנקבעה לפי הוראות סעיפים 65מה ו־65מו.\n(ג) על אף האמור בסעיף קטן (ב), ועדת התגמול ולאחריה הדירקטוריון של חברת השותף הכללי רשאים, במקרים מיוחדים, לאשר עסקה כאמור בסעיף קטן (א), שלא בהתאם למדיניות התגמול, בהתקיים שניים אלה:\n(1) ועדת התגמול ולאחריה הדירקטוריון של חברת השותף הכללי אישרו את העסקה, בין השאר, לפי השיקולים כאמור בסעיף 65מו(א) ובהתאם לדרישות סעיף 65מו(ב);\n(2) האסיפה הכללית אישרה את העסקה, ובלבד שמתקיים האמור בסעיף 65מה(ב)(1) או (2).\n(ד) על אף האמור בסעיף קטן (ג), ועדת התגמול ולאחריה הדירקטוריון של חברת השותף הכללי רשאים, במקרים מיוחדים, לאשר עסקה כאמור באותו סעיף קטן גם אם האסיפה הכללית התנגדה לאישור העסקה, ובלבד שוועדת התגמול ולאחריה הדירקטוריון החליטו על כך על יסוד נימוקים מפורטים, לאחר שדנו מחדש בעסקה ובחנו בדיון כאמור, בין השאר, את התנגדות האסיפה הכללית."},{"sec":"65מט","title":"הסכם תגמול של מנהל כללי","law":"פקודת השותפויות","text":"(א) עסקה של שותפות מוגבלת ציבורית או של חברת השותף הכללי עם המנהל הכללי של השותפות המוגבלת הציבורית או של חברת השותף הכללי, באשר לתנאי כהונתו והעסקתו, טעונה אישור של אלה, בסדר הזה:\n(1) ועדת התגמול;\n(2) דירקטוריון חברת השותף הכללי;\n(3) האסיפה הכללית, ובלבד שמתקיים האמור בסעיף 65מה(ב)(1) או (2); לעניין אישור האסיפה הכללית לפי פסקה זו יחולו הוראות סעיף 65מח(ד).\n(ב) אישור ועדת התגמול ואישור הדירקטוריון כאמור בסעיף קטן (א)(1) ו־(2) יהיו בהתאם למדיניות התגמול, ואולם ועדת התגמול ולאחריה הדירקטוריון רשאים, במקרים מיוחדים, לאשר את העסקה שלא בהתאם למדיניות התגמול, ובלבד שמתקיים האמור בסעיף 65מח(ג)(1); אין באמור בסעיף קטן זה כדי לגרוע מהוראות סעיף קטן (א)(3).\n(ג) על אף האמור בסעיף קטן (א)(3), ועדת התגמול רשאית לפטור מאישור האסיפה הכללית כאמור באותו סעיף קטן, עסקה עם מי שמועמד לכהן כמנהל הכללי של השותפות המוגבלת הציבורית או של חברת השותף הכללי שמתקיים לגביו האמור בסעיף 240(ב) לחוק החברות, בשינויים המחויבים, אם מצאה, על יסוד נימוקים שפירטה, כי הבאת העסקה לאישור האסיפה הכללית תסכל את ההתקשרות, ובלבד שהעסקה תואמת את מדיניות התגמול."},{"sec":"65נ","title":"עסקה עם דירקטור באשר לתנאי כהונתו והעסקתו","law":"פקודת השותפויות","text":"(א) התקשרות של שותפות מוגבלת ציבורית או של חברת השותף הכללי עם דירקטור בחברת השותף הכללי באשר לתנאי כהונתו והעסקתו, לעניין כהונתו כדירקטור, וכן לעניין העסקתו בתפקידים אחרים – אם הוא מועסק כאמור, טעונה אישור של ועדת התגמול, ולאחריה אישור של הדירקטוריון.\n(ב) אישור של ועדת התגמול ואישור הדירקטוריון כאמור בסעיף קטן (א) יהיו בהתאם למדיניות התגמול, ואולם ועדת התגמול ולאחריה הדירקטוריון, רשאים, במקרים מיוחדים, לאשר את העסקה שלא בהתאם למדיניות כאמור, ובלבד שמתקיים האמור בסעיף 65מח(ג)(1), והאסיפה הכללית אישרה את העסקה בהחלטה שמתקיים בה האמור בסעיף 65מה(ב)(1) או (2)."},{"sec":"65נא","title":"עסקאות חריגות, הסכמי תגמול עם בעל שליטה והצעה פרטית","law":"פקודת השותפויות","text":"(א) בסעיף זה, ”בעל השליטה“, בשותפות מוגבלת ציבורית – חברת השותף הכללי ובעל השליטה בה, לרבות מי שמחזיק בעשרים וחמישה אחוזים או יותר מזכויות ההצבעה בחברת השותף הכללי אם אין אדם אחר המחזיק מעל חמישים אחוזים מזכויות ההצבעה בה; לעניין החזקה, יראו שניים או יותר המחזיקים בזכויות הצבעה בחברת השותף הכללי ואשר לכל אחד מהם עניין אישי באישור אותה עסקה המובאת לאישור לפי סעיף זה, כמחזיקים יחד.\n(ב) העסקאות המנויות להלן טעונות אישור כאמור בסעיף קטן (ג):\n(1) הצעה פרטית;\n(2) עסקה שהיא אחת מאלה:\n(א) עסקה חריגה של השותפות המוגבלת הציבורית עם בעל השליטה בה;\n(ב) עסקה חריגה של השותפות המוגבלת הציבורית עם אדם אחר שלבעל השליטה יש בה עניין אישי;\n(3) התקשרות של השותפות המוגבלת הציבורית עם בעל השליטה או עם קרובו, במישרין או בעקיפין, לרבות באמצעות חברה שבשליטתו –\n(א) לעניין קבלת שירותים בידי השותפות המוגבלת הציבורית;\n(ב) אם הוא גם נושא משרה בשותפות המוגבלת הציבורית או בחברת השותף הכללי – באשר לתנאי כהונתו והעסקתו;\n(ג) אם הוא עובד השותפות המוגבלת הציבורית ואינו נושא משרה בה או בחברת השותף הכללי – באשר להעסקתו בשותפות.\n(ג) עסקה כאמור בסעיף קטן (ב) טעונה אישור של אלה, בסדר הזה:\n(1) ועדת הביקורת, ובעסקה באשר לתנאי כהונה והעסקה – ועדת התגמול;\n(2) הדירקטוריון של חברת השותף הכללי;\n(3) האסיפה הכללית, ובלבד שיתקיים אחד מאלה:\n(א) במניין קולות הרוב באסיפה הכללית, ייכללו רוב מכלל קולות מחזיקי יחידות ההשתתפות שאינם בעלי עניין אישי באישור העסקה, המשתתפים בצבעה; במניין כלל הקולות של מחזיקי יחידות ההשתתפות האמורים לא יובאו בחשבון קולות הנמנעים;\n(ב) סך קולות המתנגדים בהצבעה מקרב מחזיקי יחידות ההשתתפות האמורים בפסקה משנה (א), לא יעלה על שיעור של שני אחוזים מכלל זכויות ההצבעה של מחזיקי יחידות ההשתתפות; השר רשאי לקבוע שיעורים שונים מן השיעור האמור בפסקה זו.\n(ד) אישור ועדת התגמול ואישור הדירקטוריון של חברת השותף הכללי כאמור בסעיף קטן (ג)(1) ו־(2), בעסקה שעניינה תנאי כהונה והעסקה, יהיו בהתאם למדיניות התגמול, אולם ועדת התגמול ולאחריה הדירקטוריון רשאים, במקרים מיוחדים, לאשר את העסקה שלא בהתאם למדיניות כאמור, ובלבד שמתקיים האמור בסעיף 65מח(ג)(1); אין באמור בסעיף קטן זה כדי לגרוע מהוראות סעיף קטן (ג)(3).\n עסקה כאמור בסעיף קטן (ב), לתקופה העולה על שלוש שנים, למעט עסקה לתשלום דמי יוזמה, טעונה אישור כאמור בסעיף קטן (ג), אחת לשלוש שנים;\n(2) על אף האמור בפסקה (1), עסקה כאמור בסעיף קטן (ב)(2), יכול שתאושר לתקופה העולה על שלוש שנים, ובלבד שוועדת הביקורת אישרה כי התקשרות לתקופה כאמור סבירה בנסיבות העניין;\n(3) הוראות פסקאות (1) ו־(2) יחולו על עסקה של שותפות מוגבלת שהפכה לשותפות מוגבלת ציבורית, ביחס לתקופה שלאחר הפיכתה לשותפות מוגבלת ציבורית.\n אישור של ועדת הביקורת, של ועדת התגמול ושל הדירקטוריון לפי הוראות סעיפים קטנים (ב) ו־(ד), יינתן לאחר שהם בחנו, בין השאר, אם העסקה כוללת חלוקה;\n(2) קבעו ועדת הביקורת, ועדת התגמול או הדירקטוריון כי העסקה כוללת חלוקה, תאושר העסקה רק לאחר שאישרו כי קוימו לעניין זה הוראות כל דין לעניין חלוקה.\n בסעיף קטן זה, ”עסקת החזר הוצאות“ – עסקה בין השותפות המוגבלת הציבורית ובין חברת השותף הכללי, שעניינה תשלום לחברת השותף הכללי בשל הוצאות שהוציאה בפועל לשם ניהול השותפות, למעט הוצאות כאמור ששולמו, במישרין או בעקיפין, לבעל השליטה בחברת השותף הכללי, והוצאות שלבעל השליטה עניין אישי בתשלומן, ובלבד שהוצאות כאמור ששולמו לשם התקשרות עם דירקטור באשר לתנאי כהונתו והעסקתו יהיו בהתאם לכללים שיקבע השר, בהתייעצות עם רשות ניירות ערך; לעניין זה, ”עניין אישי“ – למעט עניין אישי הנובע מעצם החזקתו של בעל השליטה בחברת השותף הכללי, ולעניין התקשרות עם נושא משרה או עם עובד – למעט עניין אישי הנובע מעצם הכהונה או ההעסקה בחברת השותף הכללי;\n(2) עסקת החזר הוצאות אינה טעונה אישור לפי סעיף זה אם התקיים אחד מאלה:\n(א) השותפות המוגבלת הציבורית לא התקשרה עם חברת השותף הכללי בהתקשרות כאמור בסעיף קטן (ב)(3) מהמועד שהפכה לשותפות מוגבלת ציבורית;\n(ב) בשותפות מוגבלת ציבורית שהתקשרה עם חברת השותף הכללי בהתקשרות כאמור בסעיף קטן (ב)(3) – האסיפה הכללית החליטה שלא לאשר מחדש את ההתקשרות כאמור בסעיף קטן (ה)(1)."},{"sec":"65נב","title":"חובת גילוי","law":"פקודת השותפויות","text":"(א) חברת השותף הכללי או בעל השליטה בה או נושא משרה בחברת השותף הכללי או בשותפות המוגבלת הציבורית היודע שיש לו עניין אישי בעסקה קיימת או מוצעת של השותפות, יגלה לשותפות, בלא דיחוי, ולא יאוחר מישיבת דירקטוריון חברת השותף הכללי שבה נדונה העסקה לראשונה, את מהות עניינו האישי, לרבות כל עובדה או מסמך מהותיים.\n(ב) סעיף 269(א) לחוק החברות יחול על עסקאות של חברת השותף הכללי שחלות עליהן הוראות סימן זה, כאילו היתה חברה ציבורית.\n(ג) הוראות סעיפים קטנים (א) ו־(ב) לא יחולו כאשר העניין האישי נובע רק מקיום עניין אישי של קרוב בעסקה באינה חריגה."},{"sec":"65נג","title":"שינוי עסקה קיימת והחלת הוראות {{ח:חיצוני","law":"פקודת השותפויות","text":"לעניין עסקאות|תיקון: תשע״ה}}\n(א) עסקה שמתקיים בה האמור בסעיף 65מח(א) או 65מט(א), והיא שינוי של עסקה קיימת, טעונה אישור של ועדת ביקורת או ועדת תגמול, לפי העניין, בלבד, אם הוועדה האמורה אישרה כי השינוי בתנאי העסקה אינו מהותי ביחס לעסקה הקיימת.\n(ב) ההוראות לפי סעיפים 277 עד 284 לחוק החברות יחולו לעניין סימן זה, בשינויים המחויבים ובשינויים אלה:\n(1) יראו את חברת השותף הכללי או השותפות המוגבלת הציבורית, לפי העניין, כאילו היתה חברה ציבורית;\n(2) לעניין הסעיפים האמורים יראו כבעל שליטה בשותפות המוגבלת הציבורית את חברת השותף הכללי ואת בעל השליטה בה."},{"sec":"65נד","title":"שמירת הון וחלוקה","law":"פקודת השותפויות","text":"(א) ההוראות לפי סימנים א׳ עד ד׳ לפרק השני בחלק השביעי לחוק החברות יחולו על השותפות המוגבלת הציבורית, בשינויים המחויבים ובשינויים אלה: בכל מקום, במקום ”חברה“ יקראו ”השותפות המוגבלת הציבורית“, במקום ”מניות“ יקראו ”יחידות השתתפות“, ובמקום ”תקנון“ יקראו ”תקנות השותפות“.\n(ב) אין בהוראות החלות לפי סעיף קטן (א), לעניין סמכות הדירקטוריון לחלק רווחים, כדי לפגוע בחובת השותפות המוגבלת הציבורית לחלק את רווחיה בהתאם לקבוע בתקנות השותפות, ובלבד שניתנה לדירקטוריון חברת השותף הכללי הזדמנות נאותה לקבוע, בטרם תבוצע החלוקה, כי החלוקה אינה חלוקה אסורה כמשמעותה בסעיף 201 לחוק החברות.\n(ג) השר רשאי לקבוע הוראות לעניין חובת השותפות המוגבלת הציבורית לחלק את רווחיה ותנאים שבהתקיימם או עניינים שבשלהם תהיה רשאית השותפות המוגבלת הציבורית להימנע מחלוקת רווחיה, ובלבד שלא יקבע הוראות כאמור אם בתקנות השותפות נקבעה חובה שאינה מסויגת לחלוקת רווחים."},{"sec":"65נה","title":"מעמדו של מחזיק יחידת השתתפות","law":"פקודת השותפויות","text":"לא יראו בהפעלת זכויות על ידי מחזיקי יחידות השתתפות לפי פרק זה כהשתתפות בניהול עסקי השותפות, והוראות סעיף 63(ג) לא יחולו במקרה של הפעלת זכויות כאמור."},{"sec":"65נו","title":"מכירה כפויה של יחידות השתתפות","law":"פקודת השותפויות","text":"הוראות סימן א׳ לפרק השלישי בחלק השמיני לחוק החברות יחולו על שותפות מוגבלת ציבורית ועל מחזיקי יחידות השתתפות כאילו היו חברה ובעלי מניות, בשינויים המחויבים ובשינוי זה: במקום ”אדם“ יקראו ”חברת השותף הכללי או בעל השליטה בחברת השותף הכללי“."},{"sec":"65נז","title":"גילוי עניין אישי בידי מחזיק יחידת השתתפות","law":"פקודת השותפויות","text":"מחזיק יחידת השתתפות המשתתף בהצבעה באסיפה כללית לפי סעיפים 65יח, 65מה או 65נא(ג)(3), יודיע לשותפות המוגבלת הציבורית לפני ההצבעה באסיפה הכללית או – אם ההצבעה היא באמצעות כתב הצבעה – על גבי כתב ההצבעה, אם יש לו עניין אישי באישור העסקה אם לאו; לא הודיע מחזיק יחידת השתתפות כאמור, לא יצביע וקולו לא יימנה."},{"sec":"65נח","title":"מיזוג","law":"פקודת השותפויות","text":"הוראות הפרק הראשון בחלק השמיני לחוק החברות יחולו על השותפות המוגבלת הציבורית כאילו היתה חברה ציבורית, בשינויים המחויבים ובשינויים אלה:\n(1) בכל מקום, במקום ”האסיפה הכללית“ יקראו ”האסיפה הכללית של מחזיקי יחידות ההשתתפות“ ובמקום ”רשם החברות“ יקראו ”רשם השותפויות“;\n(2) בסעיף 320 –\n(א) בסעיף קטן (א1), פסקה (2) – לא תחול;\n(ב) במקום סעיף קטן (ג) יקראו:\n ”בהצבעה באסיפה הכללית של מחזיקי יחידות ההשתתפות בשותפות מוגבלת ציבורית מתמזגת, שיחידות ההשתתפות שלה מוחזקות בידי השותפות המוגבלת הציבורית המתמזגת האחרת או בידי בעל השליטה בשותף הכללי בשותפות המתמזגת האחרת, לא יאושר המיזוג אם התנגדו לו מחזיקי יחידות ההשתתפות המחזיקים ברוב זכויות ההצבעה מקרב המשתתפים בהצבעה, למעט הנמנעים, שאינם נמנים עם השותפות המתמזגת האחרת, או בעל השליטה בשותף הכללי כאמור או מי מטעמם, לרבות קרוביהם או תאגידים בשליטתם, ואולם לא יראו אדם כמחזיק בשותפות המתמזגת האחרת אם ההחזקה נובעת רק מהחזקת יחידות השתתפות בשותפות המוגבלת הציבורית.“;\n(ג) בסעיף קטן (ד), במקום ”החזיק אדם בעשרים וחמישה אחוזים או יותר מסוג כלשהו של אמצעי שליטה במספר חברות מתמזגות“ יקראו ”היה אדם בעל שליטה בכמה מחברות השותף הכללי של השותפויות המוגבלות הציבוריות המתמזגות“;\n(ד) בסעיף קטן (ו), במקום ”סעיף 275(א), (ג) ו־(ד)“ יקראו ”סעיף 65נא לפקודת השותפויות [נוסח חדש], התשל״ה–1975“."},{"sec":"65נט","title":"הטלת עיצום כספי בידי רשות ניירות ערך","law":"פקודת השותפויות","text":"(א) בסימן זה, ”הסכום הבסיסי“ – סכום כמפורט להלן, לפי העניין:\n(1) לעניין חברת שותף כללי – הסכום הקבוע לגבי השותפות המוגבלת הציבורית בפרט 1 לתוספת השישית בחוק ניירות ערך;\n(2) לעניין יחיד – הסכום הקבוע בפרט 5 לתוספת השישית בחוק ניירות ערך.\n(ב) הפר אדם הוראה מההוראות לפי פקודה זו, כמפורט להלן, רשאית רשות ניירות ערך להטיל עליו עיצום כספי לפי הוראות סימן זה, בסכום הבסיסי:\n(1) בחברת השותף הכללי לא נקבע המספר המזערי הנדרש של דירקטורים בדירקטוריון שעליהם להיות בעלי מומחיות חשבונאית ופיננסית, בניגוד להוראות סעיף 92(א)(12) לחוק החברות כפי שהוחלו בסעיף 65ג לפקודה זו;\n(2) בחברת השותף הכללי לא מכהן יושב ראש דירקטוריון, בניגוד להוראות סעיף 94(א) לחוק החברות כפי שהוחלו בסעיף 65ד לפקודה זו, במשך למעלה מ־60 ימים;\n(3) בחברת השותף הכללי מכהן המנהל הכללי או קרובו או מי שכפוף למנהל הכללי, במישרין או בעקיפין, כיושב ראש הדירקטוריון, בניגוד להוראות סעיף 95(א) לחוק החברות כפי שהוחלו בסעיף 65ד לפקודה זו;\n(4) יושב ראש הדירקטוריון בחברת השותף הכללי מכהן כבעל תפקיד אחר בחברה או בשותפות המוגבלת הציבורית, בניגוד להוראות סעיף 95(ב) לחוק החברות כפי שהוחלו בסעיף 65ד לפקודה זו;\n(5) בחברת השותף הכללי לא מכהנת ועדת ביקורת, בניגוד להוראות סעיפים 114 ו־115 לחוק החברות כפי שהוחלו בסעיף 65ה לפקודה זו, במשך למעלה מ־90 ימים;\n(6) בחברת השותף הכללי לא מכהן מנהל כללי, בניגוד להוראות סעיף 119(א) לחוק החברות כפי שהוחלו בסעיף 65ז לפקודה זו, במשך למעלה מ־90 ימים;\n(7) בחברת השותף הכללי מכהן דירקטור או נושא משרה שהורשע בעבירה, בניגוד להוראות סעיף 226 או סעיף 251א לחוק החברות כפי שהוחלו בסעיף 65ח לפקודה זו; ואולם לא יוטל עיצום כספי על הממנה או על החברה אם הדירקטור או נושא המשרה לא הודיע על ההרשעה לממנה או לחברה, לפי העניין;\n(8) בחברת השותף הכללי מכהן דירקטור או נושא משרה שוועדת אכיפה מינהלית אסרה את מינויו, בניגוד להוראות סעיף 226א או סעיף 251א לחוק החברות כפי שהוחלו בסעיף 65ח לפקודה זו; ואולם לא יוטל עיצום כספי על הממנה או על החברה אם הדירקטור או נושא המשרה לא הודיע על האיסור לממנה או לחברה, לפי העניין;\n(9) בחברת השותף הכללי לא מכהנים שני דירקטורים חיצוניים לפחות, בניגוד להוראות סעיף 239(א) לחוק החברות כפי שהוחלו בסעיף 65ט לפקודה זו, במשך למעלה מ־90 ימים, ולעניין דירקטורים חיצוניים ראשונים כאמור בסעיף 242 לחוק החברות כפי שהוחל בסעיף 65ט לפקודה זו – במשך למעלה מ־90 ימים מהמועד האחרון לכינוס אסיפה כללית לפי אותו סעיף;\n(10) בחברת השותף הכללי שבמועד מינוי דירקטור חיצוני כל חברי הדירקטוריון שלהם הם בני מין אחד, לא מונה דירקטור חיצוני בן המין השני, בניגוד להוראות סעיף 239(ד) לחוק החברות כפי שהוחלו בסעיף 65ט לפקודה זו;\n(11) בחברת השותף הכללי לא מכהן דירקטור חיצוני בעל מומחיות חשבונאית ופיננסית, בניגוד להוראות סעיף 240(א1)(1) לחוק החברות כפי שהוחלו בסעיף 65ט לפקודה זו, במשך למעלה מ־90 ימים;\n(12) בוועדה הרשאית להפעיל סמכות מסמכויות הדירקטוריון של חברת השותף הכללי לא מכהן דירקטור חיצוני אחד לפחות, בניגוד להוראות סעיף 243 לחוק החברות כפי שהוחלו בסעיף 65ט לפקודה זו;\n(13) בחברת השותף הכללי לא מכהן מבקר פנימי, בניגוד להוראות סעיף 146 לחוק החברות כפי שהוחלו בסעיף 65יד לפקודה זו, במשך למעלה מ־90 ימים;\n(14) בשותפות מוגבלת ציבורית לא מכהן מפקח, בניגוד להוראות סעיפים 65יז ו־65יח, במשך למעלה מ־90 ימים, ולעניין מפקח ראשון כאמור בסעיף 65יח(א) – במשך למעלה מ־90 ימים ממועד ההצעה לראשונה של יחידות השתתפות לציבור;\n(15) בשותפות מוגבלת ציבורית מכהן מפקח שהורשע בעבירה, בניגוד להוראות לפי סעיף 226 לחוק החברות כפי שהוחלו בסעיף 65כ לפקודה זו; ואולם לא יוטל עיצום כספי על חברת השותף הכללי אם המפקח לא הודיע לה על ההרשעה;\n(16) בשותפות מוגבלת ציבורית מכהן מפקח שוועדת אכיפה מינהלית אסרה את מינויו, בניגוד להוראות לפי סעיף 226א לחוק החברות כפי שהוחלו בסעיף 65כ לפקודה זו; ואולם לא יוטל עיצום כספי על חברת השותף הכללי אם המפקח לא הודיע לה על האיסור.\n(ג) על אף האמור בסעיף קטן (ב), לא יוטל עיצום כספי על הפרת פסקאות (5), (9), (11) ו־(14) של אותו סעיף קטן, אם ההפרה נובעת מאי־מינוי דירקטור חיצוני או מפקח בשל היעדר הרוב הדרוש למינוי באסיפה הכללית.\n(ד) במניין הימים לפי סעיף זה לא יבואו הימים הנדרשים לשם אישור המינויים בידי מי שמפקח על השותפות המוגבלת הציבורית על פי כל דין."},{"sec":"65ס","title":"הפרה נמשכת והפרה חוזרת","law":"פקודת השותפויות","text":"(א) בהפרה נמשכת ייווספו על סכום העיצום הכספי שני אחוזים לכל יום שבו נמשכת ההפרה.\n(ב) בהפרה חוזרת ייווסף על העיצום הכספי שהיה ניתן להטיל בשלה אילו היתה הפרה ראשונה, סכום השווה למחצית העיצום הכספי כאמור; לעניין זה, ”הפרה חוזרת“ – הפרת הוראה מההוראות כמפורט בסעיף 65נט(ב), בתוך שנתיים מהפרה קודמת של אותה הוראה שבשלה הטילה רשות ניירות ערך על המפר עיצום כספי לפי סימן זה."},{"sec":"65סא","title":"תחולת הוראות {{ח:חיצוני","law":"פקודת השותפויות","text":"|תיקון: תשע״ה}}\n ההוראות לפי סעיפים 52טז עד 52יח, 52כ עד 52כז ו־56ח לחוק ניירות ערך, יחולו על עיצום כספי לפי סימן זה, בשינויים המחויבים."},{"sec":"65סב","title":"הגבלת תחולה","law":"פקודת השותפויות","text":"השר רשאי, לאחר התייעצות עם רשות ניירות ערך, לקבוע כי הוראות פרק זה, כולן או חלקן, לא יחולו על סוג של שותפות מוגבלת ציבורית כפי שיקבע."},{"sec":"65סג","title":"הסמכה להתקין תקנות לפי {{ח:חיצוני","law":"פקודת השותפויות","text":"שהוחלה לעניין פרק זה|תיקון: תשע״ה}}\n(א) בכל עניין בפרק זה שהוחלה לגביו הוראה מחוק החברות הכוללת הסמכה להתקין תקנות בידי השר, יחולו התקנות שהותקנו לפי חוק החברות כאמור, בשינויים המחויבים, ואולם השר רשאי להתקין תקנות מיוחדות לגבי פרק זה, בעניין שלגביו הוסמך כאמור.\n(ב) תקנות לפי פרק זה טעונות אישור של ועדת החוקה חוק ומשפט של הכנסת."},{"sec":"66","title":"שותפות רשומה היא תאגיד","law":"פקודת השותפויות","text":"(א) שותפות רשומה לפי פקודה זו היא תאגיד, ויכולה לתבוע ולהיתבע בשמה הרשום.\n(ב) סעיף זה יחול על תובענות שבין השותפות לחבריה או שבין שותפויות שיש להן חבר משותף והן מנהלות עסקים בישראל; אולם בתובענות אלה לא יינתן צו הוצאה לפועל בלי רשות מבית המשפט שדן בתובענה, ואם הוגשה בקשת רשות כאמור, רשאי בית המשפט להורות על עריכת חשבונות וחקירות וכל הוראה אחרת שיראה לצודק."},{"sec":"1","title":"הזכות לייסד עמותה","law":"חוק העמותות","text":"שני בני אדם או יותר, שהם בגירים, החפצים להתאגד כתאגיד למטרה חוקית שאינה מכוונת לחלוקת רווחים בין חבריו ושמטרתו העיקרית אינה עשיית רווחים, רשאים לייסד עמותה; העמותה תיכון עם רישומה בפנקס העמותות."},{"sec":"2","title":"בקשה לרישום עמותה","law":"חוק העמותות","text":"(א) בקשה לרישום עמותה תוגש בידי המייסדים לרשם העמותות (להלן – הרשם) באופן מקוון ויצויינו בה שם העמותה, מטרותיה, מענה בישראל, מענה הדיגיטלי, אחד מכל פרט המנוי בתוספת הרביעית לחוק החברות, שמות המייסדים, מעניהם ומספרי זהותם; לבקשה תצורף הצהרה חתומה בידי כל המייסדים על נכונותם לייסד עמותה, כאמור בבקשה, ולכהן בה כחברי הועד; זהות המייסדים תאומת באופן מקוון כפי שיקבע הרשם לפי סעיף 38ב(ב) או בידי עורך דין.\n(ב) לאחר הגשת הבקשה, וכל עוד לא נרשמה העמותה, יכיר הרשם בכל בקשה לשינוי או לתיקון פרט כאמור בסעיף קטן (א), אם חתומים עליה רוב המייסדים החתומים על הבקשה המקורית; ובלבד שהוכח להנחת דעתו, כי הודעה על ההחלטה להגיש בקשה לשינוי או לתיקון, נשלחה לכל המייסדים בדואר רשום 14 ימים לפחות לפני מועד הגשתה.\n(ג) על אף האמור בסעיפים קטנים (א) ו־(ב), הרשם רשאי לאפשר הגשת בקשה לפי אותם סעיפים קטנים שלא באופן מקוון אם התקיימו נסיבות שמצדיקות זאת.\n(ד) בחוק זה –\n(סוג=הגדרה)  ”חוק החברות“ – חוק החברות, התשנ״ט–1999;\n(סוג=הגדרה)  ”מען דיגיטלי“ – כהגדרתו בחוק החברות."},{"sec":"3","title":"סייגים לרישום עמותה","law":"חוק העמותות","text":"לא תירשם עמותה אם מטרה ממטרותיה שוללת את קיומה של מדינת ישראל או את אופיה הדמוקרטי, או אם יש יסוד סביר למסקנה כי העמותה תשמש מסווה לפעולות בלתי חוקיות."},{"sec":"4","title":"סייגים לשם העמותה","law":"חוק העמותות","text":"(א) לא תירשם עמותה בשם העלול להטעות או לפגוע בתקנת הציבור או ברגשותיו.\n(ב) לא תירשם עמותה בשם הזהה לשם של אחד מאלה, או הדומה לו עד כדי להטעות:\n(1) תאגיד הרשום כדין בישראל;\n(2) תאגיד שהיה רשום כדין בישראל, רישומו בוטל וטרם חלפו שנתיים מיום ביטול הרישום של אותו תאגיד;\n(3) עמותה הנמצאת בתהליכי רישום;\n(4) שם המבוקש לעמותה לאחר השלמת מיזוג כמשמעותו בפרק ד׳2, אם צוין במסמכים שהוגשו לפי סעיף 34ז(6).\n נרשמה עמותה בשם שאין לרשמה בו לפי סעיף קטן (א) או (ב), רשאי הרשם לדרוש ממנה לשנות את השם.\n(2) לא שינתה העמותה את שמה תוך ארבעה חודשים או תוך זמן אחר שקבע הרשם בדרישתו, לפי המאוחר, רשאי הרשם, בהסכמת היועץ המשפטי לממשלה, לשנות את שמה לשם שיבחר, בשים לב לשמה הקודם ולמטרותיה.\n(3) החליט הרשם לשנות את שם העמותה כאמור בפסקה (2), ישלח לעמותה תעודת שינוי שם, ולעניין פרסומו יראו את השינוי כאילו נקבע על פי החלטת העמותה.\n(4) שר המשפטים רשאי, באישור ועדת החוקה חוק ומשפט של הכנסת, לקבוע הוראות לעניין פרסום של שינוי השם לפי סעיף קטן זה."},{"sec":"5","title":"רישום העמותה","law":"חוק העמותות","text":"הוגשה בקשה בהתאם לסעיף 2, ירשום הרשם את העמותה בפנקס העמותות זולת אם ראה עצמו מנוע מלעשות כן לפי סעיפים 1, 3, 4(א) או 4(ב)."},{"sec":"5א","title":"רישום זמני","law":"חוק העמותות","text":"(א) הוגשה בקשה על פי סעיף 2 לרישום עמותה שמטרותיה גיוס כספים להצלת חיי אדם ולא רשם אותה הרשם בפנקס העמותות תוך שבועיים מיום שהוגשה הבקשה, שלא מחמת סירוב לרושמה, רשאים המייסדים לבקש משר הפנים שיורה על אופן בדיקת הבקשה ורישום העמותה תוך תקופה שלא תעלה על 14 ימים מיום מתן ההוראה כאמור.\n(ב) על בדיקה ורישום עמותה לפי סעיף קטן (א) יחולו הוראות סעיפים 1, 3 ו־4.\n(ג) תוקף רישום עמותה שנרשמה מכח סעיפים קטנים (א) ו־(ב) הוא לשנה אחת.\n(ד) חלפה שנה מיום רישומה הזמני של העמותה, ולא נרשמה העמותה לפי סעיף 5, יועברו נכסיה, לאחר שנפרעו חובותיה במלואם, לעמותה אחרת שקבע האפוטרופוס הכללי שמונה לפי חוק האפוטרופוס הכללי, התשל״ח–1978, ואשר מטרותיה קרובות, לדעתו, למטרות העמותה שתוקף רישומה הזמני פג."},{"sec":"7","title":"פרסום ותעודת רישום","law":"חוק העמותות","text":"משנרשמה עמותה, יפרסם הרשם הודעה על כך ברשומות ויתן לעמותה תעודת רישום; התעודה תהיה ראיה חלוטה שהעמותה נוסדה כדין."},{"sec":"8","title":"העמותה תאגיד","law":"חוק העמותות","text":"מהיום שצויין בתעודת הרישום כיום הרישום תהיה העמותה תאגיד, כשר לכל זכות, חובה ופעולה משפטית."},{"sec":"8א","title":"שימוש בשם","law":"חוק העמותות","text":"שם העמותה יצויין בכל מסמך, שילוט או פרסום היוצא מטעמה, בצורה המלאה המופיעה בתעודת הרישום; השם יצויין באותיות אחידות וללא קיצורים והשמטות ויכלול בסופו את הציון ”עמותה“, ”עמותה רשומה“ או ”(ע״ר)“."},{"sec":"8ב","title":"מען ודרכי המצאה","law":"חוק העמותות","text":"(א) מיום שנרשמה עמותה, חובה שיהיה לה מען בישראל שאליו ניתן להפנות כל הודעה לעמותה.\n(ב) הודעה על שינוי במען תימסר לרשם בתוך 14 ימים לאחר השינוי והוא ירשום את השינוי.\n(ג) המצאת הודעה או מסמך לעמותה תהיה בהנחה במענה של העמותה כפי שהוא רשום אצל הרשם בשעת המסירה, או במשלוח אליו בדואר.\n(ד) המצאת הודעה או מסמך מהרשם לעמותה, יכול שתהיה גם בהנחה במקום ששוכנע הרשם ששם מנהלת העמותה בפועל את פעילותה."},{"sec":"8ג","title":"המען הדיגיטלי","law":"חוק העמותות","text":"(א) מיום שנרשמה עמותה, חובה שיהיה לה מען דיגיטלי, אחד מכל פרט המנוי בתוספת הרביעית לחוק החברות.\n(ב) הודעה על שינוי במען דיגיטלי כאמור בסעיף 2(א) תימסר לרשם בתוך 14 ימים לאחר השינוי והוא ירשום את השינוי.\n(ג) הרשם ירשום את המען הדיגיטלי של העמותה שצוין לרישום כאמור בסעיף 2(א) או בהודעה על שינוי כאמור בסעיף קטן (ב), לאחר שהודיע לה כאמור בסעיף 3ב(א)(1) ו־(3) לחוק תקשורת דיגיטלית עם גופים ציבוריים, התשע״ח–2018, ולאחר שווידא שהמען הדיגיטלי תקין ופעיל."},{"sec":"8ד","title":"שמירת מסמכים במען של העמותה","law":"חוק העמותות","text":"(א) עמותה תשמור במענה את המסמכים האלה:\n(1) תקנון העמותה;\n(2) המסמכים המנויים בסעיף 39(א).\n(ב) עמותה רשאית לשמור את המסמכים האמורים בסעיף קטן (א) באמצעים אלקטרוניים, ובלבד שלזכאים לעיין בהם תהיה אפשרות לקבל העתקים מהמסמכים."},{"sec":"9","title":"התקנון – כחוזה","law":"חוק העמותות","text":"לכל עמותה יהיה תקנון כמפורט בפרק זה; דין התקנון כדין חוזה בין העמותה לבין חבריה ובינם לבין עצמם."},{"sec":"10","title":"תקנון רשום {{ח:פנימי","law":"חוק העמותות","text":"|תיקון: תשנ״ו}}\n המייסדים רשאים להגיש לרשם תקנון לעמותה; לא הגישו המייסדים תקנון לרשם כאמור, יראו כתקנונה את התקנון המצוי שבתוספת הראשונה."},{"sec":"11","title":"שינוי התקנון, השם והמטרות","law":"חוק העמותות","text":"(א) עמותה רשאית לשנות את תקנונה, שמה ומטרותיה בהחלטת האסיפה הכללית שנתקבלה ברוב קולות הזכאים להצביע בה; החלטה לפי סעיף זה טעונה רישום בידי הרשם ויחולו, בשינויים המחוייבים, הוראות סעיפים 4 עד 7 ו־10; תוקפה של ההחלטה מיום רישומה בידי הרשם.\n(ב) שינוי מטרה של עמותה במטרה אחרת או שינוי הוראות תקנון לגבי ייעוד הנכסים בפירוק (בסעיף זה – מטרה), וכן הוספת מטרה למטרות עמותה או גריעה מהן (בסעיף זה – שינוי מטרות), יתקבלו בהחלטת האסיפה הכללית, לאחר שוועד העמותה הציג לפניה פירוט של הנכסים שנצברו למטרותיה של העמותה עובר לשינוי המבוקש, והמחויבויות שקיבלה על עצמה העמותה לענין זה, לרבות כלפי תורמים לעמותה.\n(ג) שינוי מטרות כאמור בסעיף קטן (ב) ייעשה כמפורט להלן, לפי הענין:\n(1) אם המטרה שהעמותה מבקשת להחליף, לגרוע או להוסיף קרובה למטרה שאותה היא מחליפה או למטרותיה האחרות (בסעיף זה – מטרה קרובה), טעון שינוי כאמור רישום בידי הרשם; סבר הרשם כי המטרה כאמור אינה מטרה קרובה – יודיע על כך לחברה, והיא תפעל כאמור בפסקה (2);\n(2) אם המטרה שהעמותה מבקשת להחליף או להוסיף, אינה מטרה קרובה, או שאין לעמותה מטרה קרובה למטרה שאותה היא מבקשת לגרוע, טעון שינוי כאמור אישור בית המשפט.\n(ד) הרשם לא ירשום שינוי מטרות כאמור בסעיף קטן (ג)(1) אלא אם כן שוכנע כי בנסיבות הענין צודק ונכון לעשות כן, בשים לב למטרות העמותה, לפעילותה לפני השינוי, ולמחויבויות שקיבלה על עצמה העמותה לצורך השינוי.\n(ה) בית המשפט יחליט בבקשה לשינוי מטרות של עמותה לפי סעיף זה, לאחר שנתן לרשם הזדמנות להביע את עמדתו; בית המשפט לא יאשר שינוי מטרות אלא אם כן שוכנע כי בנסיבות הענין צודק ונכון לעשות כן, בשים לב למטרות העמותה ולפעילותה לפני השינוי, ובתנאים ובהסדרים שיקבע.\n(ו) קיבל הרשם מעמותה עותק של החלטת בית המשפט המאשרת שינוי מטרות לפי סעיף קטן (ג), ירשום אותה בהתאם להוראות סעיף קטן (א).\n(ז) שר המשפטים רשאי לקבוע הוראות לענין חובה של עמותה למסור הודעה על כוונתה לשנות את מטרותיה או על שינוי המטרות, ואת הדרכים והמועדים למסירתה, בהתחשב בסוגי עמותות ורשאי הוא להסמיך את הרשם לקבוע הוראות כאמור לגבי עמותה מסוימת, בהתחשב באופייה או בנסיבות הענין."},{"sec":"12","title":"תוכן התקנון","law":"חוק העמותות","text":"(א) כל תקנון או שינוי בתקנון שהוגש לרשם על פי סעיפים 10 ו־11 יירשם על ידיו אם מצא כי התקיימו הוראות סעיפים 1, 15 עד 20, 23, 27 עד 39 ו־43 עד 47 וסעיפים 1(א), 1(ב), 7 ו־12 לתקנון המצוי שבתוספת הראשונה.\n(ב) הוגש לרשם או נרשם על ידיו תקנון, וענין המוסדר בתקנון המצוי אינו מוסדר בו, מוסדר בו באופן חלקי, או מוסדר בו באופן לקוי כך שהוא נוגד את הוראות סעיף קטן (א), יחולו על החסר או על הליקוי הוראות התקנון המצוי."},{"sec":"13","title":"סייגים לסמכות","law":"חוק העמותות","text":"התקנון יכול שיגביל את סמכות העמותה לשנות את תקנונה, שמה או מטרותיה, לדרוש לשינוי רוב גדול יותר מן האמור בסעיף 11 או לקבוע לו תנאים אחרים."},{"sec":"15","title":"כשירות","law":"חוק העמותות","text":"(א) כל אדם שמלאו לו שבע עשרה שנים וכל תאגיד כשיר להיות חבר עמותה.\n(ב) על אף האמור בסעיף 4 בחוק הכשרות המשפטית והאפוטרופסות, התשכ״ב–1962, הצטרפות של קטין לעמותה והצבעה של קטין שהוא חבר העמותה באסיפה הכללית אינן טעונות הסכמת נציגו."},{"sec":"16","title":"תנאים לחברות","law":"חוק העמותות","text":"התנאים לחברות בעמותה, פקיעת חברות, קבלת חברים, פרישתם והוצאתם יהיו לפי הוראות התקנון, ואולם –\n(1) לא תותנה פרישתו של חבר אלא במתן הודעה זמן סביר מראש;\n(2) לא יוצא חבר אלא מן הטעמים שפורטו בתקנון ולאחר שניתנה לו הזדמנות נאותה להשמיע טענותיו."},{"sec":"17","title":"מהות","law":"חוק העמותות","text":"החברות בעמותה היא אישית, אינה ניתנת להעברה ואינה עוברת בירושה."},{"sec":"18","title":"פנקס חברים","law":"חוק העמותות","text":"עמותה חייבת לנהל פנקס חברים ולרשום בו כל חבר, מענו, מספר זהותו, תאריך תחילת חברותו ותאריך פקיעתה."},{"sec":"19","title":"מוסדות חובה ומוסדות רשות","law":"חוק העמותות","text":"(א) לכל עמותה תהיה אסיפה כללית, ועד וועדת בקורת, ויכול שיהיו לה מוסדות נוספים כאמור בתקנונה.\n(ב) האסיפה הכללית רשאית להחליט כי במקום ועדת בקורת ימונה רואה חשבון או גוף שאושר לענין זה בידי הרשם (להלן – הגוף המבקר).\n מבלי לפגוע בהוראות סעיף קטן (ב), עמותה שמחזורה השנתי עולה על 750,000 שקלים חדשים  חייבת למנות רואה חשבון.\n(2) הסכום האמור בפסקה (1) יהיה צמוד למדד המחירים לצרכן שמפרסמת הלשכה המרכזית לסטטיסטיקה ויעוגל לסכום הקרוב שהוא מכפלה של עשרה שקלים חדשים; שר הפנים יפרסם ברשומות בתחילת חודש פברואר של כל שנה את הסכום האמור, כפי שהוא מעודכן לאותה שנה.\n(3) בסעיף זה –\n(סוג=הגדרה)  ”מחזור“ – כהגדרתו בתוספת השניה;\n(סוג=הגדרה)  ”רואה חשבון“ – לרבות שותפות של רואי חשבון, חברת רואי חשבון או כל התאגדות חוקית אחרת של רואי חשבון."},{"sec":"20","title":"מועדים לכינוס האסיפה","law":"חוק העמותות","text":"(א) אסיפה כללית רגילה של חברי העמותה תתקיים במועדים הקבועים בתקנונה ולא פחות מאחת לשנה.\n(ב) הועד רשאי לכנס בכל עת אסיפה כללית שלא מן המנין, ועליו לעשות כן לפי דרישה בכתב של ועדת הבקורת, של הגוף המבקר או של עשירית מכלל חברי העמותה.\n(ב1) לא כינס הועד את האסיפה הכללית שנדרשה כדין, תוך 21 ימים מיום שהוגשה הדרישה לפי סעיף קטן (ב), רשאים הדורשים לכנסה בעצמם, ובלבד שהאסיפה תתקיים בתוך שלושה חודשים מיום שהוגשה הדרישה כאמור; האסיפה תכונס, ככל האפשר, באותו האופן שבו מכונסות אסיפות בידי הועד.\n(ב2) כונסה האסיפה כאמור בסעיף קטן (ב1), תכסה העמותה את ההוצאות הסבירות שהוציאו הדורשים ותחייב בהוצאות את חברי הועד האחראים לאי כינוסה; כן רשאית העמותה לנכות את ההוצאות מכספים המגיעים או שיגיעו ממנה לחברי הועד כאמור.\n(ג) לא כונסה אסיפה כללית בהתאם להוראות סעיף זה, רשאי הרשם לכנסה או למנות אדם שיכנס אותה."},{"sec":"34","title":"תוקף פעולות","law":"חוק העמותות","text":"פעולה של חבר הועד או של חבר ועדת הבקורת או של חבר הגוף המבקר, לא ייפגע תקפה בשל פגם שהיה בבחירתו של אותו חבר או במינויו."},{"sec":"34א","title":"שכר חברי ועד וחברי ועדת ביקורת","law":"חוק העמותות","text":"שר המשפטים, באישור ועדת החוקה חוק ומשפט של הכנסת, יקבע הוראות לענין שכר או גמול שישולמו לחברי ועד או לחברי ועדת ביקורת, בעמותה, ולענין תנאי העסקתם, לרבות הגבלות לענין שכר, גמול, ותנאי העסקה כאמור; ורשאי שר המשפטים לקבוע, באישור ועדת החוקה חוק ומשפט של הכנסת, הוראות כאמור לענין המנהל הכללי של העמותה ומי שכפוף לו במישרין; הוראות לפי סעיף זה יכול שייקבעו לסוגי עמותות."},{"sec":"34ב","title":"הוצאות לניהול עמותה","law":"חוק העמותות","text":"שר המשפטים, באישור ועדת החוקה חוק ומשפט של הכנסת, רשאי לקבוע שיעור הוצאות מרבי שרשאית עמותה להוציא לניהולה, לרבות לשכר ולגמול, ביחס למחזורה או לכספים שהוציאה לקידום מטרותיה; הוראות כאמור יכול שייקבעו לסוגים של עמותות; בסעיף זה, ”מחזור“ – סכום התקבולים השנתי של עמותה מכל מקור וסוג, שהתקבלו בממוצע בשלוש שנות הכספים שחלפו, ואם טרם חלפו שלוש שנות כספים מהקמת העמותה – סכום התקבולים כאמור שהתקבלו בממוצע בשנות הכספים שחלפו מאז הקמתה."},{"sec":"34ג","title":"חלוקה אסורה בעמותה","law":"חוק העמותות","text":"(א) עמותה אינה רשאית לבצע חלוקת רווחים לחבריה, במישרין או בעקיפין, לרבות למייסד העמותה, וכל חלוקת רווחים שבוצעה על ידה תיחשב לענין פרק זה כחלוקה אסורה.\n(ב) ביצעה עמותה חלוקה אסורה, יהיה על חבר עמותה להשיב לעמותה את שקיבל, זולת אם לא ידע ולא היה עליו לדעת כי החלוקה שבוצעה אסורה.\n(ג) הוראות סעיף זה לא יחולו על מתנה קטנת ערך וסבירה שניתנה לפי הנהוג בנסיבות הענין, וכן הן לא יחולו על טובת הנאה שקיבל חבר עמותה מהעמותה כאחד מציבור הזכאים ליהנות משירותי העמותה על פי מטרותיה."},{"sec":"34ד","title":"אחריות חברי ועד לחלוקה אסורה","law":"חוק העמותות","text":"בוצעה בעמותה חלוקה אסורה יראו כל מי שהיה חבר ועד במועד החלוקה כמי שהפר בכך את חובותיו כלפי העמותה, אלא אם כן הוכיח אחד מאלה:\n(1) שהתנגד לחלוקה האסורה ונקט את כל האמצעים הסבירים כדי למנעה;\n(2) שבנסיבות הענין, לא ידע ולא היה עליו לדעת על החלוקה האסורה."},{"sec":"34ה","title":"הגדרות","law":"חוק העמותות","text":"בפרק זה –\n ”חברה לתועלת הציבור“, ”מיזוג“, ”קרוב“, ”רשם ההקדשות“, ”רשם החברות“, ”שליטה“, ”שעבוד צף“ – כהגדרתם בחוק החברות;\n ”חוק החברות“ – חוק החברות, התשנ״ט–1999;\n ”רשם המשכונות“ – כמשמעותו בחוק המשכון, התשכ״ז–1967;\n ”תאגיד יעד“ – חברת לתועלת הציבור או עמותה, אחת או יותר, האמורה להתמזג עם תאגיד קולט באופן שיביא לחיסולה של החברה או העמותה;\n ”תאגיד מתמזג“ – תאגיד יעד ותאגיד קולט;\n ”תאגיד קולט“ – חברה לתועלת הציבור או עמותה, שכל נכסיו והתחייבויותיו של תאגיד היעד עוברים אליה במיזוג;\n ”תאגיד קשור“ – תאגיד מתמזג, שהוא או המנהל הכללי שלו, דירקטור או חבר ועד בו, לפי העניין, 25% מהחברים בו או בעלי מניות שבידם 25% מזכויות ההצבעה בו, או קרוב של כל אחד מהם, הוא גם מנהל כללי, דירקטור, חבר ועד, חבר או בעל מניות בתאגיד אחר שאיתו מבקש התאגיד להתמזג, והכל לרבות באמצעות תאגידים שבשליטתו של מי מהמנויים בהגדרה זו."},{"sec":"34ו","title":"אישור בית המשפט למיזוג","law":"חוק העמותות","text":"(א) עמותה רשאית להתמזג רק עם עמותה אחרת או עם חברה לתועלת הציבור, ובלבד שנוסף על האישורים הנדרשים לצורך מיזוג לפי חוק זה או לפי חוק החברות, ניתן למיזוג אישור בית המשפט המחוזי.\n(ב) בית המשפט לא יאשר מיזוג כאמור בסעיף זה, אלא אם כן שוכנע כי בנסיבות העניין צודק ונכון לעשות כן, בשים לב למטרות התאגידים המתמזגים ולפעילותם לפני המיזוג, לפי העניין, ובתנאים והסדרים שיקבע.\n(ג) בית המשפט ישקול, בין השאר, בטרם מתן האישור למיזוג, את היותם של התאגידים המתמזגים תאגידים קשורים ואת הקשר ביניהם, וכן את עמידתם של התאגידים המתמזגים בהוראות הדין.\n(ד) בית המשפט יחליט בבקשה לאישור מיזוג כאמור בסעיף זה לאחר שנתן לרשם ההקדשות או לרשם העמותות, לפי העניין, הזדמנות להביע את עמדתו, לרבות לעניין קיום דרישות הדין על ידי מי מהתאגידים המתמזגים עובר למיזוג.\n(ה) חלו על המיזוג הוראות סעיף 345יב לחוק החברות, יראו את אישור בית המשפט למיזוג לפי סעיף זה, כאישור בית המשפט גם לעניין הסעיף האמור, ובלבד שהתקיימו שאר הוראות אותו סעיף וכן הוראות סעיף קטן (ג)."},{"sec":"34ז","title":"החלת הוראות {{ח:חיצוני","law":"חוק העמותות","text":"על מיזוג לפי פרק זה|תיקון: תש״ע}}\n בלי לגרוע מהוראות לפי חוק זה, על מיזוג בין עמותות או מיזוג בין עמותה לחברה לתועלת הציבור, כאמור בפרק זה, יחולו ההוראות לפי חוק החברות שעניינן מיזוג, בשינויים המחויבים ובשינויים אלה:\n(1) המיזוג טעון אישור של הוועד או של הדירקטוריון, לפי העניין, ושל האסיפה הכללית, בכל אחד מהתאגידים המתמזגים, ובמיזוג בין תאגידים קשורים – גם אישור ועדת הביקורת או הגוף המבקר, בכל אחד מהם;\n(2) נוסף על הוראות סעיף 315 לחוק החברות, ישקול הוועד או הדירקטוריון של תאגיד מתמזג, לפי העניין, בטרם מתן אישור למיזוג, גם את מטרות תאגיד היעד מול מטרות התאגיד הקולט, את הנכסים שנצברו למטרותיו של התאגיד המתמזג ואת המחויבויות שקיבל על עצמו התאגיד המתמזג לעניין זה, לרבות כלפי תורמים לו;\n(3) הצעת המיזוג כמשמעותה בסעיף 316 לחוק החברות תכלול בין השאר –\n(א) פרטים בדבר החברים או בעלי המניות בתאגיד הקולט לאחר המיזוג, בציון החברים או בעלי המניות בתאגיד היעד, שיהיו חברים או בעלי מניות בתאגיד הקולט, לפי העניין, אם יש כאלה;\n(ב) פרטים בדבר חברי הוועד או הדירקטוריון בתאגיד הקולט לאחר המיזוג, בציון חברי הוועד או הדירקטורים בתאגיד היעד, לפי העניין, שיהיו, בכפוף להוראות כל דין, חברי ועד או דירקטורים בתאגיד הקולט, אם יש כאלה;\n(ג) ככל הנדרש, הסדרים נדרשים לקיום המחויבויות של תאגיד היעד, בין השאר לעניין נכסים שצבר למטרותיו עובר למיזוג, לרבות כלפי תורמים לו;\n(ד) בכפוף להוראות כל דין, שינויים מבוקשים במטרות התאגיד הקולט בשל המיזוג;\n(4) בטרם תתקבל החלטת האסיפה הכללית של כל אחד מהתאגידים המתמזגים, יציג לפניה הוועד או הדירקטוריון של התאגיד המתמזג, לפי העניין, את כל אלה:\n(א) הצעת המיזוג, כאמור בפסקה (3);\n(ב) פירוט הנכסים שהתאגיד המתמזג צבר למטרותיו עובר למיזוג והמחויבויות שקיבל על עצמו לעניין זה, לרבות כלפי תורמים לו;\n(ג) היותם של התאגידים המתמזגים תאגידים קשורים, בציון הקשר ביניהם;\n(ד) לעניין האסיפה הכללית של תאגיד היעד – את מטרות התאגיד הקולט;\n(5) אישור האסיפה הכללית למיזוג בכל אחד מהתאגידים המתמזגים טעון הסכמה של 75% מהנוכחים והמשתתפים בהצבעה, למעט הנמענים, אלא אם כן נקבע בתקנון התאגיד המתמזג רוב אחר לעניין זה; האסיפה הכללית תשקול בטרם מתן האישור, את השיקולים המפורטים בפסקאות (2) ו־(4), בשינויים המחויבים; שר המשפטים, באישור ועדת החוקה חוק ומשפט של הכנסת, רשאי לקבוע הוראות נוספות לעניין אסיפה כללית לאישור מיזוג כאמור, לרבות לעניין זימונה;\n(6) תאגיד מתמזג שהוא עמותה, ימסור מסמכים או הודעות כאמור בסעיפים 317 ו־322 לחוק החברות, לרשם העמותות; תאגיד מתמזג שהוא חברה לתועלת הציבור, ימסור מסמכים או הודעות כאמור לרשם ההקדשות;\n(7) נוסף על הודעות לפי סעיף 318 לחוק החברות, תאגיד מתמזג יפרסם הודעה בעיתון לתורמיו בהתאם להוראות לפי סעיף 318(ב) ;\n(8) סעיפים 320 ו־321 לחוק החברות לא יחולו;\n(9) היה תאגיד היעד חברה לתועלת הציבור שהוטל שעבוד צף על נכסיה, לא תהיה החברה האמורה רשאית להתמזג לתאגיד קולט שהוא עמותה, בלא הסכמת הנושה המובטח שלטובתו הוטל השעבוד הצף."},{"sec":"34ח","title":"תוצאות המיזוג","law":"חוק העמותות","text":"נתקבלה ברשם ההקדשות או ברשם העמותות, לפי העניין, החלטה חלוטה של בית המשפט המאשרת את המיזוג, יבוצע המיזוג כלהלן:\n(1) כל הנכסים והחיובים של תאגיד היעד, לרבות חיובים מותנים, עתידיים, ידועים ובלתי ידועים, יועברו ויוקנו לתאגיד הקולט;\n(2) יראו את התאגיד הקולט כאילו היה תאגיד היעד בכל הליך משפטי, לרבות בהליכי הוצאה לפועל;\n(3) במיזוג בין עמותות, יעביר רשם המשכונות את המשכונות הרשומים אצלו על נכסי תאגיד היעד לתאגיד הקולט; במיזוג בין עמותה לחברה לתועלת הציבור, שבו תאגיד היעד הוא עמותה, יעביר רשם המשכונות את המשכונות הרשומים אצלו על שם העמותה לרישום על ידי רשם החברות בפנקס השעבודים של החברה; במיזוג בין חברה לתועלת הציבור לעמותה, שבו תאגיד היעד הוא חברה, יעביר רשם החברות את פנקס השעבודים של החברה לרישום כמשכון על נכסי העמותה על ידי רשם המשכונות; שר המשפטים רשאי, באישור ועדת החוקה חוק ומשפט של הכנסת, לקבוע הוראות לעניין ביצוע העברת השעבודים והמשכונות כאמור, ובכלל זה את המסמכים שיידרש התאגיד המתמזג להגיש לצורך כך;\n(4) תאגיד היעד יחוסל והרשם העמותות או רשם החברות, לפי העניין, ימחק אותו ממרשמיו;\n(5) רשם העמותות, אם התאגיד הקולט הוא עמותה, או רשם החברות, אם התאגיד הקולט הוא חברה לתועלת הציבור, ימסור לתאגיד הקולט תעודה המעידה על ביצוע המיזוג וירשום את דבר המיזוג במרשמיו."},{"sec":"34ט","title":"תקנות לעניין {{ח:פנימי","law":"חוק העמותות","text":"|תיקון: תש״ע}}\n שר המשפטים, באישור ועדת החוקה חוק ומשפט של הכנסת, רשאי לקבוע הוראות לביצוע מיזוג לפי פרק זה, לרבות לעניין הפרטים שיש לכלול בהצעת מיזוג, לעניין מסירת מידע לנושים, לתורמים או לסוג שבהם ולעניין רישום העסקאות הנובעות מהמיזוג; כל עוד לא קבע שר המשפטים הוראות כאמור, יחולו ההוראות שנקבעו לעניין זה לפי חוק החברות, בשינויים המחויבים ובכפוף להוראות פרק זה."},{"sec":"35","title":"פנקסי חשבונות","law":"חוק העמותות","text":"(א) עמותה חייבת לנהל פנקסי חשבונות שישקפו בשלמות ובנאמנות את עסקאותיה ומצבה הכספי ואשר יכללו לפחות את הפרטים המופיעים בתוספת השניה, לפי הענין.\n(ב) כל חבר של הועד, של ועדת הבקורת או של הגוף המבקר וכן רואה חשבון שמונה לעמותה רשאי לעיין בכל עת בפנקסי החשבונות של העמותה ובמסמכים המתייחסים אל הרשום בהם ולקבל מכל חבר הועד ומכל עובד העמותה כל מסמך שברשותם וכל מידע הדרושים, לדעתו, למילוי תפקידיו."},{"sec":"36","title":"דו״ח כספי","law":"חוק העמותות","text":"(א) הועד יכין אחת לשנה מאזן ודין וחשבון של הכנסות העמותה והוצאותיה (להלן – דו״ח כספי) בכל שנת מס, אשר יכלול פירוט מלא לפי הרשימה המופיעה בתוספת השניה; הדו״ח הכספי יוגש לועדת הבקורת או לגוף המבקר לא פחות משבועיים לפני יום האסיפה הכללית או במועד מוקדם יותר שנקבע לכך בתקנון ויובא בפני האסיפה הכללית, לאישורה.\n(ב) הועד יצרף לדו״ח הכספי הודעה ובה פירוט מלא ומדוייק של כל התשלומים ששילמה העמותה או שהתחייבה לשלם, בשנה שלגביה מוגש הדו״ח הכספי, לכל אחד מחמשת מקבלי השכר הגבוה ביותר בעמותה לרבות פרטים בענין תנאי פרישה; והכל, בין שהתשלומים או ההתחייבויות לתשלומים כאמור ניתנו למקבלי השכר כאמור ובין שניתנו לאחר עבורם או בשל העסקתם;\n לענין סעיף זה, ”תשלומים“ – סכומי כסף וכל דבר שהוא שווה כסף, הלוואות, ניירות ערך או זכויות אחרות וכן כל ה
