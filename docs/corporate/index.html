התלוי ברווחי עסק או המשתנה לפיהם, ראיה לכאורה שהמקבל הוא שותף בעסק, אלא שניתן לסתור ראיה זו בשים לב לכל נסיבות העסקה שבין הצדדים."},{"t":"example","title":"דוגמה: שותף או עובד?","x":"מיכל עובדת בחנות של עידו ומקבלת 10% מהרווח החודשי במקום משכורת. היא אינה משתתפת בהחלטות ואינה משקיעה כסף. <b>פתרון:</b> לפי שות' 2(4), עובד שמקבל את גמולו בחלק מהרווחים אינו נעשה שותף ״בשל כך בלבד״. אין ניהול משותף של עסק, ולכן אין שותפות. אילו מיכל הייתה מנהלת עם עידו את העסק ומחליטה איתו, החזקה שבשות' 2(8) הייתה מטה את הכף לכיוון שותפות."},{"t":"h","x":"כמה שותפים?"},{"t":"law","law":"פקודת השותפויות","sec":"3","x":"מספר השותפים הכלליים בשותפות לא יעלה על עשרים."},{"t":"law","law":"פקודת השותפויות","sec":"3א(1)","x":"שותפות של עורכי דין או של רואי חשבון לשם עיסוק במקצועם, יכול שיהיו בה יותר מעשרים חברים;"},{"t":"trap","x":"<b>התקרה של 20 חלה על שותפים כלליים בלבד.</b> שותפים מוגבלים אינם נספרים בה. החריג הסטטוטורי חל על עורכי דין ורואי חשבון שעוסקים במקצועם, ושר המשפטים רשאי להרחיב אותו למקצועות נוספים באישור ועדת החוקה (שות' 3א(2))."},{"t":"h","x":"רישום ומעמד משפטי"},{"t":"law","law":"פקודת השותפויות","sec":"4","x":"שותפות שנתכוננה לשם ניהול עסק, חייבת ברישום לפי הוראות פקודה זו תוך חודש מן היום שנתכוננה; להוציא שותפות בין חקלאים לשם מיזם משותף בקשר עם עיבוד אדמה."},{"t":"law","law":"פקודת השותפויות","sec":"6","x":"שותפות החייבת ברישום ולא נרשמה כדין, דינו של כל שותף – קנס 15 לירות לכל יום שבו נמשכת העבירה; אולם אי־רישומה של שותפות לא ישפיע בשיקול אם השותפות קיימת ואם לאו."},{"t":"law","law":"פקודת השותפויות","sec":"66(א)","x":"שותפות רשומה לפי פקודה זו היא תאגיד, ויכולה לתבוע ולהיתבע בשמה הרשום."},{"t":"p","x":"השוו לחברה: חברה <b>נולדת</b> ברישום (ס' 5 לחוק החברות). שותפות נולדת מההתקשרות עצמה, והרישום רק מעניק לה מעמד של תאגיד. גם שותפות רשומה, שהיא תאגיד, <b>אינה מגינה על השותפים הכלליים</b>: הם ממשיכים לחוב בחובותיה. הרישום נעשה בהודעה לרשם, חתומה בידי השותפים, ובה שם השותפות, מהות העסק, מקומו, פרטי השותפים והמורשים לחתום (שות' 7). אסור לרשום שותפות בשם שכולל ״בערבון מוגבל״ או ״בע״מ״ (שות' 10(א)(1))."},{"t":"h","x":"השותפות מול צדדים שלישיים"},{"t":"law","law":"פקודת השותפויות","sec":"14","x":"כל שותף הוא שלוח של השותפות ושל שאר שותפיו לכל ענין של עסקי השותפות; ופעולותיו של כל שותף, כשהוא עושה בדרך הרגילה עסק מן הסוג שעושה השותפות שהוא חבר בה, יחייבו את השותפות ואת שותפיו, זולת אם למעשה אין לו הרשאה לפעול בשם השותפות באותו עסק, והאדם שעמו נשא ונתן יודע שאין לשותף הרשאה לכך, או שאינו יודע, או אינו מאמין, שהוא שותף."},{"t":"p","x":"כלומר כל שותף מחייב את כולם בעסקה רגילה של העסק. הגבלה פנימית של סמכות שותף מחייבת רק כלפי מי <b>שידע</b> עליה (שות' 17). השותפות חבה גם בעוולה של שותף שפעל במהלך הרגיל של עסקיה (שות' 18)."},{"t":"law","law":"פקודת השותפויות","sec":"20(א)","x":"כל שותף חב, יחד עם שאר השותפים ולחוד, בכל החיובים שהשותפות חבה בהם בהיותו שותף, לרבות בכל דבר שהשותפות חבה בו לפי סעיפים 18 ו־19 בהיותו שותף,"},{"t":"p","x":"סייג חשוב בהוצאה לפועל: נגד שותף לחוד יינתן צו רק אם השותפות פורקה, או שהנושה קיבל פסק דין נגד השותפות והוא לא קוים במלואו. שותף ששילם זכאי להשתתפות יחסית מהשותפות ומשאר השותפים (שות' 20(ב)). <b>שותף נכנס</b> אינו חב בחובות שקדמו לכניסתו (שות' 26). <b>שותף יוצא</b> ממשיך לחוב בחובות שנוצרו לפני פרישתו, אלא בהסכם עם הנושים ועם השותפות בהרכבה החדש (שות' 27)."},{"t":"h","x":"היחסים בין השותפים"},{"t":"list","x":["<b>חובת אמון:</b> לנהל את העסק לתועלת המשותפת, להיות ישרים ונאמנים ולמסור מידע מלא (שות' 29). שותף שהפיק טובת הנאה פרטית מעסקה של השותפות חייב בה לשותפות (שות' 38). שותף שמתחרה בה חייב למסור לה את רווחיו (שות' 39).","<b>ברירות המחדל</b> (בכפוף להסכם בין השותפים, שות' 34): רווחים והפסדים לפי ההון שכל אחד הסכים להשקיע; כל שותף רשאי להשתתף בניהול; אין שכר על עבודה בעסק; צירוף שותף חדש טעון הסכמת כל השותפים; עניינים רגילים מוכרעים ברוב השותפים, ושינוי מהות העסק טעון הסכמת כולם.","<b>פירוק:</b> שותפות לתקופה לא קצובה מתפרקת בהודעה של שותף (שות' 41(א)(3))."]},{"t":"h","x":"שותפות מוגבלת"},{"t":"law","law":"פקודת השותפויות","sec":"57","x":"שותפות מוגבלת תכלול שותף כללי אחד לפחות החב בכל חיוביה ושותף אחד לפחות שאינו חב בהם אלא כדי שיעור הסכום שהכניס להון השותפות. … תאגיד יכול שיהא שותף מוגבל."},{"t":"p","x":"הקמת שותפות מוגבלת פורמלית יותר: היא קמה על פי הסכם בכתב (״תקנות השותפות״). הרשם מגיש את התקנות לשר המשפטים, והשר רשאי להתיר את הרישום או לסרב לו. השותפות <b>לא תתחיל בעסקיה</b> לפני שקיבלה הודעה שהרישום הותר (שות' 61). בפועל, השותף הכללי הוא לעיתים קרובות חברה בע״מ, וכך גם ״הכללי״ מוגן."},{"t":"law","law":"פקודת השותפויות","sec":"63","x":"שותף מוגבל לא ישתתף בניהול עסקי השותפות ואין כוחו יפה לחייב את השותפות, … שותף מוגבל אינו רשאי, במשך קיומה של השותפות, למשוך או לקבל, במישרין או בעקיפין, שום חלק מהשקעתו, ואם עשה כן, יהא חב בחיוביה של השותפות כדי הסכומים שמשך או שקיבל. … שותף מוגבל המשתתף בניהול עסקי השותפות, יהא אחראי לכל חיוביה, כאילו היה שותף כללי, כל עוד הוא משתתף בניהולה."},{"t":"example","title":"דוגמה: שותף מוגבל שהתחיל לנהל","x":"״קרן נדל״ן צפון״ היא שותפות מוגבלת. יעל, שותפה מוגבלת שהשקיעה 200,000 ₪, החלה לנהל את המו״מ עם קבלנים ולחתום על הזמנות. השותפות קרסה עם חוב של 3 מיליון ₪. <b>פתרון:</b> שותפה מוגבלת שמשתתפת בניהול אחראית לכל חיובי השותפות כאילו הייתה שותפה כללית, כל עוד היא משתתפת בניהול (שות' 63(ג)). אילו נשארה פסיבית, חשיפתה הייתה מוגבלת ל-200,000 ₪ שהכניסה (שות' 57(א)). לו משכה חלק מהשקעתה, הייתה חבה גם עד הסכום שמשכה (שות' 63(ב)). מותר לה לעיין בפנקסים ולהתייעץ (שות' 63(א))."},{"t":"h","x":"שותפות מול חברה"},{"t":"table","head":["נושא","שותפות כללית","שותפות מוגבלת","חברה בע״מ"],"rows":[["מקור","פקודת השותפויות","פקודת השותפויות, ס' 56 ואילך","חוק החברות"],["היווצרות","ההתקשרות עצמה; רישום חובה אך אינו תנאי לקיום (שות' 4, 6)","הסכם בכתב והיתר שר המשפטים (שות' 61)","רישום אצל רשם החברות (ס' 5, 10)"],["אישיות משפטית","רק אם נרשמה (שות' 66)","רשומה, ולכן תאגיד","תמיד (ס' 4)"],["מספר חברים","2 עד 20 כלליים; חריג לעו״ד ורו״ח (שות' 3, 3א)","שותף כללי אחד ושותף מוגבל אחד לפחות (שות' 57)","מאחד ומעלה (ס' 3)"],["אחריות לחובות","בלתי מוגבלת, ביחד ולחוד (שות' 20)","כללי: בלתי מוגבלת; מוגבל: עד ההשקעה, כל עוד אינו מנהל (שות' 63)","מוגבלת לפי התקנון (ס' 35)"],["ניהול","כל שותף רשאי לנהל ומחייב את השותפות (שות' 14, 34(5))","רק הכלליים (שות' 63(א))","אורגנים: אסיפה, דירקטוריון, מנכ״ל"],["העברת זכויות","צירוף שותף בהסכמת כולם (שות' 34(7))","שותף מוגבל ממחה בהסכמת הכלליים (שות' 63(ד)(3))","מניות ניתנות להעברה (ס' 293)"]]},{"t":"steps","title":"ניתוח שאלה בשותפויות","x":["האם יש <b>קשרי שותפות</b>? ניהול משותף של עסק לשם רווח (שות' 1). בדקו את המבחנים שבשות' 2.","האם השותפות <b>רשומה</b>? אם לא, היא קיימת אבל אינה תאגיד (שות' 6, 66).","האם הפעולה <b>מחייבת את השותפות</b>? פעולה רגילה של העסק מחייבת, אלא אם הצד השלישי ידע על היעדר ההרשאה (שות' 14, 17).","מי <b>חב</b>? כל שותף כללי, ביחד ולחוד (שות' 20(א)). בהוצאה לפועל: הסייג בשות' 20(ב). שותף נכנס או יוצא: שות' 26–27.","שותפות מוגבלת: האם השותף המוגבל ניהל או משך כספים? (שות' 63(ב)–(ג))."]},{"t":"trap","x":"<b>״שותפות רשומה היא תאגיד״ אינו אומר ״השותפים מוגנים״.</b> בניגוד לחברה בע״מ, האישיות המשפטית של שותפות רשומה מאפשרת לה לתבוע ולהיתבע בשמה, אבל השותפים הכלליים חבים אישית, ביחד ולחוד, בכל חובותיה."},{"t":"h","x":"שיקולי מס: עוסק מורשה, שותפות או חברה?"},{"t":"p","x":"כשבוחרים איך לנהל עסק, השאלה אינה רק משפטית (אחריות מוגבלת, פורמליות) אלא גם <b>כמה מס ישולם</b>. נושא המס אינו חלק מחוק החברות, אבל הוא נלמד בקורס כשיקול מעשי. שימו לב: השיעורים מתעדכנים כל שנה, והמספרים כאן הם אלה שהוצגו בהרצאה (שנת המס 2026). העיקרון חשוב יותר מהמספר המדויק."},{"t":"table","head":["צורת הפעילות","איך הרווח ממוסה","יתרון","חיסרון"],"rows":[["עוסק מורשה (עצמאי)","מס הכנסה פרוגרסיבי על כל הרווח, ברמה אחת. השיעור השולי עולה עם ההכנסה, ולפי ההרצאה ברווח גבוה (מעל כ-721,000 ₪ בשנה) הוא מגיע ל-50%. בנוסף משולמים ביטוח לאומי ומס בריאות","פשוט וזול לניהול; ברווח נמוך-בינוני נטל המס הממוצע נמוך יחסית (בהרצאה: כ-25% על רווח של 250,000 ₪)","אחריות אישית בלתי מוגבלת; ברווח גבוה הנטל גבוה (בהרצאה: כ-47% על 850,000 ₪)"],["שותפות","השותפות עצמה אינה משלמת מס. הרווח מתחלק בין השותפים, וכל אחד ממוסה על חלקו כמו עצמאי","הרווח ״מתפצל״ בין כמה אנשים, ולכן כל אחד נמצא במדרגת מס נמוכה יותר. מתאים לעסק משפחתי או בין חברים","אחריות אישית של השותפים הכלליים, ביחד ולחוד (שות' 20)"],["חברה בע״מ","שתי רמות: החברה משלמת מס חברות (23%). כשהרווח יוצא לבעל המניות הוא ממוסה שוב, לפי הדרך שבה הוא נמשך","החברה אינה משלמת ביטוח לאומי; רווח שנשאר בחברה ממוסה רק ב-23%; אחריות מוגבלת","עלויות ניהול; ״מס כפול״ כשמושכים את הרווח כדיבידנד"]]},{"t":"list","x":["<b>משכורת מהחברה:</b> ממוסה כהכנסת עבודה, בשיעורים דומים לאלה של עצמאי. המשכורת היא הוצאה של החברה, ולכן היא מקטינה את הרווח שעליו משולם מס חברות.","<b>דיבידנד:</b> קודם החברה משלמת 23% מס חברות, ואחר כך בעל מניות מהותי משלם 30% מס על הדיבידנד. נטל המס המצטבר: 23% + (77% × 30%) = <b>46.1%</b>.","<b>הלוואה מהחברה לבעל המניות:</b> פקודת מס הכנסה מייחסת להלוואה כזו ריבית (ס' 3(ט) לפקודה), ומשיכות כספים שאינן מוחזרות עלולות להיחשב הכנסה של בעל המניות. כלומר, זו אינה דרך ״חינם״ להוציא כסף מהחברה."]},{"t":"example","title":"דוגמה: 1,000,000 ₪ רווח בחברה, ומושכים הכול כדיבידנד","x":"מס חברות: 23% × 1,000,000 = 230,000 ₪. נותרים 770,000 ₪. מס דיבידנד (בעל מניות מהותי): 30% × 770,000 = 231,000 ₪. בעל המניות מקבל נטו 539,000 ₪. סך המס: 461,000 ₪, כלומר <b>46.1%</b>. <b>המסקנה:</b> אם מושכים את כל הרווח, היתרון של חברה על פני עצמאי קטן. היתרון גדל כשמשאירים רווחים בחברה להשקעה (ואז משולם רק מס חברות), או כשמשלבים משכורת ודיבידנד. לפי ההרצאה, משיקולי מס בלבד כדאי להתאגד כחברה בעיקר כשהרווח השנתי מגיע לכ-800,000 ₪."},{"t":"trap","x":"<b>״חברה תמיד חוסכת מס״ אינו נכון.</b> המס בחברה נמוך רק כל עוד הרווח נשאר בה. ברגע שמחלקים דיבידנד, הנטל המצטבר (כ-46%) קרוב לנטל של עצמאי ברווח גבוה. ובשותפות אין שכבת מס נוספת: השותפים ממוסים ישירות. בבחינה זכרו גם את השיקולים שאינם מס: אחריות מוגבלת בחברה (ס' 35) מול אחריות אישית בשותפות כללית (שות' 20)."},{"t":"exam","x":"באמריקאיות בודקים בעיקר: היווצרות ללא רישום (שות' 6), שותפות רשומה כתאגיד (שות' 66), מספר השותפים הכלליים (שות' 3, 3א), אחריות ביחד ולחוד (שות' 20), ושותף מוגבל שמנהל (שות' 63(ג)). בשאלה פתוחה, למשל ״ספק תובע את השותפים״, הראו קיום שותפות (שות' 1–2), חיוב השותפות בפעולת השותף (שות' 14), אחריות אישית (שות' 20) והשוואה לחברה בע״מ (ס' 4, 35 לחוק החברות)."}],"mcq":[{"id":"u12-1","q":"לפי פקודת השותפויות, מה מהבאים מגדיר נכון ״קשרי שותפות״?","o":["הקשרים שבין בני אדם המנהלים יחד עסק לשם הפקת רווחים, למעט קשרים בין חברי תאגיד שהואגד לפי דין אחר.","כל הסכם שבו צד אחד מקבל חלק מהרווחים.","הקשרים שבין בעלי המניות בחברה פרטית.","רק התקשרות שנרשמה אצל רשם השותפויות.","כל בעלות משותפת בנכס."],"a":0,"why":"זו לשון ההגדרה בשות' 1(א).","w":["","קבלת חלק ברווחים היא רק ראיה לכאורה, וניתן לסתור אותה (שות' 2(8)). יש לה גם חריגים מפורשים (שות' 2(3)–(7)).","ההגדרה מוציאה במפורש חברי תאגיד שהואגד לפי דין אחר.","הרישום אינו תנאי לקיום השותפות (שות' 6).","בעלות משותפת בנכס כשלעצמה אינה יוצרת שותפות (שות' 2(1))."],"secs":["שות' 1","שות' 2"]},{"id":"u12-2","q":"נגה הלוותה 500,000 ₪ לבית קפה של אסף, ובחוזה נקבע שהריבית תשתנה לפי רווחי בית הקפה. נגה אינה מעורבת בניהול. נושה של בית הקפה טוען שנגה שותפה. מה נכון?","o":["נגה שותפה מוגבלת.","נגה אינה נעשית שותפה בשל כך בלבד.","נגה שותפה כללית, כי לא נקבעה תקרה לריבית.","נגה שותפה רק אם ההלוואה עולה על חצי מהון העסק.","נגה שותפה, כי היא מקבלת תשלום שתלוי ברווחים."],"a":1,"why":"שות' 2(6): ״המלווה כסף … ועל פי החוזה … יקבל המלווה ריבית בשיעור משתנה לפי רווחי העסק … אין המלווה נעשה משום כך בלבד שותף בעסק״.","w":["שותפות מוגבלת דורשת הסכם בכתב והיתר לרישום (שות' 61). מלווה אינו שותף מוגבל.","","אין בפקודה מבחן כזה.","אין בפקודה מבחן כזה.","החריג בשות' 2(6) גובר על החזקה הכללית שבשות' 2(8)."],"secs":["שות' 2"]},{"id":"u12-3","q":"קבוצה של 25 רופאים מבקשת להקים שותפות כללית ש-25 הרופאים כולם יהיו שותפים כלליים בה. בהנחה ששר המשפטים לא הרחיב את החריג לרופאים, מה נכון?","o":["המגבלה חלה רק על שותפים מוגבלים.","המגבלה היא 50 שותפים.","מספר השותפים הכלליים לא יעלה על עשרים, והחריג הסטטוטורי חל על עורכי דין ורואי חשבון בלבד.","אין מגבלה על מספר השותפים בשותפות כללית.","רופאים פטורים מהמגבלה מכוח הפקודה עצמה."],"a":2,"why":"שות' 3: ״מספר השותפים הכלליים בשותפות לא יעלה על עשרים״. שות' 3א(1) מחריג עורכי דין ורואי חשבון, ושות' 3א(2) מסמיך את השר להרחיב את החריג.","w":["זה הפוך: המגבלה חלה על השותפים הכלליים.","אין בסיס לכך.","","שות' 3 קובע מגבלה.","הפקודה עצמה מחריגה רק עורכי דין ורואי חשבון."],"secs":["שות' 3","שות' 3א"]},{"id":"u12-4","q":"״לוי ושות'״ היא שותפות כללית שלא נרשמה מעולם. מה נכון?","o":["השותפות קיימת; השותפים חשופים לקנס בשל אי-רישום, והשותפות אינה תאגיד.","השותפות אינה קיימת משפטית.","השותפים נהנים מאחריות מוגבלת עד שתירשם.","השותפות קיימת רק אם יש הסכם שותפות בכתב.","השותפות היא תאגיד, כי היא פועלת כגוף עסקי."],"a":0,"why":"שות' 4 מחייב רישום תוך חודש. לפי שות' 6, על כל שותף חל קנס, אך ״אי־רישומה של שותפות לא ישפיע בשיקול אם השותפות קיימת״. לפי שות' 66, רק שותפות רשומה היא תאגיד.","w":["","שות' 6 קובע במפורש את ההפך.","אין קשר בין רישום לבין הגבלת אחריות. שותף כללי חב תמיד (שות' 20).","שותפות כללית אינה טעונה הסכם בכתב. הדרישה לכתב חלה על שותפות מוגבלת (שות' 61(א)).","שות' 66 מעניק מעמד תאגיד רק לשותפות רשומה."],"secs":["שות' 4","שות' 6","שות' 66"]},{"id":"u12-5","q":"שותפות רשומה חייבת לספק 300,000 ₪. הספק מבקש לנקוט הליכי הוצאה לפועל ישירות נגד אחד השותפים, לפני שתבע את השותפות. מה נכון?","o":["הספק רשאי, כי השותפים חבים ביחד ולחוד.","השותף חב רק בחלקו היחסי ברווחים.","השותף חב, אך צו הוצאה לפועל נגדו לחוד יינתן רק אם השותפות פורקה, או שהספק קיבל נגדה פסק דין שלא קוים במלואו.","השותף אינו חב כלל, כי השותפות הרשומה היא תאגיד.","הספק רשאי לפעול רק נגד השותף שחתם על ההזמנה."],"a":2,"why":"שות' 20(א) קובע אחריות ביחד ולחוד, ושות' 20(ב) מוסיף סייג: לא יינתן צו הוצאה לפועל נגד שותף לחוד, אלא אם השותפות פורקה, או שהנושה קיבל פסק דין נגדה והוא לא קוים במלואו.","w":["האחריות קיימת, אבל ההוצאה לפועל מותנית בשות' 20(ב).","האחריות כלפי הנושה היא לכל החוב. חלוקה יחסית רלוונטית רק בין השותפים לבין עצמם (שות' 20(ב) סיפה).","","מעמד התאגיד (שות' 66) אינו מבטל את אחריות השותפים (שות' 20).","כל שותף חב ביחד ולחוד, לא רק מי שחתם."],"secs":["שות' 20","שות' 66"]},{"id":"u12-6","q":"ענבל הצטרפה כשותפה כללית לשותפות קיימת ב-2026. לשותפות חוב מ-2024 לבנק. מה נכון?","o":["ענבל חבה במחצית החוב.","ענבל חבה רק אם הבנק לא ידע על הצטרפותה.","ענבל אינה חבה בחוב שנוצר לפני שנעשתה שותפה.","ענבל חבה בחוב, כי כל שותף חב בכל חיובי השותפות.","ענבל חבה רק אם השותפות רשומה."],"a":2,"why":"שות' 26: מי שנתקבל כשותף לשותפות קיימת ״לא יהיה בכך חב כלפי נושיה בשל מה שנעשה לפני היותו לשותף״.","w":["אין בסיס לחלוקה כזו.","אין רלוונטיות לידיעת הבנק.","","שות' 26 הוא חריג מפורש.","הכלל אינו תלוי ברישום."],"secs":["שות' 26"]},{"id":"u12-7","q":"בשותפות מוגבלת, השותף המוגבל טל החל לנהל את המשא ומתן עם ספקים ולחתום על חוזים. מה נכון לגבי אחריותו?","o":["אחריותו נשארת מוגבלת לסכום שהשקיע.","הוא אחראי לכל חיובי השותפות כאילו היה שותף כללי, כל עוד הוא משתתף בניהולה.","השותפות כולה הופכת לשותפות כללית.","הוא נעשה אוטומטית שותף כללי לצמיתות.","החוזים שחתם בטלים, ואין לו אחריות."],"a":1,"why":"שות' 63(ג): שותף מוגבל ״המשתתף בניהול עסקי השותפות, יהא אחראי לכל חיוביה, כאילו היה שותף כללי, כל עוד הוא משתתף בניהולה״.","w":["ההגבלה אובדת בשל ההשתתפות בניהול.","","השותפות נשארת מוגבלת; רק מעמדו של טל לעניין האחריות משתנה.","האחריות היא ״כל עוד הוא משתתף בניהולה״, לא לצמיתות.","אין קביעה כזו בפקודה."],"secs":["שות' 63"]},{"id":"u12-8","q":"שותף מוגבל משך בחזרה 50,000 ₪ מתוך 200,000 ₪ שהשקיע, בעוד השותפות פעילה. מה התוצאה?","o":["הוא מאבד את מעמדו כשותף.","המשיכה מותרת אם השותפים הכלליים הסכימו.","אין לכך השלכה על אחריותו.","הוא הופך לשותף כללי.","הוא חב בחיובי השותפות עד הסכום שמשך."],"a":4,"why":"שות' 63(ב): שותף מוגבל אינו רשאי למשוך חלק מהשקעתו במשך קיום השותפות, ״ואם עשה כן, יהא חב בחיוביה של השותפות כדי הסכומים שמשך או שקיבל״.","w":["אין בפקודה הוראה כזו.","הסעיף אינו מתנה את התוצאה בהסכמה.","יש השלכה מפורשת.","התוצאה היא אחריות עד הסכום שנמשך, לא הפיכה לשותף כללי.",""],"secs":["שות' 63"]},{"id":"u12-9","q":"מה נכון לגבי הקמת שותפות מוגבלת?","o":["די בהסכם בעל פה בין השותפים.","היא חייבת לכלול לפחות שני שותפים כלליים.","היא קמה על פי הסכם בכתב, ורישומה טעון היתר שר המשפטים. היא לא תתחיל בעסקיה לפני שקיבלה הודעה על ההיתר.","שותף מוגבל חייב להיות אדם, ולא תאגיד.","היא נרשמת אצל רשם החברות."],"a":2,"why":"שות' 61(א): הסכם בכתב. שות' 61(ג): הרשם מגיש לשר המשפטים, והשר רשאי להתיר או לסרב. שות' 61(ה): השותפות לא תתחיל בעסקיה לפני ההודעה על ההיתר.","w":["שות' 61(א) דורש הסכם בכתב.","די בשותף כללי אחד (שות' 57(א)).","","שות' 57(ב): ״תאגיד יכול שיהא שותף מוגבל״.","הרישום אצל רשם השותפויות."],"secs":["שות' 57","שות' 61"]},{"id":"u12-10","q":"בשותפות כללית של שלושה שותפים אין הסכם המסדיר את היחסים ביניהם. שניים מהם רוצים לצרף שותף רביעי, והשלישי מתנגד. מה נכון?","o":["השאלה תוכרע בידי רשם השותפויות.","די בהסכמת השותף בעל ההון הגדול ביותר.","השותף אינו מצטרף, כי צירוף שותף טעון הסכמת כל השותפים הקיימים.","השותף מצטרף כשותף מוגבל בלבד.","השותף מצטרף, כי עניינים רגילים מוכרעים ברוב."],"a":2,"why":"שות' 34(7): ״לא יתקבל שותף לשותפות בלי הסכמת כל השותפים הקיימים״, בכפוף להסכם בין השותפים.","w":["הרשם אינו מכריע במחלוקת פנימית.","אין כלל כזה.","","אין בסיס לכך. שותפות מוגבלת טעונה הסכם בכתב והיתר (שות' 61).","רוב מכריע רק ״בענינים רגילים״ (שות' 34(8)). צירוף שותף מוסדר בנפרד."],"secs":["שות' 34"]},{"id":"u12-11","q":"שותף בשותפות כללית חתם, בשם השותפות, על הזמנת סחורה רגילה מהסוג שהשותפות עוסקת בו. לפי הסכם פנימי בין השותפים, אסור היה לו לחתום על הזמנות מעל 10,000 ₪, וההזמנה הייתה על 30,000 ₪. הספק לא ידע על ההגבלה. מה נכון?","o":["ההזמנה מחייבת רק את השותף שחתם.","ההזמנה אינה מחייבת את השותפות, כי השותף חרג מהרשאתו.","ההזמנה מחייבת את השותפות, כי הספק לא ידע על ההגבלה.","ההזמנה מחייבת עד 10,000 ₪ בלבד.","ההזמנה מחייבת רק אם השותפות רשומה."],"a":2,"why":"שות' 14: כל שותף הוא שלוח של השותפות, ופעולתו בדרך הרגילה מחייבת אותה, אלא אם הצד השני ידע על היעדר ההרשאה. שות' 17: הגבלה פנימית לא תחייב ״כלפי אדם שידע על ההסכמה״, ומכאן שאינה חלה כלפי מי שלא ידע.","w":["הפעולה מחייבת את השותפות ואת השותפים (שות' 14).","ההגבלה הפנימית אינה חלה על ספק שלא ידע (שות' 17).","","אין בסיס לחיוב חלקי.","כוח השותף לחייב אינו תלוי ברישום."],"secs":["שות' 14","שות' 17"]},{"id":"u12-12","q":"מה מהבאים נכון לגבי שותפות רשומה לעומת חברה בע״מ?","o":["שתיהן תאגידים, אבל בשותפות הכללית השותפים חבים ביחד ולחוד בחובותיה, ובחברה בע״מ אחריות בעלי המניות מוגבלת.","בשתיהן, החברים אינם חבים בחובות התאגיד.","לשותפות רשומה חייב להיות דירקטוריון.","שותפות רשומה רשאית לציין ״בע״מ״ בשמה.","חברה קמה מכוח הסכם בין בעליה, ושותפות קמה רק ברישום."],"a":0,"why":"שות' 66: שותפות רשומה היא תאגיד. שות' 20: השותפים חבים ביחד ולחוד. בחברה: ס' 4 (אישיות נפרדת) וס' 35 (הגבלת אחריות).","w":["","השותפים הכלליים חבים (שות' 20).","אין חובה כזו בשותפות רגילה.","שות' 10(א)(1) אוסר זאת.","זה הפוך: חברה קמה ברישום (ס' 5), ושותפות קמה מההתקשרות (שות' 1, 6)."],"secs":["שות' 66","שות' 20","35"]},{"id":"u12-13","q":"לפי שיעורי המס שהוצגו בקורס (מס חברות 23%, מס על דיבידנד לבעל מניות מהותי 30%), מהו נטל המס המצטבר על רווח של חברה שמחולק כולו כדיבידנד לבעל מניות מהותי?","o":["30%.","53%.","46.1%.","23%.","37%."],"a":2,"why":"החברה משלמת 23% מס חברות, ונותרים 77% מהרווח. על הדיבידנד משולם 30%: 30% × 77% = 23.1%. יחד: 23% + 23.1% = 46.1%.","w":["30% הוא רק המס על הדיבידנד, בלי מס החברות ששולם קודם.","חיבור פשוט של 23% ו-30% שגוי, כי מס הדיבידנד מוטל רק על מה שנשאר אחרי מס החברות (77%).","","23% הוא רק מס החברות. הוא הנטל כל עוד הרווח נשאר בחברה ולא חולק.","אין חישוב שמוביל ל-37% לפי הנתונים."],"secs":[]},{"id":"u12-14","q":"דנה ואבי מנהלים יחד חנות כשותפות כללית, וחולקים ברווחים בחלקים שווים. השנה הרוויחה השותפות 400,000 ₪. מי משלם מס על הרווח?","o":["השותפות משלמת מס חברות של 23%, ואחר כך כל שותף משלם מס על מה שמשך.","השותפות אינה משלמת מס בעצמה; כל שותף ממוסה על חלקו ברווח (200,000 ₪) לפי שיעורי המס של יחיד.","רק השותף שרשום ראשון ברשם השותפויות משלם מס על כל הרווח.","שותפות פטורה ממס, כי היא אינה תאגיד.","השותפים משלמים 30% מס דיבידנד על כל הרווח."],"a":1,"why":"בשותפות אין שכבת מס נפרדת. הרווח מתחלק בין השותפים, וכל אחד ממוסה על חלקו כמו עצמאי. היתרון: חלוקת הרווח בין כמה אנשים מורידה כל אחד למדרגת מס נמוכה יותר.","w":["מס חברות חל על חברה, לא על שותפות.","","סדר הרישום אינו קובע חבות במס. כל שותף ממוסה על חלקו.","השותפות עצמה אינה משלמת מס, אבל הרווח ממוסה בידי השותפים. זה אינו ״פטור״. ושימו לב: שותפות רשומה דווקא כן תאגיד (שות' 66).","מס דיבידנד חל על חלוקה מחברה לבעלי מניותיה, לא על רווח של שותפות."],"secs":["שות' 1"]}],"cases":[{"id":"u12-c1","title":"כהן את לוי – משרד אדריכלים","facts":"האדריכלים דן כהן ורות לוי מנהלים משרד בשם ״כהן את לוי״ מאז 2022, וחולקים ברווחים חצי-חצי. השותפות לא נרשמה. ב-2025 הצטרף יוני, בהסכמת שניהם, כשותף שלישי. בהסכם בעל פה נקבע שאסור לרות לחתום על הזמנות מעל 20,000 ₪ בלי הסכמת דן. ב-2026 הזמינה רות ציוד מחשוב ב-90,000 ₪ מספק שלא ידע על ההגבלה, והחשבון לא שולם. בנוסף, למשרד חוב משנת 2024 לבעל הנכס בסך 60,000 ₪. דן מתכנן לפרוש מהשותפות בחודש הבא. משקיע בשם אלי מציע להשקיע 500,000 ₪ ״כשותף מוגבל״, ובלבד שיוכל לאשר כל עסקה מעל 50,000 ₪.","parts":[{"q":"מי חב בחוב לספק הציוד ובחוב לבעל הנכס, ובאיזה היקף? נמקו והפנו לסעיפי הפקודה.","pts":20,"model":["1. מתקיימים קשרי שותפות: ניהול משותף של עסק לשם רווח (שות' 1). אי-הרישום מפר את שות' 4, אך אינו משפיע על קיום השותפות (שות' 6). השותפות אינה תאגיד (שות' 66).","2. חוב הספק: רות פעלה בדרך הרגילה של העסק, ולכן פעולתה מחייבת את השותפות ואת השותפים (שות' 14). ההגבלה הפנימית אינה חלה על ספק שלא ידע עליה (שות' 17).","3. דן, רות ויוני חבים בחוב הספק ביחד ולחוד (שות' 20(א)). צו הוצאה לפועל נגד שותף לחוד מותנה בסייג שבשות' 20(ב). מי שישלם זכאי להשתתפות יחסית משאר השותפים.","4. ביחסים הפנימיים, רות הפרה את ההסכם ואת חובת האמון (שות' 29), ועשויה לחוב כלפי שותפיה.","5. חוב בעל הנכס (2024): דן ורות חבים ביחד ולחוד. יוני הצטרף ב-2025, ואינו חב בחוב שנוצר לפני הצטרפותו (שות' 26).","6. פרישת דן אינה פוטרת אותו מחובות שנוצרו לפני פרישתו, אלא בהסכם עם הנושים ועם השותפות בהרכבה החדש (שות' 27)."],"check":["קיום שותפות ללא רישום (שות' 1, 6)","חיוב השותפות בפעולת שותף (שות' 14, 17)","אחריות ביחד ולחוד + סייג הוצאה לפועל (שות' 20)","שותף נכנס – שות' 26","שותף יוצא – שות' 27"]},{"q":"האם אלי יכול להיות שותף מוגבל בתנאים שהציע? מה עליהם לעשות?","pts":15,"model":["1. שותפות מוגבלת כוללת לפחות שותף כללי אחד ושותף מוגבל אחד, שאחריותו עד הסכום שהכניס (שות' 57(א)).","2. הקמתה דורשת הסכם בכתב (שות' 61(א)), רישום בצירוף פרטי השותף המוגבל וסכום ההשקעה (שות' 58) והיתר שר המשפטים. אסור להתחיל בעסקים לפני ההודעה על ההיתר (שות' 61(ג), (ה)).","3. שותף מוגבל לא ישתתף בניהול ואין כוחו לחייב את השותפות (שות' 63(א)). מותר לו לעיין בפנקסים ולהתייעץ.","4. מנגנון שבו אלי ״מאשר כל עסקה מעל 50,000 ₪״ הוא כנראה השתתפות בניהול. אם כך, יחוב בכל חיובי השותפות כשותף כללי, כל עוד הוא משתתף בניהול (שות' 63(ג)).","5. המלצה: להגביל את זכויות אלי לעיון ולהתייעצות, או לשקול מבנה של חברה בע״מ, שבה משקיע יכול לקבל זכויות הצבעה או מינוי דירקטור בלי לאבד את הגבלת האחריות (ס' 35 לחוק החברות)."],"check":["הרכב שותפות מוגבלת – שות' 57","הסכם בכתב + היתר שר + איסור התחלה – שות' 61","איסור השתתפות בניהול – שות' 63(א)","תוצאה – שות' 63(ג)","חלופה: חברה בע״מ"]}]}]},{"id":"u13","title":"עמותות וחל״צ","short":"עמותות וחל״צ","blurb":"תוכלו לתאר את הקמת עמותה, את מוסדותיה ואת איסור חלוקת הרווחים, לנתח שינוי מטרות ופיקוח של הרשם, ולהשוות עמותה לחברה לתועלת הציבור (חל״צ).","secs":["עמ' 1","עמ' 3","עמ' 8","עמ' 11","עמ' 15","עמ' 17","עמ' 19","עמ' 20","עמ' 25","עמ' 30","עמ' 33","עמ' 34ג","עמ' 49","345א","345ב","345ה","345ז","345ח","345יג","עמ' 40"],"blocks":[{"t":"h","x":"מהי עמותה?"},{"t":"p","x":"עמותה היא תאגיד שנועד לקדם <b>מטרה</b> ולא להעשיר את חבריו. כך פועלים בתי תמחוי, ארגוני סיוע, קבוצות ספורט, מוסדות תרבות ועוד. היא מוסדרת ב<b>חוק העמותות, התש״ם–1980</b>, ונרשמת אצל <b>רשם העמותות</b> שבמשרד המשפטים."},{"t":"law","law":"חוק העמותות","sec":"1","x":"שני בני אדם או יותר, שהם בגירים, החפצים להתאגד כתאגיד למטרה חוקית שאינה מכוונת לחלוקת רווחים בין חבריו ושמטרתו העיקרית אינה עשיית רווחים, רשאים לייסד עמותה; העמותה תיכון עם רישומה בפנקס העמותות."},{"t":"list","x":["<b>לפחות שני מייסדים בגירים</b>. אדם אחד אינו יכול להקים עמותה, בניגוד לחברה (ס' 3 לחוק החברות).","<b>מטרה חוקית</b> – לא חייבת להיות ציבורית. אפשר, למשל, לגייס כסף לטיפול רפואי באדם מסוים.","<b>לא לחלוקת רווחים</b>, ו<b>המטרה העיקרית אינה עשיית רווחים</b>. מותר לעמותה להפעיל פעילות מכניסה, למשל חנות יד שנייה, אם ההכנסות משמשות את המטרה.","<b>נולדת ברישום</b> בפנקס העמותות. מיום הרישום שבתעודה היא תאגיד, כשר לכל זכות, חובה ופעולה משפטית (עמ' 8)."]},{"t":"law","law":"חוק העמותות","sec":"3","x":"לא תירשם עמותה אם מטרה ממטרותיה שוללת את קיומה של מדינת ישראל או את אופיה הדמוקרטי, או אם יש יסוד סביר למסקנה כי העמותה תשמש מסווה לפעולות בלתי חוקיות."},{"t":"steps","title":"רישום עמותה","x":["המייסדים מגישים לרשם בקשה מקוונת שכוללת: שם, מטרות, מען, מען דיגיטלי ופרטי המייסדים. מצרפים הצהרה חתומה של כל המייסדים על נכונותם לייסד את העמותה ולכהן כחברי הוועד (עמ' 2(א)).","מגישים תקנון. אם לא הוגש תקנון, חל ״התקנון המצוי״ שבתוספת הראשונה לחוק (עמ' 10).","הרשם בודק סייגים: מטרה פסולה (עמ' 1, 3) ושם מטעה או זהה לתאגיד קיים (עמ' 4).","הרשם רושם את העמותה בפנקס (עמ' 5), מפרסם הודעה ברשומות ומוסר תעודת רישום, שהיא ראיה חלוטה שהעמותה נוסדה כדין (עמ' 7).","מיום הרישום העמותה היא תאגיד (עמ' 8). בכל מסמך ושלט היא מציינת בסוף שמה ״עמותה״, ״עמותה רשומה״ או ״(ע״ר)״ (עמ' 8א)."]},{"t":"p","x":"כמו בחברה, <b>התקנון הוא חוזה</b> בין העמותה לחבריה ובין החברים לבין עצמם (עמ' 9). עד שנבחר הוועד הראשון, המייסדים משמשים ועד (עמ' 26(א))."},{"t":"h","x":"חברות בעמותה"},{"t":"p","x":"כל אדם שמלאו לו 17 וכל תאגיד כשירים להיות חברים בעמותה (עמ' 15). לפי ס' 1, המייסדים צריכים להיות בגירים. חבר רשאי לפרוש בהודעה זמן סביר מראש, ואפשר להוציא חבר רק מטעמים שפורטו בתקנון ואחרי שקיבל הזדמנות להשמיע את טענותיו (עמ' 16)."},{"t":"law","law":"חוק העמותות","sec":"17","x":"החברות בעמותה היא אישית, אינה ניתנת להעברה ואינה עוברת בירושה."},{"t":"trap","x":"<b>חברות בעמותה אינה ״מניה״.</b> אין לה ערך כלכלי, אי אפשר למכור אותה ואי אפשר להוריש אותה (עמ' 17). שאלה כמו ״יורשי החבר מקבלים את חלקו בנכסי העמותה״ שגויה מכל כיוון: אין ירושה של חברות, ואין לחבר חלק בנכסים."},{"t":"h","x":"מוסדות העמותה"},{"t":"law","law":"חוק העמותות","sec":"19(א)","x":"לכל עמותה תהיה אסיפה כללית, ועד וועדת בקורת, ויכול שיהיו לה מוסדות נוספים כאמור בתקנונה."},{"t":"table","head":["המוסד","תפקיד וכללים","סעיפים"],"rows":[["האסיפה הכללית","אסיפה רגילה לפחות פעם בשנה. אסיפה שלא מן המניין מתכנסת לפי החלטת הוועד, ובחובה לדרישת ועדת הביקורת או עשירית מהחברים. לכל חבר קול אחד, וההחלטות ברוב רגיל של המצביעים (בכפוף לתקנון). האסיפה בוחרת את הוועד ואת ועדת הביקורת, ורשאית להעביר אותם מכהונתם","עמ' 20, 21, 22, 26, 28, 31"],["הוועד (הוועד המנהל)","מנהל את ענייני העמותה, ובידיו כל סמכות שלא יוחדה לאסיפה או למוסד אחר. חבריו פועלים לטובת העמותה במסגרת מטרותיה","עמ' 25, 27"],["ועדת ביקורת או גוף מבקר","בודקת את תקינות הפעולות ואת התאמתן למטרות, יעילות וחיסכון, ענייני כספים ושכר, ומביאה מסקנות לוועד ולאסיפה. האסיפה רשאית למנות במקומה רואה חשבון או גוף שאישר הרשם","עמ' 19(ב), 30, 31"],["רואה חשבון","חובה כשהמחזור השנתי עולה על 750,000 ₪, סכום צמוד למדד (בשנת 2026 כ-1.38 מיליון ₪). הדוח הכספי מוגש לאסיפה מבוקר","עמ' 19(ג), 37"]]},{"t":"law","law":"חוק העמותות","sec":"25","x":"הועד ינהל את עניני העמותה ובידיו תהיה כל סמכות שלא נתייחדה בחוק זה או בתקנון לאסיפה הכללית או למוסד אחר ממוסדות העמותה."},{"t":"p","x":"מי לא יכהן בוועד או בוועדת הביקורת (עמ' 33): מי שאינו חבר בעמותה; מי שנותן לה שירותים בשכר שלא כחבר ועד או ועדה; קטין, פסול דין או פושט רגל; ומי שהורשע בעבירות מסוימות. אדם אחד גם אינו יכול לכהן בו בזמן בוועד ובוועדת הביקורת (עמ' 32), כי המבקר לא יכול לבקר את עצמו."},{"t":"h","x":"איסור חלוקת רווחים"},{"t":"law","law":"חוק העמותות","sec":"34ג(א)","x":"עמותה אינה רשאית לבצע חלוקת רווחים לחבריה, במישרין או בעקיפין, לרבות למייסד העמותה, וכל חלוקת רווחים שבוצעה על ידה תיחשב לענין פרק זה כחלוקה אסורה."},{"t":"list","x":["<b>השבה:</b> חבר שקיבל חלוקה אסורה ישיב אותה, אלא אם לא ידע ולא היה עליו לדעת שהיא אסורה (עמ' 34ג(ב)).","<b>חריגים:</b> מתנה קטנת ערך וסבירה, וטובת הנאה שחבר מקבל כאחד מציבור הזכאים לשירותי העמותה (עמ' 34ג(ג)).","<b>אחריות חברי הוועד:</b> חבר ועד במועד החלוקה נחשב כמי שהפר את חובותיו, אלא אם הוכיח שהתנגד ונקט אמצעים סבירים למנוע אותה, או שלא ידע ולא היה עליו לדעת (עמ' 34ד).","<b>שכר מותר:</b> האסיפה רשאית להחליט על שכר לחברי הוועד, בכפוף לתקנות שהשר מתקין (עמ' 26א, 34א). השר רשאי לקבוע גם תקרת הוצאות ניהול (עמ' 34ב). שכר לעובדים בגבולות הסביר אינו ״חלוקת רווחים״."]},{"t":"example","title":"דוגמה: עודף בקופה","x":"לעמותת ״גינה קהילתית רמות״ נותר בסוף השנה עודף של 120,000 ₪. האסיפה הכללית מציעה לחלק 2,000 ₪ לכל חבר ״כהוקרה״. <b>פתרון:</b> זו חלוקת רווחים לחברים, ולכן חלוקה אסורה (עמ' 34ג(א)). חברים שקיבלו את הכסף וידעו, או היה עליהם לדעת, ישיבו אותו (עמ' 34ג(ב)). חברי הוועד שלא התנגדו ייחשבו כמי שהפרו את חובתם (עמ' 34ד). העודף צריך לשמש למטרות העמותה. שי סמלי קטן וסביר לחברים מותר (עמ' 34ג(ג))."},{"t":"h","x":"שינוי תקנון ומטרות"},{"t":"law","law":"חוק העמותות","sec":"11(א)","x":"עמותה רשאית לשנות את תקנונה, שמה ומטרותיה בהחלטת האסיפה הכללית שנתקבלה ברוב קולות הזכאים להצביע בה; החלטה לפי סעיף זה טעונה רישום בידי הרשם … תוקפה של ההחלטה מיום רישומה בידי הרשם."},{"t":"steps","title":"שינוי מטרות בעמותה","x":["הוועד מציג לאסיפה פירוט של הנכסים שנצברו למטרות העמותה ושל המחויבויות שהיא קיבלה על עצמה, כולל כלפי תורמים (עמ' 11(ב)).","האסיפה הכללית מחליטה (עמ' 11(א)–(ב)). התקנון רשאי לדרוש רוב גדול יותר או תנאים נוספים (עמ' 13).","<b>מטרה קרובה</b> למטרה המוחלפת או למטרות האחרות: נדרש רישום בידי הרשם, אם שוכנע שצודק ונכון לעשות כן (עמ' 11(ג)(1), (ד)).","<b>מטרה שאינה קרובה</b>: נדרש אישור בית המשפט, לאחר שהרשם הביע עמדה (עמ' 11(ג)(2), (ה)).","השינוי תקף רק מיום הרישום בידי הרשם (עמ' 11(א), (ו))."]},{"t":"h","x":"פיקוח: רשם העמותות"},{"t":"p","x":"פעם בשנה הוועד מכין דוח כספי ודוח מילולי. הם מובאים לאסיפה ומוגשים לרשם עד 30 ביוני בשנה שלאחר מכן, בחתימת שני חברי ועד (עמ' 36, 37א, 38). לדוח מצורף פירוט התשלומים לחמשת מקבלי השכר הגבוה ביותר (עמ' 36(ב)). לרשם סמכויות פיקוח (עמ' 39ב) וחקירה (עמ' 40). בית המשפט המחוזי רשאי להורות על פירוק העמותה, למשל כשפעולותיה מתנהלות בניגוד לחוק, למטרותיה או לתקנונה, או כשאינה יכולה לפרוע חובותיה (עמ' 49). בעילות מסוימות בקשת פירוק מוגשת רק אחרי שהרשם התרה בעמותה והיא לא תיקנה (עמ' 50(ב))."},{"t":"p","x":"<b>אישור ניהול תקין</b> הוא אישור שהרשם נותן לעמותה שמתנהלת לפי החוק ולפי הנחיותיו. האישור אינו מעוגן בחוק העמותות עצמו, אלא בנהלים ובדינים אחרים, אבל בפועל הוא תנאי לקבלת תמיכות ממשרדי ממשלה ולאמון של תורמים. הרשם רשאי לסרב לתת אותו או לשלול אותו, למשל בגלל שכר מופרז, צבירת נכסים שאינה משרתת את המטרות או אי-הגשת דוחות."},{"t":"law","law":"חוק העמותות","sec":"30(א)","x":"אלה תפקידי ועדת הביקורת או הגוף המבקר: … לבדוק את תקינות פעולות העמותה ומוסדותיה, לרבות התאמת פעולות העמותה למטרותיה; … לבדוק את השגת יעדי העמותה ביעילות ובחיסכון; … לעקוב אחר ביצוע החלטות האסיפה הכללית והוועד; … לבדוק את עניניה הכספיים של העמותה, את פנקסי החשבונות שלה ואת תשלומי השכר בה, לרבות ייעוד כספי העמותה לקידום מטרותיה;"},{"t":"law","law":"חוק העמותות","sec":"40(א)","x":"היה לרשם יסוד סביר להניח כי עמותה אינה מקיימת את ההוראות לפי חוק זה או שאינה מקיימת את הוראות תקנונה או את מטרותיה, רשאי הוא, לבקשת רבע מכלל חברי העמותה, לבקשת ועדת הביקורת או הגוף המבקר, לבקשת היועץ המשפטי לממשלה, או מיוזמתו, להחליט לפתוח בחקירה בענייניה של אותה עמותה"},{"t":"table","head":["","פיקוח פנימי","פיקוח חיצוני"],"rows":[["מי","ועדת הביקורת (או גוף מבקר), שנבחרת באסיפה הכללית (עמ' 19, 31); רואה חשבון כשהמחזור עולה על הסף (עמ' 19(ג), 37)","רשם העמותות ובית המשפט"],["מה עושה","בודקת תקינות, התאמה למטרות, יעילות וחיסכון, ענייני כספים ותשלומי שכר, ומדווחת לוועד ולאסיפה (עמ' 30). רואה החשבון מבקר את הדוח הכספי ומשתתף באסיפה שבה הוא נדון (עמ' 37)","הרשם מקבל דוחות (עמ' 36–38), מפקח (עמ' 39ב), פותח בחקירה (עמ' 40), נותן או שולל אישור ניהול תקין, ופונה לבית המשפט לפירוק (עמ' 49–50)"],["כלים מיוחדים","ועדת הביקורת רשאית לבקש מהרשם לפתוח בחקירה (עמ' 40(א)); הרשם רשאי, לבקשתה, לחייב ביקורת רו״ח גם בעמותה קטנה (עמ' 37(ב))","שכר מופרז או הוצאות שאינן משרתות את המטרות עלולים להיחשב ״שימוש אסור״ בכספי העמותה, ולהוביל לשלילת האישור ואף לבקשת פירוק"]]},{"t":"list","x":["<b>שכר והוצאות ניהול:</b> מותר לעמותה לשלם שכר לעובדים, ובתנאים שנקבעו גם לחברי ועד (עמ' 26א, 34א), אבל בגבולות הסביר. השר רשאי לקבוע תקרה להוצאות הניהול ביחס למחזור (עמ' 34ב). לפי ההנחיות שהוצגו בהרצאה, הוצאות ההנהלה, כולל שכר בכירים, לא יעלו על 22% מהמחזור בעמותה שמחזורה עד 10 מיליון ₪, והשיעור יורד ככל שהמחזור גדל.","<b>מה בודק הרשם כשהוא בוחן שכר?</b> לפי ההרצאה: גודל המחזור, שיעור התמיכות מהמדינה, שיעור הוצאות ההנהלה, איכות הניהול (למשל היעדר גירעון וגידול בפעילות) וכישורי העובד.","<b>צבירת נכסים:</b> מותר לצבור נכסים כדי לקדם את המטרות. צבירה בלתי סבירה לאורך זמן, בלי תכנית לשימוש בהם למטרות העמותה, פוגעת באפשרות לקבל אישור ניהול תקין."]},{"t":"h","x":"חברה לתועלת הציבור (חל״צ)"},{"t":"law","law":"חוק החברות","sec":"345א(א)","x":"חברה לתועלת הציבור היא חברה שבתקנונה נקבעו מטרות ציבוריות בלבד וכן איסור על חלוקת רווחים או חלוקה אחרת לבעלי מניותיה (בפרק זה – חלוקת רווחים)."},{"t":"list","x":["<b>מטרות ציבוריות בלבד</b>, מתוך התוספת השנייה לחוק החברות, כגון חינוך, בריאות, רווחה, מדע ותרבות (ס' 345א(ב)).","<b>רישום:</b> אצל רשם החברות, ובנוסף אישור <b>רשם ההקדשות</b> שהתקנון תואם את הפרק. מצרפים גם הצהרה של חברי ועדת הביקורת הראשונים (ס' 345ב(א)–(ב)).","<b>שם:</b> בצד השם מציינים ״חברה לתועלת הציבור״ או ״(חל״צ)״ (ס' 345ד).","<b>איסור חלוקה מוחלט</b>, כולל ליזם (ס' 345ז(א)). חריג: מתנה קטנת ערך וסבירה (ס' 345ז(ב)).","<b>ועדת ביקורת</b> שממנה האסיפה הכללית. נושאי משרה לא יהיו חברים בה (ס' 345ח(א)). <b>מבקר פנימי</b> חובה כשהמחזור עולה על 10 מיליון ₪ (ס' 345ט).","<b>אין פטור או שיפוי</b> מראש בשל הפרת חובת הזהירות (ס' 345יג(א)).","<b>שינוי מטרות:</b> מטרה קרובה טעונה רישום בידי רשם ההקדשות; מטרה שאינה קרובה טעונה אישור בית המשפט (ס' 345ה(ג))."]},{"t":"table","head":["נושא","עמותה","חל״צ","חברה עסקית"],"rows":[["חוק","חוק העמותות","חוק החברות, ס' 345א ואילך","חוק החברות"],["מייסדים","2 בגירים לפחות (עמ' 1)","אחד לפחות (ס' 3)","אחד לפחות (ס' 3)"],["מטרה","כל מטרה חוקית שאינה לחלוקת רווחים (עמ' 1)","מטרות ציבוריות בלבד, מהתוספת השנייה (ס' 345א)","השאת רווחים (ס' 11(א))"],["חלוקת רווחים","אסורה (עמ' 34ג)","אסורה (ס' 345ז)","מותרת במבחני החלוקה (ס' 302)"],["פיקוח","רשם העמותות","רשם החברות ורשם ההקדשות","רשם החברות"],["סיומת","״עמותה״ / ״(ע״ר)״ (עמ' 8א)","״חברה לתועלת הציבור״ / ״(חל״צ)״ (ס' 345ד)","״בע״מ״ אם האחריות מוגבלת (ס' 26)"],["שינוי מטרות","רשם (מטרה קרובה) או בית משפט (עמ' 11(ג))","רשם ההקדשות (מטרה קרובה) או בית משפט (ס' 345ה(ג))","שינוי תקנון באסיפה, תקף ברישום (ס' 20, 40)"]]},{"t":"trap","x":"<b>עמותה ≠ מטרה ציבורית.</b> לעמותה מספיקה מטרה חוקית שאינה לחלוקת רווחים, גם אם היא פרטית. חל״צ חייבת מטרות ציבוריות <b>בלבד</b>. מלכודת נוספת: גם חל״צ וגם עמותה אינן מחלקות רווחים, אבל רק חל״צ היא <b>חברה</b>, ולכן אפשר להקים אותה עם בעל מניה יחיד."},{"t":"example","title":"דוגמה: גיוס לטיפול רפואי","x":"שכנים רוצים לגייס כסף לניתוח של ילד מהשכונה. <b>פתרון:</b> מטרה כזו אינה ״ציבורית״ במובן התוספת השנייה, ולכן חל״צ אינה מתאימה. עמותה מתאימה, כי די במטרה חוקית שאינה לחלוקת רווחים (עמ' 1). נדרשים לפחות שני מייסדים בגירים. הכספים ישמשו את המטרה ולא יחולקו לחברים (עמ' 34ג)."},{"t":"exam","x":"נושא העמותות נבחן בעיקר באמריקאיות: מספר מייסדים (עמ' 1), גיל חברות (עמ' 15), חברות אישית (עמ' 17), מוסדות חובה (עמ' 19(א)), שינוי מטרות ברשם או בבית משפט (עמ' 11(ג)), ואיסור חלוקה (עמ' 34ג), וכן השוואה לחל״צ (ס' 345א, 345ז). בשאלה פתוחה על חלוקה או שכר בעמותה, הראו: הכלל (עמ' 34ג), ההשבה וחריגיה, אחריות חברי הוועד (עמ' 34ד), תפקיד ועדת הביקורת (עמ' 30), ופיקוח הרשם עד פירוק (עמ' 40, 49–50)."}],"mcq":[{"id":"u13-1","q":"מי רשאים לייסד עמותה?","o":["שני בני אדם או יותר, שהם בגירים.","אדם אחד בגיר.","כל תאגיד לבדו.","עשרים בני אדם לכל היותר.","שבעה בני אדם לפחות."],"a":0,"why":"עמ' 1: ״שני בני אדם או יותר, שהם בגירים … רשאים לייסד עמותה״.","w":["","נדרשים לפחות שניים.","ס' 1 מדבר על ״בני אדם בגירים״ כמייסדים. תאגיד יכול להיות חבר (עמ' 15), אבל לא מייסד יחיד.","אין מגבלה עליונה. תקרת עשרים היא של שותפים כלליים בשותפות (שות' 3).","שבעה הוא המספר שבחומר הקורס לאגודה שיתופית, לא לעמותה."],"secs":["עמ' 1"]},{"id":"u13-2","q":"קבוצת חברים מבקשת להקים עמותה כדי לממן טיפול רפואי לחבר שנפגע בתאונה. מה נכון?","o":["אי אפשר, כי מטרת עמותה חייבת להיות ציבורית.","אפשר רק באישור בית המשפט.","אפשר רק כחל״צ.","אפשר, כי די במטרה חוקית שאינה מכוונת לחלוקת רווחים בין החברים.","אפשר רק אם המטרה מופיעה בתוספת השנייה לחוק החברות."],"a":3,"why":"עמ' 1 דורש ״מטרה חוקית שאינה מכוונת לחלוקת רווחים בין חבריו ושמטרתו העיקרית אינה עשיית רווחים״, ואינו דורש מטרה ציבורית.","w":["אין דרישה למטרה ציבורית.","אין דרישה כזו.","חל״צ דווקא מחייבת מטרות ציבוריות בלבד (ס' 345א).","","התוספת השנייה רלוונטית לחל״צ."],"secs":["עמ' 1","345א"]},{"id":"u13-3","q":"דנה, בת 17, מבקשת להצטרף לעמותה. הוריה מתנגדים. מה נכון?","o":["דנה כשירה רק בהסכמת הוריה.","דנה כשירה להיות חברה, והצטרפותה והצבעתה אינן טעונות הסכמת נציגה.","דנה אינה כשירה להיות חברה עד גיל 18.","רק תאגידים ובגירים כשירים להיות חברים.","דנה כשירה להיות חברה אך אינה רשאית להצביע."],"a":1,"why":"עמ' 15(א): כל אדם שמלאו לו 17 שנים כשיר להיות חבר עמותה. עמ' 15(ב): הצטרפות של קטין והצבעתו באסיפה אינן טעונות הסכמת נציגו.","w":["עמ' 15(ב) קובע במפורש שאין צורך בהסכמה.","","הגיל הקובע הוא 17.","גם בני 17 כשירים.","היא רשאית להצביע."],"secs":["עמ' 15"]},{"id":"u13-4","q":"יוסי, חבר ותיק בעמותה, נפטר. בנו מבקש להיכנס לחברות במקומו ולקבל ״את חלקו של אביו בנכסי העמותה״. מה נכון?","o":["הבן נכנס לחברות אך אינו מקבל נכסים.","הדבר תלוי בהחלטת הוועד.","הבן נכנס לחברות מכוח הירושה ומקבל את חלק האב.","הבן מקבל את חלק האב בנכסים, אך לא את החברות.","החברות אינה עוברת בירושה, ולחבר אין חלק בנכסי העמותה שניתן להוריש."],"a":4,"why":"עמ' 17: ״החברות בעמותה היא אישית, אינה ניתנת להעברה ואינה עוברת בירושה״. חלוקה לחברים אסורה (עמ' 34ג), ולכן אין ״חלק בנכסים״ להוריש.","w":["החברות אינה עוברת בירושה. הבן יכול להצטרף כחבר חדש לפי תנאי התקנון (עמ' 16), אבל לא כיורש.","הוועד אינו יכול לסטות מהוראת עמ' 17.","החברות אינה עוברת בירושה.","תשלום כזה הוא חלוקה אסורה (עמ' 34ג).",""],"secs":["עמ' 17","עמ' 34ג"]},{"id":"u13-5","q":"מה מהבאים חייב להתקיים בכל עמותה?","o":["אסיפת נציגים.","אסיפה כללית, ועד וועדת ביקורת (או גוף מבקר במקומה).","ועד בלבד.","דירקטוריון ומנכ״ל.","מבקר פנימי ורואה חשבון בכל עמותה."],"a":1,"why":"עמ' 19(א): לכל עמותה תהיה אסיפה כללית, ועד וועדת ביקורת. לפי עמ' 19(ב) האסיפה רשאית למנות במקום ועדת הביקורת רואה חשבון או גוף שאישר הרשם.","w":["אסיפת נציגים היא אפשרות לעמותה שבה יותר מ-200 חברים, אם נקבע בתקנון (עמ' 24).","","נדרשים גם אסיפה כללית וועדת ביקורת.","אלה אורגנים של חברה. בעמותה הגוף המנהל הוא ״הוועד״.","רואה חשבון חובה רק מעל סף המחזור (עמ' 19(ג))."],"secs":["עמ' 19"]},{"id":"u13-6","q":"עמותה לקידום ספורט נוער מבקשת להחליף את מטרתה למטרה של מחקר רפואי, שאינה קרובה למטרותיה הקיימות. מה נדרש?","o":["החלטת האסיפה הכללית ורישום בידי הרשם בלבד.","הסכמת כל התורמים בכתב.","החלטת האסיפה הכללית, לאחר שהוועד הציג פירוט נכסים ומחויבויות, ואישור בית המשפט. השינוי תקף מיום רישומו.","החלטת ועד העמותה בלבד.","אישור רשם ההקדשות."],"a":2,"why":"עמ' 11(ב): האסיפה מחליטה לאחר שהוועד הציג את הנכסים והמחויבויות. עמ' 11(ג)(2): כשהמטרה אינה קרובה, נדרש אישור בית המשפט. עמ' 11(א), (ו): ההחלטה נרשמת ותוקפה מיום הרישום.","w":["רישום בידי הרשם בלבד מספיק רק כשהמטרה קרובה (עמ' 11(ג)(1)).","הוועד מציג את המחויבויות לתורמים, אבל החוק אינו דורש את הסכמתם.","","הסמכות היא של האסיפה הכללית (עמ' 11(א)).","רשם ההקדשות מטפל בחל״צ (ס' 345ה), לא בעמותה."],"secs":["עמ' 11"]},{"id":"u13-7","q":"עמותה חילקה לכל אחד מחבריה 3,000 ₪ מעודפי השנה. רונן, חבר, קיבל את הכסף. מה נכון?","o":["זו חלוקה אסורה, ורונן חייב להשיב את הכסף, אלא אם לא ידע ולא היה עליו לדעת שהחלוקה אסורה.","רונן אינו חייב להשיב בשום מקרה. רק חברי הוועד אחראים.","החלוקה מותרת, אם העמותה עומדת במבחן יכולת הפירעון.","החלוקה מותרת, אם האסיפה הכללית אישרה אותה.","החלוקה מותרת, כי מדובר בעודפים ולא ברווחים."],"a":0,"why":"עמ' 34ג(א): עמותה אינה רשאית לחלק רווחים לחבריה, במישרין או בעקיפין. עמ' 34ג(ב): חבר ישיב את שקיבל, ״זולת אם לא ידע ולא היה עליו לדעת כי החלוקה שבוצעה אסורה״.","w":["","גם החבר חייב בהשבה (עמ' 34ג(ב)). חברי הוועד נושאים באחריות נוספת (עמ' 34ד).","מבחני החלוקה של חוק החברות אינם חלים על עמותה. עליה חל איסור מוחלט.","אישור האסיפה אינו מכשיר חלוקה אסורה.","חלוקת עודפים לחברים היא בדיוק החלוקה האסורה."],"secs":["עמ' 34ג","עמ' 34ד"]},{"id":"u13-8","q":"שרית היא רואת החשבון החיצונית שמקבלת שכר מהעמותה על הנהלת החשבונות שלה. העמותה מבקשת למנות אותה גם לחברת הוועד. מה נכון?","o":["מותר, אם היא מוותרת על השכר לשנה אחת.","מותר, אם האסיפה הכללית מאשרת ברוב מיוחד.","אסור: מי שנותן לעמותה שירותים בשכר, שלא כחבר ועד, לא יכהן כחבר ועד.","מותר, כי היא מכירה היטב את העמותה.","מותר, אם היא חברה בעמותה."],"a":2,"why":"עמ' 33(א)(2): לא יכהן כחבר ועד ״מי שנותן שירותים לעמותה בשכר שלא כחבר הועד״.","w":["הפסלות חלה כל עוד היא נותנת שירותים בשכר.","אין חריג של רוב מיוחד.","","הפסלות קבועה בחוק.","חברות בעמותה היא תנאי הכרחי (עמ' 33(א)(1)) אבל לא מספיק. הפסלות של עמ' 33(א)(2) חלה בנפרד."],"secs":["עמ' 33"]},{"id":"u13-9","q":"בעמותה 300 חברים. 35 מהם דרשו בכתב מהוועד לכנס אסיפה כללית שלא מן המניין. מה נכון?","o":["הוועד חייב לכנס, כי הדרישה הוגשה בידי יותר מעשירית מהחברים.","הוועד רשאי לסרב, כי נדרשת דרישה של רבע מהחברים.","רק ועדת הביקורת רשאית לדרוש כינוס.","רק הרשם רשאי לכנס אסיפה שלא מן המניין.","הוועד חייב לכנס רק אם 51% מהחברים דורשים."],"a":0,"why":"עמ' 20(ב): הוועד חייב לכנס אסיפה שלא מן המניין לפי דרישה בכתב של ועדת הביקורת, של הגוף המבקר, או ״של עשירית מכלל חברי העמותה״. עשירית מ-300 היא 30, ו-35 עוברים את הסף.","w":["","הסף הוא עשירית. רבע מהחברים הוא סף לבקשת חקירה מהרשם (עמ' 40(א)).","גם עשירית מהחברים רשאית לדרוש.","הרשם מכנס רק כשהאסיפה לא כונסה כדין (עמ' 20(ג)).","אין בסיס לכך."],"secs":["עמ' 20"]},{"id":"u13-10","q":"מה מבחין בין חל״צ לבין עמותה?","o":["חל״צ מציינת ״(ע״ר)״ בשמה.","חל״צ היא חברה לפי חוק החברות שבתקנונה מטרות ציבוריות בלבד, ורישומה טעון אישור רשם ההקדשות. עמותה קמה לפי חוק העמותות למטרה חוקית שאינה חייבת להיות ציבורית.","עמותה רשאית לחלק רווחים, אם מטרתה העיקרית אינה עשיית רווחים.","רק חל״צ אסורה בחלוקת רווחים.","עמותה יכולה להיות עם חבר יחיד, וחל״צ לא."],"a":1,"why":"ס' 345א(א) ו-345ב(ב) לחוק החברות לעומת עמ' 1.","w":["חל״צ מציינת ״חברה לתועלת הציבור״ או ״(חל״צ)״ (ס' 345ד).","","חלוקה לחברי עמותה אסורה (עמ' 34ג).","שתיהן אסורות בחלוקה (ס' 345ז; עמ' 34ג).","זה הפוך: עמותה דורשת שני מייסדים (עמ' 1), וחל״צ היא חברה שיכולה להיות עם בעל מניה אחד (ס' 3)."],"secs":["345א","345ב","עמ' 1"]},{"id":"u13-11","q":"דירקטוריון חל״צ מבקש לתת לדירקטורים כתב פטור מראש מאחריות בשל הפרת חובת הזהירות. מה נכון?","o":["מותר, אם האסיפה הכללית מאשרת ברוב רגיל.","מותר, אם התקנון מתיר זאת, כמו בכל חברה.","מותר רק לדירקטורים חיצוניים.","אסור: חל״צ אינה רשאית לפטור נושא משרה או חבר ועדת ביקורת מאחריות בשל הפרת חובת הזהירות, ולא לתת התחייבות לשיפוי בשלה.","מותר, באישור רשם ההקדשות."],"a":3,"why":"ס' 345יג(א): ״על אף הוראות סעיף 258(ב), חברה לתועלת הציבור אינה רשאית לפטור נושא משרה או חבר ועדת ביקורת בה מאחריותו בשל הפרת חובת הזהירות כלפיה או לתת התחייבות לשיפוי עקב הפרת חובת הזהירות״.","w":["האיסור מוחלט.","ס' 345יג(א) גובר על הכלל הרגיל.","אין חריג כזה.","","אין מנגנון כזה."],"secs":["345יג"]},{"id":"u13-12","q":"לרשם העמותות יש חשד שעמותה פועלת בניגוד למטרותיה, והוא שוקל לבקש את פירוקה בשל כך. מה נכון?","o":["רק חברי העמותה רשאים לבקש פירוק.","בית המשפט המחוזי מוסמך לצוות על פירוק, ובעילה זו הבקשה תוגש רק אחרי שהרשם התרה בעמותה בכתב לתקן והיא לא תיקנה בזמן סביר.","די בהחלטת ועדת הביקורת כדי לפרק.","הרשם רשאי להורות בעצמו על פירוק.","אי אפשר לפרק עמותה בשל פעולה בניגוד למטרותיה."],"a":1,"why":"עמ' 49(1): בית המשפט המחוזי רשאי לצוות על פירוק כשפעולות העמותה מתנהלות בניגוד לחוק, למטרותיה או לתקנונה. עמ' 50(ב): בעילה זו לא תוגש בקשה אלא אחרי שהרשם התרה בעמותה בכתב והיא לא תיקנה.","w":["הבקשה מוגשת בידי היועץ המשפטי לממשלה או הרשם, ובעילות מסוימות גם בידי נושה או העמותה עצמה (עמ' 50(א)).","","ועדת הביקורת אינה מוסמכת לפרק.","הפירוק נעשה בצו בית משפט (עמ' 49).","זו עילה מפורשת (עמ' 49(1))."],"secs":["עמ' 49","עמ' 50"]},{"id":"u13-13","q":"לחברי עמותה יש חשד שהוועד מוציא את כספי העמותה שלא לפי מטרותיה. מי רשאי לבקש מרשם העמותות לפתוח בחקירה בענייני העמותה?","o":["רק חבר ועד.","עשירית מחברי העמותה.","רק בית המשפט המחוזי.","רבע מכלל חברי העמותה, ועדת הביקורת, או היועץ המשפטי לממשלה; והרשם רשאי גם מיוזמתו.","רק רואה החשבון של העמותה."],"a":3,"why":"עמ' 40(א): הרשם רשאי לפתוח בחקירה, כשיש לו יסוד סביר להניח שהעמותה אינה מקיימת את החוק, את תקנונה או את מטרותיה, לבקשת רבע מכלל החברים, לבקשת ועדת הביקורת, לבקשת היועץ המשפטי לממשלה, או מיוזמתו.","w":["חבר ועד אינו מופיע ברשימת המבקשים בעמ' 40(א).","עשירית מהחברים רשאים לדרוש כינוס אסיפה שלא מן המניין (עמ' 20(ב)) או לבקש ביקורת רו״ח (עמ' 37(ב)), אבל לבקשת חקירה נדרש רבע (עמ' 40(א)).","החקירה היא סמכות של הרשם, לא של בית המשפט (עמ' 40).","","רואה החשבון אינו מנוי בעמ' 40(א)."],"secs":["עמ' 40"]},{"id":"u13-14","q":"מהו ״אישור ניהול תקין״ של עמותה?","o":["תעודת הרישום שהרשם נותן לעמותה ביום הקמתה.","אישור שנותן רשם העמותות לעמותה שמתנהלת לפי החוק והנחיותיו, ובפועל משמש תנאי לקבלת תמיכות מגופים ממשלתיים ולאמון תורמים; הרשם רשאי לסרב לתת אותו או לשלול אותו.","אישור שנותנת ועדת הביקורת של העמותה בסוף כל שנה.","אישור של בית המשפט לשינוי מטרות העמותה.","אישור שמחייב את העמותה לחלק את עודפיה לחבריה."],"a":1,"why":"אישור ניהול תקין ניתן בידי הרשם לעמותה שנמצא שהיא מתנהלת כדין. הוא אינו מעוגן בחוק העמותות עצמו, אבל בפועל הוא ״תו תקן״ לקבלת תמיכות ותרומות. הרשם רשאי לא לתת אותו או לשלול אותו, למשל בשל שכר מופרז או שימוש בכספים שלא למטרות.","w":["תעודת הרישום היא ראיה שהעמותה נוסדה כדין (עמ' 7). זה אישור אחר.","","ועדת הביקורת היא גוף פנימי (עמ' 30). האישור ניתן בידי הרשם.","שינוי מטרות שאינן קרובות טעון אישור בית משפט (עמ' 11(ג)(2)), וזה עניין נפרד.","חלוקת רווחים לחברים אסורה (עמ' 34ג)."],"secs":["עמ' 30","עמ' 34ג"]},{"id":"u13-15","q":"איזה מהבאים אינו מתפקידי ועדת הביקורת של עמותה?","o":["לבדוק את התאמת פעולות העמותה למטרותיה.","לבדוק את תשלומי השכר בעמותה ואת ייעוד כספיה.","לנהל את ענייני העמותה השוטפים ולהחליט על התקשרויות עם ספקים.","לעקוב אחר ביצוע החלטות האסיפה הכללית והוועד.","לבדוק אם יעדי העמותה מושגים ביעילות ובחיסכון."],"a":2,"why":"ניהול ענייני העמותה הוא תפקיד הוועד (עמ' 25). ועדת הביקורת מבקרת ואינה מנהלת (עמ' 30(א)). לכן אדם אחד גם אינו יכול לכהן בו בזמן בוועד ובוועדת הביקורת (עמ' 32).","w":["זה תפקיד מפורש (עמ' 30(א)(1)).","זה תפקיד מפורש (עמ' 30(א)(5)).","","זה תפקיד מפורש (עמ' 30(א)(3)).","זה תפקיד מפורש (עמ' 30(א)(2))."],"secs":["עמ' 25","עמ' 30"]}],"cases":[{"id":"u13-c1","title":"עמותת ״לב חם״","facts":"עמותת ״לב חם״ (ע״ר) מפעילה בית תמחוי בחיפה. במחזור 2025 גייסה 2.5 מיליון ₪, בעיקר מתרומות ומתמיכת משרד הרווחה. יו״ר הוועד, משה, מייסד העמותה, מקבל ״דמי ייעוץ״ של 25,000 ₪ לחודש דרך חברה שבבעלותו, שמספקת לעמותה ״שירותי ניהול״. חברת ועדת הביקורת, אסתר, היא אשתו של גזבר העמותה וגם חברה בוועד. בסוף השנה החליט הוועד לחלק לכל אחד מעשרת החברים הוותיקים 5,000 ₪ ״כהוקרה״. העמותה לא מינתה רואה חשבון. כעת הוועד רוצה לשנות את מטרת העמותה ל״קידום יזמות צעירה״ ולהעביר לשם את יתרת התרומות.","parts":[{"q":"דונו בפגמים בהתנהלות העמותה ובתוצאותיהם. נמקו והפנו לסעיפי החוק.","pts":25,"model":["1. דמי הייעוץ למשה: מי שנותן לעמותה שירותים בשכר שלא כחבר ועד לא יכהן כחבר ועד (עמ' 33(א)(2)). כאן השירות ניתן דרך חברה בבעלותו, וזו עקיפה של הכלל. שכר לחברי ועד טעון החלטת אסיפה, בכפוף לתקנות (עמ' 26א, 34א). תשלום מופרז או מוסווה עלול להיחשב חלוקה אסורה ״בעקיפין״ למייסד (עמ' 34ג(א)), ולפגוע באישור הניהול התקין.","2. אסתר: אדם לא יכהן בו בזמן כחבר ועד וכחבר ועדת ביקורת (עמ' 32). מינויה לוועדה פסול. בנוסף, הקרבה לגזבר פוגעת בעצמאות הביקורת על תפקידי הוועדה (עמ' 30).","3. ״ההוקרה״: חלוקת 5,000 ₪ לכל חבר היא חלוקת רווחים אסורה (עמ' 34ג(א)), ואינה ״מתנה קטנת ערך״ (עמ' 34ג(ג)). החברים ישיבו את הכסף, אלא אם לא ידעו ולא היה עליהם לדעת (עמ' 34ג(ב)). חברי הוועד ייחשבו כמי שהפרו את חובתם, אלא אם הוכיחו שהתנגדו ונקטו אמצעים סבירים, או שלא ידעו (עמ' 34ד).","4. רואה חשבון: המחזור (2.5 מיליון ₪) עולה על הסף הצמוד של עמ' 19(ג) (750,000 ₪ צמוד, כ-1.38 מיליון ₪ ב-2026). לכן העמותה חייבת למנות רואה חשבון, והדוח הכספי צריך להיות מבוקר (עמ' 37(א)).","5. תוצאות: הרשם רשאי לחקור (עמ' 40), לפעול להשבה ולשלול את אישור הניהול התקין. אם לא תתקן העמותה אחרי התראה, ניתן לבקש פירוק בשל התנהלות בניגוד לחוק (עמ' 49(1), 50(ב))."],"check":["פסלות נותן שירותים בשכר – עמ' 33(א)(2) + שכר ועד עמ' 26א","ייחוד כהונות – עמ' 32","חלוקה אסורה + השבה + אחריות ועד – עמ' 34ג, 34ד","חובת רו״ח – עמ' 19(ג)","פיקוח הרשם ופירוק – עמ' 40, 49, 50"]},{"q":"האם הוועד רשאי לשנות את המטרה כמתוכנן ולהעביר את יתרת התרומות? מה ההליך הנדרש?","pts":10,"model":["1. שינוי מטרות אינו בסמכות הוועד. הוא טעון החלטת אסיפה כללית (עמ' 11(א)).","2. לפני ההחלטה הוועד מציג לאסיפה פירוט של הנכסים שנצברו למטרות הקיימות ושל המחויבויות, כולל כלפי התורמים ומשרד הרווחה (עמ' 11(ב)).","3. ״קידום יזמות צעירה״ אינה מטרה קרובה להפעלת בית תמחוי, ולכן נדרש אישור בית המשפט, לאחר שהרשם הביע עמדה (עמ' 11(ג)(2), (ה)).","4. בית המשפט יאשר רק אם צודק ונכון לעשות כן, וייתכן שיתנה זאת בכך שהתרומות שנאספו למטרת התמחוי ימשיכו לשמש אותה.","5. השינוי תקף רק מיום רישומו בידי הרשם (עמ' 11(א), (ו)). עד אז, העברת כספים למטרה החדשה היא פעולה מחוץ למטרות."],"check":["סמכות האסיפה – עמ' 11(א)","הצגת נכסים ומחויבויות – עמ' 11(ב)","מטרה לא קרובה → בית משפט – עמ' 11(ג)(2)","תוקף מרישום"]}]}]},{"id":"u14","title":"איך עונים על שאלה פתוחה במבחן","short":"שיטת התשובה הפתוחה","blurb":"תדעו לפרק תרחיש של מבחן לצדדים ולסיווגים, לכתוב תשובה מובנית (סוגיה ← דין ← יישום ← תוצאה ← מסקנה) בתוך 15 שורות, ולהימנע מהטעויות שעולות בנקודות.","secs":["1","6","20","117","191","192","193","194","252","253","254","255","256","259","263","268","269","270","275","278","280","302","310","311"],"blocks":[{"t":"h","x":"מבנה המבחן ומה הבודק מחפש"},{"t":"p","x":"במבחנים של הקורס יש בדרך כלל <b>חלק פתוח של 80 נקודות</b>: תרחיש אחד עם ארבעה סעיפים של 20 נקודות, כל אחד מוגבל ל-15 שורות, או שאלה אחת ארוכה של עד 40 שורות. לצדו <b>4 שאלות אמריקאיות</b> של 5 נקודות כל אחת. הבדיקה בשאלה הפתוחה נעשית לפי <b>מחוון</b>: רשימת נקודות, שבכל אחת סוגיה, סעיף ויישום. מכאן הכלל החשוב ביותר: <b>כל משפט שלכם צריך ״לקנות״ נקודה במחוון</b>. משפט שרק חוזר על העובדות או מתאר את ״חשיבות דיני החברות״ לא מקבל ניקוד ותופס מקום. חריגה ממגבלת המקום לא נקראת ואף גוררת הפחתה."},{"t":"h","x":"השיטה בשישה צעדים"},{"t":"steps","title":"מתרחיש לתשובה","x":["<b>מפת צדדים</b>: מי החברה (ציבורית או פרטית), מי בעל המניות ומה אחוז ההחזקה, מי נושא משרה ובאיזה תפקיד, ומי קרוב של מי. סמנו על השאלה.","<b>סיווג</b>: לכל דמות ולכל אירוע שאלו: נושא משרה? בעל שליטה? יש עניין אישי? העסקה חריגה? זו ״חלוקה״? איזה סוג עסקה לפי ס' 270?","<b>הדין</b>: הכלל המשפטי, עם מספר סעיף מדויק (ובפסיקה, כשהשאלה מבקשת).","<b>יישום</b>: חיבור כל רכיב בכלל לעובדה מהתרחיש (״כאן…, משום ש…״). כאן נמצאת רוב הנקודות.","<b>תוצאה / סעד</b>: מה קורה אם הדרישה לא קוימה: חוסר תוקף (ס' 280), השבה (ס' 310), אחריות (ס' 311, ס' 256), פיצויים, ביטול, תביעה נגזרת (ס' 194).","<b>מסקנה</b>: משפט אחד שעונה בדיוק על מה שנשאל (״לכן, כדי שנעמה תקבל את השכר נדרש…״)."]},{"t":"table","head":["שאלת הסיווג","איך מכריעים","סעיף"],"rows":[["האם X נושא משרה?","מנכ״ל, משנה או סגן מנכ״ל, ממלא תפקיד כזה אף אם תוארו שונה, דירקטור, או מנהל הכפוף <b>במישרין</b> למנכ״ל","ס' 1 ״נושא משרה״"],["האם X בעל שליטה?","יכולת לכוון את פעילות החברה; חזקה: מחצית או יותר מאמצעי השליטה. לעניין אישור עסקאות: גם 25% ומעלה כשאין מחזיק אחר מעל 50%","ס' 1 (מפנה לחוק ניירות ערך); ס' 268"],["ציבורית או פרטית?","מניות רשומות למסחר או הוצעו בתשקיף ומוחזקות בציבור","ס' 1"],["יש עניין אישי?","עניין של X, של קרובו, או של תאגיד שהוא או קרובו בעלי עניין בו; לא עניין שנובע רק מהחזקת מניות","ס' 1 ״ענין אישי״, ״קרוב״"],["העסקה חריגה?","אינה במהלך העסקים הרגיל, אינה בתנאי שוק, או עשויה להשפיע מהותית. ועדת הביקורת מסווגת","ס' 1; ס' 117(1א)"],["איזה מסלול אישור?","עסקה עם נושא משרה או שיש לו בה עניין אישי; תנאי כהונה; עסקה חריגה עם בעל שליטה בחברה ציבורית","ס' 270(1)–(4); ס' 271–275"],["זו ״חלוקה״?","דיבידנד, כולל העברה ללא תמורה שוות ערך, או רכישה של מניות החברה","ס' 1; ס' 302"],["איזו חובה הופרה?","נושא משרה: זהירות (ס' 252–253) ואמונים (ס' 254). בעל מניה: תום לב (ס' 192). בעל שליטה: הגינות (ס' 193)","ס' 252–254, ס' 192–193"]]},{"t":"h","x":"תבנית כתיבה (IRAC)"},{"t":"p","x":"השתמשו בתבנית קבועה לכל סוגיה. היא חוסכת זמן, והבודק מוצא בה מהר את הנקודות: <b>סוגיה</b> (במשפט אחד) ← <b>דין</b> (סעיף) ← <b>יישום</b> (עובדה ← רכיב) ← <b>תוצאה</b> ← <b>מסקנה</b>."},{"t":"example","title":"תבנית משפטים מוכנה","x":"<b>סוגיה</b>: ״הסוגיה היא אם ההתקשרות עם… טעונה אישורים מיוחדים.״ <b>דין</b>: ״לפי ס' 270(4), עסקה חריגה של חברה ציבורית עם אדם אחר שלבעל השליטה עניין אישי בה טעונה אישור ועדת ביקורת ← דירקטוריון ← אסיפה ברוב מיוחד (ס' 275(א)).״ <b>יישום</b>: ״נעמה מחזיקה 48% ואין מחזיק אחר מעל 50%, ולכן היא בעלת שליטה לעניין זה (ס' 268). אחיה ״קרוב״ (ס' 1), ולכן יש לה עניין אישי. ההסכם בלעדי, לחמש שנים ובמיליוני שקלים, ולכן חריג.״ <b>תוצאה</b>: ״העסקה אושרה בדירקטוריון בלבד, ולכן היא חסרת תוקף (ס' 280(א)).״ <b>מסקנה</b>: ״נדרש אישור האסיפה ברוב מיוחד, ואישור מחדש אחת לשלוש שנים (ס' 275(א1)).״"},{"t":"h","x":"איך נכנסים ב-15 שורות"},{"t":"list","x":["<b>אל תעתיקו את העובדות.</b> הזכירו עובדה רק כשהיא מיישמת רכיב בכלל (״48% ואין מחזיק מעל 50%, ולכן…״).","<b>סוגיה אחת, שורה עד שתיים.</b> בסעיף של 20 נקודות יש בדרך כלל 4–6 נקודות במחוון. זהו אותן לפני שאתם כותבים.","<b>מספרי סעיפים בסוגריים</b> במקום ציטוטים ארוכים: ״(ס' 275(א)(3))״.","<b>חצים למסלולי אישור</b>: ״ועדת ביקורת ← דירקטוריון ← אסיפה (רוב מיוחד)״.","<b>סדר לפי משקל.</b> הסוגיה המרכזית קודם, ״נקודות בונוס״ (למשל הרמת מסך או ס' 6(ג)) בסוף, אם נשאר מקום.","<b>״בחרו את הפרוצדורה המחמירה ביותר״.</b> כשהשאלה מנחה כך, ציינו את המסלול המחמיר, ובחצי משפט את ההנחה שמובילה אליו (למשל ״בהנחה שהעסקה חריגה״).","<b>סיימו כל סוגיה בתוצאה.</b> ״לכן העסקה חסרת תוקף״ שווה נקודה; ״יש בעיה״ לא שווה כלום."]},{"t":"h","x":"מפת הסעיפים המרכזיים"},{"t":"table","head":["נושא","סעיפים","הכלל במשפט"],"rows":[["הגדרות מפתח","ס' 1","נושא משרה, ענין אישי, קרוב, עסקה חריגה, חלוקה, דיבידנד, חברה ציבורית, תנאי כהונה והעסקה"],["הרמת מסך","ס' 6(א)–(ג)","ייחוס חוב החברה לבעל מניה במקרים חריגים (הונאה או קיפוח נושה; פגיעה בתכלית ונטילת סיכון בלתי סביר), בתנאי מודעות; השעיית חוב לבעל המניה (ס' 6(ג))"],["שינוי תקנון","ס' 20(א)–(ב)","רוב רגיל, אלא אם נקבע אחרת. כשנקבע רוב מיוחד: הגבוה מבין הרוב הקבוע והרוב המוצע"],["הפרדת יו״ר ומנכ״ל","ס' 95, ס' 121(ג)","בחברה ציבורית אסור כפל, אלא באישור אסיפה ברוב מיוחד לתקופות של עד 3 שנים"],["ועדת ביקורת","ס' 117(1א)","מסווגת עסקאות כחריגות או לא חריגות, ופעולות כמהותיות או לא"],["הצבעה ודיבידנד","ס' 82(ג), ס' 306(ב)","קול אחד לכל מניה; דיבידנד לפי ערך נקוב"],["חובות בעלי מניות","ס' 192, ס' 193","תום לב ואיסור קיפוח; הגינות לבעל שליטה ולבעל קול מכריע"],["קיפוח","ס' 191","צו לבקשת בעל מניה, כולל רכישת מניות"],["תביעה נגזרת","ס' 194–198, ס' 204","דרישה (או פטור לפי ס' 194(ד)), ואישור בית משפט (ס' 198(א)); נושה בחלוקה אסורה"],["חובת זהירות","ס' 252–253","רמת מיומנות של נושא משרה סביר, ובירור מידע סביר"],["חובת אמונים","ס' 254–256","ניגוד עניינים, תחרות, הזדמנות עסקית, גילוי; אישור לפי ס' 255; תרופות חוזיות (ס' 256)"],["פטור, שיפוי, ביטוח","ס' 259–263","פטור מראש רק לזהירות ורק לפי הוראה בתקנון; אין פטור לדירקטור בחלוקה (ס' 259(ב)); אין פטור לאמונים, כוונה או פזיזות (ס' 263)"],["מדיניות תגמול","ס' 267א–267ב","אישור תנאי כהונה לפי המדיניות; חריגה בתנאים"],["עסקאות בעלי עניין","ס' 268–280","גילוי (ס' 269), סיווג (ס' 270), מסלולים (ס' 271–275), הימנעות (ס' 278), חוסר תוקף (ס' 280)"],["חלוקה","ס' 302–311","שני מבחנים מצטברים; ס' 303 רק לכשל במבחן הרווח; השבה (ס' 310); אחריות דירקטורים (ס' 311)"],["תשקיף","ני״ע ס' 15, 31–35","חובת תשקיף; פיצויים מהחותמים ובעלי התפקידים; ביטול רק מהמציע תוך שנתיים"]]},{"t":"h","x":"טעויות שעולות בנקודות"},{"t":"list","x":["<b>סדר אישורים הפוך</b> או אורגן חסר. בעסקה עם בעל שליטה: ועדה ← דירקטוריון ← אסיפה (ס' 275(א)). ״המלצה״ של ועדה אינה ״אישור״.","<b>שכחה של ס' 278</b>: בעל העניין האישי לא נוכח בדיון ולא מצביע בוועדה ובדירקטוריון.","<b>אין תוצאה</b>: לא כתבתם מה דין העסקה שלא אושרה (ס' 280(א)), או את התוצאה כלפי הצד השלישי (ס' 280(ב)).","<b>שכחה של כלל 3 השנים</b> בעסקה ארוכה עם בעל שליטה (ס' 275(א1)(1)).","<b>חלוקה לפי מבחן הרווח בלבד</b>, או שליחה לבית משפט כשנכשל מבחן יכולת הפירעון.","<b>פטור על הפרת אמונים</b>, פטור רטרואקטיבי, או פטור לדירקטור בחלוקה. שלושתם אסורים (ס' 259, ס' 263).","<b>״הכסף בתביעה נגזרת ילך לבעל המניה״.</b> הוא הולך לחברה.","<b>ערבוב בין ס' 31 לס' 35 בחוק ניירות ערך</b>: ביטול דורש הסתמכות ורכישה מהמציע, ומוגבל לשנתיים.","<b>״בעל שליטה״ בלי נימוק</b>: כתבו את האחוז ואת הסעיף (ס' 1 או ס' 268)."]},{"t":"trap","x":"״נושא משרה״ נבחן לפי <b>מהות התפקיד והכפיפות</b>, לא לפי התואר. סמנכ״לית כספים הכפופה ישירות למנכ״ל היא נושאת משרה. ״מנהל מחלקה״ שכפוף לסמנכ״ל אינו נושא משרה. מנגד, מי שממלא בפועל תפקיד של סגן מנכ״ל הוא נושא משרה ״אף אם תוארו שונה״. אם לא סיווגתם נכון, כל מסלול האישור בתשובה ייפול."},{"t":"trap","x":"״בעל שליטה״ הוא מושג עם שתי הגדרות. לפי ס' 1 (שמפנה לחוק ניירות ערך) מדובר ביכולת לכוון, עם חזקה של מחצית או יותר. בפרק עסקאות בעלי עניין, ס' 268 מוסיף מי שמחזיק 25% ומעלה כשאין מחזיק אחר ביותר מ-50%. בעלת 48% כשהיתר מפוזר: בעלת שליטה לעניין ס' 270(4) מכוח ס' 268. ציינו את הסעיף שעליו אתם נשענים."},{"t":"h","x":"תשובה מלאה לדוגמה"},{"t":"example","title":"השאלה (מבחן תשפ״ו, סעיף ד', 20 נק')","x":"<b>עובדות בקצרה</b>: ״טבעונית בע״מ״, חברה ציבורית. נעמה מחזיקה 48%, היא יו״ר ובהמשך גם מנכ״לית. הדירקטוריון חילק 10 מיליון ₪ על סמך יתרת עודפים חיובית, כשלחברה התחייבויות שוטפות של כ-12 מיליון ₪ לפירעון בחודשים הקרובים ובקופה כ-3 מיליון ₪. ספק ציוד, ״מעבדות דקל״, לא נפרע. התברר שנעמה נהגה למשוך כספים מחשבון החברה לצרכיה ולהחזירם לאחר זמן. <b>השאלה</b>: ״דונו בסוגיות המשפטיות המתעוררות בקשר עם חלוקת הדיבידנד ועם התנהלותה הכספית של נעמה״ (עד 15 שורות)."},{"t":"example","title":"התשובה (כ-15 שורות)","x":"<b>1. חלוקה</b>: דיבידנד הוא ״חלוקה״ (ס' 1). מותרת רק אם מתקיימים במצטבר מבחן הרווח ומבחן יכולת הפירעון (ס' 302(א)). <b>2. רווח</b>: יש יתרת עודפים חיובית (ס' 302(ב)), ולכן מתקיים. <b>3. פירעון</b>: חבויות של כ-12 מיליון ₪ בחודשים הקרובים מול 3 מיליון ₪ בקופה, ובכל זאת חולקו 10 מיליון. יש חשש סביר, ממשי, לאי-עמידה בחבויות ״הקיימות והצפויות״. המבחן נכשל, והחלוקה אסורה (ס' 301(ב)). <b>4. דירקטורים</b>: כל מי שהיה דירקטור ייחשב כמפר את ס' 252–254, אלא אם יוכיח שהתנגד ונקט כל האמצעים הסבירים, הסתמך בתום לב על מידע מטעה, או לא ידע ולא היה עליו לדעת (ס' 311). אין פטור מראש (ס' 259(ב)). <b>5. השבה</b>: בעלי המניות ישיבו, אלא אם לא ידעו ולא היה עליהם לדעת (ס' 310(א)). לציבור חזקת אי-ידיעה (ס' 310(ב)). נעמה, יו״ר ובעלת שליטה, אינה נהנית ממנה, ותשיב. <b>6. משיכות נעמה</b>: שימוש בכספי החברה לצרכים פרטיים הוא ניגוד עניינים, והפרת אמונים (ס' 254(א)(1)) והגינות (ס' 193). ייתכן שזו גם חלוקה מוסווית: העברה ללא תמורה (״דיבידנד״, ס' 1). תרופות לפי ס' 256. <b>7. הרמת מסך</b>: ערבוב כספים ושימוש בחברה כ״כיס פרטי״, כשהחברה בקשיים ונעמה מודעת לכך, יכולים לבסס ייחוס חוב ״מעבדות דקל״ לנעמה (ס' 6(א)(1)(א)), והשעיית חובות החברה לנעמה (ס' 6(ג)). <b>8. מסלולים</b>: תביעה נגזרת של בעל מניה, כי נעמה שולטת בדירקטוריון (ס' 194, פטור לפי ס' 194(ד)); תביעה נגזרת של ״מעבדות דקל״ כנושה בשל החלוקה האסורה (ס' 204); בחדלות פירעון – הנאמן."},{"t":"p","x":"שימו לב למבנה: כל ״מספר״ הוא נקודה במחוון. כל נקודה כוללת סעיף, ועובדה שמיישמת אותו, ונגמרת בתוצאה. אין פתיח, אין סיכום כללי, אין העתקת עובדות שלא לצורך יישום."},{"t":"exam","x":"מה הבודק רוצה לראות בכל סעיף פתוח: (1) <b>סיווג מנומק</b> של הדמויות והעסקה, עם אחוזים וסעיף; (2) <b>מסלול מלא</b> של אישורים, בסדר הנכון ועם הרוב הנדרש; (3) <b>הימנעות וגילוי</b> (ס' 269, ס' 278); (4) <b>תוצאה</b> (ס' 280, ס' 310–311, ס' 256); (5) <b>מסלול אכיפה</b> (תביעה נגזרת, קיפוח, נושה); (6) <b>מסקנה</b> שעונה על לשון השאלה. בשאלות שמבקשות ״הדין והפסיקה״, הוסיפו משפט על ההלכה הרלוונטית (למשל המבחנים להזדמנות עסקית או כלל שיקול הדעת העסקי) רק אחרי שכיסיתם את הסעיפים."}],"mcq":[{"id":"u14-1","q":"בחברה ציבורית, איזה מבעלי התפקידים הבאים אינו ״נושא משרה״ לפי ס' 1 לחוק החברות?","o":["סמנכ״לית הכספים, הכפופה במישרין למנכ״ל.","דירקטור חיצוני.","״מנהל עסקים ראשי״.","מנהל מחלקת הרכש, הכפוף לסמנכ״ל התפעול.","מי שתוארו ״יועץ בכיר״, אך בפועל ממלא את תפקיד סגן המנכ״ל."],"a":3,"why":"״נושא משרה״ כולל מנכ״ל, מנהל עסקים ראשי, משנה למנכ״ל, סגן מנכ״ל, ממלא תפקיד כזה אף אם תוארו שונה, דירקטור, ומנהל הכפוף במישרין למנכ״ל. מנהל הרכש כפוף לסמנכ״ל, לא למנכ״ל, ולכן אינו נושא משרה.","w":["מנהלת הכפופה במישרין למנכ״ל היא נושאת משרה.","כל דירקטור, כולל חיצוני, הוא נושא משרה.","״מנהל עסקים ראשי״ מופיע במפורש בהגדרה.","","״כל ממלא תפקיד כאמור… אף אם תוארו שונה״."],"secs":["1"]},{"id":"u14-2","q":"בחברה ציבורית, עדי מחזיקה 30% ממניות ההצבעה, ואיש מבעלי המניות האחרים אינו מחזיק יותר מ-12%. החברה שוקלת לרכוש שירותים מחברה פרטית של עדי. כיצד יש לסווג את עדי לצורך אישור העסקה?","o":["היא אינה בעלת שליטה, כי היא מחזיקה פחות מ-50%.","היא ״בעלת שליטה״ לעניין אישור העסקה, כי היא מחזיקה 25% או יותר מזכויות ההצבעה ואין אדם אחר שמחזיק ביותר מ-50%.","היא ״בעלת מניה מהותית״ בלבד, ולכן די באישור הדירקטוריון.","היא בעלת שליטה רק אם היא גם נושאת משרה.","סיווגה תלוי בהחלטת האסיפה הכללית."],"a":1,"why":"ס' 268 מגדיר לעניין פרק אישור העסקאות ״בעל שליטה״ גם כ״מי שמחזיק בעשרים וחמישה אחוזים או יותר מזכויות ההצבעה… אם אין אדם אחר המחזיק בלמעלה מחמישים אחוזים״. לכן עסקה של החברה עם חברה של עדי נבחנת לפי ס' 270(4) ו-ס' 275.","w":["הרף של 50% הוא רק החזקה לפי ההגדרה הכללית; ס' 268 מרחיב.","","״בעל מניה מהותי״ (5%) הוא הגדרה אחרת שלא מכריעה כאן.","הסיווג לפי ס' 268 אינו תלוי בכהונה.","הסיווג נקבע בחוק, לא בהחלטת האסיפה."],"secs":["268"]},{"id":"u14-3","q":"חברת ״נגב בע״מ״ התאגדה בישראל. מניותיה הוצעו לציבור בארה״ב על פי מסמך הצעה שנדרש לפי הדין שם, הן נסחרות בבורסה האמריקנית ומוחזקות בידי הציבור. בישראל לא פורסם תשקיף. כיצד תסווג לפי חוק החברות?","o":["חברה פרטית, כי לא פורסם תשקיף לפי חוק ניירות ערך.","חברה פרטית שהיא ״חברת איגרות חוב״.","חברת חוץ.","ציבורית רק לעניין חובות הדיווח, ופרטית לכל עניין אחר.","חברה ציבורית."],"a":4,"why":"לפי הגדרת ״חברה ציבורית״ בס' 1, חברה ציבורית היא גם חברה שמניותיה ״הוצעו לציבור מחוץ לישראל על פי מסמך הצעה לציבור הנדרש לפי הדין מחוץ לישראל… ומוחזקות בידי הציבור״.","w":["ההגדרה כוללת במפורש הצעה בחו״ל.","היא הנפיקה מניות, לא רק איגרות חוב.","היא התאגדה בישראל, ולכן אינה חברת חוץ.","אין סיווג ״מפוצל״ כזה בחוק החברות.",""],"secs":["1"]},{"id":"u14-4","q":"דן הוא דירקטור בחברה ציבורית. החברה שוקלת התקשרות עם ספק שבבעלות אחיה של אשתו של דן. מה נכון?","o":["לדן אין עניין אישי, כי אח של בת זוג אינו ״קרוב״.","לדן יש עניין אישי רק אם הוא מחזיק מניות בספק.","לדן יש עניין אישי בעסקה, כי אח של בת הזוג הוא ״קרוב״, ולכן זו עסקה לפי ס' 270(1).","לדן יש עניין אישי, ולכן העסקה אסורה.","לדן יש עניין אישי, ולכן העסקה טעונה בכל מקרה אישור אסיפה ברוב מיוחד."],"a":2,"why":"״קרוב״ כולל ״צאצא, אח, אחות או הורה של בן הזוג״. ״ענין אישי״ כולל עניין אישי של קרוב ושל תאגיד שהקרוב בעל עניין בו (ס' 1). לכן זו עסקה של החברה עם אדם אחר שלנושא משרה יש בה עניין אישי (ס' 270(1)). אם אינה חריגה, היא טעונה אישור דירקטוריון (ס' 271); אם חריגה, ועדת ביקורת ← דירקטוריון (ס' 272(א)).","w":["אח של בן הזוג מופיע במפורש בהגדרת ״קרוב״.","העניין האישי נבחן גם דרך הקרוב, בלי קשר להחזקות של דן.","","עניין אישי אינו איסור; הוא מחייב גילוי ואישור.","רוב מיוחד באסיפה נדרש בעסקאות עם בעל שליטה (ס' 275), לא בעסקה עם דירקטור לפי ס' 270(1)."],"secs":["1","270"]},{"id":"u14-5","q":"מי מוסמך לקבוע אם עסקה עם נושא משרה בחברה ציבורית היא ״עסקה חריגה״?","o":["ועדת הביקורת, על יסוד נימוקים שתפרט.","המנכ״ל.","רואה החשבון המבקר.","האסיפה הכללית.","נושא המשרה שיש לו העניין האישי, בהצהרה בכתב."],"a":0,"why":"ס' 117(1א) קובע שמתפקידי ועדת הביקורת ״להחליט על יסוד נימוקים שיפורטו… ולגבי עסקאות כאמור בסעיף 270(1), (4) ו־(4א) אם הן עסקאות חריגות או עסקאות שאינן חריגות״.","w":["","למנכ״ל אין סמכות סיווג.","רואה החשבון המבקר אינו האורגן המסווג.","האסיפה מאשרת עסקאות במקרים מסוימים, אבל לא מסווגת.","בעל העניין האישי חייב לגלות (ס' 269), ואינו מסווג."],"secs":["117"]},{"id":"u14-6","q":"בשאלה פתוחה נשאלתם: ״פרטו מה צריך לקרות בחברה על מנת שבעל השליטה יקבל את השכר המוצע״. איזו תשובה מבנית תקבל את מרב הנקודות?","o":["הסבר כללי על בעיית הנציג ועל חשיבות הממשל התאגידי, ואחריו ציון ס' 275.","ציון שהשכר ״נראה גבוה״, ושלכן בעלי המניות יכולים לתבוע.","העתקה של לשון ס' 275 במלואו.","סיווג (בעל שליטה ונושא משרה ← עסקה לפי ס' 270(4)), מסלול (ועדת תגמול ← דירקטוריון ← אסיפה ברוב מיוחד, לפי מדיניות התגמול), הימנעות (ס' 278), כלל 3 השנים, ותוצאה אם לא אושר (ס' 280).","ציון שהדירקטוריון מוסמך לאשר כל שכר, כי הוא האורגן המנהל."],"a":3,"why":"תשובה לשאלת ״מה צריך לקרות״ בנויה מסיווג, מסלול אישור מלא ובסדר הנכון (ס' 275(א)), תנאים נלווים (ס' 275(ג1), ס' 275(א1), ס' 278) ותוצאה (ס' 280). כל אחד מהם הוא נקודה במחוון.","w":["רקע תאורטי לא ״קונה״ נקודות ותופס מקום.","אין סיווג ואין מסלול; ״נראה גבוה״ אינו ניתוח משפטי.","ציטוט בלי יישום לא מראה הבנה ותופס את כל 15 השורות.","","שגוי: לבעל שליטה נדרש גם אישור אסיפה ברוב מיוחד."],"secs":["275","280"]},{"id":"u14-7","q":"איזו מהפעולות הבאות אינה ״חלוקה״ לפי חוק החברות?","o":["התחייבות של החברה לשלם דיבידנד בעוד חודש.","הקצאת מניות הטבה לכל בעלי המניות.","מכירת נכס של החברה לבעל מניה, מכוח היותו בעל מניה, במחיר נמוך משוויו.","רכישה בידי חברה בת של מניות החברה האם.","מימון שהחברה נותנת לצד שלישי כדי שירכוש ממניותיה."],"a":1,"why":"הגדרת ״דיבידנד״ בס' 1 מחריגה במפורש מניות הטבה (״ולמעט מניות הטבה״). כל שאר הפעולות נכללות בהגדרת ״חלוקה״: התחייבות לתת דיבידנד, ״רכישה״ בידי חברה בת, העברה ללא תמורה שוות ערך, ומתן מימון לרכישה.","w":["״מתן דיבידנד או התחייבות לתיתו״.","","״העברה ללא תמורה שוות ערך״ היא דיבידנד.","״רכישה… בידי חברה בת שלה״.","״רכישה – רכישה או מתן מימון לרכישה״."],"secs":["1"]},{"id":"u14-8","q":"בתקנון חברה פרטית נקבע ששינוי התקנון טעון רוב של 70%. בעלי המניות רוצים לשנות זאת לרוב של 60%. מה הצעד הראשון הנכון בניתוח?","o":["לקבוע שנדרש רוב רגיל, כי זו ברירת המחדל לשינוי תקנון.","לקבוע שנדרש רוב של 60%, כי זה הרוב המוצע.","לקבוע שנדרש אישור בית משפט.","לקבוע שנדרשת הסכמה פה אחד, כי מדובר בשינוי שמחליש את המיעוט.","לזהות שנקבע בתקנון רוב מסוים לשינוי, ולכן חל ס' 20(ב): נדרש הגבוה מבין הרוב הקבוע (70%) והרוב המוצע (60%), כלומר 70%."],"a":4,"why":"ס' 20(ב): כשנקבע בתקנון רוב מסוים לשינוי הוראות התקנון, אפשר לשנות את ההוראה רק ״באותו רוב מסוים או ברוב המוצע, לפי הגבוה מבין השניים״. כאן 70%.","w":["רוב רגיל (ס' 20(א)) חל רק אם לא נקבע אחרת.","הרוב המוצע נמוך מהקבוע, ולכן לא הוא קובע.","שינוי תקנון אינו טעון אישור בית משפט.","אין דרישה לפה אחד; ס' 20(ד) נוגע רק לחיוב לרכוש מניות נוספות או להגדלת אחריות.",""],"secs":["20(ב)"]}],"cases":[{"id":"u14-c1","title":"״גלבוע אנרגיה״: כתבו תשובה ב-15 שורות","facts":"״גלבוע אנרגיה בע״מ״ היא חברה ציבורית. אילן מחזיק 35% ממניותיה, ואין מחזיק אחר ביותר מ-8%. אילן אינו נושא משרה. סמנכ״לית התפעול, שירה, כפופה ישירות למנכ״ל. הדירקטוריון אישר, ברוב קולות ובהשתתפות כל הדירקטורים, הסכם ל-5 שנים לרכישת שירותי תחזוקה בהיקף של 30 מיליון ₪ בשנה, כ-20% מהוצאות החברה, מחברת ״צפון שירותים בע״מ״. צפון שירותים בבעלות מלאה של אילן, ומנהלה הוא בעלה של שירה. שירה הציגה את ההסכם לדירקטוריון ולא ציינה את הקשר המשפחתי. ועדת הביקורת לא כונסה.","parts":[{"q":"דונו בסוגיות המשפטיות הנוגעות לאישור ההסכם. יש לבחור את פרוצדורת האישור המחמירה ביותר. נמקו והפנו לסעיפי החוק. (עד 15 שורות)","pts":20,"model":["1. סיווג אילן: מחזיק 35% ואין מחזיק אחר מעל 50%, ולכן ״בעל שליטה״ לעניין אישור עסקאות (ס' 268). צפון שירותים בבעלותו המלאה, ולכן יש לו עניין אישי בעסקה (ס' 1).","2. סיווג שירה: כפופה ישירות למנכ״ל, ולכן נושאת משרה (ס' 1). בעלה ״קרוב״ ומנהל את הספק, ולכן גם לה עניין אישי (ס' 1) והעסקה היא גם לפי ס' 270(1).","3. חריגות: חמש שנים, 30 מיליון ₪ בשנה וכ-20% מההוצאות. זו עסקה העשויה להשפיע מהותית על רווחיות החברה והתחייבויותיה, ולכן עסקה חריגה (ס' 1). את הסיווג קובעת ועדת הביקורת (ס' 117(1א)).","4. המסלול המחמיר (ס' 270(4), ס' 275(א)): ועדת ביקורת ← דירקטוריון ← אסיפה כללית ברוב מיוחד: רוב מקרב מי שאינם בעלי עניין אישי, או שסך המתנגדים מקרבם לא עולה על 2%. הסכם ל-5 שנים טעון אישור מחדש אחת לשלוש שנים (ס' 275(א1)(1)), ולגבי ההסכם הזה החריג של ס' 275(א1)(2) אפשרי רק אם ועדת הביקורת תאשר שהתקופה סבירה.","5. גילוי והימנעות: אילן ושירה חייבים לגלות את עניינם האישי בלא דיחוי (ס' 269(א)). שירה לא גילתה, וזו גם הפרת אמונים (ס' 254(א)(1), ס' 254(א)(4)). בעלי העניין האישי לא ישתתפו בדיון ובהצבעה, אלא לשם הצגת העסקה (ס' 278(א)).","6. תוצאה: ועדת הביקורת לא כונסה, האסיפה לא אישרה ונפלו פגמי גילוי והימנעות, ולכן העסקה חסרת תוקף כלפי החברה וכלפי בעל השליטה ונושאת המשרה (ס' 280(א)). היא חסרת תוקף גם כלפי צפון שירותים, שידעה על העניין האישי ועל היעדר האישור (ס' 280(ב)).","7. אכיפה: החברה רשאית לתבוע את שירה (ס' 256) ואת אילן (ס' 193). אם הדירקטוריון לא יפעל, בעלי המניות רשאים להגיש תביעה נגזרת (ס' 194; ייתכן פטור מדרישה לפי ס' 194(ד))."],"check":["סיווג אילן כבעל שליטה לפי ס' 268 (35%, אין מחזיק מעל 50%).","סיווג שירה כנושאת משרה, ועניינה האישי דרך בעלה (״קרוב״).","נימוק החריגות וסמכות הסיווג של ועדת הביקורת (ס' 117(1א)).","מסלול ס' 275(א) בסדר הנכון, עם הרוב המיוחד, וכלל 3 השנים.","גילוי (ס' 269) והימנעות (ס' 278).","חוסר תוקף לפי ס' 280(א)–(ב).","מבנה: סוגיה ← דין ← יישום ← תוצאה, בלי העתקת עובדות."]}]}]}],"exams":[{"id":"x1","title":"מבחן לדוגמה 1 · עסקאות נושאת משרה ופטור","note":"במבנה מועד א׳ תשפ״ו: פטור לנושאת משרה, אחריות כלפי ספק, עסקה עם חברת הבעל, הזדמנות עסקית","open":{"facts":"חברת <b>\"גל מזון בע\"מ\"</b> היא חברה ציבורית בתחום המזון. מטה החברה בנתניה, ויש לה כמה מחסנים באזור התעשייה של העיר. <b>מירב</b> מכהנת כסמנכ\"לית הכספים של החברה, ואינה מחזיקה במניות. בעל השליטה, <b>עמרי גל</b>, מחזיק ב־60% מהון המניות המונפק ומכהן גם כמנכ\"ל; יתר המניות בידי הציבור.\nבתקנון החברה אין הוראה שמתירה לפטור נושא משרה מאחריות בשל הפרת חובת הזהירות כלפי החברה.\nהחברה התקשרה עם <b>\"מחזור פלוס בע\"מ\"</b>, ספקית שירותי מחזור. מתברר שמירב יצרה כלפי מחזור פלוס התחייבויות, כשידעה שאין בקופה די כסף לשלם במועד. למחזור פלוס נגרם נזק, והיא מאיימת לתבוע את החברה.\nבנוסף, מירב שמעה שהדירקטוריון שוקל להתקשר עם ספק אריזות חדש, בהיקף של כחצי מיליון ₪ בשנה. בעלה של מירב הוא בעל השליטה והמנכ\"ל של חברת אריזות, ומירב רוצה להציע לדירקטוריון להתקשר עם החברה של בעלה.\nלבסוף, הוצע למירב לרכוש נכס מסחרי באזור התעשייה של נתניה, והיא מעוניינת לרכוש אותו כהשקעה פרטית.","parts":[{"q":"מה צריך לקרות בחברה כדי שמירב תקבל כתב פטור? נמקו והפנו לסעיפים.","pts":20,"model":["מירב היא <b>נושאת משרה</b>: מנהלת הכפופה במישרין למנכ\"ל (הגדרת \"נושא משרה\", ס׳ 1).","פטור מותר רק אם <b>התקנון מתיר אותו</b> (ס׳ 259(א)). אין הוראה כזו, ולכן קודם כל צריך <b>לתקן את התקנון</b> באסיפה הכללית, ברוב רגיל אלא אם התקנון קבע רוב אחר (ס׳ 20).","היקף הפטור: רק <b>מראש</b>, רק מאחריות <b>כלפי החברה</b>, ורק בשל הפרת <b>חובת הזהירות</b> (ס׳ 259(א)). אין פטור על הפרת אמונים, על הפרת זהירות בכוונה או בפזיזות, על פעולה לשם רווח אישי שלא כדין או על קנס (ס׳ 263).","פטור הוא חלק מ<b>\"תנאי כהונה והעסקה\"</b> (ס׳ 1), ולכן זו עסקה לפי ס׳ 270(2) עם נושאת משרה שאינה דירקטורית ואינה מנכ\"לית בחברה ציבורית.","מסלול האישור: <b>ועדת התגמול ← הדירקטוריון</b>, בהתאם למדיניות התגמול (ס׳ 272(ג)(1), ס׳ 267א). חריגה מהמדיניות: גם שיקולי ס׳ 267ב ואישור האסיפה ברוב מיוחד (ס׳ 272(ג)(2)); ואם האסיפה מתנגדת, אפשר \"פסקת התגברות\" בנימוקים מפורטים (ס׳ 272(ג)(3)).","למירב עניין אישי, ולכן לא תהיה נוכחת ולא תצביע (ס׳ 278).","<b>מסקנה:</b> תיקון תקנון ← ועדת תגמול ← דירקטוריון. הפטור יחול רק על העתיד, ולא על פרשת מחזור פלוס שכבר קרתה."],"check":["מירב נושאת משרה (ס׳ 1)","צריך הוראה בתקנון ותיקון תקנון (ס׳ 259(א), ס׳ 20)","פטור רק מראש ורק על זהירות; ס׳ 263","פטור = תנאי כהונה; ס׳ 270(2)","ועדת תגמול ← דירקטוריון לפי מדיניות (ס׳ 272(ג))","חריגה מהמדיניות / פסקת התגברות","ס׳ 278 – לא משתתפת"]},{"q":"מהן הסוגיות שמתעוררות בהתקשרות עם \"מחזור פלוס\"? נמקו והפנו לסעיפים.","pts":20,"model":["<b>החברה מחויבת</b>: מירב פעלה במסגרת תפקידה, ופעולתה מיוחסת לחברה (תורת האורגנים ודיני השליחות). אי־תשלום במועד הוא הפרת חוזה של החברה.","<b>אחריות אישית של מירב כלפי הספק</b>: לנושא משרה יכולה להיות חובת זהירות גם כלפי צד שלישי (ס׳ 252(ב)). יצירת התחייבות ביודעין שאין כסף לפרוע אותה עשויה להיות רשלנות ואף מרמה לפי פקודת הנזיקין.","<b>אחריות מירב כלפי החברה</b>: הפרת חובת הזהירות (ס׳ 252–253). נושא משרה סביר בודק תזרים לפני שהוא יוצר התחייבויות.","<b>אין פטור</b>: התקנון לא מתיר, פטור לא ניתן רטרואקטיבית, וממילא אין פטור על הפרה בכוונה או בפזיזות (ס׳ 263).","<b>מי תובע</b>: החברה, באמצעות הדירקטוריון; ואם החברה לא פועלת – בעל מניה או דירקטור בתביעה נגזרת, אחרי דרישה מוקדמת (ס׳ 194).","<b>שיפוי וביטוח</b> (ס׳ 260–261) אפשריים רק לפי התקנון, ולא על פעולה בכוונה או בפזיזות (ס׳ 263)."],"check":["ייחוס לחברה (אורגן/שליחות) והפרת חוזה","חובת זהירות כלפי צד שלישי (ס׳ 252(ב))","הפרת זהירות כלפי החברה (ס׳ 252–253)","אין פטור + ס׳ 263","תביעה נגזרת (ס׳ 194)","שיפוי/ביטוח (ס׳ 260–261)"]},{"q":"האם מירב רשאית להציע לדירקטוריון להתקשר עם החברה של בעלה? אם כן, מה עליה לעשות?","pts":20,"model":["<b>עניין אישי</b>: בעלה הוא \"קרוב\", והוא בעל השליטה בחברת האריזות. \"עניין אישי\" כולל עניין של קרוב ושל תאגיד שקרוב הוא בעל עניין בו (ס׳ 1).","<b>חובת אמונים</b>: להימנע מניגוד עניינים (ס׳ 254(א)(1)). מותר להציע את העסקה רק בדרך שהחוק קובע: גילוי ואישור (ס׳ 255).","<b>גילוי</b> בלי דיחוי, ולא יאוחר מהישיבה הראשונה שבה העסקה נדונה (ס׳ 269(א)). החריג של ס׳ 269(ב) חל רק על עניין של קרוב בעסקה שאינה חריגה – לכן עדיף לגלות בכל מקרה.","<b>סיווג</b>: עסקה עם אדם אחר שלנושאת משרה עניין אישי בה (ס׳ 270(1)). ועדת הביקורת קובעת אם העסקה חריגה (ס׳ 117(1א)). שירותי אריזה בתנאי שוק בהיקף כזה הם כנראה במהלך העסקים הרגיל.","לא חריגה: <b>אישור הדירקטוריון</b>, אלא אם התקנון קבע אחרת (ס׳ 271). חריגה: <b>ועדת ביקורת ← דירקטוריון</b> (ס׳ 272(א)).","מירב לא נוכחת ולא מצביעה, אלא לשם הצגת העסקה (ס׳ 278). העסקה חייבת להיות לטובת החברה (רישת ס׳ 270).","בלי אישור כדין – העסקה <b>חסרת תוקף</b> כלפי החברה ונושאת המשרה, וגם כלפי הצד השני אם ידע (ס׳ 280); וחלות התרופות להפרת אמונים (ס׳ 256)."],"check":["עניין אישי דרך קרוב (ס׳ 1)","ס׳ 254(א)(1) וס׳ 255","גילוי לפי ס׳ 269","ס׳ 270(1) + סיווג בוועדת הביקורת (ס׳ 117(1א))","לא חריגה: דירקטוריון (ס׳ 271); חריגה: ועדת ביקורת ← דירקטוריון (ס׳ 272(א))","ס׳ 278","ס׳ 280 – חוסר תוקף"]},{"q":"האם מירב רשאית לרכוש את הנכס לעצמה? דונו בכל הסוגיות.","pts":20,"model":["<b>הסוגיה</b>: ניצול הזדמנות עסקית של החברה (ס׳ 254(א)(3)) וחובת מסירת מידע לחברה (ס׳ 254(א)(4)).","<b>האם זו הזדמנות של החברה?</b> בוחנים: קשר לתחום עסקיה ולצרכיה, האם המידע הגיע אליה בתוקף תפקידה, והאם לחברה יש ציפייה ויכולת לנצל את ההזדמנות.","<b>יישום</b>: לחברה מחסנים באותו אזור תעשייה, ונכס מסחרי שם יכול לשמש לאחסון או להתרחבות. יש בסיס לטעון שזו הזדמנות של החברה, בייחוד אם ההצעה הגיעה אליה בגלל תפקידה.","אם זו הזדמנות של החברה: מירב חייבת <b>להציג אותה קודם לחברה</b>. רק אם החברה מוותרת, ובתנאי ס׳ 255(א) (תום לב, בלי פגיעה בטובת החברה, גילוי מלא זמן סביר מראש) ובאישור לפי ס׳ 255(ב) והפרק החמישי – מותר לה לרכוש לעצמה.","אם ההצעה הגיעה אליה באופן פרטי ואין לה קשר לעסקי החברה – מותר לרכוש.","<b>תרופות</b> על הפרה: דיני החוזים, פיצוי והשבת הרווח (ס׳ 256), והפסיקה מכירה גם בנאמנות קונסטרוקטיבית על הנכס לטובת החברה."],"check":["ס׳ 254(א)(3) ו־(4)","מבחני \"הזדמנות של החברה\"","יישום: מחסנים באותו אזור","הצגה לחברה + ס׳ 255","אפשרות שמותר (הזדמנות פרטית)","תרופות: ס׳ 256 / נאמנות קונסטרוקטיבית"]}]},"mc":[{"id":"x1m1","q":"לחברת \"נוגה בע\"מ\" (שתקנונה מאמץ את ברירות המחדל של החוק) שני בעלי מניות בלבד: <b>רון</b> מחזיק 500 מניות בערך נקוב 10 ₪ כל אחת, שרכש ב־5 ₪ למניה; <b>טל</b> מחזיק 1,000 מניות בערך נקוב 5 ₪ כל אחת, שרכש ב־10 ₪ למניה. החברה מחלקת דיבידנד של מיליון ₪. מה נכון?","o":["טל הוא בעל השליטה.","גם הדיבידנד וגם זכויות ההצבעה נקבעים לפי הערך הנקוב של המניות.","גם הדיבידנד וגם זכויות ההצבעה יחסיים למספר המניות.","בחלוקת הדיבידנד צריך להתחשב במחיר ששילם כל אחד על מניותיו.","אף תשובה אינה נכונה."],"a":0,"why":"שתי ברירות מחדל <b>שונות</b>: בהצבעה – <b>קול אחד לכל מניה</b> (ס׳ 82(ג)), ולכן לטל 1,000 מתוך 1,500 קולות = שני שלישים, והוא בעל השליטה. בדיבידנד – לפי <b>הערך הנקוב</b> (ס׳ 306(ב)): לכל אחד 5,000 ₪ ערך נקוב, ולכן 50/50.","w":["","נכון רק לדיבידנד. ההצבעה היא לפי מספר המניות (ס׳ 82(ג)), לא לפי ערך נקוב.","נכון רק להצבעה. הדיבידנד מתחלק לפי הערך הנקוב (ס׳ 306(ב)).","המחיר ששולם בפועל לא משנה. החלוקה לפי ערך נקוב.","תשובה א׳ נכונה."],"secs":["82(ג)","306(ב)","1"]},{"id":"x1m2","q":"מה מהבאים <b>אינו</b> עילה מוכרת להרמת מסך?","o":["החברה הפסידה כסף חמש שנים ברציפות.","החברה שימשה כלי לביצוע הונאה.","החברה הוקמה בעיקר כדי לעקוף חוק או סמכות של רגולטור.","החברה פעלה באופן עקבי בהון זעום ביחס לסיכונים שנטלה.","כל העילות תקפות."],"a":0,"why":"הפסדים לבדם הם סיכון עסקי לגיטימי, וזו בדיוק המטרה של אחריות מוגבלת. הרמת מסך נדרשת כשיש <b>שימוש לרעה</b> באישיות הנפרדת: הונאה או קיפוח נושה (ס׳ 6(א)(1)(א)), פגיעה בתכלית החברה תוך נטילת סיכון בלתי סביר – ושם הון זעום הוא שיקול מרכזי (ס׳ 6(א)(1)(ב)), או עקיפת חוק (ס׳ 6(ב) והפסיקה).","w":["","הונאה היא העילה הקלאסית (ס׳ 6(א)(1)(א)).","עקיפת חוק או רגולציה מוכרת כעילה.","הון זעום הוא שיקול מרכזי בנטילת \"סיכון בלתי סביר\" (ס׳ 6(א)(1)(ב)).","הפסדים לבדם אינם עילה, לכן לא כל העילות תקפות."],"secs":["6(א)","6(ב)"]},{"id":"x1m3","q":"בחברה ציבורית: <b>יעל</b> מחזיקה 60% מהמניות, <b>עידו</b> 20%, <b>נועם</b> 10% והציבור 10%. החברה רוצה להעסיק את <b>אחיה של יעל</b> כמהנדס (לא כנושא משרה), בחוזה לחמש שנים. מה נכון?","o":["נדרש אישור ועדת התגמול, הדירקטוריון והאסיפה הכללית, כולל רוב מקרב מי שאין להם עניין אישי. האישור נדרש מחדש כל 3 שנים.","רק אם זו עסקה חריגה: ועדת התגמול, הדירקטוריון והאסיפה ברוב מיוחד, ואישור מחדש כל 3 שנים.","אם זו לא עסקה חריגה: ועדת התגמול, הדירקטוריון והאסיפה ברוב מיוחד, והאישור תקף לכל תקופת החוזה.","רק אם זו עסקה חריגה: ועדת הביקורת, הדירקטוריון והאסיפה ברוב מיוחד, ואישור מחדש כל 3 שנים.","לא נדרש אישור מיוחד."],"a":0,"why":"סיפת ס׳ 270(4) מכסה במפורש <b>העסקה של קרוב של בעל השליטה</b>, בלי קשר לשאלה אם העסקה חריגה. המסלול (ס׳ 275(א)): ועדת התגמול (לעניין תנאי כהונה והעסקה) ← דירקטוריון ← אסיפה ברוב מיוחד. חוזה ליותר מ־3 שנים טעון אישור מחדש אחת ל־3 שנים (ס׳ 275(א1)(1)); החריג של ס׳ 275(א1)(2) חל רק על עסקה חריגה, לא על העסקה.","w":["","העסקת קרוב טעונה אישור גם כשהיא לא \"חריגה\" – זו הוראה נפרדת בסיפת ס׳ 270(4).","האישור לא תקף לכל 5 השנים: ס׳ 275(א1)(1) מחייב אישור מחדש כל 3 שנים.","גם התנאי \"רק אם חריגה\" שגוי, וגם הוועדה: בתנאי העסקה מאשרת ועדת התגמול.","העסקת קרוב של בעל שליטה טעונה מסלול מיוחד (ס׳ 270(4), 275)."],"secs":["270(4)","275(א)","275(א1)"]},{"id":"x1m4","q":"מה מבטא את רעיון <b>\"פסקת ההתגברות\"</b> בדיני החברות?","o":["ועדת התגמול ואחריה הדירקטוריון יכולים לאשר את תנאי הכהונה של מנכ\"ל חברה ציבורית, על אף התנגדות האסיפה הכללית.","האסיפה הכללית יכולה להפעיל את סמכויות הדירקטוריון כשנבצר ממנו לפעול, גם בלי הוראה בתקנון.","אפשר לאשר עסקה חריגה עם בעל שליטה ליותר משלוש שנים, אם ועדת הביקורת קבעה שזה סביר.","אפשר לפסול הצבעה של בעל מניה שלא הודיע על עניין אישי.","אף תשובה אינה נכונה."],"a":0,"why":"\"פסקת ההתגברות\" מאפשרת לוועדת התגמול ואחריה לדירקטוריון לאשר תנאי כהונה <b>במקרים מיוחדים</b> ובנימוקים מפורטים, גם אחרי שהאסיפה התנגדה – לנושאי משרה (ס׳ 272(ג)(3)), וגם למנכ\"ל (ס׳ 272(ג1)(1)(ג)). אינה חלה בחברה \"נכדה\" ציבורית (כהגדרתה בס׳ 267א(ג)).","w":["","זו סמכות שיורית של האסיפה כשהדירקטוריון מנוע מלפעול (ס׳ 52), לא \"התגברות\".","זה החריג לכלל 3 השנים (ס׳ 275(א1)(2)), לא פסקת ההתגברות.","זו תוצאה של הפרת חובת הגילוי בהצבעה (ס׳ 276), לא פסקת ההתגברות.","תשובה א׳ נכונה."],"secs":["272(ג)(3)","272(ג1)","267א(ג)"]}]},{"id":"x2","title":"מבחן לדוגמה 2 · בעלת שליטה, מנכ\"ל שעזב וחלוקה אסורה","note":"במבנה מועד ב׳ תשפ״ו: עסקה עם חברת האח, הזדמנות אחרי התפטרות, שכר בעלת שליטה, דיבידנד ומשיכות","open":{"facts":"חברת <b>\"עלה ירוק בע\"מ\"</b> היא חברה ציבורית שמפתחת ומשווקת מוצרי טיפוח טבעיים. את החברה הקימו ב־2016 <b>דנה</b>, כימאית שמכהנת מאז כיו\"ר הדירקטוריון, ו<b>אסף</b>, איש עסקים שכיהן כמנכ\"ל עד שהתפטר לפני חודשיים. היום דנה מחזיקה 48% מהמניות, קרן הפנסיה \"אורן\" מחזיקה 10%, והשאר (42%) מפוזר בציבור.\nבחודש שעבר אישר הדירקטוריון, ברוב קולות ואחרי שכונסה גם ועדת הביקורת, הסכם <b>בלעדי</b> לחמש שנים לאספקת חומרי גלם עם \"תמציות הגליל בע\"מ\", שכל מניותיה בידי <b>אחיה של דנה</b>. שווי ההסכם – מיליוני שקלים.\nלפני שהתפטר, ניהל אסף בשם החברה מגעים מתקדמים עם רשת פארם ארצית על הסכם הפצה בלעדי. זמן קצר אחרי ההתפטרות פנה אסף לאותה רשת, וחתם איתה הסכם הפצה דומה עבור חברה חדשה שהקים, שמשווקת מוצרים דומים.\nלאחר מכן אישר הדירקטוריון, \"בהמלצת ועדת התגמול\", לשלם לדנה – שתכהן מעתה גם כמנכ\"לית – 150,000 ₪ בחודש, רכב ואופציות.\nזמן קצר אחר כך החליט הדירקטוריון, על סמך יתרת עודפים חיובית, לחלק דיבידנד של 10 מיליון ₪. באותה עת היו לחברה התחייבויות שוטפות של כ־12 מיליון ₪ לפירעון בחודשים הקרובים, ומזומנים של כ־3 מיליון ₪ בלבד. אחרי החלוקה דרש ספק ציוד מעבדה תשלום של 2 מיליון ₪, ונענה שאין לחברה די נכסים. הספק גילה שדנה נהגה למשוך מדי פעם כספים מחשבון החברה לצרכיה הפרטיים ולהחזירם לאחר זמן.","parts":[{"q":"דונו בסוגיות שמעוררת ההתקשרות עם \"תמציות הגליל\". בחרו בפרוצדורת האישור המחמירה ביותר.","pts":20,"model":["דנה היא <b>בעלת שליטה</b> לעניין עסקאות עם בעלי עניין: מחזיקה 25% או יותר ואין אחר שמחזיק ביותר מ־50% (ס׳ 268).","<b>עניין אישי</b>: אחיה הוא \"קרוב\" שמחזיק 100% בצד השני (ס׳ 1).","<b>עסקה חריגה</b>: הסכם בלעדי לחמש שנים בשווי מיליונים עשוי להשפיע מהותית (ס׳ 1). ועדת הביקורת מסווגת (ס׳ 117(1א)). זו עסקה חריגה עם אדם אחר שלבעל השליטה עניין אישי בה – <b>ס׳ 270(4)</b>.","<b>מסלול</b> (ס׳ 275(א)): <b>ועדת ביקורת ← דירקטוריון ← אסיפה ברוב מיוחד</b>: רוב מקרב בעלי המניות שאין
