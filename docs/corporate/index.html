ת לו״, ולא רק לבטל.","אין בס' 191 סף אחזקה; ״לפי בקשת בעל מניה״.","זה תיאור התביעה הנגזרת (ס' 201). תביעת קיפוח היא תביעה אישית לטובת בעל המניה."],"secs":["191"]},{"id":"u9-7","q":"דנה, בעלת 2% ממניות חברה ציבורית, חושדת שהמנכ״ל, שהוא גם בעל השליטה, העביר נכסים של החברה לחברה פרטית שלו. ארבעה מתוך שבעה הדירקטורים הם קרוביו ושותפיו העסקיים, ולהם עניין אישי בהחלטה אם לתבוע. מה נכון?","o":["דנה חייבת לפנות קודם בדרישה ליו״ר הדירקטוריון, אחרת בית המשפט לא ידון בבקשה.","דנה אינה רשאית לתבוע, כי רק דירקטור רשאי להגיש תביעה נגזרת.","דנה רשאית לתבוע את המנכ״ל באופן אישי, והפיצוי ישולם לה לפי חלקה בחברה.","דנה רשאית לפנות לבית המשפט בבקשה לאשר תביעה נגזרת בלי דרישה מוקדמת, כי ליותר ממחצית מחברי הדירקטוריון עניין אישי בהחלטה.","דנה רשאית להגיש תביעה נגזרת בלי אישור בית המשפט, כי הדרישה אינה נדרשת."],"a":3,"why":"ס' 194(ד)(1) פוטר מדרישה כשלאורגן המוסמך להחליט על התביעה (הדירקטוריון) יש עניין אישי בהחלטה, ואם הוא מורכב מכמה יחידים – כשלמחצית או יותר מהם עניין אישי. 4 מתוך 7 זה יותר ממחצית. ס' 197(5) מתיר אז לבקש אישור.","w":["הדרישה אינה נחוצה בהתקיים חריג ס' 194(ד).","גם ״כל בעל מניה״ רשאי (ס' 194(א)).","הנזק נגרם לחברה; התביעה היא בשמה והכסף הולך אליה.","","גם כשאין צורך בדרישה, התביעה הנגזרת טעונה תמיד אישור בית המשפט (ס' 198(א))."],"secs":["194(ד)"]},{"id":"u9-8","q":"מה המבחן שלפיו בית המשפט יאשר תביעה נגזרת?","o":["התובע מחזיק לפחות 1% מהמניות, ופנה לחברה לפני 90 יום לפחות.","שוכנע שלכאורה התביעה וניהולה לטובת החברה, ושהתובע אינו פועל בחוסר תום לב.","התובע הוכיח ברמה של מאזן הסתברויות שהנתבע הפר את חובותיו.","האסיפה הכללית אישרה את הגשת התביעה ברוב רגיל.","הנזק לחברה עולה על 5% מהונה העצמי."],"a":1,"why":"זה לשון ס' 198(א): ״לכאורה התביעה וניהולה הן לטובת החברה וכי התובע אינו פועל בחוסר תום לב״.","w":["אין סף אחזקה, ופרק הזמן לתשובת החברה הוא 45 ימים (ס' 196).","","בשלב האישור די ב״לכאורה״; ההכרעה בתביעה עצמה באה אחר כך.","אין דרישה לאישור אסיפה; בדיוק לשם כך קיים המנגנון של בית המשפט.","אין בחוק סף נזק כזה."],"secs":["198(א)"]},{"id":"u9-9","q":"חברה פרטית חילקה דיבידנד אף שלא עמדה במבחן יכולת הפירעון. ספק שהחברה חייבת לו כסף מבקש לפעול. מה נכון?","o":["לספק אין מעמד; רק בעלי מניות ודירקטורים רשאים להגיש תביעה נגזרת.","הספק רשאי לתבוע את בעלי המניות ישירות בשמו, בלי קשר לחברה.","הספק יכול לפעול רק אם החברה ציבורית.","הספק רשאי לבקש מהרשם לבטל את החלוקה.","הספק, כנושה, רשאי להגיש תביעה נגזרת בשם החברה בשל חלוקה אסורה."],"a":4,"why":"ס' 204 מקנה לנושה של החברה זכות להגיש תביעה נגזרת בשם החברה בשל חלוקה אסורה, והוראות התביעה הנגזרת חלות בשינויים המחויבים. ההשבה תהיה לחברה (ס' 310), ומשם תשמש לפירעון החובות.","w":["ס' 204 הוא חריג מפורש שמעניק מעמד לנושה.","התביעה לפי ס' 204 היא בשם החברה, וההשבה לפי ס' 310 היא לחברה.","ס' 204 חל על כל חברה; הוראה נוספת לבעלי איגרות חוב נוגעת לחברת איגרות חוב.","אין לרשם סמכות כזו; הסעד הוא שיפוטי.",""],"secs":["204"]},{"id":"u9-10","q":"בחברה ציבורית ישראלית טיפוסית יש בעל שליטה המחזיק 55% מהמניות. מהו מקור החשש המרכזי של ״בעיית הנציג״ בחברה כזו?","o":["המנהלים יעדיפו את טובתם האישית על פני השאת רווחי בעלי המניות, בגלל פיזור הבעלות.","הנושים ידרשו פירעון מוקדם של חובות החברה.","בעל השליטה עלול לתעל עושר מהחברה אליו, על חשבון בעלי מניות המיעוט.","הדירקטורים החיצוניים ישתלטו על הדירקטוריון.","בעלי המניות מהציבור יכפו על החברה לחלק דיבידנדים מופרזים."],"a":2,"why":"בבעלות מרוכזת, לבעל השליטה יש גם תמריץ וגם יכולת לפקח על המנהלים, ולכן הבעיה עוברת לציר בעל שליטה מול מיעוט: חשש לתיעול עושר (Tunneling) בעסקאות בעלי עניין ובדרכים דומות. לכן החוק מחמיר באישור עסקאות עם בעל שליטה (ס' 270(4), ס' 275) ומטיל עליו חובת הגינות (ס' 193).","w":["זו בעיית הנציג בבעלות מבוזרת, ולא במרוכזת.","זו לא בעיית הנציג בין בעלים למנהלים.","","דירקטורים חיצוניים הם מיעוט בדירקטוריון וכלי פיקוח; הם לא מקור הבעיה.","הציבור המפוזר חסר כוח כזה; בעל השליטה הוא ששולט בהחלטות."],"secs":["1"]},{"id":"u9-11","q":"חברה פרטית שיש לה סוג אחד של מניות מבקשת להקצות מניות חדשות למשקיע חיצוני. בתקנון אין הוראה בעניין. מה נכון?","o":["יש להציע את המניות קודם לבעלי המניות הקיימים, לפי חלקם בהון המונפק; רק מניות שהם סירבו לרכוש או לא נענו להצעה עד המועד שנקבע יוכל הדירקטוריון להציע למשקיע.","אין זכות קדימה בחברה פרטית; היא קיימת רק בחברה ציבורית.","ההקצאה טעונה אישור האסיפה הכללית ברוב מיוחד.","הדירקטוריון רשאי להקצות למשקיע בלי להציע לבעלי המניות, כל עוד ההקצאה בתנאי שוק.","ההקצאה אסורה, כי היא מדללת את בעלי המניות הקיימים."],"a":0,"why":"ס' 290(א): בחברה פרטית שהונה המונפק כולל סוג אחד של מניות, יוצעו המניות לכל בעל מניה לפי חלקו בהון המונפק, אם לא נקבע אחרת בתקנון.","w":["","ההפך: ס' 290(א) חל על חברה פרטית.","הסמכות להקצות בידי הדירקטוריון עד גבול ההון הרשום (ס' 288(א)); אין דרישה לרוב מיוחד.","תנאי שוק לא מבטלים את זכות הקדימה של ס' 290(א).","ההקצאה מותרת; ההגנה מפני דילול היא זכות הקדימה."],"secs":["290(א)"]},{"id":"u9-12","q":"אבי קנה בבורסה 100 מניות של חברה ציבורית דרך הבנק שלו. שמו לא מופיע במרשם בעלי המניות של החברה, ושם רשומה ״חברה לרישומים״. האם אבי הוא בעל מניה?","o":["לא, רק מי שרשום במרשם בעלי המניות הוא בעל מניה.","לא, החברה לרישומים היא בעלת המניות והוא רק נהנה.","כן, אבל רק לעניין דיבידנד ולא לעניין הצבעה.","כן; בחברה ציבורית בעל מניה הוא גם מי שהמניה רשומה לזכותו אצל חבר בורסה, כשהמניה רשומה במרשם על שם חברה לרישומים.","כן, רק אם הוא מחזיק לפחות 5% מהמניות (״בעל מניה מהותי״)."],"a":3,"why":"ס' 177(1) קובע שבחברה ציבורית בעל מניה הוא גם מי שלזכותו רשומה אצל חבר בורסה מניה, הנכללת במרשם על שם חברה לרישומים. הכלל של ״רק הרשום במרשם״ חל על חברה פרטית (ס' 176).","w":["זה הכלל בחברה פרטית (ס' 176).","ס' 177(1) מכיר במחזיק דרך חבר הבורסה כבעל מניה.","מעמדו כבעל מניה מלא, כולל הצבעה (ס' 188).","","״בעל מניה מהותי״ (5%) הוא הגדרה לעניינים אחרים, לא תנאי למעמד בעל מניה."],"secs":["177","176"]},{"id":"u9-13","q":"חברת ״נוף בע״מ״ הנפיקה אגרות חוב לציבור על פי תשקיף, אבל מניותיה מוחזקות כולן בידי שני מייסדים ואינן רשומות למסחר. כיצד תסווג?","o":["כחברה ציבורית, כי ניירות ערך שלה הוצעו לציבור.","כחברה פרטית, שהיא ״חברת איגרות חוב״.","כחברה ציבורית לעניין דיבידנד וכפרטית לעניין הצבעה.","כחברה ממשלתית.","כשותפות, כי יש לה שני בעלים בלבד."],"a":1,"why":"לפי ס' 1, ״חברה ציבורית״ היא חברה שמניותיה רשומות למסחר או הוצעו לציבור על פי תשקיף. כאן רק איגרות החוב הוצעו, ולכן זו חברה פרטית. היא ״חברת איגרות חוב״ (ס' 1), ועליה חלות הוראות מיוחדות, למשל ס' 270(4א) ו-ס' 275(ג).","w":["ההגדרה מתייחסת למניות, לא לכל נייר ערך.","","אין סיווג ״כפול״ כזה.","אין שום רמז לבעלות המדינה.","חברה בע״מ היא תאגיד לפי חוק החברות, ומספר בעלי המניות לא הופך אותה לשותפות."],"secs":["1"]}],"cases":[{"id":"u9-c1","title":"״ענבל אחזקות״: בעל שליטה, מיעוט ותביעות","facts":"״ענבל אחזקות בע״מ״ היא חברה ציבורית. יואב מחזיק 62% ממניותיה ומכהן כיו״ר הדירקטוריון. קרן ״אופק״ מחזיקה 8%, והיתרה (30%) בידי הציבור. בדירקטוריון שבעה חברים: יואב, שלושה מנהלים בכירים בחברות פרטיות של יואב, אשתו של יואב, ושני דירקטורים חיצוניים. לפני חצי שנה רכשה ענבל מחברה פרטית שבבעלות יואב מבנה משרדים ב-40 מיליון ₪. שמאי בלתי תלוי העריך אותו ב-25 מיליון ₪. העסקה אושרה בדירקטוריון בלבד, ויואב השתתף בהצבעה. בנוסף, בתקנון נקבע שלכל מניה קול אחד, והמניות של יואב הן בנות 0.1 ₪ ע.נ., בעוד מניות הציבור והקרן בנות 1 ₪ ע.נ. השבוע הודיע יואב שבכוונתו להצביע באסיפה בעד הקצאה פרטית של מניות לחברה שלו במחיר נמוך משמעותית ממחיר השוק.","parts":[{"q":"דונו בדרכים העומדות לרשות קרן ״אופק״ ובעלי המניות מהציבור בקשר לרכישת המבנה. נמקו והפנו לסעיפי החוק.","pts":25,"model":["1. יואב הוא בעל שליטה: הוא מחזיק 62% מזכויות ההצבעה, ולכן חזקה שיש לו היכולת לכוון את פעילות החברה (הגדרת ״שליטה״, ס' 1 לחוק ניירות ערך, אליה מפנה ס' 1 לחוק החברות). הוא גם נושא משרה כדירקטור ויו״ר.","2. העסקה היא עסקה של חברה ציבורית עם אדם אחר (החברה הפרטית) שלבעל השליטה עניין אישי בה. היא עסקה חריגה: בסכום מהותי ולא בתנאי שוק (מחיר גבוה ב-15 מיליון ₪ מהשווי). לכן מדובר בעסקה לפי ס' 270(4), הטעונה אישור ועדת ביקורת, דירקטוריון ואסיפה כללית ברוב מיוחד (ס' 275(א)).","3. העסקה אושרה בדירקטוריון בלבד. יואב, בעל העניין האישי, השתתף בהצבעה: ככלל זה אסור (ס' 278(א)); ואם לרוב הדירקטורים עניין אישי (כאן לחמישה מתוך שבעה), הם רשאים להשתתף, אבל אז העסקה טעונה בכל מקרה גם אישור האסיפה (ס' 278(ב)–(ג)). לכן היא חסרת תוקף כלפי החברה וכלפי בעל השליטה (ס' 280(א)), וגם כלפי החברה הפרטית של יואב, שידעה על העניין האישי ועל היעדר האישור (ס' 280(ב)).","4. יואב הפר את חובת ההגינות של בעל שליטה (ס' 193(א)(1)), וכנושא משרה גם את חובת האמונים: ניגוד עניינים (ס' 254(א)(1)). התרופות: דיני הפרת חוזה (ס' 193(ב), ס' 256): השבת ההפרש או ביטול העסקה והשבה הדדית.","5. הנזק נגרם לחברה, ולכן המסלול הוא תביעה נגזרת בשמה (ס' 194(א)). קרן ״אופק״ ובעלי מניות מהציבור רשאים להגישה.","6. דרישה מוקדמת אינה נדרשת: לחמישה מתוך שבעה הדירקטורים (יואב, אשתו ושלושת המנהלים בחברות שלו) יש עניין אישי בהחלטה אם לתבוע, כלומר למחצית או יותר מיחידי האורגן (ס' 194(ד)(1)). לכן אפשר לפנות ישירות לבית המשפט (ס' 197(5)).","7. בית המשפט יאשר את התביעה אם שוכנע שלכאורה היא לטובת החברה והתובע תם לב (ס' 198(א)). פער של 15 מיליון ₪ מול שמאות בלתי תלויה מבסס תשתית לכאורית. אפשר לבקש גילוי מסמכים (ס' 198א). הכספים שייפסקו ישולמו לחברה, והתובע עשוי לקבל גמול והוצאות (ס' 199–201).","8. אפשר לתבוע גם את הדירקטורים שאישרו את העסקה בלי לבדוק את המחיר, על הפרת חובת הזהירות (ס' 252–253)."],"check":["זיהוי יואב כבעל שליטה (מעל 50%) וכנושא משרה.","סיווג העסקה לפי ס' 270(4) כעסקה חריגה ומסלול האישור לפי ס' 275(א) (ועדת ביקורת, דירקטוריון, אסיפה ברוב מיוחד).","השתתפות בעלי עניין אישי בהצבעה (ס' 278(א)–(ג)), ותוצאת חוסר התוקף לפי ס' 280(א)–(ב).","הפרת חובת הגינות (ס' 193) ואמונים (ס' 254) והתרופות.","תביעה נגזרת: מי רשאי, פטור מדרישה לפי ס' 194(ד)(1) עם ספירת הדירקטורים הנגועים, ואישור לפי ס' 198(א).","הכסף הולך לחברה; גמול והוצאות לתובע."]},{"q":"יואב טוען שאינו ״בעל השליטה״ האמיתי, כי ״רוב הדיבידנד ממילא הולך לציבור״, ושאין מניעה שיצביע כרצונו בעד ההקצאה הפרטית. התייחסו.","pts":15,"model":["1. בהצבעה, לפי התקנון (ובכל מקרה לפי ברירת המחדל של ס' 82(ג)), לכל מניה קול אחד. לכן ל-62% מהמניות של יואב 62% מהקולות, והוא בעל שליטה.","2. נכון שבדיבידנד המצב שונה: החלוקה לפי ערך נקוב (ס' 306(ב)). יואב: 62×0.1 = 6.2 יחידות ע.נ., ושאר בעלי המניות: 38×1 = 38 יחידות. כלומר יואב יקבל רק כ-14% מהדיבידנד. אבל זה לא משנה את השליטה, שנקבעת לפי זכויות ההצבעה והיכולת לכוון.","3. דווקא הפער הזה מחזק את החשש מתיעול: כשליואב חלק קטן בדיבידנד אבל שליטה בהחלטות, יש לו תמריץ להעביר ערך אליו בדרכים לא יחסיות (עסקאות בעלי עניין, הקצאה בזול).","4. בהצבעה על ההקצאה, יואב חייב לנהוג בתום לב ובדרך מקובלת ולהימנע מניצול לרעה של כוחו (ס' 192(א)), להימנע מקיפוח המיעוט (ס' 192(ב)), וכבעל שליטה לפעול בהגינות (ס' 193(א)(1)).","5. הקצאה פרטית בזול שלבעל השליטה עניין אישי בה היא עסקה לפי ס' 270(4) (״לרבות הצעה פרטית שלבעל השליטה יש בה ענין אישי״), ולכן נדרש רוב מיוחד לפי ס' 275(א)(3). קולו של יואב לא ייספר ברוב מקרב מי שאינם בעלי עניין אישי.","6. אם בכל זאת תאושר ההקצאה, המיעוט יכול לבקש סעד לפי ס' 191 (קיפוח, כולל ״חשש מהותי״) עוד לפני שההקצאה מבוצעת."],"check":["הבחנה בין ס' 82(ג) (הצבעה לפי מספר מניות) לס' 306(ב) (דיבידנד לפי ערך נקוב), עם חישוב.","שליטה נקבעת לפי זכויות הצבעה ויכולת לכוון, לא לפי חלק בדיבידנד.","חובות ס' 192(א)–(ב) וס' 193 בהצבעה.","סיווג ההקצאה הפרטית לפי ס' 270(4) והרוב המיוחד לפי ס' 275(א)(3).","סעד קיפוח לפי ס' 191, כולל חשש מהותי."]}]}]},{"id":"u10","title":"חלוקה ודיבידנד","short":"חלוקה ודיבידנד","blurb":"תדעו לזהות ״חלוקה״ (גם כשהיא מוסווית), להפעיל את מבחן הרווח ואת מבחן יכולת הפירעון כולל תחזית הפסד, ולקבוע מי משיב ומי אחראי כשהחלוקה אסורה.","secs":["1","259(ב)","301","302","303","304","306","307","308","309","310","311","204"],"blocks":[{"t":"h","x":"למה החוק מגביל חלוקות?"},{"t":"p","x":"בעלי המניות נהנים מ<b>אחריות מוגבלת</b>: הם לא אחראים לחובות החברה. המחיר הוא שהנושים יכולים להיפרע רק מנכסי החברה. אם בעלי המניות יוכלו ״לרוקן״ את הקופה לכיסם כשהחברה בקשיים, הנושים יישארו מול חברה ריקה. לכן פרק החלוקה בחוק (ס' 301–312) נועד בעיקר <b>להגן על הנושים</b>: הכסף יוצא לבעלי המניות רק כשיש רווחים, ורק כשאין חשש שהחברה לא תעמוד בחובותיה."},{"t":"h","x":"מה נחשב ״חלוקה״?"},{"t":"p","x":"המונח רחב בהרבה מ״דיבידנד במזומן״. יש לו שני ראשים: <b>דיבידנד</b> ו<b>רכישה</b>. גם התחייבות לחלק, ולא רק החלוקה בפועל, היא חלוקה."},{"t":"law","law":"חוק החברות","sec":"1","x":"”חלוקה“ – מתן דיבידנד או התחייבות לתיתו, במישרין או בעקיפין, וכן רכישה; ולענין זה, ”רכישה“ – רכישה או מתן מימון לרכישה, במישרין או בעקיפין, בידי חברה או בידי חברה בת שלה או בידי תאגיד אחר בשליטתה, של מניות החברה או של ניירות ערך שניתן להמירם למניות החברה …"},{"t":"law","law":"חוק החברות","sec":"1","x":"”דיבידנד“ – כל נכס הניתן על ידי החברה לבעל מניה מכוח זכותו כבעל מניה, בין במזומן ובין בכל דרך אחרת, לרבות העברה ללא תמורה שוות ערך ולמעט מניות הטבה;"},{"t":"table","head":["הפעולה","חלוקה?","למה"],"rows":[["דיבידנד במזומן או בנכס (למשל חלוקת מניות של חברה בת)","כן","״כל נכס… בין במזומן ובין בכל דרך אחרת״."],["החברה מוכרת לבעל מניה נכס ששווה 5 מיליון ב-3 מיליון","כן, ״דיבידנד מוסווה״ של 2 מיליון","״העברה ללא תמורה שוות ערך״ לבעל מניה בשל היותו בעל מניה."],["החברה רוכשת חזרה ממניותיה (Buy-back)","כן","״רכישה״ בהגדרת חלוקה."],["חברה בת רוכשת מניות של החברה האם","כן","״בידי חברה בת שלה״; ראו גם ס' 309."],["החברה נותנת הלוואה לאדם כדי שיקנה את מניותיה","כן","״מתן מימון לרכישה״."],["מניות הטבה","לא","מוחרגות מהגדרת דיבידנד; חלים עליהן כללי ס' 304."],["פדיון ניירות ערך בני פדיון לפי תנאיהם","בדרך כלל לא","ס' 312(ב), אלא אם הם חלק מההון העצמי לפי ס' 312(ד)."]]},{"t":"trap","x":"״דיבידנד מוסווה״ הוא מלכודת אהובה. אם בעל מניה (בדרך כלל בעל השליטה) מקבל מהחברה טובת הנאה בלי תמורה שוות ערך, בגלל מעמדו כבעל מניה (קנייה בזול, שכירות בחינם, הלוואה בלי ריבית), זו <b>חלוקה</b>. לכן היא חייבת לעמוד בשני המבחנים, וכל בעלי המניות זכאים לחלק יחסי. בעסקה עם בעל שליטה בחברה ציבורית החוק אף מחייב את הוועדה והדירקטוריון לבחון אם העסקה כוללת חלוקה (ס' 275(ד)(1))."},{"t":"law","law":"חוק החברות","sec":"301","x":"חברה רשאית לבצע חלוקה לפי הוראות פרק זה בלבד; ואולם חברה רשאית להתחייב בתקנונה או בחוזה שלא לבצע חלוקה במגבלות נוספות על הוראות פרק זה. … חלוקה בניגוד להוראות פרק זה היא חלוקה אסורה."},{"t":"p","x":"כלומר, החוק קובע <b>רף מינימום</b>. החברה רשאית להחמיר על עצמה, למשל בהתחייבות לבנק או למחזיקי איגרות חוב שלא לחלק מתחת ליחס הון מסוים, אבל לא להקל."},{"t":"h","x":"שני מבחנים מצטברים: ס' 302"},{"t":"law","law":"חוק החברות","sec":"302(א)","x":"חברה רשאית לבצע חלוקה מתוך רווחיה (להלן – מבחן הרווח), ובלבד שלא קיים חשש סביר שהחלוקה תמנע מן החברה את היכולת לעמוד בחבויותיה הקיימות והצפויות, בהגיע מועד קיומן (להלן – מבחן יכולת הפרעון)."},{"t":"table","head":["","מבחן הרווח","מבחן יכולת הפירעון"],"rows":[["השאלה","האם יש ״רווחים״ שמהם אפשר לחלק?","האם יש חשש סביר שהחלוקה תמנע מהחברה לעמוד בחבויותיה?"],["מבט","<b>לאחור</b>: הדוחות הכספיים האחרונים","<b>קדימה</b>: חבויות קיימות <b>וצפויות</b>, במועד פירעונן"],["חומר הבדיקה","דוחות כספיים מותאמים, מבוקרים או סקורים, שאינם מוקדמים ביותר משישה חודשים ממועד החלוקה","תזרים מזומנים, תחזיות, מועדי פירעון, מסגרות אשראי, הפסדים צפויים"],["אופי","חשבונאי, מספרי","צופה פני עתיד, שיקול דעת עסקי של הדירקטוריון"],["אם נכשל","אפשר לבקש אישור בית משפט (ס' 303)","החלוקה אסורה, ואין דרך לעקוף זאת"]]},{"t":"law","law":"חוק החברות","sec":"302(ב)","x":"”רווחים“, לענין מבחן הרווח – יתרת עודפים או עודפים שנצברו בשנתיים האחרונות, לפי הגבוה מבין השניים, והכל על פי הדוחות הכספיים המותאמים האחרונים, המבוקרים או הסקורים, שערכה החברה, תוך הפחתת חלוקות קודמות אם לא הופחתו כבר מן העודפים, ובלבד שהמועד שלגביו נערכו הדוחות אינו מוקדם ביותר מששה חודשים ממועד החלוקה;"},{"t":"steps","title":"חישוב מבחן הרווח, צעד אחר צעד","x":["בדקו את <b>הדוחות</b>: הדוחות הכספיים המותאמים האחרונים, המבוקרים או הסקורים. המועד שלגביו נערכו לא יהיה מוקדם ביותר מ-6 חודשים לפני מועד החלוקה.","חשבו את <b>יתרת העודפים</b> (העודפים המצטברים בהון העצמי).","חשבו את <b>העודפים שנצברו בשנתיים האחרונות</b>.","קחו את <b>הגבוה</b> מבין השניים.","<b>הפחיתו חלוקות קודמות</b> שעוד לא הופחתו מהעודפים (למשל חלוקה שבוצעה אחרי תאריך הדוחות).","התוצאה היא הסכום המרבי שמבחן הרווח מתיר. עכשיו עברו ל<b>מבחן יכולת הפירעון</b>: הוא תנאי נוסף, לא חלופה."]},{"t":"example","title":"דוגמה מספרית: חברה עם הפסדים צבורים שהתאוששה","x":"ב״אלון תעשיות בע״מ״, לפי הדוחות המבוקרים ליום 30.6, <b>יתרת העודפים שלילית</b>: הפסד צבור של 3 מיליון ₪, בגלל הפסדים כבדים בעבר. אבל בשנתיים האחרונות הרוויחה החברה 2 מיליון ₪ ו-2.5 מיליון ₪, כלומר <b>עודפים שנצברו בשנתיים האחרונות</b> של 4.5 מיליון ₪. באוגוסט, אחרי תאריך הדוחות, היא חילקה מיליון ₪. בנובמבר היא שוקלת חלוקה נוספת. <b>חישוב</b>: הגבוה מבין (3-) ו-4.5 הוא 4.5 מיליון ₪. בניכוי החלוקה של אוגוסט נשארים 3.5 מיליון ₪. הדוחות ליום 30.6 עדיין ״טריים״, כי נובמבר הוא פחות מ-6 חודשים אחרי 30.6. <b>מסקנה</b>: מבחן הרווח מתיר עד 3.5 מיליון ₪, בכפוף למבחן יכולת הפירעון. חלוקה בפברואר כבר תחייב דוחות חדשים יותר."},{"t":"p","x":"<b>מבחן יכולת הפירעון</b> שואל שאלה אחת: האם יש <b>חשש סביר</b> שבגלל החלוקה החברה לא תוכל לשלם את חבויותיה <b>הקיימות והצפויות</b> כשיגיע מועד פירעונן? המילה ״צפויות״ היא המפתח: הדירקטוריון חייב להסתכל קדימה. הוא צריך לבחון תזרים מזומנים, הלוואות שמועדן מתקרב, התחייבויות שעומדות להיווצר, ו<b>תחזיות הפסד</b> שהוצגו לו. אין בחוק ״אופק״ קבוע, כמו ״שנתיים״. הבדיקה היא לפי מועדי הפירעון של החבויות בפועל. הדירקטורים מפעילים שיקול דעת עסקי, אבל הוא חייב להתבסס על מידע מלא ולהיות מתועד."},{"t":"example","title":"דוגמה: תחזית הפסד מול עודפים (בסגנון המבחן)","x":"דירקטוריון ״אלפא בע״מ״ מחליט על דיבידנד של 5 מיליון ₪. לפי הדוחות יש עודפים של 10 מיליון ₪. באותה ישיבה מציג סמנכ״ל הכספים תחזית: הפסד של 12 מיליון ₪ ברבעון הקרוב בגלל משבר בענף, והתאוששות בהמשך. <b>מבחן הרווח</b>: מתקיים (10 ≥ 5). <b>מבחן יכולת הפירעון</b>: אי אפשר להתעלם מהתחזית, כי ״חבויות צפויות״ ותזרים צפוי הם בדיוק מה שהמבחן בודק. הדירקטוריון חייב לשקול איך ההפסד הצפוי ישפיע על היכולת לשלם ספקים, עובדים ומלווים במועד. אם הפסד כזה יחד עם יציאת 5 מיליון ₪ מהקופה מעורר חשש סביר לאי-עמידה בהתחייבויות, <b>החלוקה אסורה</b>. התשובה הנכונה במבחן הייתה: ״החלוקה אסורה כי הדירקטורים חייבים להתחשב בהפסד הצפוי״. התשובות ״מבחן הרווח מתבסס רק על העבר ולכן מותר״ ו״החלוקה תלויה באישור בית משפט״ שגויות."},{"t":"case","name":"ע\"א 1734/21 ברוט נ' חברת השקעות דיסקונט בע\"מ","x":"מבחן הרווח הוא מבחן טכני שצופה פני עבר, ונבחן לפי הגדרתו המדויקת בחוק, כלומר לפי הדוחות הכספיים האחרונים. מבחן יכולת הפירעון הוא המבחן המהותי שצופה פני עתיד, ובמסגרתו הדירקטוריון חייב לשקול גם אירועים שעדיין לא באו לידי ביטוי בדוחות. בית המשפט צמצם בכך את הגישה שעלתה בעניין להב, שלפיה אירוע מהותי צפוי עשוי לפגוע כבר בעמידה במבחן הרווח. זה בדיוק ההיגיון של שאלת ״התחזית״ במבחן: את ההפסד הצפוי שוקלים במבחן יכולת הפירעון."},{"t":"example","title":"דוגמה: כשל ברור במבחן יכולת הפירעון","x":"ל״טבעונית בע״מ״ יתרת עודפים חיובית, ולכן מבחן הרווח מתקיים. אבל יש לה התחייבויות שוטפות של כ-12 מיליון ₪ לפירעון בחודשים הקרובים, ובקופה כ-3 מיליון ₪ בלבד. הדירקטוריון מחלק 10 מיליון ₪. זה כשל ברור במבחן יכולת הפירעון, ולכן החלוקה אסורה (ס' 301(ב)). הסימן שהתקיים בפועל: זמן קצר אחרי החלוקה ספק לא קיבל את כספו."},{"t":"trap","x":"שלוש טעויות קלאסיות: (1) ״יש עודפים, ולכן מותר״. מבחן הרווח לבד לא מספיק; המבחנים <b>מצטברים</b>. (2) ״הפסד צפוי מוכיח <i>בהכרח</i> חדלות פירעון״. גם זה לא נכון. השאלה היא אם יש <b>חשש סביר</b> לאי-עמידה בחבויות, וזה תלוי בתזרים, בנזילות ובמסגרות האשראי. (3) ״אם יש ספק, פונים לבית המשפט לפי ס' 303״. לא נכון: ס' 303 עוזר רק למי שנכשל ב<b>מבחן הרווח</b>, ובית המשפט עדיין דורש שמבחן יכולת הפירעון יתקיים."},{"t":"h","x":"חלוקה באישור בית משפט: ס' 303"},{"t":"law","law":"חוק החברות","sec":"303(א)","x":"בית המשפט רשאי, לבקשת חברה, לאשר לה לבצע חלוקה שלא מקיימת את מבחן הרווח, ובלבד ששוכנע שמתקיים מבחן יכולת הפירעון."},{"t":"steps","title":"הליך לפי ס' 303","x":["החברה מגישה בקשה לבית המשפט (ס' 303(א)).","החברה מודיעה לנושיה על הבקשה, באופן שקבע השר (ס' 303(ב)).","נושה רשאי להתנגד (ס' 303(ג)).","בית המשפט שומע את הנושים המתנגדים, ואז מאשר את הבקשה כולה או חלקה, דוחה אותה, או מתנה את האישור בתנאים (ס' 303(ד))."]},{"t":"case","name":"ע\"א 7735/14 ורדניקוב נ' אלוביץ'","x":"פרשת דיבידנד בזק: חלוקה בדרך של הפחתת הון באישור בית משפט, כשהחלוקה לא עמדה במבחן הרווח. חלוקה שוויונית לכל בעלי המניות אינה ״עסקה חריגה״ עם בעל השליטה, גם כשיש לו אינטרס מובהק בה. במקרה כזה חל סטנדרט ביניים של ״בחינה מוגברת״, ומשעמד בו הדירקטוריון, החלטתו הוגנה בכלל שיקול הדעת העסקי."},{"t":"p","x":"דוגמה טיפוסית: חברה עם הפסד צבור, שגם בשנתיים האחרונות לא הרוויחה, אבל יש לה מזומנים רבים ממכירת נכס ואין לה חובות משמעותיים. מבחן הרווח נכשל, ומבחן יכולת הפירעון מתקיים. זה בדיוק המקרה של ס' 303. ״הפחתת הון״ ממשית, כלומר החזרת הון לבעלי המניות, נעשית בדרך זו."},{"t":"h","x":"הקצאת מניות מתחת לערך הנקוב: ס' 304"},{"t":"p","x":"ס' 304 אינו עוסק ב״חלוקה״, אבל הוא חלק מאותו פרק ומגן על אותו עיקרון: הון המניות הנקוב הוא ״כרית״ שהנושים רואים. בעל מניה אחראי לפרוע לפחות את הערך הנקוב של מניותיו, אלא אם התקיים ס' 304 (ס' 35(ב))."},{"t":"law","law":"חוק החברות","sec":"304(א)","x":"החליטה חברה להקצות מניות שלהן ערך נקוב, בתמורה הנמוכה מערכן הנקוב, לרבות מניות הטבה, עליה להפוך להון מניות חלק מרווחיה, כמשמעותם בסעיף 302(ב), מפרמיה על מניות, או מכל מקור אחר הכלול בהונה העצמי, האמורים בדוחות הכספיים האחרונים שלה, בסכום השווה להפרש שבין הערך הנקוב לבין התמורה."},{"t":"example","title":"דוגמה: הקצאה ״בניכיון״","x":"חברה מקצה 10,000 מניות בנות 5 ₪ ע.נ. במחיר 3 ₪ למניה. ההפרש: 2 ₪ × 10,000 = 20,000 ₪. לפי ס' 304(א), עליה להעביר 20,000 ₪ מרווחיה (כמשמעותם בס' 302(ב)), מפרמיה על מניות או ממקור אחר בהון העצמי, אל הון המניות. אם אין לה מקור כזה, היא צריכה <b>אישור בית משפט</b> (ס' 304(ב)). אותו היגיון חל על <b>מניות הטבה</b> שמוקצות בלי תמורה: מהוונים סכום השווה לכל הערך הנקוב שלהן."},{"t":"trap","x":"הטעות כאן היא לחשוב ש״הקצאה מתחת לערך הנקוב תמיד דורשת בית משפט״. לפי ס' 304(א) אין צורך בבית משפט כשהחברה הופכת להון מניות סכום מתאים מהרווחים, מהפרמיה או ממקור אחר בהון העצמי. בית המשפט נדרש רק כשאין מקור כזה (ס' 304(ב))."},{"t":"h","x":"מי מחליט ולמי מגיע: ס' 306–307"},{"t":"law","law":"חוק החברות","sec":"307","x":"החלטת החברה על חלוקת דיבידנד תתקבל בדירקטוריון החברה, ואולם חברה רשאית לקבוע בתקנונה כי ההחלטה תתקבל באחת מהדרכים הבאות: … באסיפה הכללית, לאחר שתובא בפניה המלצת הדירקטוריון; האסיפה רשאית לקבל את ההמלצה או להקטין את הסכום אך לא להגדילו; … בדירקטוריון החברה, לאחר שהאסיפה קבעה את סכום החלוקה המרבי; … בדרך אחרת שנקבעה בתקנון, ובלבד שניתנה הזדמנות נאותה לדירקטוריון לקבוע, בטרם תבוצע החלוקה, כי החלוקה אינה חלוקה אסורה."},{"t":"p","x":"ההיגיון: <b>הדירקטוריון הוא שומר הסף</b> של מבחני החלוקה, ולכן גם כשהתקנון מעביר את ההחלטה לאסיפה, היא לא יכולה להגדיל את הסכום מעבר להמלצת הדירקטוריון. הזכות של בעל המניה לדיבידנד קמה רק אחרי החלטה (ס' 306(א)), והחלוקה בין בעלי המניות היא לפי הערך הנקוב (ס' 306(ב), ראו יחידה 9)."},{"t":"h","x":"רכישה עצמית ומניות רדומות: ס' 308–309"},{"t":"table","head":["מצב","הכלל","סעיף"],"rows":[["החברה רכשה ממניותיה","זו חלוקה ולכן חייבת לעמוד במבחנים. החברה רשאית לבטל את המניה; אם לא ביטלה, זו ״מניה רדומה״ שאינה מקנה זכויות כלשהן כל עוד היא בבעלות החברה","ס' 1, ס' 308(א)"],["חברה בת או תאגיד בשליטה רכשו מניות של האם","מותר באותו היקף שבו האם רשאית לחלק, ובלבד שהדירקטוריון של הבת קבע שאילו האם הייתה רוכשת, זו הייתה חלוקה מותרת","ס' 309(א)"],["מניית האם בידי הבת","לא מקנה זכויות הצבעה כל עוד היא בבעלות הבת","ס' 309(ב)"],["הבת אינה בבעלות מלאה של האם","החלוקה נחשבת בסכום הרכישה כפול שיעור החזקת האם בבת","ס' 309(ד)"],["פדיון ניירות ערך בני פדיון לפי תנאיהם","לא חלות מגבלות הפרק, אלא אם הם נחשבים חלק מההון העצמי","ס' 312(ב), (ד)"]]},{"t":"h","x":"כשהחלוקה אסורה: מי משיב ומי אחראי?"},{"t":"law","law":"חוק החברות","sec":"310(א)","x":"ביצעה חברה חלוקה אסורה, יהיה על בעל מניה להשיב לחברה את שקיבל, זולת אם לא ידע ולא היה עליו לדעת כי החלוקה שבוצעה אסורה."},{"t":"law","law":"חוק החברות","sec":"310(ב)","x":"חזקה על בעל מניה בחברה ציבורית, שלא היה דירקטור, מנהל כללי או בעל השליטה בחברה במועד החלוקה, שלא ידע ולא היה עליו לדעת, כי חלוקה שבוצעה היא חלוקה אסורה."},{"t":"law","law":"חוק החברות","sec":"311","x":"בוצעה בחברה חלוקה אסורה יראו כל מי שהיה דירקטור במועד החלוקה כמי שהפר בכך את חובותיו לפי סעיפים 252, 253 או 254, לפי הענין לחברה, אלא אם כן הוכיח אחד מאלה: … שהתנגד לחלוקה האסורה ונקט בכל האמצעים הסבירים כדי למנעה; … שהסתמך בתום לב הסתמכות סבירה על מידע שאלולא היה מטעה היתה החלוקת מותרת; … שבנסיבות הענין, לא ידע ולא היה עליו לדעת על החלוקה."},{"t":"law","law":"חוק החברות","sec":"259(ב)","x":"על אף הוראות סעיף קטן (א), חברה אינה רשאית לפטור מראש דירקטור מאחריותו כלפיה עקב הפרת חובת הזהירות בחלוקה."},{"t":"table","head":["מי","התוצאה","הערה"],"rows":[["בעל מניה (כלל)","משיב לחברה את מה שקיבל, אלא אם לא ידע ולא היה עליו לדעת (ס' 310(א))","נטל ההוכחה על בעל המניה"],["בעל מניה מהציבור בחברה ציבורית","חזקה שלא ידע ולא היה עליו לדעת (ס' 310(ב))","בפועל קשה מאוד להשיב מהציבור"],["דירקטור, מנכ״ל או בעל שליטה בחברה ציבורית","החזקה לא חלה עליהם; ישיבו אלא אם יוכיחו שלא ידעו ולא היה עליהם לדעת","בדרך כלל ידעו"],["כל מי שהיה דירקטור במועד החלוקה","חזקת הפרה של ס' 252–254, אלא אם הוכיח אחת משלוש ההגנות (ס' 311)","חובת זהירות או אמונים, ״לפי הענין״"],["פטור לדירקטור","אסור לפטור מראש בשל הפרת זהירות בחלוקה (ס' 259(ב))","גם אם יש בתקנון הוראת פטור כללית"],["נושה","רשאי להגיש תביעה נגזרת בשם החברה בשל חלוקה אסורה (ס' 204)","ההשבה היא לחברה"]]},{"t":"trap","x":"שלוש נקודות שבודקים: (1) ההגנה הראשונה בס' 311 דורשת <b>שני רכיבים</b>: להתנגד <b>וגם</b> לנקוט בכל האמצעים הסבירים כדי למנוע. הצבעה נגד בלבד לא מספיקה. (2) החזקה של ס' 310(ב) חלה רק ב<b>חברה ציבורית</b> ורק על מי שאינו דירקטור, מנכ״ל או בעל שליטה. בחברה פרטית חל הכלל של ס' 310(א). (3) סמנכ״לית כספים שמחזיקה מניות בחברה ציבורית ואינה דירקטורית נהנית מהחזקה, כי היא לא ברשימה. אבל החזקה ניתנת לסתירה: אם הוכח שידעה, היא תשיב."},{"t":"exam","x":"איך זה נשאל: (1) <b>שאלה אמריקאית</b> של ״עודפים מול תחזית הפסד״. התשובה: החלוקה אסורה כי במבחן יכולת הפירעון חובה לשקול את ההפסד הצפוי. פסלו תשובות שמסתפקות במבחן הרווח, שממציאות ״אופק של שנתיים״ או ״הכרח״, או שמפנות לבית משפט. (2) <b>שאלה פתוחה</b>: (א) הגדירו ״חלוקה״ (ס' 1); (ב) שני המבחנים המצטברים (ס' 302(א)–(ב)), ויישום מספרי על העובדות: עודפים, מזומנים מול התחייבויות; (ג) תוצאה: חלוקה אסורה (ס' 301(ב)); (ד) השבה (ס' 310(א)) והחזקה לציבור (ס' 310(ב)), עם ציון מי לא נהנה ממנה; (ה) אחריות דירקטורים (ס' 311) ושלוש ההגנות; (ו) אין פטור (ס' 259(ב)); (ז) מי יתבע: החברה, תביעה נגזרת של בעל מניה או של נושה (ס' 194, ס' 204), או נאמן בחדלות פירעון."}],"mcq":[{"id":"u10-1","q":"דירקטוריון ״גמא בע״מ״ החליט על דיבידנד של 6 מיליון ₪, על בסיס דוחות כספיים מבוקרים מלפני שלושה חודשים המראים יתרת עודפים של 14 מיליון ₪. באותה ישיבה הוצגה תחזית להפסד של 10 מיליון ₪ בשני הרבעונים הקרובים, בגלל אובדן לקוח מרכזי. האם החלוקה חוקית?","o":["כן, כי מבחן הרווח מתקיים והוא מבוסס על דוחות העבר בלבד.","החלוקה מותרת רק אם הדירקטוריון, לאחר ששקל את ההפסד הצפוי, יכול לקבוע שאין חשש סביר שהחלוקה תמנע מהחברה לעמוד בחבויותיה הקיימות והצפויות במועדן; אחרת היא אסורה.","לא, כי לפי מבחן יכולת הפירעון החברה חייבת להבטיח עמידה בכל התחייבויותיה בשנתיים הקרובות, וההפסד מוכיח בהכרח שלא תעמוד בהן.","החלוקה טעונה אישור בית המשפט בגלל התחזית.","החלוקה מותרת רק אם ההכנסות הצפויות בהמשך השנה יכסו את ההפסד במלואו."],"a":1,"why":"מבחן יכולת הפירעון צופה פני עתיד ובודק חבויות ״קיימות וצפויות״ (ס' 302(א)). לכן חובה לשקול את התחזית. השאלה היא אם קיים ״חשש סביר״ לאי-עמידה בחבויות במועדן. הפסד אינו שקול אוטומטית לאי-עמידה.","w":["מבחן הרווח לבד לא מספיק; המבחנים מצטברים.","","אין בחוק ״אופק של שנתיים״, והפסד אינו מוכיח ״בהכרח״ חדלות פירעון; המבחן הוא חשש סביר.","אישור בית משפט (ס' 303) נועד לחברה שנכשלה במבחן הרווח, וגם אז מבחן יכולת הפירעון חייב להתקיים.","המבחן אינו ״כיסוי ההפסד״ אלא היכולת לעמוד בחבויות במועדן."],"secs":["302(א)"]},{"id":"u10-2","q":"לפי הדוחות המבוקרים האחרונים של ״דלתא בע״מ״, שנערכו לפני ארבעה חודשים, יתרת העודפים שלילית (הפסד צבור של 2 מיליון ₪). בשנתיים האחרונות נצברו עודפים של 7 מיליון ₪. מאז תאריך הדוחות חולק דיבידנד של מיליון ₪. מהו הסכום המרבי שמבחן הרווח מתיר לחלק כעת?","o":["אפס, כי יתרת העודפים שלילית.","5 מיליון ₪ (7 פחות 2).","7 מיליון ₪.","4 מיליון ₪ (7 פחות 2 פחות 1).","6 מיליון ₪."],"a":4,"why":"״רווחים״ הם יתרת העודפים או העודפים שנצברו בשנתיים האחרונות, לפי הגבוה (7), תוך הפחתת חלוקות קודמות שלא הופחתו (1). כלומר 6 מיליון ₪ (ס' 302(ב)). הדוחות אינם מוקדמים ביותר מ-6 חודשים ממועד החלוקה.","w":["החוק מאפשר לבחור את הגבוה מבין שתי החלופות, ולכן יתרה שלילית לא חוסמת.","לא מקזזים את ההפסד הצבור; לוקחים את הגבוה מבין השניים.","שוכחים להפחית את החלוקה הקודמת שלא הופחתה מהעודפים.","קיזוז כפול: גם ההפסד הצבור (שאינו נלקח בחשבון כשבוחרים את החלופה הגבוהה) וגם החלוקה.",""],"secs":["302(ב)"]},{"id":"u10-3","q":"חברה מבקשת לחלק דיבידנד ביום 1 בנובמבר. הדוחות הכספיים המבוקרים האחרונים שלה נערכו ליום 31 בדצמבר בשנה הקודמת, והם מראים עודפים גבוהים. מה נכון?","o":["אפשר להסתמך על הדוחות, כי הם הדוחות המבוקרים האחרונים.","אפשר להסתמך עליהם אם האסיפה הכללית תאשר את החלוקה.","אי אפשר לבסס את מבחן הרווח על הדוחות האלה, כי הם נערכו למועד מוקדם ביותר משישה חודשים לפני החלוקה; יש להסתמך על דוחות מותאמים מבוקרים או סקורים עדכניים יותר.","מבחן הרווח לא חל כשהעודפים גבוהים מהחלוקה.","יש לפנות לבית המשפט לפי ס' 303."],"a":2,"why":"לפי ס' 302(ב), ״רווחים״ נקבעים על פי הדוחות האחרונים, ״ובלבד שהמועד שלגביו נערכו הדוחות אינו מוקדם ביותר מששה חודשים ממועד החלוקה״. 31 בדצמבר מוקדם בעשרה חודשים. אפשר להשתמש בדוחות סקורים (למשל רבעוניים).","w":["הדרישה היא לא רק ״אחרונים״ אלא גם עדכניים, ולא יותר מ-6 חודשים.","אישור האסיפה לא מרפא אי-עמידה בדרישות ס' 302.","","ההיפך: יש להוכיח את מבחן הרווח על פי דוחות כשירים.","ס' 303 נועד למי שאין לו רווחים, לא לפתרון בעיה של דוחות לא עדכניים; הפתרון הוא דוחות סקורים עדכניים."],"secs":["302(ב)"]},{"id":"u10-4","q":"ל״זיו בע״מ״ אין עודפים כלל, גם לא בשנתיים האחרונות. היא מכרה את פעילותה ויש בקופתה 50 מיליון ₪ במזומן, מול חובות של 5 מיליון ₪ בלבד. בעלי המניות רוצים לקבל 30 מיליון ₪. מה נכון?","o":["החברה רשאית לבקש מבית המשפט לאשר חלוקה שאינה מקיימת את מבחן הרווח. בית המשפט יאשר אם שוכנע שמבחן יכולת הפירעון מתקיים, אחרי שהחברה הודיעה לנושים ונתנה להם הזדמנות להתנגד.","מותר לחלק בלי אישור, כי מבחן יכולת הפירעון מתקיים בבירור.","מותר לחלק אם האסיפה הכללית תאשר זאת ברוב מיוחד.","מותר לחלק רק אם הנושים יסכימו פה אחד.","אסור לחלק בשום מקרה, כי מבחן הרווח נכשל."],"a":0,"why":"ס' 303(א) מאפשר חלוקה שאינה עומדת במבחן הרווח, באישור בית משפט, כשמבחן יכולת הפירעון מתקיים. החברה מודיעה לנושים (ס' 303(ב)), הם רשאים להתנגד (ס' 303(ג)), ובית המשפט רשאי לאשר, לדחות או להתנות (ס' 303(ד)).","w":["","בלי עמידה במבחן הרווח נדרש אישור בית משפט.","אין בחוק מסלול כזה.","הנושים רשאים להתנגד, וההכרעה בידי בית המשפט; אין דרישה להסכמה פה אחד.","יש מסלול חלופי: ס' 303."],"secs":["303"]},{"id":"u10-5","q":"חברה עומדת במבחן הרווח, אבל הדירקטוריון יודע שאחרי החלוקה יהיה חשש סביר שלא תעמוד בתשלום הלוואה גדולה שמועד פירעונה בעוד חודשיים. הדירקטורים מציעים לפנות לבית המשפט. מה נכון?","o":["בית המשפט רשאי לאשר את החלוקה, כי מבחן הרווח מתקיים.","בית המשפט רשאי לאשר את החלוקה אם הנושים לא יתנגדו.","החלוקה מותרת אם בעל השליטה יערוב אישית להלוואה, בלי צורך בבדיקה נוספת.","אין מסלול שמתיר את החלוקה: מבחן יכולת הפירעון הוא תנאי הכרחי בכל מקרה, וגם בית המשפט לפי ס' 303 מאשר רק כשהוא מתקיים.","החלוקה מותרת אם האסיפה תחליט עליה במקום הדירקטוריון."],"a":3,"why":"לפי ס' 302(א) שני המבחנים מצטברים. ס' 303(א) מאפשר לוותר רק על מבחן הרווח, ״ובלבד ששוכנע שמתקיים מבחן יכולת הפירעון״.","w":["ס' 303 לא נועד למצב שבו מבחן הרווח מתקיים ומבחן יכולת הפירעון נכשל.","היעדר התנגדות לא מרפא כשל במבחן יכולת הפירעון.","ערבות עשויה להשפיע על הערכת החשש, אבל עדיין צריך לבחון את מבחן יכולת הפירעון. אין ״פטור אוטומטי״.","","האורגן המחליט אינו משנה את המבחנים, והאסיפה לא יכולה להגדיל מעבר להמלצת הדירקטוריון (ס' 307(1))."],"secs":["303","302(א)"]},{"id":"u10-6","q":"״אור טק בע״מ״, חברה ציבורית, חילקה דיבידנד אסור. מקבלי הדיבידנד: עמית, בעל השליטה (60%); רות, דירקטורית המחזיקה 1%; גיל, סמנכ״ל הכספים, שאינו דירקטור ומחזיק 0.5%; והציבור. על מי חלה החזקה שלא ידע ולא היה עליו לדעת שהחלוקה אסורה?","o":["על כולם, כי כולם בעלי מניות בחברה ציבורית.","על הציבור ועל גיל, אבל לא על עמית ולא על רות.","רק על הציבור.","על הציבור ועל רות, אבל לא על עמית ולא על גיל.","על אף אחד; בחברה ציבורית כל בעל מניה חייב להשיב."],"a":1,"why":"ס' 310(ב) מחיל את החזקה על בעל מניה בחברה ציבורית ״שלא היה דירקטור, מנהל כללי או בעל השליטה״. גיל, כסמנכ״ל כספים שאינו דירקטור, לא מוחרג. החזקה ניתנת לסתירה, ואם יוכח שידע, ישיב.","w":["עמית (בעל שליטה) ורות (דירקטורית) מוחרגים במפורש.","","גם גיל אינו ברשימת המוחרגים.","רות דירקטורית ולכן מוחרגת, וגיל אינו מוחרג.","הכלל הוא השבה ״זולת אם לא ידע״ (ס' 310(א)), ובחברה ציבורית יש לציבור חזקה מקלה (ס' 310(ב))."],"secs":["310(א)","310(ב)"]},{"id":"u10-7","q":"בישיבת דירקטוריון שבה הוחלט על חלוקה שהתבררה כאסורה, הדירקטור יונתן הצביע נגד והסביר שהחברה צפויה להיקלע לקשיי נזילות. מעבר לכך לא עשה דבר. מה נכון לגבי אחריותו?","o":["הוא פטור מאחריות, כי הצביע נגד.","הוא פטור, אם יש בתקנון הוראת פטור מאחריות על הפרת חובת זהירות.","רק דירקטורים שהצביעו בעד אחראים, ולכן הוא לא אחראי בשום מקרה.","אחריותו מוגבלת לסכום הדיבידנד שקיבל כבעל מניה.","הוא לא מוגן אוטומטית: כדי ליהנות מההגנה עליו להוכיח שהתנגד וגם נקט בכל האמצעים הסבירים כדי למנוע את החלוקה."],"a":4,"why":"ס' 311(1) דורש שני רכיבים: ״שהתנגד לחלוקה האסורה ונקט בכל האמצעים הסבירים כדי למנעה״. הצבעה נגד בלבד אינה מספיקה (למשל: לא דרש לתעד, לא פנה לוועדת הביקורת ולא נקט צעד נוסף סביר).","w":["הצבעה נגד היא רק חצי מההגנה.","אין לפטור מראש דירקטור בשל הפרת זהירות בחלוקה (ס' 259(ב)).","ס' 311 חל על ״כל מי שהיה דירקטור במועד החלוקה״.","ס' 311 רואה בו מפר של ס' 252–254, ואחריותו לנזק החברה אינה מוגבלת לדיבידנד שקיבל.",""],"secs":["311"]},{"id":"u10-8","q":"בתקנון ״נחל בע״מ״ נקבע שהחברה פוטרת מראש את נושאי המשרה בה מאחריות בשל הפרת חובת הזהירות כלפיה. הדירקטורים אישרו ברשלנות חלוקה אסורה. מה נכון?","o":["הפטור תקף, כי הוא ניתן מראש והתקנון מתיר אותו.","הפטור תקף רק לגבי דירקטורים חיצוניים.","הפטור לא יחול על הדירקטורים בגלל החלוקה, כי אסור לפטור מראש דירקטור מאחריותו בשל הפרת חובת הזהירות בחלוקה.","הפטור תקף אם האסיפה הכללית אישרה את החלוקה.","הפטור בטל רק אם הדירקטורים פעלו בכוונה; ברשלנות הוא תקף."],"a":2,"why":"ס' 259(ב) קובע במפורש: ״חברה אינה רשאית לפטור מראש דירקטור מאחריותו כלפיה עקב הפרת חובת הזהירות בחלוקה״. זה חריג לכלל של ס' 259(א).","w":["הכלל של ס' 259(א) כפוף לחריג של ס' 259(ב).","אין הבחנה כזו בס' 259(ב).","","אישור האסיפה לא מכשיר חלוקה אסורה ולא יוצר פטור.","ס' 263(2) עוסק בכוונה או פזיזות באופן כללי; בחלוקה האיסור חל גם על רשלנות."],"secs":["259(ב)"]},{"id":"u10-9","q":"״רימון בע״מ״ מכרה לבעל השליטה בה, המחזיק 80% ממניותיה, מגרש ששוויו 10 מיליון ₪ תמורת 6 מיליון ₪. מה נכון?","o":["זו העברה ללא תמורה שוות ערך לבעל מניה, ולכן היא עשויה להיחשב ״דיבידנד״ בסך 4 מיליון ₪, שכפוף למבחני החלוקה.","זו עסקה רגילה, ולכן רק שאלה של חובת זהירות של הדירקטוריון.","זו חלוקה רק אם הוחלט עליה באסיפה הכללית.","אין כאן חלוקה, כי לא שולם כסף לבעל השליטה.","זו חלוקה, אבל כיוון שבעל השליטה קיבל אותה, בעלי המניות האחרים אינם זכאים לדבר."],"a":0,"why":"״דיבידנד״ כולל ״העברה ללא תמורה שוות ערך״ לבעל מניה מכוח היותו בעל מניה (ס' 1). לכן ההפרש של 4 מיליון ₪ הוא חלוקה שצריכה לעמוד בס' 302. היא מעוררת גם בעיות של עסקה עם בעל שליטה וחובת הגינות.","w":["","העברת ערך לבעל מניה בלי תמורה מלאה היא בדיוק ה״דיבידנד המוסווה״.","ההגדרה מהותית, לא פורמלית.","דיבידנד הוא ״כל נכס… בין במזומן ובין בכל דרך אחרת״.","מתן ערך רק לבעל השליטה הוא גם חלוקה שאינה יחסית (ס' 306(ב)) וגם קיפוח פוטנציאלי של המיעוט; זו לא ״זכות״ של בעל השליטה."],"secs":["1","302"]},{"id":"u10-10","q":"חברה מבקשת להקצות לכל בעלי מניותיה מניות הטבה בנות 1 ₪ ע.נ., בלי תמורה. מה נדרש?","o":["אישור בית משפט בכל מקרה, כי זו הקצאה מתחת לערך הנקוב.","עמידה במבחן הרווח ובמבחן יכולת הפירעון, כי מניות הטבה הן ״חלוקה״.","אין צורך בשום פעולה, כי מניות הטבה אינן מקנות זכויות.","על החברה להפוך להון מניות סכום השווה לערך הנקוב של מניות ההטבה, מרווחיה, מפרמיה או ממקור אחר בהונה העצמי; אם אין מקור כזה, נדרש אישור בית משפט.","אישור האסיפה הכללית ברוב מיוחד."],"a":3,"why":"ס' 304(א) חל במפורש על הקצאה בתמורה נמוכה מהערך הנקוב, ״לרבות מניות הטבה״, ומחייב היוון מרווחים, מפרמיה או ממקור אחר בהון העצמי. אם אין מקור כזה, ס' 304(ב) מאפשר אישור בית משפט. מניות הטבה מוחרגות מהגדרת ״דיבידנד״ (ס' 1).","w":["בית משפט נדרש רק כשאין מקור להיוון (ס' 304(ב)).","מניות הטבה מוחרגות מהגדרת דיבידנד, ולכן אינן חלוקה.","מניות הטבה הן מניות לכל דבר; והיוון נדרש לפי ס' 304(א).","","אין דרישה כזו בחוק."],"secs":["304"]},{"id":"u10-11","q":"״כרמים בע״מ״ רכשה 10% ממניותיה מבעלי מניות שרצו לצאת, ולא ביטלה את המניות. מה נכון?","o":["הרכישה אינה חלוקה, כי היא עסקה בתמורה מלאה.","הרכישה היא ״חלוקה״ ולכן כפופה למבחני ס' 302. כל עוד המניות בבעלות החברה, הן מניות רדומות שאינן מקנות זכויות כלשהן.","החברה חייבת לבטל את המניות תוך 30 יום.","המניות מקנות לחברה זכות לדיבידנד, שישמש להקטנת חובותיה.","המניות ממשיכות להקנות לחברה זכות הצבעה באסיפה."],"a":1,"why":"״חלוקה״ כוללת ״רכישה״ בידי החברה של מניותיה (ס' 1). לפי ס' 308(א) החברה רשאית לבטל את המניה, ואם לא ביטלה, זו מניה רדומה שאינה מקנה זכויות כל עוד היא בבעלות החברה.","w":["מבחינת הנושים, רכישה עצמית מוציאה כסף לבעלי מניות בדיוק כמו דיבידנד, ולכן החוק כולל אותה בהגדרה.","","הביטול הוא רשות (״רשאית״), לא חובה.","אין לה שום זכויות, כולל דיבידנד.","מניה רדומה ״לא תקנה… זכויות כלשהן״."],"secs":["308(א)","1"]},{"id":"u10-12","q":"בתקנון ״ארז בע״מ״ נקבע שההחלטה על דיבידנד תתקבל באסיפה הכללית לאחר המלצת הדירקטוריון. הדירקטוריון המליץ על 2 מיליון ₪, ובעל השליטה מבקש שהאסיפה תחליט על 3 מיליון ₪. מה נכון?","o":["האסיפה רשאית להחליט על כל סכום, כי התקנון העביר אליה את הסמכות.","האסיפה רשאית להגדיל רק אם 75% מבעלי המניות יתמכו.","ההוראה בתקנון בטלה, כי רק הדירקטוריון מוסמך להחליט על דיבידנד.","האסיפה רשאית להגדיל אם מבחן הרווח מתקיים גם לגבי 3 מיליון ₪.","האסיפה רשאית לקבל את ההמלצה או להקטין את הסכום, אבל לא להגדילו."],"a":4,"why":"ס' 307(1): כשהתקנון קובע שההחלטה באסיפה לאחר המלצת הדירקטוריון, ״האסיפה רשאית לקבל את ההמלצה או להקטין את הסכום אך לא להגדילו״.","w":["הסמכות של האסיפה מוגבלת בלשון החוק.","אין רוב שמאפשר הגדלה.","ס' 307 מתיר במפורש לקבוע זאת בתקנון.","גם אם מבחן הרווח מתקיים, החוק אוסר הגדלה מעבר להמלצה, כי הדירקטוריון אחראי לבחון את מבחן יכולת הפירעון.",""],"secs":["307"]},{"id":"u10-13","q":"״בת בע״מ״, חברה בבעלות מלאה של ״אם בע״מ״, רכשה 5% ממניות ״אם בע״מ״ בבורסה. מה נכון?","o":["הרכישה אינה חלוקה, כי הרוכשת היא חברה אחרת.","״בת בע״מ״ תוכל להצביע במניות לפי הוראות ״אם בע״מ״.","הרכישה מותרת רק באותו היקף שבו ״אם בע״מ״ רשאית לבצע חלוקה, והמניות לא יקנו זכויות הצבעה כל עוד הן בידי ״בת בע״מ״.","הרכישה אסורה בכל מקרה.","הרכישה מותרת בכל היקף, כי ״בת בע״מ״ משתמשת בכספה שלה."],"a":2,"why":"״רכישה״ בהגדרת חלוקה כוללת רכישה בידי חברה בת (ס' 1). ס' 309(א) מתיר זאת באותו היקף שבו האם רשאית לחלק, בכפוף לקביעת הדירקטוריון של הבת. ס' 309(ב) שולל זכויות הצבעה במניות כל עוד הן בידי הבת.","w":["הגדרת ״רכישה״ כוללת במפורש ״בידי חברה בת שלה״.","ס' 309(ב) שולל זכויות הצבעה.","","הרכישה מותרת בתנאי ס' 309(א).","ההיקף מוגבל ליכולת החלוקה של האם."],"secs":["309(ב)","309(א)"]}],"cases":[{"id":"u10-c1","title":"״שקד מזון״: דיבידנד בצל תחזית קשה","facts":"״שקד מזון בע״מ״ היא חברה ציבורית. רונן מחזיק 55% ממניותיה ומכהן כמנכ״ל ודירקטור. היתרה בידי הציבור. בתקנון יש הוראה שפוטרת מראש את כל נושאי המשרה מאחריות בשל הפרת חובת הזהירות. בחודש מאי החליט הדירקטוריון על דיבידנד של 8 מיליון ₪, על סמך דוחות כספיים סקורים ליום 31 במרץ שהראו יתרת עודפים של 9 מיליון ₪. באותה ישיבה הציג סמנכ״ל הכספים תחזית לפיה בגלל ביטול חוזה עם רשת שיווק צפוי הפסד של 6 מיליון ₪ בחצי השנה הקרובה, ולחברה הלוואה בנקאית של 7 מיליון ₪ שמועד פירעונה בעוד ארבעה חודשים, כשבקופה 10 מיליון ₪. הדירקטורית מיכל הצביעה נגד, ביקשה לרשום בפרוטוקול את התנגדותה ופנתה בכתב ליו״ר ועדת הביקורת ולרואה החשבון המבקר בדרישה לעצור את החלוקה. שאר הדירקטורים הצביעו בעד. הדיבידנד שולם ביוני. בספטמבר לא פרעה החברה את ההלוואה, והבנק דורש את כספו.","parts":[{"q":"האם החלוקה מותרת? מה התוצאות כלפי בעלי המניות וכלפי הדירקטורים? נמקו והפנו לסעיפי החוק.","pts":25,"model":["1. תשלום דיבידנד הוא ״חלוקה״ (ס' 1), ומותר רק אם מתקיימים במצטבר מבחן הרווח ומבחן יכולת הפירעון (ס' 302(א)).","2. מבחן הרווח: לפי דוחות סקורים ליום 31.3, שאינם מוקדמים ביותר מ-6 חודשים ממועד החלוקה (ס' 302(ב)), יתרת העודפים 9 מיליון ₪ ≥ 8 מיליון ₪. המבחן מתקיים.","3. מבחן יכולת הפירעון: המבחן צופה פני עתיד ובודק חבויות ״קיימות וצפויות״. אחרי החלוקה יישארו בקופה כ-2 מיליון ₪, מול הלוואה של 7 מיליון ₪ בעוד ארבעה חודשים והפסד צפוי של 6 מיליון ₪. הדירקטוריון ידע על הנתונים. קיים חשש סביר, ואף ממשי, שהחברה לא תעמוד בחבויותיה במועדן. המבחן נכשל, והחלוקה אסורה (ס' 301(ב)). הכשל בפירעון בספטמבר מאשש זאת.","4. ס' 303 אינו מציל את החלוקה: הוא חל רק על כשל במבחן הרווח ודורש עמידה במבחן יכולת הפירעון. וממילא לא הוגשה בקשה.","5. השבה מבעלי המניות (ס' 310(א)): בעל מניה ישיב את מה שקיבל, אלא אם לא ידע ולא היה עליו לדעת. לציבור יש חזקה שלא ידע (ס' 310(ב)), ולכן ההשבה ממנו קשה. לרונן, כבעל שליטה, מנכ״ל ודירקטור, החזקה אינה חלה. הוא נכח בישיבה וידע על התחזית, ולכן ישיב כ-4.4 מיליון ₪ (55% מ-8 מיליון).","6. אחריות הדירקטורים (ס' 311): כל מי שהיה דירקטור במועד החלוקה ייחשב כמי שהפר את ס' 252–254, אלא אם הוכיח הגנה. הדירקטורים שהצביעו בעד לא יוכלו לטעון שלא ידעו (ס' 311(3)) או שהסתמכו על מידע מטעה (ס' 311(2)), כי המידע שהוצג להם דווקא הזהיר מפני החלוקה.","7. מיכל: התנגדה וגם נקטה אמצעים סבירים: רישום בפרוטוקול ופנייה בכתב לוועדת הביקורת ולרואה החשבון המבקר. לכן יש לה טענה חזקה להגנה לפי ס' 311(1). בית המשפט יבחן אם נקטה ״בכל האמצעים הסבירים״.","8. הפטור בתקנון לא יעזור לדירקטורים: אסור לפטור מראש דירקטור בשל הפרת זהירות בחלוקה (ס' 259(ב)). לגבי רונן, כבעל שליטה שהצביע בעד חלוקה שממנה נהנה, ייתכן שמדובר גם בהפרת אמונים, שאין עליה פטור (ס' 263(1))."],"check":["הגדרת חלוקה ושני המבחנים המצטברים (ס' 302(א)).","יישום מבחן הרווח, כולל דרישת 6 החודשים (ס' 302(ב)).","יישום מספרי של מבחן יכולת הפירעון: מזומנים אחרי החלוקה, ההלוואה, ההפסד הצפוי; מסקנה: חלוקה אסורה (ס' 301(ב)).","ס' 303 לא רלוונטי ומדוע.","השבה לפי ס' 310(א)–(ב), והבחנה בין הציבור לבין רונן.","ס' 311: חזקת ההפרה ושלוש ההגנות, ויישום על מיכל ועל שאר הדירקטורים.","פטור אסור לפי ס' 259(ב)."]},{"q":"הבנק, נושה של החברה, שואל אילו צעדים עומדים לרשותו כדי שהכסף יחזור לקופת החברה. התייחסו.","pts":15,"model":["1. הבנק, כנושה, רשאי להגיש תביעה נגזרת בשם החברה בשל חלוקה אסורה (ס' 204). חלות עליה הוראות התביעה הנגזרת בשינויים המחויבים: דרישה לחברה, אלא אם מתקיים פטור לפי ס' 194(ד), ואישור בית משפט לפי ס' 198(א).","2. דרישה מוקדמת אינה נחוצה אם לאורגן המוסמך, הדירקטוריון, יש עניין אישי בהחלטה. כאן רוב הדירקטורים חשופים בעצמם לאחריות לפי ס' 311, ולכן יש בסיס לטעון לפטור לפי ס' 194(ד)(1).","3. הנתבעים: רונן ובעלי מניות אחרים שאינם נהנים מהחזקה, להשבה לפי ס' 310(א), והדירקטורים שהצביעו בעד, לפי ס' 311.","4. הסכומים ייפסקו לחברה, ומשם יעמדו לפירעון החוב לבנק. הבנק עשוי לקבל גמול והוצאות (ס' 199–201).","5. אם החברה תיכנס להליכי חדלות פירעון וימונה לה נאמן, לא תוגש תביעה נגזרת (ס' 205), והנאמן הוא שיתבע את ההשבה ואת אחריות הדירקטורים."],"check":["זכות הנושה לתביעה נגזרת בשל חלוקה אסורה (ס' 204).","דרישה מול פטור לפי ס' 194(ד), ואישור לפי ס' 198(א).","זיהוי הנתבעים: בעלי מניות לפי ס' 310 ודירקטורים לפי ס' 311.","ההשבה היא לחברה ולא ישירות לבנק.","ס' 205: בחדלות פירעון הנאמן תובע."]}]}]},{"id":"u11","title":"ניירות ערך ותשקיף","short":"ניירות ערך ותשקיף","blurb":"תדעו להבחין בין סוגי ניירות ערך ומניות, לחשב הקצאה במכרז במחיר אחיד, ולנתח אחריות לפרט מטעה בתשקיף: מי אחראי, מה ההגנות, ומתי אפשר לבטל רכישה.","secs":["1","33","34","285","286","288","289","312","ני\"ע 15","ני\"ע 15א","ני\"ע 16","ני\"ע 22","ני\"ע 31","ני\"ע 32","ני\"ע 33","ני\"ע 34","ני\"ע 35","289א","146","239"],"blocks":[{"t":"h","x":"מהו נייר ערך?"},{"t":"p","x":"חברה מגייסת כסף בשתי דרכים עיקריות: <b>הון</b> (מוכרת מניות, והמשקיעים הופכים לבעלים) או <b>חוב</b> (מנפיקה איגרות חוב, והמשקיעים הופכים לנושים). לצדן יש ניירות ״נגזרים״, כמו כתבי אופציה וניירות המירים, שמקנים זכות לרכוש או להמיר בעתיד."},{"t":"law","law":"חוק החברות","sec":"1","x":"”נייר ערך“ – לרבות מניה, איגרת חוב, או זכויות לרכוש, להמיר או למכור כל אחת מאלה;"},{"t":"table","head":["","מניה","איגרת חוב","אופציה (כתב אופציה)"],"rows":[["מעמד המחזיק","בעלים: חלק בהון המונפק","נושה: החברה חייבת לו כסף","זכות לרכוש מניה (או נייר אחר) במחיר מימוש"],["תשואה","דיבידנד אם הוחלט (ס' 306(א)), ועליית ערך","קרן וריבית לפי שטר הנאמנות או תנאי האג״ח, גם בלי רווחים","שווי הזכות; אין דיבידנד עד המימוש"],["הצבעה באסיפה","כן, לפי התקנון (ס' 188)","לא (יש אסיפות מחזיקים)","לא"],["בפירוק","אחרונים בתור (ליתרה, אחרי הנושים)","לפני בעלי המניות","לפי תנאיה"],["מי מחליט על ההנפקה","הדירקטוריון, עד גבול ההון הרשום (ס' 288(א))","הדירקטוריון, במסגרת סמכותו ללוות (ס' 289(א))","הדירקטוריון; נספרת כאילו מומשה (ס' 288(א))"]]},{"t":"law","law":"חוק החברות","sec":"285","x":"לחברה יכול שיהיו מניות, איגרות חוב, או ניירות ערך אחרים, שלכל אחד מהם זכויות שונות."},{"t":"law","law":"חוק החברות","sec":"1","x":"”איגרת חוב“ – מסמך שהנפיקה חברה המעיד על קיומה של התחייבות כספית שחבה החברה, ומגדיר את תנאיה, למעט שטרי חוב או שטרי חליפין שנתנה חברה במהלך עסקיה;"},{"t":"list","x":["<b>אג״ח קונצרניות</b>: איגרות חוב שמנפיקות חברות. המחזיק הלווה כסף לחברה וזכאי לקבל אותו בחזרה, עם ריבית ולעיתים הצמדה, במועדים שנקבעו. הסיכון הוא שהחברה לא תוכל לשלם.","<b>אג״ח ממשלתיות</b>: איגרות חוב שמנפיקה המדינה. ההיגיון זהה, אבל הלווה הוא הממשלה, ולכן הסיכון בדרך כלל נמוך יותר. הן אינן חלק מדיני החברות, ומוזכרות להשוואה.","<b>מובטחת או לא מובטחת</b>: איגרת חוב מובטחת היא איגרת שההתחייבות לפיה מובטחת בשעבוד על נכסי החברה (הגדרה בס' 1).","<b>סדרה</b>: איגרות חוב שוות-דרגה מאותה הנפקה (הגדרה בס' 1). בהנפקה לציבור ממונה <b>נאמן</b> שמייצג את המחזיקים מול החברה (ני״ע 35ב, 35ט).","<b>סחירות</b>: כמו מניה, גם איגרת חוב אפשר למכור, לתת במתנה ולהוריש. מי שרוכש אותה הופך לנושה במקום המחזיק הקודם. המסחר משנה את מחירה בשוק, אבל לא את סכום הקרן והריבית שהחברה חייבת."]},{"t":"law","law":"חוק החברות","sec":"289א","x":"על אף האמור בסעיפים 288 ו־289, חברה לא תנפיק ולא תקצה נייר ערך למוכ״ז."},{"t":"trap","x":"<b>״מניות למוכ״ז״ כבר אינן מותרות.</b> בעבר אפשר היה להנפיק מניה ״למוסר כתב זה״, שעוברת מיד ליד במסירת התעודה, בלי רישום של המחזיק. בסיכומים ישנים זה עדיין מופיע כ״סוג מניה״. היום החוק אוסר על חברה להנפיק או להקצות נייר ערך למוכ״ז (ס' 289א), כדי שתמיד יהיה ידוע מי מחזיק בניירות הערך."},{"t":"h","x":"סוגי מניות"},{"t":"p","x":"״חופש הגיוון״ (ס' 285, ס' 82(א)) מאפשר לחברה ליצור בתקנון סוגי מניות עם זכויות שונות. החוק כמעט לא מגדיר את הסוגים. התוכן שלהם נקבע ב<b>תקנון</b>, ולכן במבחן תמיד כותבים: ״בכפוף להוראות התקנון״."},{"t":"table","head":["סוג","מה מאפיין אותה","הערה למבחן"],"rows":[["מניה רגילה","הצבעה, דיבידנד ויתרה בפירוק, באופן יחסי","ברירת המחדל: קול אחד למניה (ס' 82(ג)), דיבידנד לפי ערך נקוב (ס' 306(ב))"],["מניית בכורה","עדיפות בדיבידנד או בהחזר הון בפירוק; לעיתים בלי זכות הצבעה","אין הגדרה בחוק; הזכויות חייבות להיות מפורטות בתקנון"],["מניית הנהלה","זכות מיוחדת למנות דירקטורים או להצביע בענייני ניהול","מקור כוח ״לא פרופורציונלי״; לבעליה עשויה להיות חובת הגינות לפי ס' 193(א)(3)"],["מניית זהב","מכריעה במצב של ״תיקו״ (Deadlock), או מקנה זכות וטו בעניינים מסוימים","נפוצה גם כשהמדינה שומרת זכויות בחברה שהופרטה"],["נייר ערך בר פדיון (מניה בת פדיון)","החברה רשאית לפדות אותו לפי תנאים שנקבעו בתקנון (ס' 312(א))","הפדיון לא כפוף למגבלות החלוקה (ס' 312(ב)), והנייר אינו חלק מההון העצמי, אלא אם הפדיון מוגבל לפירוק אחרי פירעון הנושים (ס' 312(ד))"]]},{"t":"law","law":"חוק החברות","sec":"312(ד)","x":"ניירות ערך בני פדיון לא ייחשבו כחלק מהונה העצמי של החברה, יהא כינוים אשר יהא, אלא אם כן הזכות לפדיונם הוגבלה למקרה של פירוק החברה לאחר פרעון כל התחייבויות החברה לנושיה בעת הפירוק"},{"t":"trap","x":"״מניה בת פדיון״ נשמעת כמו מניה, אבל לעניין ההון העצמי היא מתנהגת כמו חוב: ״יהא כינוים אשר יהא״. מצד שני, ניתן להצמיד לה זכויות של מניה, כמו הצבעה והשתתפות ברווחים (ס' 312(ג)). אל תניחו ש״מניית בכורה״ היא בהכרח ״בלי הצבעה״: הכול לפי התקנון."},{"t":"h","x":"הון רשום, הון מונפק וערך נקוב"},{"t":"p","x":"<b>הון רשום</b> הוא ה״תקרה״: מספר המניות לסוגיהן שהחברה רשאית להנפיק, כפי שנקבע בתקנון (ס' 33). <b>הון מונפק</b> הוא מה שהוקצה בפועל. למניות יכול שיהיה <b>ערך נקוב</b> או שלא יהיה, אבל כל מניות החברה חייבות להיות מאותו סוג בעניין זה (ס' 34(א)). הדירקטוריון מקצה עד גבול ההון הרשום. כדי לעבור את התקרה, האסיפה הכללית צריכה להגדיל את ההון הרשום (ס' 286)."},{"t":"law","law":"חוק החברות","sec":"288(א)","x":"הדירקטוריון רשאי להנפיק או להקצות מניות וניירות ערך אחרים, המירים או ניתנים למימוש למניות, עד גבול הון המניות הרשום של החברה; לענין זה יראו ניירות ערך הניתנים להמרה או למימוש במניות כאילו הומרו או מומשו במועד ההנפקה."},{"t":"example","title":"דוגמה: האם יש ״מקום״ בהון הרשום?","x":"ההון הרשום של ״שחר בע״מ״ הוא מיליון מניות, ומונפקות 820,000. הדירקטוריון רוצה להקצות 150,000 מניות ועוד 100,000 כתבי אופציה, שכל אחד ניתן למימוש למניה. לפי ס' 288(א) רואים את האופציות כאילו מומשו: 150,000 + 100,000 = 250,000, אבל נותרו רק 180,000 מניות לא מונפקות. לכן קודם צריך החלטת <b>אסיפה כללית</b> להגדיל את ההון הרשום (ס' 286), ובחברה פרטית עם סוג מניות אחד יש לזכור גם את זכות הקדימה (ס' 290(א)). אם המחיר נמוך מהערך הנקוב, חל ס' 304."},{"t":"h","x":"הצעה לציבור: חובת תשקיף"},{"t":"p","x":"״הצעה לציבור״ מוגדרת בחוק ניירות ערך באופן רחב: ״פעולה המיועדת להניע ציבור לרכוש ניירות ערך״. הכלל המרכזי: הצעה לציבור ומכירה לציבור רק על פי <b>תשקיף</b> שרשות ניירות ערך התירה את פרסומו. התשקיף הוא מסמך הגילוי שמשקיע סביר צריך כדי להחליט."},{"t":"law","law":"חוק ניירות ערך","sec":"15","x":"לא יעשה אדם הצעה לציבור אלא על פי תשקיף שהרשות התירה את פרסומו או על פי טיוטת תשקיף שאושרה ונחתמה כאמור בסעיף 22 והוגשה לרשות. … לא יעשה אדם מכירה לציבור אלא על פי תשקיף שהרשות התירה את פרסומו."},{"t":"law","law":"חוק ניירות ערך","sec":"16(א)","x":"תשקיף יכלול כל פרט העשוי להיות חשוב למשקיע סביר השוקל רכישת ניירות הערך המוצעים על פיו וכל פרט ששר האוצר קבע בתקנות לפי סעיף 17."},{"t":"list","x":["<b>חריגים</b> (ס' 15א): לא נחשבת ״הצעה לציבור״, למשל, הצעה למספר מוגבל של משקיעים, לפי מספר שנקבע בתקנות, במשך 12 חודשים (ס' 15א(א)(1)); הצעה למשקיעים מסוגים שבתוספת הראשונה, כמו משקיעים מוסדיים, שאינם נספרים (ס' 15א(ב)(1)); והקצאת מניות הטבה שאין בה ברירה (ס' 15א(א)(2)).","<b>מי חותם על התשקיף</b> (ס' 22): המנפיק, רוב חברי הדירקטוריון, החתם אם יש, והמציע אם אינו המנפיק. החתימה חשובה כי היא מקור האחריות לפי ס' 31(א)(1).","<b>הודעה משלימה</b>: בהצעה שאינה הצעה בדרך של זכויות, פרטים מסוימים (כמו מחיר וכמות) יכולים להיקבע או להשתנות אחרי פרסום התשקיף. הם נכללים בהודעה משלימה וממועד פרסומה הם חלק בלתי נפרד מהתשקיף (ס' 16(א1))."]},{"t":"h","x":"מחברה פרטית לחברה ציבורית"},{"t":"p","x":"רוב החברות בישראל הן חברות פרטיות קטנות. כשחברה רוצה לגייס הון גדול מהציבור, היא עוברת ״הנפקה ראשונה לציבור״ (IPO). זה הליך יקר, ארוך ומסוכן, ולפעמים הוא נכשל והחברה נשארת פרטית. ברגע שהמניות הוצעו לציבור על פי תשקיף או נרשמו למסחר בבורסה, החברה היא <b>חברה ציבורית</b> (הגדרה בס' 1). אם רק איגרות החוב שלה הוצעו לציבור, היא <b>חברת איגרות חוב</b>, ורוב כללי הממשל התאגידי חלים גם עליה."},{"t":"steps","title":"שלבי ההפיכה לחברה ציבורית","x":["ההחלטה וההכנה: התאמת התקנון למבנה של חברה ציבורית, ובדרך כלל הגדלת ההון הרשום באסיפה הכללית (ס' 286) כדי שיהיה ״מקום״ למניות החדשות.","מינוי הגורמים שהדין מחייב בחברה ציבורית: דירקטורים חיצוניים, ועדת ביקורת, ועדת תגמול, מבקר פנימי ומנכ״ל (ראו בהמשך).","הכנת <b>תשקיף</b>: מסמך גילוי שכולל, בין היתר, דוחות כספיים, פרטים על הדירקטורים ובעלי העניין, הון המניות וההסכמים המהותיים (ני״ע 17).","קבלת <b>היתר רשות ניירות ערך</b> לפרסום התשקיף. בלי היתר אסור להציע ניירות ערך לציבור (ני״ע 15).","ההנפקה עצמה, לרוב במכרז, ורישום המניות למסחר בבורסה לפי תקנון הבורסה (ני״ע 46).","מעכשיו: <b>חובת דיווח</b> שוטפת לרשות ולבורסה (דוחות תקופתיים ודיווחים מיידיים) כל עוד ניירות הערך בידי הציבור (ני״ע 36)."]},{"t":"table","head":["מה מתחיל לחול אחרי ההנפקה","סעיף"],"rows":[["לפחות שני דירקטורים חיצוניים","ס' 239(א)"],["ועדת ביקורת וועדת תגמול","ס' 114, 118א"],["מבקר פנימי","ס' 146"],["חובה למנות מנכ״ל ויו״ר דירקטוריון, ואיסור על כהונה כפולה של יו״ר ומנכ״ל בלי אישור מיוחד","ס' 94, 119, 121(ג)"],["אישורים מיוחדים לעסקאות עם בעל שליטה ולתגמול נושאי משרה","ס' 270–275, 267א"],["חובת דיווח לרשות ניירות ערך ולבורסה","ני״ע 36"]]},{"t":"trap","x":"<b>מה אינו חדש אחרי ההנפקה?</b> חובות שחלות על <b>כל</b> חברה, גם פרטית: דירקטוריון, אסיפה שנתית (ס' 60), רואה חשבון מבקר (ס' 154) ותקנון. בשאלה ״איזו חובה חלה על החברה רק מאז שהפכה לציבורית?״ התשובה תהיה, למשל, דירקטורים חיצוניים או חובת דיווח, ולא רואה חשבון מבקר."},{"t":"h","x":"המכרז במחיר אחיד: איך מחלקים את המניות"},{"t":"p","x":"בהנפקה לציבור בישראל משתמשים לעיתים קרובות ב<b>מכרז במחיר אחיד</b>. כל משקיע מגיש הזמנה: כמה יחידות הוא רוצה ומה המחיר המרבי שהוא מוכן לשלם. החברה קובעת מחיר אחד, <b>מחיר הסליקה</b>, וכל הזוכים משלמים אותו, גם מי שהציע יותר. השיטה נקבעה בתקנות ובתנאי התשקיף, לא בסעיף מפורש בחוק, ובמבחן היא נבחנת כתרגיל חשבוני."},{"t":"steps","title":"אלגוריתם: מכרז במחיר אחיד","x":["מסדרים את ההזמנות <b>מהמחיר הגבוה לנמוך</b>.","מחשבים <b>ביקוש מצטבר</b>: בכל מחיר, כמה יחידות הוזמנו במחיר הזה או במחיר גבוה ממנו.","<b>מחיר הסליקה</b> הוא המחיר הראשון (בירידה) שבו הביקוש המצטבר מגיע לכמות המוצעת או עובר אותה. כל הזוכים משלמים את המחיר הזה.","מי שהציע <b>מעל</b> מחיר הסליקה מקבל את <b>כל</b> הכמות שהזמין, במחיר הסליקה.","מי שהציע <b>בדיוק</b> את מחיר הסליקה חולק ב<b>יתרה</b>, באופן יחסי (פרו-רטה): היתרה חלקי סך ההזמנות במחיר הזה.","מי שהציע <b>מתחת</b> למחיר הסליקה לא מקבל דבר. אם יש עודף ביקוש, החברה יכולה לענות לו רק אם הגדילה את הכמות המוצעת, ככל שתנאי ההצעה מאפשרים זאת."]},{"t":"table","head":["מחיר (₪)","ביקוש במחיר זה (מניות)","ביקוש מצטבר","הקצאה"],"rows":[["500","600","600","מלאה, במחיר 250"],["300","1,000","1,600","מלאה, במחיר 250"],["250","2,000","3,600 ≥ 2,000 → מחיר סליקה","יתרה של 400 מתוך 2,000 = 20% מכל הזמנה"],["100","5,000","8,600","אין הקצאה"]]},{"t":"example","title":"המבחן: ״פרס אחזקות״ מוכרת 2,000 מניות","x":"הנתונים בטבלה. <b>שלב 1</b>: ב-500 ₪ הביקוש המצטבר 600, ב-300 ₪ הוא 1,600, שתיהן פחות מ-2,000. ב-250 ₪ הביקוש המצטבר מגיע ל-3,600 ועובר את 2,000. לכן מחיר הסליקה <b>250 ₪</b>, וכל 2,000 המניות נמכרות במחיר זה. <b>שלב 2</b>: המזמינים ב-500 ₪ וב-300 ₪ מקבלים הכול: 1,600 מניות. נשארות 400 מניות. <b>שלב 3</b>: ההזמנות ב-250 ₪ מסתכמות ב-2,000, ולכן כל מזמין מקבל 400/2,000 = <b>20%</b>. יוסי, שהזמין 30 מניות ב-250 ₪, יקבל 6. דליה, שהזמינה 70 מניות ב-500 ₪, תקבל את כל 70, ותשלם 250 ₪ למניה. <b>שלב 4</b>: יש עודף ביקוש: 3,600 מניות הוזמנו במחיר הסליקה ומעליו, מול 2,000 מוצעות, ועוד 5,000 ב-100 ₪. אי אפשר לענות לכל הביקושים אלא אם יוגדל ההיצע. לכן במבחן התשובה הייתה ״כל התשובות נכונות״."},{"t":"example","title":"דוגמה נוספת לתרגול","x":"החברה מציעה 10,000 יחידות. הזמנות: 3,000 ב-120 ₪, 4,000 ב-110 ₪, 6,000 ב-100 ₪, 5,000 ב-90 ₪. <b>ביקוש מצטבר</b>: 3,000 ← 7,000 ← 13,000. ב-100 ₪ עוברים את 10,000, ולכן מחיר הסליקה <b>100 ₪</b>. המזמינים ב-120 וב-110 מקבלים 7,000 יחידות. נשארות 3,000 יחידות להזמנות של 6,000 ב-100 ₪, כלומר 50%. משקיע שהזמין 1,000 ב-120 ₪ מקבל 1,000 ומשלם 100,000 ₪. משקיע שהזמין 400 ב-100 ₪ מקבל 200. ההזמנות ב-90 ₪ לא נענות. התמורה לחברה: 10,000 × 100 = מיליון ₪."},{"t":"trap","x":"שתי טעויות חשבוניות נפוצות: (1) ״מי שהציע 500 ₪ ישלם 500 ₪״. לא נכון: במכרז במחיר <b>אחיד</b> כולם משלמים את מחיר הסליקה. (2) חלוקה יחסית של כל הכמות בין כל המזמינים. גם זה לא נכון: הפרו-רטה חל רק על <b>היתרה</b>, ורק על ההזמנות <b>במחיר הסליקה עצמו</b>. ההזמנות שמעליו מקבלות 100%."},{"t":"h","x":"אחריות לפרט מטעה בתשקיף"},{"t":"law","law":"חוק ניירות ערך","sec":"1","x":"”פרט מטעה“ – לרבות דבר העלול להטעות משקיע סביר וכל דבר חסר שהעדרו עלול להטעות משקיע סביר;"},{"t":"p","x":"כלומר, גם <b>השמטה</b> היא פרט מטעה, והמבחן הוא <b>אובייקטיבי</b>: ״משקיע סביר״. החוק נותן לנפגע שני סעדים נפרדים, שכל אחד מהם מופנה כלפי גורם אחר ובתנאים שונים: <b>פיצויים</b> (ס' 31–34) ו<b>ביטול הרכישה</b> (ס' 35)."},{"t":"law","law":"חוק ניירות ערך","sec":"31(א)(1)","x":"מי שחתם על תשקיף לפי סעיף 22 אחראי כלפי מי שרכש ניירות ערך במסגרת המכירה על פי התשקיף, וכלפי מי שמכר או רכש ניירות ערך תוך כדי המסחר בבורסה או מחוצה לה, לנזק שנגרם להם מחמת שהיה בתשקיף פרט מטעה."},{"t":"law","law":"חוק ניירות ערך","sec":"31(א)(2)","x":"האחריות לפי פסקה (1) תחול גם על מי שהיה, במועד שבו אישר הדירקטוריון את הנוסח הסופי של התשקיף, דירקטור של המנפיק, המנהל הכללי שלו או בעל שליטה בו."},{"t":"law","law":"חוק ניירות ערך","sec":"32","x":"מי שנתן חוות דעת, דו״ח, סקירה או אישור שנכללו או נזכרו בתשקיף בהסכמתו המוקדמת, יהא אחראי כאמור בסעיף 31(א) לנזק שנגרם מחמת שהיה פרט מטעה בחוות הדעת, בדו״ח, בסקירה או באישור שנתן"},{"t":"law","law":"חוק ניירות ערך","sec":"33","x":"האחריות לפי הסעיפים 31 או 32 לא תחול – … על מי שהוכיח שנקט כל האמצעים הנאותים כדי להבטיח שלא יהיה פרט מטעה בתשקיף, בחוות הדעת, בדו״ח או באישור, הכל לפי הענין, וכי האמין בתום לב שאכן אין בו פרט כזה … כלפי מי שהוכח שרכש ניירות הערך בשעה שידע או היה עליו לדעת שיש פרט מטעה בתשקיף"},{"t":"law","law":"חוק ניירות ערך","sec":"34","x":"במידה ששנים או יותר אחראים לפי הסעיפים 31 עד 33, אחראים הם כלפי הניזוק יחד ולחוד; בינם לבין עצמם הם נושאים באחריות לפי הכללים החלים על אחריות בנזיקין."},{"t":"law","law":"חוק ניירות ערך","sec":"35(א)","x":"מי שרכש מן המציע ניירות ערך בהתאם לתשקיף ועשה זאת בהסתמך על פרט מטעה שבו, רשאי לבטל את הרכישה ולדרוש החזרת הכספים ששילם, ובלבד שעשה זאת תוך זמן סביר לאחר שנודע לו שהפרט היה מטעה או לאחר שפורסם דו״ח מיידי כאמור בסעיף 36(ג) שבו תוקן הפרט המטעה ולא יאוחר משנתיים לאחר הרכישה."},{"t":"table","head":["","פיצויים (ס' 31–34)","ביטול רכישה (ס' 35)"],"rows":[["מי רשאי","מי שרכש בהנפקה על פי התשקיף, וגם מי שמכר או רכש במסחר בבורסה או מחוצה לה","רק מי שרכש <b>מן המציע</b> בהתאם לתשקיף, כלומר בהנפקה עצמה"],["נגד מי","החותמים לפי ס' 22 (מנפיק, דירקטורים, חתם, מציע); מי שהיה במועד אישור הנוסח הסופי דירקטור, מנכ״ל או בעל שליטה; מומחים לגבי חוות דעתם (ס' 32). כולם יחד ולחוד (ס' 34)","כלפי המציע: ביטול והחזרת הכספים ששולמו"],["הסתמכות","הלשון: נזק שנגרם ״מחמת שהיה בתשקיף פרט מטעה״. נדרש קשר סיבתי, אך לא נכתבה דרישה מפורשת להסתמכות אישית","הלשון מפורשת: ״בהסתמך על פרט מטעה שבו״"],["מועדים","התיישנות: שנתיים מיום העסקה או שבע שנים מתאריך התשקיף, לפי המוקדם, לתביעה שלא הוגשה עליה תובענה (ס' 31(ב))","״תוך זמן סביר״ מהגילוי או מהדו״ח המתקן, ו<b>לא יאוחר משנתיים לאחר הרכישה</b>"],["הגנות","ס' 33: אמצעים נאותים ותום לב; הרוכש ידע או היה עליו לדעת; תיקון בדו״ח מיידי; הודעה בכתב על תיקון; מי שלא חתם ולא ידע על הפרסום","אין צורך באשם של המציע; התנאים הם ההסתמכות והמועד"]]},{"t":"p","x":"<b>הסתמכות: למה יש הבדל?</b> ביטול הרכישה הוא סעד ״חוזי״ באופיו: הרוכש אומר ״לא הייתי קונה אילו ידעתי״, ולכן ס' 35 דורש במפורש שרכש <b>בהסתמך</b> על הפרט המטעה. בפיצויים הלשון שונה: האחריות היא לנזק שנגרם ״מחמת שהיה בתשקיף פרט מטעה״. הלשון דורשת <b>נזק</b> ו<b>קשר סיבתי</b>, אבל לא כוללת דרישה מפורשת שהתובע קרא את התשקיף והסתמך עליו. לכן גם מי שקנה במסחר בבורסה ומעולם לא פתח את התשקיף יכול לתבוע. ההיגיון: בשוק משוכלל, הפרט המטעה משפיע על <b>מחיר</b> המניה, וכך גורם נזק גם למי שלא קרא אותו. הפסיקה הלכה באותו כיוון: גם בעילה שאחד מרכיביה הוא הסתמכות, אין חובה להוכיח הסתמכות אישית, ואפשר להוכיח אותה בדרכים חלופיות (עניין רייכרט, להלן). ומי שידע, או היה עליו לדעת, על הפרט המטעה, לא ייפרע (ס' 33(2))."},{"t":"case","name":"רע\"א 8268/96 רייכרט נ' שמש","x":"בעילה בניירות ערך שאחד מרכיביה הוא הסתמכות, התובע (גם בתובענה ייצוגית) אינו חייב להוכיח הסתמכות אישית. אפשר להוכיח אותה בדרכים חלופיות: (א) חזקת הסתמכות כשההטעיה היא באי-גילוי של פרט מהותי; (ב) ״התרמית על השוק״: מי שרוכש בבורסה מסתמך על כך שהמחיר משקף את כל המידע שפורסם, ולכן די בהסתמכות עקיפה דרך מחיר השוק."},{"t":"case","name":"ע\"א 345/03 רייכרט נ' יורשי המנוח משה שמש ז\"ל","x":"פסק הדין הסופי בתובענה הייצוגית בגין פרט מטעה בתשקיף ובדוחות של חברה שזייפה הכנסות. בגלל האופי הנזיקי של התביעה לפי ס' 31, השיטה הראויה לחישוב הנזק היא ״חסרון הכיס״: ההפרש בין מחיר הרכישה לבין השווי הריאלי של נייר הערך ביום הרכישה, ולא כל הירידה שאירעה אחר כך."},{"t":"example","title":"דוגמה: מי תובע את מי?","x":"בתשקיף של ״נטע ביו בע״מ״ הוסתר שהרשות האמריקנית דחתה את הבקשה לאישור המוצר המרכזי. בהנפקה רכשה הדס מניות מהחברה (המציעה). יובל קנה מניות בבורסה חודשיים אחרי ההנפקה, בלי לקרוא את התשקיף. כשהפרט התגלה, המניה צנחה. <b>הדס</b>: יכולה לבטל את הרכישה ולקבל את כספה בחזרה מהחברה (ס' 35(א)), אם תוכיח שהסתמכה על הפרט, תפעל תוך זמן סביר ולא יאוחר משנתיים מהרכישה. לחלופין, היא יכולה לתבוע פיצויים. <b>יובל</b>: לא רכש ״מן המציע״, ולכן אין לו זכות ביטול. אבל הוא יכול לתבוע פיצויים לפי ס' 31(א), כמי שרכש ״תוך כדי המסחר בבורסה״, מהחותמים על התשקיף, מהדירקטורים, מהמנכ״ל ומבעל השליטה במועד אישור הנוסח הסופי. האחריות שלהם יחד ולחוד (ס' 34). אם חוות דעת של מומחה הטעתה, הוא אחראי לפי ס' 32. כל נתבע יכול לנסות להוכיח הגנה לפי ס' 33(1)."},{"t":"trap","x":"שאלת ״אפי״ מהמבחן: הוא רכש מניות מהחברה, וכעבור <b>3 שנים</b> גילה פרט מטעה. <b>ביטול</b>: לא אפשרי, כי ס' 35(א) קובע תקרה של שנתיים אחרי הרכישה, ואין זה משנה שקנה ישירות מהמציע. התשובה הנכונה במבחן הייתה: ״אפי לא יכול לבטל את רכישת המניות, אבל יכול לתבוע את הנזק״. בתשובה פתוחה כדאי להוסיף הסתייגות: ס' 31(ב) קובע לתביעת פיצויים ״שלא הוגשה עליה תובענה״ התיישנות של שנתיים מיום העסקה או שבע שנים מתאריך התשקיף, לפי המוקדם. לכן אחרי 3 שנים צריך לבדוק אם כבר הוגשה תובענה (למשל תובענה ייצוגית) בגין אותו פרט. ובכל מקרה, הטענה ״אין פיצוי כי לא הוכיחה הסתמכות״ שגויה: דרישת ההסתמכות המפורשת שייכת לביטול."},{"t":"exam","x":"איך זה נשאל: (1) <b>מכרז במחיר אחיד</b>: שאלה אמריקאית עם 4–5 קביעות וחישוב. בנו טבלת ביקוש מצטבר מהמחיר הגבוה לנמוך, מצאו את מחיר הסליקה, הקצו במלואה למי שמעליו, ופרו-רטה ליתרה במחיר הסליקה. (2) <b>פרט מטעה</b>: הבחינו בין ביטול (ס' 35: רק מהמציע, הסתמכות, זמן סביר ולא יותר משנתיים) לבין פיצויים (ס' 31: חותמים, דירקטורים, מנכ״ל ובעל שליטה, מומחים לפי ס' 32, יחד ולחוד לפי ס' 34, הגנות לפי ס' 33, התיישנות לפי ס' 31(ב)). (3) <b>הון ומניות</b>: הון רשום מול מונפק (ס' 286, ס' 288), סוגי מניות לפי התקנון (ס' 285), ניירות ערך בני פדיון (ס' 312)."}],"mcq":[{"id":"u11-1","q":"חברת ״גליל טק״, חברה ציבורית, מציעה במכרז במחיר אחיד 3,000 מניות. הוגשו הזמנות: 1,000 מניות ב-80 ₪, 1,500 מניות ב-70 ₪, 2,000 מניות ב-60 ₪, 4,000 מניות ב-50 ₪. מה נכון?","o":["כל המניות יימכרו ב-80 ₪, כי זה המחיר הגבוה ביותר שהוצע.","המזמינים ב-80 ₪ ישלמו 80 ₪, המזמינים ב-70 ₪ ישלמו 70 ₪, והמזמינים ב-60 ₪ ישלמו 60 ₪.","מחיר הסליקה 60 ₪. המזמינים ב-80 ₪ וב-70 ₪ יקבלו את כל הכמות שהזמינו, והמזמינים ב-60 ₪ יקבלו 25% מהכמות שהזמינו.","מחיר הסליקה 50 ₪, כי זה המחיר שבו הביקוש הגבוה ביותר.","מחיר הסליקה 60 ₪, וכל המזמינים במחיר זה ומעליו יקבלו 3,000/4,500 מהכמות שהזמינו."],"a":2,"why":"ביקוש מצטבר: ב-80 ₪: 1,000; ב-70 ₪: 2,500; ב-60 ₪: 4,500 ≥ 3,000, ולכן מחיר הסליקה 60 ₪. 2,500 מניות הולכות למזמינים ב-80 וב-70. היתרה, 500 מניות, מתחלקת בין הזמנות של 2,000 ב-60 ₪: 500/2,000 = 25%.","w":["ב-80 ₪ הביקוש המצטבר (1,000) קטן מההיצע (3,000).","במכרז במחיר אחיד כל הזוכים משלמים את מחיר הסליקה.","","מחיר הסליקה הוא המחיר הראשון, בירידה, שבו הביקוש המצטבר מגיע להיצע, ולא המחיר עם הביקוש הגדול ביותר.","הפרו-רטה חל רק על היתרה ובמחיר הסליקה עצמו; מי שהציע מעליו מקבל 100%."],"secs":[]},{"id":"u11-2","q":"במכרז במחיר אחיד על 3,000 מניות הוגשו הזמנות: 1,000 מניות ב-80 ₪, 1,500 ב-70 ₪, 2,000 ב-60 ₪ ו-4,000 ב-50 ₪. ליאת הזמינה 200 מניות ב-60 ₪ (מתוך ה-2,000), ועומר הזמין 300 מניות ב-80 ₪ (מתוך ה-1,000). כמה ישלם כל אחד?","o":["ליאת תשלם 3,000 ₪ (50 מניות), ועומר 18,000 ₪ (300 מניות).","ליאת תשלם 12,000 ₪ ועומר 24,000 ₪.","ליאת תשלם 3,000 ₪ ועומר 6,000 ₪ (75 מניות).","ליאת לא תקבל מניות, ועומר ישלם 24,000 ₪.","ליאת תשלם 2,500 ₪ (50 מניות ב-50 ₪), ועומר 18,000 ₪."],"a":0,"why":"ליאת הזמינה במחיר הסליקה ולכן מקבלת 25%: 50 מניות × 60 ₪ = 3,000 ₪. עומר הזמין מעל מחיר הסליקה ולכן מקבל את כל 300 המניות, במחיר הסליקה: 300 × 60 = 18,000 ₪.","w":["","ליאת לא מקבלת את כל הכמות, ועומר לא משלם את המחיר שהציע.","הפרו-רטה לא חל על עומר, שהציע מעל מחיר הסליקה.","ליאת הציעה בדיוק את מחיר הסליקה ולכן משתתפת ביתרה; עומר משלם את מחיר הסליקה.","מחיר הסליקה 60 ₪, לא 50 ₪."],"secs":[]},{"id":"u11-3","q":"אפי רכש בהנפקה, מהחברה המציעה, 50,000 מניות ב-50 ₪ למניה. כעבור שלוש שנים צנח המחיר ל-10 ₪, ואפי גילה שבתשקיף היה פרט מטעה, שעליו הסתמך בעת הרכישה. אפי מבקש לבטל את הרכישה. מה נכון?","o":["אפי רשאי לבטל, כי רכש ישירות מהמציע ופעל מיד כשגילה.","אפי רשאי לבטל, כי ניתן לבטל תוך שבע שנים מתאריך התשקיף.","אפי אינו רשאי לבטל, כי ביטול אפשרי רק למי שרכש בבורסה.","אפי אינו רשאי לבטל, כי הביטול אפשרי לכל המאוחר שנתיים לאחר הרכישה.","אפי רשאי לבטל רק אם יוכיח שהחברה פעלה בכוונה."],"a":3,"why":"ס' 35(א) מתיר ביטול למי שרכש מן המציע בהסתמך על פרט מטעה, ״ובלבד שעשה זאת תוך זמן סביר… ולא יאוחר משנתיים לאחר הרכישה״. עברו שלוש שנים. אפשרות התביעה לפיצויים לפי ס' 31 נבחנת בנפרד, כולל ההתיישנות לפי ס' 31(ב).","w":["הפעולה המהירה אחרי הגילוי לא מתגברת על תקרת השנתיים.","״שבע שנים מתאריך התשקיף״ הוא רכיב בהתיישנות תביעת הפיצויים (ס' 31(ב)), לא בזכות הביטול.","ההפך: הביטול נתון רק למי שרכש מן המציע.","","ס' 35 אינו דורש אשם של המציע; התנאים הם הסתמכות ומועדים."],"secs":["ני\"ע 35"]},{"id":"u11-4","q":"רוני קנה מניות של חברה בבורסה, חצי שנה אחרי ההנפקה. מתברר שבתשקיף היה פרט מטעה מהותי. רוני לא קרא את התשקיף. מה נכון?","o":["רוני רשאי לבטל את הרכישה מול החברה, כי עברו פחות משנתיים.","רוני אינו רשאי לבטל לפי ס' 35, כי לא רכש מן המציע, אבל הוא רשאי לתבוע פיצויים לפי ס' 31 אם יוכיח שנגרם לו נזק מחמת הפרט המטעה.","רוני אינו זכאי לשום סעד, כי לא קרא את התשקיף ולכן לא הסתמך עליו.","רוני רשאי לתבוע רק את המוכר שממנו קנה בבורסה.","רוני רשאי לתבוע רק את רואה החשבון של החברה."],"a":1,"why":"ביטול לפי ס' 35(א) נתון רק למי ש״רכש מן המציע״. ס' 31(א)(1) מטיל אחריות גם כלפי ״מי שמכר או רכש ניירות ערך תוך כדי המסחר בבורסה״, לנזק שנגרם ״מחמת שהיה בתשקיף פרט מטעה״. לא נדרשת הוכחה שקרא את התשקיף, אבל נדרשים נזק וקשר סיבתי.","w":["הזכות לבטל אינה נתונה למי שקנה במסחר.","","דרישת ההסתמכות המפורשת היא בס' 35 (ביטול), לא בס' 31 (פיצויים).","המוכר בבורסה אינו מהאחראים לפי ס' 31; האחראים הם החותמים ובעלי התפקידים בס' 31(א)(2).","רואה החשבון אחראי רק לפרט מטעה בחוות דעתו (ס' 32); הם לא האחראים היחידים."],"secs":["ני\"ע 35","ני\"ע 31"]},{"id":"u11-5","q":"מי מבין הבאים אינו אחראי מכוח ס' 31(א)(2) לחוק ניירות ערך לנזק בשל פרט מטעה בתשקיף?","o":["מי שהיה בעל השליטה במנפיק במועד שבו אישר הדירקטוריון את הנוסח הסופי.","מי שהיה מנכ״ל המנפיק במועד אישור הנוסח הסופי.","מי שהיה דירקטור במועד אישור הנוסח הסופי, אף שלא חתם על התשקיף.","מי שהיה דירקטור במועד אישור הנוסח הסופי ופרש למחרת.","מי שמונה לדירקטור חודש אחרי פרסום התשקיף."],"a":4,"why":"ס' 31(א)(2) מטיל אחריות על מי שהיה, ״במועד שבו אישר הדירקטוריון את הנוסח הסופי של התשקיף, דירקטור של המנפיק, המנהל הכללי שלו או בעל שליטה בו״. מי שמונה אחר כך אינו בקבוצה. גם לחותמים יש אחריות לפי ס' 31(א)(1).","w":["בעל שליטה במועד הקובע אחראי.","מנכ״ל במועד הקובע אחראי.","האחריות לפי פסקה (2) לא תלויה בחתימה.","המועד הקובע הוא מועד האישור; פרישה אחריו לא פוטרת.",""],"secs":["ני\"ע 31(א)(2)"]},{"id":"u11-6","q":"דירקטור בחברה שהנפיקה מניות נתבע לפי ס' 31 בשל פרט מטעה בתשקיף. איזו טענה, אם תוכח, תשחרר אותו מאחריות?","o":["הוא לא היה מודע לפרט המטעה, אף שלא בדק את התשקיף כלל.","הנזק נגרם בגלל ירידה כללית בשוק, ולא רק בגלל הפרט המטעה.","הוא נקט את כל האמצעים הנאותים כדי להבטיח שלא יהיה פרט מטעה, והאמין בתום לב שאין בו פרט כזה.","הוא היה דירקטור חיצוני.","הפרט המטעה הופיע בחוות דעת של רואה חשבון ולא בגוף התשקיף."],"a":2,"why":"ס' 33(1) פוטר מי ״שהוכיח שנקט כל האמצעים הנאותים כדי להבטיח שלא יהיה פרט מטעה… וכי האמין בתום לב שאכן אין בו פרט כזה״ (ומילא את חובתו לפי ס' 25(ד)). שני הרכיבים מצטברים.","w":["חוסר ידיעה בלי בדיקה אינו ״כל האמצעים הנאותים״.","זו טענה על גובה הנזק והקשר הסיבתי, ולכל היותר מפחיתה את הנזק; היא לא הגנה מלאה לפי ס' 33.","","אין חסינות לדירקטור חיצוני; הוא עשוי ליהנות מס' 33(1) רק אם עמד בתנאיו.","מומחה אחראי לפי ס' 32, אבל זה לא פוטר אוטומטית את החותמים; הם צריכים להוכיח הגנה לפי ס' 33."],"secs":["ני\"ע 33"]},{"id":"u11-7","q":"בתשקיף נכללה, בהסכמתו המוקדמת, חוות דעת של שמאי שהעריך נכס מרכזי בשווי מופרז, וזה פרט מטעה. מי אחראי כלפי המשקיעים, ובאיזה אופן?","o":["השמאי אחראי לפי ס' 32, וגם החותמים ובעלי התפקידים לפי ס' 31 עשויים להיות אחראים. כולם אחראים יחד ולחוד, בכפוף להגנות לפי ס' 33.","רק המנפיק, כי הוא האחראי לתשקיף.","רק השמאי, כי הפרט המטעה הוא בחוות דעתו.","השמאי אחראי רק כלפי המנפיק שהזמין את חוות הדעת, לא כלפי המשקיעים.","האחריות מתחלקת בין האחראים באופן שווה כלפי הניזוק."],"a":0,"why":"ס' 32 מטיל אחריות כאמור בס' 31(א) על מומחה שחוות דעתו נכללה בהסכמתו המוקדמת. ס' 34 קובע אחריות ״יחד ולחוד״ כלפי הניזוק, וביניהם לבין עצמם לפי כללי הנזיקין.","w":["","גם המומחה אחראי, וגם הדירקטורים ובעלי התפקידים.","גם האחראים לפי ס' 31 חשופים, בכפוף להגנות לפי ס' 33.","ס' 32 מטיל אחריות ״כאמור בסעיף 31(א)״, כלומר כלפי המשקיעים.","כלפי הניזוק האחריות ״יחד ולחוד״; החלוקה הפנימית בין האחראים היא לפי דיני הנזיקין."],"secs":["ני\"ע 32","ני\"ע 34"]},{"id":"u11-8","q":"משקיע מוסדי קנה מניות בהנפקה, כשהוא יודע מבדיקת נאותות שערך שהתשקיף מסתיר תביעה מהותית נגד החברה. לאחר מכן הוא תובע פיצויים לפי ס' 31. מה נכון?","o":["הוא יקבל פיצוי מלא, כי הפרט המטעה קיים.","הוא יקבל פיצוי רק מהחתם.","הוא רשאי לבטל את הרכישה, אבל לא לתבוע פיצויים.","האחריות לא תחול כלפיו, כי רכש בשעה שידע על הפרט המטעה.","הוא יקבל פיצוי, אבל רק בגובה מחצית הנזק."],"a":3,"why":"ס' 33(2) שולל אחריות ״כלפי מי שהוכח שרכש ניירות הערך בשעה שידע או היה עליו לדעת שיש פרט מטעה בתשקיף״. גם ביטול לפי ס' 35 דורש הסתמכות, ומי שידע לא הסתמך.","w":["ההגנה לפי ס' 33(2) חלה.","ההגנה חלה כלפי כל האחראים.","ביטול דורש רכישה ״בהסתמך על פרט מטעה״; מי שידע את האמת לא הסתמך.","","אין בחוק ״חצי פיצוי״ כזה."],"secs":["ני\"ע 33(2)"]},{"id":"u11-9","q":"חברה פרטית מבקשת לגייס כסף ממשקיעים. איזו מהפעולות הבאות מחייבת תשקיף שהרשות התירה את פרסומו?","o":["הצעה למספר מצומצם של משקיעים, שאינו עולה על המספר הקבוע בתקנות ב-12 חודשים.","פרסום מודעות באינטרנט לציבור הרחב, שמזמין כל אדם לרכוש מניות של החברה במחיר נקוב.","הקצאת מניות הטבה לכל בעלי המניות, בלי ברירה.","הצעה לקרנות פנסיה וחברות ביטוח, שהן משקיעים מהסוגים שבתוספת הראשונה.","משא ומתן עם חתם פוטנציאלי לגבי התחייבות חיתומית."],"a":1,"why":"״הצעה לציבור״ היא ״פעולה המיועדת להניע ציבור לרכוש ניירות ערך״, ולפי ס' 15 היא מותרת רק על פי תשקיף שהרשות התירה את פרסומו. שאר הפעולות מוחרגות בס' 15א.","w":["מוחרג לפי ס' 15א(א)(1).","","מוחרג לפי ס' 15א(א)(2).","משקיעים מהתוספת הראשונה לא נספרים, וההצעה להם מוחרגת (ס' 15א(א)(7), ס' 15א(ב)(1)).","מוחרג לפי ס' 15א(א)(5), בכפוף לתנאי הכשירות של החתם."],"secs":["ני\"ע 15","ני\"ע 15א"]},{"id":"u11-10","q":"ההון הרשום של ״אגם בע״מ״ הוא 500,000 מניות, מתוכן הונפקו 450,000. הדירקטוריון מבקש להקצות למשקיע 100,000 מניות. מה נכון?","o":["הדירקטוריון רשאי להקצות, כי סמכות ההקצאה שלו בלתי מוגבלת.","הדירקטוריון רשאי להגדיל בעצמו את ההון הרשום ברוב של שני שלישים.","המנכ״ל רשאי להקצות את המניות במקום הדירקטוריון.","ההקצאה טעונה אישור בית משפט.","הדירקטוריון רשאי להקצות רק עד 50,000 מניות. כדי להקצות 100,000, האסיפה הכללית צריכה קודם להגדיל את ההון הרשום."],"a":4,"why":"ס' 288(א): הדירקטוריון רשאי להקצות ״עד גבול הון המניות הרשום״. נותרו 50,000. הגדלת ההון הרשום בסמכות האסיפה הכללית (ס' 286).","w":["הסמכות מוגבלת להון הרשום.","הגדלת ההון הרשום היא בסמכות האסיפה (ס' 286).","הסמכות בידי הדירקטוריון; אצילה למנכ״ל אפשרית רק במקרים שבס' 288(ב) (למשל הקצאה עקב מימוש או המרה), ובכל מקרה עד גבול ההון הרשום.","אין צורך בבית משפט; בית משפט נדרש רק בהקצאה מתחת לערך הנקוב בלי מקור להיוון (ס' 304(ב)).",""],"secs":["286","288(א)"]},{"id":"u11-11","q":"״ים בע״מ״ הנפיקה ״מניות בכורה בנות פדיון״, שהחברה רשאית לפדות בעוד חמש שנים, ולהן זכות הצבעה וזכות קדימה בדיבידנד. מה נכון?","o":["מאחר שהן נקראות ״מניות״, הן חלק מההון העצמי של החברה.","אסור להצמיד לניירות בני פדיון זכויות הצבעה.","ניירות ערך בני פדיון אינם נחשבים חלק מההון העצמי, יהא כינוים אשר יהא, אלא אם הפדיון הוגבל לפירוק אחרי פירעון כל החובות לנושים.","הפדיון כפוף למבחן הרווח ולמבחן יכולת הפירעון.","הנפקה כזו אפשרית רק באישור בית משפט."],"a":2,"why":"ס' 312(ד) קובע במפורש שניירות ערך בני פדיון לא ייחשבו חלק מההון העצמי, ״יהא כינוים אשר יהא״, אלא אם הפדיון הוגבל לפירוק אחרי פירעון הנושים. ניתן להצמיד להם זכויות של מניות (ס' 312(ג)). הפדיון לפי התנאים אינו כפוף למגבלות פרק החלוקה (ס' 312(ב)).","w":["השם לא קובע: ״יהא כינוים אשר יהא״.","ס' 312(ג) מתיר להצמיד להם ״זכויות הצבעה וזכות השתתפות ברווחים״.","","ס' 312(ב): ״לא יחולו על הפדיון המגבלות הקבועות בפרק זה״.","נדרשת הוראה בתקנון (ס' 312(א)), לא אישור בית משפט."],"secs":["312"]},{"id":"u11-12","q":"מה ההבדל העיקרי בין בעל מניה לבין מחזיק באיגרת חוב של אותה חברה?","o":["בעל המניה הוא בעלים, והחברה לא חייבת להשיב לו את השקעתו; מחזיק האג״ח הוא נושה, והחברה חייבת לו קרן וריבית לפי התנאים.","שניהם בעלים בחברה, אבל רק בעל המניה מצביע.","מחזיק האג״ח זכאי לקבל את כספו רק אם יש לחברה רווחים.","בפירוק, בעלי המניות נפרעים לפני מחזיקי האג״ח.","בעל המניה זכאי לריבית קבועה, ומחזיק האג״ח זכאי לדיבידנד."],"a":0,"why":"מניה היא חבילת זכויות בעלות (ס' 1). דיבידנד ניתן רק אם הוחלט ובכפוף למבחני החלוקה (ס' 302, ס' 306). איגרת חוב היא התחייבות של החברה, ומחזיקה הוא נושה שזכאי לתשלום במועד, בלי קשר לרווחים.","w":["","מחזיק האג״ח אינו בעלים אלא נושה.","החוב לאג״ח קיים בלי קשר לרווחים; התלות ברווחים מאפיינת דיבידנד.","ההפך: הנושים, ובהם מחזיקי האג״ח, קודמים לבעלי המניות.","ההפך: ריבית לאג״ח ודיבידנד למניה."],"secs":[]},{"id":"u11-13","q":"בתשקיף נכתב נכון שלחברה ״הסכם הפצה עם רשת ארצית״, אבל לא נכתב שהרשת הודיעה על כוונתה לבטל אותו בעוד חודש. האם יש פרט מטעה?","o":["לא, כי כל מה שנכתב בתשקיף נכון.","לא, כי השמטה אינה פרט מטעה; רק אמירה כוזבת.","כן, אבל רק אם יוכח שהחברה התכוונה להטעות.","כן, כי ״פרט מטעה״ כולל ״כל דבר חסר שהעדרו עלול להטעות משקיע סביר״.","התשובה תלויה רק בשאלה אם המשקיע הספציפי קרא את התשקיף."],"a":3,"why":"״פרט מטעה״ (ס' 1 לחוק ניירות ערך) כולל ״דבר העלול להטעות משקיע סביר וכל דבר חסר שהעדרו עלול להטעות משקיע סביר״. המבחן אובייקטיבי. אמת חלקית שיוצרת רושם שגוי היא פרט מטעה.","w":["אמת חלקית יכולה להטעות.","ההגדרה כוללת במפורש השמטה.","ההגדרה לא דורשת כוונה; היעדר אשם רלוונטי רק להגנה לפי ס' 33(1), ושם הנטל על הנתבע.","","השאלה אם יש פרט מטעה נבחנת לפי ״משקיע סביר״; קריאה בפועל רלוונטית לכל היותר לסעד הביטול (הסתמכות)."],"secs":["ני\"ע 1","ני\"ע 31"]},{"id":"u11-14","q":"איזה מהמסמכים הבאים אינו ״איגרת חוב״ לפי ההגדרה בס' 1 לחוק החברות?","o":["מסמך שהנפיקה חברה ומעיד שהיא חייבת למחזיק 1,000 ₪ בתוספת ריבית שנתית של 5%.","איגרת חוב שהחברה הנפיקה לציבור בסדרה, ושההתחייבות לפיה מובטחת בשעבוד על נכסי החברה.","שטר חוב שנתנה החברה לספק חומרי גלם במהלך עסקיה הרגיל.","איגרת חוב שאפשר להמיר למניות החברה.","איגרת חוב לא מובטחת שנמכרה למשקיעים מוסדיים בלבד."],"a":2,"why":"ס' 1 מגדיר איגרת חוב כ״מסמך שהנפיקה חברה המעיד על קיומה של התחייבות כספית שחבה החברה, ומגדיר את תנאיה, למעט שטרי חוב או שטרי חליפין שנתנה חברה במהלך עסקיה״. שטר חוב לספק במהלך העסקים מוחרג במפורש.","w":["זו בדיוק ההגדרה: מסמך שהנפיקה החברה, שמעיד על התחייבות כספית ומגדיר את תנאיה.","זו ״איגרת חוב מובטחת״ (הגדרה בס' 1), והיא סוג של איגרת חוב.","","איגרת חוב המירה היא איגרת חוב, וגם הזכות להמיר היא נייר ערך (הגדרת ״נייר ערך״ בס' 1).","זהות הרוכשים אינה משנה את אופי המסמך כאיגרת חוב."],"secs":["1"]},{"id":"u11-15","q":"חברה פרטית מבקשת לגייס כסף ולהנפיק למשקיע ״מניות למוכ״ז״, כך שהמניה תעבור מיד ליד במסירת התעודה בלבד. מה נכון?","o":["מותר, אם התקנון מתיר מניות למוכ״ז.","מותר רק בחברה פרטית, ולא בחברה ציבורית.","מותר, בתנאי שהדירקטוריון מנהל רישום של מספר המניות שהונפקו.","אסור: חברה לא תנפיק ולא תקצה נייר ערך למוכ״ז.","מותר רק באישור בית המשפט."],"a":3,"why":"ס' 289א: ״חברה לא תנפיק ולא תקצה נייר ערך למוכ״ז״. האיסור חל על כל חברה, כדי שתמיד יהיה ידוע מי מחזיק בניירות הערך.","w":["הוראת תקנון אינה יכולה לגבור על האיסור בחוק (ס' 289א).","האיסור חל על כל חברה, פרטית וציבורית.","האיסור מוחלט, ואין חריג של רישום מספר המניות.","","החוק אינו מאפשר לבית המשפט להתיר זאת."],"secs":["289א"]},{"id":"u11-16","q":"״תמר טק בע״מ״, חברה פרטית, השלימה הנפקה ראשונה של מניותיה לציבור על פי תשקיף. איזו מהחובות הבאות חלה עליה מעתה, ולא חלה עליה כשהייתה חברה פרטית רגילה?","o":["למנות רואה חשבון מבקר.","לקיים אסיפה שנתית.","למנות לפחות שני דירקטורים חיצוניים.","שיהיה לה דירקטוריון.","לנהל מרשם בעלי מניות."],"a":2,"why":"מרגע שהמניות הוצעו לציבור על פי תשקיף, החברה היא חברה ציבורית (ס' 1). בחברה ציבורית יכהנו לפחות שני דירקטורים חיצוניים (ס' 239(א)). שאר החובות חלות על כל חברה, גם פרטית.","w":["כל חברה חייבת ברואה חשבון מבקר (ס' 154(א)). הפטור של ״חברה לא פעילה״ (ס' 158) הוא חריג צר לחברה פרטית קטנה, ואינו הופך את החובה לייחודית לחברה ציבורית.","כל חברה מקיימת אסיפה שנתית (ס' 60), ורק חברה פרטית רשאית לפטור את עצמה בתקנון (ס' 61).","","לכל חברה יש דירקטוריון. בחברה פרטית די בדירקטור אחד (ס' 219(ב)).","כל חברה מנהלת מרשם בעלי מניות (ס' 127). הוא קיים גם בחברה פרטית (ס' 176)."],"secs":["1","239","154","60"]}],"cases":[{"id":"u11-c1","title":"״נטע ביו״: הנפקה, מכרז ופרט מטעה","facts":"״נטע ביו בע״מ״ הנפיקה לראשונה מניות לציבור על פי תשקיף, במכרז במחיר אחיד על 40,000 מניות. אלה ההזמנות שהוגשו: 8,000 מניות ב-30 ₪, 12,000 מניות ב-28 ₪, 30,000 מניות ב-25 ₪, 20,000 מניות ב-22 ₪. בתשקיף, שעליו חתמו החברה, רוב חברי הדירקטוריון והחתם ״חתמי-על בע״מ״, נכתב שהניסוי הקליני ״הסתיים בהצלחה״. לא נכתב שהרגולטור דרש ניסוי נוסף. דוח שמאי הקניין הרוחני נכלל בתשקיף בהסכמתו. דנה, בעלת השליטה (70% לפני ההנפקה), לא כיהנה כדירקטורית. ניר מונה לדירקטור שבוע אחרי פרסום התשקיף. שנה וחצי אחרי ההנפקה פורסם דוח מיידי על דרישת הרגולטור, והמניה צנחה. אורית רכשה בהנפקה 1,000 מניות בהזמנה ב-25 ₪ והסתמכה על התיאור בתשקיף. גדי קנה 5,000 מניות בבורסה חודשיים אחרי ההנפקה.","parts":[{"q":"חשבו את תוצאות המכרז: מחיר הסליקה, כמה מניות קיבלה אורית וכמה שילמה.","pts":10,"model":["1. ביקוש מצטבר מהמחיר הגבוה לנמוך: ב-30 ₪: 8,000; ב-28 ₪: 20,000; ב-25 ₪: 50,000, יותר מ-40,000. לכן מחיר הסליקה 25 ₪, וכל המניות נמכרות במחיר זה.","2. ההזמנות ב-30 וב-28 ₪ (20,000 מניות) נענות במלואן, במחיר 25 ₪.","3. נותרו 20,000 מניות להזמנות של 30,000 ב-25 ₪: שיעור הקצאה 2/3.","4. אורית הזמינה 1,000 ב-25 ₪, ולכן קיבלה כ-667 מניות (2/3, בכפוף לכללי העיגול בתשקיף) ושילמה כ-16,675 ₪ (667 × 25). ההזמנות ב-22 ₪ לא נענו."],"check":["טבלת ביקוש מצטבר וזיהוי מחיר הסליקה (25 ₪).","הקצאה מלאה למי שמעל מחיר הסליקה, במחיר הסליקה.","פרו-רטה 2/3 ליתרה ויישום על אורית (כ-667 מניות, כ-16,675 ₪)."]},{"q":"דונו בסעדים העומדים לאורית ולגדי ובשאלה נגד מי ייתבעו. נמקו והפנו לסעיפי החוק.","pts":25,"model":["1. יש פרט מטעה: ״הסתיים בהצלחה״ בלי לגלות את דרישת הרגולטור לניסוי נוסף הוא אמת חלקית והשמטה שעלולה להטעות משקיע סביר (הגדרת ״פרט מטעה״, ס' 1 לחוק ניירות ערך). התשקיף חייב לכלול כל פרט חשוב למשקיע סביר (ס' 16(א)).","2. ביטול לאורית (ס' 35(א)): היא רכשה מן המציע בהתאם לתשקיף והסתמכה על הפרט המטעה. אם תפעל תוך זמן סביר אחרי פרסום הדוח המיידי, ולא יאוחר משנתיים לאחר הרכישה (עברה שנה וחצי, ולכן עליה למהר), תוכל לבטל ולקבל בחזרה את מה ששילמה, כ-16,675 ₪.","3. גדי אינו רשאי לבטל: הוא לא רכש מן המציע. אבל הוא רשאי לתבוע פיצויים לפי ס' 31(א)(1), כמי שרכש ״תוך כדי המסחר בבורסה״. הוא לא חייב להוכיח שקרא את התשקיף, אבל עליו להוכיח נזק שנגרם ״מחמת״ הפרט המטעה, כלומר קשר סיבתי, למשל דרך השפעת הפרט על המחיר. גם אורית רשאית לבחור בפיצויים במקום ביטול.","4. הנתבעים לפיצויים: החותמים לפי ס' 22, כלומר החברה, הדירקטורים שחתמו והחתם (ס' 31(א)(1)); מי שהיה במועד אישור הנוסח הסופי דירקטור, מנכ״ל או בעל שליטה, ובהם דנה כבעלת שליטה, אף שלא חתמה (ס' 31(א)(2)); והשמאי, רק אם הפרט המטעה נמצא בדוח שלו (ס' 32). הפרט המטעה כאן נוגע לניסוי הקליני, ולכן כנראה לא בדוח השמאי.","5. ניר אינו אחראי לפי ס' 31(א)(2): הוא מונה אחרי מועד אישור הנוסח הסופי ולא חתם.","6. האחריות יחד ולחוד כלפי הניזוק, ובין האחראים לפי כללי הנזיקין (ס' 34).","7. הגנות (ס' 33): נתבע שיוכיח שנקט כל האמצעים הנאותים והאמין בתום לב שאין פרט מטעה, פטור (ס' 33(1)). למי שלא חתם ולא ידע ולא היה עליו לדעת על פרסום התשקיף יש הגנה (ס' 33(5)), אבל קשה לטעון זאת לגבי בעלת שליטה. אין אחריות כלפי מי שידע על הפרט המטעה (ס' 33(2)).","8. מועדים לפיצויים: התיישנות של שנתיים מיום העסקה או שבע שנים מתאריך התשקיף, לפי המוקדם, לתביעה שלא הוגשה עליה תובענה (ס' 31(ב)). לכן גם גדי ואורית צריכים לפעול בהקדם."],"check":["זיהוי פרט מטעה, כולל השמטה, לפי הגדרת ״פרט מטעה״ (ס' 1) וס' 16(א).","ביטול לפי ס' 35: רק מהמציע, הסתמכות, זמן סביר ולא יותר משנתיים.","גדי: אין ביטול; פיצויים לפי ס' 31 בלי דרישה מפורשת להסתמכות, אבל עם קשר סיבתי.","רשימת האחראים לפי ס' 31(א)(1)–(2) וס' 32, כולל דנה; ניר אינו אחראי.","אחריות יחד ולחוד (ס' 34) והגנות ס' 33.","התיישנות לפי ס' 31(ב)."]}]}]},{"id":"u12","title":"שותפויות","short":"שותפויות","blurb":"תוכלו לזהות מתי נוצרים קשרי שותפות, להבחין בין שותפות כללית למוגבלת, לקבוע את אחריות השותפים כלפי נושים ואת השפעת הרישום, ולהשוות שותפות לחברה.","secs":["שות' 1","שות' 2","שות' 3","שות' 3א","שות' 4","שות' 6","שות' 14","שות' 20","שות' 34","שות' 57","שות' 61","שות' 63","שות' 66"],"blocks":[{"t":"h","x":"מהי שותפות?"},{"t":"p","x":"שותפות היא הדרך הוותיקה והפשוטה ביותר לעשות עסק יחד: בלי תקנון, בלי אסיפות, לפעמים אפילו בלי מסמך. היא מוסדרת ב<b>פקודת השותפויות [נוסח חדש], התשל״ה–1975</b>, ובמה שהפקודה אינה מסדירה חלים דיני היושר והמשפט המקובל האנגליים (שות' 1(ב))."},{"t":"law","law":"פקודת השותפויות","sec":"1(א)","x":"”קשרי שותָפות“ – הקשרים שבין בני אדם המנהלים יחד עסק לשם הפקת רווחים, למעט את הקשרים שבין חברי תאגיד שהואגד לפי כל דין אחר; … ”שותָפות“ – חבר בני האדם שהתקשרו בקשרי שותפות;"},{"t":"list","x":["<b>בני אדם</b> – יותר מאחד. זו התקשרות בין שניים לפחות.","<b>מנהלים יחד עסק</b> – פעילות עסקית משותפת, לא רק החזקה משותפת בנכס.","<b>לשם הפקת רווחים</b> – לא פעילות התנדבותית.","<b>לא חברי תאגיד אחר</b> – בעלי מניות בחברה אינם ״שותפים״ במובן הפקודה."]},{"t":"p","x":"הפקודה מונה מצבים שב<b>הם לבדם</b> אין כדי ליצור שותפות (שות' 2): בעלות משותפת בנכס, גם אם חולקים את רווחיו; חלוקה בהכנסה ברוטו; מלווה שהריבית שלו משתנה לפי הרווחים; עובד או שלוח שמקבל חלק מהרווחים כשכר; מי שמקבל חלק ברווחים כתמורה על מכירת מוניטין."},{"t":"law","law":"פקודת השותפויות","sec":"2(8)","x":"חוץ מן האמור לעיל בסעיף זה, תהא קבלת חלק ברווחי עסק, או כל תשלום
