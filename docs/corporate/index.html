שנים, ורשאית החברה, על אף הוראות סעיף 240, למנותו לשתי תקופות נוספות, של שלוש שנים כל אחת.\n(א1) דירקטור חיצוני בחברה ציבורית ימונה לתקופת כהונה נוספת כאמור בסעיף קטן (א) בהתקיים אחד מאלה:\n(1) בעל מניות, אחד או יותר, שלו אחוז אחד לפחות מכלל זכויות ההצבעה בחברה, הציע את מועמדותו לכהונה נוספת, המינוי אושר באסיפה הכללית, ברוב קולות, והתקיימו כל אלה:\n(א) במניין כלל הקולות של בעלי המניות באסיפה הכללית לא מובאים בחשבון, קולות בעלי המניות שהם שליטה בחברה או בעלי עניין אישי באישור המינוי, למעט עניין אישי שאינו כתוצאה מקשר עם בעל השליטה, וכן קולות הנמנעים;\n(ב) סך קולות התומכים מקרב בעלי המניות שאינם בעלי השליטה בחברה או בעלי עניין אישי באישור המינוי למעט עניין אישי שאינו כתוצאה מקשרים עם בעל השליטה, עולה על שני אחוזים מכלל זכויות ההצבעה בחברה;\n(ג) הדירקטור החיצוני שימונה לתקופה נוספת לפי פסקה זו אינו בעל מניה קשור או מתחרה או קרובו של בעל מניה כאמור, במועד המינוי, ואינו בעל זיקה לבעל מניה קשור או מתחרה, במועד המינוי או בשנתיים שקדמו למועד המינוי; לעניין זה –\n(סוג=הגדרה)  ”בעל מניה קשור או מתחרה“ – בעל המניה שהציע את המינוי או בעל מניה מהותי, והכול אם במועד המינוי יש לו, לבעל שליטה בו או לחברה בשליטת מי מהם, קשרים עסקיים עם החברה או שהוא, בעל שליטה בו או חברה בשליטת מי מהם הם מתחרים של החברה; השר, בהתייעצות עם רשות ניירות ערך, רשאי לקבוע כי עניינים מסוימים, בתנאים שקבע, לא יהוו קשר עסקי עם החברה או תחרות בה;\n(סוג=הגדרה)  ”זיקה“ – כהגדרתה בסעיף 240(ב), ורשאי השר, בהתייעצות עם רשות ניירות ערך, לקבוע כי עניינים מסוימים, בתנאים שקבע, לא יהוו זיקה;\n(2) הדירקטוריון הציע את מועמדותו לכהונה נוספת והמינוי אושר בהתאם להוראות סעיף 239(ב);\n(3) הדירקטור החיצוני הציע את מועמדותו לכהונה נוספת והמינוי אושר בהתאם להוראות פסקה (1).\n(א2) השר רשאי לקבוע שיעורים שונים מן השיעור האמור בסעיף קטן (א1)(1)(ב).\n(א3) על אף הוראות סעיף קטן (א), חברה רשאית לקבוע בתקנונה כי תקופת כהונתו הכוללת של דירקטור חיצוני לא תעלה על שש שנים; קבעה החברה הוראה כאמור בתקנונה, תחול ההוראה רק לגבי דירקטור חיצוני שמונה לראשונה לאחר קביעתה.\n(ב) דירקטור חיצוני לא יפוטר וכהונתו לא תופסק אלא בהתאם להוראות סעיפים 233, 246 ו־247."},{"sec":"245א","title":"חובת הודעה","law":"חוק החברות","text":"דירקטור חיצוני שחדל להתקיים בו תנאי הדרוש לפי חוק זה לכהונתו כדירקטור חיצוני יודיע על כך מיד לחברה, וכהונתו תפקע במועד מתן ההודעה."},{"sec":"246","title":"הפסקת כהונה בידי האסיפה הכללית","law":"חוק החברות","text":"(א) נודע לדירקטוריון כי קיים חשש שדירקטור חיצוני חדל לקיים תנאי מן התנאים הדרושים לפי חוק זה למינויו כדירקטור חיצוני, או כי קיים חשש כי הדירקטור הפר את חובת האמונים לחברה, ידון בכך הדירקטוריון בישיבה שתכונס לראשונה לאחר שנודע לו על כך.\n(ב) קבע הדירקטוריון בחברה ציבורית כי הדירקטור החיצוני חדל לקיים תנאי מן התנאים הדרושים לפי חוק זה למינויו או כי הוא הפר את חובת האמונים, יזמן הדירקטוריון אסיפה מיוחדת שעל סדר יומה הפסקת כהונתו של הדירקטור החיצוני.\n(ג) נימוקי דירקטוריון החברה הציבורית יובאו לפני האסיפה המיוחדת ותינתן לדירקטור החיצוני הזדמנות סבירה להביא את עמדתו; החלטת האסיפה המיוחדת בדבר הפסקת כהונתו של הדירקטור החיצוני תתקבל ברוב הדרוש למינויו.\n(ד) קבע הדירקטוריון בחברה פרטית שהיא חברת איגרות חוב, לאחר שנתן לדירקטור החיצוני הזדמנות סבירה להביא את עמדתו, כי הדירקטור החיצוני חדל לקיים תנאי מן התנאים הדרושים לפי חוק זה למינויו או כי הפר את חובת האמונים לחברה, יודיע על החלטתו ונימוקיה לגורם המוסמך למנות את הדירקטורים החיצוניים בחברה."},{"sec":"247","title":"הפסקת כהונה בידי בית המשפט","law":"חוק החברות","text":"בית המשפט, לבקשת דירקטור או בעל מניה, רשאי להורות על פקיעת כהונתו של דירקטור חיצוני אם מצא כי הוא חדל לקיים תנאי מן התנאים הדרושים לפי חוק זה למינויו כדירקטור חיצוני או כי הפר את חובת האמונים לחברה."},{"sec":"248","title":"מינוי באסיפה מיוחדת","law":"חוק החברות","text":"(א) נתפנתה משרתו של דירקטור חיצוני בחברה ציבורית ולא מכהנים בחברה שני דירקטורים חיצוניים אחרים, יזמן הדירקטוריון אסיפה מיוחדת, למועד מוקדם ככל האפשר, שעל סדר יומה מינוי דירקטור חיצוני.\n(ב) נתפנתה משרתו של דירקטור חיצוני בחברה פרטית שהיא חברת איגרות חוב, ולא מכהנים בחברה שני דירקטורים חיצוניים אחרים, יודיע על כך הדירקטוריון לגורם המוסמך למנות את הדירקטורים החיצוניים בחברה."},{"sec":"249","title":"איסור מינוי והעסקה","law":"חוק החברות","text":"(א) חברה, בעל שליטה בה ותאגיד בשליטתו לא יעניקו למי שכיהן כדירקטור חיצוני באותה חברה, לבן זוגו או לילדו טובת הנאה, במישרין או בעקיפין, ובכלל זה לא ימנו אותו, את בן זוגו או את ילדו, לכהונה כנושא משרה באותה חברה או בתאגיד בשליטת בעל השליטה בה, לא יעסיקוהו כעובד ולא יקבלו ממנו שירותים מקצועיים בתמורה, בין במישרין ובין בעקיפין, לרבות באמצעות תאגיד בשליטתו, אלא אם כן חלפו שנתיים מתום כהונתו כדירקטור חיצוני באותה חברה, ולעניין קרוב שאינו בן זוגו או ילדו – שנה מתום כהונתו כדירקטור חיצוני.\n(ב) הוראות סעיף זה לא יחולו על מינוי או העסקה של מי שכיהן כדירקטור חיצוני בחברה ממשלתית או בחברת בת ממשלתית ועל קבלת שירותים מקצועיים ממנו, על ידי המדינה או על ידי חברה ממשלתית או חברת בת ממשלתית אחרת אשר השר האחראי לענייניה אינו השר האחראי לענייני החברה שבה כיהן כדירקטור חיצוני."},{"sec":"249א","title":"דירקטור חיצוני בחברה שהפכה לחברה פרטית שאינה חברת איגרות חוב","law":"חוק החברות","text":"(א) מיום הפיכתה של חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב לחברה פרטית שאינה חברת איגרות חוב לא יחולו הוראות סימן זה על מי שמכהן או על מי שכיהן בחברה כדירקטור חיצוני.\n(ב) לא החליטה החברה בדבר המשך כהונתו של הדירקטור, תיפסק כהונתו בתום שלושה חודשים מיום הפיכת החברה לחברה פרטית שאינה חברת איגרות חוב."},{"sec":"249ב","title":"סיווג דירקטור כדירקטור בלתי תלוי","law":"חוק החברות","text":"חברה ציבורית או חברה שהיא חברת איגרות חוב רשאית לסווג דירקטור כדירקטור בלתי תלוי אם הוא כשיר להתמנות ככזה לפי פסקאות (1) ו־(2) להגדרה ”דירקטור בלתי תלוי“ שבסעיף 1, לאחר שהצהיר כאמור בסעיף 224ב; לעניין זה, לא יראו בכהונה כדירקטור בחברה טרם הסיווג כדירקטור בלתי תלוי, כזיקה לחברה."},{"sec":"249ג","title":"החלת הוראות על דירקטור בלתי תלוי","law":"חוק החברות","text":"הוראות סעיפים 240(ו), 244, 245א, 246, 247, 249 ו־249א(א) יחולו גם על דירקטור בלתי תלוי."},{"sec":"252","title":"חובת זהירות","law":"חוק החברות","text":"(א) נושא משרה חב כלפי החברה חובת זהירות כאמור בסעיפים 35 ו־36 לפקודת הנזיקין [נוסח חדש].\n(ב) אין בהוראת סעיף קטן (א) כדי למנוע קיומה של חובת זהירות של נושא משרה כלפי אדם אחר."},{"sec":"253","title":"אמצעי זהירות ורמת מיומנות","law":"חוק החברות","text":"נושא משרה יפעל ברמת מיומנות שבה היה פועל נושא משרה סביר, באותה עמדה ובאותן נסיבות, ובכלל זה ינקוט, בשים לב לנסיבות הענין, באמצעים סבירים לקבלת מידע הנוגע לכדאיות העסקית של פעולה המובאת לאישורו או של פעולה הנעשית על ידיו בתוקף תפקידו, ולקבלת כל מידע אחר שיש לו חשיבות לענין פעולות כאמור."},{"sec":"253א","title":"חובת זהירות של דירקטור בעל מומחיות או כשירות","law":"חוק החברות","text":"מינוי דירקטור שהוא בעל מומחיות חשבונאית ופיננסית או שהוא בעל כשירות מקצועית לפי סעיפים 219(ד) או 240(א1), אין בו כדי לשנות מן האחריות המוטלת עליו ועל שאר הדירקטורים בחברה, על פי כל דין."},{"sec":"254","title":"חובת אמונים","law":"חוק החברות","text":"(א) נושא משרה חב חובת אמונים לחברה, ינהג בתום לב ויפעל לטובתה, ובכלל זה –\n(1) יימנע מכל פעולה שיש בה ניגוד ענינים בין מילוי תפקידו בחברה לבין מילוי תפקיד אחר שלו או לבין עניניו האישיים;\n(2) יימנע מכל פעולה שיש בה תחרות עם עסקי החברה;\n(3) יימנע מניצול הזדמנות עסקית של החברה במטרה להשיג טובת הנאה לעצמו או לאחר;\n(4) יגלה לחברה כל ידיעה וימסור לה כל מסמך הנוגעים לעניניה, שבאו לידיו בתוקף מעמדו בחברה.\n(ב) אין בהוראת סעיף קטן (א) כדי למנוע קיומה של חובת אמונים של נושא משרה כלפי אדם אחר."},{"sec":"255","title":"אישור פעולות","law":"חוק החברות","text":"(א) חברה רשאית לאשר פעולה מהפעולות המנויות בסעיף 254(א) ובלבד שנתקיימו כל התנאים האלה:\n(1) נושא המשרה פועל בתום לב והפעולה או אישורה אינן פוגעות בטובת החברה;\n(2) נושא המשרה גילה לחברה, זמן סביר לפני המועד לדיון באישור, את מהות ענינו האישי בפעולה, לרבות כל עובדה או מסמך מהותיים.\n(ב) אישור החברה לפעולות שאינן פעולות מהותיות יינתן לפי הוראות הפרק החמישי לענין אישור עסקאות, ואישור החברה לפעולות מהותיות יינתן לפי הוראות הפרק החמישי לענין אישור עסקאות חריגות; הוראות הפרק החמישי לגבי תוקפן של עסקאות, יחולו, בשינויים המחויבים, לגבי תוקפן של פעולות."},{"sec":"256","title":"תרופות","law":"חוק החברות","text":"(א) על הפרת חובת אמונים של נושא משרה כלפי החברה יחולו הדינים החלים על הפרת חוזה, בשינויים המחויבים.\n(ב) בלי לגרוע מכלליות האמור בסעיף קטן (א), רואים נושא משרה שהפר חובת אמונים כלפי החברה כמי שהפר את התקשרותו עם החברה.\n(ג) חברה רשאית לבטל פעולה שעשה נושא משרה בשם החברה כלפי אדם אחר או לתבוע מאותו אדם את הפיצויים המגיעים לה מנושא המשרה, אף בלא ביטול הפעולה, אם אותו אדם ידע על הפרת חובת האמונים של נושא המשרה, וידע או היה עליו לדעת על היעדר אישור לפעולה.\n(ד) חזקה על אדם שלא היה עליו לדעת על העדר אישור לפעולה כנדרש לפי פרק זה אם קיבל את אישור הדירקטוריון לכך שנתקבלו כל האישורים הנדרשים לפעולה."},{"sec":"257","title":"גילוי ליקוי","law":"חוק החברות","text":"נודע לדירקטור על ענין של החברה שנתגלו בו לכאורה הפרת חוק או פגיעה בנוהל עסקים תקין, יפעל בלא דיחוי לזימון ישיבה של הדירקטוריון כאמור בסעיף 98(ב)(2)."},{"sec":"258","title":"סמכות החברה למתן פטור, שיפוי וביטוח","law":"חוק החברות","text":"(א) חברה אינה רשאית לפטור נושא משרה מאחריותו בשל הפרת חובת האמונים כלפיה.\n(ב) חברה רשאית לפטור נושא משרה מאחריותו בשל הפרת חובת הזהירות כלפיה, בהתאם לקבוע בפרק זה בלבד.\n(ג) חברה רשאית לבטח את אחריותו של נושא משרה בה או לשפותו, בהתאם לקבוע בפרק זה בלבד."},{"sec":"259","title":"הסמכה למתן פטור","law":"חוק החברות","text":"(א) חברה רשאית לפטור, מראש, נושא משרה בה מאחריותו, כולה או מקצתה, בשל נזק עקב הפרת חובת הזהירות כלפיה, אם נקבעה הוראה לכך בתקנון.\n(ב) על אף הוראות סעיף קטן (א), חברה אינה רשאית לפטור מראש דירקטור מאחריותו כלפיה עקב הפרת חובת הזהירות בחלוקה."},{"sec":"260","title":"רשות לענין שיפוי","law":"חוק החברות","text":"(א) חברה רשאית, אם נקבעה בתקנונה הוראה מההוראות המפורטות בסעיף קטן (ב), לשפות נושא משרה בה, בשל חבות או הוצאה כמפורט בפסקאות (1), (1א) ו־(2), שהוטלה עליו או שהוציא, עקב פעולה שעשה בתוקף היותו נושא משרה בה:\n(1) חבות כספית שהוטלה עליו לטובת אדם אחר על פי פסק דין, לרבות פסק דין שניתן בפשרה או פסק בורר שאושר בידי בית משפט;\n(1א) הוצאות התדיינות סבירות, לרבות שכר טרחת עורך דין, שהוציא נושא משרה עקב חקירה או הליך שהתנהל נגדו בידי רשות המוסמכת לנהל חקירה או הליך, ואשר הסתיים בלא הגשת כתב אישום נגדו ובלי שהוטלה עליו חבות כספית כחלופה להליך פלילי, או שהסתיים בלא הגשת כתב אישום נגדו אך בהטלת חבות כספית כחלופה להליך פלילי בעבירה שאינה דורשת הוכחת מחשבה פלילית או בקשר לעיצום כספי; בפסקה זו –\n(סוג=הגדרה)  ”סיום הליך בלא הגשת כתב אישום בענין שנפתחה בו חקירה פלילית“ – משמעו סגירת התיק לפי סעיף 62 לחוק סדר הדין הפלילי [נוסח משולב], התשמ״ב–1982 (בסעיף קטן זה – חוק סדר הדין הפלילי), או עיכוב הליכים בידי היועץ המשפטי לממשלה לפי סעיף 231 לחוק סדר הדין הפלילי;\n(סוג=הגדרה)  ”חבות כספית כחלופה להליך פלילי“ – חבות כספית שהוטלה על פי חוק כחלופה להליך פלילי, לרבות קנס מנהלי לפי חוק העבירות המינהליות, התשמ״ו–1985, קנס על עבירה שנקבעה כעבירת קנס לפי הוראות חוק סדר הדין הפלילי, עיצום כספי או כופר;\n(2) הוצאות התדיינות סבירות, לרבות שכר טרחת עורך דין, שהוציא נושא המשרה או שחוייב בהן בידי בית משפט, בהליך שהוגש נגדו בידי החברה או בשמה או בידי אדם אחר, או באישום פלילי שממנו זוכה, או באישום פלילי שבו הורשע בעבירה שאינה דורשת הוכחת מחשבה פלילית.\n(ב) הוראה בתקנון לענין שיפוי יכול שתהיה כל אחת מאלה:\n(1) הוראה המתירה לחברה לתת התחייבות מראש לשפות נושא משרה בה, בכל אחד מאלה (בחוק זה – התחייבות לשיפוי) –\n(א) כמפורט בסעיף קטן א(1), ובלבד שההתחייבות לשיפוי תוגבל לאירועים שלדעת הדירקטוריון צפויים לאור פעילות החברה בפועל בעת מתן ההתחייבות לשיפוי וכן לסכום או לאמת מידה שהדירקטוריון קבע כי הם סבירים בנסיבות הענין, ושבהתחייבות לשיפוי יצוינו האירועים שלדעת הדירקטוריון צפויים לאור פעילות החברה בפועל בעת מתן ההתחייבות וכן הסכום או אמת המידה אשר הדירקטוריון קבע כי הם סבירים בנסיבות הענין;\n(ב) כמפורט בסעיף קטן א(1א) או (2);\n(2) הוראה המתירה לחברה לשפות נושא משרה בה בדיעבד (להלן – היתר לשיפוי)."},{"sec":"261","title":"ביטוח אחריות","law":"חוק החברות","text":"חברה רשאית, אם נקבעה לכך הוראה בתקנון, להתקשר בחוזה לביטוח אחריותו של נושא משרה בה בשל חבות שתוטל עליו עקב פעולה שעשה בתוקף היותו נושא משרה בה, בכל אחד מאלה:\n(1) הפרת חובת זהירות כלפי החברה או כלפי אדם אחר;\n(2) הפרת חובת אמונים כלפי החברה, ובלבד שנושא המשרה פעל בתום לב והיה לו יסוד סביר להניח שהפעולה לא תפגע בטובת החברה;\n(3) חבות כספית שתוטל עליו לטובת אדם אחר."},{"sec":"262","title":"שינוי התקנון","law":"חוק החברות","text":"(א) בחברה פרטית שמניותיה מחולקות לסוגים, טעונה ההחלטה לכלול הוראה בתקנון בדבר פטור או שיפוי, בנוסף על האישור של האסיפה הכללית, גם אישור אסיפות סוג.\n(ב) בחברה ציבורית אשר נושא משרה בה הוא בעל שליטה כהגדרתו בסעיף 268, טעונה החלטת האסיפה הכללית לכלול הוראה בתקנון בדבר פטור, שיפוי או ביטוח, נוסף על הרוב הדרוש לשינוי התקנון, גם אישור של בעלי מניות שאינם בעלי ענין אישי באישור ההחלטה, כנדרש לגבי עסקה חריגה, לפי הוראות סעיף 275(א)(3)."},{"sec":"263","title":"הוראות חסרות תוקף","law":"חוק החברות","text":"לא יהיה תוקף להוראה בתקנון, המתירה לחברה להתקשר בחוזה לביטוח אחריותו של נושא משרה בה, להוראה בתקנון או להחלטת דירקטוריון המתירה לשפות נושא משרה, או להוראה בתקנון הפוטרת נושא משרה מאחריותו כלפי החברה, בשל כל אחד מאלה:\n(1) הפרת חובת אמונים, למעט לענין שיפוי וביטוח בשל הפרת חובת אמונים כאמור בסעיף 261(2);\n(2) הפרת חובת זהירות שנעשתה בכוונה או בפזיזות, למעט אם נעשתה ברשלנות בלבד;\n(3) פעולה מתוך כוונה להפיק רווח אישי שלא כדין;\n(4) קנס, קנס אזרחי, עיצום כספי או כופר שהוטל עליו."},{"sec":"264","title":"אי התניה","law":"חוק החברות","text":"(א) לא יהיה תוקף להוראה בתקנון או בחוזה או הניתנת בכל דרך אחרת, המתנה על האמור בסימן זה, במישרין או בעקיפין.\n(ב) לא יהיה תוקף להתחייבות לשיפוי או לביטוח אחריותו של נושא משרה עקב הפרת חובת אמונים כלפי החברה, למעט הפרת חובת אמונים כאמור בסעיף 261(2), ונושא משרה לא יקבל, במישרין או בעקיפין, התחייבות כאמור; קבלת התחייבות כאמור היא הפרה של חובת אמונים."},{"sec":"265","title":"הזכות לקבלת מידע","law":"חוק החברות","text":"(א) לכל דירקטור הזכות לבדוק את מסמכי החברה ואת רישומיה ולקבל העתקים מהם, ולבדוק את נכסי החברה, ככל שהדבר דרוש למילוי חובותיו כדירקטור.\n(ב) החברה רשאית למנוע מדירקטור לבדוק מסמך או נכס של החברה, אם סבר הדירקטוריון שהדירקטור פועל בחוסר תום לב או שבדיקה כאמור עלולה לפגוע בטובת החברה.\n(ג) בית המשפט רשאי, לבקשת דירקטור חיצוני, לקבוע כי הזכות האמורה בסעיף קטן (א) תחול גם לגבי מסמכים ורישומים של כל חברה קשורה, אם השתכנע כי המידע המבוקש חשוב לביצוע תפקידו כדירקטור חיצוני."},{"sec":"266","title":"זכות להעסיק יועצים","law":"חוק החברות","text":"(א) לצורך ביצוע תפקידו זכאי דירקטור, במקרים מיוחדים, לקבל ייעוץ מקצועי על חשבון החברה, אם כיסוי ההוצאה אושר על ידי דירקטוריון החברה או על ידי בית המשפט.\n(ב) בית המשפט, בבואו להחליט בבקשה כאמור בסעיף קטן (א) ישקול, בין היתר, האם המומחים של החברה אינם מספקים את הסיוע הנדרש לדירקטור לצורך מילוי תפקידו, ואת הסבירות של הסכום המבוקש בהתחשב בעילה לבקשת הייעוץ ובמצבה הכספי של החברה."},{"sec":"267","title":"זכות תביעה","law":"חוק החברות","text":"(א) היה לדירקטור יסוד סביר להניח שעומדת להתבצע פעולה של נושא משרה העלולה להוות הפרת חובה של נושא משרה, רשאי הוא, לאחר שפעל כאמור בסעיף 257 אם הנסיבות מאפשרות זאת, לפנות לבית המשפט בבקשה שיאכוף את החובה או ימנע את הפעולה; בית המשפט רשאי לתת צו שימנע את הפעולה או כל סעד אחר שייראה לו בנסיבות הענין.\n(ב) אלא אם כן קבע בית המשפט אחרת, תישא החברה בכל ההוצאות שהוציא דירקטור שפנה לבית המשפט לפי הוראות סעיף זה, לרבות אגרות בית משפט ושכר טרחת עורך דין, במועד כפי שיקבע בית המשפט."},{"sec":"267א","title":"קביעת מדיניות תגמול לנושאי משרה","law":"חוק החברות","text":"(א) דירקטוריון חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב יקבע מדיניות לעניין תנאי כהונה והעסקה של נושאי משרה בחברה (בחוק זה – מדיניות התגמול), לאחר ששקל את המלצות ועדת התגמול שהוגשו לו לפי סעיף 118ב(1); מדיניות התגמול טעונה אישור האסיפה הכללית.\n(ב) באישור האסיפה הכללית בחברה ציבורית, לפי סעיף קטן (א), יתקיים אחד מאלה:\n(1) במניין קולות הרוב באסיפה הכללית ייכללו רוב מכלל קולות בעלי המניות שאינם בעלי השליטה בחברה או בעלי עניין אישי באישור מדיניות התגמול, המשתתפים בהצבעה; במניין כלל הקולות של בעלי המניות האמורים לא יובאו בחשבון קולות הנמנעים; על מי שיש לו עניין אישי יחולו הוראות סעיף 276, בשינויים המחויבים;\n(2) סך קולות המתנגדים מקרב בעלי המניות האמורים בפסקה (1) לא עלה על שיעור של שני אחוזים מכלל זכויות ההצבעה בחברה; השר רשאי לקבוע שיעורים שונים מהשיעור האמור בפסקה זו.\n(ג) על אף האמור בסעיפים קטנים (א) ו־(ב), דירקטוריון החברה, למעט בחברה נכדה ציבורית, רשאי לקבוע את מדיניות התגמול גם אם האסיפה הכללית התנגדה לאישורה, ובלבד שוועדת התגמול ולאחריה הדירקטוריון החליטו, על יסוד נימוקים מפורטים ולאחר שדנו מחדש במדיניות התגמול, כי אישור מדיניות התגמול על אף התנגדות האסיפה הכללית הוא לטובת החברה; לעניין זה, ”חברה נכדה ציבורית“ – חברה ציבורית הנשלטת בידי חברה ציבורית או בידי חברה פרטית שהיא חברת איגרות חוב, שהיא עצמה נשלטת בידי חברה ציבורית או בידי חברה פרטית שהיא חברת איגרות חוב אחרת, הנשלטת בידי בעל שליטה.\n(ד) מדיניות תגמול לתקופה העולה על שלוש שנים טעונה אישור אחת לשלוש שנים; אישור לפי סעיף קטן זה יינתן בדרך שבה נקבעת מדיניות התגמול לפי סעיפים קטנים (א) עד (ג).\n(ה) בלי לגרוע מהוראות סעיף קטן (ד), הדירקטוריון יבחן, מעת לעת, את מדיניות התגמול וכן את הצורך בהתאמתה להוראות סעיף 267ב אם חל שינוי מהותי בנסיבות שהיו קיימות בעת קביעתה או מטעמים אחרים."},{"sec":"267ב","title":"שיקולים בקביעת מדיניות התגמול","law":"חוק החברות","text":"(א) מדיניות התגמול תיקבע בין השאר לפי שיקולים אלה:\n(1) קידום מטרות החברה, תכנית העבודה שלה ומדיניותה בראייה ארוכת טווח;\n(2) יצירת תמריצים ראויים לנושאי המשרה בחברה, בהתחשב, בין השאר, במדיניות ניהול הסיכונים של החברה;\n(3) גודל החברה ואופי פעילותה;\n(4) לעניין תנאי כהונה והעסקה הכוללים רכיבים משתנים – תרומתו של נושא המשרה להשגת יעדי החברה ולהשאת רווחיה, והכל בראייה ארוכת טווח ובהתאם לתפקידו של נושא המשרה.\n(ב) מדיניות התגמול תכלול, בין השאר, התייחסות לעניינים המפורטים בחלק א׳ לתוספת ראשונה א׳ וייקבעו בה, בין השאר, הוראות כמפורט בחלק ב׳ לתוספת האמורה.\n(ג) השר, לאחר התייעצות עם רשות ניירות ערך ובאישור ועדת החוקה חוק ומשפט של הכנסת, רשאי, בצו, לשנות את תוספת ראשונה א׳."},{"sec":"267ג","title":"תקנות לעניין {{ח:פנימי","law":"חוק החברות","text":"|תיקון: תשע״ג}}\n השר, לאחר התייעצות עם רשות ניירות ערך, רשאי לקבוע כי הוראות פרק זה לא יחולו על סוגים של חברות ציבוריות או של חברות איגרות חוב, כפי שיקבע."},{"sec":"268","title":"הגדרת בעל שליטה","law":"חוק החברות","text":"בפרק זה, ”בעל שליטה“ – בעל השליטה כמשמעותה בסעיף 1, לרבות מי שמחזיק בעשרים וחמישה אחוזים או יותר מזכויות ההצבעה באסיפה הכללית של החברה אם אין אדם אחר המחזיק בלמעלה מחמישים אחוזים מזכויות ההצבעה בחברה; לענין החזקה, יראו שניים או יותר, המחזיקים בזכויות הצבעה בחברה ואשר לכל אחד מהם יש ענין אישי באישור אותה עסקה המובאת לאישור החברה, כמחזיקים יחד."},{"sec":"269","title":"חובת גילוי","law":"חוק החברות","text":"(א) נושא משרה בחברה או בעל שליטה בחברה ציבורית או בחברה פרטית שהיא חברת איגרות חוב היודע שיש לו ענין אישי בעסקה קיימת או מוצעת של החברה, יגלה לחברה, בלא דיחוי, ולא יאוחר מישיבת הדירקטוריון שבה נדונה העסקה לראשונה, את מהות ענינו האישי, לרבות כל עובדה או מסמך מהותיים.\n(ב) הוראת סעיף קטן (א) לא תחול כאשר הענין האישי נובע רק מקיום ענין אישי של קרוב בעסקה שאינה חריגה.\n(ג) צד מעונין, כמשמעותו בסעיף 270(5), או מי שיהפוך לבעל שליטה כתוצאה מהצעה פרטית, היודע שיש לו ענין אישי בהצעה הפרטית המהותית, יגלה בלא דיחוי לחברה הציבורית את מהות ענינו האישי, לרבות כל עובדה או מסמך מהותיים."},{"sec":"270","title":"עסקאות הטעונות אישורים מיוחדים","law":"חוק החברות","text":"עסקאות של חברה המפורטות להלן, טעונות אישורים כקבוע בפרק זה, ובלבד שהעסקה היא לטובת החברה:\n(1) עסקה של חברה עם נושא משרה בה וכן עסקה של חברה עם אדם אחר שלנושא משרה בחברה יש בה ענין אישי; ואולם, לא יראו\n(א) נושא משרה בחברה אם וגם בחברה בת הנמצאת בשליטתה ובבעלותה המלאות, כבעל ענין אישי בעסקה בין החברה האם לבין החברה הבת, בשל עצם היותו נושא משרה בשתיהן או בשל היותו בעל מניה או בעל נייר ערך שניתן לממשו במניות בחברה האם;\n(ב) נושא משרה במספר חברות בנות הנמצאות בשליטה ובבעלות מלאה של אותו אדם, כבעל ענין אישי בעסקה בין חברות בנות כאמור, בשל עצם היותו נושא משרה בחברות המתקשרות;\n(2) התקשרות של חברה עם נושא משרה בה שאינו דירקטור, באשר לתנאי כהונתו והעסקתו;\n(3) התקשרות של חברה עם דירקטור בה באשר לתנאי כהונתו והעסקתו, לעניין כהונתו כדירקטור, וכן לעניין העסקתו בתפקידים אחרים – אם הוא מועסק כאמור;\n(4) עסקה חריגה של חברה ציבורית עם בעל השליטה בה או עסקה חריגה של חברה ציבורית עם אדם אחר שלבעל השליטה יש בה ענין אישי, לרבות הצעה פרטית שלבעל השליטה יש בה ענין אישי; וכן התקשרות של חברה ציבורית עם בעל השליטה בה או עם קרובו, במישרין או בעקיפין, לרבות באמצעות חברה שבשליטתו, לעניין קבלת שירותים בידי החברה וכן אם הוא גם נושא משרה בה – באשר לתנאי כהונתו והעסקתו, ואם הוא עובד החברה ואינו נושא משרה בה – באשר להעסקתו בחברה;\n(4א) עסקה חריגה של חברה פרטית שהיא חברת איגרות חוב, עם בעל השליטה בה, או עסקה חריגה של חברה כאמור עם אדם אחר שלבעל השליטה יש בה עניין אישי, וכן התקשרות של חברה כאמור עם בעל השליטה בה או עם קרובו, במישרין או בעקיפין לרבות באמצעות חברה שבשליטתו, לעניין קבלת שירותים בידי החברה, וכן אם הוא גם נושא משרה בה – באשר לתנאי כהונתו והעסקתו, ואם הוא עובד החברה ואינו נושא משרה בה – באשר להעסקתו בחברה;\n הצעה פרטית אשר מתקיים בה אחד מאלה:\n(1) הצעה המקנה עשרים אחוזים או יותר מסך זכויות ההצבעה בחברה בפועל לפני ההנפקה שהתמורה, כולה או חלקה, אינה במזומן או בניירות ערך הרשומים למסחר בבורסה או שאינה בתנאי שוק, ואשר כתוצאה ממנה יגדלו החזקותיו של בעל מניה מהותי בניירות הערך של החברה, או שכתוצאה ממנה יהפוך אדם לבעל מניה מהותי לאחר ההנפקה (בחוק זה – צד מעוניין);\n(2) כתוצאה ממנה יהפוך אדם לבעל שליטה בחברה;\n(ב) לענין פסקה זו יראו את סך כל ההצעות הפרטיות שמתקיים בהן אחד מאלה, כהצעה פרטית אחת:\n(1) הן נעשו במהלך תקופה בת 12 חודשים רצופים לאותו ניצע או למי מטעמו, לקרובו, לתאגיד בשליטתו או בשליטת קרובו, וכשהניצע הוא תאגיד – גם לבעלי השליטה בניצע, לקרובו של בעל השליטה ולתאגיד בשליטת בעל השליטה או בשליטת קרובו;\n(2) הן נעשו במהלך תקופה בת 12 חודשים רצופים ונקבעה בהם תמורה באותו נכס ויראו ניירות ערך שונים של חברה אחת כאותו נכס;\n(3) הן מהוות חלק מעסקה אחת או שהן מותנות זו בזו;\n(ג) לענין תנאי שוק לפי פסקה זו, יראו הצעה כהצעה בתנאי שוק אם הדירקטוריון קבע על יסוד נימוקים מפורטים כי ההצעה היא בתנאי שוק, אלא אם כן הוכח אחרת, ולענין החזקה לפי פסקה זו, יראו ניירות ערך הניתנים להמרה או למימוש למניות, שאותו אדם מחזיק או שיונפקו לו לפי ההצעה הפרטית, כאילו הומרו או מומשו."},{"sec":"271","title":"עסקאות שאינן חריגות","law":"חוק החברות","text":"עסקה שמתקיים בה האמור בסעיף 270(1), שאינה עסקה חריגה, טעונה אישור הדירקטוריון, אלא אם כן נקבעה דרך אישור אחרת בתקנון."},{"sec":"272","title":"עסקאות חריגות עם נושא משרה ועסקאות עם נושא משרה שאינו דירקטור באשר לתנאי כהונתו והעסקתו","law":"חוק החברות","text":"(א) עסקה של חברה, שמתקיים בה האמור בסעיף 270(1) והיא עסקה חריגה, או עסקה של חברה פרטית שאינה חברת איגרות חוב שמתקיים בה האמור בסעיף 270(2), טעונה אישור ועדת הביקורת ולאחר מכן אישור הדירקטוריון.\n(ב) לא היתה לחברה פרטית שאינה חברת איגרות חוב ועדת ביקורת, טעונה העסקה אישור הדירקטוריון בלבד אם נושא המשרה אינו דירקטור, ואם נושא המשרה הוא דירקטור גם אישור של האסיפה הכללית.\n עסקה של חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב, שמתקיים בה האמור בסעיף 270(2), למעט עסקה עם המנהל הכללי של החברה כאמור בסעיף קטן (ג1), טעונה אישור של ועדת התגמול ולאחר מכן אישור הדירקטוריון.\n(2) אישור ועדת התגמול והדירקטוריון לפי פסקה (1) יהיה בהתאם למדיניות התגמול, ואולם ועדת התגמול ולאחריה הדירקטוריון רשאים, במקרים מיוחדים, לאשר עסקה כאמור באותה פסקה שלא בהתאם למדיניות התגמול, בהתקיים שניים אלה:\n(א) ועדת התגמול ולאחריה הדירקטוריון אישרו את העסקה, בין השאר, לפי השיקולים המנויים בסעיף 267ב(א), תוך התייחסות לעניינים המפורטים בחלק א׳ לתוספת ראשונה א׳ ובתנאי שנקבעו בעסקה, בין השאר, ההוראות כמפורט בחלק ב׳ לתוספת האמורה;\n(ב) האסיפה הכללית אישרה את העסקה, ובלבד שבחברה ציבורית מתקיים האמור בסעיף 267א(ב)(1) או (2).\n(3) על אף הוראות פסקה (2), בחברה, למעט חברה נכדה ציבורית כהגדרתה בסעיף 267א(ג), ועדת התגמול ולאחריה הדירקטוריון רשאים, במקרים מיוחדים, לאשר עסקה כאמור באותה פסקה גם אם האסיפה הכללית התנגדה לאישור העסקה, ובלבד שוועדת התגמול ולאחריה הדירקטוריון החליטו על כך, על יסוד נימוקים מפורטים, לאחר שדנו מחדש בעסקה ובחנו בדיון כאמור, בין השאר, את התנגדות האסיפה הכללית.\n עסקה של חברה ציבורית או חברה פרטית שהיא חברת איגרות חוב, עם המנהל הכללי של החברה, שמתקיים בה האמור בסעיף 270(2), טעונה אישור של אלה בסדר הזה:\n(א) ועדת התגמול;\n(ב) הדירקטוריון;\n(ג) האסיפה הכללית, ובלבד שבחברה ציבורית מתקיים האמור בסעיף 267א(ב)(1) או (2); לעניין אישור האסיפה הכללית לפי פסקת משנה זו, יחולו הוראות סעיף קטן (ג)(3).\n(2) אישור ועדת התגמול ואישור הדירקטוריון כאמור בפסקה (1) יהיו בהתאם למדיניות התגמול, ואולם ועדת התגמול ולאחריה הדירקטוריון רשאים, במקרים מיוחדים, לאשר את העסקה שלא בהתאם למדיניות כאמור, ובלבד שמתקיים האמור בסעיף קטן (ג)(2)(א); אין באמור בסעיף קטן זה כדי לגרוע מהוראות פסקה (1)(ג).\n(3) על אף הוראות פסקה (1)(ג), ועדת התגמול רשאית לפטור מאישור האסיפה הכללית עסקה עם מי שמועמד לכהן כמנהל כללי של החברה שמתקיים לגביו האמור בסעיף 240(ב), אם מצאה, על יסוד נימוקים שפירטה, כי הבאת העסקה לאישור האסיפה הכללית תסכל את ההתקשרות, ובלבד שהעסקה תואמת את מדיניות התגמול.\n(ד) על אף האמור בסעיפים קטנים (א), (ג) ו־(ג1), עסקה שמתקיים בה האמור בסעיף 270(2) והיא שינוי של עסקה קיימת, טעונה אישור של ועדת ביקורת או ועדת תגמול, לפי העניין בלבד, אם הוועדה האמורה אישרה כי השינוי בתנאי העסקה אינו מהותי ביחס לעסקה הקיימת."},{"sec":"273","title":"עסקה עם דירקטור באשר לתנאי כהונתו והעסקתו","law":"חוק החברות","text":"(א) עסקה של חברה שמתקיים בה האמור בסעיף 270(3), טעונה אישורו של הדירקטוריון ולאחריו אישורה של האסיפה הכללית, ובחברה ציבורית וכן בחברה פרטית שהיא חברת איגרות חוב, טעונה העסקה אישור ועדת התגמול, קודם לאישור הדירקטוריון.\n(ב) אישור ועדת התגמול ואישור הדירקטוריון כאמור בסעיף קטן (א), בחברה ציבורית ובחברה פרטית שהיא חברת איגרות חוב, יהיו בהתאם למדיניות התגמול, ואולם ועדת התגמול ולאחריה הדירקטוריון רשאים, במקרים מיוחדים, לאשר את העסקה שלא בהתאם למדיניות כאמור, ובלבד שמתקיים האמור בסעיף 272(ג)(2)(א) וכן, בחברה ציבורית – מתקיים באישור האסיפה הכללית האמור בסעיף 267א(ב)(1) או (2)."},{"sec":"274","title":"הצעה פרטית","law":"חוק החברות","text":"הצעה פרטית מהותית טעונה אישור הדירקטוריון ולאחריו אישורה של האסיפה הכללית."},{"sec":"275","title":"עסקה עם בעל שליטה","law":"חוק החברות","text":"(א) עסקה שמתקיים בה האמור בסעיף 270(4) טעונה אישורם של אלה בסדר הבא:\n(1) ועדת הביקורת ובעסקה באשר לתנאי כהונה והעסקה – ועדת התגמול;\n(2) הדירקטוריון;\n(3) האסיפה הכללית, ובלבד שיתקיים אחד מאלה:\n(א) במנין קולות הרוב באסיפה הכללית ייכללו רוב מכלל קולות בעלי המניות שאינם בעלי ענין אישי באישור העסקה, המשתתפים בהצבעה; במנין כלל הקולות של בעלי המניות האמורים לא יובאו בחשבון קולות הנמנעים;\n(ב) סך קולות המתנגדים מקרב בעלי המניות האמורים בפסקת משנה (א) לא עלה על שיעור של שני אחוזים מכלל זכויות ההצבעה בחברה.\n עסקה כאמור בסעיף קטן (א) לתקופה העולה על שלוש שנים, טעונה אישור כאמור באותו סעיף קטן, אחת לשלוש שנים.\n(2) על אף האמור בפסקה (1), עסקה כאמור בסעיף 270(4) רישה, בלבד, יכול שתאושר לתקופה העולה על שלוש שנים, ובלבד שוועדת הביקורת אישרה כי התקשרות לתקופה כאמור סבירה בנסיבות העניין.\n(3) הוראות פסקאות (1) ו־(2) יחולו על עסקה של חברה שהפכה לחברה ציבורית, ביחס לתקופה שלאחר הפיכתה לחברה ציבורית.\n(ב) השר רשאי לקבוע שיעורים שונים מן השיעור האמור בסעיף קטן (א)(3)(ב).\n(ג) עסקה שמתקיים בה האמור בסעיף 270(4א) טעונה אישורם של אלה בלבד בסדר הזה:\n(1) ועדת הביקורת ובעסקה באשר לתנאי כהונה והעסקה – ועדת התגמול;\n(2) הדירקטוריון;\n(3) בעסקה באשר לתנאי כהונה והעסקה – האסיפה הכללית.\n(ג1) אישור ועדת התגמול ואישור הדירקטוריון כאמור בסעיפים קטנים (א) ו־(ג), בעסקה שעניינה תנאי כהונה והעסקה, יהיו בהתאם למדיניות התגמול, ואולם ועדת התגמול ולאחריה הדירקטוריון רשאים, במקרים מיוחדים, לאשר את העסקה שלא בהתאם למדיניות כאמור, ובלבד שמתקיים האמור בסעיף 272(ג)(2)(א); אין באמור בסעיף קטן זה כדי לגרוע מהוראות סעיף קטן (ג)(3).\n אישור ועדת הביקורת או ועדת התגמול, לפי העניין (בסעיף קטן זה – הוועדה) והדירקטוריון לפי הוראות סעיפים קטנים (א) או (ג), יינתן לאחר שהוועדה והדירקטוריון בחנו, בין השאר, אם העסקה כוללת חלוקה.\n(2) קבעו הוועדה או הדירקטוריון כי העסקה כוללת חלוקה, תאושר העסקה רק לאחר שאישרו כי קוימו, לעניין זה, הוראות כל דין לעניין חלוקה.\n(3) לעניין חברת איגרות חוב, קבעו הוועדה והדירקטוריון כי עסקה הטעונה אישורם לפי סעיפים קטנים (א) או (ג) אינה כוללת חלוקה, יבחנו אם קיים חשש סביר שהעסקה תמנע מהחברה את היכולת לעמוד בחבויותיה הקיימות והצפויות, בהגיע מועד קיומן; קבעו הוועדה או הדירקטוריון כי קיים חשש כאמור, לא תאושר העסקה."},{"sec":"276","title":"גילוי ענין אישי","law":"חוק החברות","text":"בעל מניה המשתתף בהצבעה לפי סעיף 275 יודיע לחברה לפני ההצבעה באסיפה או, אם ההצבעה היא באמצעות כתב הצבעה – על גבי כתב ההצבעה, אם יש לו ענין אישי באישור העסקה אם לאו; לא הודיע בעל מניה כאמור, לא יצביע וקולו לא יימנה."},{"sec":"277","title":"אישורים מצטברים","law":"חוק החברות","text":"התקיימו בעסקה התנאים הקבועים ביותר מחלופה אחת מהחלופות שבסעיף 270, טעונה העסקה אישורים בהתאם להוראות החלות על כל אחת מן החלופות."},{"sec":"278","title":"הימנעות בעלי עניין אישי","law":"חוק החברות","text":"(א) מי שיש לו ענין אישי באישור עסקה, למעט עסקה כאמור בסעיף 271, המובאת לאישור ועדת הביקורת או הדירקטוריון, לא יהיה נוכח בדיון ולא ישתתף בהצבעה בועדת הביקורת ובדירקטוריון ואולם נושא משרה שיש לו עניין אישי, רשאי להיות נוכח לשם הצגת העסקה, אם יושב ראש ועדת הביקורת או יושב ראש הדירקטוריון, לפי העניין, קבע כי הוא נדרש לשם הצגתה.\n(ב) על אף האמור בסעיף קטן (א), רשאי דירקטור להיות נוכח בדיון בועדת ביקורת ולהשתתף בהצבעה, אם לרוב חברי ועדת הביקורת יש ענין אישי באישור העסקה, וכן רשאי דירקטור להיות נוכח בדיון בדירקטוריון ולהשתתף בהצבעה, אם לרוב הדירקטורים בחברה יש ענין אישי באישור העסקה.\n(ג) היה לרוב הדירקטורים בדירקטוריון החברה ענין אישי באישור עסקה כאמור בסעיף קטן (א), טעונה העסקה גם אישור האסיפה הכללית."},{"sec":"279","title":"ועדת ביקורת בחברה ציבורית ובחברה פרטית שהיא חברת איגרות חוב","law":"חוק החברות","text":"ועדת ביקורת בחברה ציבורית או בחברה פרטית שהיא חברת איגרות חוב לא תהא רשאית לתת אישור הנדרש לפי פרק זה, אלא אם כן מתקיימות בה, בעת מתן האישור, הוראות סעיף 115."},{"sec":"280","title":"עסקה חסרת תוקף","law":"חוק החברות","text":"(א) לעסקה של חברה עם נושא משרה בה או לעסקה כאמור בסעיף 270(4) ו־(4א) עם בעל שליטה בה לא יהיה תוקף כלפי החברה וכלפי נושא המשרה או בעל השליטה, אם העסקה לא אושרה בהתאם לקבוע בפרק זה לרבות אם נפל בהליך האישור פגם מהותי, או אם העסקה נעשתה בחריגה מהותית מן האישור.\n(ב) לעסקה כאמור בסעיף קטן (א) לא יהיה תוקף גם כלפי אדם אחר אם אותו אדם ידע על ענינו האישי של נושא המשרה או של בעל השליטה באישור העסקה, וידע או היה עליו לדעת על העדר אישור לעסקה כנדרש לפי פרק זה."},{"sec":"281","title":"ביטול עסקה","law":"חוק החברות","text":"חברה רשאית לבטל עסקה עם אדם אחר, הטעונה אישור כאמור בפרק זה, למעט עסקה כאמור בסעיף 271, וכן רשאית היא לתבוע ממנו פיצויים בשל הנזק שנגרם לה אף בלא ביטול העסקה, אם אותו אדם ידע על ענינו האישי של נושא המשרה בחברה באישור העסקה או על ענינו האישי של בעל השליטה בחברה הציבורית או בחברה הפרטית שהיא חברת איגרות חוב באישור העסקה, וידע או היה עליו לדעת על העדר אישור לעסקה כנדרש לפי פרק זה."},{"sec":"282","title":"אישור דירקטוריון","law":"חוק החברות","text":"חזקה על אדם שלא היה עליו לדעת על העדר אישור לעסקה כנדרש לפי פרק זה, אם קיבל את אישור הדירקטוריון לכך שנתקבלו כל האישורים הנדרשים לעסקה."},{"sec":"283","title":"סעדים","law":"חוק החברות","text":"(א) נושא משרה שלא גילה את ענינו האישי כאמור בסעיף 269 יראו אותו כמי שהפר את חובת האמונים; בעל שליטה בחברה ציבורית או בחברה פרטית שהיא חברת איגרות חוב שלא גילה את ענינו האישי כאמור באותו סעיף, יראו אותו כמי שהפר את חובת ההגינות.\n(ב) צד מעונין שהפר את חובת הגילוי כאמור בסעיף 269 או בעל מניה שלא גילה את ענינו האישי כאמור בסעיף 276, רשאית החברה לתבוע ממנו פיצויים על הנזקים שנגרמו לה עקב העדר הגילוי."},{"sec":"284","title":"תקנות","law":"חוק החברות","text":"השר רשאי לקבוע כי הוראות פרק זה לא יחולו על סוגים שונים של עסקאות, ובלבד שלעניין חברה ציבורית או חברת איגרות חוב, יקבע כן לאחר התייעצות עם רשות ניירות ערך."},{"sec":"285","title":"חופש הגיוון","law":"חוק החברות","text":"לחברה יכול שיהיו מניות, איגרות חוב, או ניירות ערך אחרים, שלכל אחד מהם זכויות שונות."},{"sec":"286","title":"הגדלת הון מניות רשום","law":"חוק החברות","text":"האסיפה הכללית רשאית להגדיל את הון המניות הרשום של החברה בסוגי מניות, כפי שתקבע."},{"sec":"287","title":"ביטול הון מניות רשום","law":"חוק החברות","text":"האסיפה הכללית רשאית לבטל הון מניות רשום שטרם הוקצה, ובלבד שאין התחייבות של החברה, לרבות התחייבות מותנית, להקצות את המניות."},{"sec":"301","title":"אי התניה","law":"חוק החברות","text":"(א) חברה רשאית לבצע חלוקה לפי הוראות פרק זה בלבד; ואולם חברה רשאית להתחייב בתקנונה או בחוזה שלא לבצע חלוקה במגבלות נוספות על הוראות פרק זה.\n(ב) חלוקה בניגוד להוראות פרק זה היא חלוקה אסורה."},{"sec":"302","title":"חלוקה מותרת","law":"חוק החברות","text":"(א) חברה רשאית לבצע חלוקה מתוך רווחיה (להלן – מבחן הרווח), ובלבד שלא קיים חשש סביר שהחלוקה תמנע מן החברה את היכולת לעמוד בחבויותיה הקיימות והצפויות, בהגיע מועד קיומן (להלן – מבחן יכולת הפרעון).\n(ב) בסעיף זה –\n(סוג=הגדרה)  ”רווחים“, לענין מבחן הרווח – יתרת עודפים או עודפים שנצברו בשנתיים האחרונות, לפי הגבוה מבין השניים, והכל על פי הדוחות הכספיים המותאמים האחרונים, המבוקרים או הסקורים, שערכה החברה, תוך הפחתת חלוקות קודמות אם לא הופחתו כבר מן העודפים, ובלבד שהמועד שלגביו נערכו הדוחות אינו מוקדם ביותר מששה חודשים ממועד החלוקה;\n(סוג=הגדרה)  ”דוחות כספיים מותאמים“ – דוחות כספיים מותאמים למדד או דוחות כספיים הבאים או שיבואו במקומם, והכל לפי כללי חשבונאות מקובלים;\n(סוג=הגדרה)  ”עודפים“ – סכומים הכלולים בהון העצמי של חברה ושמקורם ברווח הנקי שלה כפי שנקבע לפי כללי חשבונאות מקובלים, וכן סכומים אחרים הכלולים בהון העצמי לפי כללי חשבונאות מקובלים ושאינם הון מניות או פרמיה, שהשר קבע שיראו אותם כעודפים.\n \n(ג) השר רשאי לקבוע הוראות לענין חזקות בדבר עמידתה של חברה בתנאי מבחן יכולת הפרעון וכן פטורים או הקלות לענין התאמת הדוחות הכספיים."},{"sec":"303","title":"חלוקה באישור בית משפט","law":"חוק החברות","text":"(א) בית המשפט רשאי, לבקשת חברה, לאשר לה לבצע חלוקה שלא מקיימת את מבחן הרווח, ובלבד ששוכנע שמתקיים מבחן יכולת הפירעון.\n(ב) חברה תודיע לנושיה על הגשת בקשה לבית המשפט כאמור בסעיף קטן (א) באופן שיקבע השר.\n \n(ג) נושה רשאי לפנות לבית המשפט ולהתנגד לבקשת החברה להתיר לה ביצוע חלוקה.\n(ד) בית המשפט רשאי, לאחר שנתן לנושים שהתנגדו הזדמנות להשמיע את טענותיהם, לאשר את בקשת החברה, כולה או חלקה, לדחותה או להתנות את אישורו בתנאים."},{"sec":"304","title":"הקצאת מניות בפחות מערכן הנקוב","law":"חוק החברות","text":"(א) החליטה חברה להקצות מניות שלהן ערך נקוב, בתמורה הנמוכה מערכן הנקוב, לרבות מניות הטבה, עליה להפוך להון מניות חלק מרווחיה, כמשמעותם בסעיף 302(ב), מפרמיה על מניות, או מכל מקור אחר הכלול בהונה העצמי, האמורים בדוחות הכספיים האחרונים שלה, בסכום השווה להפרש שבין הערך הנקוב לבין התמורה.\n(ב) בית המשפט רשאי, לבקשת חברה, לאשר לה לבצע הקצאת מניות בתמורה נמוכה מערכן הנקוב, שלא כאמור בסעיף קטן (א), בתנאים שיקבע."},{"sec":"305","title":"תקנות","law":"חוק החברות","text":"השר רשאי לקבוע הוראות לביצוע פרק זה."},{"sec":"306","title":"זכות לדיבידנד או למניות הטבה","law":"חוק החברות","text":"(א) לבעל מניה הזכות לקבל דיבידנד או מניות הטבה, אם החליטה על כך החברה.\n(ב) היו בהון החברה מניות שלהן ערכים נקובים שונים, יחולקו דיבידנד או מניות הטבה באופן יחסי לערך הנקוב של כל מניה, אלא אם כן נקבע אחרת בתקנון."},{"sec":"307","title":"החלטה על חלוקת דיבידנד","law":"חוק החברות","text":"החלטת החברה על חלוקת דיבידנד תתקבל בדירקטוריון החברה, ואולם חברה רשאית לקבוע בתקנונה כי ההחלטה תתקבל באחת מהדרכים הבאות:\n(1) באסיפה הכללית, לאחר שתובא בפניה המלצת הדירקטוריון; האסיפה רשאית לקבל את ההמלצה או להקטין את הסכום אך לא להגדילו;\n(2) בדירקטוריון החברה, לאחר שהאסיפה קבעה את סכום החלוקה המרבי;\n(3) בדרך אחרת שנקבעה בתקנון, ובלבד שניתנה הזדמנות נאותה לדירקטוריון לקבוע, בטרם תבוצע החלוקה, כי החלוקה אינה חלוקה אסורה."},{"sec":"308","title":"תוצאות רכישה","law":"חוק החברות","text":"(א) רכשה חברה מניה ממניותיה, רשאית היא לבטלה; לא ביטלה החברה את המניה האמורה, לא תקנה המניה זכויות כלשהן (להלן – מניה רדומה), כל עוד המניה הרדומה היא בבעלות החברה.\n(ב) רכשה חברה ניירות ערך שניתן להמירם או לממשם במניות החברה, רשאית היא לבטלם; לא ביטלה החברה את ניירות הערך האמורים, רשאית החברה לחזור ולמכרם, או להמירם או לממשם למניות; מניות שהומרו או שמומשו כאמור, יהיו מניות רדומות כל עוד הן בבעלות החברה."},{"sec":"309","title":"רכישה בידי תאגיד בשליטה","law":"חוק החברות","text":"(א) חברה בת או תאגיד אחר בשליטת החברה האם (בסעיף זה – התאגיד הרוכש) רשאים לרכוש מניות של החברה האם או ניירות ערך שניתן להמירם או לממשם במניות החברה האם, באותו היקף שבו החברה האם רשאית לבצע חלוקה, ובלבד שהדירקטוריון של החברה הבת או מנהלי התאגיד הרוכש קבעו כי אם רכישת המניות או ניירות הערך שניתן להמירם או לממשם במניות, היתה מתבצעת בידי החברה האם, היתה הרכישה בגדר חלוקה מותרת.\n(ב) נרכשה מניה של חברה אם בידי חברה בת או בידי התאגיד הרוכש, לא תקנה המניה זכויות הצבעה, כל עוד המניה היא בבעלות החברה הבת או התאגיד הרוכש.\n(ג) בוצעה חלוקה אסורה, תתבצע ההשבה, כאמור בסעיף 310, לחברה הבת או לתאגיד הרוכש, והוראת סעיף 311 תחול, בשינויים המחויבים, על הדירקטורים בחברה הבת והמנהלים בתאגיד הרוכש; ואולם, אם קבע דירקטוריון החברה האם כי החלוקה מותרת תחול האחריות על הדירקטורים בחברה האם כאמור בסעיף 311.\n(ד) על אף הוראות סעיף קטן (א), רכישה בידי חברה בת או בידי התאגיד הרוכש שאינם בבעלות מלאה של החברה האם, היא חלוקה בסכום השווה למכפלת סכום הרכישה בשיעור הזכויות בהון החברה הבת או בהון התאגיד הרוכש המוחזקות בידי החברה האם."},{"sec":"309א","title":"רכישת ניירות ערך שניתן להמירם למניות","law":"חוק החברות","text":"לא תיחשב כחלוקה, רכישה של ניירות ערך שניתן להמירם למניות בגובה הסכום שהוצג בדוחות הכספיים המותאמים האחרונים, כהתחייבות, לזמן קצר או לזמן ארוך, בשל הניירות האמורים."},{"sec":"310","title":"תוצאות חלוקה אסורה","law":"חוק החברות","text":"(א) ביצעה חברה חלוקה אסורה, יהיה על בעל מניה להשיב לחברה את שקיבל, זולת אם לא ידע ולא היה עליו לדעת כי החלוקה שבוצעה אסורה.\n(ב) חזקה על בעל מניה בחברה ציבורית, שלא היה דירקטור, מנהל כללי או בעל השליטה בחברה במועד החלוקה, שלא ידע ולא היה עליו לדעת, כי חלוקה שבוצעה היא חלוקה אסורה."},{"sec":"311","title":"אחריות דירקטורים לחלוקה אסורה","law":"חוק החברות","text":"בוצעה בחברה חלוקה אסורה יראו כל מי שהיה דירקטור במועד החלוקה כמי שהפר בכך את חובותיו לפי סעיפים 252, 253 או 254, לפי הענין לחברה, אלא אם כן הוכיח אחד מאלה:\n(1) שהתנגד לחלוקה האסורה ונקט בכל האמצעים הסבירים כדי למנעה;\n(2) שהסתמך בתום לב הסתמכות סבירה על מידע שאלולא היה מטעה היתה החלוקת מותרת;\n(3) שבנסיבות הענין, לא ידע ולא היה עליו לדעת על החלוקה."},{"sec":"312","title":"ניירות ערך בני פדיון","law":"חוק החברות","text":"(א) על אף הוראות סעיף 302 רשאית חברה לכלול בתקנונה הוראה המתירה לה להנפיק ניירות ערך הניתנים לפדיון בתנאים שייקבעו בהוראה כאמור (להלן – ניירות ערך בני פדיון).\n(ב) הנפיקה חברה ניירות ערך בני פדיון רשאית היא לפדותם ולא יחולו על הפדיון המגבלות הקבועות בפרק זה.\n(ג) הנפיקה חברה ניירות ערך בני פדיון רשאית היא להצמיד להם מתכונותיהן של מניות, לרבות זכויות הצבעה וזכות השתתפות ברווחים.\n(ד) ניירות ערך בני פדיון לא ייחשבו כחלק מהונה העצמי של החברה, יהא כינוים אשר יהא, אלא אם כן הזכות לפדיונם הוגבלה למקרה של פירוק החברה לאחר פרעון כל התחייבויות החברה לנושיה בעת הפירוק; הוגבלה הזכות לפדיונם של ניירות הערך כאמור, יחולו, לענין חלוקה, הוראות חוק זה, על אף הוראות סעיף קטן (ב)."},{"sec":"350","title":"פשרה או הסדר – הוראות כלליות","law":"חוק החברות","text":"(א) הוצעו פשרה או הסדר בין חברה לבין נושיה או בעלי מניותיה, או בינה לבין סוג פלוני שבהם, שאינם הסדר חוב כהגדרתו בסעיף 318 לחוק חדלות פירעון ושיקום כלכלי או תכנית לשיקום כלכלי כהגדרתה בסעיף 4 לחוק האמור, רשאי בית המשפט, על פי בקשה של החברה או של בעל מניה, או של נאמן אם החברה היא בפירוק, להורות על כינוס אסיפות של אותם נושים או בעלי מניות, לפי הענין, בהתאם להוראות סעיף קטן (א1) ובדרך שיורה בית המשפט.\n(א1) אסיפות הנושים או בעלי המניות ייערכו בנפרד לכל סוג של נושים או בעלי מניות (בפרק זה – אסיפות סוג); לעניין זה, ”סוג“ – קבוצת נושים או בעלי מניות שלהם עניין משותף בנוגע להסדר או לפשרה, המובחן באופן מהותי מעניינם של שאר הנושים או בעלי המניות ואשר מצדיק קיום אסיפה נפרדת.\n(א2) נושה או בעל מניה יעשה שימוש בזכות ההצבעה באסיפת סוג בתום לב ובדרך מקובלת ויימנע מניצול לרעה של כוחו.\n(ב) (ג) (ד) (ה) (ו) (ז) (ח) (ט) אם בכל אסיפת סוג שכונסה לפי סעיף קטן (א) הסכימו לפשרה או להסדר רוב מספרם של המשתתפים בהצבעה למעט הנמנעים שבידם יחד שלושה רבעים של הערך המיוצג בהצבעה, ובית המשפט אישר את הפשרה או ההסדר, הרי הם מחייבים את החברה ואת כל הנושים או בעלי המניות או הסוג שבהם, לפי הענין, ואם היא בפירוק – גם את הנאמן.\n(ט1) בית המשפט שאישר פשרה או הסדר לפי סעיף קטן (ט) מוסמך לדון במחלוקת שהתגלעה בנוגע לפרשנות הפשרה או ההסדר לאחר אישורם או בנוגע ליישומם.\n(י) צו שניתן לפי סעיף קטן (ט) לא יהיה לו תוקף לפני שהוגש לרשם העתק מאושר שלו; העתק הצו יצורף לכל עותק של תקנון החברה שיוצא לאחר מתן הצו, ואם אין לחברה תקנון – לכל עותק של מסמך שעל פיו התאגדה החברה ושעל פיו היא פועלת, שיוצא כאמור.\n(יא) בפרק זה –\n(סוג=הגדרה)  ”חברה“ – לרבות חברת חוץ המנהלת עסקים או שיש לה נכסים, בישראל, גם אם לא נרשמה לפי סעיף 346;\n(סוג=הגדרה)  ”הסדר“ – לרבות ארגון מחדש של הון המניות בדרך של איחוד מניות מסוגים שונים או בדרך של חלוקת מניות לסוגים שונים, או בשתי הדרכים כאחת.\n(יב) השר רשאי לקבוע הוראות לענין ביצוע פרק זה, לרבות לעניין כינוס אסיפות וכן לענין סדרי דין, מינוי בעל תפקיד, הוראות בדבר שיפוי וביטוח לבעל תפקיד וקביעת סמכויותיו על ידי בית המשפט."},{"sec":"351","title":"שינוי מבנה ומיזוג","law":"חוק החברות","text":"(א) הוגשה לבית המשפט בקשה לאישור פשרה או הסדר כאמור בסעיף 350, והוכח לבית המשפט שהפשרה או ההסדר הוצעו לשם תכנית בדבר שינוי מבנה של חברה או מיזוגן של חברות, ושלפי התכנית יש להעביר מפעל או נכסים של אחת החברות (בפרק זה – החברה המעבירה) לחברה אחרת (בפרק זה – החברה הנעברת), רשאי בית המשפט, בצו המאשר את הבקשה או בצו שניתן לאחר מכן, להורות בדבר –\n(1) העברת המפעל, הנכסים או החיובים כולם או מקצתם של החברה המעבירה לחברה הנעברת;\n(2) הקצאה של מניות, איגרות חוב, פוליסות או טובות הנאה דומות אחרות שבחברה הנעברת, אשר היא חייבת להקצותן לאדם על פי ההסדר או הפשרה;\n(3) המשך מטעם החברה הנעברת או נגדה של הליך משפטי התלוי ועומד מטעם החברה המעבירה או נגדה;\n(4) חיסול החברה המעבירה ללא פירוק;\n(5) הסעד לאנשים המתנגדים לפשרה או להסדר בתוך הזמן ובדרך שיורה בית המשפט;\n(6) כל ענין שבשגרה הדרוש כדי להבטיח ששינוי המבנה או המיזוג יבוצע בשלמות וביעילות.\n(ב) ניתן צו כאמור להעברת נכסים או חיובים, יועברו הנכסים מכוח הצו ויוקנו לחברה הנעברת, וישוחררו, אם הורה על כך הצו, מכל שעבוד שפקע תקפו מכוח הפשרה או ההסדר, ואילו החיובים יועברו לחברה הנעברת ויהיו לחיוביה שלה.\n(ג) ניתן צו לפי סעיף זה, תעביר כל חברה שעליה חל הצו העתק מאושר שלו לרשם בתוך שבעה ימים מיום שניתן; חברה שהפרה הוראה זו, דינה ודין כל נושא משרה בה שאישר או התיר את ההפרה, קנס כאמור בסעיף 61(ג) לחוק העונשין, התשל״ז–1977 לכל יום שבו נמשכת ההפרה."},{"sec":"351א","title":"החלת ההוראות על חברת חוץ ותאגידים אחרים","law":"חוק החברות","text":"(א) הוראות פרק זה יחולו, בשינויים המחויבים, גם על חברת חוץ המנהלת עסקים או שיש לה נכסים, בישראל, גם אם לא נרשמה לפי הוראות סעיף 346.\n(ב) בלי לגרוע מהוראות סעיף קטן (א), רשאי השר, בצו, להחיל את הוראות פרק זה גם על תאגיד מסוים אחר."},{"sec":"351ב","title":"הגדרות – {{ח:פנימי","law":"חוק החברות","text":"|תיקון: תשפ״ד־2}}\n בפרק זה –\n ”התנגדות“ – התנגדות למחיקה, כמשמעותה בסעיף 351ה(ב);\n ”חברה“ – חברה פרטית שאינה חברת איגרות חוב;\n ”חוב“ – למעט חובות בשל אגרות או תשלומים אחרים שחברה חייבת בתשלומם לפי סעיף 44(6), או חובות שהרשם מצא כי ערכם הכולל נמוך באופן שאין בהם כדי למנוע את מחיקת החברה בהתאם לאמות מידה שיפרסם הרשם לפי הוראות סעיף 351ג(ג);\n ”נכס“ – למעט נכסים שהרשם מצא כי ערכם הכולל נמוך באופן שאין בהם כדי למנוע את מחיקת החברה בהתאם לאמות מידה שיפרסם הרשם לפי הוראות סעיף 351ג(ג)."},{"sec":"351ג","title":"מחיקת חברה","law":"חוק החברות","text":"(א) הרשם רשאי למחוק חברה ממרשמי הרשם בכפוף להוראות פרק זה אם מצא כי מתקיימים כל אלה:\n(1) היא אינה מנהלת עסקים או פעילות;\n(2) אין לה נכסים וחובות;\n(3) היא רשומה במשך שנה כחברה מפרה לפי הוראות סעיף 362א(ב);\n(4) במשך שלוש שנים היא לא שילמה אגרה שנתית לפי סעיפים 9(ב) ו־44(6) והפרה את חובתה להגיש דין וחשבון שנתי לפי סעיף 141;\n(5) נתוני החברה אינם כלולים במאגר הנתונים של רשות המסים בישראל או שתיק החברה ברשות המסים בישראל סגור.\n(ב) הוראות סעיף קטן (א) יחולו על חברה לתועלת הציבור, בשינויים אלה: המחיקה טעונה את הסכמת רשם ההקדשות, והוראות פסקה (3) שבאותו סעיף קטן – לא יחולו.\n(ג) הרשם יפרסם אמות מידה לעניין חובות ונכסים שערכם נמוך כאמור בהגדרות ”חוב“ ו”נכס“."},{"sec":"351ד","title":"בדיקות מקדימות","law":"חוק החברות","text":"(א) התקיימו לגבי חברה התנאים המנויים בפסקאות (3) ו־(4) שבסעיף 351ג(א), רשאי הרשם, לשם הפעלת סמכותו לפי סעיף 351ג, לדרוש על אותה חברה מידע שיש בו כדי להעיד אם מתקיימים לגביה יתר התנאים המנויים בסעיף 351ג(א); הרשם רשאי לדרוש מידע כאמור, מתאגיד בנקאי כהגדרתו בחוק הבנקאות (רישוי), התשמ״א–1981, ומגוף ציבורי כהגדרתו בסעיף 23 לחוק הגנת הפרטיות, התשמ״א–1981, ובכלל זה רשות המסים בישראל, רשם המקרקעין, רשות מקרקעי ישראל, רשות האכיפה והגבייה והמוסד לביטוח לאומי.\n(ב) השר רשאי לקבוע חובת דרישת מידע או חובה של הרשם לבצע בדיקות מקדימות נוספות טרם פרסום הודעה ושליחתה כאמור בסעיף 351ה(א), וכן רשאי השר לקבוע הוראות בדבר מסירת מידע בידי תאגיד בנקאי או גוף ציבורי כאמור בסעיף קטן (א) לרשם לשם ביצוע הבדיקות האמורות."},{"sec":"351ה","title":"הודעה והתנגדות לפני מחיקה","law":"חוק החברות","text":"(א) התקיימו לגבי חברה התנאים המנויים בפסקאות (3) עד (5) שבסעיף 351ג(א), והיה לרשם יסוד סביר להניח כי מתקיימים לגביה התנאים המנויים בפסקאות (1) ו־(2) שבאותו סעיף קטן, רשאי הוא לפרסם באתר האינטרנט של משרד המשפטים הודעה על כוונתו למחוק את החברה ממרשמי הרשם; בהודעה כאמור יצוין כי אם לא תוגש התנגדות לפי סעיפים קטנים (ב) ו־(ג), או אם תידחה התנגדות שהוגשה לפי סעיף קטן (ד), ימחק הרשם את החברה; פרסם הרשם הודעה לפי סעיף קטן זה, ישלח הודעה על כך לחברה.\n(ב) פורסמה הודעה כאמור בסעיף קטן (א), רשאי כל מי שעלול להיפגע ממחיקת החברה להגיש לרשם התנגדות למחיקה בתוך 90 ימים ממועד פרסומה.\n התנגדות תוגש לרשם בדרך של תקשורת אלקטרונית בהתאם לתקנות לפי סעיף 44(1) לעניין הגשה בדרך האמורה; ואולם הרשם רשאי לאפשר הגשת התנגדות שלא בדרך של תקשורת אלקטרונית.\n(2) התנגדות תכלול, בין השאר, את אלה:\n(א) פרטי החברה שבעניינה מוגשת ההתנגדות;\n(ב) פרטי מגיש ההתנגדות, ובכלל זה שמו, מספר הזהות שלו, מענו ומענו הדיגיטלי, וכן ציון זיקתו לחברה, אם ישנה;\n(ג) פירוט נימוקי ההתנגדות.\n(ד) הרשם רשאי לקבל התנגדות, וכן רשאי הוא לדחות התנגדות אם מצא כי על פניה היא אינה מגלה עילה שיש בה כדי לשלול את התקיימות התנאים שבסעיף 351ג(א), או שהיא בלתי מנומקת או נראית על פניה טורדנית או קנטרנית; הרשם ימסור למגיש ההתנגדות הודעה על החלטתו בהתנגדות.\n(ה) פרסם הרשם הודעה לפי סעיף קטן (א) ולא הוגשה התנגדות או שהוגשה התנגדות שנדחתה, וחלפו 90 ימים ממועד פרסום ההודעה, רשאי הרשם למחוק את החברה ממרשמי הרשם."},{"sec":"351ו","title":"נפקות המחיקה","law":"חוק החברות","text":"(א) ממועד שנמחקה חברה כאמור בסעיף 351ה(ה) (בפרק זה – מועד המחיקה) יראו את החברה כמחוסלת, אך אין בכך כדי לגרוע מאפשרות פירוקה מרצון לפי הוראות חלק שמיני א׳ או מסמכות בית המשפט לפרק אותה לפי כל דין.\n(ב) אין בחיסול חברה בעקבות מחיקתה כאמור בפרק זה כדי לגרוע מחבות בעל מניות או נושא משרה בה לפי סעיפים 192 ו־193 או 252 עד 254, לפי העניין, שהתגבשה לפני שהחברה נמחקה, ואם החברה המשיכה בפעילות באמצעות בעלי מניות או נושאי משרה בה למרות שנמחקה – אין בחיסול כאמור כדי לגרוע מחובותיהם לפי אותם סעיפים שהיו חלות לולא נמחקה החברה, והכול עד לחיסולה לאחר פירוק לפי כל דין.\n(ג) חוסלה חברה בעקבות מחיקתה כאמור בפרק זה, תמשיך לחול הוראת סעיף 362א(ג)(1)(ג)(2) לגבי מי שהיה בעל שליטה בה, כהגדרתו באותו סעיף, עד לחיסולה לאחר פירוק לפי כל דין."},{"sec":"351ז","title":"ביטול מחיקה בידי הרשם","law":"חוק החברות","text":"הרשם רשאי, בתוך שנה ממועד המחיקה, לבטל מיוזמתו מחיקה של חברה, אם טרם חוסלה לאחר פירוק, אם מצא כי במועד המחיקה לא התקיימו לגבי החברה התנאים המנויים בסעיף 351ג(א).\n(2) הרשם רשאי לבטל מחיקה של חברה, אם טרם חוסלה לאחר פירוק, לבקשת כל אדם המעוניין בדבר שנפגע מחיסולה בעקבות מחיקתה (בסעיף זה – המבקש), אם מצא כי במועד המחיקה לא התקיימו לגבי החברה התנאים המנויים בסעיף 351ג(א), ובלבד שהבקשה הוגשה בתוך שנה ממועד המחיקה; היה המבקש נושא משרה בחברה, או בעל מניה בחברה או יורשו, רשאי הרשם לדרוש כתנאי לביטול המחיקה תשלום אגרה שנתית לפי סעיף 9(ב) בעד השנה שבה הייתה החברה מחוקה, בהתחשב במטרה שלשמה התבקש ביטול המחיקה.\n(ב) עם ביטול מחיקת חברה כאמור בסעיף קטן (א), תוחזר החברה למרשמי הרשם, ויראו אותה כאילו המשיכה בעסקיה ובפעילותה וכאילו לא נמחקה ממרשמי הרשם.\n(ג) ראה הרשם כי לשם הכרעה בבקשה לפי סעיף קטן (א) יש צורך בבירור עובדתי או מתן הוראה כאמור בסעיף 351ח(א) רישה, לא יידרש לבקשה, ורשאי הוא לפנות לבית המשפט בבקשה לביטול המחיקה כאמור בסעיף 351ח, או להודיע למבקש שהוא אינו נדרש לבקשה וכי המבקש רשאי להגיש בקשה לביטול מחיקה בידי בית משפט לפי סעיף 351ח אף אם טרם חלפה שנה ממועד המחיקה.\n(ד) הרשם יודיע למבקש כאמור בסעיף קטן (ג) בתוך 60 ימים מיום הגשת הבקשה; לא עשה הרשם כן, רשאי המבקש לפנות לבית המשפט לפי הוראות סעיף 351ח אף אם טרם חלפה שנה ממועד המחיקה."},{"sec":"351ח","title":"ביטול מחיקה בידי בית משפט","law":"חוק החברות","text":"(א) בית המשפט המוסמך כאמור בסעיף 342ה רשאי, לבקשת הרשם או כל אדם המעוניין בדבר שנפגע מחיסול חברה בעקבות מחיקתה, להורות בצו על ביטול המחיקה ועל החזרת החברה למרשמי הרשם, ולתת כל הוראה שימצא לנכון כדי להעמיד את החברה וכל אדם אחר במצב קרוב ככל האפשר למצב שהיו בו אלמלא נמחקה החברה, אם התקיימו כל אלה:\n(1) הבקשה הוגשה לאחר שחלפה שנה ממועד המחיקה עד תום 20 שנים ממועד המחיקה, למעט אם אישר בית המשפט, מנימוקים מיוחדים שיירשמו, להגיש את הבקשה במועד מאוחר יותר, וכן אם הבקשה הוגשה בטרם חלפה שנה ממועד המחיקה בנסיבות כאמור בסעיף 351ז(ג);\n(2) החברה לא חוסלה לאחר פירוק כאמור בסעיף 351ו(א);\n(3) בית המשפט מצא כי במועד המחיקה לא התקיימו לגבי החברה התנאים המנויים בסעיף 351ג(א), או שמצא כי מטעמים אחרים צודק ונכון לקבל את הבקשה.\n(ב) במסגרת ההוראות שרשאי בית המשפט להורות לפי סעיף קטן (א), רשאי הוא, אם הנסיבות מצדיקות זאת, לתת הוראה לעניין תשלום אגרה שנתית בעד השנים שבהן החברה הייתה מחוקה, כולן או חלקן, ולעניין תשלום חוב אגרה שנתית שנוצר בשנים שלפני המחיקה, כולן או חלקן; הוראה כאמור תינתן בין השאר בהתחשב במטרה שלשמה התבקש ביטול המחיקה, בזהות המבקש ובזמן שחלף מאז המחיקה.\n(ג) על ביטול מחיקת חברה כאמור בסעיף קטן (א) יחולו הוראות סעיף 351ז(ב), בשינויים המחויבים."},{"sec":"1","title":"הגדרות","law":"חוק ניירות ערך","text":"בחוק זה –\n ”ניירות ערך“ – תעודות המונפקות בסדרות על־ידי חברה, אגודה שיתופית או כל תאגיד אחר ומקנות זכות חברות או השתתפות בהם או תביעה מהם, ותעודות המקנות זכות לרכוש ניירות ערך, והכל בין אם הן על שם ובין אם הן למוכ״ז, למעט ניירות ערך המונפקים בידי הממשלה או בידי בנק ישראל, שנתקיים בהם אחד מאלה:\n(1) הם אינם מקנים זכות השתתפות או חברות בתאגיד ואינם ניתנים להמרה או למימוש בניירות ערך המקנים זכות כאמור;\n(2) הם מונפקים לפי חיקוק מיוחד;\n ”ניירות ערך מסחריים“ – ניירות ערך המונפקים בידי תאגיד, שהם התחייבות התאגיד לשלם למחזיק סכום כסף, במועד שאינו מאוחר מתום שנה מיום ההצעה (בהגדרה זו – תקופת הפירעון), ואם הוארכה תקופת הפירעון לפי סעיף 23ב – במועד שאינו מאוחר מתום התקופה שהוארכה כאמור, ואשר אינם ניתנים למימוש או להמרה לניירות ערך אחרים;\n ”חברה“ – לרבות חברה נכרית כמשמעותה בפקודת החברות;\n ”חברה־בת“ – חברה אשר חברה אחרת מחזיקה בחמישים אחוזים או יותר מן הערך הנקוב של הון־המניות המוצא שלה או מכוח ההצבעה שבה או רשאית למנות מחצית או יותר מהדירקטורים או את המנהל הכללי שלה;\n ”חברה מסונפת“ – חברה, אשר חברה אחרת – שאינה חברה־אם שלה – מחזיקה בעשרים וחמישה אחוזים או יותר מן הערך הנקוב של הון המניות המונפק שלה או מכוח ההצבעה בה, או רשאית למנות עשרים וחמישה אחוזים או יותר מהדירקטורים שלה;\n ”חברה קשורה“ – חברה מסונפת וכן חברה, אשר חברה אחרת – שאינה חברה־אם שלה – השקיעה בה סכום השווה לעשרים וחמישה אחוזים או יותר מההון העצמי של החברה האחרת, בין במניות ובין בדרך אחרת, למעט הלוואה הניתנת בדרך העסקים הרגילה;\n ”חברת רישומים“ – חברה שעיסוקה היחיד הוא החזקת ניירות ערך לרבות יחידות של קרן סגורה כמשמעותן בחוק להשקעות משותפות בעד אחרים וכן כל תאגיד אחר שקבע שר האוצר בהתייעצות עם הרשות;\n \n ”מנהל“, לענין חברה – כמשמעותו בפקודת החברות; ולענין אגודה שיתופית או תאגיד אחר – מי שממלא באגודה או בתאגיד תפקיד מקביל לתפקידו של מנהל בחברה;\n ”מנהל כספי אחרים“ – כל אחד מאלה:\n(1) מנהל קרן כמשמעותו בסעיף 4 לחוק להשקעות משותפות, המבצע פעולה בניירות ערך בעבור קרנות שבניהולו בהתאם להוראות החוק האמור;\n(2) חברה מנהלת כהגדרתה בחוק הפיקוח על קופות גמל, המבצעת פעולה בניירות ערך בעבור עמיתי קופת גמל שבניהולה;\n(3) מבטח כהגדרתו בחוק הפיקוח על הביטוח המשקיע כספים לכיסוי התחייבויות תלויות תשואה כהגדרתן בחוק האמור;\n(4) תאגיד הפועל מחוץ לישראל, שהוא בעל מאפיינים דומים לאלה של מי מהמנויים בפסקאות (1) עד (3), ובלבד שניתן אישור לכך מגורם מוסמך במדינה שבה הוא פועל;\n ”רשם“, לענין חברה ותאגיד אחר – רשם החברות, אולם לענין אגודה שיתופית – רשם האגודות השיתופיות;\n ”מנפיק“ – מי שמנפיק או הנפיק את ניירות הערך המוצעים לציבור;\n ”מסלקה“ – כהגדרתה בסעיף 44לא;\n ”מציע“ – מי שמציע ניירות ערך לציבור;\n ”הצעה לציבור“ – פעולה המיועדת להניע ציבור לרכוש ניירות ערך; בלי לגרוע מכלליות האמור, גם אלה:\n(1) רישום ניירות ערך למסחר בבורסה;\n(2) פניה לציבור להציע הצעות לרכישת ניירות ערך;\n ”הודעה משלימה“ – הודעה בהתאם לסעיף 16(א1)(2);\n ”הצעה בדרך של זכויות“ – הצעה של המנפיק לבעלי ניירות ערך שלו או לבעלי סוג ניירות ערך שלו לרכוש ניירות ערך נוספים שלו;\n ”התחייבות חיתומית“ – התחייבות לרכוש ניירות ערך המוצעים על פי תשקיף אם לא ירכוש אותם הציבור או התחייבות לרכוש ניירות ערך המוצעים על פי תשקיף כדי למכור אותם לציבור;\n ”חתם“ – מי שהתחייב בהתחייבות חיתומית;\n ”חתם מתמחר“ – חתם אשר נוטל חלק בקביעת המחיר שבו יוצעו ניירות הערך על פי התשקיף;\n ”מכירה“ – מכירה של ניירות ערך, לרבות הנפקתם;\n ”מפיץ“ – מי שלא התחייב בהתחייבות חיתומית על פי התשקיף, אך התחייב לפעול כדי למכור את ניירות הערך המוצעים, כולם או חלקם, בתמורה לעמלת הפצה;\n ”רכישת ניירות ערך“ – לרבות רכישה דרך הקצאה שעה שהניירות מונפקים לראשונה;\n ”החזקה“ ו”רכישה“, לענין ניירות ערך או כוח הצבעה וכיוצא באלה – בין לבד ובין ביחד עם אחרים, בין במישרין ובין בעקיפין, באמצעות נאמן, חברת נאמנות, חברת רישומים או בכל דרך אחרת; כשמדובר בהחזקה או ברכישה בידי חברה – גם בידי חברה בת שלה או חברה קשורה שלה במשמע, וכשמדובר בהחזקה או ברכישה בידי יחיד – יראו יחיד ובני משפחתו הגרים עמו, או שפרנסת האחד על האחר, כאדם אחד;\n ”החזקת ניירות ערך או רכישתם ביחד עם אחרים“ – החזקת ניירות ערך או רכישתם בשיתוף פעולה בין שניים או יותר לפי הסכם, בין בכתב ובין בעל פה; בלי לפגוע בכלליות האמור יראו לכאורה כמחזיקים בניירות ערך או כרוכשים אותם ביחד –\n(1) תאגיד המחזיק או הרוכש ניירות ערך (בהגדרה זו – תאגיד) יחד עם בעל ענין בו או עם חברה קשורה שלו;\n(2) (3) (4) אדם שעיסוקו הוא החזקת ניירות ערך או מסחר בהם בעד הזולת, יחד עם לקוחו או עם בן משפחה שלו שאינו גר עמו ואין פרנסת האחד על האחר, שבעדו הוא מחזיק בניירות הערך ומנהלם לפי יפוי כוח המקנה שיקול דעת לענין השימוש בזכות ההצבעה;\n ”בן משפחה“ – בן זוג וכן אח, הורה, הורה הורה, צאצא או צאצא של בן הזוג, או בן זוגו של כל אחד מאלה;\n ”שליטה“ – היכולת לכוון את פעילותו של תאגיד, למעט יכולת הנובעת רק ממילוי תפקיד של דירקטור או משרה אחרת בתאגיד, וחזקה על אדם שהוא שולט בתאגיד אם הוא מחזיק מחצית או יותר מסוג מסויים של אמצעי השליטה בתאגיד;\n ”אמצעי שליטה“, בתאגיד – כל אחד מאלה:\n(1) זכות ההצבעה באסיפה כללית של חברה או בגוף מקביל של תאגיד אחר;\n(2) הזכות למנות דירקטורים של התאגיד או את מנהלו הכללי;\n ”הון עצמי“, של תאגיד – הון התאגיד כמשמעותו לפי כללי חשבונאות מקובלים החלים על התאגיד, ואם לפי כללים אלה כולל הון התאגיד גם את החלק המיוחס לזכויות שאינן מקנות שליטה – בניכוי זכויות אלה;\n ”החלק המיוחס לזכויות שאינן מקנות שליטה“ – כמשמעותו בתקנים ובפרשנויות שאומצו בידי הוועדה לתקני חשבונאות בין־לאומיים (IASB International Accounting Standard Board);\n ”בעל ענין“, בתאגיד –\n(1) מי שמחזיק בחמישה אחוזים או יותר מהון המניות המונפק של התאגיד או מכוח ההצבעה בו, מי שרשאי למנות דירקטור אחד או יותר מהדירקטורים של התאגיד או את מנהלו הכללי, מי שמכהן כדירקטור של התאגיד או כמנהלו הכללי, או תאגיד שאדם כאמור מחזיק עשרים וחמישה אחוזים או יותר מהון המניות המונפק שלו או מכוח ההצבעה בו או רשאי למנות עשרים וחמישה אחוזים או יותר מהדירקטורים שלו; לענין פסקה זו –\n(א) יראו מנהל קרן להשקעות משותפות בנאמנות כמחזיק בניירות הערך הכלולים בנכסי הקרן;\n(ב) החזיק אדם בניירות ערך באמצעות נאמן, יראו גם את הנאמן כמחזיק בניירות הערך האמורים; לענין זה, ”נאמן“ – למעט חברת רישומים ולמעט מי שמחזיק בניירות ערך רק מכוח תפקידו כנאמן להסדר כמשמעותו לפי סעיף 46(א)(2)(ו) או כנאמן, להקצאת מניות לעובדים, כהגדרתו בסעיף 102 לפקודת מס הכנסה;\n(2) חברה בת של תאגיד, למעט חברת רישומים;\n ”דו״חות כספיים“ – מאזן, דו״ח ריווח והפסד ודו״חות אחרים שנקבעו בתקנות;\n ”פרט מטעה“ – לרבות דבר העלול להטעות משקיע סביר וכל דבר חסר שהעדרו עלול להטעות משקיע סביר;\n ”תאגיד בנקאי“ – כמשמעותו בחוק הבנקאות (רישוי), התשמ״א–1981;\n ”בורסה“ – כהגדרתה בסעיף 44לא;\n ”בורסה בחו״ל“ – חברה המנהלת מערכת למסחר בניירות ערך כהגדרתה בסעיף 44לא, שוק מוסדר או רשימת מסחר בכל אחד מהם, שאינם בישראל, המנויים בתוספת השניה או השלישית;\n ”חבר בורסה“ – מי שהוא חבר הבורסה בהתאם לתקנון הבורסה כמשמעותו בסעיף 46;\n ”חברת תשלומים“ – כהגדרתה בחוק הסדרת העיסוק בשירותי תשלום;\n ”בעל רישיון ייזום בסיסי“ – מי שבידו רישיון ייזום בסיסי כהגדרתו בחוק הסדרת העיסוק בשירותי תשלום;\n ”שוק מוסדר“ – מערכת שבאמצעותה מתנהל מסחר בניירות ערך, באופציות או בחוזים עתידיים, על פי כללים שנקבעו על ידי מי שרשאי לקבעם במדינה שבה הוא מתנהל, ואם המסחר מתנהל ביותר ממדינה אחת – על ידי מי שרשאי לקבעם באחת מן המדינות שבהן הוא מתנהל;\n ”תאגיד חוץ“ – תאגיד שהואגד בישראל וניירות ערך שלו רשומים למסחר בבורסה בחו״ל;\n ”הדין הזר“ – הדין החל על תאגיד חוץ בשל רישום ניירות ערך שלו למסחר בבורסה בחו״ל, לרבות כללי אותה הבורסה בחו״ל;\n ”תאגיד“ – \n ”חוק להשקעות משותפות“ – חוק השקעות משותפות בנאמנות, התשנ״ד–1994;\n ”תאגיד מדווח“ – תאגיד שהוראות סעיף 36 חלות עליו ולא ניתן לו פטור מתחולתן;\n ”גורם מאשר“, ”חתימה אלקטרונית“, ”חתימה אלקטרונית מאובטחת“ ו”מסר אלקטרוני“ – כהגדרתם בחוק חתימה אלקטרונית;\n ”דיווח אלקטרוני“ – הגשת מסמך לרשות באמצעות מסר אלקטרוני חתום בחתימה אלקטרונית, ניתן לשמירה אלקטרונית ולהפקה כפלט;\n ”אישור הגעה אלקטרוני“ – אישור החתום בחתימה אלקטרונית מאובטחת, בדבר הגעתו של מסר אלקטרוני שנשלח אל תיבת דואר אלקטרוני מאובטח;\n ”מנגנון הזדהות מאובטח“ – מנגנון המשלב אמצעי חומרה ותוכנה, הניתן לשליטתו הבלעדית של בעליו, והמאפשר את זיהוי בעליו באופן ייחודי;\n ”מסר אלקטרוני מאושר“ – \n ”מערכת דואר אלקטרוני מאובטח“ – מערכת המשמשת להעברת מסרים אלקטרוניים, שמתקיימים בה כל אלה:\n(1) היא מספקת לשולח אישור הגעה אלקטרוני;\n(2) היא מאפשרת גישה לתיבת דואר אלקטרוני מאובטח במערכת, רק באמצעות מנגנון הזדהות מאובטח;\n(3) היא נוקטת, באורח סדיר, אמצעי הגנה סבירים מפני חדירה אליה ומפני שיבוש עבודתה, לצורך הבטחת מהימנות המידע שבה;\n ”תיבת דואר אלקטרוני מאובטח“ – תיבת דואר אלקטרוני במערכת דואר אלקטרוני מאובטח;\n ”מחשב“, ”חומר מחשב“ ו”פלט“ – כהגדרתם בחוק המחשבים, התשנ״ה–1995;\n ”חוק חתימה אלקטרונית“ – חוק חתימה אלקטרונית, התשס״א–2001;\n ”חוק החברות“ – חוק החברות, התשנ״ט–1999;\n ”חוק חדלות פירעון ושיקום כלכלי“ – חוק חדלות פירעון ושיקום כלכלי, התשע״ח–2018;\n ”חוק הייעוץ“ – חוק הסדרת העיסוק בייעוץ השקעות ובניהול תיקי השקעות, התשנ״ה–1995;\n ”חוק איסור הלבנת הון“ – חוק איסור הלבנת הון, התש״ס–2000;\n ”חוק הסדרת העיסוק בשירותי תשלום“ – חוק הסדרת העיסוק בשירותי תשלום וייזום תשלום, התשפ״ג–2023;\n ”חוק המעצרים“ – חוק סדר הדין הפלילי (סמכויות אכיפה – מעצרים), התשנ״ו–1996;\n ”חוק העונשין“ – חוק העונשין, התשל״ז–1977;\n ”חוק הפיקוח על הביטוח“ – חוק הפיקוח על שירותים פיננסיים (ביטוח), התשמ״א–1981;\n ”חוק הפיקוח על קופות גמל“ – חוק הפיקוח על שירותים פיננסיים (קופות גמל), התשס״ה–2005;\n ”חוק שירות מידע פיננסי“ – חוק שירות מידע פיננסי, התשפ״ב–2021;\n ”חוקר“ – מי שמונה לפי סעיף 56א2(א);\n ”חוקר בכיר“ – מי שמונה לפי סעיף 56א2(ב);\n ”חפץ“ – כהגדרתו בפקודת מעצר וחיפוש;\n ”משרדי הרשות“ – מקום שיושב ראש הרשות הכריז עליו, בהודעה שפורסמה ברשומות, כמשרדי הרשות;\n ”נושא משרה“ – כהגדרתו בחוק החברות;\n ”נושא משרה בכירה“ – כהגדרתו בסעיף 37(ד);\n ”גורם מפוקח“ – כל אחד מהגורמים המפורטים להלן, וכן בעל שליטה, דירקטור ונושא משרה בכירה בכל אחד מהם:\n(1) תאגיד מדווח;\n(2) תאגיד המציע ניירות ערך שלו לציבור;\n(3) נאמן לתעודות התחייבות, כמשמעותו בפרק ה׳1;\n(4) חתם;\n(5) מפיץ;\n(5א) רכז הצעה כמשמעותו בסעיף 15ב(4א)(א);\n(6) בורסה וחבר בורסה;\n(7) מסלקה וחבר מסלקה כהגדרתו בסעיף 50א;\n(8) חברה בעלת רישיון זירה כמשמעותה בפרק ז׳3 וכן מי שמציע בזירת סוחר מסחר במכשיר פיננסי בניגוד להוראות סעיף 44יב1 או מי שמנהל זירת סוחר בניגוד להוראות סעיף 44יד1;\n(9) בעל רישיון לפי חוק הייעוץ;\n(10) מנהל קרן ונאמן כמשמעותם בסעיף 4 לחוק השקעות משותפות;\n(11) משקיע המנוי בפרט (2) או (3) לתוספת הראשונה;\n(11א) בעל רישיון למתן שירות מידע פיננסי לפי חוק שירות מידע פיננסי;\n(11ב) חברת תשלומים;\n(11ג) בעל רישיון ייזום בסיסי;\n(12) תאגיד בנקאי ותאגיד עזר כמשמעותם בחוק הבנקאות (רישוי), התשמ״א–1981, למעט חברת שירותים משותפת;\n(13) מי שמבצע את הפעולות שאותן רשאי לבצע גורם מהגורמים המנויים בפסקאות (1) עד (12), אף שהוא אינו רשאי לבצען;\n(14) מי שעוסק בייעוץ השקעות, בשיווק השקעות או בניהול תיקי השקעות אשר אינו טעון רישיון לפי סעיף 3 לחוק הייעוץ;\n ”עבירת ניירות ערך“ – עבירה כמפורט להלן:\n(1) עבירה לפי חוק זה;\n(2) (3) עבירה לפי סעיפים 284, 290, 291, 415, 423, 424, 424א ו־425 לחוק העונשין, שנעברה בקשר לעבירה לפי פסקאות (1) או (6);\n(4) עבירה לפי סעיפים 3 ו־4 לחוק איסור הלבנת הון, שנעברה בקשר לעבירה לפי פסקאות (1), (3) או (6);\n(5) עבירה לפי סעיפים 240, 242, 244, 245 ו־246 לחוק העונשין, שנעברה בקשר לחקירה או להליך שיפוטי בשל עבירה לפי פסקאות (1), (3), (4) או (6);\n(6) עבירה לפי כל חיקוק אחר ששר המשפטים והשר לביטחון הפנים קבעו בצו, באישור ועדת החוקה חוק ומשפט של הכנסת;\n ”פקודת הפרוצדורה הפלילית“ – פקודת הפרוצדורה הפלילית (עדות);\n ”פקודת מעצר וחיפוש“ – פקודת סדר הדין הפלילי (מעצר וחיפוש) [נוסח חדש], התשכ״ט–1969."},{"sec":"15","title":"הצעה ומכירה לציבור","law":"חוק ניירות ערך","text":"(א) לא יעשה אדם הצעה לציבור אלא על פי תשקיף שהרשות התירה את פרסומו או על פי טיוטת תשקיף שאושרה ונחתמה כאמור בסעיף 22 והוגשה לרשות.\n(ב) לא יעשה אדם מכירה לציבור אלא על פי תשקיף שהרשות התירה את פרסומו."},{"sec":"15א","title":"פעולות שאינן הצעה או מכירה לציבור","law":"חוק ניירות ערך","text":"(א) לא יראו כהצעה או כמכירה לציבור –\n(1) הצעה או מכירה למשקיעים שמספרם אינו עולה על מספר שייקבע בתקנות, ובלבד שמספר המשקיעים שלהם ימכור המציע ניירות ערך בהצעה או במכירה כאמור, בצירוף מספר המשקיעים שלהם מכר ניירות ערך במהלך שנים עשר החודשים שקדמו לאותה הצעה או מכירה, לא יעלה על המספר שנקבע; לענין זה יימנו בנפרד משקיעים שרכשו מניות וניירות ערך הניתנים למימוש או להמרה למניות, ומשקיעים שרכשו ניירות ערך אחרים;\n \n(2) הקצאה של מניות הטבה שאין בה ברירה לזכאים; לענין זה, ”מניות הטבה“ – מניות שחברה מקצה בלא תמורה לכל המחזיקים בניירות הערך שלה אשר זכאים למניות הטבה, לפי יחס החזקותיהם בניירות הערך ביום שקבעה לכך החברה, ובלבד שאותו יום יהיה מאוחר מיום מתן ההודעה על ההחלטה להקצות את המניות;\n(3) הקצאה או העברה של ניירות ערך לבעלי ניירות ערך של תאגיד, כולם או חלקם, על פי פסק דין או צו של בית משפט, שניתנו בתובענה ייצוגית כמשמעותה בחוק החברות, או הקצאה או העברה של ניירות ערך על פי החלטה שניתנה בהליך לפי חוק חדלות פירעון ושיקום כלכלי או בהליך לפי הפרק השלישי לחלק התשיעי לחוק החברות, והכל לאחר שניתנה לרשות הזדמנות להתייצב בהליך ולהשמיע את עמדתה לענין הצורך בפרסום תשקיף על מנת להבטיח את ענינו של ציבור הניצעים המיועד;\n(4) פרסום כללי בדבר כוונה להציע ניירות ערך, שאינו כולל נתונים כספיים ואת פרטי ההצעה, לרבות מחיר, ריבית ותשואה, ובלבד שניירות הערך יוצעו ויימכרו רק למשקיעים שמספרם אינו עולה על המספר הקבוע בתקנות לעניין פסקה (1) או למשקיעים כאמור בפסקה (7), ושבפרסום תצוין המגבלה על הצעה ומכירה של ניירות הערך בנוגע לזהות המשקיעים או למספרם כאמור;\n(4א) הצעה של מפרק, כונס נכסים או ממונה אחר שמינו רשות מינהלית או בית משפט למכור ניירות ערך למשקיעים שמספרם אינו עולה על המספר הקבוע בתקנות לעניין פסקה (1) או למשקיעים כאמור בפסקה (7), שייבחרו בהליך שהודיע עליו המפרסם, ובלבד שבהצעה תצוין המגבלה על הצעה ומכירה של ניירות הערך בנוגע לזהות המשקיעים או למספרם כאמור;\n(5) משא ומתן בין מציע לבין אדם השוקל להתחייב בהתחייבות חיתומית, ובלבד שמתקיימים באותו אדם תנאי הכשירות לפי סעיף 56(ג);\n(6) מתן הסברים, באסיפה של עובדי תאגיד או של עובדי תאגיד הנשלט בידי תאגיד כאמור או השולט בו, בקשר לפרטי הצעת ניירות ערך של התאגיד לעובדים כאמור, ובלבד שלא יינתן מידע אודות תאגיד מדווח שלא פורסם עד מועד האסיפה בתשקיף של התאגיד או בדוח שהוגש לפי פרק ו׳; באסיפה יירשם פרוטוקול שיועמד לרשות העובדים;\n(7) הצעה או מכירה למשקיעים שהם אחד מהמפורטים בסעיף קטן (ב).\n(ב) במנין המשקיעים לענין סעיף קטן (א) לא יובאו בחשבון כל אלה:\n(1) משקיע הנמנה עם סוג שנקבע בתוספת הראשונה; שר האוצר, בהתייעצות עם הרשות ובאישור ועדת הכספים של הכנסת, רשאי להוסיף לתוספת הראשונה או לגרוע ממנה;\n(2) משקיע שהתאגד מחוץ לישראל, אם סברה הרשות כי בידו היכולת לקבל את המידע הדרוש לו לשם קבלת החלטה להשקיע בניירות ערך ואשר היה נכלל בתשקיף, אילו פורסם;\n(3) בעל שליטה, מנהל כללי או דירקטור בתאגיד שניירות ערך שלו מוצעים, או תאגיד בשליטת התאגיד שניירות ערך שלו מוצעים."},{"sec":"16","title":"תשקיף","law":"חוק ניירות ערך","text":"(א) תשקיף יכלול כל פרט העשוי להיות חשוב למשקיע סביר השוקל רכישת ניירות הערך המוצעים על פיו וכל פרט ששר האוצר קבע בתקנות לפי סעיף 17.\n בהצעה שאינה הצעה בדרך של זכויות ניתן –\n(א) שלא לכלול בתשקיף פרטים לגבי חתם ומפיץ כמפורט בתקנות לפי סעיף 17ד(א)(2) וכל פרט המתחייב מהם;\n(ב) לשנות, לאחר פרסום התשקיף ולפני תחילת התקופה להגשת הזמנות, את תנאי ניירות הערך המוצעים לרבות מחירם וכמותם, לעומת אלה הנקובים בתשקיף, וכן כל פרט נוסף בתשקיף אשר ישתנה כתוצאה מהשינוי האמור, כמפורט בתקנות לפי סעיף 17ד(א)(2), ובלבד שהיקף השינוי לא יעלה על מה שיקבע השר בתקנות לפי סעיף 17ד(א)(3).\n(2) פרטים שלא נכללו בתשקיף או ששונו בו כאמור בפסקה (1), ייכללו בהודעה משלימה שיפרסם המציע באופן ובמועד שיקבע השר לפי סעיף 17ד(א)(2) וייחשבו, ממועד פרסומם, לחלק בלתי נפרד מהתשקיף.\n(ב)"},{"sec":"17","title":"תקנות בדבר פרטים בטיוטת תשקיף ובתשקיף","law":"חוק ניירות ערך","text":"(א) שר האוצר יתקין, לפי הצעת הרשות או לאחר התייעצות עמה ובאישור ועדת הכספים של הכנסת, תקנות בדבר הפרטים שיש לכלול בטיוטת תשקיף ובתשקיף, ובדבר המבנה שלהם וצורתם.\n(ב) תקנות לפי סעיף זה יכול שיתייחסו, בין השאר, לעניינים אלה:\n(1) דו״חות כספיים של המנפיק, של חברות־בנות שלו ושל חברות קשורות שלו, מידת פירוטם ועקרונות חשבונאיים לעריכתם;\n(2) נושאים ופרטים שאליהם תתייחס חוות דעתו של רואה חשבון על הדו״חות האמורים בפסקה (1) וצורת חוות הדעת;\n(3) חוות דעת של עורך דין בנושאים שענינם הנפקת ניירות הערך והצעתם, לרבות סמכות המנפיק והמציע להנפיקם ולהציעם בצורה המוצעת, וכן בכל ענין משפטי אחר, והכל כפי שנקבע בתקנות;\n(4) אישור של עורך דין על קבלת ההיתרים הדרושים לפי דין להצעת ניירות הערך לציבור;\n(5) פרטים על בעל ענין במנפיק ותיאור התקשרויותיו עם המנפיק;\n(6) מחיר ניירות הערך המוצעים; לענין זה, ”מחיר“ – לרבות טווח מחירים.\n(ג) בעל ענין חייב למסור למנפיק את הפרטים הדרושים למנפיק כדי למלא את חובותיו לפי תקנות שהותקנו לפי סעיף קטן (ב)(5).\n(ד) שר האוצר רשאי להתקין תקנות לפי סעיף זה דרך כלל או לסוגים של ניירות ערך, של מנפיקים, של מציעים או של הצעות לציבור, או לפי כל סיווג אחר."},{"sec":"21","title":"היתר לפרסום התשקיף","law":"חוק ניירות ערך","text":"(א) הרשות תיתן היתר לפרסום תשקיף אם נחה דעתה כי נתקיימו בטיוטת התשקיף הוראות חוק זה ודרישות הרשות על פיו, וניתנו כל ההיתרים על פי דין שיש לקבל לפני פרסום התשקיף; הרשות רשאית להניח דעתה כאמור על ידי נקיטת נוהל הבדיקה שנראה לה מתאים מבין נהלי הבדיקה שנקבעו לפי סעיף 20א.\n(ב) אין בהיתר משום אימות הפרטים המובאים בתשקיף או אישור מהימנותם או שלמותם של פרטים אלה או הבעת דעה על טיבם של ניירות הערך המוצעים.\n(ג) התשקיף יעתיק את תוכן ההוראה שבסעיף קטן (ב)."},{"sec":"22","title":"אישור טיוטת התשקיף והתשקיף, והחתימה עליהם","law":"חוק ניירות ערך","text":"(א) טיוטת התשקיף המוגשת לראשונה לרשות וטיוטת תשקיף אשר על פיה יוצעו ניירות ערך לציבור יאושרו בידי הדירקטוריון של המנפיק וייחתמו בידי המנפיק; הוצעו ניירות הערך שלא בידי המנפיק, יחתום על הטיוטות האמורות גם המציע.\n(ב) על התשקיף יחתמו המנפיק וכן רוב חברי הדירקטוריון ובהם לפחות אחד שהוא דירקטור מקרב הציבור, ובחברה המציעה לראשונה ניירות ערך לציבור – לפחות דירקטור אחד שאינו בעל ענין בה אלא מכוח היותו דירקטור; חתימת דירקטור תיעשה בידו או בידי אדם שהוא הרשה אותו בכתב לחתום במקומו על אותו תשקיף; בסעיף זה, ”דירקטור מקרב הציבור“ – כמשמעותו בסימן ב׳ לפרק ד׳ לפקודת החברות [נוסח חדש], התשמ״ג–1983.\n(ג) היה חתם להצעה, יחתום גם הוא על התשקיף.\n(ד) הוצעו ניירות הערך שלא בידי המנפיק, יחתום על התשקיף גם המציע.\n(ד1) על הודעה משלימה יחתום המנפיק; הוצעו ניירות הערך שלא בידי המנפיק, יחתום על ההודעה המשלימה גם המציע; היה חתם להצעה – יחתום על ההודעה המשלימה גם הוא; עם חתימתו יראו אותו לכל דבר וענין כמי שחתם על התשקיף והוא יאשר בחתימתו האמורה כי דין זה ידוע לו.\n(ה) התנגד דירקטור להוצאת תשקיף או סירב לחתום על תשקיף, והביא את הדבר לידיעת הרשות בהודעה מנומקת בכתב, רשאית הרשות לעכב את פרסום התשקיף אם ראתה שקיימת עילה שהיתה מאפשרת התערבות בית המשפט אילו הובא הדבר לפניו; העיכוב יהיה לעשרה ימים מיום החלטת הרשות אלא אם כן הורה בית המשפט אחרת.\n(ו) הודעה בדבר פתיחת הליך לפי סעיף קטן (ה) תומצא לרשות והרשות רשאית להתייצב באותו הליך ולהשמיע את דברה."},{"sec":"23","title":"תאריך התשקיף ופרסומו","law":"חוק ניירות ערך","text":"(א) תשקיף שפרסומו הותר, יפורסם באמצעות דיווח אלקטרוני לפי סעיף 44ב, בתוך שבעה ימים מיום מתן ההיתר; התשקיף יישא את תאריך פרסומו (בחוק זה – תאריך התשקיף או תאריך פרסום התשקיף).\n(א1) תאריך פרסום התשקיף יהיה היום שבו התשקיף דווח אלקטרונית כאמור בסעיף קטן (א), אם הדיווח האלקטרוני נעשה עד השעה 09:30, ואם נעשה לאחר מכן – היום שלמחרת הדיווח.\n(ב) על אף הוראות סעיף קטן (א1), פורסמה הודעה משלימה, ייחשב תאריך פרסומה כתאריך פרסום התשקיף.\n(ג) לא יאוחר מיום העסקים הראשון לאחר תאריך התשקיף, על המציע –\n(1) בהצעה לציבור שבעקבותיה יהפוך התאגיד לתאגיד מדווח – להגיש לרשם עותק מהתשקיף והעתק מההיתר לפרסומו, ואם התשקיף מכיל הצעה של ניירות ערך שלגביהם נחתם שטר נאמנות – גם את שטר הנאמנות;\n(2) לפרסם הודעה בעיתון לפי סעיף 55ב, על הגשת המסמכים האמורים בפסקה (1).\n(ד)"},{"sec":"24","title":"התקופה להגשת הזמנות","law":"חוק ניירות ערך","text":"(א) התקופה להגשת הזמנות לניירות הערך המוצעים בתשקיף (בחוק זה – הזמנות) תיקבע בתשקיף, ובלבד שמועד תחילתה לא יהיה מוקדם ומועד סיומה לא יהיה מאוחר מהמועדים שנקבעו לכך בסעיפים קטנים (ב) או (ג), לפי הענין.\n(ב) שר האוצר, לפי הצעת הרשות או לאחר התייעצות עמה, ובאישור ועדת הכספים של הכנסת, יקבע את כל אלה:\n(1) מועד תחילתה של התקופה להגשת הזמנות, ובלבד שהוא יהיה לאחר מועד פרסום התשקיף;\n(2) מועד סיומה של התקופה להגשת הזמנות, ובלבד שלא יהיה מאוחר מ־45 ימים ממועד תחילתה;\n בתקנות לפי סעיף קטן זה רשאי שר האוצר לקבוע מועדים שונים לסוגים שונים של ניירות ערך, דרכי הצעה או תשקיפים.\n \n(ג) הרשות רשאית להקדים את מועד תחילתה של התקופה שנקבעה בתקנות לפי סעיף קטן (ב), לענין הגשת הזמנה, ובלבד שיהיה לאחר מועד פרסום התשקיף וכן רשאית לדחות את מועד סיומה של התקופה האמורה, ובלבד שלא יהיה מאוחר משישה חודשים ממועד תחילתה; הרשות רשאית להקדים או לדחות מועדים לפי סעיף קטן זה בתנאים שתמצא לנכון.\n(ד) המציע לא יקבל הזמנות לפני תחילת התקופה להגשתן או לאחר סיומה.\n(ה) על אף הוראות סעיף קטן (א) רישה, בהצעה על פי תשקיף מדף, רשאי המציע לקבוע את התקופה להגשת הזמנות בדוח הצעת מדף."},{"sec":"25","title":"תיקון תשקיף במקרים מיוחדים","law":"חוק ניירות ערך","text":"(א) נוכחה הרשות, אחרי מתן ההיתר לפרסום התשקיף ולפני גמר התקופה להגשת הזמנות, שהתגלה או התרחש דבר שידיעתו היתה מניעה אותה שלא להתיר כלל את פרסום התשקיף או שלא להתירו אלא לאחר הכנסת שינויים מהותיים בטיוטת התשקיף, רשאית היא להורות למציע, אחרי שניתנה לו הזדמנות מתאימה להשמיע טענותיו, שיפרסם מיד או לא יאוחר מהמועד שהיא קבעה, תיקון לתשקיף או תשקיף מתוקן, בצורה ובדרך שתורה.\n(ב) פורסם תיקון לתשקיף או תשקיף מתוקן בהתאם להוראת הרשות לפי סעיף קטן (א), יידחו המועדים הקבועים בחוק זה או לפיו, ולענין זה יראו את מועד פרסום התיקון לתשקיף או את מועד פרסום התשקיף המתוקן כמועד פרסום התשקיף, אלא אם כן קבעה הרשות אחרת.\n(ג) (ד) המציע חייב להודיע לרשות בכתב, מיד לאחר שנודע לו, על כל דבר שהרשות עשויה להתחשב בו לענין שיקוליה לפי סעיף קטן (א), וכן חייב להודיע בכתב מי שנתן חוות־דעת, דו״ח או אישור שנכללו או נזכרו בתשקיף בהסכמתו המוקדמת; נעשתה ההצעה שלא בידי המנפיק, תחול חובה זו גם על המנפיק."},{"sec":"31","title":"אחריות לנזק בשל פרט מטעה בתשקיף","law":"חוק ניירות ערך","text":"מי שחתם על תשקיף לפי סעיף 22 אחראי כלפי מי שרכש ניירות ערך במסגרת המכירה על פי התשקיף, וכלפי מי שמכר או רכש ניירות ערך תוך כדי המסחר בבורסה או מחוצה לה, לנזק שנגרם להם מחמת שהיה בתשקיף פרט מטעה.\n(2) האחריות לפי פסקה (1) תחול גם על מי שהיה, במועד שבו אישר הדירקטוריון את הנוסח הסופי של התשקיף, דירקטור של המנפיק, המנהל הכללי שלו או בעל שליטה בו.\n(ב) תקופת ההתיישנות של תביעה לפי סעיף קטן (א) שלא הוגשה עליה תובענה היא שנתיים מיום העסקה או שבע שנים מתאריך התשקיף, לפי המוקדם.\n(ג) (ד)"},{"sec":"32","title":"אחריותם של מומחים","law":"חוק ניירות ערך","text":"מי שנתן חוות דעת, דו״ח, סקירה או אישור שנכללו או נזכרו בתשקיף בהסכמתו המוקדמת, יהא אחראי כאמור בסעיף 31(א) לנזק שנגרם מחמת שהיה פרט מטעה בחוות הדעת, בדו״ח, בסקירה או באישור שנתן, לרבות בחוות דעת, בדו״ח, בסקירה או באישור שנכללו בתשקיף בדרך של הפניה אליהם, ותקופת ההתיישנות של תביעה לפי סעיף זה, תהיה כאמור בסעיף 31(ב)."},{"sec":"33","title":"שלילת אחריות","law":"חוק ניירות ערך","text":"האחריות לפי הסעיפים 31 או 32 לא תחול –\n(1) על מי שהוכיח שנקט כל האמצעים הנאותים כדי להבטיח שלא יהיה פרט מטעה בתשקיף, בחוות הדעת, בדו״ח או באישור, הכל לפי הענין, וכי האמין בתום לב שאכן אין בו פרט כזה, ומילא חובתו לפי סעיף 25(ד);\n(1א) על חתם שהסמיך חתם אחר לנקוט את כל האמצעים הנאותים גם מטעמו כדי להבטיח שלא יהיה פרט מטעה בתשקיף, אם הוכחו שני אלה:\n(1) החתם המסמיך האמין בתום לב כי אין פרט מטעה בתשקיף;\n(2) על החתם שהוסמך לא חלה אחריות בהתאם לפסקה (1);\n(2) כלפי מי שהוכח שרכש ניירות הערך בשעה שידע או היה עליו לדעת שיש פרט מטעה בתשקיף, בחוות הדעת, בדו״ח או באישור, הכל לפי הענין;\n(3) משהגיש המנפיק דו״ח מיידי כאמור בסעיף 36(ג) שבו תוקן הפרט המטעה ופרסם את דבר התיקון בדרך שבה פורסמה ההודעה על התשקיף לפי סעיף 23(ג)(2), והכל כלפי מי שהוכח שרכש את ניירות הערך אחרי הפרסום האמור;\n(4) על מי שמסר למנפיק הודעה בכתב בדבר תיקון הפרט המטעה, והכל כלפי מי שהוכח שרכש את ניירות הערך אחרי שעברו 24 שעות ממסירת ההודעה;\n(5) על מי שלא חתם על התשקיף והוכיח שלא ידע ולא היה עליו לדעת או לא יכול היה לדעת, על פרסום התשקיף."},{"sec":"34","title":"אחריות רבים","law":"חוק ניירות ערך","text":"במידה ששנים או יותר אחראים לפי הסעיפים 31 עד 33, אחראים הם כלפי הניזוק יחד ולחוד; בינם לבין עצמם הם נושאים באחריות לפי הכללים החלים על אחריות בנזיקין."},{"sec":"35","title":"ביטול רכישה","law":"חוק ניירות ערך","text":"(א) מי שרכש מן המציע ניירות ערך בהתאם לתשקיף ועשה זאת בהסתמך על פרט מטעה שבו, רשאי לבטל את הרכישה ולדרוש החזרת הכספים ששילם, ובלבד שעשה זאת תוך זמן סביר לאחר שנודע לו שהפרט היה מטעה או לאחר שפורסם דו״ח מיידי כאמור בסעיף 36(ג) שבו תוקן הפרט המטעה ולא יאוחר משנתיים לאחר הרכישה.\n(ב) זכות הביטול לפי סעיף קטן (א) קיימת גם כשהמנפיק נמצא בפירוק או שניתן לגביו צו לפתיחת הליכים או צו עיכוב הליכים זמני לפי חוק חדלות פירעון ושיקום כלכלי."},{"sec":"36","title":"חובת דיווח של תאגידים","law":"חוק ניירות ערך","text":"(א) תאגיד שניירות ערך שלו הוצעו לציבור על פי תשקיף חייב להגיש לרשות דו״חות או הודעות לפי פרק זה כל עוד ניירות הערך שלו נמצאים בידי הציבור; תאגיד שניירות ערך שלו נסחרים בבורסה או רשומים בה למסחר חייב להגיש דו״חות או הודעות לפי פרק זה לרשות ולבורסה.\n(א1) (א2) תאגיד שניירות הערך שלו היו רשומים למסחר בבורסה בחו״ל ודיווח לפי הוראות פרק ה׳3, ובשל מחיקת ניירות הערך שלו ממסחר בבורסה בחו״ל חלה עליו חובת דיווח לפי פרק זה, רשאי להמשיך ולדווח לפי הוראות פרק ה׳3, למשך שישה חודשים ממועד מחיקת ניירות הערך כאמור, בטרם יחל לדווח לפי הוראות פרק זה, ובלבד שדיווחיו יכללו כל פרט העשוי להיות חשוב למשקיע סביר.\n(ב) שר האוצר יתקין, לפי הצעת הרשות או לאחר התייעצות עמה ובאישור ועדת הכספים של הכנסת, תקנות בדבר הפרטים שיש לכלול בדו״חות או בהודעות האמורים, צורתם ומועדי עריכתם והגשתם, לרבות פרטים שיש לכלול בדו״חות או בהודעות האמורים לפי מיטב ידיעתם של דירקטורים בתאגיד.\n(ג) תקנות לפי סעיף זה יתייחסו לכל ענין החשוב, לדעת שר האוצר, למשקיע סביר השוקל קניה או מכירה של ניירות ערך של התאגיד, ויכול שיתייחסו לכל דבר מן הדברים המפורטים בסעיף 17(ב) ויחייבו, נוסף על דו״ח תקופתי, גם דו״ח מיידי על אירועים מסויימים.\n(ד) שר האוצר רשאי להתקין תקנות לפי סעיף זה דרך כלל או לסוגים של תאגידים או ניירות ערך, או לפי כל סיווג אחר.\n(ה) תאגיד כאמור בסעיף קטן (א) חייב להגיש לפי דרישה מיוחדת של הרשות או של עובד שהיא הסמיכה לכך, בתוך המועד שייקבע בדרישה ובלבד שלא יפחת מהמועד שנקבע בתקנות לפי סעיף קטן (ב), דוח מיידי על ענין או אירוע, אם, לדעתם, מידע על אודותיהם חשוב למשקיע סביר השוקל קניה או מכירה של ניירות ערך של התאגיד.\n(ו) תאגיד כאמור בסעיף קטן (א) חייב, לפי דרישה של הרשות או של עובד שהיא הסמיכה לכך –\n(1) למסור בכתב לרשות, בתוך המועד שייקבע בדרישה, הסבר, פירוט, ידיעות ומסמכים בקשר לפרטים הכלולים בדוח או בהודעה לפי פרק זה;\n(2) להגיש דוח המתקן דוח או הודעה שהוגשו לפי פרק זה, בתוך המועד שייקבע בדרישה, אם נוכחו כי דוח או הודעה שהוגשו אינם כנדרש לפי סעיף זה, או כי הפרטים, שנמסרו מכוח הוראת פסקה (1), מחייבים זאת.\n(ז) הרשות רשאית להורות לתאגיד כאמור בסעיף קטן (א), לאחר שנתנה לו הזדמנות להשמיע את טענותיו, להגיש, בתוך תקופה שתקבע –\n(1) דוח שיכלול חוות דעת, נוסף על חוות הדעת שנכללה בדוח שהוגש לפי סעיף זה, אם נוכחה כי דוח כאמור אינו כנדרש לפי סעיף זה או כי פרטים שנמסרו מכוח הוראת סעיף קטן (ו) מחייבים מתן הוראה כאמור;\n(2) דוחות כספיים, חוות דעת או סקירה של רואה החשבון שביקר או שסקר אותם או של רואה חשבון אחר, במקום אלה שנכללו בדוח שהוגש לרשות, אם, לדעתה, הם לא נערכו לפי העקרונות החשבונאיים המקובלים וכללי הדיווח המקובלים ואינם משקפים באופן נאות, בהתאם לעקרונות ולכללים האמורים, את מצב עסקי התאגיד.\n(ח) שוכנעו הרשות או עובד שהרשות הסמיכה לכך כי נבצר מתאגיד להגיש דוח או הודעה לפי פרק זה במועד שנקבע לכך בתקנות, רשאים הם להאריך את המועד להגשתם.\n(ט) הרשות רשאית להודיע לתאגיד כי אינו חייב עוד בדיווח לפי פרק זה, אף אם ניירות הערך שלו נמצאים בידי הציבור, בתנאים ובמועדים שיקבע שר האוצר בתקנות באישור ועדת הכספים של הכנסת, ובלבד שנתנה לתאגיד ולמחזיקים בניירות הערך שלו הזדמנות להשמיע את טענותיהם; אין בהוראות סעיף קטן זה לגרוע מאחריות התאגיד לפי שאר הוראות חוק זה או כל דין אחר."},{"sec":"37","title":"חובת הודעה של בעל ענין או של נושא משרה בכירה","law":"חוק ניירות ערך","text":"(א) מקום שתקנות לפי סעיף 36 מחייבות תאגיד לגלות בדו\"חותיו פרטים על ניירות ערך שלו המוחזקים בידי בעל ענין בתאגיד או בידי נושא משרה בכירה בו או פרטים אחרים הנוגעים לבעל ענין בתאגיד או לנושא משרה בכירה בו, לרבות שינויים בהחזקות כאמור, חייב בעל הענין או נושא המשרה הבכירה להגיש לתאגיד הודעה לפי הפרטים ובמועדים הדרושים לתאגיד למלא את חובותיו האמורות; הוחזקו ניירות הערך באמצעות נאמן, והנאמן הגיש הודעה לפי סעיף קטן זה – המחזיק פטור; הגיש המחזיק הודעה כאמור – הנאמן פטור.\n(ב) הוראות סעיף קטן (א) בדבר חובת הודעה יחולו גם על מי שחדל להיות בעל ענין או נושא משרה בכירה, וזאת לגבי האירוע אשר בעקבותיו חדל להיות בעל ענין או נושא משרה בכירה.\n(ג) הודעה לפי סעיף זה תהיה בכתב, תיחתם בידי בעל הענין או נושא המשרה הבכירה או בידי מי שחדל להיות בעל ענין או נושא משרה בכירה ותוגש לתאגיד במועד שקבע שר האוצר, לפי הצעת הרשות או לאחר התייעצות עמה, באישור ועדת הכספים של הכנסת.\n \n(ד) בפרק זה,\n(סוג=הגדרה)  ”נושא משרה בכירה“ – נושא משרה, כהגדרתו בחוק החברות, וכן יושב ראש דירקטוריון, דירקטור חליף, יחיד שמונה לפי סעיף 236 לחוק החברות מטעם תאגיד המכהן כדירקטור, חשב, מבקר פנימי, מורשה חתימה עצמאי, וכל ממלא תפקיד כאמור גם אם תואר משרתו שונה, וכן נושא משרה בכירה בתאגיד בשליטת התאגיד, אשר יש לו השפעה מהותית על התאגיד וכל יחיד המועסק בתאגיד בתפקיד אחר, המחזיק חמישה אחוזים או יותר מן הערך הנקוב של הון המניות המוצא או מכוח ההצבעה; לעניין זה:\n(סוג=הגדרה)  ”מורשה חתימה עצמאי“ – מורשה חתימה אשר בכוחו לחייב את התאגיד בלא צורך בחתימתו של גורם נוסף בתאגיד לעניין פעולה מסוימת;\n(סוג=הגדרה)  ”מורשה חתימה“ – מי שמורשה לחייב את התאגיד או לחייב תאגיד בשליטתו של התאגיד שאינו תאגיד מדווח ושאינו תאגיד שפרק ה׳3 חל עליו (להלן – תאגיד נשלט), וכן מי שמורשה בתאגיד נשלט לחייב את התאגיד הנשלט, בסכום העולה על חמישה אחוזים מסך הנכסים במאזן התאגיד, לפי דוחותיו הכספיים המבוקרים האחרונים; ויראו שני מורשי חתימה או יותר שהם בני משפחה, מורשה חתימה אחד;\n(סוג=הגדרה)  ”חיוב“ – למעט תשלום מס, ארנונה או תשלום חובה אחר, הניתנים לגבייה לפי פקודת המסים (גביה), ולמעט פעולה בחשבונות התאגיד או תאגיד נשלט, שעניינה רכישה או מכירה של ניירות ערך, פיקדונות, מטבע חוץ ונכסים פיננסיים כהגדרתם בחוק הייעוץ.\n(ה) הוראות סעיף זה לעניין בעל עניין ונושא משרה בכירה יחולו גם על בעל אמצעי שליטה מהותי בתאגיד בנקאי בלא גרעין שליטה ובעל אמצעי שליטה מהותי בגוף מוסדי בלא שולט; בסעיף קטן זה –\n(סוג=הגדרה)  ”בעל אמצעי שליטה מהותי בתאגיד בנקאי בלא גרעין שליטה“ – כל אחד מאלה:\n(1) מי שמחזיק יותר משני אחוזים וחצי אחוזים מסוג מסוים של אמצעי שליטה בתאגיד בנקאי בלא גרעין שליטה;\n(2) מי שמחזיק יותר מאחוז אחד מסוג מסוים של אמצעי שליטה בתאגיד בנקאי בלא גרעין שליטה, ובלבד שלא הודיע לתאגיד הבנקאי על התנגדותו לכך שהתאגיד הבנקאי יגלה בדוחותיו פרטים על החזקתו, כאמור בסעיף 36(ב)(1)(ג) לחוק הבנקאות (רישוי);\n(3) מי שמחזיק בסוג מסוים של אמצעי שליטה בתאגיד בנקאי מסוים שהוא תאגיד בנקאי בלא גרעין שליטה, מעל שיעור כפי שקבע המפקח, לפי סעיף 36(ב1) לחוק הבנקאות (רישוי), בהסכמת יושב ראש הרשות;\n(סוג=הגדרה)  ”בעל אמצעי שליטה מהותי בגוף מוסדי בלא שולט“ – כל אחד מאלה:\n(1) מי שמחזיק יותר משני אחוזים וחצי מסוג מסוים של אמצעי שליטה בגוף מוסדי בלא שולט;\n(2) מי שמחזיק יותר מאחוז אחד מסוג מסוים של אמצעי שליטה בגוף מוסדי בלא שולט, ובלבד שלא הודיע לגוף המוסדי על התנגדותו לכך שהגוף המוסדי יגלה בדוחותיו פרטים על החזקתו, כאמור בסעיף 34א(א1)(1)(ג) לחוק הפיקוח על הביטוח;\n(3) מי שמחזיק בסוג מסוים של אמצעי שליטה בגוף מוסדי מסוים שהוא גוף מוסדי בלא שולט, מעל שיעור כפי שקבע המפקח לפי סעיף 34א(א2) לחוק הפיקוח על הביטוח, בהסכמת יושב ראש הרשות;\n(סוג=הגדרה)  ”גוף מוסדי בלא שולט“ – כל אחד מאלה:\n(1) מבטח בלא שולט כהגדרתו בחוק הפיקוח על הביטוח;\n(2) חברה מנהלת כהגדרתה בחוק הפיקוח על קופות גמל, שכל מחזיקי אמצעי השליטה בה אינם חייבים בהיתר לפי הוראות סעיף 9(ב) לחוק האמור;\n(סוג=הגדרה)  ”החזקה“, ו”אמצעי שליטה“ – לעניין בעל אמצעי שליטה מהותי בתאגיד בנקאי בלא גרעין שליטה – כהגדרתם בחוק הבנקאות (רישוי), ולעניין בעל אמצעי שליטה בגוף מוסדי בלא שולט – כהגדרתם בחוק הפיקוח על הביטוח;\n(סוג=הגדרה)  ”חוק הבנקאות (רישוי)“ – חוק הבנקאות (רישוי), התשמ״א–1981;\n(סוג=הגדרה)  ”חוק הפיקוח על הביטוח“ – \n(סוג=הגדרה)  ”תאגיד בנקאי בלא גרעין שליטה“ – כמשמעותו בסעיף 11ב(ג) לפקודת הבנקאות, 1941."},{"sec":"38","title":"צו בית המשפט","law":"חוק ניירות ערך","text":"(א) תאגיד שלא הגיש דו״ח לפי פרק זה במועד שנקבע לכך, או שהגישו שלא לפי סעיף 36 או סעיף 36א, או שלא תיקנו בתוך המועד שהורו הרשות או עובד שהיא הסמיכה לכך, או שלא מסר הסבר, פירוט, ידיעות או מסמכים בקשר לפרטים הכלולים בדוח או בהודעה לפי סעיף 36, או שלא הגיש חוות דעת נוספת או אחרת על פי דרישת הרשות, רשאי בית המשפט, לבקשת הרשות, לצוות עליו ועל הדירקטורים שלו שיגישו את הדו״ח או שיתקנו אותו או שיגישו חוות דעת נוספת או אחרת, תוך זמן שיקבע בית המשפט, ובמידת הצורך לצוות על בעל ענין או נושא משרה בכירה להגיש לתאגיד הודעה כאמור בסעיף 37.\n(ב) בעל ענין או נושא משרה בכירה שלא הגיש הודעה לפי סעיף 37 או שהגישה שלא בהתא
