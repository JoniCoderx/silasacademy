חיצוניים, בסביבה. למשל מגמה חדשה וביקוש גובר, או מתחרה ענק שנכנס, חוק מגביל ומיתון."},{"s":"קריין","x":"כשחוזקה פוגשת הזדמנות, זה נקרא מנוף. למשל הוֹט, ששילבה את התשתית שלה עם שינוי ברגולציה של הכבלים."},{"s":"קריין","x":"כשחולשה פוגשת איום, זה נקרא הבטן הרכה. למשל יצרני קורקינטים קטנים כששְׁיָאוֹמִי נכנסת לשוק."},{"s":"קריין","x":"כמה כללים. עובדים מלמטה למעלה, כי כל יחידה מכירה מציאות אחרת. ופריט חיצוני לא יופיע ברשימה הפנימית."},{"s":"קריין","x":"כל חוזקה יכולה להיות גם חולשה, וכל איום גם הזדמנות. ובהתחלה רושמים הכול, ורק אחר כך מסננים."},{"s":"קריין","x":"שאלה נפוצה במבחן: איזה צעד ינצל הזדמנות הכי טוב? בחרו את הצעד שעונה ישירות על המגמה, ועדיף שנשען על חוזקה."},{"s":"קריין","x":"פסלו צעדים שרק משפרים את הקיים, או מורידים מחיר בלי קשר למגמה."},{"s":"קריין","x":"סיפור. לחברת קִידְסֵייף יש חיישנים מעולים למושבי בטיחות. זו חוזקה. נחקק חוק שמחייב התראה על ילד שנשכח ברכב. זו הזדמנות."},{"s":"קריין","x":"הצעד הנכון הוא לפתח מוצר התראה שמבוסס על החיישנים שלה. זה מנוף."},{"s":"קריין","x":"המלכודת: חוק חדש, מתחרה חדש, מגמה בציבור או ריבית הם תמיד חיצוניים. מותג, עובדים וטכנולוגיה הם תמיד פנימיים."},{"s":"קריין","x":"בואו נסכם. בשרשרת הערך, תַּמְפַּר הן התומכות, וכל השאר ראשוניות."},{"s":"קריין","x":"אָר בִּי וִי אומר שהיתרון בא מבפנים, ווְרִיוֹ בודק אם משאב באמת נותן יתרון בר קיימא."},{"s":"קריין","x":"ליבה זה אני טוב בזה. ייחודית זה רק אני יכול."},{"s":"קריין","x":"ובסְווֹט, חוזקות וחולשות בבית, הזדמנויות ואיומים בחוץ."},{"s":"קריין","x":"עכשיו שתי שאלות. עצרו רגע וחשבו. איזו פעילות היא תומכת: לוגיסטיקה יוצאת, שירות לאחר מכירה, או רכש?"},{"s":"קריין","x":"התשובה, רכש. הוא אחת מארבע התומכות, תַּמְפַּר. השתיים האחרות נוגעות במוצר בדרכו ללקוח, ולכן הן ראשוניות."},{"s":"קריין","x":"שאלה שנייה. עצרו רגע וחשבו. מתחרה ענק נכנס לשוק של חברה קטנה. האם זו חולשה של החברה?"},{"s":"קריין","x":"לא. זה איום, כי זה חיצוני ולא בשליטת החברה. אם יש לה גם חולשה מולו, זו הבטן הרכה."},{"s":"קריין","x":"זהו להיום. עכשיו יש לכם את הכלים לנתח גם את החוץ וגם את הפנים. בהצלחה."}]},"s4":{"title":"אסטרטגיות תחרותיות גנריות של פּוֹרְטֶר","lines":[{"s":"קריין","x":"שלום. בפרק הזה נדבר על האסטרטגיות התחרותיות הגנריות של פּוֹרְטֶר."},{"s":"קריין","x":"זה נושא שמופיע כמעט בכל מבחן, בדרך כלל כסיפור על חברה, ושאלה איזו אסטרטגיה היא בחרה."},{"s":"קריין","x":"נתחיל בהגדרה. אסטרטגיה גנרית היא הדרך שבה החברה מנצלת את היכולות והמשאבים שלה, כדי להתחרות בענף."},{"s":"קריין","x":"גנרית פירושו כללית. פורטר טען שיש כמה משפחות של אסטרטגיות, שחוזרות בכל הענפים."},{"s":"קריין","x":"הרעיון שמאחורי זה הוא פשרה, טְרֵייד אוֹף. אי אפשר תמיד גם וגם. המתח המרכזי הוא בין איכות למחיר."},{"s":"קריין","x":"אסטרטגיה גנרית שמיושמת טוב נותנת תשואה מעל הממוצע, ומגינה על החברה מפני חמשת הכוחות התחרותיים."},{"s":"קריין","x":"ולפי פורטר, אין עדיפות לאף אחת מהאסטרטגיות. כל אחת מהן יכולה להצליח."},{"s":"קריין","x":"אז איך בוחרים אסטרטגיה, ואיך מזהים אותה במבחן? שואלים שתי שאלות."},{"s":"קריין","x":"שאלה ראשונה, מה מקור היתרון התחרותי? או עלות נמוכה, כלומר אני מייצר זול יותר מכולם."},{"s":"קריין","x":"או ייחודיות שהלקוח תופס, כלומר הלקוח רואה במוצר משהו מיוחד, ומוכן לשלם עליו."},{"s":"קריין","x":"שאלה שנייה, מה היקף הפעילות? שוק רחב, כלומר כל הענף והרבה פלחים, או נישה צרה ומוגדרת."},{"s":"קריין","x":"מצליבים את שתי התשובות, ומקבלים ארבע משבצות."},{"s":"קריין","x":"עלות נמוכה ושוק רחב, זו מנהיגות בעלות. למשל רָמִי לֵוִי, וֹולְמַארְט ורַיְינֶאיר."},{"s":"קריין","x":"ייחודיות ושוק רחב, זה בידול רחבה. למשל אַפֶּל, טֶסְלָה וסוֹדָהסְטְרִים."},{"s":"קריין","x":"עלות נמוכה ונישה, זו ממוקדת מנהיגות בעלות. למשל יֵשׁ חֶסֶד, אוֹשֶׁר עַד והַסְּטוֹק."},{"s":"קריין","x":"ייחודיות ונישה, זו ממוקדת בידול. למשל רוֹלְס רוֹיְס, פָּטֶק פִילִיפּ ולֶחֶם נָדִיר."},{"s":"קריין","x":"ופורטר קבע שבשלב הניסוח בוחרים אסטרטגיה גנרית אחת, ולא כמה בבת אחת."},{"s":"קריין","x":"נתחיל במנהיגות בעלות, או בלועזית, לוֹאוּ קוֹסְט פְּרוֹבַיידֶר."},{"s":"קריין","x":"המטרה היא להיות היצרן עם מבנה העלויות הנמוך ביותר בענף."},{"s":"קריין","x":"שימו לב, המטרה היא העלות הכי נמוכה, לא המחיר הכי נמוך. המחיר הנמוך הוא רק כלי."},{"s":"קריין","x":"הדרך הקלאסית היא ייצור המוני ויתרון לגודל, בדרך כלל בעסק גדול עם מוצר סטנדרטי."},{"s":"קריין","x":"מה צריך כדי להצליח? יתרון לגודל, פרודוקטיביות גבוהה, ייצור רזה, ושימוש יעיל בטכנולוגיה."},{"s":"קריין","x":"וגם ערוצי הפצה יעילים, נתח שוק גדול, ותרבות של יעילות בכל המחלקות."},{"s":"קריין","x":"הנה דוגמה. חברת בַּאלְק בּוֹקְס מוכרת קרטונים לכל סוגי העסקים בארץ."},{"s":"קריין","x":"היא קונה נייר בכמויות ענק, המפעל שלה אוטומטי ועובד מסביב לשעון, והעלות ליחידה הכי נמוכה בענף."},{"s":"קריין","x":"התשובה, מנהיגות בעלות. היתרון הוא מעלות, והשוק רחב, כל העסקים."},{"s":"קריין","x":"ומה הסיכונים? שינוי טכנולוגי שמוריד את העלויות של אחרים, וחיקוי של שיטות העבודה."},{"s":"קריין","x":"סיכון נוסף, מתחרה מבודל שהתוספת שלו שווה את זה. אם הזול עולה אלף שקל והמבודל אלף ומאה, רבים ישלמו עוד קצת."},{"s":"קריין","x":"והסיכון האחרון, מיקוד פנימה בעלויות, בלי לראות שהלקוחות השתנו. כך קרה לפוֹרְד אחרי המשבר."},{"s":"קריין","x":"האסטרטגיה השנייה היא בידול רחבה, בְּרוֹד דִיפֶרֶנְצְיֵיישֶׁן."},{"s":"קריין","x":"כאן החברה הופכת את המוצר לייחודי בעיני הלקוחות, כך שהם רואים בו ערך גבוה יותר."},{"s":"קריין","x":"הייחוד יכול לבוא מעיצוב, ממותג, מטכנולוגיה, מתכונות או משירות לקוחות. ואפשר להתבדל ביותר ממימד אחד."},{"s":"קריין","x":"בזכות הבידול החברה גובה מחיר פרימיום, ומשיגה שולי רווח גבוהים."},{"s":"קריין","x":"מה שקובע זו התפיסה של הלקוח, שהוא רואה את המוצר כמיוחד. והמילה רחבה אומרת, הרבה פלחים."},{"s":"קריין","x":"מה צריך כדי להצליח? הבנה עמוקה של הלקוחות, מחקר מתמיד, וידע ייחודי ששומר על הבידול."},{"s":"קריין","x":"וגם מומחים מוכשרים, תגמול על רעיונות, והשקעה בשיווק ובמוניטין."},{"s":"קריין","x":"דוגמה. חברת נוֹבָה פוֹן מוכרת סמארטפונים בכל העולם, לסטודנטים, למשפחות ולאנשי עסקים."},{"s":"קריין","x":"המכשירים שלה ידועים בעיצוב ייחודי, במצלמה מתקדמת ובמותג חזק, והיא גובה יותר מהמתחרים."},{"s":"קריין","x":"התשובה, בידול רחבה. ייחודיות, ושוק רחב, כל העולם וכל הפלחים."},{"s":"קריין","x":"הסיכונים בבידול: נתח שוק מוגבל יותר, ועלות בידול גבוהה, שמעבירה לקוחות למתחרה זול."},{"s":"קריין","x":"וגם ירידה בביקוש לייחוד, וחיקויים, כמו שִׁיאוֹמִי מול אפל וסָמְסוּנְג. לכן בידול דורש חדשנות ושיווק מתמשכים."},{"s":"קריין","x":"עכשיו לשתי אסטרטגיות המיקוד, פוֹקוּס. הן נותנות את המענה הטוב ביותר לפלח צר ומוגדר היטב."},{"s":"קריין","x":"הנישה יכולה להיות קבוצת קונים מסוימת, כמו סטודנטים או טבעונים."},{"s":"קריין","x":"או פלח של קו מוצרים, כמו רק צ'יפס מטוגן ביד. או שוק גאוגרפי, כמו עיר אחת. ושם בוחרים שוב, ייחוד או זול."},{"s":"קריין","x":"ממוקדת בידול נותנת ערך ייחודי לנישה שמוכנה לשלם, על התאמה, עיצוב, שירות או ייחוד."},{"s":"קריין","x":"ההצלחה שלה תלויה בחדשנות, בהבנה עמוקה של הלקוח, במיתוג ובמומחיות."},{"s":"קריין","x":"ממוקדת מנהיגות בעלות נותנת מוצר בסיסי וזול לנישה רגישה למחיר, כמו סטודנטים או עסקים קטנים."},{"s":"קריין","x":"ההצלחה שלה תלויה בשליטה בהוצאות, בלוגיסטיקה יעילה ובמודל הפעלה רזה."},{"s":"קריין","x":"דוגמה. סְטַאדִי מִיל מוכרת ארוחות פשוטות וזולות, רק לסטודנטים במעונות, ממטבח אחד ובלי מלצרים."},{"s":"קריין","x":"התשובה, ממוקדת מנהיגות בעלות. נישה, וזול."},{"s":"קריין","x":"ועכשיו פְּיוּר רַייד, שבונה אופני מרוץ בעבודת יד, בהתאמה אישית לרוכבים מקצועיים, במחיר גבוה מאוד."},{"s":"קריין","x":"התשובה, ממוקדת בידול. נישה, וייחודי."},{"s":"קריין","x":"סיכוני המיקוד: מתחרה שמוצא תת נישה, כלומר חלק קטן עוד יותר מהנישה שלכם."},{"s":"קריין","x":"צמצום ההבדלים, כשהצרכים של הנישה נעשים דומים לשל כל השוק. ופער מחיר גדול מדי מול מנהיג העלות."},{"s":"קריין","x":"האסטרטגיה החמישית היא המשולבת, בֶּסְט קוֹסְט. היא משלבת בו זמנית עלות נמוכה ובידול."},{"s":"קריין","x":"חשוב לזכור, היא תוספת למודל של פורטר. הוא לא פיתח אותה, והיא אפילו סותרת את התיאוריה שלו."},{"s":"קריין","x":"כי לפי פורטר צריך לבחור אחת. היא נוספה, כי בפועל חברות רבות עושות את זה."},{"s":"קריין","x":"איך עושים את זה? התייעלות חכמה בלי לפגוע באיכות, ערך ברור ללקוח, וטכנולוגיה ואוטומציה."},{"s":"קריין","x":"דוגמאות להצלחה: אֵיץ' אֶנְד אֵם, אופנה עדכנית במחיר נגיש. וגם זוּם ואִיקֵאָה."},{"s":"קריין","x":"הדוגמה של המרצה היא טֶבַע, שמייצרת גנריקה בעלות נמוכה, וגם מפתחת תרופות מקור."},{"s":"קריין","x":"היום טבע פחות מצליחה, כי היא לכודה בין שתי המטרות. כשהשילוב נכשל, החברה מאבדת מיקוד, כמו יָאהוּ ובְּלֶקְבֶּרִי."},{"s":"קריין","x":"ומה זו תקועה באמצע? חברה שלא יישמה אף אסטרטגיה בהצלחה. היא לא זולה ולא מיוחדת, כמו סִירְס."},{"s":"קריין","x":"דוגמה. פִיט וֶור מוכרת בגדי ספורט לכל הקהל. בזכות רובוטים ורכש חכם, העלויות והמחירים נמוכים."},{"s":"קריין","x":"ובמקביל העיצובים שלה ייחודיים ומתחלפים כל חודש. התשובה, משולבת. עלות נמוכה וגם בידול, לשוק רחב."},{"s":"קריין","x":"איך פותרים שאלת סיפור? צעד ראשון, מקור היתרון. הורדת עלויות, התייעלות, ייצור המוני, מחיר נמוך, זו עלות."},{"s":"קריין","x":"ייחודי, יוקרתי, עיצוב, חדשני, איכות, מותג או התאמה אישית, זה בידול."},{"s":"קריין","x":"צעד שני, היקף השוק. לכל, בכל העולם, כל הפלחים, זה רחב. רק לסטודנטים, או אזור מסוים, זו נישה."},{"s":"קריין","x":"צעד שלישי. אם יש גם עלות נמוכה וגם ייחודיות באותה נשימה, זו משולבת."},{"s":"קריין","x":"ועכשיו המלכודות. בשתי אסטרטגיות המיקוד יש נישה. ההבדל ביניהן הוא רק במקור היתרון."},{"s":"קריין","x":"לכן ההיגד, בידול ממוקד מתאים לחברה שמוכרת מוצרים זולים במיוחד לנישה, הוא לא נכון."},{"s":"קריין","x":"יכולת ליבה בהורדת עלויות מובילה למנהיגות בעלות. יכולת ליבה בחדשנות, בעיצוב או במותג, מובילה לבידול."},{"s":"קריין","x":"אל תתבלבלו עם אוקיינוס כחול. שם יוצרים שוק חדש בלי מתחרים, וזו לא אסטרטגיה גנרית."},{"s":"קריין","x":"וטסלה מופיעה במצגת פעם כבידול רחבה, ופעם כממוקדת בידול. במבחן תחליטו לפי הסיפור, שוק רחב או נישה."},{"s":"קריין","x":"נסכם. שתי שאלות, איך אני מנצח, בעלות או בייחוד, ואת מי אני משרת, את כולם או נישה."},{"s":"קריין","x":"מנהיגות בעלות היא העלות הכי נמוכה, לא המחיר. המשולבת היא תוספת לפורטר. ותקועה באמצע, לא זולה ולא מיוחדת."},{"s":"קריין","x":"עצרו רגע וחשבו. חברה מוכרת ציוד משרדי בסיסי וזול, רק לעסקים קטנים. איזו אסטרטגיה זו?"},{"s":"קריין","x":"ממוקדת מנהיגות בעלות. יש נישה, עסקים קטנים, והיתרון הוא מוצר בסיסי במחיר נמוך."},{"s":"קריין","x":"עצרו רגע וחשבו. נכון או לא נכון, יכולת ליבה בהורדת עלויות מובילה לבידול?"},{"s":"קריין","x":"לא נכון. היא מובילה למנהיגות בעלות. בידול נשען על חדשנות, עיצוב או מותג."},{"s":"קריין","x":"זהו לפרק הזה. זכרו, שתי שאלות, ארבע משבצות, ועוד משולבת אחת. בהצלחה."}]},"s5":{"title":"חדשנות, שלושה זוגות שחשוב להבדיל","lines":[{"s":"קריין","x":"שלום. בפרק הזה נדבר על חדשנות, ועל שלושה זוגות של סוגי חדשנות שהמבחן אוהב להשוות."},{"s":"קריין","x":"בסוף הפרק תדעו לזהות מכל סיפור, איזה סוג חדשנות מתואר בו."},{"s":"קריין","x":"נתחיל בהגדרה. חדשנות היא יצירה של מוצר, שירות, תהליך או מודל עסקי, חדש או משופר באופן מהותי."},{"s":"קריין","x":"משהו שמבדל את הארגון ממה שהיה בעבר, ומיושם בפועל, בשוק או בתוך הארגון."},{"s":"קריין","x":"בהגדרה יש שלושה דברים חשובים. ראשון, חדש או משופר מהותית. שינוי קוסמטי קטן הוא לא חדשנות."},{"s":"קריין","x":"שני, מיושם בפועל. רעיון טוב שנשאר על הנייר הוא לא חדשנות."},{"s":"קריין","x":"שלישי, יוצר ערך. ערך כלכלי, חברתי או סביבתי, ללקוח ולארגון."},{"s":"קריין","x":"וחדשנות היא לא רק טכנולוגיה. היא כוללת גם שינויים ארגוניים, שיווקיים וחברתיים."},{"s":"קריין","x":"והיא יכולה להיות הדרגתית, או מהפכנית."},{"s":"קריין","x":"למה היא חשובה לאסטרטגיה? היא יוצרת יתרון תחרותי בר קיימא, ועוזרת להגיב לסביבה משתנה."},{"s":"קריין","x":"היא גם פותחת שווקים חדשים, כמו באוקיינוס כחול, משפרת תהליכים, שומרת על לקוחות, ומושכת עובדים ומשקיעים."},{"s":"קריין","x":"הזוג הראשון, חדשנות טכנולוגית, מול חדשנות אַ-טכנולוגית, כלומר לא טכנולוגית."},{"s":"קריין","x":"חדשנות טכנולוגית היא שימוש בטכנולוגיה חדשה, חומרה או תוכנה, כדי לפתח מוצר, שירות או תהליך."},{"s":"קריין","x":"דוגמאות: טֶסְלָה עם ההנעה החשמלית, אַפֶּל עם האַייפוֹן, וֵויְז ומוֹבִּילְאַיי."},{"s":"קריין","x":"בסיפור תחפשו מילים כמו פיתחה תוכנה, חיישנים, בינה מלאכותית, או פלטפורמה דיגיטלית."},{"s":"קריין","x":"חדשנות אַ-טכנולוגית היא חדשנות במודל העסקי, בשירות, בארגון או בשיווק, בלי טכנולוגיה חדשה."},{"s":"קריין","x":"היא נשענת על חשיבה עסקית יצירתית."},{"s":"קריין","x":"דוגמאות: אִיקֵאָה, עם שיטת עשה זאת בעצמך. זַאפּוֹס, ששירות הלקוחות שלה הוא מנוע אסטרטגי."},{"s":"קריין","x":"וקפה לַנְדְוֶור, עם מיתוג מחדש וחוויית אירוח."},{"s":"קריין","x":"בסיפור תחפשו: שינתה את המודל העסקי, שירות יוצא דופן, מיתוג מחדש, חוויית אירוח."},{"s":"קריין","x":"דוגמה. רשת המספרות קַאט קְלַאבּ עוברת למנוי חודשי קבוע, ומסתפרים כמה שרוצים. לא נוסף שום מכשיר או תוכנה."},{"s":"קריין","x":"התשובה, חדשנות אַ-טכנולוגית. החידוש הוא במודל העסקי."},{"s":"קריין","x":"אבל אם הרשת הייתה מפתחת אפליקציה שממליצה על תספורת בעזרת בינה מלאכותית, זו חדשנות טכנולוגית."},{"s":"קריין","x":"והמלכודת: ההיגד, חברה יכולה לחדש גם בלי טכנולוגיות חדשות, הוא נכון."},{"s":"קריין","x":"וההיגד, חדשנות היא תמיד פיתוח טכנולוגי, הוא לא נכון."},{"s":"קריין","x":"עכשיו מדד שחשוב להכיר, ג'י אַיי אַיי, מדד החדשנות העולמי."},{"s":"קריין","x":"הוא מודד כמה חדשנית כל כלכלה, כלומר כל מדינה. מפרסם אותו ארגון הקניין הרוחני העולמי, וִיפּוֹ."},{"s":"קריין","x":"הוא מדרג כמאה ושלושים כלכלות, לפי כשמונים אינדיקטורים."},{"s":"קריין","x":"הוא בודק את סביבת המדיניות, החינוך, התשתיות, ויצירת הידע בכלכלה."},{"s":"קריין","x":"והוא מאפשר להשוות מדינה לכלכלות באותו אזור, או באותה קבוצת הכנסה."},{"s":"קריין","x":"במצגת יש גם מסגרת אחרת, ג'י אַיי אֵל, של חברת פְרוֹסְט אֶנְד סַלִיבַן."},{"s":"קריין","x":"זו מסגרת חשיבה, לא מדד כמותי. היא בודקת אם חברה יודעת לצמוח, לחדש ולהוביל לאורך זמן."},{"s":"קריין","x":"ג'י היא צמיחה, גְרוֹאוּת'. צמיחה עקבית ובת קיימא, גם בזמן שינויים מהירים."},{"s":"קריין","x":"אַיי היא חדשנות, אִינוֹבֵיישֶׁן. חדשנות כתהליך מתמשך, שהופכת ליכולת ליבה ויוצרת בידול."},{"s":"קריין","x":"אֵל היא מנהיגות, לִידֶרְשִׁיפּ. חזון ארוך טווח, והובלת שינוי, ולא רק תגובה אליו."},{"s":"קריין","x":"דוגמה, פַייבֶר. צמיחה גלובלית מהירה, מודל ייחודי של מיקרו שירותים, וחזון שמוביל את העבודה הדיגיטלית."},{"s":"קריין","x":"והמלכודת: ג'י אַיי אַיי מדרג מדינות, לא חברות."},{"s":"קריין","x":"דירוג של כמאה ושלושים כלכלות, או השוואה למדינות באזור, זה ג'י אַיי אַיי."},{"s":"קריין","x":"צמיחה, חדשנות ומנהיגות של חברה אחת, זה ג'י אַיי אֵל."},{"s":"קריין","x":"ושימו לב, ג'י אַיי אַיי הוא לא מודל לניתוח סביבה, זה פֶּסְטֶל. והוא לא כלי ליישום, זה בִּי אֵס סִי."},{"s":"קריין","x":"הזוג השני, חדשנות מחקר ופיתוח, מול חדשנות תהליך."},{"s":"קריין","x":"חדשנות מחקר ופיתוח יוצרת מוצר, שירות או טכנולוגיה, חדשים או משופרים מהותית, על בסיס ידע מדעי או הנדסי."},{"s":"קריין","x":"התוצאה שלה היא חדשנות מוצר. והיא עוברת שלושה שלבים: מחקר, פיתוח, ומסחור, כלומר הוצאה לשוק."},{"s":"קריין","x":"שאלת המפתח שלה היא, מה אנחנו מציעים. המטרה היא ערך חדש ללקוח, ולכן היא קשורה לבידול."},{"s":"קריין","x":"הסיכון שלה גבוה, כי יש השקעה גדולה מראש, והתוצאה לא ודאית."},{"s":"קריין","x":"דוגמאות: פַייזֶר עם חיסון אֶם אַר אֵן אֵיי, דַייסוֹן, מוֹבִּילְאַיי וצֶ'ק פּוֹיְנְט."},{"s":"קריין","x":"חדשנות תהליך היא דרך חדשה או משופרת לייצר או לספק. המוצר הסופי לא משתנה מהותית."},{"s":"קריין","x":"הארגון פשוט עושה אותו מהר יותר, זול יותר, ובאיכות גבוהה יותר."},{"s":"קריין","x":"היא לא תמיד נראית ללקוח, והסיכון שלה בינוני, כי היא נשענת לרוב על ידע קיים."},{"s":"קריין","x":"שאלת המפתח שלה היא, איך אנחנו מציעים את זה טוב יותר. ולכן היא קשורה למנהיגות בעלות."},{"s":"קריין","x":"דוגמאות: טוֹיוֹטָה עם שיטת לִין וקַייזֶן, הרובוטים במחסנים של אָמָזוֹן, ואַסּוּתָא עם ניהול התורים לחדרי ניתוח."},{"s":"קריין","x":"דוגמה. חברת בְּרוּ מֶקְס מוכרת בדיוק את אותו מיץ, אבל החליפה את פס הייצור ברובוטים, והזמן ירד בחצי."},{"s":"קריין","x":"התשובה, חדשנות תהליך. אותו מוצר, ורק הדרך לייצר השתנתה."},{"s":"קריין","x":"אחר כך, אחרי שלוש שנות מחקר במעבדה, היא משיקה מיץ חדש עם חלבון צמחי. זו חדשנות מחקר ופיתוח, כלומר חדשנות מוצר."},{"s":"קריין","x":"המלכודת: כשהמוצר לא השתנה ורק הדרך לייצר השתנתה, זו חדשנות תהליך, גם אם השתמשו בטכנולוגיה מתקדמת."},{"s":"קריין","x":"ואם שואלים איזו חדשנות מתאימה למנהיגות בעלות, התשובה היא תהליך. ולבידול, מחקר ופיתוח."},{"s":"קריין","x":"הזוג השלישי, חדשנות סגורה מול חדשנות פתוחה."},{"s":"קריין","x":"בחדשנות סגורה, כל השלבים, מהרעיון ועד השיווק, נעשים בתוך הארגון."},{"s":"קריין","x":"יש שליטה מלאה על הידע ועל הקניין הרוחני, והגבולות של הארגון אטומים."},{"s":"קריין","x":"זו הגישה המסורתית, עד תחילת שנות האלפיים. דוגמאות: אַפֶּל בעבר, ואִינְטֶל עם מעבדות פנימיות בלבד."},{"s":"קריין","x":"חדשנות פתוחה היא הרעיון של צֶ'סְבְּרוֹ, משנת אלפיים ושלוש. הארגון פותח את הגבולות שלו."},{"s":"קריין","x":"הידע זורם בכוונה פנימה, רעיונות וטכנולוגיות מבחוץ. וגם החוצה, למשל ברישוי ידע לאחרים."},{"s":"קריין","x":"בסיפור תחפשו: אקדמיה, סטארטאפים, ספקים, לקוחות, רישוי ידע, האקתון או מיזם משותף."},{"s":"קריין","x":"דוגמאות: פִּי אֶנְד גִ'י עם קוֹנֶקְט אֶנְד דִיוֶולוֹפּ, לֶגוֹ אַיידִיאָז, ובִּי אֶם דַבְּלְיוּ סְטַארְטְאַפּ גַרָאז'."},{"s":"קריין","x":"ההשוואה: סגורה איטית ויקרה. פתוחה מהירה יותר, והעלויות מתפזרות."},{"s":"קריין","x":"דוגמה. קְוַואנְטוּם צִ'יפּ מפתחת רק במעבדות שלה, אוסרת לשתף מידע, ורושמת פטנט על כל פיתוח. זו סגורה."},{"s":"קריין","x":"אַגְרוֹ לִינְק מזמינה סטארטאפים להאקתון, ומוכרת רישיון על טכנולוגיה שהיא לא משתמשת בה. זו פתוחה."},{"s":"קריין","x":"כי ידע נכנס מהסטארטאפים, ויוצא דרך הרישוי."},{"s":"קריין","x":"המלכודת: בחדשנות פתוחה הידע זורם בשני הכיוונים. היגד שאומר שידע יכול לצאת החוצה, הוא נכון."},{"s":"קריין","x":"היגד שאומר שהידע רק נכנס, או שהחברה שומרת על שליטה מלאה, הוא לא נכון."},{"s":"קריין","x":"ועוד מלכודת. אם הסיפור מדבר על מי מפתח ועם מי, זו סגורה או פתוחה. אם הוא מדבר על מה השתנה, זה מוצר או תהליך."},{"s":"קריין","x":"בואו נסכם בשלושה זוגות."},{"s":"קריין","x":"עם מחשב או בלי, זו טכנולוגית מול אַ-טכנולוגית."},{"s":"קריין","x":"מה או איך, זה מחקר ופיתוח מול תהליך. מה, מוביל לבידול. איך, מוביל לעלות נמוכה."},{"s":"קריין","x":"ודלת נעולה או דלת מסתובבת, זו סגורה מול פתוחה."},{"s":"קריין","x":"עצרו רגע וחשבו. מפעל ממשיך לייצר בדיוק את אותו כיסא, אבל הכניס שיטת ייצור שחוסכת חצי מהזמן. איזו חדשנות זו?"},{"s":"קריין","x":"חדשנות תהליך. המוצר לא השתנה, רק הדרך לייצר אותו."},{"s":"קריין","x":"עצרו רגע וחשבו. נכון או לא נכון, ג'י אַיי אַיי מדרג את החברות החדשניות בעולם?"},{"s":"קריין","x":"לא נכון. הוא מדרג כלכלות, כלומר מדינות. בחברה אחת משתמשים במסגרת ג'י אַיי אֵל."},{"s":"קריין","x":"זהו לפרק הזה. זכרו את שלושת הזוגות, ותזהו כל סיפור. בהצלחה."}]},"s6":{"title":"יישום האסטרטגיה, שיטות ותנאים","lines":[{"s":"קריין","x":"שלום. בפרק הזה נדבר על יישום האסטרטגיה, השלב שבו התוכנית הופכת למציאות."},{"s":"קריין","x":"במבחן תפגשו כאן שלוש שיטות יישום, שאלה על התנגדות עובדים, ושאלות על מבנה ארגוני."},{"s":"קריין","x":"יישום האסטרטגיה הוא תרגום החזון והיעדים לתהליכים, להחלטות ולתוצאות של יום יום."},{"s":"קריין","x":"אסטרטגיה מבריקה שלא מיושמת נכון, נשארת רעיון על הנייר."},{"s":"קריין","x":"יישום מוצלח דורש תיאום בין מבנה ארגוני, תרבות, סגנון מנהיגות, ותהליכי בקרה ולמידה."},{"s":"קריין","x":"נתחיל בהתנגדות עובדים. כשמכניסים אסטרטגיה חדשה, עובדים רבים מתנגדים."},{"s":"קריין","x":"הם חוששים מהלא נודע, מאובדן מעמד, או שהשינוי מתנגש בתרבות. ככה אנחנו עובדים כאן."},{"s":"קריין","x":"אז מה הצעד הראשון? שיתוף העובדים בתהליך קבלת ההחלטות."},{"s":"קריין","x":"מי שהשתתף בהחלטה מבין אותה, מרגיש שהיא גם שלו, ומתחייב אליה."},{"s":"קריין","x":"דוגמה. חברת סַאן גְרִיד עוברת לאנרגיה סולארית, והעובדים במפעל מתנגדים. מה עושים קודם?"},{"s":"קריין","x":"משתפים אותם בקבלת ההחלטות. מסבירים, שומעים את החששות, ונותנים להם להשפיע על היישום."},{"s":"קריין","x":"המסיחים הקלאסיים: בונוסים על שיתוף פעולה, העברת היישום למיקור חוץ, והגדלת ההשקעה במחקר ופיתוח."},{"s":"קריין","x":"אף אחד מהם לא מטפל בשורש ההתנגדות. התשובה היא תמיד, קודם משתפים."},{"s":"קריין","x":"השיטה הראשונה היא אֶם בִּי אוֹ, ניהול לפי יעדים. פיתח אותה פִּיטֶר דְרוּקֶר."},{"s":"קריין","x":"הרעיון: מנהלים ועובדים מסכימים מראש על יעדים מדידים וברורים."},{"s":"קריין","x":"כך כל הארגון נע סביב מטרות עסקיות. וכשהיעדים נקבעים יחד עם העובדים, נוצרת מחויבות."},{"s":"קריין","x":"יש ארבעה שלבים. ראשון, ההנהלה מגדירה מטרות אסטרטגיות, למשל הגדלת נתח השוק בעשרה אחוזים."},{"s":"קריין","x":"שני, מפרקים את המטרות לכל מחלקה ויחידה. למשל, לשיווק יעד חשיפה, ולמכירות יעד של מפיצים חדשים."},{"s":"קריין","x":"שלישי, הסכמה הדדית עם כל עובד על יעדים מדידים. רביעי, בקרה ומשוב תקופתיים מול היעדים."},{"s":"קריין","x":"והיעדים צריכים להיות מדידים וברורים, לפי מודל סְמַארְט."},{"s":"קריין","x":"היתרונות: תמונה ברורה לעובדים, מוטיבציה ומחויבות, שפה משותפת, והערכה אובייקטיבית."},{"s":"קריין","x":"החסרונות: דורש הרבה זמן, בירוקרטי ונוקשה, ומתמקד יותר מדי בתוצאות ובטווח הקצר."},{"s":"קריין","x":"דוגמאות: אֵיץ' פִּי, אִינְטֶל, שְׁטְרָאוּס, רָפָאֵל, ושׁוּפֶרְסַל, עם יעד מכירות לכל סניף."},{"s":"קריין","x":"השיטה השנייה היא בִּי אֵס סִי, כרטיס ניקוד מאוזן. פיתחו אותה קַפְּלָן ונוֹרְטוֹן, בתחילת שנות התשעים."},{"s":"קריין","x":"הרעיון: לא למדוד רק כסף. מאזנים בין ארבע פרספקטיבות."},{"s":"קריין","x":"אחת, הפיננסית. רווחיות, צמיחה בהכנסות, תשואה על השקעה, ותזרים מזומנים."},{"s":"קריין","x":"שתיים, לקוחות. שביעות רצון, נתח שוק, שימור לקוחות, וגיוס לקוחות חדשים."},{"s":"קריין","x":"שלוש, תהליכים פנימיים. יעילות התפעול, איכות, זמני פיתוח, וניהול מלאי."},{"s":"קריין","x":"ארבע, למידה וצמיחה. הכשרת עובדים ושימורם, שביעות רצון עובדים, ותשתיות טכנולוגיות."},{"s":"קריין","x":"למשל בבנק הפועלים, שעות הדרכה לעובדים שייכות לפרספקטיבה של למידה וצמיחה."},{"s":"קריין","x":"היתרונות: כל הארגון מתואם סביב האסטרטגיה, מזהים בעיות מוקדם, ורואים קשר של סיבה ותוצאה."},{"s":"קריין","x":"והיא ממוקדת ביעדים ארוכי טווח. החסרונות: היא דורשת שינוי תרבותי, מערכות מידע, ותחזוקה שוטפת."},{"s":"קריין","x":"דוגמאות: הִילְטוֹן, יוּ פִּי אֵס, מכבי שירותי בריאות, בנק הפועלים, ואל על."},{"s":"קריין","x":"השיטה השלישית היא טִי אוֹ סִי, תורת האילוצים. פיתח אותה אֵלִיָּהוּ גוֹלְדְרָט, מחבר הספר המטרה."},{"s":"קריין","x":"הרעיון: בכל מערכת יש לפחות אילוץ אחד, צוואר בקבוק, שמגביל את כל המערכת."},{"s":"קריין","x":"מזהים את הגורם המעכב ביותר, ופועלים להסיר אותו, בשיפור מתמיד."},{"s":"קריין","x":"חמשת השלבים: מזהים את האילוץ. מנצלים אותו עד הסוף. ומכפיפים את כל המערכת לקצב שלו."},{"s":"קריין","x":"אחר כך מרחיבים את האילוץ, וחוזרים להתחלה, לחפש את האילוץ הבא."},{"s":"קריין","x":"היתרונות: תוצאות מהירות עם מינימום השקעה, פחות מלאי, יותר תפוקה, ואספקה בזמן."},{"s":"קריין","x":"היא מתאימה מאוד לתעשייה, לייצור וללוגיסטיקה."},{"s":"קריין","x":"החסרונות: היא פחות מתאימה לשירותים טהורים, ולפעמים מתמקדת בבעיות טקטיות ולא אסטרטגיות."},{"s":"קריין","x":"דוגמה. אָסָם גילתה שהאילוץ בהפצה הוא זמני הפריקה במחסנים האזוריים."},{"s":"קריין","x":"כל היחידות התאימו את עצמן לאילוץ, וזמני האספקה התקצרו בשמונה עשר אחוז. זו תורת האילוצים."},{"s":"קריין","x":"אז איך מבדילים בסיפור?"},{"s":"קריין","x":"יעדים אישיים, מנהל ועובד קבעו יחד, או יעד באחוזים לכל מחלקה, זה אֶם בִּי אוֹ."},{"s":"קריין","x":"מדדים פיננסיים וגם לקוחות, תהליכים והדרכת עובדים, ומילה כמו איזון, זה בִּי אֵס סִי."},{"s":"קריין","x":"אילוץ, צוואר בקבוק, השלב שמעכב את הכול, זה טִי אוֹ סִי."},{"s":"קריין","x":"שימו לב, בִּי אֵס סִי לא מודדת רק כסף. ומתחרים או ספקים אינם אחת מארבע הפרספקטיבות."},{"s":"קריין","x":"והשיטות לא סותרות. אפשר ואף רצוי לשלב ביניהן, לפי אופי הארגון."},{"s":"קריין","x":"עכשיו לארבעה תנאים ליישום. הראשון, מנהיגות."},{"s":"קריין","x":"מנהיגות היא תהליך של השפעה חברתית, שבו אדם משפיע על אחרים כדי להשיג מטרה משותפת."},{"s":"קריין","x":"היא לא רק סמכות פורמלית, ולא רק תכונה מולדת. היא תהליך, עם השפעה, מטרה, והקשר קבוצתי."},{"s":"קריין","x":"מנהיגות ארגונית היא היכולת ליישם חזון, לנהל שינוי ולהניע עובדים, בתוך ארגון מורכב."},{"s":"קריין","x":"מנהיגות כללית מדגישה השפעה והשראה. ובמנהיגות ארגונית, האתגרים הם בירוקרטיה והתנגדות לשינוי."},{"s":"קריין","x":"התנאי השני, תרבות ארגונית. לפי שַׁיין, זו מערכת משותפת של ערכים, אמונות, נורמות והתנהגויות."},{"s":"קריין","x":"במילים פשוטות, התרבות היא האישיות של הארגון."},{"s":"קריין","x":"המרכיבים: ערכים מוצהרים, אמונות יסוד, נורמות, סמלים וטקסים, שפה ארגונית ומערכות תגמול."},{"s":"קריין","x":"והכי חשוב למבחן: אסטרטגיה שלא מתאימה לתרבות תיכשל, ותיצור התנגדות פנימית."},{"s":"קריין","x":"למשל, אסטרטגיית חדשנות לא תצליח בתרבות שמרנית, שסגורה לרעיונות."},{"s":"קריין","x":"ותרבות היררכית מובילה לריכוזיות, ואילו תרבות פתוחה מעודדת ביזור וחדשנות."},{"s":"קריין","x":"התנאי השלישי, למידה ארגונית. היכולת לרכוש ידע, לשתף אותו, ולשנות בעקבותיו את דרך העבודה."},{"s":"קריין","x":"יש לה שלוש רמות. הפרט, למשל עובד שלומד קורס בניתוח נתונים."},{"s":"קריין","x":"הצוות, למשל תחקיר אחרי פרויקט וכתיבת נוהל חדש. והארגון, כשכל החברה מאמצת שיטת עבודה חדשה."},{"s":"קריין","x":"והתנאי הרביעי, מבנה ארגוני. הוא קובע איך מחלקים את העבודה, הסמכויות והאחריות // ===== diagrams for the strategy course: hand-drawn inline SVG (sharp on every screen, themed by the page's colours) =====
// canvas 480 wide; text ≥14 units so it stays readable on a phone. Classes are styled in shell.html (.fig ...).
const FIG = (() => {
  const W = 480;
  const t = (x, y, s, cls = '') => `<text x="${x}" y="${y}" text-anchor="middle" direction="rtl" class="${cls}">${s}</text>`;
  // a rounded box with centred lines: first line bold unless plain
  const box = (x, y, w, h, cls, lines, o = {}) => {
    const n = lines.length, lh = o.lh || 19, y0 = y + h / 2 - (n - 1) * lh / 2 + 5;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 12}" class="${cls}"/>` + lines.map((s, i) => t(x + w / 2, y0 + i * lh, s, i === 0 && !o.plain ? 'tb' : 'ts')).join('');
  };
  const mk = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>`;
  const ar = (id, x1, y1, x2, y2, cls = 'ln', both = false) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" marker-end="url(#${id})"${both ? ` marker-start="url(#${id})"` : ''}/>`;
  const svg = (h, label, body) => `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${label}">${body}</svg>`;
  const F = {};

  // ---- unit 1 ----
  F.levels = {cap: 'שלוש רמות האסטרטגיה: כל רמה עונה על שאלה אחרת, וכל רמה מתרגמת את זו שמעליה לפעולה.', svg: svg(300, 'שלוש רמות האסטרטגיה', mk('a-lv') +
    box(100, 12, 280, 78, 'hi', ['אסטרטגיה תאגידית', 'איפה נתחרה? באילו עסקים,', 'וכמה משאבים לכל יחידה?']) +
    box(60, 108, 360, 78, 'bx', ['אסטרטגיה עסקית (תחרותית)', 'איך ננצח את המתחרים הישירים', 'בשוק מסוים?']) +
    box(20, 204, 440, 78, 'bx', ['אסטרטגיה פונקציונלית', 'איך כל מחלקה תממש את הכיוון?', 'משאבי אנוש, שיווק, IT, כספים']) +
    ar('a-lv', 470, 30, 470, 270) + t(458, 152, 'מתרגמים', 'ts vert'))};

  F.tasks = {cap: 'חמש משימות הניהול האסטרטגי הן מעגל: אחרי ההערכה מתקנים וחוזרים לשלבים הקודמים. זה לא תהליך חד פעמי.', svg: svg(330, 'חמש משימות הניהול האסטרטגי במעגל', mk('a-tk') + (() => {
    const L = [['1. חזון, ערכים', 'ומשימת הארגון'], ['2. הצבת יעדים', 'ומטרות (SMART)'], ['3. ניסוח', 'האסטרטגיה'], ['4. יישום', 'וביצוע'], ['5. הערכה', 'ותיקון']];
    const A = [-90, -18, 54, 126, 198].map(d => d * Math.PI / 180), RX = 168, RY = 116, cx = 240, cy = 166;
    let s = '';

  m.innerHTML = `<div class="exam-bar"><b>${esc(ex.title)}</b><span class="note" id="xcount">${answered()}/${total} נענו</span><span class="num" id="xclock">${clock()}</span><button class="btn sm" id="xend">הגשה</button></div>
    <h3 class="lh">חלק א׳ · שאלות אמריקאיות (4 נק׳ לשאלה)</h3>
    ${ex.mc.map((q, k) => `<div class="qcard" id="xq${k}"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.q)}</div><div class="opts">${q.o.map((o, i) => `<button class="opt ${X.ans[k] === i ? 'sel' : ''}" data-xm="${k}:${i}"><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`).join('')}</div></div>`).join('')}
    <h3 class="lh">חלק ב׳ · נכון / לא נכון עם נימוק (6 נק׳ לשאלה)</h3>
    ${ex.tf.map((q, k) => `<div class="qcard" id="xt${k}"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.s)}</div><div class="opts tfopts">${tfButtons('x' + k, X.tf[k], false)}</div>
      <label class="field tfwhy">נימוק (עד שתי שורות)<textarea data-xw="${k}" rows="2" maxlength="300">${esc(X.why[k] || '')}</textarea></label></div>`).join('')}
    <div class="row"><button class="btn primary big" id="xend2">הגשת המבחן</button></div>`;
  const count = () => { const c = $('#xcount'); if (c) c.textContent = `${answered()}/${total} נענו`; };
  m.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => { const [k, i] = b.dataset.xm.split(':').map(Number); X.ans[k] = i; keepX(); m.querySelectorAll(`[data-xm^="${k}:"]`).forEach(x => x.classList.toggle('sel', x === b)); count(); });
  m.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { const [k, v] = b.dataset.tf.split(':'); const n = +k.slice(1); X.tf[n] = v === 'true'; keepX(); m.querySelectorAll(`[data-tf^="${k}:"]`).forEach(x => x.classList.toggle('sel', x === b)); count(); });
  m.querySelectorAll('[data-xw]').forEach(t => t.oninput = () => { X.why[t.dataset.xw] = t.value; clearTimeout(t.kt); t.kt = setTimeout(keepX, 400); });
  const end = () => { const miss = total - answered(); if (!confirm(miss ? `נשארו ${miss} שאלות בלי תשובה. להגיש בכל זאת?` : 'להגיש את המבחן?')) return; finish(); };
  $('#xend').onclick = end; $('#xend2').onclick = end;
}
// points: 4 per right answer in part A, 3 per right mark in part B, and 3 more for each reasoning the student checks against the model one
function points() {
  const ex = X.ex, a = ex.mc.filter((q, k) => X.ans[k] === q.a).length, b = ex.tf.filter((q, k) => X.tf[k] === q.a).length, w = ex.tf.filter((q, k) => X.tf[k] === q.a && X.self[k]).length;
  return {a, b, w, score: Math.round((a * 4 + b * 3 + w * 3) * 100 / (ex.mc.length * 4 + ex.tf.length * 6))};
}
// time ran out while the student was elsewhere on the site: the exam is handed in, and they are told so
function doneMsg() { if (view === 'exam') { render(); window.scrollTo(0, 0); } else { nav(); toast('הזמן נגמר והמבחן הוגש. התוצאות מחכות בלשונית מבחנים.'); } }
function finish() {
  X.done = true; clearInterval(X.t);
  const ex = X.ex, p = points();
  ex.mc.forEach((q, k) => { if (X.ans[k] != null) S.mcq[q.id] = {ok: X.ans[k] === q.a, n: ((S.mcq[q.id] || {}).n || 0) + 1}; });
  ex.tf.forEach((q, k) => { if (X.tf[k] != null) S.mcq[q.id] = {ok: X.tf[k] === q.a, n: ((S.mcq[q.id] || {}).n || 0) + 1}; });
  S.exams.push({id: X.id, ts: Date.now(), score: p.score, right: p.a + p.b, sec: Math.round((Date.now() - X.start) / 1000)}); X.rec = S.exams.length - 1; save(); keepX(); doneMsg();
}
function drawResult(m) {
  const ex = X.ex, p = points();
  const byUnit = {}; ex.mc.forEach((q, k) => { if (X.ans[k] !== q.a && q.unit !== 'exam') byUnit[q.unit] = (byUnit[q.unit] || 0) + 1; }); ex.tf.forEach((q, k) => { if (X.tf[k] !== q.a && q.unit !== 'exam') byUnit[q.unit] = (byUnit[q.unit] || 0) + 1; });
  const weak = Object.entries(byUnit).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u]) => U[u]).filter(Boolean);
  m.innerHTML = crumbs(['מבחנים', 'exam'], ['תוצאות']) + `<header class="page"><h2>ציון: <span id="xscore">${p.score}</span></h2>
    <p class="lead">חלק א׳: ${p.a}/${ex.mc.length} נכונות. חלק ב׳: ${p.b}/${ex.tf.length} סימונים נכונים. <span id="xself">${p.w ? `ועוד ${p.w} נימוקים שסימנתם כטובים.` : ''}</span></p>
    <p class="note">בחלק ב׳ הנימוק שווה חצי מהנקודות. השוו את הנימוק שלכם לנימוק לדוגמה, וסמנו ✓ אם אמרתם את אותו דבר: הציון יתעדכן.</p>
    ${weak.length ? `<p class="note">כדאי לחזור על: ${weak.map(u => `<a href="#unit/${u.id}" data-go="unit" data-arg="${u.id}">${esc(u.title)}</a>`).join(' · ')}</p>` : ''}</header>
    <h3 class="lh">חלק א׳</h3>
    ${ex.mc.map((q, k) => `<div class="qcard"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.q)}</div><div class="opts">${q.o.map((o, i) => `<button class="opt ${i === q.a ? 'right' : i === X.ans[k] ? 'wrong' : ''}" disabled><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`).join('')}</div><div class="expl">${explain(q, X.ans[k] ?? null)}</div></div>`).join('')}
    <h3 class="lh">חלק ב׳</h3>
    ${ex.tf.map((q, k) => `<div class="qcard"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.s)}</div><div class="opts tfopts">${tfButtons('r' + k, X.tf[k], true, q.a)}</div><div class="expl">${explainTF(q, X.tf[k] ?? null, X.why[k] || '')}</div>
      ${X.tf[k] === q.a ? `<label class="selfchk"><input type="checkbox" data-self="${k}" ${X.self[k] ? 'checked' : ''}> הנימוק שלי אומר את אותו דבר (+3 נק׳)</label>` : ''}</div>`).join('')}
    <div class="row"><button class="btn primary" id="xback">חזרה למבחנים</button></div>`;
  m.querySelectorAll('[data-self]').forEach(c => c.onchange = () => {
    X.self[c.dataset.self] = c.checked; const p2 = points(); $('#xscore').textContent = p2.score; $('#xself').textContent = p2.w ? `ועוד ${p2.w} נימוקים שסימנתם כטובים.` : '';
    if (S.exams[X.rec]) { S.exams[X.rec].score = p2.score; save(); }
  });
  $('#xback').onclick = () => { X.id = null; X.done = false; go('exam'); };
}

// another tab or device may have moved on: take its newer progress when this tab comes back (not during an exam or while listening)
async function resyncC() {
  if (!ACC.user() || (X.id && !X.done) || resyncC.busy) return; resyncC.busy = true;
  try { const b = S._at; await sync(); if (S._at !== b && view !== 'listen') { nav(); render(); } } finally { resyncC.busy = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resyncC(); });
window.addEventListener('storage', e => { if (ACC.user() && e.key === ACC.key(CCOURSE) && !(X.id && !X.done) && view !== 'listen') { loadS(); nav(); render(); } });
// ---------- boot ----------
$('#main').innerHTML = '<p class="note" style="text-align:center;padding:40px 0">טוען…</p>';
(function () { const b = $('#cbar b'); if (b) b.textContent = 'אסטרטגיה עסקית'; const a = $('#cbar a'); if (a) { a.href = '/'; a.removeAttribute('data-go'); } const bl = $('.brandlink'); if (bl) { bl.href = '/'; bl.removeAttribute('data-go'); } })();
ACC.ready().catch(() => {}).then(async () => {
  if (!ACC.user()) { try { sessionStorage.setItem('silas_return', location.pathname + location.hash); } catch (e) {} location.replace('/'); return; }
  if (ACC.user().blocked) { location.replace('/'); return; }
  ACC.onBlocked = () => location.replace('/');
  loadS(); await sync();
  const p = parseHash(); view = p.v; arg = p.a; if (!VIEWS.some(v => v[0] === view) && !PARENT[view]) view = 'dash';
  if (restoreX() && !X.done) { view = 'exam'; arg = null; try { history.replaceState(null, '', '#exam'); } catch (e) {} }
  nav(); render();
});
</script>
