על העולם שמסביב (ריבית, חוק, טרנד), פורטר מסתכל על הזירה (מתחרים, חדשים, תחליפים, ספקים, לקוחות). ובפורטר: \"כוח חזק = רווח חלש\", חוץ מחסמי כניסה – \"חסם גבוה = רווח גבוה\". ענף אחר שעושה אותו דבר = תחליף; ענף אחר שצריך יחד = משלים. כחול = חדש וריק, אדום = צפוף ומדמם.","blocks":[{"t":"h","x":"מה זה ענף?"},{"t":"p","x":"<b>ענף</b> הוא קבוצת חברות שפועלות באותו שוק, מציעות מוצרים או שירותים דומים, עונות על <b>אותו צורך</b> של הלקוח ומתחרות על אותם לקוחות ומשאבים."},{"t":"p","x":"הנקודה החשובה: את הענף מגדירים <b>מנקודת המבט של הלקוח</b>. אם שני מוצרים פותרים ללקוח את אותו צורך, הם שייכים לאותה תחרות. לכן מוצר שנראה שונה יכול עדיין להתחרות בנו."},{"t":"p","x":"ההגדרה היא החלטה אסטרטגית (\"איפה משחקים\"): האם סרט שייך לענף הקולנוע, או לענף הפנאי והבילוי הרחב? הגדרה צרה או רחבה משנה מי נחשב מתחרה."},{"t":"table","head":["מושג","מה זה","דוגמה"],"rows":[["<b>סקטור</b>","הקבוצה הרחבה ביותר: כמה ענפים עם פעילות דומה.","הסקטור הפיננסי: בנקים, ביטוח, בתי השקעות."],["<b>ענף</b>","חברות שמציעות מוצרים או שירותים דומים בתוך סקטור.","ענף הבנקאות."],["<b>פלח שוק</b>","תת-קבוצה של <b>לקוחות</b> בתוך הענף, עם מאפיינים משותפים.","בנקאות פרטית לעשירים."]]},{"t":"p","x":"סקטור משפיע על השקעות גדולות ומגמות מאקרו; ענף קובע את האסטרטגיה התחרותית (מחיר, מיתוג); פלח שוק מאפשר התאמה ללקוחות מסוימים."},{"t":"trap","x":"פלח שוק הוא קבוצת <b>לקוחות</b>, לא קבוצת חברות. אם בשאלה כתוב \"לקוחות צעירים\", \"לקוחות עשירים\", \"בני דור Z\" בתוך ענף – זה פלח שוק."},{"t":"h","x":"כוחות מניעי שינוי"},{"t":"p","x":"<b>הכוחות המניעים את השוק</b> הם הכוחות הכלכליים, החברתיים, הטכנולוגיים והרגולטוריים שמעצבים את צמיחת הענף, משנים את מבנה התחרות וקובעים אם כדאי לפעול בו. הם יכולים לשנות את תנאי השוק בבת אחת, ולכן חברה חייבת לעקוב אחריהם ולהתאים את האסטרטגיה."},{"t":"table","head":["הכוח המוביל","דוגמה מהשיעור"],"rows":[["<b>שינויים טכנולוגיים</b>","אנרגיה ירוקה, סוללות; בינה מלאכותית שמחליפה תפקידים."],["<b>דינמיקות צרכניות</b>","מעבר למנויים (ספוטיפיי, נטפליקס); מודעות לקיימות."],["<b>שינויים רגולטוריים</b>","חוקי הגבלים נגד ענקיות; תקנות פרטיות (GDPR)."],["<b>גלובליזציה</b>","מלחמות סחר; ייצור בעלות נמוכה בחו״ל."]]},{"t":"p","x":"הכוחות נחלקים לגורמים <b>פנימיים</b> לענף (למשל חדשנות טכנולוגית) ו<b>חיצוניים</b> (למשל רגולציה ממשלתית). בניתוח ענף בודקים גם: קצב צמיחה, שלב בגיל הענף (מחזור חיים), חסמי כניסה, רמת טכנולוגיה ובידול, ורווחיות ענפית."},{"t":"p","x":"<b>אפקט המלכה האדומה</b>: כמו עליסה שרצה ולא זזה. כל חברה משתפרת, אבל גם המתחרים משתפרים באותו קצב, ולכן אף אחת לא מתקדמת ביחס לאחרות. התוצאה: התחרות בענף רק מתחזקת (למשל אפל וסמסונג שמשיקות דגמים חדשים בלי הפסקה)."},{"t":"h","x":"מאקרו סביבה: מודל PESTEL(G)"},{"t":"p","x":"<b>PESTEL(G)</b> הוא מודל לניתוח ה<b>מאקרו-סביבה</b>: הגורמים הגדולים <b>מחוץ לענף</b> שהחברה לא שולטת בהם, אבל הם משפיעים על כל הענף. במבחן הוא מופיע גם בשם <b>PESTEN</b> – זה אותו מודל."},{"t":"table","head":["אות","גורם","מה בודקים","מילים בסיפור"],"rows":[["P","<b>פוליטי</b>","מדיניות ממשלה, רגולציה, יציבות פוליטית","ממשלה, מדיניות, מלחמת סחר, בנק ישראל מסדיר"],["E","<b>כלכלי</b>","אינפלציה, ריבית, תעסוקה, כוח קנייה","ריבית עלתה, אינפלציה, מיתון, שער חליפין"],["S","<b>חברתי</b>","מגמות חברתיות ותרבותיות, הרגלי צריכה","מודעות גוברת, טרנד, אורח חיים, קניות אונליין"],["T","<b>טכנולוגי</b>","חידושים טכנולוגיים והשפעתם","AI, אוטומציה, טכנולוגיה חדשה"],["E","<b>סביבתי</b>","אקלים, אנרגיה ירוקה, רגולציה סביבתית","פליטות פחמן, אנרגיה סולארית, שינויי אקלים"],["L","<b>משפטי</b>","חוקים מקומיים ובינלאומיים","חוק פרטיות, GDPR, חקיקה"],["G","<b>גלובלי</b>","השפעות כלכליות וגיאופוליטיות עולמיות","שרשראות אספקה עולמיות, מלחמה בחו״ל, תחרות בין מעצמות"]]},{"t":"p","x":"איך מזהים שהשאלה היא על PESTEL: החברה רוצה להבין <b>שינויים בסביבה הכללית</b> – כלכלה, חברה, טכנולוגיה, חוק, אקלים – ואיך הם ישפיעו על הענף."},{"t":"example","title":"איזה גורם ב-PESTEL?","x":"בנק ישראל העלה את הריבית, והביקוש למשכנתאות ירד. → <b>E כלכלי</b> (ריבית). הצרכנים בישראל עוברים לקנות אונליין, וזה פוגע ברשתות הקמעונאות. → <b>S חברתי</b> (שינוי בהרגלי צריכה). האיחוד האירופי הגביל פליטות פחמן של מכוניות. → <b>E סביבתי</b>."},{"t":"trap","x":"יש שתי אותיות E: <b>כלכלי</b> (Economic: ריבית, אינפלציה) ו<b>סביבתי</b> (Environmental: אקלים, פליטות). ובחירת המודל: PESTEL = הסביבה <b>הכללית</b> (מאקרו). חמשת הכוחות = התחרות <b>בתוך הענף</b> (מיקרו). SWOT = חוזקות וחולשות של <b>החברה</b> יחד עם הסביבה. שרשרת הערך = הפעילויות <b>בתוך</b> החברה."},{"t":"h","x":"מיקרו סביבה: מודל חמשת הכוחות התחרותיים של פורטר"},{"t":"p","x":"המודל של <b>מייקל פורטר</b> בודק את <b>עוצמת התחרות בענף</b>, וממנה מעריכים את <b>פוטנציאל הרווחיות</b> של הענף. זה מודל לניתוח <b>ענף</b>, לא חברה אחת."},{"t":"p","x":"הכלל הכי חשוב: <b>ככל שהכוחות חזקים יותר → התחרות גבוהה יותר → המחירים יורדים → הרווחיות בענף נמוכה יותר.</b> מנהל שבודק רק את המתחרים הישירים מפספס את שאר הכוחות."},{"t":"table","head":["הכוח","מה זה","מתי הכוח חזק (רע לענף)","מתי הכוח חלש (טוב לענף)"],"rows":[["<b>1. עוצמת התחרות בין המתחרים הקיימים</b>","כמה קשה הקרב בין החברות שכבר בענף","הרבה שחקנים בגודל דומה, צמיחה איטית, מחסומי יציאה גבוהים, עלויות מעבר נמוכות, אין בידול","מעט שחקנים, שוק צומח, מוצרים מבודלים"],["<b>2. איום כניסת מתחרים חדשים</b>","כמה קל לחברה חדשה להיכנס","<b>חסמי כניסה נמוכים</b> (למשל מסעדות)","<b>חסמי כניסה גבוהים</b> (רגולציה, השקעה גדולה, יתרון לגודל)"],["<b>3. איום מוצרים תחליפיים</b>","מוצרים <b>מענף אחר</b> שממלאים תפקיד דומה","יש תחליף טוב וזול","קשה להחליף את המוצר"],["<b>4. כוח המיקוח של הספקים</b>","כמה הספקים יכולים להכתיב מחיר","מעט ספקים, מוצר קריטי, ספק יכול לקנות את לקוחותיו","הרבה ספקים חלופיים"],["<b>5. כוח המיקוח של הלקוחות</b>","כמה הלקוחות יכולים להוריד מחיר","לקוחות גדולים ומעטים, קונים כמויות גדולות, עלות מעבר נמוכה","לקוחות רבים ומפוזרים"]]},{"t":"p","x":"ויש גם <b>\"הכוח השישי\": מוצרים משלימים</b> (Complementary Products, הוסיף אנדרו גרוב). הם מוצרים <b>מענף אחר</b> שצריך אותם כדי שהמוצר שלנו יעבוד: דלק וביטוח לרכב. המודל עצמו נשאר עם חמישה כוחות, אבל נהוג לבדוק גם אותם."},{"t":"table","head":["סוג מוצר (דוגמת ענף הרכב)","מה זה","דוגמה"],"rows":[["<b>מוצר מתחרה</b>","מוצר של חברה אחרת <b>באותו ענף</b>","רכב של הונדה מול רכב של מיצובישי"],["<b>מוצר תחליפי</b>","מוצר <b>מענף אחר</b> עם תפקוד דומה","אופניים במקום רכב; מים מהברז במקום קוקה קולה; טלפון במקום שעון יד"],["<b>מוצר משלים</b>","מוצר <b>מענף אחר</b> שצריך אותו כדי להשתמש במוצר","דלק, ביטוח רכב. אם הביטוח מתייקר מאוד – פחות קונים רכב"]]},{"t":"p","x":"על התחליפים: <b>יחס האיכות-מחיר של המוצרים התחליפיים קובע תקרה לשולי הרווח בענף</b>. אם תעלו מחיר יותר מדי, הלקוח יעבור לתחליף."},{"t":"h","x":"כוח 1: עוצמת התחרות – גורם מול ממד"},{"t":"list","x":["<b>גורמים</b> שמגבירים את עוצמת התחרות (הסיבה המבנית): צמיחה איטית בביקוש, מחסומי יציאה גבוהים (כלכליים, רגשיים), הרבה שחקנים, עלויות מעבר נמוכות, בעיות בידול, עלויות קבועות גבוהות וקיבולת ייצור עודפת, עניין אסטרטגי של המתחרים.","<b>ממדים</b> של תחרות (איך התחרות נראית בפועל): תחרות מחירים, קמפיינים פרסומיים, השקת מוצרים חדשים, שיפור שירות לקוחות, הרחבת אחריות.","המטרה של הפירמה: לצמצם את ה<b>גורמים</b>, כי הם הסיבה."]},{"t":"h","x":"כוח 2: חסמי כניסה"},{"t":"p","x":"<b>חסם כניסה</b> הוא כל דבר שמקשה על חברה חדשה להיכנס לענף. חסמים גבוהים <b>מגינים</b> על החברות הקיימות ושומרים על הרווחיות שלהן. חסמים נמוכים = הרבה חברות נכנסות = הרווחיות נשחקת (כמו בקפה או במלחמת הקוטג׳)."},{"t":"table","head":["חסם כניסה","הסבר","דוגמה"],"rows":[["<b>יתרון לגודל</b>","חברה גדולה מייצרת בעלות נמוכה יותר ליחידה. חדש וקטן לא יכול להתחרות במחיר.","שופרסל, קופות חולים עם הרבה סניפים"],["<b>נאמנות למותג</b>","הלקוחות קשורים למותג החזק הקיים.","קוקה קולה"],["<b>יתרון בעלויות</b>","ותק, ניסיון וקשרים עם ספקים מאפשרים מחיר נמוך.","חברות ותיקות בענף"],["<b>עלויות מעבר ללקוח</b>","ללקוח קשה או יקר לעזוב (התחייבות ארוכה).","חוזה ארוך"],["<b>השקעה גדולה נדרשת</b>","צריך הרבה כסף לציוד ותשתית.","חברת חשמל, סלולר"],["<b>חוקים ותקנות</b>","צריך רישיון, יש רגולציה.","תעופה, תקשורת"],["<b>שליטה בשרשרת הערך</b>","הקיימים שולטים בערוצי ההפצה או ביבוא.","ענף ורטיקלי"]]},{"t":"trap","x":"<b>יתרון לגודל לא מוריד את הרווחיות בענף – הוא מעלה אותה.</b> יתרון לגודל הוא <b>חסם כניסה</b>: הוא מרחיק מתחרים חדשים, ולכן הפירמות הקיימות מרוויחות יותר. היגד שאומר \"ככל שיש יתרון לגודל, הרווחיות נמוכה יותר\" – <b>לא נכון</b>."},{"t":"h","x":"כוחות 4 ו-5: ספקים ולקוחות"},{"t":"p","x":"הכוח של הספקים הוא בדיוק ההפך מהכוח של הלקוחות: אם בקשר מסוים ללקוח יש כוח, לספק אין, ולהפך."},{"t":"table","head":["ספק חזק כאשר...","לקוח חזק כאשר..."],"rows":[["המוצר שלו <b>קריטי</b> ללקוחות","הוא קונה <b>כמויות גדולות</b>"],["יש <b>מעט ספקים</b> או מותג חזק","יש <b>הרבה יצרנים ומעט קונים</b>"],["הלקוחות <b>שבויים</b> ותלויים בו","<b>עלות המעבר</b> שלו לספק אחר נמוכה"],["יש לו <b>הרבה לקוחות</b> ולכן אינו תלוי באף אחד","הוא מהווה <b>חלק גדול מההכנסות</b> של הספק"],["יש לו עובדים מאוגדים חזקים","הוא לקוח אסטרטגי וחשוב לתוכנית העסקית"],["הוא יכול <b>לרכוש את לקוחותיו</b> (להיכנס לתחום שלהם)","הוא יכול <b>לרכוש את ספקיו</b> (לייצר בעצמו)"]]},{"t":"p","x":"<b>מונופסון</b> = ענף שבו יש <b>רק לקוח אחד</b> ששולט בכל הביקוש (למשל משרד הביטחון מול יצרני נשק). הוא קובע את המחיר ואת שולי הרווח – כוח לקוחות חזק במיוחד. (מונופול = ספק/מוכר יחיד.)"},{"t":"example","title":"איזה כוח?","x":"יצרנית הרחפנים SkyCam קונה מעבד מיוחד רק מספק אחד בעולם. הספק העלה מחיר ב-30% והחברה נאלצה לשלם. → <b>כוח מיקוח של ספקים</b> חזק (ספק יחיד, מוצר קריטי). לעומת זאת: חנויות הספרים העצמאיות נסגרות כי אנשים קוראים ספרים דיגיטליים בטאבלט → <b>איום תחליפים</b> (ענף אחר, אותו צורך: לקרוא)."},{"t":"p","x":"<b>ביקורת על המודל</b> (שורה אחת): הוא <b>סטטי</b>, ולכן מתקשה לנבא כשכללי המשחק משתנים מהר, למשל בזמן חדשנות טכנולוגית."},{"t":"trap","x":"תחליפי ↔ מתחרה ↔ משלים: אם המוצר האחר <b>באותו ענף</b> – מתחרה (כוח 1). אם הוא <b>בענף אחר ועושה אותו דבר</b> – תחליפי (כוח 3). אם הוא <b>בענף אחר וצריך אותו יחד</b> עם המוצר – משלים (הכוח השישי). ושימו לב לכיוון: <b>כוח חזק = רע לרווחיות</b>, לא טוב."},{"t":"h","x":"אסטרטגיית אוקיינוס כחול"},{"t":"p","x":"<b>אוקיינוס כחול</b> (Blue Ocean Strategy) = יצירת <b>שוק חדש</b> שעוד לא קיים, שבו <b>אין תחרות ישירה</b>, וכך המתחרים הופכים ללא רלוונטיים. הבסיס הוא <b>חדשנות בערך</b> (Value Innovation): להעלות את הערך ללקוח ובמקביל לוותר על אלמנטים לא חיוניים שעולים כסף."},{"t":"table","head":["","אוקיינוס אדום","אוקיינוס כחול"],"rows":[["השוק","שוק <b>קיים</b>, צפוף","שוק <b>חדש</b>, קטגוריה חדשה"],["המתחרים","נאבקים על אותו נתח שוק","לא רלוונטיים – אין תחרות ישירה"],["איך מנצחים","הורדת מחירים, בידול, יעילות","חדשנות בערך: ערך גבוה + ויתור על מה שלא חשוב"],["תוצאה","שחיקת רווחים","יתרון לטווח ארוך"],["מילים בסיפור","\"מלחמת מחירים\", \"אותם לקוחות\", \"מוצרים דומים\"","\"קטגוריה חדשה\", \"אין מתחרים\", \"שילב בין שני עולמות\""]]},{"t":"p","x":"דוגמאות מהשיעור: Cirque du Soleil (שילוב תיאטרון וקרקס), Netflix, Tesla, Airbnb, iPhone; ובישראל Waze, Mobileye, Lemonade, OrCam, Watergen."},{"t":"example","title":"כחול או אדום?","x":"רשתות הפיצה בעיר מורידות מחירים כל חודש כדי לגנוב לקוחות זו מזו. → <b>אוקיינוס אדום</b>. חברה ישראלית פיתחה מכשיר שמפיק מים מהאוויר – מוצר שלא היה קיים ואין לו מתחרים ישירים. → <b>אוקיינוס כחול</b>."},{"t":"trap","x":"המטרה של אוקיינוס כחול היא <b>לא</b> \"לנצח את המתחרים בשוק הקיים\" ו<b>לא</b> מלחמת מחירים – זה אוקיינוס אדום. המטרה היא <b>ליצור שוק חדש</b> ולהפוך את התחרות ללא רלוונטית. ואוקיינוס כחול הוא לא אחת מחמש האסטרטגיות הגנריות של פורטר."},{"t":"h","x":"KSF ו-F-KSF"},{"t":"p","x":"<b>KSF (Key Success Factors) – גורמי הצלחה קריטיים</b>: הדברים ש<b>כל חברה בענף</b> חייבת לעשות טוב כדי לשרוד ולהצליח <b>היום</b> בענף הזה. זה ה\"X פקטור\" של הזירה: איך מנצחים בה."},{"t":"p","x":"<b>F-KSF (Future KSF) – גורמי הצלחה עתידיים</b>: גורמים ש<b>עוד לא</b> קריטיים, אבל <b>צפויים</b> להפוך לקריטיים בעתיד. חברה צריכה לזהות אותם מוקדם."},{"t":"table","head":["ענף","KSF (היום)","F-KSF (בעתיד)"],"rows":[["רכב חשמלי","סוללות מתקדמות, רשת טעינה, עמידה בתקני פליטה","רכבים אוטונומיים מלאים"],["פינטק","אבטחת סייבר, ממשק נוח, ציות לרגולציה","שימוש מתקדם ב-AI"],["קמעונאות דיגיטלית","לוגיסטיקה והפצה מהירה, ניתוח נתונים, התאמה אישית","משלוחים ברחפנים"],["בריאות","איכות טיפול","AI לאבחון רפואי מוקדם"]]},{"t":"p","x":"ארגון שלא יודע להגדיר את ה-KSF של הזירה שלו עלול להשקיע ביכולות הלא נכונות ולא להצליח לאורך זמן."},{"t":"trap","x":"KSF שייך ל<b>ענף</b> (מה כולם צריכים כדי להצליח בו). יכולת ליבה (יחידה 3) שייכת ל<b>חברה</b> אחת (במה היא טובה). ומילת המפתח ל-F-KSF: <b>\"בעתיד\", \"צפוי\", \"בשנים הבאות\"</b>."},{"t":"h","x":"מסקנות: עד כמה הענף אטרקטיבי?"},{"t":"p","x":"בסוף הניתוח שואלים: האם כדאי להיכנס לענף או להשקיע בו? ענף <b>אטרקטיבי</b> = ענף שאפשר להרוויח בו לאורך זמן."},{"t":"table","head":["קריטריון","ענף אטרקטיבי","ענף פחות אטרקטיבי"],"rows":[["רמת התחרות","תחרות מתונה","תחרות עזה ושחיקת מחירים (סופרמרקטים)"],["חסמי כניסה","<b>גבוהים</b> – מגינים על הקיימים","נמוכים – קל להיכנס"],["כוח הלקוחות","לקוחות מפוזרים, בלי כוח","לקוחות גדולים (רשתות שיווק)"],["כוח הספקים","הרבה ספקים חלופיים","תלות במעט ספקים (שבבים)"],["תחליפים","קשה להחליף (מותגי יוקרה)","הרבה תחליפים זמינים"],["צמיחה","צמיחה גבוהה (AI)","שוק רווי (עיתונות מודפסת)"],["רווחיות ממוצעת","שולי רווח גבוהים (תוכנה, SaaS)","שולי רווח נמוכים (חקלאות)"],["רגולציה","מינימלית","כבדה (בנקאות)"],["יכולת בידול","אפשר לבדל (שעונים שוויצריים)","אי אפשר – מלחמת מחירים (סלולר)"],["עמידות למיתון","ביקוש יציב (מוצרי יסוד, בריאות)","רגיש למשבר (תיירות יוקרה)"]]},{"t":"p","x":"סיכום אחד לזכור: <b>רווחיות יציבה + צמיחה גבוהה + חסמי כניסה גבוהים + כוח מיקוח נמוך של לקוחות וספקים = ענף אטרקטיבי.</b> גם ענף עם <b>מותגים חזקים</b> הוא אטרקטיבי: מותג חזק מונע שחיקת מחירים, מאפשר מחיר פרמיה ויוצר חסם כניסה."},{"t":"exam","x":"איך שואלים: \"איזה מודל יעזור להעריך את <b>עוצמת התחרות</b> / <b>האטרקטיביות</b> של הענף?\" → חמשת הכוחות. \"איזה מודל ינתח שינויים <b>כלכליים, טכנולוגיים, חברתיים</b>?\" → PESTEL(G). \"מה המטרה של אוקיינוס כחול?\" → שוק חדש בלי מתחרים. ובנכון/לא נכון: כיוון ההשפעה – חסמי כניסה גבוהים ויתרון לגודל <b>מעלים</b> רווחיות; כוחות חזקים <b>מורידים</b> רווחיות."}],"cheat":["ענף = חברות שמציעות מוצרים דומים לאותו צורך; מוגדר מנקודת המבט של הלקוח","סקטור / ענף / פלח שוק = הכי רחב (פיננסים) / חברות דומות (בנקאות) / קבוצת לקוחות (בנקאות לעשירים)","כוחות מניעים = כוחות כלכליים, חברתיים, טכנולוגיים ורגולטוריים שמשנים את הענף","אפקט המלכה האדומה = כולם משתפרים באותו קצב, אף אחד לא מתקדם יחסית","PESTEL(G) / PESTEN = מאקרו-סביבה: פוליטי, כלכלי, חברתי, טכנולוגי, סביבתי, משפטי, גלובלי","E כלכלי מול E סביבתי = ריבית ואינפלציה מול אקלים ופליטות","חמשת הכוחות של פורטר = מיקרו: עוצמת התחרות בענף ← פוטנציאל הרווחיות","הכוחות = תחרות קיימת, מתחרים חדשים, תחליפים, ספקים, לקוחות","כוחות חזקים = תחרות גבוהה, מחירים יורדים, רווחיות נמוכה","חסמי כניסה גבוהים = מגינים על הקיימים ← רווחיות גבוהה יותר","יתרון לגודל = חסם כניסה (מעלה רווחיות, לא מוריד)","מוצר תחליפי = ענף אחר, אותו תפקוד; קובע תקרה לשולי הרווח","מוצר משלים (הכוח השישי, גרוב) = ענף אחר, צריך אותו יחד (דלק לרכב)","ספק חזק = מעט ספקים, מוצר קריטי, לקוחות שבויים","לקוח חזק = קונה הרבה, עלות מעבר נמוכה, הרבה יצרנים ומעט קונים","מונופסון = לקוח יחיד ששולט בביקוש וקובע מחיר","גורם מול ממד = הסיבה לתחרות מול האופן שבו היא נראית (מחירים, פרסום)","אוקיינוס כחול = שוק חדש, אין מתחרים, חדשנות בערך","אוקיינוס אדום = שוק קיים וצפוף, מלחמת מחירים, שחיקת רווחים","KSF = מה שחייבים לעשות טוב כדי להצליח בענף היום","F-KSF = גורמי הצלחה שצפויים להיות קריטיים בעתיד","ענף אטרקטיבי = חסמים גבוהים, צמיחה, רווחיות יציבה, ספקים ולקוחות חלשים","מותגים חזקים בענף = פחות שחיקת מחירים, פרמיה, חסם כניסה ← אטרקטיבי"],"mcq":[{"id":"s2-1","q":"חברת HomeKey מוכרת דירות חדשות. בחודשים האחרונים בנק ישראל העלה את הריבית כמה פעמים, ומשפחות רבות דוחות קניית דירה כי המשכנתא התייקרה. לפי מודל PESTEL(G), לאיזה גורם שייך השינוי?","o":["פוליטי (P)","כלכלי (E)","חברתי (S)","משפטי (L)"],"a":1,"why":"ריבית היא משתנה כלכלי מובהק (כמו אינפלציה ותעסוקה). מילת המפתח: \"העלה את הריבית\".","w":["נכון שבנק ישראל הוא גוף ציבורי, אבל ההשפעה כאן היא דרך הריבית – גורם כלכלי, לא מדיניות או יציבות פוליטית.","","גורם חברתי הוא שינוי בטעם או בהרגלים של הציבור; כאן הסיבה כספית – המשכנתא התייקרה.","משפטי = חוק חדש. לא נחקק כאן חוק."]},{"id":"s2-2","q":"רשת חנויות הבגדים UrbanWear מגלה שצעירים רבים מעדיפים בגדים יד שנייה, מתוך תפיסה שקנייה מופרזת היא \"לא מגניבה\". ההנהלה רוצה למפות את המגמה במסגרת ניתוח PESTEL(G). זו דוגמה לגורם:","o":["סביבתי","גלובלי","חברתי","טכנולוגי"],"a":2,"why":"שינוי בטעם, בתפיסות ובדפוסי הצריכה של הציבור הוא גורם חברתי (S). המילים: \"מעדיפים\", \"תפיסה\".","w":["גורם סביבתי עוסק באקלים, בפליטות ובאנרגיה; כאן השינוי הוא בהרגלי הקנייה של אנשים.","גלובלי = השפעות כלכליות וגיאופוליטיות עולמיות (מלחמה, שרשראות אספקה), לא טעם של צעירים.","","אין כאן שום חידוש טכנולוגי."]},{"id":"s2-3","q":"חברת FlyGo שוקלת להיכנס לענף התעופה הזולה. לפני ההחלטה היא רוצה לבדוק עד כמה התחרות בענף חזקה: כמה קל לחברות חדשות להיכנס, כמה כוח יש לספקי המטוסים והדלק, והאם רכבות מהירות יכולות להחליף טיסות קצרות. באיזה מודל עליה להשתמש?","o":["מודל חמשת הכוחות התחרותיים של פורטר","מודל PESTEL(G)","מודל SWOT","מודל שרשרת הערך של פורטר"],"a":0,"why":"כניסת מתחרים, כוח ספקים ותחליפים הם בדיוק כוחות במודל חמשת הכוחות, שבודק את עוצמת התחרות ואת הרווחיות הפוטנציאלית בענף.","w":["","PESTEL בודק את הסביבה הכללית (כלכלה, חוק, טכנולוגיה), לא את מבנה התחרות בתוך הענף.","SWOT בודק חוזקות וחולשות של חברה מסוימת מול הזדמנויות ואיומים; FlyGo עוד לא בענף ורוצה לנתח את הענף.","שרשרת הערך מנתחת פעילויות בתוך החברה, לא את הענף."]},{"id":"s2-4","q":"כדי להקים חברת סלולר חדשה בישראל צריך לקבל רישיון ממשרד התקשורת, להקים אנטנות בכל הארץ ולהשקיע מאות מיליוני שקלים לפני שמגיע הלקוח הראשון. במודל חמשת הכוחות, התיאור מסביר בעיקר מדוע:","o":["כוח המיקוח של הספקים בענף חזק","איום המוצרים התחליפיים גבוה","כוח המיקוח של הלקוחות חלש","איום כניסת מתחרים חדשים נמוך"],"a":3,"why":"רישיון (רגולציה) והשקעה גדולה בתשתית הם חסמי כניסה. חסמים גבוהים = קשה להיכנס = איום כניסת מתחרים חדשים נמוך.","w":["לא מסופר על ספקים או על המחיר שהם גובים.","תחליף הוא מוצר מענף אחר עם אותו תפקוד; הסיפור לא מזכיר תחליף.","הסיפור לא עוסק בלקוחות ובכוח שלהם.",""]},{"id":"s2-5","q":"חברת AquaPure מוכרת מים מינרליים בבקבוקים. בשנים האחרונות יותר ויותר משפחות מתקינות מסנן מים על הברז במטבח ומפסיקות לקנות בקבוקים. לפי מודל חמשת הכוחות, מה התחזק?","o":["עוצמת התחרות בין יצרני המים המינרליים","איום המוצרים התחליפיים","איום כניסת מתחרים חדשים לענף המים המינרליים","כוח המיקוח של הספקים"],"a":1,"why":"מסנן ברז הוא מוצר מענף אחר שממלא את אותו צורך (מים טובים לשתייה). זה מוצר תחליפי.","w":["עוצמת התחרות היא בין חברות באותו ענף (יצרני מים מינרליים אחרים); מסנן ברז אינו מוצר של הענף.","","מתחרה חדש היה עוד יצרן מים מינרליים שנכנס לענף; מסנן מים שייך לענף אחר.","הסיפור לא עוסק בספקים של AquaPure."]},{"id":"s2-6","q":"יצרניות טאבלטים רבות קונות מסך מתקדם מסוג מסוים. רק שתי חברות בעולם מייצרות אותו, ולאחרונה שתיהן העלו מחירים, והיצרניות נאלצו לשלם. מה מתאר המקרה?","o":["כוח מיקוח גבוה של הספקים","כוח מיקוח גבוה של הלקוחות","אוקיינוס כחול","איום תחליפים גבוה"],"a":0,"why":"מעט ספקים + רכיב קריטי = ספקים חזקים שיכולים להעלות מחיר ולשחוק את רווחי הענף.","w":["","כאן הקונים (יצרניות הטאבלטים) הם החלשים – הם נאלצו לשלם.","אוקיינוס כחול הוא יצירת שוק חדש; כאן מדובר בספק שמעלה מחיר.","לא מדובר במוצר מענף אחר שמחליף את הטאבלט."]},{"id":"s2-7","q":"חברת DefendTech מייצרת מערכות מכ\"ם צבאיות. על פי החוק היא רשאית למכור אותן רק למשרד הביטחון, והמשרד קובע בכל מכרז את המחיר. איך נקרא המצב, ומה משמעותו?","o":["מונופול – כוח הספקים חזק","אוקיינוס כחול – אין תחרות","מונופסון – כוח המיקוח של הלקוח חזק מאוד","חסם כניסה – איום מתחרים חדשים גבוה"],"a":2,"why":"לקוח יחיד ששולט בכל הביקוש וקובע את המחיר = מונופסון. זה כוח מיקוח לקוחות חזק במיוחד.","w":["מונופול הוא מוכר יחיד; כאן יש קונה יחיד, והוא החזק.","אוקיינוס כחול הוא שוק חדש שנוצר בזכות חדשנות בערך, לא מצב שבו לקוח אחד מכתיב מחיר.","","חסם כניסה מקטין את איום המתחרים החדשים, והסיפור בכלל עוסק בלקוח."]},{"id":"s2-8","q":"יצרני הקורקינטים החשמליים בישראל ראו ירידה חדה במכירות אחרי שחברות הביטוח העלו מאוד את מחיר הביטוח החובה לכלי דו-גלגלי. מה הוא הביטוח עבור ענף הקורקינטים?","o":["מוצר תחליפי","מוצר מתחרה","ספק בעל כוח מיקוח","מוצר משלים"],"a":3,"why":"ביטוח הוא מוצר מענף אחר שצריך אותו כדי להשתמש בקורקינט. כשהוא מתייקר, הכדאיות לקנות קורקינט יורדת – זה מוצר משלים (\"הכוח השישי\").","w":["תחליף מחליף את הקורקינט (למשל אופניים). ביטוח לא מחליף אותו – הוא נקנה יחד איתו.","מוצר מתחרה הוא קורקינט של יצרן אחר באותו ענף.","חברת הביטוח לא מוכרת חומרי גלם ליצרנים; היא מוכרת שירות ללקוח הסופי לצד המוצר.",""]},{"id":"s2-9","q":"חברת SleepPod פתחה \"תאי שינה\" בשדות תעופה: חדר קטן לשעה-שעתיים, עם מקלחת וטעינה, בלי מסעדה ובלי קבלה. היא לא מתחרה במלונות וגם לא בטרקלינים, והלקוחות שלה הם נוסעים שאף אחד לא שירת קודם. איזו אסטרטגיה מתאימה לתיאור?","o":["אוקיינוס אדום","אוקיינוס כחול","מנהיגות בעלות בשוק המלונות","הגדלת עוצמת התחרות בענף המלונאות"],"a":1,"why":"החברה יצרה קטגוריה חדשה בלי מתחרים ישירים, וויתרה על דברים לא חיוניים (מסעדה, קבלה) כדי לתת ערך חדש – חדשנות בערך = אוקיינוס כחול.","w":["אוקיינוס אדום הוא מאבק על נתח בשוק קיים; כאן נוצר שוק חדש.","","החברה לא מתחרה במלונות ולא מנסה להיות הזולה ביותר בשוק שלהם.","היא דווקא מתרחקת מהתחרות של המלונות, לא מגבירה אותה."]},{"id":"s2-10","q":"בעיר יש שמונה רשתות המבורגרים עם תפריט כמעט זהה. כל חודש אחת מהן מורידה מחיר, והאחרות מגיבות מיד. הרווחים של כולן הולכים ונשחקים. התיאור מתאים ל:","o":["אוקיינוס אדום","מונופסון","אוקיינוס כחול","גורם הצלחה עתידי (F-KSF)"],"a":0,"why":"שוק קיים וצפוף, מוצרים דומים, מלחמת מחירים ושחיקת רווחים – כל הסימנים של אוקיינוס אדום.","w":["","מונופסון הוא לקוח יחיד ששולט בביקוש; כאן יש לקוחות רבים.","אוקיינוס כחול הוא בדיוק ההפך: שוק חדש בלי מתחרים.","F-KSF הוא גורם שיהיה קריטי להצלחה בעתיד, לא תיאור של מצב תחרותי."]},{"id":"s2-11","q":"יועץ שבחן את ענף האפליקציות לתשלומים קבע: \"כל חברה שרוצה להצליח בענף הזה היום חייבת אבטחת סייבר חזקה, ממשק נוח ועמידה ברגולציה הפיננסית.\" מה הוא תיאר?","o":["יכולות ליבה של חברה מסוימת","גורמי הצלחה עתידיים (F-KSF)","גורמי הצלחה קריטיים (KSF)","גורמים במאקרו-סביבה לפי PESTEL"],"a":2,"why":"דברים ש\"כל חברה בענף חייבת\" כדי להצליח \"היום\" הם KSF – גורמי ההצלחה הקריטיים של הענף.","w":["יכולת ליבה שייכת לחברה אחת ובמה שהיא מצטיינת; כאן מדובר בדרישות מכל החברות בענף.","F-KSF הם גורמים שיהיו קריטיים בעתיד; היועץ דיבר על \"היום\".","","PESTEL מתאר כוחות סביבתיים כלליים (ריבית, חוק), לא את מה שחברה צריכה לעשות טוב."]},{"id":"s2-12","q":"מנכ\"לית של רשת מרפאות אומרת: \"היום מספיק לנו רופאים טובים, אבל בעוד חמש-עשר שנים מי שלא יאבחן מחלות בעזרת בינה מלאכותית – פשוט לא ישרוד.\" האבחון בעזרת AI הוא דוגמה ל:","o":["F-KSF","KSF נוכחי","חסם כניסה","מוצר משלים"],"a":0,"why":"גורם שעוד לא קריטי היום אבל צפוי להפוך לקריטי בעתיד (\"בעוד חמש-עשר שנים\") = F-KSF.","w":["","היא אומרת במפורש שהיום זה לא נדרש; KSF הוא מה שקריטי עכשיו.","חסם כניסה מונע מחברות חדשות להיכנס; כאן מדובר במה שנדרש כדי להצליח.","מוצר משלים נקנה יחד עם המוצר מענף אחר; AI כאן הוא דרך עבודה של המרפאה."]},{"id":"s2-13","q":"משקיע בוחן ארבעה ענפים. לפי מה שלמדנו, איזה מהם האטרקטיבי ביותר?","o":["ענף עם חסמי כניסה נמוכים, הרבה מתחרים קטנים ומוצרים זהים","ענף שבו שלושה לקוחות ענק קונים כמעט את כל התוצרת","ענף שתלוי בספק יחיד של חומר גלם קריטי","ענף עם חסמי כניסה גבוהים, צמיחה מהירה ולקוחות רבים ומפוזרים"],"a":3,"why":"חסמים גבוהים מגינים על הרווח, צמיחה מוסיפה ביקוש, ולקוחות מפוזרים חסרי כוח מיקוח – כל אלה סימנים של ענף אטרקטיבי.","w":["חסמים נמוכים, הרבה מתחרים ומוצרים זהים = מלחמת מחירים ושחיקת רווחים.","מעט לקוחות גדולים = כוח מיקוח לקוחות חזק שמוריד מחירים.","ספק יחיד של חומר קריטי = כוח ספקים חזק שמעלה עלויות.",""]},{"id":"s2-14","q":"בענף רשתות הסופרמרקטים, רשת גדולה עם מאות סניפים קונה בכמויות עצומות ולכן משלמת לספקים מחיר נמוך בהרבה ליחידה. לפי מודל חמשת הכוחות, איך משפיע יתרון לגודל כזה על הענף?","o":["הוא מעודד מתחרים חדשים להיכנס ולכן מוריד את הרווחיות","הוא חסם כניסה שמקשה על מתחרים חדשים ולכן תומך ברווחיות הפירמות הקיימות","הוא מגביר את איום התחליפים","הוא לא קשור למודל, כי המודל בודק רק את המתחרים הקיימים"],"a":1,"why":"יתרון לגודל הוא אחד מחסמי הכניסה: חברה חדשה וקטנה לא תוכל להגיע לאותה עלות. חסמים גבוהים מגינים על הקיימים ושומרים על הרווחיות.","w":["זה הכיוון ההפוך: יתרון לגודל מרתיע מתחרים חדשים.","","תחליפים הם מוצרים מענף אחר; יתרון לגודל לא יוצר אותם.","המודל בודק חמישה כוחות, כולל איום כניסת מתחרים חדשים – לא רק את המתחרים הקיימים."]},{"id":"s2-15","q":"בענף ייצור הנייר יש עשר חברות בגודל דומה, הביקוש כמעט לא גדל, המכונות יקרות מאוד ואי אפשר למכור אותן אם עוזבים את הענף, והלקוחות עוברים בקלות מספק לספק. מה ניתן לומר על הענף?","o":["עוצמת התחרות בין המתחרים הקיימים נמוכה","כוח המיקוח של הספקים גבוה","עוצמת התחרות בין המתחרים הקיימים גבוהה","זהו אוקיינוס כחול"],"a":2,"why":"הרבה שחקנים דומים, צמיחה איטית, מחסומי יציאה גבוהים (מכונות שאי אפשר למכור) ועלויות מעבר נמוכות – כל אלה גורמים שמגבירים את עוצמת התחרות.","w":["כל הגורמים בסיפור דווקא מגבירים את התחרות.","הסיפור לא מדבר על הספקים של יצרני הנייר.","","זה ענף ותיק וצפוף – ההפך מאוקיינוס כחול."]},{"id":"s2-16","q":"בנק גדול השיק מחלקה מיוחדת ללקוחות עם הון של מעל 5 מיליון ש\"ח. לפי ההבחנה בין סקטור, ענף ופלח שוק, הלקוחות האלה הם:","o":["סקטור","ענף","מתחרים פוטנציאליים","פלח שוק"],"a":3,"why":"פלח שוק = תת-קבוצה של לקוחות בתוך הענף עם מאפיין משותף (כאן: עושר). זו דוגמת \"בנקאות פרטית לעשירים\".","w":["סקטור הוא הרמה הרחבה ביותר (הסקטור הפיננסי כולו).","ענף הוא קבוצת חברות (ענף הבנקאות), לא קבוצת לקוחות.","אלה לקוחות, לא חברות שעלולות להיכנס לענף.",""]}],"tf":[{"id":"s2-t1","s":"כאשר חסמי הכניסה לענף נמוכים, צפויה שחיקה ברווחיות של הפירמות הפועלות בו.","a":true,"why":"נכון. חסמים נמוכים מאפשרים לשחקנים רבים להיכנס בקלות, התחרות גוברת והמחירים והרווחים יורדים."},{"id":"s2-t2","s":"יתרון לגודל של הפירמות הקיימות מקל על כניסת מתחרים חדשים לענף.","a":false,"why":"לא נכון. יתרון לגודל הוא חסם כניסה: חברה חדשה וקטנה לא מגיעה לאותה עלות ליחידה, ולכן קשה לה להיכנס."},{"id":"s2-t3","s":"אסטרטגיית אוקיינוס כחול מבוססת על הורדת מחירים כדי לגבור על המתחרים בשוק הקיים.","a":false,"why":"לא נכון. זה תיאור של אוקיינוס אדום. אוקיינוס כחול יוצר שוק חדש בלי תחרות ישירה, בעזרת חדשנות בערך."},{"id":"s2-t4","s":"מוצר תחליפי הוא מוצר מענף אחר שממלא תפקיד דומה לזה של מוצרי הענף הנבדק.","a":true,"why":"נכון. למשל אופניים לענף הרכב. מוצר באותו ענף הוא מתחרה, לא תחליף."},{"id":"s2-t5","s":"מודל PESTEL(G) משמש לניתוח החוזקות והחולשות הפנימיות של הארגון.","a":false,"why":"לא נכון. PESTEL מנתח את המאקרו-סביבה החיצונית (פוליטי, כלכלי, חברתי וכו׳). חוזקות וחולשות נבדקות ב-SWOT."},{"id":"s2-t6","s":"ככל שכוח המיקוח של הספקים בענף גבוה יותר, הענף פחות אטרקטיבי.","a":true,"why":"נכון. ספקים חזקים מעלים מחירים ושוחקים את הרווחיות של הפירמות בענף."},{"id":"s2-t7","s":"KSF הם גורמים שצפויים להפוך לקריטיים להצלחה רק בעתיד.","a":false,"why":"לא נכון. KSF הם גורמי ההצלחה הקריטיים היום; גורמים עתידיים נקראים F-KSF."},{"id":"s2-t8","s":"מוצרים משלימים אינם אחד מחמשת הכוחות המקוריים של פורטר, אך נהוג לבדוק את השפעתם כ\"כוח שישי\".","a":true,"why":"נכון. המודל נשאר עם חמישה כוחות, אבל מקובל לנתח גם מוצרים משלימים (כמו דלק לרכב) כי הם משפיעים על הענף."},{"id":"s2-t9","s":"במונופסון, שבו לקוח אחד שולט בכל הביקוש, כוח המיקוח של הלקוחות חלש.","a":false,"why":"לא נכון. במונופסון הלקוח היחיד קובע את המחיר ואת שולי הרווח, ולכן כוח המיקוח שלו חזק מאוד."},{"id":"s2-t10","s":"עלויות מעבר נמוכות של לקוחות מחזקות את כוח המיקוח שלהם מול הפירמות בענף.","a":true,"why":"נכון. כשקל ללקוח לעבור לספק אחר, הוא יכול לדרוש מחיר נמוך יותר ואיכות גבוהה יותר."},{"id":"s2-t11","s":"מודל חמשת הכוחות מתאים במיוחד לניבוי מצב הענף בתקופות של שינוי טכנולוגי מהיר.","a":false,"why":"לא נכון. אחת הביקורות על המודל היא שהוא סטטי, ולכן מתקשה לנבא כשכללי המשחק משתנים, למשל בחדשנות טכנולוגית."},{"id":"s2-t12","s":"לפי אפקט המלכה האדומה, כשחברה משפרת את ביצועיה גם המתחרים משתפרים, ולכן מיקומה היחסי עשוי להישאר זהה.","a":true,"why":"נכון. כולם \"רצים\" באותו קצב, ולכן אף אחד לא מתקדם ביחס לאחרים, ועוצמת התחרות עולה."},{"id":"s2-t13","s":"ענף מוגדר לפי הטכנולוגיה של היצרנים בלבד, בלי קשר לצורך של הלקוח.","a":false,"why":"לא נכון. ענף מוגדר מנקודת המבט של הלקוח: מוצרים שפותרים לו את אותו צורך נמצאים באותה תחרות."},{"id":"s2-t14","s":"יחס האיכות-מחיר של המוצרים התחליפיים קובע תקרה לשולי הרווח בענף.","a":true,"why":"נכון. אם הענף יעלה מחירים מעבר לתחליף, הלקוחות יעברו לתחליף, ולכן אי אפשר להרוויח מעבר לתקרה הזו."}]},{"id":"s3","title":"ניתוח פנימי: שרשרת הערך, משאבים, יכולות ו-SWOT","short":"ניתוח פנימי","blurb":"שרשרת הערך של פורטר (ראשוניות מול תומכות), RBV וסוגי משאבים, VRIO, יכולת ליבה מול יכולת ייחודית, יתרון תחרותי, ומודל SWOT כולל ניצול הזדמנות.","mnemonic":"התומכות הן \"תמ״פר\": תשתיות, משאבי אנוש, פיתוח טכנולוגי, רכש – כל השאר ראשוניות (המוצר \"נוסע\" דרכן: נכנס → מיוצר → יוצא → נמכר → מתוקן). ב-SWOT: \"SW בבית, OT בחוץ\". חוזקה + הזדמנות = מנוף, חולשה + איום = בטן רכה. ליבה = \"אני טוב בזה\"; ייחודית = \"רק אני יכול\".","blocks":[{"t":"h","x":"מעבר מבחוץ לפנים"},{"t":"p","x":"ביחידה 2 הסתכלנו <b>החוצה</b>: על הסביבה ועל הענף. ביחידה 3 מסתכלים <b>פנימה</b>, אל תוך החברה: אילו פעילויות יוצרות ערך (שרשרת הערך), אילו משאבים ויכולות יש לה (RBV, יכולת ליבה, יכולת ייחודית), ואיך כל זה הופך ליתרון תחרותי. בסוף מחברים פנים וחוץ במודל SWOT."},{"t":"h","x":"מודל שרשרת הערך של פורטר (Value Chain)"},{"t":"p","x":"<b>שרשרת הערך</b> של מייקל פורטר היא מודל <b>פנימי</b>: הוא מפרק את החברה לפעילויות ובודק איך כל פעילות יוצרת ערך ללקוח, איפה אפשר לחסוך ואיפה יש מקור ליתרון תחרותי. כל הפעילויות מחולקות לשתי קבוצות:"},{"t":"list","x":["<b>פעילויות ראשוניות</b> (Primary Activities) – קשורות <b>ישירות</b> ליצירת המוצר ולמסירתו ללקוח. אפשר \"לראות\" את המוצר עובר דרכן.","<b>פעילויות תומכות</b> (Support Activities) – לא נוגעות במוצר עצמו, אלא <b>עוזרות</b> לפעילויות הראשוניות לעבוד טוב יותר."]},{"t":"table","head":["סוג","פעילות","מה כוללת","דוגמה מהשיעור"],"rows":[["ראשונית","<b>לוגיסטיקה נכנסת</b> (Inbound Logistics)","קבלת חומרי גלם, אחסון, ניהול מלאי","ניהול מחסנים מדויק באיקאה"],["ראשונית","<b>תפעול</b> (Operations)","ייצור או ביצוע השירות","פס הייצור של טסלה"],["ראשונית","<b>לוגיסטיקה יוצאת</b> (Outbound Logistics)","הפצה, אחסון ושילוח ללקוח","משלוחים של אמזון בתוך יום"],["ראשונית","<b>שיווק ומכירות</b> (Marketing & Sales)","פרסום, מיתוג, קידום, מכירה","קמפיין Just Do It של נייקי"],["ראשונית","<b>שירות לאחר מכירה</b> (After-Sales Service)","תמיכה, תיקונים, אחריות, תחזוקה","AppleCare של אפל"],["תומכת","<b>תשתיות הארגון</b> (Firm Infrastructure)","הנהלה, כספים, משפטים, תכנון אסטרטגי","הניהול והתרבות הארגונית של גוגל"],["תומכת","<b>ניהול משאבי אנוש</b> (HRM)","גיוס, הכשרה, פיתוח וניהול עובדים","הכשרת העובדים במקדונלדס"],["תומכת","<b>פיתוח טכנולוגי</b> (Technology Development)","מחקר ופיתוח (מו״פ), שיפור תהליכים, חדשנות","המו״פ של סמסונג"],["תומכת","<b>רכש</b> (Procurement)","קניית חומרי גלם, חוזים עם ספקים, ניהול שרשרת אספקה","ניהול הספקים של קוקה קולה"]]},{"t":"steps","title":"איך מסווגים פעילות במבחן","x":["שאלו: האם הפעילות <b>נוגעת במוצר בדרך ללקוח</b> (מגיע חומר → מייצרים → שולחים → מוכרים → מתקנים)? אם כן – <b>ראשונית</b>.","אם הפעילות היא <b>אנשים</b> (גיוס, הכשרה), <b>מו״פ וטכנולוגיה</b>, <b>קנייה מספקים</b>, או <b>הנהלה/כספים/משפטים</b> – היא <b>תומכת</b>.","זכרו את התומכות במילה אחת: <b>\"תמ״פר\"</b> = <b>ת</b>שתיות, <b>מ</b>שאבי אנוש, <b>פ</b>יתוח טכנולוגי, <b>ר</b>כש. כל השאר – ראשוניות."]},{"t":"example","title":"טסלה – ראשונית או תומכת?","x":"ייצור והרכבת מכוניות במפעל → <b>תפעול, ראשונית</b>. מכירה בחנויות החברה → <b>שיווק ומכירות, ראשונית</b>. תיקונים במרכזי השירות → <b>שירות לאחר מכירה, ראשונית</b>. גיוס והכשרה של מהנדסים → <b>משאבי אנוש, תומכת</b>. פיתוח מערכת נהיגה אוטונומית → <b>פיתוח טכנולוגי, תומכת</b>."},{"t":"trap","x":"שלושה בלבולים קבועים: (1) <b>רכש מול לוגיסטיקה נכנסת</b> – לחתום חוזה ולקנות מספק = רכש (תומכת); לקבל את הסחורה, לאחסן ולנהל מלאי = לוגיסטיקה נכנסת (ראשונית). (2) <b>הכשרת עובדי שירות</b> היא משאבי אנוש (תומכת), גם אם המטרה היא שירות טוב; <b>התיקון עצמו</b> ללקוח הוא שירות לאחר מכירה (ראשונית). (3) <b>מו״פ</b> הוא תמיד פיתוח טכנולוגי (תומכת), גם בחברת טכנולוגיה שבה הוא \"הכי חשוב\"."},{"t":"p","x":"בקצרה, חסרונות המודל: מורכב ליישום, פותח לעידן התעשייתי ופחות מתאים לחברות שירות ודיגיטל, מתמקד בפנים ומתעלם מהסביבה המשתנה, וקשה למדוד בו ערך לא מוחשי כמו מותג."},{"t":"h","x":"מודל RBV – גישת המשאבים"},{"t":"p","x":"<b>RBV</b> (Resource-Based View) אומר: היתרון התחרותי של חברה בא בעיקר <b>מבפנים</b> – מה<b>משאבים</b> וה<b>יכולות</b> הייחודיים שלה, שמתחרים לא יכולים להעתיק בקלות. זה ההפך מגישה חיצונית כמו חמשת הכוחות, שמחפשת את הרווח במבנה הענף. המודל פותח על ידי <b>ורנרפלט</b> (Wernerfelt, 1984) ו<b>בארני</b> (Barney, 1991)."},{"t":"p","x":"<b>משאב</b> = כל נכס שיש לחברה ושהיא יכולה להשתמש בו כדי ליצור ערך. לפי RBV יש שני סוגים, ומעליהם יכולות ארגוניות:"},{"t":"table","head":["סוג","מה זה","דוגמאות"],"rows":[["<b>משאבים מוחשיים</b> (Tangible)","פיזיים או כספיים, קל למדוד אותם","מפעלים, ציוד, נדל\"ן, מלאי; הון, אשראי, הכנסות; שרתים ומערכות IT. טסלה – מפעלים וגישה למינרלים; אמזון – מרכזי לוגיסטיקה"],["<b>משאבים בלתי מוחשיים</b> (Intangible)","קשה לכמת, אבל נותנים יתרון גדול","מותג ומוניטין, קניין רוחני (פטנטים, סודות מסחריים), ידע ומומחיות של עובדים, קשרים עסקיים. קוקה קולה – המותג והנוסחה הסודית; גוגל – הנתונים והאלגוריתמים"],["<b>יכולות ארגוניות</b> (Organizational Capabilities)","היכולת <b>לשלב</b> משאבים לכדי יתרון","יכולת חדשנות (אפל), מצוינות תפעולית (טויוטה), שירות לקוחות יוצא דופן (אמזון)"]]},{"t":"p","x":"<b>איזה משאב באמת נותן יתרון? מודל VRIO של בארני</b> – בודקים כל משאב לפי ארבע שאלות:"},{"t":"table","head":["אות","קריטריון","השאלה"],"rows":[["V","<b>ערך</b> (Value)","האם המשאב יוצר ערך ונותן יתרון?"],["R","<b>נדירות</b> (Rarity)","האם הוא נדיר ולא נמצא בקלות אצל המתחרים?"],["I","<b>חיקוי</b> (Imitability)","האם קשה או בלתי אפשרי להעתיק אותו?"],["O","<b>ארגון</b> (Organization)","האם החברה בנויה כך שתוכל לנצל אותו באופן מיטבי?"]]},{"t":"p","x":"רק משאב שעונה \"כן\" על כל הארבע מעניק <b>יתרון תחרותי בר-קיימא</b>. בשקפים מופיע גם הניסוח: משאב נדיר (Rare), שקשה להעתיק (Inimitable) וקשה להחליף (Non-substitutable). דוגמאות: המותג של אפל; אלגוריתם ההמלצות של נטפליקס, שנבנה שנים."},{"t":"trap","x":"RBV = <b>פנים</b> (משאבים). חמשת הכוחות ו-PESTEL = <b>חוץ</b>. אם הסיפור אומר \"היתרון שלנו נובע מנכסים פנימיים שאי אפשר להעתיק\" – RBV. ופטנט, מותג וידע הם <b>בלתי מוחשיים</b> גם אם הם שווים הרבה כסף."},{"t":"h","x":"יכולת ליבה (Core Competency)"},{"t":"p","x":"<b>יכולת ליבה</b> היא <b>שילוב</b> של מיומנויות, טכנולוגיות, תהליכים ונכסים שהחברה מצטיינת בו, ושיוצר ערך ללקוחות ויתרון לאורך זמן. היא לא נכס בודד אלא צירוף. המושג הוצג על ידי <b>פרהלאד והאמל</b> (Prahalad & Hamel, 1990). אפשר לחשוב עליה כ\"DNA העסקי\" של החברה."},{"t":"table","head":["3 הקריטריונים ליכולת ליבה","השאלה","דוגמה"],"rows":[["<b>ערך מוסף ללקוח</b> (Customer Value)","האם היא משפרת ללקוח איכות, ביצועים או חוויה?","חוויית המשתמש החלקה של אפל"],["<b>ייחודיות וקושי לחיקוי</b> (Rarity & Inimitability)","האם קשה למתחרים להעתיק אותה? (נבנתה שנים)","אלגוריתם ההמלצות של נטפליקס"],["<b>ניצול במספר תחומים ושווקים</b> (Expandability)","האם אפשר להשתמש בה בהרבה מוצרים ושווקים?","העיבוד הגרפי של NVIDIA: גיימינג, AI, רכב אוטונומי"]]},{"t":"table","head":["סוג יכולת ליבה","דוגמאות"],"rows":[["חדשנות טכנולוגית ופיתוח מוצר","טסלה – סוללות; אינטל – שבבים"],["מיתוג ושיווק ייחודי","קוקה קולה, נייקי"],["תפעול ולוגיסטיקה מצוינים","אמזון – משלוחים; טויוטה – ייצור רזה (Lean)"],["יחסי לקוחות וחוויית משתמש","אפל – מערכת סגורה; Zappos – שירות"],["נתונים ואלגוריתמים (Big Data & AI)","גוגל – מנוע חיפוש; מטא – פרסום מותאם"],["קניין רוחני ופטנטים","פייזר – פטנטים על תרופות; דייסון – מנועים"],["יכולות פיננסיות","ברקשייר האת׳וויי; סמסונג"]]},{"t":"h","x":"יכולת ייחודית (Distinctive Competency) מול יכולת ליבה"},{"t":"p","x":"<b>יכולת ייחודית</b> היא יכולת <b>בלעדית או נדירה מאוד</b>, ש<b>קשה מאוד להעתיק</b>, והיא מקור ישיר למובילות ברורה על פני המתחרים. לפי השקפים, יכולת ליבה יכולה להיות <b>משותפת לכמה חברות</b>, ואילו יכולת ייחודית שייכת באמת לחברה אחת."},{"t":"table","head":["קריטריון","יכולת ליבה","יכולת ייחודית"],"rows":[["הגדרה","משהו שהחברה <b>טובה בו</b> ויוצר ערך ללקוחות","יכולת <b>בלעדית או נדירה</b> שנותנת יתרון מובהק"],["חיקוי","מתחרים <b>יכולים</b> לפתח יכולת דומה","<b>קשה מאוד</b> להעתיק או לשכפל"],["תחרותיות","עוזרת לשרוד, אבל לא מבטיחה מובילות","נותנת <b>מובילות בשוק לאורך זמן</b>"],["דוגמאות","תפעול יעיל, טכנולוגיה, קשרי לקוחות טובים","נוסחה סודית (קוקה קולה), אלגוריתם ייחודי (גוגל, נטפליקס), Fast Fashion של זארה, המנוע של דייסון"]]},{"t":"p","x":"חברות הופכות יכולת ליבה ליכולת ייחודית בעזרת: השקעה במו״פ ופטנטים, חיזוק מותג, שליטה בשרשרת האספקה, ופיתוח נכסים בלתי מוחשיים (נתונים, אלגוריתמים)."},{"t":"example","title":"ליבה או ייחודית?","x":"כמה רשתות סופרמרקטים יודעות לנהל מלאי ביעילות, וזה עוזר להן להחזיק מעמד. → <b>יכולת ליבה</b> (טובים בזה, אבל גם אחרים). לחברת BrewLab יש נוסחת תסיסה סודית ומוגנת בפטנט, שאף מתחרה לא הצליח לשחזר, והיא מובילה את השוק כבר 15 שנה. → <b>יכולת ייחודית</b> (בלעדית, לא ניתנת להעתקה, מובילות לאורך זמן)."},{"t":"trap","x":"המילים שמכריעות: <b>\"בלעדי\", \"אף מתחרה לא הצליח\", \"סודי\", \"מובילות לאורך זמן\"</b> → יכולת ייחודית. <b>\"החברה טובה ב...\", \"גם מתחרים עושים זאת\"</b> → יכולת ליבה. ושימו לב: KSF הוא דרישה של <b>הענף</b>, לא יכולת של חברה."},{"t":"h","x":"יתרון תחרותי – מה זה ומה הקריטריונים"},{"t":"p","x":"<b>יתרון תחרותי</b> (Competitive Advantage) קיים כשתוצאות החברה טובות <b>לאורך זמן מעל הממוצע בענף</b> שבו היא פועלת. הוא תמיד נמדד <b>מול חברות באותו ענף</b> (תפוחים מול תפוחים, לא מול לימונים). <b>יתרון תחרותי בר-קיימא</b> (SCA) = החברה מנצחת את המתחרים באופן עקבי, כי היא נותנת ללקוחות ערך טוב יותר."},{"t":"table","head":["סוג יתרון","מה החברה מציעה","איך זה נראה"],"rows":[["<b>יתרון בעלות</b>","מוצר עם <b>אותן תכונות</b> כמו של המתחרים, אבל <b>בעלות נמוכה יותר</b>","הפחתת תקורות, שרשרת אספקה יעילה, מחיר אטרקטיבי"],["<b>יתרון בבידול</b>","מוצר עם <b>תכונות טובות יותר</b> משל המתחרים","איכות גבוהה, קניין רוחני, חוויית לקוח, שיווק חדשני"],["<b>מיקוד</b>","התמקדות בנישה או בפלח מסוים","מוצרים לקהל מוגדר"]]},{"t":"list","x":["<b>הקריטריונים</b> ליתרון שיחזיק לאורך זמן הם קריטריוני VRIO: <b>ערך, נדירות, קושי לחיקוי, ארגון</b> (ובניסוח השני: נדיר, לא ניתן להעתקה, לא ניתן להחלפה).","<b>מה מקשה על העתקה</b>: פטנטים וקניין רוחני, ידע ארגוני וצוותים מנוסים, קשרים ארוכי טווח עם ספקים ולקוחות, תרבות ארגונית ייחודית (3M, גוגל).","<b>מה מרוויחים</b> מיתרון בר-קיימא: רווחיות לטווח ארוך, חסמי כניסה גבוהים, חוסן בתנודות כלכליות, אמון של בעלי עניין, נאמנות לקוחות ואפשרות למחיר פרמיה.","<b>איך משיגים</b>: מבינים את השוק, ממנפים יכולות ליבה, מתחדשים כל הזמן, מתבדלים ומשתפרים."]},{"t":"trap","x":"יתרון תחרותי <b>לא</b> נמדד מול \"כל החברות במשק\" ולא מול חברות מענפים אחרים – רק <b>מול המתחרים באותו ענף</b>. ומשאב שיש לו רק ערך, אבל כל המתחרים יכולים לקנות אותו, לא נותן יתרון בר-קיימא."},{"t":"h","x":"מודל SWOT"},{"t":"p","x":"<b>SWOT</b> מחבר בין הפנים לחוץ. ההבחנה הכי חשובה: מה <b>בשליטה שלי</b> (פנימי) ומה <b>מחוץ למגרש שלי</b> (חיצוני)."},{"t":"table","head":["","חיובי","שלילי"],"rows":[["<b>פנימי</b> (בשליטת החברה)","<b>S – חוזקות</b> (Strengths): מותג חזק, טכנולוגיה, צוות מנוסה","<b>W – חולשות</b> (Weaknesses): עלויות גבוהות, מעט הון, מותג לא מוכר"],["<b>חיצוני</b> (בסביבה)","<b>O – הזדמנויות</b> (Opportunities): מגמה חדשה, שינוי רגולציה שפותח שוק, ביקוש גובר","<b>T – איומים</b> (Threats): מתחרה ענק נכנס, חוק מגביל, מיתון"]]},{"t":"table","head":["מפגש","שם","דוגמה מהשיעור"],"rows":[["חוזקה + הזדמנות","<b>מנוף</b>","הוט בתחילת שנות ה-2000: שינוי רגולציה בכבלים (הזדמנות) + התשתית הקיימת שלה (חוזקה). סודה סטרים + המגמה של בריאות וקיימות."],["חולשה + איום","<b>הבטן הרכה</b>","יצרני קורקינטים קטנים כששיאומי נכנסת לייצר קורקינטים."]]},{"t":"list","x":["כללים: עובדים מלמטה למעלה (Bottom-Up), כי כל יחידה מכירה מציאות אחרת.","פריט <b>חיצוני</b> לא יופיע ברשימה ה<b>פנימית</b>, ולהפך.","כל חוזקה יכולה להיות גם חולשה, וכל איום יכול להיות גם הזדמנות.","מותר להשתמש באותו פריט כמה פעמים (במנוף ובבטן הרכה).","בהתחלה רושמים הכול בלי לסנן, ורק אחר כך מורידים את מה שלא רלוונטי."]},{"t":"steps","title":"איך בוחרים את הצעד הנכון לניצול הזדמנות","x":["זהו מה בדיוק ההזדמנות מבקשת (למשל: \"ביקוש גובר למוצרים ממוחזרים באירופה\").","בחרו את הצעד ש<b>עונה ישירות על הביקוש הזה</b> – בדרך כלל מוצר או שירות חדש שמתאים למגמה – ועדיף כזה שנשען על חוזקה קיימת (מנוף).","פסלו צעדים שרק משפרים את מה שכבר קיים, מורידים מחיר בלי קשר למגמה, או פונים דווקא ללקוחות שלא מתעניינים במגמה."]},{"t":"example","title":"מנוף בפועל","x":"לחברת KidSafe יש טכנולוגיית חיישנים מעולה למושבי בטיחות (חוזקה). נחקק חוק שמחייב התראה על ילד שנשכח ברכב (הזדמנות). הצעד הנכון: <b>לפתח מוצר התראה שמבוסס על החיישנים שלה</b> ולהציע אותו לכל ההורים. זה מנוף: חוזקה פוגשת הזדמנות."},{"t":"trap","x":"החוק חדש, מתחרה חדש, מגמה בציבור, ריבית – תמיד <b>חיצוניים</b> (O או T), גם אם הם משפיעים מאוד על החברה. מותג, עובדים, טכנולוגיה, עלויות של החברה – תמיד <b>פנימיים</b> (S או W)."},{"t":"exam","x":"איך שואלים: \"איזו פעילות היא <b>תומכת ולא ראשונית</b>?\" (התשובה: גיוס והכשרה, מו״פ, רכש או הנהלה). \"במסגרת SWOT זוהתה הזדמנות – איזה צעד ינצל אותה הכי טוב?\" (המוצר שעונה ישירות על המגמה). ובנכון/לא נכון: מה פנימי ומה חיצוני, ליבה מול ייחודית, ומה RBV טוען."}],"cheat":["שרשרת הערך = מודל פנימי של פורטר: פעילויות ראשוניות ותומכות","ראשוניות = לוגיסטיקה נכנסת, תפעול, לוגיסטיקה יוצאת, שיווק ומכירות, שירות לאחר מכירה","תומכות (\"תמ״פר\") = תשתיות הארגון, משאבי אנוש, פיתוח טכנולוגי, רכש","רכש מול לוגיסטיקה נכנסת = חוזה וקנייה מספק (תומכת) מול קבלה ואחסון של הסחורה (ראשונית)","גיוס והכשרת עובדים = משאבי אנוש = תומכת (גם בעובדי שירות)","תיקונים ואחריות ללקוח = שירות לאחר מכירה = ראשונית","מו״פ = פיתוח טכנולוגי = תומכת","RBV = היתרון בא ממשאבים ויכולות פנימיים שקשה להעתיק (ורנרפלט, בארני)","משאב מוחשי = מפעל, ציוד, כסף, מערכות IT","משאב בלתי מוחשי = מותג, מוניטין, פטנט, ידע, קשרים","יכולת ארגונית = היכולת לשלב משאבים (חדשנות, מצוינות תפעולית)","VRIO = ערך, נדירות, קושי לחיקוי, ארגון (בארני)","יכולת ליבה = שילוב מיומנויות שהחברה מצטיינת בו (פרהלאד והאמל)","3 קריטריונים ליכולת ליבה = ערך ללקוח, ייחודיות וקושי לחיקוי, ניצול בכמה תחומים","יכולת ליבה מול ייחודית = טובה בזה וגם אחרים יכולים / בלעדית, כמעט בלתי ניתנת להעתקה, מובילות","יתרון תחרותי = תוצאות מעל ממוצע הענף לאורך זמן","יתרון תחרותי נמדד = מול חברות באותו ענף בלבד","יתרון בעלות = אותן תכונות, עלות נמוכה יותר","יתרון בבידול = תכונות טובות יותר מהמתחרים","SWOT: S ו-W = פנימי, בשליטת החברה","SWOT: O ו-T = חיצוני, בסביבה","מנוף = חוזקה פוגשת הזדמנות","בטן רכה = חולשה פוגשת איום","ניצול הזדמנות = צעד שעונה ישירות על המגמה ונשען על חוזקה"],"mcq":[{"id":"s3-1","q":"רשת בתי הקפה BeanRoute פועלת בכמה תחומים: היא חותמת חוזים שנתיים עם חוות קפה בקולומביה, מקבלת את שקי הקפה למחסן ומנהלת את המלאי, קולה את הפולים במפעל, ומפיצה אותם לסניפים. לפי שרשרת הערך של פורטר, איזו מהפעילויות היא פעילות תומכת?","o":["קבלת שקי הקפה למחסן וניהול המלאי","קליית הפולים במפעל","חתימת חוזים עם חוות הקפה","הפצת הקפה לסניפים"],"a":2,"why":"חתימת חוזים עם ספקים וקניית חומרי גלם = רכש (Procurement), שהוא פעילות תומכת.","w":["קבלה, אחסון וניהול מלאי = לוגיסטיקה נכנסת, פעילות ראשונית.","קלייה היא ייצור = תפעול, פעילות ראשונית.","","הפצה לנקודות המכירה = לוגיסטיקה יוצאת, פעילות ראשונית."]},{"id":"s3-2","q":"חברת CoolAir מייצרת מזגנים. לפי מודל שרשרת הערך של פורטר, איזו מהפעילויות הבאות היא פעילות ראשונית (Primary Activity)?","o":["פיתוח מדחס חדש וחסכוני במחלקת המו״פ","שליחת טכנאי לתקן מזגן אצל לקוח בתקופת האחריות","גיוס טכנאים חדשים והכשרתם","ניהול מחלקת הכספים והייעוץ המשפטי"],"a":1,"why":"תיקון אצל לקוח במסגרת אחריות = שירות לאחר מכירה, שהוא פעילות ראשונית.","w":["מו״פ = פיתוח טכנולוגי, פעילות תומכת.","","גיוס והכשרה = ניהול משאבי אנוש, פעילות תומכת (גם אם מדובר בטכנאים).","כספים ומשפטים = תשתיות הארגון, פעילות תומכת."]},{"id":"s3-3","q":"אתר הקניות QuickCart השקיע מאות מיליונים במרכזי הפצה ובצי משאיות, כדי שכל הזמנה תגיע ללקוח בתוך 24 שעות. לאיזו פעילות בשרשרת הערך שייכת ההשקעה?","o":["לוגיסטיקה נכנסת","רכש","תפעול","לוגיסטיקה יוצאת"],"a":3,"why":"הפצה ושילוח של המוצר ללקוח = לוגיסטיקה יוצאת (כמו המשלוחים של אמזון).","w":["לוגיסטיקה נכנסת היא קבלת חומרים מהספקים, לא משלוח ללקוח.","רכש הוא קנייה וחוזים עם ספקים.","תפעול הוא ייצור או ביצוע השירות, לא המשלוח.",""]},{"id":"s3-4","q":"רשת המלונות StayWell הקימה אקדמיה פנימית שבה כל עובד קבלה חדש עובר קורס של חודש בשירות לקוחות. לפי מודל שרשרת הערך, זו פעילות של:","o":["ניהול משאבי אנוש – פעילות תומכת","שירות לאחר מכירה – פעילות ראשונית","שיווק ומכירות – פעילות ראשונית","תשתיות הארגון – פעילות תומכת"],"a":0,"why":"הכשרת עובדים שייכת לניהול משאבי אנוש, פעילות תומכת – גם כשהמטרה היא שירות טוב יותר.","w":["","שירות לאחר מכירה הוא השירות שניתן ללקוח עצמו; כאן מדובר בהכשרה של העובדים.","אין כאן פרסום, מיתוג או מכירה.","תשתיות הארגון הן הנהלה, כספים, משפטים ותכנון – לא הכשרת עובדים."]},{"id":"s3-5","q":"חברת WaveTech מתגאה בכך שכל היתרון שלה נובע ממה שיש לה בפנים: צוות מהנדסים שעובד יחד 20 שנה, פטנטים מוגנים ותרבות ארגונית שאף מתחרה לא הצליח לשכפל. איזה מודל מתאר את הגישה הזו ליתרון תחרותי?","o":["מודל חמשת הכוחות של פורטר","מודל PESTEL(G)","מודל RBV","אסטרטגיית אוקיינוס כחול"],"a":2,"why":"RBV טוען שהיתרון התחרותי נובע ממשאבים ויכולות פנימיים, נדירים וקשים להעתקה. המילים: \"בפנים\", \"אף מתחרה לא הצליח לשכפל\".","w":["חמשת הכוחות מסבירים רווחיות דרך מבנה הענף מבחוץ, לא דרך משאבי החברה.","PESTEL מנתח את הסביבה הכללית החיצונית.","","אוקיינוס כחול הוא יצירת שוק חדש; הסיפור עוסק במקור היתרון – המשאבים."]},{"id":"s3-6","q":"לחברת התרופות BioNova יש 40 פטנטים רשומים ומוניטין חזק בקרב רופאים. לפי מודל RBV, אלה:","o":["משאבים מוחשיים","משאבים בלתי מוחשיים","פעילויות ראשוניות","גורמי הצלחה עתידיים (F-KSF)"],"a":1,"why":"קניין רוחני (פטנטים) ומוניטין הם משאבים בלתי מוחשיים: קשה לכמת אותם, אבל הם נותנים יתרון גדול.","w":["מוחשיים הם נכסים פיזיים וכספיים: מפעלים, ציוד, הון, שרתים.","","פעילויות ראשוניות שייכות לשרשרת הערך, לא לסוגי המשאבים.","F-KSF הם גורמים שיהיו קריטיים לכל הענף בעתיד, לא משאבים של חברה."]},{"id":"s3-7","q":"לחברת FarmBot יש טכנולוגיה נדירה לקטיף רובוטי, בעלת ערך רב וקשה להעתקה. אבל החברה לא בנתה צוות מכירות ולא מערך שירות, ולכן הטכנולוגיה כמעט לא נמכרת. איזה קריטריון ב-VRIO חסר לה?","o":["ערך (Value)","נדירות (Rarity)","חיקוי (Imitability)","ארגון (Organization)"],"a":3,"why":"ה-O שואל אם החברה בנויה כך שתוכל לנצל את המשאב. ל-FarmBot יש משאב מעולה, אבל אין לה מבנה שמנצל אותו.","w":["בסיפור כתוב במפורש שלטכנולוגיה יש ערך רב.","הטכנולוגיה מתוארת כנדירה.","הטכנולוגיה מתוארת כקשה להעתקה.",""]},{"id":"s3-8","q":"חברת ChipCore פיתחה טכנולוגיית עיבוד שמשמשת אותה גם במחשבים ביתיים, גם במכוניות וגם במכשור רפואי. איזה מהקריטריונים של יכולת ליבה מודגם כאן במיוחד?","o":["ניצול במספר תחומים ושווקים (Expandability)","ערך מוסף ללקוח (Customer Value)","מוצר תחליפי","יתרון לגודל"],"a":0,"why":"שימוש באותה יכולת בכמה שווקים שונים = Expandability (כמו העיבוד הגרפי של NVIDIA).","w":["","ערך ללקוח קיים כנראה, אבל מה שהסיפור מדגיש הוא השימוש בכמה תחומים.","מוצר תחליפי הוא מושג של חמשת הכוחות, לא קריטריון ליכולת ליבה.","יתרון לגודל הוא חסם כניסה ביחידה 2, לא קריטריון ליכולת ליבה."]},{"id":"s3-9","q":"למותג הגלידות FrostCo יש מתכון סודי שהחברה מחזיקה בו לבד כבר 60 שנה. אף מתחרה לא הצליח לשחזר את הטעם, והחברה מובילה את השוק לאורך כל השנים. לפי ההבחנה שלמדנו, המתכון הוא דוגמה ל:","o":["יכולת ליבה","משאב מוחשי","יכולת ייחודית","פעילות תומכת"],"a":2,"why":"יכולת בלעדית (\"מחזיקה לבד\"), שכמעט אי אפשר להעתיק (\"אף מתחרה לא הצליח\"), ושמביאה מובילות לאורך זמן = יכולת ייחודית (כמו הנוסחה של קוקה קולה).","w":["יכולת ליבה היא משהו שהחברה טובה בו אבל מתחרים יכולים לפתח דומה; כאן ההדגשה היא על בלעדיות.","מתכון סודי הוא ידע – משאב בלתי מוחשי, לא מוחשי.","","פעילות תומכת שייכת לשרשרת הערך ואינה מתארת יכולת בלעדית."]},{"id":"s3-10","q":"רשת המרכולים FreshDay מצטיינת בניהול מלאי: כמעט אין אצלה מוצרים שפג תוקפם, וזה חוסך לה כסף ומשמח את הלקוחות. עם זאת, שתי רשתות מתחרות פיתחו בשנים האחרונות שיטה דומה. היכולת של FreshDay היא:","o":["יכולת ייחודית","יכולת ליבה","אוקיינוס כחול","הזדמנות (O) ב-SWOT"],"a":1,"why":"יכולת שהחברה טובה בה ויוצרת ערך, אבל מתחרים מצליחים לפתח דומה = יכולת ליבה, לא ייחודית.","w":["יכולת ייחודית היא בלעדית וכמעט אי אפשר להעתיק אותה; כאן המתחרים כבר העתיקו.","","אוקיינוס כחול הוא שוק חדש בלי מתחרים; FreshDay פועלת בשוק צפוף.","הזדמנות היא גורם חיצוני; ניהול המלאי הוא יכולת פנימית (חוזקה)."]},{"id":"s3-11","q":"בשמונה השנים האחרונות הרווחיות של חברת הביטוח SafeHome גבוהה בעקביות מהממוצע של חברות הביטוח בישראל. מה מעיד הנתון?","o":["שיש לה יתרון תחרותי (בר-קיימא)","שהענף אטרקטיבי בזכות חסמי כניסה","שיש לה כוח מיקוח של ספקים","שהיא פועלת באוקיינוס כחול"],"a":0,"why":"יתרון תחרותי = תוצאות מעל הממוצע בענף לאורך זמן, בהשוואה לחברות באותו ענף. \"בעקביות\" ו\"שמונה שנים\" מראים שהיתרון בר-קיימא.","w":["","הנתון משווה את SafeHome לחברות אחרות בענף, ולא אומר דבר על חסמי הכניסה לענף.","SafeHome היא חברת ביטוח שמוכרת ללקוחות; אין בסיפור ספקים.","היא פועלת בענף קיים מול מתחרים – לא בשוק חדש בלי מתחרים."]},{"id":"s3-12","q":"חברת PrintPro מוכרת מדפסות משרדיות עם אותן תכונות בדיוק כמו של המתחרים, אבל בזכות מפעל אוטומטי היא מייצרת אותן בעלות נמוכה בהרבה. איזה סוג יתרון תחרותי יש לה?","o":["יתרון בבידול","יכולת ייחודית בשיווק","יתרון בעלות","יתרון מיקוד בנישה"],"a":2,"why":"אותן תכונות + עלות נמוכה יותר = יתרון בעלות.","w":["בידול = תכונות טובות יותר משל המתחרים; כאן התכונות זהות.","אין כאן שום דבר בשיווק; היתרון הוא בייצור.","","החברה מוכרת לכל המשרדים, לא לנישה מסוימת."]},{"id":"s3-13","q":"חברת GreenRide מפעילה אופניים שיתופיים. לאחרונה העירייה החליטה לסלול 80 ק\"מ של שבילי אופניים חדשים בעיר. בניתוח SWOT של החברה, איך יסווג השינוי?","o":["חוזקה (S)","חולשה (W)","איום (T)","הזדמנות (O)"],"a":3,"why":"החלטת העירייה היא גורם חיצוני (לא בשליטת החברה), והיא חיובית לה – יותר שבילים, יותר רוכבים. לכן הזדמנות.","w":["חוזקה היא גורם פנימי של החברה; את השבילים בונה העירייה.","חולשה היא גורם פנימי שלילי.","השינוי טוב לחברה, לא מאיים עליה.",""]},{"id":"s3-14","q":"חברת PureSkin מייצרת קרמי פנים ומצטיינת במחקר של רכיבים טבעיים. בניתוח SWOT היא זיהתה הזדמנות: באסיה גדל מאוד הביקוש לקוסמטיקה טבעית וטבעונית, בלי ניסויים בבעלי חיים. איזה צעד ינצל את ההזדמנות בצורה הטובה ביותר?","o":["פיתוח קו מוצרים טבעוני ונקי מניסויים בבעלי חיים, שמבוסס על המחקר שלה ומיועד לשוק האסייתי","הורדת מחירי הקרמים הקיימים כדי למכור יותר באסיה","הגדלת התקציב לשיפור פס הייצור של הקרמים הקיימים","פנייה ללקוחות שלא מתעניינים במוצרים טבעיים"],"a":0,"why":"הצעד שעונה ישירות על הביקוש החדש (טבעוני, בלי ניסויים) ונשען על החוזקה של החברה (מחקר רכיבים טבעיים) – זה מנוף: חוזקה פוגשת הזדמנות.","w":["","הורדת מחיר לא עונה על מה שהלקוחות באסיה מחפשים – מוצר טבעוני.","שיפור הייצור של מוצרים קיימים לא יוצר את המוצר שההזדמנות דורשת.","זה ההפך מההזדמנות: היא בדיוק בלקוחות שמתעניינים במוצרים טבעיים."]},{"id":"s3-15","q":"יצרנית קטנה של רמקולים ניידים סובלת מעלויות ייצור גבוהות ומחוסר מוכרות של המותג. עכשיו נכנסת לשוק ענקית אלקטרוניקה עם רמקולים זולים בהרבה. לפי SWOT, איך נקרא המפגש הזה?","o":["מנוף","הבטן הרכה","יכולת ליבה","אוקיינוס אדום"],"a":1,"why":"חולשה (עלויות גבוהות, מותג לא מוכר) פוגשת איום (ענקית זולה נכנסת) = הבטן הרכה של הארגון, כמו יצרני הקורקינטים מול שיאומי.","w":["מנוף הוא מפגש של חוזקה והזדמנות.","","יכולת ליבה היא משהו שהחברה מצטיינת בו; כאן מתוארות חולשות.","נכון שהשוק תחרותי, אבל השאלה היא על מושג ב-SWOT, ושם המפגש של חולשה ואיום נקרא הבטן הרכה."]},{"id":"s3-16","q":"חברת ScanMed מפתחת מכשירי אולטרסאונד. איזו מהפעילויות הבאות היא פעילות תומכת לפי שרשרת הערך?","o":["השתתפות בכנס רפואי כדי להציג את המכשיר לבתי חולים","הרכבת המכשירים במפעל","הדרכה ותיקון של מכשירים בבתי החולים אחרי הקנייה","צוות מחקר שמפתח אלגוריתם לזיהוי תמונה חדה יותר"],"a":3,"why":"מחקר ופיתוח = פיתוח טכנולוגי, פעילות תומכת.","w":["הצגת המכשיר ללקוחות = שיווק ומכירות, פעילות ראשונית.","הרכבה = תפעול, פעילות ראשונית.","הדרכה ותיקון אחרי הקנייה = שירות לאחר מכירה, פעילות ראשונית.",""]}],"tf":[{"id":"s3-t1","s":"רכש (Procurement) הוא פעילות ראשונית בשרשרת הערך, כי הוא עוסק בחומרי הגלם של המוצר.","a":false,"why":"לא נכון. רכש (קנייה וחוזים עם ספקים) הוא פעילות תומכת. קבלה ואחסון של חומרי הגלם הם לוגיסטיקה נכנסת – ראשונית."},{"id":"s3-t2","s":"שירות לאחר מכירה, כמו תיקונים ואחריות, הוא פעילות ראשונית בשרשרת הערך.","a":true,"why":"נכון. זו אחת מחמש הפעילויות הראשוניות, כי היא קשורה ישירות למוצר ולמסירתו ללקוח."},{"id":"s3-t3","s":"לפי מודל RBV, היתרון התחרותי של חברה נובע בעיקר ממבנה הענף ומהסביבה החיצונית.","a":false,"why":"לא נכון. RBV היא גישה פנימית: היתרון נובע ממשאבים ויכולות ייחודיים של החברה שקשה להעתיק. הגישה החיצונית היא של חמשת הכוחות."},{"id":"s3-t4","s":"מותג ומוניטין הם משאבים בלתי מוחשיים לפי מודל RBV.","a":true,"why":"נכון. משאבים בלתי מוחשיים קשים לכימות: מותג, מוניטין, קניין רוחני, ידע וקשרים עסקיים."},{"id":"s3-t5","s":"לפי VRIO, מספיק שלמשאב יהיה ערך כדי שיעניק לחברה יתרון תחרותי בר-קיימא.","a":false,"why":"לא נכון. המשאב צריך להיות גם נדיר, קשה לחיקוי, והחברה צריכה להיות מאורגנת לנצל אותו (ערך, נדירות, חיקוי, ארגון)."},{"id":"s3-t6","s":"אחד הקריטריונים ליכולת ליבה הוא האפשרות לנצל אותה במספר תחומים ושווקים.","a":true,"why":"נכון. שלושת הקריטריונים: ערך מוסף ללקוח, ייחודיות וקושי לחיקוי, וניצול במספר תחומים (Expandability)."},{"id":"s3-t7","s":"יכולת ליבה ויכולת ייחודית הן אותו דבר: שתיהן בלעדיות לחברה אחת.","a":false,"why":"לא נכון. יכולת ליבה יכולה להיות משותפת לכמה חברות ומתחרים יכולים לפתח דומה; יכולת ייחודית בלעדית וקשה מאוד להעתקה."},{"id":"s3-t8","s":"יתרון תחרותי נמדד בהשוואה לחברות שפועלות באותו ענף.","a":true,"why":"נכון. יתרון תחרותי = תוצאות מעל הממוצע בענף לאורך זמן, ולכן ההשוואה היא רק למתחרים באותו ענף."},{"id":"s3-t9","s":"בניתוח SWOT, הזדמנויות ואיומים הם גורמים פנימיים שנמצאים בשליטת הארגון.","a":false,"why":"לא נכון. הזדמנויות ואיומים הם גורמים חיצוניים בסביבה. חוזקות וחולשות הם הגורמים הפנימיים."},{"id":"s3-t10","s":"בניתוח SWOT, המקום שבו חוזקה של הארגון פוגשת הזדמנות בסביבה נקרא \"מנוף\".","a":true,"why":"נכון. חוזקה + הזדמנות = מנוף; חולשה + איום = הבטן הרכה."},{"id":"s3-t11","s":"כאשר חברה מזהה ב-SWOT הזדמנות של ביקוש גובר למוצרים ידידותיים לסביבה, הצעד הנכון לנצל אותה הוא להוריד את מחירי המוצרים הקיימים.","a":false,"why":"לא נכון. כדי לנצל הזדמנות צריך צעד שעונה ישירות על הביקוש – למשל לפתח קו מוצרים ירוק. הורדת מחיר של מוצרים קיימים לא עונה על המגמה."},{"id":"s3-t12","s":"מפעלים, ציוד ומערכות מחשוב הם משאבים מוחשיים.","a":true,"why":"נכון. משאבים מוחשיים הם פיזיים או כספיים וקל למדוד אותם: מפעלים, ציוד, הון, שרתים ומערכות IT."},{"id":"s3-t13","s":"מודל שרשרת הערך של פורטר הוא כלי לניתוח הסביבה החיצונית של הענף.","a":false,"why":"לא נכון. שרשרת הערך מסתכלת פנימה: היא מפרקת את פעילויות הארגון לראשוניות ותומכות ובודקת איך כל אחת יוצרת ערך."},{"id":"s3-t14","s":"יכולת ייחודית קשה מאוד להעתקה, ולכן יכולה להעניק לחברה מובילות בשוק לאורך זמן.","a":true,"why":"נכון. זה ההבדל בינה לבין יכולת ליבה: יכולת ייחודית בלעדית ונדירה, ולכן היא מקור ישיר למובילות."}]},{"id":"s4","title":"אסטרטגיות תחרותיות גנריות","short":"אסטרטגיות גנריות","blurb":"חמש האסטרטגיות הגנריות: מנהיגות בעלות, בידול רחבה, ממוקדת בידול, ממוקדת מנהיגות בעלות ומשולבת (Best-cost), ואיך מזהים כל אחת מסיפור.","mnemonic":"שתי שאלות, ארבע משבצות: \"איך אני מנצח?\" (זול לי לייצר / הלקוח רואה בי משהו מיוחד) × \"את מי אני משרת?\" (כולם / נישה). זול+כולם = מנהיגות בעלות; מיוחד+כולם = בידול רחבה; זול+נישה = ממוקדת מנהיגות בעלות; מיוחד+נישה = ממוקדת בידול. גם זול וגם מיוחד לכולם = משולבת.","cheat":["אסטרטגיה גנרית = האופן שבו הפירמה משתמשת ביכולות ובמשאבים שלה מול המתחרים בענף","שאלה 1: מקור היתרון = עלות נמוכה או ייחודיות שהלקוח תופס","שאלה 2: היקף הפעילות = כל השוק (רחב) או נישה (Focus)","מנהיגות בעלות (Low Cost Provider) = מבנה העלויות הנמוך בענף + שוק רחב","מנהיגות בעלות ≠ \"המחיר הכי זול\" = המטרה היא העלות הכי נמוכה; המחיר הנמוך הוא כלי","איך מזהים מנהיגות בעלות = \"הורדת עלויות\", \"התייעלות\", \"יתרון לגודל\", \"ייצור המוני\", \"מוצר סטנדרטי\"","בידול רחבה (Broad Differentiation) = מוצר ייחודי בעיני הלקוח + שוק רחב + מחיר פרימיום","איך מזהים בידול רחבה = עיצוב, מותג, טכנולוגיה, חדשנות, שירות, לקוחות בכל העולם/כל הפלחים","ממוקדת בידול (Focused Differentiation) = ייחודיות לנישה צרה שמוכנה לשלם (רולס רויס, לחם נדיר)","ממוקדת מנהיגות בעלות (Focused Low Cost) = מוצר בסיסי וזול לנישה רגישה למחיר (סטודנטים, עסקים קטנים)","משולבת (Best-cost) = גם עלות נמוכה וגם בידול בו-זמנית (טבע, H&M, Zoom)","משולבת = תוספת למודל של פורטר, לא שלו, ואף סותרת אותו","נישה = קבוצת קונים מסוימת / פלח של קו מוצרים / שוק גאוגרפי מסוים","יכולת ליבה בהורדת עלויות = מנהיגות בעלות (לא בידול!)","יכולת ליבה בחדשנות/עיצוב/מותג = בידול","פורטר = בוחרים אסטרטגיה גנרית אחת בכל פעם; לאף אחת אין עדיפות","כל אסטרטגיה מוצלחת = הגנה מפני חמשת הכוחות + תשואה מעל הממוצע","סיכוני מנהיגות בעלות = שינוי טכנולוגי, חיקוי, בידול של מתחרה \"שווה\" את התוספת, מיקוד פנימה","סיכוני בידול = נתח שוק מוגבל, עלות בידול גבוהה, ירידה בביקוש לייחוד, חיקויים","סיכוני מיקוד = תת-נישה, צמצום ההבדלים בין הנישה לשוק, פער מחיר גדול מדי","תקועה באמצע (Stuck in the Middle) = לא בחרה אסטרטגיה ברורה, לא זולה ולא מיוחדת (סירס)"],"blocks":[{"t":"h","x":"מה זו אסטרטגיה גנרית?"},{"t":"p","x":"<b>אסטרטגיה גנרית</b> היא הדרך שבה החברה מנצלת את היכולות והמשאבים שלה כדי להתחרות מול החברות האחרות בענף."},{"t":"p","x":"\"גנרית\" = כללית. פורטר טען שלמרות שכל חברה שונה, יש כמה \"משפחות\" של אסטרטגיות שחוזרות בכל הענפים: בשירותים, בייצור, בהייטק."},{"t":"p","x":"הרעיון מאחורי זה הוא <b>Trade-off</b> (פשרה): אי אפשר תמיד גם וגם. המתח המרכזי שנלמד הוא בין <b>איכות</b> לבין <b>מחיר</b>."},{"t":"p","x":"למה זה חשוב? אסטרטגיה גנרית שמיושמת טוב נותנת <b>תשואה מעל הממוצע</b> (Above average returns) ו<b>הגנה מפני חמשת הכוחות התחרותיים</b>. לפי פורטר <b>אין עדיפות</b> לאחת מהאסטרטגיות: כל אחת יכולה להצליח."},{"t":"h","x":"שתי שאלות שקובעות את האסטרטגיה"},{"t":"steps","title":"כך בוחרים (וכך מזהים במבחן):","x":["<b>מה מקור היתרון התחרותי?</b> עלות נמוכה (אני מייצר זול יותר מכולם) או ייחודיות שהלקוח תופס (הלקוח רואה במוצר משהו מיוחד ומוכן לשלם עליו).","<b>מה היקף הפעילות?</b> שוק רחב (כל הענף, הרבה פלחים) או נישה (Focus): קבוצה צרה ומוגדרת.","מצליבים את שתי התשובות ומקבלים את המשבצת."]},{"t":"table","head":["","עלות נמוכה","ייחודיות בעיני הלקוח"],"rows":[["<b>שוק רחב</b>","<b>מנהיגות בעלות</b> (Low Cost Provider / Cost Leadership) – רמי לוי, וולמארט, ריינאייר","<b>בידול רחבה</b> (Broad Differentiation) – אפל, טסלה, סודהסטרים"],["<b>נישה</b>","<b>ממוקדת מנהיגות בעלות</b> (Focused Low Cost / Cost Focus) – יש חסד, אושר עד, הסטוק","<b>ממוקדת בידול</b> (Focused Differentiation) – רולס רויס, פטק פיליפ, לחם נדיר"]]},{"t":"p","x":"ויש גם אסטרטגיה חמישית: <b>משולבת מנהיגות בעלות/בידול</b> (Best-cost), שמנסה להיות גם זולה וגם מיוחדת."},{"t":"p","x":"פורטר קבע שבשלב ניסוח האסטרטגיה צריך <b>לבחור אסטרטגיה גנרית אחת</b>, ולא ליישם כמה בבת אחת."},{"t":"h","x":"1. מנהיגות בעלות (Low Cost Provider)"},{"t":"p","x":"המטרה: להיות <b>היצרן עם מבנה העלויות הנמוך ביותר בענף</b>. שימו לב: לא בהכרח \"הכי זול\" ולא בהכרח \"המחיר הכי טוב\". אם החברה מוכרת במחיר ממוצע אבל מייצרת בעלות הכי נמוכה, היא מרוויחה הכי הרבה."},{"t":"p","x":"הדרך הקלאסית: ייצור בקנה מידה גדול, כדי ליהנות מ<b>יתרון לגודל</b>. מתאים לרוב לעסקים גדולים שמוכרים מוצר \"סטנדרטי\" עם מעט בידול, שרוב הלקוחות מקבלים בקלות. לפעמים מנהיג העלות גם מוריד מחיר כדי להגדיל את נתח השוק."},{"t":"p","x":"מה צריך כדי להצליח:"},{"t":"list","x":["יתרון לגודל (כוח מיקוח מול ספקים, עלות נמוכה ליחידה)","פרודוקטיביות גבוהה וניצול קיבולת גבוה","ייצור רזה, למשל JIT","שימוש יעיל בטכנולוגיה בתהליך הייצור","ערוצי הפצה יעילים","נתח שוק גדול (כדי למכור הרבה יחידות)","שיתוף פעולה הדוק בין כל המחלקות ותרבות ארגונית של יעילות"]},{"t":"p","x":"סיכונים: <b>שינוי טכנולוגי</b> שמוריד את עלויות הייצור של אחרים; <b>חיקוי</b> של שיטות העבודה; <b>בידול שמקזז את היתרון</b> (אם המוצר הזול עולה 1,000 ₪ והמבודל 1,100 ₪, הרבה לקוחות יעדיפו לשלם עוד קצת); ו<b>מיקוד פנימה</b> בעלויות בלי לראות שהלקוחות השתנו (פורד אחרי המשבר)."},{"t":"example","title":"מנהיגות בעלות","x":"חברת BulkBox מוכרת קרטונים לכל סוגי העסקים בארץ. היא קונה נייר בכמויות ענק, המפעל שלה אוטומטי ועובד 24/7, והעלות שלה ליחידה הכי נמוכה בענף. → <b>מנהיגות בעלות</b>: יתרון מעלות (כמויות, אוטומציה) + שוק רחב (כל העסקים)."},{"t":"h","x":"2. בידול רחבה (Broad Differentiation)"},{"t":"p","x":"החברה הופכת את המוצר ל<b>ייחודי בעיני הלקוחות</b>, כך שהם רואים בו ערך גבוה יותר. הייחוד יכול לבוא מ<b>עיצוב, מותג, טכנולוגיה, תכונות, שירות לקוחות</b> ועוד. אפשר להתבדל ביותר ממימד אחד."},{"t":"p","x":"בזכות הבידול החברה יכולה לגבות <b>מחיר גבוה (פרימיום)</b> ולהשיג שולי רווח גבוהים. הדגש הוא על <b>התפיסה של הלקוח</b> (Perceived): מה שחשוב הוא שהלקוח רואה את המוצר כמיוחד. \"רחבה\" = פונה לשוק רחב, להרבה פלחים."},{"t":"p","x":"מה צריך כדי להצליח:"},{"t":"list","x":["הבנה עמוקה של צרכי וטעמי הלקוחות ומחקר מתמיד: מה הם מעריכים?","ידע ייחודי כדי לייצר ולשמר את הבידול","מבנה ותרבות שמגייסים מומחים, מעצימים ומכשירים אותם","תמריצים ותגמולים לעובדים על רעיונות לשיפור ולבידול","מוניטין: השקעה בשיווק ופרסום כדי שהלקוחות ימשיכו לראות את ההבדל"]},{"t":"p","x":"סיכונים: נתח שוק מוגבל יותר מאשר במנהיגות בעלות; ויתור על מנהיגות בעלות; עלות הבידול גבוהה ולקוחות עוברים למתחרה זול; ירידה בביקוש לבידול; <b>חיקויים</b> (למשל שיאומי מול אפל וסמסונג). בידול דורש חדשנות והשקעה שיווקית <b>מתמשכות</b>."},{"t":"example","title":"בידול רחבה","x":"חברת NovaPhone מוכרת סמארטפונים בכל העולם, לסטודנטים, למשפחות ולאנשי עסקים. המכשירים שלה ידועים בעיצוב ייחודי, במצלמה מתקדמת ובמותג חזק, והיא גובה מחיר גבוה מהמתחרים. → <b>בידול רחבה</b>: ייחודיות (עיצוב, טכנולוגיה, מותג) + שוק רחב (כל העולם, כל הפלחים)."},{"t":"h","x":"3–4. אסטרטגיות מיקוד (Focus)"},{"t":"p","x":"<b>אסטרטגיית מיקוד</b> = פעולות שנועדו לתת את המענה הטוב ביותר לצרכים של <b>פלח לקוחות צר ומוגדר היטב</b>. הנישה יכולה להיות:"},{"t":"list","x":["<b>קבוצת קונים מסוימת</b> (סטודנטים, עשירים מאוד, נכים, טבעונים)","<b>פלח של קו מוצרים</b> (רק צ'יפס מטוגן ביד)","<b>שוק גאוגרפי מסוים</b> (עיר אחת, אזור אחד)"]},{"t":"p","x":"בתוך הנישה בוחרים שוב: להתבדל או להיות זולים."},{"t":"table","head":["","ממוקדת בידול (Focused Differentiation)","ממוקדת מנהיגות בעלות (Focused Low Cost)"],"rows":[["מטרה","ערך ייחודי ומבודל לנישה","המחיר הנמוך ביותר לנישה"],["הצעת הערך","מוצר/שירות ייחודי שמתאים בדיוק לצרכי הקבוצה","מוצר בסיסי במחיר נמוך מהמתחרים"],["קהל היעד","נישה <b>שמוכנה לשלם</b> על התאמה, עיצוב, שירות או ייחוד","נישה <b>רגישה למחיר</b> (סטודנטים, עסקים קטנים)"],["ההצלחה תלויה ב...","חדשנות, הבנה עמוקה של הלקוח, מיתוג, מומחיות","שליטה בהוצאות, לוגיסטיקה יעילה, מודל הפעלה רזה"],["דגש תפעולי","עיצוב, התאמה אישית, שירות, חוויית משתמש","חיסכון, אוטומציה, רכיבים זולים"],["דוגמאות","Rolls Royce, פטק פיליפ, מלון Six Senses, לחם נדיר, ReWalk","ALDI, יש חסד, אושר עד, הסטוק, רמי לוי לעסקים קטנים"]]},{"t":"p","x":"סיכונים במיקוד: <b>מציאת תת-נישה</b> (מתחרה מתמקד בחלק קטן עוד יותר של הנישה שלך); <b>צמצום ההבדלים</b> (הצרכים של הנישה נעשים דומים לשל כל השוק); <b>פער מחיר גדול מדי</b> (מוצר הנישה המבודל עולה פי כמה מהמוצר של מנהיג העלות)."},{"t":"example","title":"ממוקדת בידול או ממוקדת מנהיגות בעלות?","x":"StudyMeal מוכרת ארוחות פשוטות וזולות רק לסטודנטים במעונות, ממטבח מרכזי אחד ובלי מלצרים. → <b>ממוקדת מנהיגות בעלות</b> (נישה + זול). PureRide בונה אופני מרוץ בעבודת יד, בהתאמה אישית לרוכבים מקצועיים, במחיר גבוה מאוד. → <b>ממוקדת בידול</b> (נישה + ייחודי)."},{"t":"h","x":"5. משולבת מנהיגות בעלות/בידול (Best-cost)"},{"t":"p","x":"האסטרטגיה הזו משלבת <b>בו-זמנית</b> עלות נמוכה ובידול. היא <b>תוספת למודל של פורטר</b> (פורטר לא פיתח אותה) והיא אפילו <b>סותרת</b> את התיאוריה שלו, כי לפי פורטר צריך לבחור אחת. היא נוספה כי בפרקטיקה חברות רבות עושות את זה."},{"t":"list","x":["<b>התייעלות תפעולית חכמה</b>: מוזילים עלויות בלי לפגוע באיכות","<b>ערך ברור ללקוח</b>: בידול במוצר, בשירות או במותג","<b>טכנולוגיה ואוטומציה</b>: שומרים על רווחיות לצד חדשנות"]},{"t":"p","x":"דוגמאות להצלחה: <b>H&M</b> (אופנה עדכנית במחיר נגיש), <b>Zoom</b> (פתרון זול יחסית עם חוויית משתמש טובה), <b>IKEA</b> (מחיר נמוך + עיצוב וחוויית קנייה שונה). הדוגמה של המרצה: <b>טבע</b>, שגם מייצרת גנריקה בעלות נמוכה וגם משקיעה בפיתוח תרופות מקור (בידול). היום טבע פחות מצליחה, כי היא \"לכודה\" בין שתי המטרות."},{"t":"p","x":"כשהשילוב לא מצליח, החברה מאבדת מיקוד (Yahoo!, JCPenney, BlackBerry)."},{"t":"p","x":"<b>תקועה באמצע</b> (Stuck in the Middle): חברה שלא יישמה בהצלחה אף אסטרטגיה, ולא נתפסת לא כזולה ולא כמיוחדת (סירס)."},{"t":"example","title":"משולבת","x":"חברת FitWear מוכרת בגדי ספורט לכל הקהל. בזכות רובוטים במחסנים ורכש חכם העלויות שלה נמוכות והמחירים נגישים, ובמקביל העיצובים שלה ייחודיים ומתחלפים כל חודש. → <b>משולבת</b>: גם עלות נמוכה וגם בידול, לשוק רחב."},{"t":"h","x":"איך פותרים שאלת סיפור"},{"t":"steps","title":"שלושה צעדים:","x":["חפשו את <b>מקור היתרון</b>: מילים כמו \"הורדת עלויות\", \"התייעלות\", \"יעילות\", \"ייצור המוני\", \"מחיר נמוך\" → עלות. מילים כמו \"ייחודי\", \"יוקרתי\", \"עיצוב\", \"חדשני\", \"איכות\", \"מותג\", \"התאמה אישית\" → בידול.","חפשו את <b>היקף השוק</b>: \"לכל\", \"בכל העולם\", \"קהל רחב\", \"כל הפלחים\" → רחב. \"רק ל...\", \"קהל יעד של...\", \"לקוחות אמידים במיוחד\", \"סטודנטים\", \"אזור מסוים\" → נישה.","אם יש בסיפור <b>גם</b> עלות נמוכה <b>וגם</b> ייחודיות באותה נשימה → משולבת."]},{"t":"trap","x":"\"ממוקדת בידול\" מול \"ממוקדת מנהיגות בעלות\": בשתיהן יש נישה! ההבדל הוא רק במקור היתרון. נישה + יוקרה/ייחוד = ממוקדת <b>בידול</b>. נישה + זול/בסיסי = ממוקדת <b>מנהיגות בעלות</b>. היגד כמו \"בידול ממוקד מתאים לחברה שמוכרת מוצרים זולים במיוחד לנישה\" הוא <b>לא נכון</b>."},{"t":"trap","x":"יכולת ליבה (Core Competence) בהורדת עלויות מובילה ל<b>מנהיגות בעלות</b>, לא לבידול. יכולת ליבה בחדשנות, בעיצוב או במותג מובילה ל<b>בידול</b>. המבחן אוהב להחליף ביניהן."},{"t":"trap","x":"\"מנהיגות בעלות\" = העלות הכי נמוכה, לא בהכרח המחיר הכי נמוך. ואל תתבלבלו עם <b>אוקיינוס כחול</b> (יחידה 2): שם יוצרים שוק חדש בלי מתחרים, וזו לא אחת מהאסטרטגיות הגנריות."},{"t":"trap","x":"טסלה מופיעה במצגת פעם כבידול רחבה (במטריצה) ופעם כממוקדת בידול (לקוחות עם מודעות סביבתית). במבחן תחליטו לפי <b>מה שכתוב בסיפור</b>: האם מדובר בשוק רחב או בנישה מוגדרת?"},{"t":"exam","x":"ברב-ברירה: סיפור על חברה ← \"איזו אסטרטגיה מתאימה?\". הארבע הגנריות + המשולבת מופיעות כמסיחים, ולפעמים גם אוקיינוס כחול. בנכון/לא נכון: היגדים כמו \"מנהיגות בעלות מתמקדת בהפחתת עלויות\" (נכון) או היגד שמחליף בין עלות לבידול (לא נכון). בנימוק כתבו את שתי השאלות: מה מקור היתרון ומה היקף השוק."}],"mcq":[{"id":"s4-1","q":"חברת CampusBite מפעילה דוכני אוכל רק בקמפוסים של אוניברסיטאות. התפריט פשוט ובסיסי, כל המנות מוכנות במטבח מרכזי אחד, ואין שירות מלצרים. כך החברה מצליחה להציע לסטודנטים את המחירים הנמוכים ביותר באזור. איזו אסטרטגיה תחרותית גנרית מאפיינת את החברה?","o":["אסטרטגיית ממוקדת מנהיגות בעלות","אסטרטגיית מנהיגות בעלות","אסטרטגיית ממוקדת בידול","אסטרטגיית בידול רחבה"],"a":0,"why":"שתי מילות מפתח: \"רק בקמפוסים\" / \"לסטודנטים\" = נישה צרה ורגישה למחיר, ו\"פשוט, בסיסי, מטבח מרכזי, המחירים הנמוכים ביותר\" = יתרון מעלות. נישה + עלות = ממוקדת מנהיגות בעלות.","w":["","מנהיגות בעלות (בלי \"ממוקדת\") פונה לשוק רחב; כאן הקהל הוא סטודנטים בלבד.","בידול ממוקד דורש מוצר ייחודי שהנישה מוכנה לשלם עליו יותר; כאן המוצר בסיסי וזול.","אין כאן לא ייחודיות ולא שוק רחב."]},{"id":"s4-2","q":"חברת VeloCraft בונה אופני מרוץ בעבודת יד. כל זוג אופניים מותאם למידות הגוף ולסגנון הרכיבה של רוכב מקצועי אחד, והמחיר גבוה פי חמישה מאופניים רגילים. החברה מוכרת רק לרוכבי מרוץ מקצועיים. איזו אסטרטגיה מתאימה לתיאור?","o":["אסטרטגיית בידול רחבה","אסטרטגיית ממוקדת בידול","אסטרטגיית ממוקדת מנהיגות בעלות","אסטרטגיית משולבת מנהיגות בעלות/בידול"],"a":1,"why":"\"עבודת יד\", \"מותאם\", \"מחיר גבוה\" = ייחודיות; \"רק לרוכבי מרוץ מקצועיים\" = נישה. ייחודיות + נישה = ממוקדת בידול.","w":["בידול רחבה פונה לשוק רחב; כאן הקהל צר מאוד.","","אין כאן עלות נמוכה: המחיר גבוה פי חמישה.","אין שום ניסיון להוריד עלויות, ולכן זו לא אסטרטגיה משולבת."]},{"id":"s4-3","q":"רשת MegaSave פועלת בכל רחבי הארץ ומוכרת מוצרי מזון וניקיון סטנדרטיים לכל האוכלוסייה. בזכות רכש בכמויות ענק, מחסנים אוטומטיים ושימוש יעיל בטכנולוגיה, מבנה העלויות שלה הוא הנמוך ביותר בענף. איזו אסטרטגיה מאפיינת את הרשת?","o":["אסטרטגיית מנהיגות בעלות","אסטרטגיית בידול רחבה","אסטרטגיית ממוקדת מנהיגות בעלות","אסטרטגיית משולבת מנהיגות בעלות/בידול"],"a":0,"why":"\"מבנה העלויות הנמוך ביותר בענף\", \"כמויות ענק\", \"מוצרים סטנדרטיים\" = מנהיגות בעלות; \"בכל רחבי הארץ, לכל האוכלוסייה\" = שוק רחב.","w":["","אין בסיפור שום ייחוד שהלקוח תופס; המוצרים סטנדרטיים.","הרשת פונה לכל האוכלוסייה ולא לנישה.","במשולבת צריך גם בידול ברור; כאן יש רק עלות."]},{"id":"s4-4","q":"חברת Lumio מוכרת טלפונים חכמים בכל העולם, לכל קבוצות הגיל ולכל סוגי הלקוחות. הטלפונים שלה ידועים בעיצוב ייחודי, במצלמה החדשנית ביותר בשוק ובמותג חזק, והיא גובה עליהם מחיר גבוה מהמתחרים. איזו אסטרטגיה מאפיינת את Lumio?","o":["אסטרטגיית בידול רחבה","אסטרטגיית ממוקדת בידול","אסטרטגיית מנהיגות בעלות","אסטרטגיית ממוקדת מנהיגות בעלות"],"a":0,"why":"\"עיצוב ייחודי\", \"חדשנית\", \"מותג חזק\", \"מחיר גבוה\" = בידול; \"בכל העולם, לכל סוגי הלקוחות\" = שוק רחב. לכן בידול רחבה.","w":["","ממוקדת בידול פונה לנישה צרה; Lumio פונה לכל סוגי הלקוחות.","מנהיגות בעלות מבוססת על עלות נמוכה; כאן המחיר גבוה והיתרון הוא הייחוד.","אין כאן לא נישה ולא עלות נמוכה."]},{"id":"s4-5","q":"לחברת PackLine יש יכולת ליבה מובהקת בהורדת עלויות הייצור: קווי ייצור רזים, ניצול קיבולת מלא ורכש בכמויות גדולות. החברה מוכרת אריזות לכל הענף. לפי מודל פורטר, איזו אסטרטגיה גנרית מתאימה לה ביותר?","o":["אסטרטגיית בידול רחבה","אסטרטגיית מנהיגות בעלות","אסטרטגיית ממוקדת בידול","אסטרטגיית אוקיינוס כחול"],"a":1,"why":"יכולת ליבה בהורדת עלויות + שוק רחב (\"לכל הענף\") = מנהיגות בעלות. יכולת הליבה צריכה להתאים למקור היתרון שהחברה בוחרת.","w":["בידול מבוסס על ייחודיות בעיני הלקוח, לא על עלויות נמוכות. זו ההחלפה הקלאסית במבחן.","","אין כאן נישה ואין כאן ייחוד.","אוקיינוס כחול היא יצירת שוק חדש בלי מתחרים, לא אחת מהאסטרטגיות הגנריות של פורטר."]},{"id":"s4-6","q":"לפי פורטר, בחירת האסטרטגיה הגנרית של פירמה מבוססת על התשובה לשתי שאלות. מהן?","o":["מהם החוזקות והחולשות של הפירמה ומהן ההזדמנויות והאיומים","כמה מתחרים יש בענף ומה עוצמת הספקים","מה מקור היתרון התחרותי (עלות נמוכה או ייחודיות) ומה היקף הפעילות (שוק רחב או נישה)","מהו החזון של הפירמה ומהם הערכים שלה"],"a":2,"why":"שתי השאלות של פורטר: על מה מבוסס היתרון (עלות או ייחוד) ועל איזה שוק מתחרים (רחב או נישה). הצלבתן נותנת את ארבע המשבצות.","w":["זה ניתוח SWOT.","מספר המתחרים ועוצמת הספקים הם חלק ממודל חמשת הכוחות, לא מבחירת האסטרטגיה הגנרית.","","חזון וערכים שייכים למשימות הניהול האסטרטגי (יחידה 1)."]},{"id":"s4-7","q":"מה המטרה המדויקת של אסטרטגיית מנהיגות בעלות?","o":["להציע מוצר בסיסי וזול לנישה רגישה למחיר","להציע תמיד את המחיר הנמוך ביותר בשוק","להיות היצרן בעל מבנה העלויות הנמוך ביותר בענף","ליצור שוק חדש שבו אין מתחרים"],"a":2,"why":"במנהיגות בעלות המטרה היא העלות הנמוכה ביותר. המחיר הנמוך הוא רק כלי שאפשר להשתמש בו; גם במחיר ממוצע מנהיג העלות מרוויח הכי הרבה.","w":["זו ממוקדת מנהיגות בעלות, שפונה לנישה ולא לכל השוק.","המחיר הנמוך אינו המטרה עצמה. המצגת מדגישה: \"לא הכי זולה ולא עם המחיר הכי טוב\", אלא מבנה העלויות הנמוך ביותר.","","זו אסטרטגיית אוקיינוס כחול."]},{"id":"s4-8","q":"חברת התעופה SkyLow היא מנהיגת עלות בענף. מתחרה חדשה אימצה טכנולוגיה חדשה להפעלת מטוסים, שמורידה את עלויות התפעול שלה הרבה מתחת לעלויות של SkyLow. איזה סיכון של אסטרטגיית מנהיגות בעלות מתממש כאן?","o":["פער מחיר גדול מדי מול מוצרים מבודלים","מציאת תת-נישה","ירידה בביקוש לייחוד","שינויים בטכנולוגיה"],"a":3,"why":"\"טכנולוגיה חדשה שמורידה עלויות\" = שינוי טכנולוגי, הסיכון הראשון של מנהיגות בעלות: פיתוח שמשנה את עלויות הייצור מבטל את היתרון.","w":["פער מחיר גדול מדי הוא סיכון של בידול ממוקד.","תת-נישה היא סיכון של אסטרטגיות מיקוד.","ירידה בביקוש לייחוד היא סיכון של בידול.",""]},{"id":"s4-9","q":"חברת GreenFuel מוכרת תוספי תזונה מיוחדים לספורטאים טבעוניים ומרוויחה יפה. לאחרונה נכנסה חברה חדשה שמתמקדת רק ברצי מרתון טבעוניים, ומציעה להם מוצרים מותאמים עוד יותר. איזה סיכון של אסטרטגיית מיקוד מתואר כאן?","o":["ויתור על מנהיגות בעלות","שינויים בטכנולוגיה","מציאת תת-נישה","מיקוד פנימי בעלויות"],"a":2,"why":"המתחרה מצאה חלק קטן יותר בתוך הנישה (\"רק רצי מרתון\" בתוך \"ספורטאים טבעוניים\"). זה בדיוק הסיכון של מציאת תת-נישה.","w":["ויתור על מנהיגות בעלות הוא סיכון של בידול רחבה, ולא מתאר את מה שקרה.","לא מדובר בטכנולוגיה חדשה.","","מיקוד פנימי בעלויות הוא סיכון של מנהיגות בעלות."]},{"id":"s4-10","q":"חברת PharmaOne היא אחת מיצרניות התרופות הגנריות הגדולות בעולם ומייצרת אותן בעלות נמוכה מאוד. במקביל היא משקיעה סכומים גדולים בפיתוח תרופות מקור חדשניות. איזו אסטרטגיה מתארת את החברה?","o":["אסטרטגיית ממוקדת בידול","אסטרטגיית מנהיגות בעלות","אסטרטגיית בידול רחבה","אסטרטגיית משולבת מנהיגות בעלות/בידול"],"a":3,"why":"\"עלות נמוכה מאוד\" (גנריקה) + \"תרופות מקור חדשניות\" (בידול) באותו זמן = משולבת. זה בדיוק המקרה של טבע מהמצגת.","w":["אין כאן נישה; החברה פועלת בכל העולם.","מנהיגות בעלות לבד מתעלמת מההשקעה בתרופות מקור, שהיא בידול.","בידול לבד מתעלם מהייצור בעלות נמוכה.",""]},{"id":"s4-11","q":"חברת BizLine מציעה רק לעסקים קטנים חבילות סלולר בסיסיות, בלי תוספות, במחיר הנמוך ביותר בשוק. היא מפעילה מודל רזה: אין חנויות, הכול באתר, ושירות הלקוחות אוטומטי. איזו אסטרטגיה מאפיינת אותה?","o":["אסטרטגיית ממוקדת בידול","אסטרטגיית ממוקדת מנהיגות בעלות","אסטרטגיית מנהיגות בעלות","אסטרטגיית משולבת מנהיגות בעלות/בידול"],"a":1,"why":"\"רק לעסקים קטנים\" = נישה רגישה למחיר; \"בסיסיות, בלי תוספות, מחיר נמוך, מודל רזה, אוטומטי\" = עלות. נישה + עלות = ממוקדת מנהיגות בעלות.","w":["אין בסיפור ייחוד שהנישה מוכנה לשלם עליו.","","החברה לא פונה לכל השוק אלא רק לעסקים קטנים.","אין כאן בידול, רק עלות."]},{"id":"s4-12","q":"איזה מההיגדים הבאים נכון לגבי האסטרטגיות הגנריות של פורטר?","o":["אסטרטגיית מנהיגות בעלות תמיד רווחית יותר מאסטרטגיית בידול","לאף אחת מהאסטרטגיות אין עדיפות, וכל אחת מהן יכולה לתת הגנה מפני חמשת הכוחות","פורטר ממליץ ליישם בו-זמנית את כל האסטרטגיות כדי לפזר סיכונים","פורטר הוא שפיתח את האסטרטגיה המשולבת כחלק מהמודל המקורי"],"a":1,"why":"המצגת קובעת במפורש: אין עדיפות לאחת מהאסטרטגיות, וכל אחת שמיושמת היטב נותנת תשואה מעל הממוצע והגנה מפני חמשת הכוחות.","w":["אין אסטרטגיה ש\"תמיד\" עדיפה. המילה \"תמיד\" היא סימן אזהרה.","","פורטר טוען ההפך: צריך לבחור אסטרטגיה גנרית אחת בכל פעם.","המשולבת היא תוספת למודל ולא פותחה על ידי פורטר; היא אף סותרת את התיאוריה שלו."]},{"id":"s4-13","q":"חברת LogiFast רוצה ליישם אסטרטגיית מנהיגות בעלות. איזה מהצעדים הבאים מתאים ביותר לאסטרטגיה זו?","o":["ייצור בקנה מידה גדול כדי לנצל יתרונות לגודל","השקעה גדולה בעיצוב ייחודי ובמיתוג יוקרתי","התמקדות בפלח קטן של לקוחות עשירים במיוחד","גיוס מומחים ותגמולם על רעיונות לבידול המוצר"],"a":0,"why":"הדרך הקלאסית להשגת מנהיגות בעלות היא ייצור בקנה מידה גדול: העלות ליחידה יורדת, יש כוח מיקוח מול ספקים, ונתח השוק גדל.","w":["","עיצוב ומיתוג יוקרתי הם כלים של בידול.","פלח של עשירים במיוחד = נישה שמוכנה לשלם, כלומר ממוקדת בידול.","גיוס מומחים ותגמול על רעיונות לבידול הם דרישות של אסטרטגיית בידול."]},{"id":"s4-14","q":"באסטרטגיית בידול, על מה מושם הדגש?","o":["על מכירה לשוק גאוגרפי אחד בלבד","על עלות הייצור הנמוכה ביותר בענף","על התפיסה של הלקוח שהמוצר ייחודי ובעל ערך גבוה יותר","על מספר יחידות גדול ככל האפשר כדי לנצל יתרון לגודל"],"a":2,"why":"בבידול מה שקובע הוא איך הלקוח רואה את המוצר (Perceived): ייחודי, בעל תכונה או יתרון מיוחד. בזכות זה אפשר לגבות מחיר פרימיום.","w":["שוק גאוגרפי אחד הוא סוג של נישה (מיקוד), לא מהות הבידול.","זה הדגש של מנהיגות בעלות.","","כמויות גדולות ויתרון לגודל שייכים למנהיגות בעלות."]},{"id":"s4-15","q":"מאפייה קטנה בחיפה מוכרת לחם מחמצת ייחודי, אפוי לפי מתכונים עתיקים מקמח מיוחד, רק לתושבי העיר. הלקוחות מוכנים לשלם עליו כמעט כפול ממחיר לחם רגיל. איזו אסטרטגיה מאפיינת את המאפייה?","o":["אסטרטגיית מנהיגות בעלות","אסטרטגיית בידול רחבה","אסטרטגיית ממוקדת מנהיגות בעלות","אסטרטגיית ממוקדת בידול"],"a":3,"why":"נישה יכולה להיות גם <b>שוק גאוגרפי מסוים</b> (\"רק לתושבי העיר\"). יחד עם \"ייחודי\" ו\"מוכנים לשלם כמעט כפול\" = ממוקדת בידול.","w":["אין כאן עלות נמוכה ולא שוק רחב.","הלחם ייחודי, אבל השוק אינו רחב: רק עיר אחת.","המחיר גבוה ולא נמוך.",""]},{"id":"s4-16","q":"חברת OfficeNow מוכרת רהיטים לכל הקהל. בגלל ייצור אוטומטי ורכש חכם המחירים שלה נמוכים, ובמקביל העיצובים שלה ייחודיים וחוויית הקנייה בחנויות שונה מכל המתחרים. לאחרונה המנכ\"ל אמר: \"אנחנו לא בוחרים בין מחיר לייחוד, אנחנו נותנים את שניהם\". איזו אסטרטגיה מתוארת?","o":["אסטרטגיית ממוקדת בידול","אסטרטגיית בידול רחבה","אסטרטגיית מנהיגות בעלות","אסטרטגיית משולבת מנהיגות בעלות/בידול"],"a":3,"why":"\"מחירים נמוכים\" + \"עיצובים ייחודיים וחוויית קנייה שונה\" באותו זמן = משולבת (Best-cost), שמבוססת על התייעלות תפעולית חכמה לצד ערך ברור ללקוח.","w":["החברה פונה לכל הקהל, לא לנישה.","בידול רחבה לבד לא כולל מחירים נמוכים.","מנהיגות בעלות לבד לא כוללת עיצוב ייחודי כחלק מרכזי מהיתרון.",""]}],"tf":[{"id":"s4-t1","s":"אסטרטגיית מנהיגות בעלות שואפת להשיג את מבנה העלויות הנמוך ביותר בענף, גם אם המחיר לצרכן אינו בהכרח הנמוך ביותר.","a":true,"why":"נכון. המטרה היא להיות היצרן בעל העלות הנמוכה ביותר; מחיר נמוך הוא כלי אפשרי, ומנהיג העלות מרוויח הכי הרבה גם במחיר ממוצע."},{"id":"s4-t2","s":"אסטרטגיית ממוקדת מנהיגות בעלות מתאימה לחברה שמוכרת מוצרי יוקרה ייחודיים לקבוצה קטנה של לקוחות עשירים.","a":false,"why":"לא נכון. ייחוד ויוקרה לנישה = ממוקדת בידול. ממוקדת מנהיגות בעלות = מוצר בסיסי וזול לנישה רגישה למחיר."},{"id":"s4-t3","s":"לחברה שיכולת הליבה שלה היא חדשנות ועיצוב ייחודי, האסטרטגיה הגנרית המתאימה ביותר היא מנהיגות בעלות.","a":false,"why":"לא נכון. חדשנות ועיצוב יוצרים ייחודיות בעיני הלקוח, ולכן מתאימים לבידול. יכולת ליבה בהורדת עלויות היא שמתאימה למנהיגות בעלות."},{"id":"s4-t4","s":"הנישה באסטרטגיית מיקוד יכולה להיות שוק גאוגרפי מסוים.","a":true,"why":"נכון. פלח צר יכול להיות קבוצת קונים מסוימת, פלח של קו מוצרים או שוק גאוגרפי מסוים."},{"id":"s4-t5","s":"לפי פורטר, בשלב ניסוח האסטרטגיה על הפירמה לבחור אסטרטגיה גנרית אחת ולא ליישם כמה במקביל.","a":true,"why":"נכון. פורטר קובע שאי אפשר ליישם בו-זמנית יותר מאסטרטגיה גנרית אחת, בגלל עקרון ה-Trade-off בין איכות למחיר."},{"id":"s4-t6","s":"האסטרטגיה המשולבת (מנהיגות בעלות/בידול) פותחה על ידי פורטר כחלק מהמודל המקורי שלו.","a":false,"why":"לא נכון. המשולבת היא תוספת למודל שלא פותחה על ידי פורטר, והיא אף סותרת את טענתו שיש לבחור אסטרטגיה אחת."},{"id":"s4-t7","s":"אסטרטגיית בידול רחבה מאפשרת לחברה לגבות מחיר פרימיום, כי הלקוחות תופסים את המוצר כייחודי.","a":true,"why":"נכון. הבידול יוצר בעיני הלקוח ערך גבוה יותר (עיצוב, מותג, טכנולוגיה, שירות), ולכן הוא מוכן לשלם יותר."},{"id":"s4-t8","s":"אסטרטגיית מנהיגות בעלות מתאימה בעיקר לעסקים קטנים שמציעים מוצרים בהתאמה אישית לכל לקוח.","a":false,"why":"לא נכון. מנהיגות בעלות מתאימה לעסקים גדולים שמייצרים מוצר סטנדרטי בקנה מידה גדול ונהנים מיתרון לגודל."},{"id":"s4-t9","s":"חיקוי על ידי מתחרים הוא סיכון גם באסטרטגיית מנהיגות בעלות וגם באסטרטגיית בידול.","a":true,"why":"נכון. במנהיגות בעלות מתחרים לומדים ומחקים את שיטות ההתייעלות, ובבידול מחקים את המוצר (למשל שיאומי מול אפל)."},{"id":"s4-t10","s":"לפי פורטר, אסטרטגיית מנהיגות בעלות עדיפה על שאר האסטרטגיות הגנריות, כי היא מגינה בצורה הטובה ביותר מפני חמשת הכוחות.","a":false,"why":"לא נכון. לפי פורטר אין עדיפות לאף אסטרטגיה; כל אחת שמיושמת בהצלחה נותנת הגנה מפני חמשת הכוחות ותשואה מעל הממוצע."},{"id":"s4-t11","s":"באסטרטגיית ממוקדת בידול, קהל היעד הוא נישה רגישה מאוד למחיר.","a":false,"why":"לא נכון. בבידול ממוקד הנישה מוכנה לשלם על ייחוד, התאמה ועיצוב. נישה רגישה למחיר מתאימה לממוקדת מנהיגות בעלות."},{"id":"s4-t12","s":"יישום מוצלח של אסטרטגיה גנרית יכול לתת לפירמה תשואה מעל הממוצע בענף.","a":true,"why":"נכון. זו הסיבה לפתח אסטרטגיה גנרית: להשיג Above average returns ולהגן על הפירמה מפני כוחות התחרות."},{"id":"s4-t13","s":"בידול יכול להתבסס רק על טכנולוגיה מתקדמת.","a":false,"why":"לא נכון. בידול יכול לנבוע מעיצוב, מותג, תכונות, שירות לקוחות ועוד, ואפשר להתבדל ביותר ממימד אחד."},{"id":"s4-t14","s":"פירמה שלא בחרה באסטרטגיה גנרית ברורה, ולא נתפסת לא כזולה ולא כמיוחדת, נמצאת במצב של \"תקועה באמצע\".","a":true,"why":"נכון. Stuck in the Middle = פירמה שלא יישמה בהצלחה אף אסטרטגיה ומאבדת יתרון תחרותי, כמו סירס."}]},{"id":"s5","title":"חדשנות","short":"חדשנות","blurb":"מהי חדשנות, טכנולוגית מול א-טכנולוגית, מדד GII, חדשנות מו\"פ (מוצר) מול חדשנות תהליך, וחדשנות סגורה מול חדשנות פתוחה.","mnemonic":"שלושה זוגות: \"עם מחשב או בלי\" (טכנולוגית / א-טכנולוגית), \"מה או איך\" (מו\"פ = מה אנחנו מציעים → בידול; תהליך = איך אנחנו מייצרים ומספקים → עלות נמוכה), \"דלת נעולה או דלת מסתובבת\" (סגורה = הכול בפנים; פתוחה = ידע נכנס וגם יוצא).","cheat":["חדשנות = מוצר, שירות, תהליך או מודל עסקי חדש או משופר מהותית, שמיושם בפועל ויוצר ערך","רעיון שלא יושם = לא חדשנות","חדשנות טכנולוגית = שימוש בטכנולוגיה חדשה (חומרה/תוכנה): טסלה, Waze, Mobileye","חדשנות א-טכנולוגית = חדשנות במודל עסקי, שירות, ארגון או שיווק, בלי טכנולוגיה חדשה: IKEA, Zappos","אפשר לחדש בלי טכנולוגיה חדשה = נכון","GII (Global Innovation Index) = מדד עולמי שמדרג כ-130 כלכלות (מדינות) לפי כ-80 אינדיקטורים","GII בודק = סביבת מדיניות, חינוך, תשתיות, יצירת ידע; משווים לאזור או לקבוצת הכנסה","GIL (Frost & Sullivan) = Growth, Innovation, Leadership; מסגרת חשיבה לחברות, לא מדד כמותי","חדשנות מו\"פ (R&D) = מחקר → פיתוח → מסחור של מוצר/טכנולוגיה חדשה; השקעה גבוהה, סיכון גבוה","חדשנות מוצר = מוצר/שירות חדש או משופר מהותית בתכונות או בשימוש; זה מה שמו\"פ מייצר","מו\"פ עונה על = \"מה אנחנו מציעים?\" → קשור לבידול","חדשנות תהליך =
