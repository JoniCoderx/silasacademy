 דרך חדשה לייצר/לספק, בלי לשנות מהותית את המוצר: Toyota Lean, רובוטים של Amazon","תהליך עונה על = \"איך אנחנו מציעים את זה טוב יותר?\" → קשור למנהיגות בעלות","חדשנות תהליך = לא בהכרח נראית ללקוח; סיכון בינוני","חדשנות סגורה = כל המו\"פ בפנים, שליטה מלאה, הגנה על קניין רוחני: Apple בעבר, Intel","חדשנות פתוחה (Chesbrough) = זרימה מכוונת של ידע פנימה וגם החוצה","פתוחה בסיפור = אקדמיה, סטארטאפים, ספקים, לקוחות, רישוי ידע, האקתון, מיזם משותף","דוגמאות פתוחה = P&G Connect+Develop, Lego Ideas, BMW Startup Garage","סגורה מול פתוחה = איטית ויקרה מול מהירה ועלויות מתפזרות"],"blocks":[{"t":"h","x":"מה זו חדשנות?"},{"t":"p","x":"<b>חדשנות</b> היא תהליך (או תוצאה) של יצירת מוצר, שירות, תהליך או מודל עסקי <b>חדש או משופר באופן מהותי</b>, שמבדל את הארגון ממה שהיה בעבר, ו<b>מיושם בפועל</b> בשוק או בתוך הארגון."},{"t":"p","x":"שלושה דברים חשובים בהגדרה:"},{"t":"list","x":["<b>חדש או משופר מהותית</b>: שינוי קטן וקוסמטי הוא לא חדשנות.","<b>מיושם בפועל</b>: רעיון טוב שנשאר על הנייר הוא לא חדשנות. חדשנות מחייבת שינוי בפועל.","<b>יוצר ערך</b>: ערך כלכלי, חברתי או סביבתי, ללקוח ולארגון."]},{"t":"p","x":"חדשנות היא לא רק טכנולוגיה. היא כוללת גם שינויים ארגוניים, שיווקיים וחברתיים. היא יכולה להיות טכנולוגית או לא-טכנולוגית, הדרגתית (רציפה) או מהפכנית."},{"t":"p","x":"למה חדשנות חשובה לאסטרטגיה? היא יוצרת <b>יתרון תחרותי בר-קיימא</b>, עוזרת להגיב לסביבה משתנה, פותחת שווקים חדשים (אוקיינוס כחול), משפרת תהליכים פנימיים, שומרת על לקוחות, ומושכת עובדים, שותפים ומשקיעים."},{"t":"h","x":"חדשנות טכנולוגית וחדשנות א-טכנולוגית"},{"t":"table","head":["","חדשנות טכנולוגית (Technological Innovation)","חדשנות א-טכנולוגית (Non-Technological Innovation)"],"rows":[["מה זה","שימוש ב<b>טכנולוגיה חדשה</b>, חומרה או תוכנה, כדי לפתח מוצר, שירות או תהליך ייחודי או משופר","חדשנות ב<b>מודל העסקי, בשירות, בארגון או בשיווק</b>, שמבוססת על חשיבה עסקית יצירתית ולא על טכנולוגיה חדשה"],["מילים בסיפור","\"פיתחה תוכנה\", \"חיישנים\", \"בינה מלאכותית\", \"מערכת הנעה חדשה\", \"פלטפורמה דיגיטלית\"","\"שינתה את המודל העסקי\", \"שירות לקוחות יוצא דופן\", \"מיתוג מחדש\", \"חוויית אירוח\", \"עשה זאת בעצמך\""],["דוגמאות","Tesla (הנעה חשמלית, נהיגה אוטונומית), Apple (האייפון), Waze, Mobileye","IKEA (מכירה בשיטת DIY + חנות מעוצבת), Zappos (שירות לקוחות כמנוע אסטרטגי), קפה לנדוור (מיתוג מחדש וחוויית אירוח)"]]},{"t":"example","title":"טכנולוגית או א-טכנולוגית?","x":"רשת המספרות CutClub החליטה שהלקוחות משלמים מנוי חודשי קבוע ומסתפרים כמה שרוצים. לא נוסף שום מכשיר או תוכנה חדשים. → <b>חדשנות א-טכנולוגית</b>: החידוש הוא במודל העסקי. לעומת זאת, אם CutClub הייתה מפתחת אפליקציה שסורקת את הפנים וממליצה על תספורת בעזרת בינה מלאכותית → <b>חדשנות טכנולוגית</b>."},{"t":"trap","x":"היגד כמו \"חברה יכולה לחדש גם בלי טכנולוגיות חדשות\" הוא <b>נכון</b>, בדיוק בגלל החדשנות הא-טכנולוגית. והיגד כמו \"חדשנות היא תמיד פיתוח טכנולוגי\" הוא <b>לא נכון</b>."},{"t":"h","x":"מדד GII (Global Innovation Index)"},{"t":"p","x":"<b>מדד החדשנות העולמי (GII)</b> מודד כמה חדשנית כל <b>כלכלה</b> (מדינה) בעולם. הוא מפורסם על ידי WIPO (ארגון הקניין הרוחני העולמי)."},{"t":"list","x":["מדרג את ביצועי החדשנות של <b>כ-130 כלכלות</b>, ומראה את נקודות החוזק והחולשה של כל אחת.","מבוסס על <b>כ-80 אינדיקטורים</b>: סביבת המדיניות, חינוך, תשתיות ויצירת ידע בכלכלה.","מאפשר לנטר ביצועים ו<b>להשוות</b> מדינה לכלכלות באותו אזור או באותה קבוצת הכנסה.","מדד 2024 מתאר צמיחה עולמית יציבה אבל איטית, ירידה במימון החדשנות ופריון איטי. הוא גם מציג את הוצאות המו\"פ של החברות המובילות בתעשיות שונות."]},{"t":"p","x":"במצגת מופיעה גם מסגרת בשם <b>GIL</b> של חברת Frost & Sullivan. זו <b>מסגרת חשיבה ולא מדד כמותי</b>, והיא בוחנת אם <b>חברה</b> יודעת לצמוח, לחדש ולהוביל לאורך זמן:"},{"t":"table","head":["אות","מה בודקים","הקשר לאסטרטגיה (לפי המצגת)"],"rows":[["<b>G</b> – Growth (צמיחה)","צמיחה עקבית ובת-קיימא גם בזמן שינויים מהירים","בחירה נכונה של אסטרטגיית צמיחה; עדות ליישום אחת האסטרטגיות הגנריות"],["<b>I</b> – Innovation (חדשנות)","חדשנות כתהליך מתמשך: מוצר, מודל עסקי, חוויית לקוח","הופכת ליכולת ליבה, יוצרת <b>בידול</b> ומעבר מאוקיינוס אדום לכחול"],["<b>L</b> – Leadership (מנהיגות)","חזון ארוך טווח והשפעה על מגמות בשוק","קובעת את התרבות הארגונית ואת היכולת להוביל שינוי, לא רק להגיב לו"]]},{"t":"example","title":"GIL בחברה אחת","x":"Fiverr: צמיחה גלובלית מהירה בשוק הפרילנסרים (<b>Growth</b>), מודל שוק ייחודי של מיקרו-שירותים (<b>Innovation</b>), מיתוג וחזון שמובילים את תחום העבודה הדיגיטלית (<b>Leadership</b>)."},{"t":"trap","x":"<b>GII מדרג מדינות</b> (כלכלות), לא חברות בודדות. אם השאלה מדברת על \"דירוג החדשנות של כ-130 כלכלות\" או \"השוואה למדינות באותו אזור\" → GII. אם היא מדברת על צמיחה, חדשנות ומנהיגות של חברה מסוימת → המסגרת GIL. שימו לב: GII הוא מדד לחדשנות, לא מודל לניתוח הסביבה (זה PESTEL) ולא כלי ליישום אסטרטגיה (זה BSC)."},{"t":"h","x":"חדשנות מו\"פ וחדשנות תהליך"},{"t":"p","x":"<b>חדשנות מו\"פ</b> (R&D Innovation) היא התוצאה של תהליך מחקר ופיתוח: הארגון יוצר <b>מוצר, שירות או טכנולוגיה</b> חדשים או משופרים מהותית, על בסיס ידע מדעי, טכנולוגי או הנדסי. התוצאה שלה היא <b>חדשנות מוצר</b> (Product innovation): מוצר או שירות חדש, או שיפור מהותי בתכונות שלו, ברכיבים, בתוכנה או בנוחות השימוש."},{"t":"steps","title":"חדשנות מו\"פ היא תהליך רב-שלבי:","x":["מחקר","פיתוח","מסחור (הוצאה לשוק)"]},{"t":"p","x":"<b>חדשנות תהליך</b> (Process Innovation) היא דרך חדשה או משופרת מהותית <b>לייצר או לספק</b>: טכניקות, ציוד או תוכנה חדשים. המוצר הסופי <b>לא משתנה מהותית</b>, אבל הארגון עושה אותו מהר יותר, זול יותר ובאיכות גבוהה יותר. היא לא תמיד נראית ללקוח, אבל משפיעה על החוויה שלו. כוללת אוטומציה, בינה מלאכותית, שיטות Lean ועוד."},{"t":"table","head":["","חדשנות מו\"פ / מוצר (R&D Innovation)","חדשנות תהליך (Process Innovation)"],"rows":[["שאלת המפתח","<b>\"מה</b> אנחנו מציעים?\"","<b>\"איך</b> אנחנו מציעים את זה טוב יותר?\""],["מטרה","ערך חדש ללקוח, בידול דרך מוצר חדשני","ייעול פנימי: עלויות נמוכות, איכות, מהירות"],["תוצאה ישירה","מוצר או שירות חדש או משופר","פרודוקטיביות, זמן תגובה קצר, פחות שגיאות"],["סיכון","<b>גבוה</b>: השקעה גדולה מראש, תוצאה לא ודאית","<b>בינוני</b>: לרוב על בסיס ידע קיים ומוכח"],["קשר לפורטר","<b>בידול</b> (קשר חזק)","<b>מנהיגות בעלות</b> (קשר חזק)"],["דוגמאות","Pfizer (חיסון mRNA), Dyson, Mobileye, Check Point","Toyota (Lean, Kaizen), Amazon (רובוטים ובינה מלאכותית במחסנים), אסותא (ניהול תורים לחדרי ניתוח)"]]},{"t":"example","title":"מו\"פ או תהליך?","x":"חברת BrewMax ממשיכה למכור בדיוק את אותו בקבוק מיץ, אבל החליפה את פס הייצור ברובוטים, והזמן לייצור משטח ירד בחצי. → <b>חדשנות תהליך</b> (\"אותו מוצר\", \"פס ייצור\", \"זמן ירד\"). אחרי שלוש שנות מחקר במעבדה היא משיקה מיץ חדש עם חלבון צמחי שלא היה קיים בשוק. → <b>חדשנות מו\"פ / מוצר</b> (\"מחקר\", \"מוצר חדש\")."},{"t":"trap","x":"כשהמוצר <b>לא השתנה</b> ורק הדרך לייצר או לספק אותו השתנתה, זו חדשנות <b>תהליך</b>, גם אם השתמשו בטכנולוגיה מתקדמת. ואם המבחן שואל איזו חדשנות מתאימה לחברה שבחרה במנהיגות בעלות → <b>תהליך</b>. לחברה שבחרה בבידול → <b>מו\"פ/מוצר</b>."},{"t":"h","x":"חדשנות סגורה וחדשנות פתוחה"},{"t":"p","x":"<b>חדשנות סגורה</b> (Closed Innovation): כל שלבי החדשנות, מהרעיון ועד השיווק, נעשים <b>בתוך הארגון</b>, עם שליטה מלאה על הידע, הפיתוח והקניין הרוחני. הגבולות של הארגון \"אטומים\" לזרימת ידע. זו הגישה המסורתית, שהייתה נפוצה עד תחילת שנות ה-2000. דוגמאות: Apple בעשורים הראשונים, Intel עם מעבדות מחקר פנימיות בלבד."},{"t":"p","x":"<b>חדשנות פתוחה</b> (Open Innovation, צ'סברו 2003): הארגון פותח את הגבולות שלו. יש זרימה מכוונת של ידע <b>פנימה</b> (מכניסים רעיונות וטכנולוגיות מבחוץ) <b>וגם החוצה</b> (מוציאים ידע לשימוש של אחרים, למשל ברישוי), כדי להאיץ את החדשנות ולהרחיב שווקים."},{"t":"list","x":["שיתוף פעולה עם אקדמיה, סטארטאפים, יזמים, ספקים, לקוחות ואפילו מתחרים","רישוי ידע, השקעות בחדשנות חיצונית, האקתונים, מיזמים משותפים","P&G – Connect + Develop: \"לא משנה איפה נולד הרעיון; אם הוא טוב, נאמץ אותו\"","Lego Ideas: מעריצים מציעים עיצובים, הטובים מיוצרים והמציעים מקבלים תמלוגים","BMW Startup Garage: סטארטאפים משתלבים כ\"ספק טכנולוגי מוקדם\""]},{"t":"table","head":["היבט","חדשנות סגורה","חדשנות פתוחה"],"rows":[["מקור הידע","פנימי בלבד","פנימי + חיצוני (ידע נכנס וגם יוצא)"],["שליטה בתהליך","מלאה","חלקית, בתיאום עם שותפים"],["מהירות פיתוח","איטית יחסית","מהירה יותר"],["עלויות","גבוהות","מתפזרות ומתייעלות"],["דוגמאות","Apple (בעבר), Intel","Lego, BMW, P&G, Intel Ignite"]]},{"t":"example","title":"סגורה או פתוחה?","x":"חברת QuantumChip מפתחת מעבדים רק במעבדות שלה, אוסרת על שיתוף מידע עם גורמים חיצוניים ורושמת פטנטים על כל פיתוח. → <b>סגורה</b>. חברת AgroLink מזמינה סטארטאפים להאקתון, ובמקביל מוכרת רישיון על טכנולוגיה שהיא לא משתמשת בה לחברה אחרת. → <b>פתוחה</b> (ידע נכנס מהסטארטאפים ויוצא דרך הרישוי)."},{"t":"trap","x":"בחדשנות פתוחה הידע זורם <b>בשני הכיוונים</b>. היגד שאומר שבחדשנות פתוחה ידע של החברה יכול לצאת החוצה, לשותפים או לחברות אחרות, הוא <b>נכון</b>. היגד שאומר שבחדשנות פתוחה הידע רק נכנס, או שהחברה שומרת על שליטה מלאה, הוא <b>לא נכון</b>."},{"t":"trap","x":"ברב-ברירה על סגורה/פתוחה מופיעים גם \"חדשנות תהליך\" ו\"חדשנות מוצר\" כמסיחים. אם הסיפור מדבר על <b>מי מפתח ועם מי</b> (רק בפנים / עם שותפים) → סגורה/פתוחה. אם הוא מדבר על <b>מה השתנה</b> (המוצר / הדרך לייצר) → מוצר/תהליך."},{"t":"p","x":"במצגת מופיע גם מודל Doblin של 10 סוגי חדשנות (מודל רווח, שותפויות, מבנה, תהליכים, ביצועי מוצר, מערכת מוצר, שירות, ערוץ, מותג, מעורבות לקוחות). הוא אינו בסילבוס."},{"t":"exam","x":"ברב-ברירה: סיפור על חברה ← \"איזו גישה/סוג חדשנות?\". בנכון/לא נכון: חדשנות בלי טכנולוגיה (נכון), זליגת ידע החוצה בחדשנות פתוחה (נכון), החלפה בין מו\"פ לתהליך או בין סגורה לפתוחה (לא נכון). בנימוק כתבו את ההגדרה הקצרה ואת המילה המזהה."}],"mcq":[{"id":"s5-1","q":"חברת QuantaCore מפתחת שבבים למחשבי-על. כל הפיתוח נעשה במעבדות המחקר של החברה בלבד, העובדים חותמים על הסכמי סודיות קפדניים, ואין שום שיתוף ידע עם אוניברסיטאות או עם חברות אחרות. איזו גישת חדשנות מאפיינת את החברה?","o":["חדשנות תהליך","חדשנות פתוחה","חדשנות סגורה","חדשנות א-טכנולוגית"],"a":2,"why":"\"במעבדות של החברה בלבד\", \"סודיות\", \"אין שיתוף ידע\" = כל שלבי החדשנות בתוך הארגון עם שליטה מלאה. זו חדשנות סגורה.","w":["חדשנות תהליך עוסקת בשינוי הדרך לייצר; הסיפור עוסק במי מפתח ועם מי.","בחדשנות פתוחה החברה משתפת פעולה עם גורמים חיצוניים; כאן זה אסור.","","פיתוח שבבים הוא חדשנות טכנולוגית מובהקת."]},{"id":"s5-2","q":"חברת BrickWorld, יצרנית צעצועים, פתחה אתר שבו מעריצים מעלים עיצובים לערכות חדשות. ההצעות הפופולריות ביותר עוברות לייצור, והמעצבים מקבלים תמלוגים על כל ערכה שנמכרת. איזו גישת חדשנות מתוארת?","o":["חדשנות סגורה","חדשנות פתוחה","חדשנות תהליך","חדשנות מו\"פ"],"a":1,"why":"הרעיונות מגיעים <b>מחוץ לארגון</b> (מעריצים, לקוחות) ומשולבים במוצרים. זו חדשנות פתוחה, בדומה ל-Lego Ideas.","w":["בחדשנות סגורה כל הרעיונות נוצרים בתוך הארגון.","","לא השתנתה הדרך לייצר את הצעצועים.","אין כאן תהליך מחקר ופיתוח פנימי; החידוש הוא בפתיחת הגבולות לידע חיצוני."]},{"id":"s5-3","q":"חברת NutriCo פיתחה לפני שנים טכנולוגיה לשימור מזון שהיא כבר לא משתמשת בה. היא מכרה רישיון שימוש בטכנולוגיה לחברה אחרת תמורת תמלוגים, ובמקביל היא מפתחת מוצרים חדשים יחד עם מעבדה באוניברסיטה. איזו גישה מאפיינת את החברה?","o":["חדשנות א-טכנולוגית","חדשנות סגורה","חדשנות תהליך","חדשנות פתוחה"],"a":3,"why":"בחדשנות פתוחה הידע זורם <b>החוצה</b> (רישוי הטכנולוגיה לחברה אחרת) <b>וגם פנימה</b> (פיתוח עם האוניברסיטה). שני הכיוונים מופיעים בסיפור.","w":["החידוש כאן מבוסס על טכנולוגיה ועל מחקר, וגם השאלה היא על זרימת הידע ולא על סוג החידוש.","בחדשנות סגורה החברה לא הייתה מוציאה ידע החוצה ולא עובדת עם אוניברסיטה.","הסיפור לא עוסק בשינוי הדרך לייצר.",""]},{"id":"s5-4","q":"חברת ShipQuick ממשיכה לשלוח בדיוק את אותן חבילות לאותם לקוחות, אבל הכניסה למרכזי ההפצה שלה רובוטים ומערכת בינה מלאכותית שמתכננת את המסלולים. זמן המשלוח ירד ב-40% והעלויות ירדו. איזה סוג חדשנות זה?","o":["חדשנות פתוחה","חדשנות מו\"פ","חדשנות מוצר","חדשנות תהליך"],"a":3,"why":"\"אותן חבילות\" = המוצר לא השתנה; \"רובוטים, בינה מלאכותית, זמן ועלויות ירדו\" = דרך חדשה לספק. זו חדשנות תהליך, כמו באמזון.","w":["אין בסיפור שיתוף פעולה עם גורמים חיצוניים.","חדשנות מו\"פ יוצרת מוצר או טכנולוגיה חדשים להצעה ללקוח; כאן המוצר נשאר אותו דבר.","השירות שהלקוח מקבל לא השתנה מהותית, רק הדרך לבצע אותו.",""]},{"id":"s5-5","q":"חברת AquaGen השקיעה מאות מיליונים בשש שנות מחקר במעבדות שלה, פיתחה טכנולוגיה חדשה לגמרי להתפלת מים, ורק השנה התחילה למכור אותה. התוצאה לא הייתה ודאית עד הרגע האחרון. איזה סוג חדשנות מתאר את התהליך?","o":["חדשנות מו\"פ","חדשנות תהליך","חדשנות א-טכנולוגית","חדשנות פתוחה"],"a":0,"why":"\"השקעה גדולה\", \"מחקר\", \"טכנולוגיה חדשה\", \"התחילה למכור\" (מחקר → פיתוח → מסחור), \"תוצאה לא ודאית\" = כל הסימנים של חדשנות מו\"פ.","w":["","חדשנות תהליך משפרת את הדרך לייצר מוצר קיים, והסיכון בה בינוני.","זו חדשנות טכנולוגית מובהקת.","הפיתוח נעשה במעבדות של החברה, בלי שותפים חיצוניים."]},{"id":"s5-6","q":"רשת בתי הקפה BeanHouse שינתה את המודל העסקי שלה: הלקוחות משלמים מנוי חודשי ושותים כמה שרוצים, והסניפים עוצבו מחדש כמקום מפגש קהילתי. לא נוספה שום טכנולוגיה חדשה. איזה סוג חדשנות זה?","o":["חדשנות א-טכנולוגית","חדשנות טכנולוגית","חדשנות מו\"פ","חדשנות סגורה"],"a":0,"why":"\"שינתה את המודל העסקי\", \"עוצבו מחדש\", \"לא נוספה טכנולוגיה\" = חדשנות במודל העסקי ובחוויה, בלי טכנולוגיה חדשה.","w":["","אין בסיפור טכנולוגיה חדשה, ולכן זו לא חדשנות טכנולוגית.","אין כאן מחקר ופיתוח של מוצר או טכנולוגיה.","הסיפור לא אומר דבר על מי מפתח את החדשנות ועם מי."]},{"id":"s5-7","q":"חברת DriveSense מפתחת חיישנים ואלגוריתמים של בינה מלאכותית שמאפשרים לרכב לזהות הולכי רגל ולבלום לבד. איזה סוג חדשנות מתאר את פעילות החברה בצורה הטובה ביותר?","o":["חדשנות תהליך","חדשנות א-טכנולוגית","חדשנות במודל העסקי","חדשנות טכנולוגית"],"a":3,"why":"\"חיישנים\", \"אלגוריתמים\", \"בינה מלאכותית\" = שימוש בטכנולוגיה חדשה לפיתוח מוצר. זו חדשנות טכנולוגית (כמו Mobileye).","w":["החברה מפתחת מוצר חדש ולא משפרת את הדרך לייצר מוצר קיים.","החידוש מבוסס כולו על טכנולוגיה.","המודל העסקי לא השתנה; המוצר הוא החידוש.",""]},{"id":"s5-8","q":"לפי ההגדרה שנלמדה בקורס, מה הכרחי כדי שחידוש ייחשב לחדשנות?","o":["שהחידוש יתבסס על טכנולוגיה חדשה","שהחידוש ייושם בפועל, בשוק או בתוך הארגון, וייצור ערך","שהחידוש יירשם כפטנט","שהחידוש יפותח במחלקת המו\"פ של החברה"],"a":1,"why":"חדשנות מחייבת שינוי בפועל, לא רק רעיון: מוצר, שירות, תהליך או מודל חדש או משופר מהותית שמיושם ויוצר ערך.","w":["יש גם חדשנות א-טכנולוגית, בלי טכנולוגיה חדשה.","","פטנט אינו חלק מההגדרה; גם מודל עסקי חדש הוא חדשנות.","חדשנות יכולה להגיע גם מבחוץ (פתוחה) או מכל חלק בארגון."]},{"id":"s5-9","q":"משרד ממשלתי רוצה לדעת איך מדינתו מדורגת בחדשנות לעומת כ-130 כלכלות בעולם, ולהשוות את עצמו למדינות באותו אזור ובאותה קבוצת הכנסה. באיזה כלי כדאי לו להשתמש?","o":["שיטת BSC","מודל PESTEL","מדד GII (Global Innovation Index)","ניתוח SWOT"],"a":2,"why":"\"דירוג חדשנות\", \"כ-130 כלכלות\", \"השוואה לאזור ולקבוצת הכנסה\" = מדד החדשנות העולמי GII.","w":["BSC הוא כלי ליישום אסטרטגיה בארגון.","PESTEL מנתח את הסביבה החיצונית של חברה; הוא לא מדרג מדינות בחדשנות.","","SWOT מנתח חוזקות, חולשות, הזדמנויות ואיומים של חברה, ולא מדרג מדינות."]},{"id":"s5-10","q":"לפי המצגת, מסגרת GIL של Frost & Sullivan בוחנת שלושה דברים בחברה. מהם?","o":["צמיחה (Growth), חדשנות (Innovation) ומנהיגות (Leadership)","רווחיות, לקוחות ותהליכים פנימיים","סביבה פוליטית, כלכלית וטכנולוגית","חוזקות, חולשות והזדמנויות"],"a":0,"why":"GIL = Growth, Innovation, Leadership: האם החברה יודעת לצמוח, לחדש ולהוביל את השוק שלה לאורך זמן.","w":["","אלה חלק מפרספקטיבות ה-BSC.","אלה חלק מ-PESTEL.","אלה חלק מ-SWOT."]},{"id":"s5-11","q":"חברה בחרה באסטרטגיית מנהיגות בעלות. לפי המצגת, איזה סוג חדשנות תורם לאסטרטגיה הזו בצורה החזקה ביותר?","o":["חדשנות מו\"פ","חדשנות תהליך","חדשנות מוצר","חדשנות במותג"],"a":1,"why":"חדשנות תהליך עונה על \"איך מייצרים טוב יותר\": ייעול, הפחתת עלויות, מהירות. לכן היא קשורה בקשר חזק למנהיגות בעלות.","w":["חדשנות מו\"פ קשורה בעיקר לבידול; הקשר שלה למנהיגות בעלות חלש יחסית.","","מוצר חדש יוצר ייחוד ללקוח, כלומר בידול.","חדשנות במותג נועדה לבדל את החברה בעיני הלקוחות, לא להוריד עלויות."]},{"id":"s5-12","q":"על איזו שאלה עונה חדשנות מו\"פ, לפי המצגת?","o":["\"איך אנחנו מציעים את זה טוב יותר?\"","\"מה אנחנו מציעים?\"","\"עם מי אנחנו משתפים את הידע?\"","\"כמה כלכלות חדשניות יותר מאיתנו?\""],"a":1,"why":"חדשנות מו\"פ יוצרת מוצר, שירות או טכנולוגיה חדשים, כלומר משנה את מה שהחברה מציעה ללקוח.","w":["זו השאלה של חדשנות תהליך.","","זו שאלה של חדשנות סגורה מול פתוחה.","זו שאלה שמדד GII עונה עליה, ברמת מדינות."]},{"id":"s5-13","q":"לאיזה סוג חדשנות מתאים התיאור הבא: \"השקעה גבוהה מראש, תוצאה לא ודאית, ויצירת יתרון ייחודי בשוק\"?","o":["חדשנות פתוחה","חדשנות תהליך","חדשנות א-טכנולוגית","חדשנות מו\"פ"],"a":3,"why":"במו\"פ משקיעים הרבה לפני שיודעים אם יצליח (סיכון גבוה), והמטרה היא מוצר חדשני שמבדל את החברה.","w":["בחדשנות פתוחה העלויות דווקא מתפזרות בין השותפים.","בחדשנות תהליך הסיכון בינוני, כי היא מבוססת לרוב על ידע ויישומים מוכחים.","חדשנות א-טכנולוגית לא בהכרח דורשת השקעה גבוהה במחקר.",""]},{"id":"s5-14","q":"מה מאפיין חדשנות פתוחה לעומת חדשנות סגורה?","o":["ידע שמגיע ממקור פנימי בלבד","שליטה מלאה של החברה בכל שלבי התהליך","פיתוח מהיר יותר ועלויות שמתפזרות בין השותפים","הגנה הדוקה על הקניין הרוחני ואיסור על רישוי ידע"],"a":2,"why":"בחדשנות פתוחה עובדים עם שותפים, ולכן הפיתוח מהיר יותר והעלויות מתחלקות. מנגד השליטה היא חלקית.","w":["ידע פנימי בלבד מאפיין חדשנות סגורה.","שליטה מלאה מאפיינת חדשנות סגורה.","","בחדשנות פתוחה דווקא משתמשים ברישוי ידע; הגנה הדוקה מאפיינת חדשנות סגורה."]},{"id":"s5-15","q":"חברת HydroSip השיקה בקבוק מים חדש עם חיישן מובנה שמודד כמה הלקוח שתה ושולח לו תזכורות לטלפון. מוצר כזה לא היה קיים קודם בקו המוצרים שלה. איזה סוג חדשנות זה?","o":["חדשנות מוצר","חדשנות תהליך","חדשנות סגורה","חדשנות א-טכנולוגית"],"a":0,"why":"\"השיקה בקבוק חדש\" עם תכונות חדשות שלא היו קיימות = מוצר חדש או משופר מהותית. זו חדשנות מוצר.","w":["","חדשנות תהליך משנה את הדרך לייצר מוצר קיים, לא את המוצר עצמו.","הסיפור לא אומר אם הפיתוח נעשה רק בפנים או עם שותפים; השאלה היא על מה שהשתנה.","חיישן ותזכורות לטלפון הם טכנולוגיה."]},{"id":"s5-16","q":"בית חולים מחשב את ניהול התורים לחדרי הניתוח. הניתוחים עצמם לא השתנו, אבל זמני ההמתנה התקצרו וחדרי הניתוח מנוצלים טוב יותר. איזה סוג חדשנות זה?","o":["חדשנות מוצר","חדשנות מו\"פ","חדשנות תהליך","חדשנות פתוחה"],"a":2,"why":"\"הניתוחים עצמם לא השתנו\" + \"זמני המתנה התקצרו\" = שיפור הדרך שבה הארגון מספק את השירות. זו חדשנות תהליך (כמו אסותא במצגת).","w":["השירות שהמטופל מקבל, הניתוח, נשאר אותו דבר.","לא פותח טיפול או טכנולוגיה רפואית חדשה.","","אין בסיפור שותפים חיצוניים."]}],"tf":[{"id":"s5-t1","s":"חדשנות חייבת להתבסס על טכנולוגיה חדשה.","a":false,"why":"לא נכון. יש גם חדשנות א-טכנולוגית: במודל העסקי, בשירות, בארגון או בשיווק (למשל IKEA ושיטת ה-DIY)."},{"id":"s5-t2","s":"בחדשנות פתוחה הידע זורם רק לתוך החברה, ולא ממנה החוצה.","a":false,"why":"לא נכון. חדשנות פתוחה היא זרימה מכוונת של ידע פנימה וגם החוצה, למשל ברישוי טכנולוגיות לחברות אחרות."},{"id":"s5-t3","s":"בחדשנות סגורה כל שלבי החדשנות, מהרעיון ועד השיווק, מבוצעים בתוך הארגון תוך שליטה מלאה בקניין הרוחני.","a":true,"why":"נכון. זו ההגדרה של חדשנות סגורה: מו\"פ פנימי בלבד והגנה הדוקה על הידע (Apple בעבר, Intel)."},{"id":"s5-t4","s":"חדשנות תהליך משנה את הדרך שבה הארגון מייצר או מספק, בלי לשנות מהותית את המוצר הסופי.","a":true,"why":"נכון. חדשנות תהליך היא שיטת ייצור או אספקה חדשה (אוטומציה, Lean), שמשפרת יעילות, איכות ועלויות של אותו מוצר."},{"id":"s5-t5","s":"הסיכון בחדשנות מו\"פ נמוך בדרך כלל מהסיכון בחדשנות תהליך.","a":false,"why":"לא נכון. ההפך: במו\"פ הסיכון גבוה (השקעה גדולה מראש ותוצאה לא ודאית), ובחדשנות תהליך הוא בינוני."},{"id":"s5-t6","s":"לפי המצגת, חדשנות תהליך קשורה בקשר חזק לאסטרטגיית מנהיגות בעלות.","a":true,"why":"נכון. חדשנות תהליך תורמת ליעילות תפעולית ולהפחתת עלויות, ולכן היא תומכת במנהיגות בעלות."},{"id":"s5-t7","s":"רעיון חדש ומבריק שעדיין לא יושם נחשב כבר לחדשנות.","a":false,"why":"לא נכון. חדשנות מחייבת יישום בפועל, בשוק או בתוך הארגון, ויצירת ערך. רעיון בלבד אינו חדשנות."},{"id":"s5-t8","s":"מדד GII מדרג את ביצועי החדשנות של כ-130 כלכלות בעולם על בסיס כ-80 אינדיקטורים.","a":true,"why":"נכון. GII בודק בין היתר סביבת מדיניות, חינוך, תשתיות ויצירת ידע, ומאפשר להשוות מדינות באותו אזור או קבוצת הכנסה."},{"id":"s5-t9","s":"מעבר למודל עסקי חדש, בלי להוסיף טכנולוגיה, הוא דוגמה לחדשנות א-טכנולוגית.","a":true,"why":"נכון. חדשנות א-טכנולוגית מבוססת על חשיבה עסקית יצירתית במודל העסקי, בשירות או בשיווק, ולא על טכנולוגיה."},{"id":"s5-t10","s":"חדשנות סגורה מהירה וזולה יותר מחדשנות פתוחה.","a":false,"why":"לא נכון. בחדשנות סגורה הפיתוח איטי יחסית והעלויות גבוהות; בפתוחה הפיתוח מהיר יותר והעלויות מתפזרות בין השותפים."},{"id":"s5-t11","s":"בחדשנות פתוחה חברה יכולה לשתף פעולה גם עם מתחרים.","a":true,"why":"נכון. חדשנות פתוחה כוללת שיתוף פעולה עם אקדמיה, סטארטאפים, יזמים, ספקים, לקוחות ואפילו מתחרים."},{"id":"s5-t12","s":"חדשנות תהליך תמיד גלויה ללקוח.","a":false,"why":"לא נכון. חדשנות תהליך לא בהכרח נראית ללקוח (למשל רובוטים במחסן), אבל היא משפיעה על החוויה שלו דרך מהירות, איכות ומחיר."},{"id":"s5-t13","s":"לפי המצגת, חדשנות מו\"פ קשורה בעיקר לאסטרטגיית בידול.","a":true,"why":"נכון. מו\"פ עונה על \"מה אנחנו מציעים\" ויוצר מוצר חדשני וייחודי, ולכן הוא מקור לבידול."},{"id":"s5-t14","s":"מדד GII מדרג חברות בודדות לפי רמת החדשנות של המוצרים שלהן.","a":false,"why":"לא נכון. GII מדרג כלכלות (מדינות), לא חברות. המסגרת שבוחנת חברה (צמיחה, חדשנות, מנהיגות) היא GIL."}]},{"id":"s6","title":"יישום האסטרטגיה","short":"יישום האסטרטגיה","blurb":"איך הופכים אסטרטגיה למציאות: שיטות MBO, BSC ו-TOC, מנהיגות, תרבות ארגונית, למידה ארגונית, מבנה ארגוני והתמודדות עם התנגדות עובדים.","mnemonic":"MBO = Objectives = יעדים מוסכמים עם העובד; BSC = Balanced = ארבע רגליים מאוזנות (כסף, לקוחות, תהליכים, למידה); TOC = Constraints = צוואר הבקבוק. ובהתנגדות: \"קודם משתפים, אחר כך כל השאר\".","cheat":["יישום האסטרטגיה = תרגום החזון והיעדים לתהליכים, החלטות ותוצאות יומיומיות","התנגדות עובדים, הצעד הראשון = שיתוף העובדים בתהליך קבלת ההחלטות","MBO (Management by Objectives, דרוקר) = יעדים מדידים שמנהל ועובד מסכימים עליהם יחד","שלבי MBO = מטרות הנהלה → פירוק ליחידות → הסכמה עם העובד → בקרה ומשוב","חסרונות MBO = בירוקרטי, פוקוס יתר על תוצאות ולטווח קצר, דורש זמן","BSC (Balanced Scorecard, קפלן ונורטון) = מדדים מעבר לכסף, ב-4 פרספקטיבות","4 הפרספקטיבות = פיננסית, לקוחות, תהליכים פנימיים, למידה וצמיחה","למידה וצמיחה = הכשרת עובדים, שימור עובדים, שביעות רצון עובדים, תשתיות טכנולוגיות","TOC (Theory of Constraints, גולדרט) = מזהים את האילוץ (צוואר הבקבוק) ומסירים אותו","TOC = בכל מערכת יש לפחות אילוץ אחד; מתאים לייצור ולוגיסטיקה, פחות לשירותים טהורים","השיטות לא סותרות = אפשר ורצוי לשלב ביניהן","מנהיגות = תהליך של השפעה חברתית להשגת מטרה משותפת (לא רק סמכות, לא רק תכונה מולדת)","מנהיגות ארגונית = יישום חזון, ניהול שינוי והנעת עובדים בתוך ארגון","תרבות ארגונית (Schein) = ערכים, אמונות, נורמות והתנהגויות משותפות = \"האישיות של הארגון\"","אסטרטגיה שלא מתאימה לתרבות = נכשלת ויוצרת התנגדות","למידה ארגונית = 3 רמות: פרט, צוות, ארגון","מבנה ריכוזי = ההנהלה הבכירה מחליטה; מבוזר = סמכויות עוברות למנהלי הביניים","פונקציונלי = לפי מחלקות מקצועיות; ארגון קטן-בינוני, מעט מוצרים, סביבה יציבה","חטיבתי = יחידות עצמאיות עם כל הפונקציות; ארגון גדול, סביבה לא יציבה","מטריציוני = עובד כפוף לשני מנהלים (מקצועי + פרויקט/מוצר)","מודולרי וירטואלי = הרבה פעילויות במיקור חוץ","הולוקרטיה = בלי היררכיה, עבודה במעגלים"],"blocks":[{"t":"h","x":"למה יישום כל כך חשוב?"},{"t":"p","x":"<b>יישום האסטרטגיה</b> הוא השלב שבו החזון, היעדים והתוכניות הופכים למציאות של יום-יום: תהליכים, החלטות ותוצאות. אסטרטגיה מבריקה שלא מיושמת נכון נשארת רעיון על הנייר."},{"t":"p","x":"יישום מוצלח דורש תיאום בין כמה דברים: <b>מבנה ארגוני, תרבות, סגנון מנהיגות, תהליכי בקרה ולמידה</b>. ביחידה נלמד שלוש שיטות יישום (MBO, BSC, TOC) ואת ארבעת \"התנאים\" (מנהיגות, תרבות, למידה, מבנה)."},{"t":"h","x":"התנגדות עובדים ליישום האסטרטגיה"},{"t":"p","x":"כשמכניסים אסטרטגיה חדשה, עובדים רבים מתנגדים: הם חוששים מהלא-נודע, מאובדן מעמד, או שהשינוי מתנגש בתרבות הארגונית (\"ככה אנחנו עובדים כאן\"). המצגת מדגישה שקונפליקט בין תרבות לאסטרטגיה יוצר התנגדות פנימית חריפה."},{"t":"p","x":"<b>הצעד הראשון</b> להתמודדות עם התנגדות הוא <b>שיתוף העובדים בתהליך קבלת ההחלטות</b>. מי שהשתתף בהחלטה מבין אותה, מרגיש שהיא גם שלו ומתחייב אליה. זה גם הרעיון של MBO: יעדים שנקבעים <b>יחד</b> עם העובדים יוצרים מחויבות."},{"t":"example","title":"התנגדות","x":"חברת SunGrid עוברת לאסטרטגיה חדשה של אנרגיה סולארית, והעובדים במפעל מתנגדים. מה עושים קודם? → <b>משתפים את העובדים בקבלת ההחלטות</b>: מסבירים, שומעים את החששות ונותנים להם להשפיע על אופן היישום. בונוסים, פיטורים או מיקור חוץ לא מטפלים בשורש ההתנגדות."},{"t":"trap","x":"המסיחים הקלאסיים: \"מתן בונוסים על שיתוף פעולה\" (תגמול חיצוני, לא הצעד הראשון), \"העברת היישום למיקור חוץ\" (בורחים מהבעיה), \"הגדלת ההשקעה במו\"פ\" (לא קשור להתנגדות). התשובה היא <b>שיתוף העובדים בקבלת ההחלטות</b>."},{"t":"h","x":"שיטה 1: MBO – ניהול לפי יעדים (Management by Objectives)"},{"t":"p","x":"פותחה על ידי <b>פיטר דרוקר</b>. הרעיון: קובעים <b>יעדים מוסכמים מראש בין המנהלים לעובדים</b>, כדי שכל הארגון ינוע סביב מטרות עסקיות מדידות וברורות."},{"t":"steps","title":"שלבי היישום:","x":["<b>הגדרת מטרות אסטרטגיות ברמת ההנהלה</b>: למשל, הגדלת נתח השוק ב-10%.","<b>פירוק למטרות של כל מחלקה ויחידה</b>: שיווק – הגדלת החשיפה ב-30%; מכירות – גיוס 2 מפיצים חדשים ברבעון.","<b>הסכמה הדדית על היעדים עם העובדים</b>: כל עובד מקבל יעדים מדידים.","<b>בקרה והערכת ביצועים תקופתית</b>: משווים תוצאות ליעדים ונותנים משוב."]},{"t":"p","x":"עקרונות: יעדים <b>משותפים</b> למנהלים ולעובדים; יעדים <b>מדידים וברורים</b> לפי מודל SMART; מעקב שוטף; הערכה ובקרה של התוצאות."},{"t":"table","head":["יתרונות MBO","חסרונות MBO"],"rows":[["תמונה ברורה לעובדים ועזרה בתיעדוף משימות","דורש הרבה זמן ומאמץ תכנוני"],["מוטיבציה ומחויבות אישית ליעדים","פוקוס יתר על התוצאה ולא על התהליך (\"עסוקים רק במספרים\")"],["שיפור התקשורת: שפה אחידה ומשותפת","בירוקרטי ונוקשה: הרבה טפסים, קיבעון"],["הערכה אובייקטיבית, מבוססת מדידה","עלול להתמקד בתוצאות לטווח קצר; קושי בהגדרת יעדים"]]},{"t":"p","x":"דוגמאות: HP (מהחלוצות), אינטל בהובלת אנדי גרוב, קבוצת שטראוס (יעד של 15% גידול בשוק הממרחים ופגישות חצי-שנתיות מול היעדים), רפאל, שופרסל (יעד מכירות לכל סניף)."},{"t":"h","x":"שיטה 2: BSC – כרטיס ניקוד מאוזן (Balanced Scorecard)"},{"t":"p","x":"פותחה על ידי <b>קפלן ונורטון</b> בתחילת שנות ה-90. הרעיון: לא למדוד רק כסף. BSC מרחיבה את מדדי הביצוע מעבר למדדים הפיננסיים, ומאזנת בין <b>4 פרספקטיבות</b>:"},{"t":"table","head":["פרספקטיבה","מה מודדים","דוגמה (בנק הפועלים)"],"rows":[["<b>1. פיננסית</b>","רווחיות, צמיחה בהכנסות, תשואה על השקעה (ROI), תזרים מזומנים, ערך מניה","החזר על נכסים, הכנסות מעמלות"],["<b>2. לקוחות</b>","שביעות רצון, נתח שוק, שימור לקוחות, גיוס לקוחות חדשים, רווחיות לקוח","מדד שביעות רצון, זמני תגובה בערוצים הדיגיטליים"],["<b>3. תהליכים פנימיים</b>","יעילות התפעול, איכות מוצרים ושירותים, זמני פיתוח, ניהול מלאי, תהליכי חדשנות","אוטומציה של תהליכים בנקאיים"],["<b>4. למידה וצמיחה</b> (עובדים/טכנולוגיה)","הכשרת עובדים ושימורם, שביעות רצון עובדים, פיתוח מיומנויות, תשתיות טכנולוגיות","שעות הדרכה לעובדים, הטמעת AI"]]},{"t":"table","head":["יתרונות BSC","חסרונות BSC"],"rows":[["תיאום רוחבי ואנכי של כל הארגון סביב האסטרטגיה","דורש שינוי תרבותי ויישום טכנולוגי (מערכות BI, ERP)"],["זיהוי מוקדם של בעיות","דורש זמן, תחזוקה שוטפת ועדכון של המודל"],["מראה סיבה ותוצאה בביצועים (מדדי Input ו-Output)",""],["מיקוד ביעדים ארוכי טווח",""]]},{"t":"p","x":"דוגמאות: Mobil Oil, Hilton, UPS, Tesco, מכבי שירותי בריאות, בנק הפועלים, אל על (ניהול חוויית לקוח בקורונה)."},{"t":"h","x":"שיטה 3: TOC – תורת האילוצים (Theory of Constraints)"},{"t":"p","x":"פותחה על ידי <b>אליהו גולדרט</b> (מחבר הספר \"המטרה\"). הרעיון: <b>בכל מערכת יש לפחות אילוץ אחד</b>, \"צוואר בקבוק\", שמגביל את כל המערכת. השיטה מזהה את הגורם המעכב ביותר בשרשרת ופועלת להסיר אותו, בשיפור מתמיד."},{"t":"steps","title":"שלבי היישום:","x":["<b>זיהוי האילוץ</b>: מה מגביל את התפוקה?","<b>ניצול האילוץ</b>: להפיק ממנו את המקסימום.","<b>כפיפות כל המערכת לאילוץ</b>: כל היחידות מתאימות את הקצב שלהן אליו.","<b>שיפור (הרחבת) האילוץ</b>: להגדיל את התפוקה שלו.","<b>חזרה להתחלה</b>: מחפשים את האילוץ הבא."]},{"t":"table","head":["יתרונות TOC","חסרונות TOC"],"rows":[["מיקוד מהיר בתוצאות עם מינימום השקעה","לא מתאים לכל הארגונים, למשל <b>שירותים טהורים</b>"],["מתאים מאוד לתעשייה, ייצור ולוגיסטיקה","לפעמים מתמקד בבעיות <b>טקטיות</b> ולא אסטרטגיות"],["צמצום מלאים והגדלת התפוקה של כל המערכת",""],["שיפור זמני אספקה ועמידה בלוחות זמנים",""]]},{"t":"example","title":"TOC","x":"אסם גילתה שהאילוץ העיקרי במערך ההפצה הוא <b>זמני הפריקה במחסנים האזוריים</b>. כל היחידות התאימו את עצמן לאילוץ, הוגדרו שעות חלוקה קבועות, וזמני האספקה התקצרו ב-18%. גם תנובה טיפלה באילוץ של הפצת החלב בבקרים. מילות המפתח: \"אילוץ\", \"צוואר בקבוק\", \"הגורם שמעכב את כל המערכת\"."},{"t":"h","x":"השוואה בין שלוש השיטות"},{"t":"table","head":["","MBO","BSC","TOC"],"rows":[["עיקרון מרכזי","ניהול לפי יעדים","איזון מדדים בכמה רבדים","ניהול לפי צוואר בקבוק"],["אופי היישום","היררכי, יעדי עובדים","מערכתי, חוצה ארגון","נקודתי, ממוקד תהליך"],["חוזקה עיקרית","מדידה והתאמה אישית","תרגום האסטרטגיה לביצועים","שיפור מיידי בצוואר הבקבוק"],["שימושי במיוחד ל...","ארגונים תפעוליים ומכירות","ארגונים רב-מערכתיים","ייצור, שרשרת אספקה, לוגיסטיקה"],["אתגר מרכזי","דורש זמן ותיאום","תחזוקה שוטפת וניהול שינוי","מתאים רק לתהליכים מורכבים"]]},{"t":"p","x":"השיטות <b>לא סותרות</b>: אפשר ואף רצוי לשלב ביניהן לפי אופי הארגון. בישראל, עם תחרות עזה ואי-ודאות, TOC ובמיוחד BSC צוברות תאוצה."},{"t":"trap","x":"איך מבדילים בסיפור: \"יעדים אישיים\", \"מנהל ועובד קבעו יחד\", \"יעד של X% לכל מחלקה\" → <b>MBO</b>. \"מדדים פיננסיים וגם לקוחות, תהליכים והדרכת עובדים\", \"איזון\" → <b>BSC</b>. \"אילוץ\", \"צוואר בקבוק\", \"השלב שמעכב את הכול\" → <b>TOC</b>. ושימו לב: BSC <b>לא</b> מודדת רק כסף, ו\"מתחרים\" או \"ספקים\" אינם אחת מארבע הפרספקטיבות."},{"t":"h","x":"מנהיגות"},{"t":"p","x":"<b>מנהיגות</b> היא <b>תהליך של השפעה חברתית</b> שבו אדם משפיע על אחרים כדי להשיג <b>מטרה משותפת</b>, דרך חזון, השראה ומעורבות של חברי הקבוצה (Northouse). המנהיג אינו רק מי שיש לו סמכות פורמלית, אלא מי שמוביל אנשים בזכות השפעה, חזון ויכולת ליצור מחויבות."},{"t":"list","x":["מנהיגות היא <b>תהליך</b>, ולא רק תכונה מולדת","יש בה <b>השפעה</b> בין אנשים","יש בה <b>התכנסות סביב מטרה</b>","היא מתקיימת ב<b>הקשר חברתי/קבוצתי</b>"]},{"t":"p","x":"<b>מנהיגות ארגונית</b> (Yukl) היא היכולת ליישם חזון, לנהל שינוי ולהניע עובדים לאורך זמן <b>בתוך ארגון מורכב</b>, לעיתים בירוקרטי או פוליטי. היא כוללת: גיבוש חזון אסטרטגי, רתימת עובדים ובעלי עניין, ניהול שינוי תוך שמירה על יציבות, ואיזון בין משימות, אנשים ותרבות."},{"t":"table","head":["","מנהיגות ארגונית","מנהיגות כללית"],"rows":[["הקשר","בתוך ארגון, עסק, מוסד","כללי: חברתי, פוליטי, קהילתי"],["דגש","יישום חזון וניהול שינוי","השפעה והשראה"],["מטרות","מחוברות לביצועים, תוצאות ותרבות","מגוונות וגמישות"],["אתגרים","בירוקרטיה, <b>התנגדות לשינוי</b>, משאבים","אמון ותקשורת"]]},{"t":"p","x":"מה נדרש ממנהיג ארגוני: חזון והובלת שינוי, אינטליגנציה רגשית ותקשורת, קבלת החלטות תחת לחץ, פיתוח והעצמת עובדים, ניהול ביצועים, יושרה ודוגמה אישית, גמישות ופתיחות ללמידה."},{"t":"h","x":"תרבות ארגונית"},{"t":"p","x":"<b>תרבות ארגונית</b> היא מערכת משותפת של <b>ערכים, אמונות, נורמות והתנהגויות</b>, שמעצבת איך אנשים בארגון פועלים, מחליטים ומתנהלים כלפי פנים וכלפי חוץ (Schein). במילים פשוטות: <b>התרבות היא האישיות של הארגון</b>."},{"t":"p","x":"מרכיבי התרבות: ערכים מוצהרים, אמונות יסוד, נורמות התנהגות, סמלים וטקסים, שפה ארגונית ומערכות תגמול."},{"t":"p","x":"למה תרבות חשובה לאסטרטגיה?"},{"t":"list","x":["<b>היישום תלוי בהתאמה לתרבות</b>: אסטרטגיה מבריקה תיכשל אם היא לא מתאימה לרוח הארגון. אסטרטגיית חדשנות לא תצליח בתרבות שמרנית וסגורה לרעיונות.","<b>התרבות מעצבת קבלת החלטות</b>: תרבות היררכית מובילה לריכוזיות; תרבות פתוחה ודיאלוגית מעודדת ביזור וחדשנות.","<b>התרבות קובעת איך הארגון מגיב לשינוי</b>: תרבות של גמישות ולמידה מתמודדת טוב יותר עם שוק דינמי.","<b>התרבות משפיעה על חוויית העובד</b>: מחוברות (Engagement) גבוהה משפרת ביצועים.","<b>קונפליקט בין תרבות לאסטרטגיה יוצר התנגדות פנימית</b>: למשל, טכנולוגיה שמחייבת שקיפות בארגון שבו לא משתפים מידע."]},{"t":"h","x":"למידה ארגונית"},{"t":"p","x":"<b>למידה ארגונית</b> היא היכולת של הארגון לרכוש ידע, לשתף אותו ולשנות בעקבותיו את הדרך שבה הוא עובד. היא מתרחשת בשלוש רמות:"},{"t":"table","head":["רמה","מה קורה בה","דוגמה"],"rows":[["<b>הפרט</b>","רכישת מיומנויות אישיות, התפתחות מקצועית, שיתוף ידע אישי","עובד לומד קורס ניתוח נתונים"],["<b>הצוות</b>","למידה מניסיון משותף, פיתוח נהלי עבודה, שיתוף פעולה וידע","צוות עושה תחקיר אחרי פרויקט וכותב נוהל חדש"],["<b>הארגון</b>","שינוי תהליכים ארגוניים, פיתוח תרבות ארגונית, הטמעת שיטות עבודה חדשות","כל החברה מאמצת שיטת עבודה חדשה בכל הסניפים"]]},{"t":"p","x":"כלים ללמידה ארגונית: תיעוד ידע, מערכות לניהול ידע, הדרכות והכשרות, תחקירים, קהילות ידע, מנטורינג וחניכה."},{"t":"h","x":"מבנה ארגוני"},{"t":"p","x":"המבנה הארגוני קובע איך מחלקים את העבודה, הסמכויות והאחריות בארגון, כדי שהארגון ישיג את יעדיו. יש שתי גישות מנוגדות: לפי האחת, יש עקרונות אוניברסליים שמתאימים לכל ארגון; לפי השנייה, כל ארגון ייחודי וצריך מבנה שמתאים למטרות ולסביבה שלו."},{"t":"p","x":"<b>ריכוזי (Centralized)</b>: רוב ההחלטות מתקבלות על ידי ההנהלה הבכירה, בלי שיתוף הדרגים הנמוכים. <b>מבוזר (Decentralized)</b>: סמכויות הניהול וההחלטה עוברות למנהלי הביניים, שמנהלים את התחומים שלהם באופן עצמאי ואחראים לתוצאות."},{"t":"table","head":["מבנה","איך הוא בנוי","מתי מתאים / יתרון","חיסרון עיקרי"],"rows":[["<b>פונקציונלי</b>","לפי מחלקות מקצועיות (רכש, ייצור, שיווק); כל עובד מדווח למנהל אחד","ארגון קטן-בינוני, מעט מוצרים, סביבה יציבה; יעילות, מומחיות, בלי כפילויות","קשיי תקשורת בין מחלקות, תגובה איטית לשינויים"],["<b>חטיבתי</b>","חטיבות עצמאיות, ובכל אחת כל הפונקציות; לפי מוצר, אזור או לקוחות (Johnson & Johnson)","ארגון גדול, סביבה לא יציבה, הרבה מוצרים/לקוחות; גמישות, אחריות ברורה","כפילות משאבים, תיאום חלש בין החטיבות"],["<b>מבוסס מוצר</b>","כל קו מוצר פועל כמו עסק עצמאי (P&G, יוניליבר)","אחריות ברורה לביצועי המוצר","כפילויות בפונקציות תומכות"],["<b>מבוסס לקוחות</b>","כל יחידה מתמחה בקבוצת לקוחות (אדובי, IBM)","הבנה עמוקה של צרכי הלקוח","קושי בעקביות המותג"],["<b>גאוגרפי/אזורי</b>","לפי מדינות, אזורים, יבשות (קוקה-קולה, מקדונלד'ס)","התאמה לשווקים ולרגולציה מקומית","כפילויות בין האזורים"],["<b>מטריציוני</b>","שילוב שני ממדים; העובד מדווח ל<b>שני מנהלים</b>: מקצועי ופרויקט/מוצר (אלביט, HP, משטרת ישראל)","גמישות, ניוד משאבים, שיתוף ידע, איכות וחדשנות יחד","קונפליקט בגלל כפיפות כפולה, הרבה דיונים"],["<b>מעורב פשוט</b>","משלב כמה מבנים, אבל <b>שומר על אחידות הניהול</b> (בלי כפיפות כפולה)","גמישות + התמחות","קונפליקטים בין קו למטה (פחות ממטריציוני)"],["<b>מודולרי וירטואלי</b>","פונקציונלי במהותו, וחלק גדול מהפעילויות ב<b>מיקור חוץ</b>","חיסכון וגמישות; כל אחד עושה את מה שהוא הכי טוב בו","אובדן ידע, קשיי תיאום"],["<b>הולוקרטיה</b>","בלי היררכיה; עבודה ב<b>מעגלים</b> לפי משימות, עובד יכול להיות בכמה מעגלים","התארגנות עצמית",""]]},{"t":"trap","x":"\"מדווח לשני מנהלים\" = <b>מטריציוני</b>. \"כל יחידה עצמאית עם שיווק, ייצור ופיתוח משלה\" = <b>חטיבתי</b>. \"מחלקות לפי מקצוע, ארגון קטן ויציב\" = <b>פונקציונלי</b>. וההבדל בין ריכוזי למבוזר הוא <b>מי מחליט</b>, לא כמה מחלקות יש."},{"t":"exam","x":"ברב-ברירה: סיפור ← \"איזו שיטה (MBO/BSC/TOC)?\", \"איזה מבנה?\", או \"מה הצעד הראשון מול התנגדות?\" (שיתוף העובדים). בנכון/לא נכון: ארבע הפרספקטיבות של BSC, מי פיתח כל שיטה, למה TOC פחות מתאימה לשירותים, והקשר בין תרבות לאסטרטגיה."}],"mcq":[{"id":"s6-1","q":"חברת SolarPath, שמתקינה מערכות סולאריות, עוברת לאסטרטגיה חדשה של מכירה ישירה לבתים פרטיים. עובדי מחלקת ההתקנות מתנגדים לשינוי וחוששים מהשפעתו על עבודתם. מהו הצעד הראשון שעל ההנהלה לנקוט כדי להתמודד עם ההתנגדות?","o":["הגדלת ההשקעה במחקר ופיתוח","מתן בונוסים לעובדים שישתפו פעולה","העברת מחלקת ההתקנות למיקור חוץ","שיתוף העובדים בתהליך קבלת ההחלטות על היישום"],"a":3,"why":"הצעד הראשון מול התנגדות הוא לשתף את העובדים בהחלטות. כך הם מבינים את השינוי, משפיעים עליו ומרגישים מחויבים אליו.","w":["מו\"פ לא קשור להתנגדות של עובדים.","בונוסים הם תגמול חיצוני שלא מטפל בחשש עצמו, ואינם הצעד הראשון.","מיקור חוץ עוקף את הבעיה במקום לטפל בה, ויכול להחריף את ההתנגדות.",""]},{"id":"s6-2","q":"בחברת FreshMarket ההנהלה קבעה יעד של גידול של 12% במכירות. היעד פורק ליעדים לכל סניף, וכל מנהל סניף ישב עם העובדים שלו וקבעו יחד יעדים אישיים מדידים. פעם ברבעון משווים את התוצאות ליעדים ונותנים משוב. באיזו שיטת יישום משתמשת החברה?","o":["BSC","MBO","TOC","מבנה מטריציוני"],"a":1,"why":"\"יעדים אישיים מדידים\", \"קבעו יחד\", \"פירוק יעד ההנהלה לסניפים\", \"השוואה ליעדים ומשוב\" = כל שלבי ניהול לפי יעדים (MBO).","w":["ב-BSC מודדים ארבע פרספקטיבות מאוזנות; כאן יש רק יעד מכירות שמפורק לעובדים.","","TOC מחפשת צוואר בקבוק; אין כאן אילוץ.","מבנה מטריציוני הוא מבנה ארגוני, לא שיטת יישום."]},{"id":"s6-3","q":"בנק FinCore קבע מדדים להצלחת האסטרטגיה שלו: החזר על נכסים, שביעות רצון לקוחות, אחוז התהליכים הממוחשבים, ומספר שעות הדרכה לעובד. באיזו שיטה הבנק משתמש?","o":["MBO","BSC","TOC","GII"],"a":1,"why":"ארבעה סוגי מדדים מאוזנים: פיננסי (החזר על נכסים), לקוחות (שביעות רצון), תהליכים פנימיים (מחשוב), למידה וצמיחה (הדרכה) = ארבע הפרספקטיבות של BSC.","w":["MBO מתמקדת ביעדים מוסכמים בין מנהל לעובד, לא באיזון בין ארבע פרספקטיבות.","","TOC מתמקדת באילוץ אחד, לא בכמה סוגי מדדים.","GII הוא מדד חדשנות של מדינות."]},{"id":"s6-4","q":"מחלבה גדולה גילתה שכל מערך ההפצה שלה מתעכב בגלל זמן ההעמסה של המשאיות במרכז הלוגיסטי. ההנהלה החליטה שכל היחידות יתאימו את קצב העבודה שלהן לשלב הזה, ובמקביל ישקיעו בקיצור זמן ההעמסה. באיזו שיטה מדובר?","o":["BSC","MBO","TOC","חדשנות פתוחה"],"a":2,"why":"\"מעכב את כל המערך\" = אילוץ (צוואר בקבוק); \"כל היחידות יתאימו את הקצב\" = כפיפות לאילוץ; \"קיצור זמן ההעמסה\" = שיפור האילוץ. זו תורת האילוצים.","w":["אין כאן איזון בין ארבע פרספקטיבות.","אין כאן יעדים אישיים מוסכמים.","","חדשנות פתוחה עוסקת בשיתוף ידע עם גורמים חיצוניים."]},{"id":"s6-5","q":"איזו מהבאות <b>אינה</b> אחת מארבע הפרספקטיבות של שיטת BSC?","o":["פרספקטיבת התהליכים הפנימיים","הפרספקטיבה הפיננסית","פרספקטיבת המתחרים","פרספקטיבת הלמידה והצמיחה"],"a":2,"why":"ארבע הפרספקטיבות הן: פיננסית, לקוחות, תהליכים פנימיים, ולמידה וצמיחה. \"מתחרים\" לא ביניהן.","w":["תהליכים פנימיים היא הפרספקטיבה השלישית.","הפיננסית היא הפרספקטיבה הראשונה ב-BSC.","","למידה וצמיחה היא הפרספקטיבה הרביעית."]},{"id":"s6-6","q":"חברת MedTech מודדת במסגרת ה-BSC שלה את מספר שעות ההכשרה לעובד, את אחוז העובדים שנשארו בחברה ואת השדרוג של מערכות המידע. לאיזו פרספקטיבה שייכים המדדים האלה?","o":["פיננסית","לקוחות","למידה וצמיחה","תהליכים פנימיים"],"a":2,"why":"הכשרת עובדים, שימור עובדים ותשתיות טכנולוגיות הם בדיוק המדדים של פרספקטיבת הלמידה והצמיחה (עובדים/טכנולוגיה).","w":["בפיננסית מודדים רווח, הכנסות, ROI ותזרים.","בלקוחות מודדים שביעות רצון לקוחות, נתח שוק ושימור לקוחות, לא שימור עובדים.","","בתהליכים פנימיים מודדים יעילות תפעולית, איכות וניהול מלאי."]},{"id":"s6-7","q":"איזה מהבאים הוא חיסרון של שיטת MBO?","o":["היא עלולה ליצור פוקוס יתר על התוצאות ועל הטווח הקצר, במקום על התהליך","היא לא מאפשרת לעובדים להשתתף בקביעת היעדים","היא לא כוללת שום מדידה של ביצועים","היא מתאימה רק לארגוני ייצור ולא למכירות"],"a":0,"why":"המצגת מונה בין חסרונות MBO: פוקוס יתר על תוצאה ולא על תהליך (\"עסוקים רק במספרים\"), מיקוד בטווח הקצר, בירוקרטיה ונוקשות.","w":["","ההפך: ב-MBO היעדים נקבעים יחד עם העובדים.","ההפך: MBO מבוססת על מדידה ועל יעדים לפי SMART.","MBO שימושית במיוחד לארגונים תפעוליים ולמכירות. התאמה לייצור היא דווקא חוזקה של TOC."]},{"id":"s6-8","q":"משרד ייעוץ משפטי, שמספק שירותים טהורים בלבד, מחפש שיטה ליישום האסטרטגיה. לפי המצגת, איזו שיטה פחות מתאימה לו?","o":["TOC","BSC","MBO","כל השיטות מתאימות לו באותה מידה"],"a":0,"why":"אחד החסרונות של TOC הוא שהיא לא מתאימה לכל הארגונים, למשל לשירותים טהורים. היא מתאימה במיוחד לייצור ולוגיסטיקה.","w":["","BSC מתאימה לארגונים רב-מערכתיים, כולל שירותים (מכבי, בנקים).","MBO מתאימה גם לארגוני שירות; קובעים יעדים לכל עובד.","המצגת אומרת במפורש ש-TOC פחות מתאימה לשירותים טהורים."]},{"id":"s6-9","q":"בחברת ההייטק CodeWave כל מתכנתת שייכת למחלקת הפיתוח ומדווחת לראש המחלקה, ובמקביל היא משובצת לפרויקט של לקוח ומדווחת גם למנהלת הפרויקט. איזה מבנה ארגוני זה?","o":["מבנה פונקציונלי","מבנה מטריציוני","מבנה חטיבתי","מבנה מעורב פשוט"],"a":1,"why":"\"מדווחת לראש המחלקה\" + \"מדווחת גם למנהלת הפרויקט\" = כפיפות לשני מנהלים, מקצועי ופרויקטלי. זה הסימן של מבנה מטריציוני.","w":["במבנה פונקציונלי כל עובד מדווח למנהל אחד.","","במבנה חטיבתי כל עובד שייך לחטיבה אחת עם מנהל אחד.","מבנה מעורב פשוט שומר על אחידות הניהול, בלי כפיפות כפולה."]},{"id":"s6-10","q":"חברת PrintPro היא מפעל קטן שמייצר שלושה סוגים של קרטונים, באותה טכנולוגיה כבר שנים, בשוק יציב. העובדים מחולקים למחלקות רכש, ייצור, אבטחת איכות ולוגיסטיקה, וכל עובד מדווח למנהל המחלקה שלו. איזה מבנה ארגוני זה?","o":["מבנה מטריציוני","מבנה חטיבתי","מבנה פונקציונלי","מבנה מודולרי וירטואלי"],"a":2,"why":"\"מחלקות לפי מקצוע\", \"מנהל אחד\", \"ארגון קטן, מעט מוצרים, סביבה יציבה\" = כל המאפיינים של מבנה פונקציונלי.","w":["אין כאן כפיפות לשני מנהלים.","מבנה חטיבתי מתאים לארגון גדול עם הרבה מוצרים בסביבה לא יציבה.","","אין כאן מיקור חוץ של פעילויות."]},{"id":"s6-11","q":"תאגיד המזון GlobalFoods מחולק ליחידות נפרדות: חטיבת מוצרי חלב, חטיבת קפה וחטיבת מזון לחיות מחמד. לכל חטיבה יש מחלקות פיתוח, ייצור ושיווק משלה, והמטה קובע רק את המדיניות הכללית. איזה מבנה ארגוני זה?","o":["מבנה פונקציונלי","מבנה חטיבתי","מבנה מטריציוני","הולוקרטיה"],"a":1,"why":"\"יחידות נפרדות לפי סוג מוצר\", \"לכל חטיבה פיתוח, ייצור ושיווק משלה\", \"המטה קובע מדיניות כללית\" = מבנה חטיבתי (מוצרי), כמו נסטלה.","w":["במבנה פונקציונלי יש מחלקת שיווק אחת לכל הארגון, לא אחת לכל חטיבה.","","אין כאן כפיפות לשני מנהלים.","הולוקרטיה היא ארגון בלי היררכיה שעובד במעגלים; כאן יש מטה וחטיבות."]},{"id":"s6-12","q":"\"מערכת משותפת של ערכים, אמונות, נורמות והתנהגויות, שמעצבת את האופן שבו חברי הארגון פועלים ומקבלים החלטות\". למה מתייחסת ההגדרה?","o":["מנהיגות ארגונית","מבנה ארגוני","למידה ארגונית","תרבות ארגונית"],"a":3,"why":"זו ההגדרה של שיין (Schein) לתרבות ארגונית, \"האישיות של הארגון\".","w":["מנהיגות היא תהליך של השפעה על אחרים כדי להשיג מטרה משותפת.","מבנה ארגוני עוסק בחלוקת העבודה, הסמכויות והדיווח.","למידה ארגונית עוסקת ברכישת ידע ושינוי בעקבותיו בשלוש רמות.",""]},{"id":"s6-13","q":"בנק ותיק, עם תרבות שמרנית והיררכית שבה לא נהוג להציע רעיונות למנהלים, אימץ אסטרטגיה של חדשנות דיגיטלית. אחרי שנה האסטרטגיה נכשלה והעובדים התנגדו לה. מה ההסבר המתאים ביותר לפי החומר?","o":["האסטרטגיה לא התאימה לתרבות הארגונית, והקונפליקט ביניהן יצר התנגדות","הבנק בחר מבנה מטריציוני במקום מבנה פונקציונלי","הבנק לא השתמש בשיטת TOC כדי לזהות אילוץ","אסטרטגיית חדשנות לעולם לא מתאימה לבנקים"],"a":0,"why":"יישום אסטרטגיה תלוי בהתאמה לתרבות: אסטרטגיית חדשנות לא תצליח בתרבות שמרנית וסגורה לרעיונות, וקונפליקט בין תרבות לאסטרטגיה יוצר התנגדות פנימית.","w":["","הסיפור לא אומר דבר על מבנה ארגוני.","TOC מתאימה בעיקר לייצור ולוגיסטיקה ולא מסבירה את ההתנגדות.","\"לעולם לא\" היא הכללה שגויה; בנקים כן מיישמים חדשנות."]},{"id":"s6-14","q":"בחברת BuildIt צוות פרויקט ערך תחקיר אחרי פרויקט שנכשל, ובעקבותיו כתב נוהל עבודה חדש שהצוות מקפיד עליו מאז. באיזו רמה של למידה ארגונית מדובר?","o":["זו אינה למידה ארגונית","למידה ברמת הפרט","למידה ברמת הארגון","למידה ברמת הצוות"],"a":3,"why":"למידה מניסיון משותף ופיתוח נהלי עבודה בתוך הצוות = למידה ברמת הצוות.","w":["תחקיר וכתיבת נוהל הם בדיוק כלים של למידה ארגונית.","ברמת הפרט מדובר ברכישת מיומנויות של אדם אחד.","ברמת הארגון משתנים תהליכים, תרבות או שיטות עבודה בכל הארגון; כאן השינוי הוא רק בצוות.",""]},{"id":"s6-15","q":"איזה מההיגדים הבאים מתאר נכון מנהיגות, לפי המצגת?","o":["מנהיגות היא תהליך של השפעה חברתית שבו אדם משפיע על אחרים כדי להשיג מטרה משותפת","מנהיגות היא סמכות פורמלית שמקבל מי שממונה לתפקיד ניהולי","מנהיגות היא תכונה מולדת בלבד, שאי אפשר לפתח","מנהיגות היא שיטה למדידת ביצועים בארבע פרספקטיבות"],"a":0,"why":"לפי ההגדרה (Northouse), מנהיגות היא תהליך של השפעה חברתית סביב מטרה משותפת, דרך חזון, השראה ומעורבות.","w":["","המנהיג אינו רק בעל סמכות פורמלית; הוא מוביל בזכות השפעה וחזון.","המצגת מדגישה שמנהיגות היא תהליך ולא רק תכונה מולדת.","זו שיטת BSC."]},{"id":"s6-16","q":"בחברת TopTrade כל ההחלטות, כולל החלטות קטנות בסניפים, מתקבלות על ידי ההנהלה הבכירה, ומנהלי הסניפים רק מבצעים. איך נקרא מבנה כזה?","o":["הולוקרטיה","מבנה מבוזר","מבנה מטריציוני","מבנה ריכוזי"],"a":3,"why":"כשרוב ההחלטות מתקבלות על ידי ההנהלה הבכירה בלי שיתוף הדרגים הנמוכים, המבנה ריכוזי (Centralized).","w":["הולוקרטיה היא ההפך: בלי היררכיה ובלי מנהל דומיננטי.","במבנה מבוזר הסמכויות עוברות למנהלי הביניים.","הסיפור לא מתאר כפיפות לשני מנהלים.",""]}],"tf":[{"id":"s6-t1","s":"כאשר עובדים מתנגדים ליישום אסטרטגיה חדשה, הצעד הראשון הוא לשתף אותם בתהליך קבלת ההחלטות.","a":true,"why":"נכון. שיתוף העובדים בהחלטות יוצר הבנה ומחויבות ומטפל בשורש ההתנגדות; בונוסים או מיקור חוץ אינם הצעד הראשון."},{"id":"s6-t2","s":"שיטת BSC מתמקדת במדדים פיננסיים בלבד.","a":false,"why":"לא נכון. BSC מרחיבה את המדידה מעבר לכסף ומאזנת בין ארבע פרספקטיבות: פיננסית, לקוחות, תהליכים פנימיים, ולמידה וצמיחה."},{"id":"s6-t3","s":"שיטת MBO, שפותחה על ידי פיטר דרוקר, מבוססת על יעדים שנקבעים בהסכמה בין המנהלים לעובדים.","a":true,"why":"נכון. MBO = ניהול לפי יעדים מדידים ומוסכמים, עם מעקב ובקרה של התוצאות מול היעדים."},{"id":"s6-t4","s":"לפי תורת האילוצים (TOC), בכל מערכת קיים לפחות אילוץ אחד שמגביל את כל המערכת.","a":true,"why":"נכון. TOC של גולדרט מזהה את צוואר הבקבוק ופועלת להסיר אותו, ואז מחפשת את האילוץ הבא."},{"id":"s6-t5","s":"שיטת TOC מתאימה במיוחד לארגונים של שירותים טהורים.","a":false,"why":"לא נכון. TOC מתאימה במיוחד לתעשייה, ייצור ולוגיסטיקה, ואחד החסרונות שלה הוא שהיא לא מתאימה לשירותים טהורים."},{"id":"s6-t6","s":"במבנה ארגוני מטריציוני כל עובד מדווח למנהל אחד בלבד.","a":false,"why":"לא נכון. במבנה מטריציוני העובד כפוף לשני מנהלים, מקצועי ופרויקטלי/מוצרי. מנהל אחד מאפיין מבנה פונקציונלי."},{"id":"s6-t7","s":"אסטרטגיה טובה עלולה להיכשל אם היא אינה מתאימה לתרבות הארגונית.","a":true,"why":"נכון. יישום תלוי בהתאמה לתרבות; למשל, אסטרטגיית חדשנות תיכשל בתרבות שמרנית, והקונפליקט ייצור התנגדות."},{"id":"s6-t8","s":"בשיטת BSC, הכשרת עובדים ופיתוח תשתיות טכנולוגיות שייכים לפרספקטיבת הלמידה והצמיחה.","a":true,"why":"נכון. פרספקטיבת הלמידה והצמיחה (עובדים/טכנולוגיה) כוללת הכשרה ושימור עובדים, שביעות רצון עובדים ותשתיות טכנולוגיות."},{"id":"s6-t9","s":"מבנה פונקציונלי מתאים במיוחד לארגון גדול שפועל בסביבה לא יציבה ומייצר מוצרים רבים.","a":false,"why":"לא נכון. זה התיאור של מבנה חטיבתי. מבנה פונקציונלי מתאים לארגון קטן-בינוני עם מעט מוצרים בסביבה יציבה."},{"id":"s6-t10","s":"שיטות MBO, BSC ו-TOC סותרות זו את זו, ולכן ארגון חייב לבחור רק אחת מהן.","a":false,"why":"לא נכון. לפי המצגת השיטות אינן סותרות, ואפשר ואף רצוי לשלב ביניהן לפי אופי הארגון."},{"id":"s6-t11","s":"למידה ארגונית מתרחשת רק ברמת העובד הבודד.","a":false,"why":"לא נכון. למידה ארגונית מתרחשת בשלוש רמות: הפרט, הצוות והארגון כולו."},{"id":"s6-t12","s":"מנהיגות היא בעיקרה סמכות פורמלית שמקבל מי שמונה לתפקיד ניהולי.","a":false,"why":"לא נכון. מנהיגות היא תהליך של השפעה חברתית סביב מטרה משותפת, דרך חזון והשראה, ולא רק סמכות פורמלית."},{"id":"s6-t13","s":"במבנה מבוזר, סמכויות הניהול וההחלטה מועברות למנהלי הביניים.","a":true,"why":"נכון. בביזור מנהלי הביניים מנהלים את תחומיהם באופן עצמאי ואחראים לתוצאות; בריכוזיות ההנהלה הבכירה מחליטה."},{"id":"s6-t14","s":"אחד החסרונות של מבנה חטיבתי הוא כפילות משאבים בין החטיבות.","a":true,"why":"נכון. לכל חטיבה יש את כל הפונקציות שלה, ולכן יש כפילויות ואובדן של היתרון לגודל שקיים במבנה הפונקציונלי."}]}],"exams":[{"id":"sample","title":"המבחן לדוגמה של המכללה","note":"10 אמריקאיות + 10 נכון/לא נכון, אותו מפתח כמו בקובץ המכללה, בניסוח שלנו ועם הסבר לכל תשובה","mc":[{"id":"x1","q":"חברת AquaPure מייצרת מסנני מים לבית ולמשרד. לאחרונה עלתה המודעות הציבורית לאיכות מי השתייה, והוטלו תקנות חדשות על מסננים. ההנהלה רוצה להבין איך שינויים כלכליים, טכנולוגיים ורגולטוריים ישפיעו על הענף. באיזה מודל כדאי לה להשתמש כדי לנתח את הסביבה החיצונית הרחבה?","o":["SWOT","PESTEL(G) / PESTEN","שרשרת הערך של פורטר","חמשת הכוחות התחרותיים של פורטר"],"a":1,"why":"שינויים <b>כלכליים, טכנולוגיים, רגולטוריים וחברתיים</b> הם המאקרו־סביבה. את זה בודק <b>PESTEL</b>: פוליטי, כלכלי, חברתי, טכנולוגי, סביבתי, משפטי (ו־G = גלובלי).","w":["SWOT משלב פנים וחוץ (חוזקות/חולשות מול הזדמנויות/איומים), אבל הוא לא הכלי שממפה את הכוחות הכלכליים והטכנולוגיים של הסביבה הרחבה.","","שרשרת הערך מנתחת את הפעילויות <b>בתוך</b> החברה, לא את הסביבה החיצונית.","חמשת הכוחות בודק את עוצמת התחרות <b>בענף</b> (ספקים, קונים, תחליפים, מתחרים, נכנסים), לא שינויים כלכליים וטכנולוגיים במאקרו."]},{"id":"x2","q":"חברת Atelier Noir מייצרת תיקי עור בעבודת יד, במהדורות קטנות, ללקוחות אמידים מאוד שמחפשים פריט ייחודי ואיכותי. איזו אסטרטגיה מתאימה לה?","o":["מנהיגות בעלות","ממוקדת בידול","ממוקדת מנהיגות בעלות","אוקיינוס כחול"],"a":1,"why":"<b>קהל יעד צר</b> (לקוחות אמידים בלבד) = ממוקדת. <b>ייחודיות ואיכות</b> ולא מחיר נמוך = בידול. יחד: <b>ממוקדת בידול</b>.","w":["מנהיגות בעלות פונה לשוק רחב במחיר נמוך; כאן המוצר יוקרתי ויקר.","","ממוקדת מנהיגות בעלות היא נישה במחיר הכי נמוך; כאן הנישה מחפשת איכות, לא מחיר.","אוקיינוס כחול הוא יצירת שוק חדש בלי מתחרים; שוק התיקים היוקרתיים קיים ותחרותי."]},{"id":"x3","q":"חברת RunCraft מייצרת בגדי ריצה בטכנולוגיית בדים מתקדמת שמאפשרת התאמה אישית. בניתוח SWOT זיהתה הזדמנות: באירופה עולה מאוד הביקוש לבגדי ספורט מחומרים ממוחזרים ומתכלים. החברה רוצה לנצל את ההזדמנות ולהיות חלוצה בתחום. איזה צעד מתאים ביותר?","o":["פיתוח קו מוצרים חדש שעשוי כולו מחומרים ממוחזרים ומתכלים","השקעה נוספת בטכנולוגיות הקיימות כדי לשפר את ייצור הבגדים הנוכחיים","הורדת מחירי הקולקציה הנוכחית כדי לחדור מהר לאירופה","התמקדות בלקוחות שלא אכפת להם מאיכות הסביבה"],"a":0,"why":"ההזדמנות היא <b>ביקוש לבגדים אקולוגיים</b>. הצעד שמנצל אותה ישירות, ובונה מעמד של חלוצה, הוא <b>מוצר חדש שעונה בדיוק על הביקוש הזה</b>.","w":["","שיפור המוצרים הקיימים לא עונה על הביקוש לחומרים אקולוגיים, ולכן לא מנצל את ההזדמנות.","הורדת מחיר למוצרים שאינם אקולוגיים לא עונה על מה שהשוק מבקש, ולא הופכת את החברה לחלוצה.","זה הכיוון ההפוך: בורחים מההזדמנות במקום לנצל אותה."]},{"id":"x4","q":"חברת GeneCore מפתחת תרופות על סמך מחקר פנימי בלבד. היא שומרת בקפדנות על סודיות, מגבילה גישה של גורמים חיצוניים לידע שלה, ומגייסת את מיטב החוקרים כדי להוביל את השוק רק בכוחות עצמה. איזו גישה מתארת את דרך העבודה שלה?","o":["חדשנות תהליך","חדשנות פתוחה","חדשנות סגורה","חדשנות מוצר"],"a":2,"why":"<b>מחקר פנימי בלבד, סודיות, בלי גורמים חיצוניים</b> = <b>חדשנות סגורה</b>: כל הידע נוצר ונשאר בתוך החברה.","w":["חדשנות תהליך היא שיפור הדרך שבה מייצרים או מספקים (יעילות), לא שאלה של מי משתתף בפיתוח.","חדשנות פתוחה היא בדיוק ההפך: שיתוף פעולה עם גורמים חיצוניים, וידע שזורם פנימה והחוצה.","","חדשנות מוצר מתארת <b>מה</b> מחדשים (מוצר חדש), לא את הגישה הסגורה לעומת הפתוחה, שעליה שואלים כאן."]},{"id":"x5","q":"חברת MetroLine מפעילה צי של רכבות קלות חשמליות, ושוקלת להשקיע עוד בענף התחבורה הציבורית. היא רוצה להעריך עד כמה התחרות בענף חזקה, וכמה הענף אטרקטיבי. איזה מודל יעזור לה?","o":["SWOT","שרשרת הערך של פורטר","חמשת הכוחות התחרותיים של פורטר","PESTEL(G) / PESTEN"],"a":2,"why":"<b>עוצמת התחרות בענף</b> ו<b>אטרקטיביות הענף</b> הן בדיוק השאלות של <b>חמשת הכוחות</b>: יריבות בין מתחרים, איום כניסה, תחליפים, כוח ספקים וכוח קונים.","w":["SWOT בוחן את מצב החברה עצמה (חוזקות, חולשות, הזדמנויות, איומים), לא את עוצמת התחרות בענף.","שרשרת הערך מנתחת פעילויות בתוך החברה.","","PESTEL סורק את המאקרו־סביבה (כלכלה, טכנולוגיה, חקיקה...), לא את התחרות בתוך הענף."]},{"id":"x6","q":"חברת ClaimEasy מוכרת ביטוח רכב. היא רוצה יתרון תחרותי מניהול יעיל וזול יותר של תביעות הביטוח, כך שהעלויות שלה יהיו נמוכות משל המתחרים, ותוכל להציע מחיר נמוך לכל הנהגים. איזו אסטרטגיה תחרותית מתאימה?","o":["ממוקדת בידול","מנהיגות בעלות","משולבת מנהיגות בעלות / בידול","בידול רחבה"],"a":1,"why":"<b>הורדת עלויות מתחת למתחרים</b> בשוק רחב (כל הנהגים) = <b>מנהיגות בעלות</b>.","w":["אין כאן נישה ואין ייחודיות; היתרון הוא עלות.","","משולבת היא ערך גבוה במחיר נמוך יחסית; כאן אין שום רכיב בידול, רק עלות נמוכה.","בידול רחבה = מוצר ייחודי שאפשר לגבות עליו פרמיה; כאן היתרון הוא עלות נמוכה."]},{"id":"x7","q":"חברת VoltDrive מייצרת רכבים חשמליים, מפעילה רשת עמדות טעינה ומרכזי שירות, ומפתחת מערכות נהיגה אוטונומית. לפי שרשרת הערך של פורטר, איזו מהפעילויות הבאות היא פעילות <b>תומכת</b> (Support Activity) ולא עיקרית (Primary Activity)?","o":["גיוס, הכשרה ופיתוח של עובדים מקצועיים","ייצור והרכבה של רכבים במפעלי החברה","מכירת רכבים ברשת החנויות של החברה","מתן שירותי תחזוקה ותיקונים במרכזי השירות"],"a":0,"why":"<b>ניהול משאבי אנוש</b> (גיוס, הכשרה, פיתוח עובדים) הוא אחת מארבע הפעילויות התומכות, לצד תשתית החברה, פיתוח טכנולוגי ורכש.","w":["","ייצור = <b>תפעול</b> (Operations), פעילות עיקרית.","מכירה = <b>שיווק ומכירות</b>, פעילות עיקרית.","תחזוקה ותיקונים = <b>שירות</b>, פעילות עיקרית (האחרונה בשרשרת)."]},{"id":"x8","q":"מה המטרה של אסטרטגיית אוקיינוס כחול (Blue Ocean Strategy)?","o":["ליצור מרחב שוק חדש בלי מתחרים, וכך להפוך את התחרות ללא רלוונטית","להתחרות בשוק הקיים ולנצח את המתחרים הנוכחיים","לנצל את הביקוש הקיים ולשמור על הבחירה בין ערך גבוה לעלות נמוכה","להילחם במתחרים ישירות באמצעות מלחמת מחירים"],"a":0,"why":"אוקיינוס כחול = <b>שוק חדש שעוד אין בו מתחרים</b>. במקום להילחם, יוצרים ביקוש חדש ו\"עוקפים\" את התחרות.","w":["","זה בדיוק <b>אוקיינוס אדום</b>: שוק קיים, מתחרים קיימים, מאבק על נתח.","אוקיינוס כחול <b>יוצר</b> ביקוש חדש, ושובר את הבחירה בין ערך לעלות (מציע את שניהם). התשובה מתארת אוקיינוס אדום.","מלחמת מחירים היא תחרות ישירה, סימן מובהק של אוקיינוס אדום."]},{"id":"x9","q":"חברת GreenGrid מקימה תחנות טעינה לרכבים חשמליים. ביישום האסטרטגיה החדשה היא נתקלת בהתנגדות של עובדים. מה הצעד הראשון להתמודדות עם ההתנגדות?","o":["הגדלת ההשקעה במחקר ופיתוח","שיתוף העובדים בתהליך קבלת ההחלטות","העברת היישום למיקור חוץ","תשלום בונוסים על שיתוף פעולה"],"a":1,"why":"התנגדות לשינוי נובעת בדרך כלל מחשש ומחוסר הבנה. הצעד הראשון הוא <b>לשתף את העובדים</b>: להסביר, להקשיב ולתת להם חלק בהחלטות, וכך הם הופכים לשותפים לאסטרטגיה.","w":["מו\"פ לא נוגע לסיבת ההתנגדות, שהיא אנשים, לא טכנולוגיה.","","מיקור חוץ עוקף את העובדים ולא פותר את ההתנגדות; הוא עלול אף להחריף אותה.","בונוס יכול לעזור בהמשך, אבל הוא לא הצעד הראשון: בלי הבנה ושיתוף, תשלום לא מבטל את החשש."]},{"id":"x10","q":"חברת PeakGear מייצרת ציוד וביגוד לטיולי שטח. באתר שלה כתוב: \"אנחנו מספקים ביגוד, הנעלה וציוד שטח חדשניים ואיכותיים, שמאפשרים לכל אחד לצאת לטבע בבטחה ובנוחות ולהגיע רחוק יותר\". המשפט הזה הוא דוגמה ל־","o":["חזון גנרי","מהות עסק","ניסוח אסטרטגי","יעד לפי מודל SMART"],"a":1,"why":"המשפט מתאר <b>מה החברה עושה היום, בשביל מי, ואיזה צורך היא ממלאת</b> (\"אנחנו מספקים...\"). זו <b>מהות העסק</b> (Mission). חזון מתאר לאן החברה שואפת להגיע בעתיד.","w":["חזון מתאר את העתיד הרצוי (\"לאן נגיע\"), ו\"גנרי\" הוא חזון כללי שמתאים לכל חברה. כאן מתוארת הפעילות הנוכחית.","","ניסוח אסטרטגי הוא תכנית הפעולה (איך ננצח), לא הצהרה על מה שהחברה מספקת.","יעד SMART חייב להיות מדיד ותחום בזמן (למשל \"20% נתח שוק עד 2027\"); כאן אין מספר ואין תאריך."]}],"tf":[{"id":"xt1","s":"חסמי כניסה גבוהים מגדילים את פוטנציאל הרווחיות של הפירמות שכבר פועלות בענף.","a":true,"why":"נכון. חסמים גבוהים מקשים על מתחרים חדשים להיכנס, ולכן התחרות מוגבלת והפירמות הקיימות יכולות לשמור על מחירים ורווחים גבוהים."},{"id":"xt2","s":"אסטרטגיית אוקיינוס כחול נועדה להתחרות ישירות במתחרים בשוק קיים.","a":false,"why":"לא נכון. זה אוקיינוס אדום. אוקיינוס כחול יוצר מרחב שוק חדש, בלי מתחרים, וכך הופך את התחרות ללא רלוונטית."},{"id":"xt3","s":"אסטרטגיית בידול ממוקדת מתאימה לפירמה שמוכרת מוצרים זולים במיוחד לנישה מסוימת.","a":false,"why":"לא נכון. מוצרים זולים לנישה הם ממוקדת <b>מנהיגות בעלות</b>. ממוקדת בידול מציעה לנישה מוצר <b>ייחודי</b>, ולרוב יקר."},{"id":"xt4","s":"חדשנות פתוחה מאפשרת לידע לצאת אל מחוץ לחברה, תוך שיתוף פעולה עם גורמים חיצוניים.","a":true,"why":"נכון. בחדשנות פתוחה הידע זורם פנימה <b>וגם החוצה</b> (למשל רישוי טכנולוגיה, שיתופי פעולה), בניגוד לחדשנות סגורה שבה הכול נשאר בפנים."},{"id":"xt5","s":"חזון עסקי נועד בראש ובראשונה ללקוחות החברה.","a":false,"why":"לא נכון. החזון נועד בעיקר <b>לאנשי הארגון</b>: הוא מכוון את העובדים וההנהלה ונותן להם כיוון ומוטיבציה משותפים. הוא לא פרסומת ללקוחות."},{"id":"xt6","s":"אסטרטגיית מנהיגות בעלות מתמקדת בהפחתת עלויות ובשמירה על מחירים נמוכים.","a":true,"why":"נכון. היתרון התחרותי של מנהיג בעלות הוא עלות נמוכה מזו של המתחרים, שמאפשרת לו למכור במחיר נמוך לשוק רחב ועדיין להרוויח."},{"id":"xt7","s":"כשלחברה יש יכולת ליבה בהורדת עלויות ייצור, האסטרטגיה הגנרית המתאימה לה ביותר לפי פורטר היא בידול רחבה.","a":false,"why":"לא נכון. יכולת ליבה בהורדת עלויות מתאימה ל<b>מנהיגות בעלות</b>. בידול רחבה נשענת על ייחודיות שהלקוח מוכן לשלם עליה יותר."},{"id":"xt8","s":"אסטרטגיה עסקית היא תהליך שמטרתו ליצור התאמה בין צורכי הלקוחות לבין יעדי הפירמה.","a":false,"why":"לא נכון. אסטרטגיה היא תכנית הפעולה של הארגון להשגת מטרותיו ולניצחון באמצעות <b>יתרון תחרותי</b>. התאמה בין צורכי הלקוח למוצר היא תפקיד <b>השיווק</b>."},{"id":"xt9","s":"לפי מודל חמשת הכוחות של פורטר, ככל שיש יתרון לגודל גדול יותר בענף, הרווחיות של הפירמות בענף נמוכה יותר.","a":false,"why":"לא נכון. יתרון לגודל הוא <b>חסם כניסה</b>: הוא מרתיע מתחרים חדשים, ולכן מגדיל את רווחיות הפירמות הקיימות, לא מקטין אותה."},{"id":"xt10","s":"חברה יכולה להיות חדשנית גם בלי להשתמש בטכנולוגיות חדשות.","a":true,"why":"נכון. יש <b>חדשנות א־טכנולוגית</b>: מודל עסקי, שיווק, ארגון או שירות חדשים, בלי טכנולוגיה חדשה."}]}],"talk":{"s1":{"title":"פרק אחד: מבוא לאסטרטגיה וחמש משימות הניהול האסטרטגי","lines":[{"s":"קריין","x":"שלום לכם. בפרק הזה נלמד מה זו אסטרטגיה, ואיך מנהלים אותה בחמש משימות."},{"s":"קריין","x":"זה הבסיס של כל הקורס, ובמבחן יופיעו מכאן הרבה סיפורים קצרים לזיהוי. אז בואו נתחיל."},{"s":"קריין","x":"אסטרטגיה היא תכנית הפעולה של הארגון, כדי להשיג את המטרות שלו ולנצח בעזרת יתרון תחרותי."},{"s":"קריין","x":"ומה המטרה שלה? ליצור יתרון תחרותי, כדי להשיג תשואה מעל הממוצע."},{"s":"קריין","x":"מעל הממוצע, כלומר יותר ממה שמשקיע היה מקבל בהשקעות אחרות עם סיכון דומה, באותו שוק."},{"s":"קריין","x":"יתרון תחרותי בר קיימא הוא יתרון שמבדל את החברה וקשה להעתיק אותו, ולכן הוא מחזיק לאורך זמן."},{"s":"קריין","x":"וזכרו, היתרון נמדד תמיד מול חברות באותו ענף."},{"s":"קריין","x":"נקודת המבט של הקורס היא מה טוב לפירמה, לא מה טוב ללקוח. התאמה לצרכי הלקוחות היא תפקיד השיווק."},{"s":"קריין","x":"החשיבה האסטרטגית עונה על שלוש שאלות. איפה אנחנו עכשיו, לאן רוצים להגיע, ואיך עושים את זה."},{"s":"קריין","x":"עכשיו, איך מבדילים בין החלטה אסטרטגית להחלטה טקטית? בודקים ארבעה ממדים."},{"s":"קריין","x":"החלטה אסטרטגית דורשת הרבה משאבים, היא לטווח ארוך, מתקבלת בהנהלה הבכירה, ומחיר הטעות בה גבוה מאוד."},{"s":"קריין","x":"החלטה טקטית היא ההפך. מעט משאבים, טווח קצר, דרג נמוך יותר, וקל לתקן אותה."},{"s":"קריין","x":"דוגמה. אִינְטֶל רוכשת את מוֹבִּילְאַיי בחמישה עשר מיליארד דולר. זו החלטה אסטרטגית. להעסיק כמה מהנדסים במפעל, זו טקטית."},{"s":"קריין","x":"ועכשיו הבלבול הכי נפוץ במבחן, אסטרטגיה מול שיווק."},{"s":"קריין","x":"שיווק הוא מחלקה בארגון, שתפקידה לנהל את הביקוש. להגדיל אותו, להסיט אותו, ולפעמים אפילו להקטין אותו, כמו בעישון."},{"s":"קריין","x":"המשפט לזכור: אסטרטגיה שיווקית איננה אסטרטגיה עסקית. השיווק הוא רק חלק אחד מהארגון."},{"s":"קריין","x":"האסטרטגיה מכוונת את כל הארגון לטווח ארוך, ונמדדת ביתרון תחרותי, ברווחיות ובתשואה לבעלי המניות."},{"s":"קריין","x":"השיווק עוסק בפילוח, מיצוב, תמחור, הפצה ופרסום, ונמדד במכירות, במודעות למותג ובשביעות רצון הלקוחות."},{"s":"קריין","x":"המלכודת: היגד שאומר שהצלחת האסטרטגיה נמדדת בשביעות רצון לקוחות. זה לא נכון, זה תיאור של שיווק."},{"s":"קריין","x":"נעבור לשלוש רמות האסטרטגיה. הרמה העליונה היא אסטרטגיה תאגידית, והיא עונה על השאלה איפה נתחרה."},{"s":"קריין","x":"באילו שווקים ועסקים, וכמה משאבים לתת לכל יחידה עסקית. למשל מיזוגים ורכישות, או גיוון לתחום חדש."},{"s":"קריין","x":"הרמה השנייה היא אסטרטגיה עסקית, שנקראת גם אסטרטגיה תחרותית. היא עונה על השאלה איך ננצח בשוק מסוים."},{"s":"קריין","x":"התשובה היא יתרון בעלות, אותו מוצר בזול יותר, או יתרון בבידול, מוצר עם תכונות עדיפות."},{"s":"קריין","x":"הרמה השלישית היא אסטרטגיה פונקציונלית. איך כל מחלקה תממש את הכיוון שנקבע למעלה."},{"s":"קריין","x":"סיפור לדוגמה. תאגיד מזון רוכש רשת בתי קפה בחוץ לארץ. זו רמה תאגידית, כי זו שאלה של איפה פועלים."},{"s":"קריין","x":"יחידת המשקאות שלו מחליטה לנצח את המתחרים במחיר נמוך. זו רמה עסקית."},{"s":"קריין","x":"ומחלקת משאבי האנוש בונה תכנית גיוס לשנה. זו רמה פונקציונלית."},{"s":"קריין","x":"המלכודת: עסקית ותחרותית הן אותה רמה. וכניסה לתחום חדש לגמרי היא תמיד תאגידית."},{"s":"קריין","x":"החלטות אסטרטגיות מתחלקות לשני סוגים. בחירת תחומי הפעילות, ומהלכים לשיפור הפעילות והמעמד בשוק."},{"s":"קריין","x":"כלל אצבע: ככל שההחלטה ארוכת טווח, יקרה, קשה לביטול ומשפיעה על הרבה אנשים, היא אסטרטגית יותר."},{"s":"קריין","x":"ועכשיו סיפור מפורסם, מלחמת הקולה. קוֹקָה קוֹלָה ופֶּפְּסִי מוכרות מוצר כמעט זהה, אבל בחרו דרכים שונות."},{"s":"קריין","x":"קוֹקָה קוֹלָה הלכה על מסורת ונוסטלגיה, עם אנשים רגילים וסמלים כמו סַנְטָה קְלָאוּס, והתמקדה במשקה הדגל."},{"s":"קריין","x":"פֶּפְּסִי פנתה לצעירים עם ידוענים כמו מַייקְל גֶ'קְסוֹן, וגיוונה את המוצרים, עם חטיפים ומשקאות אנרגיה."},{"s":"קריין","x":"ולכל אחת כישלון מפורסם. לקוֹקָה קוֹלָה היה נְיוּ קוֹק, ולפֶּפְּסִי היה משקה שקוף שנגנז מהר."},{"s":"קריין","x":"המלכודת: אל תהפכו צדדים. קולה זה מסורת ואנשים רגילים. פפסי זה צעירים, ידוענים וגיוון."},{"s":"קריין","x":"איך קבוצת מנהלים בוחרת בין אפשרויות? יש שלוש שיטות."},{"s":"קריין","x":"הראשונה, בירור דיאלקטי. מעמתים בכוונה שתי תוכניות מנוגדות, ומהעימות יוצרים סינתזה."},{"s":"קריין","x":"זו השיטה שנותנת את ההחלטות האיכותיות ביותר, אבל היא דורשת הכי הרבה זמן ואנרגיה."},{"s":"קריין","x":"השנייה, יועץ השטן. ממנים אדם או קבוצה שתפקידם לתקוף תוכנית קיימת ולמצוא בה חולשות."},{"s":"קריין","x":"היא טובה באיתור חולשות ספציפיות, פחות טובה ביצירת פתרונות חדשים, ולפעמים יוצרת עימות אישי."},{"s":"קריין","x":"השלישית, קונצנזוס. מגיעים להסכמה בלי עימות. שביעות הרצון גבוהה, וזה מתאים כשצריך אחדות או כשהזמן קצר."},{"s":"קריין","x":"סיפור. בחברת תוכנה צוות אחד מציע להתרחב לאסיה, וצוות שני מציע להישאר בישראל. בסוף נבנתה תוכנית שמשלבת את שתיהן."},{"s":"קריין","x":"זה בירור דיאלקטי, שתי תוכניות ואחריהן סינתזה. אילו הייתה רק תוכנית אחת שמישהו מונה לתקוף, זה היה יועץ השטן."},{"s":"קריין","x":"המלכודת: ביועץ השטן יש רק ביקורת, בלי תוכנית נגדית. והדיאלקטי הוא האיטי, לא המהיר."},{"s":"קריין","x":"נושא קצר, גבולות אופקיים. אופקי פירושו לרוחב, באותו שלב של שרשרת הערך."},{"s":"קריין","x":"התרחבות אופקית היא למשל רכישת מתחרה או כניסה למדינה חדשה, כמו פֶּפְּסִיקוֹ שרוכשת את סוֹדָהסְטְרִים."},{"s":"קריין","x":"גבולות אופקיים בתוך הארגון הם התיחום בין יחידות ומחלקות, כדי לשלב ביניהן ולמנוע כפילויות."},{"s":"קריין","x":"המלכודת: יצרן שפותח רשת חנויות משלו או רוכש ספק עובר לשלב אחר בשרשרת. זה אנכי, לא אופקי."},{"s":"קריין","x":"ועכשיו הלב של הפרק, חמש משימות הניהול האסטרטגי. אחת, חזון, ערכים ומשימת הארגון. שתיים, הצבת יעדים."},{"s":"קריין","x":"שלוש, ניסוח האסטרטגיה. ארבע, יישום וביצוע. וחמש, הערכת ביצועים ונקיטת צעדים מתקנים."},{"s":"קריין","x":"זה מעגל, לא תהליך חד פעמי. הגבולות בין המשימות מעורפלים, וכל חברי הארגון שותפים לביצוע."},{"s":"קריין","x":"משימה אחת כוללת שלוש הצהרות שמתבלבלות כל הזמן. הראשונה, חזון. מה הארגון רוצה להיות בעתיד, כלומר לאן הולכים."},{"s":"קריין","x":"החזון מיועד בעיקר פנימה, להנהלה ולעובדים. הוא נותן כיוון, השראה ומוטיבציה, ועוזר לגייס ולשמר עובדים."},{"s":"קריין","x":"החזון ריאלי אבל שאפתני, והוא יכול להשתנות, כמו נֶטְפְלִיקְס שעברה מהשכרת דיסקים לסטרימינג."},{"s":"קריין","x":"השנייה, מהות העסק, שנקראת גם ייעוד או משימה. מה עושים היום, עבור מי, ולאיזו מטרה, במונחי תועלת ללקוח."},{"s":"קריין","x":"השלישית, ערכים. עקרונות שמנחים את ההתנהגות של מנהלים ועובדים, בדרך כלל ארבעה עד שמונה."},{"s":"קריין","x":"דוגמה מאִיקֵאָה. החזון הוא ליצור חיים יומיומיים טובים יותר לאנשים רבים. זה עתיד ושאיפה."},{"s":"קריין","x":"המשימה היא להציע רהיטים מעוצבים במחירים נמוכים, כדי שכמה שיותר אנשים יוכלו לקנות. זו מהות העסק."},{"s":"קריין","x":"שימו לב, הצהרת המשימה אינה אסטרטגיה. היא לא ייחודית, והיא לא גורמת ללקוחות לבחור בחברה."},{"s":"קריין","x":"ולפי פּוֹרְטֶר, מהות האסטרטגיה היא לבחור מה לא לעשות."},{"s":"קריין","x":"המלכודת: עתיד ושאיפה, זה חזון. מה מספקים ולמי, זה מהות העסק. ואם יש מספר ותאריך יעד, זה יעד, לא חזון."},{"s":"קריין","x":"באותה משימה מגדירים גם לקוחות ומתחרים. הגדרת לקוחות עונה על עבור מי. קבוצות, צרכים ואזור גיאוגרפי."},{"s":"קריין","x":"הגדרת מתחרים עונה על מול מי מתחרים, וגם על השאלה אם לבחור בתחרות או בשיתוף פעולה."},{"s":"קריין","x":"משימה שתיים, הצבת יעדים. כאן הופכים את החזון למשימות לביצוע."},{"s":"קריין","x":"מטרה היא כללית ורעיונית, ומשרתת את האסטרטגיה. יעד הוא ספציפי ומדיד, ומשרת את המטרה."},{"s":"קריין","x":"מטרות אסטרטגיות משפרות את המעמד התחרותי. מטרות פיננסיות משפרות את הביצועים הכספיים."},{"s":"קריין","x":"כדי לבדוק אם יעד כתוב נכון משתמשים במודל סְמַארְט. ספציפי, מדיד, בר השגה, ריאלי או רלוונטי, ותחום בזמן."},{"s":"קריין","x":"לשפר את המכירות, זה לא סְמַארְט, אין מספר ואין זמן. להגדיל את המכירות בעשרים אחוז עד סוף השנה, זה כן."},{"s":"קריין","x":"המלכודת: אם חסר רק עד מתי, הרכיב החסר הוא תחום בזמן. אם חסר מספר, הרכיב החסר הוא מדיד."},{"s":"קריין","x":"משימה שלוש, ניסוח האסטרטגיה. כאן בוחרים את הדרך, למשל מיקוד או גיוון, ועל מה יתבסס היתרון."},{"s":"קריין","x":"ומי מנסח? יש שתי גישות. טוֹפּ דָאוּן, מלמעלה למטה. ההנהלה הבכירה מכתיבה ומורידה לביצוע."},{"s":"קריין","x":"היתרונות שלה הם מיקוד, שליטה, עקביות ומהירות החלטה. החיסרון הוא סיכון לניתוק בין ההנהלה לשטח."},{"s":"קריין","x":"בּוֹטוֹם אַפּ, מלמטה למעלה. הרעיונות עולים מהעובדים בשטח אל ההנהלה. היתרונות הם גמישות, חדשנות ומוטיבציה."},{"s":"קריין","x":"החיסרון הוא תכנון איטי, וקושי לשמור על עקביות. הדוגמאות הן גוּגְל, תְרִי אֶם ולֶגוֹ."},{"s":"קריין","x":"סיפור. ברשת מלונות עובדי הקבלה הציעו צ'ק אין דיגיטלי, וההנהלה אימצה את הרעיון לכל הרשת. זה בּוֹטוֹם אַפּ."},{"s":"קריין","x":"המלכודת: גמישות וחדשנות שייכות לבּוֹטוֹם אַפּ. שליטה ועקביות שייכות לטוֹפּ דָאוּן."},{"s":"קריין","x":"משימה ארבע, יישום. זה שלב מֵייק אִיט הֶפֶּן. מקצים תקציב, בונים מבנה ותרבות, ומפעילים מנהיגות ומוטיבציה."},{"s":"קריין","x":"איך מזהים בסיפור? האסטרטגיה כבר נבחרה, ועכשיו מבצעים."},{"s":"קריין","x":"משימה חמש, הערכה ותיקון. מודדים את התוצאות מול היעדים ומתקנים, ואפשר לחזור לכל משימה קודמת."},{"s":"קריין","x":"סיפור. רשת מסעדות בדקה אחרי שנה שהמכירות נמוכות מהיעד, גילתה מתחרה חדש, ושינתה את התפריט ואת היעדים."},{"s":"קריין","x":"זו משימה חמש. המילים המכריעות הן בדקה, מהיעד, שינתה."},{"s":"קריין","x":"המלכודת: יישום זה לבצע, הערכה זה למדוד ולתקן. וניסוח זה לבחור את הדרך, לא ללכת בה."},{"s":"קריין","x":"בואו נסכם. אסטרטגיה נמדדת ברווחיות ובתשואה. שיווק נמדד במכירות ובשביעות רצון."},{"s":"קריין","x":"תאגידית זה איפה מתחרים, עסקית זה איך מנצחים, ופונקציונלית זה כל מחלקה מבצעת."},{"s":"קריין","x":"דיאלקטי זה שתי תוכניות וסינתזה. יועץ השטן זה תקיפה של תוכנית אחת."},{"s":"קריין","x":"חזון זה לאן, בעיקר לעובדים. ייעוד זה מה ולמי, במונחי תועלת ללקוח."},{"s":"קריין","x":"עכשיו שתי שאלות. עצרו רגע וחשבו. חברה כתבה: אנו שואפים להוביל את המעבר לעולם נקי יותר. מה זה?"},{"s":"קריין","x":"זה חזון. זו שאיפה לעתיד, בלי מספר ובלי תאריך, ולא תיאור של מה מספקים היום."},{"s":"קריין","x":"שאלה שנייה. עצרו רגע וחשבו. ההנהלה מינתה מנהלת אחת שכל תפקידה למצוא חורים בתוכנית ההתרחבות. איזו שיטה זו?"},{"s":"קריין","x":"זה יועץ השטן. יש תוכנית אחת ומישהו שתוקף אותה, בלי תוכנית נגדית ובלי סינתזה."},{"s":"קריין","x":"זהו להיום. בפרק הבא נצא החוצה, לנתח את הסביבה ואת הענף. בהצלחה."}]},"s2":{"title":"פרק שתיים: ניתוח הסביבה החיצונית, פֶּסְטֶל וחמשת הכוחות","lines":[{"s":"קריין","x":"שלום לכם. בפרק הזה נצא החוצה, ונלמד לנתח את הסביבה של החברה ואת הענף שבו היא פועלת."},{"s":"קריין","x":"במבחן תצטרכו לבחור את המודל הנכון, ולדעת לאיזה כיוון כל גורם משפיע על הרווחיות."},{"s":"קריין","x":"נתחיל ממושג בסיס, ענף. ענף הוא קבוצת חברות שמציעות מוצרים דומים, שעונים על אותו צורך של הלקוח."},{"s":"קריין","x":"והנקודה החשובה: את הענף מגדירים מנקודת המבט של הלקוח. אם שני מוצרים פותרים את אותו צורך, הם מתחרים."},{"s":"קריין","x":"ההגדרה עצמה היא החלטה אסטרטגית. האם סרט שייך לענף הקולנוע, או לענף הפנאי הרחב? זה משנה מי נחשב מתחרה."},{"s":"קריין","x":"סקטור הוא הקבוצה הרחבה ביותר, למשל הסקטור הפיננסי. ענף הוא חברות דומות בתוכו, למשל הבנקאות."},{"s":"קריין","x":"ופלח שוק הוא קבוצת לקוחות בתוך הענף, למשל בנקאות פרטית לעשירים."},{"s":"קריין","x":"המלכודת: פלח שוק הוא קבוצה של לקוחות, לא של חברות. לקוחות צעירים או עשירים בתוך ענף, זה פלח שוק."},{"s":"קריין","x":"עכשיו, כוחות מניעי שינוי. אלה כוחות כלכליים, חברתיים, טכנולוגיים ורגולטוריים שמשנים את הענף ואת מבנה התחרות."},{"s":"קריין","x":"למשל בינה מלאכותית שמחליפה תפקידים, מעבר של צרכנים למנויים כמו סְפּוֹטִיפַיי, תקנות פרטיות, או מלחמות סחר."},{"s":"קריין","x":"יש כוחות פנימיים לענף, כמו חדשנות טכנולוגית, וחיצוניים, כמו רגולציה ממשלתית."},{"s":"קריין","x":"ומושג נחמד, אפקט המלכה האדומה. כמו עֲלִיסָה שרצה ולא זזה ממקומה."},{"s":"קריין","x":"כל חברה משתפרת, אבל המתחרים משתפרים באותו קצב, ולכן אף אחת לא מתקדמת ביחס לאחרות, והתחרות רק מתחזקת."},{"s":"קריין","x":"נעבור למודל הראשון, פֶּסְטֶל. הוא מנתח את המאקרו סביבה, כלומר הגורמים הגדולים מחוץ לענף, שהחברה לא שולטת בהם."},{"s":"קריין","x":"במבחן הוא מופיע לפעמים בשם פֶּסְטֶן. זה אותו מודל."},{"s":"קריין","x":"האותיות הן פוליטי, כלכלי, חברתי, טכנולוגי, סביבתי ומשפטי. ולפעמים מוסיפים גם גלובלי."},{"s":"קריין","x":"פוליטי זה מדיניות ממשלה ויציבות פוליטית. כלכלי זה ריבית, אינפלציה, תעסוקה וכוח קנייה."},{"s":"קריין","x":"חברתי זה טרנדים והרגלי צריכה. טכנולוגי זה חידושים כמו בינה מלאכותית ואוטומציה."},{"s":"קריין","x":"סביבתי זה אקלים, אנרגיה ירוקה ופליטות. משפטי זה חוקים. וגלובלי זה שרשראות אספקה ומלחמות בעולם."},{"s":"קריין","x":"איך מזהים שאלה על פֶּסְטֶל? החברה רוצה להבין שינויים בסביבה הכללית, ואיך הם ישפיעו על כל הענף."},{"s":"קריין","x":"דוגמאות. בנק ישראל העלה את הריבית, והביקוש למשכנתאות ירד. זה גורם כלכלי."},{"s":"קריין","x":"הצרכנים עוברים לקנות אונליין, וזה פוגע ברשתות. זה גורם חברתי, שינוי בהרגלי צריכה."},{"s":"קריין","x":"האיחוד האירופי הגביל פליטות פחמן של מכוניות. זה גורם סביבתי."},{"s":"קריין","x":"המלכודת: יש שתי אותיות אִי. אחת כלכלית, ריבית ואינפלציה. השנייה סביבתית, אקלים ופליטות."},{"s":"קריין","x":"ובחירת המודל: פֶּסְטֶל זה הסביבה הכללית. חמשת הכוחות זה התחרות בתוך הענף. וסְווֹט מסתכל גם על החברה עצמה."},{"s":"קריין","x":"ועכשיו המודל הכי חשוב בפרק, חמשת הכוחות של מַייקְל פּוֹרְטֶר. זה ניתוח של המיקרו סביבה."},{"s":"קריין","x":"המודל בודק את עוצמת התחרות בענף, וממנה מעריכים את פוטנציאל הרווחיות של הענף כולו, לא של חברה אחת."},{"s":"קריין","x":"הכלל הכי חשוב: כוחות חזקים יותר, תחרות גבוהה יותר, מחירים יורדים, ורווחיות נמוכה יותר."},{"s":"קריין","x":"הכוח הראשון, עוצמת התחרות בין המתחרים הקיימים. היא חזקה כשיש הרבה שחקנים דומים, צמיחה איטית ואין בידול."},{"s":"קריין","x":"הכוח השני, איום כניסת מתחרים חדשים. הוא חזק כשחסמי הכניסה נמוכים, כמו בענף המסעדות."},{"s":"קריין","x":"הכוח השלישי, איום מוצרים תחליפיים. אלה מוצרים מענף אחר שממלאים תפקיד דומה."},{"s":"קריין","x":"יחס האיכות והמחיר של התחליפים קובע תקרה לשולי הרווח. אם תעלו מחיר יותר מדי, הלקוח יעבור לתחליף."},{"s":"קריין","x":"הכוח הרביעי, כוח המיקוח של הספקים. והכוח החמישי, כוח המיקוח של הלקוחות."},{"s":"קריין","x":"ויש גם כוח שישי, שהוסיף אַנְדְרוּ גְרוֹב. מוצרים משלימים, מענף אחר, שצריך אותם כדי שהמוצר שלנו יעבוד."},{"s":"קריין","x":"למשל בענף הרכב. דלק וביטוח הם משלימים. אם הביטוח מתייקר מאוד, פחות אנשים קונים רכב."},{"s":"קריין","x":"ובאותו ענף, רכב של הוֹנְדָה מול רכב של מִיצוּבִּישִׁי הם מתחרים. ואופניים במקום רכב, זה תחליף."},{"s":"קריין","x":"המלכודת: באותו ענף, זה מתחרה. בענף אחר ועושה אותו דבר, זה תחליף. בענף אחר וצריך אותו יחד, זה משלים."},{"s":"קריין","x":"עוד הבחנה בכוח הראשון, גורם מול ממד. גורם הוא הסיבה המבנית לתחרות, למשל צמיחה איטית או מחסומי יציאה גבוהים."},{"s":"קריין","x":"ממד הוא איך התחרות נראית בפועל, כמו תחרות מחירים, קמפיינים והשקת מוצרים. החברה רוצה לצמצם את הגורמים."},{"s":"קריין","x":"עכשיו חסמי כניסה. חסם כניסה הוא כל דבר שמקשה על חברה חדשה להיכנס לענף."},{"s":"קריין","x":"למשל יתרון לגודל, נאמנות למותג, השקעה גדולה נדרשת, רישיונות ורגולציה, עלויות מעבר ללקוח ושליטה בהפצה."},{"s":"קריין","x":"חסמים גבוהים מגינים על החברות הקיימות, ולכן הרווחיות שלהן גבוהה יותר. חסמים נמוכים, והרווחיות נשחקת."},{"s":"קריין","x":"המלכודת הקלאסית: יתרון לגודל לא מוריד את הרווחיות בענף, הוא מעלה אותה, כי הוא חסם כניסה."},{"s":"קריין","x":"נעבור לספקים וללקוחות. הכוח שלהם הפוך. כשללקוח יש כוח, לספק אין, ולהפך."},{"s":"קריין","x":"ספק חזק כשיש מעט ספקים, המוצר שלו קריטי, הלקוחות שבויים, והוא יכול לרכוש את לקוחותיו."},{"s":"קריין","x":"לקוח חזק כשהוא קונה כמויות גדולות, יש הרבה יצרנים ומעט קונים, ועלות המעבר שלו לספק אחר נמוכה."},{"s":"קריין","x":"ומונופסון הוא מצב שבו יש רק לקוח אחד, ששולט בכל הביקוש וקובע את המחיר. למשל משרד הביטחון מול יצרני נשק."},{"s":"קריין","x":"סיפור. יצרנית הרחפנים סְקַייקָאם קונה מעבד מיוחד מספק אחד בעולם. הספק העלה מחיר, והיא נאלצה לשלם."},{"s":"קריין","x":"זה כוח מיקוח חזק של ספקים, כי יש ספק יחיד ומוצר קריטי."},{"s":"קריין","x":"וחנויות ספרים שנסגרות כי אנשים קוראים בטאבלט? זה איום תחליפים. ענף אחר, אותו צורך."},{"s":"קריין","x":"ביקורת אחת על המודל: הוא סטטי, ולכן מתקשה לנבא כשכללי המשחק משתנים מהר."},{"s":"קריין","x":"נושא הבא, אסטרטגיית אוקיינוס כחול. יוצרים שוק חדש, שאין בו תחרות ישירה, והמתחרים הופכים ללא רלוונטיים."},{"s":"קריין","x":"הבסיס הוא חדשנות בערך. מעלים את הערך ללקוח, ובמקביל מוותרים על דברים לא חיוניים שעולים כסף."},{"s":"קריין","x":"אוקיינוס אדום הוא שוק קיים וצפוף, עם מלחמת מחירים על אותם לקוחות, ושחיקת רווחים."},{"s":"קריין","x":"דוגמאות לכחול: סִירְק דוּ סוֹלֵיי ששילב תיאטרון וקרקס, ובישראל וֵויז ומוֹבִּילְאַיי."},{"s":"קריין","x":"רשתות פיצה שמורידות מחירים כל חודש, זה אדום. מכשיר שמפיק מים מהאוויר, בלי מתחרים ישירים, זה כחול."},{"s":"קריין","x":"המלכודת: המטרה של אוקיינוס כחול היא לא לנצח בשוק הקיים, אלא ליצור שוק חדש."},{"s":"קריין","x":"עכשיו קֵיי אֵס אֵף, גורמי הצלחה קריטיים. מה שכל חברה בענף חייבת לעשות טוב כדי להצליח היום."},{"s":"קריין","x":"למשל ברכב חשמלי, סוללות מתקדמות ורשת טעינה."},{"s":"קריין","x":"אֵף קֵיי אֵס אֵף הם גורמי הצלחה עתידיים. עוד לא קריטיים, אבל צפויים להיות. ברכב חשמלי, נהיגה אוטונומית מלאה."},{"s":"קריין","x":"המלכודת: קֵיי אֵס אֵף שייך לענף, לא לחברה אחת. והמילים בעתיד, צפוי, בשנים הבאות, מסמנות גורם עתידי."},{"s":"קריין","x":"ולסיום, מתי ענף אטרקטיבי? כשאפשר להרוויח בו לאורך זמן."},{"s":"קריין","x":"רווחיות יציבה, צמיחה גבוהה, חסמי כניסה גבוהים, וכוח מיקוח נמוך של לקוחות וספקים."},{"s":"קריין","x":"גם מותגים חזקים הופכים ענף לאטרקטיבי. הם מונעים שחיקת מחירים, מאפשרים מחיר פרמיה ויוצרים חסם כניסה."},{"s":"קריין","x":"בואו נסכם. פֶּסְטֶל זה מאקרו, העולם שמסביב. חמשת הכוחות זה מיקרו, הזירה של הענף."},{"s":"קריין","x":"בחמשת הכוחות, כוח חזק זה רווח חלש. אבל חסם כניסה גבוה זה רווח גבוה."},{"s":"קריין","x":"ענף אחר שעושה אותו דבר זה תחליף. ענף אחר שצריך יחד זה משלים."},{"s":"קריין","x":"כחול זה שוק חדש וריק. אדום זה שוק צפוף ומדמם."},{"s":"קריין","x":"עכשיו שתי שאלות. עצרו רגע וחשבו. חברה רוצה להעריך עד כמה הענף אטרקטיבי ומה עוצמת התחרות בו. איזה מודל תבחר?"},{"s":"קריין","x":"התשובה, חמשת הכוחות של פּוֹרְטֶר. הוא בודק את עוצמת התחרות בענף, וממנה את פוטנציאל הרווחיות."},{"s":"קריין","x":"שאלה שנייה. עצרו רגע וחשבו. נכון או לא נכון: ככל שיש בענף יתרון לגודל, הרווחיות בו נמוכה יותר."},{"s":"קריין","x":"לא נכון. יתרון לגודל הוא חסם כניסה. הוא מרחיק מתחרים חדשים, ולכן הרווחיות של הקיימים גבוהה יותר."},{"s":"קריין","x":"זהו להיום. בפרק הבא נסתכל פנימה, אל תוך החברה. בהצלחה."}]},"s3":{"title":"פרק שלוש: ניתוח פנימי, שרשרת הערך, משאבים, יכולות וסְווֹט","lines":[{"s":"קריין","x":"שלום לכם. בפרק הקודם הסתכלנו החוצה, ועכשיו נסתכל פנימה, אל תוך החברה."},{"s":"קריין","x":"נלמד את שרשרת הערך, משאבים ויכולות, יתרון תחרותי, ובסוף נחבר פנים וחוץ במודל סְווֹט. כל אלה מופיעים הרבה במבחן."},{"s":"קריין","x":"נתחיל בשרשרת הערך של מַייקְל פּוֹרְטֶר. זה מודל פנימי, שמפרק את החברה לפעילויות."},{"s":"קריין","x":"הוא בודק איך כל פעילות יוצרת ערך ללקוח, איפה אפשר לחסוך, ואיפה יש מקור ליתרון תחרותי."},{"s":"קריין","x":"הפעילויות מתחלקות לשתי קבוצות. פעילויות ראשוניות קשורות ישירות ליצירת המוצר ולמסירתו ללקוח."},{"s":"קריין","x":"פעילויות תומכות לא נוגעות במוצר עצמו, אלא עוזרות לפעילויות הראשוניות לעבוד טוב יותר."},{"s":"קריין","x":"יש חמש פעילויות ראשוניות. הראשונה, לוגיסטיקה נכנסת. קבלת חומרי גלם, אחסון וניהול מלאי, כמו המחסנים של אִיקֵאָה."},{"s":"קריין","x":"השנייה, תפעול. כלומר הייצור או ביצוע השירות, כמו פס הייצור של טֶסְלָה."},{"s":"קריין","x":"השלישית, לוגיסטיקה יוצאת. הפצה ושילוח ללקוח, כמו המשלוחים של אֲמָזוֹן בתוך יום."},{"s":"קריין","x":"הרביעית, שיווק ומכירות. פרסום, מיתוג ומכירה, כמו הקמפיין של נַייקִי."},{"s":"קריין","x":"החמישית, שירות לאחר מכירה. תמיכה, תיקונים ואחריות, כמו שירות האחריות של אֶפֶּל."},{"s":"קריין","x":"יש ארבע פעילויות תומכות. תשתיות הארגון, כלומר הנהלה, כספים, משפטים ותכנון אסטרטגי."},{"s":"קריין","x":"ניהול משאבי אנוש, כלומר גיוס, הכשרה ופיתוח עובדים, כמו הכשרת העובדים במֶקְדוֹנַלְדְס."},{"s":"קריין","x":"פיתוח טכנולוגי, כלומר מחקר ופיתוח וחדשנות, כמו המחקר והפיתוח של סַמְסוּנְג."},{"s":"קריין","x":"ורכש, כלומר קניית חומרי גלם וחוזים עם ספקים, כמו ניהול הספקים של קוֹקָה קוֹלָה."},{"s":"קריין","x":"איך מסווגים במבחן? שאלו אם הפעילות נוגעת במוצר בדרכו ללקוח. מגיע, מיוצר, נשלח, נמכר, מתוקן. אם כן, היא ראשונית."},{"s":"קריין","x":"ואת התומכות זכרו במילה אחת, תַּמְפַּר. תשתיות, משאבי אנוש, פיתוח טכנולוגי, רכש. כל השאר ראשוניות."},{"s":"קריין","x":"דוגמה מטֶסְלָה. ייצור המכוניות במפעל זה תפעול. מכירה בחנויות זה שיווק ומכירות. תיקונים במרכזי השירות זה שירות. כולן ראשוניות."},{"s":"קריין","x":"גיוס והכשרה של מהנדסים זה משאבי אנוש, תומכת."},{"s":"קריין","x":"ופיתוח מערכת נהיגה אוטונומית זה פיתוח טכנולוגי, גם כן תומכת."},{"s":"קריין","x":"המלכודת הראשונה: לחתום חוזה ולקנות מספק זה רכש, תומכת. לקבל את הסחורה ולאחסן אותה זו לוגיסטיקה נכנסת, ראשונית."},{"s":"קריין","x":"המלכודת השנייה: הכשרת עובדי שירות היא משאבי אנוש, תומכת. התיקון עצמו ללקוח הוא שירות לאחר מכירה, ראשונית."},{"s":"קריין","x":"המלכודת השלישית: מחקר ופיתוח הוא תמיד תומכת, גם בחברת טכנולוגיה שבה הוא הכי חשוב."},{"s":"קריין","x":"ובקצרה, חסרונות המודל: הוא מורכב, פותח לעידן התעשייתי, מתעלם מהסביבה, וקשה למדוד בו ערך לא מוחשי כמו מותג."},{"s":"קריין","x":"נעבור לגישת המשאבים, אָר בִּי וִי. היא אומרת שהיתרון התחרותי בא בעיקר מבפנים, ממשאבים ויכולות שקשה להעתיק."},{"s":"קריין","x":"זה ההפך מחמשת הכוחות, שמחפש את הרווח במבנה הענף. את הגישה פיתחו וֶרְנֶרְפֶלְט ובָּארְנִי."},{"s":"קריין","x":"משאבים מוחשיים הם פיזיים או כספיים, וקל למדוד אותם. מפעלים, ציוד, כסף ומערכות מחשוב."},{"s":"קריין","x":"משאבים בלתי מוחשיים קשה לכמת, אבל הם נותנים יתרון גדול. מותג, מוניטין, פטנטים, ידע וקשרים עסקיים."},{"s":"קריין","x":"ומעליהם יש יכולות ארגוניות, כלומר היכולת לשלב משאבים ליתרון. כמו החדשנות של אֶפֶּל, או המצוינות התפעולית של טוֹיוֹטָה."},{"s":"קריין","x":"איזה משאב באמת נותן יתרון? בודקים במודל וְרִיוֹ של בָּארְנִי, ארבע שאלות."},{"s":"קריין","x":"ערך, האם הוא יוצר ערך. ונדירות, האם הוא נדיר אצל המתחרים."},{"s":"קריין","x":"חיקוי, האם קשה להעתיק אותו. וארגון, האם החברה בנויה לנצל אותו."},{"s":"קריין","x":"רק משאב שעונה כן על כל הארבע נותן יתרון תחרותי בר קיימא. למשל אלגוריתם ההמלצות של נֶטְפְלִיקְס, שנבנה שנים."},{"s":"קריין","x":"המלכודת: אָר בִּי וִי זה פנים. חמשת הכוחות ופֶּסְטֶל זה חוץ."},{"s":"קריין","x":"ופטנט, מותג וידע הם משאבים בלתי מוחשיים, גם אם הם שווים הרבה כסף."},{"s":"קריין","x":"עכשיו יכולת ליבה, מושג של פְּרָהָלָאד והָאמֶל. זה שילוב של מיומנויות, טכנולוגיות ותהליכים שהחברה מצטיינת בו."},{"s":"קריין","x":"זה לא נכס בודד אלא צירוף. אפשר לחשוב עליו כעל הדִּי אֶן אֵי העסקי של החברה."},{"s":"קריין","x":"יש שלושה קריטריונים. הראשון, ערך מוסף ללקוח, כמו חוויית המשתמש החלקה של אֶפֶּל."},{"s":"קריין","x":"השני, ייחודיות וקושי לחיקוי. השלישי, ניצול בכמה תחומים ושווקים."},{"s":"קריין","x":"למשל העיבוד הגרפי של אֶנְוִידְיָה, שמשמש למשחקים, לבינה מלאכותית ולרכב אוטונומי."},{"s":"קריין","x":"ומה ההבדל בין יכולת ליבה ליכולת ייחודית? יכולת ליבה היא משהו שהחברה טובה בו, אבל גם מתחרים יכולים לפתח."},{"s":"קריין","x":"יכולת ייחודית היא בלעדית או נדירה מאוד, כמעט בלתי אפשרי להעתיק אותה, והיא נותנת מובילות בשוק לאורך זמן."},{"s":"קריין","x":"דוגמאות לייחודית: הנוסחה הסודית של קוֹקָה קוֹלָה, האופנה המהירה של זָארָה, והמנוע של דַּייסוֹן."},{"s":"קריין","x":"חברות הופכות ליבה לייחודית בעזרת מחקר ופיתוח ופטנטים, חיזוק המותג, ושליטה בשרשרת האספקה."},{"s":"קריין","x":"סיפור. כמה רשתות סופרמרקטים יודעות לנהל מלאי ביעילות. זו יכולת ליבה, הן טובות בזה, אבל גם אחרות."},{"s":"קריין","x":"לחברת בְּרוּלָאבּ יש נוסחה סודית ומוגנת בפטנט, שאף מתחרה לא הצליח לשחזר."},{"s":"קריין","x":"והיא מובילה את השוק כבר חמש עשרה שנה. זו יכולת ייחודית."},{"s":"קריין","x":"המלכודת: בלעדי, סודי, אף מתחרה לא הצליח, אלה מילים של יכולת ייחודית."},{"s":"קריין","x":"וזכרו, קֵיי אֵס אֵף הוא דרישה של הענף, לא יכולת של חברה."},{"s":"קריין","x":"עכשיו יתרון תחרותי. הוא קיים כשתוצאות החברה טובות לאורך זמן מעל הממוצע בענף שלה."},{"s":"קריין","x":"והוא נמדד רק מול חברות באותו ענף. תפוחים מול תפוחים, לא מול לימונים."},{"s":"קריין","x":"יתרון בעלות פירושו אותן תכונות כמו המתחרים, אבל בעלות נמוכה יותר. יתרון בבידול פירושו תכונות טובות יותר."},{"s":"קריין","x":"ויש גם מיקוד, כלומר התמקדות בנישה או בפלח מסוים."},{"s":"קריין","x":"מה מקשה על העתקה? פטנטים, ידע ארגוני, קשרים ארוכי טווח ותרבות ארגונית ייחודית."},{"s":"קריין","x":"המלכודת: יתרון תחרותי לא נמדד מול כל החברות במשק. ומשאב שכל המתחרים יכולים לקנות לא נותן יתרון בר קיימא."},{"s":"קריין","x":"ועכשיו המודל שמחבר הכול, סְווֹט. ההבחנה הכי חשובה: מה בשליטה שלי, ומה מחוץ למגרש שלי."},{"s":"קריין","x":"חוזקות וחולשות הן פנימיות, בשליטת החברה. למשל מותג חזק וצוות מנוסה, או עלויות גבוהות ומעט הון."},{"s":"קריין","x":"הזדמנויות ואיומים הם
