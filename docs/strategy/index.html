<style>
/* Silas Academy. Modern study product: ink-blue structure, one highlighter-yellow signal (the marked answer), soft elevated cards on a cool paper ground. Display: Rubik. Text: IBM Plex Sans Hebrew. Numbers: Plex Mono. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#eceff7; --ink:#0f1430; --muted:#5d6482; --line:#e1e5f0;
  --accent:#2337b4; --accent-ink:#ffffff; --accent-soft:#e8ebfc; --gold:#8a6a00; --gold-soft:#fdf3c8;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#0c1234; --deep-2:#1a2580;
  --good:#16794a; --good-soft:#e1f3e9; --bad:#c0352b; --bad-soft:#fde6e3;
  --shadow:0 1px 2px rgb(15 20 48/.06),0 8px 24px rgb(15 20 48/.06);
  --display:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  --body:"IBM Plex Sans Hebrew", "Rubik", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h3,h4{font-family:var(--body);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:2.1rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0}
b,strong{font-weight:700}
a{color:var(--accent);text-underline-offset:3px}
bdi{unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.note{color:var(--muted);font-size:.9rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;flex:none}
.brand .names{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.75rem;line-height:1.05}
.brand .sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.brand .cd{margin-inline-start:auto;font-size:.8rem;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:3px 12px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:.98rem}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:700;border-color:var(--gold)}

/* layout */
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
header.page{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
header.page p{color:var(--muted);max-width:62ch}
.sec-title{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.crumbs{display:flex;gap:8px;font-size:.9rem;color:var(--muted)}
.crumbs a{text-decoration:none;font-weight:600}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.field input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;font-size:1rem}
input[type="number"],input[type="date"]{font-family:var(--mono)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);padding:10px 14px;border-radius:10px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:400}
details.more[open] summary::after{content:"−"}
details.more[open]{padding-bottom:18px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center}

/* onboarding */
.welcome{background:linear-gradient(160deg,#0f6476,#082a33);color:#fff;border-radius:20px;padding:clamp(22px,5vw,40px);display:flex;flex-direction:column;gap:14px}
.welcome .eyebrow{color:rgba(255,255,255,.75)}
.welcome h2{font-size:clamp(2rem,6vw,2.7rem)}
.welcome p{max-width:52ch;color:rgba(255,255,255,.88)}
.wl-top{display:flex;align-items:center;gap:10px}.wl-logo{width:34px;height:34px}
.wl-feats{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wl-feats li{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wl-feats b{color:#f0cd87;font-size:1.02rem}.wl-feats span{color:rgba(255,255,255,.85);font-size:.92rem;line-height:1.6}
.wl-facts{display:flex;flex-wrap:wrap;gap:8px}.wl-facts span{font-size:.85rem;padding:4px 12px;border-radius:999px;background:rgba(240,205,135,.16);color:#f6dfae}
.wl-level{border:0;padding:0;margin:0;flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.wl-level legend{color:rgba(255,255,255,.85);font-size:.9rem;margin-bottom:6px;padding:0}
.wl-level label{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;cursor:pointer}
.wl-level label:has(input:checked){border-color:#f0cd87;background:rgba(240,205,135,.14)}
.wl-level input{accent-color:#c8963f;margin-top:5px}.wl-level span{display:flex;flex-direction:column;font-size:.86rem;color:rgba(255,255,255,.8)}.wl-level span b{color:#fff;font-size:.98rem}
.wl-note{font-size:.82rem;color:rgba(255,255,255,.65)!important;margin:0}
.onb{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.onb .field{color:rgba(255,255,255,.85);flex:1 1 180px}
.onb input{background:#fff;color:#0f2a33;border:0}
.onb .btn{background:#c8963f;border-color:#c8963f;color:#1d1406;padding:10px 26px}

/* home */
.hello h2{font-size:clamp(2rem,6vw,2.6rem)}
.hello p{color:var(--muted);margin-top:4px}
.today{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.today h3{font-size:1.45rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .acts{display:flex;gap:6px;flex-wrap:wrap}
.today .todo{font-weight:500}
.today .book{color:var(--muted);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.45rem;font-weight:500}
.stats span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:12px 16px}
ol.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
ol.plan li{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
ol.plan li:first-child{border-top:0}
ol.plan .pd{color:var(--muted);font-size:.85rem}
ol.plan .pdate{color:var(--muted);font-size:.82rem;white-space:nowrap}
ol.plan .ok{color:var(--good);font-weight:700}
ol.plan li.now{background:var(--gold-soft)}
ol.plan li.now .pt{font-weight:700}
ol.plan li.done .pt{color:var(--muted)}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.mastery .eyebrow{margin-top:10px}
@media (max-width:640px){.mastery{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 3rem;gap:10px;align-items:center;padding:6px 0;background:none;border:0;width:100%;text-align:start}
.mrow.static{cursor:default}
.mname{font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.lo{background:var(--bad)} .bar i.mid{background:var(--gold)}
.mpct{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:left}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:480px){.settings{grid-template-columns:1fr}}
.booklist{display:flex;flex-direction:column;margin-top:8px}
.bookrow{display:grid;grid-template-columns:1.6fr .6fr .6fr 1fr;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.bk-t{display:flex;flex-direction:column}
@media (max-width:640px){.bookrow{grid-template-columns:1fr 1fr}.bk-t,.bk-w{grid-column:1/-1}}

/* learn */
.vrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:start;scroll-snap-align:start}
.vcard:hover{border-color:var(--accent)}
.vcard .vt{font-weight:600;padding:0 4px 4px;font-size:.95rem}
.vcard .vdur{padding:0 4px 4px;margin-top:-6px;font-size:.8rem;direction:rtl}
.vthumb{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--bg);aspect-ratio:16/9}
.vthumb svg{width:100%;height:100%;display:block;opacity:.7}
.vplayico{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.05rem;padding-inline-start:3px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ch-h{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--sunk);font-size:.88rem;font-weight:700}
.lrow{display:grid;grid-template-columns:12px 1fr 1.4rem 3rem;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;text-align:start;font-size:1rem}
.ch-h + .lrow{border-top:0}
.lrow:hover .lt{color:var(--accent)}
.lrow .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.lrow .dot.on{background:var(--good);border-color:var(--good)}
.lrow .vid{color:var(--gold);font-size:.8rem}
.lrow .lp{font-size:.82rem;color:var(--muted);text-align:left}
.glsearch{max-width:280px;margin-bottom:12px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px}
.gloss div{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}

/* lesson */
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px}
article.lesson h2{font-size:clamp(2rem,6vw,2.6rem)}
article.lesson > h4{font-size:1.15rem;margin-top:14px}
article.lesson p,article.lesson li{max-width:66ch}
article.lesson ul,article.lesson ol{margin:0;padding-inline-start:22px}
article.lesson li{margin:4px 0}
.zero{background:var(--accent-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.zero .why{font-size:1.06rem;font-weight:500}
.zcols{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.zcols h4{margin-bottom:6px;font-size:.95rem;color:var(--accent)}
.zero dl{margin:0;display:flex;flex-direction:column;gap:2px}
.zero dt{font-weight:700}
.zero dd{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.zero ol{margin:0;padding-inline-start:20px}
@media (max-width:640px){.zcols{grid-template-columns:1fr}}
.fx{font-family:var(--mono);font-size:.92rem;background:var(--sunk);border-inline-start:3px solid var(--gold);padding:10px 14px;border-radius:6px;direction:ltr;text-align:left;overflow-x:auto;line-height:1.85;unicode-bidi:isolate}
span.fx{display:inline;padding:2px 6px;border:0;line-height:1.6}
.ex,.plain,.trap{border-radius:12px;padding:14px 18px;line-height:1.85}
.ex{background:var(--sunk)}
.plain{background:var(--gold-soft)}
.trap{background:var(--bad-soft)}
.trap ul{margin:6px 0 0}
.tbl-wrap{overflow-x:auto;background:linear-gradient(to left,var(--surface) 30%,transparent),linear-gradient(to left,transparent,var(--surface) 70%) 100% 0,radial-gradient(farthest-side at 0 50%,rgb(0 0 0/.14),transparent),radial-gradient(farthest-side at 100% 50%,rgb(0 0 0/.14),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
table.mini{border-collapse:collapse;font-size:.92rem}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.mini td{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
table.mini th{background:var(--sunk);font-weight:600}
.endrow{margin-top:10px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* questions */
.qcard{scroll-margin-top:calc(var(--hdr,150px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead .btn{margin-inline-start:auto}
.qcard>*,.review>*,.qtext{min-width:0;max-width:100%}.tbl-wrap{max-width:100%}
.qtext{font-size:1.1rem;font-weight:500;line-height:1.8}
.qn{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;line-height:1.6}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);min-width:1.1em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}

.btn{transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .15s,border-color .15s,color .15s}
.btn:hover:not([disabled]){transform:translateY(-1px)}
.btn:active:not([disabled]){transform:translateY(0) scale(.98)}
.btn.primary:hover{box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{padding:14px 18px;font-size:1.06rem}
/* entry */
.auth-value{margin:0;font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px;line-height:1.55}
.auth h2{margin-top:4px}
.auth .hint{color:var(--muted);font-weight:400;font-size:.82rem}
.auth-pitch{display:flex;flex-direction:column;gap:12px}
.stage .lead{font-size:1.08rem;line-height:1.75;color:rgb(255 255 255/.9);max-width:34ch;margin:0}
.authf .field{gap:6px}
@media (max-width:760px){.authwrap .stage{gap:16px}.stage .lead{font-size:1rem}}
/* course card */
.course.open{cursor:pointer;transition:transform .2s var(--ease),box-shadow .25s var(--ease)}
.course.open:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.course.open:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
.course.open:hover .cover svg path:first-of-type{stroke:#b9c3ff}
.myprog{display:flex;flex-direction:column;gap:7px;background:var(--sunk);border-radius:12px;padding:11px 13px}
.myprog b{font-family:var(--display);font-weight:600;font-size:.88rem}.myprog .cnt{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar2{height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 80%,transparent);overflow:hidden}
.pbar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--hl)));transition:width .5s var(--ease)}
/* practice */
.qprog{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.qprog b{font-family:var(--display);font-weight:600}
.qprog .note{font-size:.84rem}
.opts{gap:10px}
.opt{align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:54px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--ease),box-shadow .2s var(--ease);font-size:1.02rem}
.opt .k{display:grid;place-items:center;width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--sunk);color:var(--ink);font-family:var(--display);font-weight:700;font-size:.9rem;transition:background .15s,color .15s}
.opt:hover:not([disabled]){border-color:var(--accent);box-shadow:0 6px 18px -10px color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-1px)}
.opt:hover:not([disabled]) .k{background:var(--accent);color:var(--accent-ink)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good)}.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad)}.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]:not(.right):not(.wrong){opacity:.6}
/* explanation */
.expl{background:transparent;padding:0;display:flex;flex-direction:column;gap:12px;line-height:1.85}
.expl .vd{margin:0;background:var(--sunk);border-radius:14px;padding:12px 16px;font-size:1.02rem}
.whywrong{margin:0;border-radius:14px;padding:14px 16px;border-inline-start:4px solid var(--bad)}
.whywrong b:first-child{display:block;color:var(--bad);font-family:var(--display);margin-bottom:2px}
.sol{display:flex;flex-direction:column;gap:10px}
.sb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;flex-direction:column;gap:6px}
.sb h5{margin:0;font-family:var(--display);font-size:.8rem;font-weight:700;letter-spacing:.01em;display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.sb h5::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.sb p{margin:0}
.s-ask h5{color:var(--accent)}
.s-way{background:var(--sunk);border-color:transparent}.s-way h5{color:var(--ink)}
.s-way .sf{background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:.92rem;overflow-x:auto}
.s-right h5{color:var(--good)}
.s-right .sres{background:var(--good-soft);border-radius:10px;padding:8px 12px;font-weight:600}
.s-tip{background:var(--gold-soft);border-color:transparent}.s-tip h5{color:var(--gold)}
.ssteps{margin:2px 0 0;padding-inline-start:1.5em;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.ssteps li{padding-inline-start:4px}
.ssteps li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}
/* lessons: learning blocks */
article.lesson{background:transparent;border:0;box-shadow:none;padding:0;gap:16px}
article.lesson>h2{padding-inline:4px}
.lbody{display:flex;flex-direction:column;gap:14px}
.lsec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:10px}
.lsec h4{font-size:1.12rem;margin:0}
.lsec p{margin:0;line-height:1.9}
.lsec .fx{margin:4px 0}
.lcall{border-radius:var(--r);padding:16px clamp(16px,3vw,22px);line-height:1.9;display:block}
.lcall>.ltag{display:table;margin-bottom:8px}
.lcall>*{max-width:66ch}
.ltag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 11px;margin-bottom:2px}
.ltag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-short{background:var(--surface);color:var(--accent)}
.t-ex{background:var(--surface);color:var(--ink)}
.t-trap{background:var(--surface);color:var(--bad)}
.t-tip{background:var(--surface);color:var(--gold)}
.zero{border-radius:var(--r);padding:18px clamp(16px,3vw,24px)}
.lesson-nav{border-top:0;padding-top:4px}
.fx.fxd{display:flex;flex-direction:column;gap:6px;direction:ltr;text-align:left}
.fxr{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:4px 10px;overflow-x:auto}
.fxlab{direction:rtl;font-family:var(--body);font-size:.84rem;color:var(--muted);order:2;white-space:nowrap}
.fxf{white-space:nowrap;order:1}
/* footer: quiet */
footer.site{border-top:1px solid var(--line);margin-top:28px}
footer.site div{justify-content:center;text-align:center;font-size:.76rem;padding:16px;gap:6px 14px}
/* mobile spacing */
@media (max-width:520px){
  .qprog,.lsec,.sb{border-radius:14px}
  .opt{padding:12px;font-size:1rem}
  .course .cbody{padding:16px}
  .ahero{padding:22px;border-radius:22px}
}
@media (prefers-reduced-motion:reduce){.btn,.opt,.course.open,.pbar2 i{transition:none}.btn:hover,.opt:hover,.course.open:hover{transform:none}}

/* QA round 2 */
bdi.mnw{white-space:nowrap}
.nobr{white-space:nowrap}.nobr>bdi.mlong{white-space:normal}
bdi.mlong{display:inline-block;max-width:100%;white-space:normal;text-align:left;vertical-align:bottom;overflow-wrap:anywhere}
.examgrid .panel{display:flex;flex-direction:column;gap:10px}.examgrid .panel .btn.primary{width:100%;justify-content:center;margin-top:auto}.examgrid .panel .btn.ghost{align-self:center}
.vrow{mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent);-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent);padding-inline-end:40px;margin-top:12px}
.vplayico{inset:auto;bottom:8px;inset-inline-start:8px;margin:0;width:34px;height:34px;font-size:.8rem;box-shadow:0 4px 12px rgb(0 0 0/.2)}

nav.tabs{mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);padding-inline-end:24px}
@media (min-width:640px){nav.tabs{mask-image:none;-webkit-mask-image:none}}
.vplayer{border-radius:var(--r);box-shadow:var(--shadow);border:0}
@media (max-width:520px){.vplayer{margin-inline:0;border-radius:18px}}
@media (max-width:520px){table.mini th,table.mini td{padding:5px 6px;font-size:.8rem}}
:root{--btn:#2337b4;--btn-ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--btn:#4256e6;--btn-ink:#ffffff}}
:root[data-theme="dark"]{--btn:#4256e6;--btn-ink:#ffffff}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.vbig{background:var(--btn);color:var(--btn-ink)}

/* password field, forgot link, toast */
.pw{position:relative;display:flex}.pw input{width:100%;padding-inline-end:46px}
.eye{position:absolute;inset-block:0;inset-inline-end:4px;margin:auto 0;width:38px;height:38px;border:0;background:none;border-radius:10px;color:var(--muted);cursor:pointer;display:grid;place-items:center}

.authwrap.single{grid-template-columns:1fr;max-width:460px}

/* admin */
.user{display:flex;align-items:center;gap:8px}
.adbtn{font:600 .85rem var(--display);border:1.5px solid var(--hl);background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:5px 12px;cursor:pointer}

.adchart{width:100%;height:auto;margin-top:10px;direction:ltr}
.adchart .grid{stroke:var(--line);stroke-dasharray:3 4}.adchart .base{stroke:var(--line)}
.adchart .ax{font:500 10px var(--mono);fill:var(--muted)}
.adchart .b-act{fill:color-mix(in srgb,var(--accent) 55%,transparent)}.adchart .b-su{fill:var(--hl)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.lg-act::before{background:color-mix(in srgb,var(--accent) 55%,transparent)}.lg-su::before{background:var(--hl)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 .86rem var(--display);cursor:pointer}
.chipbtn .cnt{font:600 .75rem var(--mono);background:var(--sunk);border-radius:999px;padding:1px 7px;margin-inline-start:4px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chipbtn[aria-pressed="true"] .cnt{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.adtools{gap:10px}
.dotst{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-inline-end:8px;vertical-align:1px}.dotst.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.minibar{display:inline-block;width:52px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;vertical-align:middle;margin-inline-end:4px}.minibar i{display:block;height:100%;background:var(--accent)}

/* date picker */
.dp{position:relative}
.dpwrap{position:relative;display:flex}.dpwrap input{width:100%;padding-inline-end:46px;text-align:right;font-family:var(--mono)}
.dpwrap input[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.dpbtn{position:absolute;inset-block:0;inset-inline-end:4px;margin:auto 0;width:38px;height:38px;border:0;background:none;border-radius:10px;color:var(--accent);cursor:pointer;display:grid;place-items:center}
.dpbtn:hover{background:var(--accent-soft)}.dpbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

/* blocked account + admin block controls */

/* ===== motion layer: hovers and small effects. Only on devices with a mouse, and never for people who asked for less motion ===== */
@media (prefers-reduced-motion:no-preference){
  /* screens slide in softly when you move between them (not the admin page, which refreshes itself every minute) */
  body.vchange:not([data-view="admin"]) #main > *{animation:rise .38s var(--ease) both}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(2){animation-delay:.04s}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(3){animation-delay:.08s}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(n+4){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* answers: the right one glows, a wrong one gives a small shake */
  .opt.right{animation:glow .7s var(--ease)}
  .opt.wrong.sel{animation:shake .38s ease}
  @keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
  @keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  /* progress bars fill instead of jumping */
  .bar i,.minibar i,.prog i,.pbar i{transition:width .7s var(--ease)}
  /* toast pops in */
  .toast{animation:pop .28s var(--ease)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  /* buttons lift, and the main one gets a light sweep across it */
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgb(15 20 48/.45)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.primary,.btn.wabtn{position:relative;overflow:hidden}
  .btn.primary::after,.btn.wabtn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgb(255 255 255/.28) 50%,transparent 65%);transform:translateX(120%);transition:transform .6s var(--ease);pointer-events:none}
  .btn.primary:hover::after,.btn.wabtn:hover::after{transform:translateX(-120%)}
  /* cards rise toward the pointer */
  .course,.vcard,.adlist li,.mslist li,.advisits li{transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .2s,background .15s}
  .course:hover,.vcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgb(15 20 48/.45);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
  .kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 12px 26px -16px rgb(15 20 48/.4)}
  .vcard:hover img,.vcard:hover svg{transform:scale(1.03)}.vcard img,.vcard svg{transition:transform .35s var(--ease)}
  /* answer options lean in */
  .opt:not(.right):not(.wrong):hover{border-color:var(--accent);transform:translateX(-3px);box-shadow:0 8px 20px -14px color-mix(in srgb,var(--accent) 70%,transparent)}
  /* lesson rows and lists */
  .mrow{transition:background .15s,transform .2s var(--ease)}.mrow:hover{transform:translateX(-3px)}
  .adlist li:hover,.mslist li:hover{transform:translateX(-3px)}
  /* the logo winks */
  .brand .logo{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
  .brandlink:hover .logo{transform:rotate(-8deg) scale(1.08)}
  /* tabs and links */
  nav.tabs button:not([aria-current="true"]):hover{background:var(--sunk);color:var(--ink)}
  .flink,.crumbs a,.cbar a{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .3s var(--ease)}
  .flink:hover,.crumbs a:hover,.cbar a:hover{background-size:100% 1.5px}
  .flink{text-decoration:none}
  /* the support button breathes a little when pointed at */
  .wafab:hover svg{animation:wiggle .5s ease}
  @keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}
  .washare{transition:transform .2s var(--ease)}.washare:hover{transform:scale(1.12)}
  table.adm tbody tr[data-uid]{transition:background .15s}
}

// One interface, two backends. Views only use: ready, user, mode, signup, login, logout, rename, remove,
// key, pullProgress, pushProgress, admin.users, admin.sessions.
const ACC = (() => {
  const LEGACY = 'fs-prep-v1', idOf = email => 'u' + [...norm(email)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36);
  function norm(e) { return String(e || '').trim().toLowerCase(); }
  const check = (name, email, pw, signup) => {
    if (signup && !String(name || '').trim()) throw new Error('צריך למלא שם.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(norm(email))) throw new Error('כתובת האימייל לא תקינה.');
    if (signup) { const nm = nameProblem(name); if (nm) throw new Error(nm); const pp = pwProblem(pw, email); if (pp) throw new Error(pp); }
    else if (!String(pw || '')) throw new Error('צריך למלא סיסמה.');
  };
  // a password nobody guesses quickly: 8+ characters, a letter and a digit, not a famous one, not the email itself
  const COMMON = ['12345678', '123456789', '1234567890', '87654321', '11111111', '00000000', '12341234', '11223344', 'password', 'password1', 'password123', 'qwerty12', 'qwerty123', 'qwertyui', 'abc12345', 'abcd1234', 'a1234567', 'aa123456', '1q2w3e4r', '1qaz2wsx', 'asdf1234', 'zxcvbnm1', 'iloveyou', 'iloveyou1', 'admin123', 'admin1234', 'welcome1', 'shalom123', 'israel123'];
  function pwProblem(pw, email) {
    pw = String(pw || ''); const low = pw.toLowerCase(), user = norm(email).split('@')[0];
    if (pw.length < 8) return 'הסיסמה צריכה להיות באורך 8 תווים לפחות.';
    if (!/[A-Za-z\u05D0-\u05EA]/.test(pw) || !/\d/.test(pw)) return 'הסיסמה צריכה לכלול לפחות אות אחת ומספר אחד.';
    if (COMMON.includes(low) || /^(.)\1+$/.test(pw) || /^(0123456789|1234567890)/.test(pw)) return 'זו סיסמה נפוצה שקל לנחש. בחרו סיסמה אחרת.';
    if (user.length >= 4 && low.includes(user)) return 'הסיסמה לא יכולה לכלול את האימייל שלכם.';
    return '';
  }
  function nameProblem(name) {
    const n = String(name || '').trim();
    if (!n) return 'צריך למלא שם.';
    if (n.length > 30) return 'השם ארוך מדי (עד 30 תווים).';
    if (/https?:|www\.|[<>@]|\S\.(com|net|org|io|co|il|ru|xyz|info|me|ly)\b/i.test(n)) return 'בשם אפשר לכתוב רק שם, בלי קישורים או כתובות.';
    return '';
  }
  // after 5 wrong passwords in this browser: a short pause that doubles each time (the server has its own limits too)
  const LOCK = 'silas_lock';
  const lockGet = () => { try { return JSON.parse(localStorage.getItem(LOCK)) || {n: 0, until: 0}; } catch (e) { return {n: 0, until: 0}; } };
  const lockLeft = () => Math.max(0, Math.ceil((lockGet().until - Date.now()) / 1000));
  const lockFail = () => { const l = lockGet(); l.n++; if (l.n >= 5) l.until = Date.now() + 30000 * 2 ** Math.min(5, l.n - 5); try { localStorage.setItem(LOCK, JSON.stringify(l)); } catch (e) {} };
  const lockOk = () => { try { localStorage.removeItem(LOCK); } catch (e) {} };
  const lockCheck = () => { const t = lockLeft(); if (t) throw new Error(`יותר מדי ניסיונות כניסה. נסו שוב בעוד ${t > 90 ? Math.ceil(t / 60) + ' דקות' : t + ' שניות'}.`); };

  // ----- local backend: accounts on this device -----
  const K = 'silas-accounts-v1';
  let db = {users: {}, current: null};
  try { const s = JSON.parse(localStorage.getItem(K)); if (s && s.users) db = s; } catch (e) {}
  const store = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch (e) {} };
  async function hash(pw, salt) {
    const txt = salt + ':' + pw;
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 5381; for (const c of txt) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); }
  }
  const local = {
    async ready() {},
    user: () => db.current && db.users[db.current] ? {id: db.current, name: db.users[db.current].name, email: db.users[db.current].email, isAdmin: false} : null,
    async signup(name, email, pw) {
      check(name, email, pw, true); email = norm(email);
      const id = idOf(email); if (db.users[id]) throw new Error('כבר יש חשבון עם האימייל הזה. אפשר להתחבר.');
      const salt = Math.random().toString(36).slice(2, 10);
      db.users[id] = {name: name.trim(), email, salt, pw: await hash(pw, salt), created: Date.now()};
      // the first account on a device inherits progress saved before accounts existed
      try { const old = localStorage.getItem(LEGACY); if (old && Object.keys(db.users).length === 1) { const s = JSON.parse(old); s.started = !!s.name; localStorage.setItem(`silas:${id}:stats-finance`, JSON.stringify(s)); } } catch (e) {}
      db.current = id; store();
    },
    async login(email, pw) {
      lockCheck(); const id = idOf(email), u = db.users[id];

    async logout() { db.current = null; store(); },
    async rename(name) { const u = db.users[db.current]; if (u && name.trim()) { u.name = name.trim(); store(); } },

    async updatePassword(pw) { const u = db.users[db.current]; if (!u) return; { const pp = pwProblem(pw, u.email); if (pp) throw new Error(pp); } u.salt = Math.random().toString(36).slice(2, 10); u.pw = await hash(pw, u.salt); store(); },

    if (/weak|password should|at least \d+ char/i.test(m)) return 'הסיסמה חלשה מדי: לפחות 8 תווים, עם אות ומספר.';
    if (/fetch|network|Failed/i.test(m)) return 'אין חיבור לשרת. בדקו את האינטרנט ונסו שוב.';
    return 'משהו השתבש: ' + m;
  };
  async function loadMe(user) {
    if (!user) { me = null; return; }
    let {data, error} = await sb.from('profiles').select('name,email,is_admin,blocked,block_message').eq('id', user.id).maybeSingle();
    if (error) ({data} = await sb.from('profiles').select('name,email,is_admin').eq('id', user.id).maybeSingle()); // before supabase-block.sql ran
    me = {id: user.id, name: (data && data.name) || (user.user_metadata && user.user_metadata.name) || user.email.split('@')[0], email: user.email, isAdmin: !!(data && data.is_admin), blocked: !!(data && data.blocked), blockMessage: (data && data.block_message) || ''};
  }
  const SID_KEY = 'silas_sid', GEO_KEY = 'silas_geo', VISITS = '_visits';
  // Visit notes (place, disconnect time) also go to the learner's own progress row "_visits", which the
  // basic setup already lets them write and the admin read, so they work even before supabase-live.sql runs.
  let vis = null; // {u, d: {s: {sessionId: {c, ci, f, lat, lng, e}}}}
  const loadVis = async () => {
    const uid = me && me.id; if (!uid) return null;
    if (vis && vis.u === uid) return vis;
    let d = {s: {}}; try { const {data} = await sb.from('progress').select('data').eq('user_id', uid).eq('course', VISITS).maybeSingle(); if (data && data.data && data.data.s) d = data.data; } catch (e) {}
    return (vis = {u: uid, d});
  };
  const noteVisit = (id, patch) => {
    if (!me || !id) return; const uid = me.id;
    const write = v => { if (!v || v.u !== uid) return; const s = v.d.s; s[id] = Object.assign(s[id] || {}, patch);
      Object.keys(s).sort((a, b) => b - a).slice(40).forEach(k => delete s[k]); // keep the latest 40 visits
      sb.from('progress').upsert({user_id: uid, course: VISITS, data: v.d, updated_at: new Date().toISOString()}).then(() => {}, () => {}); };
    if (vis && vis.u === uid) write(vis); else loadVis().then(write); // synchronous when loaded, so it still goes out while the page closes
  };
  const putGeo = (id, country, city, flag, lat, lng, acc) => {
    sb.rpc('set_session_geo', {p_session: id, p_country: country || '', p_city: city || '', p_flag: flag || ''}).then(() => {}, () => {});
    noteVisit(id, Object.assign({c: country || '', ci: city || '', f: flag || '', at: new Date().toISOString()}, lat != null ? {lat, lng, acc} : {}));
  };
  const endVisit = id => { if (!id) return; sb.rpc('end_session', {p_session: id}).then(() => {}, () => {}); noteVisit(id, {e: new Date().toISOString()}); };
  // where the visit comes from: the city of the internet connection right away,
  // then the exact city and neighborhood from the device once the learner allows location
  // the exact device point (the learner allowed it, and the sign-up screen says it is saved), named in Hebrew
  function devicePlace(id, done, fresh) {
    navigator.geolocation.getCurrentPosition(pos => {
      try { localStorage.setItem(GEO_KEY, 'ok'); } catch (e) {}
      const {latitude, longitude} = pos.coords;
      fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=he`).then(r => r.json()).then(g => {
        if (!g || !(g.city || g.locality)) return;
        const city = g.city || g.locality, place = g.locality && g.locality !== city ? `${city} · ${g.locality}` : city;
        const fl = g.countryCode && g.countryCode.length === 2 ? String.fromCodePoint(...[...g.countryCode.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '';
        if (done) done(); putGeo(id, g.countryName, place, fl, +latitude.toFixed(5), +longitude.toFixed(5), Math.round(pos.coords.accuracy || 0));
      }).catch(() => {});
    }, err => { try { if (err && err.code === 1) localStorage.setItem(GEO_KEY, 'no'); } catch (e) {} }, {enableHighAccuracy: true, timeout: 20000, maximumAge: fresh ? 0 : 60000});
  }
  // during a visit the device place is refreshed every 10 minutes while the page is on screen (only where location is allowed; never prompts)
  let geoAt = 0;
  const refreshPlace = id => {
    if (!id || document.hidden || !navigator.geolocation || !navigator.permissions || Date.now() - geoAt < 9.5 * 60000) return;
    geoAt = Date.now();
    navigator.permissions.query({name: 'geolocation'}).then(p => { if (p.state === 'granted') devicePlace(id, null, true); }, () => {});
  };
  function locate(id) {
    geoAt = Date.now();
    let flag = '', precise = false;
    fetch('https://ipwho.is/?fields=success,country,city,flag.emoji').then(r => r.json()).then(g => { if (g && g.success) { flag = (g.flag && g.flag.emoji) || ''; if (!precise) putGeo(id, g.country, g.city, flag); } }).catch(() => {});
    if (!navigator.geolocation) return;
    const ask = () => devicePlace(id, () => { precise = true; });
    // the browser asks once per learner; after that it's silent: used where allowed, never asked again after a "no"
    let asked = null; try { asked = localStorage.getItem(GEO_KEY); } catch (e) {}
    const decide = st => { if (st === 'granted' || (st === 'prompt' && !asked) || (!st && (!asked || asked === 'ok'))) { try { if (!asked) localStorage.setItem(GEO_KEY, 'asked'); } catch (e) {} ask(); } };
    if (navigator.permissions && navigator.permissions.query) navigator.permissions.query({name: 'geolocation'}).then(p => decide(p.state), () => decide(null)); else decide(null);
  }
  async function track() { // one session per visit; heartbeats add the visible, active time
    stopTrack(); if (!me) return;
    // a page refresh continues the same visit instead of logging a disconnect and a new entry
    let resumed = false;
    loadVis();
    try { const k = sessionStorage.getItem(SID_KEY), old = k && JSON.parse(k);
      if (old && old.u === me.id && Date.now() - old.t < 120000) {
        const {data, error} = await sb.rpc('resume_session', {p_session: old.s});
        // without resume_session (supabase-live.sql not run yet) the same session row simply keeps receiving heartbeats
        if (data === true || (error && /function|schema cache|not find/i.test(error.message || ''))) { sid = old.s; resumed = true; noteVisit(sid, {e: null}); }
      } } catch (e) {}
    if (!sid) try { const {data} = await sb.rpc('start_session', {p_device: navigator.userAgent}); sid = data; } catch (e) { sid = null; }

b>."},{"t":"h","x":"דרכים לבחירת אסטרטגיה: בירור דיאלקטי ויועץ השטן"},{"t":"p","x":"איך קבוצת מנהלים בוחרת בין אפשרויות? השקפים מציגים שלוש שיטות (לפי מחקר של Schweiger ושותפיו, 1986):"},{"t":"table","head":["שיטה","מה עושים","ממצאים","מתי מומלץ","מילים בסיפור"],"rows":[["<b>בירור דיאלקטי</b> (Dialectical Inquiry)","מעמתים בכוונה <b>שתי עמדות (תוכניות) מנוגדות</b> או יותר, ומהעימות יוצרים <b>סינתזה</b>","החלטות <b>באיכות הגבוהה ביותר</b>, חושף הנחות יסוד שגויות, מקדם חדשנות; אבל <b>דורש הכי הרבה זמן ואנרגיה</b>","החלטות קריטיות שדורשות פתרון חדשני","\"שני צוותים\", \"תוכנית נגדית\", \"תזה ואנטי-תזה\", \"שילבו את שתי התוכניות\""],["<b>יועץ השטן</b> (Devil's Advocacy)","ממנים אדם או קבוצה שתפקידם <b>לתקוף תוכנית קיימת</b>: לשאול שאלות קשות ולמצוא נקודות תורפה","טוב באיתור <b>חולשות ספציפיות</b>; פחות טוב ביצירת פתרונות חדשים; לפעמים יוצר עימות אישי","כשרוצים <b>לבחון הצעה קיימת</b>, לא לפתח חדשה","\"מונה לבקר\", \"תפקידו למצוא חורים\", \"לשאול שאלות קשות\""],["<b>קונצנזוס</b> (Consensus)","מגיעים ל<b>הסכמה רחבה</b> בלי עימות מובנה","<b>שביעות רצון גבוהה</b> של המשתתפים; אבל לפעמים החלטות פחות איכותיות כי נמנעים מוויכוח","כשצריך <b>תחושת אחדות</b> או כשהזמן קצר","\"כולם הסכימו\", \"בלי ויכוחים\", \"אחדות\""]]},{"t":"example","title":"דיאלקטי או יועץ השטן?","x":"בחברת תוכנה צוות א' הציע להתרחב לאסיה וצוות ב' הציע תוכנית הפוכה – להישאר בישראל. הוויכוח הוביל לתוכנית שלישית שמשלבת את שתיהן → <b>בירור דיאלקטי</b> (שתי תוכניות + סינתזה). אם הייתה רק תוכנית אחת ומישהו מונה לתקוף אותה → <b>יועץ השטן</b>."},{"t":"trap","x":"ההבדל המרכזי: בדיאלקטי יש <b>תוכנית נגדית</b> ושואפים ל<b>סינתזה</b>; ביועץ השטן יש <b>רק ביקורת</b> על תוכנית אחת, בלי להציע חלופה. ועוד: הדיאלקטי הוא <b>האיטי</b>, לא המהיר."},{"t":"h","x":"גבולות אופקיים"},{"t":"p","x":"<b>גבולות אופקיים</b> עוסקים בשאלה <b>עד כמה ולאן הארגון מרחיב את הפעילות שלו \"לרוחב\"</b>, ואיך מתחמים ומשלבים בין יחידות, שווקים ופעילויות. יש לזה ארבעה היבטים:"},{"t":"table","head":["היבט","מה זה","דוגמה"],"rows":[["<b>התרחבות אופקית</b> (Horizontal Expansion)","הרחבת הפעילות לתחומים חדשים <b>באותו שלב של שרשרת הערך</b> או לשווקים קרובים: רכישת מתחרים, כניסה לאזור גיאוגרפי חדש, מוצרים דומים ללקוחות קיימים","דיסני רוכשת את רוב נכסי פוקס המאה ה-21; פפסיקו רוכשת את סודהסטרים; אינטל רוכשת את מובילאיי"],["<b>גבולות אופקיים בארגון</b>","התיחום בין מחלקות, יחידות עסקיות (SBU) ופרויקטים בתוך הארגון – כדי לנהל אינטגרציה, שיתופי פעולה ו<b>למנוע כפילויות</b>","שתי יחידות שמפתחות בנפרד אותו מוצר"],["<b>מיזוגים ורכישות</b>","כשרוכשים מתחרה או נכנסים לשוק חדש, צריך לשלב בין גופים שונים","שילוב צוותים ומערכות אחרי רכישה"],["<b>תיאום משאבים</b>","הרחבה אופקית מחייבת תכנון מחדש של משאבים, תשתיות ותהליכי עבודה","איחוד מחסנים אחרי רכישת רשת מתחרה"]]},{"t":"p","x":"הבנת הגבולות האופקיים עוזרת להחליט על הרחבת תחומי פעילות ועל אינטגרציה בתוך המבנה הארגוני. היא מתחברת גם ל-SWOT (הזדמנויות ואיומים), לפורטר (השפעה על כוח המתחרים) ול-RBV (מינוף משאבים קיימים)."},{"t":"trap","x":"\"אופקי\" = <b>לרוחב</b>, באותו שלב של שרשרת הערך (עוד חנויות, עוד מתחרה שנרכש, עוד מדינה). אם יצרן פותח רשת חנויות משלו או רוכש ספק – זה מעבר <b>לשלב אחר</b> בשרשרת (אנכי), לא התרחבות אופקית."},{"t":"h","x":"5 משימות הניהול האסטרטגי"},{"t":"steps","title":"חמש המשימות, לפי הסדר","x":["<b>חזון, ערכים ופיתוח משימת הארגון</b> – לאן הולכים, מה מנחה אותנו, מה העסק שלנו","<b>הצבת יעדים ומטרות</b> – תרגום החזון ליעדים מדידים","<b>עיצוב (ניסוח) אסטרטגיה להשגת המטרות</b> – בחירת הדרך","<b>יישום וביצוע האסטרטגיה</b> – \"Make it Happen\"","<b>הערכת ביצועים ונקיטת צעדים מתקנים</b> – בודקים, משפרים ומתקנים, וחוזרים לכל שלב קודם לפי הצורך"]},{"t":"p","x":"מאפיינים: הצורך בחמש המשימות <b>קיים תמיד</b> (זה מעגל, לא תהליך חד-פעמי); <b>הגבולות בין המשימות מעורפלים</b>; האסטרטגיה לא מנותקת מהניהול השוטף. מי מבצע? מנהלים בכירים, מנהלי יחידות עסקיות, מנהלי תחומים, מנהלים תפעוליים – ו<b>כל חברי הארגון</b>."},{"t":"h","x":"משימה 1: חזון, מהות עסק וערכים"},{"t":"table","head":["רכיב","מה זה","שאלה שהוא עונה עליה","איך מזהים בסיפור"],"rows":[["<b>חזון</b> (Vision)","הצהרה על מה שהארגון <b>רוצה להיות או להפוך</b> בעתיד. המצפן ו\"מפת הדרכים\" של הארגון","<b>לאן אנחנו הולכים?</b> (תוכניות לעתיד)","\"שואפים להיות\", \"לחולל\", \"עולם שבו...\", \"להוביל את המעבר ל...\""],["<b>מהות העסק</b> (Business Definition) = משימה / ייעוד (Mission Statement)","תיאור <b>העסק הנוכחי</b>: המוצרים והשירותים של היום, <b>מנוסח במונחי תועלת ללקוח</b>. כולל מוצר, שוק, לקוח וטכנולוגיה, וגבולות הכיסוי הגיאוגרפי והתחרותי","<b>מה עושים? עבור מי? לאיזו מטרה?</b>","\"החברה מספקת X ל-Y, המאפשרים להם...\""],["<b>ערכים</b> (Values)","<b>עקרונות שמנחים התנהגות</b> של מנהלים ועובדים. בדרך כלל <b>4 עד 8 ערכי ליבה</b>. מסגרת חיצונית שעוטפת את החזון ואת מהות העסק","<b>מה מנחה אותנו?</b>","רשימת מילים: יושרה, מקצועיות, שירות אישי, ללא פשרות על איכות"]]},{"t":"example","title":"איקאה – חזון מול משימה","x":"חזון: \"ליצור חיים יומיומיים טובים יותר לאנשים רבים\" → עתיד ושאיפה. משימה: \"להציע מגוון רחב של רהיטים מעוצבים ופונקציונליים במחירים נמוכים כל כך שכמה שיותר אנשים יוכלו לקנות\" → מה עושים, עבור מי, במונחי תועלת ללקוח = <b>מהות העסק</b>."},{"t":"p","x":"<b>החזון</b> צריך להיות ריאלי אבל שאפתני. הוא לא מסמך שתולים על הקיר ושוכחים – חוזרים אליו כל תקופה. <b>חזון יכול להשתנות</b> כשהעולם משתנה (נטפליקס: מהשכרת DVD לסטרימינג ולהפקת תוכן). חברה שלא משתנה כש\"הגבינה זזה\" – מתרסקת."},{"t":"p","x":"<b>למי החזון מיועד?</b> בעיקר <b>פנימה – להנהלה ולעובדים</b>. לפי שקף \"חשיבות החזון\": הוא נותן <b>הכוונה לכל חברי הארגון</b>, <b>השראה ומוטיבציה לעובדים</b>, עוזר להנהלה לתכנן לטווח ארוך, עוזר <b>לגייס ולשמר עובדים</b>, ומשמש עוגן ביציבות בזמן משבר (וגם מבדל מהמתחרים). השאלה \"<b>עבור מי</b>\" (הלקוחות) שייכת ל<b>ייעוד</b>, לא לחזון."},{"t":"p","x":"<b>הצהרת המשימה אינה אסטרטגיה</b>: היא עוזרת למיקוד בתוך הפירמה, אבל היא <b>לא ייחודית</b> (כל חברת ביטוח \"מעניקה ביטחון פיננסי\") ו<b>לא גורמת ללקוחות לבחור</b> בפירמה. האסטרטגיה, לעומת זאת, נועדה לנצח מתחרים. ופורטר: מהות האסטרטגיה היא <b>לבחור מה לא לעשות</b> (Trade-off)."},{"t":"p","x":"<b>למה ערכים חשובים?</b> הם מעצבים תרבות ארגונית, משמשים מצפן להחלטות, בונים מוניטין ואמון לקוחות, עוזרים לגייס ולשמר עובדים, עוגן בהתמודדות עם אתגרים, ומעודדים חדשנות ושיפור."},{"t":"trap","x":"שלוש ההצהרות מתבלבלות כל הזמן. <b>עתיד/שאיפה</b> = חזון. <b>הווה, מה אנחנו מספקים ולמי, במונחי תועלת ללקוח</b> = מהות העסק. <b>עקרונות התנהגות</b> = ערכים. אם יש מספר + תאריך יעד = <b>יעד SMART</b>, לא חזון."},{"t":"h","x":"הגדרת לקוחות והגדרת מתחרים"},{"t":"p","x":"כשמגדירים את מהות העסק ואת האסטרטגיה העסקית, צריך לענות על שתי שאלות בסיס:"},{"t":"table","head":["רכיב","מה זה","שאלות לדוגמה"],"rows":[["<b>הגדרת לקוחות</b> (קהל יעד)","לזהות <b>עבור מי</b> אנחנו עובדים: אילו קבוצות לקוחות, אילו צרכים שלהם אנחנו פותרים, ובאיזה כיסוי גיאוגרפי","מי קונה מאיתנו? איזה צורך אנחנו ממלאים? באילו אזורים?"],["<b>הגדרת מתחרים</b> (ניתוח מתחרים)","לזהות <b>מול מי</b> אנחנו מתחרים בשוק – וזה גם קובע מול מי נמדד היתרון התחרותי (חברות באותו ענף). כולל החלטה על <b>תחרות מול שיתוף פעולה</b>","מי עוד מוכר לאותם לקוחות פתרון לאותו צורך? עם מי כדאי לשתף פעולה?"]]},{"t":"p","x":"בשקף \"אסט' עסקית מול אסט' שיווקית\" שני הרכיבים האלה מופיעים בתוך <b>האסטרטגיה העסקית</b>: \"קהל יעד – זהה את קהל היעד ללקוח\" ו\"ניתוח מתחרים – הגדר את המתחרים בשוק\", לצד חזון עסקי, מטרות עסקיות, שווקים לשיווק, מהלכים והחרגות שוק (אילו שווקים <b>לא</b> נכנסים אליהם)."},{"t":"example","title":"הגדרת לקוחות או מתחרים?","x":"רשת חדרי כושר מחליטה שהיא משרתת עובדי הייטק בגילאי 25–40 במרכז הארץ, שצריכים אימון קצר בהפסקת צהריים → <b>הגדרת לקוחות</b>. אותה רשת ממפה את כל חדרי הכושר והסטודיואים באזורי ההייטק → <b>הגדרת מתחרים</b>."},{"t":"h","x":"משימה 2: הצבת יעדים (מודל SMART)"},{"t":"p","x":"בשלב הזה הופכים את החזון והמשימה ל<b>משימות לביצוע</b>: מגדירים מדדים כמותיים/איכותיים, מתמקדים בתוצאות, מונעים ערפול, קובעים תכנית (חומש/שנתית/רבעונית) ואבני דרך."},{"t":"table","head":["","מטרה","יעד"],"rows":[["<b>כללי או ספציפי</b>","כללית","ספציפי"],["<b>רעיוני או מדיד</b>","רעיונית","ניתן למדידה"],["<b>את מי משרת</b>","משרתת את האסטרטגיה","משרת את המטרה"],["<b>דוגמה</b>","שיפור שביעות רצון הלקוחות","העלאת ציון NPS ל-85% תוך 6 חודשים"]]},{"t":"p","x":"<b>שני סוגי מטרות:</b> <b>מטרות אסטרטגיות</b> = שיפור <b>המעמד התחרותי</b> לאורך זמן (נתח שוק, מוניטין, חדשנות). <b>מטרות פיננסיות</b> = שיפור <b>הביצועים הכספיים</b> (הכנסות, רווח, הפחתת עלויות)."},{"t":"p","x":"<b>מודל SMART</b> בודק אם יעד כתוב נכון:"},{"t":"table","head":["אות","שם","מה זה אומר","שאלת בדיקה"],"rows":[["<b>S</b>","ספציפי (Specific)","ברור בדיוק מה רוצים להשיג","מה בדיוק?"],["<b>M</b>","מדיד (Measurable)","יש מספר או מדד שאפשר לעקוב אחריו","איך נדע שהצלחנו?"],["<b>A</b>","בר השגה (Achievable)","מאתגר אבל אפשרי","זה בכלל אפשרי עם המשאבים שלנו?"],["<b>R</b>","ריאלי / רלוונטי (Relevant)","היעד משרת מטרה רלוונטית ומתאים למטרות הרחבות","איך זה מקדם את המטרה שלנו?"],["<b>T</b>","תחום בזמן (Timely / Time-bound)","יש תאריך יעד","עד מתי?"]]},{"t":"example","title":"SMART או לא?","x":"\"לשפר את המכירות\" → <b>לא SMART</b>: לא ספציפי, לא מדיד, בלי זמן. \"להגדיל ב-20% את המכירות השנתיות ביחס לשנה שעברה, עד סוף השנה\" → <b>SMART</b>: ספציפי, מדיד (20%), ריאלי ורלוונטי לצמיחה, ותחום בזמן."},{"t":"trap","x":"משפט עם <b>מספר ותאריך</b> הוא יעד, לא חזון. וחזון בלי מספרים הוא לא \"יעד לפי SMART\". אם חסר רק \"עד מתי\" – הרכיב החסר הוא <b>T</b>; אם חסר מספר – <b>M</b>."},{"t":"h","x":"משימה 3: ניסוח אסטרטגי (Top-down / Bottom-up)"},{"t":"p","x":"בשלב העיצוב מחליטים, למשל: <b>מיקוד או גיוון</b> עסקים; שוק רחב או נתח שוק ספציפי; באילו מדינות; באילו חלקים של שרשרת הערך; קו מוצרים צר או רחב; <b>תחרות או שיתוף פעולה</b>; ועל מה יתבסס היתרון: <b>עלות נמוכה, איכות עדיפה או יכולות ארגוניות עדיפות</b>. וגם איך להגיב לשינויים בהעדפות לקוחות ובתנאי השוק."},{"t":"p","x":"יש שתי גישות עיקריות לשאלה <b>מי מנסח</b> את האסטרטגיה:"},{"t":"table","head":["","Top-down (מלמעלה למטה)","Bottom-up (מלמטה למעלה)"],"rows":[["<b>מי יוזם</b>","ההנהלה הבכירה מכתיבה ו\"מורידה\" לדרגים לביצוע","רעיונות והצעות עולים מהעובדים והמומחים בשטח אל ההנהלה"],["<b>מאפיינים</b>","תכנון מרכזי ואחיד; דגש על שליטה ובקרה","שיתוף ומעורבות גבוהה; תהליך דינמי שמתאים לשינויים"],["<b>יתרונות</b>","חזון ומיקוד ברורים; החלטות ויישום מהירים ועקביים; שליטה טובה במשאבים","גמישות והסתגלות; חדשנות ושיפור תהליכים; מוטיבציה ושביעות רצון של העובדים"],["<b>חסרונות</b>","סיכון לניתוק בין ההנהלה לשטח; פחות גמישות בזמן אמת","תכנון איטי בגלל ריבוי קולות; קשה לשמור על עקביות כלל-ארגונית"],["<b>דוגמאות מהשקפים</b>","Apple (טים קוק), Tesla (אילון מאסק), Samsung (מטה בדרום קוריאה)","Google (Gmail, Google News מיוזמות עובדים), 3M (15% מהזמן לפרויקטים אישיים → Post-it), LEGO Ideas"]]},{"t":"example","title":"איזו גישה?","x":"ברשת מלונות, עובדי הקבלה הציעו צ'ק-אין דיגיטלי, ההנהלה בחנה ואימצה את הרעיון לכל הרשת → <b>Bottom-up</b>. אם המנכ\"ל היה מחליט לבד ושולח הוראה לכל המלונות → <b>Top-down</b>."},{"t":"trap","x":"אל תהפכו את הכיוונים: Top = <b>ההנהלה</b> למעלה. ובמבחן מחליפים יתרונות: <b>גמישות וחדשנות</b> הם של Bottom-up; <b>שליטה, עקביות ומהירות החלטה</b> הם של Top-down."},{"t":"p","x":"<i>בקצרה מהשקפים:</i> אסטרטגיות משתנות בגלל תנאי שוק, מצבי משבר (מלחמות, מגיפות), שינויים פוליטיים ותחיקתיים ולמידה ארגונית. חלק מהאסטרטגיה המתוכננת לא מתממש, וחלק \"מתעורר\" תוך כדי (Emergent Strategy – אסטרטגיה מתעוררת)."},{"t":"h","x":"משימה 4: יישום וביצוע האסטרטגיה שנבחרה"},{"t":"p","x":"זה שלב ה-<b>Make it Happen</b>: להפוך את התוכנית למציאות. כולל <b>פיתוח יכולות, תקצוב, קביעת מדיניות, הגברת מוטיבציה, מבנה ארגוני, בניית תרבות ארגונית ומנהיגות</b>. (בהרחבה ביחידה 6.)"},{"t":"p","x":"איך מזהים בסיפור: האסטרטגיה <b>כבר נבחרה</b>, ועכשיו מקצים תקציב, משנים מבנה, מגייסים, מדריכים ומניעים עובדים."},{"t":"h","x":"משימה 5: הערכה, שיפור ותיקון"},{"t":"p","x":"<b>הערכת ביצועים ונקיטת צעדים מתקנים</b>: בודקים את התוצאות מול היעדים, ואם צריך – משפרים, משנים ומתאימים. מכאן אפשר לחזור לכל אחת מהמשימות הקודמות (גם לשנות חזון או יעדים)."},{"t":"p","x":"מה מחייב תיקון? שינויים בצרכי לקוחות ובהעדפות, דרישה להתאמה אישית, תחרות מתפתחת ויכולות מתחרים, התפתחויות חיצוניות והתקדמות טכנולוגית, הזדמנויות חדשות, למידה ארגונית, הנהלה חדשה ודינמיקה ארגונית."},{"t":"example","title":"איזו משימה?","x":"רשת מסעדות בדקה אחרי שנה שהמכירות נמוכות ב-12% מהיעד, גילתה שמתחרה חדש נכנס לאזור, והחליטה לשנות את התפריט ואת היעדים → <b>משימה 5: הערכת ביצועים ונקיטת צעדים מתקנים</b>. המילים: \"בדקה\", \"מהיעד\", \"שינתה\"."},{"t":"trap","x":"יישום ≠ הערכה. <b>יישום</b> = מבצעים (תקציב, מבנה, הדרכה). <b>הערכה</b> = מודדים ומשווים ליעד, ואז מתקנים. וניסוח ≠ יישום: <b>ניסוח</b> = בוחרים את הדרך; <b>יישום</b> = הולכים בה."},{"t":"exam","x":"בחלק א' יופיע סיפור על חברה ותתבקשו לזהות: רמת אסטרטגיה, שיטת בחירה (דיאלקטי/יועץ השטן/קונצנזוס), חזון/מהות עסק/ערכים/יעד SMART, Top-down/Bottom-up, או איזו מן המשימות החמש. חפשו את המילה המכריעה בסיפור. בחלק ב' – נימוק של שורה-שתיים: כתבו מה המושג באמת אומר ואיפה ההיגד מחליף מושג, כיוון או מטרה (למשל: \"לא נכון – החזון נועד בעיקר להנהלה ולעובדים, לתת כיוון והשראה; התועלת ללקוח היא חלק ממהות העסק\")."}],"mcq":[{"id":"s1-1","q":"חברת השבבים GreenByte החליטה לרכוש סטארט-אפ בתחום הרכב החכם תמורת 4 מיליארד דולר. ההחלטה התקבלה בדירקטוריון, היא דורשת הון עצום וקשה מאוד לבטל אותה. לפי ההבחנות שנלמדו, מדובר ב-","o":["החלטה אסטרטגית","החלטה טקטית","החלטה פונקציונלית של מחלקת השיווק","החלטה תפעולית יומיומית"],"a":0,"why":"הון עצום, דרג בכיר (דירקטוריון), טווח ארוך ומחיר טעות גבוה (\"קשה לבטל\") – אלה ארבעת הסימנים של החלטה אסטרטגית.","w":["","טקטית = מעט משאבים, טווח קצר וקל לתקן; כאן ההפך.","רכישת חברה אינה תכנית של מחלקה; היא החלטה של ההנהלה הבכירה.","\"4 מיליארד\" ו\"קשה לבטל\" הם ההפך מהחלטה יומיומית."]},{"id":"s1-2","q":"לפי השקפים, מהי המטרה של אסטרטגיה עסקית?","o":["לנהל את הביקוש למוצרי החברה ולהגדיל אותו","ליצור התאמה מרבית בין צרכי הלקוחות למוצרי החברה","ליצור יתרון תחרותי כדי להשיג תשואה מעל הממוצע","להעלות את שביעות רצון הלקוחות ואת נאמנותם"],"a":2,"why":"ההגדרה בשקפים: מטרת האסטרטגיה היא יצירת יתרון תחרותי כדי להשיג תשואה מעל הממוצע.","w":["ניהול הביקוש הוא הגדרת השיווק, לא האסטרטגיה.","בקורס שואלים מה טוב לפירמה, לא מה טוב ללקוח; התאמה לצרכי לקוח היא עניין שיווקי.","","שביעות רצון ונאמנות הם מדדי הצלחה של שיווק; אסטרטגיה נמדדת ביתרון תחרותי ורווחיות."]},{"id":"s1-3","q":"מלון SunTrip מלא בסופי שבוע וריק באמצע השבוע. מנהלת המלון מציעה מחירים מוזלים וקמפיין פרסום לימי חול, כדי להעביר אורחים מסוף השבוע לאמצעו. הפעולה הזאת היא בעיקר דוגמה ל-","o":["אסטרטגיה תאגידית","שיווק: ניהול (הסטה של) הביקוש","התרחבות אופקית","ניסוח אסטרטגי בגישת Bottom-up"],"a":1,"why":"השקף מגדיר שיווק כניהול הביקוש, וזה כולל גם הסטה של ביקוש ממועד אחד לאחר (בדיוק הדוגמה של מקומות לינה). מחיר וקמפיין הם כלים שיווקיים.","w":["תאגידית עוסקת בשאלה באילו שווקים לפעול ובהקצאת משאבים בין יחידות; כאן אין שינוי בתחומי הפעילות.","","התרחבות אופקית היא כניסה לתחומים או שווקים חדשים לרוחב; כאן לא נכנסים לשום שוק חדש.","אין כאן רעיון שעלה מהעובדים להנהלה; זו פעולה שיווקית של מנהלת."]},{"id":"s1-4","q":"רשת האופנה FashionUp החליטה להקים רשת מסעדות שף כדי לגוון את עסקיה, ולהעביר לשם חלק מהתקציב של יחידת ההנעלה שלה. באיזו רמת אסטרטגיה מדובר?","o":["אסטרטגיה עסקית (תחרותית)","אסטרטגיה פונקציונלית","אסטרטגיה שיווקית","אסטרטגיה תאגידית"],"a":3,"why":"כניסה לשוק לא קשור (גיוון) והעברת משאבים בין יחידות עסקיות הן החלטות מובהקות של רמת התאגיד – \"איפה נתחרה\".","w":["עסקית עוסקת באיך מנצחים בשוק מסוים; כאן מחליטים להיכנס לשוק חדש לגמרי.","פונקציונלית היא התכנית של מחלקה אחת; גיוון עסקים מחליטים ברמת התאגיד.","אין כאן פרסום, מיתוג או תמחור; זו החלטה על תחומי הפעילות.",""]},{"id":"s1-5","q":"BrewMax היא יחידה עסקית של תאגיד מזון גדול. היחידה מחליטה איך לנצח את המתחרים הישירים שלה בשוק הקפה הקר: להציע משקה עם אותן תכונות, אבל במחיר נמוך מכולם בזכות ייצור זול יותר. באיזו רמת אסטרטגיה מדובר?","o":["אסטרטגיה עסקית (תחרותית)","אסטרטגיה תאגידית","אסטרטגיה פונקציונלית","החלטה טקטית"],"a":0,"why":"\"יחידה עסקית\", \"לנצח מתחרים ישירים בשוק מסוים\" ויתרון בעלות – זו הרמה העסקית, שנקראת גם אסטרטגיה תחרותית.","w":["","התאגיד לא מחליט כאן על כניסה לשוק חדש או על הקצאת משאבים בין יחידות; היחידה מחליטה איך להתחרות בשוק שלה.","פונקציונלית היא תכנית של מחלקה (משא\"נ, IT); כאן נקבע איך היחידה כולה מתחרה.","בחירת בסיס היתרון התחרותי (עלות) היא החלטה ארוכת טווח, לא טקטית."]},{"id":"s1-6","q":"בחברת הענן CloudNest, ההנהלה קבעה כיוון של צמיחה מהירה בשוק האירופי. בעקבות זאת מחלקת משאבי האנוש בנתה תכנית עבודה לגיוס 40 מפתחים דוברי גרמנית במהלך השנה. תכנית מחלקת משאבי האנוש היא דוגמה ל-","o":["אסטרטגיה תאגידית","אסטרטגיה עסקית (תחרותית)","אסטרטגיה פונקציונלית","חזון"],"a":2,"why":"זו תכנית של מחלקה אחת שנועדה לבצע את הכיוון שנקבע למעלה – בדיוק ההגדרה של אסטרטגיה פונקציונלית.","w":["הכיוון (צמיחה באירופה) נקבע למעלה; תכנית הגיוס של המחלקה היא הביצוע שלו.","התכנית לא קובעת איך לנצח מתחרים בשוק, אלא איך מחלקה מממשת החלטה.","","חזון הוא הצהרה על מה שהארגון רוצה להיות, לא תכנית גיוס מחלקתית."]},{"id":"s1-7","q":"מנכ\"ל MedRoute הקים שני צוותים. צוות אחד הציג תוכנית להתרחבות לאירופה, והצוות השני הוטל עליו להציג תוכנית הפוכה – להתמקד בשוק המקומי. אחרי ויכוח מובנה בין שתי התוכניות, ההנהלה גיבשה תוכנית שלישית שמשלבת רעיונות משתיהן. באיזו דרך לבחירת אסטרטגיה השתמשה החברה?","o":["יועץ השטן (Devil's Advocacy)","בירור דיאלקטי (Dialectical Inquiry)","קונצנזוס (Consensus)","ניסוח Bottom-up"],"a":1,"why":"שתי עמדות מנוגדות שמתעמתות בכוונה, ומהן נוצרת סינתזה – זו ההגדרה של בירור דיאלקטי.","w":["ביועץ השטן יש תוכנית אחת ומישהו שתפקידו רק לבקר אותה; כאן יש תוכנית נגדית מלאה וסינתזה.","","קונצנזוס הוא הסכמה בלי עימות מובנה; כאן העימות הוא לב התהליך.","השאלה היא על שיטת הבחירה בין חלופות; אין כאן רעיונות שעלו מהעובדים בשטח."]},{"id":"s1-8","q":"ב-NovaFoods הוצגה תוכנית אחת להשקת קו חטיפים בריאים. לפני האישור מינתה ההנהלה מנהלת ותיקה שתפקידה היחיד הוא לשאול שאלות קשות, להעלות התנגדויות ולחשוף את נקודות התורפה של התוכנית. זו דוגמה ל-","o":["בירור דיאלקטי","קונצנזוס","הערכת ביצועים ונקיטת צעדים מתקנים","יועץ השטן (Devil's Advocacy)"],"a":3,"why":"אדם שמונה במיוחד כדי לערער על הצעה קיימת ולהצביע על חולשות – זה יועץ השטן.","w":["בדיאלקטי צריך תוכנית נגדית שלמה וסינתזה; כאן יש רק ביקורת על תוכנית אחת.","קונצנזוס נמנע מעימות; כאן מינו מישהו בדיוק כדי לייצר ביקורת.","התוכנית עוד לא בוצעה, אז אין ביצועים להעריך; זו בחירה לפני החלטה.",""]},{"id":"s1-9","q":"הנהלת UrbanBike צריכה לבחור אסטרטגיה תוך יומיים, אחרי תקופה של מתחים בין המנהלים. חשוב לה במיוחד לחזק את תחושת האחדות בצוות. לפי ההמלצות שהוצגו בשקפים, איזו שיטה מתאימה ביותר?","o":["קונצנזוס","בירור דיאלקטי","יועץ השטן","ניסוח Top-down"],"a":0,"why":"לפי השקפים, קונצנזוס מתאים כשצריך תחושת אחדות או כשהזמן להחלטה מוגבל – שני התנאים שבסיפור.","w":["","דיאלקטי דורש הכי הרבה זמן ואנרגיה ומבוסס על עימות – לא מתאים ליומיים ולצוות מתוח.","יועץ השטן עלול ליצור עימות אישי, וזה ההפך ממה שההנהלה צריכה.","Top-down היא גישה למי מנסח את האסטרטגיה, לא אחת משלוש שיטות הבחירה בקבוצה."]},{"id":"s1-10","q":"לפי המחקר שהוצג בשקפים על שלוש השיטות לבחירת אסטרטגיה, איזו שיטה הניבה את ההחלטות האיכותיות ביותר, אבל דרשה הכי הרבה זמן ואנרגיה?","o":["יועץ השטן","קונצנזוס","בירור דיאלקטי","ניסוח Bottom-up"],"a":2,"why":"הממצאים: בירור דיאלקטי הניב החלטות באיכות הגבוהה ביותר וחשף הנחות שגויות, אבל דרש יותר זמן ואנרגיה מהשיטות האחרות.","w":["יועץ השטן טוב באיתור חולשות ספציפיות, אבל פחות טוב מהדיאלקטי בפתרונות חדשניים.","קונצנזוס הניב שביעות רצון גבוהה, אבל לעיתים החלטות פחות איכותיות.","","זו גישת ניסוח ולא אחת משלוש השיטות שנבדקו במחקר."]},{"id":"s1-11","q":"רשת הפארם HealthPlus רכשה רשת פארם מתחרה שפועלת בצפון הארץ, ובמקביל פתחה סניפים ראשונים בקפריסין. היא נשארת בדיוק באותה פעילות – קמעונאות פארם. המהלך הוא דוגמה ל-","o":["אסטרטגיה פונקציונלית","יועץ השטן","הגדרת ערכי הארגון","התרחבות אופקית (Horizontal Expansion)"],"a":3,"why":"רכישת מתחרה וכניסה לאזור גיאוגרפי חדש באותו שלב של שרשרת הערך (קמעונאות) – זו התרחבות אופקית.","w":["זו לא תכנית של מחלקה אחת אלא הרחבה של היקף הפעילות של כל הרשת.","יועץ השטן היא שיטה לבחירת אסטרטגיה, לא סוג של מהלך התרחבות.","אין כאן עקרונות התנהגות; יש רכישה והתרחבות.",""]},{"id":"s1-12","q":"בחברת DataWave התגלה ששתי יחידות עסקיות פיתחו בנפרד, באותו זמן, מערכת כמעט זהה לניהול לקוחות. ההנהלה בוחנת מחדש את התיחום בין היחידות כדי למנוע כפילויות ולשפר את שיתוף הפעולה. באיזה מושג עוסקת ההנהלה?","o":["גבולות אופקיים בארגון","אסטרטגיה מתעוררת (Emergent Strategy)","מודל SMART","קונצנזוס"],"a":0,"why":"גבולות אופקיים בארגון = התיחום בין מחלקות ויחידות עסקיות (SBU), כדי לנהל אינטגרציה ולמנוע כפילויות. המילים \"תיחום\" ו\"כפילויות\" מכריעות.","w":["","אסטרטגיה מתעוררת היא אסטרטגיה שצומחת תוך כדי פעולה, לא תיחום בין יחידות.","SMART בודק אם יעד כתוב נכון; כאן לא מנסחים יעד.","קונצנזוס היא שיטה לקבלת החלטה בקבוצה, לא ניתוח של גבולות בין יחידות."]},{"id":"s1-13","q":"איזה מהבאים מתאר נכון את האסטרטגיה של פפסי במלחמות הקולה, לפי השקפים?","o":["מיקוד במשקה הדגל ושמירה על תדמית מסורתית ונוסטלגית","פנייה לצעירים, שימוש בידוענים וגיוון תיק המוצרים לחטיפים ולמשקאות אנרגיה","פרסומות עם סנטה קלאוס ואנשים רגילים ממעמד הפועלים","השקת New Coke ב-1985 וחזרה מהירה למתכון המקורי"],"a":1,"why":"פפסי בנתה את עצמה כמותג צעיר ומודרני (The Pepsi Generation), עם כוכבים כמו מייקל ג'קסון ומדונה, וגיוון דרך המיזוג עם פריטו-ליי.","w":["זה הקו של קוקה-קולה (Classic Coke, מסורת).","","סמלים עולמיים ואנשים רגילים הם סגנון הפרסום של קוקה-קולה.","New Coke הוא כישלון של קוקה-קולה, לא של פפסי."]},{"id":"s1-14","q":"ב-1985 השיקה חברת משקאות מתכון חדש למשקה הדגל שלה. הלקוחות זעמו, ותוך כשלושה חודשים החברה חזרה למתכון הישן תחת השם Classic. על איזה מקרה מדובר?","o":["New Coke של קוקה-קולה","המשקה השקוף של פפסי","פפסי בטעם מלפפון ביפן","המיזוג של פפסי עם פריטו-ליי"],"a":0,"why":"השקף \"כישלונות מהדהדים\": באפריל 1985 קוקה-קולה השיקה New Coke, וכבר ביולי 1985 חזרה ל-Coca-Cola Classic.","w":["","המשקה השקוף של פפסי הושק ב-1991 ונגנז; הוא לא קשור לחזרה למתכון \"Classic\".","זו הייתה מהדורה מוגבלת ב-2007, לא שינוי של משקה הדגל.","המיזוג (1965) הוא מהלך גיוון, לא מתכון חדש שנכשל."]},{"id":"s1-15","q":"חברת SkyHarvest פרסמה: \"אנו שואפים להפוך לחברה שתוביל את המעבר העולמי לחקלאות עירונית, ולעולם שבו כל עיר מגדלת את המזון שלה\". ההצהרה היא דוגמה ל-","o":["מהות העסק","ערכים","חזון","יעד לפי מודל SMART"],"a":2,"why":"\"שואפים להפוך\" ו\"עולם שבו\" מתארים לאן החברה רוצה להגיע בעתיד – זה חזון.","w":["מהות העסק מתארת את המוצרים והשירותים הנוכחיים במונחי תועלת ללקוח; כאן אין מוצר או לקוח ספציפי.","ערכים הם עקרונות שמנחים התנהגות (יושרה, שירות), לא תמונת עתיד.","","אין כאן מספר מדיד ואין תאריך יעד, ולכן זה לא יעד SMART."]},{"id":"s1-16","q":"באתר החברה PetCare נכתב: \"אנו מספקים מזון ומוצרי טיפוח טבעיים לבעלי כלבים וחתולים בישראל, כדי שחיות המחמד שלהם יחיו חיים בריאים וארוכים יותר\". ההצהרה היא דוגמה ל-","o":["חזון","ערכים","ניסוח אסטרטגי בגישת Top-down","מהות העסק (Business Definition)"],"a":3,"why":"ההצהרה מתארת מה החברה עושה היום (מזון ומוצרי טיפוח), עבור מי (בעלי כלבים וחתולים בישראל) ולאיזו מטרה, במונחי תועלת ללקוח – זו מהות העסק.","w":["חזון מתאר את העתיד שהחברה שואפת אליו; כאן מתוארת הפעילות הנוכחית.","אין כאן עקרונות התנהגות לעובדים.","זו הצהרה על מהות העסק, לא תיאור של מי מנסח את האסטרטגיה.",""]},{"id":"s1-17","q":"בכניסה לסניפי בנק FairBank תלוי שלט עם ארבע מילים: יושרה, שקיפות, שירות אישי ואחריות לקהילה. המנהלים מסבירים לעובדים חדשים שכל החלטה צריכה להתאים לעקרונות האלה. מה מוצג על השלט?","o":["ערכים (Values)","חזון","מהות העסק","יעדים ומטרות"],"a":0,"why":"רשימה קצרה (4–8) של עקרונות שמנחים את התנהגות העובדים וההחלטות – אלה ערכים.","w":["","חזון הוא תמונת עתיד, \"לאן הולכים\", ולא רשימת עקרונות התנהגות.","מהות העסק מתארת מוצרים ושירותים ולקוחות; כאן אין מוצר.","יעדים הם תוצאות שרוצים להשיג (רצוי מדידות), לא עקרונות התנהגות."]},{"id":"s1-18","q":"איזה מהיעדים הבאים עומד בכל דרישות מודל SMART?","o":["להיות החברה המובילה בעולם בתחום הקמעונאות","לשפר משמעותית את שביעות רצון הלקוחות","להגדיל את נתח השוק בקרוב","להגדיל ב-15% את המכירות באתר האינטרנט של החברה עד סוף הרבעון השלישי של 2027"],"a":3,"why":"היעד ספציפי (מכירות באתר), מדיד (15%), סביר ורלוונטי לצמיחה, ותחום בזמן (סוף רבעון 3 של 2027).","w":["זו שאיפה (חזון); אין מספר ואין תאריך.","\"משמעותית\" אינו מדיד ואין תאריך יעד.","\"בקרוב\" אינו תחום בזמן ואין מספר מדיד.",""]},{"id":"s1-19","q":"היעד של StreamOn הוא: \"להגדיל ב-20% את מספר המנויים בישראל\". ההנהלה בדקה ומצאה שהיעד אפשרי עם המשאבים הקיימים ושהוא מקדם את מטרת הצמיחה שלה. איזה רכיב של SMART חסר ביעד?","o":["S – ספציפי (Specific)","T – תחום בזמן (Timely)","M – מדיד (Measurable)","A – בר השגה (Achievable)"],"a":1,"why":"היעד ספציפי (מנויים בישראל), מדיד (20%), בר השגה ורלוונטי – אבל אין בו \"עד מתי\". חסר תאריך יעד = T.","w":["ברור בדיוק מה רוצים: מנויים בישראל.","","יש מספר מדיד: 20%.","הסיפור אומר במפורש שההנהלה בדקה ומצאה שהיעד אפשרי."]},{"id":"s1-20","q":"בחברת AutoPrime המנכ\"ל וההנהלה הבכירה קובעים את האסטרטגיה, ויחידות הפיתוח והשיווק בכל העולם מקבלות הנחיות ומבצעות אותן. איזה תיאור מתאים לגישה של החברה?","o":["Bottom-up: נותנת גמישות גבוהה וחדשנות מהשטח","Top-down: היתרון העיקרי שלה הוא גמישות גבוהה לשינויים בזמן אמת","Top-down: נותנת מיקוד ושליטה, אבל יש סיכון לניתוק בין ההנהלה לשטח","Bottom-up: החיסרון העיקרי שלה הוא ניתוק בין ההנהלה לשטח"],"a":2,"why":"ההנהלה מכתיבה והדרגים מבצעים = Top-down. היתרונות שלה: חזון ומיקוד ושליטה במשאבים; החיסרון: ניתוק מהשטח ופחות גמישות.","w":["ב-Bottom-up הרעיונות עולים מהעובדים; כאן הם יורדים מההנהלה.","פחות גמישות היא דווקא חיסרון של Top-down.","","ניתוק מהשטח הוא חיסרון של Top-down; וחוץ מזה הסיפור מתאר Top-down."]},{"id":"s1-21","q":"חברת הצעצועים ToyBlocks הקימה אתר שבו לקוחות מעלים רעיונות לערכות חדשות, והרעיונות הפופולריים נכנסים לייצור. בנוסף, המהנדסים רשאים להקדיש חלק מזמנם לפרויקטים אישיים, ומהם נולדו כמה מוצרים מצליחים. באיזו גישה לניסוח אסטרטגיה מדובר?","o":["Top-down","יועץ השטן","התרחבות אופקית","Bottom-up"],"a":3,"why":"הרעיונות עולים מלמטה – מהעובדים ומהמשתמשים – אל ההנהלה (כמו LEGO Ideas ו-3M בשקפים). זו גישת Bottom-up.","w":["ב-Top-down ההנהלה מכתיבה את האסטרטגיה; כאן היוזמה מגיעה מהשטח.","יועץ השטן הוא ביקורת על תוכנית קיימת, לא מקור לרעיונות חדשים.","לא מדובר בכניסה לשוק חדש או ברכישת מתחרה, אלא במקור הרעיונות.",""]},{"id":"s1-22","q":"הנהלת SolarHome כבר בחרה אסטרטגיה של מעבר למכירות אונליין. עכשיו היא מקצה תקציב, משנה את המבנה הארגוני, מדריכה את אנשי המכירות ומעניקה תמריצים לעובדים שמובילים את השינוי. באיזו משימה של הניהול האסטרטגי נמצאת החברה?","o":["יישום וביצוע האסטרטגיה","ניסוח (עיצוב) אסטרטגיה","הצבת יעדים ומטרות","הערכת ביצועים ונקיטת צעדים מתקנים"],"a":0,"why":"האסטרטגיה כבר נבחרה, ועכשיו מתקצבים, משנים מבנה ומניעים עובדים – זה Make it Happen, המשימה הרביעית.","w":["","הניסוח כבר הסתיים (\"כבר בחרה\"); עכשיו מבצעים.","לא קובעים כאן יעדים חדשים אלא מוציאים לפועל.","עוד אין תוצאות שנמדדות מול יעד; עדיין בשלב הביצוע."]},{"id":"s1-23","q":"שנה אחרי שהשיקה רשת מסעדות חדשה, בדקה הנהלת TasteBox את התוצאות ומצאה שהמכירות נמוכות ב-12% מהיעד. היא גילתה שמתחרה חדש נכנס לאזור ושהעדפות הלקוחות השתנו, ולכן עדכנה את התפריט ואת היעדים. איזו משימה מתוארת?","o":["יישום וביצוע האסטרטגיה","הערכת ביצועים ונקיטת צעדים מתקנים","חזון, ערכים ופיתוח משימת הארגון","בחירת אסטרטגיה בשיטת הקונצנזוס"],"a":1,"why":"\"בדקה את התוצאות\", \"נמוכות מהיעד\" ו\"עדכנה\" – מדידה מול יעד ותיקון. זו המשימה החמישית.","w":["ביישום מוציאים לפועל; כאן מודדים את מה שבוצע ומתקנים.","","לא מנסחים כאן חזון או ערכים; מתקנים תוכנית קיימת לפי תוצאות.","אין כאן תהליך של הסכמה קבוצתית; יש בדיקת ביצועים ותיקון."]},{"id":"s1-24","q":"לפי סדר חמש משימות הניהול האסטרטגי, מה בא מיד אחרי \"חזון, ערכים ופיתוח משימת הארגון\"?","o":["עיצוב אסטרטגיה להשגת המטרות","יישום וביצוע האסטרטגיה","הצבת יעדים ומטרות","הערכת ביצועים ונקיטת צעדים מתקנים"],"a":2,"why":"הסדר: חזון → הצבת יעדים ומטרות → עיצוב אסטרטגיה → יישום וביצוע → הערכה ותיקון. אחרי החזון מתרגמים אותו ליעדים.","w":["אי אפשר לעצב אסטרטגיה \"להשגת המטרות\" לפני שהמטרות נקבעו; זו המשימה השלישית.","יישום הוא המשימה הרביעית.","","הערכה היא המשימה החמישית והאחרונה."]},{"id":"s1-25","q":"הסטארט-אפ FitMeal מכין את הצהרת מהות העסק. בישיבה שאלו: \"אילו קבוצות אנשים אנחנו משרתים, איזה צורך שלהם אנחנו פותרים, ובאילו ערים נפעל?\". באיזה רכיב עוסקים המייסדים?","o":["הגדרת לקוחות","הגדרת מתחרים","חזון","הצבת יעדים לפי SMART"],"a":0,"why":"השאלות \"עבור מי\", \"איזה צורך\" ו\"באיזה כיסוי גיאוגרפי\" הן הגדרת הלקוחות (קהל היעד), שהיא חלק ממהות העסק.","w":["","הגדרת מתחרים שואלת מול מי מתחרים; כאן שואלים את מי משרתים.","חזון עוסק בעתיד, לאן הולכים; כאן מגדירים את קהל הלקוחות.","לא נקבע כאן יעד עם מספר ותאריך."]},{"id":"s1-26","q":"רשת בתי הקפה CupUp ממפה את כל העסקים שמוכרים קפה לקחת באותן שכונות, לאותו קהל של עובדי משרדים, כדי לדעת מול מי היא נמדדת ועם מי אולי כדאי לשתף פעולה. באיזה רכיב מדובר?","o":["הגדרת לקוחות","הגדרת מתחרים","גבולות אופקיים בארגון","ערכים"],"a":1,"why":"מיפוי מי מוכר לאותם לקוחות פתרון לאותו צורך, ושאלת תחרות מול שיתוף פעולה – זו הגדרת המתחרים.","w":["הלקוחות (עובדי משרדים) כבר ידועים; עכשיו ממפים את מי שמתחרה עליהם.","","גבולות אופקיים בארגון הם תיחום בין יחידות בתוך החברה, לא מיפוי של עסקים אחרים.","אין כאן עקרונות התנהגות."]},{"id":"s1-27","q":"לפי השקפים, ההבדל בין החלטה אסטרטגית להחלטה טקטית נבחן לפי כמה ממדים. איזה מהבאים אינו אחד מהם?","o":["מחיר הטעות","הדרג המחליט","טווח הזמן","גודל קהל היעד של הפרסום"],"a":3,"why":"ארבעת הממדים בשקף הם: כמות משאבים, זמן, דרג מחליט ומחיר הטעות. גודל קהל הפרסום אינו אחד מהם.","w":["מחיר הטעות הוא אחד מארבעת הממדים.","הדרג המחליט הוא אחד מארבעת הממדים.","הזמן הוא אחד מארבעת הממדים.",""]},{"id":"s1-28","q":"כל חברות הביטוח בשוק מצהירות ש\"אנו מעניקים ביטחון פיננסי ללקוחותינו\". לפי השקפים, מה ההסבר הטוב ביותר לכך שהצהרה כזאת אינה אסטרטגיה?","o":["כי הצהרת משימה מתארת את העתיד ולא את ההווה","הצהרת המשימה אינה ייחודית לפירמה ואינה גורמת ללקוחות לבחור בה מול המתחרים","כי הצהרת משימה נכתבת רק בגישת Bottom-up","כי הצהרת משימה חייבת לכלול יעדים מדידים לפי SMART"],"a":1,"why":"השקף \"הצהרת המשימה אינה אסטרטגיה\": היא עוזרת למיקוד פנימי, אבל אינה ייחודית (כל חברת ביטוח אומרת את זה) ואינה מניעה צרכנים לבחור בפירמה, בעוד שאסטרטגיה נועדה לנצח מתחרים.","w":["הפוך: הצהרת המשימה מתארת את העסק הנוכחי; העתיד הוא החזון.","","אין קשר בין הצהרת משימה לגישת הניסוח.","הצהרת משימה לא אמורה לכלול יעדים מדידים; זה תפקיד המשימה השנייה."]},{"id":"s1-29","q":"חברת תוכנה קבעה: \"לשפר את המעמד התחרותי שלנו בשוק אבטחת הענן לאורך השנים הבאות, ולהיתפס כמובילת החדשנות בתחום\". לפי החלוקה בשקפים, זו דוגמה ל-","o":["מטרה פיננסית","יעד לפי מודל SMART","מטרה אסטרטגית","ערך ארגוני"],"a":2,"why":"שיפור המעמד התחרותי לאורך זמן הוא ההגדרה של מטרה אסטרטגית. מטרה פיננסית הייתה עוסקת בהכנסות, רווח או עלויות.","w":["מטרה פיננסית = שיפור הביצועים הכספיים; כאן מדובר במעמד תחרותי ובתדמית.","אין מספר מדיד ואין תאריך; \"לאורך השנים\" אינו תחום בזמן.","","ערך הוא עקרון התנהגות, לא תוצאה שהחברה רוצה להשיג."]}],"tf":[{"id":"s1-t1","s":"מטרת האסטרטגיה היא ליצור יתרון תחרותי שיאפשר לפירמה להשיג תשואה מעל הממוצע.","a":true,"why":"נכון. כך מוגדרת מטרת האסטרטגיה בשקפים: יתרון תחרותי שמוביל לתשואה גבוהה ממה שמשקיע היה מקבל בהשקעות בסיכון דומה."},{"id":"s1-t2","s":"אסטרטגיה שיווקית ואסטרטגיה עסקית הן שמות שונים לאותו דבר, כי שתיהן עוסקות בכל חלקי הארגון.","a":false,"why":"לא נכון. אסטרטגיה שיווקית אינה אסטרטגיה עסקית: השיווק מנהל את הביקוש ומשפיע רק על חלק מהארגון, והאסטרטגיה מכוונת את כל הארגון לטווח ארוך."},{"id":"s1-t3","s":"הצלחת האסטרטגיה נמדדת בעיקר במודעות למותג ובנאמנות לקוחות, והצלחת השיווק נמדדת בתשואה לבעלי המניות.","a":false,"why":"לא נכון, המדדים הפוכים. אסטרטגיה נמדדת ביתרון תחרותי, רווחיות ותשואה לבעלי המניות; שיווק נמדד במכירות, מודעות למותג ונאמנות."},{"id":"s1-t4","s":"אסטרטגיה ברמת התאגיד קובעת באילו שווקים הפירמה תתחרה וכמה משאבים יוקצו לכל אחת מהיחידות העסקיות שלה.","a":true,"why":"נכון. הרמה התאגידית עונה על \"איפה\": היקף הפעילות של כל ה-SBU, מהלכים כמו מיזוגים, רכישות וגיוון, והקצאת משאבים בין יחידות."},{"id":"s1-t5","s":"האסטרטגיה הפונקציונלית קובעת את הכיוון הכללי של הארגון, והרמות התאגידית והעסקית רק מבצעות אותו.","a":false,"why":"לא נכון, הכיוון הפוך. הרמות התאגידית והעסקית מגדירות את הכיוון, והרמה הפונקציונלית (כל מחלקה) מוציאה אותו לפועל."},{"id":"s1-t6","s":"החלטה שדורשת מעט משאבים, משפיעה לטווח קצר וקל לבטל אותה היא בדרך כלל החלטה טקטית ולא אסטרטגית.","a":true,"why":"נכון. החלטה אסטרטגית דורשת משאבים רבים, היא לטווח ארוך, מתקבלת בדרג בכיר ומחיר הטעות בה גבוה. כאן יש את ההפך, ולכן זו החלטה טקטית."},{"id":"s1-t7","s":"בשיטת יועץ השטן מציגים שתי תוכניות מנוגדות ומשלבים אותן לסינתזה אחת.","a":false,"why":"לא נכון. זה בירור דיאלקטי. ביועץ השטן ממנים אדם או קבוצה שתפקידם לתקוף תוכנית קיימת ולמצוא בה חולשות, בלי תוכנית נגדית."},{"id":"s1-t8","s":"לפי המחקר שהוצג בשקפים, שיטת הקונצנזוס הובילה לשביעות רצון גבוהה של המשתתפים, אבל לפעמים להחלטות פחות איכותיות.","a":true,"why":"נכון. בקונצנזוס נמנעים מעימות, ולכן המשתתפים מרוצים יותר, אבל לעיתים איכות ההחלטה נפגעת."},{"id":"s1-t9","s":"בירור דיאלקטי מתאים במיוחד כשהזמן לקבלת ההחלטה קצר, כי זו השיטה המהירה ביותר.","a":false,"why":"לא נכון. בירור דיאלקטי דורש הכי הרבה זמן ואנרגיה. כשהזמן קצר מומלץ קונצנזוס; הדיאלקטי מתאים להחלטות קריטיות שדורשות חדשנות."},{"id":"s1-t10","s":"התרחבות אופקית היא הרחבת הפעילות באותו שלב של שרשרת הערך או לשווקים קרובים, למשל על ידי רכישת מתחרה.","a":true,"why":"נכון. כך מוגדרת התרחבות אופקית בשקפים. דוגמאות: רכישת מתחרים, כניסה לשוק גיאוגרפי חדש, מוצרים דומים ללקוחות קיימים."},{"id":"s1-t11","s":"במלחמות הקולה, קוקה-קולה בנתה את המותג בעיקר על כוכבי פופ וידוענים, ופפסי בנתה אותו על מסורת ונוסטלגיה.","a":false,"why":"לא נכון, הצדדים הפוכים. קוקה-קולה מתמקדת במסורת, בנוסטלגיה ובאנשים רגילים; פפסי פונה לצעירים ומשתמשת בידוענים."},{"id":"s1-t12","s":"חזון מתאר בעיקר את המוצרים והשירותים שהחברה מספקת היום, במונחי תועלת ללקוח.","a":false,"why":"לא נכון. זו הגדרת מהות העסק (המשימה). החזון מתייחס לעתיד: לאן הארגון הולך ומה הוא רוצה להיות."},{"id":"s1-t13","s":"החזון של חברה יכול להשתנות כשהסביבה העסקית שלה משתנה.","a":true,"why":"נכון. לפי השקפים חזון יכול להשתנות (למשל נטפליקס), וחברות שלא משתנות כשהעולם שלהן משתנה עלולות לקרוס."},{"id":"s1-t14","s":"הצהרת המשימה אינה אסטרטגיה, בין היתר מפני שבדרך כלל היא לא ייחודית לפירמה מסוימת.","a":true,"why":"נכון. הצהרת המשימה עוזרת למיקוד פנימי, אבל היא לא ייחודית (כל חברת ביטוח \"מעניקה ביטחון\") ולא גורמת ללקוחות לבחור בפירמה."},{"id":"s1-t15","s":"היעד \"לשפר את השירות ללקוחות\" עומד בדרישות מודל SMART.","a":false,"why":"לא נכון. היעד לא ספציפי, אין בו מדד שאפשר למדוד ואין תאריך יעד. חסרים לפחות S, M ו-T."},{"id":"s1-t16","s":"במודל SMART האות T מציינת שליעד צריך להיות תאריך יעד מוגדר.","a":true,"why":"נכון. T = תחום בזמן (Timely): קובעים עד מתי היעד צריך להיות מושג, ועוקבים אחרי ההתקדמות."},{"id":"s1-t17","s":"בגישת Top-down הרעיונות האסטרטגיים עולים מהעובדים בשטח אל ההנהלה.","a":false,"why":"לא נכון. זו גישת Bottom-up. ב-Top-down ההנהלה הבכירה מכתיבה את האסטרטגיה ומורידה אותה לדרגים לביצוע."},{"id":"s1-t18","s":"יתרון של גישת Bottom-up הוא גמישות וקידום חדשנות, אבל החיסרון שלה הוא תהליך תכנון איטי יותר.","a":true,"why":"נכון. ב-Bottom-up יש מעורבות גבוהה מהשטח, ולכן גמישות וחדשנות, אבל ריבוי הקולות מאט את התכנון ומקשה על עקביות."},{"id":"s1-t19","s":"את חמש משימות הניהול האסטרטגי מבצעים פעם אחת בלבד, לפי סדר קבוע, ואז התהליך מסתיים.","a":false,"why":"לא נכון. הצורך בחמש המשימות קיים תמיד: זה מעגל. אחרי הערכת הביצועים חוזרים לשפר ולעדכן, והגבולות בין המשימות מעורפלים."},{"id":"s1-t20","s":"יישום וביצוע האסטרטגיה כולל, בין היתר, תקצוב, מבנה ארגוני, תרבות ארגונית ומנהיגות.","a":true,"why":"נכון. יישום הוא שלב ה-Make it Happen: פיתוח יכולות, תקצוב, מדיניות, מוטיבציה, מבנה ארגוני, תרבות ומנהיגות."},{"id":"s1-t21","s":"ערכי הארגון נועדו בעיקר לפרסום כלפי חוץ, ואין להם השפעה על ההחלטות של העובדים.","a":false,"why":"לא נכון. ערכים הם עקרונות שמנחים את התנהגות המנהלים והעובדים, משמשים מצפן לקבלת החלטות ומעצבים את התרבות הארגונית."},{"id":"s1-t22","s":"הגדרת המתחרים חשובה, כי יתרון תחרותי נמדד מול חברות שפועלות באותו ענף.","a":true,"why":"נכון. לפי השקפים יתרון תחרותי נמדד בין חברות באותו ענף, ולכן צריך לדעת מי המתחרים כדי לדעת אם יש לנו יתרון."},{"id":"s1-t23","s":"אחד התפקידים של החזון הוא לתת השראה ומוטיבציה לעובדים, ולעזור לחברה לגייס עובדים ולשמור עליהם.","a":true,"why":"נכון. בשקף \"חשיבות החזון\": החזון נותן כיוון לכל חברי הארגון, השראה ומוטיבציה לעובדים, ועוזר בגיוס עובדים ובשימורם."}]},{"id":"s2","title":"ניתוח הסביבה החיצונית: ענף, PESTEL וחמשת הכוחות","short":"ניתוח ענף","blurb":"מה זה ענף, כוחות מניעי שינוי, PESTEL(G), חמשת הכוחות של פורטר וחסמי כניסה, אוקיינוס כחול מול אדום, KSF ו-F-KSF, ואיך מחליטים אם ענף אטרקטיבי.","mnemonic":"\"מאקרו = PESTEL, מיקרו = פורטר\": PESTEL מסתכל
