שתנה.","ערכים הם כללי התנהגות, לא יעדים.","חזון הוא כיוון כללי לעתיד, לא מספר עם תאריך.","","ד׳ נכונה."],"why":"יעדים אינם קבועים: מעדכנים אותם מדי 1–3 שנים, במיוחד כשנכנס מתחרה משמעותי."},{"id":"m1-34","q":"החזון של VoltWay הוא ״להוביל את המעבר לתחבורה חשמלית באירופה״. מה מהבאים מתרגם את החזון לביטוי מעשי?","o":["הערכים: חדשנות, אחריות ושקיפות","ניתוח PESTEL של אירופה","היעד: ״להקים 500 עמדות טעינה מהירה בגרמניה עד סוף 2028״","המשפט ״אנחנו גאים להיות חברה ירוקה״","אף תשובה אינה נכונה"],"a":2,"w":["ערכים הם כללי התנהגות, לא תרגום מעשי של החזון.","זה כלי ניתוח סביבה, לא יעד.","","זו סיסמה בלי מספר וזמן.","ג׳ נכונה."],"why":"יעד טוב מתרגם את החזון לביטוי מעשי: מדיד, עם זמן, מאתגר ומציאותי."},{"id":"m1-35","q":"לרשת Rolta נשאר מזומן לארבעה חודשים. בהנהלה מתלבטים: להשקיע בקמפיין לבניית מותג ונתח שוק, או לקצץ, למכור נכסים ולשלם חובות. מה נכון לפי הקורס?","o":["במצב כזה יעדים פיננסיים חשובים יותר – קודם שורדים","יעדים אסטרטגיים תמיד חשובים יותר, גם עכשיו","צריך קודם לנסח חזון חדש","יעדים אינם רלוונטיים לחברה במשבר","אף תשובה אינה נכונה"],"a":0,"w":["","הכלל לא חל על חברה על סף פשיטת רגל.","חזון לא יציל תזרים מזומנים בעוד ארבעה חודשים.","דווקא במשבר צריך יעדים ברורים.","א׳ נכונה."],"why":"לחברה על סף פשיטת רגל יעדים פיננסיים (תזרים, חובות) חשובים יותר מיעדים אסטרטגיים."},{"id":"m1-36","q":"Delmar הציגה השנה רווח שיא. מה אפשר לומר לפי הקורס?","o":["הרווח מוכיח רק שההחלטות של השנה האחרונה נכונות","הרווח עשוי לשקף החלטות אסטרטגיות ופעולות נכונות שנעשו בעבר","מעכשיו Delmar לא צריכה יעדים אסטרטגיים","מכאן שיעדים פיננסיים תמיד חשובים יותר","אף תשובה אינה נכונה"],"a":1,"w":["לרוב הרווח של היום נבנה מהחלטות של שנים קודמות.","","בלי יעדים אסטרטגיים הרווח של מחר ייפגע.","אין כלל כזה; הכלל הכללי הפוך.","ב׳ נכונה."],"why":"תוצאות פיננסיות בהווה הן לעיתים קרובות פרי של אסטרטגיה נכונה בעבר."}],"tf":[{"id":"m1-t1","s":"לפי הקורס, הניהול האסטרטגי עוסק במערכת היחסים והאיזונים בין ההנהלה הבכירה, הדירקטוריון ובעלי המניות.","a":true,"why":"זו ההגדרה בקורס: איזון בין שלושת הצדדים."},{"id":"m1-t2","s":"מהות העסק (Mission) מתארת את הנתיב העתידי שהחברה רוצה להגיע אליו.","a":false,"why":"זה החזון. מהות העסק מתארת את המוצרים והשירותים הנוכחיים במונחי תועלת ללקוח וכיסוי גיאוגרפי."},{"id":"m1-t3","s":"לרוב לחברה יש 4–8 ערכים שמגדירים התנהגויות רצויות.","a":true,"why":"ערכים הם מסגרת נורמטיבית קצרה, בדרך כלל 4–8 ערכים."},{"id":"m1-t4","s":"האות T במודל SMART אומרת שליעד צריך להיות מועד יעד ברור.","a":true,"why":"T = Time: היעד מוגדר בזמן (עד מתי)."},{"id":"m1-t5","s":"״להיות הכי טובים בשירות לקוחות״ הוא יעד שעומד בקריטריונים של SMART.","a":false,"why":"אין בו מספר מדיד ואין מועד – הוא לא ספציפי, לא מדיד ולא מוגדר בזמן."},{"id":"m1-t6","s":"הגדלת הרווח למניה (EPS) היא דוגמה ליעד אסטרטגי.","a":false,"why":"רווח למניה הוא יעד פיננסי. יעד אסטרטגי הוא למשל נתח שוק או מוניטין."},{"id":"m1-t7","s":"לפי ההבחנה המקובלת בקורס, יעדים פיננסיים חשובים יותר מיעדים אסטרטגיים.","a":false,"why":"ההפך: יעדים אסטרטגיים חשובים יותר. (חריג: בחברה על סף פשיטת רגל הפיננסיים חשובים יותר.)"},{"id":"m1-t8","s":"הגדלת נתח שוק נחשבת ליעד אסטרטגי.","a":true,"why":"נתח שוק מודד את המעמד התחרותי – יעד אסטרטגי."},{"id":"m1-t9","s":"בתקופת התועלת היתרון התחרותי בגודלו המקסימלי והחברה מפיקה ממנו רווחים.","a":true,"why":"זו התקופה השנייה במודל – מימוש היתרון."},{"id":"m1-t10","s":"לפי מודל בנייה ושחיקה, השחיקה נגרמת בעיקר מכך שהחברה מפסיקה להשקיע.","a":false,"why":"השחיקה נגרמת ממהלכי תגובה של היריבים שמכרסמים ביתרון."},{"id":"m1-t11","s":"בתקופת הבנייה החברה מבצעת מהלכים אסטרטגיים כדי ליצור את היתרון התחרותי.","a":true,"why":"זו התקופה הראשונה – השקעה ויצירת היתרון."},{"id":"m1-t12","s":"מודל היהלום של פורטר מסביר מדוע מדינות מסוימות תחרותיות במיוחד בענפים מסוימים.","a":true,"why":"המודל מסביר תחרותיות לאומית וגלובלית."},{"id":"m1-t13","s":"מזל ומדיניות ממשלתית הם שניים מארבעת הממדים של מודל היהלום.","a":false,"why":"הם גורמים חיצוניים שמשפיעים על היהלום. ארבעת הממדים: גורמי ייצור, תנאי ביקוש, ענפים מקושרים ותומכים, אסטרטגיה מבנה ויריבות."},{"id":"m1-t14","s":"לפי מודל היהלום, יריבות מקומית חזקה מחלישה את התחרותיות של המדינה בענף.","a":false,"why":"ההפך: יריבות מקומית חזקה מחשלת את החברות ומחזקת אותן בעולם."},{"id":"m1-t15","s":"ההחלטה לרכוש חברה בענף חדש היא החלטה ברמת היחידה העסקית.","a":false,"why":"באילו עסקים להיות – זו רמת התאגיד."},{"id":"m1-t16","s":"אסטרטגיה ברמה הפונקציונלית עוסקת באופן שבו מחלקות כמו שיווק, תפעול ומשאבי אנוש תומכות באסטרטגיה.","a":true,"why":"זו הרמה השלישית – הפונקציה הארגונית."},{"id":"m1-t17","s":"ניתוח הכוחות המניעים שינוי בענף מסתכל בדרך כלל 10–20 שנה קדימה.","a":false,"why":"בקורס מדובר בטווח של 1–3 שנים."},{"id":"m1-t18","s":"מתחרים בטווח הארוך הם אלה שמתחרים על שימוש בזמן דומה של הלקוח, והם מהווים סכנה אסטרטגית.","a":true,"why":"כך מוגדר הטווח הארוך בניתוח המתחרים."},{"id":"m1-t19","s":"מתחרים בטווח הקצר הם מוצרים שונים שנצרכים בנסיבות צריכה דומות.","a":false,"why":"זה הטווח הבינוני. בטווח הקצר המתחרים הם מוצרים זהים או דומים."},{"id":"m1-t20","s":"מהות העסק צריכה לתאר את המוצרים והשירותים במונחי תועלת ללקוח ולציין כיסוי גיאוגרפי.","a":true,"why":"כך הקורס מגדיר את מהות העסק."},{"id":"m1-t21","s":"הדירקטוריון הוא הגוף שמנהל את הפעילות היומיומית של החברה.","a":false,"why":"את היום-יום מנהלת ההנהלה הבכירה. הדירקטוריון מפקח, מאשר וממנה."},{"id":"m1-t22","s":"במודל SMART האות A מייצגת Achievable – יעד בר השגה.","a":true,"why":"A = Achievable: יש לארגון את המשאבים והיכולות להשיג את היעד."},{"id":"m1-t23","s":"יעד טוב צריך לעבור בדיקה ועדכון מדי 1–3 שנים.","a":true,"why":"כך לפי המרצה: הסביבה משתנה, ויעדים שהושגו או התיישנו מעדכנים."},{"id":"m1-t24","s":"יעד טוב הוא יעד קל להשגה, כדי שהעובדים לא יתייאשו.","a":false,"why":"יעד טוב הוא מאתגר מצד אחד ומציאותי מצד שני – לא קל."},{"id":"m1-t25","s":"מהות העסק מגדירה את תחומי הפעילות של הפירמה, ואילו החזון מתייחס לכיוון העתידי שאליו היא שואפת.","a":true,"why":"זה ההבדל: הווה (תחומי פעילות) מול עתיד (כיוון)."},{"id":"m1-t26","s":"בחברה בבעלות פרטית יעדים פיננסיים תמיד חשובים יותר מיעדים אסטרטגיים.","a":false,"why":"סוג הבעלות לא קובע. החריג בקורס הוא חברה על סף פשיטת רגל."},{"id":"m1-t27","s":"כשטבע העבירה מטופלים לגרסה חדשה של הקופקסון לפני פקיעת הפטנט, היא נקטה חדשנות משבשת.","a":false,"why":"זו הארכת תקופת התועלת (״חיי המוצר״) בשיפור המוצר, לא מוצר זול ופשוט שתוקף מלמטה."},{"id":"m1-t28","s":"תוצאות פיננסיות טובות היום יכולות לשקף החלטות אסטרטגיות נכונות שהתקבלו בעבר.","a":true,"why":"הרווח של היום הוא לעיתים קרובות פרי של אסטרטגיה מלפני שנים."}],"scope":[{"ref":"סיכום · עמ׳ 1","x":"הארגון האסטרטגי והצדדים לניהול האסטרטגי","imp":1,"h":"הארגון האסטרטגי והצדדים לניהול האסטרטגי"},{"ref":"סיכום · עמ׳ 1","x":"ערכים, מהות העסק וחזון","imp":2,"h":"ערכים, מהות העסק וחזון (Values, Mission, Vision)"},{"ref":"מבחן לדוגמה (ב) · א3","x":"חזון מול מהות העסק – ההבדל","imp":1,"h":"חזון מול מהות העסק: ההבדל שהמרצה בודק"},{"ref":"סיכום · עמ׳ 1","x":"הצבת יעדים – SMART","imp":2,"h":"הצבת יעדים: מודל SMART"},{"ref":"מבחן לדוגמה · א3","x":"יעד טוב לפי המרצה ועדכון כל 1–3 שנים","imp":2,"h":"מה מאפיין יעד טוב לפי המרצה (ועדכון כל 1–3 שנים)"},{"ref":"סיכום · עמ׳ 1","x":"יעדים פיננסיים מול אסטרטגיים","imp":1,"h":"יעדים פיננסיים מול יעדים אסטרטגיים"},{"ref":"מבחן לדוגמה · א5","x":"מתי יעדים פיננסיים חשובים יותר (פשיטת רגל, תוצאות העבר)","imp":1,"h":"מתי יעדים פיננסיים חשובים יותר? הדקויות של המרצה"},{"ref":"סיכום · עמ׳ 1","x":"מודל בנייה ושחיקה של יתרון תחרותי","imp":2,"h":"מודל בנייה ושחיקה של יתרון תחרותי"},{"ref":"מבחן לדוגמה (ב) · א7","x":"הארכת תקופת התועלת – קופקסון","imp":1,"h":"הארכת תקופת התועלת: מקרה הקופקסון של טבע"},{"ref":"סיכום · עמ׳ 1","x":"מודל היהלום של פורטר","imp":2,"h":"מודל היהלום של פורטר (Porter's Diamond)"},{"ref":"סיכום · עמ׳ 2","x":"רמות אסטרטגיה","imp":1,"h":"רמות אסטרטגיה: תאגיד, יחידה עסקית, פונקציה"},{"ref":"סיכום · עמ׳ 2","x":"כוחות מניעי שינוי בענף","imp":1,"h":"כוחות מניעי שינוי בענף"},{"ref":"סיכום · עמ׳ 2","x":"ניתוח מתחרים לפי אופק זמן","imp":1,"h":"ניתוח מתחרים לפי אופק זמן"}],"outScope":[]},{"id":"m2","title":"ניתוח סביבת הענף","short":"סביבת הענף","blurb":"הגדרת ענף, PESTEL(G) והביקורת עליו, חמשת הכוחות של פורטר ומה מחזק כל כוח, אוקיינוס כחול ו-ERRC, מיפוי קבוצות אסטרטגיות ו-KSF.","mnemonic":"מבחוץ פנימה: <b>מאקרו = PESTEL</b> (העולם), <b>מיקרו = פורטר</b> (הזירה), ובמרכז הפירמה. בפורטר: <b>״כוח חזק = רווח חלש״</b>; אבל <b>חסם כניסה גבוה = טוב</b> ו<b>חסם יציאה גבוה = רע</b>. <b>לאחור = לקוח</b> מייצר בעצמו, <b>לפנים = ספק</b> מוכר בעצמו. ERRC מסודר כמו סולם: <b>מוחקים, מקטינים, מגדילים, ממציאים</b>. KSF: <b>״מבחוץ, מעט, משתנה״</b> (3–4).","blocks":[{"t":"h","x":"הגדרת ענף (ענף מול שוק)"},{"t":"p","x":"<b>ענף</b> הוא קבוצת פירמות שמציעות מוצרים או שירותים שהם <b>תחליפים קרובים</b> זה לזה, עבור קבוצת לקוחות. במילים פשוטות: אם הלקוח יכול לקנות את זה <b>במקום</b> את זה, החברות נמצאות באותו ענף."},{"t":"p","x":"הקורס מבחין בין <b>ענף</b> ל<b>שוק</b>: הענף הוא צד <b>המוכרים</b> (החברות), והשוק הוא צד <b>הקונים</b> (הלקוחות). ענף אחד יכול לשרת כמה שווקים."},{"t":"table","head":["מושג","צד","שאלה","דוגמה"],"rows":[["<b>ענף</b> (Industry)","היצע – החברות","מי מוכר תחליפים קרובים?","ענף המשקאות הקלים: קוקה-קולה, פפסי, ספרינג"],["<b>שוק</b> (Market)","ביקוש – הלקוחות","מי קונה?","הצרכנים שקונים משקאות קלים; שוק המסעדות; שוק הצעירים"]]},{"t":"p","x":"בתרשים של הסיכום רואים שלושה מעגלים: <b>הפירמה</b> במרכז, מסביבה <b>סביבת המיקרו</b> (הענף – חמשת הכוחות), ומסביב לכל <b>סביבת המאקרו</b> (PESTEL). יחידה זו עוברת מהמעגל החיצוני פנימה."},{"t":"example","title":"ענף או שוק?","x":"טויוטה, יונדאי ומאזדה מוכרות מכוניות שהן תחליפים קרובים ← הן באותו <b>ענף</b> (ענף הרכב). ״כל המשפחות בישראל שמחפשות רכב משפחתי ראשון״ ← זה <b>שוק</b> (קבוצת קונים). ענף הרכב משרת גם שוק אחר – חברות ליסינג וציי רכב."},{"t":"trap","x":"ענף ≠ שוק. אם בשאלה מתוארת קבוצת <b>חברות</b> שמוכרות תחליפים קרובים – ענף. אם מתוארת קבוצת <b>לקוחות</b> – שוק."},{"t":"exam","x":"״קבוצת פירמות המציעות מוצרים שהם תחליפים קרובים עבור קבוצת לקוחות״ ← <b>הגדרת ענף</b>. שאלה נפוצה: מה ההבדל בין ענף לשוק? ← ענף = מוכרים, שוק = קונים."},{"t":"h","x":"סביבת מאקרו: מודל PESTEL(G)"},{"t":"p","x":"<b>PESTEL(G)</b> הוא כלי למיפוי <b>7 כוחות סביבתיים חיצוניים</b> שמשפיעים על הענף. זה <b>מבט רחב / גלובלי</b>: החברה לא שולטת בכוחות האלה, היא רק יכולה להיערך אליהם."},{"t":"table","head":["אות","באנגלית","בעברית","מה בודקים","דוגמה"],"rows":[["<b>P</b>","Political","פוליטי","יציבות שלטונית, מדיניות ממשלה, מלחמות, הסכמי סחר","מלחמה מרחיקה תיירים ופוגעת בענף המלונאות"],["<b>E</b>","Economical","כלכלי","ריבית, אינפלציה, שער חליפין, צמיחה, אבטלה","עליית ריבית מקטינה את הביקוש לדירות"],["<b>S</b>","Social","חברתי","דמוגרפיה, טרנדים, אורח חיים, ערכים","טרנד הטבעונות מגדיל את הביקוש לתחליפי בשר"],["<b>T</b>","Technological","טכנולוגי","המצאות, אוטומציה, בינה מלאכותית, דיגיטל","בינה מלאכותית מחליפה מוקדנים בשירות לקוחות"],["<b>E</b>","Environmental","סביבתי","אקלים, זיהום, משאבי טבע, מחזור","בצורת פוגעת ביבולים ובענף החקלאות"],["<b>L</b>","Legal","משפטי","חוקים, רגולציה, תקנים, דיני עבודה, הגנת צרכן","חוק חדש אוסר מכירת משקאות אנרגיה לקטינים"],["<b>G</b>","Globalization","גלובלי","פתיחת שווקים, תחרות מחו״ל, שרשראות אספקה עולמיות","אתרי קניות מסין מתחרים בחנויות האופנה המקומיות"]]},{"t":"example","title":"PESTEL לחברת תיירות","x":"TravelUp, סוכנות נסיעות ישראלית, בודקת את הסביבה: הדולר התחזק (<b>E כלכלי</b>), צעירים מעדיפים להזמין לבד באפליקציה (<b>S חברתי</b> + <b>T טכנולוגי</b>), נכנס לתוקף חוק שמחייב החזר כספי מלא על טיסה שבוטלה (<b>L משפטי</b>), גלי חום באירופה בקיץ (<b>E סביבתי</b>), ואתרי הזמנות בינלאומיים מתחרים בה ישירות (<b>G גלובלי</b>)."},{"t":"trap","x":"יש <b>שתי אותיות E</b>: כלכלי (ריבית, אינפלציה) וסביבתי (אקלים, זיהום). ו-<b>G = Globalization</b> (גלובלי), לא Government. הבדל עדין: <b>פוליטי</b> = מדיניות והחלטות של השלטון ויציבותו; <b>משפטי</b> = חוק או תקנה שכבר קיימים ומחייבים."},{"t":"exam","x":"בשאלת סיפור מתארים שינוי אחד בסביבה ושואלים לאיזה גורם הוא שייך. שאלו: האם זה כסף (E), אנשים והרגלים (S), טכנולוגיה (T), טבע (E), חוק (L), שלטון (P) או העולם (G)? וזכרו: PESTEL = <b>מאקרו</b>, מבט רחב."},{"t":"h","x":"הביקורת על מודל PESTEL"},{"t":"p","x":"ל-PESTEL יש שתי ביקורות עיקריות לפי הקורס:"},{"t":"table","head":["ביקורת","מה הבעיה","דוגמה"],"rows":[["<b>עלויות איסוף מידע גבוהות</b>","כדי לנתח 7 תחומים רחבים צריך הרבה מידע, מחקר וזמן – וזה יקר","חברה קטנה לא יכולה לממן סקרים ומחקרי שוק על כל שבעת הגורמים"],["<b>סכנה לאיבוד רלוונטיות במציאות דינמית</b>","העולם משתנה מהר. עד שהניתוח מוכן, חלק מהנתונים כבר לא נכונים","ניתוח שנעשה לפני מגפה או מלחמה מאבד את ערכו תוך שבועות"]]},{"t":"p","x":"<i>הרחבה מספרי הלימוד:</i> המודל הוא בעיקר <b>רשימה</b> – הוא לא אומר אילו גורמים חשובים יותר ומה בדיוק לעשות. לכן משלבים אותו עם כלים נוספים."},{"t":"trap","x":"הביקורת על PESTEL <b>אינה</b> ש״הוא מתעלם מהסביבה החיצונית״ – הוא בדיוק כלי לסביבה החיצונית. הביקורות בקורס: <b>עלות איסוף המידע</b> ו<b>איבוד הרלוונטיות במציאות דינמית</b>."},{"t":"exam","x":"״מהי הביקורת על מודל PESTEL?״ ← עלויות איסוף מידע גבוהות, וסכנה שהניתוח יאבד רלוונטיות כי המציאות משתנה מהר."},{"t":"h","x":"סביבת מיקרו: מודל חמשת הכוחות של פורטר"},{"t":"p","x":"אחרי המבט הרחב עוברים ל<b>סביבת המיקרו</b> – מבט <b>ממוקד יותר</b> על הענף עצמו. מודל חמשת הכוחות של פורטר <b>מעריך את האטרקטיביות של הענף ואת פוטנציאל הרווחיות בו</b>. בתרשים, היריבות הפנימית במרכז, ומסביב ארבעה כוחות שלוחצים עליה."},{"t":"table","head":["#","כוח","השאלה","דוגמה"],"rows":[["1","<b>יריבות פנימית בענף</b>","כמה קשה הקרב בין המתחרים הקיימים?","חברות הסלולר בישראל אחרי 2012 – מלחמת מחירים"],["2","<b>איום כניסת מתחרים חדשים</b>","כמה קל לחברה חדשה להיכנס לענף?","פתיחת בית קפה שכונתי – קל להיכנס"],["3","<b>איום מוצרים תחליפיים</b>","האם מוצר <b>מענף אחר</b> יכול לספק את אותו צורך?","שיחות וידאו (Zoom) במקום טיסות עסקים"],["4","<b>כוח המיקוח של הלקוחות</b>","האם הלקוחות יכולים להכתיב מחיר ותנאים?","רשת שיווק גדולה מול יצרן חומוס קטן"],["5","<b>כוח המיקוח של הספקים</b>","האם הספקים יכולים להכתיב מחיר ותנאים?","ספק שבבים יחיד מול יצרני מחשבים"]]},{"t":"example","title":"ענף חברות התעופה","x":"<b>יריבות:</b> הרבה חברות, מלחמות מחיר. <b>כניסה:</b> חברות לואו-קוסט חדשות נכנסות. <b>תחליפים:</b> רכבות מהירות באירופה ושיחות וידאו. <b>לקוחות:</b> משווים מחירים באתרים בשנייה – עלות מעבר אפסית. <b>ספקים:</b> בואינג ואיירבוס כמעט לבד, והדלק הוא חומר גלם קריטי. ← כל הכוחות חזקים, ולכן רווחיות הענף נמוכה."},{"t":"trap","x":"<b>תחליף ≠ מתחרה.</b> מוצר <b>מאותו ענף</b> (פפסי לקוקה-קולה) = יריבות פנימית (כוח 1). מוצר <b>מענף אחר</b> שעונה על אותו צורך (מים מינרליים לקולה, זום לטיסה) = תחליף (כוח 3). והשם בקורס: <b>״יריבות פנימית בענף״</b>."},{"t":"exam","x":"שאלו ״מי לוחץ על הרווח?״: המתחרים הקיימים (1), חברות שעלולות להיכנס (2), מוצר מענף אחר (3), הקונים (4) או המוכרים לנו (5). חמשת הכוחות = <b>מיקרו</b>, מבט ממוקד."},{"t":"h","x":"מה מחזק כל אחד מחמשת הכוחות"},{"t":"p","x":"לכל כוח יש גורמים שמחזקים אותו. <b>כוח חזק = רע לרווחיות</b> של החברות בענף."},{"t":"table","head":["כוח","מה מחזק אותו","למה"],"rows":[["1. <b>יריבות פנימית</b>","<b>הרבה מתחרים</b>; <b>קצב צמיחה איטי</b>; <b>חסמי יציאה גבוהים</b>; <b>עלויות מעבר נמוכות</b> ללקוח","בענף שלא צומח אפשר לגדול רק על חשבון מתחרה. חסם יציאה גבוה (ציוד ייעודי, חוזים, פיצויים) משאיר חברות חלשות שנלחמות גם בהפסד. עלות מעבר נמוכה = קל ״לגנוב״ לקוחות."],["2. <b>כניסת מתחרים חדשים</b>","<b>חסמי כניסה נמוכים</b>: השקעה נדרשת קטנה, אין <b>יתרונות לגודל</b> לחברות הקיימות, אין <b>הגבלות ממשלתיות</b>","אם קל להיכנס, כל רווח גבוה מושך חברות חדשות. חסמים גבוהים (השקעה ענקית, יתרון לגודל, רישיון) = האיום <b>חלש</b>."],["3. <b>מוצרים תחליפיים</b>","<b>זמינות</b> של תחליפים; <b>אטרקטיביות</b> שלהם (מחיר / ביצועים); <b>עלויות החלפה</b> נמוכות","אם התחליף זמין, טוב וזול, וקל לעבור אליו – הלקוחות יעברו."],["4. <b>כוח הלקוחות</b>","לקוחות <b>מרוכזים</b> (מעטים וגדולים); <b>עלויות החלפה נמוכות</b>; <b>איום באינטגרציה לאחור</b>","לקוח גדול שקל לו לעבור לספק אחר, או שיכול לייצר בעצמו, מכתיב מחיר."],["5. <b>כוח הספקים</b>","<b>ריכוזיות ספקים</b> (מעטים); <b>חומר גלם קריטי</b>; <b>איום באינטגרציה לפנים</b>","ספק יחיד של רכיב שאין לו תחליף, או ספק שיכול למכור ישר ללקוחות שלנו, מכתיב מחיר."]]},{"t":"p","x":"<b>אינטגרציה לאחור</b> = הלקוח ״חוזר אחורה״ בשרשרת ומייצר בעצמו את מה שקנה (רשת שיווק שמשיקה מותג פרטי). <b>אינטגרציה לפנים</b> = הספק ״מתקדם קדימה״ ומוכר בעצמו ללקוח הסופי (יצרן שפותח חנות אונליין משלו)."},{"t":"example","title":"איזה כוח ומה מחזק אותו?","x":"רשת הסופרמרקטים MegaMart הודיעה ליצרן הפסטה שאם לא יוריד מחיר, היא תשיק פסטה במותג פרטי ← <b>כוח הלקוחות</b>, מחוזק ב<b>איום באינטגרציה לאחור</b>. יצרנית הרחפנים SkyCam קונה מעבד מיוחד מספק אחד בעולם, והוא העלה מחיר ב-30% ← <b>כוח הספקים</b>, מחוזק ב<b>ריכוזיות</b> וב<b>חומר גלם קריטי</b>. מפעל פלדה ממשיך לפעול בהפסד כי אי אפשר למכור את התנורים הייעודיים ← <b>חסמי יציאה גבוהים</b> ← <b>יריבות</b> חזקה."},{"t":"trap","x":"הכיוונים מבלבלים: <b>חסמי כניסה גבוהים</b> = איום כניסה <b>חלש</b> = טוב לרווחיות. <b>חסמי יציאה גבוהים</b> = יריבות <b>חזקה</b> = רע לרווחיות. <b>צמיחה מהירה</b> מחלישה יריבות; <b>צמיחה איטית</b> מחזקת אותה. ו<b>לאחור = לקוחות</b>, <b>לפנים = ספקים</b>."},{"t":"exam","x":"שאלות נפוצות: ״איזה גורם מחזק את כוח הלקוחות?״ ← לקוחות מרוכזים / עלויות החלפה נמוכות / איום באינטגרציה לאחור. ״מתי איום הכניסה נמוך?״ ← השקעה גבוהה, יתרון לגודל, הגבלות ממשלתיות. ״מה מגביר את היריבות?״ ← הרבה מתחרים, צמיחה איטית, חסמי יציאה גבוהים, עלויות מעבר נמוכות."},{"t":"h","x":"רשימת המרצה: הגורמים שקובעים כל כוח"},{"t":"p","x":"בשקף של אירוע OTO-MOTORS המרצה פורט <b>לכל כוח את רשימת הגורמים שבודקים</b>. כדאי לשנן אותה – בבחינה ובחלק ג׳ צריך לנמק לפי הגורמים האלה, ולסיים כל כוח ב<b>רמה</b>: נמוך / בינוני / גבוה."},{"t":"table","head":["כוח","הגורמים שבודקים (לפי המרצה)","מתי הכוח חזק"],"rows":[["<b>כניסת מתחרים חדשים</b>","<b>חסמי כניסה</b>: (1) גודל הפירמה (יתרונות לגודל); (2) ביקוש; (3) עלות מעבר; (4) גובה ההשקעה הנדרשת; (5) יתרונות השחקנים הקיימים; (6) נגישות לערוצי הפצה; (7) הגבלות ממשלתיות; (8) אסטרטגיית בידול מוצלחת של הקיימים. ובנוסף: <b>תגובת הנגד הצפויה</b> של השחקנים הקיימים.","כשהחסמים נמוכים ואין חשש מתגובה חריפה של הקיימים. חסמים גבוהים או תגובה צפויה חריפה ← האיום <b>חלש</b>."],["<b>יריבות פנימית בענף</b>","(1) מספר המתחרים והדמיון ביניהם; (2) קצב הצמיחה בענף; (3) גובה חסמי מעבר / עלויות מעבר; (4) שביעות רצון המתחרים מהסטטוס שלהם בשוק; (5) רכישות של חברות מחוץ לענף; (6) חסמי יציאה.","הרבה מתחרים דומים, צמיחה איטית, עלויות מעבר נמוכות ללקוח, מתחרים שלא מרוצים ממעמדם ונלחמים לגדול, חברה חזקה מבחוץ שקנתה שחקן ומזרימה כסף, חסמי יציאה גבוהים."],["<b>כוח המיקוח של הלקוחות</b>","(1) סוג הלקוח (<b>B2B / B2C</b>); (2) ריכוזיות ענף הלקוחות; (3) עלויות החלפה (מה עולה ללקוח לעבור); (4) איום באמצעות <b>אינטגרציה לאחור</b>.","לקוחות עסקיים (B2B) גדולים, מעטים ומרוכזים, שקל להם לעבור ויכולים לייצר בעצמם. הרבה צרכנים פרטיים קטנים (B2C) ← בדרך כלל כוח <b>חלש</b>."],["<b>כוח המיקוח של הספקים</b>","(1) ריכוזיות ענף הספקים; (2) האם חומר הגלם <b>קריטי לשרשרת הערך של הלקוחות</b>; (3) עלויות החלפת ספק גבוהות; (4) איום באמצעות <b>אינטגרציה לפנים</b>.","מעט ספקים, רכיב קריטי, קשה ויקר להחליף ספק, והספק יכול למכור ישירות ללקוח הסופי."],["<b>מוצרים תחליפיים</b>","שלוש שאלות: (1) האם יש מוצרים תחליפיים? (2) האם התחליפיים אטרקטיביים? (3) האם הקונים יכולים להחליף בקלות?","״כן״ לשלוש השאלות ← איום <b>גבוה</b>."]]},{"t":"p","x":"שימו לב לשני הגורמים ה״חדשים״ ביריבות: <b>שביעות רצון המתחרים</b> – מתחרה שמרוצה ממקומו לא יפתח מלחמת מחירים, ומתחרה מתוסכל כן; ו<b>רכישות של חברות מחוץ לענף</b> – ענקית מענף אחר שקונה שחקן קטן מביאה כיס עמוק ומחריפה את הקרב."},{"t":"example","x":"ענף אפליקציות הכושר: <b>כניסה</b> – השקעה נדרשת קטנה, אבל לשחקנים הקיימים מותג וקהילה (בידול מוצלח) ← בינוני. <b>יריבות</b> – עשרות אפליקציות דומות, אבל הענף צומח מהר ← בינונית. <b>לקוחות</b> – B2C, מפוזרים, אבל עלות מעבר אפסית ← בינוני. <b>ספקים</b> – חנויות האפליקציות של אפל וגוגל הן כמעט ערוץ יחיד וקריטי ← גבוה. <b>תחליפים</b> – חדר כושר, ריצה, סרטוני יוטיוב בחינם – זמינים, אטרקטיביים וקל לעבור ← גבוה."},{"t":"trap","x":"<b>עלויות מעבר גבוהות</b> פועלות בכיוונים שונים לפי מי משלם אותן: עלות גבוהה ללקוח לעבור בין ספקים ← <b>מחלישה</b> את כוח הלקוחות ואת היריבות; עלות גבוהה להחליף ספק ← <b>מחזקת</b> את כוח הספקים. ו״<b>ח״ג קריטי לשרשרת הערך של הלקוחות</b>״ שייך לכוח <b>הספקים</b>, לא ללקוחות."},{"t":"exam","x":"״איזה גורם <b>אינו</b> נבדק בכוח X?״ – בדקו מול הרשימה. למשל, סוג הלקוח (B2B/B2C) שייך לכוח הלקוחות, לא לספקים; חסמי יציאה שייכים ליריבות, לא לכניסה. ובחלק ג׳: לכל כוח – 2–3 גורמים מהרשימה + עובדה מהכתבה + רמה."},{"t":"h","x":"תגובת נמר, עקומת למידה והשקעה ראשונית"},{"t":"p","x":"<b>תגובת נמר</b> (Tiger response) היא תגובה חריפה של השחקנים הקיימים לכניסת מתחרה: בעיקר <b>הורדת מחירים</b> ללקוחות, <b>גם במחיר הפסד בטווח הקצר</b>, כדי להבריח את הנכנס. כשמתחרה פוטנציאלי צופה תגובה כזו, הכניסה נראית מסוכנת – כלומר <b>חסמי הכניסה מתחזקים</b> ו<b>איום הכניסה נחלש</b>."},{"t":"p","x":"<b>עקומת הלמידה</b>: ככל שהפירמות הקיימות מייצרות יותר, הן לומדות ומורידות את <b>העלות הממוצעת ליחידה</b>. לנכנס חדש אין את הניסיון הזה. לכן הקיימות יכולות להוריד מחיר (תגובת נמר) ועדיין לשרוד. מסקנה: עקומת למידה <b>מחזקת חסמי כניסה</b> ← איום הכניסה <b>חלש יותר</b>."},{"t":"table","head":["מצב בענף","חסמי הכניסה","איום כניסת מתחרים חדשים"],"rows":[["עקומת למידה מוזילה לקיימים את העלות ליחידה","<b>גבוהים יותר</b>","<b>חלש</b> יותר"],["נדרשת השקעה ראשונית גבוהה","<b>גבוהים יותר</b>","<b>חלש</b> יותר"],["השחקנים הקיימים ידועים בתגובת נמר","<b>גבוהים יותר</b>","<b>חלש</b> יותר"],["לקיימים בידול מוצלח ולקוחות נאמנים","<b>גבוהים יותר</b>","<b>חלש</b> יותר"],["הגבלות ממשלתיות ורישיונות","<b>גבוהים יותר</b>","<b>חלש</b> יותר"],["גישה קלה לערוצי הפצה (למשל אונליין)","נמוכים יותר","<b>חזק</b> יותר"],["ללקוח אין עלות מעבר","נמוכים יותר","<b>חזק</b> יותר"]]},{"t":"example","x":"חברת לואו-קוסט חדשה, JetNova, פותחת קו לאתונה. החברה הוותיקה בקו מורידה מיד את המחיר מתחת לעלות לכמה חודשים, עד ש-JetNova נסוגה. ← <b>תגובת נמר</b>. מעכשיו כל חברה שתשקול את הקו תזכור את זה – חסם הכניסה התחזק."},{"t":"trap","x":"המילה ״חזק״ מבלבלת: <b>חסם כניסה חזק = איום כניסה חלש</b>. הטענה ״ככל שעקומת הלמידה מוזילה את העלות לקיימים, כך כוח כניסת המתחרים <b>חזק</b> יותר״ – <b>לא נכונה</b>. וגם ״ככל שנדרשת השקעה ראשונית גבוהה יותר, כך האיום חזק יותר״ – <b>לא נכונה</b>."},{"t":"exam","x":"בחלק ב׳ (נכון/לא נכון עם נימוק): ״<b>לא נכון</b>. עקומת הלמידה מאפשרת לקיימים להוזיל עלות ליחידה, ולכן הם יכולים להגיב ב<b>תגובת נמר</b> – הורדת מחיר גם בהפסד בטווח הקצר. זה מחזק את חסמי הכניסה ומחליש את איום כניסת מתחרים חדשים.״"},{"t":"h","x":"מסקנה: עוצמת הכוחות ורווחיות הענף"},{"t":"p","x":"המסקנה של המודל פשוטה, והיא מודגשת בסיכום:"},{"t":"table","head":["עוצמת הכוחות","תחרות","רווחיות","הענף"],"rows":[["<b>חזקה</b>","גבוהה","<b>נמוכה</b>","לא אטרקטיבי"],["<b>חלשה</b>","נמוכה","<b>גבוהה</b>","<b>אטרקטיבי</b>"]]},{"t":"example","title":"שני ענפים","x":"ענף חברות התעופה: יריבות קשה, לקוחות שמשווים מחירים, ספקים חזקים ← <b>רווחיות נמוכה</b>. ענף מערכות ההפעלה למחשב: מעט שחקנים, חסם כניסה ענק, ללקוח קשה לעבור ← כוחות חלשים ← <b>רווחיות גבוהה</b> (מיקרוסופט)."},{"t":"trap","x":"״כוח חזק״ נשמע טוב – אבל בחמשת הכוחות <b>כוח חזק רע</b> לחברות בענף. חזק = תחרות גבוהה = רווחיות נמוכה."},{"t":"exam","x":"״ענף שבו כל חמשת הכוחות חזקים יהיה...״ ← תחרותי עם רווחיות נמוכה. ״באיזה ענף כדאי להשקיע?״ ← בענף שבו הכוחות חלשים."},{"t":"h","x":"שרשרת המסקנה של המרצה ולמה משמשים חמשת הכוחות"},{"t":"p","x":"<b>למה משמשים חמשת הכוחות?</b> לפי המרצה: <b>לבחינת האטרקטיביות של הענף שבו פירמה פועלת או מתכוונת לפעול</b>. זה כלי לניתוח <b>הענף</b> (סביבה חיצונית, מיקרו) – לא לניתוח הסביבה הפנימית, לא לבדיקת כושר התחרות של פירמה אחת, לא לעיצוב המבנה הארגוני ולא לקביעת יעדים."},{"t":"steps","x":["מדרגים כל כוח: <b>נמוך / בינוני / גבוה</b>, עם נימוק לפי רשימת הגורמים.","מסכמים: <b>עוצמת התחרות הכוללת בענף</b> (למשל ״בינונית-נמוכה״).","ממנה גוזרים את <b>אטרקטיביות הענף</b> (בכיוון ההפוך: עוצמה נמוכה ← אטרקטיביות גבוהה).","וממנה את <b>פוטנציאל הרווחיות</b> (אטרקטיביות גבוהה ← פוטנציאל רווחיות גבוה)."],"title":"שרשרת המסקנה של המרצה"},{"t":"example","x":"ב-OTO-MOTORS: כניסה – בינוני; יריבות – בינונית; לקוחות – נמוך; ספקים – נמוך; תחליפים – גבוה. ← ״<b>עוצמת התחרות הכוללת בענף בינונית-נמוכה ← אטרקטיביות הענף גבוהה ← פוטנציאל הרווחיות גבוה</b>״."},{"t":"trap","x":"אל תהפכו את הכיוון: עוצמה <b>גבוהה</b> ← אטרקטיביות <b>נמוכה</b> ← פוטנציאל רווחיות <b>נמוך</b>. ואל תבחרו ״בדיקת כושר התחרות של פירמה מסוימת״ – המודל בודק ענף, לא חברה."},{"t":"exam","x":"״מודל חמשת הכוחות משמש ל...״ ← <b>בחינת האטרקטיביות של הענף שהפירמה פועלת בו או שוקלת להיכנס אליו</b>. ובחלק ג׳ תמיד לסיים במשפט השרשרת: עוצמה ← אטרקטיביות ← פוטנציאל רווחיות."},{"t":"h","x":"אסטרטגיית אוקיינוס כחול מול אוקיינוס אדום"},{"t":"p","x":"מה עושים כשהיריבות הפנימית בענף קשה? <b>אסטרטגיית אוקיינוס כחול</b> (Kim & Mauborgne) מציעה לא להילחם בתוך ״<b>האוקיינוס האדום</b>״ – שוק קיים וצפוף שהמים בו אדומים מ״דם״ התחרות – אלא ליצור <b>נישת שוק חדשה ללא מתחרים</b>."},{"t":"table","head":["אוקיינוס אדום (Red Ocean)","אוקיינוס כחול (Blue Ocean)"],"rows":[["להתחרות <b>בשוק הקיים</b>","ליצור <b>נישת שוק ללא מתחרים</b>"],["<b>לנצח</b> את המתחרים","להפוך את המתחרים ל<b>לא רלוונטיים</b>"],["לנצל את <b>הביקוש הקיים</b>","ליצור וללכוד <b>ביקוש חדש</b>"],["לבצע <b>שקלול תמורות</b> בין ערך לעלות","<b>לשבור</b> את שקלול התמורות בין ערך לעלות"]]},{"t":"p","x":"מה זה ״שקלול תמורות בין ערך לעלות״? באוקיינוס האדום צריך לבחור: או <b>ערך גבוה</b> ללקוח (וזה עולה יותר), או <b>עלות נמוכה</b> (ואז נותנים פחות). באוקיינוס הכחול <b>שוברים</b> את הבחירה: מורידים עלות ובו זמנית מעלים ערך. זה נקרא <b>חדשנות ערך</b> (Value Innovation)."},{"t":"example","title":"Cirque du Soleil","x":"ענף הקרקס היה אוקיינוס אדום: קהל מצטמצם, כוכבים יקרים, ביקורת על אילוף חיות. סירק דו סוליי לא ניסתה להיות ״קרקס טוב יותר״. היא חיברה קרקס ותיאטרון ויצרה מופע לקהל מבוגר ועשיר שבכלל לא הלך לקרקס – <b>ביקוש חדש</b>, בלי מתחרים ישירים, במחיר גבוה ובעלות נמוכה (בלי חיות ובלי כוכבים)."},{"t":"trap","x":"אוקיינוס כחול <b>אינו</b> ״מוצר קצת יותר טוב בשוק הקיים״ ואינו ״להוריד מחיר מהמתחרים״ – אלה מהלכים של אוקיינוס אדום. הכחול <b>יוצר ביקוש חדש</b> ו<b>הופך את התחרות ללא רלוונטית</b>. והוא נולד כתשובה ל<b>יריבות פנימית קשה</b>."},{"t":"exam","x":"״החברה יצרה קטגוריה חדשה, משכה לקוחות שלא קנו בכלל בענף, ואין לה מתחרים ישירים״ ← <b>אוקיינוס כחול</b>. ״החברה מורידה מחיר כדי לגנוב נתח שוק מהמתחרה הגדול״ ← <b>אוקיינוס אדום</b>."},{"t":"h","x":"מטריצת 4 הפעולות (ERRC)"},{"t":"p","x":"איך בונים אוקיינוס כחול בפועל? בעזרת <b>מטריצת 4 הפעולות (ERRC)</b>. עוברים על הגורמים שהענף מתחרה עליהם ושואלים ארבע שאלות:"},{"t":"table","head":["פעולה","השאלה","מה זה עושה","בסירק דו סוליי"],"rows":[["<b>ביטול</b> (Eliminate)","אילו גורמים שהענף רואה כמובנים מאליהם <b>לבטל לגמרי</b>?","מוריד עלות","מופעי חיות, כוכבי קרקס"],["<b>צמצום</b> (Reduce)","אילו גורמים להוריד <b>מתחת לרמה המקובלת</b> בענף?","מוריד עלות","הומור גס, מופעי סכנה"],["<b>הגבהה</b> (Raise)","אילו גורמים להעלות <b>מעל לרמה המקובלת</b> בענף?","מעלה ערך","אולם ייחודי ונוח"],["<b>יצירה</b> (Create)","אילו גורמים <b>שהענף מעולם לא הציע</b> ליצור?","מעלה ערך ויוצר ביקוש חדש","עלילה ונושא, מוזיקה וריקוד אמנותיים"]]},{"t":"p","x":"ביטול וצמצום <b>מורידים את העלות</b>; הגבהה ויצירה <b>מעלות את הערך</b>. ביחד הם שוברים את שקלול התמורות בין ערך לעלות."},{"t":"example","title":"ERRC לחדר כושר","x":"רשת FitLite: <b>ביטול</b> – בריכה וסאונה. <b>צמצום</b> – מספר המכשירים המיוחדים. <b>הגבהה</b> – ניקיון ושעות פתיחה (24/7). <b>יצירה</b> – אפליקציה עם מאמן וירטואלי ואווירה ״בלי שיפוטיות״ למתחילים. התוצאה: מנוי זול מאוד, שמושך אנשים שמעולם לא היו בחדר כושר."},{"t":"trap","x":"<b>ביטול ≠ צמצום</b>: ביטול = מורידים לגמרי; צמצום = משאירים, אבל פחות מהמקובל. <b>הגבהה ≠ יצירה</b>: הגבהה = גורם שכבר קיים בענף, ברמה גבוהה יותר; יצירה = גורם <b>חדש</b> שלא היה בענף בכלל."},{"t":"exam","x":"בשאלה יתארו פעולה אחת ויבקשו לסווג: ״הפסיקו לגמרי״ ← ביטול. ״פחות מהמתחרים״ ← צמצום. ״יותר מכל המתחרים״ ← הגבהה. ״לראשונה בענף״ ← יצירה."},{"t":"h","x":"מאפייני אוקיינוס כחול: איך מזהים אותו בכתבה"},{"t":"p","x":"בחלק ג׳ של הבחינה מופיעה כתבה, ושואלים: ״X טוען שהחברה יצרה אוקיינוס כחול. האם צודק? נמק תוך הסבר המאפיינים״. צריך לפרט את <b>ארבעת המאפיינים</b> ולבדוק כל אחד מול הכתבה:"},{"t":"table","head":["מאפיין של אוקיינוס כחול","מה מחפשים בכתבה"],"rows":[["<b>יצירת נישת שוק ללא מתחרים</b> (״מרחב תחרותי חדש״)","שוק חדש שהמתחרים הקיימים לא פנו אליו"],["<b>הפיכת המתחרים ללא רלוונטיים</b>","אין ״קרב ראש בראש״; המתחרים הוותיקים לא בתמונה"],["<b>יצירה ולכידה של ביקוש חדש</b>","לקוחות חדשים, או שימוש חדש שלא היה קודם"],["<b>שבירת שקלול התמורות בין ערך לעלות</b>","יותר ערך ללקוח ובו בזמן עלות נמוכה"]]},{"t":"p","x":"קשור לזה: <b>אפשר להשיג יתרון תחרותי בלי הוזלה משמעותית בעלויות</b> – דרך <b>תועלת ייחודית</b> ללקוח (איכות, שירות, זמינות, חדשנות) או דרך <b>אוקיינוס כחול</b>. לכן הטענה ״אין יתרון תחרותי בלי הוזלה משמעותית בעלויות״ – לא נכונה."},{"t":"example","x":"הכתבה על <b>הקינדל</b> של אמזון מדגישה ש״יצר מרחב תחרותי חדש״: מכשיר קריאה + חנות ספרים דיגיטלית + הורדה תוך שניות. זה שוק שהמו״לים וחנויות הספרים לא פנו אליו (נישה ללא מתחרים), הוא יצר ביקוש חדש לקריאה דיגיטלית, וחנויות הספרים הפכו לפחות רלוונטיות לקוראים האלה. ← טענה ״הקינדל = אוקיינוס כחול״ <b>מוצדקת</b>. אבל זהירות: האם הוא גם <b>חדשנות משבשת</b>? לפי המרצה – <b>עדיין לא</b>: אמזון מחזיקה כ-80% מהספרים הדיגיטליים, אבל הם צפויים להגיע רק ל-32.1% משוק הספרים ב-2027 – הדפוס עדיין דומיננטי (פחות מ-50% מהלקוחות עברו).","title":"הקינדל (חלק ג׳ במבחן לדוגמה)"},{"t":"trap","x":"אוקיינוס כחול ≠ חדשנות משבשת. אותו מוצר יכול ליצור אוקיינוס כחול (שוק חדש) ועדיין לא להיות משבש (רוב הלקוחות לא עברו). ואל תכתבו רק ״כן, זה אוקיינוס כחול״ – כל מאפיין צריך עובדה מהכתבה."},{"t":"exam","x":"תבנית תשובה: ״<b>צודק</b>. אוקיינוס כחול מאופיין ב: (1) יצירת נישת שוק ללא מתחרים; (2) הפיכת המתחרים ללא רלוונטיים; (3) יצירה ולכידה של ביקוש חדש; (4) שבירת שקלול התמורות בין ערך לעלות. בכתבה: [עובדה לכל מאפיין]. לכן...״"},{"t":"h","x":"מיפוי קבוצות אסטרטגיות"},{"t":"p","x":"<b>קבוצה אסטרטגית</b> היא קבוצת חברות בענף שנוקטות גישה תחרותית דומה. <b>מיפוי קבוצות אסטרטגיות</b> הוא כלי לניתוח מתחרים: ממקמים את החברות על מפה לפי <b>שני ממדים מבדילים</b> (למשל <b>מחיר מול איכות</b>, או <b>מגוון דגמים</b>), כדי להבין את <b>המיצוב התחרותי</b> ואת <b>האפשרויות לעבור בין קבוצות</b>."},{"t":"steps","title":"איך מכינים מפה","x":["בוחרים שני מאפיינים שמבדילים בין החברות בענף (מחיר, איכות, מגוון מוצרים, כיסוי גיאוגרפי, ערוצי הפצה).","עדיף ממדים שאינם תלויים זה בזה (לא ״מחיר״ ו״יוקרה״ שהולכים תמיד יחד).","ממקמים כל חברה על המפה.","מקיפים בעיגול חברות שקרובות זו לזו – כל עיגול הוא קבוצה אסטרטגית.","גודל העיגול יכול לשקף את נתח המכירות של הקבוצה."]},{"t":"list","x":["<b>המתחרים הקרובים</b> ביותר הם אלה שבאותה קבוצה.","רואים את <b>המיצוב</b> של החברה ביחס לאחרות.","בודקים אם אפשר וכדאי <b>לעבור לקבוצה אחרת</b>, ומה מקשה על המעבר.","מקום ריק במפה יכול להיות הזדמנות (או סימן שאין שם ביקוש)."]},{"t":"example","title":"ענף הרכב","x":"ציר אנכי: מחיר / ביצועים / מוניטין; ציר אופקי: מגוון דגמים (כמו במפה של המרצה). <b>פורשה</b> – גבוה מאוד, מגוון צר. <b>מרצדס ו-BMW</b> – גבוה, מגוון צר-בינוני. <b>טויוטה</b> – בינוני, מגוון בינוני. <b>ג׳נרל מוטורס ופורד</b> – נמוך-בינוני, מגוון רחב. <b>הונדאי וסוזוקי</b> – נמוך, מגוון צר. המסקנה: הונדאי מתחרה בעיקר בסוזוקי (אותו עיגול), לא בפורשה."},{"t":"trap","x":"שני הצירים הם <b>ממדים מבדילים</b> בין החברות – לא ״רווח״ ולא ״חמשת הכוחות״. וחברות בקבוצות שונות <b>אינן</b> המתחרות הקרובות ביותר זו לזו."},{"t":"exam","x":"״החברה מיפתה את המתחרים לפי מחיר ומגוון מוצרים כדי לראות מי הכי קרוב אליה ואם כדאי לה לעבור לסגמנט אחר״ ← <b>מיפוי קבוצות אסטרטגיות</b>."},{"t":"h","x":"כללי המרצה למיפוי ומפת ענף הרכב"},{"t":"p","x":"המרצה מדגיש כמה כללים טכניים למפה. אותם שואלים בשאלות ״מה <b>אינו</b> נכון לגבי מיפוי קבוצות אסטרטגיות״:"},{"t":"table","head":["כלל","נכון?","הסבר"],"rows":[["<b>גודל העיגול</b> משקף את חלקה של הקבוצה בהכנסות הענף","<b>נכון</b>","עיגול גדול = קבוצה עם נתח גדול מהמכירות בענף"],["<b>המתאם בין שני הצירים צריך להיות נמוך</b>","<b>נכון</b>","אם שני המשתנים ״הולכים יחד״ (מחיר ויוקרה), כל החברות יישבו על אלכסון אחד והמפה לא תלמד כלום"],["״<b>נשאף להשתמש במשתנה רציף</b>״","<b>לא נכון</b>","המשתנים <b>לא חייבים להיות רציפים</b>: אפשר ציר כמו ״מגוון דגמים: צר / רחב״ או סוג ערוץ הפצה"],["<b>המרחק בין העיגולים</b> מעיד על עוצמת התחרות בין הקבוצות","<b>נכון</b>","קבוצות קרובות במפה מתחרות זו בזו יותר מקבוצות רחוקות"]]},{"t":"p","x":"<b>מפת ענף הרכב של המרצה</b>: ציר אנכי – <b>מחיר / ביצועים / מוניטין</b> (נמוך ← גבוה); ציר אופקי – <b>מגוון דגמים</b> (צר ← רחב)."},{"t":"table","head":["קבוצה (עיגול)","מחיר / ביצועים / מוניטין","מגוון דגמים"],"rows":[["פורשה","גבוה מאוד","צר"],["BMW, מרצדס","גבוה","צר-בינוני"],["פולקסווגן, הונדה","בינוני","צר-בינוני"],["טויוטה","בינוני","בינוני"],["סובארו","בינוני-נמוך","בינוני-רחב"],["ניסאן, קרייזלר, מאזדה","נמוך","בינוני"],["הונדאי, סוזוקי","נמוך","צר"],["ג׳נרל מוטורס, פורד (העיגול הגדול ביותר)","נמוך-בינוני","רחב"]]},{"t":"p","x":"שימו לב: מחיר, ביצועים ומוניטין הולכים יחד – ולכן המרצה שם אותם <b>על אותו ציר</b>. הציר השני (מגוון דגמים) בלתי תלוי בו – כך נשמר מתאם נמוך בין הצירים."},{"t":"example","x":"קריאת המפה: המתחרה הקרוב ביותר של הונדאי הוא <b>סוזוקי</b> (אותו עיגול), לא פורשה. GM ופורד הן הקבוצה עם <b>החלק הגדול ביותר מהכנסות הענף</b> (העיגול הגדול). פורשה רחוקה מכולם – התחרות שלה עם GM חלשה."},{"t":"trap","x":"המשפט ״נשאף להשתמש במשתנה רציף״ הוא <b>הטענה השגויה</b> בשאלות המרצה. והטענות על גודל העיגול (הכנסות) ועל מתאם נמוך בין הצירים – <b>נכונות</b>."},{"t":"exam","x":"״מה <b>אינו</b> נכון לגבי מיפוי קבוצות אסטרטגיות?״ ← ״<b>נשאף להשתמש במשתנה רציף</b>״. סיפור עם מפת רכבים: מי המתחרה הקרוב? ← מי שבאותו עיגול."},{"t":"h","x":"תחרות בתוך קבוצה מול תחרות בין קבוצות"},{"t":"p","x":"<b>התחרות בתוך קבוצה אסטרטגית חריפה יותר מהתחרות בין קבוצות אסטרטגיות.</b> בתוך הקבוצה החברות פונות לאותם לקוחות, באותה גישה, עם מוצרים כמעט זהים – הלקוח משווה ביניהן ישירות."},{"t":"table","head":["","בתוך הקבוצה","בין קבוצות"],"rows":[["לקוחות","אותם לקוחות","פלחים שונים"],["מוצרים","תחליפים קרובים מאוד","שונים במחיר / במגוון / באיכות"],["עוצמת התחרות","<b>חריפה יותר</b>","חלשה יותר – ונחלשת ככל שהעיגולים רחוקים"],["מעבר","—","קשה בגלל <b>חסמי ניידות</b> (מותג, טכנולוגיה, רשת הפצה)"]]},{"t":"example","x":"הונדאי וסוזוקי (אותו עיגול) נלחמות על אותו קונה של רכב קטן וזול – כל הנחה של אחת מורגשת מיד אצל השנייה. פורשה לא מרגישה את ההנחה הזו בכלל."},{"t":"trap","x":"התשובות ״התחרות בתוך הקבוצה חלשה מאוד״, ״זהה לתחרות בין הקבוצות״ או ״לא משפיעה על רווחיות הענף״ – <b>שגויות</b>. הנכונה: <b>חריפה יותר</b> מאשר בין הקבוצות."},{"t":"exam","x":"״התחרות בתוך הקבוצות האסטרטגיות היא...״ ← <b>חריפה יותר מאשר התחרות בין הקבוצות</b>."},{"t":"h","x":"גורמי מפתח להצלחה בענף (KSF)"},{"t":"p","x":"<b>גורמי מפתח להצלחה (Key Success Factors – KSF)</b> הם אלמנטים, יכולות או תנאים <b>קריטיים</b> שכל חברה בענף חייבת להיות טובה בהם כדי לשגשג ולנצח את המתחרים <b>בענף שבו היא פועלת</b>. הם נקבעים בדרך כלל לפי <b>תנאי השוק</b>, <b>דרישות הענף</b> ו<b>דרישות הלקוחות</b>."},{"t":"table","head":["מאפיין","מה זה אומר","דוגמה"],"rows":[["1. <b>מוכתבים מבחוץ</b>","<b>השוק והלקוחות</b> קובעים מה הם גורמי ההצלחה – לא הארגון עצמו","בענף משלוחי האוכל הלקוחות דורשים מהירות. גם אם החברה מצוינת בעיצוב אריזות – זה לא KSF"],["2. <b>מיקוד אסטרטגי</b>","מגדירים רק <b>3 עד 4</b> גורמי מפתח מרכזיים, כדי <b>לא לפזר</b> את המשאבים","חברת תעופה: בטיחות, דיוק בזמנים, עלות נמוכה לנוסע"],["3. <b>משתנים עם הזמן</b>","ה-KSF יכולים להשתנות בגלל <b>טכנולוגיה</b>, <b>רגולציה</b> או <b>שינוי בהעדפות הצרכנים</b>","בטלפונים: פעם – עמידות וסוללה (נוקיה); היום – מערכת הפעלה, אפליקציות ומצלמה"]]},{"t":"example","title":"KSF בכמה ענפים","x":"<b>סופרמרקטים:</b> מחיר נמוך, מיקום נוח, ניהול מלאי. <b>אופנה מהירה:</b> מהירות מעיצוב למדף, מעקב אחר טרנדים. <b>תרופות:</b> מו״פ, פטנטים, אישורי רגולציה. בכל ענף כל השחקנים צריכים להיות טובים באותם 3–4 גורמים ולהצטיין לפחות באחד – מי שלא, נשאר מאחור."},{"t":"trap","x":"KSF הם של <b>הענף</b> – כל החברות בו צריכות לעמוד בהם. הם <b>לא</b> נקבעים על ידי ההנהלה לפי החוזקות שלה, ו<b>לא</b> כוללים 10–15 גורמים. הם גם לא קבועים לתמיד."},{"t":"exam","x":"״לפי מה נקבעים ה-KSF?״ ← תנאי השוק, דרישות הענף ודרישות הלקוחות (מבחוץ). ״כמה KSF מומלץ להגדיר?״ ← 3–4. ״מה קרה ל-KSF בענף הטלפונים אחרי האייפון?״ ← הם השתנו עם הזמן (טכנולוגיה, העדפות)."},{"t":"h","x":"KSF לפי המרצה: 3–4 גורמים, להצטיין לפחות באחד"},{"t":"p","x":"ההגדרה של המרצה: KSF מגדירים את <b>תחומי הפעילות החשובים לפירמות בענף כדי להצליח לאורך זמן</b>. ארבעה דברים לזכור:"},{"t":"list","x":["<b>לכל ענף 3–4 KSF</b> – לא יותר.","הם <b>עשויים להשתנות מעת לעת</b> (טכנולוגיה, רגולציה, טעמי לקוחות).","כל פירמה בענף צריכה להיות <b>טובה בכל ה-KSF</b> ו<b>להצטיין בלפחות KSF אחד</b> – כך נהנים מ<b>יתרון תחרותי בר-קיימא</b>.","KSF <b>אינם</b> מגוון המוצרים או השירותים של הפירמה. הם מה שחייבים להצליח בו, לא מה שמוכרים."]},{"t":"example","x":"בענף הקריפטו (אירוע OTO-MOTORS) ה-KSF לפי המרצה: <b>אבטחת מידע</b>, <b>חדשנות טכנולוגית</b>, <b>התאמה לרגולציה</b> – שלושה גורמים. בורסת קריפטו שמצוינת באבטחה אבל לא עומדת ברגולציה תיסגר; זו שטובה בשלושתם ומצטיינת באבטחה – תיהנה מיתרון בר-קיימא."},{"t":"trap","x":"הטענה ״KSF מגדירים את מגוון המוצרים / השירותים שהפירמה עושה בענף״ – <b>לא נכונה</b>. גם ״להצטיין בכל ה-KSF״ אינו הדרישה: צריך להיות <b>טוב בכולם</b> ו<b>מצטיין באחד לפחות</b>."},{"t":"exam","x":"בחלק ב׳: ״<b>לא נכון</b>. KSF מגדירים את תחומי הפעילות החשובים לפירמות בענף כדי להצליח לאורך זמן; לכל ענף 3–4 KSF, והם משתנים מעת לעת. על כל פירמה להיות טובה בכולם ולהצטיין לפחות באחד כדי ליהנות מיתרון תחרותי בר-קיימא.״"},{"t":"h","x":"איך פותרים שאלת סיפור ביחידה 2"},{"t":"steps","title":"מילות מפתח ← מודל","x":["״קבוצת חברות שמוכרות תחליפים קרובים״ ← הגדרת ענף. ״קבוצת קונים״ ← שוק.","שינוי כללי בעולם (ריבית, חוק, טרנד, אקלים, טכנולוגיה) ← PESTEL(G), מאקרו.","״עלות איסוף מידע / מאבד רלוונטיות״ ← הביקורת על PESTEL.","מתחרים, נכנסים חדשים, תחליפים, לקוחות, ספקים ← חמשת הכוחות, מיקרו.","כוחות חזקים ← רווחיות נמוכה; כוחות חלשים ← ענף אטרקטיבי.","״יצרו שוק חדש בלי מתחרים״ ← אוקיינוס כחול. ״לנצח את המתחרים בשוק הקיים״ ← אוקיינוס אדום.","ביטלו / צמצמו / הגביהו / יצרו ← ERRC.","״מפה עם שני צירים של מתחרים״ ← מיפוי קבוצות אסטרטגיות.","״מה חייבים להצטיין בו כדי להצליח בענף״ ← KSF."]}],"cheat":["ענף = חברות שמוכרות תחליפים קרובים (מוכרים); שוק = הקונים","PESTEL(G) = 7 כוחות מאקרו, G = גלובליזציה; ביקורת = עלות איסוף מידע + איבוד רלוונטיות","חמשת הכוחות = בוחן את אטרקטיביות הענף שבו פועלים או ששוקלים להיכנס אליו (לא פירמה אחת)","שרשרת המרצה = עוצמת הכוחות ← אטרקטיביות הענף ← פוטנציאל רווחיות (עוצמה גבוהה = רווחיות נמוכה)","חסם כניסה גבוה = איום כניסה חלש; עקומת למידה או השקעה ראשונית גבוהה ← איום <b>חלש</b> יותר","תגובת נמר = הקיימים מורידים מחיר, גם בהפסד בטווח הקצר, כדי להבריח נכנס ← מחזקת חסמי כניסה","יריבות חזקה = הרבה מתחרים דומים, צמיחה איטית, עלויות מעבר נמוכות, מתחרים לא מרוצים, רכישות מבחוץ, חסמי יציאה גבוהים","לקוחות חזקים = B2B, מרוכזים, עלות החלפה נמוכה, אינטגרציה לאחור; ספקים חזקים = מרוכזים, ח״ג קריטי, אינטגרציה לפנים","אוקיינוס כחול = נישה בלי מתחרים, מתחרים לא רלוונטיים, ביקוש חדש, שבירת ערך-עלות; ERRC = ביטול, צמצום, הגבהה, יצירה","Kindle = אוקיינוס כחול (״מרחב תחרותי חדש״) – אבל עדיין <b>לא</b> חדשנות משבשת","קבוצות אסטרטגיות = עיגול = חלק מהכנסות הענף; צירים במתאם נמוך; לא חייבים משתנה רציף; התחרות בתוך קבוצה חריפה יותר","KSF (המרצה) = 3–4 לענף, משתנים מעת לעת; טובים בכולם + מצטיינים לפחות באחד; לא סל המוצרים"],"mcq":[{"id":"m2-1","q":"לפי הקורס, מהו <b>ענף</b>?","o":["קבוצת הלקוחות שקונים מוצר מסוים","קבוצת פירמות המציעות מוצרים או שירותים שהם תחליפים קרובים עבור קבוצת לקוחות","כל החברות במשק שיש להן אותו מספר עובדים","קבוצת חברות שמשתמשות באותם ספקים"],"a":1,"w":["זו הגדרה של שוק, לא של ענף.","","ענף מוגדר לפי תחליפיות של מוצרים, לא לפי גודל.","ענף מוגדר לפי מה שהחברות מוכרות ללקוחות, לא לפי הספקים."],"why":"ענף = צד המוכרים: חברות שמציעות תחליפים קרובים לאותה קבוצת לקוחות."},{"id":"m2-2","q":"״כל הסטודנטים בישראל שמחפשים מחשב נייד זול ללימודים״. מה זה מתאר?","o":["שוק","ענף","קבוצה אסטרטגית","KSF"],"a":0,"w":["","ענף הוא קבוצת חברות מוכרות; כאן מתוארת קבוצת קונים.","קבוצה אסטרטגית היא קבוצת חברות עם אסטרטגיה דומה.","KSF הוא גורם שחייבים להצטיין בו, לא קבוצת אנשים."],"why":"קבוצת לקוחות / קונים = שוק. הקורס מבחין בין ענף (מוכרים) לשוק (קונים)."},{"id":"m2-3","q":"בנק ישראל העלה את הריבית, ומספר המשכנתאות החדשות ירד. לאיזה גורם ב-PESTEL(G) שייך השינוי?","o":["P – פוליטי","E – כלכלי (Economical)","E – סביבתי","L – משפטי"],"a":1,"w":["ריבית היא משתנה כלכלי, לא החלטה פוליטית של השלטון.","","סביבתי עוסק באקלים וזיהום.","לא נחקק כאן חוק."],"why":"ריבית, אינפלציה ושער חליפין שייכים לגורם הכלכלי."},{"id":"m2-4","q":"גלי חום ובצורת פגעו ביבולי הקפה בברזיל, ומחיר פולי הקפה עלה. לאיזה גורם ב-PESTEL(G) שייך האירוע?","o":["E – כלכלי","E – סביבתי (Environmental)","S – חברתי","T – טכנולוגי"],"a":1,"w":["המחיר עלה, אבל הסיבה היא אקלים – גורם סביבתי.","","זה לא שינוי בהרגלי אנשים.","אין כאן טכנולוגיה."],"why":"אקלים, בצורת וזיהום הם גורמים סביבתיים."},{"id":"m2-5","q":"נכנס לתוקף חוק שאוסר למכור משקאות אנרגיה לבני פחות מ-18. לאיזה גורם ב-PESTEL(G) זה שייך?","o":["L – משפטי (Legal)","P – פוליטי","S – חברתי","G – גלובלי"],"a":0,"w":["","פוליטי הוא מדיניות ויציבות שלטונית; חוק מחייב שכבר בתוקף הוא משפטי.","זה לא טרנד של צרכנים אלא חוק.","זה חוק מקומי, לא תהליך עולמי."],"why":"חוקים, תקנות ורגולציה שחלים על הענף = גורם משפטי."},{"id":"m2-6","q":"טרנד הטבעונות מתחזק, ויותר צרכנים קונים תחליפי בשר. לאיזה גורם ב-PESTEL(G) שייך השינוי?","o":["S – חברתי (Social)","T – טכנולוגי","E – כלכלי","L – משפטי"],"a":0,"w":["","השינוי הוא בהרגלים ובערכים של אנשים, לא בטכנולוגיה.","אין כאן ריבית, מחירים או צמיחה.","אין כאן חוק."],"why":"טרנדים, אורח חיים וערכים של אנשים = גורם חברתי."},{"id":"m2-7","q":"חנויות אופנה ישראליות מאבדות לקוחות לאתרי קניות סיניים שמוכרים בזול ושולחים ישר הביתה. איזה גורם ב-PESTEL(G) מתאר זאת בצורה הטובה ביותר?","o":["P – פוליטי","E – סביבתי","G – גלובלי (Globalization)","S – חברתי"],"a":2,"w":["אין כאן החלטה פוליטית.","אין כאן אקלים או זיהום.","","העיקר כאן הוא פתיחת השוק לתחרות מחו״ל, לא טרנד חברתי."],"why":"תחרות מחו״ל ושרשראות אספקה עולמיות = גלובליזציה (G)."},{"id":"m2-8","q":"מהי הביקורת על מודל PESTEL לפי הקורס?","o":["הוא מתעלם לגמרי מהסביבה החיצונית","הוא בודק רק את המתחרים הישירים","עלויות איסוף מידע גבוהות וסכנה שהניתוח יאבד רלוונטיות במציאות דינמית","הוא מתאים רק לחברות ללא מטרות רווח"],"a":2,"w":["PESTEL הוא בדיוק כלי לסביבה החיצונית.","את המתחרים בודקים בחמשת הכוחות; PESTEL רחב יותר.","","אין ביקורת כזו."],"why":"שתי הביקורות: איסוף המידע יקר, והעולם משתנה מהר כך שהניתוח מתיישן."},{"id":"m2-9","q":"בענף מכוני הכושר בעיר כמעט אין צמיחה במספר המתאמנים, ויש בו הרבה מכונים. מה צפוי לקרות ליריבות הפנימית?","o":["היא תהיה חלשה, כי השוק יציב","היא תהיה חזקה, כי אפשר לגדול רק על חשבון מתחרים","היא לא תושפע, כי היריבות תלויה רק בספקים","היא תיעלם, כי חברות חדשות ייכנסו"],"a":1,"w":["צמיחה איטית מחזקת את היריבות, לא מחלישה.","","היריבות מושפעת ממספר המתחרים ומקצב הצמיחה.","כניסה של חברות רק תגביר את היריבות."],"why":"הרבה מתחרים + צמיחה איטית = יריבות פנימית חזקה."},{"id":"m2-10","q":"מפעל פלדה ממשיך לפעול שנים בהפסד, כי את התנורים הייעודיים שלו אי אפשר למכור והוא מחויב בחוזים לעובדים. מה מתאר הסיפור ומה ההשפעה?","o":["חסמי יציאה גבוהים, שמחזקים את היריבות הפנימית בענף","חסמי כניסה גבוהים, שמחלישים את איום הכניסה","כוח ספקים חזק","חסמי יציאה גבוהים, שמחלישים את היריבות"],"a":0,"w":["","הסיפור עוסק בקושי לצאת מהענף, לא להיכנס אליו.","אין כאן ספק שמכתיב מחיר.","חסמי יציאה גבוהים משאירים חברות שנלחמות – היריבות מתחזקת."],"why":"כשקשה לצאת, גם חברות מפסידות נשארות ונלחמות – היריבות חזקה יותר."},{"id":"m2-11","q":"כדי להיכנס לענף ייצור השבבים צריך להשקיע מיליארדי דולרים במפעל, ולחברות הקיימות יש יתרון לגודל עצום. מה נכון לגבי איום הכניסה?","o":["האיום חלש, כי חסמי הכניסה גבוהים","האיום חזק, כי הענף רווחי","האיום חזק, כי יתרון לגודל מעודד כניסה","אין קשר בין גובה ההשקעה לאיום הכניסה"],"a":0,"w":["","רווחיות מושכת, אבל חסמים גבוהים עוצרים כניסה.","יתרון לגודל של הקיימים הוא חסם כניסה – מחליש את האיום.","גובה ההשקעה הנדרשת הוא אחד הגורמים שקובעים את האיום."],"why":"השקעה גבוהה + יתרון לגודל = חסמי כניסה גבוהים = איום כניסה חלש."},{"id":"m2-12","q":"כדי להפעיל קו אוטובוסים בין-עירוני צריך רישיון מיוחד ממשרד התחבורה, ומספר הרישיונות מוגבל. איך זה משפיע על חמשת הכוחות?","o":["מחזק את איום התחליפים","מחזק את כוח הלקוחות","מחזק את איום כניסת מתחרים חדשים","מחליש את איום כניסת מתחרים חדשים"],"a":3,"w":["הרישיון לא משפיע על מוצרים מענף אחר.","הגבלת כניסה לא נותנת ללקוחות יותר כוח.","הגבלה ממשלתית היא חסם – היא מחלישה את האיום.",""],"why":"הגבלות ממשלתיות הן חסם כניסה ולכן מחלישות את איום הכניסה."},{"id":"m2-13","q":"חברות התעופה מאבדות נוסעים עסקיים, כי חברות רבות עוברות לפגישות בזום. איזה כוח מתחזק?","o":["יריבות פנימית בענף","איום מוצרים תחליפיים","איום כניסת מתחרים חדשים","כוח המיקוח של הספקים"],"a":1,"w":["זום אינו חברת תעופה – הוא מענף אחר.","","זום לא נכנס לענף התעופה.","זום אינו ספק של חברות התעופה."],"why":"מוצר מענף אחר שעונה על אותו צורך (פגישה) = תחליף."},{"id":"m2-14","q":"רשת הסופרמרקטים MegaMart מאיימת על יצרן הפסטה: ״אם לא תוריד מחיר, נשיק פסטה במותג פרטי משלנו״. איזה כוח מתואר?","o":["כוח המיקוח של הספקים – איום באינטגרציה לפנים","איום כניסת מתחרים חדשים","כוח המיקוח של הלקוחות – איום באינטגרציה לאחור","איום מוצרים תחליפיים"],"a":2,"w":["הרשת היא הלקוחה של היצרן, לא הספקית שלו.","העיקר הוא כוח המיקוח של לקוח גדול שמאיים לייצר בעצמו.","","פסטה במותג פרטי היא אותו מוצר, והאיום הוא של הלקוח עצמו."],"why":"לקוח שמאיים לייצר בעצמו את מה שקנה = אינטגרציה לאחור, שמחזקת את כוח הלקוחות."},{"id":"m2-15","q":"יצרנית הרחפנים SkyCam קונה מעבד מיוחד מספק אחד בעולם, ואין לו תחליף. הספק העלה מחיר ב-30%. איזה כוח חזק כאן ולמה?","o":["כוח הלקוחות – לקוחות מרוכזים","יריבות פנימית – הרבה מתחרים","כוח הספקים – ריכוזיות ספקים וחומר גלם קריטי","כוח הספקים – איום באינטגרציה לאחור"],"a":2,"w":["SkyCam היא הלקוחה, והיא חלשה כאן.","הסיפור עוסק בספק, לא במתחרים.","","אינטגרציה לאחור קשורה ללקוחות; ואין כאן איום כזה."],"why":"ספק יחיד (ריכוזיות) של רכיב קריטי שאין לו תחליף = כוח ספקים חזק."},{"id":"m2-16","q":"יצרנית נעלי הספורט StrideX, שמכרה עד היום רק דרך חנויות, פתחה אתר שמוכר ישירות לצרכנים. מבחינת החנויות, מה מחזק את כוחו של הספק?","o":["איום באינטגרציה לאחור","איום באינטגרציה לפנים","עלויות מעבר נמוכות של החנויות","ריבוי ספקים בענף"],"a":1,"w":["לאחור = הלקוח מייצר בעצמו. כאן הספק מתקדם לכיוון הצרכן.","","זה דווקא היה מחליש את הספק.","ריבוי ספקים מחליש את כוחם."],"why":"ספק שמוכר בעצמו ללקוח הסופי = אינטגרציה לפנים, שמחזקת את כוח הספקים."},{"id":"m2-17","q":"איזה מהבאים <b>מחזק</b> את כוח המיקוח של הלקוחות?","o":["יש אלפי לקוחות קטנים ומפוזרים","ללקוחות יש עלויות החלפה גבוהות","המוצר ייחודי ואין לו תחליף","הלקוחות מעטים וגדולים, וקל להם לעבור לספק אחר"],"a":3,"w":["לקוחות מפוזרים חלשים מול הספק.","עלות החלפה גבוהה קושרת את הלקוח – מחלישה אותו.","מוצר ייחודי מחליש את הלקוח.",""],"why":"לקוחות מרוכזים + עלויות החלפה נמוכות = כוח לקוחות חזק."},{"id":"m2-18","q":"ענף שבו כל חמשת הכוחות חזקים יהיה בדרך כלל:","o":["ענף אטרקטיבי עם רווחיות גבוהה","ענף עם תחרות נמוכה","ענף עם תחרות גבוהה ורווחיות נמוכה","ענף שבו אין חשיבות לחמשת הכוחות"],"a":2,"w":["כוחות חזקים לוחצים על הרווח – ההפך.","כוחות חזקים יוצרים תחרות גבוהה.","","המודל קובע שעוצמת הכוחות קובעת את הרווחיות."],"why":"המסקנה בקורס: עוצמת כוחות חזקה ← תחרות גבוהה ← רווחיות נמוכה."},{"id":"m2-19","q":"משקיע בוחר בין ארבעה ענפים. באיזה ענף פוטנציאל הרווחיות הגבוה ביותר לפי חמשת הכוחות?","o":["הרבה מתחרים, צמיחה איטית ועלויות מעבר נמוכות","מעט מתחרים, חסמי כניסה גבוהים, אין תחליפים טובים, ולקוחות וספקים מפוזרים","קל להיכנס, וספק אחד מספק את חומר הגלם הקריטי","לקוח אחד ענק קונה את רוב התוצרת ויכול לייצר בעצמו"],"a":1,"w":["זו יריבות חזקה – רווחיות נמוכה.","","איום כניסה חזק וספק חזק – רווחיות נמוכה.","כוח לקוחות חזק מאוד – רווחיות נמוכה."],"why":"כוחות חלשים = ענף אטרקטיבי עם רווחיות גבוהה."},{"id":"m2-20","q":"איזה מהבאים הוא מאפיין של <b>אוקיינוס כחול</b>?","o":["יצירת ביקוש חדש והפיכת המתחרים ללא רלוונטיים","ניצחון על המתחרים בשוק הקיים","ניצול הביקוש הקיים","בחירה בין ערך גבוה לעלות נמוכה"],"a":0,"w":["","זה אוקיינוס אדום.","זה אוקיינוס אדום.","באוקיינוס הכחול שוברים את שקלול התמורות הזה."],"why":"אוקיינוס כחול: נישה חדשה ללא מתחרים, ביקוש חדש, מתחרים לא רלוונטיים, שבירת שקלול ערך-עלות."},{"id":"m2-21","q":"שתי רשתות פיצה בעיר מורידות מחירים כל שבוע ומעתיקות זו את המבצעים של זו, כדי לקחת לקוחות זו מזו. באיזו אסטרטגיה מדובר?","o":["אוקיינוס כחול","מטריצת ERRC","מיפוי קבוצות אסטרטגיות","אוקיינוס אדום"],"a":3,"w":["אין כאן שוק חדש – זו מלחמה על הביקוש הקיים.","אין כאן ביטול, צמצום, הגבהה או יצירה של גורמים.","זה כלי ניתוח, לא תיאור של התחרות.",""],"why":"התחרות בשוק הקיים כדי לנצח את המתחרה על הביקוש הקיים = אוקיינוס אדום."},{"id":"m2-22","q":"סירק דו סוליי הוציאה מהמופע את כל מופעי החיות. איזו פעולה זו במטריצת ERRC?","o":["צמצום (Reduce)","הגבהה (Raise)","ביטול (Eliminate)","יצירה (Create)"],"a":2,"w":["צמצום = משאירים פחות. כאן הוציאו לגמרי.","הגבהה מעלה גורם, לא מוציאה אותו.","","יצירה מוסיפה גורם חדש."],"why":"גורם שהענף ראה כמובן מאליו והוצא לגמרי = ביטול."},{"id":"m2-23","q":"חברת התעופה SkyLow הציעה ארוחה קטנה בלבד בטיסה, הרבה פחות ממה שמקובל בענף. איזו פעולה זו ב-ERRC?","o":["ביטול (Eliminate)","הגבהה (Raise)","יצירה (Create)","צמצום (Reduce)"],"a":3,"w":["הארוחה לא בוטלה לגמרי – היא רק קטנה.","הגבהה = יותר מהמקובל, כאן פחות.","לא נוסף גורם חדש.",""],"why":"גורם שנשאר, אבל מתחת לרמה המקובלת בענף = צמצום."},{"id":"m2-24","q":"רשת חדרי הכושר FitLite הייתה הראשונה בענף שהציעה אפליקציה עם מאמן וירטואלי שמלווה כל מתאמן. איזו פעולה ב-ERRC?","o":["יצירה (Create)","הגבהה (Raise)","צמצום (Reduce)","ביטול (Eliminate)"],"a":0,"w":["","הגבהה מעלה גורם קיים; כאן הגורם לא היה קיים בענף.","לא הורידו דבר.","לא הוציאו דבר."],"why":"גורם שהענף מעולם לא הציע = יצירה."},{"id":"m2-25","q":"רשת המלונות SleepWell החליטה שהמיטות והמזרנים שלה יהיו באיכות גבוהה בהרבה מכל מלון אחר באותה רמת מחיר. איזו פעולה ב-ERRC?","o":["יצירה (Create)","ביטול (Eliminate)","צמצום (Reduce)","הגבהה (Raise)"],"a":3,"w":["מיטות קיימות בכל מלון – זה גורם קיים, לא חדש.","לא הוציאו גורם.","העלו את הרמה, לא הורידו.",""],"why":"גורם קיים בענף שמעלים מעל הרמה המקובלת = הגבהה."},{"id":"m2-26","q":"מה הכוונה ש״אוקיינוס כחול שובר את שקלול התמורות בין ערך לעלות״?","o":["החברה בוחרת להציע ערך גבוה במחיר גבוה","החברה בוחרת לחסוך בעלויות ולתת פחות ערך","החברה מפסיקה לחשב עלויות","החברה מעלה את הערך ללקוח ובו בזמן מורידה עלויות"],"a":3,"w":["זו בחירה בתוך שקלול התמורות – אוקיינוס אדום.","גם זו בחירה בתוך שקלול התמורות.","המשמעות היא להשיג גם ערך וגם עלות נמוכה, לא להתעלם מעלויות.",""],"why":"ביטול וצמצום מורידים עלות, הגבהה ויצירה מעלות ערך – ביחד משיגים את שניהם."},{"id":"m2-27","q":"יצרנית רכב מיפתה את כל המתחרים על מפה לפי מחיר ולפי מגוון דגמים, וגילתה שהיא נמצאת בעיגול אחד עם שתי חברות אחרות. מה המסקנה העיקרית?","o":["כל החברות במפה הן מתחרות באותה מידה","שתי החברות הן ספקיות שלה","שתי החברות שבאותו עיגול הן המתחרות הקרובות ביותר שלה","היא צריכה לבחור 3–4 גורמי הצלחה"],"a":2,"w":["המפה מראה שחברות בקבוצות אחרות פחות קרובות.","המפה עוסקת במתחרים, לא בספקים.","","זה KSF, לא מיפוי קבוצות אסטרטגיות."],"why":"חברות באותה קבוצה אסטרטגית נוקטות גישה דומה ולכן הן המתחרות הישירות."},{"id":"m2-28","q":"איזה כלי עוזר לחברה להבין את המיצוב התחרותי שלה ואת האפשרות לעבור מסגמנט אחד לאחר, בעזרת שני ממדים כמו מחיר ואיכות?","o":["PESTEL(G)","מיפוי קבוצות אסטרטגיות","חמשת הכוחות","מטריצת ERRC"],"a":1,"w":["PESTEL מנתח את הסביבה הרחבה, לא את מיקום המתחרים.","","חמשת הכוחות בודק את מבנה הענף כולו, לא ממקם חברות על מפה.","ERRC משמשת לבניית אוקיינוס כחול."],"why":"מפה של שני ממדים מבדילים, להבנת המיצוב והמעבר בין קבוצות = מיפוי קבוצות אסטרטגיות."},{"id":"m2-29","q":"מנכ״ל חברת משלוחי אוכל אומר: ״אנחנו מצוינים בעיצוב אריזות, ולכן זה ה-KSF שלנו״. אבל הלקוחות בענף מעריכים בעיקר מהירות. איזה מאפיין של KSF המנכ״ל שכח?","o":["KSF משתנים עם הזמן","מיקוד אסטרטגי – 3–4 גורמים","KSF מוכתבים מבחוץ – השוק והלקוחות קובעים אותם","KSF קשורים לספקים בלבד"],"a":2,"w":["הבעיה כאן היא מי קובע את ה-KSF, לא שינוי לאורך זמן.","הוא בחר גורם אחד; הבעיה היא שהלקוחות לא דורשים אותו.","","אין מאפיין כזה."],"why":"ה-KSF נקבעים לפי השוק והלקוחות, לא לפי מה שהארגון עצמו טוב בו."},{"id":"m2-30","q":"כמה גורמי מפתח להצלחה (KSF) מומלץ להגדיר, ולמה?","o":["לפחות 15, כדי לא לפספס אף גורם","אחד בלבד, כדי להיות ממוקד","כמה שהלקוחות רוצים, בלי הגבלה","3 עד 4, כדי לא לפזר משאבים"],"a":3,"w":["הרבה גורמים מפזרים משאבים – ההפך מהמלצת הקורס.","המלצה היא 3–4, לא אחד.","המאפיין הוא מיקוד אסטרטגי: 3–4 בלבד.",""],"why":"מאפיין המיקוד האסטרטגי: רק 3–4 גורמי מפתח מרכזיים."},{"id":"m2-31","q":"לפני 2007, בענף הטלפונים הניידים, עמידות וזמן סוללה היו הכי חשובים. אחרי האייפון, מערכת הפעלה, אפליקציות ומצלמה הפכו לחשובים יותר. איזה מאפיין של KSF זה מדגים?","o":["KSF משתנים עם הזמן בעקבות טכנולוגיה והעדפות צרכנים","KSF מוכתבים מבפנים על ידי הארגון","KSF קבועים לאורך כל חיי הענף","מיקוד אסטרטגי – 3–4 גורמים"],"a":0,"w":["","KSF מוכתבים מבחוץ, לא מבפנים.","הסיפור מראה בדיוק שהם השתנו.","הסיפור לא עוסק במספר הגורמים אלא בשינוי שלהם."],"why":"שינוי טכנולוגי ושינוי בהעדפות שינו את מה שחייבים להצטיין בו – KSF משתנים עם הזמן."},{"id":"m2-32","q":"איזה מהבאים <b>אינו</b> מאפיין של KSF לפי הקורס?","o":["הם מוכתבים מבחוץ, על ידי השוק והלקוחות","מומלץ להגדיר רק 3–4 מהם","הם יכולים להשתנות עם הזמן","הם ייחודיים לכל חברה ונקבעים על ידי ההנהלה לפי החוזקות שלה"],"a":3,"w":["זה מאפיין נכון של KSF.","זה מאפיין נכון של KSF.","זה מאפיין נכון של KSF.",""],"why":"KSF הם של הענף, משותפים לכל השחקנים, ונקבעים מבחוץ – לא לפי חוזקות החברה."},{"id":"m2-33","q":"איזה מהבאים <b>מחליש</b> את איום המוצרים התחליפיים?","o":["התחליף יקר בהרבה, פחות טוב, ומעבר אליו דורש עלות גבוהה","יש הרבה תחליפים זמינים בכל חנות","התחליף זול יותר ונותן ביצועים דומים","ללקוח אין שום עלות במעבר לתחליף"],"a":0,"w":["","זמינות מחזקת את האיום.","אטרקטיביות מחזקת את האיום.","עלות החלפה נמוכה מחזקת את האיום."],"why":"האיום מושפע מזמינות, אטרקטיביות ועלויות החלפה. תחליף לא אטרקטיבי עם עלות מעבר גבוהה = איום חלש."},{"id":"m2-34","q":"קרן ההשקעות Horizon שוקלת להקים חברה בענף הקורקינטים השיתופיים, ורוצה להבין אם בכלל כדאי להיכנס לענף. לשם מה תשתמש במודל חמשת הכוחות?","o":["לנתח את הסביבה הפנימית של החברה החדשה","לקבוע את המבנה הארגוני של היחידה העסקית","לעצב יעדים ארוכי טווח","לבדוק את כושר התחרות של חברה אחת מסוימת","לבחון את האטרקטיביות של הענף שהיא מתכוונת לפעול בו"],"a":4,"w":["חמשת הכוחות הוא כלי לסביבה החיצונית (מיקרו), לא הפנימית.","מבנה ארגוני אינו נושא המודל.","יעדים נגזרים מהחזון, לא מהמודל.","המודל בודק את הענף, לא חברה אחת.",""],"why":"לפי המרצה, חמשת הכוחות משמש לבחינת אטרקטיביות הענף שבו הפירמה פועלת או מתעתדת לפעול."},{"id":"m2-35","q":"בענף הסוללות, היצרניות הוותיקות הורידו לאורך השנים את העלות ליחידה בזכות עקומת למידה. איך זה משפיע על הכוח ״כניסת מתחרים חדשים״?","o":["מחזק אותו – ענף שמוזיל עלויות מושך נכנסים","מחליש אותו – הוותיקות יכולות להגיב בתגובת נמר (הורדת מחיר גם בהפסד), וחסמי הכניסה מתחזקים","אין השפעה – עקומת למידה קשורה רק ליריבות","מחזק את כוח הספקים בלבד","תשובות א, ג נכונות"],"a":1,"w":["ההפך: יתרון העלות של הקיימים הוא חסם.","","עקומת למידה היא חלק מיתרונות השחקנים הקיימים – חסם כניסה.","אין קשר לספקים.","א ו-ג שגויות."],"why":"עקומת למידה ← עלות נמוכה לקיימים ← אפשרות לתגובת נמר ← חסם כניסה גבוה ← איום כניסה חלש."},{"id":"m2-36","q":"איזה מהגורמים הבאים <b>אינו</b> נבדק, לפי רשימת המרצה, בכוח המיקוח של <b>הספקים</b>?","o":["ריכוזיות ענף הספקים","האם חומר הגלם קריטי לשרשרת הערך של הלקוחות","עלויות החלפת ספק גבוהות","סוג הלקוח (B2B / B2C)","איום באמצעות אינטגרציה לפנים"],"a":3,"w":["זה גורם של כוח הספקים.","זה גורם של כוח הספקים.","זה גורם של כוח הספקים.","","זה גורם של כוח הספקים."],"why":"סוג הלקוח (B2B/B2C) נבדק בכוח המיקוח של הלקוחות."},{"id":"m2-37","q":"אילו גורמים בודקים, לפי רשימת המרצה, בכוח ״יריבות פנימית בענף״?","o":["מספר המתחרים והדמיון ביניהם","שביעות רצון המתחרים מהסטטוס שלהם בשוק","רכישות של חברות מחוץ לענף","חסמי יציאה","כל התשובות נכונות"],"a":4,"w":["נכון, אבל גם שאר הגורמים ברשימה.","נכון, אבל גם שאר הגורמים ברשימה.","נכון, אבל גם שאר הגורמים ברשימה.","נכון, אבל גם שאר הגורמים ברשימה.",""],"why":"ברשימת היריבות: מספר ודמיון, קצב צמיחה, חסמי/עלויות מעבר, שביעות רצון המתחרים, רכישות מחוץ לענף וחסמי יציאה."},{"id":"m2-38","q":"ניתוח חמשת הכוחות של ענף המלונות בעיר הראה שעוצמת התחרות הכוללת בענף <b>גבוהה</b>. מה המסקנה לפי שרשרת המרצה?","o":["אטרקטיביות גבוהה ← פוטנציאל רווחיות גבוה","אטרקטיביות נמוכה ← פוטנציאל רווחיות נמוך","אטרקטיביות נמוכה ← פוטנציאל רווחיות גבוה","אי אפשר להסיק דבר על הרווחיות","אף תשובה אינה נכונה"],"a":1,"w":["הכיוון הפוך: עוצמה גבוהה מורידה אטרקטיביות.","","אטרקטיביות ורווחיות נעות יחד.","זו בדיוק מטרת המודל.","ב׳ נכונה."],"why":"עוצמת תחרות גבוהה ← אטרקטיביות ענף נמוכה ← פוטנציאל רווחיות נמוך."},{"id":"m2-39","q":"איזו טענה <b>אינה</b> נכונה לגבי מיפוי קבוצות אסטרטגיות?","o":["גודל העיגול משקף את חלקה של הקבוצה בהכנסות הענף","המתאם בין שני הצירים צריך להיות נמוך","יש לשאוף להשתמש רק במשתנים רציפים","עיגולים קרובים מעידים על תחרות חזקה יותר בין הקבוצות","תשובות ב, ד אינן נכונות"],"a":2,"w":["זו טענה נכונה.","זו טענה נכונה: אחרת כל החברות על אלכסון אחד.","","זו טענה נכונה.","ב ו-ד נכונות."],"why":"המשתנים לא חייבים להיות רציפים – אפשר ״מגוון דגמים: צר / רחב״."},{"id":"m2-40","q":"במפת ענף הרכב של המרצה, הונדאי וסוזוקי נמצאות באותו עיגול, ופורשה בעיגול רחוק. איפה התחרות חריפה יותר?","o":["בין הונדאי לסוזוקי – בתוך הקבוצה","בין הונדאי לפורשה – בין הקבוצות","אותה עוצמה בשני המקרים","אין תחרות בכלל בענף הרכב","תלוי רק ברווחיות של כל חברה"],"a":0,"w":["","קבוצות רחוקות מתחרות פחות זו בזו.","התחרות בתוך קבוצה חריפה יותר.","יש תחרות, בעיקר בתוך הקבוצות.","עוצמת התחרות נקבעת לפי הקרבה במפה, לא לפי רווחיות."],"why":"התחרות בתוך קבוצה אסטרטגית חריפה יותר מאשר בין קבוצות."},{"id":"m2-41","q":"סמנכ״ל השיווק של Brewly אמר: ״ה-KSF שלנו הם 14 סוגי הקפה בקטלוג״. מה נכון לפי המרצה?","o":["הוא צודק – KSF הם מגוון המוצרים של הפירמה","הוא צודק – כל מוצר הוא KSF","הוא טועה – KSF קבועים ואינם קשורים לענף","הוא טועה – KSF הם תחומי הפעילות החשובים לפירמות בענף להצלחה לאורך זמן, 3–4 לכל ענף","אף תשובה אינה נכונה"],"a":3,"w":["KSF אינם מגוון המוצרים.","14 ״גורמים״ – הרבה מעבר ל-3–4.","KSF כן קשורים לענף, והם משתנים מעת לעת.","","ד׳ נכונה."],"why":"KSF = תחומי הפעילות החשובים להצלחה לאורך זמן בענף; 3–4 בכל ענף; לא מגוון המוצרים."},{"id":"m2-42","q":"לפי המרצה, מה צריכה פירמה לעשות ביחס ל-KSF כדי ליהנות מיתרון תחרותי בר-קיימא?","o":["להצטיין בכל ה-KSF","להיות טובה בכל ה-KSF ולהצטיין לפחות באחד","להתמקד ב-KSF אחד ולוותר על השאר","להגדיר KSF משלה לפי החוזקות שלה","אף תשובה אינה נכונה"],"a":1,"w":["הדרישה היא ״טובה בכולם״, ומצטיינת רק באחד לפחות.","","ויתור על KSF יוציא אותה מהמשחק.","KSF נקבעים מבחוץ, על ידי הענף והלקוחות.","ב׳ נכונה."],"why":"טובה בכל ה-KSF + מצטיינת לפחות באחד = יתרון תחרותי בר-קיימא."},{"id":"m2-43","q":"בכתבה נכתב: ״הקינדל של אמזון יצר מרחב תחרותי חדש״. מה צריך להראות מי שטוען שזה אוקיינוס כחול?","o":["נישת שוק חדשה ללא מתחרים, מתחרים לא רלוונטיים, ביקוש חדש ושבירת שקלול התמורות בין ערך לעלות","שאמזון ניצחה את המתחרים בשוק הקיים","שאמזון מכרה במחיר נמוך מהמתחרים","שאמזון ניצלה את הביקוש הקיים לספרים מודפסים","תשובות ב, ג נכונות"],"a":0,"w":["","ניצחון בשוק קיים = אוקיינוס אדום.","מחיר נמוך לבדו הוא מהלך של אוקיינוס אדום.","ניצול ביקוש קיים = אוקיינוס אדום.","ב ו-ג מתארות אוקיינוס אדום."],"why":"ארבעת המאפיינים של אוקיינוס כחול – וצריך עובדה מהכתבה לכל אחד."},{"id":"m2-44","q":"מנכ״ל אמר: ״בלי הוזלה משמעותית בעלויות לא נשיג יתרון תחרותי״. מה נכון?","o":["הוא צודק – כל יתרון תחרותי נשען על עלות נמוכה","הוא צודק רק בענפים שבהם הלקוחות עסקיים (B2B)","הוא טועה – אפשר להשיג יתרון דרך תועלת ייחודית (איכות, שירות, זמינות, חדשנות) או אוקיינוס כחול","הוא טועה – יתרון תחרותי מושג רק ברכישת מתחרים","אף תשובה אינה נכונה"],"a":2,"w":["יש גם יתרון של בידול ותועלת ייחודית.","אין כלל כזה.","","רכישה אינה הדרך היחידה ליתרון.","ג׳ נכונה."],"why":"יתרון תחרותי אפשרי גם בלי הוזלה – באמצעות תועלת ייחודית או יצירת אוקיינוס כחול."},{"id":"m2-45","q":"סטארט-אפ שוקל להיכנס לענף שבו השחקן הדומיננטי ידוע בכך שהוריד מחירים בחדות, גם בהפסד, בכל פעם שנכנס מתחרה. איך הניתוח מתאר זאת?","o":["תגובת הנגד הצפויה חלשה ← איום כניסה חזק","זו יריבות פנימית חלשה","זה מחזק את כוח הלקוחות בלבד","תגובת נגד צפויה חריפה (תגובת נמר) ← חסם כניסה גבוה ← איום כניסה חלש","זה איום של מוצרים תחליפיים"],"a":3,"w":["התגובה הצפויה חריפה, לא חלשה.","מדובר בתגובה לנכנסים, לא ביריבות בין הקיימים.","המהלך נועד להרתיע נכנסים, לא נוגע לכוח הלקוחות.","","תחליף הוא מוצר מענף אחר."],"why":"״תגובת הנגד הצפויה״ היא חלק מכוח הכניסה ברשימת המרצה; תגובת נמר מחזקת את החסמים."}],"tf":[{"id":"m2-t1","s":"ענף הוא קבוצת פירמות המציעות מוצרים או שירותים שהם תחליפים קרובים עבור קבוצת לקוחות.","a":true,"why":"זו הגדרת הענף בקורס."},{"id":"m2-t2","s":"ענף ושוק הם אותו מושג בדיוק.","a":false,"why":"הקורס מבחין ביניהם: ענף = המוכרים (חברות), שוק = הקונים (לקוחות)."},{"id":"m2-t3","s":"מודל PESTEL(G) ממפה 7 כוחות סביבתיים חיצוניים שמשפיעים על הענף.","a":true,"why":"פוליטי, כלכלי, חברתי, טכנולוגי, סביבתי, משפטי וגלובלי."},{"id":"m2-t4","s":"באות G במודל PESTEL(G) הכוונה ל-Government (ממשלה).","a":false,"why":"G = Globalization (גלובלי). הממשלה מופיעה בגורם הפוליטי."},{"id":"m2-t5","s":"אחת הביקורות על מודל PESTEL היא עלויות איסוף מידע גבוהות.","a":true,"why":"זו אחת משתי הביקורות בקורס, לצד איבוד רלוונטיות במציאות דינמית."},{"id":"m2-t6","s":"PESTEL הוא מבט מיקרו, ממוקד יותר ממודל חמשת הכוחות.","a":false,"why":"ההפך: PESTEL = מאקרו (מבט רחב), חמשת הכוחות = מיקרו (מבט ממוקד)."},{"id":"m2-t7","s":"קצב צמיחה איטי בענף מחזק את היריבות הפנימית.","a":true,"why":"כשהשוק לא גדל, חברה יכולה לגדול רק על חשבון מתחרים."},{"id":"m2-t8","s":"חסמי יציאה גבוהים מחלישים את היריבות הפנימית בענף.","a":false,"why":"חסמי יציאה גבוהים משאירים בענף חברות שנלחמות – היריבות מתחזקת."},{"id":"m2-t9","s":"יתרונות לגודל של החברות הקיימות מגבירים את איום הכניסה של מתחרים חדשים.","a":false,"why":"יתרון לגודל הוא חסם כניסה ולכן מחליש את האיום."},{"id":"m2-t10","s":"כוח המיקוח של הלקוחות מתחזק כשעלויות ההחלפה שלהם נמוכות.","a":true,"why":"כשקל לעבור לספק אחר, הלקוח יכול להכתיב מחיר."},{"id":"m2-t11","s":"איום באינטגרציה לפנים מחזק את כוח המיקוח של הספקים.","a":true,"why":"ספק שיכול למכור ישירות ללקוח הסופי מחזק את כוחו."},{"id":"m2-t12","s":"איום באינטגרציה לאחור הוא גורם שמחזק את כוח הספקים.","a":false,"why":"אינטגרציה לאחור היא איום של הלקוחות (לייצר בעצמם) ומחזקת את כוח הלקוחות."},{"id":"m2-t13","s":"עוצמת כוחות חזקה בענף מביאה לרווחיות גבוהה.","a":false,"why":"עוצמת כוחות חזקה מביאה לתחרות גבוהה ולרווחיות נמוכה."},{"id":"m2-t14","s":"ענף שבו הכוחות חלשים הוא ענף אטרקטיבי עם רווחיות גבוהה.","a":true,"why":"זו המסקנה של המודל."},{"id":"m2-t15","s":"מטרת אסטרטגיית אוקיינוס כחול היא לנצח את המתחרים בשוק הקיים.","a":false,"why":"זה אוקיינוס אדום. בכחול יוצרים נישה ללא מתחרים והופכים אותם ללא רלוונטיים."},{"id":"m2-t16","s":"אסטרטגיית אוקיינוס כחול שוברת את שקלול התמורות בין ערך לעלות.","a":true,"why":"היא מעלה ערך ומורידה עלות בו זמנית."},{"id":"m2-t17","s":"במטריצת ERRC, צמצום (Reduce) פירושו להוציא גורם מהמוצר לגמרי.","a":false,"why":"להוציא לגמרי = ביטול. צמצום = להשאיר מתחת לרמה המקובלת בענף."},{"id":"m2-t18","s":"יצירה (Create) במטריצת ERRC היא הוספת גורמים שהענף מעולם לא הציע.","a":true,"why":"זו ההגדרה של יצירה."},{"id":"m2-t19","s":"ביטול וצמצום מורידים בעיקר עלויות, והגבהה ויצירה מעלות בעיקר את הערך ללקוח.","a":true,"why":"כך שתי הקבוצות ביחד שוברות את שקלול הערך-עלות."},{"id":"m2-t20","s":"מיפוי קבוצות אסטרטגיות ממקם מתחרים לפי שני ממדים מבדילים, כמו מחיר מול איכות.","a":true,"why":"זו הגדרת הכלי בקורס."},{"id":"m2-t21","s":"חברות באותה קבוצה אסטרטגית הן בדרך כלל המתחרות הקרובות ביותר זו לזו.","a":true,"why":"הן נוקטות גישה תחרותית דומה."},{"id":"m2-t22","s":"גורמי מפתח להצלחה (KSF) נקבעים בעיקר על ידי הארגון עצמו, לפי החוזקות שלו.","a":false,"why":"KSF מוכתבים מבחוץ – על ידי השוק, דרישות הענף והלקוחות."},{"id":"m2-t23","s":"מומלץ להגדיר 10–15 גורמי מפתח להצלחה כדי לכסות את כל התחומים.","a":false,"why":"מומלץ רק 3–4, כדי לא לפזר משאבים."},{"id":"m2-t24","s":"גורמי המפתח להצלחה יכולים להשתנות בעקבות שינויים טכנולוגיים, רגולציה או העדפות צרכנים.","a":true,"why":"זה המאפיין השלישי: KSF משתנים עם הזמן."},{"id":"m2-t25","s":"מוצר תחליפי הוא מוצר של מתחרה מאותו ענף בדיוק.","a":false,"why":"מוצר מאותו ענף = יריבות פנימית. תחליף = מוצר מענף אחר שעונה על אותו צורך."},{"id":"m2-t26","s":"ככל שעקומת הלמידה מאפשרת לפירמות הקיימות להוזיל את העלות ליחידה, כך הכוח ״כניסת מתחרים חדשים״ חזק יותר.","a":false,"why":"ההפך: הקיימות יכולות להגיב בתגובת נמר (הורדת מחיר גם בהפסד), וזה מחזק את חסמי הכניסה ומחליש את האיום."},{"id":"m2-t27","s":"ככל שהכניסה לענף דורשת השקעה ראשונית גבוהה יותר, כך איום כניסת מתחרים חדשים חזק יותר.","a":false,"why":"השקעה ראשונית גבוהה היא חסם כניסה – האיום חלש יותר."},{"id":"m2-t28","s":"התחרות בתוך קבוצה אסטרטגית חריפה יותר מהתחרות בין קבוצות אסטרטגיות.","a":true,"why":"בתוך הקבוצה – אותם לקוחות ואותה גישה, ולכן התחרות ישירה וחריפה."},{"id":"m2-t29","s":"במיפוי קבוצות אסטרטגיות יש לשאוף להשתמש במשתנים רציפים בלבד.","a":false,"why":"המשתנים לא חייבים להיות רציפים (למשל מגוון דגמים צר/רחב). כן חשוב מתאם נמוך בין הצירים."},{"id":"m2-t30","s":"לפי המרצה, כל פירמה צריכה להיות טובה בכל ה-KSF של הענף ולהצטיין לפחות באחד כדי ליהנות מיתרון תחרותי בר-קיימא.","a":true,"why":"זו ההגדרה מפתרון המבחן לדוגמה."},{"id":"m2-t31","s":"גורמי המפתח להצלחה (KSF) מגדירים את מגוון המוצרים והשירותים שהפירמה מציעה בענף.","a":false,"why":"KSF הם תחומי הפעילות החשובים להצלחה לאורך זמן בענף (3–4), לא מגוון המוצרים."},{"id":"m2-t32","s":"אוקיינוס כחול מאופיין ביצירה ולכידה של ביקוש חדש ובהפיכת המתחרים ללא רלוונטיים.","a":true,"why":"אלה שניים מארבעת המאפיינים (יחד עם נישה ללא מתחרים ושבירת שקלול ערך-עלות)."},{"id":"m2-t33","s":"כשעוצמת התחרות הכוללת בענף בינונית-נמוכה, אטרקטיביות הענף גבוהה ופוטנציאל הרווחיות גבוה.","a":true,"why":"זו שרשרת המסקנה של המרצה (כמו ב-OTO-MOTORS)."}],"scope":[{"ref":"סיכום · עמ׳ 2","x":"הגדרת ענף והבחנה בין ענף לשוק","imp":1,"h":"הגדרת ענף (ענף מול שוק)"},{"ref":"סיכום · עמ׳ 2","x":"סביבת מאקרו – PESTEL(G)","imp":2,"h":"סביבת מאקרו: מודל PESTEL(G)"},{"ref":"סיכום · עמ׳ 2","x":"הביקורת על PESTEL","imp":1,"h":"הביקורת על מודל PESTEL"},{"ref":"סיכום · עמ׳ 2","x":"סביבת מיקרו – חמשת הכוחות של פורטר","imp":2,"h":"סביבת מיקרו: מודל חמשת הכוחות של פורטר"},{"ref":"סיכום · עמ׳ 2","x":"מה מחזק כל כוח","imp":2,"h":"מה מחזק כל אחד מחמשת הכוחות"},{"ref":"אירוע OTO-MOTORS · עמ׳ 4","x":"רשימת המרצה: הגורמים לכל כוח","imp":2,"h":"רשימת המרצה: הגורמים שקובעים כל כוח"},{"ref":"מבחן לדוגמה · ב1","x":"תגובת נמר, עקומת למידה והשקעה ראשונית","imp":2,"h":"תגובת נמר, עקומת למידה והשקעה ראשונית"},{"ref":"סיכום · עמ׳ 3","x":"מסקנה: עוצמת כוחות ורווחיות","imp":1,"h":"מסקנה: עוצמת הכוחות ורווחיות הענף"},{"ref":"מבחן לדוגמה · א1","x":"שרשרת המסקנה ולמה משמשים חמשת הכוחות","imp":1,"h":"שרשרת המסקנה של המרצה ולמה משמשים חמשת הכוחות"},{"ref":"סיכום · עמ׳ 3","x":"אוקיינוס כחול מול אוקיינוס אדום","imp":2,"h":"אסטרטגיית אוקיינוס כחול מול אוקיינוס אדום"},{"ref":"סיכום · עמ׳ 3","x":"מטריצת 4 הפעולות ERRC","imp":2,"h":"מטריצת 4 הפעולות (ERRC)"},{"ref":"מבחן לדוגמה · ב3, חלק ג׳","x":"מאפייני אוקיינוס כחול – זיהוי בכתבה","imp":2,"h":"מאפייני אוקיינוס כחול: איך מזהים אותו בכתבה"},{"ref":"סיכום · עמ׳ 3","x":"מיפוי קבוצות אסטרטגיות","imp":1,"h":"מיפוי קבוצות אסטרטגיות"},{"ref":"מבחן לדוגמה · א9","x":"כללי המרצה למיפוי ומפת ענף הרכב","imp":2,"h":"כללי המרצה למיפוי ומפת ענף הרכב"},{"ref":"מבחן לדוגמה (ב) · א9","x":"תחרות בתוך קבוצה מול בין קבוצות","imp":1,"h":"תחרות בתוך קבוצה מול תחרות בין קבוצות"},{"ref":"סיכום · עמ׳ 3","x":"גורמי מפתח להצלחה (KSF) ו-3 מאפייניהם","imp":2,"h":"גורמי מפתח להצלחה בענף (KSF)"},{"ref":"מבחן לדוגמה · ב4","x":"KSF לפי המרצה: 3–4, משתנים, להצטיין באחד","imp":2,"h":"KSF לפי המרצה: 3–4 גורמים, להצטיין לפחות באחד"}],"outScope":[]},{"id":"m3","title":"ניתוח סביבת הפירמה","short":"ניתוח פנימי","blurb":"מבט אל תוך החברה: שרשרת הערך של פורטר, גישת המשאבים (RBV) ומשאבים מוחשיים ולא מוחשיים, יכולת ליבה מול יכולת ייחודית, מודל VRIN, ומ-SWOT ל-TOWS.","mnemonic":"שרשרת הערך: “מקבלים, מייצרים, שולחים, מוכרים, מתקנים” = חמש העיקריות; התומכות = “תמ״פר” (תשתיות, משאבי אנוש, פיתוח טכנולוגי, רכש); בקצה החץ – שולי הרווח. RBV: “יש לי ← אני הכי טוב בזה אצלי ← אני טוב בזה מכולם ← אני מנצח”. VRIN: “ערך, נדיר, לא מעתיקים, אין תחליף”, ובכל “לא” לפי הסדר: חיסרון ← שוויון ← זמני ← לא מנוצל. TOWS: האות הראשונה = מה יש לי בפנים (S/W), השנייה = מה קורה בחוץ (O/T).","blocks":[{"t":"h","x":"מבט פנימה: על מה היחידה"},{"t":"p","x":"ביחידה 2 הסתכלנו <b>החוצה</b>, על הענף והסביבה. ביחידה 3 מסתכלים <b>פנימה</b>, אל תוך הפירמה עצמה. השאלה המרכזית: <b>איפה החברה יוצרת ערך, ומה יש לה שאין למתחרים?</b>"},{"t":"list","x":["<b>שרשרת הערך</b> (Value Chain) – באילו פעילויות נוצר הערך ואיפה אפשר לחסוך.","<b>גישת המשאבים</b> (RBV) – איך משאבים הופכים ליכולת ליבה, ליכולת ייחודית וליתרון תחרותי; משאבים מוחשיים מול לא מוחשיים.","<b>מודל VRIN</b> – האם המשאב נותן יתרון תחרותי <b>בר-קיימא</b>.","<b>SWOT ו-TOWS</b> – מחברים את הפנים (חוזקות וחולשות) עם החוץ (הזדמנויות ואיומים), וגוזרים מזה אסטרטגיות פעולה."]},{"t":"h","x":"מודל שרשרת הערך של פורטר (Value Chain)"},{"t":"p","x":"<b>שרשרת הערך</b> של מייקל פורטר מפרקת את הפירמה ל<b>פעילויות פנימיות</b>. לכל פעילות שואלים: כמה ערך היא מוסיפה ללקוח, וכמה היא עולה לנו? כך מזהים <b>מקורות ליצירת ערך</b> ו<b>מקומות לחיסכון בעלויות</b>."},{"t":"p","x":"הפעילויות מתחלקות לשתי קבוצות. <b>פעילויות עיקריות</b> (Primary, בסיכום נקראות גם <b>פעילויות ליבה</b>): המוצר “עובר” דרכן בדרך ללקוח. <b>פעילויות תומכות</b> (Support): לא נוגעות במוצר עצמו, אלא עוזרות לכל הפעילויות העיקריות לעבוד. בתרשים הן מופיעות כפס רחב מתחת לעיקריות, עם חיצים כלפי מעלה – כי הן תומכות בכולן."},{"t":"table","head":["סוג","פעילות","מה עושים בה","דוגמה"],"rows":[["עיקרית","<b>לוגיסטיקה נכנסת</b> (Inbound Logistics)","קבלת חומרי גלם מהספקים, בדיקה, אחסון וניהול מלאי","מחסן הקמח של מאפייה תעשייתית"],["עיקרית","<b>תפעול</b> (Operations)","הפיכת חומרי הגלם למוצר, או ביצוע השירות עצמו","פס הייצור במפעל; הטיסה עצמה בחברת תעופה"],["עיקרית","<b>לוגיסטיקה יוצאת</b> (Outbound Logistics)","אחסון המוצר המוגמר והפצתו ללקוחות","משאיות שמפיצות לחם לסופרמרקטים"],["עיקרית","<b>שיווק ומכירות</b> (Marketing & Sales)","פרסום, מיתוג, תמחור, אנשי מכירות","קמפיין ברשתות החברתיות"],["עיקרית","<b>שירות</b> (Service)","שירות לאחר המכירה: התקנה, תיקונים, אחריות, תמיכה","טכנאי שמתקן מכונת כביסה אצל הלקוח"],["תומכת","<b>תשתיות / אדמיניסטרציה</b> (Firm Infrastructure)","הנהלה, כספים, משפטים, תכנון, מערכות ניהול","מחלקת הכספים והייעוץ המשפטי"],["תומכת","<b>ניהול משאבי אנוש</b> (HRM)","גיוס, הכשרה, שכר ותגמול, פיתוח עובדים","קורס הכשרה לנציגי שירות"],["תומכת","<b>פיתוח טכנולוגי</b> (Technology Development)","מו״פ, פיתוח מערכות, שיפור תהליכים וטכנולוגיה","מעבדת פיתוח של מוצר חדש"],["תומכת","<b>רכש</b> (Procurement)","בחירת ספקים, משא ומתן, חוזים וקנייה של תשומות","חוזה שנתי עם ספק חומרי גלם"]]},{"t":"p","x":"<b>שולי הרווח</b> (Margin) נמצאים בקצה החץ של המודל. הם ה<b>הפרש</b> בין הערך הכולל שהחברה יוצרת (מה שהלקוח מוכן לשלם) לבין העלות של ביצוע כל הפעילויות. יש רק שתי דרכים להגדיל אותם: <b>להעלות את הערך</b> בעיני הלקוח (כיוון של בידול), או <b>להוריד את העלות</b> של הפעילויות (כיוון של מנהיגות בעלות). זה בדיוק הקשר ליחידה 4."},{"t":"steps","x":["שאלו: האם הפעילות נוגעת במוצר בדרך ללקוח? <b>מקבלים ← מייצרים ← שולחים ← מוכרים ← מתקנים</b>. אם כן – עיקרית.","אם הפעילות היא <b>הנהלה וכספים</b>, <b>אנשים</b> (גיוס, הכשרה), <b>טכנולוגיה ומו״פ</b> או <b>קנייה מספקים</b> – היא תומכת. זכרו: <b>“תמ״פר”</b> = תשתיות, משאבי אנוש, פיתוח טכנולוגי, רכש.","כדי לשפר את שולי הרווח, שואלים לגבי כל פעילות: אפשר לעשות אותה זול יותר? אפשר שתוסיף יותר ערך ללקוח?"],"title":"איך מסווגים פעילות"},{"t":"example","x":"רשת הפיצות PizzaGo: מקבלת קמח וגבינות למחסן המרכזי ← <b>לוגיסטיקה נכנסת</b>. מכינה ואופה את הפיצות ← <b>תפעול</b>. שליחים מביאים את הפיצה הביתה ← <b>לוגיסטיקה יוצאת</b>. מבצע “1+1” באפליקציה ← <b>שיווק ומכירות</b>. מחזירה כסף על פיצה קרה ← <b>שירות</b>. חתימה על חוזה עם מחלבה ← <b>רכש</b>. קורס לשליחים חדשים ← <b>משאבי אנוש</b>. פיתוח האפליקציה ← <b>פיתוח טכנולוגי</b>. הנהלת חשבונות ← <b>תשתיות</b>.","title":"פעילויות ברשת פיצה"},{"t":"trap","x":"שלושה בלבולים קבועים: (1) <b>רכש מול לוגיסטיקה נכנסת</b> – לבחור ספק, לסגור מחיר ולחתום = רכש (תומכת); לקבל את הסחורה, לאחסן ולנהל מלאי = לוגיסטיקה נכנסת (עיקרית). (2) <b>הכשרת אנשי שירות</b> היא משאבי אנוש (תומכת); <b>התיקון עצמו</b> אצל הלקוח הוא שירות (עיקרית). (3) <b>מו״פ</b> הוא תמיד פיתוח טכנולוגי (תומכת), גם בחברת הייטק שבה הוא הכי חשוב. ועוד: “פעילויות ליבה” בשרשרת הערך = הפעילויות העיקריות. זה <b>לא</b> “יכולת ליבה” של RBV."},{"t":"exam","x":"איך שואלים: סיפור קצר ← “איזו פעילות היא תומכת?” / “לאיזו פעילות שייך X?” / “מה מהבאים <b>אינו</b> פעילות עיקרית?”. או שאלת הגדרה: “מהם שולי הרווח?” (ההפרש בין הערך שנוצר לעלות הפעילויות) ו“מה מטרת המודל?” (לזהות מקורות ערך וחיסכון בעלויות בתוך הארגון)."},{"t":"h","x":"גישת המשאבים (RBV) ושרשרת היתרון"},{"t":"p","x":"<b>גישת המשאבים</b> (RBV – Resource-Based View) אומרת: היתרון התחרותי <b>נגזר מבפנים</b>, מבסיס המשאבים של הפירמה. זה ההפך מגישה חיצונית כמו חמשת הכוחות, שמחפשת את מקור הרווח במבנה הענף. שתי חברות באותו ענף יכולות להצליח אחרת לגמרי, כי יש להן משאבים שונים."},{"t":"p","x":"לפי הסיכום, היתרון נבנה כ<b>שרשרת של ארבע חוליות</b>. כל חוליה נבנית על הקודמת:"},{"t":"steps","x":["<b>משאבים</b> (Resources) – מה שיש לחברה: מוחשיים ולא מוחשיים (כסף, מפעל, פטנטים, ידע, מוניטין).","<b>יכולת ליבה</b> (Core Competence) – הפעולה שהחברה עושה <b>הכי טוב מבין כל מה שהיא עושה</b>. משווים אותה ל<b>יכולות האחרות של החברה עצמה</b>.","<b>יכולת ייחודית</b> (Distinctive Competence) – פעולה שהחברה עושה <b>טוב יותר מהמתחרים</b>. כאן משווים <b>החוצה</b>.","<b>יתרון תחרותי</b> (Competitive Advantage) – התוצאה: החברה מצליחה יותר מהמתחרים בענף."],"title":"השרשרת: משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי"},{"t":"example","x":"בית הקלייה RoastLab: יש לו מכונות קלייה, כסף ובריסטה עם 20 שנות ניסיון (<b>משאבים</b>). מכל מה שהוא עושה, הוא הכי טוב בהתאמת פרופיל קלייה לכל זן (<b>יכולת ליבה</b>). בדיקות טעימה עיוורות מראות שאף בית קלייה בעיר לא מגיע לרמה שלו (<b>יכולת ייחודית</b>). לכן בתי קפה מוכנים לשלם לו יותר ולחתום איתו לטווח ארוך (<b>יתרון תחרותי</b>).","title":"שרשרת RBV בבית קלייה"},{"t":"trap","x":"הסדר קבוע: <b>משאבים ← ליבה ← ייחודית ← יתרון</b>. מסיחים נפוצים מחליפים בין ליבה לייחודית, או שמים את היתרון לפני היכולות. ושימו לב: RBV = <b>פנים</b>. אם הסיפור מסביר את ההצלחה במבנה הענף, בחסמי כניסה או ברגולציה – זו גישה חיצונית, לא RBV."},{"t":"exam","x":"איך שואלים: “מה הסדר הנכון בשרשרת של גישת המשאבים?”, “חברה טוענת שההצלחה שלה נובעת מהידע והפטנטים שלה – איזו גישה זו?” (RBV), ובנכון/לא נכון: “לפי RBV היתרון נגזר מהסביבה החיצונית” – לא נכון."},{"t":"h","x":"משאבים מוחשיים ולא מוחשיים"},{"t":"p","x":"<b>משאב</b> הוא כל קלט שנכנס לתהליך הייצור של הפירמה: הון, ציוד, כישורי עובדים, פטנטים, כישורי ניהול ועוד. בקורס מחלקים את המשאבים לשני צדדים, ובכל צד ארבעה סוגים:"},{"t":"table","head":["צד","סוג המשאב","מה כולל","דוגמה בסיפור"],"rows":[["<b>מוחשי</b>","<b>פיננסי</b>","מקורות אשראי, הון עצמי","לחברה קו אשראי גדול מהבנק ומזומנים בקופה"],["<b>מוחשי</b>","<b>ארגוני</b>","מנגנוני בקרה ותיאום, מנגנוני תכנון ופיקוח","מערכת תכנון תקציב ומנגנון בקרת איכות מסודר"],["<b>מוחשי</b>","<b>פיזי</b>","מפעלים ומבנים, מכונות וציוד, קרקעות וחומרי גלם","מפעל אוטומטי, צי משאיות, מכרה"],["<b>מוחשי</b>","<b>טכנולוגי</b>","פטנטים, סימנים רשומים, זכויות יוצרים, סודות מקצועיים","פטנט על תרופה, נוסחה סודית רשומה"],["<b>לא מוחשי</b>","<b>אנושי</b>","ידע, ניסיון, אמון, כישורי ניהול, תרבות ארגונית","צוות מנוסה ותרבות של שיתוף ואמון"],["<b>לא מוחשי</b>","<b>חדשנות</b>","רעיונות, כישורים מדעיים, יכולות חדשנות","מדענים שמייצרים כל הזמן רעיונות למוצרים"],["<b>לא מוחשי</b>","<b>מוניטין</b>","תדמית בעיני לקוחות וספקים: מותג, מיצוב, מיתוס, תפיסת האיכות","לקוחות מאמינים שהמותג הוא הכי איכותי"],["<b>לא מוחשי</b>","<b>קשרים חיצוניים</b>","קשרים עם גורמי מפתח בענף","קשר קרוב של המנכ״ל עם הרגולטור והספקים הגדולים"]]},{"t":"list","x":["<b>כלל אצבע:</b> מוחשי = אפשר לספור, לרשום או להחזיק במסמך (כסף, מבנה, מכונה, נוהל, רישום פטנט).","לא מוחשי = נמצא <b>בראש של אנשים</b>: בידע של העובדים, ברעיונות, בתדמית אצל הלקוחות ובקשרים."]},{"t":"example","x":"חברת המשקאות FizzUp: יש לה מפעל ביקום (<b>מוחשי – פיזי</b>), נוסחה רשומה ומוגנת (<b>מוחשי – טכנולוגי</b>), הלוואה מהבנק (<b>מוחשי – פיננסי</b>), מערכת בקרת איכות (<b>מוחשי – ארגוני</b>), מותג שהצעירים אוהבים (<b>לא מוחשי – מוניטין</b>), צוות טועמים מנוסה (<b>לא מוחשי – אנושי</b>), מעבדה שממציאה טעמים (<b>לא מוחשי – חדשנות</b>) וקשרים עם רשתות השיווק הגדולות (<b>לא מוחשי – קשרים חיצוניים</b>).","title":"סיווג משאבים"},{"t":"trap","x":"בטבלה של הקורס, <b>פטנטים, סימנים רשומים, זכויות יוצרים וסודות מקצועיים</b> נמצאים בצד ה<b>מוחשי</b> (משאבים טכנולוגיים), למרות שאי אפשר לגעת בהם. יש ספרים שמסווגים אותם אחרת, אבל במבחן הולכים לפי הטבלה. עוד בלבול: <b>מנגנוני בקרה ותכנון</b> = מוחשי ארגוני, אבל <b>תרבות ארגונית</b> = לא מוחשי אנושי. ו<b>מותג</b> = מוניטין = לא מוחשי."},{"t":"exam","x":"איך שואלים: “לאיזה סוג משאב שייך X?” (שני שלבים: קודם מוחשי או לא מוחשי, ואז איזה מבין הארבעה), או “מה מהבאים הוא משאב לא מוחשי?”. בנכון/לא נכון אוהבים לשאול על פטנט, מותג ותרבות ארגונית."},{"t":"h","x":"יכולת ליבה מול יכולת ייחודית"},{"t":"p","x":"<b>יכולת ליבה</b> (Core Competence) – לפי הסיכום: הפעולה שהפירמה עושה <b>טוב יותר מכל היכולות הפנימיות האחרות שלה</b>. היא לא תלויה בגורמים מחוץ לפירמה, ובדרך כלל יש לכל פירמה <b>יכולת ליבה אחת</b>. ההשוואה היא <b>פנימית</b>: “במה אנחנו הכי טובים?”."},{"t":"p","x":"<b>יכולת ייחודית</b> (Distinctive Competence) – פעולה שהפירמה עושה <b>טוב יותר מהמתחרות שלה</b>. ההשוואה היא <b>חיצונית</b>: “במה אנחנו טובים מכולם?”. יכולת ייחודית היא שלב אחד לפני יתרון תחרותי."},{"t":"p","x":"<b>הניסוח של המרצה</b> (כך זה מופיע במבחן): יכולת ליבה היא <b>פעילות שחשובה לתחרותיות של הפירמה</b>, ושהפירמה מבצעת <b>טוב יותר מהפעולות האחרות שהיא מבצעת</b>. שני חלקים: (1) הפעילות חשובה לתחרות, (2) ההשוואה היא <b>פנימית</b>. יכולת ייחודית = אותה פעילות, אבל מבוצעת <b>טוב יותר מהמתחרים</b>."},{"t":"table","head":["","יכולת ליבה","יכולת ייחודית"],"rows":[["מול מי משווים","מול <b>היכולות האחרות של החברה עצמה</b>","מול <b>המתחרים</b> בענף"],["השאלה","“מה אנחנו עושים הכי טוב?”","“מה אנחנו עושים טוב יותר מכולם?”"],["כמה יש","בדרך כלל אחת","לא לכל חברה יש"],["המקום בשרשרת RBV","חוליה שנייה (אחרי משאבים)","חוליה שלישית (לפני יתרון תחרותי)"],["דוגמה","מאפייה שהדבר הכי חזק אצלה הוא עמידה בזמני משלוח","המאפייה היחידה בעיר שמספקת תוך שעה, ואף מתחרה לא מצליח להתקרב"]]},{"t":"example","x":"לחברת ההובלות MoveIt יש כמה תחומים: אריזה, הובלה ושירות לקוחות. הכי טוב אצלה זה האריזה ← <b>יכולת ליבה</b>. אבל אם גם למתחרים יש אריזה טובה באותה רמה, זו <b>לא</b> יכולת ייחודית. רק אם האריזה שלה טובה יותר משל כל המתחרים (למשל אפס נזקים, כשאצל האחרים 3%) – היא גם <b>יכולת ייחודית</b>.","title":"ליבה, אבל לא בהכרח ייחודית"},{"t":"trap","x":"יכולת ליבה <b>לא מבטיחה</b> עדיפות על המתחרים – אפשר להיות “הכי טובים אצלנו” ועדיין בינוניים בענף. מילים כמו “טוב יותר מהמתחרים”, “אף מתחרה לא מגיע לרמה” ← <b>ייחודית</b>. מילים כמו “הדבר שהחברה עושה הכי טוב”, “החוזקה המרכזית שלה” ← <b>ליבה</b>. ואל תבלבלו עם <b>KSF</b> (יחידה 2): KSF הוא מה ש<b>הענף</b> דורש מכל מי שרוצה להצליח בו, לא יכולת של חברה מסוימת."},{"t":"exam","x":"איך שואלים: “לפי הסיכום, מהי יכולת ליבה?” / “מה ההבדל בין יכולת ליבה ליכולת ייחודית?” (מול מי משווים). או סיפור ← “האם זו יכולת ליבה או ייחודית?”. בנכון/לא נכון: “יכולת ליבה נמדדת מול המתחרים” – לא נכון."},{"t":"exam","x":"שאלה בסגנון המבחן: “פירמה מבצעת פעילות שחשובה לתחרותיות שלה טוב יותר מפעולות אחרות שלה – מה יש לה?” ← <b>יכולת ליבה</b>. המסיחים: “יכולת ייחודית” (זה רק כשהיא טובה <b>מהמתחרים</b>), “יתרון תחרותי בר-קיימא” (דורש עמידה בכל VRIN), “שרשרת ערך יעילה ויכולת הטמעה טובה” (לא קשור להגדרה), “אף תשובה אינה נכונה”. מילת המפתח: <b>“מפעולות אחרות שלה”</b> = השוואה פנימית = ליבה."},{"t":"h","x":"מודל VRIN – האם היתרון בר-קיימא?"},{"t":"p","x":"<b>מודל VRIN</b> (על בסיס עבודתו של ג׳יי בארני, Barney) בודק אם משאב או יכולת יכולים לתת <b>יתרון תחרותי בר-קיימא</b> – כזה שמחזיק לאורך זמן. בודקים ארבעה קריטריונים, <b>לפי הסדר</b>. בכל שלב שבו התשובה היא “לא”, המודל אומר מה תהיה התוצאה:"},{"t":"table","head":["אות","קריטריון","השאלה","אם התשובה “לא” – התוצאה"],"rows":[["<b>V</b>","<b>בעל ערך</b> (Valuable)","האם המשאב עוזר לנצל הזדמנות, להתגונן מאיום או ליצור ערך ללקוח?","<b>חיסרון תחרותי</b> – המשאב לא עוזר ואולי רק עולה כסף"],["<b>R</b>","<b>נדיר</b> (Rare)","האם רק לנו (או למעט מאוד חברות) יש אותו?","<b>שוויון תחרותי</b> – גם למתחרים יש, אז אנחנו רק “בגובה” שלהם"],["<b>I</b>","<b>קשה לחיקוי</b> (Inimitable)","האם יהיה למתחרים קשה ויקר להעתיק אותו?","<b>יתרון תחרותי זמני</b> – עד שיעתיקו"],["<b>N</b>","<b>בלתי ניתן להחלפה</b> (Non-substitutable)","האם אין משאב <b>אחר</b> שמשיג אותה תוצאה?","<b>יתרון תחרותי לא מנוצל</b> – קיים תחליף, ולכן אי אפשר להפיק מהיתרון את מלוא הערך"],["✓","<b>כן לכל הארבעה</b>","—","<b>יתרון תחרותי בר-קיימא</b>"]]},{"t":"steps","x":["מתחילים ב-<b
