>V</b> וממשיכים לפי הסדר: V ← R ← I ← N.","עוצרים ב<b>“לא” הראשון</b>. התוצאה שמתחת לאותו קריטריון היא התשובה.","רק אם עברנו את כל הארבעה עם “כן” – יש <b>יתרון תחרותי בר-קיימא</b>."],"title":"איך פותרים שאלת VRIN"},{"t":"list","x":["<b>“לכל המתחרים יש”, “אפשר לקנות את זה מכל ספק”</b> ← לא נדיר ← שוויון תחרותי.","<b>“תוך חצי שנה המתחרה העתיק”</b> ← קל לחיקוי ← יתרון זמני.","<b>“הלקוחות יכולים להשיג אותה תוצאה בדרך אחרת”</b> ← יש תחליף ← יתרון לא מנוצל.","<b>“הלקוחות לא מעריכים את זה בכלל”</b> ← אין ערך ← חיסרון תחרותי."]},{"t":"example","x":"חברת הביטוח SafeNet בנתה צ׳אט-בוט שעונה ללקוחות. זה <b>בעל ערך</b> (חוסך זמן), אבל כל חברות הביטוח קנו בוט דומה מאותו ספק ← <b>לא נדיר</b> ← <b>שוויון תחרותי</b>. לעומת זאת, חברת השוקולד ChocoAlp: מתכון בן מאה שנה (ערך), אין לאף אחד אחר (נדיר), מוגן וסודי ותלוי במומחיות שנבנתה דורות (קשה לחיקוי), ואין מוצר אחר שנותן ללקוחות את אותה חוויה (אין תחליף) ← <b>יתרון תחרותי בר-קיימא</b>.","title":"שתי תוצאות שונות"},{"t":"trap","x":"בקורס הזה המודל הוא <b>VRIN</b>, וה-N הוא <b>Non-substitutable</b> (בלתי ניתן להחלפה) – לא O של Organization כמו ב-VRIO. ה-I הוא <b>Inimitable</b> (קשה לחיקוי) – לא Innovation. ההבדל בין I ל-N: <b>חיקוי</b> = המתחרה משיג <b>אותו משאב</b>; <b>תחליף</b> = המתחרה משיג <b>אותה תוצאה במשאב אחר</b>. ועוד: “לא נדיר” נותן <b>שוויון</b>, לא חיסרון. חיסרון יש רק כשאין ערך בכלל."},{"t":"exam","x":"איך שואלים: סיפור על משאב ← “מה התוצאה לפי VRIN?” (חיסרון / שוויון / זמני / לא מנוצל / בר-קיימא). או “מה מייצגת האות N?”. בנכון/לא נכון: “משאב בעל ערך שאינו נדיר נותן יתרון זמני” – לא נכון (שוויון)."},{"t":"h","x":"טבלת VRIN של המרצה: תוצאה תחרותית והשלכות על הביצועים"},{"t":"p","x":"בשקף של המרצה הטבלה של VRIN מוסיפה עמודה שאין בתרשים של הסיכום: <b>השלכות על ביצועים</b> – איזו <b>תשואה</b> הפירמה צפויה להשיג. לצד הטבלה מופיע שוב החץ של גישת המשאבים: <b>משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי</b>. כלומר VRIN הוא המבחן שבודק אם המשאב באמת יגיע עד סוף השרשרת."},{"t":"table","head":["בעל ערך?","נדיר?","יקר לחיקוי?","ללא תחליף?","תוצאה תחרותית","השלכות על ביצועים"],"rows":[["לא","לא","לא","לא","<b>חיסרון תחרותי</b>","<b>תשואה מתחת לממוצע</b>"],["כן","לא","לא","כן/לא","<b>שוויון תחרותי</b>","<b>תשואה ממוצעת</b>"],["כן","כן","לא","כן/לא","<b>יתרון תחרותי זמני</b>","<b>תשואה ממוצעת או מעל הממוצע</b>"],["כן","כן","כן","כן","<b>יתרון תחרותי בר-קיימא</b>","<b>תשואה מעל הממוצע</b>"]]},{"t":"list","x":["<b>איך קוראים את הטבלה</b>: שורה = דפוס של תשובות. מוצאים את השורה שמתאימה למשאב בסיפור, ולוקחים ממנה <b>שתי</b> תשובות: התוצאה התחרותית <b>וגם</b> התשואה.","<b>“כן/לא” בעמודת התחליף</b>: בשורות השוויון והיתרון הזמני התשובה על N <b>לא משנה את התוצאה</b>. כבר נכשלנו קודם (בנדירות או בחיקוי), אז גם בלי תחליף לא נגיע ליתרון בר-קיימא.","<b>יתרון זמני ≠ בהכרח רווח גבוה</b>: התשואה “ממוצעת <b>או</b> מעל הממוצע” – כל עוד לא העתיקו אותנו אפשר להרוויח יותר, אבל זה לא מובטח.","<b>רק “כן” לכל הארבעה</b> נותן תשואה מעל הממוצע <b>באופן בר-קיימא</b>."]},{"t":"example","x":"לרשת הקפה BrewBest יש שלושה משאבים. (1) קופות רושמות ישנות שמאטות את התור – <b>לא בעל ערך</b> ← חיסרון, תשואה מתחת לממוצע. (2) מכונות אספרסו טובות שהלקוחות אוהבים, אבל לכל הרשתות יש אותן – <b>ערך, לא נדיר</b> ← שוויון, תשואה ממוצעת. (3) אפליקציית הזמנה חדשה שאין לאף אחד, אבל מתחרה יכול לבנות כמוה תוך כמה חודשים – <b>ערך + נדיר, קל לחיקוי</b> ← יתרון זמני, תשואה ממוצעת או מעל הממוצע.","title":"שלוש שורות בטבלה"},{"t":"trap","x":"<b>שתי טבלאות, שני ניסוחים.</b> בתרשים של הסיכום יש גם תוצאה חמישית: משאב בעל ערך, נדיר וקשה לחיקוי <b>שיש לו תחליף</b> ← “יתרון תחרותי לא מנוצל”. בטבלה של המרצה אין שורה כזו – שם פשוט רואים שרק “כן” ב<b>כל</b> הארבעה (כולל N) מוביל ליתרון בר-קיימא ולתשואה מעל הממוצע. אם השאלה שואלת על <b>השלכות על ביצועים</b> או על <b>תשואה</b> – עונים לפי הטבלה של המרצה. ועוד מלכודת: “שוויון תחרותי ← תשואה מתחת לממוצע” – לא נכון; שוויון = תשואה <b>ממוצעת</b>."},{"t":"exam","x":"איך שואלים: “משאב בעל ערך ונדיר אך קל לחיקוי – מה התוצאה ומה ההשלכה על הביצועים?” (יתרון זמני; תשואה ממוצעת או מעל הממוצע), “מה מהבאים אינו נכון לגבי טבלת VRIN?”, או סיפור + “איזו תשואה צפויה לחברה?”. בתשובה פתוחה כתבו את שני הרכיבים: <b>התוצאה התחרותית</b> ו<b>התשואה</b>."},{"t":"h","x":"מודל SWOT"},{"t":"p","x":"<b>SWOT</b> ממפה ארבעה סוגי גורמים. השאלה הראשונה היא תמיד: האם הגורם <b>בשליטת החברה</b> (פנימי) או <b>בסביבה</b> (חיצוני)?"},{"t":"table","head":["","חיובי","שלילי"],"rows":[["<b>פנימי</b> (בתוך החברה)","<b>S – חוזקות</b> (Strengths): במה אנחנו טובים? במה אנחנו טובים יותר מחברות אחרות?","<b>W – חולשות</b> (Weaknesses): מה החסרונות שלנו? איפה נקודות התורפה?"],["<b>חיצוני</b> (בסביבה)","<b>O – הזדמנויות</b> (Opportunities): כל מצב בחוץ שיכול להגדיל את הרווחיות","<b>T – איומים</b> (Threats): כל מצב בחוץ שעלול לפגוע ברווחיות"]]},{"t":"p","x":"בסיכום יש גם <b>שקף יישום</b>: מה עושים עם כל רכיב אחרי שמיפינו אותו. במרכז עומדים <b>המשאבים והיכולות</b> של החברה, והם “משחקים” מול ההזדמנויות ומול האיומים."},{"t":"table","head":["רכיב","מה עושים איתו"],"rows":[["<b>חוזקה</b>","הופכים אותה ל<b>יכולת ליבה</b>, וממנה ל<b>יתרון תחרותי בר-קיימא</b>"],["<b>חולשה</b>","<b>מבטלים</b> אותה, או <b>הופכים אותה לחוזקה</b>"],["<b>הזדמנות</b>","<b>מנצלים</b> אותה בעזרת חוזקה"],["<b>איום</b>","<b>מסמנים אותו כמגבלה</b> (ונערכים), או <b>הופכים אותו להזדמנות</b>"]]},{"t":"example","x":"רשת חדרי הכושר FitZone: מאמנים מוכרים ואהובים (<b>S</b>), מכשירים ישנים בחלק מהסניפים (<b>W</b>), עלייה במודעות לבריאות אחרי הקורונה (<b>O</b>), רשת בינלאומית זולה שנכנסת לעיר (<b>T</b>).","title":"SWOT לחדר כושר"},{"t":"trap","x":"חוק חדש, מתחרה חדש, ריבית, מגמה בציבור, מלחמה – תמיד <b>חיצוניים</b> (O או T), גם אם הם פוגעים מאוד בחברה. מותג, עובדים, טכנולוגיה, מבנה העלויות של החברה – תמיד <b>פנימיים</b> (S או W). השאלה היא לא “טוב או רע” אלא “בפנים או בחוץ”."},{"t":"exam","x":"איך שואלים: “איזה מהגורמים הוא איום (T)?”, “מה מהבאים הוא חולשה ולא איום?”, “לפי שקף היישום, מה עושים עם חולשה?” (מבטלים או הופכים לחוזקה)."},{"t":"h","x":"מודל TOWS – מ-SWOT לאסטרטגיות"},{"t":"p","x":"SWOT רק <b>ממפה</b>. <b>TOWS</b> לוקח את אותם ארבעה רכיבים ו<b>גוזר מהם אסטרטגיות פעולה</b> בעזרת <b>הצלבה</b>: כל גורם פנימי (S או W) נפגש עם גורם חיצוני (O או T). מתקבלת טבלה של ארבעה תאים:"},{"t":"table","head":["","חוזקות (S)","חולשות (W)"],"rows":[["<b>הזדמנויות (O)</b>","<b>SO</b>: משתמשים בחוזקות כדי לנצל הזדמנויות","<b>WO</b>: מנצלים הזדמנויות כדי להתגבר על חולשות"],["<b>איומים (T)</b>","<b>ST</b>: משתמשים בחוזקות כדי להתמודד עם איומים","<b>WT</b>: מצמצמים חולשות ומתגוננים מפני איומים"]]},{"t":"table","head":["תא","ההיגיון","אופי","דוגמה קצרה"],"rows":[["<b>SO</b>","חוזקה + הזדמנות = מנוף לצמיחה","התקפי (Maxi-Maxi)","מותג חזק + ביקוש גובר בחו״ל ← יציאה לשווקים חדשים"],["<b>WO</b>","הזדמנות בחוץ עוזרת לתקן חולשה בפנים","שיפור (Mini-Maxi)","מערכות מיושנות + מענק ממשלתי לדיגיטציה ← שדרוג המערכות"],["<b>ST</b>","חוזקה משמשת מגן מול איום","הגנה בעזרת כוח (Maxi-Mini)","קופת מזומנים גדולה + מתחרה זול נכנס ← מבצע נאמנות ממומן"],["<b>WT</b>","חולשה פוגשת איום – הכי מסוכן","הגנתי (Mini-Mini)","חוב גבוה + מיתון ← צמצום, מיזוג או יציאה מתחום"]]},{"t":"steps","x":["רושמים את ה-SWOT ו<b>ממספרים</b> כל פריט: S1, S2… W1… O1… T1…","בונים טבלה: <b>למעלה</b> הגורמים הפנימיים (S, W), <b>בצד</b> החיצוניים (O, T).","לכל תא מחפשים <b>צירוף הגיוני</b>: גורם פנימי אחד או יותר + גורם חיצוני אחד או יותר.","מנסחים מהצירוף <b>פעולה</b> (לא עוד תיאור מצב), ומציינים את הקודים, למשל “S2 + O1”.","נותנים לאסטרטגיה <b>שם</b> (צמיחה, התייעלות, חסמי כניסה, חדשנות…)."],"title":"איך בונים TOWS מתוך SWOT"},{"t":"p","x":"<b>דוגמת הסיכום – בנק הבינלאומי.</b> ה-SWOT של הבנק: <b>חוזקות</b> – מעמד חזק בשוק המקומי (S1), איתנות פיננסית (S2), דירוג אשראי טוב ויציב (S3), כוח לוביסטי (S4), רשת סניפים רחבה (S5). <b>חולשות</b> – אין בידול (W1), יעילות תפעולית נמוכה (W2), מוניטין לא טוב (W3), תשתית טכנולוגית סטנדרטית (W4). <b>הזדמנויות</b> – צמיחה בנדל״ן (O1), רכישת נכסים בחו״ל (O2), רפורמה במערכת הבנקאות (O3), השקעה בענף היהלומים (O4). <b>איומים</b> – ריבית אפס (T1), רגולציה (T2), לקוחות שעוברים בין בנקים (T3), בנקאות חברתית (T4)."},{"t":"table","head":["תא","הצירוף","האסטרטגיה שנגזרה"],"rows":[["<b>SO</b>","איתנות פיננסית (S2) + צמיחת הנדל״ן (O1) + השקעה ביהלומים (O4)","<b>צמיחה בהגוונה</b>: להשתמש בכסף החזק כדי להיכנס לתחומים חדשים וצומחים"],["<b>WO</b>","השקעה ביהלומים (O4) ← הכנסות גבוהות יותר ← תיקון היעילות הנמוכה (W2)","<b>הגברת היעילות התפעולית</b>: הכסף מההזדמנות מממן ייעול"],["<b>ST</b>","כוח לוביסטי (S4) מול בנקאות חברתית (T4)","<b>הגדלת חסמי הכניסה</b>: לפעול לחקיקה שתגביל את התחזקות הבנקים החברתיים"],["<b>WT</b>","תשתית טכנולוגית (W4) ומוניטין (W3) מול מעבר לקוחות בין בנקים (T3)","<b>חדשנות</b>: לשדרג טכנולוגיה ומוניטין כדי שלקוחות לא יעזבו"]]},{"t":"trap","x":"<b>SWOT ≠ TOWS</b>: SWOT = רשימת גורמים; TOWS = אסטרטגיות מהצלבה. בשם התא, האות הראשונה היא תמיד הפנימית (S/W) והשנייה החיצונית (O/T). <b>WO</b> לא משתמש בחוזקה – הוא משתמש בהזדמנות כדי לתקן חולשה. <b>ST</b> לא מנצל הזדמנות – הוא משתמש בחוזקה כדי להתגונן. ואין תאים כמו “SW” או “OT”: כל אסטרטגיה מצליבה פנים עם חוץ."},{"t":"exam","x":"איך שואלים: סיפור על צעד של חברה ← “לאיזה תא ב-TOWS הוא שייך?”. כדי לפתור: (1) מצאו את הגורם הפנימי – חוזקה או חולשה? (2) מצאו את הגורם החיצוני – הזדמנות או איום? (3) חברו את האותיות. ובשאלות על הבנק: הגדלת חסמי כניסה = ST, צמיחה בהגוונה = SO, התייעלות = WO, חדשנות = WT."},{"t":"h","x":"TOWS לפי המרצה: כל גורם פנימי מול כל גורם חיצוני, ופערי יכולות"},{"t":"p","x":"כך המרצה מסכם את המודל: <b>TOWS נשען על SWOT</b>. SWOT פורט את החוזקות והחולשות (<b>בתוך</b> הפירמה) ואת ההזדמנויות והאיומים (<b>מחוץ</b> לפירמה). TOWS מגבש אסטרטגיה בעזרת <b>אינטגרציה של כל גורם פנימי עם כל גורם חיצוני</b>. לכן יש בדיוק ארבעה תאים: S×O, W×O, S×T, W×T – כל הצירופים האפשריים, ואף צירוף לא נשאר בחוץ."},{"t":"p","x":"<b>פערי יכולות.</b> מכיוון שכל גורם פנימי נפגש עם כל גורם חיצוני, המודל עוסק גם ב<b>פער</b> שבין <b>היכולות הקיימות</b> של הפירמה לבין <b>היכולות הנדרשות</b> כדי לממש הזדמנות בשוק. כשהזדמנות פוגשת חולשה (תא <b>WO</b>), השאלה היא בדיוק: מה חסר לנו כדי לנצל אותה, ואיך נסגור את הפער – נפתח, נגייס, נרכוש או נחבור לשותף."},{"t":"table","head":["שלב","מה עושים","דוגמה"],"rows":[["1. מזהים הזדמנות (O)","מה קורה בחוץ שאפשר להרוויח ממנו?","לקוחות עוברים להזמנות באפליקציה"],["2. בודקים את היכולות (S/W)","האם יש לנו את היכולת הנדרשת?","אין לנו צוות פיתוח דיגיטלי (W)"],["3. מגדירים את הפער","יכולת נדרשת פחות יכולת קיימת","חסרה יכולת לבנות ולתחזק אפליקציה"],["4. מנסחים אסטרטגיה (WO)","פעולה שסוגרת את הפער כדי לממש את ההזדמנות","רכישת סטארטאפ קטן וגיוס מפתחים"]]},{"t":"example","x":"לחברת ההובלות ShipRight צי משאיות גדול (S1), אבל אין לה מערכת מעקב דיגיטלית (W1). בשוק יש ביקוש גובר למשלוחים עם מעקב בזמן אמת (O1) ונכנסים מתחרים דיגיטליים (T1). TOWS מצליב <b>כל</b> פריט עם <b>כל</b> פריט: S1+O1 (להרחיב קווי משלוח), W1+O1 (לסגור את <b>פער היכולות</b> – לפתח מערכת מעקב), S1+T1 (להוריד מחירים בעזרת יתרון הגודל), W1+T1 (שיתוף פעולה עם חברת תוכנה לפני שהמתחרים ייקחו את הלקוחות).","title":"כל פנימי × כל חיצוני"},{"t":"trap","x":"היגד כמו “TOWS עוסק גם בניתוח פערי היכולות הקיימות מול היכולות הנדרשות למימוש הזדמנויות” הוא <b>נכון</b> – אל תפסלו אותו רק כי המילה “פער” לא מופיעה בשמות התאים. ומלכודת הפוכה: “TOWS מחליף את SWOT ואינו נשען עליו” – <b>לא נכון</b>; TOWS בנוי מתוך הרשימות של SWOT."},{"t":"exam","x":"בחלק ב׳ (נכון/לא נכון) כתבו בנימוק את שלושת המרכיבים: (1) TOWS נשען על SWOT (פנים: S, W; חוץ: O, T), (2) הוא משלב כל גורם פנימי עם כל גורם חיצוני, (3) כך הוא מגלה גם פערים בין היכולות הקיימות לבין מה שנדרש כדי לנצל הזדמנויות."}],"cheat":["שרשרת הערך = עיקריות: לוגיסטיקה נכנסת, תפעול, לוגיסטיקה יוצאת, שיווק ומכירות, שירות","פעילויות תומכות = תשתיות, משאבי אנוש, פיתוח טכנולוגי (מו״פ), רכש; שולי רווח = הערך שנוצר פחות עלות הפעילויות","RBV = יתרון מבפנים: משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי","משאב מוחשי = פיננסי, ארגוני (בקרה ותכנון), פיזי, טכנולוגי – <b>פטנטים וסימנים רשומים = מוחשיים</b> (טבלת הקורס)","משאב לא מוחשי = אנושי (ידע, תרבות ארגונית), חדשנות, מוניטין (מותג), קשרים חיצוניים","יכולת ליבה = פעילות חשובה לתחרותיות שהפירמה עושה טוב יותר <b>מפעילויותיה האחרות</b> (השוואה פנימית)","יכולת ייחודית = פעילות שהפירמה עושה טוב יותר <b>מהמתחרים</b> (השוואה חיצונית)","VRIN (לא VRIO) = בעל ערך, נדיר, קשה לחיקוי, ללא תחליף (Non-substitutable); עוצרים ב״לא״ הראשון","טבלת המרצה = אין ערך: חיסרון, מתחת לממוצע; לא נדיר: שוויון, ממוצעת; קל לחיקוי: יתרון זמני, ממוצעת או מעל","כן לכל הארבעה = יתרון בר-קיימא, תשואה מעל הממוצע (בתרשים הסיכום: יש תחליף = יתרון לא מנוצל)","SWOT = S/W בפנים, O/T בחוץ; TOWS = כל פנימי × כל חיצוני (SO, WO, ST, WT), כולל פערי יכולות מול הזדמנויות","דוגמת הבנק = SO צמיחה בהגוונה; WO התייעלות; ST הגדלת חסמי כניסה; WT חדשנות"],"mcq":[{"id":"m3-1","q":"חברת האופניים GreenBike מקבלת שלדות מספק ומאחסנת אותן, מרכיבה את האופניים במפעל, מתקנת אופניים ללקוחות במסגרת האחריות, ומגייסת ומכשירה מכונאים חדשים. לפי שרשרת הערך של פורטר, איזו מהפעילויות היא <b>תומכת</b>?","o":["קבלת השלדות מהספק ואחסונן במחסן","גיוס מכונאים חדשים והכשרתם","הרכבת האופניים במפעל","תיקון אופניים ללקוחות במסגרת האחריות"],"a":1,"w":["קבלה ואחסון של תשומות = לוגיסטיקה נכנסת, פעילות עיקרית.","","הרכבה היא ייצור = תפעול, פעילות עיקרית.","תיקון אצל הלקוח = שירות, פעילות עיקרית."],"why":"גיוס והכשרה = ניהול משאבי אנוש, אחת מארבע הפעילויות התומכות."},{"id":"m3-2","q":"יצרנית החטיפים SnackPro פועלת בכמה תחומים. איזו מהפעילויות הבאות היא פעילות <b>עיקרית</b> בשרשרת הערך?","o":["משא ומתן עם מגדלי תפוחי אדמה על מחיר שנתי","פיתוח מתכון אפייה חדש במעבדה","הטמעת מערכת חדשה להנהלת חשבונות","משלוח המארזים מהמפעל לרשתות השיווק"],"a":3,"w":["בחירת ספקים וסגירת מחיר = רכש, פעילות תומכת.","פיתוח ומו״פ = פיתוח טכנולוגי, פעילות תומכת.","כספים ומערכות ניהול = תשתיות/אדמיניסטרציה, פעילות תומכת.",""],"why":"הפצת המוצר המוגמר ללקוחות = לוגיסטיקה יוצאת, פעילות עיקרית."},{"id":"m3-3","q":"אפליקציית המשלוחים FoodDash משקיעה מיליונים בקמפיין עם משפיענים ובמבצעי הנחה לנרשמים חדשים. לאיזו פעילות בשרשרת הערך שייכת ההשקעה?","o":["שיווק ומכירות","שירות","תשתיות / אדמיניסטרציה","פיתוח טכנולוגי"],"a":0,"w":["","שירות הוא מה שקורה אחרי המכירה (תמיכה, תיקונים), לא פרסום ומבצעים.","תשתיות הן הנהלה, כספים ומשפטים, לא קמפיין פרסומי.","פיתוח טכנולוגי הוא מו״פ ופיתוח מערכות, לא פרסום."],"why":"פרסום, קידום ומבצעים = שיווק ומכירות, פעילות עיקרית."},{"id":"m3-4","q":"לפי מודל שרשרת הערך, מהם <b>שולי הרווח</b> (Margin)?","o":["סך העלויות של הפעילויות התומכות בלבד","ההפרש בין המחיר של החברה למחיר של המתחרים","ההפרש בין הערך הכולל שהחברה יוצרת לבין העלות של ביצוע כל הפעילויות","החלק מההכנסות שמושקע מחדש במו״פ"],"a":2,"w":["שולי הרווח הם הפרש בין ערך לעלות, לא סכום של עלויות.","שולי הרווח לא נמדדים מול מתחרים, אלא מול עלות הפעילויות של החברה עצמה.","","השקעה במו״פ היא חלק מהעלויות (פיתוח טכנולוגי), לא שולי הרווח."],"why":"בקצה החץ של המודל: הערך שנוצר פחות עלות כל הפעילויות = שולי הרווח."},{"id":"m3-5","q":"מפעל האלקטרוניקה TechParts מקבל רכיבים מהספקים, בודק אותם בשער המפעל ומאחסן אותם במחסן עד שהם עולים לפס הייצור. איזו פעילות זו?","o":["רכש","תפעול","לוגיסטיקה נכנסת","לוגיסטיקה יוצאת"],"a":2,"w":["רכש הוא בחירת ספקים, מיקוח וחתימה על חוזה – לא הקבלה הפיזית והאחסון.","תפעול מתחיל כשהרכיבים עולים לפס הייצור, לא בשלב האחסון.","","לוגיסטיקה יוצאת היא הפצת המוצר המוגמר ללקוחות."],"why":"קבלה, בדיקה ואחסון של תשומות = לוגיסטיקה נכנסת, פעילות עיקרית."},{"id":"m3-6","q":"מה המטרה המרכזית של ניתוח שרשרת הערך?","o":["לזהות באילו פעילויות פנימיות נוצר ערך ואיפה אפשר לחסוך בעלויות","למפות את הכוחות שקובעים את האטרקטיביות של הענף","לבדוק אם משאב עומד בארבעה קריטריונים ליתרון בר-קיימא","לגזור אסטרטגיות מהצלבת חוזקות, חולשות, הזדמנויות ואיומים"],"a":0,"w":["","זה מודל חמשת הכוחות (יחידה 2), מודל חיצוני.","זה מודל VRIN.","זה מודל TOWS."],"why":"שרשרת הערך היא כלי פנימי: מפרקים את הארגון לפעילויות ומחפשים מקורות ערך וחיסכון."},{"id":"m3-7","q":"איזו מהפעילויות הבאות <b>אינה</b> פעילות תומכת בשרשרת הערך?","o":["רכש","ניהול משאבי אנוש","פיתוח טכנולוגי","שירות"],"a":3,"w":["רכש היא אחת מארבע הפעילויות התומכות.","משאבי אנוש היא פעילות תומכת.","פיתוח טכנולוגי (מו״פ) היא פעילות תומכת.",""],"why":"שירות (לאחר מכירה) היא פעילות עיקרית. התומכות: תשתיות, משאבי אנוש, פיתוח טכנולוגי, רכש."},{"id":"m3-8","q":"לפי גישת המשאבים (RBV) בסיכום, מה הסדר הנכון של השרשרת שמובילה ליתרון תחרותי?","o":["משאבים ← יכולת ייחודית ← יכולת ליבה ← יתרון תחרותי","משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי","יכולת ליבה ← משאבים ← יתרון תחרותי ← יכולת ייחודית","יתרון תחרותי ← יכולת ייחודית ← יכולת ליבה ← משאבים"],"a":1,"w":["הסדר הפוך באמצע: קודם יכולת ליבה (מול עצמנו), ואז ייחודית (מול המתחרים).","","השרשרת מתחילה במשאבים ומסתיימת ביתרון התחרותי.","זה סדר הפוך לגמרי: היתרון הוא התוצאה, לא נקודת ההתחלה."],"why":"המשאבים בונים יכולת ליבה; כשהיא טובה יותר מהמתחרים היא יכולת ייחודית; ממנה נוצר יתרון תחרותי."},{"id":"m3-9","q":"מנכ״לית חברת הסייבר ShieldOne אומרת: “ההצלחה שלנו לא באה מהענף – היא באה מצוות החוקרים שלנו, מהידע שצברנו ומהפטנטים שלנו.” לאיזו גישה מתאימה האמירה?","o":["גישת המשאבים (RBV)","מודל חמשת הכוחות של פורטר","ניתוח PESTEL","מיפוי קבוצות אסטרטגיות"],"a":0,"w":["","חמשת הכוחות מסבירים רווחיות דרך מבנה הענף – בדיוק מה שהמנכ״לית שוללת.","PESTEL ממפה כוחות מאקרו חיצוניים, לא משאבים פנימיים.","זה כלי לניתוח מתחרים לפי שני ממדים, לא הסבר פנימי ליתרון."],"why":"RBV גוזרת את היתרון התחרותי מבסיס המשאבים הפנימי: אנשים, ידע ופטנטים."},{"id":"m3-10","q":"איזה מהבאים הוא <b>משאב מוחשי</b> לפי טבלת המשאבים בקורס?","o":["המוניטין של החברה בעיני הלקוחות","התרבות הארגונית של החברה","קו ייצור אוטומטי במפעל","הקשרים של המנכ״ל עם גורמי המפתח בענף"],"a":2,"w":["מוניטין הוא משאב לא מוחשי.","תרבות ארגונית היא משאב לא מוחשי (אנושי).","","קשרים חיצוניים הם משאב לא מוחשי."],"why":"מכונות וציוד = משאב מוחשי פיזי."},{"id":"m3-11","q":"חברת התרופות MediGel רשמה 12 פטנטים על נוסחאות חדשות. לפי טבלת המשאבים בקורס, לאיזה סוג משאב שייכים הפטנטים?","o":["משאב לא מוחשי – חדשנות","משאב מוחשי – טכנולוגי","משאב לא מוחשי – מוניטין","משאב מוחשי – פיזי"],"a":1,"w":["חדשנות (לא מוחשי) היא רעיונות וכישורים מדעיים; הפטנט הרשום עצמו מופיע בצד המוחשי.","","מוניטין הוא תדמית בעיני לקוחות, לא פטנט.","פיזי = מבנים, מכונות, קרקע. פטנט נמצא בסוג הטכנולוגי."],"why":"בטבלה: פטנטים, סימנים רשומים, זכויות יוצרים וסודות מקצועיים = משאבים מוחשיים טכנולוגיים."},{"id":"m3-12","q":"ברשת הקמעונאות StoreLine פועלים מנגנון בקרה ותיאום בין הסניפים ומערכת מסודרת לתכנון ופיקוח. איזה סוג משאב זה?","o":["משאב לא מוחשי – אנושי","משאב מוחשי – פיננסי","משאב לא מוחשי – קשרים חיצוניים","משאב מוחשי – ארגוני"],"a":3,"w":["אנושי = ידע, ניסיון, אמון ותרבות. מנגנוני בקרה ותכנון הם ארגוניים ומוחשיים.","פיננסי = אשראי והון.","קשרים חיצוניים = יחסים עם גורמי מפתח בענף, לא מנגנון פנימי.",""],"why":"מנגנוני בקרה, תיאום, תכנון ופיקוח = משאבים מוחשיים ארגוניים."},{"id":"m3-13","q":"לקוחות רבים רואים במותג המכוניות AutoPrime סמל לאיכות ולאמינות, ויש סביבו “מיתוס” של מכונית שלא מתקלקלת. איזה סוג משאב מתואר?","o":["משאב מוחשי – טכנולוגי","משאב לא מוחשי – מוניטין","משאב לא מוחשי – חדשנות","משאב מוחשי – ארגוני"],"a":1,"w":["טכנולוגי (מוחשי) = פטנטים וסימנים רשומים. כאן מדובר בתפיסה של הלקוחות.","","חדשנות = רעיונות ויכולות פיתוח, לא תדמית.","ארגוני = מנגנוני בקרה ותכנון בתוך החברה."],"why":"מותג, מיצוב, מיתוס ותפיסת האיכות בעיני הלקוחות = מוניטין, משאב לא מוחשי."},{"id":"m3-14","q":"בחברת הייעוץ BrightPath יש עובדים עם ניסיון של עשרות שנים, אמון גבוה בין הצוותים ותרבות ארגונית של שיתוף ידע. איזה סוג משאב זה?","o":["משאב מוחשי – ארגוני","משאב לא מוחשי – חדשנות","משאב מוחשי – טכנולוגי","משאב לא מוחשי – אנושי"],"a":3,"w":["תרבות ארגונית היא לא מנגנון בקרה; בטבלה היא חלק מהמשאב האנושי הלא מוחשי.","חדשנות = רעיונות וכישורים מדעיים. כאן מדובר בידע, ניסיון ואמון.","טכנולוגי = פטנטים, סימנים רשומים, זכויות יוצרים.",""],"why":"ידע, ניסיון, אמון, כישורי ניהול ותרבות ארגונית = משאב לא מוחשי אנושי."},{"id":"m3-15","q":"לחברת הבנייה BuildCo יש הון עצמי גדול וקו אשראי מאושר מכמה בנקים. איזה סוג משאב זה?","o":["משאב מוחשי – פיננסי","משאב מוחשי – פיזי","משאב לא מוחשי – קשרים חיצוניים","משאב לא מוחשי – מוניטין"],"a":0,"w":["","פיזי = מבנים, מכונות, קרקע וחומרי גלם, לא כסף.","הקשר עם הבנק אולי עזר, אבל האשראי וההון עצמם הם משאב פיננסי מוחשי.","מוניטין הוא תדמית, לא הון."],"why":"מקורות אשראי והון עצמי = משאבים מוחשיים פיננסיים."},{"id":"m3-16","q":"לפי הסיכום, מהי <b>יכולת ליבה</b>?","o":["פעולה שהפירמה עושה טוב יותר מכל המתחרים שלה","משאב שעונה “כן” על ארבעת הקריטריונים של VRIN","הפעולה שהפירמה עושה הכי טוב מבין כל יכולותיה, בלי תלות בגורמים חיצוניים","תנאי שכל חברה בענף חייבת לעמוד בו כדי להצליח"],"a":2,"w":["זו ההגדרה של יכולת ייחודית – השוואה למתחרים.","זה משאב שנותן יתרון בר-קיימא, לא ההגדרה של יכולת ליבה.","","זה KSF – גורם מפתח להצלחה שמוכתב על ידי הענף."],"why":"יכולת ליבה = ההשוואה היא פנימית: במה הפירמה הכי טובה מבין הדברים שהיא עושה. לרוב יש אחת."},{"id":"m3-17","q":"ברשת המאפיות FreshBake, הדבר שהחברה עושה הכי טוב הוא עמידה בזמני משלוח. אבל שלוש רשתות מתחרות עומדות בזמנים בדיוק כמוה. מה נכון לגבי עמידה בזמנים ב-FreshBake?","o":["זו יכולת ייחודית, כי זה הדבר שהחברה עושה הכי טוב","זה יתרון תחרותי בר-קיימא","זו יכולת ליבה, אבל לא יכולת ייחודית","זו לא יכולת ליבה, כי גם מתחרים עושים את זה"],"a":2,"w":["ייחודית דורשת להיות טובים יותר מהמתחרים. כאן המתחרים טובים באותה מידה.","אין יתרון כשהמתחרים עושים בדיוק אותו דבר.","","יכולת ליבה נמדדת מול היכולות האחרות של החברה עצמה, לא מול המתחרים."],"why":"הכי טוב בתוך החברה = יכולת ליבה. כדי שתהיה גם ייחודית, היא צריכה להיות טובה יותר משל המתחרים."},{"id":"m3-18","q":"סטודיו העיצוב PixelCraft מצליח לספק עיצוב אתר מלא תוך 48 שעות. בדיקה בענף מראה שאף סטודיו מתחרה לא מצליח לעשות זאת בפחות משבועיים. איזה מושג מתאר את היכולת?","o":["יכולת ייחודית","משאב מוחשי","שוויון תחרותי","גורם מפתח להצלחה (KSF)"],"a":0,"w":["","מהירות עבודה היא יכולת – שילוב של משאבים, לא משאב מוחשי בודד.","שוויון הוא מצב שבו גם למתחרים יש אותו דבר. כאן אין לאף אחד.","KSF מוכתב על ידי הענף לכל החברות. כאן מדובר ביכולת של חברה אחת שעולה על כולם."],"why":"פעולה שהפירמה מבצעת טוב יותר מהמתחרות = יכולת ייחודית."},{"id":"m3-19","q":"חברת הדפוס OldPrint מחזיקה רשת גדולה של מכשירי פקס בכל הסניפים, וזה עולה לה הרבה כסף. הלקוחות לא משתמשים בפקס כבר שנים ולא מעריכים את השירות. מה התוצאה לפי מודל VRIN?","o":["שוויון תחרותי","יתרון תחרותי זמני","יתרון תחרותי לא מנוצל","חיסרון תחרותי"],"a":3,"w":["שוויון מתקבל כשהמשאב בעל ערך אבל לא נדיר. כאן אין ערך בכלל.","יתרון זמני דורש משאב בעל ערך ונדיר. כאן המשאב נכשל כבר ב-V.","זו התוצאה כשרק ה-N נכשל. כאן נכשל הקריטריון הראשון.",""],"why":"המשאב לא בעל ערך (V = לא) ← חיסרון תחרותי. הוא רק עולה כסף."},{"id":"m3-20","q":"כל הבנקים בישראל קנו מאותו ספק את אותה אפליקציה להעברת כספים מהירה. הלקוחות מאוד אוהבים אותה. מה התוצאה לפי VRIN עבור כל בנק?","o":["חיסרון תחרותי","שוויון תחרותי","יתרון תחרותי זמני","יתרון תחרותי בר-קיימא"],"a":1,"w":["האפליקציה בעלת ערך (הלקוחות אוהבים אותה), ולכן אין חיסרון.","","יתרון זמני דורש משאב נדיר. כאן לכולם יש אותה אפליקציה.","המשאב לא נדיר, ולכן הוא לא עובר את VRIN."],"why":"בעל ערך, אבל לא נדיר (R = לא) ← שוויון תחרותי: הבנק רק “בגובה” של כולם."},{"id":"m3-21","q":"חברת הנעליים StepUp השיקה סוליה בעיצוב חדשני שאין לאף מתחרה, והלקוחות אהבו אותה מאוד. אחרי חצי שנה כל המתחרים הוציאו סוליות כמעט זהות. מה התוצאה לפי VRIN?","o":["יתרון תחרותי זמני","שוויון תחרותי","יתרון תחרותי לא מנוצל","חיסרון תחרותי"],"a":0,"w":["","בהתחלה הסוליה הייתה נדירה, ולכן היה יתרון. השאלה היא כמה זמן הוא החזיק.","יתרון לא מנוצל מתקבל כשהבעיה היא תחליף (N). כאן הבעיה היא העתקה (I).","לסוליה יש ערך – הלקוחות אהבו אותה."],"why":"בעל ערך + נדיר, אבל קל לחיקוי (I = לא) ← יתרון תחרותי זמני, עד שהעתיקו."},{"id":"m3-22","q":"לחברת BrightLamp יש טכנולוגיית נורות ייחודית, מוגנת היטב ושאין לאף אחד אחר. אבל הלקוחות יכולים לקבל את אותה תאורה וחיסכון באנרגיה גם מנורות LED רגילות שמבוססות על טכנולוגיה אחרת. מה התוצאה לפי VRIN?","o":["יתרון תחרותי בר-קיימא","שוויון תחרותי","יתרון תחרותי לא מנוצל","יתרון תחרותי זמני"],"a":2,"w":["המשאב נכשל ב-N: יש תחליף שנותן אותה תוצאה.","הטכנולוגיה נדירה (אין לאף אחד אחר), ולכן אין כאן שוויון.","","יתרון זמני הוא כשהמתחרים יכולים להעתיק. כאן הם לא מעתיקים – הם משיגים את התוצאה בדרך אחרת."],"why":"ערך + נדיר + קשה לחיקוי, אבל יש תחליף (N = לא) ← יתרון תחרותי לא מנוצל."},{"id":"m3-23","q":"לחברת השוקולד ChocoAlp מתכון סודי בן מאה שנה. הלקוחות מעריכים מאוד את הטעם, לאף מתחרה אין מתכון כזה, אי אפשר לשחזר אותו כי הוא תלוי במומחיות שנבנתה דורות, ואין מוצר אחר שנותן את אותה חוויה. מה התוצאה לפי VRIN?","o":["יתרון תחרותי זמני","יתרון תחרותי בר-קיימא","יתרון תחרותי לא מנוצל","שוויון תחרותי"],"a":1,"w":["יתרון זמני הוא כשקל להעתיק. כאן אי אפשר לשחזר את המתכון.","","זו התוצאה כשיש תחליף. כאן אין מוצר אחר שנותן אותה חוויה.","שוויון הוא כשלכולם יש. כאן לאף מתחרה אין."],"why":"כן על V, R, I ו-N ← יתרון תחרותי בר-קיימא."},{"id":"m3-24","q":"במודל VRIN שנלמד בקורס, מה מייצגת האות <b>N</b>?","o":["Organization – החברה מאורגנת לנצל את המשאב","New – משאב חדש שלא היה קודם בענף","Non-tradable – אי אפשר לקנות את המשאב בשוק","Non-substitutable – בלתי ניתן להחלפה"],"a":3,"w":["זה ה-O של מודל VRIO, לא חלק מ-VRIN בקורס הזה.","אין קריטריון כזה. חדשות לא מבטיחה יתרון.","קרוב לרעיון של נדירות, אבל זה לא מה שמייצגת האות N.",""],"why":"VRIN = Valuable, Rare, Inimitable, Non-substitutable. N שואל אם אין משאב אחר שמשיג אותה תוצאה."},{"id":"m3-25","q":"איזה מהצירופים הבאים נכון לפי תרשים VRIN?","o":["המשאב לא בעל ערך ← יתרון תחרותי זמני","המשאב לא נדיר ← שוויון תחרותי","המשאב קל לחיקוי ← חיסרון תחרותי","למשאב יש תחליף ← שוויון תחרותי"],"a":1,"w":["משאב בלי ערך מוביל לחיסרון תחרותי.","","משאב קל לחיקוי (אחרי ערך ונדירות) מוביל ליתרון זמני.","משאב שיש לו תחליף מוביל ליתרון לא מנוצל."],"why":"V לא = חיסרון; R לא = שוויון; I לא = יתרון זמני; N לא = יתרון לא מנוצל."},{"id":"m3-26","q":"רשת חדרי הכושר FitZone עורכת SWOT. איזה מהגורמים הוא <b>איום</b> (T)?","o":["המכשירים בחלק מהסניפים ישנים","המאמנים של הרשת מוכרים ואהובים","עלייה במודעות הציבור לבריאות","רשת בינלאומית זולה פותחת סניפים בעיר"],"a":3,"w":["מכשירים ישנים הם בעיה פנימית = חולשה (W).","זו חוזקה פנימית (S).","זו מגמה חיצונית חיובית = הזדמנות (O).",""],"why":"מתחרה חדש שנכנס הוא גורם חיצוני ושלילי = איום."},{"id":"m3-27","q":"חברת התוכנה CodeBase עורכת SWOT. איזה מהגורמים הוא <b>חולשה</b> (W)?","o":["מערכות המחשוב הפנימיות של החברה מיושנות","הממשלה מחמירה את חוקי הגנת הפרטיות","לקוחות בשוק עוברים לשירותי ענן","מיתון כלכלי צפוי בשנה הבאה"],"a":0,"w":["","חוק הוא גורם חיצוני = איום (T), גם אם הוא מקשה על החברה.","מגמה בשוק היא גורם חיצוני (הזדמנות או איום).","מיתון הוא גורם חיצוני = איום (T)."],"why":"מערכות של החברה עצמה הן גורם פנימי ושלילי = חולשה."},{"id":"m3-28","q":"לפי שקף היישום של SWOT בסיכום, מה עושים עם <b>חולשה</b>?","o":["מסמנים אותה כמגבלה","משתמשים בה כדי לנצל הזדמנות","מבטלים אותה או הופכים אותה לחוזקה","הופכים אותה ליכולת ליבה"],"a":2,"w":["סימון כמגבלה הוא מה שעושים עם איום.","הזדמנות מנצלים בעזרת חוזקה, לא בעזרת חולשה.","","את החוזקה הופכים ליכולת ליבה וליתרון בר-קיימא."],"why":"בשקף: חולשה ← ביטול חולשה או הפיכת חולשה לחוזקה."},{"id":"m3-29","q":"למותג הקוסמטיקה PureSkin יש מותג חזק ואמין (חוזקה). בשווקים באסיה יש ביקוש גובר לקוסמטיקה טבעית (הזדמנות). החברה מחליטה להשיק את הקו שלה באסיה. לאיזה תא ב-TOWS שייך הצעד?","o":["WO","ST","SO","WT"],"a":2,"w":["WO הוא תיקון חולשה בעזרת הזדמנות. כאן לא מתקנים חולשה.","ST משתמש בחוזקה מול איום. כאן אין איום.","","WT הוא צעד הגנתי מול חולשה ואיום יחד."],"why":"חוזקה (מותג) + הזדמנות (ביקוש באסיה) = SO."},{"id":"m3-30","q":"למשרד רואי החשבון NumberWise יש מערכות דיגיטליות חלשות (חולשה). הממשלה מציעה מענק גדול לעסקים שעוברים לדיגיטל (הזדמנות). המשרד מגיש בקשה למענק ומשדרג את המערכות. לאיזה תא ב-TOWS שייך הצעד?","o":["WO","SO","ST","WT"],"a":0,"w":["","SO מבוסס על חוזקה. כאן נקודת המוצא היא חולשה.","ST הוא חוזקה מול איום. אין כאן לא חוזקה ולא איום.","WT הוא חולשה מול איום. המענק הוא הזדמנות, לא איום."],"why":"הזדמנות חיצונית (מענק) משמשת לתיקון חולשה פנימית (מערכות חלשות) = WO."},{"id":"m3-31","q":"לרשת הסופרמרקטים FreshMart יש קופת מזומנים גדולה (חוזקה). רשת דיסקאונט זרה נכנסת לשוק עם מחירים נמוכים (איום). FreshMart משתמשת במזומנים כדי לממן מועדון לקוחות עם הנחות גדולות. לאיזה תא ב-TOWS שייך הצעד?","o":["SO","WO","WT","ST"],"a":3,"w":["הכניסה של רשת זרה היא איום, לא הזדמנות.","הצעד לא מתקן חולשה, ונקודת המוצא היא איום, לא הזדמנות.","WT יוצא מחולשה. כאן משתמשים בחוזקה – המזומנים.",""],"why":"חוזקה (מזומנים) משמשת להתגוננות מפני איום (מתחרה זול) = ST."},{"id":"m3-32","q":"לחברת התיירות TravelOn יש חוב גבוה ומעט לקוחות (חולשות), וצפוי מיתון שיפגע בתיירות (איום). ההנהלה מחליטה לסגור סניפים מפסידים ולחפש מיזוג עם חברה גדולה. לאיזה תא ב-TOWS שייך הצעד?","o":["SO","WT","WO","ST"],"a":1,"w":["אין כאן חוזקה ואין הזדמנות – רק חולשות ואיום.","","המיתון הוא איום, לא הזדמנות.","ST מבוסס על חוזקה. החוב והמחסור בלקוחות הם חולשות."],"why":"חולשה + איום ← צעד הגנתי (צמצום, מיזוג) = WT."},{"id":"m3-33","q":"בדוגמת הבנק בסיכום, הבנק מנצל את הכוח הלוביסטי שלו כדי לקדם חקיקה שתגביל את התחזקות הבנקים החברתיים. האסטרטגיה נקראת “הגדלת חסמי הכניסה”. באיזה תא היא נמצאת?","o":["ST","SO","WO","WT"],"a":0,"w":["","בנקאות חברתית היא איום (T4), לא הזדמנות.","כוח לוביסטי הוא חוזקה (S4), לא חולשה.","הצירוף הוא חוזקה מול איום, לא חולשה מול איום."],"why":"כוח לוביסטי (S4) + בנקאות חברתית (T4) ← הגדלת חסמי כניסה = ST."},{"id":"m3-34","q":"בדוגמת הבנק בסיכום, האסטרטגיה “צמיחה בהגוונה” משלבת איתנות פיננסית עם צמיחת הנדל״ן והשקעה בענף היהלומים. באיזה תא היא נמצאת?","o":["WO","ST","SO","WT"],"a":2,"w":["איתנות פיננסית היא חוזקה (S2), לא חולשה.","צמיחת הנדל״ן וענף היהלומים הם הזדמנויות, לא איומים.","","אין כאן לא חולשה ולא איום."],"why":"חוזקה (S2) + הזדמנויות (O1, O4) = SO."},{"id":"m3-35","q":"מה ההבדל בין SWOT ל-TOWS?","o":["SWOT בודק את הסביבה החיצונית בלבד, ו-TOWS את הפנימית בלבד","SWOT ממפה את הגורמים; TOWS מצליב אותם וגוזר מהם אסטרטגיות פעולה","TOWS הוא שם אחר לאותו מודל, רק בסדר אותיות שונה","SWOT מיועד לחברות גדולות ו-TOWS לעסקים קטנים"],"a":1,"w":["שניהם כוללים גורמים פנימיים (S, W) וחיצוניים (O, T).","","TOWS מוסיף שלב: הצלבה וגזירת אסטרטגיות.","אין הבחנה כזו. ההבדל הוא מיפוי מול גזירת פעולה."],"why":"SWOT = מיפוי. TOWS = הצלבת פנים וחוץ לארבעה סוגי אסטרטגיות: SO, WO, ST, WT."},{"id":"m3-36","q":"צוות אסטרטגיה בונה טבלת TOWS מתוך SWOT שכבר הכין. מה הצעד הנכון?","o":["לחבר שתי חוזקות כדי ליצור אסטרטגיית SS","למחוק את החולשות, כי TOWS עוסק רק בחוזקות","לרשום שוב את הגורמים בלי לנסח פעולה","לחבר בכל תא גורם פנימי (S או W) עם גורם חיצוני (O או T) ולנסח מהם פעולה"],"a":3,"w":["אין תא SS. כל אסטרטגיה ב-TOWS מצליבה פנים עם חוץ.","יש שני תאים שלמים לחולשות: WO ו-WT.","זה רק SWOT. ב-TOWS חייבים לגזור פעולה.",""],"why":"בונים טבלה: S/W למעלה, O/T בצד, ובכל תא מנסחים פעולה מהצירוף (למשל S2 + O1)."},{"id":"m3-37","q":"בחברת התוכנה DataPeak, מבין כל הפעולות שהחברה מבצעת, הבדיקות האוטומטיות – פעילות שחשובה מאוד לתחרותיות שלה – מבוצעות ברמה הגבוהה ביותר. אין מידע על רמת המתחרים. מה ניתן לומר?","o":["לחברה יש יכולת ייחודית","לחברה יש יתרון תחרותי בר-קיימא","לחברה יש יכולת ליבה","לחברה יש שרשרת ערך יעילה ויכולת הטמעה טובה של האסטרטגיה","אף תשובה אינה נכונה"],"a":2,"w":["ייחודית דורשת השוואה למתחרים, וכאן אין מידע עליהם.","בר-קיימא דורש “כן” בכל ארבעת קריטריוני VRIN; לא נבדק כאן.","","הסיפור לא עוסק ביעילות השרשרת אלא בפעילות אחת שבולטת בתוך החברה.","יש תשובה נכונה: יכולת ליבה."],"why":"פעילות חשובה לתחרותיות שהפירמה עושה טוב יותר משאר פעולותיה = יכולת ליבה (השוואה פנימית)."},{"id":"m3-38","q":"לפי טבלת VRIN של המרצה, משאב <b>בעל ערך ונדיר אך קל לחיקוי</b>. מה התוצאה התחרותית ומה ההשלכה על הביצועים?","o":["יתרון תחרותי זמני; תשואה ממוצעת או מעל הממוצע","שוויון תחרותי; תשואה ממוצעת","חיסרון תחרותי; תשואה מתחת לממוצע","יתרון תחרותי בר-קיימא; תשואה מעל הממוצע","יתרון תחרותי זמני; תשואה מתחת לממוצע"],"a":0,"w":["","שוויון הוא כשהמשאב לא נדיר. כאן הוא נדיר.","חיסרון הוא כשאין ערך בכלל.","בר-קיימא דורש שיהיה גם יקר לחיקוי.","התוצאה נכונה, אבל ההשלכה לא: ביתרון זמני התשואה ממוצעת או מעל הממוצע, לא מתחתיו."],"why":"V=כן, R=כן, I=לא ← יתרון זמני, ובטבלת המרצה: תשואה ממוצעת או מעל הממוצע."},{"id":"m3-39","q":"מה מהבאים <b>אינו נכון</b> לגבי טבלת VRIN של המרצה?","o":["משאב שאינו בעל ערך מוביל לחיסרון תחרותי ולתשואה מתחת לממוצע","משאב בעל ערך שאינו נדיר מוביל לשוויון תחרותי ולתשואה ממוצעת","רק “כן” בכל ארבעת הקריטריונים מוביל ליתרון בר-קיימא ולתשואה מעל הממוצע","בשורת השוויון התחרותי, התשובה על “ללא תחליף?” אינה משנה את התוצאה","משאב בעל ערך ונדיר אך קל לחיקוי מבטיח תשואה מעל הממוצע לאורך זמן"],"a":4,"w":["זה נכון: השורה הראשונה בטבלה.","זה נכון: השורה השנייה בטבלה.","זה נכון: השורה האחרונה בטבלה.","זה נכון: בעמודת התחליף כתוב “כן/לא”.",""],"why":"קל לחיקוי ← יתרון <b>זמני</b> בלבד, והתשואה ממוצעת <b>או</b> מעל הממוצע – לא מובטחת ולא לאורך זמן."},{"id":"m3-40","q":"חברת האנרגיה SunVolt משתמשת בפאנלים סולאריים יעילים שהלקוחות מעריכים, אבל כל המתחרות קונות את אותם פאנלים מאותו ספק. לפי טבלת המרצה, מה צפוי?","o":["חיסרון תחרותי ותשואה מתחת לממוצע","שוויון תחרותי ותשואה ממוצעת","יתרון זמני ותשואה מעל הממוצע","יתרון בר-קיימא ותשואה מעל הממוצע","תשובות ב, ג נכונות"],"a":1,"w":["לפאנלים יש ערך – הלקוחות מעריכים אותם.","","יתרון זמני דורש משאב נדיר; כאן לכולם יש אותו.","בר-קיימא דורש כן בכל הקריטריונים; כאן נכשלים כבר בנדירות.","ג אינה נכונה, ולכן גם הצירוף אינו נכון."],"why":"בעל ערך אבל לא נדיר ← שוויון תחרותי ← תשואה ממוצעת."},{"id":"m3-41","q":"מה מהבאים נכון לגבי מודל TOWS?","o":["הוא מחליף את SWOT ואינו נשען עליו","הוא משלב כל גורם פנימי עם כל גורם חיצוני כדי לגבש אסטרטגיה","הוא עוסק גם בפער בין היכולות הקיימות של הפירמה לבין היכולות הנדרשות לניצול הזדמנויות","תשובות ב, ג נכונות","אף תשובה אינה נכונה"],"a":3,"w":["TOWS בנוי מתוך הרשימות של SWOT.","נכון, אבל גם ג נכונה – לכן התשובה המלאה היא ד.","נכון, אבל גם ב נכונה – לכן התשובה המלאה היא ד.","","ב ו-ג נכונות."],"why":"TOWS נשען על SWOT, מצליב כל פנימי עם כל חיצוני, ולכן מגלה גם פערי יכולות מול הזדמנויות."},{"id":"m3-42","q":"לחברת ההובלות ShipRight אין יכולות דיגיטליות, והשוק עובר להזמנות ולמעקב באפליקציה. החברה מגייסת צוות פיתוח ורוכשת סטארטאפ קטן כדי לסגור את הפער. באיזה תא של TOWS מדובר?","o":["SO – שימוש בחוזקה כדי לנצל הזדמנות","ST – שימוש בחוזקה מול איום","WO – סגירת פער יכולות כדי לממש הזדמנות","WT – צמצום פעילות ונסיגה","זה SWOT בלבד, כי אין כאן אסטרטגיה"],"a":2,"w":["אין כאן חוזקה – נקודת המוצא היא יכולת שחסרה.","המעבר לאפליקציות מוצג כהזדמנות, והחברה לא משתמשת בחוזקה.","","החברה לא נסוגה; היא משקיעה כדי לנצל הזדמנות.","יש פעולה מוגדרת (גיוס ורכישה), ולכן זו אסטרטגיה, לא רק מיפוי."],"why":"חולשה (אין יכולת דיגיטלית) + הזדמנות (מעבר לאפליקציות) = WO: סוגרים את פער היכולות כדי לממש את ההזדמנות."}],"tf":[{"id":"m3-t1","s":"לפי מודל שרשרת הערך, שיווק ומכירות היא פעילות עיקרית (ליבה).","a":true,"why":"נכון. שיווק ומכירות היא אחת מחמש הפעילויות העיקריות."},{"id":"m3-t2","s":"רכש הוא פעילות עיקרית, כי הוא קשור ישירות לחומרי הגלם.","a":false,"why":"לא נכון. רכש הוא פעילות תומכת. הקבלה והאחסון של חומרי הגלם הם לוגיסטיקה נכנסת – עיקרית."},{"id":"m3-t3","s":"שולי הרווח בשרשרת הערך הם ההפרש בין הערך שהחברה יוצרת לבין העלות של ביצוע הפעילויות.","a":true,"why":"נכון. זה מה שמופיע בקצה החץ של המודל."},{"id":"m3-t4","s":"בחברות הייטק, פיתוח טכנולוגי ומו״פ נחשבים לפעילות עיקרית.","a":false,"why":"לא נכון. פיתוח טכנולוגי הוא תמיד פעילות תומכת, גם כשהוא חשוב מאוד לחברה."},{"id":"m3-t5","s":"הכשרת נציגי שירות היא פעילות תומכת (ניהול משאבי אנוש).","a":true,"why":"נכון. גיוס והכשרה הם משאבי אנוש. רק השירות עצמו ללקוח הוא פעילות עיקרית."},{"id":"m3-t6","s":"שרשרת הערך היא כלי לניתוח הסביבה החיצונית של הענף.","a":false,"why":"לא נכון. שרשרת הערך מנתחת את הפעילויות הפנימיות של הארגון."},{"id":"m3-t7","s":"לפי גישת המשאבים (RBV), היתרון התחרותי נגזר מבסיס המשאבים הפנימי של הפירמה.","a":true,"why":"נכון. זה הרעיון המרכזי של RBV."},{"id":"m3-t8","s":"בשרשרת של RBV, יכולת ייחודית באה לפני יכולת ליבה.","a":false,"why":"לא נכון. הסדר הוא משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי."},{"id":"m3-t9","s":"יכולת ייחודית היא פעולה שהפירמה מבצעת טוב יותר ממתחרותיה.","a":true,"why":"נכון. ההשוואה ביכולת ייחודית היא מול המתחרים."},{"id":"m3-t10","s":"לפי הסיכום, יכולת ליבה נמדדת מול המתחרים בענף.","a":false,"why":"לא נכון. יכולת ליבה נמדדת מול היכולות האחרות של הפירמה עצמה. ההשוואה למתחרים היא ביכולת ייחודית."},{"id":"m3-t11","s":"לפי הסיכום, בדרך כלל יש לכל פירמה יכולת ליבה אחת.","a":true,"why":"נכון. כך מוגדרת יכולת ליבה בסיכום."},{"id":"m3-t12","s":"מוניטין ומותג הם משאבים מוחשיים.","a":false,"why":"לא נכון. מוניטין (מותג, מיצוב, תפיסת איכות) הוא משאב לא מוחשי."},{"id":"m3-t13","s":"בטבלת המשאבים של הקורס, פטנטים וסימנים רשומים נכללים במשאבים המוחשיים (טכנולוגיים).","a":true,"why":"נכון. בטבלה הם מופיעים תחת משאבים טכנולוגיים בצד המוחשי."},{"id":"m3-t14","s":"תרבות ארגונית היא משאב מוחשי ארגוני.","a":false,"why":"לא נכון. תרבות ארגונית היא משאב לא מוחשי אנושי. המשאב הארגוני המוחשי הוא מנגנוני בקרה ותכנון."},{"id":"m3-t15","s":"מנגנוני בקרה, תיאום, תכנון ופיקוח הם משאבים מוחשיים ארגוניים.","a":true,"why":"נכון. כך הם מסווגים בטבלת המשאבים."},{"id":"m3-t16","s":"במודל VRIN, האות N מייצגת New – משאב חדש בענף.","a":false,"why":"לא נכון. N = Non-substitutable, בלתי ניתן להחלפה."},{"id":"m3-t17","s":"לפי VRIN, משאב שאין לו ערך מוביל לחיסרון תחרותי.","a":true,"why":"נכון. זו התוצאה של “לא” בקריטריון הראשון (V)."},{"id":"m3-t18","s":"לפי VRIN, משאב בעל ערך שאינו נדיר נותן יתרון תחרותי זמני.","a":false,"why":"לא נכון. משאב בעל ערך שאינו נדיר נותן שוויון תחרותי. יתרון זמני הוא כשהמשאב נדיר אבל קל לחיקוי."},{"id":"m3-t19","s":"משאב בעל ערך, נדיר וקשה לחיקוי, שיש לו תחליף, מוביל לפי התרשים ליתרון תחרותי לא מנוצל.","a":true,"why":"נכון לפי התרשים של הסיכום: זו התוצאה של “לא” בקריטריון N. בטבלה של המרצה אין שורה כזו – שם רק “כן” לכל הארבעה נותן יתרון בר-קיימא."},{"id":"m3-t20","s":"כדי לקבל יתרון תחרותי בר-קיימא מספיק לעמוד בשלושה מתוך ארבעת קריטריוני VRIN.","a":false,"why":"לא נכון. צריך “כן” על כל הארבעה."},{"id":"m3-t21","s":"במודל VRIN בודקים את הקריטריונים לפי הסדר ועוצרים בתשובה השלילית הראשונה.","a":true,"why":"נכון. ה“לא” הראשון קובע את התוצאה."},{"id":"m3-t22","s":"חוק חדש שמקשה על פעילות החברה הוא חולשה (W) ב-SWOT.","a":false,"why":"לא נכון. חוק הוא גורם חיצוני, ולכן הוא איום (T), לא חולשה."},{"id":"m3-t23","s":"ב-SWOT, חוזקות וחולשות הן גורמים פנימיים, והזדמנויות ואיומים הם גורמים חיצוניים.","a":true,"why":"נכון. זו ההבחנה הבסיסית של המודל."},{"id":"m3-t24","s":"SWOT ו-TOWS הם אותו מודל, רק בסדר אותיות אחר.","a":false,"why":"לא נכון. SWOT ממפה גורמים; TOWS מצליב אותם וגוזר מהם אסטרטגיות."},{"id":"m3-t25","s":"אסטרטגיית WO משתמשת בהזדמנות חיצונית כדי להתגבר על חולשה פנימית.","a":true,"why":"נכון. זה ההיגיון של התא WO."},{"id":"m3-t26","s":"אסטרטגיית ST היא אסטרטגיה שבה החברה מנצלת הזדמנויות בעזרת חוזקות.","a":false,"why":"לא נכון. זו אסטרטגיית SO. ב-ST החברה משתמשת בחוזקות כדי להתמודד עם איומים."},{"id":"m3-t27","s":"אסטרטגיית WT היא בדרך כלל הגנתית: מצמצמים חולשות ומתגוננים מפני איומים.","a":true,"why":"נכון. זה התא המסוכן ביותר, ולכן האסטרטגיה בו הגנתית."},{"id":"m3-t28","s":"בדוגמת הבנק בסיכום, אסטרטגיית הצמיחה בהגוונה נבנתה מצירוף של חולשות ואיומים.","a":false,"why":"לא נכון. היא נבנתה מחוזקה (איתנות פיננסית) והזדמנויות (נדל״ן, יהלומים) – תא SO."},{"id":"m3-t29","s":"לפי שקף היישום של SWOT, איום אפשר לסמן כמגבלה או לנסות להפוך להזדמנות.","a":true,"why":"נכון. אלה שתי הדרכים לטפל באיום לפי השקף."},{"id":"m3-t30","s":"כל אסטרטגיה בטבלת TOWS בנויה משני גורמים פנימיים.","a":false,"why":"לא נכון. כל אסטרטגיה מצליבה גורם פנימי (S או W) עם גורם חיצוני (O או T)."},{"id":"m3-t31","s":"לפי טבלת VRIN של המרצה, משאב בעל ערך שאינו נדיר מוביל לשוויון תחרותי ולתשואה ממוצעת.","a":true,"why":"נכון. זו השורה השנייה בטבלה: ערך = כן, נדיר = לא ← שוויון ← תשואה ממוצעת."},{"id":"m3-t32","s":"לפי טבלת המרצה, יתרון תחרותי זמני מבטיח תשואה מעל הממוצע.","a":false,"why":"לא נכון. ביתרון זמני התשואה ממוצעת <b>או</b> מעל הממוצע; רק יתרון בר-קיימא נותן תשואה מעל הממוצע."},{"id":"m3-t33","s":"מודל TOWS עוסק, בין השאר, בפער בין היכולות הקיימות של הפירמה לבין היכולות הנדרשות כדי לממש הזדמנויות בשוק.","a":true,"why":"נכון. TOWS נשען על SWOT ומשלב כל גורם פנימי עם כל גורם חיצוני, ולכן מגלה גם פערי יכולות מול הזדמנויות."},{"id":"m3-t34","s":"לפי המרצה, יכולת ליבה היא פעילות שחשובה לתחרותיות של הפירמה, ושהפירמה מבצעת טוב יותר מהפעילויות האחרות שהיא עצמה מבצעת.","a":true,"why":"נכון. זו ההגדרה מהמבחן לדוגמה: ההשוואה ביכולת ליבה היא <b>פנימית</b> – מול שאר הפעילויות של הפירמה. כשהפעילות טובה יותר <b>מהמתחרים</b> – זו יכולת ייחודית."}],"scope":[{"ref":"סיכום · עמ׳ 4","x":"שרשרת הערך של פורטר: פעילויות עיקריות, תומכות ושולי רווח","imp":2,"h":"מודל שרשרת הערך של פורטר (Value Chain)"},{"ref":"סיכום · עמ׳ 4","x":"גישת המשאבים (RBV): משאבים ← ליבה ← ייחודית ← יתרון","imp":1,"h":"גישת המשאבים (RBV) ושרשרת היתרון"},{"ref":"סיכום · עמ׳ 5","x":"משאבים מוחשיים ולא מוחשיים (טבלה)","imp":1,"h":"משאבים מוחשיים ולא מוחשיים"},{"ref":"סיכום · עמ׳ 5","x":"יכולת ליבה ויכולת ייחודית","imp":1,"h":"יכולת ליבה מול יכולת ייחודית"},{"ref":"סיכום · עמ׳ 5","x":"מודל VRIN ותוצאות כל קריטריון","imp":2,"h":"מודל VRIN – האם היתרון בר-קיימא?"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"טבלת VRIN של המרצה: תוצאה תחרותית והשלכות על ביצועים (תשואה)","imp":2,"h":"טבלת VRIN של המרצה: תוצאה תחרותית והשלכות על הביצועים"},{"ref":"סיכום · עמ׳ 6","x":"מודל SWOT ושקף היישום","imp":2,"h":"מודל SWOT"},{"ref":"סיכום · עמ׳ 6–7","x":"מודל TOWS ודוגמת הבנק","imp":2,"h":"מודל TOWS – מ-SWOT לאסטרטגיות"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"TOWS לפי המרצה: אינטגרציה של כל גורם פנימי עם כל גורם חיצוני; פערי יכולות","imp":2,"h":"TOWS לפי המרצה: כל גורם פנימי מול כל גורם חיצוני, ופערי יכולות"}],"outScope":[]},{"id":"m4","title":"אסטרטגיות תחרותיות גנריות","short":"אסטרטגיות גנריות","blurb":"מודל פורטר (1985): שני צירים – סוג היתרון והיקף השוק – וחמש אסטרטגיות, כולל המשולבת, הקשר לאוקיינוס כחול והסכנה להיתקע באמצע.","mnemonic":"שתי שאלות: “איך אני מנצח?” (זול / מיוחד) × “את מי אני משרת?” (כולם / “רק ל…”). זול + כולם = מנהיגות בעלות רחבה; מיוחד + כולם = בידול רחבה; זול + נישה = ממוקדת מנהיגות בעלות; מיוחד + נישה = ממוקדת בידול. “גם וגם” שמצליח = משולבת (אוקיינוס כחול); “גם וגם” שנכשל = תקוע באמצע.","blocks":[{"t":"h","x":"מה זו אסטרטגיה תחרותית גנרית?"},{"t":"p","x":"<b>אסטרטגיה תחרותית גנרית</b> היא התשובה של החברה לשאלה: <b>איך ננצח את המתחרים בענף?</b> “גנרית” = כללית: אותן אסטרטגיות מופיעות בכל ענף – מזון, תעופה, תוכנה או אופנה."},{"t":"p","x":"המודל פותח על ידי <b>מייקל פורטר ב-1985</b>. הוא צמח משלוש אסטרטגיות עיקריות: <b>מנהיגות בעלות, בידול ומיקוד (פוקוס)</b>. כשמפצלים את המיקוד לזול ולמבודל, ומוסיפים את האסטרטגיה המשולבת, מקבלים <b>חמש אסטרטגיות</b>."},{"t":"h","x":"שני צירים, חמש אסטרטגיות"},{"t":"steps","x":["<b>סוג היתרון התחרותי</b>: האם אנחנו מנצחים בזכות <b>עלות נמוכה</b>, או בזכות <b>ייחודיות</b> שהלקוח מוכן לשלם עליה?","<b>היקף שוק היעד</b>: האם אנחנו פונים ל<b>שוק רחב</b> (הרבה סוגי לקוחות), או ל<b>נישה ממוקדת</b> (קבוצה מוגדרת)?","מצליבים את שתי התשובות ומקבלים משבצת. באמצע המטריצה יושבת ה<b>משולבת</b>: גם עלות נמוכה וגם בידול."],"title":"שתי שאלות שקובעות את האסטרטגיה"},{"t":"table","head":["היקף שוק היעד","עלות נמוכה","ייחודיות"],"rows":[["<b>רחב</b>","<b>1. מנהיגות בעלות רחבה</b> (Broad Low Cost)","<b>2. בידול רחבה</b> (Broad Differentiation)"],["<b>ממוקד</b>","<b>3. ממוקדת מנהיגות בעלות</b> (Focused Low Cost)","<b>4. ממוקדת בידול</b> (Focused Differentiation)"],["<b>באמצע המטריצה</b>","<b>5. משולבת מנהיגות בעלות/בידול</b> (Best-Cost / Integrated): גם עלות נמוכה…","…וגם ייחודיות = יותר ערך עבור המחיר"]]},{"t":"trap","x":"המטריצה של פורטר היא <b>לא</b> מטריצת Ansoff (מוצר × שוק, יחידה 6) ו<b>לא</b> מיפוי קבוצות אסטרטגיות (יחידה 2). כאן שני הצירים הם תמיד: <b>סוג היתרון</b> (עלות מול ייחודיות) ו<b>היקף השוק</b> (רחב מול ממוקד)."},{"t":"h","x":"ערך כלכלי = ערך פחות עלות: שתי דרכים ליתרון"},{"t":"p","x":"<b>ערך כלכלי</b> (Economic Value) שהפירמה יוצרת = <b>הערך שהלקוח תופס</b> במוצר <b>פחות העלות</b> של יצירתו. יש בו <b>שני גורמים בלבד: ערך ועלות</b>. פירמה שיוצרת יותר ערך כלכלי מהמתחרות נהנית מיתרון תחרותי."},{"t":"table","head":["הדרך","מה משנים","האסטרטגיה המתאימה","למי זה מתאים"],"rows":[["<b>מורידים את העלות</b>","אותו ערך בערך, בעלות נמוכה יותר ← אפשר להציע מחיר אטרקטיבי","מנהיגות בעלות / ממוקדת מנהיגות בעלות","<b>לקוחות רגישים למחיר</b>"],["<b>מעלים את הערך</b>","תועלת ייחודית: איכות, שירות, זמינות, חדשנות – הלקוח מוכן לשלם יותר","בידול / ממוקדת בידול","לקוחות שמחפשים ייחוד"],["<b>שוברים את הפשרה</b>","גם יותר ערך וגם עלות נמוכה; פונים לשוק חדש שהמתחרים טרם פנו אליו","משולבת / אוקיינוס כחול","ביקוש חדש שעוד לא נוצל"]]},{"t":"list","x":["<b>יתרון בלי הוזלת עלויות – אפשרי.</b> פירמה יכולה ליהנות מיתרון תחרותי גם <b>בלי</b> להוזיל משמעותית את העלויות: (1) הצעת <b>תועלת ייחודית</b> – איכות, שירות, זמינות, חדשנות; (2) <b>אוקיינוס כחול</b> – פנייה לשוק חדש.","<b>יתרון מערך כלכלי ללקוחות רגישים למחיר – אפשרי.</b> זה בדיוק מה שעושה <b>מנהיגות בעלות</b> (לקהל רחב) או <b>ממוקדת מנהיגות בעלות</b> (לנישה): מוצר במחיר אטרקטיבי ביחס למתחרים, בזכות עלות נמוכה."]},{"t":"example","x":"חברת הקוסמטיקה PureGlow לא הוזילה דבר – להפך, היא משקיעה במרכיבים יקרים ובשירות אישי. הלקוחות מוכנים לשלם יותר, כי הערך שהם תופסים גבוה בהרבה מהעלות. ← יתרון בזכות <b>הגדלת הערך</b>. לעומתה, FlyLow מוכרת כרטיסי טיסה בסיסיים לנוסעים שבוחרים רק לפי מחיר ← יתרון בזכות <b>עלות נמוכה</b> ללקוחות רגישים למחיר.","title":"שתי דרכים לאותו יתרון"},{"t":"trap","x":"היגד “פירמה לא תוכל ליהנות מיתרון תחרותי בלי הוזלה משמעותית בעלויות” – <b>לא נכון</b>: יש בידול (תועלת ייחודית) ויש אוקיינוס כחול. היגד “ערך כלכלי נקבע לפי שני גורמים: ערך ועלות” – <b>נכון</b>. היגד “אפשר להשיג יתרון ביצירת ערך כלכלי ללקוחות רגישים למחיר” – <b>נכון</b> (מנהיגות בעלות או ממוקדת מנהיגות בעלות). אל תתבלבלו בין <b>ערך</b> (מה שהלקוח תופס) ל<b>מחיר</b> (מה שהוא משלם)."},{"t":"exam","x":"בחלק ב׳ ההיגדים כאן מופיעים כמעט תמיד. בנימוק כתבו: ערך כלכלי = ערך פחות עלות; לכן יש שתי דרכים – להוריד עלות (מנהיגות בעלות, מתאים ללקוחות רגישים למחיר) או להעלות ערך (בידול: איכות, שירות, זמינות, חדשנות) – ואפשרות שלישית: אוקיינוס כחול (שוק חדש)."},{"t":"h","x":"1. מנהיגות בעלות רחבה (Broad Low Cost)"},{"t":"p","x":"החברה מציעה מוצר או שירות ב<b>עלויות נמוכות משמעותית מהמתחרים</b>, ל<b>קהל רחב</b>. היתרון הוא מבנה העלויות: היא מייצרת זול יותר מכולם, ולכן יכולה למכור בזול ועדיין להרוויח."},{"t":"list","x":["<b>ייעול שרשרת הערך</b> – מורידים עלות בכל פעילות (מחסנים אוטומטיים, ייצור המוני, יתרון לגודל).","<b>מיקור חוץ</b> (Outsourcing) – מוציאים פעילויות לספקים זולים יותר.","<b>מוצר בסיסי, “חף מקישוטים”</b> (No-frills) – בלי תוספות שמייקרות.","<b>מכירה ישירה</b> – בלי מתווכים וחנויות יקרות, למשל באתר או באפליקציה."]},{"t":"example","x":"חברת התעופה SkyBasic טסה לכל אירופה עם סוג מטוס אחד, בלי ארוחות חינם, ומוכרת כרטיסים רק באתר שלה. כל אחד יכול לטוס איתה, והמחירים הכי נמוכים בשוק. ← <b>מנהיגות בעלות רחבה</b> (כמו ריינאייר). עוד דוגמאות מוכרות: וולמארט, רמי לוי.","title":"איך זה נראה"},{"t":"trap","x":"מנהיגות בעלות היא קודם כל <b>עלות</b> נמוכה, לא רק <b>מחיר</b> נמוך. חברה שמורידה מחיר בלי להוריד עלויות לא מנהיגה בעלות – היא פשוט מפסידה כסף."},{"t":"h","x":"2. בידול רחבה (Broad Differentiation)"},{"t":"p","x":"החברה מספקת מוצר או שירות ש<b>הלקוחות תופסים כבעל ערך ייחודי ושונה</b>, ב<b>שוק רחב</b>. הייחוד יכול לבוא מעיצוב, מותג, טכנולוגיה, איכות או שירות. בזכות הייחוד הלקוחות מוכנים לשלם <b>מחיר גבוה יותר</b> (פרימיום)."},{"t":"example","x":"חברת הטלפונים NovaPhone מוכרת בכל העולם, לסטודנטים, למשפחות ולאנשי עסקים. הטלפונים שלה ידועים בעיצוב, במצלמה המתקדמת ובמותג החזק, והם יקרים מהמתחרים. ← <b>בידול רחבה</b>. דוגמאות מוכרות: אפל, נייקי, BMW בשוק הרכב הכללי.","title":"איך זה נראה"},{"t":"trap","x":"בבידול מה שקובע הוא <b>התפיסה של הלקוח</b>: הוא צריך לראות בזה משהו מיוחד ולהיות מוכן לשלם עליו. מוצר “טוב יותר” שהלקוחות לא מעריכים הוא לא בידול."},{"t":"h","x":"3. ממוקדת מנהיגות בעלות (Focused Low Cost)"},{"t":"p","x":"החברה מתמקדת ב<b>נישת שוק מוגדרת</b> ושומרת על <b>עלויות מינימליות</b>. היא הזולה ביותר <b>בשביל הקהל המסוים הזה</b>. הנישה יכולה להיות קבוצת לקוחות (סטודנטים, משפחות גדולות, עסקים קטנים), אזור גאוגרפי או קו מוצרים צר."},{"t":"example","x":"StudentPrint מדפיסה עבודות <b>רק לסטודנטים</b> ליד הקמפוס, בהדפסה בסיסית ובמחיר הכי נמוך באזור. ← <b>ממוקדת מנהיגות בעלות</b>. דוגמאות מוכרות: רשתות מזון מוזלות שפונות לקהל מסוים (כמו ״יש חסד״ של שופרסל, שפונה לציבור החרדי).","title":"איך זה נראה"},{"t":"h","x":"4. ממוקדת בידול (Focused Differentiation)"},{"t":"p","x":"החברה מתמקדת ב<b>נישה ספציפית</b> ונותנת לה <b>מענה ייחודי ומותאם אישית</b>. הלקוחות בנישה מוכנים לשלם הרבה, כי המוצר בנוי בדיוק בשבילם."},{"t":"example","x":"VeloCraft בונה אופני מרוץ בעבודת יד, בהתאמה אישית לרוכבים מקצועיים בלבד, במחיר גבוה פי חמישה מאופניים רגילים. ← <b>ממוקדת בידול</b>. דוגמאות מוכרות: רולס רויס, פטק פיליפ, מלונות בוטיק יוקרתיים.","title":"איך זה נראה"},{"t":"trap","x":"בשתי אסטרטגיות המיקוד יש <b>נישה</b>. ההבדל ביניהן הוא רק ב<b>סוג היתרון</b>: נישה + זול ובסיסי = ממוקדת <b>מנהיגות בעלות</b>; נישה + ייחודי ומותאם = ממוקדת <b>בידול</b>. ומיקוד לא אומר “חברה קטנה” – אומר <b>קהל מוגדר</b>."},{"t":"h","x":"5. משולבת מנהיגות בעלות/בידול (Best-Cost / Integrated)"},{"t":"p","x":"האסטרטגיה המשולבת נותנת ללקוח <b>יותר ערך עבור המחיר</b>: איכות, עיצוב או תכונות טובות, במחיר נמוך מזה של המותגים המבודלים. היא <b>משלבת בידול ועלויות נמוכות</b> בו-זמנית. בתרשים בסיכום היא יושבת <b>באמצע המטריצה</b>, בין ארבע המשבצות."},{"t":"list","x":["<b>איך עושים את זה</b>: מוזילים עלויות בלי לפגוע באיכות (טכנולוגיה, אוטומציה, התייעלות חכמה), ובמקביל נותנים ערך ברור ללקוח.","<b>דוגמאות</b>: הונדה וטויוטה (מכוניות אמינות ומאובזרות במחיר נמוך ממותגי היוקרה), איקאה (עיצוב + מחיר נמוך), H&M (אופנה עדכנית במחיר נגיש).","<b>קשר לאוקיינוס כחול</b>: לפי הסיכום, האסטרטגיה המשולבת מתאימה יותר ל<b>“אוקיינוס כחול”</b>. באוקיינוס כחול (יחידה 2) <b>שוברים את הפשרה בין ערך לעלות</b> – בדיוק מה שהמשולבת עושה: גם יותר ערך וגם עלות נמוכה.","<b>הסיכון המרכזי</b>: <b>תת-מיצוב</b> – הלקוחות לא מבינים בבירור מה החברה מציעה – והילכדות במצב של <b>“תקוע באמצע”</b>."]},{"t":"example","x":"חברת הרכב Kaito מוכרת לכל הקהל מכוניות אמינות עם הרבה אבזור, במחיר נמוך ממותגי היוקרה. העלויות שלה נמוכות בזכות ייצור רזה ואוטומציה. ← <b>משולבת</b>: יותר ערך עבור המחיר.","title":"איך זה נראה"},{"t":"trap","x":"<b>החיסרון הבולט ביותר של המשולבת = תת-מיצוב</b> (Under-positioning). המשולבת עומדת “בין” מנהיגות העלות לבידול. אם הלקוחות לא מבינים מה היא – לא הכי זולה ולא הכי מיוחדת – המיצוב שלה חלש מדי. במבחן המסיחים הם סיכונים של <b>אסטרטגיות אחרות</b>: “ניתן להעתקה” (מנהיגות בעלות), “הנישה עשויה להפוך לאטרקטיבית” (אסטרטגיות מיקוד), “השקעה יקרה בחינוך השוק” (חלוץ שפותח שוק חדש)."},{"t":"h","x":"תקוע באמצע (Stuck in the Middle)"},{"t":"p","x":"<b>תקוע באמצע</b> הוא מצב של חברה שלא הצליחה להשיג <b>אף אחד</b> מסוגי היתרון. היא לא הכי זולה, וגם לא נתפסת כמיוחדת. לכן היא מפסידה לקוחות לשני הכיוונים: מי שמחפש מחיר הולך למנהיג העלות, ומי שמחפש ייחוד הולך לחברה המבודלת."},{"t":"list","x":["<b>סימנים בסיפור</b>: “ניסתה גם להוריד מחירים וגם לשמור על יוקרה”, “אין לה זהות ברורה”, “הלקוחות עוזבים חלק לזולים וחלק ליוקרתיים”, “נתח השוק יורד”.","<b>למה זה קורה</b>: החברה רוצה “גם וגם” אבל לא בונה את היכולות לכך – לא מוזילה עלויות באמת ולא משקיעה מספיק בבידול.","<b>דוגמאות</b>: רשת סירס בארה״ב, רשתות אלקטרוניקה ותיקות שניסו להתחרות גם באמזון וגם בחנויות יוקרה."]},{"t":"trap","x":"<b>משולבת ≠ תקוע באמצע.</b> בשתיהן יש “גם וגם”. ההבדל: במשולבת החברה <b>מצליחה</b> לתת יותר ערך בעלות נמוכה (הונדה, איקאה). בתקוע באמצע היא <b>נכשלת</b> בשני הדברים. תקוע באמצע הוא <b>הסיכון</b> של המשולבת, לא אסטרטגיה שבוחרים בה."},{"t":"h","x":"הסיכונים של כל אסטרטגיה גנרית (ומה אינו סיכון)"},{"t":"p","x":"לכל אסטרטגיה יש <b>סיכון אופייני</b> משלה. במבחן שואלים “מהו החיסרון הבולט של X?” או “מה מהבאים <b>אינו</b> סיכון של X?”, והמסיחים לקוחים מהאסטרטגיות האחרות."},{"t":"table","head":["אסטרטגיה","הסיכונים המרכזיים"],"rows":[["<b>מנהיגות בעלות</b>","המתחרים יכולים <b>להעתיק</b> את שיטות הייעול; שינוי טכנולוגי מבטל את יתרון העלות; התמקדות בעלות עלולה לגרום להתעלם משינוי בטעם הלקוחות"],["<b>בידול</b>","<b>המחיר נתפס גבוה מדי</b> לעומת מנהיגי העלות; הלקוחות <b>לא תופסים את הערך</b> הייחודי (או מפסיקים לייחס לו חשיבות); <b>חיקויים וזיופים</b> שמצמצמים את הייחוד"],["<b>מיקוד</b> (שתי הגרסאות)","<b>הנישה עשויה להפוך לאטרקטיבית</b> ולמשוך מתחרים גדולים; הנישה מצטמקת; ההבדל בין הנישה לשוק הרחב נעלם"],["<b>משולבת</b>","<b>תת-מיצוב</b> – החיסרון הבולט; ובמקרה הגרוע: תקוע באמצע"]]},{"t":"trap","x":"<b>עליית מחירים אצל הספקים אינה סיכון של אסטרטגיית בידול.</b> זה שינוי חיצוני בעלויות שפוגע בכל הענף (ובמודל חמשת הכוחות זה עניין של כוח הספקים). דווקא חברה מבודלת, שהלקוחות שלה פחות רגישים למחיר, יכולה בקלות יחסית לגלגל את ההתייקרות ללקוח. מי שנפגע ממנה יותר הוא מנהיג העלות, שמרוויח מכל שקל של חיסכון."},{"t":"example","x":"מותג התיקים LuxBag מוכר תיקי עור ייחודיים במחיר גבוה. שלושה דברים מאיימים עליו: הלקוחות מתחילים לחשוב שהתיק לא שווה פי ארבעה מתיק רגיל (<b>מחיר גבוה מדי</b>), צעירים לא מבינים מה מיוחד בעור האיטלקי (<b>הערך לא נתפס</b>), ובשווקים צצים זיופים זולים (<b>חיקויים</b>). כשספק העור מעלה מחירים ב-5% – זה לא אחד מסיכוני הבידול.","title":"סיכוני בידול בסיפור אחד"},{"t":"exam","x":"שאלה טיפוסית: “מה מהבאים <b>אינו</b> סיכון של בידול?” – התשובה: <b>עליית מחירי הספקים</b>. ו“מהו החיסרון הבולט ביותר של המשולבת?” – <b>תת-מיצוב</b>."},{"t":"h","x":"איך מזהים את האסטרטגיה בסיפור"},{"t":"steps","x":["<b>מה מקור היתרון?</b> “עלויות נמוכות”, “ייעול”, “ייצור המוני”, “בלי תוספות”, “מיקור חוץ”, “מכירה ישירה” ← <b>עלות</b>. “ייחודי”, “יוקרתי”, “עיצוב”, “חדשני”, “מותג”, “התאמה אישית”, “מחיר פרימיום” ← <b>בידול</b>.","<b>מה היקף השוק?</b> “לכל הקהל”, “בכל העולם”, “כל הפלחים” ← <b>רחב</b>. “רק ל…”, “סטודנטים”, “אספנים”, “אזור מסוים”, “עסקים קטנים” ← <b>ממוקד</b>.","<b>יש גם וגם?</b> אם הסיפור מדגיש <b>במפורש</b> גם עלות נמוכה וגם ערך מיוחד, והחברה מצליחה ← <b>משולבת</b>. אם היא נכשלת ומאבדת לקוחות לשני הכיוונים ← <b>תקוע באמצע</b>."],"title":"שלוש שאלות לפי הסדר"},{"t":"table","head":["אסטרטגיה","מקור היתרון","היקף","מילים שמסגירות אותה"],"rows":[["מנהיגות בעלות רחבה","עלות","רחב","“הכי זול בשוק”, “לכולם”, “בלי תוספות”, “מיקור חוץ”, “מכירה ישירה”"],["בידול רחבה","ייחודיות","רחב","“בכל העולם”, “מותג”, “עיצוב ייחודי”, “מחיר גבוה מהמתחרים”"],["ממוקדת מנהיגות בעלות","עלות","ממוקד","“רק ל…” + “זול”, “בסיסי”, “הכי משתלם לקהל הזה”"],["ממוקדת בידול","ייחודיות","ממוקד","“רק ל…” + “יוקרה”, “עבודת יד”, “בהתאמה אישית”"],["משולבת","גם וגם","בדרך כלל רחב","“יותר ערך עבור המחיר”, “איכות במחיר נגיש”, “לא בוחרים בין מחיר לאיכות”"],["תקוע באמצע","אף אחד","—","“ניסתה הכול”, “איבדה זהות”, “לקוחות עוזבים לשני הכיוונים”"]]},{"t":"trap","x":"אל תסתמכו על שם החברה – הסתמכו על <b>מה שכתוב בסיפור</b>. אותה חברה יכולה להופיע בספרים שונים במשבצות שונות (איקאה: מנהיגות בעלות או משולבת). ואוקיינוס כחול הוא <b>לא</b> משבצת נפרדת בין חמש האסטרטגיות הגנריות – בתרשים של המרצה הוא יושב <b>במרכז, יחד עם המשולבת</b>, וארבע הפינות הן “אוקיינוס אדום”."},{"t":"exam","x":"איך שואלים: סיפור קצר על חברה ← “איזו אסטרטגיה גנרית מתאימה?”; החמש מופיעות כמסיחים, לפעמים עם “תקוע באמצע” או “אוקיינוס כחול”. שאלות הגדרה: “לפי מה מסווג פורטר את האסטרטגיות?” (סוג היתרון × היקף השוק), “מה הסיכון של המשולבת?” (תת-מיצוב ותקוע באמצע), “לאיזה מצב מתאימה המשולבת?” (אוקיינוס כחול). בנימוק תמיד כתבו שתי מילים: <b>מקור היתרון</b> ו<b>היקף השוק</b>."},{"t":"h","x":"התרשים של המרצה: חמש האסטרטגיות, אוקיינוס אדום ואוקיינוס כחול"},{"t":"p","x":"בשקפים של המרצה התרשים בנוי כך: <b>הציר העליון = סוג יתרון תחרותי</b> (<b>עלות נמוכה</b> | <b>ייחודיות</b>). <b>הציר הצדדי = קהל יעד</b> (<b>רחב</b> | <b>ממוקד</b>). ארבע משבצות בפינות: מנהיגות בעלות (עלות + רחב), בידול רחבה (ייחודיות + רחב), ממוקדת מנהיגות בעלות (עלות + ממוקד), ממוקדת בידול (ייחודיות + ממוקד). <b>במרכז, באליפסה שנוגעת בכל ארבע המשבצות</b> – האסטרטגיה המשולבת מנהיגות בעלות/בידול."},{"t":"p","x":"באחד השקפים המרצה מצרף לתרשים טבלת <b>אוקיינוס אדום מול אוקיינוס כחול</b>. ההיגיון: ארבע הפינות = <b>אוקיינוס אדום</b> – בוחרים צד בפשרה (זול <b>או</b> מיוחד) ונלחמים על הלקוחות הקיימים. המרכז = <b>אוקיינוס כחול</b> – כמו המשולבת, הוא <b>שובר</b> את הפשרה בין ערך לעלות."},{"t":"table","head":["אוקיינוס כחול (המרכז)","אוקיינוס אדום (הפינות)"],"rows":[["ליצור נישת שוק <b>ללא מתחרים</b>","להתחרות ב<b>שוק הקיים</b>"],["להפוך את המתחרים ל<b>לא רלוונטיים</b>","<b>לנצח</b> את המתחרים"],["ליצור ולתפוס <b>ביקוש חדש</b>","לנצל את <b>הביקוש הקיים</b>"],["<b>“לשבור”</b> את שקלול התמורות ערך-עלות","<b>לבצע</b> שקלול תמורות ערך-עלות (לבחור: ערך או עלות)"]]},{"t":"p","x":"<b>אוקיינוס כחול = פנייה לשוק חדש</b>: שוק שהמתחרים הקיימים טרם פנו אליו, בתוך אותו ענף."},{"t":"example","x":"ב-2007 השיקה אמזון את ה-Kindle, אחרי שבנתה מראש ספרייה דיגיטלית ענקית והורדה אלחוטית של ספרים. אנליסטים תיארו זאת כ<b>יצירת מרחב תחרותי חדש</b>: קוראים קונים יותר ספרים, בכל מקום, בלי חנות, במחיר נמוך יותר. ← טענה ש-Kindle הוא <b>אוקיינוס כחול</b> נכונה: שוק חדש שהמתחרים הקיימים (חנויות ורשתות ספרים) לא פנו אליו, ביקוש חדש, ושבירת הפשרה – יותר ערך (נוחות, זמינות) בעלות נמוכה יותר לספר. (על השאלה אם זו גם חדשנות משבשת – ראו יחידה 5.)","title":"Kindle כאוקיינוס כחול"},{"t":"trap","x":"אוקיינוס כחול הוא לא “משבצת שישית” וגם לא אחת מארבע הפינות. בתרשים של המרצה הוא יושב <b>במרכז, יחד עם המשולבת</b>. מסיח נפוץ: “אוקיינוס כחול = ביצוע שקלול תמורות ערך-עלות” – לא נכון, זה <b>אדום</b>. כחול = <b>שבירת</b> הפשרה."},{"t":"exam","x":"שאלה פתוחה (חלק ג׳): “X טוען שהמהלך הוא אוקיינוס כחול – האם צודק?” כתבו: (1) הגדרה – פנייה לשוק חדש שהמתחרים טרם פנו אליו; (2) ארבעת המאפיינים מהטבלה (נישה ללא מתחרים, מתחרים לא רלוונטיים, ביקוש חדש, שבירת הפשרה ערך-עלות); (3) ציטוט מהכתבה שמתאים (“מרחב תחרותי חדש”); (4) מסקנה."}],"cheat":["פורטר (1985) = סוג היתרון (עלות נמוכה / ייחודיות) × היקף שוק היעד (רחב / ממוקד)","5 האסטרטגיות = מנהיגות בעלות רחבה, בידול רחבה, ממוקדת מנהיגות בעלות, ממוקדת בידול, משולבת (במרכז)","מנהיגות בעלות = עלות נמוכה (לא רק מחיר): ייעול, מיקור חוץ, ״חף מקישוטים״, מכירה ישירה","בידול = ערך ייחודי שהלקוח תופס ומשלם עליו פרימיום; מיקוד = נישה (שתי הממוקדות נבדלות רק בסוג היתרון)","משולבת (Best-cost) = יותר ערך עבור המחיר; מתאימה לאוקיינוס כחול; <b>החיסרון הבולט = תת-מיצוב</b>","תקוע באמצע = לא זול ולא מיוחד, מאבד לקוחות לשני הכיוונים – הסיכון של המשולבת, לא אסטרטגיה","סיכוני בידול = מחיר נתפס גבוה מדי, ערך לא נתפס, חיקויים וזיופים; עליית מחירי ספקים – <b>אינה</b> סיכון בידול","סיכון מיקוד = הנישה מושכת שחקנים גדולים או מצטמקת; סיכון מנהיגות בעלות = העתקת הייעול, שינוי טכנולוגי","ערך כלכלי = הערך שהלקוח תופס פחות העלות (שני גורמים: ערך ועלות)","יתרון בלי הוזלת עלויות = אפשרי: תועלת ייחודית (איכות, שירות, זמינות, חדשנות) או אוקיינוס כחול","לקוחות רגישים למחיר = יתרון דרך מנהיגות בעלות או ממוקדת מנהיגות בעלות","תרשים המרצה = ארבע הפינות = אוקיינוס אדום; המרכז (המשולבת) = אוקיינוס כחול"],"mcq":[{"id":"m4-1","q":"StudentPrint מדפיסה עבודות <b>רק לסטודנטים</b> ליד הקמפוס. ההדפסה בסיסית, אין שירות עיצוב, והמחירים הכי נמוכים באזור. איזו אסטרטגיה גנרית מתאימה?","o":["מנהיגות בעלות רחבה","ממוקדת מנהיגות בעלות","ממוקדת בידול","משולבת מנהיגות בעלות/בידול"],"a":1,"w":["החברה לא פונה לכל הקהל – רק לסטודנטים, כלומר נישה.","","יש נישה, אבל היתרון הוא מחיר נמוך ושירות בסיסי, לא ייחוד.","אין כאן בידול – ההדפסה בסיסית בלבד."],"why":"נישה (סטודנטים) + עלות נמוכה = ממוקדת מנהיגות בעלות."},{"id":"m4-2","q":"סדנת הכינורות Stradella בונה כינורות בעבודת יד, בהתאמה אישית לכל נגן, ומוכרת רק לסולנים מקצועיים. כינור עולה עשרות אלפי דולרים. איזו אסטרטגיה מתאימה?","o":["בידול רחבה","ממוקדת מנהיגות בעלות","תקוע באמצע","ממוקדת בידול"],"a":3,"w":["הסדנה לא פונה לשוק רחב – רק לסולנים מקצועיים.","יש נישה, אבל המחיר גבוה מאוד והיתרון הוא ייחוד.","הסדנה בחרה בבירור קהל ויתרון, ואין סימן לכישלון.",""],"why":"נישה (סולנים) + מענה ייחודי ומותאם אישית = ממוקדת בידול."},{"id":"m4-3","q":"חברת התעופה SkyBasic טסה לכל אירופה עם סוג מטוס אחד, בלי ארוחות חינם, ומוכרת כרטיסים רק באתר שלה. כל אחד יכול לטוס איתה, והעלויות שלה הכי נמוכות בענף. איזו אסטרטגיה מתאימה?","o":["מנהיגות בעלות רחבה","ממוקדת מנהיגות בעלות","משולבת מנהיגות בעלות/בידול","בידול רחבה"],"a":0,"w":["","החברה פונה לכל אחד, לא לנישה.","אין כאן ערך מיוחד – להפך, שירות בסיסי בלי תוספות.","היתרון הוא עלות, לא ייחוד שהלקוח משלם עליו יותר."],"why":"שוק רחב + עלות נמוכה (מוצר חף מקישוטים, מכירה ישירה, ייעול) = מנהיגות בעלות רחבה."},{"id":"m4-4","q":"חברת NovaPhone מוכרת טלפונים בכל העולם, לכל קבוצות הגיל. הטלפונים ידועים בעיצוב ייחודי, במצלמה החדשנית בשוק ובמותג חזק, ומחירם גבוה מהמתחרים. איזו אסטרטגיה מתאימה?","o":["ממוקדת בידול","מנהיגות בעלות רחבה","בידול רחבה","משולבת מנהיגות בעלות/בידול"],"a":2,"w":["החברה לא פונה לנישה – היא מוכרת לכל קבוצות הגיל בכל העולם.","המחיר גבוה מהמתחרים והיתרון הוא ייחוד, לא עלות.","","אין כאן עלות נמוכה או מחיר נגיש – רק פרימיום."],"why":"שוק רחב + ייחודיות שנתפסת אצל הלקוח = בידול רחבה."},{"id":"m4-5","q":"חברת הרכב Kaito מוכרת לכל הקהל מכוניות אמינות ומאובזרות, במחיר נמוך משמעותית ממותגי היוקרה. בזכות ייצור רזה ואוטומציה העלויות שלה נמוכות. איזו אסטרטגיה מתאימה?","o":["מנהיגות בעלות רחבה","בידול רחבה","משולבת מנהיגות בעלות/בידול","תקוע באמצע"],"a":2,"w":["הסיפור מדגיש גם ערך מיוחד (אמינות, אבזור), לא רק עלות.","הסיפור מדגיש גם עלות ומחיר נמוכים, לא רק ייחוד.","","החברה מצליחה בשני הדברים – זה ההפך מתקוע באמצע."],"why":"יותר ערך עבור המחיר: גם בידול וגם עלויות נמוכות, בהצלחה = משולבת (כמו הונדה וטויוטה)."},{"id":"m4-6","q":"רשת האלקטרוניקה ElectroMax ניסתה להוריד מחירים כדי להתחרות באתרי אינטרנט זולים, ובמקביל השקיעה בחנויות מפוארות ובשירות אישי. אחרי כמה שנים הלקוחות עזבו – חלק לאתרים הזולים וחלק לחנויות היוקרה. מה מצבה?","o":["תקועה באמצע","משולבת מנהיגות בעלות/בידול","ממוקדת בידול","מנהיגות בעלות רחבה"],"a":0,"w":["","במשולבת החברה מצליחה בשני הדברים. כאן היא נכשלה בשניהם.","אין כאן נישה, וגם לא בידול מוצלח.","החברה לא הצליחה להיות זולה מהמתחרים."],"why":"לא זולה ולא מיוחדת, ומאבדת לקוחות לשני הכיוונים = תקועה באמצע."},{"id":"m4-7","q":"לפי מה מסווג פורטר את האסטרטגיות התחרותיות הגנריות?","o":["לפי המוצר (קיים או חדש) והשוק (קיים או חדש)","לפי גודל החברה ושלב חיי המוצר","לפי חוזקות וחולשות מול הזדמנויות ואיומים","לפי סוג היתרון התחרותי (עלות נמוכה מול ייחודיות) והיקף שוק היעד (רחב מול ממוקד)"],"a":3,"w":["זו מטריצת Ansoff לאסטרטגיות צמיחה.","אלה לא הצירים של פורטר.","זה מודל TOWS.",""],"why":"שני הצירים של פורטר: סוג היתרון × היקף שוק היעד."},{"id":"m4-8","q":"מודל האסטרטגיות הגנריות של פורטר צמח משלוש אסטרטגיות עיקריות. מהן?","o":["חדירה לשוק, פיתוח מוצר וגיוון","מנהיגות בעלות, בידול ומיקוד","ביטול, צמצום והגבהה","SO, WO ו-ST"],"a":1,"w":["אלה אסטרטגיות צמיחה של Ansoff.","","אלה פעולות מתוך מטריצת ERRC של אוקיינוס כחול.","אלה תאים בטבלת TOWS."],"why":"שלוש האסטרטגיות הבסיסיות: מנהיגות בעלות, בידול, מיקוד (פוקוס)."},{"id":"m4-9","q":"איזה צעד <b>אינו</b> מאפיין אסטרטגיית מנהיגות בעלות רחבה לפי הסיכום?","o":["הוספת שירותי פרימיום מותאמים אישית לכל לקוח","מיקור חוץ של חלק מהפעילויות","הצעת מוצר בסיסי, “חף מקישוטים”","מכירה ישירה ללקוח בלי מתווכים"],"a":0,"w":["","מיקור חוץ הוא אחת הדרכים להוריד עלויות.","מוצר בסיסי בלי תוספות הוא סימן מובהק למנהיגות בעלות.","מכירה ישירה חוסכת עלויות ומאפיינת מנהיגות בעלות."],"why":"שירותי פרימיום מותאמים אישית מייקרים – זה כיוון של בידול, לא של עלות."},{"id":"m4-10","q":"מה מאפיין את האסטרטגיה המשולבת (Best-Cost / Integrated)?","o":["המחיר הנמוך ביותר בענף, בלי שום תוספות","מוצר יוקרה לנישה קטנה של לקוחות עשירים","יותר ערך עבור המחיר – שילוב של בידול ועלויות נמוכות","ויתור על כל סוגי היתרון כדי להתאים לכולם"],"a":2,"w":["זו מנהיגות בעלות, בלי בידול.","זו ממוקדת בידול.","","זה מתאר כישלון – תקוע באמצע – לא אסטרטגיה."],"why":"המשולבת נותנת ללקוח ערך גבוה במחיר נמוך מזה של המבודלים."},{"id":"m4-11","q":"רשת המלונות PedalInn פונה רק לרוכבי אופניים למרחקים ארוכים: חדרים עם מתקן לאופניים, סדנת תיקונים וארוחות לספורטאים. מה הסיכון האופייני לאסטרטגיה שבחרה?","o":["תת-מיצוב – הלקוחות לא מבינים במה היא שונה","הנישה עשויה להפוך לאטרקטיבית ולמשוך רשתות גדולות","מתחרים יעתיקו את שיטות הייעול שלה","עליית מחירים אצל ספקי המזון","אין לה שום סיכון, כי אין לה מתחרים"],"a":1,"w":["תת-מיצוב הוא החיסרון הבולט של האסטרטגיה המשולבת, לא של מיקוד.","","העתקת הייעול היא סיכון של מנהיגות בעלות; PedalInn נשענת על ייחוד לנישה.","עליית מחירי ספקים פוגעת בכל הענף ואינה הסיכון האופייני לאסטרטגיה.","לכל אסטרטגיה יש סיכון; דווקא נישה רווחית מושכת מתחרים."],"why":"נישה (רוכבי אופניים) + מענה ייחודי = <b>ממוקדת בידול</b>. הסיכון האופייני לאסטרטגיות מיקוד: הנישה הופכת לאטרקטיבית ומושכת שחקנים גדולים, או מצטמקת."},{"id":"m4-12","q":"לפי הסיכום, לאיזה מצב מתאימה יותר האסטרטגיה המשולבת?","o":["לאוקיינוס אדום שבו מתחרים רק על מחיר","לנישה קטנה של לקוחות עשירים מאוד","לענף שבו המוצר סטנדרטי וכולם מתחרים על עלות","ליצירת “אוקיינוס כחול”"],"a":3,"w":["באוקיינוס אדום התחרות קשה; המשולבת מתאימה דווקא ליצירת שוק חדש.","לזה מתאימה ממוקדת בידול.","לזה מתאימה מנהיגות בעלות.",""],"why":"אוקיינוס כחול שובר את הפשרה בין ערך לעלות – בדיוק מה שהמשולבת עושה."},{"id":"m4-13","q":"מה ההבדל בין <b>מנהיגות בעלות רחבה</b> לבין <b>ממוקדת מנהיגות בעלות</b>?","o":["סוג היתרון: עלות נמוכה מול ייחודיות","היקף שוק היעד: כל השוק מול נישה מוגדרת","גודל החברה: גדולה מול קטנה","אין הבדל – אלה שני שמות לאותה אסטרטגיה"],"a":1,"w":["בשתיהן סוג היתרון הוא עלות נמוכה.","","ההבדל הוא בקהל שהחברה פונה אליו, לא בגודל שלה.","אלה שתי משבצות שונות במטריצה."],"why":"שתיהן מבוססות על עלות נמוכה; ההבדל הוא ברוחב השוק."},{"id":"m4-14","q":"מה ההבדל בין <b>ממוקדת בידול</b> לבין <b>ממוקדת מנהיגות בעלות</b>?","o":["היקף השוק: רחב מול ממוקד","ממוקדת בידול פונה לכל השוק","ממוקדת מנהיגות בעלות לא דורשת נישה","סוג היתרון: ייחודיות מול עלות נמוכה"],"a":3,"w":["בשתיהן ההיקף ממוקד – נישה.","ממוקדת בידול פונה לנישה ספציפית.","גם היא מתמקדת בנישת שוק מוגדרת.",""],"why":"בשתיהן יש נישה; אחת מנצחת בייחוד והשנייה בעלות נמוכה."},{"id":"m4-15","q":"חברה מסוימת מנצחת בזכות ייחודיות שהלקוחות מעריכים, ופונה לשוק רחב. באיזו משבצת היא נמצאת?","o":["בידול רחבה","ממוקדת בידול","מנהיגות בעלות רחבה","משולבת מנהיגות בעלות/בידול"],"a":0,"w":["","ממוקדת בידול פונה לנישה, לא לשוק רחב.","מנהיגות בעלות מבוססת על עלות, לא על ייחודיות.","במשולבת יש גם עלות נמוכה, ולא נאמר כאן דבר על עלות."],"why":"ייחודיות + שוק רחב = בידול רחבה."},{"id":"m4-16","q":"מותג הקוסמטיקה VeganGlow מייצר קרמים טבעוניים מרכיבים נדירים, רק לנשים טבעוניות שמקפידות על מוצרים אתיים. המחיר כפול ממחיר קרם רגיל. איזו אסטרטגיה מתאימה?","o":["בידול רחבה","ממוקדת מנהיגות בעלות","ממוקדת בידול","מנהיגות בעלות רחבה"],"a":2,"w":["המותג לא פונה לכל השוק – רק לנשים טבעוניות.","המחיר גבוה והיתרון הוא ייחוד, לא עלות נמוכה.","","אין כאן לא שוק רחב ולא עלות נמוכה."],"why":"נישה מוגדרת + מוצר ייחודי במחיר גבוה = ממוקדת בידול."},{"id":"m4-17","q":"רשת המרכולים BigFamily פותחת סניפים רק בשכונות שבהן גרות משפחות גדולות. היא מוכרת אריזות ענק במחירים נמוכים מאוד, בלי פרסום ובלי עיצוב חנויות. איזו אסטרטגיה מתאימה?","o":["מנהיגות בעלות רחבה","ממוקדת בידול","ממוקדת מנהיגות בעלות","משולבת מנהיגות בעלות/בידול"],"a":2,"w":["הרשת פונה לקהל מוגדר (משפחות גדולות), לא לכל השוק.","אין כאן ייחוד – רק מחיר נמוך ושירות בסיסי.","","אין בידול שמצטרף לעלות הנמוכה."],"why":"נישה (משפחות גדולות) + עלויות מינימליות = ממוקדת מנהיגות בעלות."},{"id":"m4-18","q":"רשת הרהיטים HomeStyle מוכרת לכל הקהל רהיטים בעיצוב סקנדינבי מוקפד, במחיר נגיש, בזכות אריזות שטוחות ומחסנים אוטומטיים. המנכ״ל אומר: “אנחנו לא בוחרים בין מחיר לעיצוב – אנחנו נותנים את שניהם.” איזו אסטרטגיה מתאימה?","o":["משולבת מנהיגות בעלות/בידול","מנהיגות בעלות רחבה","בידול רחבה","ממוקדת בידול"],"a":0,"w":["","הסיפור מדגיש גם עיצוב מוקפד – זה בידול, לא רק עלות.","הסיפור מדגיש גם מחיר נגיש ועלויות נמוכות.","הרשת פונה לכל הקהל, לא לנישה."],"why":"גם עיצוב (בידול) וגם עלות נמוכה, לשוק רחב, בהצלחה = משולבת."},{"id":"m4-19","q":"הבנק הדיגיטלי EasyBank פועל בלי סניפים, מציע רק חשבון בסיסי בלי תוספות, ופונה לכל האוכלוסייה עם העמלות הנמוכות בשוק. איזו אסטרטגיה מתאימה?","o":["ממוקדת מנהיגות בעלות","בידול רחבה","תקוע באמצע","מנהיגות בעלות רחבה"],"a":3,"w":["הבנק פונה לכל האוכלוסייה, לא לנישה.","אין כאן ייחוד שהלקוח משלם עליו יותר – להפך, הכי זול.","הבנק בחר בבירור ביתרון עלות, ואין סימן לכישלון.",""],"why":"שוק רחב + עלות נמוכה (בלי סניפים, מוצר בסיסי, מכירה ישירה) = מנהיגות בעלות רחבה."},{"id":"m4-20","q":"מה ההבדל בין האסטרטגיה המשולבת לבין מצב של “תקוע באמצע”?","o":["אין הבדל – אלה שני שמות לאותו דבר","במשולבת החברה מצליחה לתת יותר ערך בעלות נמוכה; בתקוע באמצע היא לא נתפסת לא כזולה ולא כמיוחדת","משולבת מתאימה לנישה, ותקוע באמצע לשוק רחב","תקוע באמצע היא אסטרטגיה שפורטר המליץ עליה לחברות קטנות"],"a":1,"w":["אחד הוא אסטרטגיה מצליחה, השני הוא כישלון.","","ההבדל הוא הצלחה מול כישלון, לא היקף השוק.","פורטר הזהיר מפני המצב הזה; זה לא דבר שממליצים עליו."],"why":"בשתיהן יש “גם וגם”, אבל רק במשולבת זה עובד. תקוע באמצע הוא הסיכון של המשולבת."},{"id":"m4-21","q":"חברת התוכנה DentSoft מוכרת תוכנת ניהול בסיסית <b>רק למרפאות שיניים קטנות</b>, במחיר החודשי הנמוך ביותר בשוק, בלי התקנה ובלי הדרכה אישית. איזו אסטרטגיה מתאימה?","o":["ממוקדת מנהיגות בעלות","ממוקדת בידול","מנהיגות בעלות רחבה","בידול רחבה"],"a":0,"w":["","יש נישה, אבל המוצר בסיסי והיתרון הוא מחיר נמוך.","החברה פונה רק למרפאות שיניים קטנות – נישה.","אין כאן לא שוק רחב ולא ייחוד."],"why":"נישה (מרפאות שיניים קטנות) + עלות נמוכה = ממוקדת מנהיגות בעלות."},{"id":"m4-22","q":"איזה משפט בסיפור מעיד שהאסטרטגיה היא <b>ממוקדת</b> ולא רחבה?","o":["“החברה מוכרת בכל העולם ולכל הגילים”","“המחירים של החברה הכי נמוכים בענף”","“החברה מוכרת רק לבעלי כלבים בתל אביב”","“למוצרים של החברה יש עיצוב ייחודי”"],"a":2,"w":["זה תיאור של שוק רחב.","זה מעיד על סוג היתרון (עלות), לא על היקף השוק.","","זה מעיד על סוג היתרון (בידול), לא על היקף השוק."],"why":"“רק ל…” + קהל או אזור מוגדר = שוק יעד ממוקד."},{"id":"m4-23","q":"איזה מהבאים <b>אינו</b> אחת מחמש האסטרטגיות הגנריות בסיכום?","o":["אסטרטגיית בידול רחבה","אסטרטגיית אוקיינוס כחול","אסטרטגיה ממוקדת מנהיגות בעלות","אסטרטגיה משולבת (Best-Cost)"],"a":1,"w":["זו אסטרטגיה מספר 2 במודל.","","זו אסטרטגיה מספר 3 במודל.","זו אסטרטגיה מספר 5 במודל."],"why":"אוקיינוס כחול הוא כלי מיחידה 2. בתרשים של המרצה הוא יושב במרכז יחד עם המשולבת – אבל הוא לא אחת מחמש האסטרטגיות."},{"id":"m4-24","q":"למה חברה שתקועה באמצע מאבדת לקוחות?","o":["כי היא פונה לנישה קטנה מדי","כי המחירים שלה הכי נמוכים בענף","כי היא בחרה אסטרטגיה אחת ברורה מדי","לקוחות שמחפשים מחיר עוברים למנהיג העלות, ולקוחות שמחפשים ייחוד עוברים לחברה המבודלת"],"a":3,"w":["הבעיה של תקוע באמצע היא חוסר יתרון, לא גודל הנישה.","אם המחירים היו הכי נמוכים, היה לה יתרון עלות.","הבעיה היא ההפך – היא לא בחרה בבירור.",""],"why":"אין לה לא יתרון עלות ולא יתרון ייחוד, ולכן היא מפסידה לשני הכיוונים."},{"id":"m4-25","q":"מה הכוונה ב<b>“תת-מיצוב”</b> כסיכון של האסטרטגיה המשולבת?","o":["החברה מוכרת מתחת לעלות כדי לכבוש נתח שוק","הלקוחות לא מבינים בבירור מה החברה מציעה ובמה היא שונה – המיצוב שלה חלש ומטושטש","החברה מתמקדת בנישה קטנה מדי","לחברה יש יותר מדי סניפים"],"a":1,"w":["זה תמחור טורף, לא תת-מיצוב.","","זה סיכון של מיקוד, לא תת-מיצוב.","תת-מיצוב עוסק בתפיסה של הלקוח, לא במספר הסניפים."],"why":"מי שמנסה להיות “גם וגם” בלי הצלחה, לא נתפס לא כזול ולא כמיוחד – תת-מיצוב."},{"id":"m4-26","q":"לפי חומר הקורס, מהו החיסרון הבולט ביותר של אסטרטגיה משולבת מנהיגות בעלות/בידול?","o":["המתחרים יכולים להעתיק בקלות את שיטות הייעול","הנישה עלולה להפוך לאטרקטיבית ולמשוך מתחרים גדולים","נדרשת השקעה כבדה בחינוך השוק","בעיית תת-מיצוב","אף תשובה אינה נכונה"],"a":3,"w":["זה סיכון אופייני של מנהיגות בעלות.","זה סיכון של אסטרטגיות המיקוד.","זה סיכון של חלוץ שפותח שוק חדש, לא החיסרון הבולט של המשולבת.","","יש תשובה נכונה: תת-מיצוב."],"why":"המשולבת עומדת בין זול למיוחד; אם הלקוחות לא מבינים מה היא, המיצוב שלה חלש – תת-מיצוב."},{"id":"m4-27","q":"חברת הקוסמטיקה PureGlow לא הוזילה עלויות בכלל, ובכל זאת נהנית מיתרון תחרותי. מה יכול להסביר זאת?","o":["היא מציעה תועלת ייחודית – איכות, שירות וזמינות שהלקוחות מעריכים","היא פנתה לשוק חדש שהמתחרים טרם פנו אליו (אוקיינוס כחול)","אין הסבר: יתרון תחרותי מחייב הוזלה משמעותית בעלויות","תשובות א, ג נכונות","תשובות א, ב נכונות"],"a":4,"w":["נכון, אבל גם ב נכונה.","נכון, אבל גם א נכונה.","לא נכון – יש דרכים ליתרון בלי הוזלת עלויות.","ג אינה נכונה.",""],"why":"יתרון אפשר להשיג גם בלי הוזלת עלויות: בתועלת ייחודית (בידול) או באוקיינוס כחול (שוק חדש)."},{"id":"m4-28","q":"לפי הקורס, <b>הערך הכלכלי</b> שהפירמה יוצרת נקבע לפי:","o":["המחיר שהלקוח משלם בלבד","הערך שהלקוח תופס פחות העלות של יצירת המוצר","נתח השוק של הפירמה","העלות של הפירמה בלבד","הרווח החשבונאי בשנה האחרונה"],"a":1,"w":["מחיר הוא לא ערך; הערך הוא מה שהלקוח תופס.","","נתח שוק הוא תוצאה, לא הגדרת ערך כלכלי.","חסר הגורם השני – הערך שהלקוח תופס.","רווח חשבונאי הוא מדד פיננסי, לא ההגדרה."],"why":"ערך כלכלי = ערך פחות עלות. שני גורמים: ערך ועלות."},{"id":"m4-29","q":"חברת התעופה FlyLow פונה לנוסעים מכל הפלחים שבוחרים כרטיס <b>רק לפי המחיר</b>. היא רוצה ליצור עבורם ערך כלכלי ולהשיג יתרון תחרותי. איזו אסטרטגיה מתאימה?","o":["בידול רחבה","ממוקדת בידול","מנהיגות בעלות","תקוע באמצע","אף תשובה אינה נכונה"],"a":2,"w":["בידול מתאים ללקוחות שמשלמים על ייחוד, לא לרגישים למחיר.","גם כאן מדובר בייחוד, ובנוסף בנישה – לא מתאים.","","תקוע באמצע הוא כישלון, לא אסטרטגיה.","יש תשובה נכונה: מנהיגות בעלות."],"why":"לקוחות רגישים למחיר + קהל רחב ← מנהיגות בעלות: מחיר אטרקטיבי בזכות עלות נמוכה."},{"id":"m4-30","q":"מה מהבאים <b>אינו</b> סיכון של אסטרטגיית בידול?","o":["המחיר נתפס גבוה מדי לעומת מנהיגי העלות","הלקוחות לא תופסים את הערך הייחודי","חיקויים וזיופים של המוצר","עליית מחירים אצל הספקים","הלקוחות מפסיקים לייחס חשיבות לתכונה המבדלת"],"a":3,"w":["זה סיכון מובהק של בידול.","זה סיכון מובהק של בידול.","זה סיכון מובהק של בידול.","","זה גרסה של “הערך לא נתפס” – סיכון של בידול."],"why":"עליית מחירי ספקים היא שינוי חיצוני בעלויות שפוגע בכל הענף; חברה מבודלת אף יכולה לגלגל אותו ללקוח."},{"id":"m4-31","q":"בתרשים האסטרטגיות הגנריות של המרצה, היכן מוצג האוקיינוס הכחול?","o":["במרכז, יחד עם האסטרטגיה המשולבת – שבירת שקלול התמורות ערך-עלות","במשבצת ממוקדת בידול, כי זו נישה","במשבצת מנהיגות בעלות, כי המחיר נמוך","בארבע הפינות, שבהן מנצחים את המתחרים בשוק הקיים","הוא לא קשור לתרשים בכלל"],"a":0,"w":["","נישה לבדה אינה אוקיינוס כחול; ממוקדת בידול היא פינה = אדום.","מנהיגות בעלות מבצעת פשרה (בוחרת עלות) = אדום.","הפינות הן אוקיינוס אדום.","המרצה מצרף לתרשים את טבלת אדום מול כחול."],"why":"המשולבת במרכז שוברת את הפשרה ערך-עלות, כמו האוקיינוס הכחול; ארבע הפינות = אוקיינוס אדום."},{"id":"m4-32","q":"מה מהבאים מאפיין <b>אוקיינוס אדום</b> ולא אוקיינוס כחול?","o":["ליצור נישת שוק ללא מתחרים","להפוך את המתחרים ללא רלוונטיים","ליצור ולתפוס ביקוש חדש","“לשבור” את שקלול התמורות ערך-עלות","לנצל את הביקוש הקיים ולנצח את המתחרים"],"a":4,"w":["זה מאפיין של אוקיינוס כחול.","זה מאפיין של אוקיינוס כחול.","זה מאפיין של אוקיינוס כחול.","זה מאפיין של אוקיינוס כחול.",""],"why":"אדום = שוק קיים, ביקוש קיים, ניצחון על המתחרים וביצוע הפשרה ערך-עלות."}],"tf":[{"id":"m4-t1","s":"מודל האסטרטגיות התחרותיות הגנריות פותח על ידי פורטר ב-1985.","a":true,"why":"נכון. כך מופיע בסיכום."},{"id":"m4-t2","s":"המודל של פורטר מסווג אסטרטגיות לפי גודל החברה ושלב חיי המוצר.","a":false,"why":"לא נכון. הצירים הם סוג היתרון התחרותי (עלות מול ייחודיות) והיקף שוק היעד (רחב מול ממוקד)."},{"id":"m4-t3","s":"אסטרטגיה ממוקדת מנהיגות בעלות מתמקדת בנישת שוק מוגדרת ושומרת על עלויות מינימליות.","a":true,"why":"נכון. נישה + עלות נמוכה."},{"id":"m4-t4","s":"בידול רחבה פירושה מוצר בסיסי וזול לכל הקהל.","a":false,"why":"לא נכון. זו מנהיגות בעלות רחבה. בידול רחבה היא מוצר שנתפס כייחודי, בשוק רחב."},{"id":"m4-t5","s":"מיקור חוץ ומכירה ישירה הן דרכים להשיג מנהיגות בעלות רחבה.","a":true,"why":"נכון. לצד ייעול שרשרת הערך ומוצר חף מקישוטים."},{"id":"m4-t6","s":"ממוקדת בידול וממוקדת מנהיגות בעלות נבדלות זו מזו בהיקף שוק היעד.","a":false,"why":"לא נכון. בשתיהן ההיקף ממוקד. הן נבדלות בסוג היתרון: ייחודיות מול עלות."},{"id":"m4-t7","s":"האסטרטגיה המשולבת נותנת יותר ערך עבור המחיר, בשילוב של בידול ועלויות נמוכות.","a":true,"why":"נכון. זו ההגדרה של Best-Cost / Integrated."},{"id":"m4-t8","s":"הסיכון המרכזי של האסטרטגיה המשולבת הוא שהיא מוגבלת לנישה קטנה.","a":false,"why":"לא נכון. הסיכון המרכזי הוא תת-מיצוב והילכדות במצב של תקוע באמצע."},{"id":"m4-t9","s":"לפי הסיכום, האסטרטגיה המשולבת מתאימה יותר ל“אוקיינוס כחול”.","a":true,"why":"נכון. שתיהן שוברות את הפשרה בין ערך לעלות."},{"id":"m4-t10","s":"חברה תקועה באמצע היא חברה שבחרה במודע באסטרטגיה המשולבת והצליחה.","a":false,"why":"לא נכון. תקוע באמצע הוא כישלון: החברה לא זולה ולא מיוחדת."},{"id":"m4-t11","s":"מנהיגות בעלות פירושה עלויות נמוכות משמעותית מהמתחרים, ולא רק מחיר נמוך.","a":true,"why":"נכון. היתרון הוא מבנה העלויות; מחיר נמוך בלי עלות נמוכה הוא הפסד."},{"id":"m4-t12","s":"מוצר “חף מקישוטים” (No-frills) הוא סימן לאסטרטגיית בידול.","a":false,"why":"לא נכון. מוצר בסיסי בלי תוספות הוא סימן למנהיגות בעלות."},{"id":"m4-t13","s":"המודל של פורטר צמח משלוש אסטרטגיות עיקריות: מנהיגות בעלות, בידול ומיקוד.","a":true,"why":"נכון. מהן נבנו חמש האסטרטגיות."},{"id":"m4-t14","s":"אסטרטגיית מיקוד חייבת תמיד להיות זולה.","a":false,"why":"לא נכון. יש ממוקדת מנהיגות בעלות וגם ממוקדת בידול."},{"id":"m4-t15","s":"חברה שמוכרת שעוני יוקרה בעבודת יד לאספנים בלבד פועלת באסטרטגיה ממוקדת בידול.","a":true,"why":"נכון. נישה (אספנים) + ייחוד."},{"id":"m4-t16","s":"חברה שמוכרת לכל השוק מוצר יוקרתי במחיר פרימיום פועלת באסטרטגיה ממוקדת בידול.","a":false,"why":"לא נכון. כשהשוק רחב, זו בידול רחבה."},{"id":"m4-t17","s":"באסטרטגיית בידול, הדבר החשוב הוא שהלקוח תופס את המוצר כבעל ערך ייחודי.","a":true,"why":"נכון. בלי תפיסה של ייחוד אצל הלקוח אין בידול."},{"id":"m4-t18","s":"אוקיינוס כחול היא אחת מחמש האסטרטגיות הגנריות של פורטר.","a":false,"why":"לא נכון. אוקיינוס כחול אינו משבצת בין החמש; בתרשים של המרצה הוא מוצג במרכז, יחד עם המשולבת (שבירת הפשרה ערך-עלות), מול ארבע הפינות = אוקיינוס אדום."},{"id":"m4-t19","s":"הציר של סוג היתרון במטריצה של פורטר מבחין בין עלות נמוכה לבין ייחודיות.","a":true,"why":"נכון. הציר השני הוא היקף שוק היעד."},{"id":"m4-t20","s":"חברה שתקועה באמצע נהנית משני היתרונות: עלות נמוכה וייחודיות.","a":false,"why":"לא נכון. היא לא משיגה אף אחד מהם, ולכן מאבדת לקוחות לשני הכיוונים."},{"id":"m4-t21","s":"כדי לזהות אסטרטגיה בסיפור, שואלים מה מקור היתרון ומה היקף השוק.","a":true,"why":"נכון. אלה שני הצירים של המטריצה."},{"id":"m4-t22","s":"פורטר המליץ ליישם במקביל כמה אסטרטגיות גנריות כדי לפזר סיכון.","a":false,"why":"לא נכון. פורטר הזהיר שמי שלא בוחר בבירור עלול להיתקע באמצע."},{"id":"m4-t23","s":"פירמה אינה יכולה ליהנות מיתרון תחרותי בלי להוזיל משמעותית את עלויותיה.","a":false,"why":"לא נכון. אפשר להשיג יתרון גם בתועלת ייחודית (איכות, שירות, זמינות, חדשנות) או באוקיינוס כחול – פנייה לשוק חדש."},{"id":"m4-t24","s":"ערך כלכלי מורכב משני גורמים: הערך שהלקוח תופס והעלות.","a":true,"why":"נכון. ערך כלכלי = ערך פחות עלות."},{"id":"m4-t25","s":"עלייה במחירי הספקים היא אחד הסיכונים המובהקים של אסטרטגיית בידול.","a":false,"why":"לא נכון. סיכוני הבידול: מחיר נתפס גבוה מדי, ערך לא נתפס, חיקויים וזיופים. עליית מחירי ספקים פוגעת בכל הענף."},{"id":"m4-t26","s":"פירמה יכולה להשיג יתרון תחרותי ביצירת ערך כלכלי ללקוחות רגישים למחיר, באסטרטגיית מנהיגות בעלות או ממוקדת מנהיגות בעלות.","a":true,"why":"נכון. אלה האסטרטגיות שמציעות מחיר אטרקטיבי ביחס למתחרים בזכות עלות נמוכה."},{"id":"m4-t27","s":"בתרשים של המרצה, אוקיינוס כחול מאופיין בביצוע שקלול תמורות בין ערך לעלות.","a":false,"why":"לא נכון. ביצוע הפשרה הוא אוקיינוס אדום; אוקיינוס כחול “שובר” אותה."}],"scope":[{"ref":"סיכום · עמ׳ 8","x":"מודל פורטר (1985): סוג היתרון × היקף שוק היעד","imp":2,"h":"שני צירים, חמש אסטרטגיות"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"ערך כלכלי = ערך פחות עלות; יתרון בלי הוזלת עלויות; לקוחות רגישים למחיר","imp":2,"h":"ערך כלכלי = ערך פחות עלות: שתי דרכים ליתרון"},{"ref":"סיכום · עמ׳ 8","x":"מנהיגות בעלות רחבה","imp":2,"h":"1. מנהיגות בעלות רחבה (Broad Low Cost)"},{"ref":"סיכום · עמ׳ 8","x":"בידול רחבה","imp":2,"h":"2. בידול רחבה (Broad Differentiation)"},{"ref":"סיכום · עמ׳ 8","x":"ממוקדת מנהיגות בעלות","imp":2,"h":"3. ממוקדת מנהיגות בעלות (Focused Low Cost)"},{"ref":"סיכום · עמ׳ 8","x":"ממוקדת בידול","imp":2,"h":"4. ממוקדת בידול (Focused Differentiation)"},{"ref":"סיכום · עמ׳ 8","x":"משולבת (Best-Cost) ואוקיינוס כחול","imp":2,"h":"5. משולבת מנהיגות בעלות/בידול (Best-Cost / Integrated)"},{"ref":"סיכום · עמ׳ 8","x":"הסיכון: תקוע באמצע","imp":1,"h":"תקוע באמצע (Stuck in the Middle)"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"סיכוני כל אסטרטגיה: בידול (מחיר גבוה, ערך לא נתפס, חיקויים – לא עליית מחירי ספקים); משולבת = תת-מיצוב","imp":2,"h":"הסיכונים של כל אסטרטגיה גנרית (ומה אינו סיכון)"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"תרשים המרצה: סוג יתרון × קהל יעד; המשולבת במרכז = אוקיינוס כחול, הפינות = אוקיינוס אדום","imp":2,"h":"התרשים של המרצה: חמש האסטרטגיות, אוקיינוס אדום ואוקיינוס כחול"}],"outScope":[]},{"id":"m5","title":"חדשנות","short":"סוגי חדשנות","blurb":"חמשת סוגי החדשנות בקורס: הדרגתית, רדיקלית ופורצת דרך על מפת 2×2, חדשנות משבשת (כלל ה-50%) וחדשנות חסכנית.","mnemonic":"שתי שאלות למפה: ״כמה טכנולוגיה?״ ו״כמה מודל עסקי?״. נמוך-נמוך = הדרגתית, גבוה-גבוה = רדיקלית, ״גבוה באחד ונמוך בשני״ = פורצת דרך (על האלכסון, פעמיים). מחוץ למפה: משבשת = ״זול, פשוט, מספיק טוב ← חצי ועוד אחד עוברים״; חסכנית = ״יש מאין״ (הודו, Tata Nano).","blocks":[{"t":"h","x":"מהי חדשנות?"},{"t":"p","x":"<b>חדשנות</b> היא יצירת <b>ערך נוסף</b>. יש לה שתי דרכים: לתת <b>פתרון חדש לצורך שכבר קיים</b
