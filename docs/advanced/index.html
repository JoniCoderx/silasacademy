ירות בעצמה). בכתבה טסלה עושה אינטגרציה אחורה: מייצרת סוללות ומפתחת תאי סוללה ותוכנה בעצמה, במקום לקנות מספקים כמו רוב יצרניות הרכב. היא עושה גם אינטגרציה קדימה: מכירה ישירה בלי סוכנויות, רשת טעינה משלה ושדרוגי תוכנה ״באוויר״. היתרונות: שליטה באיכות ובטכנולוגיה, פחות תלות בספקים, קשר ישיר עם הלקוח וחיסכון במרווח של המתווכים. החסרונות: השקעה עצומה, פחות גמישות כשהטכנולוגיה או הביקוש משתנים, וקושי להיות מצוינים בכל שלב בשרשרת.","keys":["הכרעה: צודק","הגדרה: הפירמה מבצעת בעצמה שלבים נוספים בשרשרת הענף","אחורה (סוללות, תוכנה) מול קדימה (מכירה ישירה, טעינה, שירות)","יתרונות: שליטה, פחות תלות בספקים, קשר עם הלקוח","חסרונות: השקעה גבוהה, חוסר גמישות"]},{"q":"עידו טוען שהיתרון התחרותי של טסלה הוא קבוע, ושהיא עדיין נמצאת בשלב ההנאה ממנו בלי שום סימני שחיקה. האם עידו צודק או טועה? נמק תוך הסבר מודל הבנייה, ההנאה והשחיקה של יתרון תחרותי.","model":"<b>עידו טועה</b> – הכתבה מראה סימנים ברורים לשלב השחיקה. לפי המודל ליתרון תחרותי יש שלושה שלבים: <b>בנייה</b> – השקעה בטכנולוגיה ובמשאבים; <b>הנאה</b> (בסיכום: תקופת התועלת) – תקופה של רווחים מעל הממוצע; <b>שחיקה</b> – מתחרים מחקים, עוקפים או מציעים תחליף, והיתרון נעלם. משך שלב ההנאה תלוי בכמה קשה לחקות את היתרון, ולכן שום יתרון אינו קבוע. טסלה בנתה יתרון בטכנולוגיה, בסוללות ובתוכנה ונהנתה ממנו שנים: מרווחים גבוהים מהממוצע בענף ושווי שוק עצום. עכשיו מופיעים סימני שחיקה: BYD ויצרניות סיניות מציעות רכבים זולים ועקפו אותה במכירות רכבים חשמליים מלאים, והיצרניות הוותיקות השיקו דגמים רבים. טסלה נאלצה להוריד מחירים, המרווחים ירדו והמסירות ירדו ב-2024 – כלומר היתרון נשחק. ההשקעה בנהיגה אוטונומית, רובוטים ואגירה היא ניסיון <b>לבנות יתרון חדש</b> לפני שהיתרון הקיים יישחק לגמרי.","keys":["הכרעה: טועה – יש שחיקה","שלושת השלבים: בנייה, הנאה, שחיקה","שום יתרון אינו קבוע – משך ההנאה תלוי בקושי לחקות","שחיקה בכתבה: BYD עקפה, הורדות מחיר, מרווחים ומסירות ירדו","תגובה: בניית יתרון חדש (אוטונומי, רובוטים, אגירה)"]}]},{"id":"netflix","title":"נטפליקס, בלוקבסטר ובתי הקולנוע","text":"נטפליקס נוסדה ב-1997 כשירות להשכרת סרטי DVD בדואר, בתקופה שבה רשת בלוקבסטר שלטה בשוק השכרת הסרטים עם אלפי סניפים. בהתחלה המבחר של נטפליקס היה מוגבל, הסרטים החדשים הגיעו באיחור, והלקוח היה צריך לחכות כמה ימים לדיסק. מצד שני, השירות היה זול ונוח: מנוי חודשי קבוע, בלי קנסות איחור ובלי צורך לצאת מהבית. ב-2007 החלה נטפליקס להציע צפייה ישירה באינטרנט (סטרימינג), והאיכות והמבחר השתפרו משנה לשנה. בלוקבסטר לא ראתה בה איום רציני, ובשנת 2010 פשטה רגל. כיום יש לנטפליקס יותר מ-300 מיליון מנויים בעולם, והיא משקיעה מיליארדי דולרים בשנה בתוכן מקורי. לצידה פועלים שירותי סטרימינג כמו דיסני+, אמזון פריים וידאו ואפל TV+, שגובים מחיר חודשי דומה ומציעים ספריות תוכן רחבות. חלק מהמתחרים מציעים חבילות משותפות והנחות, ולקוחות רבים עוברים בין השירותים לפי הסדרה החמה של החודש. בתי הקולנוע, ובהם רשתות כמו יס פלאנט וסינמה סיטי בישראל, נפגעו קשות בתקופת הקורונה וממשיכים להתמודד עם ירידה בביקורים. הם מנסים למשוך קהל בעזרת חוויה: מסכי IMAX, מושבים מפנקים ואוכל.","qs":[{"q":"שירה טוענת שנטפליקס היא דוגמה לחדשנות משבשת (Disruptive Innovation) בשוק השכרת הסרטים. האם היא צודקת או טועה? נמקי תוך הסבר מאפייני חדשנות משבשת.","model":"<b>שירה צודקת.</b> חדשנות משבשת מתחילה במוצר <b>פחות מתקדם</b> מהמוצר המוביל, אבל זול, פשוט, נוח ו״בלי קישוטים״, שפונה ללקוחות שהשחקנים הוותיקים לא מתעניינים בהם. המוביל הוותיק מזלזל בה, כי היא לא עונה על צורכי הלקוחות הטובים שלו; אבל עם הזמן הטכנולוגיה משתפרת, והחידוש מושך את <b>רוב הלקוחות</b> (מעל 50%) ודוחק את המוצר הישן. בכתבה נטפליקס התחילה בהצעה נחותה: מבחר מוגבל, סרטים חדשים באיחור והמתנה לדיסק – אבל זולה ונוחה, בלי קנסות ובלי לצאת מהבית. בלוקבסטר לא ראתה בה איום – בדיוק התגובה של המוביל הוותיק. עם המעבר לסטרימינג השירות השתפר, רוב הצופים עברו אליו, ובלוקבסטר פשטה רגל ב-2010. כאן, בשונה מ-Kindle, השוק הישן כבר נדחק בפועל, ולכן אפשר לקבוע שזו חדשנות משבשת.","keys":["הכרעה: צודקת","מאפיינים: מוצר פחות מתקדם בהתחלה – זול, פשוט, נוח, בלי קישוטים","השחקן הוותיק מזלזל; החידוש משתפר עם הזמן","תנאי: רוב הלקוחות (מעל 50%) עוברים והמוצר הישן נדחק","מהכתבה: מבחר מוגבל אבל זול ונוח; בלוקבסטר לא הגיבה ופשטה רגל"]},{"q":"רון טוען שנטפליקס ודיסני+ נמצאות באותה קבוצה אסטרטגית, ולכן התחרות ביניהן חלשה יותר מהתחרות שלהן מול בתי הקולנוע. האם רון צודק או טועה? נמק תוך הסבר מיפוי קבוצות אסטרטגיות.","model":"<b>רון טועה</b> – הוא צודק לגבי הקבוצה, אבל טועה לגבי עוצמת התחרות. קבוצה אסטרטגית היא קבוצת פירמות בענף שנוקטות אסטרטגיה דומה – מחיר, מגוון, ערוצי הפצה ואיכות. במיפוי בוחרים שני צירים עם <b>מתאם נמוך</b> (למשל מחיר לצפייה × אופן הצפייה – בבית או באולם), גודל העיגול מבטא את חלק הקבוצה בהכנסות הענף, והמשתנים לא חייבים להיות רציפים. התחרות <b>בתוך</b> קבוצה אסטרטגית חריפה יותר מהתחרות בין קבוצות, כי הפירמות פונות לאותם לקוחות עם הצעה דומה. בכתבה נטפליקס ודיסני+ באמת שייכות לאותה קבוצה: מנוי חודשי במחיר דומה, צפייה בבית וספריית תוכן רחבה. דווקא בגלל זה הן המתחרות הקרובות ביותר: הן נלחמות על אותו לקוח בחבילות ובהנחות, ולקוחות עוברים ביניהן לפי הסדרה החמה. בתי הקולנוע נמצאים בקבוצה רחוקה – כרטיס לצפייה בודדת וחוויה מחוץ לבית – ולכן התחרות מולם חלשה יותר.","keys":["הכרעה: טועה (לגבי עוצמת התחרות)","הגדרה: פירמות עם אסטרטגיה דומה באותו ענף","כללי מיפוי: שני צירים עם מתאם נמוך, עיגול = חלק מהכנסות הענף","תחרות בתוך הקבוצה חריפה מתחרות בין קבוצות","מהכתבה: מחיר דומה, אותם לקוחות, מעבר בין שירותים; בתי קולנוע – קבוצה אחרת"]}]},{"id":"teva","title":"טבע: ענקית הגנריקה והעסקה של אקטביס","text":"טבע, שנוסדה בישראל, היא אחת מיצרניות התרופות הגנריות הגדולות בעולם. תרופה גנרית היא העתק של תרופה מקורית שהפטנט עליה פקע; היא זהה בחומר הפעיל ונמכרת במחיר נמוך בהרבה. הלקוחות העיקריים – קופות חולים, ביטוחי בריאות ורשתות פארם – רגישים מאוד למחיר ובוחרים בדרך כלל בספק הזול. טבע מוכרת אלפי מוצרים במדינות רבות, ומפעלים גדולים מאפשרים לה לייצר בעלות נמוכה ליחידה. ב-2016 השלימה טבע את רכישת אקטביס ג׳נריקס, חטיבת התרופות הגנריות של אלרגן, בכ-40 מיליארד דולר. העסקה הפכה אותה לחברת הגנריקה הגדולה בעולם, אבל גם הותירה אותה עם חוב של עשרות מיליארדי דולרים. זמן קצר אחר כך ירדו מחירי התרופות הגנריות בארה״ב בחדות, וטבע נאלצה להודיע על תוכנית התייעלות שכללה פיטורי אלפי עובדים וסגירת מפעלים. בשנים האחרונות החברה מצמצמת את החוב בהדרגה ומשקיעה גם בתרופות מקור ובתרופות ביולוגיות דומות (ביוסימילרים). מנהלי החברה מדגישים שהיעילות התפעולית והיקף הייצור נשארים הבסיס לתחרותיות שלה בגנריקה.","qs":[{"q":"סטודנטית טוענת שבתחום הגנריקה טבע נוקטת באסטרטגיה של מנהיגות בעלות. האם היא צודקת או טועה? נמקי תוך הסבר האסטרטגיות הגנריות של פורטר.","model":"<b>הסטודנטית צודקת.</b> פורטר מבחין בין שני סוגי יתרון – <b>עלות נמוכה</b> או <b>ייחודיות</b> – ושני היקפי קהל יעד – <b>רחב</b> או <b>ממוקד</b>: מנהיגות בעלות, בידול רחב, מנהיגות בעלות ממוקדת ובידול ממוקד, ולצידן האסטרטגיה המשולבת (Best-cost). מנהיגות בעלות פירושה להיות היצרן בעל העלות הנמוכה בענף ולמכור לשוק רחב במחיר אטרקטיבי, בעזרת יתרון לגודל, יעילות תפעולית ועקומת למידה. בכתבה טבע מוכרת תרופות זהות לתרופות המקור – אין לה ייחודיות במוצר, ולכן היא מתחרה על המחיר. הלקוחות (קופות חולים, ביטוחים) רגישים מאוד למחיר, וזה בדיוק הקהל של מנהיג עלות. היקף הקהל רחב – אלפי מוצרים במדינות רבות – ולא נישה, ולכן זו מנהיגות בעלות ולא מנהיגות בעלות ממוקדת. המקור לעלות הנמוכה הוא היקף ייצור ומפעלים גדולים, ותוכנית ההתייעלות היא ניסיון לשמור על יתרון העלות כשהמחירים בשוק ירדו.","keys":["הכרעה: צודקת","המטריצה של פורטר: עלות נמוכה/ייחודיות × קהל רחב/ממוקד","מנהיגות בעלות = עלות נמוכה בענף + מחיר אטרקטיבי לשוק רחב","מוצר זהה, לקוחות רגישים למחיר","קהל רחב (אלפי מוצרים, מדינות רבות); מקור העלות – יתרון לגודל ויעילות"]},{"q":"אנליסט טוען שרכישת אקטביס ג׳נריקס הייתה מהלך של אינטגרציה אנכית. האם הוא צודק או טועה? נמק תוך הסבר סוגי המיזוגים והרכישות ויתרונותיהם וסיכוניהם.","model":"<b>האנליסט טועה</b> – זו רכישה <b>אופקית</b>, לא אנכית. ברכישה פירמה קונה פירמה אחרת ומקבלת שליטה בה; במיזוג שתי פירמות מתאחדות לישות אחת. <b>רכישה אופקית</b> היא רכישת מתחרה מאותו ענף ומאותו שלב בשרשרת; <b>אינטגרציה אנכית</b> היא רכישת ספק (אחורה) או מפיץ/לקוח (קדימה); <b>הגוונה</b> היא רכישה בענף אחר. אקטביס ג׳נריקס הייתה חברת תרופות גנריות – בדיוק מה שטבע עושה – ולכן זו רכישת מתחרה באותו שלב, כלומר רכישה אופקית. היתרונות שחיפשה טבע: גודל ויתרון לגודל, סל מוצרים רחב יותר, נתח שוק גדול וכוח מיקוח מול הלקוחות – וכך היא הפכה לחברת הגנריקה הגדולה בעולם. הסיכונים: תשלום מחיר גבוה מדי, חוב כבד, וקשיי שילוב בין שתי החברות. בכתבה הסיכונים התממשו: חוב של עשרות מיליארדים, ירידת מחירים בארה״ב, ותוכנית פיטורים וסגירת מפעלים.","keys":["הכרעה: טועה – רכישה אופקית","הבחנה בין רכישה למיזוג","אופקית (מתחרה) מול אנכית (ספק/מפיץ) מול הגוונה (ענף אחר)","יתרונות: יתרון לגודל, נתח שוק, סל מוצרים","סיכונים מהכתבה: מחיר גבוה, חוב, פיטורים וקשיי שילוב"]}]},{"id":"zara","title":"זארה: אופנה מהירה ממפעל לחנות","text":"זארה, המותג המרכזי של קבוצת אינדיטקס הספרדית, היא אחת מחלוצות ״האופנה המהירה״ (Fast fashion). בעוד שרשתות אופנה מסורתיות מתכננות קולקציות חודשים מראש, זארה יכולה להעביר פריט חדש מהשרטוט לחנות בתוך שבועות ספורים. מעצבי החברה עובדים במטה בספרד ומקבלים כל יום דיווחים ממנהלי החנויות על מה שלקוחות מבקשים ומה לא נמכר. חלק גדול מהייצור נעשה במפעלים קרובים – בספרד, בפורטוגל, במרוקו ובטורקיה – ולא רק במזרח הרחוק הזול. החברה מייצרת כמויות קטנות מכל דגם, וכל הסחורה עוברת דרך מרכזי הפצה גדולים בספרד שמשגרים משלוחים לחנויות פעמיים בשבוע. לחנויות מגיעים כל הזמן פריטים חדשים, והלקוחות יודעים שאם לא יקנו עכשיו – הפריט עלול להיעלם. בזכות הכמויות הקטנות זארה נאלצת למכור פחות פריטים בהנחה בסוף העונה מהמתחרים. החברה משקיעה מעט יחסית בפרסום, וסומכת על מיקום חנויות במרכזי ערים ועל תחלופת הסחורה. בענף פועלות גם H&M, יוניקלו ופריימרק, ובשנים האחרונות גם קמעונאיות מקוונות כמו שיין, שמהירות עוד יותר. מנהלים בענף מסכמים שבאופנה של היום ״מי שמגיע אחרון לטרנד – נשאר עם המלאי״.","qs":[{"q":"מאיה טוענת שהיתרון התחרותי של זארה נובע מפעילות אחת בלבד – העיצוב. האם מאיה צודקת או טועה? נמקי תוך הסבר מודל שרשרת הערך.","model":"<b>מאיה טועה.</b> שרשרת הערך של פורטר מחלקת את הפירמה ל<b>פעילויות עיקריות</b> – לוגיסטיקה נכנסת, תפעול (ייצור), לוגיסטיקה יוצאת, שיווק ומכירות, שירות – ול<b>פעילויות תומכות</b> – תשתית הפירמה, ניהול משאבי אנוש, פיתוח טכנולוגי ורכש. היתרון נוצר מכל הפעילויות ובעיקר <b>מהקשרים ביניהן</b> – ולכן קשה מאוד לחקות אותו. בכתבה העיצוב מקבל מידע יומי מהחנויות (קשר בין מכירות לעיצוב), הייצור נעשה במפעלים קרובים ובכמויות קטנות (תפעול), ומרכזי ההפצה משגרים משלוחים פעמיים בשבוע (לוגיסטיקה יוצאת). גם השיווק מתאים לשרשרת: מעט פרסום, מיקום במרכזי ערים ותחלופה מהירה שיוצרת תחושת דחיפות. התוצאה: מהשרטוט לחנות תוך שבועות ופחות הנחות בסוף העונה – תוצאה של שרשרת שלמה ומתואמת, לא של העיצוב לבדו.","keys":["הכרעה: טועה","פעילויות עיקריות ופעילויות תומכות בשרשרת הערך","היתרון נובע מהקשרים בין הפעילויות","מהכתבה: מידע יומי מהחנויות, ייצור קרוב בכמויות קטנות, הפצה פעמיים בשבוע","שיווק: מעט פרסום, מיקום ותחלופה; התוצאה – פחות הנחות"]},{"q":"יואב טוען שמהירות התגובה לטרנדים היא מפתח הצלחה (KSF) בענף האופנה המהירה. האם הוא צודק או טועה? נמק תוך הסבר המושג מפתחות הצלחה בענף.","model":"<b>יואב צודק.</b> מפתחות הצלחה בענף (KSF) הם <b>תחומי הפעילות שכל פירמה בענף חייבת להיות טובה בהם</b> כדי להצליח לאורך זמן – בדרך כלל 3–4 לענף, והם משתנים מעת לעת. כל פירמה צריכה להיות טובה בכל ה-KSF ולהצטיין לפחות באחד מהם כדי ליהנות מיתרון תחרותי בר-קיימא. KSF שייכים לענף ולא לפירמה מסוימת, והם לא סל המוצרים של הפירמה. בענף האופנה המהירה מהירות התגובה לטרנדים היא KSF מובהק – כמו שהכתבה מסכמת: ״מי שמגיע אחרון לטרנד – נשאר עם המלאי״. KSF נוספים בענף: עלויות ייצור נמוכות, מיקום וזמינות החנויות או האתר, וקריאה נכונה של טעם הלקוחות. זארה מצטיינת במהירות (שבועות מהשרטוט לחנות), ולכן נהנית מיתרון; אבל שיין, שמהירה עוד יותר, מראה שה-KSF משתנים ושהיתרון צריך שיפור מתמיד.","keys":["הכרעה: צודק","הגדרה: תחומי פעילות שכל פירמה בענף חייבת להיות טובה בהם","3–4 לענף ומשתנים מעת לעת","להיות טובה בכולם ולהצטיין לפחות באחד = יתרון בר-קיימא","מהכתבה: ״מי שמגיע אחרון לטרנד נשאר עם המלאי״; זארה מצטיינת במהירות"]}]},{"id":"ikea","title":"איקאה בישראל: שוודיה עם התאמות מקומיות","text":"רשת הרהיטים השוודית איקאה פתחה את החנות הראשונה שלה בישראל בנתניה ב-2001, ומאז נפתחו בארץ סניפים נוספים. כמו בשאר העולם, איקאה בישראל מופעלת על ידי זכיין מקומי, שפועל לפי הכללים, העיצוב והמותג של הרשת הבינלאומית. המוצרים מתוכננים ונרכשים באופן מרוכז בעולם, בכמויות עצומות, וכך הרשת משיגה עלויות נמוכות. רוב המוצרים נמכרים באריזות שטוחות, והלקוח לוקח אותם מהמחסן ומרכיב בעצמו – מה שחוסך בעלויות הובלה, אחסון וכוח אדם. עם זאת, הרהיטים מעוצבים בסגנון סקנדינבי מוקפד, והחנות בנויה כחוויה: חדרים לדוגמה, מסעדה ופינת משחקים לילדים. בישראל ביצעה הרשת התאמות: המסעדה כשרה, השילוט והקטלוג בעברית, וחלק מהמוצרים מותאמים לדירות קטנות ולמרפסות. ב-2017 עוררה איקאה ישראל סערה כשהפיקה קטלוג מיוחד לציבור החרדי בלי נשים בתמונות, ונאלצה להתנצל. המחירים של איקאה גבוהים בחלק מהמוצרים מאלה של רשתות רהיטים זולות, אבל נמוכים בהרבה ממחירי חנויות המעצבים. בשנים האחרונות מתחרות בה רשתות מקומיות ואתרי קניות מקוונים, ואיקאה מרחיבה את המשלוחים והקנייה באתר.","qs":[{"q":"גיל טוען שאיקאה נוקטת בישראל באסטרטגיה בינלאומית גלובלית (אחידה) בלבד, בלי שום התאמה מקומית. האם הוא צודק או טועה? נמק תוך הסבר האסטרטגיות הבינלאומיות ודרך הכניסה של הרשת.","model":"<b>גיל טועה</b> – איקאה קרובה יותר לאסטרטגיה <b>על-לאומית</b>. האסטרטגיות הבינלאומיות נקבעות לפי שני צירים: <b>הצורך בשילוב גלובלי</b> (חיסכון בעלויות ואחידות) ו<b>הצורך ביכולת תגובה מקומית</b>. גלובלית (אחידה) – שילוב גלובלי גבוה ותגובה מקומית נמוכה; רב-מקומית – שילוב גלובלי נמוך ותגובה מקומית גבוהה; על-לאומית – גבוה בשני הצירים. בכתבה יש שילוב גלובלי גבוה: תכנון ורכש מרוכזים בכמויות עצומות, מותג ועיצוב אחידים ועלויות נמוכות. אבל יש גם תגובה מקומית: מסעדה כשרה, עברית, מוצרים לדירות קטנות – התאמות שנועדו להתגבר על פערי תרבות; הסערה סביב הקטלוג החרדי מראה שגם התאמה מקומית צריכה זהירות. השילוב של שני הצירים מתאים לאסטרטגיה על-לאומית ולא לגלובלית טהורה. דרך הכניסה היא <b>זכיינות</b> (Franchise): עלות וסיכון נמוכים לרשת, והזכיין המקומי מביא היכרות עם השוק; השליטה בזיכיון משתנה ותלויה בחוזה – אצל איקאה החוזה הדוק (כללים, עיצוב ומותג אחידים).","keys":["הכרעה: טועה – על-לאומית","שני הצירים: צורך בשילוב גלובלי × צורך ביכולת תגובה מקומית","גלובלית / רב-מקומית / על-לאומית – ההבדלים","מהכתבה: רכש ועיצוב מרוכזים לצד מסעדה כשרה, עברית ודירות קטנות","דרך כניסה: זכיינות – עלות וסיכון נמוכים, ידע מקומי, שליטה משתנה לפי החוזה"]},{"q":"נועה טוענת שאיקאה ״תקועה באמצע״ (Stuck in the middle), כי היא לא הכי זולה וגם לא הכי יוקרתית. האם נועה צודקת או טועה? נמקי תוך הסבר האסטרטגיות הגנריות ובכלל זה האסטרטגיה המשולבת.","model":"<b>נועה טועה.</b> לפי פורטר, פירמה ״תקועה באמצע״ כשאין לה יתרון ברור – לא בעלות ולא בייחודיות – ולכן היא מפסידה גם למנהיג העלות וגם למבדל. <b>האסטרטגיה המשולבת</b> (Best-cost) שונה: היא מציעה ערך גבוה – איכות ועיצוב – במחיר נמוך ממחיר המבדלים, ומשלבת באופן מכוון עלות נמוכה וייחודיות. בכתבה לאיקאה יש מקור עלות נמוכה ברור: רכש מרוכז בכמויות עצומות, אריזות שטוחות והרכבה עצמית שחוסכות הובלה, אחסון וכוח אדם. יש לה גם ייחודיות ברורה: עיצוב סקנדינבי וחוויית קנייה (חדרים לדוגמה, מסעדה, פינת משחקים). המחיר שלה גבוה מהרשתות הזולות אבל נמוך בהרבה מחנויות המעצבים – בדיוק המיצוב של האסטרטגיה המשולבת. מיצוב ברור כזה מראה שהיא לא תקועה באמצע; החיסרון הבולט של האסטרטגיה המשולבת הוא <b>סכנת תת-מיצוב</b>, ואיקאה מונעת אותו בזכות מותג חזק.","keys":["הכרעה: טועה","תקוע באמצע = אין יתרון ברור בעלות או בייחודיות","אסטרטגיה משולבת: ערך גבוה במחיר נמוך מהמבדלים","מקורות עלות: רכש מרוכז, אריזה שטוחה, הרכבה עצמית","מקורות ייחודיות: עיצוב וחוויה; סיכון: תת-מיצוב"]}]},{"id":"shein","title":"שיין: אופנה בלחיצה ותחת לחץ רגולטורי","text":"שיין (Shein), שנוסדה בסין ב-2008 וממוקמת כיום בסינגפור, הפכה לאחת מקמעונאיות האופנה המקוונות הגדולות בעולם. החברה מעלה לאתר אלפי פריטים חדשים כל יום, מייצרת בכל פעם כמויות קטנות של כמה מאות יחידות, ומגדילה ייצור רק לפריטים שנמכרים טוב. בזכות מערכת נתונים מתקדמת וקשר צמוד לאלפי ספקים קטנים, החברה מגיבה לטרנדים מהר מאוד ובמחירים נמוכים במיוחד. הקהל העיקרי שלה הוא צעירים, שמגלים את המוצרים ברשתות החברתיות. לצד ההצלחה, שיין ספגה ביקורת על השפעתה על הסביבה, על תנאי העבודה אצל ספקים ועל העתקת עיצובים. ב-2025 ביטלה ארה״ב את הפטור ממכס על חבילות קטנות מסין, שעליו נשען חלק גדול מהמודל של שיין. באיחוד האירופי היא כפופה לפיקוח מוגבר כפלטפורמה מקוונת גדולה, ובצרפת קודמה חקיקה נגד ״אופנה מהירה במיוחד״. במקביל, שיין מרחיבה ייצור ושיתופי פעולה עם ספקים מחוץ לסין, למשל בברזיל ובטורקיה, ופותחת מחסנים קרוב יותר ללקוחות. החברה גם השיקה מרקטפלייס שמאפשר למותגים אחרים למכור באתר שלה. בישראל שיין פופולרית מאוד, והוויכוח על הפטור ממע״מ ביבוא אישי חוזר שוב ושוב לסדר היום.","qs":[{"q":"אנליסט טוען שהאיומים העיקריים על שיין הם פנימיים – ולכן אין טעם לנתח את הסביבה החיצונית שלה בעזרת PESTEL. האם הוא צודק או טועה? נמק תוך הסבר מודל PESTEL(G).","model":"<b>האנליסט טועה</b> – רוב האיומים בכתבה הם חיצוניים, ובדיוק אותם בוחן PESTEL(G). PESTEL(G) הוא כלי לניתוח <b>הסביבה החיצונית הרחבה</b> (המאקרו), שהפירמה לא שולטת בה: פוליטית, כלכלית, חברתית, טכנולוגית, סביבתית, חוקית ו<b>גלובלית</b>. <b>פוליטית/חוקית</b>: ארה״ב ביטלה את הפטור ממכס על חבילות קטנות, האיחוד האירופי מפקח על הפלטפורמה, וצרפת מקדמת חקיקה נגד אופנה מהירה. <b>סביבתית</b>: ביקורת על ההשפעה הסביבתית של אופנה ״חד-פעמית״. <b>חברתית</b>: קהל צעיר שקונה דרך הרשתות החברתיות (הזדמנות), לצד ביקורת על תנאי העבודה (איום). <b>טכנולוגית</b>: מערכות נתונים שמאפשרות ייצור לפי ביקוש; <b>כלכלית</b>: רגישות למחיר ומיסוי יבוא אישי, למשל הוויכוח על מע״מ בישראל. <b>גלובלית</b>: מתיחות סחר בין ארה״ב לסין שמשפיעה על שרשרת אספקה בינלאומית. המסקנה: שיין חייבת לנתח את הסביבה החיצונית ולהיות גמישה לשינויי רגולציה ומגמות צרכנים.","keys":["הכרעה: טועה – האיומים חיצוניים","PESTEL(G) = סביבה חיצונית רחבה שהפירמה לא שולטת בה","פירוט הממדים כולל G – גלובליזציה","פוליטית/חוקית: ביטול הפטור ממכס, פיקוח באיחוד, חקיקה בצרפת","סביבתית וחברתית: ביקורת סביבתית ותנאי עבודה; קהל צעיר ברשתות","תובנה: גמישות לשינויים חיצוניים"]},{"q":"דנה טוענת שהעברת חלק מהייצור לברזיל ולטורקיה והקמת מחסנים קרוב ללקוחות הן אסטרטגיית ST לפי מודל TOWS. האם היא צודקת או טועה? נמקי תוך הסבר מודל TOWS.","model":"<b>דנה צודקת.</b> מודל TOWS נשען על SWOT – חוזקות וחולשות בתוך הפירמה, הזדמנויות ואיומים מחוצה לה – ומגבש אסטרטגיות על ידי <b>שילוב של כל גורם פנימי עם כל גורם חיצוני</b>. ארבעת התאים: <b>SO</b> – חוזקה לניצול הזדמנות; <b>WO</b> – התגברות על חולשה כדי לנצל הזדמנות; <b>ST</b> – חוזקה להתמודדות עם איום; <b>WT</b> – צמצום חולשות והתגוננות מאיומים. האיום החיצוני בכתבה: ביטול הפטור ממכס בארה״ב, רגולציה ומתיחות סחר שפוגעים במשלוחים ישירים מסין. החוזקה הפנימית: יכולת לעבוד עם רשת ספקים גדולה וגמישה ומערכת נתונים שמאפשרת לייצר בכמויות קטנות בכל מקום. שיין משתמשת בחוזקה הזאת כדי לפזר את הייצור והאחסון מחוץ לסין ולהקטין את החשיפה לאיום – זה בדיוק תא ST. לעומת זאת, השקת המרקטפלייס היא יותר מהלך SO – שימוש בתנועת הגולשים העצומה (חוזקה) לניצול הזדמנות להכנסות נוספות.","keys":["הכרעה: צודקת","TOWS נשען על SWOT ומשלב כל גורם פנימי עם כל גורם חיצוני","ארבעת התאים SO, WO, ST, WT","איום: ביטול הפטור ממכס ורגולציה; חוזקה: רשת ספקים גמישה ונתונים","שימוש בחוזקה מול איום = ST; המרקטפלייס כדוגמה ל-SO"]}]},{"id":"nvidia","title":"אנבידיה: שבבים, CUDA ותלות בטייוואן","text":"אנבידיה, שהתחילה כיצרנית כרטיסים גרפיים למשחקי מחשב, הפכה לספקית המרכזית של שבבים לבינה מלאכותית. לפי הערכות, החברה מחזיקה ברוב הגדול של שוק המאיצים למרכזי נתונים, ושווי השוק שלה עבר בשנים האחרונות כמה טריליוני דולרים. כבר ב-2006 השיקה אנבידיה את CUDA – פלטפורמת תוכנה שמאפשרת למפתחים לתכנת את השבבים שלה לחישובים כלליים. במשך כמעט עשרים שנה נכתבו על CUDA אינספור ספריות, כלים וקורסים, ומיליוני מפתחים התרגלו לעבוד איתה. מתחרות כמו AMD מציעות שבבים חזקים, וענקיות ענן כמו גוגל ואמזון מפתחות שבבים משלהן, אבל מעבר מ-CUDA דורש לכתוב מחדש קוד רב ולהכשיר מחדש צוותים. ב-2020 רכשה אנבידיה את מלאנוקס הישראלית בכ-7 מיליארד דולר, וכך הוסיפה יכולות תקשורת מהירה בין שרתים; כיום יש לה בישראל אחד ממרכזי הפיתוח הגדולים שלה. אנבידיה עצמה לא מחזיקה מפעלי שבבים: את הייצור המתקדם מבצעת בעיקר TSMC בטייוואן. הביקוש הגבוה יצר בתקופות מסוימות מחסור, והחברה תלויה בקצב שבו TSMC מגדילה את כושר הייצור. בנוסף, מגבלות היצוא של ארה״ב על מכירת שבבים מתקדמים לסין והמתיחות סביב טייוואן מטרידות משקיעים.","qs":[{"q":"אנליסטית טוענת שפלטפורמת CUDA מעניקה לאנבידיה יתרון תחרותי בר-קיימא. האם היא צודקת או טועה? נמקי תוך הסבר מודל VRIN וההבדל בין יכולת ליבה ליכולת ייחודית.","model":"<b>האנליסטית צודקת.</b> לפי מודל VRIN משאב או יכולת מעניקים <b>יתרון תחרותי בר-קיימא</b> ותשואה מעל הממוצע רק אם הם בעלי ערך (V), נדירים (R), יקרים לחיקוי (I) וללא תחליף (N). אם המשאב רק בעל ערך – שוויון תחרותי ותשואה ממוצעת; בעל ערך ונדיר אבל קל לחיקוי – יתרון זמני; ללא ערך – חיסרון תחרותי ותשואה מתחת לממוצע. <b>ערך</b>: CUDA מאפשרת למפתחים לנצל את השבבים לבינה מלאכותית; <b>נדירות</b>: אין לאף מתחרה מערכת אקולוגית בהיקף דומה. <b>יקר לחיקוי</b>: היא נבנתה כמעט עשרים שנה, עם אינספור ספריות ומיליוני מפתחים – הזמן וההיסטוריה לא ניתנים לקנייה מהירה. <b>ללא תחליף</b> (לפחות כרגע): מעבר לפלטפורמה אחרת דורש לכתוב מחדש קוד ולהכשיר צוותים, כלומר עלות מעבר גבוהה ללקוחות. זו גם <b>יכולת ייחודית</b> – אנבידיה עושה אותה טוב יותר מהמתחרים – ולא רק יכולת ליבה, שמשמעותה פעילות שהפירמה עושה טוב יותר מפעילויות אחרות שלה. ארבעת התנאים מתקיימים, ולכן מדובר ביתרון בר-קיימא; עם זאת, השבבים של ענקיות הענן הם ניסיון לייצר תחליף, וכדאי לעקוב אחריו.","keys":["הכרעה: צודקת","ארבעת תנאי VRIN והתוצאה: יתרון בר-קיימא ותשואה מעל הממוצע","טבלת VRIN: שוויון / יתרון זמני / בר-קיימא","יישום: 20 שנה, מיליוני מפתחים, עלות מעבר גבוהה","יכולת ייחודית (מול מתחרים) מול יכולת ליבה (מול פעילויות אחרות)","הסתייגות: שבבי ענקיות הענן כתחליף פוטנציאלי"]},{"q":"משקיע טוען שהעובדה שאנבידיה לא מייצרת בעצמה ומסתמכת על TSMC היא החלטה בלי שום חיסרון. האם הוא צודק או טועה? נמק תוך הסבר היתרונות והחסרונות של מיקור חוץ.","model":"<b>המשקיע טועה.</b> <b>מיקור חוץ</b> (Outsourcing) הוא העברת פעילות מתוך שרשרת הערך לספק חיצוני שמבצע אותה טוב יותר או זול יותר. היתרונות: התמקדות בפעילויות הליבה, חיסכון בהשקעה עצומה במפעלים, גישה לטכנולוגיית ייצור מתקדמת של ספק מתמחה וגמישות. בכתבה אנבידיה מתמקדת בתכנון שבבים ובתוכנה (CUDA, ומלאנוקס לתקשורת) ונשענת על TSMC – אחת מיצרניות השבבים המתקדמות בעולם – בלי להשקיע עשרות מיליארדים במפעלים. אבל החיסרון הבולט של מיקור חוץ הוא <b>תלות בגורם חיצוני</b>, והוא מופיע בכתבה בבירור. אנבידיה תלויה בקצב שבו TSMC מגדילה את כושר הייצור – מה שיצר מחסור – וגם בסיכון הגיאופוליטי סביב טייוואן. כלומר ההחלטה הגיונית, אבל יש לה חיסרון משמעותי, ולכן הטענה ״בלי שום חיסרון״ שגויה.","keys":["הכרעה: טועה","הגדרת מיקור חוץ – העברת פעילות לספק חיצוני","יתרונות: התמקדות בליבה, חיסכון בהשקעה, ספק מתמחה","חיסרון בולט: תלות בגורם חיצוני","מהכתבה: מחסור בגלל כושר הייצור של TSMC וסיכון סביב טייוואן"]}]},{"id":"airbnb","title":"Airbnb: לישון אצל המקומיים","text":"Airbnb נוסדה ב-2008 בסן פרנסיסקו, כששני מייסדיה השכירו מזרנים מתנפחים בדירה שלהם לאורחי כנס. כיום מוצעים בפלטפורמה מיליוני מקומות אירוח ביותר ממאה אלף ערים בעולם, מחדרים בדירות ועד וילות. בשונה ממלון, אין ב-Airbnb קבלת פנים, לובי, שירות חדרים או מסעדה, ולרוב גם לא ניקיון יומי. בתמורה האורח מקבל לעיתים קרובות יותר מקום, מטבח, אווירה ביתית וחוויה ״כמו מקומי״ בשכונה אמיתית. החברה אינה מחזיקה נכסים: בעלי הדירות הם שמשקיעים בנכס, והפלטפורמה גובה עמלה מכל הזמנה. מערכת דירוגים הדדית בין מארחים לאורחים יוצרת אמון בין זרים. Airbnb משכה מטיילים שבעבר לא היו מגיעים כלל או שהיו לנים אצל חברים, וגם משפחות וקבוצות שחדרי מלון לא התאימו להן. ב-2016 השיקה החברה את Experiences – סדנאות, סיורים וחוויות שמארחים מקומיים מציעים למטיילים שכבר משתמשים בפלטפורמה – ובשנים האחרונות הרחיבה את התחום והוסיפה שירותים נוספים. במקביל, ערים כמו ניו יורק וברצלונה הגבילו השכרות לטווח קצר בטענה שהן מייקרות את הדיור לתושבים. בתי המלון מצידם השיקו דירות שירות ומחירים גמישים כדי להחזיר לקוחות.","qs":[{"q":"גלית טוענת שבזמן ההשקה Airbnb יצרה אוקיינוס כחול, ושאפשר להסביר את ההצעה שלה בעזרת מסגרת ERRC. האם גלית צודקת או טועה? נמקי תוך הסבר אסטרטגיית האוקיינוס הכחול ומסגרת ERRC.","model":"<b>גלית צודקת.</b> אוקיינוס כחול הוא פנייה לשוק חדש שהמתחרים הקיימים עוד לא פנו אליו: יוצרים נישה בלי מתחרים, הופכים את המתחרים ללא רלוונטיים, יוצרים ולוכדים ביקוש חדש ושוברים את שקלול התמורות בין ערך לעלות. הכלי לבניית הצעה כזו הוא מסגרת <b>ERRC</b> (ארבע הפעולות): <b>ביטול</b> (Eliminate) – אילו מרכיבים שהענף רגיל אליהם נבטל; <b>צמצום</b> (Reduce) – מה נוריד מתחת לרמה המקובלת; <b>הגבהה</b> (Raise) – מה נעלה מעל הרמה המקובלת; <b>יצירה</b> (Create) – מה נוסיף שהענף מעולם לא הציע. <b>ביטול</b>: קבלת פנים, לובי, שירות חדרים ומסעדה; <b>צמצום</b>: ניקיון יומי וסטנדרטיזציה, ובעיקר השקעה בנכסים – הנכס שייך למארח. <b>הגבהה</b>: מרחב, מטבח ואווירה ביתית; <b>יצירה</b>: חוויה ״כמו מקומי״ בשכונה אמיתית ואמון בין זרים בעזרת דירוג הדדי. התוצאה: ביקוש חדש – מטיילים שלא היו מגיעים או שהיו לנים אצל חברים, ומשפחות וקבוצות – וערך גבוה בעלות נמוכה, כלומר שבירת שקלול ערך–עלות. כיום, כשהמלונות מגיבים בדירות שירות ומחירים גמישים, השוק נעשה אדום יותר – האוקיינוס הכחול לא נשאר כחול לנצח.","keys":["הכרעה: צודקת","הגדרת האוקיינוס הכחול ומאפייניו","ERRC: ביטול, צמצום, הגבהה, יצירה","יישום: ביטול לובי ושירות חדרים; הגבהת מרחב ומטבח; יצירת חוויה מקומית ואמון","ביקוש חדש ושבירת שקלול ערך–עלות","עם הזמן הופך לאוקיינוס אדום"]},{"q":"עומר טוען שהשקת Experiences היא אסטרטגיית הגוונה (Diversification) לפי מטריצת אנסוף. האם הוא צודק או טועה? נמק תוך הסבר מטריצת אנסוף.","model":"<b>עומר טועה</b> – זו בעיקר <b>פיתוח מוצר</b>. מטריצת אנסוף (Ansoff) מסווגת אסטרטגיות צמיחה לפי שני ממדים: <b>מוצר</b> (קיים/חדש) ו<b>שוק</b> (קיים/חדש). <b>חדירה לשוק</b> – מוצר קיים בשוק קיים; <b>פיתוח שוק</b> – מוצר קיים לשוק חדש; <b>פיתוח מוצר</b> – מוצר חדש לשוק קיים; <b>הגוונה</b> – מוצר חדש בשוק חדש, והיא המסוכנת מכולן. Experiences הוא מוצר חדש – סיורים וסדנאות במקום לינה. אבל לפי הכתבה הוא מוצע <b>למטיילים שכבר משתמשים בפלטפורמה</b> – אותו שוק, אותם לקוחות ואותו מותג. מוצר חדש לשוק קיים = פיתוח מוצר; Airbnb משתמשת בקהל ובמערכת הדירוגים הקיימים, ולכן הסיכון נמוך יותר מהגוונה. הגוונה הייתה, למשל, אם Airbnb הייתה נכנסת לענף שלא קשור לתיירות ופונה ללקוחות חדשים לגמרי.","keys":["הכרעה: טועה – פיתוח מוצר","שני הממדים של אנסוף: מוצר × שוק","ארבע האסטרטגיות והסיכון היחסי","מהכתבה: מוצר חדש (חוויות) לשוק הקיים (מטיילים בפלטפורמה)","דוגמה נגדית להגוונה אמיתית"]}]}],"talk":{},"aud":{}};
// ===== diagrams for the strategy course: hand-drawn inline SVG (sharp on every screen, themed by the page's colours) =====
// canvas 480 wide; text ≥14 units so it stays readable on a phone. Classes are styled in shell.html (.fig ...).
const FIG = (() => {
  const W = 480;
  const t = (x, y, s, cls = '') => `<text x="${x}" y="${y}" text-anchor="middle" direction="rtl" class="${cls}">${s}</text>`;
  // a rounded box with centred lines: first line bold unless plain

// ---------- exams: part A multiple choice (4 pts), part B true/false with reasoning (3 pts for the mark + 3 for the reasoning) ----------
const X = {id: null, ex: null, start: 0, ans: {}, tf: {}, why: {}, self: {}, oa: {}, ok: {}, done: false, t: null};
const CASES = CAR.open || [], CASE = Object.fromEntries(CASES.map(c => [c.id, c]));
const MIN = 120;
function vExam(m) {
  if (X.id && !X.done) return drawExam(m);
  if (X.id && X.done) return drawResult(m);
  const best = id => { const r = S.exams.filter(e => e.id === id); return r.length ? Math.max(...r.map(e => e.score)) : null; };
  m.innerHTML = crumbs(['מבחנים', 'exam']) + `<header class="page"><h2>מבחנים</h2><p class="note">במבנה של המבחן האמיתי: חלק א׳ – 10 שאלות אמריקאיות עם 5 תשובות (4 נק׳ לשאלה), חלק ב׳ – 5 היגדים של נכון/לא נכון עם נימוק (6 נק׳: 3 על הסימון ו־3 על הנימוק), חלק ג׳ – כתבה מהעיתונות הכלכלית ושני סעיפים (30 נק׳). עונים במונחים של הקורס.</p></header>
    <section class="panel"><div class="ulist">${CAR.exams.map(x => `<button class="urow" data-start="${x.id}"><span class="un">★</span><span class="ut"><b>${esc(x.title)}</b><span class="note">${esc(x.note || '')}</span></span><span class="up">${best(x.id) != null ? `<span class="done">הכי טוב: ${best(x.id)}</span>` : ''}</span></button>`).join('')}
    ${BANK.length >= 10 && TFB.length >= 10 ? `<button class="urow" data-start="mock"><span class="un">✦</span><span class="ut"><b>מבחן אימון חדש</b><span class="note">10 אמריקאיות + 5 נכון/לא נכון + כתבה, בכל פעם אחרים</span></span><span class="up">${best('mock') != null ? `<span class="done">הכי טוב: ${best('mock')}</span>` : ''}</span></button>` : ''}</div></section>
    ${CASES.length ? `<section class="panel"><h4>חלק ג׳: תרגול שאלות על כתבה</h4><p class="note">${CASES.length} כתבות. כותבים תשובה, ואז רואים תשובת מופת ורשימה של מה שחייב להופיע בה.</p><button class="btn primary" data-go="open">לתרגול חלק ג׳</button></section>` : ''}
    <section class="panel"><h4>איך כותבים נימוק שמקבל 3 נקודות</h4><ul class="ll"><li>משפט אחד או שניים, לא יותר.</li><li>אם ההיגד <b>לא נכון</b>: אומרים מה כן נכון (למשל "זו מנהיגות בעלות, לא בידול").</li><li>משתמשים במונח של הקורס ובהגדרה שלו.</li></ul></section>`;
  m.querySelectorAll('[data-start]').forEach(b => b.onclick = () => startExam(b.dataset.start));
}
function spread(list, n) { // n random items, spread over the units so every unit shows up
  const per = {}, sh = list.slice().sort(() => Math.random() - .5), out = [];
  for (const q of sh) { if (out.length >= n) break; if ((per[q.unit] || 0) < Math.ceil(n / UNITS.length)) { out.push(q); per[q.unit] = (per[q.unit] || 0) + 1; } }
  for (const q of sh) { if (out.length >= n) break; if (!out.includes(q)) out.push(q); }
  return out;
}
function startExam(id) {
  const sx = CAR.exams.find(e => e.id === id), used = new Set(S.exams.map(e => e.open)), fresh = CASES.filter(c => !used.has(c.id));
  const ex = sx ? Object.assign({}, sx, {open: CASE[sx.open] || null}) : {id: 'mock', title: 'מבחן אימון', mc: spread(BANK.filter(q => onList(q.unit)), 10), tf: spread(TFB.filter(q => onList(q.unit)), 5), open: (fresh.length ? fresh : CASES)[Math.floor(Math.random() * (fresh.length || CASES.length))] || null};
  Object.assign(X, {id, ex, start: Date.now(), ans: {}, tf: {}, why: {}, self: {}, oa: {}, ok: {}, done: false}); clearInterval(X.t);
  keepX(); X.t = setInterval(tickX, 1000); render(); window.scrollTo(0, 0);
}
const tickX = () => { const el = $('#xclock'); if (el) el.textContent = clock(); if (left() <= 0 && !X.done) finish(); };
const XK = () => ACC.key(CCOURSE) + ':exam', QID = Object.fromEntries((typeof ALL !== 'undefined' ? ALL : MCQ).map(q => [q.id, q]));
function keepX() { try { if (X.id && !X.done) localStorage.setItem(XK(), JSON.stringify({id: X.id, title: X.ex.title, mc: X.ex.mc.map(q => q.id), tf: (X.ex.tf || []).map(q => q.id), open: X.ex.open ? X.ex.open.id : null, start: X.start, ans: X.ans, tfa: X.tf, why: X.why, oa: X.oa})); else localStorage.removeItem(XK()); } catch (e) {} }
function restoreX() { // an exam that was open when the page was refreshed or closed
  let k = null; try { k = JSON.parse(localStorage.getItem(XK())); } catch (e) {}
  if (!k || !k.id || !Array.isArray(k.mc)) return false;
  const mc = k.mc.map(i => QID[i]), tf = (k.tf || []).map(i => QID[i]); if (mc.some(q => !q) || tf.some(q => !q)) { try { localStorage.removeItem(XK()); } catch (e) {} return false; }
  Object.assign(X, {id: k.id, ex: {id: k.id, title: k.title, mc, tf, open: CASE[k.open] || null}, start: +k.start || Date.now(), ans: k.ans || {}, oa: k.oa || {}, ok: {}, done: false}); if ('tf' in X) Object.assign(X, {tf: k.tfa || {}, why: k.why || {}, self: {}});
  clearInterval(X.t); X.t = setInterval(tickX, 1000); if (left() <= 0) finish(); return true;
}
window.addEventListener('beforeunload', e => { if (X.id && !X.done) { keepX(); e.preventDefault(); e.returnValue = ''; } });
const left = () => Math.max(0, MIN * 60 - Math.floor((Date.now() - X.start) / 1000));
function clock() { const l = left(); return `${Math.floor(l / 3600)}:${String(Math.floor(l % 3600 / 60)).padStart(2, '0')}:${String(l % 60).padStart(2, '0')}`; }
const answered = () => Object.keys(X.ans).length + Object.keys(X.tf).length;

    <h3 class="lh">חלק א׳ · שאלות אמריקאיות (4 נק׳ לשאלה)</h3>
    ${ex.mc.map((q, k) => `<div class="qcard" id="xq${k}"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.q)}</div><div class="opts">${q.o.map((o, i) => `<button class="opt ${X.ans[k] === i ? 'sel' : ''}" data-xm="${k}:${i}"><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`).join('')}</div></div>`).join('')}
    <h3 class="lh">חלק ב׳ · נכון / לא נכון עם נימוק (6 נק׳ לשאלה)</h3>
    ${ex.tf.map((q, k) => `<div class="qcard" id="xt${k}"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.s)}</div><div class="opts tfopts">${tfButtons('x' + k, X.tf[k], false)}</div>
      <label class="field tfwhy">נימוק (עד שתי שורות)<textarea data-xw="${k}" rows="2" maxlength="300">${esc(X.why[k] || '')}</textarea></label></div>`).join('')}
    ${ex.open ? `<h3 class="lh">חלק ג׳ · שאלה על כתבה (30 נק׳)</h3>${caseText(ex.open)}${ex.open.qs.map((q, j) => `<div class="qcard"><div class="qtext"><span class="qn num">${j + 1}.</span> ${rich(q.q)}</div><label class="field tfwhy">התשובה שלך (במונחי הקורס)<textarea data-xo="${j}" rows="6" maxlength="2000">${esc(X.oa[j] || '')}</textarea></label></div>`).join('')}` : ''}
    <div class="row"><button class="btn primary big" id="xend2">הגשת המבחן</button></div>`;
  m.querySelectorAll('[data-xo]').forEach(t => t.oninput = () => { X.oa[t.dataset.xo] = t.value; clearTimeout(t.kt); t.kt = setTimeout(keepX, 400); });

  m.querySelectorAll('[data-xm]').forEach(b => b.onclick = () => { const [k, i] = b.dataset.xm.split(':').map(Number); X.ans[k] = i; keepX(); m.querySelectorAll(`[data-xm^="${k}:"]`).forEach(x => x.classList.toggle('sel', x === b)); count(); });
  m.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { const [k, v] = b.dataset.tf.split(':'); const n = +k.slice(1); X.tf[n] = v === 'true'; keepX(); m.querySelectorAll(`[data-tf^="${k}:"]`).forEach(x => x.classList.toggle('sel', x === b)); count(); });

  const end = () => { const miss = total - answered(); if (!confirm(miss ? `נשארו ${miss} שאלות בלי תשובה. להגיש בכל זאת?` : 'להגיש את המבחן?')) return; finish(); };
  $('#xend').onclick = end; $('#xend2').onclick = end;

// ---------- Part C: an article and two reasoned sub-questions ----------
const caseText = c => `<section class="panel article"><h4>${esc(c.title)}</h4><p>${rich(c.text)}</p></section>`;
function caseAnswer(q, j, mine, ok, pre = '') {
  return `<div class="qcard"><div class="qtext"><span class="qn num">${j + 1}.</span> ${rich(q.q)}</div>
    ${mine.trim() ? `<div class="mine"><b>התשובה שלך</b><p>${esc(mine)}</p></div>` : '<p class="note">לא נכתבה תשובה.</p>'}
    <section class="sb s-right"><h5>תשובת מופת</h5><p>${rich(q.model)}</p></section>
    <div class="keys"><b>מה חייב להופיע בתשובה? סמנו מה כתבתם${pre ? '' : ' (15 נק׳ לסעיף, לפי החלק שסימנתם)'}</b>${q.keys.map((k, i) => `<label class="selfchk"><input type="checkbox" data-ok="${pre}${j}:${i}" ${ok[j + ':' + i] ? 'checked' : ''}> ${rich(k)}</label>`).join('')}</div></div>`;
}
function vOpen(m) {
  const c = arg && CASE[arg];
  if (!c) {
    m.innerHTML = crumbs(['מבחנים', 'exam'], ['חלק ג׳']) + `<header class="page"><h2>חלק ג׳: שאלות על כתבה</h2><p class="note">במבחן: כתבה מהעיתונות הכלכלית ושני סעיפים, 30 נקודות. בכל סעיף אומרים אם הטענה נכונה, מסבירים את המודל במונחי הקורס, ומחברים לעובדות מהכתבה.</p></header>
      <section class="panel"><div class="ulist">${CASES.map((x, i) => { const st = S.open[x.id]; return `<button class="urow" data-go="open" data-arg="${x.id}"><span class="un num">${i + 1}</span><span class="ut"><b>${esc(x.title)}</b><span class="note">${x.qs.map(q => esc(q.q.slice(0, 60))).join(' · ')}…</span></span><span class="up">${st && st.done ? '<span class="done">✓ נפתר</span>' : ''}</span></button>`; }).join('')}</div></section>`;

// points: 4 per right answer in part A, 3 per right mark in part B, and 3 more for each reasoning the student checks against the model one
function points() {
  const ex = X.ex, a = ex.mc.filter((q, k) => X.ans[k] === q.a).length, b = ex.tf.filter((q, k) => X.tf[k] === q.a).length, w = ex.tf.filter((q, k) => X.tf[k] === q.a && X.self[k]).length;
  const qs = ex.open ? ex.open.qs : [], c = qs.reduce((t, q, j) => t + 15 * q.keys.filter((_, i) => X.ok[j + ':' + i]).length / q.keys.length, 0);
  return {a, b, w, c: Math.round(c), score: Math.round((a * 4 + b * 3 + w * 3 + c) * 100 / (ex.mc.length * 4 + ex.tf.length * 6 + qs.length * 15))};
}
// time ran out while the student was elsewhere on the site: the exam is handed in, and they are told so

  ex.tf.forEach((q, k) => { if (X.tf[k] != null) S.mcq[q.id] = {ok: X.tf[k] === q.a, n: ((S.mcq[q.id] || {}).n || 0) + 1}; });
  S.exams.push({id: X.id, open: ex.open ? ex.open.id : null, ts: Date.now(), score: p.score, right: p.a + p.b, sec: Math.round((Date.now() - X.start) / 1000)}); X.rec = S.exams.length - 1; save(); keepX(); doneMsg();
}

    <p class="note">בחלק ב׳ הנימוק שווה חצי מהנקודות. השוו את הנימוק שלכם לנימוק לדוגמה, וסמנו ✓ אם אמרתם את אותו דבר: הציון יתעדכן.</p>
    ${weak.length ? `<p class="note">כדאי לחזור על: ${weak.map(u => `<a href="#unit/${u.id}" data-go="unit" data-arg="${u.id}">${esc(u.title)}</a>`).join(' · ')}</p>` : ''}</header>
    <h3 class="lh">חלק א׳</h3>

    <h3 class="lh">חלק ב׳</h3>
