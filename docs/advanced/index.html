":["אסטרטגיה רב-מקומית","אסטרטגיה גלובלית","אסטרטגיה על-לאומית","אסטרטגיה בינלאומית"],"a":1,"w":["אין כאן התאמה לכל מדינה; המוצר אחיד.","","אין לחץ לתגובה מקומית; רק לחץ על עלויות.","בבינלאומית אין לחץ חזק על עלויות; כאן התחרות היא על מחיר."],"why":"לחץ גבוה על עלויות + מוצר אחיד בלי התאמות = גלובלית."},{"id":"m7-3","q":"חברת המזון FoodLand משנה בכל מדינה את המתכונים, האריזות ואפילו את שם המותג. כל חברת בת מקבלת החלטות לבד, והחיסכון בעלויות אינו בראש סדרי העדיפויות. איזו אסטרטגיה זו?","o":["אסטרטגיה רב-מקומית","אסטרטגיה גלובלית","אסטרטגיה בינלאומית","אסטרטגיה על-לאומית"],"a":0,"w":["","בגלובלית המוצר אחיד; כאן הוא מותאם לכל מדינה.","בבינלאומית כמעט אין התאמה מקומית.","בעל-לאומית יש גם לחץ גבוה לחיסכון בעלויות; כאן הוא נמוך."],"why":"צורך גבוה בתגובה מקומית + צורך נמוך בחיסכון = רב-מקומית, התאמה מלאה לכל מדינה."},{"id":"m7-4","q":"רשת המזון QuickBite מפעילה מערכת רכש, מטבחים ותוכנה אחידים בכל העולם כדי להוזיל עלויות, ובכל מדינה מוסיפה לתפריט מנות מקומיות. איזו אסטרטגיה זו?","o":["אסטרטגיה גלובלית","אסטרטגיה רב-מקומית","אסטרטגיה בינלאומית","אסטרטגיה על-לאומית"],"a":3,"w":["בגלובלית אין התאמה מקומית; כאן יש מנות מקומיות.","ברב-מקומית אין לחץ חזק על עלויות ואין מערכת אחידה.","בבינלאומית הלחץ נמוך בשני הצירים.",""],"why":"גם חיסכון בעלויות (מערכות אחידות) וגם תגובה מקומית (מנות מקומיות) = על-לאומית."},{"id":"m7-5","q":"חברת התוכנה UniqueSoft מפתחת מוצר ייחודי שכמעט אין לו מתחרים. היא מוכרת אותו בכל העולם בדיוק כפי שפותח בבית, ואין עליה לחץ להוריד מחירים או להתאים את המוצר. איזו אסטרטגיה זו?","o":["אסטרטגיה גלובלית","אסטרטגיה רב-מקומית","אסטרטגיה בינלאומית","אסטרטגיה על-לאומית"],"a":2,"w":["בגלובלית יש לחץ גבוה על עלויות; כאן אין.","ברב-מקומית מתאימים לכל מדינה; כאן לא.","","בעל-לאומית הלחץ גבוה בשני הצירים."],"why":"צורך נמוך בחיסכון וצורך נמוך בתגובה מקומית = בינלאומית."},{"id":"m7-6","q":"איזו אסטרטגיה מתאימה למצב של צורך גבוה גם בחיסכון בעלויות וגם בתגובה מקומית?","o":["על-לאומית (Transnational)","גלובלית (Global)","רב-מקומית (Multi-domestic)","בינלאומית (International)"],"a":0,"w":["","גלובלית מתאימה לצורך נמוך בתגובה מקומית.","רב-מקומית מתאימה לצורך נמוך בחיסכון.","בינלאומית מתאימה לצורך נמוך בשניהם."],"why":"על-לאומית מנסה להשיג גם יעילות גלובלית וגם התאמה מקומית."},{"id":"m7-7","q":"לפי הסיכום, על אילו שני לחצים מבוססת הבחירה בין האסטרטגיות הבינלאומיות ברמת התאגיד?","o":["עלות מול שליטה","הצורך בחיסכון בעלויות מול הצורך בתגובה מקומית","מוצרים קיימים/חדשים מול שווקים קיימים/חדשים","חידוש טכנולוגי מול חדשנות במודל העסקי"],"a":1,"w":["עלות ושליטה הם ממדים לבחירת אופן חדירה לשוק.","","אלה צירי מטריצת אנסוף.","אלה צירי מפת סוגי החדשנות."],"why":"ארבע האסטרטגיות נבנות מהצלבת הלחץ לחיסכון בעלויות עם הלחץ לתגובה מקומית. (בתרשים המרצה הציר המקביל נקרא ״הצורך בשילוב גלובלי״.)"},{"id":"m7-8","q":"איזה מהבאים הוא <b>יתרון</b> של גלובליזציה לפי הקורס?","o":["הארכת חיי המוצר","הבדלים בשפה ובתרבות","רגולציה שונה בכל מדינה","סביבה פוליטית לא יציבה"],"a":0,"w":["","זה אתגר של גלובליזציה.","זה אתגר של גלובליזציה.","זה אתגר של גלובליזציה."],"why":"גלובליזציה מאפשרת למכור מוצר בשווקים חדשים אחרי שבשוק המקורי הוא כבר בדעיכה."},{"id":"m7-9","q":"איזה מהבאים הוא <b>אתגר</b> של גלובליזציה לפי הקורס?","o":["הבדלים במיסוי וברגולציה בין מדינות","גישה לכוח עבודה זול","הבטחת משאבים","הארכת חיי המוצר"],"a":0,"w":["","זה יתרון של גלובליזציה.","זה יתרון של גלובליזציה.","זה יתרון של גלובליזציה."],"why":"רגולציה, מיסוי, שפה, תרבות, התנהגות צרכנים וסביבה פוליטית הם האתגרים."},{"id":"m7-10","q":"איזה אופן חדירה לשוק בינלאומי מאופיין בעלות גבוהה, שליטה גבוהה וסיכון בינוני עד גבוה?","o":["ייצוא","רכישה / הקמת חברת בת חדשה (Greenfield)","זיכיון / רישיון","ברית אסטרטגית"],"a":1,"w":["ייצוא הוא עלות בינונית, שליטה נמוכה וסיכון נמוך.","","זיכיון הוא עלות נמוכה וסיכון נמוך.","ברית היא עלות ושליטה בינוניות וסיכון נמוך."],"why":"בעלות מלאה בשוק הזר = השקעה גבוהה, שליטה גבוהה וסיכון בינוני עד גבוה."},{"id":"m7-11","q":"איזה אופן חדירה מאופיין בעלות נמוכה, סיכון נמוך ושליטה משתנה?","o":["רכישה / Greenfield","ייצוא","זיכיון / רישיון","ברית אסטרטגית"],"a":2,"w":["שם העלות והשליטה גבוהות.","בייצוא העלות בינונית והשליטה נמוכה.","","בברית העלות והשליטה בינוניות."],"why":"בזיכיון/רישיון השותף המקומי משקיע, ולכן העלות והסיכון נמוכים. השליטה תלויה בחוזה."},{"id":"m7-12","q":"יצרנית היין VinoSol מייצרת את כל היין שלה בישראל ושולחת ארגזים למפיץ ביפן, שמוכר אותו לחנויות. איזה אופן חדירה זה, ומה מידת השליטה בו?","o":["ייצוא – שליטה נמוכה","זיכיון – שליטה גבוהה","Greenfield – שליטה גבוהה","ברית אסטרטגית – שליטה בינונית"],"a":0,"w":["","אין כאן מתן זכות להשתמש במותג או בשיטה; וגם השליטה בזיכיון משתנה.","VinoSol לא הקימה חברת בת ביפן.","המפיץ רק קונה ומוכר; אין שיתוף פעולה אסטרטגי."],"why":"מייצרים בבית ושולחים למפיץ זר = ייצוא: עלות בינונית, שליטה נמוכה, סיכון נמוך."},{"id":"m7-13","q":"רשת ההמבורגרים GrillTown מאפשרת ליזם בברזיל לפתוח סניפים תחת המותג והשיטה שלה, תמורת דמי זיכיון ואחוז מהמכירות. היזם משקיע את הכסף. איזה אופן חדירה זה?","o":["ייצוא","רכישה","Greenfield","זיכיון"],"a":3,"w":["GrillTown לא מייצרת ושולחת מוצרים; היא נותנת זכות להשתמש במותג.","GrillTown לא קנתה חברה בברזיל.","GrillTown לא הקימה חברת בת משלה; היזם המקומי הוא הבעלים.",""],"why":"מתן זכות להשתמש במותג ובשיטה תמורת תשלום = זיכיון (Franchising): עלות נמוכה וסיכון נמוך."},{"id":"m7-14","q":"יצרנית הבגדים FabriCo בונה בווייטנאם מפעל חדש לגמרי, בבעלותה המלאה, ומגייסת עובדים מקומיים. איזה אופן חדירה זה?","o":["רישיון","הקמת חברת בת חדשה (Greenfield)","ייצוא","ברית אסטרטגית"],"a":1,"w":["ברישיון חברה מקומית מייצרת תחת הזכויות של FabriCo; כאן FabriCo עצמה הבעלים.","","בייצוא מייצרים בבית ושולחים; כאן מייצרים במדינה הזרה.","אין שותף מקומי; הבעלות מלאה."],"why":"בנייה מאפס של חברת בת בבעלות מלאה = Greenfield: עלות גבוהה, שליטה גבוהה, סיכון בינוני עד גבוה."},{"id":"m7-15","q":"איזה אופן חדירה נותן לחברה את השליטה הגבוהה ביותר בפעילות בשוק הזר?","o":["ייצוא","זיכיון / רישיון","רכישה / הקמת חברת בת חדשה (Greenfield)","ברית אסטרטגית"],"a":2,"w":["בייצוא השליטה נמוכה, כי המפיץ הזר מוכר.","בזיכיון השליטה משתנה, והפעילות בידי השותף.","","בברית השליטה בינונית ומשותפת."],"why":"בבעלות מלאה החברה מחליטה על הכול, ולכן השליטה הגבוהה ביותר."},{"id":"m7-16","q":"לחברה צעירה יש תקציב קטן. היא רוצה להיכנס לשוק זר מהר, בסיכון ובעלות נמוכים, ומוכנה שהשותף המקומי ינהל את הפעילות. איזה אופן חדירה מתאים לה ביותר?","o":["רכישה / Greenfield","זיכיון / רישיון","ייצוא","ברית אסטרטגית"],"a":1,"w":["זה האופן היקר ביותר, עם סיכון בינוני עד גבוה.","","העלות בייצוא בינונית, והחברה עדיין צריכה לייצר ולשלוח בעצמה.","בברית העלות בינונית, לא נמוכה."],"why":"זיכיון/רישיון = עלות נמוכה וסיכון נמוך; המחיר הוא שליטה שתלויה בחוזה."},{"id":"m7-17","q":"חברת התרופות MedOne נכנסת להודו יחד עם חברה הודית: ההודים מביאים הפצה וקשרים עם הרגולטור, MedOne מביאה את התרופות. כל אחת משקיעה חלק, והשליטה משותפת. מה אופן החדירה ומה המאפיינים שלו לפי הקורס?","o":["ייצוא – עלות נמוכה, שליטה גבוהה, סיכון גבוה","רכישה – עלות גבוהה, שליטה גבוהה, סיכון בינוני עד גבוה","זיכיון – עלות גבוהה, שליטה נמוכה, סיכון גבוה","ברית אסטרטגית – עלות בינונית, שליטה בינונית, סיכון נמוך"],"a":3,"w":["זה לא ייצוא, וגם המאפיינים שגויים: לייצוא שליטה נמוכה וסיכון נמוך.","MedOne לא קנתה את החברה ההודית.","זה לא זיכיון, וגם לזיכיון עלות וסיכון נמוכים.",""],"why":"שותף מקומי שחולק השקעה ושליטה = ברית אסטרטגית: עלות בינונית, שליטה בינונית, סיכון נמוך."},{"id":"m7-18","q":"לפי הטבלה בקורס, מהי העלות של ייצוא כאופן חדירה?","o":["נמוכה – הזולה מכל האפשרויות","גבוהה – כמו רכישה","משתנה – תלויה בחוזה","בינונית"],"a":3,"w":["הזול ביותר הוא זיכיון/רישיון, לא ייצוא.","עלות גבוהה שייכת לרכישה/Greenfield.","״משתנה״ מתאר את השליטה בזיכיון/רישיון.",""],"why":"לפי הסיכום: ייצוא = עלות בינונית, שליטה נמוכה, סיכון נמוך."},{"id":"m7-19","q":"חברת המכשור MedTech מוכרת מכשיר אחיד בכל העולם, אבל המתחרים מאסיה מורידים מחירים, ובמקביל כל מדינה דורשת אישורי רגולציה, שפת תפעול ושירות מקומי שונים. החברה מחליטה לרכז את ייצור הרכיבים במפעל אחד ולהוסיף בכל מדינה התאמות תוכנה ושירות. לאיזו אסטרטגיה היא עוברת?","o":["גלובלית","רב-מקומית","בינלאומית","על-לאומית"],"a":3,"w":["גלובלית מתעלמת מהתאמות מקומיות; כאן החברה מוסיפה התאמות לכל מדינה.","ברב-מקומית אין ריכוז ייצור לחיסכון; כאן יש לחץ מחיר חזק.","בבינלאומית הלחץ נמוך בשני הצירים; כאן הוא גבוה בשניהם.",""],"why":"לחץ מחיר (ריכוז ייצור) + לחץ להתאמה (רגולציה, שפה, שירות) = על-לאומית."},{"id":"m7-20","q":"רשת הקמעונאות HomeStyle פועלת בעשר מדינות. בכל מדינה יש הנהלה מקומית עצמאית שבוחרת את המוצרים, המחירים והפרסום לפי טעם המקומיים. איזו אסטרטגיה זו?","o":["גלובלית","בינלאומית","רב-מקומית","על-לאומית"],"a":2,"w":["בגלובלית ההחלטות מרוכזות והמוצר אחיד.","בבינלאומית מוכרים את מוצר הבית כמעט בלי התאמות.","","הסיפור לא מזכיר לחץ לחיסכון בעלויות או מערכות משותפות."],"why":"הנהלה מקומית עצמאית והתאמה מלאה לטעם המקומי = רב-מקומית."},{"id":"m7-21","q":"מה המשמעות של המונח Greenfield באופני חדירה לשווקים בינלאומיים?","o":["מתן זכות לחברה מקומית להשתמש במותג","משלוח מוצרים מהבית למפיץ זר","הקמת חברת בת חדשה מאפס בשוק הזר, בבעלות מלאה","כניסה לשוק זר עם מוצרים ידידותיים לסביבה"],"a":2,"w":["זה זיכיון/רישיון.","זה ייצוא.","","המונח לא קשור לאיכות הסביבה; ״שדה ירוק״ = בנייה מאפס."],"why":"Greenfield (״שדה ירוק״) = בונים חברת בת חדשה מאפס, עם שליטה גבוהה, עלות גבוהה וסיכון בינוני עד גבוה."},{"id":"m7-22","q":"איזה אופן חדירה לשוק זר הוא הזול ביותר לפי הקורס?","o":["זיכיון / רישיון","ייצוא","ברית אסטרטגית","רכישה / Greenfield"],"a":0,"w":["","לייצוא עלות בינונית.","לברית עלות בינונית.","זה האופן היקר ביותר."],"why":"בזיכיון/רישיון השותף המקומי נושא בהשקעה, ולכן העלות נמוכה."},{"id":"m7-23","q":"חברת המשקאות JoyFizz נכנסת ליפן ומשנה את עיצוב האריזה, את שיטות השיווק ואת הסלוגנים כדי להתאים ללקוחות המקומיים. מה נכון?","o":["החברה שואפת להתגבר על פערי תרבות","החברה מוותרת על הצורך ביכולת תגובה מקומית","מסתמנת אסטרטגיה גלובלית (אחידה)","תשובות א, ג נכונות","אף תשובה אינה נכונה"],"a":0,"w":["","להפך – ההתאמות מעידות על צורך גבוה בתגובה מקומית.","אחידה = בלי התאמות; כאן יש התאמות רבות.","ג אינה נכונה, ולכן הצירוף שגוי.","א נכונה."],"why":"התאמת אריזה, שיווק וסלוגנים ללקוחות המקומיים = מאמץ להתגבר על פערי תרבות."},{"id":"m7-24","q":"מהם שני הצירים בתרשים האסטרטגיות הבינלאומיות של המרצה?","o":["סוג יתרון תחרותי × קהל יעד","הצורך בשילוב גלובלי × הצורך ביכולת תגובה מקומית","עלות × שליטה","מוצר × שוק","רמת טכנולוגיה × זמן"],"a":1,"w":["אלה צירי האסטרטגיות הגנריות.","","אלה ממדי הבחירה באופן חדירה.","זו מטריצת אנסוף.","זה הגרף של חדשנות משבשת."],"why":"בתרשים המרצה: צורך בשילוב גלובלי (אנכי) × צורך ביכולת תגובה מקומית (אופקי)."},{"id":"m7-25","q":"לפי תרשים המרצה, חברה עם <b>צורך גבוה בשילוב גלובלי</b> ו<b>צורך נמוך ביכולת תגובה מקומית</b> תבחר באסטרטגיה:","o":["רב-מקומית","על-לאומית","בינלאומית","גלובלית (אחידה)","ייצוא"],"a":3,"w":["רב-מקומית = שילוב נמוך, תגובה גבוהה.","על-לאומית = גבוה בשניהם.","בינלאומית = נמוך בשניהם, ואינה בתרשים המרצה.","","ייצוא הוא אופן חדירה, לא אסטרטגיה ברמת התאגיד."],"why":"שילוב גבוה + תגובה מקומית נמוכה = מוצר אחיד לכל העולם = גלובלית (אחידה)."},{"id":"m7-26","q":"איזו אסטרטגיה מופיעה בתרשים ארבע המשבצות של הסיכום, אבל <b>לא</b> בתרשים של המרצה?","o":["גלובלית","רב-מקומית","על-לאומית","בינלאומית (International)","אף תשובה אינה נכונה"],"a":3,"w":["היא מופיעה בשני התרשימים.","היא מופיעה בשני התרשימים.","היא מופיעה בשני התרשימים.","","יש תשובה נכונה: בינלאומית."],"why":"תרשים המרצה כולל שלוש אסטרטגיות; המשבצת נמוך-נמוך (בינלאומית) קיימת רק בסיכום."},{"id":"m7-27","q":"בתרשים המרצה מופיעה המשבצת “צורך גבוה בשילוב גלובלי וגם צורך גבוה ביכולת תגובה מקומית”. איך מתוארת אותה משבצת בתרשים הסיכום?","o":["לחץ נמוך לחיסכון ולחץ גבוה לתגובה מקומית – רב-מקומית","לחץ גבוה לחיסכון ולחץ נמוך לתגובה מקומית – גלובלית","לחץ נמוך בשני הצירים – בינלאומית","עלות נמוכה, שליטה גבוהה – Greenfield","לחץ גבוה לחיסכון בעלויות וגם לחץ גבוה לתגובה מקומית – על-לאומית"],"a":4,"w":["זו משבצת אחרת: שילוב נמוך.","זו משבצת אחרת: תגובה מקומית נמוכה.","זו המשבצת שאין בתרשים המרצה.","אלה ממדי אופני חדירה, לא אסטרטגיה ברמת התאגיד.",""],"why":"שילוב גלובלי ≈ חיסכון בעלויות. גבוה-גבוה = על-לאומית בשני התרשימים."},{"id":"m7-28","q":"בתרשים של המרצה, Nestlé, Sony ו-Caterpillar מוצגות כדוגמאות לאסטרטגיה:","o":["גלובלית (אחידה)","על-לאומית","רב-מקומית","בינלאומית","Greenfield"],"a":2,"w":["הדוגמאות לגלובלית בשקף: Tide, Gillette, Microsoft, Intel.","הדוגמאות לעל-לאומית בשקף: McDonald׳s, Toyota, Ford.","","בינלאומית אינה מופיעה בתרשים המרצה.","Greenfield הוא אופן חדירה."],"why":"שילוב גלובלי נמוך + צורך גבוה בתגובה מקומית = רב-מקומית."}],"tf":[{"id":"m7-t1","s":"גלובליזציה מאפשרת לחברות גישה לכוח עבודה זול.","a":true,"why":"נכון. זה אחד היתרונות שהסיכום מציין, לצד הארכת חיי המוצר והבטחת משאבים."},{"id":"m7-t2","s":"אסטרטגיה גלובלית מתאימה כשיש צורך גבוה בתגובה מקומית.","a":false,"why":"לא נכון. גלובלית = צורך גבוה בחיסכון ונמוך בתגובה מקומית (מוצר אחיד)."},{"id":"m7-t3","s":"אסטרטגיה רב-מקומית מתאימה לצורך נמוך בחיסכון בעלויות וצורך גבוה בתגובה מקומית.","a":true,"why":"נכון. התאמה מלאה לכל מדינה."},{"id":"m7-t4","s":"אסטרטגיה על-לאומית מתאימה לצורך גבוה גם בחיסכון בעלויות וגם בתגובה מקומית.","a":true,"why":"נכון. היא מנסה להשיג גם יעילות וגם התאמה."},{"id":"m7-t5","s":"אסטרטגיה בינלאומית מתאימה לצורך גבוה בשני הצירים.","a":false,"why":"לא נכון. בינלאומית = צורך נמוך בשניהם. גבוה בשניהם = על-לאומית."},{"id":"m7-t6","s":"ייצוא נותן לחברה שליטה גבוהה בשיווק ובמכירה בשוק הזר.","a":false,"why":"לא נכון. בייצוא השליטה נמוכה, כי המפיץ הזר הוא שמוכר."},{"id":"m7-t7","s":"זיכיון ורישיון הם אופני חדירה בעלות נמוכה ובסיכון נמוך.","a":true,"why":"נכון. השותף המקומי משקיע. השליטה משתנה, לפי החוזה."},{"id":"m7-t8","s":"רכישה או הקמת חברת בת חדשה הם אופן החדירה בעל הסיכון הנמוך ביותר.","a":false,"why":"לא נכון. הסיכון שלהם בינוני עד גבוה, בגלל ההשקעה הגבוהה."},{"id":"m7-t9","s":"Greenfield הוא הקמה מאפס של חברת בת חדשה בשוק הזר.","a":true,"why":"נכון. בונים מפעל או חברה חדשה בבעלות מלאה."},{"id":"m7-t10","s":"ברית אסטרטגית ככניסה לשוק זר מאופיינת בעלות בינונית, שליטה בינונית וסיכון נמוך.","a":true,"why":"נכון. כך היא מופיעה בסיכום."},{"id":"m7-t11","s":"הבדלים בתרבות, בשפה, ברגולציה ובמיסוי הם חלק מהאתגרים של גלובליזציה.","a":true,"why":"נכון. לצד התנהגות צרכנים וסביבה פוליטית."},{"id":"m7-t12","s":"באסטרטגיה גלובלית כל מדינה מקבלת מוצר שמותאם לה באופן מלא.","a":false,"why":"לא נכון. התאמה מלאה לכל מדינה היא רב-מקומית. בגלובלית המוצר אחיד."},{"id":"m7-t13","s":"ככלל, אופן חדירה שנותן יותר שליטה דורש גם השקעה גבוהה יותר.","a":true,"why":"נכון. רכישה/Greenfield נותנים שליטה גבוהה בעלות גבוהה; זיכיון זול אבל השליטה משתנה."},{"id":"m7-t14","s":"הבטחת משאבים היא אחד האתגרים של גלובליזציה.","a":false,"why":"לא נכון. הבטחת משאבים היא יתרון של גלובליזציה."},{"id":"m7-t15","s":"אופני החדירה לשווקים בינלאומיים נבחרים לפי רמות העלות, השליטה והסיכון.","a":true,"why":"נכון. אלה שלושת הממדים בטבלה של הקורס."},{"id":"m7-t16","s":"לפי הקורס, ייצוא הוא אופן החדירה הזול ביותר.","a":false,"why":"לא נכון. לייצוא עלות בינונית. הזול ביותר הוא זיכיון/רישיון."},{"id":"m7-t17","s":"אסטרטגיה בינלאומית מתאימה לחברה עם מוצר ייחודי שאין עליה לחץ להוזיל או להתאים אותו.","a":true,"why":"נכון. זו המשבצת נמוך-נמוך: מוכרים את מוצר הבית כמעט בלי שינויים."},{"id":"m7-t18","s":"בזיכיון ורישיון השליטה של החברה בשוק הזר היא תמיד מלאה.","a":false,"why":"לא נכון. השליטה משתנה ותלויה בחוזה; הפעילות עצמה בידי השותף המקומי."},{"id":"m7-t19","s":"חברה שמתאימה את סגנון האריזה, שיטות השיווק והסלוגנים ללקוחות המקומיים שואפת להתגבר על פערי תרבות.","a":true,"why":"נכון. אלה התאמות לשפה ולתרבות המקומית – צורך גבוה בתגובה מקומית."},{"id":"m7-t20","s":"בתרשים של המרצה, אסטרטגיה גלובלית (אחידה) מתאפיינת בצורך גבוה ביכולת תגובה מקומית.","a":false,"why":"לא נכון. גלובלית אחידה = שילוב גלובלי גבוה וצורך <b>נמוך</b> בתגובה מקומית."},{"id":"m7-t21","s":"“הצורך בשילוב גלובלי” בתרשים המרצה ו“הלחץ לחיסכון בעלויות” בתרשים הסיכום מתארים בקירוב את אותו ציר.","a":true,"why":"נכון. שילוב גלובלי (מוצר אחיד, ייצור מרוכז, יתרון לגודל) הוא הדרך לחסוך בעלויות; לכן המשבצות מתאימות זו לזו."},{"id":"m7-t22","s":"אסטרטגיה רב-מקומית מתאימה כשהצורך בשילוב גלובלי גבוה והצורך בתגובה מקומית נמוך.","a":false,"why":"לא נכון. זו גלובלית (אחידה). רב-מקומית = שילוב נמוך ותגובה מקומית גבוהה."}],"scope":[{"ref":"סיכום · עמ׳ 12","x":"גלובליזציה: יתרונות ואתגרים","imp":1,"h":"גלובליזציה: יתרונות ואתגרים"},{"ref":"סיכום · עמ׳ 12","x":"אסטרטגיות בינלאומיות ברמת התאגיד: גלובלית, רב-מקומית, על-לאומית, בינלאומית","imp":2,"h":"ארבע האסטרטגיות הבינלאומיות: לחץ לחיסכון בעלויות × לחץ לתגובה מקומית"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"תרשים המרצה: צורך בשילוב גלובלי × צורך ביכולת תגובה מקומית (גלובלית אחידה, רב-מקומית, על-לאומית) והתאמתו לתרשים הסיכום","imp":2,"h":"התרשים של המרצה: הצורך בשילוב גלובלי × הצורך ביכולת תגובה מקומית"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"התאמת אריזה, שיווק וסלוגנים לשוק המקומי = התגברות על פערי תרבות","imp":1,"h":"התאמת אריזה, שיווק וסלוגנים = התגברות על פערי תרבות"},{"ref":"סיכום · עמ׳ 12","x":"אופני חדירה: ייצוא, זיכיון/רישיון, בריתות, רכישה/Greenfield","imp":2,"h":"אופני חדירה לשווקים בינלאומיים: עלות, שליטה וסיכון"}],"outScope":[]},{"id":"m8","title":"ניתוח אירוע: OTO-MOTORS","short":"אירוע OTO-MOTORS","blurb":"האירוע של המרצה – סטארט-אפ משחקי קריפטו/NFT – שקף אחר שקף: מתחרים, PESTEL(G), חמשת הכוחות, שרשרת ערך, KSF, TOWS ואסטרטגיה בינלאומית, ואיך לנתח כתבה בחלק ג׳.","mnemonic":"סדר השקפים: <b>״מי-סביבה-כוחות-ערך-מפתחות-TOWS-עולם״</b>. כוחות: <b>״רק התחליפים גבוהים; לקוחות וספקים נמוכים; כניסה ויריבות באמצע״</b> ← ענף אטרקטיבי. KSF: <b>״אבטחה, חדשנות, רגולציה״</b>. WT2 = <b>סוגרים</b>. ומשקיעים: <b>״המקומי קרוב – שואל יותר״</b>.","blocks":[{"t":"h","x":"החברה: OTO-MOTORS בקצרה"},{"t":"p","x":"<b>OTO-MOTORS</b> הוא האירוע (Case) שד״ר אלירן סולודוחה ניתח בכיתה. זהו <b>סטארט-אפ של משחקי גיימינג המבוססים על קריפטו ו-NFT</b>: השקף הראשון מציג מכונית מרוץ, והשחקנים מחזיקים ב<b>בעלות על מודל וירטואלי</b> (נכס דיגיטלי, NFT) בתוך משחק שבנוי על <b>בלוקצ׳יין</b>."},{"t":"p","x":"למה האירוע חשוב? כי המרצה מריץ עליו <b>כמעט את כל מודלי הקורס, לפי הסדר</b>: ניתוח מתחרים, PESTEL(G), חמשת הכוחות, שרשרת הערך, KSF, TOWS ואסטרטגיה בינלאומית. זו בדיוק התבנית שצריך להפעיל על כתבה בחלק ג׳ של הבחינה, ובמבחן לדוגמה הייתה גם שאלה ישירה על האירוע."},{"t":"table","head":["שקף","מודל","השאלה שהוא עונה עליה"],"rows":[["2","ניתוח מתחרים לפי אופק זמן","מי המתחרים שלנו בטווח קצר, בינוני וארוך?"],["3","PESTEL(G)","מה קורה בסביבה הרחבה (מאקרו)?"],["4","חמשת הכוחות של פורטר","האם הענף אטרקטיבי ורווחי?"],["5","שרשרת הערך","אילו פעילויות יוצרות את הערך?"],["6","KSF","במה חייבים להצליח בענף?"],["7","TOWS","אילו אסטרטגיות נובעות מהחוזקות, החולשות, ההזדמנויות והאיומים?"],["8","אסטרטגיה בינלאומית","איך לפעול בשווקים זרים?"]]},{"t":"trap","x":"אל תבלבלו: התמונה של מכונית המרוץ לא הופכת את OTO-MOTORS לחברת רכב. הענף הוא <b>משחקי קריפטו / NFT</b>, וכל הניתוח נעשה ביחס לענף הזה."},{"t":"exam","x":"שאלות על האירוע יכולות להופיע בחלק א׳ (״אילו מהבאים נכון בהתאם לניתוח האירוע OTO-Motors?״) – לכן צריך לזכור את הפרטים: מי המתחרים, רמת כל כוח, מה ב-TOWS ומה המסקנות."},{"t":"h","x":"ניתוח מתחרים לפי אופק זמן (שקף 2)"},{"t":"p","x":"המרצה מצייר שלושה מעגלים זה בתוך זה. ככל שהאופק רחוק יותר, מעגל המתחרים גדל:"},{"t":"table","head":["טווח","הגדרה","המתחרים של OTO-MOTORS בשקף"],"rows":[["<b>קצר</b> (המעגל הפנימי)","מוצרים <b>זהים או דומים</b>","משחקי קריפטו / NFT אחרים: <b>Axie Infinity, Splinterlands, Alien Worlds, CryptoBlades, Arc8, MOMO Farmer</b>"],["<b>בינוני</b>","<b>נסיבות צריכה דומות</b>","משחקי וידאו ״רגילים״: <b>FIFA 23, Minecraft</b> – אותה סיטואציה (לשבת ולשחק), בלי קריפטו"],["<b>ארוך</b> (המעגל החיצוני)","<b>שימוש בזמן דומה</b> – <b>סכנה אסטרטגית</b>","כל פעילות פנאי שלוקחת את אותו זמן: <b>קריאת ספרים, בישול</b>"]]},{"t":"example","x":"שחקן שמסיים יום עבודה יכול לשחק ב-OTO-MOTORS, לעבור ל-Axie Infinity (קצר), לשחק FIFA בקונסולה (בינוני), או לבשל ארוחה ולקרוא ספר (ארוך). כל אחד מאלה ״גונב״ ממנו את השעה הזו."},{"t":"trap","x":"המעגל החיצוני (ארוך) נקרא ״<b>סכנה אסטרטגית</b>״ דווקא כי קשה לראות בו מתחרה. ו-FIFA ו-Minecraft הם <b>בינוני</b> – לא קצר – כי הם לא משחקי קריפטו, אבל נצרכים באותן נסיבות."},{"t":"exam","x":"״באיזה טווח נמצא Splinterlands?״ ← קצר. ״FIFA 23?״ ← בינוני (נסיבות צריכה דומות). ״ספרים ובישול?״ ← ארוך (שימוש בזמן דומה, סכנה אסטרטגית)."},{"t":"h","x":"PESTEL(G) של OTO-MOTORS והתובנה האסטרטגית (שקף 3)"},{"t":"p","x":"המרצה ממלא לכל אות גורם אחד מרכזי, ומסיים ב<b>תובנה אסטרטגית</b> – זה החלק שהכי חשוב לחקות בבחינה: לא רק לרשום גורמים, אלא לגזור מהם מה החברה צריכה לעשות."},{"t":"table","head":["גורם","מה כתוב בניתוח","למה זה חשוב ל-OTO"],"rows":[["<b>P</b> פוליטי (Political)","<b>אי-ודאות רגולטורית</b> בזירת הקריפטו / NFT","ממשלות עלולות להגביל או לאסור פעילות"],["<b>E</b> כלכלי (Economical)","<b>תנודתיות בשווקי מטבעות הקריפטו</b>","ערך הנכסים במשחק והכנסות החברה קופצים עם השוק"],["<b>S</b> חברתי (Social)","<b>צמיחה מהירה של קהילת הגיימינג</b> ו<b>קבלת בעלות על נכסים וירטואליים</b>","יותר שחקנים מוכנים לשלם על נכס דיגיטלי"],["<b>T</b> טכנולוגי (Technological)","מגמות מתפתחות: <b>מציאות מדומה, בלוקצ׳יין, גיימינג במטאוורס</b>","הזדמנות למוצרים חדשים, אבל צריך לרוץ מהר"],["<b>E</b> סביבתי (Environmental)","<b>צריכת האנרגיה הגבוהה</b> של תעשיית הקריפטו עלולה ליצור <b>דאגה מהשפעות סביבתיות שליליות</b>","סיכון תדמיתי ורגולטורי"],["<b>L</b> חוקי (Legal)","שיקולי <b>קניין רוחני</b>, <b>רישוי וציות</b>","צריך להגן על הנכסים ולעמוד בדרישות החוק בכל מדינה"],["<b>G</b> גלובלי (Globalization)","<b>נדרש תיאום בינלאומי לאכיפת השימוש בקריפטו</b>","החוקים שונים בין מדינות – אין ״כלל אחד לכולם״"]]},{"t":"p","x":"<b>התובנה האסטרטגית של המרצה:</b> על OTO-MOTORS <b>להיות גמישה ולהתאים את עצמה לשינויים ברגולציות, במגמות הצרכניות ובתנאים הכלכליים</b>. עליה <b>להשקיע בטכנולוגיות ירוקות</b> ו<b>להיכנס לשווקים שבהם יש תמיכה במוצרים אקולוגיים</b>, תוך הבנה מעמיקה של ההשפעות הגלובליות והאזוריות על פעילותה."},{"t":"example","x":"איך נולדה התובנה? (P + L + G) רגולציה לא ודאית ושונה בין מדינות ← ״להיות גמישה ומותאמת לרגולציות״. (E כלכלי + S) שוק תנודתי וטעמים משתנים ← ״להתאים למגמות ולתנאים הכלכליים״. (E סביבתי) צריכת אנרגיה ← ״טכנולוגיות ירוקות ושווקים התומכים במוצרים אקולוגיים״."},{"t":"trap","x":"יש <b>שתי אותיות E</b>: כלכלי = תנודתיות הקריפטו; סביבתי = צריכת האנרגיה. ו-<b>G</b> כאן הוא ״תיאום בינלאומי לאכיפה״ – לא גורם טכנולוגי ולא פוליטי מקומי."},{"t":"exam","x":"״צריכת האנרגיה הגבוהה של הקריפטו״ ← <b>סביבתי</b>. ״רישוי, ציות, קניין רוחני״ ← <b>חוקי</b>. ״תנודתיות השווקים״ ← <b>כלכלי</b>. ״קבלת בעלות על נכסים וירטואליים״ ← <b>חברתי</b>. ובחלק ג׳ – תמיד לסיים ב״תובנה אסטרטגית״."},{"t":"h","x":"חמשת הכוחות של OTO-MOTORS: רמת כל כוח והמסקנה (שקף 4)"},{"t":"p","x":"בשקף, ליד כל כוח מופיעה <b>רשימת הגורמים שבודקים</b> (ראו יחידה 2), כל גורם מסומן בחץ (ירוק למעלה / אדום למטה / צהוב לצד), ומעל כל כוח – <b>הרמה</b> שלו."},{"t":"table","head":["כוח","רמה ב-OTO","הגורמים בשקף","הסבר במילים פשוטות"],"rows":[["<b>כניסת מתחרים חדשים</b>","<b>בינוני</b>","<b>חסמי כניסה</b> (1) גודל הפירמה ↓ (2) ביקוש ↓ (3) עלות מעבר ↓ (4) גובה השקעה נדרש ↑ (5) יתרונות השחקנים הקיימים ↑ (6) נגישות לערוצי הפצה ↓ (7) הגבלות ממשלתיות ↑ (8) אסטרטגיית בידול מוצלחת ↓; <b>תגובת הנגד הצפויה</b> – בינונית","חלק מהחסמים נמוכים (לא צריך להיות ענק, קל להגיע לשחקנים אונליין), וחלק גבוהים (השקעה בפיתוח, יתרונות השחקנים הקיימים, רגולציה). התוצאה – באמצע."],["<b>יריבות פנימית</b>","<b>בינוני</b>","מספר המתחרים והדמיון ביניהם ↑; קצב הצמיחה בענף ↓; חסמי מעבר / עלויות מעבר ↑; שביעות רצון המתחרים מהסטטוס – ניטרלי; רכישות של חברות מחוץ לענף – <i>מחוק (לא רלוונטי)</i>; חסמי יציאה ↓","יש הרבה משחקי קריפטו דומים (Axie וכו׳), אבל השוק צעיר וצומח וקל לצאת ממנו – הקרב לא ״עד הסוף״."],["<b>כוח המיקוח של הלקוחות</b>","<b>נמוך</b>","סוג הלקוח (B2B/B2C) ↓; ריכוזיות ענף הלקוחות ↓; עלויות החלפת לקוח גבוהות ↓; איום באינטגרציה לאחור ↓","הלקוחות הם <b>שחקנים פרטיים (B2C)</b>, רבים ומפוזרים, ואף אחד מהם לא יפתח משחק בעצמו."],["<b>כוח המיקוח של הספקים</b>","<b>נמוך</b>","ריכוזיות ענף הספקים ↓; חומר גלם קריטי לשרשרת הערך של הלקוחות ↑; עלויות החלפת ספק גבוהות ↓; איום באינטגרציה לפנים ↓","יש הרבה ספקי תשתית ופיתוח, וקל להחליף. רק ״חומר הגלם״ (הטכנולוגיה) קריטי – ולכן הוא מסומן למעלה."],["<b>מוצרים תחליפיים</b>","<b>גבוה</b>","האם יש מוצרים תחליפיים? ✔; האם התחליפיים אטרקטיביים? ✔; האם הקונים יכולים להחליף בקלות? ✔","כל משחק אחר ובכלל כל בילוי (FIFA, Minecraft, ספר) – זמין, אטרקטיבי ובלי עלות מעבר."]]},{"t":"p","x":"<b>התובנה האסטרטגית (המסקנה):</b> ״<b>עוצמת התחרות הכוללת בענף בינונית-נמוכה ← אטרקטיביות הענף גבוהה ← פוטנציאל הרווחיות גבוה</b>״."},{"t":"example","x":"שימו לב לקשר בין המודלים: התחליפים ״גבוה״ כי בניתוח המתחרים כבר ראינו את המעגל הבינוני והארוך (FIFA, Minecraft, ספרים). ההחלטה על רמת כל כוח נשענת על עובדות מהאירוע – זה מה שהבודק מחפש."},{"t":"trap","x":"הכוח היחיד שדורג <b>גבוה</b> הוא <b>מוצרים תחליפיים</b>. לקוחות וספקים – <b>נמוך</b>; כניסה ויריבות – <b>בינוני</b>. ולמרות כוח אחד גבוה, המסקנה הכוללת היא עוצמה <b>בינונית-נמוכה</b> וענף <b>אטרקטיבי</b>."},{"t":"exam","x":"בחלק א׳ אפשר לשאול: ״איזה כוח דורג גבוה?״ ← תחליפים. ״מה המסקנה?״ ← עוצמה בינונית-נמוכה ← אטרקטיביות גבוהה ← פוטנציאל רווחיות גבוה. בחלק ג׳: לכל כוח – גורמים מהרשימה + עובדה + רמה, ובסוף משפט השרשרת."},{"t":"h","x":"שרשרת הערך של OTO-MOTORS (שקף 5)"},{"t":"p","x":"המרצה <b>מתאים את שרשרת הערך לחברה</b> ולא מעתיק את הגרסה הקלאסית (לוגיסטיקה נכנסת, תפעול, לוגיסטיקה יוצאת...). אצל OTO-MOTORS – חברת תוכנה בלי מפעל ובלי משלוחים – השרשרת כך:"},{"t":"table","head":["סוג","הפעילויות ב-OTO-MOTORS"],"rows":[["<b>פעילויות עיקריות</b> (לפי הסדר בחץ)","1. <b>פיתוח משחקים</b> ← 2. <b>אינטגרציה של מטבעות קריפטו ו-NFT</b> ← 3. <b>שיווק ומכירות</b> ← <b>שולי הרווח</b>"],["<b>פעילויות תומכות</b> (פס אחד מתחת לכולן)","<b>טכנולוגיה, מו״פ, ניהול משאבי אנוש</b>"]]},{"t":"example","x":"איפה נוצר הערך? פיתוח משחק כיפי (פעילות עיקרית 1), חיבור שלו לנכסי NFT שהשחקן באמת מחזיק (2), והבאת שחקנים (3). המו״פ והגיוס של מפתחי בלוקצ׳יין (תומכות) מזינים את כל השלבים – לכן בשקף יש חצים מהפס התומך לכל הפעילויות העיקריות."},{"t":"trap","x":"<b>טכנולוגיה, מו״פ וניהול משאבי אנוש הם פעילויות תומכות</b> – לא עיקריות. <b>שיווק ומכירות</b> הוא פעילות <b>עיקרית</b>. ו״שולי הרווח״ אינם פעילות – הם התוצאה בקצה החץ."},{"t":"exam","x":"״איזו מהבאות <b>אינה</b> פעילות עיקרית בשרשרת הערך של OTO-MOTORS?״ ← טכנולוגיה / מו״פ / משאבי אנוש (תומכות). ובכתבה: בנו שרשרת שמתאימה לחברה שבכתבה, לא את הרשימה הקלאסית בעל-פה."},{"t":"h","x":"מפתחות ההצלחה (KSF) בענף הקריפטו (שקף 6)"},{"t":"p","x":"לפי המרצה, ל<b>ענף הקריפטו</b> שלושה מפתחות הצלחה (KSF) – בהתאם לכלל ״3–4 KSF לכל ענף״:"},{"t":"list","x":["<b>אבטחת מידע</b> – פריצה אחת וגניבת ארנקים דיגיטליים מוחקות את אמון השחקנים.","<b>חדשנות טכנולוגית</b> – הענף זז מהר (מטאוורס, VR); מי שנעצר – נשאר מאחור.","<b>התאמה לרגולציה</b> – החוקים לא ודאיים ושונים בין מדינות; מי שלא עומד בהם נחסם."]},{"t":"example","x":"הקשר לשאר הניתוח: <b>התאמה לרגולציה</b> נובעת ישירות מ-P, L ו-G ב-PESTEL ומהאיום T2. <b>חדשנות טכנולוגית</b> קשורה לחוזקה S1 (שימוש חדשני בבלוקצ׳יין + NFT). כך KSF ״סוגרים״ את הניתוח החיצוני."},{"t":"trap","x":"KSF הם של <b>הענף</b> – כל משחקי הקריפטו צריכים אותם – ולא רשימת המשחקים או המוצרים של OTO. ״מגוון משחקים גדול״ אינו KSF בניתוח."},{"t":"exam","x":"״מהם מפתחות ההצלחה בענף הקריפטו לפי הניתוח?״ ← <b>אבטחת מידע, חדשנות טכנולוגית, התאמה לרגולציה</b>. כדי ליהנות מיתרון בר-קיימא OTO צריכה להיות טובה בשלושתם ולהצטיין לפחות באחד."},{"t":"h","x":"מודל TOWS של OTO-MOTORS (שקף 7)"},{"t":"p","x":"TOWS מצליב <b>כל גורם פנימי</b> (S, W) עם <b>כל גורם חיצוני</b> (O, T) ומייצר אסטרטגיות. הנה הטבלה של המרצה:"},{"t":"table","head":["","<b>חוזקות (S)</b>","<b>חולשות (W)</b>"],"rows":[["<b>הגורמים</b>","S1. שימוש חדשני בבלוקצ׳יין + NFT; S2. יתרון ראשוניות; S3. בעלות על מודל וירטואלי","W1. מודל עסקי לא מוכח; W2. חוסר ניסיון"],["<b>הזדמנויות (O)</b>: O1. צמיחה מהירה של שוק ה-NFT; O2. עניין רב במטאוורס","<b>SO1</b>: S1+S2+S3 למימוש O1; <b>SO2</b>: S1+S2+S3 למימוש O2","<b>WO1</b>: O2 כדי לגשר על W2"],["<b>איומים (T)</b>: T1. תחרות אינטנסיבית; T2. אי-ודאות רגולטורית; T3. תלות בשווקי קריפטו תנודתיים","<b>ST1</b>: S1+S2 מול T1","<b>WT1</b>: שיתוף פעולה אסטרטגי – T1+W2; <b>WT2</b>: לסגור את הפירמה"]]},{"t":"table","head":["אסטרטגיה","מה היא אומרת במילים פשוטות"],"rows":[["<b>SO1</b> (מקסי-מקסי)","להשתמש בכל שלוש החוזקות (חדשנות, ראשוניות, בעלות על המודל) כדי <b>לנצל את הצמיחה המהירה של שוק ה-NFT</b>."],["<b>SO2</b> (מקסי-מקסי)","להשתמש באותן חוזקות כדי <b>לרכוב על העניין במטאוורס</b> – למשל להכניס את המכוניות לעולמות מטאוורס."],["<b>WO1</b> (מיני-מקסי)","לנצל את <b>העניין במטאוורס (O2)</b> כדי <b>להתגבר על חוסר הניסיון (W2)</b> – למשל לגייס אנשים מנוסים או שותפים מהתחום."],["<b>ST1</b> (מקסי-מיני)","להשתמש ב<b>חדשנות וביתרון הראשוניות (S1+S2)</b> כדי להתמודד עם <b>התחרות האינטנסיבית (T1)</b>."],["<b>WT1</b> (מיני-מיני)","<b>שיתוף פעולה אסטרטגי</b> – מול תחרות אינטנסיבית (T1) כשחסר ניסיון (W2): להתחבר לשחקן חזק."],["<b>WT2</b> (מיני-מיני)","<b>לסגור את הפירמה</b> – האפשרות ההגנתית הקיצונית, כשהחולשות פוגשות את האיומים ואין דרך לשרוד."]]},{"t":"example","x":"איך קוראים את SO1 בשקף (חץ מהחוזקות S1+S2+S3 אל O1)? ״החוזקות האלה משמשות כדי לממש את ההזדמנות הזו״. ו-TOWS עוסק גם ב<b>פער בין היכולות הקיימות ליכולות הנדרשות</b> כדי לממש הזדמנות – בדיוק כמו WO1: יש הזדמנות (מטאוורס), חסר ניסיון, ולכן משלימים את היכולת."},{"t":"trap","x":"<b>אי-ודאות רגולטורית</b> ו<b>תנודתיות הקריפטו</b> הם <b>איומים</b> (חיצוניים), לא חולשות. <b>מודל עסקי לא מוכח</b> וחוסר ניסיון הם <b>חולשות</b> (פנימיות). ו-<b>WT2 = לסגור את הפירמה</b>, בעוד ששיתוף הפעולה האסטרטגי הוא <b>WT1</b>."},{"t":"exam","x":"שאלות אפשריות: ״מהי WT2?״ ← לסגור את הפירמה. ״מה מצליבה ST1?״ ← S1+S2 מול T1. ״מה מהבאים חולשה?״ ← מודל עסקי לא מוכח / חוסר ניסיון. ובחלק ב׳: ״TOWS עוסק גם בפערי יכולות מול הזדמנויות״ ← <b>נכון</b> (הוא מצליב כל גורם פנימי עם כל חיצוני)."},{"t":"h","x":"האסטרטגיה הבינלאומית המומלצת (שקף 8)"},{"t":"p","x":"השקף האחרון שואל: ״<b>מהי האסטרטגיה המומלצת לפעולה?</b>״ ומציג את התרשים של הקורס: ציר אנכי – <b>הצורך בשילוב גלובלי</b> (נמוך ← גבוה); ציר אופקי – <b>הצורך ביכולת תגובה מקומית</b> (נמוך ← גבוה)."},{"t":"table","head":["משבצת","שילוב גלובלי","תגובה מקומית","מתי"],"rows":[["<b>אסטרטגיה גלובלית (אחידה)</b>","גבוה","נמוך","מוצר אחיד לכל העולם, חיסכון בעלויות"],["<b>אסטרטגיה על-לאומית</b> (טרנס-לאומית)","גבוה","גבוה","גם יעילות עולמית וגם התאמה מקומית"],["<b>אסטרטגיה רב-מקומית</b>","נמוך","גבוה","התאמה לכל מדינה בנפרד"]]},{"t":"p","x":"השקף <b>לא מסמן תשובה</b> – הוא שואל את הכיתה. (הלוגו של Sony במשבצת הרב-מקומית הוא דוגמה מהתרשים הכללי של הקורס, שבו Sony, Nestlé ו-CAT הן דוגמאות לרב-מקומית; זו לא ההמלצה ל-OTO-MOTORS.) לכן מה שנבדק הוא <b>הנימוק</b>: מדרגים כל ציר לפי הניתוח. <b>תגובה מקומית – גבוהה:</b> הרגולציה על קריפטו ו-NFT שונה ולא ודאית בין מדינות (P, L, G, T2), ו״התאמה לרגולציה״ היא KSF. <b>שילוב גלובלי – גבוה גם הוא:</b> משחק דיגיטלי ופלטפורמת בלוקצ׳יין אחת נמכרים ברשת לכל העולם, עם יתרון לגודל ותחרות אינטנסיבית (T1). שני צירים גבוהים ← <b>אסטרטגיה על-לאומית</b>: פלטפורמה אחת גלובלית, עם התאמות ציות ותשלום לכל מדינה. מי שמעריך שהשילוב הגלובלי נמוך (למשל פעילות רק בכמה שווקים) יגיע לרב-מקומית – וגם זו תשובה שמתקבלת אם היא מנומקת לפי הצירים."},{"t":"example","x":"דוגמה ליישום: ב-OTO-MOTORS יפעלו גרסה שבה במדינה אחת השחקנים קונים את המכוניות במטבע קריפטו, ובמדינה שאוסרת זאת – בכסף רגיל עם רישום NFT בלבד, עם צוות ציות מקומי לכל שוק."},{"t":"trap","x":"אל תענו ״גלובלית אחידה כי משחק דיגיטלי זהה בכל העולם״: זה מתעלם מהרגולציה השונה בין מדינות, שמעלה את הצורך בתגובה מקומית. ואל תכתבו המלצה בלי לדרג את שני הצירים – הנימוק הוא מה שמקבל את הנקודות. ובשאלה הכללית של הקורס: התאמת אריזה, שיטות שיווק וסלוגנים ללקוחות המקומיים = <b>התגברות על פערי תרבות</b>."},{"t":"exam","x":"בחלק ג׳ ״איזו אסטרטגיה בינלאומית מומלצת?״: (1) הציגו את שני הצירים; (2) דרגו כל ציר לפי עובדות מהכתבה (״הרגולציה שונה בכל מדינה ← צורך גבוה בתגובה מקומית״); (3) מקמו במשבצת ונמקו."},{"t":"h","x":"מה נשאל במבחן: משקיעים מקומיים מול זרים"},{"t":"p","x":"במבחן לדוגמה (חלק א׳, שאלה 4) נשאלה שאלה על עובדה מתוך הניתוח בכיתה: מה נכון לגבי השאלות שהמשקיעים שאלו?"},{"t":"p","x":"<b>התשובה הנכונה: משקיעים מקומיים נטו לשאול מספר רב יותר של שאלות ביחס למשקיעים הזרים.</b>"},{"t":"table","head":["אפשרות שמופיעה","נכון?"],"rows":[["מקומיים וזרים שאלו מספר שאלות זהה","לא"],["<b>מקומיים שאלו יותר שאלות מזרים</b>","<b>כן</b>"],["זרים שאלו יותר שאלות ממקומיים","לא (זה ההיפוך – המסיח העיקרי)"],["גם המקומיים וגם הזרים נמנעו משאלות","לא"]]},{"t":"example","x":"טריק לזכירה: <b>״המקומי קרוב – שואל יותר״</b>. המקומיים = יותר שאלות."},{"t":"trap","x":"המסיח העיקרי הוא ההיפוך (״הזרים שאלו יותר״). אל תנחשו לפי היגיון – זו עובדה מהאירוע."},{"t":"exam","x":"״אילו מהבאים נכון בהתאם לניתוח האירוע OTO-Motors?״ ← <b>משקיעים מקומיים נטו לשאול יותר שאלות ממשקיעים זרים</b>."},{"t":"h","x":"איך מנתחים כתבה בחלק ג׳ (לפי תבנית OTO-MOTORS)"},{"t":"p","x":"חלק ג׳ (30 נקודות): כתבה מהעיתונות הכלכלית ושני סעיפים בנוסח ״<b>X טוען ש... האם צודק? נמק תוך הסבר מאפייני...</b>״. OTO-MOTORS הוא התבנית: מזהים את השאלה, בוחרים מודל, מפעילים אותו על עובדות מהכתבה, ומסיימים בתובנה."},{"t":"table","head":["אם שואלים...","המודל","איך כתוב אצל המרצה"],"rows":[["מי המתחרים / האם יש ״סכנה״ ממקום לא צפוי?","ניתוח מתחרים לפי אופק זמן","קצר – זהים/דומים; בינוני – נסיבות צריכה דומות; ארוך – שימוש בזמן דומה (סכנה אסטרטגית)"],["מה משפיע מהסביבה הרחבה?","PESTEL(G)","גורם לכל אות + <b>תובנה אסטרטגית</b>"],["האם הענף אטרקטיבי / כדאי להיכנס?","חמשת הכוחות","רמה לכל כוח + ״עוצמה ← אטרקטיביות ← פוטנציאל רווחיות״"],["איפה החברה יוצרת ערך?","שרשרת הערך","פעילויות עיקריות ותומכות המותאמות לחברה"],["במה חייבים להצליח בענף?","KSF","3–4 גורמים של הענף"],["מה החברה צריכה לעשות?","TOWS","SO / WO / ST / WT מצליבים"],["איך לפעול בחו״ל?","שני הצירים: שילוב גלובלי × תגובה מקומית","גלובלית / רב-מקומית / על-לאומית + נימוק"],["האם זו חדשנות משבשת / אוקיינוס כחול?","מאפייני המושג (יחידות 2, 5)","כל מאפיין מול עובדה; משבשת – האם רוב (מעל 50%) הלקוחות עברו"]]},{"t":"steps","x":["<b>עמדה</b>: צודק / לא צודק / צודק חלקית – במשפט הראשון.","<b>הגדרה</b>: הסבירו את המושג במונחי הקורס ופרטו את <b>מאפייניו</b> (למשל ארבעת מאפייני האוקיינוס הכחול).","<b>יישום</b>: לכל מאפיין – עובדה או מספר מהכתבה (״לפי הכתבה, 80%...״).","<b>מסקנה / תובנה אסטרטגית</b>: מה זה אומר לחברה (כמו ״על OTO-MOTORS להיות גמישה...״).","<b>מונחים</b>: השתמשו במילים של הקורס – ״חסמי כניסה״, ״תגובת נמר״, ״אטרקטיביות הענף״, ״יתרון ראשוניות״."],"title":"מבנה תשובה מנומקת"},{"t":"example","x":"שאלה: ״משקיע טוען שענף משחקי ה-NFT אינו אטרקטיבי. האם צודק?״ תשובה: ״<b>לא צודק.</b> לפי מודל חמשת הכוחות של פורטר, הבוחן את אטרקטיביות הענף: כוח הלקוחות נמוך – לקוחות פרטיים (B2C) רבים ומפוזרים, בלי איום באינטגרציה לאחור; כוח הספקים נמוך – ספקים רבים וקל להחליפם; כניסת מתחרים בינונית – השקעה נדרשת ורגולציה מול נגישות קלה להפצה; יריבות בינונית – מתחרים דומים רבים (Axie Infinity, Splinterlands) אך ענף צומח; תחליפים גבוה – משחקים רגילים ופעילויות פנאי. לכן עוצמת התחרות הכוללת בינונית-נמוכה ← אטרקטיביות הענף גבוהה ← פוטנציאל הרווחיות גבוה.״","title":"תשובה לדוגמה בסגנון חלק ג׳"},{"t":"example","x":"כתבת הקינדל: (א) ״הקינדל הוא חדשנות משבשת?״ ← <b>עדיין לא</b>: חדשנות משבשת מתחילה במוצר פשוט, זול וידידותי (״no frills״) ונחשבת משבשת כשרוב הלקוחות (מעל 50%) עברו; הספרים הדיגיטליים צפויים להגיע רק ל-32.1% משוק הספרים ב-2027, והדפוס עדיין דומיננטי. (ב) ״הקינדל יצר אוקיינוס כחול?״ ← <b>צודק</b>: הכתבה מדגישה ״מרחב תחרותי חדש״ – שוק שהמתחרים הקיימים לא פנו אליו, ביקוש חדש, מתחרים לא רלוונטיים.","title":"אותה שיטה – על כתבת הקינדל"},{"t":"trap","x":"הטעויות שעולות נקודות: (1) עמדה בלי נימוק; (2) נימוק כללי בלי עובדות מהכתבה; (3) שימוש במילים יומיומיות במקום מונחי הקורס; (4) ניתוח בלי מסקנה. בחמשת הכוחות – לשכוח את משפט השרשרת בסוף."},{"t":"exam","x":"תבנית לשינון: <b>עמדה ← מודל ומאפיינים ← עובדות מהכתבה ← מסקנה במונחי הקורס</b>. ותחמו את עצמכם למקום המסומן בטופס."}],"cheat":["OTO-MOTORS = סטארט-אפ משחקי קריפטו/NFT – הענף הוא משחקי קריפטו, לא רכב","משקיעים = המקומיים שאלו <b>יותר</b> שאלות מהזרים (שאלה במבחן לדוגמה)","מתחרים = קצר: Axie Infinity, Splinterlands; בינוני: FIFA 23, Minecraft; ארוך: ספרים, בישול (סכנה אסטרטגית)","PESTEL(G) = P רגולציה לא ודאית; E תנודתיות קריפטו; E סביבתי צריכת אנרגיה; L קניין רוחני וציות; G תיאום בינלאומי לאכיפה","תובנת PESTEL = להיות גמישה לרגולציה, למגמות ולכלכלה, ולהשקיע בטכנולוגיות ירוקות","חמשת הכוחות = כניסה ויריבות בינוני; לקוחות וספקים נמוך; תחליפים גבוה","מסקנה = עוצמה בינונית-נמוכה ← אטרקטיביות גבוהה ← פוטנציאל רווחיות גבוה","שרשרת הערך = עיקריות: פיתוח משחקים, אינטגרציית קריפטו ו-NFT, שיווק ומכירות; תומכות: טכנולוגיה, מו״פ, מש״א","KSF בקריפטו = אבטחת מידע, חדשנות טכנולוגית, התאמה לרגולציה","TOWS = S: בלוקצ׳יין+NFT, ראשוניות, בעלות על מודל; W: מודל עסקי לא מוכח, חוסר ניסיון","אסטרטגיות TOWS = SO1/SO2 חוזקות ל-NFT ולמטאוורס; ST1 מול תחרות; WT1 שיתוף פעולה; WT2 לסגור את הפירמה","אסטרטגיה בינלאומית = רגולציה שונה (תגובה מקומית גבוהה) + פלטפורמה אחת (שילוב גבוה) ← על-לאומית, בנימוק"],"mcq":[{"id":"m8-1","q":"אילו מהבאים נכון לפי הניתוח בכיתה של אירוע OTO-MOTORS?","o":["משקיעים מקומיים וזרים שאלו מספר שאלות זהה","משקיעים זרים שאלו יותר שאלות ממשקיעים מקומיים","משקיעים מקומיים שאלו יותר שאלות ממשקיעים זרים","גם המקומיים וגם הזרים נמנעו משאלות","אף תשובה אינה נכונה"],"a":2,"w":["לפי הניתוח המקומיים שאלו יותר.","זה ההיפוך של העובדה מהאירוע.","","הם כן שאלו – בעיקר המקומיים.","ג׳ נכונה."],"why":"העובדה מהאירוע: משקיעים מקומיים נטו לשאול יותר שאלות ביחס למשקיעים הזרים."},{"id":"m8-2","q":"בניתוח המתחרים של OTO-MOTORS, באיזה טווח נמצאים Axie Infinity ו-Splinterlands?","o":["טווח קצר – מוצרים זהים או דומים","טווח בינוני – נסיבות צריכה דומות","טווח ארוך – שימוש בזמן דומה","הם לא מתחרים אלא ספקים","אף תשובה אינה נכונה"],"a":0,"w":["","גם הם משחקי קריפטו – כלומר דומים, לא רק אותה סיטואציה.","הטווח הארוך הוא פעילויות שונות לגמרי (ספרים, בישול).","הם משחקים מתחרים, לא ספקים.","א׳ נכונה."],"why":"משחקי קריפטו / NFT אחרים = מוצרים זהים או דומים = טווח קצר."},{"id":"m8-3","q":"בשקף ניתוח המתחרים מופיעים FIFA 23 ו-Minecraft. באיזה טווח הם?","o":["טווח קצר","טווח ארוך","הם תחליפים ולכן לא נכנסים לניתוח המתחרים","טווח בינוני – נסיבות צריכה דומות","אף תשובה אינה נכונה"],"a":3,"w":["הם לא משחקי קריפטו, ולכן לא ״זהים או דומים״.","הטווח הארוך – פעילויות אחרות לגמרי.","הם מופיעים בשקף במעגל הבינוני.","","ד׳ נכונה."],"why":"משחקי וידאו רגילים נצרכים באותה סיטואציה (לשבת ולשחק) = נסיבות צריכה דומות = בינוני."},{"id":"m8-4","q":"מה מייצגים קריאת ספרים ובישול בניתוח המתחרים של OTO-MOTORS?","o":["מתחרים בטווח קצר","מתחרים בטווח בינוני","הם לא רלוונטיים לניתוח","ספקים פוטנציאליים","מתחרים בטווח ארוך – שימוש בזמן דומה, ״סכנה אסטרטגית״"],"a":4,"w":["קצר = מוצרים זהים או דומים.","בינוני = נסיבות צריכה דומות.","דווקא הם ה״סכנה האסטרטגית״.","אין קשר לספקים.",""],"why":"כל פעילות שלוקחת את זמן הפנאי של השחקן = טווח ארוך = סכנה אסטרטגית."},{"id":"m8-5","q":"בניתוח PESTEL(G) של OTO-MOTORS, לאיזה גורם שייכת ״צריכת האנרגיה הגבוהה של תעשיית הקריפטו״?","o":["פוליטי","כלכלי","חברתי","סביבתי","חוקי"],"a":3,"w":["פוליטי = אי-ודאות רגולטורית.","כלכלי = תנודתיות שווקי הקריפטו.","חברתי = קהילת הגיימינג ובעלות על נכסים וירטואליים.","","חוקי = קניין רוחני, רישוי וציות."],"why":"צריכת אנרגיה והשפעות סביבתיות שליליות = E סביבתי (Environmental)."},{"id":"m8-6","q":"איזה שיוך <b>אינו</b> נכון בניתוח PESTEL(G) של OTO-MOTORS?","o":["אי-ודאות רגולטורית בזירת הקריפטו – פוליטי","תנודתיות בשווקי הקריפטו – כלכלי","צמיחת קהילת הגיימינג וקבלת בעלות על נכסים וירטואליים – חברתי","צורך בתיאום בינלאומי לאכיפת השימוש בקריפטו – טכנולוגי","מציאות מדומה, בלוקצ׳יין וגיימינג במטאוורס – טכנולוגי"],"a":3,"w":["שיוך נכון.","שיוך נכון.","שיוך נכון.","","שיוך נכון."],"why":"תיאום בינלאומי לאכיפה הוא הגורם הגלובלי (G – Globalization), לא טכנולוגי."},{"id":"m8-7","q":"מהי התובנה האסטרטגית שהמרצה גזר מניתוח ה-PESTEL(G)?","o":["לצאת מהענף עד שהרגולציה תתבהר","להיות גמישה ולהתאים לשינויים ברגולציה, במגמות הצרכניות ובתנאים הכלכליים, ולהשקיע בטכנולוגיות ירוקות","להוריד מחירים כדי להילחם במתחרים","להתמקד בשוק המקומי בלבד","אף תשובה אינה נכונה"],"a":1,"w":["זו לא המסקנה; ״לסגור את הפירמה״ מופיע רק כ-WT2 ב-TOWS.","","PESTEL עוסק בסביבה הרחבה, לא במלחמת מחירים.","התובנה מדגישה הבנה של השפעות גלובליות ואזוריות.","ב׳ נכונה."],"why":"גמישות לרגולציה, למגמות ולכלכלה + השקעה בטכנולוגיות ירוקות ושווקים התומכים במוצרים אקולוגיים."},{"id":"m8-8","q":"איזה מהכוחות דורג <b>גבוה</b> בניתוח חמשת הכוחות של OTO-MOTORS?","o":["כניסת מתחרים חדשים","יריבות פנימית בענף","כוח המיקוח של הלקוחות","כוח המיקוח של הספקים","מוצרים תחליפיים"],"a":4,"w":["דורג בינוני.","דורגה בינונית.","דורג נמוך.","דורג נמוך.",""],"why":"יש תחליפים, הם אטרקטיביים, וקל לעבור אליהם – איום התחליפים גבוה."},{"id":"m8-9","q":"מה הייתה המסקנה של ניתוח חמשת הכוחות באירוע OTO-MOTORS?","o":["עוצמה גבוהה ← אטרקטיביות נמוכה ← פוטנציאל רווחיות נמוך","עוצמה בינונית-נמוכה ← אטרקטיביות גבוהה ← פוטנציאל רווחיות גבוה","עוצמה נמוכה ← אטרקטיביות נמוכה ← פוטנציאל רווחיות גבוה","אי אפשר להסיק מסקנה בענף כה חדש","אף תשובה אינה נכונה"],"a":1,"w":["רק כוח אחד (תחליפים) גבוה; העוצמה הכוללת בינונית-נמוכה.","","עוצמה נמוכה מובילה לאטרקטיביות גבוהה, לא נמוכה.","המרצה כן הסיק מסקנה.","ב׳ נכונה."],"why":"עוצמת התחרות הכוללת בינונית-נמוכה ← אטרקטיביות הענף גבוהה ← פוטנציאל הרווחיות גבוה."},{"id":"m8-10","q":"כוח המיקוח של הלקוחות של OTO-MOTORS דורג נמוך. איזה גורם מרשימת המרצה מסביר זאת?","o":["הלקוחות הם צרכנים פרטיים (B2C) רבים ומפוזרים","חומר הגלם קריטי לשרשרת הערך של הלקוחות","איום באינטגרציה לפנים","חסמי יציאה נמוכים","שביעות רצון המתחרים מהסטטוס שלהם"],"a":0,"w":["","זה גורם של כוח הספקים.","אינטגרציה לפנים שייכת לספקים.","חסמי יציאה שייכים ליריבות.","זה גורם של היריבות הפנימית."],"why":"סוג הלקוח (B2C) וריכוזיות נמוכה של הלקוחות מחלישים את כוח הלקוחות."},{"id":"m8-11","q":"איזו מהבאות <b>אינה</b> פעילות עיקרית בשרשרת הערך של OTO-MOTORS לפי המרצה?","o":["פיתוח משחקים","אינטגרציה של מטבעות קריפטו ו-NFT","שיווק ומכירות","טכנולוגיה, מו״פ וניהול משאבי אנוש","אף תשובה – כולן עיקריות"],"a":3,"w":["זו הפעילות העיקרית הראשונה.","זו פעילות עיקרית.","זו פעילות עיקרית.","","ד׳ היא פעילות תומכת."],"why":"טכנולוגיה, מו״פ וניהול מש״א מופיעים בפס הפעילויות התומכות."},{"id":"m8-12","q":"מה <b>אינו</b> מפתח הצלחה (KSF) של ענף הקריפטו לפי הניתוח?","o":["אבטחת מידע","חדשנות טכנולוגית","מגוון גדול של משחקים בקטלוג החברה","התאמה לרגולציה","אף תשובה אינה נכונה"],"a":2,"w":["זה KSF בניתוח.","זה KSF בניתוח.","","זה KSF בניתוח.","ג׳ אינו KSF."],"why":"ה-KSF: אבטחת מידע, חדשנות טכנולוגית, התאמה לרגולציה. KSF אינם מגוון המוצרים."},{"id":"m8-13","q":"מהי האסטרטגיה WT2 בטבלת ה-TOWS של OTO-MOTORS?","o":["שיתוף פעולה אסטרטגי","לסגור את הפירמה","שימוש בחדשנות וביתרון הראשוניות מול התחרות","ניצול צמיחת שוק ה-NFT","כניסה למטאוורס"],"a":1,"w":["זו WT1.","","זו ST1.","זו SO1.","זו SO2."],"why":"WT2 היא האפשרות ההגנתית הקיצונית: לסגור את הפירמה."},{"id":"m8-14","q":"מה מצליבה האסטרטגיה ST1 ב-TOWS של OTO-MOTORS?","o":["S1+S2+S3 מול O1","O2 מול W2","T1 מול W2","S1+S2 (חדשנות + יתרון ראשוניות) מול T1 (תחרות אינטנסיבית)","S3 מול T3"],"a":3,"w":["זו SO1.","זו WO1.","זו WT1.","","הצלבה כזו לא מופיעה בטבלה."],"why":"ST1: להשתמש בחדשנות ובראשוניות כדי להתמודד עם התחרות האינטנסיבית."},{"id":"m8-15","q":"איזה מהבאים הוא <b>חולשה</b> (W) של OTO-MOTORS בניתוח?","o":["יתרון ראשוניות","אי-ודאות רגולטורית","צמיחה מהירה של שוק ה-NFT","בעלות על מודל וירטואלי","מודל עסקי לא מוכח"],"a":4,"w":["זו חוזקה (S2).","זה איום חיצוני (T2), לא חולשה.","זו הזדמנות (O1).","זו חוזקה (S3).",""],"why":"החולשות: W1 מודל עסקי לא מוכח, W2 חוסר ניסיון."},{"id":"m8-16","q":"בשקף ״מהי האסטרטגיה המומלצת לפעולה?״ של OTO-MOTORS, איזה נימוק מתאים לניתוח של החברה?","o":["גלובלית אחידה – משחק דיגיטלי זהה בכל העולם, ולכן אין צורך בשום התאמה מקומית","הרגולציה השונה בין מדינות מעלה את הצורך בתגובה מקומית, והפלטפורמה הדיגיטלית האחת מעלה את הצורך בשילוב גלובלי – ולכן על-לאומית","רב-מקומית – כי הלוגו של Sony מופיע בשקף","יצוא בלבד – כי החברה קטנה","אף תשובה אינה נכונה"],"a":1,"w":["מתעלם מהגורם המרכזי בניתוח: רגולציה שונה ולא ודאית בין מדינות, שמחייבת התאמה מקומית.","","הלוגו הוא דוגמה מהתרשים הכללי של הקורס (Sony כרב-מקומית), לא ההמלצה; ההמלצה נקבעת לפי דירוג שני הצירים.","יצוא הוא אופן חדירה, לא אחת מהאסטרטגיות שבתרשים.","ב׳ נכונה."],"why":"מדרגים את שני הצירים לפי הניתוח: רגולציה שונה בין מדינות (P, L, G, T2, KSF ״התאמה לרגולציה״) ← צורך גבוה בתגובה מקומית; פלטפורמה דיגיטלית אחת לכל העולם ותחרות אינטנסיבית ← צורך גבוה בשילוב גלובלי. שניהם גבוהים ← על-לאומית."},{"id":"m8-17","q":"מהי WT1 ב-TOWS של OTO-MOTORS?","o":["שיתוף פעולה אסטרטגי – מול תחרות אינטנסיבית (T1) כשחסר ניסיון (W2)","לסגור את הפירמה","ניצול העניין במטאוורס כדי להשלים ניסיון","הורדת מחירים מול המתחרים","אף תשובה אינה נכונה"],"a":0,"w":["","זו WT2.","זו WO1.","זה לא מופיע בטבלה.","א׳ נכונה."],"why":"WT1 = שת״פ אסטרטגי, הצלבה של T1 ו-W2."},{"id":"m8-18","q":"בחלק ג׳ נשאל: ״אנליסט טוען שהענף שבו פועלת החברה בכתבה אינו אטרקטיבי. האם צודק?״ איזה מודל מתאים, ואיך מסיימים את התשובה?","o":["PESTEL(G) – ומסיימים ברשימת הגורמים","TOWS – ומסיימים ב-WT2","שרשרת הערך – ומסיימים בשולי הרווח","חמשת הכוחות – ומסיימים ב״עוצמת התחרות הכוללת ← אטרקטיביות הענף ← פוטנציאל הרווחיות״","KSF – ומסיימים במגוון המוצרים"],"a":3,"w":["PESTEL מנתח מאקרו ואינו מדרג אטרקטיביות ענף.","TOWS בונה אסטרטגיות לחברה, לא בודק אטרקטיביות ענף.","שרשרת הערך בוחנת פעילויות פנימיות.","","KSF אינם מודדים אטרקטיביות, והם אינם מגוון מוצרים."],"why":"אטרקטיביות ענף = חמשת הכוחות, עם רמה לכל כוח ומשפט השרשרת בסוף."}],"tf":[{"id":"m8-t1","s":"לפי ניתוח אירוע OTO-MOTORS, משקיעים מקומיים נטו לשאול יותר שאלות ממשקיעים זרים.","a":true,"why":"זו העובדה שנשאלה במבחן לדוגמה."},{"id":"m8-t2","s":"בניתוח המתחרים של OTO-MOTORS, FIFA 23 הוא מתחרה בטווח הקצר.","a":false,"why":"FIFA 23 נצרך בנסיבות צריכה דומות – טווח בינוני. בטווח הקצר נמצאים משחקי קריפטו כמו Axie Infinity."},{"id":"m8-t3","s":"המעגל של הטווח הארוך בניתוח המתחרים נקרא ״סכנה אסטרטגית״.","a":true,"why":"שימוש בזמן דומה (ספרים, בישול) – מתחרים שקשה לזהות."},{"id":"m8-t4","s":"כוח המיקוח של הלקוחות של OTO-MOTORS דורג גבוה.","a":false,"why":"הוא דורג נמוך: לקוחות B2C רבים ומפוזרים, בלי איום באינטגרציה לאחור."},{"id":"m8-t5","s":"איום המוצרים התחליפיים דורג גבוה בניתוח OTO-MOTORS.","a":true,"why":"יש תחליפים, הם אטרקטיביים וקל לעבור אליהם."},{"id":"m8-t6","s":"לפי הניתוח, עוצמת התחרות הכוללת בענף בינונית-נמוכה, ולכן אטרקטיביות הענף ופוטנציאל הרווחיות גבוהים.","a":true,"why":"זו התובנה האסטרטגית שבתחתית שקף חמשת הכוחות."},{"id":"m8-t7","s":"באסטרטגיית WT2 של OTO-MOTORS המרצה ממליץ על שיתוף פעולה אסטרטגי.","a":false,"why":"שיתוף פעולה אסטרטגי הוא WT1. WT2 = לסגור את הפירמה."},{"id":"m8-t8","s":"יתרון ראשוניות הוא אחת החוזקות (S) של OTO-MOTORS.","a":true,"why":"S2 = יתרון ראשוניות."},{"id":"m8-t9","s":"אי-ודאות רגולטורית היא חולשה (W) של OTO-MOTORS.","a":false,"why":"זה גורם חיצוני – איום (T2). החולשות: מודל עסקי לא מוכח וחוסר ניסיון."},{"id":"m8-t10","s":"מפתחות ההצלחה בענף הקריפטו לפי הניתוח הם אבטחת מידע, חדשנות טכנולוגית והתאמה לרגולציה.","a":true,"why":"אלה שלושת ה-KSF בשקף."},{"id":"m8-t11","s":"בשרשרת הערך של OTO-MOTORS, שיווק ומכירות היא פעילות תומכת.","a":false,"why":"שיווק ומכירות היא פעילות עיקרית. התומכות: טכנולוגיה, מו״פ, ניהול מש״א."},{"id":"m8-t12","s":"הגורם הגלובלי (G) בניתוח PESTEL של OTO-MOTORS הוא הצורך בתיאום בינלאומי לאכיפת השימוש בקריפטו.","a":true,"why":"כך בשקף: ״נדרש תיאום בינלאומי לאכיפת השימוש בקריפטו״."},{"id":"m8-t13","s":"בחלק ג׳ מספיק לכתוב ״צודק״ או ״לא צודק״, בלי לפרט את מאפייני המושג.","a":false,"why":"השאלה דורשת נימוק תוך הסבר המאפיינים ועובדות מהכתבה, במונחי הקורס."}],"scope":[{"ref":"אירוע OTO-MOTORS","x":"החברה ומבנה הניתוח","imp":1,"h":"החברה: OTO-MOTORS בקצרה"},{"ref":"אירוע OTO-MOTORS","x":"ניתוח מתחרים לפי אופק זמן","imp":1,"h":"ניתוח מתחרים לפי אופק זמן (שקף 2)"},{"ref":"אירוע OTO-MOTORS","x":"PESTEL(G) והתובנה האסטרטגית","imp":2,"h":"PESTEL(G) של OTO-MOTORS והתובנה האסטרטגית (שקף 3)"},{"ref":"אירוע OTO-MOTORS","x":"חמשת הכוחות – רמות והמסקנה","imp":2,"h":"חמשת הכוחות של OTO-MOTORS: רמת כל כוח והמסקנה (שקף 4)"},{"ref":"אירוע OTO-MOTORS","x":"שרשרת הערך","imp":1,"h":"שרשרת הערך של OTO-MOTORS (שקף 5)"},{"ref":"אירוע OTO-MOTORS","x":"KSF בענף הקריפטו","imp":1,"h":"מפתחות ההצלחה (KSF) בענף הקריפטו (שקף 6)"},{"ref":"אירוע OTO-MOTORS","x":"TOWS – גורמים ואסטרטגיות","imp":2,"h":"מודל TOWS של OTO-MOTORS (שקף 7)"},{"ref":"אירוע OTO-MOTORS","x":"האסטרטגיה הבינלאומית המומלצת","imp":1,"h":"האסטרטגיה הבינלאומית המומלצת (שקף 8)"},{"ref":"אירוע OTO-MOTORS","x":"משקיעים מקומיים מול זרים (שאלת מבחן)","imp":2,"h":"מה נשאל במבחן: משקיעים מקומיים מול זרים"},{"ref":"אירוע OTO-MOTORS","x":"ניתוח כתבה בחלק ג׳ לפי התבנית","imp":2,"h":"איך מנתחים כתבה בחלק ג׳ (לפי תבנית OTO-MOTORS)"}],"outScope":[]}],"exams":[{"id":"sample1","title":"מבחן לדוגמה 1 (הפתור)","note":"המבחן לדוגמה הפתור של המרצים – אותן שאלות, באותו סדר ועם המפתח הרשמי, בניסוח שלנו.","mc":[{"id":"x1-1","q":"מודל חמשת הכוחות של פורטר (Porter) משמש בעיקר כדי:","o":["לנתח את הסביבה הפנימית של הפירמה – המשאבים והיכולות שלה","להחליט אילו שינויים צריך לעשות במבנה הארגוני של היחידה העסקית","לקבוע את היעדים ארוכי-הטווח של הפירמה","לבדוק את כושר התחרות של פירמה אחת מסוימת","לבחון עד כמה אטרקטיבי הענף שבו הפירמה פועלת, או ענף שהיא שוקלת להיכנס אליו"],"a":4,"why":"חמשת הכוחות הוא כלי לניתוח <b>סביבת הענף</b> (הסביבה החיצונית): כניסת מתחרים חדשים, יריבות פנימית בענף, כוח המיקוח של הלקוחות, כוח המיקוח של הספקים ומוצרים תחליפיים. ככל שעוצמת הכוחות יחד גבוהה יותר – הענף פחות אטרקטיבי ופוטנציאל הרווח בו נמוך יותר. לכן אפשר להפעיל אותו גם על ענף שהפירמה עדיין לא נמצאת בו ורק שוקלת להיכנס אליו.","w":["ניתוח פנימי עושים בכלים כמו שרשרת ערך ו-VRIN; חמשת הכוחות מסתכל על הענף מבחוץ.","המבנה הארגוני אינו נושא המודל – המודל עוסק בכוחות התחרותיים בענף.","יעדים נגזרים מהחזון; חמשת הכוחות רק נותן מידע על הענף ואינו כלי לקביעת יעדים.","המודל בוחן את הענף כולו ולא פירמה בודדת; כושר התחרות של פירמה נבדק בניתוח הסביבה הפנימית שלה.",""]},{"id":"x1-2","q":"מהו החיסרון הבולט ביותר של מיקור חוץ (Outsourcing)?","o":["בדרך כלל זו דרך יקרה יחסית","הפירמה נעשית תלויה בגורם חיצוני","הפירמה יכולה לעסוק רק במעט פעילויות או פרויקטים","זה מתאים רק לפירמות קטנות","העובדים צריכים תקופת לימוד והכשרה ארוכה יותר"],"a":1,"why":"במיקור חוץ הפירמה מעבירה פעילות מתוך שרשרת הערך לספק חיצוני שעושה אותה טוב יותר או זול יותר. החיסרון הבולט הוא <b>תלות בגורם חיצוני</b>: אם הספק מעלה מחירים, מאחר, פוגע באיכות או עובר לעבוד עם מתחרה – הפירמה נפגעת, והשליטה שלה בפעילות קטנה.","w":["להפך – בדרך כלל עושים מיקור חוץ כי הספק עושה את העבודה בעלות נמוכה יותר (התמחות ויתרון לגודל).","","התמקדות בפעילויות הליבה היא דווקא <b>יתרון</b> של מיקור חוץ – הפירמה משחררת משאבים למה שהיא עושה הכי טוב.","גם פירמות ענק משתמשות במיקור חוץ, למשל אפל שמייצרת את המכשירים שלה אצל קבלני ייצור.","ההכשרה נעשית אצל הספק; מיקור חוץ דווקא חוסך לפירמה הכשרת עובדים לפעילות שהוצאה החוצה."]},{"id":"x1-3","q":"איזה משפט <b>אינו נכון</b> לגבי יעדים של פירמה?","o":["יעד טוב הופך את החזון של הפירמה למשהו מעשי ומוחשי","יעד טוב הוא יעד שאין צורך לעדכן אותו כל שנה עד שלוש שנים","ליעד טוב יש מסגרת זמן מוגדרת","יעד טוב הוא יעד שאפשר למדוד","יעד טוב מאתגר את הפירמה, אבל עדיין ריאלי"],"a":1,"why":"יעד טוב בנוי לפי עקרונות SMART: ספציפי, מדיד, בר-השגה, ריאלי ותחום בזמן, והוא מתרגם את החזון לביטוי מעשי. הסביבה העסקית משתנה כל הזמן, ולכן <b>צריך לעדכן את היעדים בכל 1–3 שנים</b>. המשפט שטוען שיעד טוב לא צריך עדכון הוא המשפט השגוי.","w":["זה משפט נכון – זה בדיוק תפקיד היעד: לתרגם את החזון לביטוי מעשי.","","זה משפט נכון – מסגרת זמן היא ה-T ב-SMART (Time).","זה משפט נכון – מדידות היא ה-M ב-SMART (Measurable); בלי מדידה אי אפשר לדעת אם היעד הושג.","זה משפט נכון – יעד צריך לאתגר אבל להיות בר-השגה וריאלי (A ו-R ב-SMART)."]},{"id":"x1-4","q":"לפי ניתוח האירוע OTO-Motors שנלמד בכיתה, מה נכון לגבי השאלות שהציגו המשקיעים?","o":["משקיעים מקומיים וזרים שאלו בערך אותו מספר שאלות","המשקיעים המקומיים נטו לשאול יותר שאלות מהמשקיעים הזרים","המשקיעים הזרים נטו לשאול יותר שאלות מהמשקיעים המקומיים","גם המקומיים וגם הזרים כמעט לא שאלו שאלות","אף תשובה אינה נכונה"],"a":1,"why":"זו שאלה על פרט עובדתי מתוך האירוע שנותח בכיתה: לפי ניתוח OTO-Motors, <b>המשקיעים המקומיים שאלו יותר שאלות</b> מהמשקיעים הזרים. את הפרט הזה צריך לזכור כמו שהוא, וכדאי לחזור גם על שאר הניתוח באירוע – PESTEL(G), חמשת הכוחות, שרשרת ערך, KSF, TOWS ואסטרטגיה בינלאומית.","w":["לפי האירוע לא היה שוויון – המקומיים שאלו יותר.","","זה הפוך – לפי האירוע דווקא המקומיים שאלו יותר מהזרים.","באירוע המשקיעים כן שאלו שאלות, והמקומיים שאלו יותר.","יש תשובה נכונה – ב."]},{"id":"x1-5","q":"במקרים רבים אפשר לומר ש:","o":["תוצאות פיננסיות טובות היום יכולות להעיד על החלטות אסטרטגיות ופעולות נכונות שנעשו בעבר","בחברות פרטיות היעדים הפיננסיים חשובים יותר מהיעדים האסטרטגיים","בחברה שעומדת על סף פשיטת רגל, היעדים הפיננסיים חשובים יותר מהיעדים האסטרטגיים","תשובות א, ג נכונות","תשובות א, ב, ג נכונות"],"a":3,"why":"החלטות אסטרטגיות מבשילות לאורך זמן, ולכן רווחיות טובה היום היא לרוב פרי של אסטרטגיה נכונה בעבר (א נכון). כשהחברה על סף פשיטת רגל צריך קודם כול לשרוד – תזרים מזומנים והחזר חובות – ולכן היעדים הפיננסיים קודמים (ג נכון). אין כלל שלפיו בחברה פרטית יעדים פיננסיים חשובים יותר, ולכן ב אינו נכון.","w":["משפט א נכון, אבל גם משפט ג נכון – לכן צריך לבחור בתשובה שכוללת את שניהם.","אין כלל כזה: גם חברה פרטית צריכה יעדים אסטרטגיים (נתח שוק, חדשנות, מוניטין) לצד יעדים פיננסיים.","משפט ג נכון, אבל גם משפט א נכון – לכן צריך לבחור בתשובה שכוללת את שניהם.","","התשובה כוללת את משפט ב, שאינו נכון – סוג הבעלות (פרטית או ציבורית) לא קובע שיעדים פיננסיים חשובים יותר."]},{"id":"x1-6","q":"מה החיסרון הבולט ביותר של האסטרטגיה המשולבת (מנהיגות בעלות + בידול, Best-cost)?","o":["קל להעתיק אותה","הנישה עלולה להפוך לאטרקטיבית ולמשוך מתחרים גדולים","צריך להשקיע הרבה כסף בחינוך השוק","בעיית תת-מיצוב","אף תשובה אינה נכונה"],"a":3,"why":"באסטרטגיה המשולבת הפירמה מציעה ערך טוב (איכות ותכונות) במחיר נמוך מזה של המבדלים. הסכנה המרכזית היא <b>תת-מיצוב</b>: הלקוחות לא מבינים בבירור במה הפירמה מיוחדת – היא לא הכי זולה וגם לא הכי ייחודית, והמיצוב שלה בראש הלקוח מטושטש. במקרה הקיצוני היא נעשית ״תקועה באמצע״ (Stuck in the middle) – בין מנהיג העלות לבין המבדל.","w":["סיכון ההעתקה קיים כמעט בכל אסטרטגיה (בעיקר בבידול ובמנהיגות בעלות); הוא לא החיסרון הייחודי לאסטרטגיה המשולבת.","זה סיכון של אסטרטגיה <b>ממוקדת</b> (נישה): אם הנישה רווחית, שחקנים גדולים נכנסים אליה.","חינוך שוק יקר מאפיין פירמה חלוצה שפותחת שוק חדש (למשל באוקיינוס כחול), לא את האסטרטגיה המשולבת.","","יש תשובה נכונה – תת-מיצוב (ד) הוא החיסרון הבולט של האסטרטגיה המשולבת."]},{"id":"x1-7","q":"פירמה מבצעת פעילות שחשובה לתחרותיות שלה טוב יותר מהפעילויות האחרות שהיא עצמה מבצעת. מה אפשר לומר שיש לה?","o":["שרשרת ערך יעילה ויכולת טובה להטמיע את האסטרטגיה שבחרה","יכולת ייחודית","יכולת ליבה","יתרון תחרותי בר-קיימא","אף תשובה אינה נכונה"],"a":2,"why":"<b>יכולת ליבה</b> (Core competence) היא פעילות חשובה לתחרותיות שהפירמה עושה טוב יותר <b>מהפעילויות האחרות שלה</b> – ההשוואה היא פנימית. <b>יכולת ייחודית</b> (Distinctive competence) היא פעילות שהפירמה עושה טוב יותר <b>מהמתחרים</b> – ההשוואה היא חיצונית. בשאלה ההשוואה היא לפעילויות האחרות של הפירמה, ולכן זו יכולת ליבה.","w":["שרשרת ערך יעילה מתארת את כל הפעילויות יחד; השאלה מתארת פעילות אחת שבולטת לעומת שאר הפעילויות של הפירמה.","יכולת ייחודית נמדדת מול <b>המתחרים</b>, ובשאלה ההשוואה היא לפעילויות האחרות של הפירמה עצמה.","","יתרון בר-קיימא דורש משאב שעונה על כל ארבעת תנאי VRIN (בעל ערך, נדיר, יקר לחיקוי, ללא תחליף) – הרבה יותר מפעילות שנעשית טוב.","יש תשובה נכונה – זו בדיוק ההגדרה של יכולת ליבה."]},{"id":"x1-8","q":"חברה שבודקת מעבר לאסטרטגיה בינלאומית החליטה להתאים את עצמה ללקוחות המקומיים: היא שינתה את עיצוב האריזה, את שיטות השיווק ואת הסלוגנים. מה נכון?","o":["נראה שהחברה מנסה להתגבר על פערי תרבות","החברה צריכה לסגור את הפעילות בשוק המקומי שבו היא פועלת היום","כדאי להמליץ לחברה לאמץ אסטרטגיה גלובלית (אחידה)","תשובות א, ג נכונות","תשובות א, ב, ג נכונות"],"a":0,"why":"התאמת אריזה, שיווק וסלוגנים לטעם המקומי היא דרך <b>להתגבר על פערי תרבות</b> – אחד האתגרים המרכזיים בשווקים בינלאומיים. התאמה כזאת מבטאת <b>צורך גבוה ביכולת תגובה מקומית</b> (בתרשים: הצורך ביכולת תגובה מקומית מול הצורך בשילוב גלובלי), ולכן היא מתאימה לאסטרטגיה רב-מקומית או על-לאומית – לא לגלובלית.","w":["","אין בסיפור שום דבר שמצביע על צורך לסגור פעילות קיימת; החברה רק מתאימה את השיווק.","אסטרטגיה גלובלית (אחידה) מוכרת אותו מוצר באותו שיווק בכל העולם – בדיוק ההפך מהתאמות מקומיות.","משפט ג אינו נכון (גלובלית = כמעט בלי התאמות), ולכן התשובה שגויה.","משפטים ב ו-ג אינם נכונים, ולכן התשובה שגויה."]},{"id":"x1-9","q":"איזה משפט <b>אינו נכון</b> לגבי מיפוי קבוצות אסטרטגיות?","o":["גודל כל עיגול במפה מבטא את חלקה של הקבוצה האסטרטגית בהכנסות הענף","המתאם (הקשר) בין שני הקריטריונים שעל הצירים צריך להיות חלש","צריך לשאוף שהמשתנים על הצירים יהיו משתנים רציפים","תשובות א, ג אינן נכונות","תשובות א, ב, ג אינן נכונות"],"a":2,"why":"במפת קבוצות אסטרטגיות גודל העיגול משקף את נתח הקבוצה מהכנסות הענף (א נכון). בוחרים שני צירים <b>עם מתאם נמוך</b>, אחרת שני הצירים מספרים אותו סיפור (ב נכון). המשתנים <b>לא חייבים להיות רציפים</b> – אפשר ציר כמו ״מגוון דגמים: רחב/צר״ במפת ענף הרכב, ולכן ג הוא המשפט שאינו נכון.","w":["משפט א נכון – עיגול גדול מסמן קבוצה עם חלק גדול מהכנסות הענף.","משפט ב נכון – אם הצירים בקורלציה גבוהה, הקבוצות יסתדרו על אלכסון והמפה לא תוסיף מידע.","","משפט א דווקא נכון, ולכן אי אפשר לומר ש״א, ג אינן נכונות״.","משפטים א ו-ב נכונים, ולכן התשובה שגויה."]},{"id":"x1-10","q":"ב-2012 הקימו מיקרוסופט (Microsoft), שהתמחתה בפלטפורמות נתונים, ו-ג׳נרל אלקטריק (GE), שפיתחה יישומים לתחום הבריאות, חברה חדשה בשם קרדיגם (Caradigm). מטרתה הייתה לנצל נתונים כדי לשפר את איכות שירותי הבריאות ואת חוויית המטופל. מה נכון?","o":["קרדיגם היא מיזם משותף (Joint Venture)","ג׳נרל אלקטריק בחרה באסטרטגיית מיקור חוץ (Outsourcing)","קרדיגם נוצרה כתוצאה ממיזוג (Merger)","מיקרוסופט בחרה באסטרטגיית הגוונה (Diversification)","אף תשובה אינה נכונה"],"a":0,"why":"שתי חברות עצמאיות הקימו יחד <b>ישות משפטית חדשה</b> בבעלות משותפת, וכל אחת הביאה אליה את היכולת שלה (נתונים מצד אחד, יישומי בריאות מצד שני). זו ההגדרה של <b>מיזם משותף</b> (Joint Venture) – צורה של שיתוף פעולה שבה החברות משתפות סיכון, השקעה וידע, ושתיהן ממשיכות להתקיים בנפרד (כמו Sony + Ericsson).","w":["","במיקור חוץ פירמה קונה פעילות מספק חיצוני; כאן לא קנו שירות, אלא הקימו יחד חברה חדשה.","במיזוג שתי חברות מתאחדות לחברה אחת ומפסיקות להתקיים בנפרד; מיקרוסופט ו-GE המשיכו להתקיים כרגיל.","הגוונה היא כניסה עצמאית של פירמה לתחום חדש; כאן מדובר בשיתוף פעולה בין שתי חברות – זה מה שמגדיר את המהלך.","יש תשובה נכונה – מיזם משותף."]}],"tf":[{"id":"x1-t1","s":"ככל שעקומת הלמידה בענף מאפשרת לפירמות הקיימות להוריד את העלות הממוצעת ליחידה, כך האיום של ״כניסת מתחרים חדשים״ חזק יותר.","a":false,"why":"לא נכון – ההפך. פירמות ותיקות עם עלות נמוכה יכולות להגיב ב<b>״תגובת נמר״</b> – הורדת מחיר ללקוחות, גם במחיר הפסד בטווח הקצר – ולכן <b>חסמי הכניסה מתחזקים</b> והאיום של כניסת מתחרים חדשים נחלש."},{"id":"x1-t2","s":"מודל TOWS מתייחס, בין השאר, גם לפער בין היכולות שיש היום לפירמה לבין היכולות שהיא צריכה כדי לנצל הזדמנויות בשוק.","a":true,"why":"נכון. TOWS נבנה על ניתוח SWOT (חוזקות וחולשות בתוך הפירמה, הזדמנויות ואיומים מחוצה לה) ומגבש אסטרטגיה על ידי <b>שילוב של כל גורם פנימי עם כל גורם חיצוני</b>. למשל בתא WO (חולשה מול הזדמנות) הפירמה בונה את היכולת החסרה כדי לנצל הזדמנות – זה ניתוח פערי יכולות."},{"id":"x1-t3","s":"פירמה לא יכולה ליהנות מיתרון תחרותי אם היא לא מורידה את העלויות שלה באופן משמעותי.","a":false,"why":"לא נכון. הורדת עלויות היא רק דרך אחת (מנהיגות בעלות). אפשר להשיג יתרון גם בעזרת <b>תועלת ייחודית</b> ללקוח – איכות, שירות, זמינות, חדשנות (בידול), או בעזרת <b>אוקיינוס כחול</b> – פנייה לשוק חדש שהמתחרים עוד לא פנו אליו."},{"id":"x1-t4","s":"מפתחות ההצלחה בענף (KSF) מגדירים אילו מוצרים ושירותים הפירמה מציעה בענף שבו היא פועלת.","a":false,"why":"לא נכון. KSF הם <b>תחומי הפעילות שכל פירמה בענף חייבת להיות טובה בהם</b> כדי להצליח לאורך זמן – בדרך כלל 3–4 לענף, והם משתנים מעת לעת. הפירמה צריכה להיות טובה בכולם ולהצטיין לפחות באחד כדי ליהנות מיתרון בר-קיימא; סל המוצרים הוא החלטה של הפירמה, לא KSF של הענף."},{"id":"x1-t5","s":"אפשר להשיג יתרון תחרותי על ידי יצירת ערך כלכלי ללקוחות שרגישים למחיר.","a":true,"why":"נכון. זו בדיוק <b>מנהיגות בעלות</b> (או מנהיגות בעלות ממוקדת, אם פונים לפלח צר): הפירמה מוכרת מוצר או שירות במחיר אטרקטיבי יותר מהמתחרים, וכך יוצרת ערך כלכלי ללקוח הרגיש למחיר."}],"open":"kindle"},{"id":"sample2","title":"מבחן לדוגמה 2 (גרסה נוספת)","note":"הגרסה השנייה של המבחן לדוגמה (לא פתורה במקור; פתרנו לפי חומר המרצים). שאלה ב4 סומנה בה ״לא לבחינה״ – השארנו אותה לתרגול.","mc":[{"id":"x2-1","q":"מודל חמשת הכוחות של פורטר (Porter) משמש בעיקר כדי:","o":["לנתח את הסביבה הפנימית של הפירמה – המשאבים והיכולות שלה","להחליט אילו שינויים צריך לעשות במבנה הארגוני של היחידה העסקית","לקבוע את היעדים ארוכי-הטווח של הפירמה","לבדוק את כושר התחרות של פירמה אחת מסוימת","לבחון עד כמה אטרקטיבי הענף שבו הפירמה פועלת, או ענף שהיא שוקלת להיכנס אליו"],"a":4,"why":"חמשת הכוחות הוא כלי לניתוח <b>סביבת הענף</b> (הסביבה החיצונית): כניסת מתחרים חדשים, יריבות פנימית בענף, כוח המיקוח של הלקוחות, כוח המיקוח של הספקים ומוצרים תחליפיים. ככל שעוצמת הכוחות יחד גבוהה יותר – הענף פחות אטרקטיבי ופוטנציאל הרווח בו נמוך יותר. לכן אפשר להפעיל אותו גם על ענף שהפירמה עדיין לא נמצאת בו ורק שוקלת להיכנס אליו.","w":["ניתוח פנימי עושים בכלים כמו שרשרת ערך ו-VRIN; חמשת הכוחות מסתכל על הענף מבחוץ.","המבנה הארגוני אינו נושא המודל – המודל עוסק בכוחות התחרותיים בענף.","יעדים נגזרים מהחזון; חמשת הכוחות רק נותן מידע על הענף ואינו כלי לקביעת יעדים.","המודל בוחן את הענף כולו ולא פירמה בודדת; כושר התחרות של פירמה נבדק בניתוח הסביבה הפנימית שלה.",""]},{"id":"x2-2","q":"איזה משפט <b>אינו נכון</b> לגבי יעדים של פירמה?","o":["יעד טוב הופך את החזון של הפירמה למשהו מעשי ומוחשי","יעד טוב הוא יעד שאין צורך לעדכן אותו כל שנה עד שלוש שנים","ליעד טוב יש מסגרת זמן מוגדרת","יעד טוב הוא יעד שאפשר למדוד","יעד טוב מאתגר את הפירמה, אבל עדיין ריאלי"],"a":1,"why":"יעד טוב בנוי לפי עקרונות SMART: ספציפי, מדיד, בר-השגה, ריאלי ותחום בזמן, והוא מתרגם את החזון לביטוי מעשי. הסביבה העסקית משתנה כל הזמן, ולכן <b>צריך לעדכן את היעדים בכל 1–3 שנים</b>. המשפט שטוען שיעד טוב לא צריך עדכון הוא המשפט השגוי.","w":["זה משפט נכון – זה בדיוק תפקיד היעד: לתרגם את החזון לביטוי מעשי.","","זה משפט נכון – מסגרת זמן היא ה-T ב-SMART (Time).","זה משפט נכון – מדידות היא ה-M ב-SMART (Measurable); בלי מדידה אי אפשר לדעת אם היעד הושג.","זה משפט נכון – יעד צריך לאתגר אבל להיות בר-השגה וריאלי (A ו-R ב-SMART)."]},{"id":"x2-3","q":"מה ההבדל בין החזון של פירמה לבין מהות העסק שלה?","o":["מהות העסק מגדירה באילו תחומים הפירמה פועלת, והחזון מתאר את העתיד ואת הכיוון שאליו הפירמה רוצה להגיע","מהות העסק היא הגדלת נתח השוק, והחזון עוסק בהשגת רווחים","מהות העסק עוסקת בשאלה איך לרצות את בעלי המניות, והחזון מסביר איך לספק את רצונות הלקוחות","תשובות א, ג נכונות","תשובות א, ב, ג נכונות"],"a":0,"why":"<b>מהות העסק</b> עונה על השאלה ״מה אנחנו עושים היום?״ – באילו תחומים, לאילו לקוחות ובאילו מוצרים הפירמה פועלת (הווה). <b>החזון</b> עונה על השאלה ״לאן אנחנו רוצים להגיע?״ – תמונת העתיד והכיוון של הפירמה. לכן ההבדל הוא הווה מול עתיד, ורק א מתאר אותו נכון.","w":["","נתח שוק ורווחים הם יעדים (מדידים), לא מהות העסק ולא החזון.","מהות העסק לא מוגדרת לפי בעלי המניות, והחזון לא מוגדר רק לפי הלקוחות – ההבדל ביניהם הוא הווה מול עתיד.","משפט ג אינו נכון, ולכן התשובה שגויה.","משפטים ב ו-ג אינם נכונים, ולכן התשובה שגויה."]},{"id":"x2-4","q":"במקרים רבים אפשר לומר ש:","o":["תוצאות פיננסיות טובות היום יכולות להעיד על החלטות אסטרטגיות ופעולות נכונות שנעשו בעבר","בחברות פרטיות היעדים הפיננסיים חשובים יותר מהיעדים האסטרטגיים","בחברה שעומדת על סף פשיטת רגל, היעדים הפיננסיים חשובים יותר מהיעדים האסטרטגיים","תשובות א, ג נכונות","תשובות א, ב, ג נכונות"],"a":3,"why":"החלטות אסטרטגיות מבשילות לאורך זמן, ולכן רווחיות טובה היום היא לרוב פרי של אסטרטגיה נכונה בעבר (א נכון). כשהחברה על סף פשיטת רגל צריך קודם כול לשרוד – תזרים מזומנים והחזר חובות – ולכן היעדים הפיננסיים קודמים (ג נכון). אין כלל שלפיו בחברה פרטית יעדים פיננסיים חשובים יותר, ולכן ב אינו נכון.","w":["משפט א נכון, אבל גם משפט ג נכון – לכן צריך לבחור בתשובה שכוללת את שניהם.","אין כלל כזה: גם חברה פרטית צריכה יעדים אסטרטגיים (נתח שוק, חדשנות, מוניטין) לצד יעדים פיננסיים.","משפט ג נכון, אבל גם משפט א נכון – לכן צריך לבחור בתשובה שכוללת את שניהם.","","התשובה כוללת את משפט ב, שאינו נכון – סוג הבעלות (פרטית או ציבורית) לא קובע שיעדים פיננסיים חשובים יותר."]},{"id":"x2-5","q":"מה החיסרון הבולט ביותר של האסטרטגיה המשולבת (מנהיגות בעלות + בידול, Best-cost)?","o":["קל להעתיק אותה","הנישה עלולה להפוך לאטרקטיבית ולמשוך מתחרים גדולים","צריך להשקיע הרבה כסף בחינוך השוק","בעיית תת-מיצוב","אף תשובה אינה נכונה"],"a":3,"why":"באסטרטגיה המשולבת הפירמה מציעה ערך טוב (איכות ותכונות) במחיר נמוך מזה של המבדלים. הסכנה המרכזית היא <b>תת-מיצוב</b>: הלקוחות לא מבינים בבירור במה הפירמה מיוחדת – היא לא הכי זולה וגם לא הכי ייחודית, והמיצוב שלה בראש הלקוח מטושטש. במקרה הקיצוני היא נעשית ״תקועה באמצע״ (Stuck in the middle) – בין מנהיג העלות לבין המבדל.","w":["סיכון ההעתקה קיים כמעט בכל אסטרטגיה (בעיקר בבידול ובמנהיגות בעלות); הוא לא החיסרון הייחודי לאסטרטגיה המשולבת.","זה סיכון של אסטרטגיה <b>ממוקדת</b> (נישה): אם הנישה רווחית, שחקנים גדולים נכנסים אליה.","חינוך שוק יקר מאפיין פירמה חלוצה שפותחת שוק חדש (למשל באוקיינוס כחול), לא את האסטרטגיה המשולבת.","","יש תשובה נכונה – תת-מיצוב (ד) הוא החיסרון הבולט של האסטרטגיה המשולבת."]},{"id":"x2-6","q":"פירמה מבצעת פעילות שחשובה לתחרותיות שלה טוב יותר מהפעילויות האחרות שהיא עצמה מבצעת. מה אפשר לומר שיש לה?","o":["שרשרת ערך יעילה ויכולת טובה להטמיע את האסטרטגיה שבחרה","יכולת ייחודית","יכולת ליבה","יתרון תחרותי בר-קיימא","אף תשובה אינה נכונה"],"a":2,"why":"<b>יכולת ליבה</b> (Core competence) היא פעילות חשובה לתחרותיות שהפירמה עושה טוב יותר <b>מהפעילויות האחרות שלה</b> – ההשוואה היא פנימית. <b>יכולת ייחודית</b> (Distinctive competence) היא פעילות שהפירמה עושה טוב יותר <b>מהמתחרים</b> – ההשוואה היא חיצונית. בשאלה ההשוואה היא לפעילויות האחרות של הפירמה, ולכן זו יכולת ליבה.","w":["שרשרת ערך יעילה מתארת את כל הפעילויות יחד; השאלה מתארת פעילות אחת שבולטת לעומת שאר הפעילויות של הפירמה.","יכולת ייחודית נמדדת מול <b>המתחרים</b>, ובשאלה ההשוואה היא לפעילויות האחרות של הפירמה עצמה.","","יתרון בר-קיימא דורש משאב שעונה על כל ארבעת תנאי VRIN (בעל ערך, נדיר, יקר לחיקוי, ללא תחליף) – הרבה יותר מפעילות שנעשית טוב.","יש תשובה נכונה – זו בדיוק ההגדרה של יכולת ליבה."]},{"id":"x2-7","q":"ידיעה מ״גלובס״ (2014): הפטנט על הקופקסון של טבע – התרופה הנמכרת בעולם לטרשת נפוצה – עומד לפקוע בארה״ב, ותחרות של תרופות גנריות צפויה לפגוע ברווחים. טבע קיבלה אישור לגרסה חדשה במינון כפול שניתנת שלוש פעמים בשבוע במקום כל יום, והיא פועלת להעביר את המטופלים לגרסה החדשה. מה נכון לגבי המהלך?","o":["טבע האריכה את שלב ההנאה מהיתרון התחרותי (״הארכת חיי המוצר״) בעזרת השקעה בטכנולוגיה ושיפור המוצר","טבע נקטה באסטרטגיית ״עיצוב דומיננטי״","טבע נקטה בחדשנות משבשת","טבע נקטה באסטרטגיית אוקיינוס כחול","טבע יישמה אסטרטגיית מנהיגות בעלות"],"a":0,"why":"לפי <b>מודל בנייה, הנאה ושחיקה</b> של יתרון תחרותי: טבע בנתה יתרון (פטנט), נהנתה ממנו שנים, ועם פקיעת הפטנט מתחילה השחיקה – כניסת גנריקה. הגרסה במינון כפול היא שיפור מוצר שמבוסס על השקעה בטכנולוגיה, ומטרתה <b>להאריך את שלב ההנאה</b> מהיתרון: מטופלים שעברו לגרסה החדשה לא עוברים בקלות לגנרי של הגרסה הישנה.","w":["","עיצוב דומיננטי הוא הסטנדרט שכל הענף מתיישר לפיו אחרי תקופת ניסויים; כאן זה שיפור של מוצר אחד כדי להתגונן מגנריקה.","חדשנות משבשת מתחילה במוצר זול ופשוט שפונה ללקוחות שהשוק הזניח; כאן זו גרסה משופרת של מוצר מוביל ללקוחות הקיימים.","אוקיינוס כחול הוא יצירת שוק חדש בלי מתחרים; טבע נשארת באותו שוק טרשת נפוצה ונלחמת על הלקוחות הקיימים.","המהלך לא נועד להוריד עלויות או מחיר – הוא שיפור מוצר שמבדל אותו מהגנריקה הזולה."]},{"id":"x2-8","q":"איזה משפט <b>נכון</b> לגבי מיפוי קבוצות אסטרטגיות?","o":["גודל כל עיגול במפה משקף את נתח השוק של הקבוצה האסטרטגית","המתאם (הקשר) בין שני הקריטריונים שעל הצירים צריך להיות חזק","אין קשר בין המרחק בין העיגולים במפה לבין עוצמת התחרות בין הקבוצות האסטרטגיות","תשובות א, ג נכונות","תשובות א, ב, ג נכונות"],"a":0,"why":"גודל העיגול משקף את חלקה של הקבוצה בענף – נתח השוק שלה מהכנסות הענף (א נכון). הצירים צריכים להיות <b>בעלי מתאם נמוך</b> (ב לא נכון). ככל ששתי קבוצות <b>קרובות יותר</b> במפה, הן פונות ללקוחות דומים והתחרות ביניהן חזקה יותר – לכן יש קשר בין המרחק לעוצמת התחרות (ג לא נכון).","w":["","הפוך: מתאם חזק בין הצירים הופך את המפה לחסרת תועלת – הקבוצות פשוט מסתדרות על קו אלכסוני.","יש קשר: קבוצות שקרובות זו לזו במפה מתחרות זו בזו חזק יותר מקבוצות רחוקות.","משפט ג אינו נכון, ולכן התשובה שגויה.","משפטים ב ו-ג אינם נכונים, ולכן התשובה שגויה."]},{"id":"x2-9","q":"התחרות <b>בתוך</b> קבוצה אסטרטגית היא בדרך כלל:","o":["חריפה יותר מהתחרות בין קבוצות אסטרטגיות שונות","פחות חריפה מהתחרות בין קבוצות אסטרטגיות שונות","זהה לתחרות בין הקבוצות האסטרטגיות","חלשה מאוד ברוב המקרים","חסרת השפעה על הרווחיות של הענף"],"a":0,"why":"קבוצה אסטרטגית היא קבוצת פירמות בענף שנוקטות אסטרטגיה דומה – מחיר, איכות, מגוון, ערוצי הפצה. הן פונות לאותם לקוחות עם הצעה דומה, ולכן הן <b>המתחרות הקרובות ביותר</b> זו של זו, והתחרות ביניהן חריפה יותר מהתחרות מול קבוצות אחרות.","w":["","הפוך – פירמות מקבוצות שונות פונות ללקוחות שונים ולכן מתחרות זו בזו פחות.","התחרות לא זהה: בתוך הקבוצה ההצעות דומות והלקוחות משותפים, ולכן התחרות חזקה יותר.","דווקא בתוך הקבוצה התחרות חזקה – אלה המתחרים הישירים.","התחרות בתוך הקבוצות היא חלק מה״יריבות הפנימית בענף״ ולכן משפיעה על הרווחיות."]},{"id":"x2-10","q":"איזה מהבאים <b>אינו</b> סיכון של אסטרטגיית בידול?","o":["הלקוחות עלולים לחשוב שהמחיר גבוה מדי לעומת המחירים של חברות שנוקטות מנהיגות בעלות","הלקוחות עלולים לא לתפוס את המוצר כבעל ערך גבוה מספיק","יש בשוק זיופים רבים של המוצרים שהלקוחות רוצים","הספקים עלולים לשחוק את הרווחים של החברה על ידי העלאת מחירים","המתחרים עלולים לחקות את התכונה הייחודית עד שהבידול נשחק"],"a":3,"why":"הסיכונים של בידול קשורים ל<b>תפיסת הערך הייחודי</b> אצל הלקוח: פער מחיר גדול מדי מול מנהיגי עלות, ערך שהלקוח לא מרגיש, וזיופים או חיקויים ששוחקים את הייחודיות. העלאת מחירים על ידי ספקים היא עניין של <b>כוח המיקוח של הספקים</b> (חמשת הכוחות) ופוגעת בכל פירמה בענף, ולא סיכון שנובע מהבחירה בבידול.","w":["זה סיכון של בידול – אם הפרמיה גבוהה מדי, הלקוחות עוברים לחלופה הזולה.","זה סיכון של בידול – הייחודיות שווה רק אם הלקוח מרגיש אותה ומוכן לשלם עליה.","זה סיכון של בידול – זיופים פוגעים בתדמית ובבלעדיות של המותג.","","זה סיכון של בידול – חיקוי מבטל את הייחודיות שעליה נשענת האסטרטגיה."]}],"tf":[{"id":"x2-t1","s":"ככל שהכניסה לענף דורשת השקעה ראשונית גבוהה יותר, כך האיום של ״כניסת מתחרים חדשים״ חזק יותר.","a":false,"why":"לא נכון – ההפך. השקעה ראשונית גבוהה היא <b>חסם כניסה</b>: פחות פירמות יכולות לממן אותה, ולכן האיום של כניסת מתחרים חדשים <b>חלש יותר</b>."},{"id":"x2-t2","s":"מודל TOWS מתייחס, בין השאר, גם לפער בין היכולות שיש היום לפירמה לבין היכולות שהיא צריכה כדי לנצל הזדמנויות בשוק.","a":true,"why":"נכון. TOWS נבנה על ניתוח SWOT (חוזקות וחולשות בתוך הפירמה, הזדמנויות ואיומים מחוצה לה) ומגבש אסטרטגיה על ידי <b>שילוב של כל גורם פנימי עם כל גורם חיצוני</b>. למשל בתא WO (חולשה מול הזדמנות) הפירמה בונה את היכולת החסרה כדי לנצל הזדמנות – זה ניתוח פערי יכולות."},{"id":"x2-t3","s":"פירמה לא יכולה ליהנות מיתרון תחרותי אם היא לא מורידה את העלויות שלה באופן משמעותי.","a":false,"why":"לא נכון. הורדת עלויות היא רק דרך אחת (מנהיגות בעלות). אפשר להשיג יתרון גם בעזרת <b>תועלת ייחודית</b> ללקוח – איכות, שירות, זמינות, חדשנות (בידול), או בעזרת <b>אוקיינוס כחול</b> – פנייה לשוק חדש שהמתחרים עוד לא פנו אליו."},{"id":"x2-t4","s":"מפתחות ההצלחה בענף (KSF) מגדירים אילו מוצרים ושירותים הפירמה מציעה בענף שבו היא פועלת.","a":false,"why":"לא נכון. KSF הם <b>תחומי הפעילות שכל פירמה בענף חייבת להיות טובה בהם</b> כדי להצליח לאורך זמן – בדרך כלל 3–4 לענף, והם משתנים מעת לעת. הפירמה צריכה להיות טובה בכולם ולהצטיין לפחות באחד כדי ליהנות מיתרון בר-קיימא; סל המוצרים הוא החלטה של הפירמה, לא KSF של הענף."},{"id":"x2-t5","s":"אפשר להשיג יתרון תחרותי על ידי יצירת ערך כלכלי, שמוגדר בעזרת שני גורמים: ערך ועלות.","a":true,"why":"נכון. <b>ערך כלכלי = הערך (התועלת) שהלקוח תופס פחות העלות</b> של הפירמה לייצר את המוצר. פירמה שיוצרת ערך כלכלי גבוה מהמתחרים – בהעלאת הערך (בידול) או בהורדת העלות (מנהיגות בעלות) – נהנית מיתרון תחרותי."}],"open":"kindle"}],"open":[{"id":"kindle","title":"אמזון וה-Kindle: ספר בלי נייר","text":"ב-2007 השיקה אמזון את הקורא האלקטרוני Kindle, ומה שנראה בהתחלה כגימיק חולף הפך למגמה שמשפיעה עמוקות על ענף הספרים המסורתי. לפי הנתונים, בעלי Kindle קונים כ-60% יותר ספרים דיגיטליים מכמות הספרים המודפסים שקנו לפני שהיה להם המכשיר. כבר ב-2008 היוו הספרים הדיגיטליים שנמכרו לבעלי Kindle כעשירית מכל הספרים שמכר אתר הסחר המקוון הגדול בעולם. לפי התחזיות, עד 2027 יגיע נתח הספרים האלקטרוניים לכ-32.1% משוק הספרים העולמי. לפני ההשקה השקיעה אמזון כמה שנים בהכנת תשתית: היא סרקה יותר מ-90 אלף ספרים כדי ליצור סינרגיה בין המכשיר לבין חנות הספרים הדיגיטלית, וכיום היא סורקת כל רב-מכר חדש. אנליסטים מציינים שהיתרון הבולט של Kindle הוא הורדה אלחוטית של ספרים, שיוצרת ״מרחב תחרותי חדש״. לספר הדיגיטלי יתרונות רבים: מחירו נמוך יותר, אפשר לקרוא פרק ראשון בחינם, לקנות בכל מקום שיש בו אינטרנט אלחוטי בלי ללכת לחנות, ולשאת ספרייה שלמה בלי מקום אחסון. אפשר לקרוא מכמה מכשירים, להגדיל את הגופן לפי הצורך, והמוצר חוסך נייר. חנויות ורשתות הספרים רואות בספרים האלקטרוניים איום ממשי. בזירת הספרים האלקטרוניים מתחרות באמזון חברות כמו סוני, סמסונג, קובו, אפל וגוגל. למרות זאת, אמזון מחזיקה בכ-80% משוק הספרים האלקטרוניים.","qs":[{"q":"נעמה טוענת שה-Kindle הוא דוגמה לחדשנות משבשת (Disruptive Innovation). האם נעמה צודקת או טועה? נמקי תוך הסבר מאפייני סוג חדשנות זה (אפשר להיעזר בתרשים).","model":"<b>נעמה טועה</b> – לפחות בשלב זה ה-Kindle עדיין אינו חדשנות משבשת. חדשנות משבשת מתחילה במוצר <b>פחות מתקדם</b> מהקיים: זול, פשוט, ידידותי למשתמש ו״בלי קישוטים״, שפונה בהתחלה ללקוחות שהשוק המוביל הזניח. עם הזמן הטכנולוגיה משתפרת (בתרשים: רמת טכנולוגיה מול זמן), המוצר החדש עולה מעלה ומושך את רוב הלקוחות של השוק המרכזי. רק כשרוב הלקוחות (יותר מ-50%) עברו לחידוש ודחקו את המוצר הישן – אפשר לומר שהחדשנות שיבשה את השוק. בכתבה אמזון אמנם מחזיקה בכ-80% משוק הספרים <b>האלקטרוניים</b>, אבל כל השוק הזה צפוי להגיע רק לכ-32.1% משוק הספרים עד 2027. כלומר, רוב הקוראים עדיין קונים ספרים מודפסים, והספר המודפס עדיין שולט בענף. לכן ה-Kindle הוא חידוש משמעותי שמאיים על חנויות הספרים, אבל הוא עדיין לא שיבש את השוק – הוא עשוי להפוך לחדשנות משבשת רק אם רוב השוק יעבור אליו.","keys":["הכרעה: טועה – עדיין לא חדשנות משבשת","מאפיינים: בהתחלה מוצר פחות מתקדם – זול, פשוט, ידידותי, ״בלי קישוטים״","המוצר משתפר עם הזמן ומושך את רוב הלקוחות (מעל 50%) – תרשים טכנולוגיה מול זמן","נתון מהכתבה: ספרים אלקטרוניים צפויים להגיע רק לכ-32.1% מהשוק עד 2027","ה-80% של אמזון הם מתוך שוק הספרים האלקטרוניים בלבד – הספר המודפס עדיין דומיננטי"]},{"q":"נתנאל טוען שהשקת ה-Kindle היא דוגמה לאסטרטגיית אוקיינוס כחול. האם נתנאל צודק או טועה? נמק תוך הסבר מהות האסטרטגיה ומאפייניה.","model":"<b>נתנאל צודק.</b> אוקיינוס כחול הוא <b>פנייה לשוק חדש</b> – מרחב שהמתחרים הקיימים בענף עוד לא פנו אליו – במקום להילחם על הלקוחות הקיימים באוקיינוס האדום. מאפייני האוקיינוס הכחול: יוצרים נישת שוק בלי מתחרים, הופכים את המתחרים ללא רלוונטיים, יוצרים ולוכדים ביקוש חדש, ו״שוברים״ את שקלול התמורות בין ערך לעלות – מציעים יותר ערך בעלות נמוכה. באוקיינוס האדום, לעומת זאת, מתחרים בשוק הקיים, מנסים לנצח את המתחרים, מנצלים את הביקוש הקיים ובוחרים בין ערך לעלות. בכתבה האנליסטים מתארים במפורש ״מרחב תחרותי חדש״ שנוצר בזכות הורדה אלחוטית של ספרים – שוק שהחנויות והרשתות לא פנו אליו. אמזון יצרה ביקוש חדש: בעלי Kindle קונים כ-60% יותר ספרים מבעבר. היא גם שברה את שקלול התמורות: הספר זול יותר, ובכל זאת מציע ערך גבוה יותר – קנייה מיידית בכל מקום, פרק ראשון בחינם, ספרייה שלמה במכשיר אחד והגדלת גופן.","keys":["הכרעה: צודק","הגדרה: פנייה לשוק חדש שהמתחרים הקיימים טרם פנו אליו","מאפיינים: נישה בלי מתחרים, מתחרים לא רלוונטיים, יצירת ביקוש חדש, שבירת שקלול ערך–עלות","השוואה לאוקיינוס אדום","מהכתבה: ״מרחב תחרותי חדש״, 60% יותר ספרים, מחיר נמוך יותר עם ערך גבוה יותר"]}]},{"id":"wolt","title":"וולט, דורדאש ושוק המשלוחים בישראל","text":"וולט (Wolt), חברת משלוחי האוכל שנוסדה בהלסינקי ב-2014, נכנסה לישראל ב-2018 והפכה תוך שנים ספורות לשם נרדף להזמנת אוכל מהנייד. ב-2022 השלימה דורדאש (DoorDash) האמריקאית את רכישת וולט בעסקת מניות שהוערכה בעת ההכרזה בכ-8 מיליארד דולר. באמצעות הרכישה קיבלה דורדאש בבת אחת נוכחות בעשרות מדינות באירופה ובישראל, יחד עם צוות מקומי, מותג מוכר ורשת מסעדות ושליחים קיימת. בישראל מתחרה וולט בתן ביס, במשלוחה ובשירותי משלוחים של רשתות המזון עצמן. המעבר בין האפליקציות כמעט לא עולה ללקוח דבר: הוא יכול להשוות מחירים ודמי משלוח בכמה שניות. המסעדות משלמות לפלטפורמות עמלה משמעותית מכל הזמנה, ורשתות גדולות מאיימות לפתח אפליקציה ומערך שליחים משלהן. לצד זה, הקמת אפליקציה בסיסית אינה דורשת השקעה גדולה, אבל בניית רשת רחבה של מסעדות ושליחים בכל עיר לוקחת זמן וכסף. המתחרים מחלקים קופונים והנחות על דמי המשלוח כדי לשמור על הלקוחות. גם השליחים, שרובם עובדים כעצמאים, דורשים תנאים טובים יותר, והנושא מגיע מדי פעם לדיון ציבורי וחקיקתי. אנליסטים מציינים שלמרות הגידול בהזמנות, הרווחיות בענף המשלוחים נשארת נמוכה ברוב השווקים.","qs":[{"q":"משקיע טוען שענף משלוחי האוכל בישראל הוא ענף אטרקטיבי עם פוטנציאל רווח גבוה. האם הוא צודק או טועה? נמק תוך הסבר מודל חמשת הכוחות.","model":"<b>המשקיע טועה</b> – לפי חמשת הכוחות עוצמת הכוחות בענף גבוהה, ולכן הענף לא אטרקטיבי ופוטנציאל הרווח בו נמוך. מודל חמשת הכוחות של פורטר בוחן את הענף דרך כניסת מתחרים חדשים, יריבות פנימית, כוח המיקוח של הלקוחות, כוח המיקוח של הספקים ומוצרים תחליפיים; ככל שעוצמתם הכוללת גבוהה – האטרקטיביות ופוטנציאל הרווח נמוכים. <b>כוח הלקוחות גבוה</b>: עלות המעבר בין האפליקציות כמעט אפסית, והלקוח משווה מחירים בשניות. <b>יריבות פנימית חזקה</b>: כמה מתחרים דומים (וולט, תן ביס, משלוחה) שנלחמים בהנחות ובקופונים. <b>כוח הספקים</b> – המסעדות והשליחים – בינוני-גבוה: רשתות גדולות מאיימות באינטגרציה קדימה (אפליקציה ושליחים משלהן), והשליחים דורשים תנאים טובים יותר. <b>תחליפים</b> זמינים: איסוף עצמי, משלוח ישיר מהמסעדה או בישול בבית. <b>כניסת מתחרים חדשים</b> בינונית: אפליקציה קלה לבנות, אבל רשת מסעדות ושליחים ויתרון לגודל של הוותיקים הם חסם כניסה. סיכום: עוצמה כוללת גבוהה → אטרקטיביות נמוכה → פוטנציאל רווח נמוך, כמו שגם האנליסטים בכתבה מציינים.","keys":["הכרעה: טועה – ענף לא אטרקטיבי","הגדרת המודל וחמשת הכוחות; עוצמה גבוהה = אטרקטיביות ופוטנציאל רווח נמוכים","כוח לקוחות גבוה – עלות מעבר נמוכה","יריבות חזקה – מתחרים דומים, מלחמת הנחות","ספקים: איום אינטגרציה קדימה של רשתות; תחליפים: איסוף עצמי ומשלוח ישיר","סיכום לפי הסדר: עוצמה → אטרקטיביות → פוטנציאל רווח"]},{"q":"אנליסטית טוענת שדורדאש בחרה דרך כניסה מתאימה לשווקים בינלאומיים כשרכשה את וולט, במקום להיכנס לבד לכל מדינה. האם היא צודקת או טועה? נמק תוך הסבר דרכי הכניסה לשווקים בינלאומיים.","model":"<b>האנליסטית צודקת.</b> דרכי כניסה לשוק זר נבדלות ברמת השליטה, ההשקעה והסיכון: ייצוא – עלות בינונית, שליטה נמוכה, סיכון נמוך; זיכיון / רישיון (Franchising / Licensing) – עלות נמוכה, סיכון נמוך ושליטה משתנה (לפי החוזה); בריתות אסטרטגיות עם שותף מקומי – עלות ושליטה בינוניות, סיכון נמוך; רכישה או הקמת חברת בת חדשה (Greenfield) – עלות גבוהה ושליטה גבוהה, וסיכון בינוני עד גבוה. <b>רכישה</b> מאפשרת כניסה <b>מהירה</b> עם נכסים קיימים: מותג מוכר, לקוחות, ידע מקומי ורשת שותפים. בכתבה דורדאש קיבלה בבת אחת נוכחות בעשרות מדינות, צוות מקומי, מותג מוכר ורשת מסעדות ושליחים – בדיוק הנכסים שקשה ואיטי לבנות לבד (כפי שהכתבה מתארת). בענף שבו הרשת המקומית היא חסם כניסה, הרכישה חוסכת שנים ומקטינה את פערי התרבות וחוסר ההיכרות עם השוק. החסרונות: מחיר גבוה (כ-8 מיליארד דולר), סיכון בשילוב שתי החברות (תרבות ארגונית, מערכות) ובשמירה על העובדים – ולכן הרכישה מתאימה, אבל דורשת ניהול נכון של השילוב.","keys":["הכרעה: צודקת","אופני חדירה לפי עלות, שליטה וסיכון: ייצוא, זיכיון/רישיון, ברית אסטרטגית, רכישה/Greenfield","רכישה = כניסה מהירה, שליטה גבוהה, נכסים קיימים; עלות גבוהה וסיכון בינוני עד גבוה","מהכתבה: עשרות מדינות, מותג, צוות ורשת מסעדות ושליחים מוכנים","חסרונות: מחיר גבוה וסיכון בשילוב (תרבות ארגונית)"]}]},{"id":"tesla","title":"טסלה: מהשליטה בשרשרת ועד לחץ מסין","text":"טסלה, שהחלה למכור מכוניות חשמליות ב-2008, נחשבה במשך שנים למובילה הבלתי מעורערת בענף הרכב החשמלי. בשונה מיצרניות הרכב המסורתיות, טסלה שולטת בחלק גדול מהשרשרת בעצמה: היא מפתחת את התוכנה ואת מערכות הנהיגה, מייצרת סוללות במפעלי ה״גיגה-פקטורי״ שלה, ומפתחת תאי סוללה בעצמה. טסלה גם מוכרת ישירות ללקוחות דרך האתר ומרכזי תצוגה, בלי סוכנויות, ומפעילה רשת עמדות טעינה מהירה (Supercharger) משלה. שדרוגי התוכנה נשלחים לרכב ״באוויר״, בלי צורך להגיע למוסך. במשך שנים נהנתה החברה ממרווחי רווח גבוהים מהממוצע בענף, והמניה שלה הפכה את טסלה לחברת הרכב השווה בעולם. בשנים האחרונות המצב השתנה: יצרניות סיניות כמו BYD מציעות רכבים חשמליים זולים יותר, ו-BYD אף עקפה את טסלה במכירות רכבים חשמליים מלאים. ב-2023 הורידה טסלה מחירים שוב ושוב כדי לשמור על נפח המכירות, ומרווחי הרווח שלה ירדו. ב-2024 ירדו המסירות השנתיות של טסלה לראשונה מזה שנים. גם יצרניות ותיקות כמו פולקסווגן, יונדאי וג׳נרל מוטורס השיקו דגמים חשמליים רבים, ורבות מהן אימצו את תקן הטעינה של טסלה. טסלה מנסה לבנות יתרון חדש בתחומי הנהיגה האוטונומית, הרובוטים והאגירה האנרגטית.","qs":[{"q":"אנליסט טוען שטסלה נוקטת באסטרטגיה של אינטגרציה אנכית. האם הוא צודק או טועה? נמק תוך הסבר סוגי האינטגרציה, יתרונותיה וחסרונותיה.","model":"<b>האנליסט צודק.</b> אינטגרציה אנכית פירושה שהפירמה מבצעת בעצמה שלבים נוספים בשרשרת האספקה של הענף, במקום לקנות אותם מספקים או להשאיר אותם למפיצים. <b>אינטגרציה אחורה</b> – לכיוון הספקים (ייצור תשומות בעצמה); <b>אינטגרציה קדימה</b> – לכיוון הלקוח (הפצה, מכירה וש
