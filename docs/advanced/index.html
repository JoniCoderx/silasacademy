>, או ליצור <b>פתרון לצורך חדש</b> שלא היה קודם."},{"t":"list","x":["<b>צורך קיים, פתרון חדש</b>: אנשים תמיד רצו להגיע ליעד. Waze נתנה דרך חדשה לנווט.","<b>צורך חדש</b>: לפני הסמארטפון לא היה צורך ב״חנות אפליקציות״. הצורך נוצר יחד עם הפתרון.","חדשנות היא <b>לב העבודה היצירתית</b> ברוב הארגונים. היא לא שייכת רק למחלקת המו״פ."]},{"t":"p","x":"הקורס מבחין בין <b>חמישה סוגי חדשנות</b>: הדרגתית, רדיקלית, פורצת דרך, משבשת (קוטעת) וחסכנית. שלושת הראשונים מסודרים על מפה אחת (2×2). שני האחרונים מוגדרים בנפרד."},{"t":"table","head":["סוג","במשפט אחד","מילת מפתח בסיפור"],"rows":[["הדרגתית (Incremental)","שיפור קטן של מה שכבר קיים","״גרסה משופרת״, ״טעם חדש״, ״עוד תכונה״"],["רדיקלית (Radical)","מוצר חדש לגמרי, מאפס: טכנולוגיה חדשה <b>וגם</b> מודל עסקי חדש","״לא היה דבר כזה״, ״טכנולוגיה חדשה ודרך חדשה להרוויח״"],["פורצת דרך (Breakthrough)","חידוש גבוה ב<b>אחד</b> מהשניים: טכנולוגיה <b>או</b> מודל עסקי","״טכנולוגיה חדשה, נמכרת כרגיל״ או ״מודל עסקי חדש, טכנולוגיה פשוטה״"],["משבשת/קוטעת (Disruptive)","מוצר זול, פשוט, ״מספיק טוב״, שבסוף מוציא את הישנים מהשוק","״זול יותר״, ״פשוט יותר״, ״רוב הלקוחות עברו״"],["חסכנית (Frugal)","חדשנות ממשאבים מוגבלים, ״יש מאין״","״בתקציב זעום״, ״לכפרים בהודו״, ״במחיר נמוך מאוד״"]]},{"t":"exam","x":"כמעט כל שאלה ביחידה הזו היא <b>סיפור קצר על חברה ← איזה סוג חדשנות זה?</b> הדרך הבטוחה: לשאול שתי שאלות על המפה (כמה חידוש טכנולוגי? כמה חידוש במודל העסקי?), ואז לבדוק את הסימנים של משבשת ושל חסכנית."},{"t":"h","x":"מפת סוגי החדשנות: חידוש טכנולוגי × חדשנות במודל העסקי"},{"t":"p","x":"המפה מצליבה שני צירים: <b>הציר האנכי = רמת החידוש הטכנולוגי</b> (נמוכה/גבוהה). <b>הציר האופקי = רמת החדשנות במודל העסקי</b> (נמוכה/גבוהה). כך מתקבלות ארבע משבצות."},{"t":"table","head":["","מודל עסקי: חידוש <b>נמוך</b>","מודל עסקי: חידוש <b>גבוה</b>"],"rows":[["טכנולוגיה: חידוש <b>גבוה</b>","<b>פורצת דרך</b> (Breakthrough)","<b>רדיקלית</b> (Radical)"],["טכנולוגיה: חידוש <b>נמוך</b>","<b>הדרגתית</b> (Incremental)","<b>פורצת דרך</b> (Breakthrough)"]]},{"t":"p","x":"שימו לב: <b>פורצת דרך מופיעה בשתי משבצות</b>, על האלכסון. היא תמיד ״גבוה באחד, נמוך בשני״:"},{"t":"list","x":["טכנולוגיה <b>גבוהה</b> + מודל עסקי <b>קיים</b> ← פורצת דרך.","מודל עסקי <b>חדשני</b> + טכנולוגיה <b>ברמה נמוכה</b> (פשוטה, מוכרת) ← פורצת דרך.","נמוך + נמוך ← הדרגתית. גבוה + גבוה ← רדיקלית."]},{"t":"trap","x":"בספרים אחרים (למשל במטריצה של Satell) המשבצת ״מודל עסקי חדש + טכנולוגיה קיימת״ נקראת ״משבשת״. <b>בקורס הזה</b> היא נקראת <b>פורצת דרך</b>. במבחן עונים לפי הקורס. חדשנות משבשת מוגדרת בקורס בנפרד, לפי מה שקורה ללקוחות בשוק (מעל 50% עוברים)."},{"t":"trap","x":"טעות נפוצה: ״טכנולוגיה חדשה מאוד = רדיקלית״. לא בהכרח. אם המודל העסקי נשאר אותו דבר (מוכרים באותה דרך, לאותם לקוחות), זו <b>פורצת דרך</b>. רדיקלית דורשת <b>גם</b> וגם."},{"t":"exam","x":"כשמופיע סיפור, סמנו לעצמכם: טכנולוגיה – גבוה/נמוך? מודל עסקי – גבוה/נמוך? ואז קראו את התשובה מהטבלה. שאלה ישירה נפוצה: ״באילו משבצות מופיעה חדשנות פורצת דרך?״ ← בשתיים."},{"t":"h","x":"חדשנות הדרגתית (Incremental Innovation)"},{"t":"p","x":"<b>חדשנות הדרגתית</b> (נקראת גם <b>מצרפית</b>) היא <b>שיפור, ייעול והוספת פתרונות</b> על בסיס <b>ידע שכבר יש</b> לחברה. החידוש הטכנולוגי נמוך, והמודל העסקי כמעט לא משתנה."},{"t":"list","x":["זה הסוג הנפוץ ביותר. רוב החדשנות בחברות היא הדרגתית.","סיכון נמוך: החברה יודעת לייצר, יודעת למכור, ומכירה את הלקוחות.","מטרה: לשמור על הלקוחות הקיימים ולהישאר רלוונטיים מול המתחרים."]},{"t":"example","x":"חברת החטיפים CrunchCo מוסיפה לסדרת הצ׳יפסים שלה טעם חדש של צ׳ילי-לימון. אותו מפעל, אותן חנויות, אותם לקוחות. ← <b>הדרגתית</b>. כך גם אייפון חדש עם מצלמה טובה יותר וסוללה חזקה יותר.","title":"דוגמה"},{"t":"trap","x":"״חדשנות הדרגתית״ היא עדיין חדשנות. היגד כמו ״שיפור מוצר קיים אינו נחשב חדשנות״ הוא <b>לא נכון</b>."},{"t":"h","x":"חדשנות רדיקלית (Radical Innovation)"},{"t":"p","x":"<b>חדשנות רדיקלית</b> היא <b>פיתוח מוצר חדש לחלוטין, מאפס</b>. יש בה <b>חידוש טכנולוגי גבוה</b> וגם <b>שינוי רדיקלי במודל העסקי</b>: איך מרוויחים, למי מוכרים ואיך מספקים."},{"t":"list","x":["סיכון גבוה והשקעה גבוהה, אבל גם פוטנציאל לשוק חדש לגמרי.","לרוב יוצרת קטגוריה חדשה של מוצרים."]},{"t":"example","x":"חברת SkyHop מפתחת מונית אווירית חשמלית ללא טייס (טכנולוגיה חדשה). היא לא מוכרת את הכלי, אלא מוכרת נסיעות דרך אפליקציה במנוי חודשי (מודל עסקי חדש). ← <b>רדיקלית</b>: גבוה בשני הצירים.","title":"דוגמה"},{"t":"trap","x":"אם הסיפור מדגיש רק טכנולוגיה חדשה, ואין שינוי בדרך שבה מוכרים ומרוויחים, זו לא רדיקלית אלא פורצת דרך."},{"t":"h","x":"חדשנות פורצת דרך (Breakthrough Innovation)"},{"t":"p","x":"<b>חדשנות פורצת דרך</b> נוצרת כשיש חידוש גבוה ב<b>ציר אחד בלבד</b>. יש לה שתי צורות:"},{"t":"table","head":["צורה","טכנולוגיה","מודל עסקי","דוגמה"],"rows":[["1. טכנולוגיה מתקדמת במודל ישן","<b>גבוהה</b>","קיים (נמוך)","MediScan מפתחת מכשיר הדמיה חדש לגמרי, ומוכרת אותו לבתי חולים בדיוק כמו שמכרה מכשירים קודמים: מכירה + חוזה שירות"],["2. מודל עסקי חדש בטכנולוגיה פשוטה","נמוכה","<b>גבוה</b>","DressLoop מציעה השכרת שמלות ערב במנוי חודשי דרך אתר רגיל. אין טכנולוגיה חדשה, אבל הדרך להרוויח חדשה"]]},{"t":"example","x":"רשת חדרי כושר FitBox עוברת ממנוי שנתי יקר לתשלום לפי שימוש, ופותחת מועדונים קטנים ללא צוות. הציוד והמערכות רגילים. ← מודל עסקי חדשני + טכנולוגיה נמוכה ← <b>פורצת דרך</b>.","title":"סיפור"},{"t":"trap","x":"מסיח נפוץ: ״מודל עסקי חדש בלי טכנולוגיה חדשה = הדרגתית״. לא. הדרגתית היא נמוך <b>בשני</b> הצירים. כאן המודל העסקי השתנה מאוד."},{"t":"h","x":"חדשנות משבשת/קוטעת (Disruptive Innovation)"},{"t":"p","x":"<b>חדשנות משבשת</b> (נקראת גם <b>קוטעת</b>; Disruptive Innovation) היא תהליך שבו מוצר, שירות או טכנולוגיה חדשים <b>משנים את כללי המשחק</b> בשוק. הם יוצרים שוק חדש, ובסוף התהליך <b>דוחקים החוצה</b> את החברות של המוצרים המסורתיים. את המושג פיתח <b>קלייטון כריסטנסן (Christensen)</b> מהרווארד."},{"t":"p","x":"<b>הכלל של הקורס:</b> כאשר <b>מעל 50% מהלקוחות</b> עוברים לטכנולוגיה החדשה, המצב נחשב חדשנות משבשת."},{"t":"steps","x":["בהתחלה המוצר החדש <b>פחות מתוחכם</b> מהמוצר הקיים. החברות הוותיקות מזלזלות בו.","הוא <b>זול, פשוט, ידידותי ונגיש</b>, בלי ״קישוטים״ מיותרים. הוא פונה ללקוחות שהשוק הקיים זונח: לקוחות <b>בשולי השוק (Low-end)</b>, או לקוחות <b>חדשים</b> שלא קנו קודם בכלל.","עם הזמן הטכנולוגיה החדשה משתפרת ונעשית <b>״מספיק טובה״</b> לרוב הלקוחות.","הלקוחות עוברים בהמוניהם. כשמעל 50% עברו ← השוק התהפך, וגם ענקים יכולים ליפול."],"title":"איך זה קורה (הגרף של כריסטנסן: רמת טכנולוגיה × זמן)"},{"t":"list","x":["<b>בהתחלה</b>: פחות חדשני, זול, פשוט, נוח.","<b>קהל</b>: לקוחות חדשים או לקוחות בתחתית השוק.","<b>בסוף</b>: השוק הישן מאבד רלוונטיות."]},{"t":"example","x":"בהתחלה Waze הייתה אפליקציה חינמית, פשוטה, שמבוססת על נהגים שמדווחים. מכשירי ה-GPS הייעודיים היו מדויקים ויקרים. עם הזמן Waze השתפרה, ורוב הנהגים הפסיקו לקנות מכשיר GPS. ← <b>משבשת</b>.","title":"Waze"},{"t":"trap","x":"חדשנות משבשת היא <b>לא</b> ״הטכנולוגיה הכי מתקדמת״. בדרך כלל היא דווקא <b>פשוטה וזולה יותר</b> בהתחלה. מי שבוחר ״משבשת״ רק כי הטכנולוגיה מרשימה – טועה."},{"t":"trap","x":"מוצר זול ופשוט שרק 10%–20% מהלקוחות עברו אליו עדיין <b>לא</b> נחשב משבש לפי כלל הקורס. צריך <b>מעל 50%</b>."},{"t":"exam","x":"סימנים בסיפור: ״זול״, ״פשוט״, ״בהתחלה פחות טוב״, ״לקוחות שלא יכלו להרשות לעצמם״, ״החברות הוותיקות זלזלו״, ״רוב הלקוחות עברו״, ״החברה הוותיקה פשטה רגל״."},{"t":"p","x":"<b>ההגדרה של המרצה</b> (כך כותבים בתשובה פתוחה): חדשנות משבשת <b>מולידה בתחילת דרכה מוצרים פחות חדשניים</b>. בזמן שהיא מתהווה, היא מפתחת לרוב מוצרים <b>זולים</b>, <b>פשוטים וידידותיים</b>, <b>חפים מ“קישוטים”</b>. היא נחשבת משבשת רק כאשר <b>רוב הלקוחות (מעל 50%)</b> עברו אליה. בתרשים: ציר אנכי = <b>רמת טכנולוגיה</b>, ציר אופקי = <b>זמן</b>; הקו של המוצר החדש מתחיל נמוך ומטפס עד שהוא “מספיק טוב” לרוב השוק."},{"t":"h","x":"השוואה: חדשנות הדרגתית מול חדשנות משבשת"},{"t":"table","head":["מאפיין","חדשנות הדרגתית (Incremental)","חדשנות משבשת (Disruptive)"],"rows":[["מהות השינוי","שיפורים קטנים והמשכיות של מוצר קיים","מוצר חדש או מודל עסקי חדש לחלוטין"],["קהל היעד","הלקוחות הקיימים בשוק המרכזי","לקוחות חדשים או לקוחות בשולי השוק (Low-end)"],["רמת מחיר","דומה או יקרה יותר (תמורת איכות גבוהה יותר)","בדרך כלל זולה ונגישה מאוד בהתחלה"],["השפעה על השוק","שומרת על יציבות השוק ומחזקת את המובילים","הופכת את השוק הישן ללא רלוונטי ומפילה ענקים"]]},{"t":"example","x":"Kodak שיפרה כל שנה את הפילם שלה: צבעים טובים יותר, מחיר דומה, לאותם לקוחות ← <b>הדרגתית</b>. המצלמה הדיגיטלית הייתה בהתחלה באיכות נמוכה, אבל נוחה ובלי עלות פיתוח. כשרוב הצלמים עברו אליה, Kodak קרסה ← <b>משבשת</b>.","title":"אותו ענף, שני סוגים"},{"t":"trap","x":"שאלה נפוצה: ״מי מחזקת את מובילי השוק?״ ← הדרגתית. ״מי פונה ללקוחות Low-end?״ ← משבשת. אל תהפכו."},{"t":"h","x":"דוגמאות לחדשנות משבשת"},{"t":"table","head":["טכנולוגיה משבשת (החדשה)","טכנולוגיה משובשת (הישנה שנדחקה)"],"rows":[["טלפון נייד","טלפון קווי"],["ויקיפדיה","אנציקלופדיה מודפסת"],["מצלמה דיגיטלית (מצלמת סטילס)","מצלמת פילם"],["קנייה אינטרנטית","קנייה בספרים/בחנויות (בסימן שאלה)"]]},{"t":"p","x":"<b>משבשת</b> = החדשה שתוקפת. <b>משובשת</b> = הישנה שנפגעה. בזוג האחרון הסיכום שם <b>סימן שאלה</b>: עדיין לא ברור שרוב הקונים עזבו את החנויות הפיזיות, ולכן לפי כלל ה-50% זה שנוי במחלוקת."},{"t":"example","x":"בהתחלה ויקיפדיה נחשבה פחות אמינה מאנציקלופדיה בריטניקה. אבל היא חינמית, זמינה תמיד ומתעדכנת מהר. רוב האנשים עברו אליה, והאנציקלופדיה המודפסת הפסיקה לצאת. ← משבשת.","title":"ויקיפדיה"},{"t":"trap","x":"שימו לב לכיוון בשאלה: ״איזו טכנולוגיה <b>משובשת</b> בזוג נייד–קווי?״ ← הטלפון ה<b>קווי</b>."},{"t":"h","x":"משבשת או לא? מקרה ה-Kindle לפי המרצה"},{"t":"p","x":"במבחן לדוגמה יש כתבה על ה-<b>Kindle</b> של אמזון (הושק ב-2007), והשאלה: “X טוען שה-Kindle הוא חדשנות משבשת – האם צודק?” הנתונים בכתבה: אמזון שולטת בכ-<b>80% משוק הספרים האלקטרוניים</b>; אבל התחזית היא ששוק הספרים האלקטרוניים יגיע לכ-<b>32.1% בלבד מכלל שוק הספרים עד 2027</b>."},{"t":"steps","x":["<b>מאפיינים</b>: חדשנות משבשת מולידה בהתחלה מוצרים פחות חדשניים – זולים, פשוטים, ידידותיים, בלי קישוטים – ונחשבת משבשת כשמעל 50% מהלקוחות עברו.","<b>איזה נתון בודקים?</b> לא את נתח השוק של אמזון <b>בתוך</b> הספרים האלקטרוניים (80%), אלא את החלק של <b>הטכנולוגיה החדשה מכלל השוק</b> – כמה מקוראי הספרים עברו.","<b>הנתון</b>: גם לפי התחזית, ספרים אלקטרוניים יגיעו רק ל-32.1% עד 2027. כלומר <b>שוק הספרים המודפסים עדיין נחלת הרבים</b>.","<b>מסקנה</b>: פחות מ-50% עברו ← ה-Kindle <b>אינו (עדיין)</b> חדשנות משבשת. הטוען <b>טועה</b> (לפחות נכון להיום)."],"title":"כך בונים את התשובה"},{"t":"table","head":["נתון בכתבה","מה הוא מודד","האם הוא קובע אם זו משבשת?"],"rows":[["אמזון ≈ 80% מהספרים האלקטרוניים","כמה חזקה אמזון <b>מול מתחרות</b> כמו Kobo, Apple, Google","<b>לא</b> – זה נתח בתוך הסגמנט החדש"],["ספרים אלקטרוניים ≈ 32.1% מכלל שוק הספרים (תחזית 2027)","כמה מ<b>כלל הלקוחות</b> עברו לטכנולוגיה החדשה","<b>כן</b> – והוא מתחת ל-50%"],["בעלי Kindle קונים 60% יותר ספרים","שינוי בהתנהגות של מי שכבר עבר","לא לבד – הוא לא אומר כמה עברו"]]},{"t":"trap","x":"המלכודת הגדולה: “80% זה יותר מ-50%, אז זו משבשת”. לא! 80% הוא נתח של <b>אמזון</b> מתוך הספרים האלקטרוניים. כלל ה-50% שואל כמה מ<b>כלל הלקוחות</b> עזבו את הטכנולוגיה הישנה (הספר המודפס). ועוד: אותו מקרה יכול להיות <b>אוקיינוס כחול</b> (יחידה 4 – “מרחב תחרותי חדש”) גם אם הוא <b>לא</b> משבש. אלה שתי שאלות נפרדות."},{"t":"exam","x":"בחלק ג׳ (30 נקודות) כתבו: (1) הגדרה ומאפיינים – מוצרים פחות חדשניים בהתחלה, זולים, פשוטים, ידידותיים, בלי קישוטים; (2) כלל ה-50% (אפשר לצייר את הגרף: רמת טכנולוגיה × זמן); (3) הנתון הרלוונטי מהכתבה (32.1% עד 2027, הדפוס עדיין נחלת הרבים); (4) מסקנה מנומקת: עדיין לא משבשת."},{"t":"h","x":"חדשנות חסכנית (Frugal Innovation)"},{"t":"p","x":"<b>חדשנות חסכנית</b> (Frugal Innovation) היא חדשנות שנובעת מ<b>מקורות מוגבלים</b>: מעט כסף, מעט חומרים, מעט תשתיות. בקורס מכנים אותה <b>״יש מאין״</b>. המטרה: מוצר פשוט, עמיד וזול מאוד שמתאים ללקוחות עם הכנסה נמוכה."},{"t":"p","x":"המדינה המזוהה ביותר עם הסוג הזה היא <b>הודו</b>. במקור ההודי זה נקרא ״ג׳וגאד״ (Jugaad): פתרון יצירתי מאלתור."},{"t":"list","x":["<b>טאטא נאנו (Tata Nano)</b>: מכונית שתוכננה לעלות כ-2,500 דולר, למשפחות הודיות שנסעו עד אז ארבעה על קטנוע.","<b>טרקטור מאולתר מאופנוע</b> לחקלאים קטנים שלא יכולים לקנות טרקטור.","<b>מקרר חרס (MittiCool)</b> שמקרר בלי חשמל.","<b>מכשיר א.ק.ג. נייד וזול</b> (של GE) לכפרים בלי בית חולים."]},{"t":"example","x":"סטארטאפ בקניה מפתח מנורת לילה סולארית שעולה 5 דולר, מחלקים פשוטים, למשפחות בלי חיבור לחשמל. ← <b>חסכנית</b>: חדשנות ממשאבים מוגבלים, ללקוחות עניים.","title":"סיפור"},{"t":"trap","x":"חסכנית ומשבשת שתיהן ״זולות״. ההבדל: <b>חסכנית</b> מדגישה את ה<b>מחסור במשאבים</b> שממנו נולד הפתרון (״יש מאין״). <b>משבשת</b> מדגישה את ה<b>תוצאה בשוק</b>: הלקוחות עוברים (מעל 50%) והישנים נדחקים. אם הסיפור מדבר על ״מעט משאבים, תקציב זעום, כפר בהודו״ ← חסכנית."},{"t":"h","x":"איך מזהים את סוג החדשנות בשאלת סיפור"},{"t":"steps","x":["האם הסיפור מדגיש <b>משאבים מוגבלים</b> / ״יש מאין״ / שוק עני? ← <b>חסכנית</b>.","האם יש <b>מוצר זול ופשוט</b> שבסוף <b>רוב הלקוחות</b> עברו אליו והוותיקים נדחקו? ← <b>משבשת</b>.","אחרת, שאלו: חידוש טכנולוגי גבוה? חידוש במודל העסקי גבוה?","נמוך + נמוך ← <b>הדרגתית</b>. גבוה + גבוה ← <b>רדיקלית</b>. גבוה באחד בלבד ← <b>פורצת דרך</b>."],"title":"סדר עבודה"},{"t":"exam","x":"מסיחים קבועים: רדיקלית מול פורצת דרך (האם גם המודל העסקי השתנה?), הדרגתית מול פורצת דרך (מודל עסקי חדש בטכנולוגיה פשוטה הוא פורצת דרך), משבשת מול חסכנית (תוצאה בשוק מול מחסור במשאבים)."}],"cheat":["חדשנות = יצירת ערך נוסף: פתרון חדש לצורך קיים, או פתרון לצורך חדש","מפת החדשנות = חידוש טכנולוגי × חדשנות במודל העסקי","הדרגתית = נמוך-נמוך: שיפור מוצר קיים לאותם לקוחות, מחזקת את המובילים","רדיקלית = גבוה-גבוה: טכנולוגיה חדשה וגם מודל עסקי חדש","פורצת דרך = גבוה בציר אחד בלבד – מופיעה בשתי משבצות","משבשת (כריסטנסן) = בהתחלה פחות חדשנית: זולה, פשוטה, ידידותית, ״בלי קישוטים״, ללקוחות Low-end או חדשים","כלל המרצה = משבשת רק כש<b>מעל 50% מהלקוחות</b> עברו; גרף: רמת טכנולוגיה × זמן","דוגמאות = נייד/קווי, ויקיפדיה/אנציקלופדיה, דיגיטלית/פילם; קנייה אינטרנטית – בסימן שאלה","משבשת = הטכנולוגיה החדשה; משובשת = הישנה שנדחקה","Kindle = לא (עדיין) משבש: ספרים אלקטרוניים רק 32.1% עד 2027; ה-80% של אמזון = נתח בתוך הסגמנט","חסכנית (Frugal) = ״יש מאין״ ממשאבים מוגבלים, מזוהה עם הודו (Tata Nano)","חסכנית מול משבשת = מחסור במשאבים מול מעבר רוב הלקוחות בשוק"],"mcq":[{"id":"m5-1","q":"חברת החטיפים CrunchCo מוסיפה לסדרת הצ׳יפסים הקיימת טעם חדש. הייצור נעשה באותו מפעל, המוצר נמכר באותן חנויות ולאותם לקוחות. איזה סוג חדשנות זה?","o":["חדשנות רדיקלית","חדשנות משבשת","חדשנות הדרגתית","חדשנות פורצת דרך"],"a":2,"w":["רדיקלית היא מוצר חדש מאפס עם טכנולוגיה ומודל עסקי חדשים; כאן כמעט שום דבר לא השתנה.","אין כאן מוצר זול שמוציא את הוותיקים מהשוק; זה שיפור לאותם לקוחות.","","פורצת דרך דורשת חידוש גבוה בטכנולוגיה או במודל העסקי; כאן שניהם נמוכים."],"why":"טכנולוגיה נמוכה + מודל עסקי ללא שינוי = שיפור מתוך ידע קיים. זו חדשנות הדרגתית (מצרפית)."},{"id":"m5-2","q":"חברת SkyHop פיתחה מונית אווירית חשמלית ללא טייס, טכנולוגיה שלא הייתה קיימת. היא לא מוכרת את הכלים אלא מוכרת נסיעות במנוי חודשי דרך אפליקציה. איזה סוג חדשנות זה?","o":["חדשנות רדיקלית","חדשנות הדרגתית","חדשנות פורצת דרך","חדשנות חסכנית"],"a":0,"w":["","הדרגתית היא נמוכה בשני הצירים; כאן שניהם גבוהים.","פורצת דרך גבוהה בציר אחד בלבד; כאן גם הטכנולוגיה וגם המודל העסקי חדשים.","אין כאן מחסור במשאבים או ״יש מאין״; זו טכנולוגיה יקרה ומתקדמת."],"why":"חידוש טכנולוגי גבוה + שינוי רדיקלי במודל העסקי (מכירת נסיעות במנוי) = המשבצת העליונה-ימנית: רדיקלית."},{"id":"m5-3","q":"חברת MediScan פיתחה מכשיר הדמיה רפואי המבוסס על טכנולוגיה חדשה לגמרי. היא מוכרת אותו לבתי חולים בדיוק כמו את המכשירים הקודמים: מכירה חד-פעמית וחוזה שירות. לפי מפת החדשנות של הקורס, זו:","o":["חדשנות פורצת דרך","חדשנות רדיקלית","חדשנות הדרגתית","חדשנות משבשת"],"a":0,"w":["","ברדיקלית גם המודל העסקי משתנה באופן רדיקלי; כאן הוא נשאר אותו דבר.","הדרגתית היא חידוש טכנולוגי נמוך; כאן הטכנולוגיה חדשה לגמרי.","המכשיר לא זול ופשוט ולא פונה ללקוחות Low-end; ואין סימן שרוב השוק נדחק."],"why":"טכנולוגיה ברמה גבוהה על מודל עסקי קיים = אחת משתי המשבצות של פורצת דרך."},{"id":"m5-4","q":"חברת DressLoop מציעה השכרת שמלות ערב במנוי חודשי דרך אתר אינטרנט רגיל. אין בה שום טכנולוגיה חדשה, אבל הדרך להרוויח שונה לגמרי מחנות בגדים. לפי מפת החדשנות של הקורס, זו:","o":["חדשנות הדרגתית","חדשנות פורצת דרך","חדשנות רדיקלית","חדשנות חסכנית"],"a":1,"w":["בהדרגתית המודל העסקי כמעט לא משתנה; כאן הוא השתנה לגמרי.","","רדיקלית דורשת גם חידוש טכנולוגי גבוה; כאן הטכנולוגיה פשוטה.","החדשנות לא נולדה ממחסור במשאבים; היא שינוי בדרך להרוויח."],"why":"מודל עסקי חדשני + טכנולוגיה ברמה נמוכה = המשבצת השנייה של פורצת דרך (התחתונה-ימנית)."},{"id":"m5-5","q":"לפי הכלל שנלמד בקורס, מתי חדשנות נחשבת משבשת/קוטעת?","o":["כאשר הטכנולוגיה החדשה מתקדמת יותר מכל מה שקיים בשוק","כאשר מעל 50% מהלקוחות עוברים לטכנולוגיה החדשה","כאשר החברה משקיעה יותר מ-50% מהתקציב במו״פ","כאשר המוצר החדש יקר יותר מהמוצר הקיים"],"a":1,"w":["משבשת דווקא מתחילה כפשוטה ופחות מתקדמת; הקריטריון הוא מעבר הלקוחות.","","הכלל עוסק בלקוחות שעוברים, לא בתקציב החברה.","משבשת בדרך כלל זולה ונגישה בהתחלה."],"why":"הסיכום קובע במפורש: כשמעל 50% מהלקוחות עוברים לטכנולוגיה החדשה, המצב נחשב חדשנות משבשת/קוטעת."},{"id":"m5-6","q":"במפת סוגי החדשנות, מה נמצא במשבצת של חידוש טכנולוגי נמוך ושל חדשנות נמוכה במודל העסקי?","o":["חדשנות פורצת דרך","חדשנות חסכנית","חדשנות רדיקלית","חדשנות הדרגתית"],"a":3,"w":["פורצת דרך נמצאת במשבצות שבהן ציר אחד גבוה; כאן שניהם נמוכים.","חסכנית לא מופיעה במפה; היא מוגדרת בנפרד.","רדיקלית היא גבוה + גבוה, המשבצת ההפוכה.",""],"why":"נמוך + נמוך = שיפור מתוך ידע קיים = הדרגתית."},{"id":"m5-7","q":"באילו משבצות של מפת סוגי החדשנות מופיעה חדשנות פורצת דרך?","o":["רק במשבצת שבה שני הצירים גבוהים","רק במשבצת שבה הטכנולוגיה גבוהה","היא לא מופיעה במפה, כמו חדשנות משבשת","בשתי משבצות: טכנולוגיה גבוהה עם מודל עסקי קיים, ומודל עסקי חדשני עם טכנולוגיה נמוכה"],"a":3,"w":["משבצת גבוה-גבוה היא חדשנות רדיקלית.","זו רק אחת משתי המשבצות; פורצת דרך מופיעה גם במשבצת של מודל עסקי חדשני.","פורצת דרך מופיעה במפה, ואפילו פעמיים.",""],"why":"פורצת דרך = גבוה באחד ונמוך בשני, ולכן היא תופסת את שתי המשבצות שעל האלכסון."},{"id":"m5-8","q":"מי פיתח את המושג ״חדשנות משבשת״ (Disruptive Innovation)?","o":["מייקל פורטר (Porter)","איגור אנסוף (Ansoff)","ג׳יי בארני (Barney)","קלייטון כריסטנסן (Christensen)"],"a":3,"w":["פורטר ידוע בחמשת הכוחות, בשרשרת הערך ובאסטרטגיות הגנריות.","אנסוף פיתח את מטריצת אסטרטגיות הצמיחה (יחידה 6).","בארני קשור לגישת המשאבים ול-VRIN.",""],"why":"המושג Disruptive Innovation פותח על ידי קלייטון כריסטנסן מהרווארד."},{"id":"m5-9","q":"חברת NaviBuddy השיקה אפליקציית ניווט חינמית שמבוססת על דיווחי נהגים. בהתחלה היא הייתה פחות מדויקת ממכשירי GPS ייעודיים, אבל חינמית ופשוטה. אחרי כמה שנים כ-70% מהנהגים הפסיקו להשתמש במכשירי GPS, ויצרני המכשירים נקלעו לקשיים. איזה סוג חדשנות זה?","o":["חדשנות משבשת/קוטעת","חדשנות הדרגתית","חדשנות רדיקלית","חדשנות חסכנית"],"a":0,"w":["","הדרגתית מחזקת את מובילי השוק; כאן המובילים נדחקו.","הסיפור מדגיש מוצר פשוט וזול שכבש את רוב השוק, לא טכנולוגיה מתקדמת ומודל חדש מאפס.","אין כאן מחסור במשאבים כמקור לחדשנות; העיקר הוא מעבר רוב הלקוחות."],"why":"פשוט, זול, בהתחלה פחות טוב, ובסוף מעל 50% מהלקוחות עברו והוותיקים נדחקו = משבשת (כמו Waze)."},{"id":"m5-10","q":"סטארטאפ השיק מכונת קפה ביתית זולה ופשוטה. אחרי שלוש שנים רק כ-15% מהלקוחות בשוק עברו אליה, והמותגים הוותיקים ממשיכים להוביל. לפי כלל הקורס:","o":["עדיין לא מדובר בחדשנות משבשת, כי פחות מ-50% מהלקוחות עברו","זו חדשנות משבשת, כי המוצר זול ופשוט","זו חדשנות רדיקלית, כי המוצר זול","זו חדשנות הדרגתית, כי היא פונה ללקוחות Low-end"],"a":0,"w":["","זול ופשוט זה תנאי התחלה, אבל לפי הכלל צריך שמעל 50% מהלקוחות יעברו.","מחיר זול לא הופך מוצר לרדיקלי; רדיקלית היא חידוש גבוה בטכנולוגיה ובמודל העסקי.","פנייה ל-Low-end היא סימן של משבשת, לא של הדרגתית."],"why":"הכלל: רק כשמעל 50% מהלקוחות עוברים, זו חדשנות משבשת. 15% עוד לא מספיק."},{"id":"m5-11","q":"לפי טבלת ההשוואה, מי קהל היעד של חדשנות משבשת?","o":["הלקוחות הקיימים בשוק המרכזי","הלקוחות התובעניים ביותר בצמרת השוק","רק לקוחות עסקיים גדולים","לקוחות חדשים או לקוחות בשולי השוק (Low-end)"],"a":3,"w":["זה קהל היעד של חדשנות הדרגתית.","משבשת דווקא פונה לתחתית השוק או ללקוחות חדשים.","אין בהגדרה הגבלה כזו; היא פונה למי שהשוק הקיים זונח.",""],"why":"משבשת נכנסת מלמטה: לקוחות שלא קנו קודם או לקוחות שהסתפקו במוצר ״מספיק טוב״ וזול."},{"id":"m5-12","q":"לפי טבלת ההשוואה, מה רמת המחיר האופיינית לחדשנות הדרגתית?","o":["זולה ונגישה מאוד בהתחלה","חינמית תמיד","דומה או יקרה יותר, תמורת איכות גבוהה יותר","זולה בהרבה מהמוצר הקודם, כדי לכבוש לקוחות חדשים"],"a":2,"w":["זו רמת המחיר של חדשנות משבשת.","אין כלל כזה; הדרגתית בדרך כלל נמכרת במחיר דומה או גבוה יותר.","","כיבוש לקוחות חדשים במחיר זול מאפיין משבשת."],"why":"בהדרגתית מוסיפים שיפורים למוצר קיים, ולכן המחיר דומה או עולה."},{"id":"m5-13","q":"איזו השפעה על השוק מאפיינת חדשנות הדרגתית?","o":["הופכת את השוק הישן ללא רלוונטי","מפילה את החברות הגדולות בענף","יוצרת קטגוריית מוצר חדשה לגמרי מאפס","שומרת על יציבות השוק ומחזקת את המובילים"],"a":3,"w":["זו השפעה של חדשנות משבשת.","גם זו השפעה של משבשת.","זה תיאור של חדשנות רדיקלית.",""],"why":"שיפורים קטנים לאותם לקוחות מחזקים את מי שכבר מוביל."},{"id":"m5-14","q":"בזוג ״טלפון נייד – טלפון קווי״, מהי הטכנולוגיה המשובשת?","o":["הטלפון הקווי","הטלפון הנייד","שניהם משובשים באותה מידה","אף אחד, כי זו דוגמה לחדשנות הדרגתית"],"a":0,"w":["","הנייד הוא הטכנולוגיה המשבשת, החדשה שדחקה את הישנה.","בזוג כזה יש טכנולוגיה חדשה שמשבשת וטכנולוגיה ישנה שנדחקת.","הסיכום מציג את הזוג הזה כדוגמה לחדשנות משבשת."],"why":"משבשת = החדשה (נייד). משובשת = הישנה שנדחקה (קווי)."},{"id":"m5-15","q":"איזה מהבאים <b>אינו</b> מאפיין של מוצר משבש בתחילת דרכו?","o":["פחות חדשני מהמוצרים הקיימים","מתוחכם ויקר, ופונה ללקוחות התובעניים ביותר","זול","פשוט וידידותי לשימוש"],"a":1,"w":["זה בדיוק מאפיין של משבשת בהתחלה.","","מחיר נמוך הוא מאפיין מרכזי של משבשת.","פשטות וידידותיות הם מאפיינים של משבשת."],"why":"בהתחלה מוצר משבש פחות חדשני, זול, פשוט ונגיש. מוצר מתוחכם ויקר לצמרת השוק הוא ההפך."},{"id":"m5-16","q":"חברה הודית פיתחה מקרר מחרס שמקרר בלי חשמל ונמכר בכמה עשרות דולרים, למשפחות בכפרים ללא חיבור לרשת החשמל. איזה סוג חדשנות זה?","o":["חדשנות רדיקלית","חדשנות הדרגתית","חדשנות חסכנית","חדשנות משבשת"],"a":2,"w":["אין כאן טכנולוגיה מתקדמת; זה פתרון פשוט ממשאבים מוגבלים.","זה לא שיפור קטן למקרר קיים עבור אותם לקוחות; זה פתרון שנולד ממחסור.","","אין בסיפור מעבר של רוב הלקוחות בשוק ודחיקת המובילים; הדגש הוא על משאבים מוגבלים."],"why":"״יש מאין״: פתרון זול ופשוט ממשאבים מוגבלים לשוק עני, בהודו. זו חדשנות חסכנית (Frugal)."},{"id":"m5-17","q":"איזו מדינה מזוהה בקורס יותר מכל עם חדשנות חסכנית (Frugal Innovation)?","o":["יפן","הודו","ישראל","גרמניה"],"a":1,"w":["יפן מזוהה יותר עם חדשנות תהליך ואיכות (למשל טויוטה).","","ישראל מזוהה עם הייטק וסטארטאפים, לא עם חדשנות חסכנית בקורס.","גרמניה מזוהה עם הנדסה מדויקת ויקרה."],"why":"השקף של חדשנות חסכנית מציג את דגל הודו ודוגמאות כמו Tata Nano."},{"id":"m5-18","q":"מכונית ה-Tata Nano, שתוכננה להיות המכונית הזולה בעולם עבור משפחות הודיות, היא דוגמה בקורס ל:","o":["חדשנות רדיקלית","חדשנות חסכנית","חדשנות פורצת דרך","חדשנות הדרגתית"],"a":1,"w":["Tata Nano לא נבנתה על טכנולוגיה חדשה לגמרי; היא פישטה מכונית רגילה עד המינימום.","","הקורס מציג אותה תחת חדשנות חסכנית, ״יש מאין״.","זה לא שיפור קטן לדגם קיים עבור אותם לקוחות."],"why":"Tata Nano היא הדוגמה הקלאסית לחדשנות חסכנית מהודו: מוצר זול מאוד שנולד ממשאבים מוגבלים."},{"id":"m5-19","q":"איזו הגדרה מתאימה ביותר ל״חדשנות״ כפי שהיא מוגדרת בקורס?","o":["פיתוח טכנולוגיה חדשה במעבדת מו״פ","יצירת ערך נוסף באמצעות פתרונות חדשים לצרכים קיימים או יצירת פתרונות לצרכים חדשים","הורדת מחיר המוצר כדי למשוך לקוחות","כל רעיון חדש, גם אם לא יוצר ערך"],"a":1,"w":["חדשנות לא חייבת להיות טכנולוגית; גם מודל עסקי חדש הוא חדשנות.","","הורדת מחיר לבדה היא החלטת תמחור, לא בהכרח חדשנות.","ההגדרה מדגישה יצירת ערך נוסף."],"why":"חדשנות = יצירת ערך נוסף: פתרון חדש לצורך קיים, או פתרון לצורך חדש."},{"id":"m5-20","q":"בזוג ״מצלמה דיגיטלית – מצלמת פילם״, מה נכון לפי הקורס?","o":["המצלמה הדיגיטלית היא הטכנולוגיה המשבשת, ומצלמת הפילם היא המשובשת","מצלמת הפילם היא הטכנולוגיה המשבשת","זו דוגמה לחדשנות חסכנית","זו דוגמה לחדשנות הדרגתית, כי שתיהן מצלמות"],"a":0,"w":["","הפילם הוא הטכנולוגיה הישנה שנדחקה.","הקורס מציג את הזוג הזה כדוגמה לחדשנות משבשת.","המעבר לדיגיטל החליף את הטכנולוגיה כולה והפיל ענקים כמו Kodak."],"why":"הדיגיטלית התחילה באיכות נמוכה, השתפרה, רוב הצלמים עברו אליה, והפילם נדחק."},{"id":"m5-21","q":"GE פיתחה מכשיר א.ק.ג. קטן, עמיד וזול מאוד, שאפשר להפעיל על סוללה, בשביל מרפאות בכפרים בהודו שאין להן כסף לציוד רגיל. מה סוג החדשנות?","o":["חדשנות רדיקלית","חדשנות משבשת","חדשנות חסכנית","חדשנות הדרגתית"],"a":2,"w":["המכשיר מפשט טכנולוגיה קיימת; אין חידוש טכנולוגי גבוה ומודל עסקי חדש לגמרי.","הסיפור לא מתאר מעבר של רוב הלקוחות בשוק ודחיקת המכשירים הקיימים.","","זה לא שיפור למכשיר קיים לאותם לקוחות; זה מוצר בסיסי למי שאין לו משאבים."],"why":"מוצר פשוט וזול שנולד מתנאי מחסור, לשוק עני בהודו = חסכנית."},{"id":"m5-22","q":"ויקיפדיה הייתה בהתחלה פחות אמינה מהאנציקלופדיה המודפסת, אבל חינמית, זמינה ומתעדכנת מהר. היום רוב האנשים משתמשים רק בה. מה הדוגמה הזו ממחישה?","o":["חדשנות הדרגתית: שיפור קטן לאנציקלופדיה","חדשנות חסכנית: פתרון לכפרים בהודו","חדשנות משבשת: מוצר פשוט וזול שהשתפר ודחק את המוצר המסורתי","חדשנות רדיקלית: טכנולוגיה מתקדמת מאוד"],"a":2,"w":["ויקיפדיה לא שיפרה את האנציקלופדיה המודפסת; היא החליפה אותה.","הדגש כאן הוא מעבר רוב המשתמשים, לא מחסור במשאבים.","","ויקיפדיה התחילה דווקא כפשוטה ופחות אמינה."],"why":"ויקיפדיה מול אנציקלופדיה היא דוגמה מהסיכום לחדשנות משבשת."},{"id":"m5-23","q":"לפי המרצה, מה מאפיין חדשנות משבשת <b>בתחילת דרכה</b>?","o":["מוצרים מתקדמים ויקרים יותר מהקיימים","מוצרים פחות חדשניים – זולים, פשוטים, ידידותיים וחפים מקישוטים","מוצרים שמיועדים ללקוחות הרווחיים ביותר בשוק המרכזי","שיפורים קטנים במוצר קיים לאותם לקוחות","פתרון שנולד ממחסור חמור במשאבים (“יש מאין”)"],"a":1,"w":["זה ההפך: בהתחלה היא דווקא פחות מתוחכמת.","","היא פונה לשולי השוק או ללקוחות חדשים.","זו חדשנות הדרגתית.","זו חדשנות חסכנית."],"why":"בהתהוותה, חדשנות משבשת מפתחת מוצרים זולים, פשוטים, ידידותיים ובלי קישוטים."},{"id":"m5-24","q":"סטודנט טוען שה-Kindle הוא חדשנות משבשת, כי אמזון מחזיקה בכ-80% משוק הספרים האלקטרוניים. מה נכון לפי הקורס?","o":["הוא טועה: הנתון הקובע הוא חלקם של הספרים האלקטרוניים מכלל שוק הספרים (כ-32.1% עד 2027), כלומר רוב הקוראים עדיין קונים ספרים מודפסים","הוא צודק: 80% זה יותר מ-50%","הוא צודק: כל מוצר דיגיטלי הוא חדשנות משבשת","הוא טועה: ה-Kindle הוא חדשנות חסכנית","הוא צודק: ספר אלקטרוני זול יותר מספר מודפס"],"a":0,"w":["","80% הוא נתח של אמזון בתוך הסגמנט, לא שיעור הלקוחות שעברו.","דיגיטלי אינו בהכרח משבש; צריך שרוב הלקוחות יעברו.","אין כאן “יש מאין” ממשאבים מוגבלים.","מחיר נמוך לבד לא מספיק; צריך מעבר של רוב הלקוחות."],"why":"כלל ה-50% בודק כמה מכלל הלקוחות עברו. 32.1% עד 2027 ← הדפוס עדיין נחלת הרבים ← עדיין לא משבשת."},{"id":"m5-25","q":"מה מהבאים <b>אינו נכון</b> לגבי חדשנות משבשת לפי הקורס?","o":["היא נחשבת משבשת כאשר מעל 50% מהלקוחות עברו לטכנולוגיה החדשה","בתחילת דרכה היא מולידה מוצרים פחות חדשניים","היא פונה לרוב ללקוחות חדשים או לשולי השוק","אפשר להמחיש אותה בגרף של רמת טכנולוגיה לאורך זמן","היא נקבעת לפי נתח השוק של החברה החדשנית בתוך הסגמנט החדש בלבד"],"a":4,"w":["זה נכון: כלל הקורס.","זה נכון: ההגדרה של המרצה.","זה נכון: Low-end או לקוחות חדשים.","זה נכון: זה התרשים מהפתרון.",""],"why":"הקובע הוא שיעור הלקוחות בכלל השוק שעברו, לא נתח השוק של חברה אחת בתוך הסגמנט."},{"id":"m5-26","q":"קורקינטים חשמליים שיתופיים מהווים 15% מהנסיעות העירוניות הקצרות, וחברת ScootGo מחזיקה ב-70% מהם. לפי כלל הקורס:","o":["זו חדשנות משבשת, כי 70% זה מעל 50%","זו עדיין לא חדשנות משבשת, כי רק 15% מהנסיעות עברו","זו בהכרח חדשנות רדיקלית","זו חדשנות משבשת, כי השירות זול ופשוט","תשובות א, ד נכונות"],"a":1,"w":["70% הוא נתח של ScootGo בתוך הסגמנט, לא שיעור הלקוחות שעברו.","","הסיפור לא מתאר טכנולוגיה ומודל עסקי חדשים מאוד; ולשאלה הזו לא זה המבחן.","זול ופשוט זה תנאי התחלה, אבל צריך מעבר של רוב הלקוחות.","א ו-ד אינן נכונות."],"why":"כמו ב-Kindle: נתח החברה בסגמנט החדש לא קובע. רק 15% מהלקוחות עברו ← עדיין לא משבשת."},{"id":"m5-27","q":"מה מהבאים יהפוך את הספר האלקטרוני לחדשנות משבשת לפי כלל הקורס?","o":["אמזון תגדיל את נתח השוק שלה בספרים האלקטרוניים ל-95%","אמזון תוריד את מחיר מכשיר ה-Kindle","יותר מחצי מרוכשי הספרים יעברו לקנות ספרים אלקטרוניים במקום מודפסים","מתחרים נוספים ייכנסו לשוק הקוראים האלקטרוניים","אף תשובה אינה נכונה"],"a":2,"w":["זה עדיין נתח בתוך הסגמנט, לא שיעור הלקוחות שעברו.","מחיר נמוך לבד לא משנה את שיעור המעבר.","","מספר המתחרים לא קובע כמה לקוחות עברו.","ג נכונה."],"why":"חדשנות נחשבת משבשת כשרוב הלקוחות (מעל 50%) עברו לטכנולוגיה החדשה."},{"id":"m5-28","q":"בהתייחס למקרה ה-Kindle, אילו מההיגדים נכונים? א. לפי התחזית, שוק הספרים המודפסים עדיין נחלת הרבים. ב. לכן ה-Kindle אינו (עדיין) חדשנות משבשת. ג. נתח השוק של אמזון בספרים האלקטרוניים מוכיח שהיא משבשת.","o":["רק א","רק ג","תשובות א, ג נכונות","תשובות א, ב נכונות","תשובות א, ב, ג נכונות"],"a":3,"w":["גם ב נכונה – היא המסקנה מ-א.","ג אינה נכונה: 80% הוא נתח בתוך הסגמנט.","ג אינה נכונה, וחסרה ב.","","ג אינה נכונה."],"why":"32.1% עד 2027 ← רוב הקוראים עדיין בדפוס (א) ← עדיין לא משבשת (ב). נתח אמזון בסגמנט לא רלוונטי (ג)."}],"tf":[{"id":"m5-t1","s":"חדשנות יכולה להיות גם יצירת פתרון לצורך חדש, ולא רק פתרון חדש לצורך קיים.","a":true,"why":"נכון. ההגדרה בקורס כוללת את שתי האפשרויות: פתרון חדש לצורך קיים, או פתרון לצורך חדש."},{"id":"m5-t2","s":"חדשנות הדרגתית מתאפיינת בחידוש טכנולוגי נמוך ובשינוי מינורי במודל העסקי.","a":true,"why":"נכון. זו המשבצת נמוך-נמוך במפה: שיפור וייעול מתוך ידע קיים."},{"id":"m5-t3","s":"חדשנות רדיקלית היא טכנולוגיה חדשה לחלוטין שנמכרת במודל העסקי הקיים.","a":false,"why":"לא נכון. טכנולוגיה גבוהה על מודל עסקי קיים היא פורצת דרך. רדיקלית דורשת גם שינוי רדיקלי במודל העסקי."},{"id":"m5-t4","s":"חדשנות פורצת דרך יכולה לנבוע ממודל עסקי חדשני שמשתמש בטכנולוגיה ברמה נמוכה.","a":true,"why":"נכון. זו אחת משתי הצורות של פורצת דרך לפי הקורס."},{"id":"m5-t5","s":"במפת סוגי החדשנות, חדשנות פורצת דרך מופיעה במשבצת אחת בלבד.","a":false,"why":"לא נכון. היא מופיעה בשתי משבצות: טכנולוגיה גבוהה + מודל קיים, ומודל חדשני + טכנולוגיה נמוכה."},{"id":"m5-t6","s":"חדשנות משבשת פונה בתחילת דרכה ללקוחות התובעניים ביותר בצמרת השוק.","a":false,"why":"לא נכון. היא פונה ללקוחות חדשים או ללקוחות בשולי השוק (Low-end)."},{"id":"m5-t7","s":"לפי הקורס, כאשר מעל 50% מהלקוחות עוברים לטכנולוגיה החדשה, המצב נחשב חדשנות משבשת.","a":true,"why":"נכון. זה הכלל המפורש שבסיכום."},{"id":"m5-t8","s":"מוצר משבש הוא בדרך כלל יקר יותר מהמוצר הקיים בתחילת דרכו.","a":false,"why":"לא נכון. בהתחלה הוא בדרך כלל זול ונגיש מאוד."},{"id":"m5-t9","s":"חדשנות הדרגתית שומרת על יציבות השוק ומחזקת את החברות המובילות.","a":true,"why":"נכון. היא משפרת מוצרים קיימים לאותם לקוחות, ולכן מחזקת את מי שכבר מוביל."},{"id":"m5-t10","s":"ויקיפדיה מול האנציקלופדיה המודפסת היא דוגמה בקורס לחדשנות משבשת.","a":true,"why":"נכון. היא מופיעה בטבלת הדוגמאות לצד נייד/קווי ודיגיטלית/פילם."},{"id":"m5-t11","s":"חדשנות חסכנית מחייבת תקציבי מחקר ופיתוח גדולים.","a":false,"why":"לא נכון. היא נובעת דווקא ממקורות מוגבלים, ״יש מאין״."},{"id":"m5-t12","s":"מכונית Tata Nano היא דוגמה לחדשנות חסכנית.","a":true,"why":"נכון. מכונית זולה מאוד מהודו, שנולדה מהצורך לתת פתרון במשאבים מוגבלים."},{"id":"m5-t13","s":"Waze מוצגת בקורס כדוגמה לחדשנות חסכנית.","a":false,"why":"לא נכון. Waze מוצגת בשקף של חדשנות משבשת: חינמית, פשוטה, ודחקה את מכשירי ה-GPS."},{"id":"m5-t14","s":"טכנולוגיה משבשת מתחילה לרוב ברמת ביצועים נמוכה מהטכנולוגיה הקיימת ומשתפרת עם הזמן.","a":true,"why":"נכון. זה הגרף של כריסטנסן: בהתחלה פחות חדשנית, ועם הזמן נעשית ״מספיק טובה״ לרוב הלקוחות."},{"id":"m5-t15","s":"חדשנות הדרגתית מכוונת בעיקר ללקוחות חדשים בשולי השוק.","a":false,"why":"לא נכון. הדרגתית מכוונת ללקוחות הקיימים בשוק המרכזי. לקוחות Low-end הם קהל של משבשת."},{"id":"m5-t16","s":"חדשנות רדיקלית היא פיתוח מוצר חדש לחלוטין, מאפס.","a":true,"why":"נכון. עם חידוש טכנולוגי גבוה ושינוי רדיקלי במודל העסקי."},{"id":"m5-t17","s":"מוצר שנוצר בחדשנות הדרגתית תמיד זול יותר מהגרסה הקודמת.","a":false,"why":"לא נכון. המחיר בהדרגתית דומה או יקר יותר, תמורת איכות גבוהה יותר."},{"id":"m5-t18","s":"חדשנות משבשת יכולה להוביל בסוף התהליך לנפילה של חברות ענק בענף.","a":true,"why":"נכון. היא הופכת את השוק הישן ללא רלוונטי ומפילה ענקים, כמו Kodak מול המצלמה הדיגיטלית."},{"id":"m5-t19","s":"לפי המרצה, חדשנות משבשת מולידה בתחילת דרכה מוצרים פחות חדשניים, זולים ופשוטים.","a":true,"why":"נכון. בהתהוותה היא מפתחת מוצרים זולים, פשוטים, ידידותיים וחפים מקישוטים."},{"id":"m5-t20","s":"העובדה שאמזון מחזיקה בכ-80% משוק הספרים האלקטרוניים מספיקה כדי לקבוע שה-Kindle הוא חדשנות משבשת.","a":false,"why":"לא נכון. זה נתח בתוך הסגמנט. הקובע הוא כמה מכלל הלקוחות עברו – והתחזית היא 32.1% בלבד עד 2027."},{"id":"m5-t21","s":"לפי התחזית, ספרים אלקטרוניים יגיעו לכ-32.1% משוק הספרים עד 2027, ולכן לפי כלל ה-50% ה-Kindle עדיין אינו חדשנות משבשת.","a":true,"why":"נכון. רוב הקוראים עדיין קונים ספרים מודפסים, כלומר פחות מ-50% עברו."},{"id":"m5-t22","s":"חדשנות חסכנית וחדשנות משבשת הן אותו דבר, כי בשתיהן המוצר זול.","a":false,"why":"לא נכון. חסכנית מדגישה את <b>המחסור במשאבים</b> שממנו נולד הפתרון (״יש מאין״); משבשת מדגישה את <b>התוצאה בשוק</b> – מעל 50% מהלקוחות עוברים והישנים נדחקים."}],"scope":[{"ref":"סיכום · עמ׳ 9","x":"מהי חדשנות: יצירת ערך נוסף לצרכים קיימים או חדשים","imp":1,"h":"מהי חדשנות?"},{"ref":"סיכום · עמ׳ 9","x":"מפת סוגי החדשנות: חידוש טכנולוגי × חדשנות במודל העסקי","imp":2,"h":"מפת סוגי החדשנות: חידוש טכנולוגי × חדשנות במודל העסקי"},{"ref":"סיכום · עמ׳ 9","x":"חדשנות מצרפית/הדרגתית (Incremental)","imp":1,"h":"חדשנות הדרגתית (Incremental Innovation)"},{"ref":"סיכום · עמ׳ 9","x":"חדשנות רדיקלית (Radical)","imp":1,"h":"חדשנות רדיקלית (Radical Innovation)"},{"ref":"סיכום · עמ׳ 9","x":"חדשנות פורצת דרך (Breakthrough) – בשתי משבצות","imp":2,"h":"חדשנות פורצת דרך (Breakthrough Innovation)"},{"ref":"סיכום · עמ׳ 9","x":"חדשנות משבשת/קוטעת (Disruptive) וכלל ה-50%","imp":2,"h":"חדשנות משבשת/קוטעת (Disruptive Innovation)"},{"ref":"סיכום · עמ׳ 9","x":"טבלת השוואה: הדרגתית מול משבשת","imp":1,"h":"השוואה: חדשנות הדרגתית מול חדשנות משבשת"},{"ref":"סיכום · עמ׳ 10","x":"דוגמאות לחדשנות משבשת: נייד, ויקיפדיה, מצלמה דיגיטלית, קנייה אינטרנטית","imp":1,"h":"דוגמאות לחדשנות משבשת"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"חדשנות משבשת לפי המרצה ומקרה ה-Kindle (80% מהספרים האלקטרוניים, אבל רק 32.1% מהשוק עד 2027 ← עדיין לא משבשת)","imp":2,"h":"משבשת או לא? מקרה ה-Kindle לפי המרצה"},{"ref":"סיכום · עמ׳ 10","x":"חדשנות חסכנית (Frugal) – ״יש מאין״, הודו","imp":1,"h":"חדשנות חסכנית (Frugal Innovation)"}],"outScope":[]},{"id":"m6","title":"אסטרטגיות לשינוי מבני וצמיחה","short":"שינוי מבני וצמיחה","blurb":"מיקור חוץ, ברית אסטרטגית, מיזם משותף, מיזוגים ורכישות, אינטגרציה אופקית ואנכית, ומטריצת הצמיחה של אנסוף.","mnemonic":"סולם הקשר: ״נותנים החוצה״ (מיקור חוץ) ← ״עובדים יחד״ (ברית) ← ״בונים יחד ישות״ (מיזם משותף) ← ״נהיים אחד״ (מיזוג/רכישה). אינטגרציה: אופקית = לצד, למתחרה; אנכית = למעלה או למטה בשרשרת (אחורה לספק, קדימה ללקוח). אנסוף: ספרו כמה ״חדש״ – 0 = חדירה (הכי בטוח), 1 = פיתוח מוצרים/שווקים, 2 = הגוונה (הכי מסוכן).","blocks":[{"t":"h","x":"מפת היחידה: ארבע דרכים לשנות את מבנה החברה"},{"t":"p","x":"היחידה עוסקת בשאלה: <b>איך חברה גדלה או משנה את המבנה שלה?</b> אפשר לסדר את הכלים לפי <b>מידת הקשר</b> בין החברה לגורם החיצוני, מהקשר הרופף ביותר להדוק ביותר:"},{"t":"table","head":["כלי","מה קורה","עוצמת הקשר"],"rows":[["מיקור חוץ (Outsourcing)","נותנים פעילות לגורם חיצוני שמבצע אותה בשבילנו","חוזה ספק-לקוח"],["ברית אסטרטגית (Alliance)","שתי חברות עצמאיות עובדות יחד על מטרה משותפת","שיתוף פעולה רחב"],["מיזם משותף (Joint Venture)","שותפות ספציפית והדוקה, לרוב ישות משותפת חדשה","הדוק יותר"],["מיזוג / רכישה (M&A)","שתי חברות נהיות אחת, או אחת קונה את השנייה","הכי הדוק: בעלות"]]},{"t":"p","x":"אחר כך באים שני כלים שמסבירים <b>לאן</b> גדלים: <b>אינטגרציה</b> (אופקית או אנכית) ו<b>מטריצת אנסוף</b> (אילו מוצרים ובאילו שווקים)."},{"t":"h","x":"מיקור חוץ (Outsourcing)"},{"t":"p","x":"<b>מיקור חוץ</b> הוא העברת פעילות של החברה ל<b>גורם חיצוני</b> שהוא <b>מומחה</b> בתחום או <b>זול יותר</b>. המטרה: לפנות זמן, כסף ותשומת לב ל<b>עסקי הליבה</b>."},{"t":"p","x":"<b>תנאי הכרחי:</b> הפעילות שמוציאים החוצה <b>אינה קריטית</b> ליצירת <b>יתרון תחרותי בר-קיימא</b>. את מה שעושה אותנו מיוחדים לא מוציאים החוצה."},{"t":"table","head":["יתרונות","חסרונות"],"rows":[["התמקדות בליבה","<b>אובדן שליטה</b> על איכות, לוחות זמנים ומידע"],["חיסכון בעלויות (הספק זול יותר / יעיל יותר)","<b>תלות בגורם חיצוני</b> – <b>החיסרון הבולט ביותר</b>: אם הספק נכשל, מאחר או מעלה מחירים, אנחנו נפגעים"],["גישה למומחיות שאין בבית","סיכון לדליפת ידע"]]},{"t":"example","x":"חברת התוכנה CodeNest מעבירה את הנהלת השכר, הניקיון ומוקד התמיכה הטכנית לחברות חיצוניות, ומשקיעה את כל המשאבים בפיתוח התוכנה. ← <b>מיקור חוץ</b>. Apple מוציאה את הרכבת האייפון ל-Foxconn, אבל שומרת אצלה את העיצוב והתוכנה – כי הם מקור היתרון שלה.","title":"דוגמה"},{"t":"trap","x":"אם בסיפור החברה מוציאה החוצה את <b>מקור היתרון התחרותי</b> שלה (האלגוריתם הסודי, המתכון, העיצוב), זו טעות אסטרטגית: התנאי ההכרחי לא מתקיים."},{"t":"exam","x":"מילים בסיפור: ״העבירה לחברה חיצונית״, ״קבלן משנה״, ״כדי להתמקד ב...״. שאלות נפוצות: מה התנאי ההכרחי? (הפעילות לא קריטית ליתרון) ומה החסרונות? (אובדן שליטה ותלות)."},{"t":"trap","x":"<b>החיסרון הבולט ביותר של מיקור חוץ = התלות בגורם חיצוני.</b> כשפעילות עוברת לספק, החברה כבר לא יכולה לבצע אותה בעצמה מחר בבוקר: אם הספק מעלה מחיר, מאחר, נכשל או עובר למתחרה – החברה תקועה. אובדן השליטה ודליפת הידע הם חסרונות נוספים, אבל אם שואלים על <b>הבולט ביותר</b> – עונים <b>תלות</b>. מסיחים: “התמקדות בליבה”, “חיסכון בעלויות”, “גישה למומחיות” (אלה <b>יתרונות</b>), “השקעה הונית בהקמת ישות חדשה” (מיזם משותף), “קשיי שילוב תרבותי” (מיזוגים ורכישות)."},{"t":"h","x":"ברית אסטרטגית / שיתוף פעולה אסטרטגי (Strategic Alliance)"},{"t":"p","x":"<b>ברית אסטרטגית</b> היא <b>שיתוף פעולה</b> בין חברות <b>שנשארות עצמאיות</b>. משתמשים בה כדי <b>לחדור לשווקים חדשים</b> או <b>לפתח טכנולוגיה</b>, במיוחד כשחסרה <b>יכולת כלכלית</b> או כשלכל צד יש <b>ידע שמשלים</b> את השני."},{"t":"steps","x":["כשרוצים <b>לחדור לשווקים חדשים ו/או גלובליים</b> (השותף המקומי מכיר את השוק).","כשרוצים <b>לפתח טכנולוגיות מתקדמות</b> (מחלקים עלות וידע)."],"title":"מתי נשקול ברית?"},{"t":"p","x":"<b>המטרה:</b> לעבוד יחד על <b>פרויקט מסוים</b>, כך שהתוצאה תהיה <b>טובה יותר לשני הצדדים</b> ממה שכל אחד היה משיג לבד."},{"t":"example","x":"חברות התעופה בברית Star Alliance משתפות טיסות (code-share), מועדון נוסע מתמיד וטרקלינים. כל חברה נשארת עצמאית, עם בעלות ומותג משלה. ← <b>ברית אסטרטגית</b>. גם Uber ו-Spotify חברו (2014) כדי שנוסעים ינגנו את המוזיקה שלהם במכונית – בלי ישות חדשה ובלי שינוי בעלות.","title":"דוגמה"},{"t":"trap","x":"בברית <b>אין שינוי בבעלות</b>. אם חברה קונה את השנייה זו רכישה; אם נוצרת חברה משותפת חדשה עם בעלות משותפת זה לרוב מיזם משותף."},{"t":"h","x":"מיזם משותף (Joint Venture)"},{"t":"p","x":"<b>מיזם משותף</b> הוא גם שיתוף פעולה בין חברות לחדירה לשווקים או לפיתוח טכנולוגי, אבל <b>ספציפי והדוק יותר</b>. בדרך כלל החברות מקימות <b>ישות עסקית משותפת חדשה</b>, משקיעות בה הון, ומתחלקות בבעלות, ברווחים ובסיכון."},{"t":"steps","x":["כש<b>אין יכולת כלכלית</b> לכל אחת מהחברות לבד (הפרויקט גדול מדי).","ו/או כש<b>לכל אחת יש ידע מסוים</b> שהפרויקט צריך."],"title":"מתי נשקול מיזם משותף?"},{"t":"example","x":"Sony ו-Honda הקימו יחד את Sony Honda Mobility לפיתוח רכב חשמלי: ל-Sony ידע בתוכנה ובידור, ל-Honda ידע בייצור רכב. החברה החדשה בבעלות משותפת. ← <b>מיזם משותף</b>.","title":"דוגמה"},{"t":"example","x":"BatteryOne ו-VoltCar מקימות חברה חדשה, 50% לכל אחת, כדי לבנות מפעל סוללות. אף אחת לא יכולה לממן את המפעל לבד. ← <b>מיזם משותף</b>.","title":"סיפור"},{"t":"h","x":"דוגמאות המרצה למיזם משותף: Caradigm ו-Sony Ericsson"},{"t":"p","x":"בשקף של המרצה מופיעות שתי דוגמאות: שתי חברות-אם ← חץ ← חברה חדשה באמצע. זה הסימן של <b>מיזם משותף</b>: <b>ישות חדשה</b>, בבעלות משותפת, שכל אחת מחברות-האם תורמת לה ידע אחר. חברות-האם <b>ממשיכות להתקיים בנפרד</b>."},{"t":"table","head":["מיזם","חברה א׳ ומה היא מביאה","חברה ב׳ ומה היא מביאה","הישות החדשה ומטרתה"],"rows":[["<b>Caradigm</b> (2012)","<b>Microsoft</b> – מומחיות בפלטפורמות נתונים","<b>GE</b> (General Electric) – מומחיות ביישומי בריאות","חברה משותפת שמשתמשת בנתונים כדי לשפר את איכות שירותי הבריאות ואת חוויית המטופל"],["<b>Sony Ericsson</b> (2001)","<b>Sony</b> – אלקטרוניקה לצרכן, עיצוב ומותג","<b>Ericsson</b> – טכנולוגיית תקשורת סלולרית","חברה משותפת לפיתוח ולייצור טלפונים ניידים"]]},{"t":"list","x":["<b>למה זה מיזם משותף?</b> לכל חברה יש <b>ידע מסוים</b> שהפרויקט צריך, ואף אחת לא יכולה לעשות את זה לבד באותה רמה – בדיוק התנאים של הקורס לשקול מיזם משותף.","<b>למה זה לא מיזוג?</b> במיזוג <b>שתי החברות עצמן</b> מתאחדות לגוף אחד. כאן Microsoft ו-GE (או Sony ו-Ericsson) נשארו חברות נפרדות; רק הוקמה ישות שלישית.","<b>למה זה לא מיקור חוץ?</b> אף אחת לא “שכרה” את השנייה לבצע בשבילה פעילות. שתיהן <b>שותפות בבעלות</b> על החברה החדשה.","<b>ולא “הגוונה” או “רכישה”</b>: אף אחת לא קנתה את השנייה. (בהמשך, ב-2012, Sony <b>רכשה</b> את חלקה של Ericsson והחברה הפכה ל-Sony Mobile – <b>זה</b> כבר צעד של רכישה.)"]},{"t":"trap","x":"“שני שמות התחברו לשם אחד” (Sony + Ericsson) <b>לא</b> הופך את זה למיזוג. שאלו: האם חברות-האם נעלמו לתוך גוף אחד (מיזוג), או שהן ממשיכות לחיות והקימו יחד ילד משותף (מיזם משותף)?"},{"t":"exam","x":"שאלה בסגנון המבחן: ידיעה קצרה (“X, שמתמחה ב..., ו-Y, שמתמחה ב..., הקימו את Z במטרה ל...”) ← “מה נכון?”. התשובה: <b>Z הוא מיזם משותף</b>. המסיחים: “Y נקטה במיקור חוץ”, “Z הוא תוצאה של מיזוג”, “X נקטה בהגוונה”, “אף תשובה אינה נכונה”."},{"t":"h","x":"ברית אסטרטגית מול מיזם משותף"},{"t":"p","x":"לפי הקורס, <b>שיתוף פעולה (ברית)</b> הוא <b>מושג רחב וכללי</b> לשילוב כוחות. <b>מיזם משותף</b> הוא <b>צורה ספציפית ומהודקת יותר</b> של שיתוף פעולה עסקי."},{"t":"table","head":["","ברית אסטרטגית","מיזם משותף"],"rows":[["רוחב המושג","רחב וכללי","ספציפי ומהודק"],["מבנה","הסכם בין חברות עצמאיות","לרוב ישות חדשה בבעלות משותפת"],["מתי","חדירה לשווקים חדשים/גלובליים, פיתוח טכנולוגיות מתקדמות","אין יכולת כלכלית לכל אחת לבד, ו/או לכל אחת ידע נחוץ"],["דוגמה","Star Alliance, Uber + Spotify","Sony Honda Mobility"]]},{"t":"trap","x":"כל מיזם משותף הוא סוג של שיתוף פעולה, אבל לא כל שיתוף פעולה הוא מיזם משותף. היגד ״מיזם משותף הוא מושג רחב יותר מברית״ – <b>לא נכון</b>."},{"t":"h","x":"מיזוגים ורכישות (M&A)"},{"t":"p","x":"<b>מיזוגים ורכישות</b> (Mergers & Acquisitions) הם הדרך ההדוקה ביותר: שתי חברות הופכות לגוף אחד בבעלות אחת."},{"t":"table","head":["","מיזוג (Merger)","רכישה (Acquisition)"],"rows":[["מה קורה","<b>איחוד משפטי</b> של שתי חברות <b>שוות או דומות</b>","חברה אחת (<b>הרוכשת</b>) קונה את <b>המניות והנכסים</b> של השנייה"],["מטרה","ליצור <b>כוח משותף וחזק יותר</b>","שליטה בחברה הנרכשת, בנכסים ובשוק שלה"],["מה קורה לחברה השנייה","שתיהן מתאחדות לגוף אחד","יכולה להמשיך כ<b>חברת בת</b>; <b>השליטה עוברת במלואה</b> לרוכשת"],["דוגמה","Exxon ו-Mobil התאחדו ל-ExxonMobil","Google רכשה את Waze; Waze המשיכה לפעול כמותג"]]},{"t":"example","x":"GiantSoft קונה את כל המניות של סטארטאפ AppLeaf. AppLeaf ממשיכה לפעול בשם שלה, אבל כל ההחלטות מתקבלות בהנהלת GiantSoft. ← <b>רכישה</b>. לעומת זאת, שני בנקים בגודל דומה שמתאחדים לבנק אחד חדש ← <b>מיזוג</b>.","title":"סיפור"},{"t":"trap","x":"״החברה הנרכשת ממשיכה לפעול בשמה״ לא הופך את זה למיזוג או לברית. אם השליטה עברה לחברה אחרת – זו רכישה."},{"t":"h","x":"יתרונות וחסרונות של M&A, ומקרה eBay–Skype"},{"t":"p","x":"<b>יתרונות</b> – למה חברות ממזגות או רוכשות:"},{"t":"list","x":["<b>כוח שוק מוגבר</b>: דרך שילוב אופקי (מתחרה), שילוב אנכי (ספק/מפיץ) או כניסה לענף קרוב.","<b>התגברות על חסמי כניסה</b>: קונים חברה שכבר נמצאת בשוק.","<b>צמצום עלויות</b>: חוסכים כפילויות.","<b>פיתוח טכנולוגיות מתקדמות</b>: קונים ידע מוכן.","<b>הפחתת הסיכון</b> ו<b>הגוונה</b>: פיזור על כמה תחומים."]},{"t":"p","x":"<b>חסרונות</b> – מה יכול להשתבש:"},{"t":"list","x":["<b>קשיים בשילוב</b> הארגוני והתרבותי.","<b>סיכון לכישלון</b>: לעיתים המיזוג או הרכישה פשוט לא מצליחים.","<b>הקטנת התחרותיות</b>: הגוף הגדול נעשה כבד ואיטי."]},{"t":"example","x":"eBay רכשה את Skype בכ-<b>2.6 מיליארד דולר</b>. הרעיון: קונים ומוכרים ידברו ב-Skype. בפועל הם לא היו צריכים את זה, ולא נוצר חיבור בין העסקים. ב-2007 eBay מחקה חלק גדול משווי ההשקעה, וב-2009 מכרה את רוב Skype. ← דוגמה מהקורס ל<b>חיסרון</b>: מיזוגים ורכישות לא תמיד מצליחים.","title":"eBay–Skype (2005)"},{"t":"trap","x":"שאלה ״מה ממחיש מקרה eBay–Skype?״ ← שמיזוגים ורכישות <b>לעיתים נכשלים</b>. לא ״הצלחה של הגוונה״."},{"t":"h","x":"אינטגרציה אופקית ואינטגרציה אנכית"},{"t":"p","x":"אינטגרציה היא גדילה בעזרת <b>רכישה (או בנייה) של חוליה נוספת</b>. השאלה: מאיזה כיוון החוליה?"},{"t":"table","head":["סוג","מה קונים","דוגמה"],"rows":[["<b>אופקית</b> (Horizontal)","<b>מתחרה</b> שפועל <b>באותו שלב</b> בנתיב ההפצה","רשת סופרמרקטים קונה רשת סופרמרקטים אחרת; Facebook רכשה את Instagram"],["<b>אנכית לאחור</b> (Backward)","<b>ספק</b> (שלב קודם בשרשרת הערך)","יצרנית שוקולד קונה מטע קקאו"],["<b>אנכית לפנים</b> (Forward)","<b>מפיץ או לקוח</b> (שלב הבא בשרשרת)","מבשלת בירה קונה רשת פאבים; Apple פותחת חנויות משלה"]]},{"t":"p","x":"איך לזכור: דמיינו את השרשרת משמאל לימין: <b>ספק ← יצרן ← מפיץ ← לקוח</b>. אנכית = זזים <b>לאורך</b> השרשרת (אחורה לספק או קדימה ללקוח). אופקית = זזים <b>לצד</b>, למתחרה באותה חוליה."},{"t":"trap","x":"״חברה קונה את המפיץ שלה״ היא אנכית <b>לפנים</b>, לא לאחור. ״לאחור״ = לכיוון חומרי הגלם."},{"t":"exam","x":"שאלה טיפוסית: סיפור של רכישה ← ״איזה סוג אינטגרציה?״. בדקו: האם החברה הנרכשת עושה את <b>אותו דבר</b> (אופקית) או שהיא <b>ספק/מפיץ</b> (אנכית לאחור/לפנים)?"},{"t":"h","x":"מטריצת אנסוף: אסטרטגיות צמיחה (Ansoff Matrix)"},{"t":"p","x":"<b>מטריצת אנסוף</b> פותחה על ידי <b>איגור אנסוף (Igor Ansoff)</b>. היא מצליבה <b>מוצרים</b> (קיימים/חדשים) עם <b>שווקים</b> (קיימים/חדשים), ויוצרת <b>ארבע חלופות צמיחה</b>."},{"t":"table","head":["","מוצר <b>קיים</b>","מוצר <b>חדש</b>"],"rows":[["שוק <b>קיים</b>","<b>חדירה לשוק (העמקה)</b> – Market Penetration","<b>פיתוח מוצרים</b> – Product Development"],["שוק <b>חדש</b>","<b>פיתוח שווקים</b> – Market Development","<b>הגוונה (גיוון)</b> – Diversification"]]},{"t":"table","head":["אסטרטגיה","מה עושים","סיכון","דוגמה"],"rows":[["חדירה לשוק (העמקה)","מוכרים <b>יותר</b> מהמוצרים הקיימים <b>באותו שוק</b> כדי להגדיל נתח שוק: מבצעים, פרסום, הנחות","<b>הנמוך ביותר</b>","רשת פיצה מציעה ״1+1״ ומגבירה פרסום בעיר שבה היא כבר פועלת"],["פיתוח מוצרים","מפתחים ומשווקים <b>מוצרים חדשים</b> ל<b>לקוחות ולשווקים הקיימים</b>","בינוני","בנק מציע ללקוחות הקיימים שלו אפליקציית השקעות חדשה"],["פיתוח שווקים","לוקחים <b>מוצרים קיימים</b> ומחדירים אותם ל<b>שווקים חדשים</b>: קהל יעד חדש או סניפים בחו״ל","בינוני","רשת המבורגרים ישראלית פותחת סניפים בגרמניה, עם אותו תפריט"],["הגוונה (גיוון)","<b>מוצרים חדשים לחלוטין</b> ל<b>שווקים חדשים</b>","<b>הגבוה ביותר</b>, והמורכבת ביותר","חברת מזון נכנסת לתחום המלונאות"]]},{"t":"p","x":"כלל אצבע: ספרו כמה ״חדש״ יש. <b>0 חדש</b> ← חדירה לשוק (הכי בטוח). <b>1 חדש</b> ← פיתוח מוצרים או פיתוח שווקים. <b>2 חדשים</b> ← הגוונה (הכי מסוכן)."},{"t":"example","x":"רשת בתי הקפה BeanUp, שפונה תמיד לאנשי עסקים, משיקה קמפיין ופותחת סניפים ליד קמפוסים כדי למשוך <b>סטודנטים</b>, עם אותו תפריט. ← <b>פיתוח שווקים</b>: מוצר קיים, קהל יעד חדש.","title":"סיפור"},{"t":"trap","x":"״שוק חדש״ הוא לא רק מדינה חדשה. גם <b>קהל יעד חדש</b> (גיל, מגזר, סוג לקוח) הוא שוק חדש. ומבצעים ופרסום באותו שוק הם <b>חדירה</b>, לא פיתוח שווקים."},{"t":"trap","x":"הסיכום קובע רק את הקצוות: חדירה = הסיכון הנמוך ביותר, הגוונה = הסיכון הגבוה ביותר. פיתוח מוצרים ופיתוח שווקים נמצאים באמצע."},{"t":"exam","x":"השאלה הנפוצה ביותר ביחידה: סיפור קצר ← ״לפי מטריצת אנסוף, איזו אסטרטגיית צמיחה זו?״. שאלו שתי שאלות: המוצר קיים או חדש? השוק (או קהל היעד) קיים או חדש?"},{"t":"h","x":"איך מבחינים בין הכלים בשאלת סיפור"},{"t":"steps","x":["האם החברה <b>נותנת פעילות</b> לגורם חיצוני תמורת תשלום? ← <b>מיקור חוץ</b>.","האם שתי חברות <b>עצמאיות</b> עובדות יחד, בלי שינוי בעלות? ← <b>ברית אסטרטגית</b>.","האם הן מקימות <b>ישות משותפת</b>, כי לבד אין להן מספיק כסף או ידע? ← <b>מיזם משותף</b>.","האם שתי חברות דומות <b>מתאחדות</b> לאחת? ← <b>מיזוג</b>. האם אחת <b>קונה</b> את השנייה? ← <b>רכישה</b>.","את מי קנו? מתחרה ← <b>אופקית</b>. ספק ← <b>אנכית לאחור</b>. מפיץ/לקוח ← <b>אנכית לפנים</b>.","אם השאלה היא <b>לאן לצמוח</b> (מוצר/שוק) ← <b>אנסוף</b>."],"title":"סדר עבודה"}],"cheat":["מיקור חוץ = העברת פעילות לגורם חיצוני כדי להתמקד בליבה","תנאי הכרחי = הפעילות אינה קריטית ליתרון בר-קיימא; <b>החיסרון הבולט = תלות בגורם חיצוני</b>","ברית אסטרטגית = שיתוף פעולה בין חברות עצמאיות, בלי שינוי בעלות (שווקים חדשים, טכנולוגיה)","מיזם משותף = ישות חדשה בבעלות משותפת; כשאין יכולת כלכלית לבד ו/או לכל צד ידע נחוץ","ברית מול מיזם = ברית רחבה וכללית; מיזם משותף ספציפי ומהודק יותר","דוגמאות המרצה = Caradigm (Microsoft + GE) ו-Sony Ericsson – מיזם משותף, לא מיזוג","מיזוג = שתי חברות דומות מתאחדות לאחת; רכישה = אחת קונה, השליטה עוברת אליה","M&A = יתרונות: כוח שוק, עקיפת חסמי כניסה, חיסכון; חסרונות: שילוב תרבותי, כישלון (eBay–Skype)","אינטגרציה = אופקית: מתחרה; אנכית לאחור: ספק; אנכית לפנים: מפיץ או לקוח","אנסוף = מוצר (קיים/חדש) × שוק (קיים/חדש)","חדירה = קיים-קיים, הסיכון הנמוך ביותר; פיתוח מוצרים = מוצר חדש; פיתוח שווקים = שוק או קהל יעד חדש","הגוונה = מוצר חדש בשוק חדש – המורכבת והמסוכנת ביותר"],"mcq":[{"id":"m6-1","q":"חברת התוכנה CodeNest העבירה את הנהלת השכר ואת מוקד התמיכה הטכנית לחברות חיצוניות שמתמחות בכך, כדי שכל העובדים שלה יתמקדו בפיתוח התוכנה. מה החברה עשתה?","o":["ברית אסטרטגית","אינטגרציה אנכית לאחור","מיקור חוץ","מיזם משותף"],"a":2,"w":["בברית שתי חברות משתפות פעולה על פרויקט משותף; כאן CodeNest פשוט קונה שירות מספק.","באינטגרציה החברה קונה את הספק; כאן היא דווקא מוציאה פעילות החוצה.","","לא הוקמה ישות משותפת ואין שותפות בבעלות."],"why":"העברת פעילויות שאינן ליבה לגורם חיצוני מומחה, כדי להתמקד בעסקי הליבה = מיקור חוץ."},{"id":"m6-2","q":"מהו התנאי ההכרחי למיקור חוץ של פעילות, לפי הקורס?","o":["הפעילות אינה קריטית ליצירת יתרון תחרותי בר-קיימא","הספק החיצוני נמצא באותה מדינה","הפעילות היא מקור היתרון התחרותי של החברה","החברה רוכשת את הספק אחרי שנה"],"a":0,"w":["","אין תנאי כזה; ספקים יכולים להיות בכל מקום.","זה בדיוק ההפך: את מקור היתרון לא מוציאים החוצה.","רכישת ספק היא אינטגרציה אנכית, לא מיקור חוץ."],"why":"מוציאים החוצה רק פעילות שאינה קריטית ליתרון התחרותי בר-הקיימא."},{"id":"m6-3","q":"חברת הבשמים ScentCraft שוקלת להעביר לחברה חיצונית את פיתוח הנוסחאות הסודיות של הבשמים, שבזכותן הלקוחות מעדיפים אותה. מה הבעיה בצעד הזה?","o":["הפעילות היא מקור היתרון התחרותי, ולכן התנאי ההכרחי למיקור חוץ לא מתקיים","אין בעיה, מיקור חוץ תמיד חוסך כסף","הבעיה היא שזו אינטגרציה אופקית","הבעיה היא שמיקור חוץ מתאים רק לחברות קטנות"],"a":0,"w":["","חיסכון לא מצדיק הוצאה של מקור היתרון התחרותי.","זו לא רכישה של מתחרה; זה מיקור חוץ.","אין כלל כזה; גם חברות ענק עושות מיקור חוץ."],"why":"מוציאים החוצה רק את מה שאינו קריטי ליתרון. כאן החברה מסכנת את הלב שלה ומאבדת שליטה עליו."},{"id":"m6-4","q":"מה הם החסרונות של מיקור חוץ לפי הקורס?","o":["אובדן שליטה ותלות חיצונית","קשיים בשילוב התרבות הארגונית של שתי חברות","סיכון גבוה במיוחד, כמו בהגוונה","עלות גבוהה מאוד ושליטה גבוהה"],"a":0,"w":["","זה חיסרון של מיזוגים ורכישות.","הסיכון הגבוה ביותר שייך להגוונה במטריצת אנסוף.","זה תיאור של רכישה/גרינפילד בכניסה לשוק בינלאומי."],"why":"כשאחרים מבצעים את הפעילות, החברה שולטת בה פחות ותלויה בספק."},{"id":"m6-5","q":"חברות התעופה AirNord ו-SunJet, שכל אחת מהן נשארת עצמאית, חתמו על הסכם: הן ימכרו כרטיסים זו בטיסות של זו, יפעילו מועדון נוסע מתמיד משותף וישתפו טרקלינים. מה זה?","o":["ברית אסטרטגית","מיזוג","רכישה","מיזם משותף"],"a":0,"w":["","במיזוג שתי החברות מתאחדות לגוף אחד; כאן כל אחת נשארת עצמאית.","אף אחת לא קנתה את המניות של השנייה.","לא הוקמה ישות חדשה בבעלות משותפת; זה הסכם שיתוף פעולה רחב."],"why":"שיתוף פעולה בין חברות עצמאיות, בלי שינוי בעלות ובלי ישות חדשה = ברית אסטרטגית (כמו Star Alliance)."},{"id":"m6-6","q":"החברות BatteryOne ו-VoltCar הקימו חברה חדשה בבעלות של 50% לכל אחת, כדי לבנות מפעל סוללות. אף אחת לא יכלה לממן את המפעל לבד, ולכל אחת ידע שהשנייה צריכה. מה זה?","o":["מיקור חוץ","מיזם משותף","רכישה","אינטגרציה אופקית"],"a":1,"w":["אף אחת לא קונה שירות מהשנייה; הן שותפות בבעלות.","","אף אחת לא קנתה את השנייה; הן הקימו גוף משותף חדש.","אינטגרציה היא רכישה של מתחרה; כאן אין רכישה."],"why":"ישות משותפת חדשה, כי אין יכולת כלכלית לכל אחת לבד ולכל אחת ידע נחוץ = מיזם משותף."},{"id":"m6-7","q":"מה ההבדל בין שיתוף פעולה (ברית אסטרטגית) לבין מיזם משותף לפי הקורס?","o":["מיזם משותף הוא מושג רחב יותר, וברית היא מקרה פרטי שלו","בברית אחת החברות קונה את השנייה","שיתוף פעולה הוא מושג רחב וכללי, ומיזם משותף הוא צורה ספציפית ומהודקת יותר","אין ביניהם שום הבדל"],"a":2,"w":["ההפך: הברית היא המושג הרחב.","בברית אין שינוי בעלות; קנייה היא רכישה.","","הסיכום מדגיש במפורש שיש הבדל ברוחב ובהידוק."],"why":"לפי הסיכום: שיתוף פעולה = מושג רחב לשילוב כוחות; מיזם משותף = ספציפי ומהודק יותר."},{"id":"m6-8","q":"מתי נשקול מיזם משותף, לפי הקורס?","o":["כשהפעילות אינה קריטית ליתרון התחרותי","כשרוצים שליטה מלאה בחברה השנייה","כשאין יכולת כלכלית לכל אחת מהחברות בנפרד, ו/או לכל אחת יש ידע מסוים שנחוץ","כשרוצים למכור מוצרים קיימים יותר באותו שוק"],"a":2,"w":["זה התנאי למיקור חוץ.","שליטה מלאה מתקבלת ברכישה.","","זו חדירה לשוק במטריצת אנסוף."],"why":"מיזם משותף מתאים כשמשאבים כספיים או ידע חסרים לכל צד לבד."},{"id":"m6-9","q":"שני בנקים בגודל דומה, BankNord ו-CityTrust, החליטו להתאחד משפטית לבנק אחד, כדי ליצור גוף חזק יותר מול המתחרים. מה זה?","o":["רכישה","ברית אסטרטגית","מיזם משותף","מיזוג"],"a":3,"w":["ברכישה חברה אחת קונה את השנייה והשליטה עוברת אליה; כאן שתי חברות דומות מתאחדות.","בברית החברות נשארות עצמאיות.","לא הוקמה ישות צדדית לפרויקט; כל הבנקים התאחדו.",""],"why":"איחוד משפטי של שתי חברות שוות או דומות ליצירת כוח משותף חזק יותר = מיזוג."},{"id":"m6-10","q":"GiantSoft קנתה את כל המניות של הסטארטאפ AppLeaf. AppLeaf ממשיכה לפעול בשם שלה, אבל כל ההחלטות מתקבלות בהנהלת GiantSoft. מה זה?","o":["מיזוג","רכישה","ברית אסטרטגית","מיקור חוץ"],"a":1,"w":["במיזוג שתי חברות דומות מתאחדות; כאן אחת קנתה את השנייה והשליטה עברה אליה.","","בברית אין העברת בעלות ושליטה.","מיקור חוץ הוא קניית שירות, לא קניית חברה."],"why":"הרוכשת קנתה מניות ונכסים, הנרכשת ממשיכה כחברת בת, והשליטה עברה במלואה = רכישה."},{"id":"m6-11","q":"רשת הסופרמרקטים FreshMart קנתה את רשת הסופרמרקטים המתחרה GreenBasket. איזה סוג אינטגרציה זה?","o":["אינטגרציה אנכית לאחור","אינטגרציה אופקית","אינטגרציה אנכית לפנים","מיקור חוץ"],"a":1,"w":["לאחור = רכישת ספק; GreenBasket היא מתחרה, לא ספק.","","לפנים = רכישת מפיץ או לקוח; כאן נרכשה רשת באותו שלב.","זו רכישה של חברה, לא העברת פעילות לספק."],"why":"רכישת מתחרה שפועל באותו שלב בנתיב ההפצה = אינטגרציה אופקית."},{"id":"m6-12","q":"יצרנית השוקולד ChocoLux קנתה מטע קקאו בגאנה, שממנו היא קונה את חומר הגלם. איזה סוג אינטגרציה זה?","o":["אינטגרציה אנכית לפנים","אינטגרציה אופקית","הגוונה","אינטגרציה אנכית לאחור"],"a":3,"w":["לפנים היא לכיוון המפיצים והלקוחות; מטע הקקאו הוא ספק.","מטע הקקאו אינו מתחרה באותו שלב.","החברה נשארת בעסקי השוקולד; היא רק משתלטת על הספק שלה.",""],"why":"רכישת ספק, שלב קודם בשרשרת הערך = אינטגרציה אנכית לאחור."},{"id":"m6-13","q":"מבשלת הבירה HopHouse קנתה רשת של 40 פאבים שמוכרים את הבירה שלה. איזה סוג אינטגרציה זה?","o":["אינטגרציה אנכית לאחור","אינטגרציה אנכית לפנים","אינטגרציה אופקית","ברית אסטרטגית"],"a":1,"w":["לאחור היא לכיוון הספקים, למשל חוות שעורה.","","הפאבים אינם מבשלות מתחרות; הם הערוץ שמוכר ללקוח.","זו רכישה עם העברת בעלות, לא שיתוף פעולה בין חברות עצמאיות."],"why":"רכישת מפיץ/לקוח, השלב הבא בשרשרת הערך = אינטגרציה אנכית לפנים."},{"id":"m6-14","q":"ב-2005 eBay רכשה את Skype בכ-2.6 מיליארד דולר, ולא הצליחה לייצר חיבור בין שני העסקים. מה המקרה הזה ממחיש בקורס?","o":["חיסרון של M&A: לעיתים מיזוגים ורכישות לא מצליחים","יתרון של M&A: התגברות על חסמי כניסה","הצלחה של אסטרטגיית חדירה לשוק","דוגמה למיקור חוץ מוצלח"],"a":0,"w":["","הסיכום מציג את המקרה בצד החסרונות.","זו רכישה של חברה בתחום אחר, לא מכירה של מוצר קיים בשוק קיים.","eBay קנתה את Skype; היא לא העבירה אליה פעילות."],"why":"eBay–Skype מופיע בטבלת M&A תחת ״חסרונות״: לעיתים המיזוגים/הרכישות אינם מצליחים."},{"id":"m6-15","q":"איזה מהבאים <b>אינו</b> יתרון של מיזוגים ורכישות לפי הקורס?","o":["השגת כוח שוק מוגבר","התגברות על חסמי כניסה","צמצום עלויות","שילוב ארגוני ותרבותי קל ומובטח"],"a":3,"w":["זה יתרון מרכזי של M&A.","זה יתרון: קונים חברה שכבר נמצאת בשוק.","זה יתרון: חוסכים כפילויות.",""],"why":"השילוב הארגוני והתרבותי הוא דווקא אחד החסרונות של M&A: הוא קשה, ולפעמים מכשיל את העסקה."},{"id":"m6-16","q":"חברת המשקאות FizzUp מוכרת את המשקה שלה בישראל כבר עשר שנים. השנה היא מציעה מבצעי ״1+1״ בסופרמרקטים ומגדילה מאוד את תקציב הפרסום, כדי להגדיל את נתח השוק שלה בישראל. לפי מטריצת אנסוף, זו:","o":["פיתוח שווקים","פיתוח מוצרים","הגוונה","חדירה לשוק (העמקה)"],"a":3,"w":["השוק לא חדש: זו אותה ישראל ואותם לקוחות.","המוצר לא חדש: זה אותו משקה.","הגוונה היא מוצר חדש בשוק חדש; כאן שניהם קיימים.",""],"why":"מוצר קיים + שוק קיים + מבצעים ופרסום להגדלת נתח שוק = חדירה לשוק, האסטרטגיה בעלת הסיכון הנמוך ביותר."},{"id":"m6-17","q":"רשת ההמבורגרים הישראלית BurgerBros פותחת סניפים בגרמניה עם אותו תפריט בדיוק. לפי מטריצת אנסוף, זו:","o":["חדירה לשוק","פיתוח מוצרים","הגוונה","פיתוח שווקים"],"a":3,"w":["חדירה היא באותו שוק; גרמניה היא שוק חדש.","התפריט לא השתנה; המוצר קיים.","הגוונה דורשת גם מוצר חדש; כאן המוצר קיים.",""],"why":"מוצר קיים + שוק חדש (סניפים בחו״ל) = פיתוח שווקים."},{"id":"m6-18","q":"הבנק SafeBank משיק ללקוחות הקיימים שלו אפליקציית השקעות חדשה לגמרי, שלא הייתה לו קודם. לפי מטריצת אנסוף, זו:","o":["פיתוח מוצרים","פיתוח שווקים","חדירה לשוק","הגוונה"],"a":0,"w":["","הלקוחות והשוק קיימים; רק המוצר חדש.","בחדירה מוכרים מוצר קיים; כאן המוצר חדש.","בהגוונה גם השוק חדש; כאן הלקוחות הם הלקוחות הקיימים."],"why":"מוצר חדש + שוק (לקוחות) קיים = פיתוח מוצרים."},{"id":"m6-19","q":"חברת המזון TastyFoods, שעד היום ייצרה רק מוצרי חלב, נכנסת לתחום המלונאות ובונה רשת בתי מלון. לפי מטריצת אנסוף, זו:","o":["פיתוח מוצרים","פיתוח שווקים","הגוונה (גיוון)","חדירה לשוק"],"a":2,"w":["גם הלקוחות והשוק חדשים, לא רק המוצר.","המוצר לא קיים אצל החברה; בית מלון הוא מוצר חדש לגמרי.","","בחדירה גם המוצר וגם השוק קיימים."],"why":"מוצר חדש לחלוטין + שוק חדש = הגוונה, האסטרטגיה המורכבת והמסוכנת ביותר."},{"id":"m6-20","q":"איזו אסטרטגיה במטריצת אנסוף היא בעלת רמת הסיכון הנמוכה ביותר?","o":["הגוונה","פיתוח שווקים","חדירה לשוק (העמקה)","פיתוח מוצרים"],"a":2,"w":["הגוונה היא המסוכנת ביותר: גם מוצר וגם שוק חדשים.","יש בה שוק חדש ולכן יותר אי-ודאות מחדירה.","","יש בה מוצר חדש ולכן יותר אי-ודאות מחדירה."],"why":"בחדירה לשוק החברה מכירה גם את המוצר וגם את השוק, ולכן הסיכון הנמוך ביותר."},{"id":"m6-21","q":"איזו אסטרטגיה במטריצת אנסוף היא המורכבת והמסוכנת ביותר?","o":["חדירה לשוק","פיתוח מוצרים","פיתוח שווקים","הגוונה (גיוון)"],"a":3,"w":["חדירה היא הבטוחה ביותר.","בפיתוח מוצרים השוק מוכר לחברה.","בפיתוח שווקים המוצר מוכר לחברה.",""],"why":"בהגוונה גם המוצר וגם השוק חדשים, ולכן החברה פועלת בלי ידע קודם בשני המישורים."},{"id":"m6-22","q":"על אילו שני ממדים בנויה מטריצת אנסוף?","o":["עלות ושליטה","מוצרים (קיימים/חדשים) ושווקים (קיימים/חדשים)","חידוש טכנולוגי וחדשנות במודל העסקי","חיסכון בעלויות ותגובה מקומית"],"a":1,"w":["אלה ממדים של בחירת אופן כניסה לשוק בינלאומי (יחידה 7).","","אלה צירי מפת סוגי החדשנות (יחידה 5).","אלה צירי האסטרטגיות הבינלאומיות (יחידה 7)."],"why":"אנסוף מצליב מוצרים עם שווקים ומקבל ארבע חלופות צמיחה."},{"id":"m6-23","q":"רשת בתי הקפה BeanUp פנתה תמיד לאנשי עסקים. עכשיו היא פותחת סניפים ליד קמפוסים ומשיקה קמפיין שמכוון לסטודנטים, עם אותו תפריט. לפי מטריצת אנסוף, זו:","o":["חדירה לשוק","פיתוח שווקים","פיתוח מוצרים","הגוונה"],"a":1,"w":["קהל היעד חדש (סטודנטים), ולכן זה שוק חדש ולא העמקה בשוק הקיים.","","התפריט לא השתנה.","המוצר קיים, ולכן זו לא הגוונה."],"why":"פנייה לקהל יעד חדש עם מוצר קיים = פיתוח שווקים. שוק חדש הוא לא רק מדינה חדשה."},{"id":"m6-24","q":"שתי חברות תרופות עצמאיות מחליטות לעבוד יחד על פיתוח תרופה מסוימת, כל אחת עם הידע שלה, כדי שהתוצאה תהיה טובה יותר לשתיהן. מהי מטרת שיתוף פעולה כזה לפי הקורס?","o":["להעביר פעילות שאינה קריטית לגורם חיצוני","להעביר את השליטה המלאה לאחת החברות","לעבוד בשיתוף פעולה על פרויקט מסוים, כדי שהתוצאה תהיה טובה יותר לשני הצדדים","להוריד את נתח השוק של שתיהן"],"a":2,"w":["זו מטרת מיקור חוץ.","העברת שליטה מלאה היא רכישה.","","אין זו מטרה של שיתוף פעולה."],"why":"לפי הסיכום, מטרת הברית: פרויקט מסוים שתוצאתו טובה יותר לשני הצדדים."},{"id":"m6-25","q":"מהו החיסרון הבולט ביותר של מיקור חוץ (Outsourcing)?","o":["השקעה הונית גבוהה בהקמת ישות עסקית חדשה","קשיי שילוב תרבותי בין שתי חברות שמתאחדות","תלות בגורם חיצוני","פגיעה ביכולת להתמקד בעסקי הליבה","אף תשובה אינה נכונה"],"a":2,"w":["זה מאפיין של מיזם משותף.","זה חיסרון של מיזוגים ורכישות.","","להפך – מיקור חוץ מאפשר להתמקד בליבה.","יש תשובה נכונה: תלות בגורם חיצוני."],"why":"כשפעילות עוברת לספק, החברה תלויה בו: אם הוא נכשל, מאחר או מייקר – היא נפגעת."},{"id":"m6-26","q":"Microsoft, שהביאה ידע בפלטפורמות נתונים, ו-GE, שהביאה ידע ביישומי בריאות, הקימו ב-2012 חברה חדשה בבעלותן המשותפת – Caradigm – לשיפור שירותי הבריאות באמצעות נתונים. כיצד יש לסווג את Caradigm?","o":["רכישה של GE בידי Microsoft","מיזוג של שתי החברות לחברה אחת","מיקור חוץ של פיתוח התוכנה מ-GE ל-Microsoft","מיזם משותף (Joint Venture)","אינטגרציה אנכית לפנים"],"a":3,"w":["אף אחת לא קנתה את השנייה; שתיהן ממשיכות להתקיים.","במיזוג חברות-האם מתאחדות; כאן הן נשארו נפרדות והקימו ישות שלישית.","אין כאן ספק שמבצע פעילות תמורת תשלום; יש בעלות משותפת.","","אף אחת לא רכשה מפיץ או לקוח."],"why":"ישות חדשה בבעלות משותפת, שכל צד תורם לה ידע = מיזם משותף."},{"id":"m6-27","q":"Sony, יצרנית אלקטרוניקה, ו-Ericsson, ספקית טכנולוגיית תקשורת, הקימו ב-2001 את Sony Ericsson בבעלות משותפת לייצור טלפונים ניידים. שתי החברות המשיכו לפעול בנפרד. מה נכון?","o":["זה מיזם משותף: ישות חדשה בבעלות משותפת שכל צד תורם לה ידע","זה מיזוג, כי שמות החברות התאחדו לשם אחד","זו רכישה של Ericsson בידי Sony","Sony נקטה במיקור חוץ של כל הפעילות שלה","תשובות ב, ג נכונות"],"a":0,"w":["","השם המשותף לא הופך את זה למיזוג; חברות-האם נשארו נפרדות.","ב-2001 לא הייתה רכישה; הבעלות הייתה משותפת.","Sony לא העבירה פעילות לספק; היא שותפה בבעלות.","ב ו-ג אינן נכונות."],"why":"שתי חברות-אם ← ישות חדשה משותפת = מיזם משותף (הדוגמה מהשקף של המרצה)."},{"id":"m6-28","q":"ב-2012 רכשה Sony את חלקה של Ericsson ב-Sony Ericsson, והחברה הפכה ל-Sony Mobile. איך מסווגים את הצעד של 2012?","o":["הקמת מיזם משותף חדש","רכישה – Sony קיבלה שליטה מלאה","ברית אסטרטגית","מיקור חוץ","מיזוג של שתי חברות שוות"],"a":1,"w":["המיזם המשותף כבר היה קיים; כאן הוא הסתיים.","","בברית אין שינוי בבעלות; כאן הבעלות עברה.","לא הועברה פעילות לספק.","Ericsson לא התאחדה עם Sony; היא מכרה את חלקה."],"why":"Sony קנתה את המניות של השותפה וקיבלה שליטה מלאה ← רכישה."},{"id":"m6-29","q":"מה מבחין בין מיזם משותף כמו Caradigm לבין מיזוג?","o":["במיזם משותף אין השקעת הון כלל","מיזוג נעשה תמיד בין מתחרות, ומיזם משותף תמיד בין ספק ללקוח","במיזם משותף אחת החברות קונה את המניות של השנייה","אין הבדל; אלה שני שמות לאותו דבר","במיזם משותף חברות-האם ממשיכות להתקיים ומקימות ישות חדשה; במיזוג חברות-האם עצמן מתאחדות לגוף אחד"],"a":4,"w":["החברות משקיעות הון בישות החדשה.","זה לא הקריטריון; מיזם משותף יכול להיות בין כל שתי חברות שמשלימות ידע.","זו רכישה.","יש הבדל מהותי בגורל חברות-האם.",""],"why":"מיזם משותף = ילד משותף, ההורים חיים; מיזוג = שני ההורים הופכים לגוף אחד."},{"id":"m6-30","q":"מה מהבאים <b>אינו נכון</b> לגבי מיקור חוץ?","o":["הוא מתאים כשהפעילות אינה קריטית ליתרון התחרותי בר-הקיימא","הוא מאפשר להתמקד בעסקי הליבה","החיסרון הבולט שלו הוא תלות בגורם חיצוני","כדאי להוציא החוצה דווקא את מקור היתרון התחרותי, כדי לחסוך בעלויות","הוא יכול לחסוך בעלויות ולתת גישה למומחיות"],"a":3,"w":["זה נכון: התנאי ההכרחי.","זה נכון: זה היתרון המרכזי.","זה נכון: החיסרון הבולט.","","זה נכון: יתרונות נוספים."],"why":"את מקור היתרון לא מוציאים החוצה – התנאי ההכרחי הוא שהפעילות אינה קריטית ליתרון."}],"tf":[{"id":"m6-t1","s":"מיקור חוץ הוא העברת פעילויות לגורם חיצוני מומחה או בעל עלויות נמוכות יותר, כדי להתמקד בעסקי הליבה.","a":true,"why":"נכון. זו ההגדרה בקורס."},{"id":"m6-t2","s":"מומלץ להעביר למיקור חוץ דווקא את הפעילות שמהווה את מקור היתרון התחרותי, כי ספק מומחה יבצע אותה טוב יותר.","a":false,"why":"לא נכון. התנאי ההכרחי הוא שהפעילות אינה קריטית ליתרון תחרותי בר-קיימא."},{"id":"m6-t3","s":"החסרונות של מיקור חוץ הם אובדן שליטה ותלות חיצונית.","a":true,"why":"נכון. הספק מבצע את הפעילות, ולכן החברה שולטת בה פחות ותלויה בו."},{"id":"m6-t4","s":"מיזם משותף הוא מושג רחב וכללי יותר מברית אסטרטגית.","a":false,"why":"לא נכון. ההפך: ברית (שיתוף פעולה) היא מושג רחב, ומיזם משותף הוא צורה ספציפית ומהודקת יותר."},{"id":"m6-t5","s":"נשקול ברית אסטרטגית כאשר נרצה לחדור לשווקים חדשים או גלובליים, או לפתח טכנולוגיות מתקדמות.","a":true,"why":"נכון. אלה שני המצבים שהסיכום מציין."},{"id":"m6-t6","s":"במיזוג, חברה אחת קונה את מניות החברה השנייה, וזו ממשיכה לפעול כחברת בת.","a":false,"why":"לא נכון. זה תיאור של רכישה. מיזוג הוא איחוד משפטי של שתי חברות שוות או דומות."},{"id":"m6-t7","s":"ברכישה, השליטה עוברת במלואה לחברה הרוכשת.","a":true,"why":"נכון. גם אם הנרכשת ממשיכה לפעול כחברת בת, השליטה כולה אצל הרוכשת."},{"id":"m6-t8","s":"אינטגרציה אופקית היא רכישה של ספק חומרי הגלם של החברה.","a":false,"why":"לא נכון. רכישת ספק היא אינטגרציה אנכית לאחור. אופקית היא רכישת מתחרה באותו שלב."},{"id":"m6-t9","s":"אינטגרציה אנכית לאחור היא רכישת ספקים.","a":true,"why":"נכון. ״לאחור״ = לכיוון חומרי הגלם בשרשרת הערך."},{"id":"m6-t10","s":"אינטגרציה אנכית לפנים היא רכישת מפיצים או לקוחות.","a":true,"why":"נכון. ״לפנים״ = לכיוון הלקוח הסופי בשרשרת הערך."},{"id":"m6-t11","s":"מיזוגים ורכישות תמיד מצליחים, כי הם יוצרים סינרגיה.","a":false,"why":"לא נכון. יש סיכון לכישלון המיזוג, כמו במקרה eBay–Skype."},{"id":"m6-t12","s":"רכישת Skype על ידי eBay ב-2005 מוצגת בקורס כדוגמה לרכישה שלא הצליחה.","a":true,"why":"נכון. היא מופיעה בצד החסרונות של M&A."},{"id":"m6-t13","s":"מטריצת אנסוף מצליבה מוצרים (קיימים/חדשים) עם שווקים (קיימים/חדשים).","a":true,"why":"נכון. כך מתקבלות ארבע חלופות צמיחה."},{"id":"m6-t14","s":"חדירה לשוק היא האסטרטגיה המסוכנת ביותר במטריצת אנסוף.","a":false,"why":"לא נכון. חדירה לשוק היא בעלת הסיכון הנמוך ביותר. המסוכנת ביותר היא הגוונה."},{"id":"m6-t15","s":"הגוונה היא פיתוח מוצרים חדשים לחלוטין לשווקים חדשים.","a":true,"why":"נכון. לכן היא המורכבת והמסוכנת ביותר."},{"id":"m6-t16","s":"פתיחת סניפים בחו״ל עם אותם מוצרים היא פיתוח מוצרים לפי אנסוף.","a":false,"why":"לא נכון. מוצר קיים בשוק חדש הוא פיתוח שווקים."},{"id":"m6-t17","s":"אחד החסרונות של מיזוגים ורכישות הוא הקושי בשילוב הארגוני והתרבותי.","a":true,"why":"נכון. שתי חברות עם תרבויות שונות צריכות לעבוד כגוף אחד, וזה עלול להכשיל את המהלך."},{"id":"m6-t18","s":"התגברות על חסמי כניסה היא אחד היתרונות של מיזוגים ורכישות.","a":true,"why":"נכון. קונים חברה שכבר נמצאת בשוק, וכך עוקפים את החסמים."},{"id":"m6-t19","s":"החיסרון הבולט ביותר של מיקור חוץ הוא התלות בגורם חיצוני.","a":true,"why":"נכון. אם הספק נכשל, מאחר או מייקר – החברה נפגעת ואינה יכולה להחליף אותו מיד."},{"id":"m6-t20","s":"Caradigm, שהקימו Microsoft ו-GE, היא תוצאה של מיזוג בין שתי החברות.","a":false,"why":"לא נכון. Microsoft ו-GE נשארו חברות נפרדות והקימו ישות חדשה משותפת – מיזם משותף."},{"id":"m6-t21","s":"Sony Ericsson הוקמה כמיזם משותף של Sony ושל Ericsson.","a":true,"why":"נכון. ישות חדשה בבעלות משותפת: Sony הביאה אלקטרוניקה ומותג, Ericsson טכנולוגיית תקשורת."},{"id":"m6-t22","s":"בהקמת Caradigm, GE נקטה במיקור חוץ, כי העבירה את פיתוח התוכנה ל-Microsoft.","a":false,"why":"לא נכון. אין כאן ספק שמבצע עבודה תמורת תשלום; שתי החברות שותפות בבעלות על ישות חדשה."}],"scope":[{"ref":"סיכום · עמ׳ 11","x":"מיקור חוץ: מתי (התנאי ההכרחי), יתרונות וחסרונות","imp":1,"h":"מיקור חוץ (Outsourcing)"},{"ref":"סיכום · עמ׳ 11","x":"ברית אסטרטגית / שיתוף פעולה: מתי לשקול ומה המטרה","imp":1,"h":"ברית אסטרטגית / שיתוף פעולה אסטרטגי (Strategic Alliance)"},{"ref":"סיכום · עמ׳ 11","x":"מיזם משותף (Joint Venture): מתי לשקול","imp":1,"h":"מיזם משותף (Joint Venture)"},{"ref":"חומר המרצה · מבחן לדוגמה","x":"דוגמאות המרצה למיזם משותף: Caradigm (Microsoft + GE) ו-Sony Ericsson","imp":1,"h":"דוגמאות המרצה למיזם משותף: Caradigm ו-Sony Ericsson"},{"ref":"סיכום · עמ׳ 11","x":"ההבדל בין שיתוף פעולה למיזם משותף","imp":1,"h":"ברית אסטרטגית מול מיזם משותף"},{"ref":"סיכום · עמ׳ 11","x":"מיזוגים ורכישות: מיזוג מול רכישה","imp":1,"h":"מיזוגים ורכישות (M&A)"},{"ref":"סיכום · עמ׳ 11","x":"יתרונות וחסרונות M&A ומקרה eBay–Skype","imp":1,"h":"יתרונות וחסרונות של M&A, ומקרה eBay–Skype"},{"ref":"סיכום · עמ׳ 12","x":"אינטגרציה אופקית ואנכית (לאחור/לפנים)","imp":1,"h":"אינטגרציה אופקית ואינטגרציה אנכית"},{"ref":"סיכום · עמ׳ 12","x":"מטריצת אנסוף: חדירה לשוק, פיתוח מוצרים, פיתוח שווקים, הגוונה","imp":2,"h":"מטריצת אנסוף: אסטרטגיות צמיחה (Ansoff Matrix)"}],"outScope":[]},{"id":"m7","title":"תחרות בשווקים בינלאומיים","short":"שווקים בינלאומיים","blurb":"יתרונות ואתגרים של גלובליזציה, ארבע האסטרטגיות הבינלאומיות לפי חיסכון בעלויות ותגובה מקומית, ואופני החדירה לפי עלות, שליטה וסיכון.","mnemonic":"ארבע האסטרטגיות: גלובלית = ״אותו דבר לכולם, הכי זול״; רב-מקומית = ״לכל מדינה משלה״; על-לאומית = ״גם וגם״; בינלאומית = ״לא זה ולא זה – מוכרים את מה שיש בבית״. אופני חדירה, מהזול לבעלות מלאה: זיכיון/רישיון (זול, בטוח) ← ייצוא וברית (בינוני) ← רכישה/Greenfield (יקר, שליטה מלאה, סיכון עולה).","blocks":[{"t":"h","x":"גלובליזציה: יתרונות ואתגרים"},{"t":"p","x":"<b>גלובליזציה</b> היא התהליך שבו שווקים, ייצור, הון וידע עוברים בין מדינות כמעט בלי גבולות. לחברה היא פותחת הזדמנויות, אבל גם מביאה אתגרים."},{"t":"table","head":["יתרונות (הזדמנויות)","אתגרים (קשיים)"],"rows":[["<b>הארכת חיי המוצר</b>: מוצר שנמצא בדעיכה בשוק אחד יכול להתחיל מחדש בשוק אחר","<b>התנהגות צרכנים</b> שונה: טעמים, הרגלים, ציפיות"],["<b>גישה לכוח עבודה זול</b>","<b>רגולציה</b>: חוקים ותקנים שונים בכל מדינה"],["<b>הבטחת משאבים</b>: גישה לחומרי גלם ולמקורות אנרגיה","<b>מיסוי</b> ומכסים"],["שוק גדול יותר ויתרון לגודל (ידע כללי)","<b>שפה ותרבות</b>"],["פיזור סיכון בין כמה שווקים (ידע כללי)","<b>סביבה פוליטית</b>: יציבות, יחסים בין מדינות"]]},{"t":"example","x":"יצרנית מכשירי הטלפון הקווי TeleOne כמעט לא מוכרת יותר באירופה, אבל באפריקה עדיין יש ביקוש. היא מעבירה את המכירות לשם ← <b>הארכת חיי המוצר</b>. במקביל היא מגלה שבכל מדינה יש תקן חשמל אחר ומכס אחר ← אתגרי <b>רגולציה ומיסוי</b>.","title":"דוגמה"},{"t":"trap","x":"״הבטחת משאבים״ ו״גישה לכוח עבודה זול״ הם <b>יתרונות</b> של גלובליזציה. ״שפה, תרבות, רגולציה, מיסוי ופוליטיקה״ הם <b>אתגרים</b>. מסיחים מחליפים ביניהם."},{"t":"h","x":"ארבע האסטרטגיות הבינלאומיות: לחץ לחיסכון בעלויות × לחץ לתגובה מקומית"},{"t":"p","x":"ברמת התאגיד, החברה בוחרת אסטרטגיה בינלאומית לפי שני לחצים:"},{"t":"list","x":["<b>הלחץ (הצורך) לחיסכון בעלויות</b>: עד כמה התחרות היא על מחיר? אם המוצר דומה אצל כולם, חייבים להיות זולים, ולכן מייצרים מוצר אחיד בכמויות ענק.","<b>הלחץ (הצורך) לתגובה מקומית</b>: עד כמה כל מדינה רוצה משהו אחר? טעמים, שפה, חוקים, ערוצי הפצה."]},{"t":"table","head":["","צורך <b>נמוך</b> בתגובה מקומית","צורך <b>גבוה</b> בתגובה מקומית"],"rows":[["צורך <b>גבוה</b> בחיסכון בעלויות","<b>גלובלית</b> (Global) – מוצר אחיד","<b>על-לאומית</b> (Transnational) – גם וגם"],["צורך <b>נמוך</b> בחיסכון בעלויות","<b>בינלאומית</b> (International) – נמוך בשניהם","<b>רב-מקומית</b> (Multi-domestic) – התאמה מלאה לכל מדינה"]]},{"t":"p","x":"זה המודל של <b>Bartlett & Ghoshal</b>, כפי שהוא מופיע אצל Hill & Jones."},{"t":"trap","x":"אל תתבלבלו בשמות: <b>גלובלית</b> = מוצר אחיד לכל העולם (חיסכון). <b>בינלאומית</b> = נמוך בשני הצירים. <b>על-לאומית</b> = גבוה בשני הצירים. <b>רב-מקומית</b> = התאמה מקומית מלאה. השם ״בינלאומית״ נשמע כללי, אבל במבחן הוא המשבצת נמוך-נמוך."},{"t":"exam","x":"שאלה ישירה: ״צורך גבוה בחיסכון ונמוך בתגובה מקומית?״ ← גלובלית. שאלת סיפור: מחפשים מילים כמו ״אותו מוצר בכל העולם״, ״כל מדינה מקבלת גרסה משלה״, ״גם זול וגם מותאם״."},{"t":"h","x":"כל אסטרטגיה בפירוט, עם דוגמאות"},{"t":"table","head":["אסטרטגיה","חיסכון בעלויות","תגובה מקומית","מה זה בפועל","דוגמה"],"rows":[["<b>גלובלית</b> (Global)","גבוה","נמוך","<b>מוצר אחיד</b> לכל העולם, מיוצר בכמה מפעלים גדולים כדי ליהנות מיתרון לגודל","Intel – אותו מעבד בכל מדינה; Microsoft, Tide, Gillette (בתרשים המרצה); Bic"],["<b>רב-מקומית</b> (Multi-domestic)","נמוך","גבוה","<b>התאמה מלאה לכל מדינה</b>: מוצר, שיווק ולפעמים מותג. כל חברת בת פועלת כמעט כחברה מקומית","חברות מזון שמשנות מתכונים ומותגים לכל מדינה (Nestlé, Unilever); בתרשים המרצה גם Sony ו-Caterpillar (CAT)"],["<b>על-לאומית</b> (Transnational)","גבוה","גבוה","מנסים <b>גם להיות יעילים וגם להתאים</b>: פלטפורמה ותהליכים משותפים, ושכבה מקומית מעליהם. הכי קשה לנהל","McDonald׳s – מערכת תפעול גלובלית אחידה, ותפריט עם מנות מקומיות; Toyota, Ford (בתרשים המרצה)"],["<b>בינלאומית</b> (International)","נמוך","נמוך","מוכרים בחו״ל את <b>המוצר שפותח בבית</b>, כמעט בלי התאמות. מתאים כשהמוצר ייחודי ואין לחץ מחיר","חברה עם מוצר ייחודי ומעט מתחרים, שמוכרת אותו בחו״ל כמו שהוא (למשל יצרנית ציוד מדעי ייחודי)"]]},{"t":"example","x":"חברת הצעצועים ToyNation מוכרת בכל מדינה את אותם משחקים. היא נלחמת על מחיר מול מתחרים מסין, ולכן מרכזת את כל הייצור בשני מפעלים ענקיים. ← צורך גבוה בחיסכון, נמוך בהתאמה ← <b>גלובלית</b>.","title":"סיפור"},{"t":"example","x":"רשת המזון QuickBite מחזיקה מערכת רכש, מטבחים ותוכנה אחידים בכל העולם, אבל בכל מדינה התפריט כולל מנות מקומיות. ← גם חיסכון וגם התאמה ← <b>על-לאומית</b>.","title":"סיפור"},{"t":"trap","x":"״המוצר מותאם לכל מדינה״ לבד מצביע על <b>רב-מקומית</b>. רק אם הסיפור מדגיש <b>גם</b> לחץ חזק על עלויות (תחרות מחיר, פלטפורמה משותפת, יתרון לגודל) – זו <b>על-לאומית</b>."},{"t":"h","x":"התרשים של המרצה: הצורך בשילוב גלובלי × הצורך ביכולת תגובה מקומית"},{"t":"p","x":"בשקפים של המרצה (וגם בניתוח OTO-MOTORS) התרשים מנוסח קצת אחרת מהסיכום. <b>הציר האנכי = “הצורך בשילוב גלובלי”</b> (נמוך ← גבוה): עד כמה כדאי לחברה לשלב ולתאם את הפעילות בכל העולם כמערכת אחת – ייצור מרוכז, מוצר אחיד, יתרון לגודל. <b>הציר האופקי = “הצורך ביכולת תגובה מקומית”</b> (נמוך ← גבוה): עד כמה כל שוק דורש התאמה. בתרשים יש <b>שלוש</b> אסטרטגיות:"},{"t":"table","head":["אסטרטגיה (תרשים המרצה)","שילוב גלובלי","תגובה מקומית","הדוגמאות בשקף"],"rows":[["<b>גלובלית (אחידה)</b>","גבוה","נמוך","Tide, Gillette, Microsoft, Intel"],["<b>על-לאומית</b>","גבוה","גבוה","McDonald׳s, Toyota, Ford"],["<b>רב-מקומית</b>","נמוך","גבוה","Sony, Nestlé, Caterpillar (CAT)"]]},{"t":"p","x":"<b>איך מחברים לסיכום?</b> בסיכום הציר האנכי נקרא <b>“לחץ לחיסכון בעלויות”</b>, ויש <b>ארבע</b> משבצות. הסיבה שזה אותו ציר: שילוב גלובלי (מוצר אחיד, מפעלים מרוכזים, תיאום עולמי) הוא <b>הדרך</b> לחסוך בעלויות. לכן מתרגמים כך:"},{"t":"table","head":["תרשים המרצה","תרשים הסיכום","שם האסטרטגיה"],"rows":[["שילוב גלובלי <b>גבוה</b>, תגובה מקומית <b>נמוכה</b>","חיסכון בעלויות <b>גבוה</b>, תגובה מקומית <b>נמוכה</b>","<b>גלובלית</b> (אצל המרצה: “גלובלית (אחידה)”)"],["שילוב גלובלי <b>גבוה</b>, תגובה מקומית <b>גבוהה</b>","חיסכון <b>גבוה</b>, תגובה מקומית <b>גבוהה</b>","<b>על-לאומית</b> (Transnational)"],["שילוב גלובלי <b>נמוך</b>, תגובה מקומית <b>גבוהה</b>","חיסכון <b>נמוך</b>, תגובה מקומית <b>גבוהה</b>","<b>רב-מקומית</b> (Multi-domestic)"],["שילוב גלובלי <b>נמוך</b>, תגובה מקומית <b>נמוכה</b>","חיסכון <b>נמוך</b>, תגובה מקומית <b>נמוכה</b>","<b>בינלאומית</b> (International) – מופיעה <b>רק בסיכום</b>"]]},{"t":"trap","x":"אותה שאלה יכולה להגיע בשני ניסוחים: “צורך גבוה <b>בשילוב גלובלי</b> ונמוך בתגובה מקומית” או “לחץ גבוה <b>לחיסכון בעלויות</b> ונמוך לתגובה מקומית” – בשניהם התשובה <b>גלובלית (אחידה)</b>. “אחידה” = מוצר סטנדרטי אחד לכל העולם. ושימו לב: אם השאלה בנויה על התרשים של המרצה, אין בו “בינלאומית”; המשבצת נמוך-נמוך קיימת רק בתרשים הסיכום."},{"t":"exam","x":"איך שואלים: “לפי התרשים, חברה עם צורך גבוה בשילוב גלובלי וגם ביכולת תגובה מקומית תבחר ב...?” (על-לאומית), “Nestlé ו-Sony מוצגות כדוגמה ל...?” (רב-מקומית), “Intel ו-Microsoft?” (גלובלית אחידה). בתשובה פתוחה ציינו את שני הצירים בשמם."},{"t":"h","x":"התאמת אריזה, שיווק וסלוגנים = התגברות על פערי תרבות"},{"t":"p","x":"כשחברה נכנסת לשוק זר ומשנה את <b>סגנון האריזה</b>, את <b>שיטות השיווק</b> ואת <b>הסלוגנים</b> כדי שיתאימו ללקוחות המקומיים – המסקנה היא ש<b>החברה שואפת להתגבר על פערי תרבות</b>. שפה ותרבות הן אחד מאתגרי הגלובליזציה, וההתאמות האלה הן התגובה אליהם."},{"t":"list","x":["התאמות כאלה מעידות על <b>צורך גבוה ביכולת תגובה מקומית</b>.","לכן <b>לא</b> נמליץ במצב כזה על <b>אסטרטגיה גלובלית (אחידה)</b> – היא מניחה צורך <b>נמוך</b> בתגובה מקומית.","ואין שום סיבה ש<b>תסגור את פעילותה בשוק הבית</b> – התאמה לשוק זר לא מחייבת לוותר על השוק המקומי שבו היא פועלת."]},{"t":"example","x":"מותג החטיפים CrispCo נכנס לסין: הוא מחליף את צבע האריזה לאדום (צבע של מזל), כותב סלוגן חדש בסינית ומוכר דרך אפליקציות מקומיות במקום בסופרמרקטים. ← <b>התגברות על פערי תרבות</b>; צורך גבוה בתגובה מקומית.","title":"סיפור"},{"t":"trap","x":"שאלה עם “תשובות א, ג נכונות” מנסה לחבר את “מתגברת על פערי תרבות” (נכון) ל“נמליץ על אסטרטגיה גלובלית אחידה” (לא נכון). התאמה מקומית ואחידות גלובלית הן כיוונים <b>הפוכים</b>, ולכן הצירוף אינו נכון – רק “פערי תרבות” נכון."},{"t":"h","x":"אופני חדירה לשווקים בינלאומיים: עלות, שליטה וסיכון"},{"t":"p","x":"כשחברה נכנסת לשוק זר, היא בוחרת <b>אופן חדירה</b> לפי שלושה ממדים: <b>עלות</b> (כמה צריך להשקיע), <b>שליטה</b> (כמה החברה שולטת במה שקורה בשוק הזר) ו<b>סיכון</b>."},{"t":"table","head":["אופן חדירה","מה זה","עלות","שליטה","סיכון"],"rows":[["<b>ייצוא</b> (Export)","מייצרים בבית ושולחים לשוק הזר, לרוב דרך מפיץ מקומי","בינונית","נמוכה","נמוך"],["<b>זיכיון / רישיון</b> (Franchising / Licensing)","נותנים לחברה מקומית את הזכות להשתמש במותג, בשיטה או בטכנולוגיה, תמורת תשלום או תמלוגים","נמוכה","משתנה","נמוך"],["<b>בריתות אסטרטגיות</b> (Strategic Alliances)","שיתוף פעולה עם שותף מקומי שמכיר את השוק","בינונית","בינונית","נמוך"],["<b>רכישה / הקמת חברת בת חדשה</b> (Acquisition / Greenfield)","קונים חברה מקומית, או בונים מאפס חברת בת בבעלות מלאה","גבוהה","גבוהה","בינוני עד גבוה"]]},{"t":"p","x":"כלל: ככל שהחברה <b>משקיעה יותר</b> ושולטת יותר, גם <b>הסיכון עולה</b>. בקצה אחד זיכיון/רישיון – זול ובטוח, אבל השליטה בידי השותף. בקצה השני רכישה/גרינפילד – שליטה מלאה, אבל השקעה גבוהה וסיכון בינוני עד גבוה."},{"t":"list","x":["<b>Greenfield</b> = ״שדה ירוק״: בונים חברת בת חדשה מאפס (מפעל, משרדים, עובדים), בבעלות מלאה.","<b>זיכיון</b> (Franchising) נפוץ בשירותים: רשתות מזון ומלונות. <b>רישיון</b> (Licensing) נפוץ בטכנולוגיה ובמותגים: מתירים לייצר לפי הפטנט או תחת השם.","<b>שליטה ״משתנה״</b> בזיכיון/רישיון: תלוי כמה הדוק החוזה. זכיין של McDonald׳s מחויב לכללים רבים; ברישיון פשוט השליטה קטנה."]},{"t":"example","x":"1) יצרנית היין VinoSol מייצרת בישראל ושולחת ארגזים למפיץ ביפן ← <b>ייצוא</b>. 2) רשת ההמבורגרים GrillTown נותנת ליזם בברזיל לפתוח סניפים תחת המותג שלה תמורת דמי זיכיון ← <b>זיכיון</b>. 3) יצרנית הבגדים FabriCo בונה מפעל חדש משלה בווייטנאם ← <b>Greenfield</b>.","title":"סיפורים"},{"t":"trap","x":"ייצוא הוא <b>לא</b> הזול ביותר בטבלה של הקורס: העלות שלו <b>בינונית</b>. הזול ביותר הוא <b>זיכיון/רישיון</b>. וגם: ייצוא = שליטה <b>נמוכה</b>, כי מפיץ זר מוכר את המוצר."},{"t":"trap","x":"רכישה/גרינפילד היא <b>לא</b> בעלת הסיכון הנמוך ביותר, למרות שהשליטה מלאה. ההשקעה הגבוהה הופכת את הסיכון לבינוני עד גבוה."},{"t":"exam","x":"שאלות טיפוסיות: ״איזה אופן חדירה נותן את השליטה הגבוהה ביותר?״ ← רכישה/גרינפילד. ״חברה עם תקציב קטן שרוצה להיכנס מהר בסיכון נמוך ומוכנה לוותר על שליטה?״ ← זיכיון/רישיון. ״עלות בינונית, שליטה נמוכה, סיכון נמוך?״ ← ייצוא."},{"t":"h","x":"איך פותרים שאלת סיפור ביחידה"},{"t":"steps","x":["אם השאלה היא <b>איך מנהלים את הפעילות בכל המדינות</b> ← אחת מארבע האסטרטגיות. בדקו: האם יש לחץ חזק על מחיר? האם כל מדינה דורשת התאמה?","גבוה/נמוך ← <b>גלובלית</b>. נמוך/גבוה ← <b>רב-מקומית</b>. גבוה/גבוה ← <b>על-לאומית</b>. נמוך/נמוך ← <b>בינלאומית</b>.","אם השאלה היא <b>איך נכנסים</b> למדינה מסוימת ← אופן חדירה. בדקו: מי מייצר? מי הבעלים בשוק הזר? כמה השקיעו?","מייצרים בבית ושולחים ← ייצוא. נותנים זכות לאחר ← זיכיון/רישיון. שותף מקומי ← ברית. בעלות מלאה ← רכישה/Greenfield."],"title":"סדר עבודה"}],"cheat":["יתרונות גלובליזציה = הארכת חיי המוצר, כוח עבודה זול, הבטחת משאבים","אתגרי גלובליזציה = התנהגות צרכנים, רגולציה, מיסוי, שפה ותרבות, סביבה פוליטית","גריד הסיכום = צורך בחיסכון בעלויות × צורך בתגובה מקומית – 4 אסטרטגיות","גלובלית (אחידה) = חיסכון גבוה, תגובה מקומית נמוכה – מוצר אחיד לכל העולם","רב-מקומית = חיסכון נמוך, תגובה מקומית גבוהה – התאמה מלאה לכל מדינה","על-לאומית = גבוה בשניהם; בינלאומית = נמוך בשניהם (מופיעה רק בסיכום)","תרשים המרצה = <b>הצורך בשילוב גלובלי × הצורך ביכולת תגובה מקומית</b> – 3 אסטרטגיות","דוגמאות המרצה = גלובלית: Tide, Gillette, Microsoft, Intel; על-לאומית: McDonald׳s, Toyota, Ford; רב-מקומית: Sony, Nestlé, CAT","התאמת אריזה, שיווק וסלוגנים = התגברות על פערי תרבות (לא גלובלית אחידה)","ייצוא = עלות בינונית, שליטה נמוכה, סיכון נמוך","זיכיון/רישיון = עלות נמוכה, סיכון נמוך, שליטה משתנה; ברית = עלות ושליטה בינוניות, סיכון נמוך","רכישה/Greenfield = עלות גבוהה, שליטה גבוהה, סיכון בינוני עד גבוה"],"mcq":[{"id":"m7-1","q":"לפי הקורס, מה מאפיין אסטרטגיה גלובלית?","o":["צורך נמוך בחיסכון בעלויות וצורך גבוה בתגובה מקומית","צורך גבוה בחיסכון בעלויות וצורך נמוך בתגובה מקומית","צורך גבוה בשניהם","צורך נמוך בשניהם"],"a":1,"w":["זו אסטרטגיה רב-מקומית.","","זו אסטרטגיה על-לאומית.","זו אסטרטגיה בינלאומית."],"why":"גלובלית = מוצר אחיד לכל העולם כדי לחסוך בעלויות, כמעט בלי התאמות מקומיות."},{"id":"m7-2","q":"חברת השבבים ChipCore מוכרת את אותו מעבד בדיוק בכל מדינה. התחרות בענף היא בעיקר על מחיר, ולכן היא מייצרת בשני מפעלי ענק בלבד. איזו אסטרטגיה בינלאומית זו?","o
