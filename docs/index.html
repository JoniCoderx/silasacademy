f6:[() => {
  const s1 = pick([0.02, 0.03, 0.04, 0.05]), s2 = s1 + pick([0.005, 0.01, 0.015, -0.005]);
  const f = (1 + s2) ** 2 / (1 + s1) - 1, F = x => pct(x, 2);
  return G('f6', `ריבית הספוט לשנה היא ${pct(s1, 1)}, ולשנתיים ${pct(s2, 1)}. מהי ריבית הפורוורד לשנה השנייה?`, f,
    [(1 + s2) / (1 + s1) - 1, (s1 + s2) / 2, s1 + s2, s2 - s1, 2 * s2 - s1], F,
    SOL({ask: 'איזו ריבית לשנה השנייה בלבד מתאימה לריביות הספוט, כך שאין יתרון להשקעה לשנתיים על פני שתי השקעות של שנה.',
      f: GB('(1 + s<sub>2</sub>)² = (1 + s<sub>1</sub>)·(1 + f)'),
      why: `השקעה לשנתיים בריבית ${pct(s2, 1)} צריכה להניב כמו שנה ב־${pct(s1, 1)} ואחריה שנה בריבית הפורוורד. משווים את גורמי הצבירה ומחלצים את f.`,
      steps: [`צבירה לשנתיים: ${GB(`${nf(1 + s2, 3)}² = ${nf((1 + s2) ** 2, 6)}`)}`,
        `מחלקים בצבירה של השנה הראשונה: ${GB(`${nf((1 + s2) ** 2, 6)} / ${nf(1 + s1, 3)} = ${nf(1 + f, 6)}`)}`,
        `מורידים 1: ${GB(`f = ${F(f)}`)}`],
      res: `ריבית הפורוורד לשנה השנייה היא ${GR(F(f))}.`,
      tip: 'ריבית הספוט לשנתיים בריבוע (שתי שנים), חלקי השנה הראשונה. בקירוב: 2·s<sub>2</sub> − s<sub>1</sub>.'}),
    [`${F((1 + s2) / (1 + s1) - 1)} מתקבל בלי להעלות את ${GB(nf(1 + s2, 3))} בריבוע. ריבית הספוט לשנתיים נצברת שנתיים, ולכן הגורם בריבוע.`,
     `${F((s1 + s2) / 2)} הוא ממוצע של שתי ריביות הספוט. ריבית הספוט לשנתיים היא בעצמה מעין ממוצע של השנה הראשונה והשנייה, ולכן f רחוקה יותר מ־${pct(s1, 1)}.`,
     `${F(s1 + s2)} הוא סכום שתי הריביות, שאין לו משמעות כריבית לשנה אחת.`,
     `${F(s2 - s1)} הוא ההפרש בין הריביות. הפורוורד היא ריבית שלמה לשנה השנייה, לא רק התוספת.`,
     `${F(2 * s2 - s1)} הוא קירוב ליניארי (${GB('2·s<sub>2</sub> − s<sub>1</sub>')}). הוא מתעלם מריבית על ריבית. החישוב המדויק עם גורמי צבירה נותן ${F(f)}.`]);
}],
f7:[() => {
  const D0 = pick([1, 1.5, 2, 2.5, 3, 4]), g = pick([0.02, 0.03, 0.04, 0.05]), k = g + pick([0.04, 0.05, 0.06, 0.07]);
  const p = D0 * (1 + g) / (k - g), F = x => nf(x, 2) + ' ₪', N = x => nf(x, 2), D1 = D0 * (1 + g);
  return G('f7', `החברה חילקה זה עתה דיבידנד של ${nf(D0, 2)} ₪. שיעור הצמיחה הקבוע ${pct(g, 0)}, והתשואה הנדרשת ${pct(k, 0)}. מהו מחיר המניה?`, p,
    [D0 / (k - g), D0 * (1 + g) / k, D0 * (1 + g) ** 2 / (k - g), D0 * (1 + g) / (k + g)], F,
    SOL({ask: 'כמה שווה היום מניה שמחלקת דיבידנד שגדל בקצב קבוע לנצח (מודל גורדון).',
      f: GB('P<sub>0</sub> = D<sub>1</sub> / (k − g)'),
      why: `המחיר היום הוא הערך הנוכחי של כל הדיבידנדים העתידיים. הנוסחה משתמשת בדיבידנד של השנה הבאה (D<sub>1</sub>). הדיבידנד ${nf(D0, 2)} ₪ כבר חולק ולא שייך לקונה החדש, ולכן מגדילים אותו בשנה אחת של צמיחה.`,
      steps: [`הדיבידנד הבא: ${GB(`D<sub>1</sub> = ${nf(D0, 2)}·${1 + g} = ${nf(D1, 3)}`)}`,
        `המכנה: ${GB(`k − g = ${+k.toFixed(2)} − ${g} = ${nf(k - g, 2)}`)}`,
        `מחלקים: ${GB(`${nf(D1, 3)} / ${nf(k - g, 2)} = ${N(p)}`)}`],
      res: `מחיר המניה הוא ${GR(N(p))} ₪.`,
      tip: '"חולק זה עתה" פירושו D<sub>0</sub>. מכפילים אותו ב־<bdi dir="ltr">(1 + g)</bdi> לפני שמציבים בנוסחה.'}),
    [`${N(D0 / (k - g))} ₪ מתקבל מהצבת ${GB(`D<sub>0</sub> = ${nf(D0, 2)}`)} בנוסחה. הדיבידנד הזה כבר חולק. צריך את הדיבידנד הבא: ${GB(`D<sub>1</sub> = ${nf(D1, 3)}`)}.`,
     `${N(D1 / k)} ₪ מתקבל מחלוקה ב־k בלבד, בלי להוריד את g. כך מתייחסים לדיבידנד כאילו הוא לא צומח.`,
     `${N(D0 * (1 + g) ** 2 / (k - g))} ₪ מתקבל מהגדלת הדיבידנד פעמיים (${GB(`D<sub>2</sub> = ${nf(D0 * (1 + g) ** 2, 3)}`)}). המחיר היום מחושב עם D<sub>1</sub>, הדיבידנד של השנה הבאה בלבד.`,
     `${N(D1 / (k + g))} ₪ מתקבל מחיבור g למכנה. במודל גורדון מחסירים את הצמיחה: ${GB('k − g')}.`]);
}],
f8:[() => {
  const s1 = pick([0.1, 0.15, 0.2]), s2 = pick([0.25, 0.3, 0.35]), rho = pick([-0.5, -0.2, 0, 0.2, 0.4, 0.6]), w = pick([0.3, 0.4, 0.5, 0.6, 0.7]);
  const v = w * w * s1 * s1 + (1 - w) ** 2 * s2 * s2 + 2 * w * (1 - w) * rho * s1 * s2, sd = Math.sqrt(v);
  const F = x => pct(x, 2), wb = nf(1 - w, 1), t1 = w * w * s1 * s1, t2 = (1 - w) ** 2 * s2 * s2, t3 = 2 * w * (1 - w) * rho * s1 * s2;
  return G('f8', `תיק מורכב מ־${pct(w, 0)} בנכס A (σ = ${pct(s1, 0)}), והשאר בנכס B (σ = ${pct(s2, 0)}). מקדם המתאם בין הנכסים ${rho}. מהי סטיית התקן של התיק?`, sd,
    [w * s1 + (1 - w) * s2, Math.sqrt(t1 + t2), Math.sqrt(t1 + t2 + t3 / 2), v, Math.sqrt(w * s1 * s1 + (1 - w) * s2 * s2 + 2 * w * (1 - w) * rho * s1 * s2), Math.sqrt((1 - w) ** 2 * s1 * s1 + w * w * s2 * s2 + t3), Math.sqrt(t1 + t2 + 2 * w * (1 - w) * rho), w * w * s1 + (1 - w) ** 2 * s2], F,
    SOL({ask: 'מהו הסיכון (סטיית התקן) של תיק שמשלב שני נכסים, בהתחשב בקשר ביניהם.',
      f: GB('σ<sub>p</sub>² = w<sub>A</sub>²σ<sub>A</sub>² + w<sub>B</sub>²σ<sub>B</sub>² + 2·w<sub>A</sub>·w<sub>B</sub>·ρ·σ<sub>A</sub>·σ<sub>B</sub>'),
      why: 'הסיכון של תיק אינו ממוצע הסיכונים. כשהנכסים לא זזים יחד לגמרי (ρ &lt; 1), חלק מהתנודות מתקזזות. האיבר האחרון מכניס את הקשר בין הנכסים.',
      steps: [`איבר A: ${GB(`${w}²·${s1}² = ${nf(t1, 5)}`)}`,
        `איבר B: ${GB(`${wb}²·${s2}² = ${nf(t2, 5)}`)}`,
        `איבר הקשר: ${GB(`2·${w}·${wb}·(${rho})·${s1}·${s2} = ${nf(t3, 5)}`)}`,
        `שונות התיק: ${GB(`${nf(t1, 5)} + ${nf(t2, 5)} + ${nf(t3, 5)} = ${nf(v, 5)}`)}`,
        `סטיית התקן: ${GB(`√${nf(v, 5)} = ${F(sd)}`)}`],
      res: `סטיית התקן של התיק היא ${GR(F(sd))}.`,
      tip: 'מחשבים קודם שונות, ורק בסוף מוציאים שורש. איבר הקשר מוכפל ב־2.'}),
    [`${F(w * s1 + (1 - w) * s2)} הוא ממוצע משוקלל של סטיות התקן. זה נכון רק כשמקדם המתאם 1. כאן ${GB(`ρ = ${rho}`)}, וחלק מהסיכון מתקזז.`,
     `${F(Math.sqrt(t1 + t2))} מתקבל בלי איבר הקשר (${GB(`2·w<sub>A</sub>·w<sub>B</sub>·ρ·σ<sub>A</sub>·σ<sub>B</sub>`)}). מותר להשמיט אותו רק כש־ρ = 0.`,
     `${F(Math.sqrt(t1 + t2 + t3 / 2))} מתקבל מאיבר הקשר בלי ההכפלה ב־2 (${GB(nf(t3 / 2, 5))} במקום ${GB(nf(t3, 5))}).`,
     `${F(v)} היא השונות של התיק (${nf(v, 5)}), לא סטיית התקן. צריך להוציא ממנה שורש.`,
     `${F(Math.sqrt(w * s1 * s1 + (1 - w) * s2 * s2 + 2 * w * (1 - w) * rho * s1 * s2))} מתקבל מהכפלת השונויות במשקלות עצמם (${GB(`${w}·${s1}²`)}) במקום במשקלות בריבוע (${GB(`${w}²·${s1}²`)}).`,
     `${F(Math.sqrt((1 - w) ** 2 * s1 * s1 + w * w * s2 * s2 + t3))} מתקבל מהחלפת המשקלות: ${wb} ל־A ו־${w} ל־B. בתיק ${pct(w, 0)} בנכס A.`,
     `${F(Math.sqrt(t1 + t2 + 2 * w * (1 - w) * rho))} מתקבל משימוש במקדם המתאם ${GB(rho)} כאילו הוא השונות המשותפת. השונות המשותפת היא ${GB(`ρ·σ<sub>A</sub>·σ<sub>B</sub> = ${nf(rho * s1 * s2, 4)}`)}.`,
     `${F(w * w * s1 + (1 - w) ** 2 * s2)} מתקבל מהעלאת המשקלות בריבוע בלי להעלות את סטיות התקן בריבוע (${GB(`${w}²·${s1} + ${wb}²·${s2}`)}). בנוסחה גם σ בריבוע, ובסוף מוציאים שורש.`]);
}],
f9:[() => {
  const rf = pick([0.02, 0.03, 0.04]), rm = rf + pick([0.04, 0.05, 0.06, 0.07]), b = pick([0.6, 0.8, 1.2, 1.4, 1.5]);
  const e = rf + b * (rm - rf), F = x => pct(x, 2);
  return G('f9', `הריבית חסרת הסיכון ${pct(rf, 0)}, תשואת השוק הצפויה ${pct(rm, 0)}, והבטא של המניה ${b}. מהי התשואה הנדרשת לפי מודל CAPM?`, e,
    [rf + b * rm, b * (rm - rf), rm + b * (rm - rf), b * rm, rm], F,
    SOL({ask: 'איזו תשואה המשקיעים דורשים מהמניה בתמורה לסיכון השיטתי שלה.',
      f: GB('E(R) = r<sub>f</sub> + β·(E(R<sub>m</sub>) − r<sub>f</sub>)'),
      why: 'מקבלים את הריבית חסרת הסיכון, ועוד פיצוי על סיכון. הפיצוי הוא פרמיית הסיכון של השוק, מוכפלת בבטא: כמה המניה רגישה לשוק.',
      steps: [`פרמיית השוק: ${GB(`${pct(rm, 0)} − ${pct(rf, 0)} = ${pct(rm - rf, 0)}`)}`,
        `פרמיית המניה: ${GB(`${b}·${pct(rm - rf, 0)} = ${F(b * (rm - rf))}`)}`,
        `מוסיפים את הריבית חסרת הסיכון: ${GB(`${pct(rf, 0)} + ${F(b * (rm - rf))} = ${F(e)}`)}`],
      res: `התשואה הנדרשת היא ${GR(F(e))}.`,
      tip: 'הבטא מוכפלת בפרמיה (R<sub>m</sub> − r<sub>f</sub>), לא בתשואת השוק כולה.'}),
    [`${F(rf + b * rm)} מתקבל מהכפלת הבטא בתשואת השוק כולה (${GB(`${b}·${pct(rm, 0)}`)}). מכפילים רק בפרמיה ${GB(`${pct(rm, 0)} − ${pct(rf, 0)}`)}.`,
     `${F(b * (rm - rf))} היא פרמיית הסיכון של המניה בלבד. שכחו להוסיף את הריבית חסרת הסיכון ${pct(rf, 0)}.`,
     `${F(rm + b * (rm - rf))} מתקבל מהוספת הפרמיה לתשואת השוק במקום לריבית חסרת הסיכון. הבסיס בנוסחה הוא r<sub>f</sub> = ${pct(rf, 0)}.`,
     `${F(b * rm)} מתקבל מהכפלת הבטא בתשואת השוק בלבד. חסרים גם הריבית חסרת הסיכון וגם החיסור שלה מתשואת השוק.`,
     `${F(rm)} היא תשואת השוק. זו התשואה הנדרשת רק כשהבטא 1. כאן ${GB(`β = ${b}`)}, ולכן ${b > 1 ? 'דורשים יותר' : 'דורשים פחות'}.`]);
}, () => {
  const sm = pick([0.15, 0.2, 0.25]), b = pick([0.6, 0.8, 1.2, 1.5]), cov = b * sm * sm, F = x => nf(x, 3);
  return G('f9', `השונות המשותפת של המניה עם השוק היא ${nf(cov, 5)}, וסטיית התקן של השוק ${pct(sm, 0)}. מהי הבטא של המניה?`, b,
    [cov / sm, cov, sm * sm / cov, Math.sqrt(cov) / sm], F,
    SOL({ask: 'כמה המניה רגישה לתנודות השוק.',
      f: GB('β = Cov(R<sub>i</sub>, R<sub>m</sub>) / σ<sub>m</sub>²'),
      why: 'הבטא היא השיפוע של תשואת המניה ביחס לתשואת השוק. כמו בכל שיפוע רגרסיה, מחלקים את השונות המשותפת בשונות של המשתנה המסביר, כאן השוק.',
      steps: [`שונות השוק: ${GB(`σ<sub>m</sub>² = ${sm}² = ${nf(sm * sm, 4)}`)}`,
        `מחלקים: ${GB(`β = ${nf(cov, 5)} / ${nf(sm * sm, 4)} = ${F(b)}`)}`],
      res: `הבטא של המניה היא ${GR(F(b))}.`,
      tip: 'מחלקים בשונות השוק (σ²), לא בסטיית התקן. 20% בריבוע הוא 0.04.'}),
    [`${F(cov / sm)} מתקבל מחלוקה בסטיית התקן ${sm} במקום בשונות ${GB(`${sm}² = ${nf(sm * sm, 4)}`)}.`,
     `${F(cov)} היא השונות המשותפת עצמה. צריך לחלק אותה בשונות השוק ${nf(sm * sm, 4)}.`,
     `${F(sm * sm / cov)} מתקבל מחלוקה הפוכה: שונות השוק חלקי השונות המשותפת. השונות המשותפת במונה.`,
     `${F(Math.sqrt(cov) / sm)} מתקבל מהוצאת שורש מהשונות המשותפת, כאילו היא שונות, וחלוקה בסטיית התקן של השוק. בשונות המשותפת לא נוגעים: מחלקים אותה ב־σ<sub>m</sub>².`]);
}]
};

TOPICS.push(
{id:'f10', area:'fin', title:'קבלת החלטות בתנאי אי־ודאות', short:'אי־ודאות',
lesson:`
<p>כשהתוצאה של השקעה אינה ידועה מראש, מתארים אותה באמצעות תרחישים: לכל תרחיש יש הסתברות ותשואה. מהתרחישים מחשבים את התוחלת, כלומר כמה מרוויחים בממוצע, ואת סטיית התקן, שמודדת עד כמה ההשקעה מסוכנת.</p>
<div class="fx" dir="ltr">E(R) = Σ p<sub>i</sub>·R<sub>i</sub><br>σ² = Σ p<sub>i</sub>·(R<sub>i</sub> − E(R))² ,&nbsp; CV = σ / E(R)</div>
<h4>קריטריונים לבחירה בין השקעות</h4>
<ul>
<li><b>תוחלת מקסימלית</b>: מתאים למשקיע אדיש לסיכון, ומתעלם מהפיזור.</li>
<li><b>תוחלת־שונות (מרקוביץ)</b>: A <b>שולטת</b> ב־B אם <bdi dir="ltr">E(A) ≥ E(B)</bdi> וגם <bdi dir="ltr">σ(A) ≤ σ(B)</bdi>, כשלפחות אחד מאי־השוויונים חזק. כל משקיע שונא סיכון יעדיף את A.</li>
<li>כשאין שליטה, כלומר כשתשואה גבוהה יותר באה עם סיכון גבוה יותר, הבחירה תלויה בהעדפות המשקיע. מקדם ההשתנות מבטא את הסיכון ליחידת תשואה.</li>
</ul>
<h4>היחס לסיכון ופונקציית התועלת</h4>
<p>המשקיע מחשב <b>תוחלת תועלת</b> ובוחר באפשרות שתוחלת התועלת שלה הגבוהה ביותר: E[U] = Σ p·U(x).</p>
<ul>
<li><b>שונא סיכון</b>: פונקציית תועלת קעורה (למשל √x). דוחה הימור הוגן, והשווה הוודאי שלו נמוך מהתוחלת.</li>
<li><b>אדיש לסיכון</b>: פונקציית תועלת לינארית. מחליט לפי התוחלת בלבד.</li>
<li><b>אוהב סיכון</b>: פונקציית תועלת קמורה (למשל x²). השווה הוודאי שלו גבוה מהתוחלת.</li>
</ul>
<div class="fx" dir="ltr">CE: U(CE) = E[U(X)]<br>RP = E(X) − CE</div>
<p>CE הוא השווה הוודאי: הסכום הוודאי שנותן למשקיע אותה תועלת כמו ההימור. RP היא פרמיית הסיכון: כמה מהתוחלת המשקיע מוותר כדי להיפטר מהסיכון.</p>
<div class="ex"><b>דוגמה פתורה.</b> הימור: 50% לקבל 100 ו־50% לקבל 0. פונקציית התועלת: U = √x.<br>
התוחלת: <bdi dir="ltr">E(X) = 0.5·100 + 0.5·0 = 50</bdi>.<br>
תוחלת התועלת: <bdi dir="ltr">E[U] = 0.5·√100 + 0.5·√0 = 0.5·10 = 5</bdi>.<br>
השווה הוודאי הוא הסכום שהתועלת שלו 5: <bdi dir="ltr">√CE = 5</bdi>, ולכן <bdi dir="ltr">CE = 5² = 25</bdi>.<br>
פרמיית הסיכון: <bdi dir="ltr">RP = 50 − 25 = 25</bdi>. המשקיע שונא סיכון, ולכן יסכים לקבל 25 בוודאות במקום ההימור.</div>
<div class="ex"><b>דוגמה פתורה (שליטה).</b> A: תוחלת 10%, סטיית תקן 8%. B: תוחלת 9%, סטיית תקן 12%. C: תוחלת 14%, סטיית תקן 20%.<br>
A שולטת ב־B (תשואה צפויה גבוהה יותר וסיכון נמוך יותר), ולכן B נפסלת. בין A ל־C אין שליטה. מקדם ההשתנות של A הוא 0.8, ושל C הוא 1.43.</div>
<div class="plain"><b>במילים פשוטות:</b> רוב האנשים מעדיפים 25 ₪ בוודאות על פני הטלת מטבע על 100 ₪. הפער בין מה שההימור שווה בממוצע לבין הסכום הוודאי שמוכנים לקבל במקומו הוא פרמיית הסיכון.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחשב שונות בלי לשקלל לפי ההסתברויות.</li>
<li>לקבוע ש־C עדיפה על A רק כי התוחלת שלה גבוהה יותר. כשאין שליטה, אין תשובה חד־משמעית.</li>
<li>לזהות את השווה הוודאי עם תוחלת התועלת עצמה. צריך להפעיל את הפונקציה ההפוכה, למשל להעלות בריבוע.</li>
</ul></div>`},
{id:'s8', area:'stat', title:'מבוא לקומבינטוריקה', short:'קומבינטוריקה',
lesson:`
<p>קומבינטוריקה עונה על השאלה "בכמה דרכים?". הצעד הראשון בכל שאלה הוא לבדוק אם <b>הסדר חשוב</b> ואם מותרות <b>חזרות</b>.</p>
<div class="tbl-wrap"><table class="mini"><tr><th></th><th>עם חזרות</th><th>בלי חזרות</th></tr>
<tr><th>הסדר חשוב (חליפות)</th><td>n<sup>k</sup></td><td>n! / (n−k)!</td></tr>
<tr><th>הסדר אינו חשוב (צירופים)</th><td>C(n+k−1, k)</td><td>C(n,k) = n! / (k!(n−k)!)</td></tr></table></div>
<h4>כללים נוספים</h4>
<ul>
<li><b>עיקרון הכפל</b>: אם את שלב א' אפשר לבצע ב־m דרכים ואת שלב ב' ב־n דרכים, יש בסך הכול m·n אפשרויות.</li>
<li><b>תמורות</b>: מספר הסידורים של n עצמים שונים בשורה הוא n!.</li>
<li><b>תמורות עם עצמים זהים</b>: n! / (n₁!·n₂!·…).</li>
<li><b>סידור במעגל</b>: (n−1)!.</li>
<li>C(n,k) = C(n,n−k), ו־C(n,0) = C(n,n) = 1.</li>
</ul>
<h4>חישוב הסתברות בעזרת ספירה (התפלגות היפרגאומטרית)</h4>
<p>כשלכל התוצאות אותו סיכוי, ההסתברות היא מספר התוצאות הרצויות חלקי מספר כל התוצאות.</p>
<div class="fx" dir="ltr">P(X = k) = C(K,k)·C(N−K, n−k) / C(N,n)</div>
<p>כאן N הוא גודל האוכלוסייה, K מספר הפריטים ה״מיוחדים״ בה, n גודל המדגם, ו־k מספר הפריטים המיוחדים שרוצים במדגם.</p>
<div class="ex"><b>דוגמה פתורה.</b> בתיק 10 מניות, 4 מהן מניות טכנולוגיה. בוחרים באקראי 3 מניות.<br>
מספר האפשרויות הכולל: <bdi dir="ltr">C(10,3) = (10·9·8)/(3·2·1) = 120</bdi>.<br>
בדיוק 2 מניות טכנולוגיה: בוחרים 2 מתוך 4 מניות הטכנולוגיה ו־1 מתוך 6 האחרות: <bdi dir="ltr">C(4,2)·C(6,1) = 6·6 = 36</bdi>, ולכן <bdi dir="ltr">P = 36/120 = 0.3</bdi>.<br>
אף לא מניית טכנולוגיה אחת: בוחרים את כל 3 המניות מתוך 6 האחרות: <bdi dir="ltr">C(6,3) = 20</bdi>, ולכן <bdi dir="ltr">P = 20/120 = 1/6</bdi>.<br>
בכמה דרכים לבחור יו״ר, סגן וגזבר מתוך 10 אנשים? כאן הסדר חשוב: ליו״ר 10 אפשרויות, לסגן 9 ולגזבר 8, ובסך הכול <bdi dir="ltr">10·9·8 = 720</bdi>.</div>
<div class="plain"><b>במילים פשוטות:</b> אם החלפה בין שניים מהנבחרים יוצרת תוצאה חדשה (למשל יו״ר וסגן), הסדר חשוב. אם מתקבלת אותה תוצאה (למשל ועדה של שלושה), הסדר אינו חשוב, ומחלקים ב־k!.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להשתמש בצירופים כשיש תפקידים שונים, או להפך.</li>
<li>לשכוח לחלק במספר הסידורים של העצמים הזהים. למשל, מספר הסידורים של האותיות במילה ABBA (שתי A ושתי B) הוא <bdi dir="ltr">4!/(2!·2!) = 24/4 = 6</bdi>.</li>
<li>להכפיל במקום לחבר כשיש מקרים נפרדים ("בדיוק 2 <u>או</u> בדיוק 3").</li>
</ul></div>`}
);

         : `${nf(P, 0)} הוא מספר האפשרויות כשהסדר חשוב (<bdi dir="ltr">${prod}</bdi>). בצוות הסדר לא חשוב, ולכן מחלקים ב־<bdi dir="ltr">${k}! = ${kf}</bdi>.`,
     `${nf(n ** k, 0)} הוא <bdi dir="ltr">${n}<sup>${k}</sup></bdi>, כלומר בחירה עם חזרות. אותו מועמד לא יכול להיבחר פעמיים, ולכן בכל שלב נשארת אפשרות אחת פחות.`,
     `${nf(n * k, 0)} הוא <bdi dir="ltr">${n}·${k}</bdi>. לא כופלים את מספר המועמדים במספר הנבחרים, אלא כופלים זה בזה את מספרי האפשרויות בכל שלב: <bdi dir="ltr">${prod}</bdi>.`]);
}, () => {
  const N = ri(8, 12), K = ri(3, 5), n = 3, k = ri(1, 2);
  const a = comb(K, k), b = comb(N - K, n - k), c = comb(N, n), p = a * b / c;
  const pb = comb(n, k) * (K / N) ** k * (1 - K / N) ** (n - k), pp = perm(N, n);
  return GPr('s8', `מתוך ${N} מניות, ${K} הן מניות בנקים. בוחרים באקראי ${n} מניות. מה ההסתברות שבדיוק ${k} מהן מניות בנקים?`, p,

      f: '<bdi dir="ltr">P = C(K,k)·C(N − K, n − k) / C(N,n)</bdi>',
      why: 'כל קבוצה של מניות שווה הסתברות, ולכן ההסתברות היא מספר הקבוצות המתאימות חלקי מספר כל הקבוצות. קבוצה מתאימה נבנית משני חלקים, מניות הבנקים ושאר המניות, ולכן כופלים את מספר האפשרויות של כל חלק.',
      steps: [`כל הקבוצות: <bdi dir="ltr">C(${N},${n}) = ${c}</bdi>`, `בחירת מניות הבנקים: <bdi dir="ltr">C(${K},${k}) = ${a}</bdi>`, `בחירת שאר המניות: <bdi dir="ltr">C(${N - K},${n - k}) = ${b}</bdi>`, `<bdi dir="ltr">P = ${a}·${b}/${c} = ${a * b}/${c} = ${nf(p, 4)}</bdi>`],
      res: `ההסתברות היא ${nf(p, 4)}.`,
      tip: 'בבחירה בלי החזרה של "בדיוק k מסוג מסוים": בוחרים מכל סוג בנפרד, כופלים, ומחלקים במספר כל הקבוצות.'}),
    [`${nf(a / c, 4)} מתקבל מ־<bdi dir="ltr">C(${K},${k})/C(${N},${n})</bdi>: שכחו לספור גם את הבחירה של שאר המניות, שאינן מניות בנקים. צריך לכפול ב־<bdi dir="ltr">C(${N - K},${n - k}) = ${b}</bdi>.`,
     `${nf(pb, 4)} הוא חישוב בינומי, כאילו מחזירים כל מניה אחרי שבוחרים בה. כאן בוחרים בלי החזרה, ולכן סופרים צירופים (התפלגות היפרגאומטרית).`,
     `${nf(a * b / pp, 4)} מתקבל מחלוקה במספר הבחירות כשהסדר חשוב (<bdi dir="ltr">${N}·${N - 1}·${N - 2} = ${pp}</bdi>), בזמן שהמונה סופר קבוצות בלי סדר. המכנה צריך להיספר באותה שיטה: <bdi dir="ltr">C(${N},${n}) = ${c}</bdi>.`]);
}];

TOPICS.unshift({id:'f0', area:'base', title:'יסודות: אחוזים, חזקות ושורשים', short:'יסודות',
lesson:`
<p>כל המבחן נשען על ארבע פעולות החשבון ועל חזקות. שליטה בשיעור הזה תקל מאוד על כל שאר החומר. אם החשבון הבסיסי כבר מוכר לכם היטב, אפשר לדלג עליו.</p>
<h4>1. אחוזים ושברים עשרוניים</h4>
<p>אחוז הוא חלק אחד ממאה, ולכן 5% הם 0.05. בנוסחאות מציבים תמיד את המספר העשרוני ולא את האחוז: ריבית של 5% מוצבת כ־0.05.</p>
<div class="fx" dir="ltr">5% = 0.05 &nbsp;·&nbsp; 0.4% = 0.004 &nbsp;·&nbsp; 130% = 1.3</div>
<h4>2. גורם הצמיחה (1 + r)</h4>
<p>r הוא שיעור השינוי כמספר עשרוני. עלייה של 5% היא הכפלה ב־1.05 (כי <bdi dir="ltr">1 + 0.05 = 1.05</bdi>), וירידה של 2% היא הכפלה ב־0.98 (כי <bdi dir="ltr">1 − 0.02 = 0.98</bdi>). כששני שינויים מתרחשים זה אחר זה, <b>מכפילים</b> את הגורמים ולא מחברים את האחוזים. למשל, עלייה של 10% ואחריה ירידה של 10%:</p>
<div class="fx" dir="ltr">1.10 × 0.90 = 0.99 → −1%</div>
<p>כלומר בסוף יש ירידה של 1%, ולא חזרה לנקודת ההתחלה. הירידה של 10% מחושבת על סכום גדול יותר (110 ולא 100), ולכן היא "מוחקת" יותר ממה שהעלייה הוסיפה.</p>
<h4>3. חזקות</h4>
<p>החזקה <bdi dir="ltr">(1.05)<sup>3</sup></bdi> פירושה <bdi dir="ltr">1.05 × 1.05 × 1.05 = 1.157625</bdi>. חזקה שלילית היא אחד חלקי החזקה החיובית: <bdi dir="ltr">(1.05)<sup>−3</sup> = 1/(1.05)<sup>3</sup> = 0.8638</bdi>. זה בדיוק מה שעושים בהיוון: סכום שיתקבל בעוד 3 שנים מכפילים ב־<bdi dir="ltr">(1.05)<sup>−3</sup></bdi> כדי לדעת כמה הוא שווה היום.</p>
<h4>4. שורשים וחזקה שברית</h4>
<p>חזקה של <bdi dir="ltr">1/12</bdi> היא שורש מסדר 12: המספר שאם כופלים 12 עותקים שלו זה בזה, מתקבל המספר המקורי. כך הופכים ריבית שנתית אפקטיבית לריבית חודשית. למשל, ריבית שנתית של 10%:</p>
<div class="fx" dir="ltr">(1.10)<sup>1/12</sup> − 1 = 0.797%</div>
<p>כלומר 0.797% לחודש. במחשבון מקישים 1.1, אחר כך x<sup>y</sup>, ואז <bdi dir="ltr">(1÷12)</bdi>.</p>
<h4>5. הסימן Σ (סיגמה)</h4>
<p>הסימן Σ פירושו "סכום של כל האיברים". למשל, <bdi dir="ltr">Σ p·x</bdi> פירושו: מכפילים כל ערך x בהסתברות שלו p, ומחברים את כל המכפלות.</p>
<div class="ex"><b>תרגיל חימום.</b> מניה עלתה ב־20% ואחר כך ירדה ב־20%. היכן היא עומדת ביחס לנקודת ההתחלה?<br>
מכפילים את גורמי הצמיחה: <bdi dir="ltr">1.2 × 0.8 = 0.96</bdi>, כלומר ירידה של 4%. זו בדיוק המלכודת של ממוצע חשבוני מול ממוצע גיאומטרי, שמופיעה במבחן.</div>
<div class="plain"><b>במילים פשוטות:</b> בכל פעם שמשהו גדל באחוז מסוים, מכפילים ב־1 ועוד האחוז (כמספר עשרוני). למשל, עלייה של 5% היא הכפלה ב־1.05. כך כמעט כל שאלה במימון הופכת לשרשרת של הכפלות וחילוקים.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להציב 5 במקום 0.05.</li>
<li>לחבר אחוזים של תקופות שונות במקום להכפיל את גורמי הצמיחה.</li>
<li>לחלק ריבית שנתית אפקטיבית ב־12 במקום להוציא שורש מסדר 12.</li>
</ul></div>`});

{t:'s2', q:'יעקב ודוד ממתינים לעלות לטיסה במטוס שיש בו 25 שורות, ובכל שורה 4 כיסאות צמודים זה לזה (מסומנים A-D). המקומות במטוס מוקצים באופן אקראי לחלוטין, בלי קשר בין הנוסעים.<br>מה ההסתברות שדוד ויעקב ימצאו את עצמם יושבים זה לצד זה באותה שורה?', o:R('נמוכה מ־1%|גבוהה מ־1.01% ונמוכה מ־2%|גבוהה מ־2.01% ונמוכה מ־3%|גבוהה מ־3.01% ונמוכה מ־4%|גבוהה מ־4.01%'), a:1,
 e:SOL({ask:'מה הסיכוי ששני אנשים שמקבלים מושבים באקראי יקבלו שני מושבים צמודים באותה שורה.',
   f:'ההסתברות היא מספר הזוגות הצמודים חלקי מספר כל זוגות המושבים. מספר הזוגות מתוך n מושבים: '+LR('C(n,2) = n·(n − 1)/2'),
   why:'ההקצאה אקראית לגמרי, ולכן לכל זוג מושבים אותו סיכוי להיות הזוג של יעקב ודוד. סופרים את הזוגות ה״טובים״ ומחלקים במספר כל הזוגות.',

 w:['0.51% מתקבל אם סופרים רק זוג צמוד אחד בכל שורה: '+LR('25/4,950')+'. בשורה של 4 מושבים יש 3 זוגות צמודים, ולכן יש 75 זוגות.',

   '2.02% מתקבל אם מניחים שלכל מושב יש שני שכנים: '+LR('2/99')+'. למושבי הקצה (A ו־D) יש רק שכן אחד, ולכן בממוצע יש 1.5 שכנים.',

{t:'s2', q:'בקבוצה לגמילה מהתמכרות למשקאות ממותקים, נמצא כי: 20% מהמשתתפים היו מכורים לקולה, 30% היו מכורים לפנטה, והשאר היו מכורים לספרייט. ידוע כי כל משתתף היה מכור רק למשקה אחד.<br>כמו כן, ידוע כי: הסיכוי של נגמל מקולה לחזור לצרוך קולה בתוך שנה הוא 0.5. הסיכוי של נגמל מפנטה לחזור לצרוך פנטה בתוך שנה הוא 0.6. הסיכוי של נגמל מספרייט לחזור לצרוך ספרייט בתוך שנה הוא 0.9.<br>בהינתן שנגמל כלשהו בקבוצה חזר לשתות את המשקה האהוב עליו, מה ההסתברות שהוא היה מכור לפנטה?', o:R('נמוכה מ־20%|גבוהה מ־20.01% ונמוכה מ־25%|גבוהה מ־25.01% ונמוכה מ־30%|גבוהה מ־30.01% ונמוכה מ־35%|גבוהה מ־35.01%'), a:1,
 e:SOL({ask:'ידוע שהנגמל חזר לשתות. מה הסיכוי שהוא מקבוצת הפנטה? זו הסתברות ״הפוכה״: מהתוצאה (חזרה) אל הקבוצה.',
   f:LR('P(F|R) = P(F)·P(R|F) / P(R)')+'. כאן F מסמן מכור לפנטה, ו־R מסמן חזרה לשתייה.',
   why:'נתונים הסיכויים לחזור <u>בתוך</u> כל קבוצה, אבל שואלים על הכיוון ההפוך. נוסחת בייס הופכת את הכיוון: איזה חלק מכל החוזרים הגיע מקבוצת הפנטה.',
   steps:['החלק של מכורי הספרייט הוא היתרה: '+LR('1 − 0.2 − 0.3 = 0.5'), 'החוזרים מכל קבוצה (חלק הקבוצה כפול הסיכוי לחזור): קולה '+LR('0.2·0.5 = 0.10')+', פנטה '+LR('0.3·0.6 = 0.18')+', ספרייט '+LR('0.5·0.9 = 0.45'), 'כל החוזרים יחד (נוסחת ההסתברות השלמה): '+LR('P(R) = 0.10 + 0.18 + 0.45 = 0.73'), 'החלק של הפנטה מתוכם: '+LR('0.18/0.73 = 0.2466')],
   res:'כ־24.66%, כלומר בטווח שבין 20.01% ל־25%.',
   tip:'חושבים על 100 נגמלים: 73 חזרו, ו־18 מהם מכורי פנטה. התשובה היא 18 מתוך 73.'}),
 w:['18% הוא '+LR('0.3·0.6')+', ההסתברות להיות מכור לפנטה <b>וגם</b> לחזור. צריך עוד לחלק בסיכוי הכולל לחזור (0.73), כי ידוע שהנגמל חזר.',
   null,
   '28.57% מתקבל אם שוכחים את קבוצת הקולה במכנה: '+LR('0.18/(0.18 + 0.45)')+'. גם 0.10 החוזרים מקולה הם חלק מכל מי שחזר.',
   '32.7% מתקבל אם לוקחים לספרייט 30% במקום 50%: '+LR('0.18/(0.10 + 0.18 + 0.27)')+'. החלק של הספרייט הוא היתרה: '+LR('100% − 20% − 30% = 50%')+'.',

{t:'s4', q:'ידוע שגובהם של עצי תפוז בוגרים מתפלג נורמלית. הגובה הממוצע של עץ תפוז הוא 4.2 מטר, עם סטיית תקן של 0.35 מטר. עץ בוגר אחד נבחר באקראי.<br>מה גובה העץ שנבחר, בסבירות של 95%?', o:R('בין 3.2 ל־5.2 מטר.|בין 3.4 ל־4.9 מטר.|בין 3.51 ל־4.89 מטר.|בין 3.41 ל־4.99 מטר.|בין 3.7 ל־4.7 מטר.'), a:2,
 e:SOL({ask:'באיזה טווח, סימטרי סביב הממוצע, נמצא גובהו של עץ <u>אחד</u> בהסתברות של 95%.',

   steps:['המרחק מהממוצע: '+LR('1.96·0.35 = 0.686')+' מטר.', 'הגבול התחתון: '+LR('4.2 − 0.686 = 3.514'), 'הגבול העליון: '+LR('4.2 + 0.686 = 4.886')],

   'הטווח 3.4 עד 4.9 אינו סימטרי סביב 4.2: הוא יורד 0.8 מטר ועולה רק 0.7. הטווח הנכון הוא '+LR('4.2 ± 0.686')+'.',
   null,
   'הטווח 3.41 עד 4.99 רחוק 0.79 מטר מהממוצע, כלומר '+LR('z ≈ 2.26')+'. טווח כזה מכסה כ־97.6%, יותר מ־95%.',
   'הטווח 3.7 עד 4.7 רחוק 0.5 מטר מהממוצע, כלומר '+LR('z ≈ 1.43')+'. הוא מכסה רק כ־85% מהעצים.']},
{t:'f2', q:'אורן בן 18, והוא מתכנן לרכוש דירה בעוד 18 שנה. לשם כך, הוא רוצה להפקיד 100 ש״ח בתוכנית חיסכון ארוכת טווח, ולבחור את המסלול שיניב את הסכום הגבוה ביותר בתום התקופה.<br>איזו מהאפשרויות הבאות צפויה להניב לאורן את הסכום הגבוה ביותר לאחר 18 שנה?', o:R('ריבית כוללת של 130% לכל התקופה.|ריבית אפקטיבית של 0.4% לחודש.|ריבית שנתית נקובה של 5%, מחושבת יומית (365 ימים בשנה).|ריבית אפקטיבית של 34% בכל 6 שנים (מתחדשת).|ריבית שנתית נקובה של 5.1%, מחושבת רבעונית.'), a:4,
 e:SOL({ask:'איזו ריבית תהפוך את 100 השקלים לסכום הגדול ביותר אחרי 18 שנה. הריביות מוצגות בצורות שונות, ולכן מביאים את כולן לאותה תקופה.',
   f:LR('FV = (1 + r)<sup>n</sup>')+', כאשר r היא הריבית לתקופה אחת ו־n מספר התקופות. בריבית נקובה j שמחושבת m פעמים בשנה: '+LR('r = j/m'),
   why:'אי אפשר להשוות ישירות 0.4% לחודש, 5% לשנה ו־34% לשש שנים. מחשבים לכל חלופה גורם צבירה ל־18 שנה (כמה יהפוך כל שקל), ומשווים.',
   steps:['א: ריבית כוללת של 130% לכל התקופה: '+LR('1 + 1.30 = 2.300'), 'ב: 216 חודשים: '+LR('1.004<sup>216</sup> = 2.369'), 'ג: ריבית יומית של '+LR('0.05/365')+' במשך 6,570 ימים: '+LR('(1 + 0.05/365)<sup>6570</sup> = 2.459'), 'ד: שלוש תקופות של 6 שנים: '+LR('1.34³ = 2.406'), 'ה: ריבית רבעונית של '+LR('0.051/4 = 1.275%')+' במשך 72 רבעונים: '+LR('1.01275<sup>72</sup> = 2.490')],
   res:'חלופה ה (5.1% נקובה, מחושבת רבעונית): גורם צבירה של 2.490, הגבוה ביותר.',
   tip:'משווים גורמי צבירה לאותה תקופה, ולא אחוזים. ריבית נקובה מחלקים במספר התקופות בשנה, ואז מעלים בחזקה.'}),
 w:['ריבית כוללת של 130% נותנת גורם צבירה של 2.300 בלבד. זה האחוז הגדול ביותר בשאלה, אבל הוא כבר מתייחס לכל 18 השנים, ולכן זו החלופה הגרועה ביותר.',

   '5% נקובה מחושבת יומית נותנת 2.459, קרוב מאוד. אבל בשנה זה 5.13% אפקטיבי, ואילו 5.1% נקובה רבעונית נותנת 5.20%. הצבירה התכופה לא מפצה על הריבית הנקובה הנמוכה.',
   '34% לשש שנים נותנים '+LR('1.34³ = 2.406')+'. בשנה זה רק כ־5.0% אפקטיבי, פחות מ־5.20% של חלופה ה.',

{t:'f8', q:'אביתר קיבל מתנת חתונה מהוריו בסך 50,000 ש״ח. הוא מעוניין להשקיע את כספו ביעילות באמצעות השקעה בשתי קרנות נאמנות שונות בלבד.<br>איזו קורלציה בין שתי הקרנות שיבחר אביתר תניב לו תיק עם סיכון מינימלי?', o:R('‎+1.0|0.0|‎−1.0|אין חשיבות לקורלציה בין הנכסים.|אין מספיק נתונים על מנת לענות על השאלה.'), a:2,
 e:SOL({ask:'איזה מקדם מתאם בין שתי הקרנות מאפשר לבנות את התיק עם הסיכון הנמוך ביותר.',

   why:'ρ מופיע רק באיבר האחרון, וכל מה שמוכפל בו חיובי (משקלים וסטיות תקן). לכן ככל ש־ρ קטן, שונות התיק קטנה.',
   steps:['כש־'+LR('ρ = +1')+' הקרנות נעות יחד, ואין שום תועלת מפיזור: סטיית התקן של התיק היא הממוצע המשוקלל.', 'כש־'+LR('ρ = 0')+' האיבר האחרון מתאפס, והסיכון כבר נמוך מהממוצע המשוקלל.', 'כש־'+LR('ρ = −1')+' האיבר האחרון שלילי ככל האפשר. במשקלים הנכונים התנודות מקזזות זו את זו לגמרי, ומתקבל תיק בלי סיכון בכלל.'],

 w:['במתאם ‎+1 הקרנות עולות ויורדות יחד, ולכן הפיזור לא מוריד סיכון בכלל: סטיית התקן של התיק היא בדיוק הממוצע המשוקלל של סטיות התקן.',
   'במתאם 0 יש תועלת מפיזור, אבל לא מרבית. כשהמתאם שלילי, האיבר '+LR('2w<sub>1</sub>w<sub>2</sub>ρσ<sub>1</sub>σ<sub>2</sub>')+' נעשה שלילי ומוריד את השונות עוד יותר.',
   null,
   'המתאם מופיע ישירות בנוסחת השונות של התיק, ולכן הוא משנה את הסיכון. הוא לא משנה רק כשמשקיעים בנכס אחד.',
   'לא צריך את סטיות התקן או את המשקלים: לכל משקלים קבועים, השונות קטנה ככל ש־ρ קטן. לכן ‎−1 הוא תמיד המתאם הטוב ביותר.']},
{t:'f9', q:'הניחו כי הריבית חסרת הסיכון היא אפס, וכי מניה B מאופיינת בביתא של 1.6. מחיר המניה בסוף יום ראשון עמד על 100 ש״ח. ביום שני, שוק המניות ירד ב־2%. ביום שלישי, השוק עלה ב־5%.<br>מה יהיה מחיר המניה בסוף יום שלישי?', o:R('נמוך מ־101.50 ש״ח.|בין 101.51 ש״ח ל־102.50 ש״ח.|בין 102.51 ש״ח ל־103.60 ש״ח.|בין 103.61 ש״ח ל־104.70 ש״ח.|גבוה מ־104.71 ש״ח.'), a:3,
 e:SOL({ask:'איך זז מחיר המניה ביומיים, כשידועים רק תנועת השוק והבטא של המניה.',

   steps:['יום שני: '+LR('1.6·(−2%) = −3.2%')+'. המחיר: '+LR('100·0.968 = 96.80'), 'יום שלישי: '+LR('1.6·5% = 8%')+'. המחיר: '+LR('96.80·1.08 = 104.544'), 'בקיצור: '+LR('100·0.968·1.08 = 104.54')],

   tip:'מכפילים את גורמי הצמיחה '+LR('(1 + r)')+' של כל יום, ולא מחברים את התשואות.'}),

{t:'s3', q:'מאיה נסעה ליריד מדעי שבו היא יכולה לשחק במשחק ״גלגל המזל״. כל סיבוב עולה 5 ש״ח, והפרס בסיבוב הוא שוקולד. ההסתברות לזכות בשוקולד בכל סיבוב היא 0.3. מאיה החליטה שהיא משחקת עד שתזכה בפעם הראשונה, או עד שתסיים לשחק שלושה סיבובים (כלומר, תקציב של 15 ש״ח בלבד).<br>מהי ההסתברות שמאיה תשחק שלושה סיבובים?', o:R('0.189|0.21|0.441|0.27|0.343'), a:[0, 1, 2, 3, 4], cancelled:true,

{t:'f10', q:'הילה מתלבטת כיצד להשקיע את כספה. לפניה שתי מניות בלבד: מניית ״נובה״ ומניית ״דינמיקה״. תוחלת התשואה של ״נובה״ היא 7%, ותוחלת התשואה של ״דינמיקה״ היא 11%. סטיית התקן של ״דינמיקה״ גבוהה יותר. ידוע כי מקדם המתאם בין שתי המניות הוא שלילי (‎−0.3), ומכירה בחסר אסורה.<br>I. שילוב בין שתי המניות עשוי לשפר את יחס התשואה לסיכון של התיק.<br>II. משקיעה שונאת סיכון לא תשקול כלל השקעה במניה התנודתית יותר.<br>III. משקיעה אוהבת סיכון עשויה להשקיע את כל כספה במניה המסוכנת יותר.<br>IV. כאשר המתאם שלילי, שילוב המניות תמיד יביא לתשואה גבוהה יותר מהשקעה רק באחת מהן.<br>איזו/אילו מהטענות הנ״ל נכונה/ות?', o:R('טענות I ו־II בלבד.|טענה II בלבד.|טענות I ו־IV בלבד.|טענות II ו־IV בלבד.|טענות I ו־III בלבד.'), a:4,

   f:LR('E(R<sub>p</sub>) = w·E(R<sub>1</sub>) + (1 − w)·E(R<sub>2</sub>)'),
   why:'התוחלת של תיק היא תמיד ממוצע משוקלל של התוחלות. הסיכון, לעומת זאת, יכול לרדת מתחת לממוצע המשוקלל כשהמתאם נמוך מ־1.',

   res:'טענות I ו־III בלבד.',
   tip:'פיזור מוריד סיכון, אבל לא מעלה את התוחלת מעל זו של המניה הטובה ביותר.'}),

{t:'f3', q:'דנה מתכננת לרכוש אופניים חשמליים לבן שלה, תום, לרגל סיום בית הספר. החנות מציעה לה לשלם 8,000 ש״ח מייד, ולאחר מכן 5 תשלומים חודשיים, כשהתשלום הראשון (שיתבצע בעוד חודש) הוא 1,900 ש״ח, וכל תשלום אחריו צומח ב־0.2% ביחס לקודמו.<br>אם הריבית האפקטיבית השנתית שדנה משלמת על הלוואה עומדת על 4.07%, מהו הסכום המיידי המקסימלי שהיתה מוכנה לשלם היום במקום לשלם את המסלול המוצע: 8,000 ש״ח מייד ועוד 5 תשלומים?', o:R('פחות מ־17,000 ש״ח.|בין 17,001 ש״ח ל־17,500 ש״ח.|בין 17,501 ש״ח ל־18,000 ש״ח.|בין 18,001 ש״ח ל־18,500 ש״ח.|יותר מ־18,501 ש״ח.'), a:1,
 e:SOL({ask:'כמה שווה היום המסלול כולו: 8,000 ש״ח מייד ועוד 5 תשלומים חודשיים שגדלים. זה הסכום המקסימלי שדנה תסכים לשלם היום במקומו.',

   why:'התשלומים חודשיים, והריבית הנתונה היא שנתית אפקטיבית. לכן קודם ממירים אותה לריבית חודשית אפקטיבית (שורש מסדר 12), ואז מהוונים כל תשלום לפי מספר החודשים עד שהוא משולם.',
   steps:['הריבית החודשית: '+LR('1.0407<sup>1/12</sup> − 1 = 0.333%'), 'התשלומים: 1,900 בחודש הראשון, וכל תשלום גדל ב־0.2%: '+LR('1,903.80, 1,907.61, 1,911.42, 1,915.25'), 'מהוונים כל תשלום: '+LR('1,900/1.00333 + 1,903.80/1.00333² + … + 1,915.25/1.00333<sup>5</sup> = 9,443'), 'מוסיפים את התשלום המיידי: '+LR('8,000 + 9,443 = 17,443')],
   res:'כ־17,443 ש״ח, כלומר בטווח שבין 17,001 ל־17,500 ש״ח.',
   tip:'בדיקה מהירה: סכום 5 התשלומים בלי היוון הוא 9,538, וההיוון לחמישה חודשים מוריד רק כ־1%. לכן התשובה מעט מתחת ל־17,538.'}),
 w:['16,474 מתקבל אם מהוונים כל חודש בריבית השנתית המלאה (4.07%) במקום בריבית החודשית. 4.07% היא ריבית לשנה, ולחודש היא רק 0.333%.',

{t:'f9', q:'באחת מההרצאות בתוכנית למנהלי השקעות, הציג המרצה את המאפיינים של תיק השקעות הנמצא על קו ה־CML.<br>I. תיק הנמצא על קו ה־CML תמיד מהווה שילוב של תיק השוק עם נכס חסר סיכון.<br>II. תשואתו הצפויה של כל תיק הנמצא על קו ה־CML היא בהכרח שווה לתשואת תיק השוק.<br>III. תיק עם ביתא 1 אינו יכול להימצא על קו ה־CML.<br>איזו/אילו מבין הטענות הנ״ל נכונה/ות?', o:R('טענה I בלבד.|טענה II בלבד.|טענה III בלבד.|טענות II ו־III בלבד.|כל הטענות שגויות.'), a:0,

{t:'s8', q:'בחברת ההייטק ״חדשנות אינסופית״, הוחלט להושיב את ששת חברי צוות הפיתוח לשיחת צוות שבועית סביב שולחן עגול: יואב, דנה, תמר, גיל, רוני ונועם. דנה מסרבת לשבת ליד גיל (כלומר, לא מימין ולא משמאל לו).<br>בכמה דרכים שונות ניתן להושיב את ששת חברי הצוות סביב השולחן?', o:R('בין 60 ל־70|בין 71 ל־75|בין 76 ל־85|בין 86 ל־95|יותר מ־96'), a:1,

   f:LR('(n − 1)! − 2·(n − 2)!'),
   why:'במעגל אין ״מקום ראשון״: סיבוב של כל השולחן נותן אותו סידור, ולכן יש '+LR('(n − 1)!')+' סידורים. קל יותר לספור את הסידורים האסורים (השניים צמודים) ולהחסיר אותם מכל הסידורים.',
   steps:['כל הסידורים: '+LR('(6 − 1)! = 5! = 120'), 'סידורים שבהם דנה ליד גיל: מדביקים אותם ל״גוש״ אחד. עכשיו יש 5 יחידות במעגל: '+LR('(5 − 1)! = 4! = 24'), 'בתוך הגוש דנה יכולה לשבת מימין לגיל או משמאלו: '+LR('24·2 = 48'), 'הסידורים המותרים: '+LR('120 − 48 = 72'), 'בדיקה בדרך אחרת: מושיבים את גיל. לדנה נשארו 5 כיסאות, ו־3 מהם לא צמודים לגיל. את 4 האחרים מושיבים ב־'+LR('4! = 24')+' דרכים: '+LR('3·24 = 72')],
   res:'72 דרכים, כלומר בטווח שבין 71 ל־75.',
   tip:'לגוש של שניים יש 2 סדרים פנימיים. לא לשכוח להכפיל ב־2.'}),
 w:['60 מתקבל אם מחלקים את 120 ב־2, כאילו סידור והשתקפות שלו (עם כיוון השעון ונגדו) הם אותו סידור. כאן ימין ושמאל חשובים, ולכן לא מחלקים.',
   null,
   '80 מתקבל אם משתמשים בהסתברות לשבת צמודים בשורה (1/3) במקום במעגל (2/5): '+LR('120·(1 − 1/3) = 80')+'. במעגל לכל אחד שני שכנים, ומספר הסידורים האסורים הוא '+LR('2·4! = 48')+', ולכן התשובה 72.',
   'אין חישוב סביר שנותן 86 עד 95. הטעות הקרובה, לשכוח להכפיל את הגוש ב־2, נותנת '+LR('120 − 24 = 96')+', וגם היא מחוץ לטווח. צריך להחסיר 48 ולקבל 72.',

{t:'f4', q:'להלן נתונים לגבי 4 פרויקטים:<div class="tbl-wrap"><table class="mini"><tr><th>פרויקט</th><th>השקעה (ש״ח)</th><th>IRR</th><th>NPV</th></tr><tr><td>א</td><td>40</td><td>22%</td><td>28</td></tr><tr><td>ב</td><td>80</td><td>20%</td><td>96</td></tr><tr><td>ג</td><td>60</td><td>17%</td><td>66</td></tr><tr><td>ד</td><td>100</td><td>15%</td><td>110</td></tr></table></div>בהינתן כי עומד לרשותו של אורי תקציב של 120 ש״ח בלבד וניתנה לו האפשרות להשקיע ביותר מפרויקט אחד וכן להשקיע גם בפרויקטים חלקיים, מה יהיה ה־NPV המקסימלי הכולל של השקעתו?', o:R('נמוך מ־110.0 ש״ח.|בין 110.01 ש״ח ל־122.00 ש״ח.|בין 122.01 ש״ח ל־134.00 ש״ח.|בין 134.01 ש״ח ל־145.00 ש״ח.|גבוה מ־145.01 ש״ח.'), a:3,
 e:SOL({ask:'איך לחלק תקציב של 120 ש״ח בין הפרויקטים, כדי לקבל NPV כולל מרבי, כשמותר לקחת גם חלק מפרויקט.',
   f:LR('PI = NPV/I'),
   why:'כשהתקציב הוא המגבלה, השאלה היא כמה NPV מקבלים על כל שקל מושקע. מדד הרווחיות (PI) מודד בדיוק את זה. מכיוון שאפשר לקחת חלק מפרויקט, ממלאים את התקציב מה־PI הגבוה לנמוך.',
   steps:['מחשבים PI: א '+LR('28/40 = 0.7')+', ב '+LR('96/80 = 1.2')+', ג '+LR('66/60 = 1.1')+', ד '+LR('110/100 = 1.1'), 'פרויקט ב (PI הגבוה ביותר) נכנס במלואו: 80 ש״ח, NPV של 96. נשארו 40 ש״ח.', 'את 40 השקלים הנותרים שמים בג או בד (לשניהם PI של 1.1): '+LR('40·1.1 = 44'), 'סך הכול: '+LR('96 + 44 = 140')],
   res:'NPV כולל של 140 ש״ח, כלומר בטווח שבין 134.01 ל־145 ש״ח.',
   tip:'בתקציב מוגבל עם פרויקטים חלקיים מדרגים לפי PI, לא לפי IRR ולא לפי NPV.'}),
 w:['110 הוא ה־NPV של פרויקט ד לבדו (ה־NPV הגבוה ביותר). אבל ל־ד יש PI של 1.1 בלבד, ו־20 השקלים שנשארו לא מנוצלים.',
   '118 מתקבל אם מתחילים מהפרויקטים הקטנים: א ו־ג במלואם (100 ש״ח, '+LR('28 + 66 = 94')+') ועוד רבע מ־ב (24). לא גודל הפרויקט קובע, אלא ה־PI שלו.',
   '124 מתקבל מדירוג לפי IRR: א (22%) ואחריו ב (20%), '+LR('28 + 96 = 124')+'. לפרויקט א ה־PI הנמוך ביותר (0.7), ולכן בתקציב מוגבל הוא האחרון בתור.',
   null,
   '162 מתקבל אם לוקחים את ב ואת ג במלואם: '+LR('96 + 66 = 162')+'. אבל זה דורש 140 ש״ח, יותר מהתקציב של 120.']},
{t:'f1', q:'מלכה זכתה במקום הראשון של כרטיס הגירוד ״חיש־גד״. כאשר הלכה למשרדי החברה לקבל את הפרס, הוצע למלכה לבחור היום באחת מתוך חמש אלטרנטיבות.<br>בהנחה כי שיעור הריבית השנתית האפקטיבית בשוק הינה 5%, באיזה מבין המסלולים הבאים כדאי למלכה לבחור?', o:R('שמונה תשלומים שווים של 2,650 ש״ח בסוף כל חודש וחצי, כאשר התשלום הראשון יהיה בעוד חודש וחצי מהיום.|תשלום של 7,600 ש״ח בעוד שנה וחצי מהיום, תשלום נוסף של 7,650 בעוד שנתיים מהיום, ותשלום אחרון של 7,700 ש״ח בעוד שנתיים וחצי מהיום.|12 תשלומים חודשיים של 1,720 ש״ח בסוף כל חודש, כאשר התשלום הראשון הינו בסוף החודש השני מהיום.|שלושה תשלומים של 6,980 ש״ח בסוף כל ארבעה חודשים (סוף חודש 4, 8, ו־12).|תשלום חד־פעמי היום בסכום של 20,000 ש״ח.'), a:1,
 e:SOL({ask:'איזה מסלול שווה הכי הרבה <u>היום</u>. התשלומים מגיעים בזמנים שונים, ולכן משווים ערכים נוכחיים ולא סכומים.',
   f:LR('PV = Σ C<sub>t</sub>/1.05<sup>t</sup>')+', כאשר t נמדד בשנים, וכל חודש הוא חלק אחד משנים־עשר בשנה',
   why:'שקל היום שווה יותר משקל בעתיד, כי אפשר להשקיע אותו בריבית. ההיוון מביא את כל המסלולים לאותה נקודת זמן, היום.',
   steps:['א: 8 תשלומים של 2,650 בחודשים 1.5, 3, …, 12: '+LR('PV = 20,628'), 'ב: '+LR('7,600/1.05<sup>1.5</sup> + 7,650/1.05² + 7,700/1.05<sup>2.5</sup>'), 'כלומר: <b>'+LR('7,063.7 + 6,938.8 + 6,815.8 ≈ 20,818')+'</b>', 'ג: 12 תשלומים של 1,720 בחודשים 2 עד 13: '+LR('PV = 20,022'), 'ד: 3 תשלומים של 6,980 בחודשים 4, 8 ו־12: '+LR('PV = 20,272'), 'ה: 20,000 היום, ולכן '+LR('PV = 20,000')],
   res:'מסלול ב, עם ערך נוכחי של כ־20,818 ש״ח.',
   tip:'מסלול ב משלם מאוחר, אבל הסכום הנומינלי שלו (22,950) גבוה בהרבה, וההיוון לא מוחק את היתרון.'}),
 w:['מסלול א שווה היום 20,628 ש״ח, פחות מ־20,818 של מסלול ב. התשלומים שלו מוקדמים, אבל הסכום הכולל (21,200) נמוך בהרבה.',
   null,
   'מסלול ג שווה היום רק 20,022 ש״ח. הסכום הכולל שלו (20,640) עולה רק מעט על 20,000, וההיוון מוחק כמעט את כל ההפרש.',
   'מסלול ד שווה היום 20,272 ש״ח. הסכום הנומינלי שלו (20,940) נמוך בהרבה מ־22,950 של מסלול ב.',
   '20,000 ש״ח היום הם הסכום המוקדם ביותר, אבל הערך הנוכחי של כל ארבעת המסלולים האחרים גבוה יותר. גם הקרוב ביותר, מסלול ג, שווה היום 20,022 ש״ח, והטוב ביותר, מסלול ב, שווה 20,818 ש״ח. תשלום מוקדם הוא יתרון, אבל הסכומים העתידיים כאן גבוהים מספיק כדי לפצות על ההמתנה.']},
{t:'f9', q:'הניחו עולם בו מתקיים מודל ה־CAPM וקו שוק ההון (CML) הינו כמו בתרשים: הקו יוצא מ־r<sub>f</sub>, משיק לחזית היעילה בנקודה M (תיק השוק), נקודה A נמצאת על הקו בין r<sub>f</sub> ל־M, ונקודה F על הקו מעבר ל־M.<svg viewBox="0 0 320 170" style="max-width:320px;display:block;margin:10px 0" role="img" aria-label="CML"><line x1="30" y1="150" x2="310" y2="150" stroke="var(--muted)"/><line x1="30" y1="150" x2="30" y2="10" stroke="var(--muted)"/><path d="M90 140 Q130 85 170 78 T300 70" fill="none" stroke="var(--gold)" stroke-width="2"/><line x1="30" y1="115" x2="290" y2="30" stroke="var(--accent)" stroke-width="2"/><circle cx="30" cy="115" r="4" fill="var(--ink)"/><circle cx="85" cy="97" r="4" fill="var(--ink)"/><circle cx="150" cy="76" r="4" fill="var(--ink)"/><circle cx="270" cy="37" r="4" fill="var(--ink)"/><text x="36" y="132" font-size="12" fill="var(--ink)">rf</text><text x="80" y="88" font-size="12" fill="var(--ink)">A</text><text x="146" y="67" font-size="12" fill="var(--ink)">M</text><text x="270" y="28" font-size="12" fill="var(--ink)">F</text><text x="236" y="58" font-size="11" fill="var(--accent)">CML</text><text x="250" y="88" font-size="11" fill="var(--gold)">חזית יעילה</text><text x="275" y="165" font-size="11" fill="var(--muted)">σ</text><text x="8" y="16" font-size="11" fill="var(--muted)">E</text></svg>I. ניתן לתמחר נכס יחיד באמצעות קו ה־CML.<br>II. ניתן לתמחר תיק יעיל באמצעות קו ה־CML.<br>III. משקיע הנמצא על נקודה A הינו משקיע מלווה המחלק את כספו בין הריבית חסרת הסיכון (rf) ל־M.<br>איזו/אילו מהטענות הנ״ל נכונה/ות?', o:R('טענה I בלבד.|טענה II בלבד.|טענה III בלבד.|טענות II ו־III בלבד.|כל הטענות.'), a:3,
 e:SOL({ask:'מה נכון לגבי ה־CML, ולגבי משקיע שנמצא בנקודה A.',
   why:'ה־CML מתאר רק תיקים יעילים: שילובים של r<sub>f</sub> ושל תיק השוק M. נכס בודד אינו יעיל (יש בו סיכון ספציפי), ולכן מתמחרים אותו לפי ה־SML, כלומר לפי הבטא שלו.',
   steps:['טענה I שגויה: סטיית התקן של נכס בודד כוללת סיכון ספציפי שהשוק אינו מתגמל. לכן הוא לא נמצא על ה־CML, ומתמחרים אותו לפי ה־SML.', 'טענה II נכונה: תיק יעיל נמצא על ה־CML, ואפשר לקרוא ממנו את התשואה הצפויה לפי סטיית התקן.', 'טענה III נכונה: A נמצאת בין r<sub>f</sub> ל־M. המשקיע שם חלק מכספו בנכס חסר הסיכון (״מלווה״) ואת השאר ב־M. בנקודה F הוא לווה.'],
   res:'טענות II ו־III בלבד.',
   tip:'CML: תיקים יעילים, לפי σ. SML: כל נכס, לפי β.'}),
 w:['טענה I שגויה: נכס בודד מתמחרים לפי ה־SML (לפי הבטא), לא לפי ה־CML. וחסרות טענות II ו־III, ששתיהן נכונות.',
   'חסרה טענה III, שגם היא נכונה: בנקודה A המשקיע מחלק את כספו בין r<sub>f</sub> לבין M, ולכן הוא מלווה.',
   'חסרה טענה II, שגם היא נכונה: ה־CML הוא בדיוק הקו שמתמחר תיקים יעילים.',
   null,
   'טענה I שגויה: נכס בודד אינו יעיל ואינו נמצא על ה־CML. מתמחרים אותו לפי ה־SML.']},
{t:'f9', q:'בקרן נאמנות ״הנאמנים״ הביתא שווה ל־1.2 והסיכון הספציפי שווה ל־0.<br>I. קרן הנאמנות בהכרח נמצאת על קו ה־SML.<br>II. קרן הנאמנות בהכרח נמצאת על קו ה־CML.<br>III. לקרן סטיית תקן השווה לסטיית התקן של תיק השוק.<br>איזו/אילו מבין הטענות הנ״ל נכונה/ות?', o:R('טענה I בלבד.|טענה II בלבד.|טענה III בלבד.|טענות I ו־II בלבד.|כל הטענות.'), a:3,
 e:SOL({ask:'מה אפשר להסיק על קרן עם בטא 1.2 וסיכון ספציפי 0.',
   f:LR('σ<sub>i</sub>² = β<sub>i</sub>²·σ<sub>m</sub>² + σ<sub>ε</sub>²'),
   why:'הנוסחה מפצלת את השונות לחלק שיטתי (שתלוי בבטא) ולחלק ספציפי. כשהחלק הספציפי 0, כל הסיכון שיטתי, והקרן מתנהגת כמו שילוב של תיק השוק ונכס חסר סיכון.',
   steps:['טענה I נכונה: בעולם של CAPM כל נכס וכל תיק נמצאים על ה־SML.', 'טענה II נכונה: בלי סיכון ספציפי הקרן היא תיק יעיל, ולכן היא על ה־CML. כאן זה תיק ״לווה״ שמחזיק 120% בתיק השוק.', 'טענה III שגויה: מציבים '+LR('σ<sub>ε</sub>² = 0')+' ומקבלים '+LR('σ<sub>i</sub> = 1.2·σ<sub>m</sub>')+'. סטיית התקן של הקרן גבוהה ב־20% מזו של השוק.'],
   res:'טענות I ו־II בלבד.',
   tip:'סיכון ספציפי 0 פירושו תיק יעיל, כלומר על ה־CML. סטיית התקן שלו היא β כפול σ<sub>m</sub>.'}),
 w:['חסרה טענה II: כשהסיכון הספציפי 0, הקרן היא תיק יעיל, ולכן היא גם על ה־CML.',
   'חסרה טענה I: לפי CAPM כל נכס וכל תיק נמצאים על ה־SML, ובוודאי תיק יעיל.',
   'טענה III שגויה: '+LR('σ<sub>i</sub> = β·σ<sub>m</sub> = 1.2·σ<sub>m</sub>')+', כלומר גבוהה מסטיית התקן של השוק. רק בטא 1 נותנת את סטיית התקן של השוק.',
   null,
   'טענה III שגויה: בלי סיכון ספציפי '+LR('σ<sub>i</sub> = 1.2·σ<sub>m</sub>')+', ולא '+LR('σ<sub>m</sub>')+'. סטיית התקן שווה לזו של השוק רק כשהבטא 1.']},
{t:'f9', q:'איזה מהמשפטים הבאים <u>אינו</u> נכון?', o:R('תיק יעיל הוא תיק שבו כל מרכיב הסיכון הספציפי פוזר.|הביתא של כל תיק יעיל עומדת על 1.|הקורלציה (מקדם מיתאם) בין תשואת השוק לתשואת כל תיק יעיל שווה ל־1.|ככלל, ניתן להקטין את מרכיב הסיכון הספציפי בתיק על ידי השקעה בנכסים נוספים.|מודל ה־CAPM קובע כי יש לפצות משקיעים בגין הסיכון השיטתי, אך לא בגין הסיכון הספציפי.'), a:1,
 e:SOL({ask:'איזה משפט <u>שגוי</u>. ארבעה מהמשפטים נכונים.',
   why:'תיק יעיל הוא שילוב של תיק השוק M ונכס חסר סיכון. הבטא שלו שווה למשקל של M בתיק, ולכן היא יכולה להיות כל מספר, לא רק 1.',
   steps:['המשפט על הבטא שגוי: תיק שחציו בתיק השוק וחציו בנכס חסר סיכון הוא יעיל, והבטא שלו '+LR('0.5·1 + 0.5·0 = 0.5'), 'בתיק יעיל אכן פוזר כל הסיכון הספציפי (המשפט הראשון נכון).', 'המתאם בין תיק יעיל לשוק אכן 1: התיק הוא M ועוד נכס חסר סיכון, ולכן הוא נע תמיד בדיוק עם M.', 'הוספת נכסים מקטינה את הסיכון הספציפי, ו־CAPM מפצה רק על הסיכון השיטתי. שני המשפטים נכונים.'],

// attach a generic (number-free) focus/trap to a reused generator, unless it already sets its own
const FT = (g, focus, trap) => () => { const q = g(); return {focus, trap, ...q}; };

// "which of the statements I/II/III are true": three statements {s, ok, why} → five options, the exam's way
const ROM = ['I', 'II', 'III'];
const COMBOS = [[0], [1], [2], [0, 1], [0, 2], [1, 2], [0, 1, 2], []];
const comboTxt = c => c.length === 3 ? 'כל הטענות.' : c.length === 0 ? 'אף אחת מהטענות.' : c.length === 1 ? `טענה ${ROM[c[0]]} בלבד.` : `טענות ${ROM[c[0]]} ו־${ROM[c[1]]} בלבד.`;
function stmtQ({t, intro, sts, ask, f, why, tip, focus, trap}) {
  const key = c => c.join(','), truth = [0, 1, 2].filter(i => sts[i].ok), right = key(truth);
  const others = shuffle(COMBOS.filter(c => key(c) !== right && c.length)).slice(0, 4); // "none" only when it is the answer
  const opts = [truth, ...others].sort((a, b) => COMBOS.findIndex(c => key(c) === key(a)) - COMBOS.findIndex(c => key(c) === key(b)));
  const why1 = i => sts[i].why;
  return {t, gen: true, fixed: true, o: opts.map(comboTxt), a: opts.findIndex(c => key(c) === right), focus, trap,

    e: SOL({ask, f, why, steps: sts.map((x, i) => `טענה ${ROM[i]} ${x.ok ? 'נכונה' : 'שגויה'}: ${x.why}`), res: truth.length ? comboTxt(truth) : 'אף אחת מהטענות אינה נכונה.', tip}),

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Lessons arrive as one long flow. On screen they become learning blocks: each heading opens a card,
// long paragraphs are split at sentence ends, and the example / pitfalls / summary boxes get clear labels.
function splitLong(p, max = 280) {
  if (p.textContent.length <= max) return;
  const nodes = [...p.childNodes], total = p.textContent.length; let acc = 0, cut = null;
  for (const n of nodes) {
    if (n.nodeType === 3) {
      const re = /[.?!]\s+(?=[֐-׿])/g; let mm;
      while ((mm = re.exec(n.nodeValue))) { const pos = acc + mm.index; if (pos > total * 0.3 && pos < total * 0.75 && (!cut || Math.abs(pos - total / 2) < Math.abs(cut.pos - total / 2))) cut = {n, at: mm.index + mm[0].length, pos}; }
    }
    acc += n.textContent.length;
  }

function buildExam(n) { // questions per chapter in proportion to the chapter's weight
  const tot = CHAPTERS.reduce((a, c) => a + c.len, 0);
  const cnt = CHAPTERS.map(c => Math.max(1, Math.floor(n * c.len / tot)));
  while (cnt.reduce((a, b) => a + b) > n) { let bi = -1, bv = Infinity; CHAPTERS.forEach((c, i) => { const gap = n * c.len / tot - cnt[i]; if (cnt[i] > 0 && gap < bv) { bv = gap; bi = i; } }); cnt[bi]--; }
  while (cnt.reduce((a, b) => a + b) < n) { let bi = 0, bv = -1; CHAPTERS.forEach((c, i) => { const gap = n * c.len / tot - cnt[i]; if (gap > bv) { bv = gap; bi = i; } }); cnt[bi]++; }
  const qs = [];
  CHAPTERS.forEach((c, ci) => {
    const order = shuffle(c.topics);
    for (let i = 0; i < cnt[ci]; i++) {
      const t = order[i % order.length]; let q, tries = 0;
      do { q = drawFor(t); tries++; } while (tries < 8 && qs.some(x => x.q === q.q));
      qs.push(q);
    }
  });
  return shuffle(qs);
}

  };

}

document.addEventListener('keydown', e => {

    if (/^[1-5]$/.test(k) && +k <= P.q.o.length && P.answered === undefined) answer(+k - 1);
    else if (k === 'Enter' && P.answered !== undefined) { e.preventDefault(); newQ(); drawQ(); }
  } else if (view === 'exam' && X && X.running && /^[1-5]$/.test(k) && +k <= X.qs[X.cur].o.length) { X.ans[X.cur] = +k - 1; render(); }
});
function setHdr() { const h = document.querySelector('.top'); if (h) document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px'); }
window.addEventListener('resize', setHdr);
// the admin is told about any failure, so nothing ever just silently stops responding
const adminOops = x => { try { const u = ACC.user(), msg = String((x && (x.message || x.reason && x.reason.message || x.reason)) || ''); if (/ResizeObserver|^Script error|AbortError/i.test(msg)) return; if (u && u.isAdmin && view === 'admin') toast('משהו נכשל: ' + String((x && (x.message || x.reason && x.reason.message || x.reason)) || x).slice(0, 120) + '. לחצו על רענון.'); } catch (e) {} };
window.addEventListener('unhandledrejection', adminOops); window.addEventListener('error', adminOops);
window.addEventListener('popstate', e => {
  const st = e.state || {}, h = location.hash.slice(1), mm = h.match(/^learn-(\w+)$/);
  const v = st.v || (mm ? 'learn' : ROUTES.includes(h) ? h : 'home'), topic = st.topic || (mm && mm[1]);
  go.pop = true; try { go(v, topic ? {topic} : undefined); } finally { go.pop = false; }
});
// start: wait for the account backend (instant in local mode), then show the right screen
$('#main').innerHTML = '<p class="note" style="text-align:center;padding:40px 0">טוען…</p>';
// another course page (e.g. /corporate/) sent a signed-out learner here; once signed in, send them back
function returnTo() { let r = null; try { r = sessionStorage.getItem('silas_return'); sessionStorage.removeItem('silas_return'); } catch (e) {} if (r && /^\/[\w-]+\/[^\s]*$/.test(r)) { location.replace(r); return true; } return false; }
document.addEventListener('click', e => { const c = e.target.closest('[data-href]'); if (c && !e.target.closest('a')) location.href = c.dataset.href; });
document.addEventListener('keydown', e => { const c = e.target.closest && e.target.closest('[data-href]'); if (c && e.key === 'Enter' && e.target === c) location.href = c.dataset.href; });
ACC.ready().catch(() => {}).then(async () => {
  if (ACC.user() && !ACC.recovering() && returnTo()) return;
  loadCourse(); if (ACC.user()) await syncCourse();
  if (ACC.recovering()) view = 'reset';
  else if (!ACC.user()) view = 'login'; else if ((view === 'admin' && !ACC.user().isAdmin) || ['login', 'forgot', 'reset', 'blocked'].includes(view)) view = 'home'; // signed in: a refresh never lands back on the sign-in screen
  ACC.onRecovery = () => go('reset');
  ACC.onBlocked = () => { if (typeof stopVideo === 'function') stopVideo(); clearInterval(timerId); nav(); render(); };
  nav(); render(bootTopic ? {topic: bootTopic} : {}); setHdr(); fixBidi(document.getElementById('main'));
  try { history.replaceState({v: view, topic: bootTopic}, '', CLEAN_VIEWS.includes(view) ? location.pathname + location.search : view === 'learn' && bootTopic ? location.hash : '#' + view); } catch (e) {}
});
