const TOPICS = [
{id:'s1', area:'stat', title:'סטטיסטיקה תיאורית', short:'תיאורית',
lesson:`
<p>סטטיסטיקה תיאורית מסכמת אוסף נתונים בכמה מספרים בודדים. היא עונה על שתי שאלות: היכן נמצא מרכז הנתונים, ועד כמה הם מפוזרים סביבו.</p>
<h4>מדדי מרכז</h4>
<ul>
<li><b>ממוצע</b>: סכום התצפיות חלקי מספר התצפיות. הממוצע רגיש לערכים קיצוניים: <span class="fx" dir="ltr">x̄ = Σx / n</span></li>
<li><b>חציון</b>: הערך האמצעי לאחר מיון הנתונים. כשמספר התצפיות זוגי, החציון הוא הממוצע של שני הערכים האמצעיים. ערכים קיצוניים אינם משפיעים עליו.</li>
<li><b>שכיח</b>: הערך שמופיע בנתונים הכי הרבה פעמים.</li>
</ul>
<h4>מדדי פיזור</h4>
<div class="fx" dir="ltr">Var(X) = Σ P<sub>i</sub>·(X<sub>i</sub> − X̄)²<br>במדגם: P<sub>i</sub> = 1/n<br>Cov(X,Y) = Σ P<sub>i</sub>·(X<sub>i</sub> − X̄)(Y<sub>i</sub> − Ȳ)<br>CV = σ / μ</div>
<p>הסימנים: <bdi dir="ltr">X<sub>i</sub></bdi> היא תצפית, <bdi dir="ltr">X̄</bdi> הוא הממוצע, ו־<bdi dir="ltr">P<sub>i</sub></bdi> הוא המשקל (ההסתברות) של כל תצפית. השונות היא ממוצע משוקלל של ריבועי המרחקים מהממוצע. השונות המשותפת (Cov) עושה אותו דבר עבור שני משתנים: היא חיובית כששניהם נוטים להיות מעל הממוצע יחד. סטיית התקן σ היא השורש של השונות.</p>
<p><b>חשוב למבחן:</b> גם כשמדובר במדגם, דף הנוסחאות הרשמי מחשב את השונות ב<u>חלוקה ב־n</u>, כלומר <bdi dir="ltr">P<sub>i</sub> = 1/n</bdi>. בספרי סטטיסטיקה רבים מחלקים ב־<bdi dir="ltr">(n − 1)</bdi>, אבל במבחן הזה לא עושים זאת, אלא אם השאלה מציינת אחרת במפורש.</p>
<h4>טבלת שכיחויות</h4>
<p>כשהנתונים מוצגים בטבלה של שכיחויות יחסיות, המשקלים <bdi dir="ltr">P<sub>i</sub></bdi> הם השכיחויות היחסיות, וכל מחלקה מיוצגת על ידי אמצע המחלקה. את צורת ההתפלגות קובעים לפי המקום שבו מרוכז רוב המשקל: אם רוב השכיחות נמצאת בערכים הנמוכים והזנב נמשך לעבר הערכים הגבוהים, ההתפלגות אסימטרית ימנית. כך בדיוק נוסחה שאלה 8 במבחן 09/2025.</p>
<p>סטיית התקן נמדדת באותן יחידות כמו הנתונים עצמם. מקדם ההשתנות (CV) הוא סטיית התקן חלקי הממוצע. זה מדד פיזור יחסי, והוא מאפשר להשוות פיזור בין סדרות שהממוצעים שלהן שונים. במימון הוא מבטא סיכון ליחידת תשואה.</p>
<h4>טרנספורמציה לינארית</h4>
<div class="fx" dir="ltr">Y = a + bX → Ȳ = a + b·x̄ ,&nbsp; σ<sub>Y</sub> = |b|·σ<sub>X</sub> ,&nbsp; σ²<sub>Y</sub> = b²·σ²<sub>X</sub></div>
<p>כאן a הוא קבוע שמוסיפים לכל תצפית, ו־b הוא מספר שמכפילים בו כל תצפית. הוספת קבוע מזיזה את כל הנתונים, אבל אינה משנה את הפיזור. הכפלה ב־b מכפילה את סטיית התקן בערכו המוחלט של b, ואת השונות ב־<bdi dir="ltr">b²</bdi>.</p>
<h4>צורת ההתפלגות</h4>
<p>כשהממוצע גדול מהחציון, להתפלגות יש זנב ארוך ימינה: אסימטריה ימנית (חיובית). כשהממוצע קטן מהחציון, האסימטריה שמאלית (שלילית). בהתפלגות סימטרית הממוצע שווה לחציון.</p>
<div class="ex"><b>דוגמה פתורה.</b> הנתונים: 2, 4, 4, 4, 5, 5, 7, 9.<br>
הממוצע: <bdi dir="ltr">40/8 = 5</bdi>. ריבועי הסטיות מהממוצע: 9, 1, 1, 1, 0, 0, 4, 16, ובסך הכול 32.<br>
השונות לפי דף הנוסחאות <bdi dir="ltr">(P<sub>i</sub> = 1/8)</bdi>: <bdi dir="ltr">32/8 = 4</bdi>, ולכן <bdi dir="ltr">σ = √4 = 2</bdi>.<br>
מקדם ההשתנות: <bdi dir="ltr">CV = 2/5 = 0.4</bdi>.<br>
החציון הוא הממוצע של התצפיות הרביעית והחמישית: <bdi dir="ltr">(4 + 5)/2 = 4.5</bdi>. השכיח: 4. הממוצע (5) גדול מהחציון (4.5), ולכן יש אסימטריה ימנית קלה.<br>
אם <bdi dir="ltr">Y = 3 + 2X</bdi>: הממוצע של Y הוא <bdi dir="ltr">3 + 2·5 = 13</bdi>, סטיית התקן <bdi dir="ltr">2·2 = 4</bdi> והשונות <bdi dir="ltr">2²·4 = 16</bdi>. הקבוע 3 לא השפיע על הפיזור.</div>
<div class="plain"><b>במילים פשוטות:</b> הממוצע מראה היכן נמצא "מרכז הכובד" של הנתונים, וסטיית התקן מראה כמה רחוקות התצפיות מהמרכז, בממוצע. אם כל המשכורות עולות ב־1,000 ₪, גם הממוצע עולה ב־1,000 ₪, אבל הפערים בין העובדים לא משתנים.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחלק ב־<bdi dir="ltr">(n − 1)</bdi>. לפי דף הנוסחאות הרשמי מחלקים ב־n, כלומר <bdi dir="ltr">P<sub>i</sub> = 1/n</bdi>.</li>
<li>לחשוב שהוספת קבוע משנה את סטיית התקן. היא לא משנה אותה.</li>
<li>להכפיל את השונות ב־b במקום ב־<bdi dir="ltr">b²</bdi>.</li>
<li>לשכוח למיין את הנתונים לפני חישוב החציון.</li>
</ul></div>`},

{id:'s2', area:'stat', title:'הסתברות', short:'הסתברות',
lesson:`
<p>הסתברות היא מספר בין 0 ל־1 שמבטא עד כמה סביר שמאורע יתרחש. כמעט כל שאלה במבחן נפתרת בעזרת ארבעה כללים בסיסיים:</p>
<div class="fx" dir="ltr">P(Aᶜ) = 1 − P(A)<br>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)<br>P(A | B) = P(A ∩ B) / P(B)<br>בלתי תלויים: P(A ∩ B) = P(A)·P(B)</div>
<p>הסימנים: <bdi dir="ltr">Aᶜ</bdi> הוא המשלים של A ("A לא קרה"). <bdi dir="ltr">A ∪ B</bdi> פירושו "A או B, או שניהם". <bdi dir="ltr">A ∩ B</bdi> פירושו "גם A וגם B". <bdi dir="ltr">P(A | B)</bdi> היא ההסתברות ל־A כשידוע ש־B קרה.</p>
<p>דוגמה: <bdi dir="ltr">P(A) = 0.5</bdi>, <bdi dir="ltr">P(B) = 0.4</bdi> ו־<bdi dir="ltr">P(A ∩ B) = 0.2</bdi>. אז <bdi dir="ltr">P(A ∪ B) = 0.5 + 0.4 − 0.2 = 0.7</bdi> ו־<bdi dir="ltr">P(A | B) = 0.2/0.4 = 0.5</bdi>. מאחר ש־<bdi dir="ltr">0.5·0.4 = 0.2</bdi>, המאורעות בלתי תלויים: הידיעה ש־B קרה לא שינתה את ההסתברות ל־A.</p>
<h4>מאורעות זרים לעומת מאורעות בלתי תלויים</h4>
<p>מאורעות <b>זרים</b> אינם יכולים להתרחש יחד: <bdi dir="ltr">P(A ∩ B) = 0</bdi>. מאורעות <b>בלתי תלויים</b> אינם משפיעים זה על זה. שני מאורעות זרים שלכל אחד מהם הסתברות חיובית הם תמיד <u>תלויים</u>: אם A התרחש, ברור ש־B לא התרחש.</p>
<h4>נוסחת ההסתברות השלמה ונוסחת בייס</h4>
<div class="fx" dir="ltr">P(A) = P(A|B)·P(B) + P(A|Bᶜ)·P(Bᶜ)<br>P(B|A) = P(A|B)·P(B) / P(A)</div>
<p>הנוסחה הראשונה מחשבת הסתברות כוללת: מחברים את שני המסלולים שמובילים ל־A (דרך B ודרך "לא B"). נוסחת בייס "הופכת" הסתברות מותנית: ידועה ההסתברות לסימן בהינתן מצב מסוים, ורוצים לדעת מה ההסתברות למצב בהינתן הסימן. הדרך הבטוחה ביותר היא לבנות עץ הסתברויות.</p>
<h4>קומבינטוריקה</h4>
<div class="fx" dir="ltr">n! = 1·2·…·n ,&nbsp; C(n,k) = n! / (k!·(n − k)!)</div>
<p>n! (n עצרת) סופר בכמה דרכים אפשר לסדר n פריטים בשורה. הצירוף C(n,k) סופר בכמה דרכים אפשר לבחור k פריטים מתוך n כשהסדר אינו חשוב. למשל, בחירת 3 מניות מתוך 8: <bdi dir="ltr">C(8,3) = 8!/(3!·5!) = (8·7·6)/(3·2·1) = 56</bdi>.</p>
<div class="ex"><b>דוגמה פתורה (בייס).</b> 1% מהחברות פושטות רגל. מודל דירוג מסמן 90% מהחברות שפושטות רגל, אבל גם 5% מהחברות התקינות.<br>
ההסתברות שחברה תסומן (הסתברות שלמה): <span class="fx">0.9·0.01 + 0.05·0.99 = 0.009 + 0.0495 = 0.0585</span><br>
ההסתברות לפשיטת רגל בהינתן סימון (בייס): <span class="fx">0.009 / 0.0585 ≈ 15.4%</span><br>
המסקנה: כשהתופעה נדירה, גם מודל טוב מייצר בעיקר אזעקות שווא.</div>
<div class="plain"><b>במילים פשוטות:</b> "בהינתן B" פירושו שמצמצמים את העולם רק למקרים שבהם B התרחש, ושואלים איזה חלק מהם הם גם A.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לבלבל בין <bdi dir="ltr">P(A|B)</bdi> לבין <bdi dir="ltr">P(B|A)</bdi>.</li>
<li>לחבר הסתברויות של מאורעות שאינם זרים בלי לחסר את החיתוך.</li>
<li>לחשוב שמאורעות זרים הם בהכרח בלתי תלויים.</li>
</ul></div>`},

{id:'s3', area:'stat', title:'משתנים מקריים והתפלגות בינומית', short:'משתנים מקריים',
lesson:`
<p>משתנה מקרי הוא תוצאה מספרית של ניסוי מקרי, למשל התשואה של מניה בשנה הבאה.</p>
<h4>תוחלת ושונות</h4>
<div class="fx" dir="ltr">E(X) = Σ x·P(x)<br>V(X) = E(X²) − [E(X)]²<br>E(a + bX) = a + b·E(X) ,&nbsp; V(a + bX) = b²·V(X)</div>
<p>התוחלת <bdi dir="ltr">E(X)</bdi> היא ממוצע הערכים, כשכל ערך x משוקלל בהסתברות שלו <bdi dir="ltr">P(x)</bdi>. כדי לחשב את השונות <bdi dir="ltr">V(X)</bdi>, מחשבים קודם את <bdi dir="ltr">E(X²)</bdi> (ממוצע משוקלל של ריבועי הערכים), ומחסרים ממנו את ריבוע התוחלת.</p>
<h4>שני משתנים</h4>
<div class="fx" dir="ltr">Cov(X,Y) = E(XY) − E(X)E(Y)<br>ρ = Cov(X,Y) / (σ<sub>X</sub>·σ<sub>Y</sub>) ,&nbsp; −1 ≤ ρ ≤ 1<br>V(aX + bY) = a²V(X) + b²V(Y) + 2ab·Cov(X,Y)</div>
<p>השונות המשותפת Cov מראה אם המשתנים נעים יחד (חיובית) או בכיוונים הפוכים (שלילית). מקדם המתאם ρ הוא אותו מדד אחרי חלוקה בסטיות התקן, ולכן הוא תמיד בין ‎−1 ל־1. הנוסחה האחרונה היא הבסיס של כל תורת התיקים: שונות התיק תלויה במתאם בין הנכסים שבו. למשל, אם <bdi dir="ltr">V(X) = 4</bdi>, <bdi dir="ltr">V(Y) = 9</bdi> ו־<bdi dir="ltr">Cov(X,Y) = −3</bdi>, אז <bdi dir="ltr">V(X + Y) = 4 + 9 + 2·(−3) = 7</bdi>.</p>
<p>מתאם 0 פירושו שאין בין המשתנים קשר <u>לינארי</u>, אבל הם לא בהכרח בלתי תלויים. הכיוון ההפוך נכון תמיד: משתנים בלתי תלויים הם בעלי מתאם 0.</p>
<h4>התפלגות בינומית</h4>
<p>מבצעים n ניסויים בלתי תלויים, ובכל אחד מהם ההסתברות להצלחה היא p. המשתנה X סופר את מספר ההצלחות.</p>
<div class="fx" dir="ltr">P(X = k) = C(n,k)·p<sup>k</sup>·(1 − p)<sup>n−k</sup><br>E(X) = np ,&nbsp; V(X) = np(1 − p)</div>
<p>הנוסחה סופרת בכמה סדרים אפשר לקבל k הצלחות (<bdi dir="ltr">C(n,k)</bdi>), וכופלת בהסתברות של סדר אחד כזה. דוגמה: 5 ניסויים עם <bdi dir="ltr">p = 0.2</bdi>. ההסתברות לבדיוק 2 הצלחות: <bdi dir="ltr">C(5,2)·0.2²·0.8³ = 10·0.04·0.512 = 0.2048</bdi>. התוחלת: <bdi dir="ltr">5·0.2 = 1</bdi>, והשונות: <bdi dir="ltr">5·0.2·0.8 = 0.8</bdi>.</p>
<div class="ex"><b>דוגמה פתורה.</b> X מקבל את הערך 10 בהסתברות 0.5, את הערך 0 בהסתברות 0.3 ואת הערך ‎−20 בהסתברות 0.2.<br>
<bdi dir="ltr">E(X) = 10·0.5 + 0·0.3 + (−20)·0.2 = 5 + 0 − 4 = 1</bdi><br>
<bdi dir="ltr">E(X²) = 100·0.5 + 0·0.3 + 400·0.2 = 50 + 0 + 80 = 130</bdi><br>
<bdi dir="ltr">V(X) = 130 − 1² = 129</bdi>, ולכן <bdi dir="ltr">σ = √129 ≈ 11.36</bdi>.<br>
עבור <bdi dir="ltr">Y = 3 − 2X</bdi> (כלומר <bdi dir="ltr">a = 3</bdi>, <bdi dir="ltr">b = −2</bdi>):<br>
<bdi dir="ltr">E(Y) = 3 − 2·1 = 1</bdi><br>
<bdi dir="ltr">V(Y) = (−2)²·129 = 4·129 = 516</bdi></div>
<div class="plain"><b>במילים פשוטות:</b> התוחלת היא "הממוצע בטווח הארוך": מה שמתקבל בממוצע אם חוזרים על הניסוי שוב ושוב. השונות מודדת עד כמה התוצאות מתפזרות סביב התוחלת.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לשכוח שהקבוע a והסימן של b אינם משפיעים על השונות, כי b מועלה בריבוע: <bdi dir="ltr">V(a − bX) = b²V(X)</bdi>.</li>
<li>לשכוח את האיבר <bdi dir="ltr">2Cov</bdi> בשונות של סכום.</li>
<li>לשכוח את מקדם הצירוף <bdi dir="ltr">C(n,k)</bdi> בהתפלגות הבינומית.</li>
</ul></div>`},

{id:'s4', area:'stat', title:'ההתפלגות הנורמלית', short:'נורמלית',
lesson:`
<p>ההתפלגות הנורמלית היא "פעמון" סימטרי סביב הממוצע, ולכן הממוצע, החציון והשכיח שלה שווים. כל משתנה נורמלי אפשר להפוך למשתנה נורמלי סטנדרטי (ממוצע 0 וסטיית תקן 1) בעזרת תקנון:</p>
<div class="fx" dir="ltr">Z = (X − μ) / σ ,&nbsp; P(X ≤ x) = Φ(z)</div>
<p>μ הוא הממוצע, σ היא סטיית התקן, ו־Z אומר כמה סטיות תקן הערך x רחוק מהממוצע. Φ(z) היא ההסתברות לקבל ערך קטן מ־z, כלומר השטח שמשמאל ל־z בטבלה. למשל, אם <bdi dir="ltr">μ = 100</bdi> ו־<bdi dir="ltr">σ = 15</bdi>, הערך 130 נמצא ב־<bdi dir="ltr">Z = (130 − 100)/15 = 2</bdi>, ולכן <bdi dir="ltr">P(X ≤ 130) = Φ(2) = 0.9772</bdi>.</p>
<h4>ערכים שכדאי לזכור בעל פה</h4>
<div class="tbl-wrap"><table class="mini"><tr><th>z</th><td>1</td><td>1.28</td><td>1.645</td><td>1.96</td><td>2</td><td>2.33</td><td>2.576</td></tr>
<tr><th>Φ(z)</th><td>0.8413</td><td>0.90</td><td>0.95</td><td>0.975</td><td>0.9772</td><td>0.99</td><td>0.995</td></tr></table></div>
<p>כלל 68-95-99.7: כ־68% מהתצפיות נמצאות במרחק של עד סטיית תקן אחת מהממוצע, כ־95% במרחק של עד שתי סטיות תקן וכ־99.7% במרחק של עד שלוש.</p>
<p>מהסימטריה נובע: <bdi dir="ltr">Φ(−z) = 1 − Φ(z)</bdi>. בנוסף, סכום של משתנים נורמליים הוא משתנה נורמלי.</p>
<h4>"באיזה טווח נמצאת התצפית בהסתברות של 95%?"</h4>
<p>עבור תצפית בודדת, ולא עבור ממוצע, הטווח הוא <bdi dir="ltr">μ ± 1.96σ</bdi>. כך בשאלה 4 במבחן 09/2025: <bdi dir="ltr">4.2 ± 1.96·0.35</bdi>, כלומר בין 3.51 ל־4.89 מטר.</p>
<h4>יישום במימון: ערך בסיכון (VaR)</h4>
<p>אם התשואה מתפלגת נורמלית, התשואה שמתחתיה נמצאים 5% מהמקרים היא <bdi dir="ltr">μ − 1.645σ</bdi>. ברמה של 1%: <bdi dir="ltr">μ − 2.33σ</bdi>.</p>
<div class="ex"><b>דוגמה פתורה.</b> התשואה השנתית מתפלגת נורמלית עם ממוצע 8% וסטיית תקן 20%. מה ההסתברות להפסד, כלומר לתשואה נמוכה מ־0?<br>
מתקננים: <span class="fx">Z = (0 − 8)/20 = −0.4</span><br>
קוראים בטבלה בעזרת הסימטריה: <span class="fx">P(Z &lt; −0.4) = 1 − Φ(0.4) = 1 − 0.6554 = 0.3446</span>, כלומר כ־34.5%.<br>
ה־VaR ברמה של 5%: <bdi dir="ltr">8 − 1.645·20 = −24.9%</bdi>. כלומר ב־5% מהשנים התשואה תהיה נמוכה מ־‎−24.9%.</div>
<div class="plain"><b>במילים פשוטות:</b> Z אומר כמה סטיות תקן התצפית רחוקה מהממוצע. אחרי שמחשבים את Z, נשאר רק לשרטט ולקרוא בטבלה.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>בשאלה "גדול מ־" צריך <bdi dir="ltr">1 − Φ(z)</bdi> ולא <bdi dir="ltr">Φ(z)</bdi>. כדאי תמיד לשרטט פעמון ולסמן את השטח המבוקש.</li>
<li>לחלק בשונות במקום בסטיית התקן.</li>
<li>לבלבל בין 1.645 (חד־צדדי, 5%) לבין 1.96 (דו־צדדי, 5%).</li>
</ul></div>`},

{id:'s5', area:'stat', title:'דגימה ורווחי סמך', short:'רווחי סמך',
lesson:`
<p>אי אפשר לבדוק את כל האוכלוסייה, ולכן לוקחים מדגם ומסיקים ממנו על האוכלוסייה. ממוצע המדגם x̄ הוא בעצמו משתנה מקרי: בכל מדגם הוא יוצא קצת אחרת.</p>
<h4>משפט הגבול המרכזי</h4>
<p>כשהמדגם גדול (בדרך כלל <bdi dir="ltr">n ≥ 30</bdi>), ההתפלגות של x̄ קרובה לנורמלית, <u>בלי קשר</u> להתפלגות האוכלוסייה. התוחלת שלה היא μ, וסטיית התקן שלה נקראת טעות התקן:</p>
<div class="fx" dir="ltr">SE = σ / √n</div>
<h4>רווח סמך לממוצע</h4>
<div class="fx" dir="ltr">x̄ ± z<sub>α/2</sub>·σ/√n<br>σ לא ידועה ומדגם קטן: x̄ ± t<sub>(n−1)</sub>·s/√n<br>n = (z·σ / E)² &nbsp;(מעגלים כלפי מעלה)</div>
<p>הסימנים: x̄ הוא ממוצע המדגם, σ היא סטיית התקן באוכלוסייה, n הוא גודל המדגם. <bdi dir="ltr">z<sub>α/2</sub></bdi> הוא הערך מהטבלה לרמת הביטחון (1.96 עבור 95%). כשלא יודעים את σ והמדגם קטן, משתמשים בסטיית התקן של המדגם s ובערך מטבלת t עם <bdi dir="ltr">n − 1</bdi> דרגות חופש.</p>
<p>E הוא מחצית רוחב הרווח, והוא נקרא גם טעות הדגימה המרבית. רוחב הרווח פרופורציוני ל־<bdi dir="ltr">1/√n</bdi>, ולכן כדי לחצות את הרוחב צריך פי <b>4</b> תצפיות. ככל שרמת הביטחון גבוהה יותר, הרווח <b>רחב</b> יותר.</p>
<div class="ex"><b>דוגמה פתורה.</b> <bdi dir="ltr">n = 100</bdi>, <bdi dir="ltr">x̄ = 50</bdi>, <bdi dir="ltr">σ = 10</bdi>, רמת ביטחון 95%.<br>
טעות התקן: <bdi dir="ltr">SE = 10/√100 = 1</bdi>.<br>
הרווח: <bdi dir="ltr">50 ± 1.96·1</bdi>, כלומר בין 48.04 ל־51.96.<br>
כמה תצפיות נדרשות כדי שטעות הדגימה המרבית תהיה 0.5? <bdi dir="ltr">n = (1.96·10/0.5)² = 1536.64</bdi>, ולכן מעגלים ל־1537.</div>
<div class="plain"><b>במילים פשוטות:</b> רווח סמך של 95% פירושו: אם נחזור על הדגימה פעמים רבות, 95% מהרווחים שנבנה יכילו את הממוצע האמיתי. אין זה אומר ש־μ "זז" בתוך הרווח. μ קבוע, והרווח הוא שמשתנה ממדגם למדגם.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להשתמש ב־σ במקום בטעות התקן <bdi dir="ltr">σ/√n</bdi>.</li>
<li>לחשוב שהכפלת המדגם מחצה את רוחב הרווח. בפועל הרוחב קטן רק פי <bdi dir="ltr">√2</bdi>.</li>
<li>לעגל כלפי מטה בחישוב גודל המדגם. תמיד מעגלים כלפי מעלה.</li>
</ul></div>`},

{id:'s6', area:'stat', title:'בדיקת השערות', short:'השערות',
lesson:`
<p>בדיקת השערות היא החלטה על סמך מדגם: האם יש מספיק ראיות כדי לדחות את טענת הבסיס.</p>
<ul><li><b>H₀</b> (השערת האפס): הטענה הקיימת, למשל <bdi dir="ltr">μ = 100</bdi>.</li><li><b>H₁</b> (ההשערה החלופית): הטענה שרוצים להוכיח, למשל <bdi dir="ltr">μ ≠ 100</bdi> (דו־צדדית) או <bdi dir="ltr">μ &gt; 100</bdi> (חד־צדדית).</li></ul>
<div class="fx" dir="ltr">Z = (x̄ − μ₀) / (σ/√n)</div>
<p>μ₀ הוא הממוצע לפי H₀. הסטטיסטי Z מודד כמה טעויות תקן ממוצע המדגם x̄ רחוק מ־μ₀. אם Z רחוק מאפס יותר מהערך הקריטי, התוצאה לא סבירה תחת H₀, ודוחים אותה.</p>
<h4>שני סוגי טעויות</h4>
<div class="tbl-wrap"><table class="mini"><tr><th></th><th>H₀ נכונה</th><th>H₀ אינה נכונה</th></tr>
<tr><th>דוחים את H₀</th><td>טעות מסוג I (α)</td><td>החלטה נכונה (העוצמה היא <bdi dir="ltr">1 − β</bdi>)</td></tr>
<tr><th>לא דוחים</th><td>החלטה נכונה</td><td>טעות מסוג II (β)</td></tr></table></div>
<ul><li>הקטנת α, כשגודל המדגם קבוע, מגדילה את β.</li><li>הגדלת המדגם מקטינה את β, ולכן מגדילה את עוצמת המבחן.</li></ul>
<h4>p-value</h4>
<p>ה־p-value הוא ההסתברות לקבל תוצאה קיצונית לפחות כמו זו שהתקבלה במדגם, בהנחה ש־H₀ נכונה. <b>דוחים את H₀ כאשר p-value קטן מ־α.</b></p>
<p>ערכים קריטיים: דו־צדדי ברמה 5%: 1.96. חד־צדדי ברמה 5%: 1.645. דו־צדדי ברמה 1%: 2.576. חד־צדדי ברמה 1%: 2.33.</p>
<div class="ex"><b>דוגמה פתורה.</b> H₀: <bdi dir="ltr">μ = 100</bdi> מול H₁: <bdi dir="ltr">μ ≠ 100</bdi>. <bdi dir="ltr">σ = 12</bdi>, <bdi dir="ltr">n = 36</bdi>, <bdi dir="ltr">x̄ = 103</bdi>, <bdi dir="ltr">α = 5%</bdi>.<br>
טעות התקן: <bdi dir="ltr">12/√36 = 12/6 = 2</bdi>.<br>
הסטטיסטי: <bdi dir="ltr">Z = (103 − 100)/2 = 1.5</bdi>.<br>
מאחר ש־<bdi dir="ltr">1.5 &lt; 1.96</bdi>, לא דוחים את H₀.<br>
עם אותם נתונים והשערה חלופית H₁: <bdi dir="ltr">μ &gt; 100</bdi>, הערך הקריטי הוא 1.645, ו־1.5 עדיין קטן ממנו. גם כאן לא דוחים.</div>
<div class="plain"><b>במילים פשוטות:</b> זה כמו במשפט פלילי. H₀ היא חזקת החפות: הנאשם זכאי עד שתוכח אשמתו. "לא דוחים" אין פירושו "הוכחנו שהוא זכאי", אלא רק "אין מספיק ראיות להרשעה".</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לכתוב "מקבלים את H₀". הניסוח הנכון: "לא דוחים את H₀".</li>
<li>להפוך את כלל ה־p-value. דוחים כשהוא <u>קטן</u> מ־α.</li>
<li>להשתמש בערך קריטי דו־צדדי במבחן חד־צדדי.</li>
</ul></div>`},

{id:'s7', area:'stat', title:'מתאם ורגרסיה', short:'רגרסיה',
lesson:`
<p>מקדם המתאם r מודד את העוצמה ואת הכיוון של קשר <u>לינארי</u> בין שני משתנים, וערכו נע ממינוס 1 ועד 1. רגרסיה לינארית מוצאת את הקו שמתאר את הקשר בצורה הטובה ביותר.</p>
<div class="fx" dir="ltr">Ŷ = a + bX<br>b = Cov(X,Y) / V(X) = r·σ<sub>Y</sub>/σ<sub>X</sub><br>a = ȳ − b·x̄<br>R² = r² &nbsp;(ברגרסיה פשוטה)</div>
<p>Ŷ הוא הערך שהקו חוזה ל־Y. השיפוע b מראה בכמה משתנה Y, בממוצע, כאשר X עולה ביחידה אחת. החותך a הוא הערך החזוי של Y כאשר <bdi dir="ltr">X = 0</bdi>. מקדם הקביעה R² הוא החלק משונות Y שהמודל מסביר.</p>
<div class="fx" dir="ltr">שונות מוסברת: b²·Var(X) = R²·Var(Y) = σ<sub>Y</sub>²·ρ²<br>שונות לא מוסברת: Var(ε) = (1 − R²)·Var(Y)</div>
<p>השונות של Y מתחלקת לשני חלקים: החלק שהקו מסביר (המוסבר), והחלק שנשאר בסטיות של הנקודות מהקו (ε, הלא מוסבר).</p>
<p>קו הרגרסיה עובר תמיד דרך נקודת הממוצעים <bdi dir="ltr">(x̄, ȳ)</bdi>. שינוי יחידות המידה (הכפלה בקבוע חיובי) אינו משנה את r.</p>
<h4>הקשר למימון</h4>
<p>הבטא של מניה היא השיפוע ברגרסיה של תשואת המניה על תשואת השוק: <bdi dir="ltr">β = Cov(R<sub>i</sub>,R<sub>m</sub>)/σ²<sub>m</sub></bdi>.</p>
<div class="ex"><b>דוגמה פתורה.</b> <bdi dir="ltr">Cov(X,Y) = 12</bdi>, <bdi dir="ltr">V(X) = 4</bdi>, <bdi dir="ltr">x̄ = 2</bdi>, <bdi dir="ltr">ȳ = 10</bdi>.<br>
השיפוע: <bdi dir="ltr">b = 12/4 = 3</bdi>. החותך: <bdi dir="ltr">a = 10 − 3·2 = 4</bdi>.<br>
קו הרגרסיה: <bdi dir="ltr">Ŷ = 4 + 3X</bdi>. עבור <bdi dir="ltr">X = 5</bdi>: <bdi dir="ltr">Ŷ = 4 + 3·5 = 19</bdi>.<br>
אם <bdi dir="ltr">σ<sub>Y</sub> = 8</bdi> (ו־<bdi dir="ltr">σ<sub>X</sub> = √4 = 2</bdi>), אז <bdi dir="ltr">r = 12/(2·8) = 0.75</bdi> ו־<bdi dir="ltr">R² = 0.75² = 0.5625</bdi>.<br>
השונות של Y היא <bdi dir="ltr">8² = 64</bdi>. המוסברת: <bdi dir="ltr">3²·4 = 36</bdi> (וגם <bdi dir="ltr">0.5625·64 = 36</bdi>). הלא מוסברת: <bdi dir="ltr">64 − 36 = 28</bdi>.</div>
<div class="plain"><b>במילים פשוטות:</b> מתאם גבוה פירושו שהמשתנים "זזים יחד", אבל לא שאחד מהם גורם לשני. מכירות גלידה ומקרי טביעה מתואמים, כי שניהם עולים בקיץ.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחלק את השונות המשותפת בשונות של Y במקום בשונות של X.</li>
<li>לחשוב שמתאם 0 פירושו שאין שום קשר. ייתכן קשר שאינו לינארי.</li>
<li>להסיק סיבתיות ממתאם.</li>
</ul></div>`},

{id:'f1', area:'fin', title:'ערך הזמן של הכסף', short:'ערך הזמן',
lesson:`
<p>שקל היום שווה יותר משקל בעתיד, כי אפשר להשקיע אותו ולקבל עליו ריבית. לכן אי אפשר לחבר סכומים מתאריכים שונים לפני שמביאים את כולם לאותה נקודת זמן.</p>
<div class="fx" dir="ltr">ריבית דריבית: FV = PV·(1 + r)<sup>n</sup><br>PV = FV / (1 + r)<sup>n</sup><br>ריבית פשוטה: FV = PV·(1 + r·n)<br>r = (FV/PV)<sup>1/n</sup> − 1</div>
<p>הסימנים: PV הוא הסכום היום (ערך נוכחי), FV הוא הסכום בעתיד (ערך עתידי), r היא הריבית לתקופה כמספר עשרוני, ו־n הוא מספר התקופות. הנוסחה הרביעית מחלצת את הריבית כשידועים הסכום ההתחלתי והסכום הסופי.</p>
<p>בריבית דריבית מקבלים ריבית גם על הריבית שכבר נצברה. בריבית פשוטה מקבלים ריבית רק על הקרן. לתקופה של יותר משנה, ריבית דריבית מניבה תמיד יותר.</p>
<p>כלל 72: מספר השנים עד שהכסף מוכפל שווה בקירוב ל־72 חלקי הריבית באחוזים. למשל, בריבית של 6%: <bdi dir="ltr">72/6 = 12</bdi> שנים (החישוב המדויק נותן 11.9). זהו קירוב בלבד.</p>
<div class="ex"><b>דוגמה פתורה.</b> מפקידים 10,000 ₪ בריבית של 5% לשנה למשך 3 שנים.<br>
ריבית דריבית: <bdi dir="ltr">FV = 10,000·1.05³ = 11,576.25</bdi> ₪.<br>
ריבית פשוטה: <bdi dir="ltr">FV = 10,000·(1 + 0.05·3) = 10,000·1.15 = 11,500</bdi> ₪.<br>
ובכיוון ההפוך: איזו ריבית הופכת 10,000 ל־11,576.25 בתוך 3 שנים? <bdi dir="ltr">(11,576.25/10,000)<sup>1/3</sup> − 1 = 5%</bdi>.<br>
מה הערך הנוכחי של 20,000 ₪ שיתקבלו בעוד 4 שנים, בריבית של 6%? <bdi dir="ltr">PV = 20,000/1.06⁴ = 15,841.87</bdi> ₪.</div>
<div class="plain"><b>במילים פשוטות:</b> FV הוא תנועה "קדימה בזמן": מכפילים ב־(1 + r) על כל שנה. PV הוא תנועה "אחורה בזמן": מחלקים. זה כל הסוד.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להשתמש בריבית שנתית עם מספר תקופות חודשי. הריבית ומספר התקופות חייבים להיות באותה יחידת זמן.</li>
<li>לחלק ב־<bdi dir="ltr">(1 + r·n)</bdi> כשנדרשת ריבית דריבית.</li>
</ul></div>`},

{id:'f2', area:'fin', title:'ריבית נקובה, אפקטיבית וריאלית', short:'ריביות',
lesson:`
<h4>ריבית נקובה מול ריבית אפקטיבית</h4>
<p>ריבית נקובה של 12% לשנה בצבירה חודשית פירושה 1% לחודש. בגלל הריבית דריבית, הריבית השנתית האפקטיבית גבוהה מ־12%.</p>
<div class="fx" dir="ltr">r<sub>eff</sub> = (1 + r/m)<sup>m</sup> − 1<br>צבירה רציפה: r<sub>eff</sub> = e<sup>r</sup> − 1<br>חודשית מתוך אפקטיבית שנתית: (1 + r)<sup>1/12</sup> − 1</div>
<p>הסימנים: r היא הריבית הנקובה השנתית, m הוא מספר תקופות הצבירה בשנה (12 בצבירה חודשית, 4 ברבעונית), ו־<bdi dir="ltr">r<sub>eff</sub></bdi> היא הריבית האפקטיבית, כלומר מה שמתקבל בפועל בסוף השנה. ככל ש־m גדול יותר, הריבית האפקטיבית גבוהה יותר. הגבול העליון הוא צבירה רציפה: ריבית נקובה של 12% בצבירה רציפה נותנת <bdi dir="ltr">e<sup>0.12</sup> − 1 = 12.75%</bdi>.</p>
<h4>ריבית משתנה וריבית ממוצעת</h4>
<div class="fx" dir="ltr">i<sub>cum</sub> = (1 + i₁)(1 + i₂)…(1 + i<sub>t</sub>) − 1<br>i<sub>avg</sub> = (1 + i<sub>cum</sub>)<sup>1/t</sup> − 1</div>
<p><bdi dir="ltr">i₁, i₂, …</bdi> הן הריביות בכל תקופה, t הוא מספר התקופות, <bdi dir="ltr">i<sub>cum</sub></bdi> היא הריבית המצטברת לכל התקופה, ו־<bdi dir="ltr">i<sub>avg</sub></bdi> היא הריבית הממוצעת לתקופה. דוגמה: 5%, ‎−2% ו־3% בשלוש שנים. המצטברת: <bdi dir="ltr">1.05·0.98·1.03 − 1 = 5.99%</bdi>. הממוצעת: <bdi dir="ltr">1.0599<sup>1/3</sup> − 1 = 1.96%</bdi> לשנה (הממוצע החשבוני היה 2%).</p>
<p>הריבית הממוצעת לתקופה היא ממוצע <b>גיאומטרי</b> ולא ממוצע חשבוני. כשהתשואות תנודתיות, הממוצע הגיאומטרי נמוך מהחשבוני. בשאלה 19 במבחן 09/2025, למשל, הממוצע החשבוני של 12 התשואות החודשיות הוא 0.39%, אבל התשואה החודשית האפקטיבית היא רק 0.23%.</p>
<h4>השוואה בין חלופות חיסכון</h4>
<p>כדי להשוות ריביות שמוצגות בצורות שונות (מצטברת, חודשית, יומית, רבעונית או לתקופה של 6 שנים), ממירים את כולן לאותה תקופה. דרך נוחה היא לחשב לכל חלופה את גורם הצבירה לכל התקופה, <bdi dir="ltr">(1 + i)<sup>t</sup></bdi>, כאשר i היא הריבית לתקופה קצרה אחת ו־t הוא מספר התקופות הקצרות. לדוגמה, ריבית של 5.1% בצבירה רבעונית ל־18 שנה: 72 רבעונים, ובכל אחד ריבית של <bdi dir="ltr">5.1%/4</bdi>. גורם הצבירה: <bdi dir="ltr">(1 + 0.051/4)<sup>72</sup> = 2.49</bdi>.</p>
<h4>ריבית ריאלית: משוואת פישר</h4>
<div class="fx" dir="ltr">(1 + n) = (1 + r)·(1 + π)<br>r = (1 + n)/(1 + π) − 1 ≈ n − π</div>
<p>בנוסחה, n היא הריבית הנומינלית, r היא הריבית הריאלית ו־π היא שיעור האינפלציה. הריבית הריאלית מודדת את הגידול בכוח הקנייה. הקירוב <bdi dir="ltr">n − π</bdi> טוב רק כשהמספרים קטנים.</p>
<h4>הצמדת הקרן למדד</h4>
<div class="fx" dir="ltr">L<sub>1</sub> = L<sub>0</sub> × (I<sub>1</sub> / I<sub>0</sub>)</div>
<p>כאן <bdi dir="ltr">L<sub>0</sub></bdi> היא הקרן המקורית, <bdi dir="ltr">L<sub>1</sub></bdi> היא הקרן הצמודה, <bdi dir="ltr">I<sub>0</sub></bdi> הוא מדד הבסיס, ו־<bdi dir="ltr">I<sub>1</sub></bdi> הוא המדד הידוע.</p>
<p>מדד הבסיס הוא המדד ביום ההלוואה או ההנפקה, והמדד הידוע הוא המדד האחרון שפורסם ביום התשלום. למשל, קרן של 100,000 ₪, מדד בסיס 100 ומדד ידוע 103: הקרן הצמודה היא <bdi dir="ltr">100,000 × 103/100 = 103,000</bdi> ₪.</p>
<h4>אג״ח צמודה מול אג״ח שקלית</h4>
<p>אג״ח צמודה למדד מניבה תשואה ריאלית, ואג״ח שקלית מניבה תשואה נומינלית. <b>אינפלציית האיזון</b> היא שיעור האינפלציה שבו שתיהן מניבות אותה תשואה:</p>
<div class="fx" dir="ltr">π* = (1 + n)/(1 + r) − 1</div>
<p>כאן n היא התשואה של האג״ח השקלית, r היא התשואה של האג״ח הצמודה, ו־π* היא אינפלציית האיזון. משקיע שצופה אינפלציה גבוהה מאינפלציית האיזון יעדיף את האג״ח הצמודה.</p>
<div class="ex"><b>דוגמה פתורה.</b> ריבית נקובה של 12% בצבירה חודשית: <bdi dir="ltr">(1 + 0.12/12)¹² − 1 = 1.01¹² − 1 = 12.68%</bdi>.<br>
ריבית נומינלית 6% ואינפלציה 2%. לכן <bdi dir="ltr">r = 1.06/1.02 − 1 = 3.92%</bdi>. הקירוב נותן 4%.<br>
אג״ח שקלית 4%, אג״ח צמודה 1.5%. אינפלציית האיזון: <bdi dir="ltr">1.04/1.015 − 1 = 2.46%</bdi>.</div>
<div class="plain"><b>במילים פשוטות:</b> הבנק מציין ריבית של 12%, אבל אם הריבית נצברת כל חודש, בסוף השנה מרוויחים קצת יותר. ואם המחירים עלו ב־2%, החלק מהרווח שבאמת מגדיל את כוח הקנייה קטן יותר.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחשב <bdi dir="ltr">n − π</bdi> כשהשאלה מבקשת חישוב מדויק.</li>
<li>להמיר ריבית שנתית אפקטיבית לריבית חודשית בחלוקה ב־12. במקרה כזה צריך להוציא שורש מסדר 12.</li>
</ul></div>`},

{id:'f3', area:'fin', title:'סדרות תשלומים והלוואות', short:'סדרות והלוואות',
lesson:`
<p>סדרת תשלומים (אנונה) היא תשלום קבוע C בכל תקופה, לאורך n תקופות. במקום להוון כל תשלום בנפרד, משתמשים בנוסחה:</p>
<div class="fx" dir="ltr">PV = C·[1 − (1 + r)<sup>−n</sup>] / r<br>FV = C·[(1 + r)<sup>n</sup> − 1] / r<br>תשלום בתחילת כל תקופה: × (1 + r)<br>צמיתות: PV = C / r<br>צמיתות גדלה: PV = C₁ / (r − g)</div>
<p>הסימנים: C הוא התשלום בכל תקופה, r היא הריבית לתקופה, n הוא מספר התשלומים, ו־g הוא שיעור הגידול של התשלום. הנוסחאות הבסיסיות מניחות שהתשלומים בסוף כל תקופה. אם הם בתחילתה, כל תשלום מגיע תקופה אחת מוקדם יותר, ולכן מכפילים את התוצאה ב־<bdi dir="ltr">(1 + r)</bdi>. צמיתות היא סדרה שאינה נגמרת.</p>
<p>בצמיתות גדלה, C₁ הוא התשלום ב<u>סוף השנה הראשונה</u>, והנוסחה תקפה רק כאשר <bdi dir="ltr">r &gt; g</bdi>.</p>
<p>דוגמה: 1,000 ₪ בסוף כל שנה במשך 3 שנים, בריבית של 5%. הערך הנוכחי: <bdi dir="ltr">1,000·(1 − 1.05<sup>−3</sup>)/0.05 = 2,723.25</bdi>. הערך העתידי: <bdi dir="ltr">1,000·(1.05³ − 1)/0.05 = 3,152.50</bdi>. אם התשלומים בתחילת כל שנה: <bdi dir="ltr">2,723.25·1.05 = 2,859.41</bdi>. צמיתות של 1,000 ₪ בשנה: <bdi dir="ltr">1,000/0.05 = 20,000</bdi>.</p>
<h4>סדרה סופית גדלה</h4>
<div class="fx" dir="ltr">PV = C₁/(r − g) · [1 − ((1 + g)/(1 + r))<sup>n</sup>]</div>
<p>הנוסחה הזו <u>אינה</u> מופיעה בדף הנוסחאות הרשמי. כשיש מעט תשלומים, הכי בטוח להוון כל תשלום בנפרד. בשאלה 11 במבחן 09/2025 היו 5 תשלומים חודשיים שגדלים ב־0.2%, והיה צריך גם להמיר ריבית שנתית אפקטיבית לריבית חודשית: <bdi dir="ltr">(1.0407)<sup>1/12</sup> − 1 = 0.333%</bdi>. כל תשלום מהוון לפי מספר החודשים עד מועד התשלום: 1, 2, 3, 4, 5.</p>
<h4>לוח שפיצר מול לוח קרן שווה</h4>
<div class="tbl-wrap"><table class="mini"><tr><th></th><th>שפיצר</th><th>קרן שווה</th></tr>
<tr><th>התשלום התקופתי</th><td>קבוע</td><td>יורד לאורך הזמן</td></tr>
<tr><th>התשלום הראשון</th><td>נמוך יותר</td><td>גבוה יותר</td></tr>
<tr><th>החזר הקרן בכל תשלום</th><td>עולה לאורך הזמן</td><td>קבוע: L/n</td></tr>
<tr><th>סך הריבית</th><td>גבוה יותר</td><td>נמוך יותר</td></tr></table></div>
<div class="fx" dir="ltr">תשלום בלוח שפיצר: PMT = L·r / [1 − (1 + r)<sup>−n</sup>]</div>
<p>L הוא סכום ההלוואה, r היא הריבית לתקופה ו־n הוא מספר התשלומים. זו נוסחת הערך הנוכחי של אנונה, הפוכה: מחפשים את התשלום הקבוע שהערך הנוכחי שלו שווה להלוואה.</p>
<div class="ex"><b>דוגמה פתורה.</b> הלוואה של 100,000 ₪ ל־5 שנים בריבית שנתית של 6%, בתשלומים שנתיים לפי לוח שפיצר.<br>
<bdi dir="ltr">PMT = 100,000·0.06 / (1 − 1.06<sup>−5</sup>) = 6,000 / 0.25274 = 23,739.64</bdi> ₪.<br>
בשנה הראשונה: ריבית <bdi dir="ltr">100,000·0.06 = 6,000</bdi>, והחזר קרן <bdi dir="ltr">23,739.64 − 6,000 = 17,739.64</bdi>. יתרת הקרן: <bdi dir="ltr">100,000 − 17,739.64 = 82,260.36</bdi>.<br>
בלוח קרן שווה: החזר קרן של <bdi dir="ltr">100,000/5 = 20,000</bdi> בכל שנה. התשלום הראשון <bdi dir="ltr">20,000 + 6,000 = 26,000</bdi>, והאחרון <bdi dir="ltr">20,000 + 20,000·0.06 = 21,200</bdi>.</div>
<div class="plain"><b>במילים פשוטות:</b> בשפיצר, בתחילת התקופה רוב התשלום הולך לריבית, ולכן הקרן יורדת לאט. בקרן שווה החוב קטן מהר יותר, ולכן סך הריבית נמוך יותר.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להשתמש בנוסחה לתשלומים בסוף התקופה כשהתשלומים בתחילתה.</li>
<li>להציב בצמיתות גדלה את התשלום של השנה הנוכחית במקום C₁, התשלום בסוף השנה הראשונה.</li>
<li>לשכוח להמיר לריבית חודשית בהלוואה עם תשלומים חודשיים.</li>
</ul></div>`},

{id:'f4', area:'fin', title:'הערכת השקעות: NPV ו־IRR', short:'NPV ו־IRR',
lesson:`
<p>הערכת השקעה עונה על שאלה אחת: האם הפרויקט מחזיר יותר ממה שהכסף היה מרוויח בהשקעה חלופית באותו סיכון. משווים את הערך הנוכחי של התקבולים להשקעה.</p>
<div class="fx" dir="ltr">NPV = PV − I<br>IRR: הריבית שבה NPV = 0<br>PI = NPV / I &nbsp;(דף הנוסחאות הרשמי)<br>EAC = NPV·i / [1 − 1/(1 + i)<sup>t</sup>]</div>
<p>הסימנים: I היא ההשקעה הראשונית (בזמן 0), PV הוא הערך הנוכחי של כל התקבולים העתידיים, i הוא מחיר ההון (שיעור ההיוון), ו־t הוא אורך חיי הפרויקט בשנים. ה־NPV (ערך נוכחי נקי) אומר כמה ערך הפרויקט מוסיף, בשקלים של היום. ה־IRR (שיעור תשואה פנימי) הוא הריבית שהפרויקט עצמו מניב.</p>
<p><b>שימו לב:</b> בדף הנוסחאות הרשמי מדד הרווחיות (PI) מוגדר כ־NPV חלקי ההשקעה. לכן פרויקט כדאי כאשר <bdi dir="ltr">PI &gt; 0</bdi>, ולא כאשר <bdi dir="ltr">PI &gt; 1</bdi> כמו בהגדרה הישנה <bdi dir="ltr">(PV/I)</bdi>.</p>
<h4>תקציב מוגבל (קיצוב הון)</h4>
<p>כשהתקציב מוגבל ואפשר להשקיע גם בחלק מפרויקט, מדרגים את הפרויקטים לפי <b>PI</b>, כלומר לפי ה־NPV לכל שקל השקעה, וממלאים את התקציב מהגבוה לנמוך. ה־IRR אינו רלוונטי לדירוג. בשאלה 14 במבחן 09/2025: פרויקט B, עם PI של 1.2, נכנס ראשון (השקעה של 80 ₪ ו־NPV של 96). את 40 השקלים שנותרו משקיעים ב־C או ב־D (PI של 1.1) ומקבלים <bdi dir="ltr">40·1.1 = 44</bdi>. סך הכול: <bdi dir="ltr">96 + 44 = 140</bdi>.</p>
<h4>שווה ערך תקופתי (EAC)</h4>
<p>משמש להשוואה בין פרויקטים בעלי אורך חיים שונה: הופכים את ה־NPV של כל פרויקט לתשלום שנתי קבוע לאורך חייו, ובוחרים בפרויקט שהתשלום שלו גבוה יותר.</p>
<ul>
<li><b><bdi dir="ltr">NPV &gt; 0</bdi></b>: הפרויקט מוסיף ערך מעבר לתשואה הנדרשת, ולכן מקבלים אותו.</li>
<li><b><bdi dir="ltr">IRR &gt; r</bdi></b> (r הוא מחיר ההון): מקבלים את הפרויקט. בפרויקט קונבנציונלי זה אותו כלל כמו <bdi dir="ltr">NPV &gt; 0</bdi>.</li>
<li>ככל שמחיר ההון עולה, ה־NPV של פרויקט קונבנציונלי יורד.</li>
</ul>
<h4>כאשר NPV ו־IRR סותרים</h4>
<p>בפרויקטים <b>מוציאים זה את זה</b> שני הכללים עלולים לדרג את הפרויקטים באופן שונה, בגלל הבדלים בהיקף ההשקעה או בעיתוי התזרימים. <b>במקרה כזה בוחרים תמיד לפי NPV</b>. הסיבה: IRR מניח השקעה מחדש של התזרימים בשיעור ה־IRR עצמו, ואילו NPV מניח השקעה מחדש במחיר ההון.</p>
<p>כשהתזרים מחליף סימן יותר מפעם אחת (פרויקט לא קונבנציונלי), ייתכנו כמה ערכי IRR, וייתכן גם שלא יהיה אף אחד.</p>
<h4>תקופת ההחזר</h4>
<p>תקופת ההחזר היא הזמן שעובר עד שההשקעה חוזרת. קל לחשב אותה, אבל היא מתעלמת מערך הזמן של הכסף ומהתזרימים שאחרי נקודת ההחזר.</p>
<div class="ex"><b>דוגמה פתורה.</b> השקעה של 1,000, ואחריה תקבול של 600 בכל אחת משתי השנים הבאות. מחיר ההון 10%.<br>
<bdi dir="ltr">NPV = −1,000 + 600/1.1 + 600/1.21 = −1,000 + 545.45 + 495.87 = 41.32</bdi>. ה־NPV חיובי, ולכן מקבלים את הפרויקט.<br>
מדד הרווחיות: <bdi dir="ltr">PI = 41.32/1,000 = 0.041</bdi>, גדול מאפס.<br>
IRR: פותרים <bdi dir="ltr">600x + 600x² = 1,000</bdi>, כאשר <bdi dir="ltr">x = 1/(1 + i)</bdi>. מתקבל <bdi dir="ltr">x = 0.8844</bdi>, ולכן <bdi dir="ltr">IRR = 1/0.8844 − 1 ≈ 13.07%</bdi>, יותר ממחיר ההון (10%).<br>
EAC לשנתיים: <bdi dir="ltr">41.32·0.1 / (1 − 1/1.1²) = 4.132/0.1736 = 23.81</bdi> בשנה.</div>
<div class="plain"><b>במילים פשוטות:</b> NPV עונה על השאלה: כמה כסף, בערכים של היום, הפרויקט מוסיף מעבר למה שהיה מתקבל בהשקעה החלופית. IRR עונה על השאלה: איזו ריבית הפרויקט מניב.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לבחור לפי IRR בין פרויקטים מוציאים זה את זה.</li>
<li>להוון את ההשקעה הראשונית. היא מתבצעת בזמן 0.</li>
<li>לחשוב שתקופת החזר קצרה יותר עדיפה תמיד.</li>
</ul></div>`},

{id:'f5', area:'fin', title:'אגרות חוב, תשואה ומח״מ', short:'אג״ח ומח״מ',
lesson:`
<p>מחיר אג״ח הוא הערך הנוכחי של תשלומי הקופון ושל הקרן, מהוונים בתשואה לפדיון (YTM).</p>
<div class="fx" dir="ltr">P = Σ C/(1 + y)<sup>t</sup> + F/(1 + y)<sup>n</sup><br>אג״ח ללא קופון: P = F / (1 + y)<sup>n</sup><br>תשואה שוטפת: C / P</div>
<p>הסימנים: P הוא מחיר האג״ח, C הוא הקופון השנתי בשקלים, F הוא הערך הנקוב (הקרן שמוחזרת בסוף), y היא התשואה לפדיון, t הוא מועד כל תשלום ו־n הוא מספר השנים עד הפדיון. התשואה השוטפת היא רק הקופון חלקי המחיר, בלי הרווח או ההפסד בפדיון. דוגמה: אג״ח ללא קופון, ערך נקוב 100, 3 שנים, תשואה 6%: <bdi dir="ltr">P = 100/1.06³ = 83.96</bdi>.</p>
<h4>כללים שחייבים לזכור</h4>
<ul>
<li>המחיר והתשואה נעים <b>בכיוונים הפוכים</b>.</li>
<li>כשהקופון שווה לתשואה, האג״ח נסחרת לפי הערך הנקוב (100).</li>
<li>כשהתשואה גבוהה מהקופון, האג״ח נסחרת בניכיון (מחיר נמוך מ־100).</li>
<li>כשהתשואה נמוכה מהקופון, האג״ח נסחרת בפרמיה (מחיר גבוה מ־100).</li>
</ul>
<h4>מח״מ (משך חיים ממוצע)</h4>
<div class="fx" dir="ltr">מח״מ מקולי: D = Σ t·PV(CF<sub>t</sub>) / P<br>מח״מ מתוקן: D* = D / (1 + y)<br>ΔP/P ≈ −D*·Δy<br>תיקון קמירות: + ½·C·Δy²<br>אג״ח צמיתה: D = (1 + y)/y</div>
<p>הסימנים: <bdi dir="ltr">PV(CF<sub>t</sub>)</bdi> הוא הערך הנוכחי של התשלום בשנה t. D הוא מח״מ מקולי, D* הוא המח״מ המתוקן, Δy הוא השינוי בתשואה, ו־C בשורת תיקון הקמירות היא הקמירות (ולא הקופון). המח״מ של מקולי הוא הממוצע המשוקלל של מועדי התשלומים, כשהמשקל של כל מועד הוא החלק שלו במחיר. המח״מ המתוקן משמש לחישוב שינוי המחיר: עלייה של Δy בתשואה מורידה את המחיר בכ־<bdi dir="ltr">D*·Δy</bdi> אחוזים. באג״ח ללא קופון המח״מ שווה לזמן לפדיון. באג״ח צמיתה עם תשואה של 6%: <bdi dir="ltr">D = 1.06/0.06 = 17.67</bdi> שנים.</p>
<p>המח״מ <b>ארוך יותר</b> כאשר: התקופה לפדיון ארוכה יותר, הקופון נמוך יותר או התשואה נמוכה יותר.</p>
<p><b>קמירות</b>: עקומת המחיר־תשואה קמורה, ולכן הקירוב הלינארי של המח״מ <u>מעריך בחסר</u> את עליית המחיר כשהריבית יורדת, ו<u>מעריך ביתר</u> את ירידת המחיר כשהריבית עולה. מבין שתי אג״ח עם אותו מח״מ, עדיפה זו שהקמירות שלה גבוהה יותר.</p>
<div class="ex"><b>דוגמה פתורה.</b> אג״ח ל־3 שנים, קופון 5%, ערך נקוב 100, תשואה לפדיון 6%.<br>
<bdi dir="ltr">P = 5/1.06 + 5/1.06² + 105/1.06³ = 4.717 + 4.450 + 88.160 = 97.33</bdi>. האג״ח נסחרת בניכיון, כצפוי (התשואה גבוהה מהקופון).<br>
תשואה שוטפת: <bdi dir="ltr">5/97.33 = 5.14%</bdi>.<br>
<bdi dir="ltr">D = (1·4.717 + 2·4.450 + 3·88.160)/97.33 = 2.857</bdi> שנים.<br>
<bdi dir="ltr">D* = 2.857/1.06 = 2.696</bdi>.<br>
עלייה של 1% בתשואה מורידה את המחיר בכ־2.70% <bdi dir="ltr">(−2.696·1%)</bdi>.</div>
<div class="plain"><b>במילים פשוטות:</b> אג״ח ארוכה דומה לנדנדה ארוכה: כל שינוי קטן בריבית מזיז אותה בחוזקה. המח״מ המתוקן אומר בכמה אחוזים, בקירוב, ישתנה המחיר על כל שינוי של 1% בריבית.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לשכוח את הסימן השלילי: הריבית עולה, ולכן המחיר יורד.</li>
<li>להשתמש במח״מ של מקולי במקום במח״מ המתוקן בחישוב שינוי המחיר.</li>
<li>לחשוב שהתשואה השוטפת שווה לתשואה לפדיון.</li>
</ul></div>`},

{id:'f6', area:'fin', title:'המבנה העתי של הריבית', short:'מבנה עתי',
lesson:`
<p>ריבית ספוט <bdi dir="ltr">s<sub>t</sub></bdi> היא הריבית השנתית על השקעה מהיום ועד שנה t. ריבית פורוורד f היא ריבית שנקבעת היום לתקופה עתידית. למשל, <bdi dir="ltr">f₁,₂</bdi> היא הריבית לשנה השנייה (מסוף שנה 1 עד סוף שנה 2).</p>
<div class="fx" dir="ltr">(1 + s₂)² = (1 + s₁)·(1 + f₁,₂)<br>f₁,₂ = (1 + s₂)² / (1 + s₁) − 1<br>באופן כללי: (1 + s<sub>n</sub>)<sup>n</sup> = (1 + s<sub>m</sub>)<sup>m</sup>·(1 + f<sub>m,n</sub>)<sup>n−m</sup></div>
<p>הרעיון: השקעה לשנתיים בריבית s₂ צריכה להניב בדיוק כמו השקעה לשנה בריבית s₁ ואחריה השקעה לשנה נוספת בריבית הפורוורד. בנוסחה הכללית, <bdi dir="ltr">f<sub>m,n</sub></bdi> היא הריבית השנתית בין שנה m לשנה n, ולכן היא מועלית בחזקת מספר השנים שביניהן, <bdi dir="ltr">n − m</bdi>.</p>
<h4>תאוריות שמסבירות את צורת עקום התשואות</h4>
<ul>
<li><b>השערת הציפיות הטהורות</b>: ריבית הפורוורד שווה לריבית הקצרה הצפויה. לכן עקום עולה פירושו שהשוק צופה עליית ריבית.</li>
<li><b>העדפת נזילות</b>: משקיעים דורשים פרמיה על השקעה לטווח ארוך, ולכן העקום נוטה לעלות גם בלי ציפייה לעליית ריבית.</li>
<li><b>שווקים מפוצלים</b>: לכל טווח יש היצע וביקוש משלו.</li>
</ul>
<p>עקום <b>הפוך</b>, שבו הריבית הקצרה גבוהה מהארוכה, נחשב פעמים רבות לסימן מקדים למיתון.</p>
<div class="ex"><b>דוגמה פתורה.</b> <bdi dir="ltr">s₁ = 4%</bdi>, <bdi dir="ltr">s₂ = 5%</bdi>.<br>
<bdi dir="ltr">f₁,₂ = 1.05²/1.04 − 1 = 1.1025/1.04 − 1 = 6.01%</bdi>. הקירוב <bdi dir="ltr">2·5% − 4% = 6%</bdi> קרוב מאוד לתוצאה.</div>
<div class="plain"><b>במילים פשוטות:</b> השקעה לשנתיים צריכה להניב כמו השקעה לשנה אחת ואחריה השקעה לשנה נוספת. ריבית הפורוורד היא "הריבית של השנה השנייה" שמשווה בין שתי הדרכים.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לשכוח להעלות בריבוע את <bdi dir="ltr">(1 + s₂)</bdi>.</li>
<li>לחשוב שעקום עולה מעיד תמיד על עליית ריבית צפויה. לפי תאוריית העדפת הנזילות, לא בהכרח.</li>
</ul></div>`},

{id:'f7', area:'fin', title:'הערכת מניות', short:'מניות',
lesson:`
<p>מחיר מניה הוא הערך הנוכחי של הדיבידנדים העתידיים. כשהדיבידנד צומח בקצב קבוע g, מתקבל <b>מודל גורדון</b>:</p>
<div class="fx" dir="ltr">P₀ = D₁ / (k − g) ,&nbsp; D₁ = D₀·(1 + g)<br>k = D₁/P₀ + g<br>g = b·ROE<br>P₀/E₁ = (1 − b) / (k − g)</div>
<p>הסימנים: P₀ הוא מחיר המניה היום. D₀ הוא הדיבידנד ששולם זה עתה, ו־D₁ הוא הדיבידנד הצפוי בעוד שנה. k היא התשואה שהמשקיעים דורשים, ו־g הוא שיעור הצמיחה של הדיבידנד. ROE היא התשואה על ההון העצמי. b הוא החלק מהרווח שהחברה משאירה אצלה ומשקיעה מחדש, ושיעור החלוקה <bdi dir="ltr">(1 − b)</bdi> הוא החלק שמחולק כדיבידנד. E₁ הוא הרווח למניה בשנה הבאה, ו־<bdi dir="ltr">P₀/E₁</bdi> הוא מכפיל הרווח: שיעור החלוקה חלקי <bdi dir="ltr">(k − g)</bdi>.</p>
<p>המודל תקף רק כאשר <bdi dir="ltr">k &gt; g</bdi>. התשואה הנדרשת k מורכבת משני חלקים: תשואת הדיבידנד <bdi dir="ltr">(D₁/P₀)</bdi> ושיעור הצמיחה.</p>
<h4>הערך הנוכחי של הזדמנויות הצמיחה (PVGO)</h4>
<div class="fx" dir="ltr">P₀ = E₁/k + PVGO</div>
<p><bdi dir="ltr">E₁/k</bdi> הוא שווי המניה אילו החברה הייתה מחלקת את כל הרווח ולא צומחת. PVGO הוא התוספת למחיר שנובעת מהשקעות הצמיחה. למשל, <bdi dir="ltr">E₁ = 5</bdi>, <bdi dir="ltr">k = 10%</bdi> ומחיר 60: <bdi dir="ltr">PVGO = 60 − 5/0.10 = 10</bdi>. צמיחה יוצרת ערך רק כאשר <bdi dir="ltr">ROE &gt; k</bdi>. אם <bdi dir="ltr">ROE = k</bdi>, השקעה מחדש של הרווחים אינה משנה את מחיר המניה.</p>
<div class="ex"><b>דוגמה פתורה.</b> הדיבידנד ששולם זה עתה: <bdi dir="ltr">D₀ = 2</bdi> ₪. <bdi dir="ltr">g = 4%</bdi>, <bdi dir="ltr">k = 10%</bdi>.<br>
<bdi dir="ltr">D₁ = 2·1.04 = 2.08</bdi>. <bdi dir="ltr">P₀ = 2.08/(0.10 − 0.04) = 34.67</bdi> ₪.<br>
בדיקה בכיוון ההפוך: <bdi dir="ltr">k = 2.08/34.67 + 4% = 6% + 4% = 10%</bdi>.<br>
חברה עם ROE של 15% ושיעור חלוקה של 40%: שיעור העיכוב הוא <bdi dir="ltr">b = 1 − 0.4 = 0.6</bdi>, ולכן <bdi dir="ltr">g = 0.6·15% = 9%</bdi>. אם <bdi dir="ltr">k = 10%</bdi>, מכפיל הרווח: <bdi dir="ltr">0.4/(0.10 − 0.09) = 40</bdi>.</div>
<div class="plain"><b>במילים פשוטות:</b> המניה שווה את כל הדיבידנדים שהיא תחלק, בערכים של היום. ככל שהדיבידנדים צומחים מהר יותר, המכנה <bdi dir="ltr">(k − g)</bdi> קטן יותר והמחיר גבוה יותר.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להציב D₀ במקום D₁. אם הדיבידנד שולם זה עתה, צריך להכפיל אותו ב־<bdi dir="ltr">(1 + g)</bdi>.</li>
<li>לחשב את g לפי שיעור החלוקה. הנכון: ROE כפול שיעור <u>העיכוב</u>.</li>
</ul></div>`},

{id:'f8', area:'fin', title:'סיכון, תשואה ותורת התיקים', short:'תיקים',
lesson:`
<div class="fx" dir="ltr">E(R<sub>p</sub>) = Σ w<sub>i</sub>·E(R<sub>i</sub>)<br>σ²<sub>p</sub> = w₁²σ₁² + w₂²σ₂² + 2w₁w₂·ρ·σ₁σ₂<br>מינימום שונות: w₁ = (σ₂² − Cov) / (σ₁² + σ₂² − 2Cov)<br>שארפ: (E(R) − r<sub>f</sub>) / σ</div>
<p>הסימנים: <bdi dir="ltr">w<sub>i</sub></bdi> הוא המשקל של נכס i בתיק (החלק מהכסף שמושקע בו), <bdi dir="ltr">E(R<sub>i</sub>)</bdi> היא התשואה הצפויה שלו, σ היא סטיית התקן (הסיכון), ρ הוא מקדם המתאם בין שני הנכסים, ו־<bdi dir="ltr">Cov = ρ·σ₁σ₂</bdi> היא השונות המשותפת. <bdi dir="ltr">r<sub>f</sub></bdi> היא הריבית חסרת הסיכון. מדד שארפ מודד כמה תשואה עודפת מקבלים על כל יחידת סיכון.</p>
<h4>תועלת הפיזור</h4>
<ul>
<li><bdi dir="ltr">ρ = 1</bdi>: אין תועלת מפיזור. סטיית התקן של התיק היא הממוצע המשוקלל של סטיות התקן.</li>
<li><bdi dir="ltr">ρ &lt; 1</bdi>: סטיית התקן של התיק <b>נמוכה</b> מהממוצע המשוקלל. זו תועלת הפיזור.</li>
<li><bdi dir="ltr">ρ = −1</bdi>: אפשר לבנות תיק חסר סיכון. משקל הנכס הראשון בתיק כזה: <bdi dir="ltr">w₁ = σ₂/(σ₁ + σ₂)</bdi>.</li>
</ul>
<p>הפיזור מבטל רק את הסיכון ה<b>ספציפי</b> (הלא־שיטתי). הסיכון ה<b>שיטתי</b>, כלומר סיכון השוק, נשאר.</p>
<h4>החזית היעילה וקו שוק ההון (CML)</h4>
<p>תיק יעיל הוא תיק שאין תיק אחר שמניב תשואה צפויה גבוהה יותר באותה רמת סיכון. כשמוסיפים נכס חסר סיכון, כל התיקים היעילים נמצאים על קו ישר שיוצא מ־<bdi dir="ltr">r<sub>f</sub></bdi> ועובר דרך תיק השוק M:</p>
<div class="fx" dir="ltr">E(R<sub>p</sub>) = r<sub>f</sub> + [(E(R<sub>m</sub>) − r<sub>f</sub>) / σ<sub>m</sub>]·σ<sub>p</sub><br>שילוב חסר סיכון ומסוכן: σ<sub>p</sub> = w·σ<sub>A</sub></div>
<p>בקו הראשון, <bdi dir="ltr">E(R<sub>m</sub>)</bdi> ו־<bdi dir="ltr">σ<sub>m</sub></bdi> הם התשואה הצפויה והסיכון של תיק השוק, ו־<bdi dir="ltr">σ<sub>p</sub></bdi> הוא הסיכון של התיק שלנו. בקו השני, w הוא החלק שמושקע בנכס המסוכן A, ו־<bdi dir="ltr">σ<sub>A</sub></bdi> היא סטיית התקן שלו. הנכס חסר הסיכון לא תורם סיכון, ולכן סטיית התקן של התיק היא פשוט החלק המסוכן כפול סטיית התקן שלו.</p>
<h4>סוגי שאלות שחוזרים במבחן</h4>
<ul><li><b>תיק עם נכס חסר סיכון ויעד לסטיית התקן</b>: <bdi dir="ltr">σ<sub>p</sub> = w·σ<sub>A</sub></bdi>. אם סטיית התקן של התיק המנייתי היא 18% ורוצים להגיע ל־9%, משקיעים <bdi dir="ltr">9/18 = 50%</bdi> בתיק המנייתי, ו־50% בנכס חסר הסיכון. כך היה בשאלה 1 במבחן 09/2025.</li>
<li><b>תיק מינימום שונות</b>: המשקל של A לפי הנוסחה בדף הרשמי הוא <bdi dir="ltr">W<sub>A</sub>* = (σ<sub>B</sub>² − σ<sub>A</sub>σ<sub>B</sub>ρ)/(σ<sub>A</sub>² + σ<sub>B</sub>² − 2σ<sub>A</sub>σ<sub>B</sub>ρ)</bdi>. השאלה יכולה להופיע גם בכיוון ההפוך: נתונה סטיית התקן של תיק המינימום, ומבקשים את ρ (שאלה 20). במקרה כזה פותרים בניסוי וטעייה, על ידי הצבת התשובות.</li>
<li>המתאם שמביא לסיכון <b>המינימלי</b> הוא ‎−1 (שאלה 6).</li></ul>
<div class="ex"><b>דוגמה פתורה.</b> נכס A: תשואה צפויה 10% וסטיית תקן 20%. נכס B: תשואה צפויה 14% וסטיית תקן 30%. המתאם ביניהם: <bdi dir="ltr">ρ = 0.2</bdi>. משקיעים 60% ב־A ו־40% ב־B.<br>
התשואה הצפויה: <bdi dir="ltr">E = 0.6·10 + 0.4·14 = 11.6%</bdi>.<br>
השונות: <bdi dir="ltr">σ² = 0.36·0.04 + 0.16·0.09 + 2·0.6·0.4·0.2·0.2·0.3 = 0.0144 + 0.0144 + 0.00576 = 0.03456</bdi>, ולכן <bdi dir="ltr">σ = √0.03456 = 18.59%</bdi>.<br>
הממוצע המשוקלל של סטיות התקן הוא <bdi dir="ltr">0.6·20 + 0.4·30 = 24%</bdi>, כך שהפיזור הוריד את סטיית התקן בכ־5.4 נקודות אחוז.<br>
תיק מינימום שונות: <bdi dir="ltr">Cov = 0.2·0.2·0.3 = 0.012</bdi>, ולכן <bdi dir="ltr">w<sub>A</sub> = (0.09 − 0.012)/(0.04 + 0.09 − 0.024) = 0.078/0.106 = 73.6%</bdi>.<br>
מדד שארפ של התיק 60/40, אם <bdi dir="ltr">r<sub>f</sub> = 3%</bdi>: <bdi dir="ltr">(11.6 − 3)/18.59 = 0.46</bdi>.</div>
<div class="plain"><b>במילים פשוטות:</b> לא שמים את כל הביצים בסל אחד. כשנכס אחד יורד והשני לא בהכרח יורד איתו, התיק כולו תנודתי פחות.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחשב ממוצע משוקלל של סטיות התקן כשהמתאם קטן מ־1.</li>
<li>לשכוח את המקדם 2 באיבר של השונות המשותפת.</li>
<li>לחשוב שפיזור מבטל את כל הסיכון.</li>
</ul></div>`},

lesson:`
<p>לפי מודל CAPM, השוק מתגמל רק על סיכון שיטתי, והסיכון הזה נמדד בבטא.</p>
<div class="fx" dir="ltr">E(R<sub>i</sub>) = r<sub>f</sub> + β<sub>i</sub>·[E(R<sub>m</sub>) − r<sub>f</sub>]<br>β<sub>i</sub> = Cov(R<sub>i</sub>,R<sub>m</sub>) / σ²<sub>m</sub> = ρ<sub>im</sub>·σ<sub>i</sub>/σ<sub>m</sub><br>β<sub>p</sub> = Σ w<sub>i</sub>·β<sub>i</sub><br>σ²<sub>i</sub> = β²σ²<sub>m</sub> + σ²<sub>e</sub></div>
<p>הסימנים: <bdi dir="ltr">E(R<sub>i</sub>)</bdi> היא התשואה שמגיעה לנכס i לפי המודל. <bdi dir="ltr">r<sub>f</sub></bdi> היא הריבית חסרת הסיכון, ו־<bdi dir="ltr">E(R<sub>m</sub>)</bdi> היא התשואה הצפויה של השוק. ההפרש <bdi dir="ltr">E(R<sub>m</sub>) − r<sub>f</sub></bdi> נקרא פרמיית הסיכון של השוק. <bdi dir="ltr">β<sub>p</sub></bdi> היא הבטא של תיק: ממוצע משוקלל של הבטות של הנכסים בו. בשורה האחרונה, הסיכון הכולל של מניה <bdi dir="ltr">(σ²<sub>i</sub>)</bdi> מתחלק לסיכון שיטתי <bdi dir="ltr">(β²σ²<sub>m</sub>)</bdi> ולסיכון ספציפי <bdi dir="ltr">(σ²<sub>e</sub>)</bdi>. למשל, מניה עם <bdi dir="ltr">β = 1.2</bdi> וסטיית תקן 30%, כשסטיית התקן של השוק 20%: הסיכון השיטתי <bdi dir="ltr">1.44·0.04 = 0.0576</bdi> מתוך שונות כוללת של 0.09, והספציפי <bdi dir="ltr">0.09 − 0.0576 = 0.0324</bdi>.</p>
<p>הבטא של תיק השוק היא 1, והבטא של נכס חסר סיכון היא 0. הקו שמתאר את התשואה הצפויה כפונקציה של β נקרא <b>קו שוק ניירות הערך (SML)</b>. קו שוק ההון (CML) משתמש ב־σ ומתאים רק לתיקים יעילים, ואילו ה־SML מתאים לכל נכס.</p>
<h4>CML מול SML: מה נכון ומה לא</h4>
<ul>
<li>כל תיק על ה־CML הוא שילוב של תיק השוק M ושל הנכס חסר הסיכון. תיק שנמצא בין <bdi dir="ltr">r<sub>f</sub></bdi> ל־M הוא תיק <b>מלווה</b>: חלק מהכסף מושקע בנכס חסר הסיכון. תיק שנמצא מעבר ל־M הוא תיק <b>לווה</b>, כלומר ממונף.</li>
<li>ה־CML מתמחר רק <b>תיקים יעילים</b>. נכס בודד מתומחר לפי ה־SML.</li>
<li>תיק שאין בו סיכון ספציפי הוא תיק יעיל, ולכן הוא נמצא גם על ה־CML וגם על ה־SML. סטיית התקן שלו: <bdi dir="ltr">β·σ<sub>m</sub></bdi>.</li>
<li>תיק עם <bdi dir="ltr">β = 1</bdi> יכול להימצא על ה־CML: זהו תיק השוק עצמו.</li>
<li>הטענה "הבטא של כל תיק יעיל היא 1" שגויה. לתיק יעיל יכולה להיות כל בטא. למשל, תיק שחציו מושקע בתיק השוק וחציו בנכס חסר סיכון: <bdi dir="ltr">β = 0.5</bdi>.</li>
<li>שינוי המחיר לפי הבטא (כאשר <bdi dir="ltr">r<sub>f</sub> = 0</bdi>): תשואת המניה שווה לבטא כפול תשואת השוק. השוק ירד ב־2% ו־<bdi dir="ltr">β = 1.6</bdi>, ולכן המניה צפויה לרדת ב־3.2% <bdi dir="ltr">(1.6·(−2%) = −3.2%)</bdi>.</li>
</ul>
<h4>אלפא ותמחור</h4>
<p>אם התשואה הצפויה של מניה גבוהה מזו שנותן מודל CAPM, המניה נמצאת מעל ה־SML: היא <b>זולה</b> (אלפא חיובית), וכדאי לקנות אותה.</p>
<h4>מדדי ביצוע</h4>
<div class="fx" dir="ltr">שארפ: (R<sub>p</sub> − r<sub>f</sub>) / σ<sub>p</sub><br>טריינור: (R<sub>p</sub> − r<sub>f</sub>) / β<sub>p</sub><br>אלפא של ג׳נסן: α = R<sub>p</sub> − [r<sub>f</sub> + β<sub>p</sub>(R<sub>m</sub> − r<sub>f</sub>)]</div>
<p><bdi dir="ltr">R<sub>p</sub></bdi> היא התשואה שהתיק השיג בפועל. שני המדדים הראשונים מודדים תשואה עודפת ליחידת סיכון. מדד שארפ מתאים כשהתיק הוא כל ההשקעה של המשקיע, ולכן הוא מתייחס לסיכון הכולל (σ). מדד טריינור מתאים כשהתיק הוא חלק מתיק מפוזר, ולכן הוא מתייחס לסיכון השיטתי בלבד (β). האלפא של ג׳נסן היא התשואה שהתיק השיג מעבר למה שמגיע לו לפי CAPM.</p>
<div class="ex"><b>דוגמה פתורה.</b> <bdi dir="ltr">r<sub>f</sub> = 3%</bdi>, תשואת השוק 9%, <bdi dir="ltr">β = 1.2</bdi>.<br>
התשואה הנדרשת: <bdi dir="ltr">E(R) = 3 + 1.2·(9 − 3) = 3 + 7.2 = 10.2%</bdi>.<br>
אנליסט צופה תשואה של 12%. לכן <bdi dir="ltr">α = 12 − 10.2 = 1.8%</bdi>, והמניה זולה.<br>

<li>לבלבל בין CML, שמבוסס על σ, לבין SML, שמבוסס על β.</li>
</ul></div>`}

   '512 הוא <bdi dir="ltr">8³</bdi>, כלומר בחירה עם חזרות וכשהסדר חשוב. כאן אי אפשר לבחור אותה מניה פעמיים, והסדר לא חשוב.']},
{q:'ההסתברות שהשוק יהיה במצב רע היא 30%. במצב רע קרן מפסידה בהסתברות 0.8, ובמצב טוב בהסתברות 0.2. ידוע שהקרן הפסידה. מה ההסתברות שהשוק היה במצב רע?', o:['כ־63%','כ־24%','כ־38%','80%'],
 e:SOL({ask:'הסתברות "הפוכה": יודעים שהקרן הפסידה, ושואלים מה הסיכוי שהסיבה הייתה מצב שוק רע. בנוסחה R מסמן מצב שוק רע, ו־L מסמן הפסד.',
   f:'<bdi dir="ltr">P(R|L) = P(R)·P(L|R) / P(L)</bdi>',
   why:'זו נוסחת בייס. מתוך כל המקרים שבהם הקרן הפסידה (המכנה), בודקים איזה חלק הגיע ממצב רע (המונה).',
   steps:['הפסד במצב רע: <bdi dir="ltr">0.3·0.8 = 0.24</bdi>', 'הפסד במצב טוב: <bdi dir="ltr">0.7·0.2 = 0.14</bdi>', 'ההסתברות הכוללת להפסד: <bdi dir="ltr">0.24 + 0.14 = 0.38</bdi>', 'בייס: <bdi dir="ltr">0.24/0.38 ≈ 0.632</bdi>'],
   res:'ההסתברות שהשוק היה במצב רע היא כ־63%.',
   tip:'בבייס המכנה הוא ההסתברות הכוללת של מה שידוע (ההפסד), מכל המצבים יחד.'}),
 w:[null,
   '24% היא ההסתברות ששני הדברים יקרו יחד (מצב רע וגם הפסד). ידוע שהיה הפסד, ולכן צריך לחלק בהסתברות להפסד: <bdi dir="ltr">0.24/0.38</bdi>.',
   '38% היא ההסתברות הכוללת להפסד. זה המכנה בנוסחת בייס, ולא התשובה.',
   '80% היא <bdi dir="ltr">P(L|R)</bdi>, הסיכוי להפסיד בהינתן מצב רע. שואלים על הכיוון ההפוך, <bdi dir="ltr">P(R|L)</bdi>, ולשם כך צריך את בייס.']},
{q:'מטילים שתי קוביות הוגנות. מה ההסתברות שסכומן 7?', o:['1/6','1/12','7/36','1/36'],
 e:SOL({ask:'כמה מתוך כל התוצאות האפשריות של שתי קוביות נותנות סכום 7.',
   f:'ההסתברות היא מספר התוצאות הרצויות חלקי מספר כל התוצאות.',
   why:'כל זוג סדור (קובייה ראשונה, קובייה שנייה) שווה הסתברות, ולכן מספיק לספור.',
   steps:['כל התוצאות: <bdi dir="ltr">6·6 = 36</bdi>', 'סכום 7: <bdi dir="ltr">(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)</bdi>, כלומר 6 תוצאות', 'ההסתברות: <bdi dir="ltr">6/36 = 1/6</bdi>'],
   res:'ההסתברות היא 1/6.',
   tip:'(3,4) ו־(4,3) הן שתי תוצאות שונות. סופרים זוגות סדורים.'}),
 w:[null,
   '1/12 הוא <bdi dir="ltr">3/36</bdi>: סופרים את (3,4) ו־(4,3) כתוצאה אחת, אבל מחלקים ב־36 זוגות סדורים. צריך לספור את שני הסדרים: 6 תוצאות.',
   '7/36 מתקבל אם סופרים 7 תוצאות טובות, כנראה כי הסכום הוא 7. בפועל יש רק 6 זוגות שסכומם 7.',
   '1/36 היא ההסתברות לתוצאה אחת מסוימת, למשל <bdi dir="ltr">(3,4)</bdi>. יש 6 תוצאות שנותנות 7.']}
],
s3:[
{q:'נתון: E(X) = 4, V(X) = 9. מגדירים Y = 3 − 2X. מהן התוחלת והשונות של Y?', o:['E(Y) = −5, V(Y) = 36','E(Y) = −5, V(Y) = −18','E(Y) = 11, V(Y) = 36','E(Y) = −5, V(Y) = 18'],
 e:SOL({ask:'התוחלת והשונות של טרנספורמציה לינארית <bdi dir="ltr">Y = a + bX</bdi>, עם <bdi dir="ltr">a = 3</bdi> ו־<bdi dir="ltr">b = −2</bdi>.',
   f:'<bdi dir="ltr">E(a + bX) = a + b·E(X)</bdi> וגם <bdi dir="ltr">V(a + bX) = b²·V(X)</bdi>',
   why:'התוחלת זזה בדיוק כמו כל תצפית. השונות מודדת מרחקים בריבוע: הקבוע a לא משנה מרחקים, והכפלה ב־b מכפילה כל מרחק ב־b, ולכן את הריבוע ב־b².',
   steps:['תוחלת: <bdi dir="ltr">E(Y) = 3 − 2·4 = −5</bdi>', 'שונות: <bdi dir="ltr">V(Y) = (−2)²·9 = 4·9 = 36</bdi>'],
   res:'<bdi dir="ltr">E(Y) = −5</bdi>, <bdi dir="ltr">V(Y) = 36</bdi>.',
   tip:'בשונות b עולה בריבוע, ולכן הסימן שלו נעלם. שונות לעולם אינה שלילית.'}),
 w:[null,
   'השונות ‎−18 מתקבלת מכפל ב־b במקום ב־b²: <bdi dir="ltr">−2·9</bdi>. שונות לא יכולה להיות שלילית. צריך <bdi dir="ltr">(−2)²·9 = 36</bdi>.',
   'התוחלת 11 מתקבלת מ־<bdi dir="ltr">3 + 2·4</bdi>, כלומר בלי הסימן של b. הנוסחה היא <bdi dir="ltr">3 − 2·4 = −5</bdi>.',
   'השונות 18 מתקבלת מכפל ב־<bdi dir="ltr">|b| = 2</bdi> במקום ב־<bdi dir="ltr">b² = 4</bdi>. הכפל ב־|b| מתאים לסטיית התקן, לא לשונות.']},
{q:'נתון: V(X) = 4, V(Y) = 9, Cov(X,Y) = −3. מהי השונות של X + Y?', o:['7','13','19','10'],
 e:SOL({ask:'השונות של סכום של שני משתנים שקשורים זה לזה (יש ביניהם שונות משותפת).',
   f:'<bdi dir="ltr">V(X+Y) = V(X) + V(Y) + 2·Cov(X,Y)</bdi>',
   why:'הפיזור של סכום תלוי לא רק בפיזור של כל משתנה, אלא גם בשאלה אם הם "זזים יחד". Cov שלילי אומר שכשאחד עולה השני נוטה לרדת, ולכן הם מקזזים זה את זה.',
   steps:['מציבים: <bdi dir="ltr">V(X+Y) = 4 + 9 + 2·(−3)</bdi>', 'מחשבים: <bdi dir="ltr">13 − 6 = 7</bdi>'],
   res:'השונות של X + Y היא 7.',
   tip:'השונות המשותפת נכנסת פעמיים (2·Cov), ועם הסימן שלה.'}),
 w:[null,
   '13 הוא 4 + 9 בלבד, בלי השונות המשותפת. זה נכון רק כשהמשתנים בלתי תלויים (Cov = 0).',
   '19 מתקבל אם מוסיפים 2·3 במקום להחסיר. ה־Cov כאן שלילי, ולכן מחסירים.',
   '10 מתקבל אם מכפילים את Cov פעם אחת בלבד (4 + 9 − 3). בנוסחה הוא מופיע פעמיים: 2·Cov.']},
{q:'המשתנה X מתפלג בינומית עם n = 10 ו־p = 0.3. מהן התוחלת והשונות של X?', o:['3 ו־2.1','3 ו־0.21','7 ו־2.1','3 ו־3'],
 e:SOL({ask:'התוחלת והשונות של מספר ההצלחות ב־10 ניסויים בלתי תלויים, עם סיכוי הצלחה 0.3 בכל ניסוי.',
   f:'<bdi dir="ltr">E(X) = n·p</bdi> וגם <bdi dir="ltr">V(X) = n·p·(1 − p)</bdi>',
   why:'בכל ניסוי מצפים ל־p הצלחות, ולכן ב־n ניסויים ל־n·p. השונות של ניסוי בודד היא <bdi dir="ltr">p(1 − p)</bdi>, ובגלל אי־התלות השונויות מצטברות.',
   steps:['תוחלת: <bdi dir="ltr">10·0.3 = 3</bdi>', 'שונות: <bdi dir="ltr">10·0.3·0.7 = 2.1</bdi>'],
   res:'התוחלת 3 והשונות 2.1.',
   tip:'בבינומית השונות תמיד קטנה מהתוחלת, כי כופלים בגורם <bdi dir="ltr">1 − p</bdi>, שקטן מ־1.'}),
 w:[null,
   '0.21 הוא <bdi dir="ltr">0.3·0.7</bdi>, השונות של ניסוי בודד. שכחו לכפול במספר הניסויים: <bdi dir="ltr">10·0.21 = 2.1</bdi>.',
   '7 הוא <bdi dir="ltr">10·0.7</bdi>, התוחלת של מספר הכישלונות. התוחלת של מספר ההצלחות היא <bdi dir="ltr">10·0.3 = 3</bdi>.',
   'שונות ששווה לתוחלת מאפיינת התפלגות פואסון, לא בינומית. בבינומית כופלים עוד ב־<bdi dir="ltr">1 − p = 0.7</bdi>: <bdi dir="ltr">3·0.7 = 2.1</bdi>.']},
{q:'מקדם המתאם בין X ל־Y הוא 0. מה ניתן להסיק?', o:['אין ביניהם קשר לינארי','הם בהכרח בלתי תלויים','V(X+Y) = 0','אחד מהם קבוע'],
 e:SOL({ask:'מה בדיוק אומר מקדם מתאם 0, ומה הוא לא אומר.',
   why:'מקדם המתאם מודד רק את החוזק של קשר בצורת קו ישר. משתנים יכולים להיות תלויים חזק בקשר עקום, ועדיין לקבל מתאם 0.',
   steps:['מתאם 0 פירושו <bdi dir="ltr">Cov(X,Y) = 0</bdi>: אין מגמה לינארית.', 'דוגמה: אם <bdi dir="ltr">Y = X²</bdi> ו־X סימטרי סביב 0, המתאם 0, אבל Y נקבע לגמרי לפי X.'],
   res:'אפשר להסיק רק שאין ביניהם קשר לינארי.',
   tip:'אי־תלות גוררת מתאם 0, אבל מתאם 0 לא גורר אי־תלות.'}),
 w:[null,
   'אי־תלות גוררת מתאם 0, אבל לא להפך. ייתכן קשר לא לינארי חזק (למשל <bdi dir="ltr">Y = X²</bdi>) עם מתאם 0.',
   'מתאם 0 פירושו שהשונות המשותפת 0, ולכן <bdi dir="ltr">V(X+Y) = V(X) + V(Y)</bdi>. זה לא 0, אלא סכום השונויות.',
   'משתנה קבוע אכן נותן Cov של 0, אבל אי אפשר להסיק את זה ממתאם 0. רוב המקרים של מתאם 0 הם שני משתנים אמיתיים בלי קשר לינארי.']},
{q:'נתון: E(X) = 4, E(X²) = 20. מהי סטיית התקן של X?', o:['2','4','16','√20'],
 e:SOL({ask:'סטיית התקן של X, כשנתונים התוחלת ותוחלת הריבוע.',
   f:'<bdi dir="ltr">V(X) = E(X²) − [E(X)]²</bdi> וגם <bdi dir="ltr">σ = √V(X)</bdi>',
   why:'זו הנוסחה המקוצרת לשונות: ממוצע הריבועים פחות ריבוע הממוצע. אחרי שיש שונות, סטיית התקן היא השורש שלה.',
   steps:['ריבוע התוחלת: <bdi dir="ltr">4² = 16</bdi>', 'שונות: <bdi dir="ltr">20 − 16 = 4</bdi>', 'סטיית תקן: <bdi dir="ltr">√4 = 2</bdi>'],
   res:'סטיית התקן של X היא 2.',
   tip:'אל תשכחו את הצעד האחרון: שואלים על סטיית התקן, ולכן מוציאים שורש מהשונות.'}),
 w:[null,
   '4 היא השונות. סטיית התקן היא השורש שלה: <bdi dir="ltr">√4 = 2</bdi>.',
   '16 הוא <bdi dir="ltr">[E(X)]²</bdi>, האיבר שמחסירים. השונות היא <bdi dir="ltr">20 − 16 = 4</bdi>, וסטיית התקן 2.',
   '√20 מתקבל אם מוציאים שורש מ־<bdi dir="ltr">E(X²)</bdi> בלי להחסיר את ריבוע התוחלת. צריך <bdi dir="ltr">√(20 − 16) = 2</bdi>.']},
{q:'מטילים מטבע הוגן 4 פעמים. מה ההסתברות לקבל בדיוק 2 פעמים "עץ"?', o:['0.375','0.25','0.5','0.0625'],
 e:SOL({ask:'הסתברות למספר מסוים של הצלחות בסדרת ניסויים בלתי תלויים: התפלגות בינומית.',
   f:'<bdi dir="ltr">P(X = k) = C(n,k)·p<sup>k</sup>·(1 − p)<sup>n−k</sup></bdi>',
   why:'כל סדרה מסוימת עם 2 "עץ" ו־2 "פלי" מקבלת הסתברות <bdi dir="ltr">0.5⁴</bdi>. צריך לכפול במספר הסדרות האפשריות, כלומר במספר הדרכים לבחור באילו 2 הטלות יצא "עץ".',
   steps:['סדרה מסוימת: <bdi dir="ltr">0.5²·0.5² = 1/16 = 0.0625</bdi>', 'מספר הסדרות: <bdi dir="ltr">C(4,2) = 6</bdi>', 'יחד: <bdi dir="ltr">6·0.0625 = 0.375</bdi>'],
   res:'ההסתברות היא 0.375.',
   tip:'בבינומית לא לשכוח את המקדם <bdi dir="ltr">C(n,k)</bdi>: הוא סופר את כל הסדרים.'}),
 w:[null,
   '0.25 הוא <bdi dir="ltr">0.5²</bdi>, ההסתברות לשני "עץ" בשתי הטלות בלבד. יש 4 הטלות, ושתי האחרות צריכות לצאת "פלי", ויש 6 סדרים אפשריים.',
   '0.5 מתקבל מהאינטואיציה ש־2 עץ (חצי מההטלות) הוא "הצפוי". 2 אכן התוחלת, אבל ההסתברות לקבל בדיוק 2 היא רק <bdi dir="ltr">6/16 = 0.375</bdi>.',
   '0.0625 היא ההסתברות לסדרה אחת מסוימת (למשל עץ, עץ, פלי, פלי). שכחו לכפול ב־<bdi dir="ltr">C(4,2) = 6</bdi> הסדרים.']}
],
s4:[
{q:'X מתפלג נורמלית. איזה אחוז מהתצפיות נמצא, בקירוב, במרחק של עד שתי סטיות תקן מהממוצע?', o:['95%','68%','99.7%','90%'],
 e:SOL({ask:'כמה מהשטח מתחת לעקומה הנורמלית נמצא בין <bdi dir="ltr">μ − 2σ</bdi> ל־<bdi dir="ltr">μ + 2σ</bdi>.',
   f:'<bdi dir="ltr">P(|Z| ≤ 2) = 2·Φ(2) − 1</bdi>',
   why:'בהתפלגות נורמלית האחוזים תלויים רק במספר סטיות התקן מהממוצע. כלל 68-95-99.7 מסכם את שלושת המרחקים השכיחים: 1, 2 ו־3 סטיות תקן.',
   steps:['מהטבלה: <bdi dir="ltr">Φ(2) = 0.9772</bdi>', '<bdi dir="ltr">2·0.9772 − 1 = 0.9544</bdi>, כלומר כ־95%'],
   res:'כ־95% מהתצפיות.',
   tip:'בדיוק 95% מתקבל ב־1.96 סטיות תקן. זה הערך שמשמש ברווח סמך של 95%.'}),
 w:[null,
   '68% הוא האחוז בטווח של סטיית תקן <u>אחת</u> מהממוצע. בשתי סטיות תקן הטווח רחב יותר: כ־95%.',
   '99.7% הוא האחוז בטווח של <u>שלוש</u> סטיות תקן. בשתיים: כ־95%.',
   '90% מתקבל בטווח של כ־1.645 סטיות תקן בכל צד. בשתי סטיות תקן האחוז גבוה יותר: כ־95%.']},
{q:'נתון X ~ N(100, 15²). מה ההסתברות ש־X יהיה גדול מ־130?', o:['0.0228','0.9772','0.0456','0.1587'],
 e:SOL({ask:'השטח בזנב הימני של התפלגות נורמלית, מעל 130.',
   f:'<bdi dir="ltr">Z = (X − μ)/σ</bdi> וגם <bdi dir="ltr">P(X > x) = 1 − Φ(z)</bdi>',
   why:'כדי להשתמש בטבלה מתרגמים את 130 לציון תקן: כמה סטיות תקן הוא מעל הממוצע. הטבלה נותנת את השטח <u>משמאל</u>, ולכן לזנב הימני מחסירים מ־1.',
   steps:['ציון תקן: <bdi dir="ltr">Z = (130 − 100)/15 = 2</bdi>', 'מהטבלה: <bdi dir="ltr">Φ(2) = 0.9772</bdi>', 'הזנב הימני: <bdi dir="ltr">1 − 0.9772 = 0.0228</bdi>'],
   res:'ההסתברות היא 0.0228.',
   tip:'"גדול מ־" = <bdi dir="ltr">1 − Φ</bdi>. בנתון <bdi dir="ltr">N(100, 15²)</bdi> המספר השני הוא השונות, וסטיית התקן היא 15.'}),
 w:[null,
   '0.9772 הוא <bdi dir="ltr">Φ(2)</bdi>, ההסתברות להיות <u>מתחת</u> ל־130. שואלים על "גדול מ־", ולכן <bdi dir="ltr">1 − 0.9772 = 0.0228</bdi>.',
   '0.0456 הוא שטח שני הזנבות יחד (<bdi dir="ltr">2·0.0228</bdi>), כלומר מעל 130 <u>או</u> מתחת ל־70. שואלים רק על הזנב העליון.',
   '0.1587 הוא <bdi dir="ltr">1 − Φ(1)</bdi>, כלומר זנב מעל סטיית תקן אחת. 130 נמצא <bdi dir="ltr">30/15 = 2</bdi> סטיות תקן מעל הממוצע, ולא אחת.']},
{q:'איזו טענה נכונה לגבי ההתפלגות הנורמלית?', o:['הממוצע, החציון והשכיח שווים','הממוצע גדול מהחציון','השונות שווה לממוצע','היא מוגדרת רק לערכים חיוביים'],
 e:SOL({ask:'איזו תכונה מתקיימת תמיד בהתפלגות נורמלית.',
   why:'העקומה הנורמלית היא פעמון סימטרי סביב μ. השיא שלה (השכיח) נמצא ב־μ, חצי מהשטח משני צדי μ (החציון), ובגלל הסימטריה גם הממוצע הוא μ.',
   steps:['ההתפלגות סימטרית סביב μ, ולכן החציון שווה ל־μ.', 'השיא של הפעמון נמצא ב־μ, ולכן גם השכיח שווה ל־μ.', 'הממוצע של התפלגות סימטרית הוא מרכז הסימטריה, μ.'],
   res:'בהתפלגות נורמלית הממוצע, החציון והשכיח שווים.',
   tip:'ממוצע ≠ חציון הוא סימן לאסימטריה, ולכן לא יכול לקרות בהתפלגות נורמלית.'}),
 w:[null,
   'ממוצע גדול מהחציון מאפיין התפלגות אסימטרית ימנית. ההתפלגות הנורמלית סימטרית, ושניהם שווים.',
   'שונות ששווה לממוצע מאפיינת התפלגות פואסון. בנורמלית μ ו־σ² הם שני פרמטרים נפרדים, ואין קשר ביניהם.',
   'ההתפלגות הנורמלית מוגדרת על כל הישר, מ־<bdi dir="ltr">−∞</bdi> עד <bdi dir="ltr">+∞</bdi>. לכן תשואה נורמלית יכולה להיות גם שלילית.']},
{q:'תשואת תיק מתפלגת נורמלית עם ממוצע 10% וסטיית תקן 20%. מהי התשואה שההסתברות לקבל תשואה נמוכה ממנה היא 5% (VaR ברמה של 5%)?', o:['−22.9%','−29.2%','−30.0%','−13.0%'],
 e:SOL({ask:'הערך שמתחתיו נמצאים רק 5% מהתשואות, כלומר האחוזון ה־5 של ההתפלגות.',
   f:'<bdi dir="ltr">x = μ + z·σ , z<sub>0.05</sub> = −1.645</bdi>',
   why:'מוצאים בטבלה את ציון התקן שמשאיר 5% משמאלו, ואז מתרגמים אותו בחזרה ליחידות של תשואה: יורדים z סטיות תקן מהממוצע.',
   steps:['מהטבלה: <bdi dir="ltr">Φ(1.645) = 0.95</bdi>, ולכן <bdi dir="ltr">z = −1.645</bdi> משאיר 5% משמאלו', 'מציבים: <bdi dir="ltr">x = 10% − 1.645·20%</bdi>', 'מחשבים: <bdi dir="ltr">10% − 32.9% = −22.9%</bdi>'],
   res:'התשואה היא ‎−22.9%.',
   tip:'זנב אחד של 5%: 1.645. שני זנבות של 2.5% כל אחד: 1.96.'}),
 w:[null,
   '‎−29.2% מתקבל עם <bdi dir="ltr">z = 1.96</bdi>: <bdi dir="ltr">10 − 1.96·20 = −29.2</bdi>. הערך 1.96 משאיר 2.5% בזנב, וכאן מבקשים 5% בזנב אחד, כלומר 1.645.',
   '‎−30.0% מתקבל עם <bdi dir="ltr">z = 2</bdi>: <bdi dir="ltr">10 − 2·20 = −30</bdi>. זה כלל האצבע של "שתי סטיות תקן", שמתאים לכ־2.3% בזנב ולא ל־5%.',
   '‎−13.0% מתקבל עם <bdi dir="ltr">z ≈ 1.15</bdi>: <bdi dir="ltr">10 − 1.15·20 = −13</bdi>. ערך כזה משאיר כ־12.5% בזנב. ל־5% בזנב צריך <bdi dir="ltr">z = 1.645</bdi>.']},
{q:'בהתפלגות עם ממוצע 100 וסטיית תקן 10, מהו ציון התקן של התצפית 85?', o:['−1.5','1.5','−0.15','−15'],
 e:SOL({ask:'כמה סטיות תקן התצפית 85 רחוקה מהממוצע, ובאיזה כיוון.',
   f:'<bdi dir="ltr">Z = (x − μ)/σ</bdi>',
   why:'ציון התקן מודד את המרחק מהממוצע ביחידות של סטיית תקן. הסימן אומר אם התצפית מעל הממוצע (+) או מתחתיו (−).',
   steps:['המרחק מהממוצע: <bdi dir="ltr">85 − 100 = −15</bdi>', 'מחלקים בסטיית התקן: <bdi dir="ltr">−15/10 = −1.5</bdi>'],
   res:'ציון התקן הוא ‎−1.5.',
   tip:'תצפית מתחת לממוצע תמיד מקבלת ציון תקן שלילי.'}),
 w:[null,
   '1.5 הוא הגודל הנכון אבל עם סימן הפוך. 85 נמצא <u>מתחת</u> לממוצע, ולכן ציון התקן שלילי: ‎−1.5.',
   '‎−0.15 מתקבל מחלוקה בשונות (<bdi dir="ltr">10² = 100</bdi>) במקום בסטיית התקן: <bdi dir="ltr">−15/100</bdi>. מחלקים ב־<bdi dir="ltr">σ = 10</bdi>.',
   '‎−15 הוא רק ההפרש <bdi dir="ltr">85 − 100</bdi>, בלי לחלק בסטיית התקן. ציון תקן נמדד ביחידות של σ: <bdi dir="ltr">−15/10 = −1.5</bdi>.']}
],
s5:[
{q:'כדי להקטין פי 2 את רוחב רווח הסמך, באותה רמת ביטחון, יש להגדיל את גודל המדגם פי:', o:['4','2','√2','8'],
 e:SOL({ask:'פי כמה צריך להגדיל את n כדי שרוחב רווח הסמך יקטן פי 2.',
   f:'<bdi dir="ltr">2E = 2·z·σ/√n</bdi>',
   why:'n נמצא בנוסחה מתחת לשורש. כדי לחלק את הרוחב ב־2 צריך ש־√n יגדל פי 2, ולכן n עצמו צריך לגדול פי <bdi dir="ltr">2² = 4</bdi>.',
   steps:['הרוחב (2E) תלוי ב־n רק דרך המכנה √n. מסמנים ב־n<sub>2</sub> את גודל המדגם החדש.', 'כדי שהרוחב יקטן פי 2, המכנה צריך לגדול פי 2: <bdi dir="ltr">√n<sub>2</sub> = 2·√n</bdi>', 'מעלים בריבוע: <bdi dir="ltr">n<sub>2</sub> = 4·n</bdi>'],
   res:'יש להגדיל את המדגם פי 4.',
   tip:'כדי להקטין את הרוחב פי k, מגדילים את המדגם פי k².'}),
 w:[null,
   '2 מתאים אם הרוחב היה פרופורציוני ל־<bdi dir="ltr">1/n</bdi>. הוא פרופורציוני ל־<bdi dir="ltr">1/√n</bdi>, ולכן הכפלת n פי 2 מקטינה את הרוחב רק פי <bdi dir="ltr">√2 ≈ 1.41</bdi>.',
   '√2 מתקבל אם מוציאים שורש מ־2 במקום להעלות בריבוע. הגדלת n פי √2 מקטינה את הרוחב רק פי <bdi dir="ltr">2<sup>1/4</sup> ≈ 1.19</bdi>. כדי לחלק את הרוחב ב־2 צריך <bdi dir="ltr">2² = 4</bdi>.',
   '8 מקטין את הרוחב פי <bdi dir="ltr">√8 ≈ 2.83</bdi>, יותר מהנדרש. מספיק פי 4.']},
{q:'נתון: σ = 20, n = 400. מהי טעות התקן של ממוצע המדגם?', o:['1','0.05','20','0.5'],
 e:SOL({ask:'סטיית התקן של ממוצע המדגם, כלומר עד כמה הממוצע משתנה ממדגם למדגם.',
   f:'<bdi dir="ltr">SE = σ/√n</bdi>',
   why:'ממוצע של הרבה תצפיות יציב יותר מתצפית בודדת. הפיזור שלו קטן פי √n מהפיזור של האוכלוסייה.',
   steps:['<bdi dir="ltr">√400 = 20</bdi>', '<bdi dir="ltr">SE = 20/20 = 1</bdi>'],
   res:'טעות התקן היא 1.',
   tip:'מחלקים בשורש של n, לא ב־n עצמו.'}),
 w:[null,
   '0.05 הוא <bdi dir="ltr">20/400</bdi>, חלוקה ב־n במקום ב־√n. צריך <bdi dir="ltr">20/√400 = 20/20 = 1</bdi>.',
   '20 הוא σ, סטיית התקן של תצפית בודדת. הממוצע של 400 תצפיות מפוזר הרבה פחות: מחלקים ב־<bdi dir="ltr">√400 = 20</bdi>.',
   '0.5 מתקבל אם מחלקים ב־40 במקום ב־20, למשל כשמכפילים את √n ב־2 בטעות. טעות התקן היא <bdi dir="ltr">σ/√n = 20/20 = 1</bdi>.']},
{q:'מעלים את רמת הביטחון מ־95% ל־99%, על סמך אותו מדגם. מה קורה לרווח הסמך?', o:['הוא מתרחב','הוא מצטמצם','הוא לא משתנה','מרכזו משתנה'],
 e:SOL({ask:'איך רמת הביטחון משפיעה על רוחב רווח הסמך.',
   f:'<bdi dir="ltr">x̄ ± z·σ/√n</bdi>',
   why:'כדי להיות בטוחים יותר שהרווח תופס את μ, צריך "רשת" רחבה יותר. ברמת ביטחון גבוהה יותר הערך הקריטי z גדל, ואיתו הרוחב.',
   steps:['ב־95%: <bdi dir="ltr">z = 1.96</bdi>. ב־99%: <bdi dir="ltr">z = 2.576</bdi>.', 'σ ו־n לא השתנו, ולכן הרוחב גדל פי <bdi dir="ltr">2.576/1.96 ≈ 1.31</bdi>.', 'המרכז, <bdi dir="ltr">x̄</bdi>, נשאר אותו דבר.'],
   res:'רווח הסמך מתרחב.',
   tip:'יותר ביטחון = רווח רחב יותר. כדי לצמצם רווח בלי לוותר על ביטחון צריך להגדיל את n.'}),
 w:[null,
   'הרווח מצטמצם כשמורידים את רמת הביטחון, לא כשמעלים אותה. ב־99% הערך הקריטי גדל מ־1.96 ל־2.576.',
   'הרוחב תלוי ב־z, ו־z משתנה עם רמת הביטחון (מ־1.96 ל־2.576). לכן הרווח משתנה.',
   'מרכז הרווח הוא ממוצע המדגם, והמדגם לא השתנה. רק הרוחב משתנה.']},
{q:'מה אומר משפט הגבול המרכזי?', o:['במדגמים גדולים, התפלגות ממוצע המדגם קרובה לנורמלית, בלי קשר להתפלגות האוכלוסייה','במדגמים גדולים האוכלוסייה הופכת לנורמלית','ממוצע המדגם תמיד שווה לממוצע האוכלוסייה','שונות המדגם שווה לשונות האוכלוסייה'],
 e:SOL({ask:'על מה משפט הגבול המרכזי מדבר, ומה הוא קובע.',
   f:'<bdi dir="ltr">X̄ ≈ N(μ, σ²/n)</bdi>',
   why:'כשממצעים הרבה תצפיות, הערכים הקיצוניים מקזזים זה את זה, וההתפלגות של הממוצע מקבלת צורת פעמון. זה קורה גם אם האוכלוסייה עצמה עקומה.',
   steps:['המשפט עוסק בהתפלגות של ממוצע המדגם, X̄.', 'כש־n גדול, X̄ מתפלג בקירוב נורמלית סביב μ, עם שונות <bdi dir="ltr">σ²/n</bdi>.', 'ההתפלגות של האוכלוסייה עצמה לא משתנה.'],
   res:'במדגמים גדולים התפלגות ממוצע המדגם קרובה לנורמלית, בלי קשר להתפלגות האוכלוסייה.',
   tip:'המשפט הוא על הממוצע, לא על התצפיות.'}),
 w:[null,
   'האוכלוסייה לא משתנה כשדוגמים ממנה. מה שמתקרב לנורמלי הוא ההתפלגות של <u>ממוצע</u> המדגם.',
   'ממוצע המדגם משתנה ממדגם למדגם. רק התוחלת שלו שווה ל־μ, ולא כל ממוצע בודד.',
   'שונות המדגם היא אומדן לשונות האוכלוסייה, ואינה שווה לה בכל מדגם. המשפט לא עוסק בה בכלל.']},
{q:'על סמך מדגם חושב רווח סמך ברמת ביטחון 95% לממוצע: [48 , 52]. מהי הפרשנות הנכונה?', o:['אם נחזור על הדגימה פעמים רבות, כ־95% מהרווחים שייבנו בשיטה זו יכילו את μ','μ הוא משתנה מקרי, ובהסתברות 95% הוא נמצא בין 48 ל־52','95% מהתצפיות נמצאות בין 48 ל־52','הממוצע האמיתי הוא 50'],
 e:SOL({ask:'מה המשמעות המדויקת של "95% ביטחון".',
   why:'μ הוא מספר קבוע שאיננו יודעים. מה שאקראי הוא הרווח: כל מדגם נותן רווח אחר. 95% מתארים את אחוז ההצלחה של השיטה לאורך הרבה מדגמים.',
   steps:['μ קבוע, ולכן אין "הסתברות ש־μ נמצא" ברווח מסוים. הוא בפנים או בחוץ.', 'האקראיות היא ברווח, שמחושב מהמדגם.', 'אם נבנה רווחים כאלה ממדגמים רבים, כ־95% מהם יכילו את μ.'],
   res:'אם נחזור על הדגימה פעמים רבות, כ־95% מהרווחים שייבנו בשיטה זו יכילו את μ.',
   tip:'רמת הביטחון היא תכונה של השיטה, לא של רווח אחד מסוים.'}),
 w:[null,
   'μ אינו משתנה מקרי, אלא קבוע לא ידוע. אחרי שהרווח חושב, μ פשוט נמצא בו או לא. ה־95% שייכים לשיטה, לא ל־μ.',
   'רווח הסמך הוא עבור <u>הממוצע</u>, לא עבור התצפיות. התצפיות מפוזרות הרבה יותר מהממוצע.',
   '50 הוא אמצע הרווח, כלומר ממוצע המדגם. זה אומדן ל־μ, ולא הערך האמיתי.']},
{q:'סטיית התקן באוכלוסייה היא 10. רוצים שטעות הדגימה המרבית, ברמת ביטחון 95%, לא תעלה על 2. מהו גודל המדגם המינימלי?', o:['97','96','10','385'],
 e:SOL({ask:'מה גודל המדגם הקטן ביותר שמבטיח חצי רוחב (טעות דגימה) של 2 לכל היותר.',
   f:'<bdi dir="ltr">n = (z·σ/E)²</bdi>',
   why:'טעות הדגימה המרבית היא <bdi dir="ltr">E = z·σ/√n</bdi>. מבודדים את n: מעבירים אגפים ומעלים בריבוע.',
   steps:['מציבים: <bdi dir="ltr">n = (1.96·10/2)²</bdi>', 'מחשבים: <bdi dir="ltr">1.96·10/2 = 9.8</bdi>', 'בריבוע: <bdi dir="ltr">9.8² = 96.04</bdi>', 'מעגלים כלפי מעלה: 97'],
   res:'גודל המדגם המינימלי הוא 97.',
   tip:'גודל מדגם מעגלים תמיד כלפי מעלה, גם אם החלק העשרוני קטן.'}),
 w:[null,
   '96 הוא עיגול כלפי מטה של 96.04. עם 96 תצפיות הטעות תהיה מעט מעל 2. לכן מעגלים כלפי מעלה: 97.',
   '10 מתקבל אם שוכחים להעלות בריבוע: <bdi dir="ltr">1.96·10/2 = 9.8 ≈ 10</bdi>. הנוסחה היא הריבוע של הביטוי: <bdi dir="ltr">9.8² = 96.04</bdi>.',
   '385 מתקבל אם מציבים <bdi dir="ltr">E = 1</bdi> (חצי מ־2): <bdi dir="ltr">(1.96·10/1)² = 384.16</bdi>. טעות הדגימה המרבית כבר היא חצי רוחב הרווח, ולכן מציבים 2.']}
],
s6:[
{q:'מהי טעות מסוג ראשון?', o:['דחיית H₀ כשהיא נכונה','אי־דחיית H₀ כשהיא לא נכונה','דחיית H₁ כשהיא נכונה','בחירת α גדול מדי'],
 e:SOL({ask:'ההגדרה של טעות מסוג ראשון.',
   why:'במבחן השערות יש שתי טעויות אפשריות: לדחות השערת אפס נכונה (סוג ראשון), או לא לדחות השערת אפס שגויה (סוג שני). רמת המובהקות α היא בדיוק ההסתברות לטעות מהסוג הראשון.',
   steps:['H₀ נכונה, ודוחים אותה: טעות מסוג ראשון. ההסתברות לה: α.', 'H₀ שגויה, ולא דוחים אותה: טעות מסוג שני. ההסתברות לה: β.'],
   res:'טעות מסוג ראשון היא דחיית H₀ כשהיא נכונה.',
   tip:'סוג ראשון = "אזעקת שווא": מכריזים על תגלית שאינה קיימת.'}),

const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

function niceStep(v) {

{q:'התשואה לפדיון של אג״ח שקלית היא 4%, ושל אג״ח צמודה למדד 1.5%. משקיע צופה אינפלציה של 3%. באיזו אג״ח כדאי לו להשקיע?', o:['הצמודה, כי אינפלציית האיזון היא 2.46% בלבד','השקלית, כי התשואה שלה גבוהה יותר','הן שקולות','השקלית, כי האינפלציה הצפויה נמוכה מ־4%'],

   res:'<b>הצמודה</b>, כי אינפלציית האיזון היא 2.46% בלבד.',
   tip:'אינפלציה צפויה מעל אינפלציית האיזון: צמודה. מתחתיה: שקלית.'}),

{q:'מהי הריבית האפקטיבית השנתית של 5% בצבירה רציפה?', o:['5.13%','5%','5.06%','5.25%'],

f3:[
{q:'צמיתות משלמת 100 ₪ בסוף כל שנה, והריבית 5%. מהו ערכה הנוכחי?', o:['2,000 ₪','500 ₪','105 ₪','2,100 ₪'],

{q:'צמיתות צומחת: התשלום הראשון, בסוף השנה, הוא 10 ₪, והוא גדל ב־3% בכל שנה. הריבית 8%. מהו ערכה הנוכחי?', o:['200 ₪','206 ₪','125 ₪','90.9 ₪'],

   '90.9 ₪ הוא <bdi dir="ltr">10/(0.08 + 0.03)</bdi>: הוסיפו את הצמיחה במקום להחסיר. צמיחה מעלה את השווי, ולכן <bdi dir="ltr">r − g</bdi>.']},
{q:'משווים שתי הלוואות באותו סכום, באותה ריבית ולאותה תקופה: אחת בשיטת שפיצר ואחת בשיטת קרן שווה. איזו טענה נכונה?', o:['בקרן שווה התשלום הראשון גבוה יותר וסך הריבית נמוך יותר','בשפיצר סך הריבית נמוך יותר','בקרן שווה התשלומים קבועים','בשפיצר הקרן נפרעת מהר יותר'],

   steps:['קרן שווה: בכל תשלום מחזירים <bdi dir="ltr">L/n</bdi> מהקרן, ועוד ריבית על כל היתרה.',

     'שפיצר: התשלום קבוע, ובהתחלה רובו ריבית. הקרן נפרעת לאט, היתרה נשארת גבוהה זמן רב, וסך הריבית גבוה יותר.'],

   'זה הפוך. בשפיצר הקרן נפרעת לאט יותר, יתרת החוב גבוהה יותר לאורך זמן, ולכן סך הריבית גבוה יותר.',

s5:[() => {

    [f(c[1] * sg), `רווח זה מתקבל משימוש בסטיית התקן של האוכלוסייה בלי לחלק ב־√n: ${GB(`${c[1]}·${sg} = ${nf(c[1] * sg, 2)}`)}. הממוצע של ${n} תצפיות מפוזר פחות מתצפית בודדת, ולכן משתמשים ב־σ/√n.`],
    [f(zw * se), `רווח זה מתקבל מהערך הקריטי ${zw}, ששייך לרמת ביטחון ${cw}%. לרמת ביטחון ${c[0]}% הערך הוא ${c[1]}.`],
    [f(se), `רווח זה הוא ${xb} ± טעות התקן בלבד (${nf(se, 3)}). שכחו להכפיל בערך הקריטי ${c[1]}.`]];

    e: SOL({ask: `טווח סביב ממוצע המדגם (${xb}) שבו נמצא הממוצע האמיתי של האוכלוסייה ברמת ביטחון ${c[0]}%.`,
      f: GB('x̄ ± Z<sub>1−α/2</sub>·σ/√n'),

      steps: [`טעות התקן: ${GB(`SE = ${sg} / √${n} = ${sg} / ${rn} = ${nf(se, 3)}`)}`,
        `מחצית רוחב הרווח: ${GB(`${c[1]}·${nf(se, 3)} = ${nf(E, 3)}`)}`,
        `גבולות: ${GB(`${xb} − ${nf(E, 3)} ≈ ${nf(xb - E, 2)}`)} ו־${GB(`${xb} + ${nf(E, 3)} ≈ ${nf(xb + E, 2)}`)}`],
      res: `רווח הסמך הוא ${GR(f(E))}.`,
      tip: 'ערכים קריטיים: 1.645 ל־90%, ‏1.96 ל־95%, ‏2.576 ל־99%. ותמיד מחלקים ב־√n.'})};

s6:[() => {
  const m0 = pick([50, 100, 200]), sg = pick([8, 10, 12, 15, 20]), n = pick([16, 25, 36, 64, 100]);
  const se = sg / Math.sqrt(n), z = pick([0.8, 1.2, 1.5, 1.8, 2.1, 2.4, 2.8, -2.2, -1.4]), xb = Math.round((m0 + z * se) * 100) / 100;
  const Z = (xb - m0) / se, rej = Math.abs(Z) > 1.96, rn = Math.sqrt(n);
  const dec = r => r ? 'דוחים את H₀' : 'לא דוחים את H₀';
  const Zw = (xb - m0) / sg, Zn = (xb - m0) / (sg / n), Zv = (xb - m0) / (sg * sg / rn);
  const opt = (v, r) => `Z = ${nf(v, 2)}, ${dec(r)}`;
  const cand = [
    [opt(Z, rej), null],
    [opt(Z, !rej), `הסטטיסטי ${GB(nf(Z, 2))} נכון, אבל ההחלטה הפוכה. במבחן דו־צדדי ברמת 5% דוחים את H₀ רק כש־|Z| גדול מ־1.96. כאן ${GB(`|Z| = ${nf(Math.abs(Z), 2)}`)}, ${rej ? 'גדול מ־1.96, ולכן דוחים' : 'קטן מ־1.96, ולכן לא דוחים'}.`],
    [opt(Zw, Math.abs(Zw) > 1.96), `${GB(`Z = ${nf(Zw, 2)}`)} מתקבל מחלוקה ב־σ = ${sg} במקום בטעות התקן ${GB(`σ/√n = ${nf(se, 3)}`)}. בודקים ממוצע של ${n} תצפיות, ולכן מחלקים ב־σ/√n.`],
    [opt(Zn, Math.abs(Zn) > 1.96), `${GB(`Z = ${nf(Zn, 2)}`)} מתקבל מחלוקה ב־${GB(`σ/n = ${sg}/${n}`)} במקום ב־${GB(`σ/√n = ${sg}/${rn}`)}. טעות התקן של הממוצע היא σ חלקי השורש של n.`],
    [opt(Zv, Math.abs(Zv) > 1.96), `${GB(`Z = ${nf(Zv, 2)}`)} מתקבל משימוש בשונות ${GB(`σ² = ${sg * sg}`)} במקום בסטיית התקן: ${GB(`(${xb} − ${m0}) / (${sg * sg}/${rn})`)}. בטעות התקן משתמשים ב־σ = ${sg}.`],
    [opt(-Z, rej), `${GB(`Z = ${nf(-Z, 2)}`)} מתקבל מהחיסור בסדר הפוך (${GB(`μ<sub>0</sub> − x̄`)}). הסטטיסטי הוא ${GB('(x̄ − μ<sub>0</sub>)/(σ/√n)')}, ולכן הסימן שלו ${Z > 0 ? 'חיובי' : 'שלילי'}: ממוצע המדגם ${Z > 0 ? 'גבוה' : 'נמוך'} מ־${m0}.`]];
  const seen = new Set(), keep = cand.filter(([s]) => !seen.has(s) && seen.add(s)).slice(0, 5);
  return {t: 's6', gen: true, q: `בודקים את ההשערות H₀: μ = ${m0} מול H₁: μ ≠ ${m0}. נתון: σ = ${sg}, n = ${n}, x̄ = ${xb}, α = 5%. מהו סטטיסטי המבחן, ומה ההחלטה?`,
    o: keep.map(x => x[0]), w: keep.map(x => x[1]),
    e: SOL({ask: `האם ממוצע המדגם ${xb} רחוק מספיק מ־${m0} כדי לקבוע שהממוצע האמיתי שונה מ־${m0}.`,
      f: GB('Z = (x̄ − μ<sub>0</sub>) / (σ/√n)'),
      why: 'הסטטיסטי סופר כמה טעויות תקן ממוצע המדגם רחוק מהערך שבהשערת האפס. המבחן דו־צדדי (≠), ולכן ברמת 5% מחלקים את α לשני הזנבות, והערך הקריטי הוא 1.96.',
      steps: [`טעות התקן: ${GB(`SE = ${sg} / √${n} = ${sg} / ${rn} = ${nf(se, 3)}`)}`,
        `הסטטיסטי: ${GB(`Z = (${xb} − ${m0}) / ${nf(se, 3)} = ${nf(Z, 2)}`)}`,
        `משווים לערך הקריטי: ${GB(`|Z| = ${nf(Math.abs(Z), 2)} ${rej ? '&gt;' : '&lt;'} 1.96`)}, ולכן ${dec(rej)}.`],
      res: `${GR(`Z = ${nf(Z, 2)}`)}, ו${dec(rej)}.`,
      tip: 'במבחן דו־צדדי ברמת 5% משווים את |Z| ל־1.96 (לא ל־1.645, שהוא הערך של מבחן חד־צדדי).'})};
}],
s7:[() => {

     `${GB(F(b))} הוא השיפוע b, לא החותך a. אחרי שמוצאים את b צריך להציב אותו ב־${GB('a = ȳ − b·x̄')}.`,

     `${GB(F(xb - b * yb))} מתקבל מהחלפת התפקידים של X ו־Y (${GB(`x̄ − b·ȳ = ${xb} − ${GP(b)}·${yb}`)}). המשתנה המוסבר הוא Y, ולכן ${GB('a = ȳ − b·x̄')}.`]);
}],
f1:[() => {

f2:[() => {

     `${GB(F(-D * (1 + y) * dy))} מתקבל מהכפלה ב־${GB(`(1 + y)`)} במקום חלוקה. ${GB('D* = D/(1 + y)')}, ולכן הוא קטן ממח״מ מקולי.`]);
