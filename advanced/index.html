כניסה גבוה = טוב</b> ו<b>חסם יציאה גבוה = רע</b>. <b>לאחור = לקוח</b> מייצר בעצמו, <b>לפנים = ספק</b> מוכר בעצמו. ERRC מסודר כמו סולם: <b>מוחקים, מקטינים, מגדילים, ממציאים</b>. KSF: <b>״מבחוץ, מעט, משתנה״</b> (3–5).","blocks":[{"t":"h","x":"הגדרת ענף (ענף מול שוק)"},{"t":"p","x":"<b>ענף</b> הוא קבוצת פירמות שמציעות מוצרים או שירותים שהם <b>תחליפים קרובים</b> זה לזה, עבור קבוצת לקוחות. במילים פשוטות: אם הלקוח יכול לקנות את זה <b>במקום</b> את זה, החברות נמצאות באותו ענף."},{"t":"p","x":"הקורס מבחין בין <b>ענף</b> ל<b>שוק</b>: הענף הוא צד <b>המוכרים</b> (החברות), והשוק הוא צד <b>הקונים</b> (הלקוחות). ענף אחד יכול לשרת כמה שווקים."},{"t":"table","head":["מושג","צד","שאלה","דוגמה"],"rows":[["<b>ענף</b> (Industry)","היצע – החברות","מי מוכר תחליפים קרובים?","ענף המשקאות הקלים: קוקה-קולה, פפסי, ספרינג"],["<b>שוק</b> (Market)","ביקוש – הלקוחות","מי קונה?","הצרכנים שקונים משקאות קלים; שוק המסעדות; שוק הצעירים"]]},{"t":"p","x":"בתרשים של הסיכום רואים שלושה מעגלים: <b>הפירמה</b> במרכז, מסביבה <b>סביבת המיקרו</b> (הענף – חמשת הכוחות), ומסביב לכל <b>סביבת המאקרו</b> (PESTEL). יחידה זו עוברת מהמעגל החיצוני פנימה."},{"t":"example","title":"ענף או שוק?","x":"טויוטה, יונדאי ומאזדה מוכרות מכוניות שהן תחליפים קרובים ← הן באותו <b>ענף</b> (ענף הרכב). ״כל המשפחות בישראל שמחפשות רכב משפחתי ראשון״ ← זה <b>שוק</b> (קבוצת קונים). ענף הרכב משרת גם שוק אחר – חברות ליסינג וציי רכב."},{"t":"trap","x":"ענף ≠ שוק. אם בשאלה מתוארת קבוצת <b>חברות</b> שמוכרות תחליפים קרובים – ענף. אם מתוארת קבוצת <b>לקוחות</b> – שוק."},{"t":"exam","x":"״קבוצת פירמות המציעות מוצרים שהם תחליפים קרובים עבור קבוצת לקוחות״ ← <b>הגדרת ענף</b>. שאלה נפוצה: מה ההבדל בין ענף לשוק? ← ענף = מוכרים, שוק = קונים."},{"t":"h","x":"סביבת מאקרו: מודל PESTEL(G)"},{"t":"p","x":"<b>PESTEL(G)</b> הוא כלי למיפוי <b>7 כוחות סביבתיים חיצוניים</b> שמשפיעים על הענף. זה <b>מבט רחב / גלובלי</b>: החברה לא שולטת בכוחות האלה, היא רק יכולה להיערך אליהם."},{"t":"table","head":["אות","באנגלית","בעברית","מה בודקים","דוגמה"],"rows":[["<b>P</b>","Political","פוליטי","יציבות שלטונית, מדיניות ממשלה, מלחמות, הסכמי סחר","מלחמה מרחיקה תיירים ופוגעת בענף המלונאות"],["<b>E</b>","Economical","כלכלי","ריבית, אינפלציה, שער חליפין, צמיחה, אבטלה","עליית ריבית מקטינה את הביקוש לדירות"],["<b>S</b>","Social","חברתי","דמוגרפיה, טרנדים, אורח חיים, ערכים","טרנד הטבעונות מגדיל את הביקוש לתחליפי בשר"],["<b>T</b>","Technological","טכנולוגי","המצאות, אוטומציה, בינה מלאכותית, דיגיטל","בינה מלאכותית מחליפה מוקדנים בשירות לקוחות"],["<b>E</b>","Environmental","סביבתי","אקלים, זיהום, משאבי טבע, מחזור","בצורת פוגעת ביבולים ובענף החקלאות"],["<b>L</b>","Legal","משפטי","חוקים, רגולציה, תקנים, דיני עבודה, הגנת צרכן","חוק חדש אוסר מכירת משקאות אנרגיה לקטינים"],["<b>G</b>","Globalization","גלובלי","פתיחת שווקים, תחרות מחו״ל, שרשראות אספקה עולמיות","אתרי קניות מסין מתחרים בחנויות האופנה המקומיות"]]},{"t":"example","title":"PESTEL לחברת תיירות","x":"TravelUp, סוכנות נסיעות ישראלית, בודקת את הסביבה: הדולר התחזק (<b>E כלכלי</b>), צעירים מעדיפים להזמין לבד באפליקציה (<b>S חברתי</b> + <b>T טכנולוגי</b>), נכנס לתוקף חוק שמחייב החזר כספי מלא על טיסה שבוטלה (<b>L משפטי</b>), גלי חום באירופה בקיץ (<b>E סביבתי</b>), ואתרי הזמנות בינלאומיים מתחרים בה ישירות (<b>G גלובלי</b>)."},{"t":"trap","x":"יש <b>שתי אותיות E</b>: כלכלי (ריבית, אינפלציה) וסביבתי (אקלים, זיהום). ו-<b>G = Globalization</b> (גלובלי), לא Government. הבדל עדין: <b>פוליטי</b> = מדיניות והחלטות של השלטון ויציבותו; <b>משפטי</b> = חוק או תקנה שכבר קיימים ומחייבים."},{"t":"exam","x":"בשאלת סיפור מתארים שינוי אחד בסביבה ושואלים לאיזה גורם הוא שייך. שאלו: האם זה כסף (E), אנשים והרגלים (S), טכנולוגיה (T), טבע (E), חוק (L), שלטון (P) או העולם (G)? וזכרו: PESTEL = <b>מאקרו</b>, מבט רחב."},{"t":"h","x":"הביקורת על מודל PESTEL"},{"t":"p","x":"ל-PESTEL יש שתי ביקורות עיקריות לפי הקורס:"},{"t":"table","head":["ביקורת","מה הבעיה","דוגמה"],"rows":[["<b>עלויות איסוף מידע גבוהות</b>","כדי לנתח 7 תחומים רחבים צריך הרבה מידע, מחקר וזמן – וזה יקר","חברה קטנה לא יכולה לממן סקרים ומחקרי שוק על כל שבעת הגורמים"],["<b>סכנה לאיבוד רלוונטיות במציאות דינמית</b>","העולם משתנה מהר. עד שהניתוח מוכן, חלק מהנתונים כבר לא נכונים","ניתוח שנעשה לפני מגפה או מלחמה מאבד את ערכו תוך שבועות"]]},{"t":"p","x":"<i>הרחבה מספרי הלימוד:</i> המודל הוא בעיקר <b>רשימה</b> – הוא לא אומר אילו גורמים חשובים יותר ומה בדיוק לעשות. לכן משלבים אותו עם כלים נוספים."},{"t":"trap","x":"הביקורת על PESTEL <b>אינה</b> ש״הוא מתעלם מהסביבה החיצונית״ – הוא בדיוק כלי לסביבה החיצונית. הביקורות בקורס: <b>עלות איסוף המידע</b> ו<b>איבוד הרלוונטיות במציאות דינמית</b>."},{"t":"exam","x":"״מהי הביקורת על מודל PESTEL?״ ← עלויות איסוף מידע גבוהות, וסכנה שהניתוח יאבד רלוונטיות כי המציאות משתנה מהר."},{"t":"h","x":"סביבת מיקרו: מודל חמשת הכוחות של פורטר"},{"t":"p","x":"אחרי המבט הרחב עוברים ל<b>סביבת המיקרו</b> – מבט <b>ממוקד יותר</b> על הענף עצמו. מודל חמשת הכוחות של פורטר <b>מעריך את האטרקטיביות של הענף ואת פוטנציאל הרווחיות בו</b>. בתרשים, היריבות הפנימית במרכז, ומסביב ארבעה כוחות שלוחצים עליה."},{"t":"table","head":["#","כוח","השאלה","דוגמה"],"rows":[["1","<b>יריבות פנימית בענף</b>","כמה קשה הקרב בין המתחרים הקיימים?","חברות הסלולר בישראל אחרי 2012 – מלחמת מחירים"],["2","<b>איום כניסת מתחרים חדשים</b>","כמה קל לחברה חדשה להיכנס לענף?","פתיחת בית קפה שכונתי – קל להיכנס"],["3","<b>איום מוצרים תחליפיים</b>","האם מוצר <b>מענף אחר</b> יכול לספק את אותו צורך?","שיחות וידאו (Zoom) במקום טיסות עסקים"],["4","<b>כוח המיקוח של הלקוחות</b>","האם הלקוחות יכולים להכתיב מחיר ותנאים?","רשת שיווק גדולה מול יצרן חומוס קטן"],["5","<b>כוח המיקוח של הספקים</b>","האם הספקים יכולים להכתיב מחיר ותנאים?","ספק שבבים יחיד מול יצרני מחשבים"]]},{"t":"example","title":"ענף חברות התעופה","x":"<b>יריבות:</b> הרבה חברות, מלחמות מחיר. <b>כניסה:</b> חברות לואו-קוסט חדשות נכנסות. <b>תחליפים:</b> רכבות מהירות באירופה ושיחות וידאו. <b>לקוחות:</b> משווים מחירים באתרים בשנייה – עלות מעבר אפסית. <b>ספקים:</b> בואינג ואיירבוס כמעט לבד, והדלק הוא חומר גלם קריטי. ← כל הכוחות חזקים, ולכן רווחיות הענף נמוכה."},{"t":"trap","x":"<b>תחליף ≠ מתחרה.</b> מוצר <b>מאותו ענף</b> (פפסי לקוקה-קולה) = יריבות פנימית (כוח 1). מוצר <b>מענף אחר</b> שעונה על אותו צורך (מים מינרליים לקולה, זום לטיסה) = תחליף (כוח 3). והשם בקורס: <b>״יריבות פנימית בענף״</b>."},{"t":"exam","x":"שאלו ״מי לוחץ על הרווח?״: המתחרים הקיימים (1), חברות שעלולות להיכנס (2), מוצר מענף אחר (3), הקונים (4) או המוכרים לנו (5). חמשת הכוחות = <b>מיקרו</b>, מבט ממוקד."},{"t":"h","x":"מה מחזק כל אחד מחמשת הכוחות"},{"t":"p","x":"לכל כוח יש גורמים שמחזקים אותו. <b>כוח חזק = רע לרווחיות</b> של החברות בענף."},{"t":"table","head":["כוח","מה מחזק אותו","למה"],"rows":[["1. <b>יריבות פנימית</b>","<b>הרבה מתחרים</b>; <b>קצב צמיחה איטי</b>; <b>חסמי יציאה גבוהים</b>; <b>עלויות מעבר נמוכות</b> ללקוח","בענף שלא צומח אפשר לגדול רק על חשבון מתחרה. חסם יציאה גבוה (ציוד ייעודי, חוזים, פיצויים) משאיר חברות חלשות שנלחמות גם בהפסד. עלות מעבר נמוכה = קל ״לגנוב״ לקוחות."],["2. <b>כניסת מתחרים חדשים</b>","<b>חסמי כניסה נמוכים</b>: השקעה נדרשת קטנה, אין <b>יתרונות לגודל</b> לחברות הקיימות, אין <b>הגבלות ממשלתיות</b>","אם קל להיכנס, כל רווח גבוה מושך חברות חדשות. חסמים גבוהים (השקעה ענקית, יתרון לגודל, רישיון) = האיום <b>חלש</b>."],["3. <b>מוצרים תחליפיים</b>","<b>זמינות</b> של תחליפים; <b>אטרקטיביות</b> שלהם (מחיר / ביצועים); <b>עלויות החלפה</b> נמוכות","אם התחליף זמין, טוב וזול, וקל לעבור אליו – הלקוחות יעברו."],["4. <b>כוח הלקוחות</b>","לקוחות <b>מרוכזים</b> (מעטים וגדולים); <b>עלויות החלפה נמוכות</b>; <b>איום באינטגרציה לאחור</b>","לקוח גדול שקל לו לעבור לספק אחר, או שיכול לייצר בעצמו, מכתיב מחיר."],["5. <b>כוח הספקים</b>","<b>ריכוזיות ספקים</b> (מעטים); <b>חומר גלם קריטי</b>; <b>איום באינטגרציה לפנים</b>","ספק יחיד של רכיב שאין לו תחליף, או ספק שיכול למכור ישר ללקוחות שלנו, מכתיב מחיר."]]},{"t":"p","x":"<b>אינטגרציה לאחור</b> = הלקוח ״חוזר אחורה״ בשרשרת ומייצר בעצמו את מה שקנה (רשת שיווק שמשיקה מותג פרטי). <b>אינטגרציה לפנים</b> = הספק ״מתקדם קדימה״ ומוכר בעצמו ללקוח הסופי (יצרן שפותח חנות אונליין משלו)."},{"t":"example","title":"איזה כוח ומה מחזק אותו?","x":"רשת הסופרמרקטים MegaMart הודיעה ליצרן הפסטה שאם לא יוריד מחיר, היא תשיק פסטה במותג פרטי ← <b>כוח הלקוחות</b>, מחוזק ב<b>איום באינטגרציה לאחור</b>. יצרנית הרחפנים SkyCam קונה מעבד מיוחד מספק אחד בעולם, והוא העלה מחיר ב-30% ← <b>כוח הספקים</b>, מחוזק ב<b>ריכוזיות</b> וב<b>חומר גלם קריטי</b>. מפעל פלדה ממשיך לפעול בהפסד כי אי אפשר למכור את התנורים הייעודיים ← <b>חסמי יציאה גבוהים</b> ← <b>יריבות</b> חזקה."},{"t":"trap","x":"הכיוונים מבלבלים: <b>חסמי כניסה גבוהים</b> = איום כניסה <b>חלש</b> = טוב לרווחיות. <b>חסמי יציאה גבוהים</b> = יריבות <b>חזקה</b> = רע לרווחיות. <b>צמיחה מהירה</b> מחלישה יריבות; <b>צמיחה איטית</b> מחזקת אותה. ו<b>לאחור = לקוחות</b>, <b>לפנים = ספקים</b>."},{"t":"exam","x":"שאלות נפוצות: ״איזה גורם מחזק את כוח הלקוחות?״ ← לקוחות מרוכזים / עלויות החלפה נמוכות / איום באינטגרציה לאחור. ״מתי איום הכניסה נמוך?״ ← השקעה גבוהה, יתרון לגודל, הגבלות ממשלתיות. ״מה מגביר את היריבות?״ ← הרבה מתחרים, צמיחה איטית, חסמי יציאה גבוהים, עלויות מעבר נמוכות."},{"t":"h","x":"מסקנה: עוצמת הכוחות ורווחיות הענף"},{"t":"p","x":"המסקנה של המודל פשוטה, והיא מודגשת בסיכום:"},{"t":"table","head":["עוצמת הכוחות","תחרות","רווחיות","הענף"],"rows":[["<b>חזקה</b>","גבוהה","<b>נמוכה</b>","לא אטרקטיבי"],["<b>חלשה</b>","נמוכה","<b>גבוהה</b>","<b>אטרקטיבי</b>"]]},{"t":"example","title":"שני ענפים","x":"ענף חברות התעופה: יריבות קשה, לקוחות שמשווים מחירים, ספקים חזקים ← <b>רווחיות נמוכה</b>. ענף מערכות ההפעלה למחשב: מעט שחקנים, חסם כניסה ענק, ללקוח קשה לעבור ← כוחות חלשים ← <b>רווחיות גבוהה</b> (מיקרוסופט)."},{"t":"trap","x":"״כוח חזק״ נשמע טוב – אבל בחמשת הכוחות <b>כוח חזק רע</b> לחברות בענף. חזק = תחרות גבוהה = רווחיות נמוכה."},{"t":"exam","x":"״ענף שבו כל חמשת הכוחות חזקים יהיה...״ ← תחרותי עם רווחיות נמוכה. ״באיזה ענף כדאי להשקיע?״ ← בענף שבו הכוחות חלשים."},{"t":"h","x":"אסטרטגיית אוקיינוס כחול מול אוקיינוס אדום"},{"t":"p","x":"מה עושים כשהיריבות הפנימית בענף קשה? <b>אסטרטגיית אוקיינוס כחול</b> (Kim & Mauborgne) מציעה לא להילחם בתוך ״<b>האוקיינוס האדום</b>״ – שוק קיים וצפוף שהמים בו אדומים מ״דם״ התחרות – אלא ליצור <b>נישת שוק חדשה ללא מתחרים</b>."},{"t":"table","head":["אוקיינוס אדום (Red Ocean)","אוקיינוס כחול (Blue Ocean)"],"rows":[["להתחרות <b>בשוק הקיים</b>","ליצור <b>נישת שוק ללא מתחרים</b>"],["<b>לנצח</b> את המתחרים","להפוך את המתחרים ל<b>לא רלוונטיים</b>"],["לנצל את <b>הביקוש הקיים</b>","ליצור וללכוד <b>ביקוש חדש</b>"],["לבצע <b>שקלול תמורות</b> בין ערך לעלות","<b>לשבור</b> את שקלול התמורות בין ערך לעלות"]]},{"t":"p","x":"מה זה ״שקלול תמורות בין ערך לעלות״? באוקיינוס האדום צריך לבחור: או <b>ערך גבוה</b> ללקוח (וזה עולה יותר), או <b>עלות נמוכה</b> (ואז נותנים פחות). באוקיינוס הכחול <b>שוברים</b> את הבחירה: מורידים עלות ובו זמנית מעלים ערך. זה נקרא <b>חדשנות ערך</b> (Value Innovation)."},{"t":"example","title":"Cirque du Soleil","x":"ענף הקרקס היה אוקיינוס אדום: קהל מצטמצם, כוכבים יקרים, ביקורת על אילוף חיות. סירק דו סוליי לא ניסתה להיות ״קרקס טוב יותר״. היא חיברה קרקס ותיאטרון ויצרה מופע לקהל מבוגר ועשיר שבכלל לא הלך לקרקס – <b>ביקוש חדש</b>, בלי מתחרים ישירים, במחיר גבוה ובעלות נמוכה (בלי חיות ובלי כוכבים)."},{"t":"trap","x":"אוקיינוס כחול <b>אינו</b> ״מוצר קצת יותר טוב בשוק הקיים״ ואינו ״להוריד מחיר מהמתחרים״ – אלה מהלכים של אוקיינוס אדום. הכחול <b>יוצר ביקוש חדש</b> ו<b>הופך את התחרות ללא רלוונטית</b>. והוא נולד כתשובה ל<b>יריבות פנימית קשה</b>."},{"t":"exam","x":"״החברה יצרה קטגוריה חדשה, משכה לקוחות שלא קנו בכלל בענף, ואין לה מתחרים ישירים״ ← <b>אוקיינוס כחול</b>. ״החברה מורידה מחיר כדי לגנוב נתח שוק מהמתחרה הגדול״ ← <b>אוקיינוס אדום</b>."},{"t":"h","x":"מטריצת 4 הפעולות (ERRC)"},{"t":"p","x":"איך בונים אוקיינוס כחול בפועל? בעזרת <b>מטריצת 4 הפעולות (ERRC)</b>. עוברים על הגורמים שהענף מתחרה עליהם ושואלים ארבע שאלות:"},{"t":"table","head":["פעולה","השאלה","מה זה עושה","בסירק דו סוליי"],"rows":[["<b>ביטול</b> (Eliminate)","אילו גורמים שהענף רואה כמובנים מאליהם <b>לבטל לגמרי</b>?","מוריד עלות","מופעי חיות, כוכבי קרקס"],["<b>צמצום</b> (Reduce)","אילו גורמים להוריד <b>מתחת לרמה המקובלת</b> בענף?","מוריד עלות","הומור גס, מופעי סכנה"],["<b>הגבהה</b> (Raise)","אילו גורמים להעלות <b>מעל לרמה המקובלת</b> בענף?","מעלה ערך","אולם ייחודי ונוח"],["<b>יצירה</b> (Create)","אילו גורמים <b>שהענף מעולם לא הציע</b> ליצור?","מעלה ערך ויוצר ביקוש חדש","עלילה ונושא, מוזיקה וריקוד אמנותיים"]]},{"t":"p","x":"ביטול וצמצום <b>מורידים את העלות</b>; הגבהה ויצירה <b>מעלות את הערך</b>. ביחד הם שוברים את שקלול התמורות בין ערך לעלות."},{"t":"example","title":"ERRC לחדר כושר","x":"רשת FitLite: <b>ביטול</b> – בריכה וסאונה. <b>צמצום</b> – מספר המכשירים המיוחדים. <b>הגבהה</b> – ניקיון ושעות פתיחה (24/7). <b>יצירה</b> – אפליקציה עם מאמן וירטואלי ואווירה ״בלי שיפוטיות״ למתחילים. התוצאה: מנוי זול מאוד, שמושך אנשים שמעולם לא היו בחדר כושר."},{"t":"trap","x":"<b>ביטול ≠ צמצום</b>: ביטול = מורידים לגמרי; צמצום = משאירים, אבל פחות מהמקובל. <b>הגבהה ≠ יצירה</b>: הגבהה = גורם שכבר קיים בענף, ברמה גבוהה יותר; יצירה = גורם <b>חדש</b> שלא היה בענף בכלל."},{"t":"exam","x":"בשאלה יתארו פעולה אחת ויבקשו לסווג: ״הפסיקו לגמרי״ ← ביטול. ״פחות מהמתחרים״ ← צמצום. ״יותר מכל המתחרים״ ← הגבהה. ״לראשונה בענף״ ← יצירה."},{"t":"h","x":"מיפוי קבוצות אסטרטגיות"},{"t":"p","x":"<b>קבוצה אסטרטגית</b> היא קבוצת חברות בענף שנוקטות גישה תחרותית דומה. <b>מיפוי קבוצות אסטרטגיות</b> הוא כלי לניתוח מתחרים: ממקמים את החברות על מפה לפי <b>שני ממדים מבדילים</b> (למשל <b>מחיר מול איכות</b>, או <b>מגוון דגמים</b>), כדי להבין את <b>המיצוב התחרותי</b> ואת <b>האפשרויות לעבור בין קבוצות</b>."},{"t":"steps","title":"איך מכינים מפה","x":["בוחרים שני מאפיינים שמבדילים בין החברות בענף (מחיר, איכות, מגוון מוצרים, כיסוי גיאוגרפי, ערוצי הפצה).","עדיף ממדים שאינם תלויים זה בזה (לא ״מחיר״ ו״יוקרה״ שהולכים תמיד יחד).","ממקמים כל חברה על המפה.","מקיפים בעיגול חברות שקרובות זו לזו – כל עיגול הוא קבוצה אסטרטגית.","גודל העיגול יכול לשקף את נתח המכירות של הקבוצה."]},{"t":"list","x":["<b>המתחרים הקרובים</b> ביותר הם אלה שבאותה קבוצה.","רואים את <b>המיצוב</b> של החברה ביחס לאחרות.","בודקים אם אפשר וכדאי <b>לעבור לקבוצה אחרת</b>, ומה מקשה על המעבר.","מקום ריק במפה יכול להיות הזדמנות (או סימן שאין שם ביקוש)."]},{"t":"example","title":"ענף הרכב","x":"ציר X: מגוון דגמים; ציר Y: מחיר. <b>פרארי ולמבורגיני</b> – מחיר גבוה מאוד, מעט דגמים. <b>מרצדס ו-BMW</b> – מחיר גבוה, מגוון רחב. <b>טויוטה ויונדאי</b> – מחיר בינוני, מגוון רחב. <b>דאצ׳יה</b> – מחיר נמוך, מעט דגמים. המסקנה: יונדאי מתחרה בעיקר בטויוטה, לא בפרארי."},{"t":"trap","x":"שני הצירים הם <b>ממדים מבדילים</b> בין החברות – לא ״רווח״ ולא ״חמשת הכוחות״. וחברות בקבוצות שונות <b>אינן</b> המתחרות הקרובות ביותר זו לזו."},{"t":"exam","x":"״החברה מיפתה את המתחרים לפי מחיר ומגוון מוצרים כדי לראות מי הכי קרוב אליה ואם כדאי לה לעבור לסגמנט אחר״ ← <b>מיפוי קבוצות אסטרטגיות</b>."},{"t":"h","x":"גורמי מפתח להצלחה בענף (KSF)"},{"t":"p","x":"<b>גורמי מפתח להצלחה (Key Success Factors – KSF)</b> הם אלמנטים, יכולות או תנאים <b>קריטיים</b> שחברה חייבת להצטיין בהם כדי לשגשג ולנצח את המתחרים <b>בענף שבו היא פועלת</b>. הם נקבעים בדרך כלל לפי <b>תנאי השוק</b>, <b>דרישות הענף</b> ו<b>דרישות הלקוחות</b>."},{"t":"table","head":["מאפיין","מה זה אומר","דוגמה"],"rows":[["1. <b>מוכתבים מבחוץ</b>","<b>השוק והלקוחות</b> קובעים מה הם גורמי ההצלחה – לא הארגון עצמו","בענף משלוחי האוכל הלקוחות דורשים מהירות. גם אם החברה מצוינת בעיצוב אריזות – זה לא KSF"],["2. <b>מיקוד אסטרטגי</b>","מגדירים רק <b>3 עד 5</b> גורמי מפתח מרכזיים, כדי <b>לא לפזר</b> את המשאבים","חברת תעופה: בטיחות, דיוק בזמנים, עלות נמוכה לנוסע"],["3. <b>משתנים עם הזמן</b>","ה-KSF יכולים להשתנות בגלל <b>טכנולוגיה</b>, <b>רגולציה</b> או <b>שינוי בהעדפות הצרכנים</b>","בטלפונים: פעם – עמידות וסוללה (נוקיה); היום – מערכת הפעלה, אפליקציות ומצלמה"]]},{"t":"example","title":"KSF בכמה ענפים","x":"<b>סופרמרקטים:</b> מחיר נמוך, מיקום נוח, ניהול מלאי. <b>אופנה מהירה:</b> מהירות מעיצוב למדף, מעקב אחר טרנדים. <b>תרופות:</b> מו״פ, פטנטים, אישורי רגולציה. בכל ענף כל השחקנים צריכים להצטיין באותם גורמים – מי שלא, נשאר מאחור."},{"t":"trap","x":"KSF הם של <b>הענף</b> – כל החברות בו צריכות לעמוד בהם. הם <b>לא</b> נקבעים על ידי ההנהלה לפי החוזקות שלה, ו<b>לא</b> כוללים 10–15 גורמים. הם גם לא קבועים לתמיד."},{"t":"exam","x":"״לפי מה נקבעים ה-KSF?״ ← תנאי השוק, דרישות הענף ודרישות הלקוחות (מבחוץ). ״כמה KSF מומלץ להגדיר?״ ← 3–5. ״מה קרה ל-KSF בענף הטלפונים אחרי האייפון?״ ← הם השתנו עם הזמן (טכנולוגיה, העדפות)."},{"t":"h","x":"איך פותרים שאלת סיפור ביחידה 2"},{"t":"steps","title":"מילות מפתח ← מודל","x":["״קבוצת חברות שמוכרות תחליפים קרובים״ ← הגדרת ענף. ״קבוצת קונים״ ← שוק.","שינוי כללי בעולם (ריבית, חוק, טרנד, אקלים, טכנולוגיה) ← PESTEL(G), מאקרו.","״עלות איסוף מידע / מאבד רלוונטיות״ ← הביקורת על PESTEL.","מתחרים, נכנסים חדשים, תחליפים, לקוחות, ספקים ← חמשת הכוחות, מיקרו.","כוחות חזקים ← רווחיות נמוכה; כוחות חלשים ← ענף אטרקטיבי.","״יצרו שוק חדש בלי מתחרים״ ← אוקיינוס כחול. ״לנצח את המתחרים בשוק הקיים״ ← אוקיינוס אדום.","ביטלו / צמצמו / הגביהו / יצרו ← ERRC.","״מפה עם שני צירים של מתחרים״ ← מיפוי קבוצות אסטרטגיות.","״מה חייבים להצטיין בו כדי להצליח בענף״ ← KSF."]}],"cheat":["ענף = פירמות שמציעות תחליפים קרובים לקבוצת לקוחות (מוכרים)","שוק = הלקוחות / הקונים","PESTEL(G) = 7 כוחות מאקרו: פוליטי, כלכלי, חברתי, טכנולוגי, סביבתי, משפטי, גלובלי","G = Globalization (גלובלי)","ביקורת PESTEL = עלות איסוף מידע גבוהה + איבוד רלוונטיות במציאות דינמית","חמשת הכוחות = מיקרו, מעריך אטרקטיביות ורווחיות של הענף","יריבות פנימית חזקה = הרבה מתחרים, צמיחה איטית, חסמי יציאה גבוהים, עלויות מעבר נמוכות","איום כניסה חלש = חסמי כניסה גבוהים, השקעה גבוהה, יתרון לגודל, הגבלות ממשלה","איום תחליפים חזק = זמינים, אטרקטיביים, עלות החלפה נמוכה","כוח לקוחות חזק = מרוכזים, עלות החלפה נמוכה, איום באינטגרציה לאחור","כוח ספקים חזק = ריכוזיות, חומר גלם קריטי, איום באינטגרציה לפנים","כוחות חזקים = תחרות גבוהה = רווחיות נמוכה","כוחות חלשים = ענף אטרקטיבי = רווחיות גבוהה","אוקיינוס אדום = להתחרות בשוק קיים ולנצח מתחרים","אוקיינוס כחול = נישה חדשה בלי מתחרים, ביקוש חדש","אוקיינוס כחול = שובר את שקלול התמורות בין ערך לעלות","ERRC = ביטול, צמצום, הגבהה, יצירה","ביטול + צמצום = מורידים עלות; הגבהה + יצירה = מעלים ערך","מיפוי קבוצות אסטרטגיות = מפה לפי 2 ממדים מבדילים","אותה קבוצה אסטרטגית = המתחרים הקרובים ביותר","KSF = מה שחייבים להצטיין בו כדי לנצח בענף","KSF מוכתבים מבחוץ = השוק והלקוחות קובעים","KSF מיקוד = רק 3–5 גורמים","KSF משתנים עם הזמן = טכנולוגיה, רגולציה, העדפות"],"mcq":[{"id":"m2-1","q":"לפי הקורס, מהו <b>ענף</b>?","o":["קבוצת הלקוחות שקונים מוצר מסוים","קבוצת פירמות המציעות מוצרים או שירותים שהם תחליפים קרובים עבור קבוצת לקוחות","כל החברות במשק שיש להן אותו מספר עובדים","קבוצת חברות שמשתמשות באותם ספקים"],"a":1,"w":["זו הגדרה של שוק, לא של ענף.","","ענף מוגדר לפי תחליפיות של מוצרים, לא לפי גודל.","ענף מוגדר לפי מה שהחברות מוכרות ללקוחות, לא לפי הספקים."],"why":"ענף = צד המוכרים: חברות שמציעות תחליפים קרובים לאותה קבוצת לקוחות."},{"id":"m2-2","q":"״כל הסטודנטים בישראל שמחפשים מחשב נייד זול ללימודים״. מה זה מתאר?","o":["שוק","ענף","קבוצה אסטרטגית","KSF"],"a":0,"w":["","ענף הוא קבוצת חברות מוכרות; כאן מתוארת קבוצת קונים.","קבוצה אסטרטגית היא קבוצת חברות עם אסטרטגיה דומה.","KSF הוא גורם שחייבים להצטיין בו, לא קבוצת אנשים."],"why":"קבוצת לקוחות / קונים = שוק. הקורס מבחין בין ענף (מוכרים) לשוק (קונים)."},{"id":"m2-3","q":"בנק ישראל העלה את הריבית, ומספר המשכנתאות החדשות ירד. לאיזה גורם ב-PESTEL(G) שייך השינוי?","o":["P – פוליטי","E – כלכלי (Economical)","E – סביבתי","L – משפטי"],"a":1,"w":["ריבית היא משתנה כלכלי, לא החלטה פוליטית של השלטון.","","סביבתי עוסק באקלים וזיהום.","לא נחקק כאן חוק."],"why":"ריבית, אינפלציה ושער חליפין שייכים לגורם הכלכלי."},{"id":"m2-4","q":"גלי חום ובצורת פגעו ביבולי הקפה בברזיל, ומחיר פולי הקפה עלה. לאיזה גורם ב-PESTEL(G) שייך האירוע?","o":["E – כלכלי","E – סביבתי (Environmental)","S – חברתי","T – טכנולוגי"],"a":1,"w":["המחיר עלה, אבל הסיבה היא אקלים – גורם סביבתי.","","זה לא שינוי בהרגלי אנשים.","אין כאן טכנולוגיה."],"why":"אקלים, בצורת וזיהום הם גורמים סביבתיים."},{"id":"m2-5","q":"נכנס לתוקף חוק שאוסר למכור משקאות אנרגיה לבני פחות מ-18. לאיזה גורם ב-PESTEL(G) זה שייך?","o":["L – משפטי (Legal)","P – פוליטי","S – חברתי","G – גלובלי"],"a":0,"w":["","פוליטי הוא מדיניות ויציבות שלטונית; חוק מחייב שכבר בתוקף הוא משפטי.","זה לא טרנד של צרכנים אלא חוק.","זה חוק מקומי, לא תהליך עולמי."],"why":"חוקים, תקנות ורגולציה שחלים על הענף = גורם משפטי."},{"id":"m2-6","q":"טרנד הטבעונות מתחזק, ויותר צרכנים קונים תחליפי בשר. לאיזה גורם ב-PESTEL(G) שייך השינוי?","o":["S – חברתי (Social)","T – טכנולוגי","E – כלכלי","L – משפטי"],"a":0,"w":["","השינוי הוא בהרגלים ובערכים של אנשים, לא בטכנולוגיה.","אין כאן ריבית, מחירים או צמיחה.","אין כאן חוק."],"why":"טרנדים, אורח חיים וערכים של אנשים = גורם חברתי."},{"id":"m2-7","q":"חנויות אופנה ישראליות מאבדות לקוחות לאתרי קניות סיניים שמוכרים בזול ושולחים ישר הביתה. איזה גורם ב-PESTEL(G) מתאר זאת בצורה הטובה ביותר?","o":["P – פוליטי","E – סביבתי","G – גלובלי (Globalization)","S – חברתי"],"a":2,"w":["אין כאן החלטה פוליטית.","אין כאן אקלים או זיהום.","","העיקר כאן הוא פתיחת השוק לתחרות מחו״ל, לא טרנד חברתי."],"why":"תחרות מחו״ל ושרשראות אספקה עולמיות = גלובליזציה (G)."},{"id":"m2-8","q":"מהי הביקורת על מודל PESTEL לפי הקורס?","o":["הוא מתעלם לגמרי מהסביבה החיצונית","הוא בודק רק את המתחרים הישירים","עלויות איסוף מידע גבוהות וסכנה שהניתוח יאבד רלוונטיות במציאות דינמית","הוא מתאים רק לחברות ללא מטרות רווח"],"a":2,"w":["PESTEL הוא בדיוק כלי לסביבה החיצונית.","את המתחרים בודקים בחמשת הכוחות; PESTEL רחב יותר.","","אין ביקורת כזו."],"why":"שתי הביקורות: איסוף המידע יקר, והעולם משתנה מהר כך שהניתוח מתיישן."},{"id":"m2-9","q":"בענף מכוני הכושר בעיר כמעט אין צמיחה במספר המתאמנים, ויש בו הרבה מכונים. מה צפוי לקרות ליריבות הפנימית?","o":["היא תהיה חלשה, כי השוק יציב","היא תהיה חזקה, כי אפשר לגדול רק על חשבון מתחרים","היא לא תושפע, כי היריבות תלויה רק בספקים","היא תיעלם, כי חברות חדשות ייכנסו"],"a":1,"w":["צמיחה איטית מחזקת את היריבות, לא מחלישה.","","היריבות מושפעת ממספר המתחרים ומקצב הצמיחה.","כניסה של חברות רק תגביר את היריבות."],"why":"הרבה מתחרים + צמיחה איטית = יריבות פנימית חזקה."},{"id":"m2-10","q":"מפעל פלדה ממשיך לפעול שנים בהפסד, כי את התנורים הייעודיים שלו אי אפשר למכור והוא מחויב בחוזים לעובדים. מה מתאר הסיפור ומה ההשפעה?","o":["חסמי יציאה גבוהים, שמחזקים את היריבות הפנימית בענף","חסמי כניסה גבוהים, שמחלישים את איום הכניסה","כוח ספקים חזק","חסמי יציאה גבוהים, שמחלישים את היריבות"],"a":0,"w":["","הסיפור עוסק בקושי לצאת מהענף, לא להיכנס אליו.","אין כאן ספק שמכתיב מחיר.","חסמי יציאה גבוהים משאירים חברות שנלחמות – היריבות מתחזקת."],"why":"כשקשה לצאת, גם חברות מפסידות נשארות ונלחמות – היריבות חזקה יותר."},{"id":"m2-11","q":"כדי להיכנס לענף ייצור השבבים צריך להשקיע מיליארדי דולרים במפעל, ולחברות הקיימות יש יתרון לגודל עצום. מה נכון לגבי איום הכניסה?","o":["האיום חלש, כי חסמי הכניסה גבוהים","האיום חזק, כי הענף רווחי","האיום חזק, כי יתרון לגודל מעודד כניסה","אין קשר בין גובה ההשקעה לאיום הכניסה"],"a":0,"w":["","רווחיות מושכת, אבל חסמים גבוהים עוצרים כניסה.","יתרון לגודל של הקיימים הוא חסם כניסה – מחליש את האיום.","גובה ההשקעה הנדרשת הוא אחד הגורמים שקובעים את האיום."],"why":"השקעה גבוהה + יתרון לגודל = חסמי כניסה גבוהים = איום כניסה חלש."},{"id":"m2-12","q":"כדי להפעיל קו אוטובוסים בין-עירוני צריך רישיון מיוחד ממשרד התחבורה, ומספר הרישיונות מוגבל. איך זה משפיע על חמשת הכוחות?","o":["מחזק את איום התחליפים","מחזק את כוח הלקוחות","מחזק את איום כניסת מתחרים חדשים","מחליש את איום כניסת מתחרים חדשים"],"a":3,"w":["הרישיון לא משפיע על מוצרים מענף אחר.","הגבלת כניסה לא נותנת ללקוחות יותר כוח.","הגבלה ממשלתית היא חסם – היא מחלישה את האיום.",""],"why":"הגבלות ממשלתיות הן חסם כניסה ולכן מחלישות את איום הכניסה."},{"id":"m2-13","q":"חברות התעופה מאבדות נוסעים עסקיים, כי חברות רבות עוברות לפגישות בזום. איזה כוח מתחזק?","o":["יריבות פנימית בענף","איום מוצרים תחליפיים","איום כניסת מתחרים חדשים","כוח המיקוח של הספקים"],"a":1,"w":["זום אינו חברת תעופה – הוא מענף אחר.","","זום לא נכנס לענף התעופה.","זום אינו ספק של חברות התעופה."],"why":"מוצר מענף אחר שעונה על אותו צורך (פגישה) = תחליף."},{"id":"m2-14","q":"רשת הסופרמרקטים MegaMart מאיימת על יצרן הפסטה: ״אם לא תוריד מחיר, נשיק פסטה במותג פרטי משלנו״. איזה כוח מתואר?","o":["כוח המיקוח של הספקים – איום באינטגרציה לפנים","איום כניסת מתחרים חדשים","כוח המיקוח של הלקוחות – איום באינטגרציה לאחור","איום מוצרים תחליפיים"],"a":2,"w":["הרשת היא הלקוחה של היצרן, לא הספקית שלו.","העיקר הוא כוח המיקוח של לקוח גדול שמאיים לייצר בעצמו.","","פסטה במותג פרטי היא אותו מוצר, והאיום הוא של הלקוח עצמו."],"why":"לקוח שמאיים לייצר בעצמו את מה שקנה = אינטגרציה לאחור, שמחזקת את כוח הלקוחות."},{"id":"m2-15","q":"יצרנית הרחפנים SkyCam קונה מעבד מיוחד מספק אחד בעולם, ואין לו תחליף. הספק העלה מחיר ב-30%. איזה כוח חזק כאן ולמה?","o":["כוח הלקוחות – לקוחות מרוכזים","יריבות פנימית – הרבה מתחרים","כוח הספקים – ריכוזיות ספקים וחומר גלם קריטי","כוח הספקים – איום באינטגרציה לאחור"],"a":2,"w":["SkyCam היא הלקוחה, והיא חלשה כאן.","הסיפור עוסק בספק, לא במתחרים.","","אינטגרציה לאחור קשורה ללקוחות; ואין כאן איום כזה."],"why":"ספק יחיד (ריכוזיות) של רכיב קריטי שאין לו תחליף = כוח ספקים חזק."},{"id":"m2-16","q":"יצרנית נעלי הספורט StrideX, שמכרה עד היום רק דרך חנויות, פתחה אתר שמוכר ישירות לצרכנים. מבחינת החנויות, מה מחזק את כוחו של הספק?","o":["איום באינטגרציה לאחור","איום באינטגרציה לפנים","עלויות מעבר נמוכות של החנויות","ריבוי ספקים בענף"],"a":1,"w":["לאחור = הלקוח מייצר בעצמו. כאן הספק מתקדם לכיוון הצרכן.","","זה דווקא היה מחליש את הספק.","ריבוי ספקים מחליש את כוחם."],"why":"ספק שמוכר בעצמו ללקוח הסופי = אינטגרציה לפנים, שמחזקת את כוח הספקים."},{"id":"m2-17","q":"איזה מהבאים <b>מחזק</b> את כוח המיקוח של הלקוחות?","o":["יש אלפי לקוחות קטנים ומפוזרים","ללקוחות יש עלויות החלפה גבוהות","המוצר ייחודי ואין לו תחליף","הלקוחות מעטים וגדולים, וקל להם לעבור לספק אחר"],"a":3,"w":["לקוחות מפוזרים חלשים מול הספק.","עלות החלפה גבוהה קושרת את הלקוח – מחלישה אותו.","מוצר ייחודי מחליש את הלקוח.",""],"why":"לקוחות מרוכזים + עלויות החלפה נמוכות = כוח לקוחות חזק."},{"id":"m2-18","q":"ענף שבו כל חמשת הכוחות חזקים יהיה בדרך כלל:","o":["ענף אטרקטיבי עם רווחיות גבוהה","ענף עם תחרות נמוכה","ענף עם תחרות גבוהה ורווחיות נמוכה","ענף שבו אין חשיבות לחמשת הכוחות"],"a":2,"w":["כוחות חזקים לוחצים על הרווח – ההפך.","כוחות חזקים יוצרים תחרות גבוהה.","","המודל קובע שעוצמת הכוחות קובעת את הרווחיות."],"why":"המסקנה בקורס: עוצמת כוחות חזקה ← תחרות גבוהה ← רווחיות נמוכה."},{"id":"m2-19","q":"משקיע בוחר בין ארבעה ענפים. באיזה ענף פוטנציאל הרווחיות הגבוה ביותר לפי חמשת הכוחות?","o":["הרבה מתחרים, צמיחה איטית ועלויות מעבר נמוכות","מעט מתחרים, חסמי כניסה גבוהים, אין תחליפים טובים, ולקוחות וספקים מפוזרים","קל להיכנס, וספק אחד מספק את חומר הגלם הקריטי","לקוח אחד ענק קונה את רוב התוצרת ויכול לייצר בעצמו"],"a":1,"w":["זו יריבות חזקה – רווחיות נמוכה.","","איום כניסה חזק וספק חזק – רווחיות נמוכה.","כוח לקוחות חזק מאוד – רווחיות נמוכה."],"why":"כוחות חלשים = ענף אטרקטיבי עם רווחיות גבוהה."},{"id":"m2-20","q":"איזה מהבאים הוא מאפיין של <b>אוקיינוס כחול</b>?","o":["יצירת ביקוש חדש והפיכת המתחרים ללא רלוונטיים","ניצחון על המתחרים בשוק הקיים","ניצול הביקוש הקיים","בחירה בין ערך גבוה לעלות נמוכה"],"a":0,"w":["","זה אוקיינוס אדום.","זה אוקיינוס אדום.","באוקיינוס הכחול שוברים את שקלול התמורות הזה."],"why":"אוקיינוס כחול: נישה חדשה ללא מתחרים, ביקוש חדש, מתחרים לא רלוונטיים, שבירת שקלול ערך-עלות."},{"id":"m2-21","q":"שתי רשתות פיצה בעיר מורידות מחירים כל שבוע ומעתיקות זו את המבצעים של זו, כדי לקחת לקוחות זו מזו. באיזו אסטרטגיה מדובר?","o":["אוקיינוס כחול","מטריצת ERRC","מיפוי קבוצות אסטרטגיות","אוקיינוס אדום"],"a":3,"w":["אין כאן שוק חדש – זו מלחמה על הביקוש הקיים.","אין כאן ביטול, צמצום, הגבהה או יצירה של גורמים.","זה כלי ניתוח, לא תיאור של התחרות.",""],"why":"התחרות בשוק הקיים כדי לנצח את המתחרה על הביקוש הקיים = אוקיינוס אדום."},{"id":"m2-22","q":"סירק דו סוליי הוציאה מהמופע את כל מופעי החיות. איזו פעולה זו במטריצת ERRC?","o":["צמצום (Reduce)","הגבהה (Raise)","ביטול (Eliminate)","יצירה (Create)"],"a":2,"w":["צמצום = משאירים פחות. כאן הוציאו לגמרי.","הגבהה מעלה גורם, לא מוציאה אותו.","","יצירה מוסיפה גורם חדש."],"why":"גורם שהענף ראה כמובן מאליו והוצא לגמרי = ביטול."},{"id":"m2-23","q":"חברת התעופה SkyLow הציעה ארוחה קטנה בלבד בטיסה, הרבה פחות ממה שמקובל בענף. איזו פעולה זו ב-ERRC?","o":["ביטול (Eliminate)","הגבהה (Raise)","יצירה (Create)","צמצום (Reduce)"],"a":3,"w":["הארוחה לא בוטלה לגמרי – היא רק קטנה.","הגבהה = יותר מהמקובל, כאן פחות.","לא נוסף גורם חדש.",""],"why":"גורם שנשאר, אבל מתחת לרמה המקובלת בענף = צמצום."},{"id":"m2-24","q":"רשת חדרי הכושר FitLite הייתה הראשונה בענף שהציעה אפליקציה עם מאמן וירטואלי שמלווה כל מתאמן. איזו פעולה ב-ERRC?","o":["יצירה (Create)","הגבהה (Raise)","צמצום (Reduce)","ביטול (Eliminate)"],"a":0,"w":["","הגבהה מעלה גורם קיים; כאן הגורם לא היה קיים בענף.","לא הורידו דבר.","לא הוציאו דבר."],"why":"גורם שהענף מעולם לא הציע = יצירה."},{"id":"m2-25","q":"רשת המלונות SleepWell החליטה שהמיטות והמזרנים שלה יהיו באיכות גבוהה בהרבה מכל מלון אחר באותה רמת מחיר. איזו פעולה ב-ERRC?","o":["יצירה (Create)","ביטול (Eliminate)","צמצום (Reduce)","הגבהה (Raise)"],"a":3,"w":["מיטות קיימות בכל מלון – זה גורם קיים, לא חדש.","לא הוציאו גורם.","העלו את הרמה, לא הורידו.",""],"why":"גורם קיים בענף שמעלים מעל הרמה המקובלת = הגבהה."},{"id":"m2-26","q":"מה הכוונה ש״אוקיינוס כחול שובר את שקלול התמורות בין ערך לעלות״?","o":["החברה בוחרת להציע ערך גבוה במחיר גבוה","החברה בוחרת לחסוך בעלויות ולתת פחות ערך","החברה מפסיקה לחשב עלויות","החברה מעלה את הערך ללקוח ובו בזמן מורידה עלויות"],"a":3,"w":["זו בחירה בתוך שקלול התמורות – אוקיינוס אדום.","גם זו בחירה בתוך שקלול התמורות.","המשמעות היא להשיג גם ערך וגם עלות נמוכה, לא להתעלם מעלויות.",""],"why":"ביטול וצמצום מורידים עלות, הגבהה ויצירה מעלות ערך – ביחד משיגים את שניהם."},{"id":"m2-27","q":"יצרנית רכב מיפתה את כל המתחרים על מפה לפי מחיר ולפי מגוון דגמים, וגילתה שהיא נמצאת בעיגול אחד עם שתי חברות אחרות. מה המסקנה העיקרית?","o":["כל החברות במפה הן מתחרות באותה מידה","שתי החברות הן ספקיות שלה","שתי החברות שבאותו עיגול הן המתחרות הקרובות ביותר שלה","היא צריכה לבחור 3–5 גורמי הצלחה"],"a":2,"w":["המפה מראה שחברות בקבוצות אחרות פחות קרובות.","המפה עוסקת במתחרים, לא בספקים.","","זה KSF, לא מיפוי קבוצות אסטרטגיות."],"why":"חברות באותה קבוצה אסטרטגית נוקטות גישה דומה ולכן הן המתחרות הישירות."},{"id":"m2-28","q":"איזה כלי עוזר לחברה להבין את המיצוב התחרותי שלה ואת האפשרות לעבור מסגמנט אחד לאחר, בעזרת שני ממדים כמו מחיר ואיכות?","o":["PESTEL(G)","מיפוי קבוצות אסטרטגיות","חמשת הכוחות","מטריצת ERRC"],"a":1,"w":["PESTEL מנתח את הסביבה הרחבה, לא את מיקום המתחרים.","","חמשת הכוחות בודק את מבנה הענף כולו, לא ממקם חברות על מפה.","ERRC משמשת לבניית אוקיינוס כחול."],"why":"מפה של שני ממדים מבדילים, להבנת המיצוב והמעבר בין קבוצות = מיפוי קבוצות אסטרטגיות."},{"id":"m2-29","q":"מנכ״ל חברת משלוחי אוכל אומר: ״אנחנו מצוינים בעיצוב אריזות, ולכן זה ה-KSF שלנו״. אבל הלקוחות בענף מעריכים בעיקר מהירות. איזה מאפיין של KSF המנכ״ל שכח?","o":["KSF משתנים עם הזמן","מיקוד אסטרטגי – 3–5 גורמים","KSF מוכתבים מבחוץ – השוק והלקוחות קובעים אותם","KSF קשורים לספקים בלבד"],"a":2,"w":["הבעיה כאן היא מי קובע את ה-KSF, לא שינוי לאורך זמן.","הוא בחר גורם אחד; הבעיה היא שהלקוחות לא דורשים אותו.","","אין מאפיין כזה."],"why":"ה-KSF נקבעים לפי השוק והלקוחות, לא לפי מה שהארגון עצמו טוב בו."},{"id":"m2-30","q":"כמה גורמי מפתח להצלחה (KSF) מומלץ להגדיר, ולמה?","o":["לפחות 15, כדי לא לפספס אף גורם","אחד בלבד, כדי להיות ממוקד","כמה שהלקוחות רוצים, בלי הגבלה","3 עד 5, כדי לא לפזר משאבים"],"a":3,"w":["הרבה גורמים מפזרים משאבים – ההפך מהמלצת הקורס.","המלצה היא 3–5, לא אחד.","המאפיין הוא מיקוד אסטרטגי: 3–5 בלבד.",""],"why":"מאפיין המיקוד האסטרטגי: רק 3–5 גורמי מפתח מרכזיים."},{"id":"m2-31","q":"לפני 2007, בענף הטלפונים הניידים, עמידות וזמן סוללה היו הכי חשובים. אחרי האייפון, מערכת הפעלה, אפליקציות ומצלמה הפכו לחשובים יותר. איזה מאפיין של KSF זה מדגים?","o":["KSF משתנים עם הזמן בעקבות טכנולוגיה והעדפות צרכנים","KSF מוכתבים מבפנים על ידי הארגון","KSF קבועים לאורך כל חיי הענף","מיקוד אסטרטגי – 3–5 גורמים"],"a":0,"w":["","KSF מוכתבים מבחוץ, לא מבפנים.","הסיפור מראה בדיוק שהם השתנו.","הסיפור לא עוסק במספר הגורמים אלא בשינוי שלהם."],"why":"שינוי טכנולוגי ושינוי בהעדפות שינו את מה שחייבים להצטיין בו – KSF משתנים עם הזמן."},{"id":"m2-32","q":"איזה מהבאים <b>אינו</b> מאפיין של KSF לפי הקורס?","o":["הם מוכתבים מבחוץ, על ידי השוק והלקוחות","מומלץ להגדיר רק 3–5 מהם","הם יכולים להשתנות עם הזמן","הם ייחודיים לכל חברה ונקבעים על ידי ההנהלה לפי החוזקות שלה"],"a":3,"w":["זה מאפיין נכון של KSF.","זה מאפיין נכון של KSF.","זה מאפיין נכון של KSF.",""],"why":"KSF הם של הענף, משותפים לכל השחקנים, ונקבעים מבחוץ – לא לפי חוזקות החברה."},{"id":"m2-33","q":"איזה מהבאים <b>מחליש</b> את איום המוצרים התחליפיים?","o":["התחליף יקר בהרבה, פחות טוב, ומעבר אליו דורש עלות גבוהה","יש הרבה תחליפים זמינים בכל חנות","התחליף זול יותר ונותן ביצועים דומים","ללקוח אין שום עלות במעבר לתחליף"],"a":0,"w":["","זמינות מחזקת את האיום.","אטרקטיביות מחזקת את האיום.","עלות החלפה נמוכה מחזקת את האיום."],"why":"האיום מושפע מזמינות, אטרקטיביות ועלויות החלפה. תחליף לא אטרקטיבי עם עלות מעבר גבוהה = איום חלש."}],"tf":[{"id":"m2-t1","s":"ענף הוא קבוצת פירמות המציעות מוצרים או שירותים שהם תחליפים קרובים עבור קבוצת לקוחות.","a":true,"why":"זו הגדרת הענף בקורס."},{"id":"m2-t2","s":"ענף ושוק הם אותו מושג בדיוק.","a":false,"why":"הקורס מבחין ביניהם: ענף = המוכרים (חברות), שוק = הקונים (לקוחות)."},{"id":"m2-t3","s":"מודל PESTEL(G) ממפה 7 כוחות סביבתיים חיצוניים שמשפיעים על הענף.","a":true,"why":"פוליטי, כלכלי, חברתי, טכנולוגי, סביבתי, משפטי וגלובלי."},{"id":"m2-t4","s":"באות G במודל PESTEL(G) הכוונה ל-Government (ממשלה).","a":false,"why":"G = Globalization (גלובלי). הממשלה מופיעה בגורם הפוליטי."},{"id":"m2-t5","s":"אחת הביקורות על מודל PESTEL היא עלויות איסוף מידע גבוהות.","a":true,"why":"זו אחת משתי הביקורות בקורס, לצד איבוד רלוונטיות במציאות דינמית."},{"id":"m2-t6","s":"PESTEL הוא מבט מיקרו, ממוקד יותר ממודל חמשת הכוחות.","a":false,"why":"ההפך: PESTEL = מאקרו (מבט רחב), חמשת הכוחות = מיקרו (מבט ממוקד)."},{"id":"m2-t7","s":"קצב צמיחה איטי בענף מחזק את היריבות הפנימית.","a":true,"why":"כשהשוק לא גדל, חברה יכולה לגדול רק על חשבון מתחרים."},{"id":"m2-t8","s":"חסמי יציאה גבוהים מחלישים את היריבות הפנימית בענף.","a":false,"why":"חסמי יציאה גבוהים משאירים בענף חברות שנלחמות – היריבות מתחזקת."},{"id":"m2-t9","s":"יתרונות לגודל של החברות הקיימות מגבירים את איום הכניסה של מתחרים חדשים.","a":false,"why":"יתרון לגודל הוא חסם כניסה ולכן מחליש את האיום."},{"id":"m2-t10","s":"כוח המיקוח של הלקוחות מתחזק כשעלויות ההחלפה שלהם נמוכות.","a":true,"why":"כשקל לעבור לספק אחר, הלקוח יכול להכתיב מחיר."},{"id":"m2-t11","s":"איום באינטגרציה לפנים מחזק את כוח המיקוח של הספקים.","a":true,"why":"ספק שיכול למכור ישירות ללקוח הסופי מחזק את כוחו."},{"id":"m2-t12","s":"איום באינטגרציה לאחור הוא גורם שמחזק את כוח הספקים.","a":false,"why":"אינטגרציה לאחור היא איום של הלקוחות (לייצר בעצמם) ומחזקת את כוח הלקוחות."},{"id":"m2-t13","s":"עוצמת כוחות חזקה בענף מביאה לרווחיות גבוהה.","a":false,"why":"עוצמת כוחות חזקה מביאה לתחרות גבוהה ולרווחיות נמוכה."},{"id":"m2-t14","s":"ענף שבו הכוחות חלשים הוא ענף אטרקטיבי עם רווחיות גבוהה.","a":true,"why":"זו המסקנה של המודל."},{"id":"m2-t15","s":"מטרת אסטרטגיית אוקיינוס כחול היא לנצח את המתחרים בשוק הקיים.","a":false,"why":"זה אוקיינוס אדום. בכחול יוצרים נישה ללא מתחרים והופכים אותם ללא רלוונטיים."},{"id":"m2-t16","s":"אסטרטגיית אוקיינוס כחול שוברת את שקלול התמורות בין ערך לעלות.","a":true,"why":"היא מעלה ערך ומורידה עלות בו זמנית."},{"id":"m2-t17","s":"במטריצת ERRC, צמצום (Reduce) פירושו להוציא גורם מהמוצר לגמרי.","a":false,"why":"להוציא לגמרי = ביטול. צמצום = להשאיר מתחת לרמה המקובלת בענף."},{"id":"m2-t18","s":"יצירה (Create) במטריצת ERRC היא הוספת גורמים שהענף מעולם לא הציע.","a":true,"why":"זו ההגדרה של יצירה."},{"id":"m2-t19","s":"ביטול וצמצום מורידים בעיקר עלויות, והגבהה ויצירה מעלות בעיקר את הערך ללקוח.","a":true,"why":"כך שתי הקבוצות ביחד שוברות את שקלול הערך-עלות."},{"id":"m2-t20","s":"מיפוי קבוצות אסטרטגיות ממקם מתחרים לפי שני ממדים מבדילים, כמו מחיר מול איכות.","a":true,"why":"זו הגדרת הכלי בקורס."},{"id":"m2-t21","s":"חברות באותה קבוצה אסטרטגית הן בדרך כלל המתחרות הקרובות ביותר זו לזו.","a":true,"why":"הן נוקטות גישה תחרותית דומה."},{"id":"m2-t22","s":"גורמי מפתח להצלחה (KSF) נקבעים בעיקר על ידי הארגון עצמו, לפי החוזקות שלו.","a":false,"why":"KSF מוכתבים מבחוץ – על ידי השוק, דרישות הענף והלקוחות."},{"id":"m2-t23","s":"מומלץ להגדיר 10–15 גורמי מפתח להצלחה כדי לכסות את כל התחומים.","a":false,"why":"מומלץ רק 3–5, כדי לא לפזר משאבים."},{"id":"m2-t24","s":"גורמי המפתח להצלחה יכולים להשתנות בעקבות שינויים טכנולוגיים, רגולציה או העדפות צרכנים.","a":true,"why":"זה המאפיין השלישי: KSF משתנים עם הזמן."},{"id":"m2-t25","s":"מוצר תחליפי הוא מוצר של מתחרה מאותו ענף בדיוק.","a":false,"why":"מוצר מאותו ענף = יריבות פנימית. תחליף = מוצר מענף אחר שעונה על אותו צורך."}],"scope":[{"ref":"סיכום · עמ׳ 2","x":"הגדרת ענף והבחנה בין ענף לשוק","imp":1,"h":"הגדרת ענף (ענף מול שוק)"},{"ref":"סיכום · עמ׳ 2","x":"סביבת מאקרו – PESTEL(G)","imp":2,"h":"סביבת מאקרו: מודל PESTEL(G)"},{"ref":"סיכום · עמ׳ 2","x":"הביקורת על PESTEL","imp":1,"h":"הביקורת על מודל PESTEL"},{"ref":"סיכום · עמ׳ 2","x":"סביבת מיקרו – חמשת הכוחות של פורטר","imp":2,"h":"סביבת מיקרו: מודל חמשת הכוחות של פורטר"},{"ref":"סיכום · עמ׳ 2","x":"מה מחזק כל כוח","imp":2,"h":"מה מחזק כל אחד מחמשת הכוחות"},{"ref":"סיכום · עמ׳ 3","x":"מסקנה: עוצמת כוחות ורווחיות","imp":1,"h":"מסקנה: עוצמת הכוחות ורווחיות הענף"},{"ref":"סיכום · עמ׳ 3","x":"אוקיינוס כחול מול אוקיינוס אדום","imp":2,"h":"אסטרטגיית אוקיינוס כחול מול אוקיינוס אדום"},{"ref":"סיכום · עמ׳ 3","x":"מטריצת 4 הפעולות ERRC","imp":2,"h":"מטריצת 4 הפעולות (ERRC)"},{"ref":"סיכום · עמ׳ 3","x":"מיפוי קבוצות אסטרטגיות","imp":1,"h":"מיפוי קבוצות אסטרטגיות"},{"ref":"סיכום · עמ׳ 3","x":"גורמי מפתח להצלחה (KSF) ו-3 מאפייניהם","imp":2,"h":"גורמי מפתח להצלחה בענף (KSF)"}],"outScope":[]},{"id":"m3","title":"ניתוח סביבת הפירמה","short":"ניתוח פנימי","blurb":"מבט אל תוך החברה: שרשרת הערך של פורטר, גישת המשאבים (RBV) ומשאבים מוחשיים ולא מוחשיים, יכולת ליבה מול יכולת ייחודית, מודל VRIN, ומ-SWOT ל-TOWS.","mnemonic":"שרשרת הערך: “מקבלים, מייצרים, שולחים, מוכרים, מתקנים” = חמש העיקריות; התומכות = “תמ״פר” (תשתיות, משאבי אנוש, פיתוח טכנולוגי, רכש); בקצה החץ – שולי הרווח. RBV: “יש לי ← אני הכי טוב בזה אצלי ← אני טוב בזה מכולם ← אני מנצח”. VRIN: “ערך, נדיר, לא מעתיקים, אין תחליף”, ובכל “לא” לפי הסדר: חיסרון ← שוויון ← זמני ← לא מנוצל. TOWS: האות הראשונה = מה יש לי בפנים (S/W), השנייה = מה קורה בחוץ (O/T).","blocks":[{"t":"h","x":"מבט פנימה: על מה היחידה"},{"t":"p","x":"ביחידה 2 הסתכלנו <b>החוצה</b>, על הענף והסביבה. ביחידה 3 מסתכלים <b>פנימה</b>, אל תוך הפירמה עצמה. השאלה המרכזית: <b>איפה החברה יוצרת ערך, ומה יש לה שאין למתחרים?</b>"},{"t":"list","x":["<b>שרשרת הערך</b> (Value Chain) – באילו פעילויות נוצר הערך ואיפה אפשר לחסוך.","<b>גישת המשאבים</b> (RBV) – איך משאבים הופכים ליכולת ליבה, ליכולת ייחודית וליתרון תחרותי; משאבים מוחשיים מול לא מוחשיים.","<b>מודל VRIN</b> – האם המשאב נותן יתרון תחרותי <b>בר-קיימא</b>.","<b>SWOT ו-TOWS</b> – מחברים את הפנים (חוזקות וחולשות) עם החוץ (הזדמנויות ואיומים), וגוזרים מזה אסטרטגיות פעולה."]},{"t":"h","x":"מודל שרשרת הערך של פורטר (Value Chain)"},{"t":"p","x":"<b>שרשרת הערך</b> של מייקל פורטר מפרקת את הפירמה ל<b>פעילויות פנימיות</b>. לכל פעילות שואלים: כמה ערך היא מוסיפה ללקוח, וכמה היא עולה לנו? כך מזהים <b>מקורות ליצירת ערך</b> ו<b>מקומות לחיסכון בעלויות</b>."},{"t":"p","x":"הפעילויות מתחלקות לשתי קבוצות. <b>פעילויות עיקריות</b> (Primary, בסיכום נקראות גם <b>פעילויות ליבה</b>): המוצר “עובר” דרכן בדרך ללקוח. <b>פעילויות תומכות</b> (Support): לא נוגעות במוצר עצמו, אלא עוזרות לכל הפעילויות העיקריות לעבוד. בתרשים הן מופיעות כפס רחב מתחת לעיקריות, עם חיצים כלפי מעלה – כי הן תומכות בכולן."},{"t":"table","head":["סוג","פעילות","מה עושים בה","דוגמה"],"rows":[["עיקרית","<b>לוגיסטיקה נכנסת</b> (Inbound Logistics)","קבלת חומרי גלם מהספקים, בדיקה, אחסון וניהול מלאי","מחסן הקמח של מאפייה תעשייתית"],["עיקרית","<b>תפעול</b> (Operations)","הפיכת חומרי הגלם למוצר, או ביצוע השירות עצמו","פס הייצור במפעל; הטיסה עצמה בחברת תעופה"],["עיקרית","<b>לוגיסטיקה יוצאת</b> (Outbound Logistics)","אחסון המוצר המוגמר והפצתו ללקוחות","משאיות שמפיצות לחם לסופרמרקטים"],["עיקרית","<b>שיווק ומכירות</b> (Marketing & Sales)","פרסום, מיתוג, תמחור, אנשי מכירות","קמפיין ברשתות החברתיות"],["עיקרית","<b>שירות</b> (Service)","שירות לאחר המכירה: התקנה, תיקונים, אחריות, תמיכה","טכנאי שמתקן מכונת כביסה אצל הלקוח"],["תומכת","<b>תשתיות / אדמיניסטרציה</b> (Firm Infrastructure)","הנהלה, כספים, משפטים, תכנון, מערכות ניהול","מחלקת הכספים והייעוץ המשפטי"],["תומכת","<b>ניהול משאבי אנוש</b> (HRM)","גיוס, הכשרה, שכר ותגמול, פיתוח עובדים","קורס הכשרה לנציגי שירות"],["תומכת","<b>פיתוח טכנולוגי</b> (Technology Development)","מו״פ, פיתוח מערכות, שיפור תהליכים וטכנולוגיה","מעבדת פיתוח של מוצר חדש"],["תומכת","<b>רכש</b> (Procurement)","בחירת ספקים, משא ומתן, חוזים וקנייה של תשומות","חוזה שנתי עם ספק חומרי גלם"]]},{"t":"p","x":"<b>שולי הרווח</b> (Margin) נמצאים בקצה החץ של המודל. הם ה<b>הפרש</b> בין הערך הכולל שהחברה יוצרת (מה שהלקוח מוכן לשלם) לבין העלות של ביצוע כל הפעילויות. יש רק שתי דרכים להגדיל אותם: <b>להעלות את הערך</b> בעיני הלקוח (כיוון של בידול), או <b>להוריד את העלות</b> של הפעילויות (כיוון של מנהיגות בעלות). זה בדיוק הקשר ליחידה 4."},{"t":"steps","x":["שאלו: האם הפעילות נוגעת במוצר בדרך ללקוח? <b>מקבלים ← מייצרים ← שולחים ← מוכרים ← מתקנים</b>. אם כן – עיקרית.","אם הפעילות היא <b>הנהלה וכספים</b>, <b>אנשים</b> (גיוס, הכשרה), <b>טכנולוגיה ומו״פ</b> או <b>קנייה מספקים</b> – היא תומכת. זכרו: <b>“תמ״פר”</b> = תשתיות, משאבי אנוש, פיתוח טכנולוגי, רכש.","כדי לשפר את שולי הרווח, שואלים לגבי כל פעילות: אפשר לעשות אותה זול יותר? אפשר שתוסיף יותר ערך ללקוח?"],"title":"איך מסווגים פעילות"},{"t":"example","x":"רשת הפיצות PizzaGo: מקבלת קמח וגבינות למחסן המרכזי ← <b>לוגיסטיקה נכנסת</b>. מכינה ואופה את הפיצות ← <b>תפעול</b>. שליחים מביאים את הפיצה הביתה ← <b>לוגיסטיקה יוצאת</b>. מבצע “1+1” באפליקציה ← <b>שיווק ומכירות</b>. מחזירה כסף על פיצה קרה ← <b>שירות</b>. חתימה על חוזה עם מחלבה ← <b>רכש</b>. קורס לשליחים חדשים ← <b>משאבי אנוש</b>. פיתוח האפליקציה ← <b>פיתוח טכנולוגי</b>. הנהלת חשבונות ← <b>תשתיות</b>.","title":"פעילויות ברשת פיצה"},{"t":"trap","x":"שלושה בלבולים קבועים: (1) <b>רכש מול לוגיסטיקה נכנסת</b> – לבחור ספק, לסגור מחיר ולחתום = רכש (תומכת); לקבל את הסחורה, לאחסן ולנהל מלאי = לוגיסטיקה נכנסת (עיקרית). (2) <b>הכשרת אנשי שירות</b> היא משאבי אנוש (תומכת); <b>התיקון עצמו</b> אצל הלקוח הוא שירות (עיקרית). (3) <b>מו״פ</b> הוא תמיד פיתוח טכנולוגי (תומכת), גם בחברת הייטק שבה הוא הכי חשוב. ועוד: “פעילויות ליבה” בשרשרת הערך = הפעילויות העיקריות. זה <b>לא</b> “יכולת ליבה” של RBV."},{"t":"exam","x":"איך שואלים: סיפור קצר ← “איזו פעילות היא תומכת?” / “לאיזו פעילות שייך X?” / “מה מהבאים <b>אינו</b> פעילות עיקרית?”. או שאלת הגדרה: “מהם שולי הרווח?” (ההפרש בין הערך שנוצר לעלות הפעילויות) ו“מה מטרת המודל?” (לזהות מקורות ערך וחיסכון בעלויות בתוך הארגון)."},{"t":"h","x":"גישת המשאבים (RBV) ושרשרת היתרון"},{"t":"p","x":"<b>גישת המשאבים</b> (RBV – Resource-Based View) אומרת: היתרון התחרותי <b>נגזר מבפנים</b>, מבסיס המשאבים של הפירמה. זה ההפך מגישה חיצונית כמו חמשת הכוחות, שמחפשת את מקור הרווח במבנה הענף. שתי חברות באותו ענף יכולות להצליח אחרת לגמרי, כי יש להן משאבים שונים."},{"t":"p","x":"לפי הסיכום, היתרון נבנה כ<b>שרשרת של ארבע חוליות</b>. כל חוליה נבנית על הקודמת:"},{"t":"steps","x":["<b>משאבים</b> (Resources) – מה שיש לחברה: מוחשיים ולא מוחשיים (כסף, מפעל, פטנטים, ידע, מוניטין).","<b>יכולת ליבה</b> (Core Competence) – הפעולה שהחברה עושה <b>הכי טוב מבין כל מה שהיא עושה</b>. משווים אותה ל<b>יכולות האחרות של החברה עצמה</b>.","<b>יכולת ייחודית</b> (Distinctive Competence) – פעולה שהחברה עושה <b>טוב יותר מהמתחרים</b>. כאן משווים <b>החוצה</b>.","<b>יתרון תחרותי</b> (Competitive Advantage) – התוצאה: החברה מצליחה יותר מהמתחרים בענף."],"title":"השרשרת: משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי"},{"t":"example","x":"בית הקלייה RoastLab: יש לו מכונות קלייה, כסף ובריסטה עם 20 שנות ניסיון (<b>משאבים</b>). מכל מה שהוא עושה, הוא הכי טוב בהתאמת פרופיל קלייה לכל זן (<b>יכולת ליבה</b>). בדיקות טעימה עיוורות מראות שאף בית קלייה בעיר לא מגיע לרמה שלו (<b>יכולת ייחודית</b>). לכן בתי קפה מוכנים לשלם לו יותר ולחתום איתו לטווח ארוך (<b>יתרון תחרותי</b>).","title":"שרשרת RBV בבית קלייה"},{"t":"trap","x":"הסדר קבוע: <b>משאבים ← ליבה ← ייחודית ← יתרון</b>. מסיחים נפוצים מחליפים בין ליבה לייחודית, או שמים את היתרון לפני היכולות. ושימו לב: RBV = <b>פנים</b>. אם הסיפור מסביר את ההצלחה במבנה הענף, בחסמי כניסה או ברגולציה – זו גישה חיצונית, לא RBV."},{"t":"exam","x":"איך שואלים: “מה הסדר הנכון בשרשרת של גישת המשאבים?”, “חברה טוענת שההצלחה שלה נובעת מהידע והפטנטים שלה – איזו גישה זו?” (RBV), ובנכון/לא נכון: “לפי RBV היתרון נגזר מהסביבה החיצונית” – לא נכון."},{"t":"h","x":"משאבים מוחשיים ולא מוחשיים"},{"t":"p","x":"<b>משאב</b> הוא כל קלט שנכנס לתהליך הייצור של הפירמה: הון, ציוד, כישורי עובדים, פטנטים, כישורי ניהול ועוד. בקורס מחלקים את המשאבים לשני צדדים, ובכל צד ארבעה סוגים:"},{"t":"table","head":["צד","סוג המשאב","מה כולל","דוגמה בסיפור"],"rows":[["<b>מוחשי</b>","<b>פיננסי</b>","מקורות אשראי, הון עצמי","לחברה קו אשראי גדול מהבנק ומזומנים בקופה"],["<b>מוחשי</b>","<b>ארגוני</b>","מנגנוני בקרה ותיאום, מנגנוני תכנון ופיקוח","מערכת תכנון תקציב ומנגנון בקרת איכות מסודר"],["<b>מוחשי</b>","<b>פיזי</b>","מפעלים ומבנים, מכונות וציוד, קרקעות וחומרי גלם","מפעל אוטומטי, צי משאיות, מכרה"],["<b>מוחשי</b>","<b>טכנולוגי</b>","פטנטים, סימנים רשומים, זכויות יוצרים, סודות מקצועיים","פטנט על תרופה, נוסחה סודית רשומה"],["<b>לא מוחשי</b>","<b>אנושי</b>","ידע, ניסיון, אמון, כישורי ניהול, תרבות ארגונית","צוות מנוסה ותרבות של שיתוף ואמון"],["<b>לא מוחשי</b>","<b>חדשנות</b>","רעיונות, כישורים מדעיים, יכולות חדשנות","מדענים שמייצרים כל הזמן רעיונות למוצרים"],["<b>לא מוחשי</b>","<b>מוניטין</b>","תדמית בעיני לקוחות וספקים: מותג, מיצוב, מיתוס, תפיסת האיכות","לקוחות מאמינים שהמותג הוא הכי איכותי"],["<b>לא מוחשי</b>","<b>קשרים חיצוניים</b>","קשרים עם גורמי מפתח בענף","קשר קרוב של המנכ״ל עם הרגולטור והספקים הגדולים"]]},{"t":"list","x":["<b>כלל אצבע:</b> מוחשי = אפשר לספור, לרשום או להחזיק במסמך (כסף, מבנה, מכונה, נוהל, רישום פטנט).","לא מוחשי = נמצא <b>בראש של אנשים</b>: בידע של העובדים, ברעיונות, בתדמית אצל הלקוחות ובקשרים."]},{"t":"example","x":"חברת המשקאות FizzUp: יש לה מפעל ביקום (<b>מוחשי – פיזי</b>), נוסחה רשומה ומוגנת (<b>מוחשי – טכנולוגי</b>), הלוואה מהבנק (<b>מוחשי – פיננסי</b>), מערכת בקרת איכות (<b>מוחשי – ארגוני</b>), מותג שהצעירים אוהבים (<b>לא מוחשי – מוניטין</b>), צוות טועמים מנוסה (<b>לא מוחשי – אנושי</b>), מעבדה שממציאה טעמים (<b>לא מוחשי – חדשנות</b>) וקשרים עם רשתות השיווק הגדולות (<b>לא מוחשי – קשרים חיצוניים</b>).","title":"סיווג משאבים"},{"t":"trap","x":"בטבלה של הקורס, <b>פטנטים, סימנים רשומים, זכויות יוצרים וסודות מקצועיים</b> נמצאים בצד ה<b>מוחשי</b> (משאבים טכנולוגיים), למרות שאי אפשר לגעת בהם. יש ספרים שמסווגים אותם אחרת, אבל במבחן הולכים לפי הטבלה. עוד בלבול: <b>מנגנוני בקרה ותכנון</b> = מוחשי ארגוני, אבל <b>תרבות ארגונית</b> = לא מוחשי אנושי. ו<b>מותג</b> = מוניטין = לא מוחשי."},{"t":"exam","x":"איך שואלים: “לאיזה סוג משאב שייך X?” (שני שלבים: קודם מוחשי או לא מוחשי, ואז איזה מבין הארבעה), או “מה מהבאים הוא משאב לא מוחשי?”. בנכון/לא נכון אוהבים לשאול על פטנט, מותג ותרבות ארגונית."},{"t":"h","x":"יכולת ליבה מול יכולת ייחודית"},{"t":"p","x":"<b>יכולת ליבה</b> (Core Competence) – לפי הסיכום: הפעולה שהפירמה עושה <b>טוב יותר מכל היכולות הפנימיות האחרות שלה</b>. היא לא תלויה בגורמים מחוץ לפירמה, ובדרך כלל יש לכל פירמה <b>יכולת ליבה אחת</b>. ההשוואה היא <b>פנימית</b>: “במה אנחנו הכי טובים?”."},{"t":"p","x":"<b>יכולת ייחודית</b> (Distinctive Competence) – פעולה שהפירמה עושה <b>טוב יותר מהמתחרות שלה</b>. ההשוואה היא <b>חיצונית</b>: “במה אנחנו טובים מכולם?”. יכולת ייחודית היא שלב אחד לפני יתרון תחרותי."},{"t":"table","head":["","יכולת ליבה","יכולת ייחודית"],"rows":[["מול מי משווים","מול <b>היכולות האחרות של החברה עצמה</b>","מול <b>המתחרים</b> בענף"],["השאלה","“מה אנחנו עושים הכי טוב?”","“מה אנחנו עושים טוב יותר מכולם?”"],["כמה יש","בדרך כלל אחת","לא לכל חברה יש"],["המקום בשרשרת RBV","חוליה שנייה (אחרי משאבים)","חוליה שלישית (לפני יתרון תחרותי)"],["דוגמה","מאפייה שהדבר הכי חזק אצלה הוא עמידה בזמני משלוח","המאפייה היחידה בעיר שמספקת תוך שעה, ואף מתחרה לא מצליח להתקרב"]]},{"t":"example","x":"לחברת ההובלות MoveIt יש כמה תחומים: אריזה, הובלה ושירות לקוחות. הכי טוב אצלה זה האריזה ← <b>יכולת ליבה</b>. אבל אם גם למתחרים יש אריזה טובה באותה רמה, זו <b>לא</b> יכולת ייחודית. רק אם האריזה שלה טובה יותר משל כל המתחרים (למשל אפס נזקים, כשאצל האחרים 3%) – היא גם <b>יכולת ייחודית</b>.","title":"ליבה, אבל לא בהכרח ייחודית"},{"t":"trap","x":"יכולת ליבה <b>לא מבטיחה</b> עדיפות על המתחרים – אפשר להיות “הכי טובים אצלנו” ועדיין בינוניים בענף. מילים כמו “טוב יותר מהמתחרים”, “אף מתחרה לא מגיע לרמה” ← <b>ייחודית</b>. מילים כמו “הדבר שהחברה עושה הכי טוב”, “החוזקה המרכזית שלה” ← <b>ליבה</b>. ואל תבלבלו עם <b>KSF</b> (יחידה 2): KSF הוא מה ש<b>הענף</b> דורש מכל מי שרוצה להצליח בו, לא יכולת של חברה מסוימת."},{"t":"exam","x":"איך שואלים: “לפי הסיכום, מהי יכולת ליבה?” / “מה ההבדל בין יכולת ליבה ליכולת ייחודית?” (מול מי משווים). או סיפור ← “האם זו יכולת ליבה או ייחודית?”. בנכון/לא נכון: “יכולת ליבה נמדדת מול המתחרים” – לא נכון."},{"t":"h","x":"מודל VRIN – האם היתרון בר-קיימא?"},{"t":"p","x":"<b>מודל VRIN</b> (על בסיס עבודתו של ג׳יי בארני, Barney) בודק אם משאב או יכולת יכולים לתת <b>יתרון תחרותי בר-קיימא</b> – כזה שמחזיק לאורך זמן. בודקים ארבעה קריטריונים, <b>לפי הסדר</b>. בכל שלב שבו התשובה היא “לא”, המודל אומר מה תהיה התוצאה:"},{"t":"table","head":["אות","קריטריון","השאלה","אם התשובה “לא” – התוצאה"],"rows":[["<b>V</b>","<b>בעל ערך</b> (Valuable)","האם המשאב עוזר לנצל הזדמנות, להתגונן מאיום או ליצור ערך ללקוח?","<b>חיסרון תחרותי</b> – המשאב לא עוזר ואולי רק עולה כסף"],["<b>R</b>","<b>נדיר</b> (Rare)","האם רק לנו (או למעט מאוד חברות) יש אותו?","<b>שוויון תחרותי</b> – גם למתחרים יש, אז אנחנו רק “בגובה” שלהם"],["<b>I</b>","<b>קשה לחיקוי</b> (Inimitable)","האם יהיה למתחרים קשה ויקר להעתיק אותו?","<b>יתרון תחרותי זמני</b> – עד שיעתיקו"],["<b>N</b>","<b>בלתי ניתן להחלפה</b> (Non-substitutable)","האם אין משאב <b>אחר</b> שמשיג אותה תוצאה?","<b>יתרון תחרותי לא מנוצל</b> – קיים תחליף, ולכן אי אפשר להפיק מהיתרון את מלוא הערך"],["✓","<b>כן לכל הארבעה</b>","—","<b>יתרון תחרותי בר-קיימא</b>"]]},{"t":"steps","x":["מתחילים ב-<b>V</b> וממשיכים לפי הסדר: V ← R ← I ← N.","עוצרים ב<b>“לא” הראשון</b>. התוצאה שמתחת לאותו קריטריון היא התשובה.","רק אם עברנו את כל הארבעה עם “כן” – יש <b>יתרון תחרותי בר-קיימא</b>."],"title":"איך פותרים שאלת VRIN"},{"t":"list","x":["<b>“לכל המתחרים יש”, “אפשר לקנות את זה מכל ספק”</b> ← לא נדיר ← שוויון תחרותי.","<b>“תוך חצי שנה המתחרה העתיק”</b> ← קל לחיקוי ← יתרון זמני.","<b>“הלקוחות יכולים להשיג אותה תוצאה בדרך אחרת”</b> ← יש תחליף ← יתרון לא מנוצל.","<b>“הלקוחות לא מעריכים את זה בכלל”</b> ← אין ערך ← חיסרון תחרותי."]},{"t":"example","x":"חברת הביטוח SafeNet בנתה צ׳אט-בוט שעונה ללקוחות. זה <b>בעל ערך</b> (חוסך זמן), אבל כל חברות הביטוח קנו בוט דומה מאותו ספק ← <b>לא נדיר</b> ← <b>שוויון תחרותי</b>. לעומת זאת, חברת השוקולד ChocoAlp: מתכון בן מאה שנה (ערך), אין לאף אחד אחר (נדיר), מוגן וסודי ותלוי במומחיות שנבנתה דורות (קשה לחיקוי), ואין מוצר אחר שנותן ללקוחות את אותה חוויה (אין תחליף) ← <b>יתרון תחרותי בר-קיימא</b>.","title":"שתי תוצאות שונות"},{"t":"trap","x":"בקורס הזה המודל הוא <b>VRIN</b>, וה-N הוא <b>Non-substitutable</b> (בלתי ניתן להחלפה) – לא O של Organization כמו ב-VRIO. ה-I הוא <b>Inimitable</b> (קשה לחיקוי) – לא Innovation. ההבדל בין I ל-N: <b>חיקוי</b> = המתחרה משיג <b>אותו משאב</b>; <b>תחליף</b> = המתחרה משיג <b>אותה תוצאה במשאב אחר</b>. ועוד: “לא נדיר” נותן <b>שוויון</b>, לא חיסרון. חיסרון יש רק כשאין ערך בכלל."},{"t":"exam","x":"איך שואלים: סיפור על משאב ← “מה התוצאה לפי VRIN?” (חיסרון / שוויון / זמני / לא מנוצל / בר-קיימא). או “מה מייצגת האות N?”. בנכון/לא נכון: “משאב בעל ערך שאינו נדיר נותן יתרון זמני” – לא נכון (שוויון)."},{"t":"h","x":"מודל SWOT"},{"t":"p","x":"<b>SWOT</b> ממפה ארבעה סוגי גורמים. השאלה הראשונה היא תמיד: האם הגורם <b>בשליטת החברה</b> (פנימי) או <b>בסביבה</b> (חיצוני)?"},{"t":"table","head":["","חיובי","שלילי"],"rows":[["<b>פנימי</b> (בתוך החברה)","<b>S – חוזקות</b> (Strengths): במה אנחנו טובים? במה אנחנו טובים יותר מחברות אחרות?","<b>W – חולשות</b> (Weaknesses): מה החסרונות שלנו? איפה נקודות התורפה?"],["<b>חיצוני</b> (בסביבה)","<b>O – הזדמנויות</b> (Opportunities): כל מצב בחוץ שיכול להגדיל את הרווחיות","<b>T – איומים</b> (Threats): כל מצב בחוץ שעלול לפגוע ברווחיות"]]},{"t":"p","x":"בסיכום יש גם <b>שקף יישום</b>: מה עושים עם כל רכיב אחרי שמיפינו אותו. במרכז עומדים <b>המשאבים והיכולות</b> של החברה, והם “משחקים” מול ההזדמנויות ומול האיומים."},{"t":"table","head":["רכיב","מה עושים איתו"],"rows":[["<b>חוזקה</b>","הופכים אותה ל<b>יכולת ליבה</b>, וממנה ל<b>יתרון תחרותי בר-קיימא</b>"],["<b>חולשה</b>","<b>מבטלים</b> אותה, או <b>הופכים אותה לחוזקה</b>"],["<b>הזדמנות</b>","<b>מנצלים</b> אותה בעזרת חוזקה"],["<b>איום</b>","<b>מסמנים אותו כמגבלה</b> (ונערכים), או <b>הופכים אותו להזדמנות</b>"]]},{"t":"example","x":"רשת חדרי הכושר FitZone: מאמנים מוכרים ואהובים (<b>S</b>), מכשירים ישנים בחלק מהסניפים (<b>W</b>), עלייה במודעות לבריאות אחרי הקורונה (<b>O</b>), רשת בינלאומית זולה שנכנסת לעיר (<b>T</b>).","title":"SWOT לחדר כושר"},{"t":"trap","x":"חוק חדש, מתחרה חדש, ריבית, מגמה בציבור, מלחמה – תמיד <b>חיצוניים</b> (O או T), גם אם הם פוגעים מאוד בחברה. מותג, עובדים, טכנולוגיה, מבנה העלויות של החברה – תמיד <b>פנימיים</b> (S או W). השאלה היא לא “טוב או רע” אלא “בפנים או בחוץ”."},{"t":"exam","x":"איך שואלים: “איזה מהגורמים הוא איום (T)?”, “מה מהבאים הוא חולשה ולא איום?”, “לפי שקף היישום, מה עושים עם חולשה?” (מבטלים או הופכים לחוזקה)."},{"t":"h","x":"מודל TOWS – מ-SWOT לאסטרטגיות"},{"t":"p","x":"SWOT רק <b>ממפה</b>. <b>TOWS</b> לוקח את אותם ארבעה רכיבים ו<b>גוזר מהם אסטרטגיות פעולה</b> בעזרת <b>הצלבה</b>: כל גורם פנימי (S או W) נפגש עם גורם חיצוני (O או T). מתקבלת טבלה של ארבעה תאים:"},{"t":"table","head":["","חוזקות (S)","חולשות (W)"],"rows":[["<b>הזדמנויות (O)</b>","<b>SO</b>: משתמשים בחוזקות כדי לנצל הזדמנויות","<b>WO</b>: מנצלים הזדמנויות כדי להתגבר על חולשות"],["<b>איומים (T)</b>","<b>ST</b>: משתמשים בחוזקות כדי להתמודד עם איומים","<b>WT</b>: מצמצמים חולשות ומתגוננים מפני איומים"]]},{"t":"table","head":["תא","ההיגיון","אופי","דוגמה קצרה"],"rows":[["<b>SO</b>","חוזקה + הזדמנות = מנוף לצמיחה","התקפי (Maxi-Maxi)","מותג חזק + ביקוש גובר בחו״ל ← יציאה לשווקים חדשים"],["<b>WO</b>","הזדמנות בחוץ עוזרת לתקן חולשה בפנים","שיפור (Mini-Maxi)","מערכות מיושנות + מענק ממשלתי לדיגיטציה ← שדרוג המערכות"],["<b>ST</b>","חוזקה משמשת מגן מול איום","הגנה בעזרת כוח (Maxi-Mini)","קופת מזומנים גדולה + מתחרה זול נכנס ← מבצע נאמנות ממומן"],["<b>WT</b>","חולשה פוגשת איום – הכי מסוכן","הגנתי (Mini-Mini)","חוב גבוה + מיתון ← צמצום, מיזוג או יציאה מתחום"]]},{"t":"steps","x":["רושמים את ה-SWOT ו<b>ממספרים</b> כל פריט: S1, S2… W1… O1… T1…","בונים טבלה: <b>למעלה</b> הגורמים הפנימיים (S, W), <b>בצד</b> החיצוניים (O, T).","לכל תא מחפשים <b>צירוף הגיוני</b>: גורם פנימי אחד או יותר + גורם חיצוני אחד או יותר.","מנסחים מהצירוף <b>פעולה</b> (לא עוד תיאור מצב), ומציינים את הקודים, למשל “S2 + O1”.","נותנים לאסטרטגיה <b>שם</b> (צמיחה, התייעלות, חסמי כניסה, חדשנות…)."],"title":"איך בונים TOWS מתוך SWOT"},{"t":"p","x":"<b>דוגמת הסיכום – בנק הבינלאומי.</b> ה-SWOT של הבנק: <b>חוזקות</b> – מעמד חזק בשוק המקומי (S1), איתנות פיננסית (S2), דירוג אשראי טוב ויציב (S3), כוח לוביסטי (S4), רשת סניפים רחבה (S5). <b>חולשות</b> – אין בידול (W1), יעילות תפעולית נמוכה (W2), מוניטין לא טוב (W3), תשתית טכנולוגית סטנדרטית (W4). <b>הזדמנויות</b> – צמיחה בנדל״ן (O1), רכישת נכסים בחו״ל (O2), רפורמה במערכת הבנקאות (O3), השקעה בענף היהלומים (O4). <b>איומים</b> – ריבית אפס (T1), רגולציה (T2), לקוחות שעוברים בין בנקים (T3), בנקאות חברתית (T4)."},{"t":"table","head":["תא","הצירוף","האסטרטגיה שנגזרה"],"rows":[["<b>SO</b>","איתנות פיננסית (S2) + צמיחת הנדל״ן (O1) + השקעה ביהלומים (O4)","<b>צמיחה בהגוונה</b>: להשתמש בכסף החזק כדי להיכנס לתחומים חדשים וצומחים"],["<b>WO</b>","השקעה ביהלומים (O4) ← הכנסות גבוהות יותר ← תיקון היעילות הנמוכה (W2)","<b>הגברת היעילות התפעולית</b>: הכסף מההזדמנות מממן ייעול"],["<b>ST</b>","כוח לוביסטי (S4) מול בנקאות חברתית (T4)","<b>הגדלת חסמי הכניסה</b>: לפעול לחקיקה שתגביל את התחזקות הבנקים החברתיים"],["<b>WT</b>","תשתית טכנולוגית (W4) ומוניטין (W3) מול מעבר לקוחות בין בנקים (T3)","<b>חדשנות</b>: לשדרג טכנולוגיה ומוניטין כדי שלקוחות לא יעזבו"]]},{"t":"trap","x":"<b>SWOT ≠ TOWS</b>: SWOT = רשימת גורמים; TOWS = אסטרטגיות מהצלבה. בשם התא, האות הראשונה היא תמיד הפנימית (S/W) והשנייה החיצונית (O/T). <b>WO</b> לא משתמש בחוזקה – הוא משתמש בהזדמנות כדי לתקן חולשה. <b>ST</b> לא מנצל הזדמנות – הוא משתמש בחוזקה כדי להתגונן. ואין תאים כמו “SW” או “OT”: כל אסטרטגיה מצליבה פנים עם חוץ."},{"t":"exam","x":"איך שואלים: סיפור על צעד של חברה ← “לאיזה תא ב-TOWS הוא שייך?”. כדי לפתור: (1) מצאו את הגורם הפנימי – חוזקה או חולשה? (2) מצאו את הגורם החיצוני – הזדמנות או איום? (3) חברו את האותיות. ובשאלות על הבנק: הגדלת חסמי כניסה = ST, צמיחה בהגוונה = SO, התייעלות = WO, חדשנות = WT."}],"cheat":["שרשרת הערך = מודל פנימי של פורטר: איפה נוצר ערך ואיפה אפשר לחסוך","פעילויות עיקריות (ליבה) = לוגיסטיקה נכנסת, תפעול, לוגיסטיקה יוצאת, שיווק ומכירות, שירות","פעילויות תומכות (“תמ״פר”) = תשתיות/אדמיניסטרציה, משאבי אנוש, פיתוח טכנולוגי, רכש","שולי הרווח = הערך הכולל שנוצר פחות עלות ביצוע הפעילויות","רכש מול לוגיסטיקה נכנסת = חוזה וקנייה (תומכת) מול קבלה ואחסון (עיקרית)","מו״פ = פיתוח טכנולוגי = תומכת, תמיד","RBV = היתרון נגזר מבסיס המשאבים הפנימי של הפירמה","שרשרת RBV = משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי","משאב = קלט שנכנס לתהליך הייצור (הון, ציוד, כישורים, פטנטים)","מוחשיים = פיננסיים, ארגוניים, פיזיים, טכנולוגיים","לא מוחשיים = אנושיים, חדשנות, מוניטין, קשרים חיצוניים","פטנט, סימן רשום, זכויות יוצרים, סוד מקצועי = מוחשי טכנולוגי (לפי טבלת הקורס)","מנגנוני בקרה ותכנון = מוחשי ארגוני; תרבות ארגונית = לא מוחשי אנושי","מותג, מיצוב, תפיסת איכות = מוניטין = לא מוחשי","יכולת ליבה = מה שהפירמה עושה הכי טוב מבין יכולותיה; לרוב אחת","יכולת ייחודית = מה שהפירמה עושה טוב יותר מהמתחרים","VRIN = Valuable, Rare, Inimitable, Non-substitutable","לא בעל ערך = חיסרון תחרותי","לא נדיר = שוויון תחרותי","קל לחיקוי = יתרון תחרותי זמני","יש תחליף = יתרון תחרותי לא מנוצל","כן לכל הארבעה = יתרון תחרותי בר-קיימא","חיקוי = אותו משאב; תחליף = משאב אחר עם אותה תוצאה","SWOT = S, W פנימיים; O, T חיצוניים","יישום SWOT = חוזקה ← יכולת ליבה; חולשה ← לבטל; הזדמנות ← לנצל בחוזקה; איום ← מגבלה או הזדמנות","TOWS = גזירת אסטרטגיות מהצלבת פנים וחוץ","SO = חוזקה מנצלת הזדמנות (התקפי)","WO = הזדמנות מתקנת חולשה","ST = חוזקה מגינה מפני איום","WT = צמצום חולשות והתגוננות מאיומים (הגנתי)"],"mcq":[{"id":"m3-1","q":"חברת האופניים GreenBike מקבלת שלדות מספק ומאחסנת אותן, מרכיבה את האופניים במפעל, מתקנת אופניים ללקוחות במסגרת האחריות, ומגייסת ומכשירה מכונאים חדשים. לפי שרשרת הערך של פורטר, איזו מהפעילויות היא <b>תומכת</b>?","o":["קבלת השלדות מהספק ואחסונן במחסן","גיוס מכונאים חדשים והכשרתם","הרכבת האופניים במפעל","תיקון אופניים ללקוחות במסגרת האחריות"],"a":1,"w":["קבלה ואחסון של תשומות = לוגיסטיקה נכנסת, פעילות עיקרית.","","הרכבה היא ייצור = תפעול, פעילות עיקרית.","תיקון אצל הלקוח = שירות, פעילות עיקרית."],"why":"גיוס והכשרה = ניהול משאבי אנוש, אחת מארבע הפעילויות התומכות."},{"id":"m3-2","q":"יצרנית החטיפים SnackPro פועלת בכמה תחומים. איזו מהפעילויות הבאות היא פעילות <b>עיקרית</b> בשרשרת הערך?","o":["משא ומתן עם מגדלי תפוחי אדמה על מחיר שנתי","פיתוח מתכון אפייה חדש במעבדה","הטמעת מערכת חדשה להנהלת חשבונות","משלוח המארזים מהמפעל לרשתות השיווק"],"a":3,"w":["בחירת ספקים וסגירת מחיר = רכש, פעילות תומכת.","פיתוח ומו״פ = פיתוח טכנולוגי, פעילות תומכת.","כספים ומערכות ניהול = תשתיות/אדמיניסטרציה, פעילות תומכת.",""],"why":"הפצת המוצר המוגמר ללקוחות = לוגיסטיקה יוצאת, פעילות עיקרית."},{"id":"m3-3","q":"אפליקציית המשלוחים FoodDash משקיעה מיליונים בקמפיין עם משפיענים ובמבצעי הנחה לנרשמים חדשים. לאיזו פעילות בשרשרת הערך שייכת ההשקעה?","o":["שיווק ומכירות","שירות","תשתיות / אדמיניסטרציה","פיתוח טכנולוגי"],"a":0,"w":["","שירות הוא מה שקורה אחרי המכירה (תמיכה, תיקונים), לא פרסום ומבצעים.","תשתיות הן הנהלה, כספים ומשפטים, לא קמפיין פרסומי.","פיתוח טכנולוגי הוא מו״פ ופיתוח מערכות, לא פרסום."],"why":"פרסום, קידום ומבצעים = שיווק ומכירות, פעילות עיקרית."},{"id":"m3-4","q":"לפי מודל שרשרת הערך, מהם <b>שולי הרווח</b> (Margin)?","o":["סך העלויות של הפעילויות התומכות בלבד","ההפרש בין המחיר של החברה למחיר של המתחרים","ההפרש בין הערך הכולל שהחברה יוצרת לבין העלות של ביצוע כל הפעילויות","החלק מההכנסות שמושקע מחדש במו״פ"],"a":2,"w":["שולי הרווח הם הפרש בין ערך לעלות, לא סכום של עלויות.","שולי הרווח לא נמדדים מול מתחרים, אלא מול עלות הפעילויות של החברה עצמה.","","השקעה במו״פ היא חלק מהעלויות (פיתוח טכנולוגי), לא שולי הרווח."],"why":"בקצה החץ של המודל: הערך שנוצר פחות עלות כל הפעילויות = שולי הרווח."},{"id":"m3-5","q":"מפעל האלקטרוניקה TechParts מקבל רכיבים מהספקים, בודק אותם בשער המפעל ומאחסן אותם במחסן עד שהם עולים לפס הייצור. איזו פעילות זו?","o":["רכש","תפעול","לוגיסטיקה נכנסת","לוגיסטיקה יוצאת"],"a":2,"w":["רכש הוא בחירת ספקים, מיקוח וחתימה על חוזה – לא הקבלה הפיזית והאחסון.","תפעול מתחיל כשהרכיבים עולים לפס הייצור, לא בשלב האחסון.","","לוגיסטיקה יוצאת היא הפצת המוצר המוגמר ללקוחות."],"why":"קבלה, בדיקה ואחסון של תשומות = לוגיסטיקה נכנסת, פעילות עיקרית."},{"id":"m3-6","q":"מה המטרה המרכזית של ניתוח שרשרת הערך?","o":["לזהות באילו פעילויות פנימיות נוצר ערך ואיפה אפשר לחסוך בעלויות","למפות את הכוחות שקובעים את האטרקטיביות של הענף","לבדוק אם משאב עומד בארבעה קריטריונים ליתרון בר-קיימא","לגזור אסטרטגיות מהצלבת חוזקות, חולשות, הזדמנויות ואיומים"],"a":0,"w":["","זה מודל חמשת הכוחות (יחידה 2), מודל חיצוני.","זה מודל VRIN.","זה מודל TOWS."],"why":"שרשרת הערך היא כלי פנימי: מפרקים את הארגון לפעילויות ומחפשים מקורות ערך וחיסכון."},{"id":"m3-7","q":"איזו מהפעילויות הבאות <b>אינה</b> פעילות תומכת בשרשרת הערך?","o":["רכש","ניהול משאבי אנוש","פיתוח טכנולוגי","שירות"],"a":3,"w":["רכש היא אחת מארבע הפעילויות התומכות.","משאבי אנוש היא פעילות תומכת.","פיתוח טכנולוגי (מו״פ) היא פעילות תומכת.",""],"why":"שירות (לאחר מכירה) היא פעילות עיקרית. התומכות: תשתיות, משאבי אנוש, פיתוח טכנולוגי, רכש."},{"id":"m3-8","q":"לפי גישת המשאבים (RBV) בסיכום, מה הסדר הנכון של השרשרת שמובילה ליתרון תחרותי?","o":["משאבים ← יכולת ייחודית ← יכולת ליבה ← יתרון תחרותי","משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי","יכולת ליבה ← משאבים ← יתרון תחרותי ← יכולת ייחודית","יתרון תחרותי ← יכולת ייחודית ← יכולת ליבה ← משאבים"],"a":1,"w":["הסדר הפוך באמצע: קודם יכולת ליבה (מול עצמנו), ואז ייחודית (מול המתחרים).","","השרשרת מתחילה במשאבים ומסתיימת ביתרון התחרותי.","זה סדר הפוך לגמרי: היתרון הוא התוצאה, לא נקודת ההתחלה."],"why":"המשאבים בונים יכולת ליבה; כשהיא טובה יותר מהמתחרים היא יכולת ייחודית; ממנה נוצר יתרון תחרותי."},{"id":"m3-9","q":"מנכ״לית חברת הסייבר ShieldOne אומרת: “ההצלחה שלנו לא באה מהענף – היא באה מצוות החוקרים שלנו, מהידע שצברנו ומהפטנטים שלנו.” לאיזו גישה מתאימה האמירה?","o":["גישת המשאבים (RBV)","מודל חמשת הכוחות של פורטר","ניתוח PESTEL","מיפוי קבוצות אסטרטגיות"],"a":0,"w":["","חמשת הכוחות מסבירים רווחיות דרך מבנה הענף – בדיוק מה שהמנכ״לית שוללת.","PESTEL ממפה כוחות מאקרו חיצוניים, לא משאבים פנימיים.","זה כלי לניתוח מתחרים לפי שני ממדים, לא הסבר פנימי ליתרון."],"why":"RBV גוזרת את היתרון התחרותי מבסיס המשאבים הפנימי: אנשים, ידע ופטנטים."},{"id":"m3-10","q":"איזה מהבאים הוא <b>משאב מוחשי</b> לפי טבלת המשאבים בקורס?","o":["המוניטין של החברה בעיני הלקוחות","התרבות הארגונית של החברה","קו ייצור אוטומטי במפעל","הקשרים של המנכ״ל עם גורמי המפתח בענף"],"a":2,"w":["מוניטין הוא משאב לא מוחשי.","תרבות ארגונית היא משאב לא מוחשי (אנושי).","","קשרים חיצוניים הם משאב לא מוחשי."],"why":"מכונות וציוד = משאב מוחשי פיזי."},{"id":"m3-11","q":"חברת התרופות MediGel רשמה 12 פטנטים על נוסחאות חדשות. לפי טבלת המשאבים בקורס, לאיזה סוג משאב שייכים הפטנטים?","o":["משאב לא מוחשי – חדשנות","משאב מוחשי – טכנולוגי","משאב לא מוחשי – מוניטין","משאב מוחשי – פיזי"],"a":1,"w":["חדשנות (לא מוחשי) היא רעיונות וכישורים מדעיים; הפטנט הרשום עצמו מופיע בצד המוחשי.","","מוניטין הוא תדמית בעיני לקוחות, לא פטנט.","פיזי = מבנים, מכונות, קרקע. פטנט נמצא בסוג הטכנולוגי."],"why":"בטבלה: פטנטים, סימנים רשומים, זכויות יוצרים וסודות מקצועיים = משאבים מוחשיים טכנולוגיים."},{"id":"m3-12","q":"ברשת הקמעונאות StoreLine פועלים מנגנון בקרה ותיאום בין הסניפים ומערכת מסודרת לתכנון ופיקוח. איזה סוג משאב זה?","o":["משאב לא מוחשי – אנושי","משאב מוחשי – פיננסי","משאב לא מוחשי – קשרים חיצוניים","משאב מוחשי – ארגוני"],"a":3,"w":["אנושי = ידע, ניסיון, אמון ותרבות. מנגנוני בקרה ותכנון הם ארגוניים ומוחשיים.","פיננסי = אשראי והון.","קשרים חיצוניים = יחסים עם גורמי מפתח בענף, לא מנגנון פנימי.",""],"why":"מנגנוני בקרה, תיאום, תכנון ופיקוח = משאבים מוחשיים ארגוניים."},{"id":"m3-13","q":"לקוחות רבים רואים במותג המכוניות AutoPrime סמל לאיכות ולאמינות, ויש סביבו “מיתוס” של מכונית שלא מתקלקלת. איזה סוג משאב מתואר?","o":["משאב מוחשי – טכנולוגי","משאב לא מוחשי – מוניטין","משאב לא מוחשי – חדשנות","משאב מוחשי – ארגוני"],"a":1,"w":["טכנולוגי (מוחשי) = פטנטים וסימנים רשומים. כאן מדובר בתפיסה של הלקוחות.","","חדשנות = רעיונות ויכולות פיתוח, לא תדמית.","ארגוני = מנגנוני בקרה ותכנון בתוך החברה."],"why":"מותג, מיצוב, מיתוס ותפיסת האיכות בעיני הלקוחות = מוניטין, משאב לא מוחשי."},{"id":"m3-14","q":"בחברת הייעוץ BrightPath יש עובדים עם ניסיון של עשרות שנים, אמון גבוה בין הצוותים ותרבות ארגונית של שיתוף ידע. איזה סוג משאב זה?","o":["משאב מוחשי – ארגוני","משאב לא מוחשי – חדשנות","משאב מוחשי – טכנולוגי","משאב לא מוחשי – אנושי"],"a":3,"w":["תרבות ארגונית היא לא מנגנון בקרה; בטבלה היא חלק מהמשאב האנושי הלא מוחשי.","חדשנות = רעיונות וכישורים מדעיים. כאן מדובר בידע, ניסיון ואמון.","טכנולוגי = פטנטים, סימנים רשומים, זכויות יוצרים.",""],"why":"ידע, ניסיון, אמון, כישורי ניהול ותרבות ארגונית = משאב לא מוחשי אנושי."},{"id":"m3-15","q":"לחברת הבנייה BuildCo יש הון עצמי גדול וקו אשראי מאושר מכמה בנקים. איזה סוג משאב זה?","o":["משאב מוחשי – פיננסי","משאב מוחשי – פיזי","משאב לא מוחשי – קשרים חיצוניים","משאב לא מוחשי – מוניטין"],"a":0,"w":["","פיזי = מבנים, מכונות, קרקע וחומרי גלם, לא כסף.","הקשר עם הבנק אולי עזר, אבל האשראי וההון עצמם הם משאב פיננסי מוחשי.","מוניטין הוא תדמית, לא הון."],"why":"מקורות אשראי והון עצמי = משאבים מוחשיים פיננסיים."},{"id":"m3-16","q":"לפי הסיכום, מהי <b>יכולת ליבה</b>?","o":["פעולה שהפירמה עושה טוב יותר מכל המתחרים שלה","משאב שעונה “כן” על ארבעת הקריטריונים של VRIN","הפעולה שהפירמה עושה הכי טוב מבין כל יכולותיה, בלי תלות בגורמים חיצוניים","תנאי שכל חברה בענף חייבת לעמוד בו כדי להצליח"],"a":2,"w":["זו ההגדרה של יכולת ייחודית – השוואה למתחרים.","זה משאב שנותן יתרון בר-קיימא, לא ההגדרה של יכולת ליבה.","","זה KSF – גורם מפתח להצלחה שמוכתב על ידי הענף."],"why":"יכולת ליבה = ההשוואה היא פנימית: במה הפירמה הכי טובה מבין הדברים שהיא עושה. לרוב יש אחת."},{"id":"m3-17","q":"ברשת המאפיות FreshBake, הדבר שהחברה עושה הכי טוב הוא עמידה בזמני משלוח. אבל שלוש רשתות מתחרות עומדות בזמנים בדיוק כמוה. מה נכון לגבי עמידה בזמנים ב-FreshBake?","o":["זו יכולת ייחודית, כי זה הדבר שהחברה עושה הכי טוב","זה יתרון תחרותי בר-קיימא","זו יכולת ליבה, אבל לא יכולת ייחודית","זו לא יכולת ליבה, כי גם מתחרים עושים את זה"],"a":2,"w":["ייחודית דורשת להיות טובים יותר מהמתחרים. כאן המתחרים טובים באותה מידה.","אין יתרון כשהמתחרים עושים בדיוק אותו דבר.","","יכולת ליבה נמדדת מול היכולות האחרות של החברה עצמה, לא מול המתחרים."],"why":"הכי טוב בתוך החברה = יכולת ליבה. כדי שתהיה גם ייחודית, היא צריכה להיות טובה יותר משל המתחרים."},{"id":"m3-18","q":"סטודיו העיצוב PixelCraft מצליח לספק עיצוב אתר מלא תוך 48 שעות. בדיקה בענף מראה שאף סטודיו מתחרה לא מצליח לעשות זאת בפחות משבועיים. איזה מושג מתאר את היכולת?","o":["יכולת ייחודית","משאב מוחשי","שוויון תחרותי","גורם מפתח להצלחה (KSF)"],"a":0,"w":["","מהירות עבודה היא יכולת – שילוב של משאבים, לא משאב מוחשי בודד.","שוויון הוא מצב שבו גם למתחרים יש אותו דבר. כאן אין לאף אחד.","KSF מוכתב על ידי הענף לכל החברות. כאן מדובר ביכולת של חברה אחת שעולה על כולם."],"why":"פעולה שהפירמה מבצעת טוב יותר מהמתחרות = יכולת ייחודית."},{"id":"m3-19","q":"חברת הדפוס OldPrint מחזיקה רשת גדולה של מכשירי פקס בכל הסניפים, וזה עולה לה הרבה כסף. הלקוחות לא משתמשים בפקס כבר שנים ולא מעריכים את השירות. מה התוצאה לפי מודל VRIN?","o":["שוויון תחרותי","יתרון תחרותי זמני","יתרון תחרותי לא מנוצל","חיסרון תחרותי"],"a":3,"w":["שוויון מתקבל כשהמשאב בעל ערך אבל לא נדיר. כאן אין ערך בכלל.","יתרון זמני דורש משאב בעל ערך ונדיר. כאן המשאב נכשל כבר ב-V.","זו התוצאה כשרק ה-N נכשל. כאן נכשל הקריטריון הראשון.",""],"why":"המשאב לא בעל ערך (V = לא) ← חיסרון תחרותי. הוא רק עולה כסף."},{"id":"m3-20","q":"כל הבנקים בישראל קנו מאותו ספק את אותה אפליקציה להעברת כספים מהירה. הלקוחות מאוד אוהבים אותה. מה התוצאה לפי VRIN עבור כל בנק?","o":["חיסרון תחרותי","שוויון תחרותי","יתרון תחרותי זמני","יתרון תחרותי בר-קיימא"],"a":1,"w":["האפליקציה בעלת ערך (הלקוחות אוהבים אותה), ולכן אין חיסרון.","","יתרון זמני דורש משאב נדיר. כאן לכולם יש אותה אפליקציה.","המשאב לא נדיר, ולכן הוא לא עובר את VRIN."],"why":"בעל ערך, אבל לא נדיר (R = לא) ← שוויון תחרותי: הבנק רק “בגובה” של כולם."},{"id":"m3-21","q":"חברת הנעליים StepUp השיקה סוליה בעיצוב חדשני שאין לאף מתחרה, והלקוחות אהבו אותה מאוד. אחרי חצי שנה כל המתחרים הוציאו סוליות כמעט זהות. מה התוצאה לפי VRIN?","o":["יתרון תחרותי זמני","שוויון תחרותי","יתרון תחרותי לא מנוצל","חיסרון תחרותי"],"a":0,"w":["","בהתחלה הסוליה הייתה נדירה, ולכן היה יתרון. השאלה היא כמה זמן הוא החזיק.","יתרון לא מנוצל מתקבל כשהבעיה היא תחליף (N). כאן הבעיה היא העתקה (I).","לסוליה יש ערך – הלקוחות אהבו אותה."],"why":"בעל ערך + נדיר, אבל קל לחיקוי (I = לא) ← יתרון תחרותי זמני, עד שהעתיקו."},{"id":"m3-22","q":"לחברת BrightLamp יש טכנולוגיית נורות ייחודית, מוגנת היטב ושאין לאף אחד אחר. אבל הלקוחות יכולים לקבל את אותה תאורה וחיסכון באנרגיה גם מנורות LED רגילות שמבוססות על טכנולוגיה אחרת. מה התוצאה לפי VRIN?","o":["יתרון תחרותי בר-קיימא","שוויון תחרותי","יתרון תחרותי לא מנוצל","יתרון תחרותי זמני"],"a":2,"w":["המשאב נכשל ב-N: יש תחליף שנותן אותה תוצאה.","הטכנולוגיה נדירה (אין לאף אחד אחר), ולכן אין כאן שוויון.","","יתרון זמני הוא כשהמתחרים יכולים להעתיק. כאן הם לא מעתיקים – הם משיגים את התוצאה בדרך אחרת."],"why":"ערך + נדיר + קשה לחיקוי, אבל יש תחליף (N = לא) ← יתרון תחרותי לא מנוצל."},{"id":"m3-23","q":"לחברת השוקולד ChocoAlp מתכון סודי בן מאה שנה. הלקוחות מעריכים מאוד את הטעם, לאף מתחרה אין מתכון כזה, אי אפשר לשחזר אותו כי הוא תלוי במומחיות שנבנתה דורות, ואין מוצר אחר שנותן את אותה חוויה. מה התוצאה לפי VRIN?","o":["יתרון תחרותי זמני","יתרון תחרותי בר-קיימא","יתרון תחרותי לא מנוצל","שוויון תחרותי"],"a":1,"w":["יתרון זמני הוא כשקל להעתיק. כאן אי אפשר לשחזר את המתכון.","","זו התוצאה כשיש תחליף. כאן אין מוצר אחר שנותן אותה חוויה.","שוויון הוא כשלכולם יש. כאן לאף מתחרה אין."],"why":"כן על V, R, I ו-N ← יתרון תחרותי בר-קיימא."},{"id":"m3-24","q":"במודל VRIN שנלמד בקורס, מה מייצגת האות <b>N</b>?","o":["Organization – החברה מאורגנת לנצל את המשאב","New – משאב חדש שלא היה קודם בענף","Non-tradable – אי אפשר לקנות את המשאב בשוק","Non-substitutable – בלתי ניתן להחלפה"],"a":3,"w":["זה ה-O של מודל VRIO, לא חלק מ-VRIN בקורס הזה.","אין קריטריון כזה. חדשות לא מבטיחה יתרון.","קרוב לרעיון של נדירות, אבל זה לא מה שמייצגת האות N.",""],"why":"VRIN = Valuable, Rare, Inimitable, Non-substitutable. N שואל אם אין משאב אחר שמשיג אותה תוצאה."},{"id":"m3-25","q":"איזה מהצירופים הבאים נכון לפי תרשים VRIN?","o":["המשאב לא בעל ערך ← יתרון תחרותי זמני","המשאב לא נדיר ← שוויון תחרותי","המשאב קל לחיקוי ← חיסרון תחרותי","למשאב יש תחליף ← שוויון תחרותי"],"a":1,"w":["משאב בלי ערך מוביל לחיסרון תחרותי.","","משאב קל לחיקוי (אחרי ערך ונדירות) מוביל ליתרון זמני.","משאב שיש לו תחליף מוביל ליתרון לא מנוצל."],"why":"V לא = חיסרון; R לא = שוויון; I לא = יתרון זמני; N לא = יתרון לא מנוצל."},{"id":"m3-26","q":"רשת חדרי הכושר FitZone עורכת SWOT. איזה מהגורמים הוא <b>איום</b> (T)?","o":["המכשירים בחלק מהסניפים ישנים","המאמנים של הרשת מוכרים ואהובים","עלייה במודעות הציבור לבריאות","רשת בינלאומית זולה פותחת סניפים בעיר"],"a":3,"w":["מכשירים ישנים הם בעיה פנימית = חולשה (W).","זו חוזקה פנימית (S).","זו מגמה חיצונית חיובית = הזדמנות (O).",""],"why":"מתחרה חדש שנכנס הוא גורם חיצוני ושלילי = איום."},{"id":"m3-27","q":"חברת התוכנה CodeBase עורכת SWOT. איזה מהגורמים הוא <b>חולשה</b> (W)?","o":["מערכות המחשוב הפנימיות של החברה מיושנות","הממשלה מחמירה את חוקי הגנת הפרטיות","לקוחות בשוק עוברים לשירותי ענן","מיתון כלכלי צפוי בשנה הבאה"],"a":0,"w":["","חוק הוא גורם חיצוני = איום (T), גם אם הוא מקשה על החברה.","מגמה בשוק היא גורם חיצוני (הזדמנות או איום).","מיתון הוא גורם חיצוני = איום (T)."],"why":"מערכות של החברה עצמה הן גורם פנימי ושלילי = חולשה."},{"id":"m3-28","q":"לפי שקף היישום של SWOT בסיכום, מה עושים עם <b>חולשה</b>?","o":["מסמנים אותה כמגבלה","משתמשים בה כדי לנצל הזדמנות","מבטלים אותה או הופכים אותה לחוזקה","הופכים אותה ליכולת ליבה"],"a":2,"w":["סימון כמגבלה הוא מה שעושים עם איום.","הזדמנות מנצלים בעזרת חוזקה, לא בעזרת חולשה.","","את החוזקה הופכים ליכולת ליבה וליתרון בר-קיימא."],"why":"בשקף: חולשה ← ביטול חולשה או הפיכת חולשה לחוזקה."},{"id":"m3-29","q":"למותג הקוסמטיקה PureSkin יש מותג חזק ואמין (חוזקה). בשווקים באסיה יש ביקוש גובר לקוסמטיקה טבעית (הזדמנות). החברה מחליטה להשיק את הקו שלה באסיה. לאיזה תא ב-TOWS שייך הצעד?","o":["WO","ST","SO","WT"],"a":2,"w":["WO הוא תיקון חולשה בעזרת הזדמנות. כאן לא מתקנים חולשה.","ST משתמש בחוזקה מול איום. כאן אין איום.","","WT הוא צעד הגנתי מול חולשה ואיום יחד."],"why":"חוזקה (מותג) + הזדמנות (ביקוש באסיה) = SO."},{"id":"m3-30","q":"למשרד רואי החשבון NumberWise יש מערכות דיגיטליות חלשות (חולשה). הממשלה מציעה מענק גדול לעסקים שעוברים לדיגיטל (הזדמנות). המשרד מגיש בקשה למענק ומשדרג את המערכות. לאיזה תא ב-TOWS שייך הצעד?","o":["WO","SO","ST","WT"],"a":0,"w":["","SO מבוסס על חוזקה. כאן נקודת המוצא היא חולשה.","ST הוא חוזקה מול איום. אין כאן לא חוזקה ולא איום.","WT הוא חולשה מול איום. המענק הוא הזדמנות, לא איום."],"why":"הזדמנות חיצונית (מענק) משמשת לתיקון חולשה פנימית (מערכות חלשות) = WO."},{"id":"m3-31","q":"לרשת הסופרמרקטים FreshMart יש קופת מזומנים גדולה (חוזקה). רשת דיסקאונט זרה נכנסת לשוק עם מחירים נמוכים (איום). FreshMart משתמשת במזומנים כדי לממן מועדון לקוחות עם הנחות גדולות. לאיזה תא ב-TOWS שייך הצעד?","o":["SO","WO","WT","ST"],"a":3,"w":["הכניסה של רשת זרה היא איום, לא הזדמנות.","הצעד לא מתקן חולשה, ונקודת המוצא היא איום, לא הזדמנות.","WT יוצא מחולשה. כאן משתמשים בחוזקה – המזומנים.",""],"why":"חוזקה (מזומנים) משמשת להתגוננות מפני איום (מתחרה זול) = ST."},{"id":"m3-32","q":"לחברת התיירות TravelOn יש חוב גבוה ומעט לקוחות (חולשות), וצפוי מיתון שיפגע בתיירות (איום). ההנהלה מחליטה לסגור סניפים מפסידים ולחפש מיזוג עם חברה גדולה. לאיזה תא ב-TOWS שייך הצעד?","o":["SO","WT","WO","ST"],"a":1,"w":["אין כאן חוזקה ואין הזדמנות – רק חולשות ואיום.","","המיתון הוא איום, לא הזדמנות.","ST מבוסס על חוזקה. החוב והמחסור בלקוחות הם חולשות."],"why":"חולשה + איום ← צעד הגנתי (צמצום, מיזוג) = WT."},{"id":"m3-33","q":"בדוגמת הבנק בסיכום, הבנק מנצל את הכוח הלוביסטי שלו כדי לקדם חקיקה שתגביל את התחזקות הבנקים החברתיים. האסטרטגיה נקראת “הגדלת חסמי הכניסה”. באיזה תא היא נמצאת?","o":["ST","SO","WO","WT"],"a":0,"w":["","בנקאות חברתית היא איום (T4), לא הזדמנות.","כוח לוביסטי הוא חוזקה (S4), לא חולשה.","הצירוף הוא חוזקה מול איום, לא חולשה מול איום."],"why":"כוח לוביסטי (S4) + בנקאות חברתית (T4) ← הגדלת חסמי כניסה = ST."},{"id":"m3-34","q":"בדוגמת הבנק בסיכום, האסטרטגיה “צמיחה בהגוונה” משלבת איתנות פיננסית עם צמיחת הנדל״ן והשקעה בענף היהלומים. באיזה תא היא נמצאת?","o":["WO","ST","SO","WT"],"a":2,"w":["איתנות פיננסית היא חוזקה (S2), לא חולשה.","צמיחת הנדל״ן וענף היהלומים הם הזדמנויות, לא איומים.","","אין כאן לא חולשה ולא איום."],"why":"חוזקה (S2) + הזדמנויות (O1, O4) = SO."},{"id":"m3-35","q":"מה ההבדל בין SWOT ל-TOWS?","o":["SWOT בודק את הסביבה החיצונית בלבד, ו-TOWS את הפנימית בלבד","SWOT ממפה את הגורמים; TOWS מצליב אותם וגוזר מהם אסטרטגיות פעולה","TOWS הוא שם אחר לאותו מודל, רק בסדר אותיות שונה","SWOT מיועד לחברות גדולות ו-TOWS לעסקים קטנים"],"a":1,"w":["שניהם כוללים גורמים פנימיים (S, W) וחיצוניים (O, T).","","TOWS מוסיף שלב: הצלבה וגזירת אסטרטגיות.","אין הבחנה כזו. ההבדל הוא מיפוי מול גזירת פעולה."],"why":"SWOT = מיפוי. TOWS = הצלבת פנים וחוץ לארבעה סוגי אסטרטגיות: SO, WO, ST, WT."},{"id":"m3-36","q":"צוות אסטרטגיה בונה טבלת TOWS מתוך SWOT שכבר הכין. מה הצעד הנכון?","o":["לחבר שתי חוזקות כדי ליצור אסטרטגיית SS","למחוק את החולשות, כי TOWS עוסק רק בחוזקות","לרשום שוב את הגורמים בלי לנסח פעולה","לחבר בכל תא גורם פנימי (S או W) עם גורם חיצוני (O או T) ולנסח מהם פעולה"],"a":3,"w":["אין תא SS. כל אסטרטגיה ב-TOWS מצליבה פנים עם חוץ.","יש שני תאים שלמים לחולשות: WO ו-WT.","זה רק SWOT. ב-TOWS חייבים לגזור פעולה.",""],"why":"בונים טבלה: S/W למעלה, O/T בצד, ובכל תא מנסחים פעולה מהצירוף (למשל S2 + O1)."}],"tf":[{"id":"m3-t1","s":"לפי מודל שרשרת הערך, שיווק ומכירות היא פעילות עיקרית (ליבה).","a":true,"why":"נכון. שיווק ומכירות היא אחת מחמש הפעילויות העיקריות."},{"id":"m3-t2","s":"רכש הוא פעילות עיקרית, כי הוא קשור ישירות לחומרי הגלם.","a":false,"why":"לא נכון. רכש הוא פעילות תומכת. הקבלה והאחסון של חומרי הגלם הם לוגיסטיקה נכנסת – עיקרית."},{"id":"m3-t3","s":"שולי הרווח בשרשרת הערך הם ההפרש בין הערך שהחברה יוצרת לבין העלות של ביצוע הפעילויות.","a":true,"why":"נכון. זה מה שמופיע בקצה החץ של המודל."},{"id":"m3-t4","s":"בחברות הייטק, פיתוח טכנולוגי ומו״פ נחשבים לפעילות עיקרית.","a":false,"why":"לא נכון. פיתוח טכנולוגי הוא תמיד פעילות תומכת, גם כשהוא חשוב מאוד לחברה."},{"id":"m3-t5","s":"הכשרת נציגי שירות היא פעילות תומכת (ניהול משאבי אנוש).","a":true,"why":"נכון. גיוס והכשרה הם משאבי אנוש. רק השירות עצמו ללקוח הוא פעילות עיקרית."},{"id":"m3-t6","s":"שרשרת הערך היא כלי לניתוח הסביבה החיצונית של הענף.","a":false,"why":"לא נכון. שרשרת הערך מנתחת את הפעילויות הפנימיות של הארגון."},{"id":"m3-t7","s":"לפי גישת המשאבים (RBV), היתרון התחרותי נגזר מבסיס המשאבים הפנימי של הפירמה.","a":true,"why":"נכון. זה הרעיון המרכזי של RBV."},{"id":"m3-t8","s":"בשרשרת של RBV, יכולת ייחודית באה לפני יכולת ליבה.","a":false,"why":"לא נכון. הסדר הוא משאבים ← יכולת ליבה ← יכולת ייחודית ← יתרון תחרותי."},{"id":"m3-t9","s":"יכולת ייחודית היא פעולה שהפירמה מבצעת טוב יותר ממתחרותיה.","a":true,"why":"נכון. ההשוואה ביכולת ייחודית היא מול המתחרים."},{"id":"m3-t10","s":"לפי הסיכום, יכולת ליבה נמדדת מול המתחרים בענף.","a":false,"why":"לא נכון. יכולת ליבה נמדדת מול היכולות האחרות של הפירמה עצמה. ההשוואה למתחרים היא ביכולת ייחודית."},{"id":"m3-t11","s":"לפי הסיכום, בדרך כלל יש לכל פירמה יכולת ליבה אחת.","a":true,"why":"נכון. כך מוגדרת יכולת ליבה בסיכום."},{"id":"m3-t12","s":"מוניטין ומותג הם משאבים מוחשיים.","a":false,"why":"לא נכון. מוניטין (מותג, מיצוב, תפיסת איכות) הוא משאב לא מוחשי."},{"id":"m3-t13","s":"בטבלת המשאבים של הקורס, פטנטים וסימנים רשומים נכללים במשאבים המוחשיים (טכנולוגיים).","a":true,"why":"נכון. בטבלה הם מופיעים תחת משאבים טכנולוגיים בצד המוחשי."},{"id":"m3-t14","s":"תרבות ארגונית היא משאב מוחשי ארגוני.","a":false,"why":"לא נכון. תרבות ארגונית היא משאב לא מוחשי אנושי. המשאב הארגוני המוחשי הוא מנגנוני בקרה ותכנון."},{"id":"m3-t15","s":"מנגנוני בקרה, תיאום, תכנון ופיקוח הם משאבים מוחשיים ארגוניים.","a":true,"why":"נכון. כך הם מסווגים בטבלת המשאבים."},{"id":"m3-t16","s":"במודל VRIN, האות N מייצגת New – משאב חדש בענף.","a":false,"why":"לא נכון. N = Non-substitutable, בלתי ניתן להחלפה."},{"id":"m3-t17","s":"לפי VRIN, משאב שאין לו ערך מוביל לחיסרון תחרותי.","a":true,"why":"נכון. זו התוצאה של “לא” בקריטריון הראשון (V)."},{"id":"m3-t18","s":"לפי VRIN, משאב בעל ערך שאינו נדיר נותן יתרון תחרותי זמני.","a":false,"why":"לא נכון. משאב בעל ערך שאינו נדיר נותן שוויון תחרותי. יתרון זמני הוא כשהמשאב נדיר אבל קל לחיקוי."},{"id":"m3-t19","s":"משאב בעל ערך, נדיר וקשה לחיקוי, שיש לו תחליף, מוביל לפי התרשים ליתרון תחרותי לא מנוצל.","a":true,"why":"נכון. זו התוצאה של “לא” בקריטריון N."},{"id":"m3-t20","s":"כדי לקבל יתרון תחרותי בר-קיימא מספיק לעמוד בשלושה מתוך ארבעת קריטריוני VRIN.","a":false,"why":"לא נכון. צריך “כן” על כל הארבעה."},{"id":"m3-t21","s":"במודל VRIN בודקים את הקריטריונים לפי הסדר ועוצרים בתשובה השלילית הראשונה.","a":true,"why":"נכון. ה“לא” הראשון קובע את התוצאה."},{"id":"m3-t22","s":"חוק חדש שמקשה על פעילות החברה הוא חולשה (W) ב-SWOT.","a":false,"why":"לא נכון. חוק הוא גורם חיצוני, ולכן הוא איום (T), לא חולשה."},{"id":"m3-t23","s":"ב-SWOT, חוזקות וחולשות הן גורמים פנימיים, והזדמנויות ואיומים הם גורמים חיצוניים.","a":true,"why":"נכון. זו ההבחנה הבסיסית של המודל."},{"id":"m3-t24","s":"SWOT ו-TOWS הם אותו מודל, רק בסדר אותיות אחר.","a":false,"why":"לא נכון. SWOT ממפה גורמים; TOWS מצליב אותם וגוזר מהם אסטרטגיות."},{"id":"m3-t25","s":"אסטרטגיית WO משתמשת בהזדמנות חיצונית כדי להתגבר על חולשה פנימית.","a":true,"why":"נכון. זה ההיגיון של התא WO."},{"id":"m3-t26","s":"אסטרטגיית ST היא אסטרטגיה שבה החברה מנצלת הזדמנויות בעזרת חוזקות.","a":false,"why":"לא נכון. זו אסטרטגיית SO. ב-ST החברה משתמשת בחוזקות כדי להתמודד עם איומים."},{"id":"m3-t27","s":"אסטרטגיית WT היא בדרך כלל הגנתית: מצמצמים חולשות ומתגוננים מפני איומים.","a":true,"why":"נכון. זה התא המסוכן ביותר, ולכן האסטרטגיה בו הגנתית."},{"id":"m3-t28","s":"בדוגמת הבנק בסיכום, אסטרטגיית הצמיחה בהגוונה נבנתה מצירוף של חולשות ואיומים.","a":false,"why":"לא נכון. היא נבנתה מחוזקה (איתנות פיננסית) והזדמנויו
