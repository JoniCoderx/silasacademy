ת (נדל״ן, יהלומים) – תא SO."},{"id":"m3-t29","s":"לפי שקף היישום של SWOT, איום אפשר לסמן כמגבלה או לנסות להפוך להזדמנות.","a":true,"why":"נכון. אלה שתי הדרכים לטפל באיום לפי השקף."},{"id":"m3-t30","s":"כל אסטרטגיה בטבלת TOWS בנויה משני גורמים פנימיים.","a":false,"why":"לא נכון. כל אסטרטגיה מצליבה גורם פנימי (S או W) עם גורם חיצוני (O או T)."}],"scope":[{"ref":"סיכום · עמ׳ 4","x":"שרשרת הערך של פורטר: פעילויות עיקריות, תומכות ושולי רווח","imp":2,"h":"מודל שרשרת הערך של פורטר (Value Chain)"},{"ref":"סיכום · עמ׳ 4","x":"גישת המשאבים (RBV): משאבים ← ליבה ← ייחודית ← יתרון","imp":1,"h":"גישת המשאבים (RBV) ושרשרת היתרון"},{"ref":"סיכום · עמ׳ 5","x":"משאבים מוחשיים ולא מוחשיים (טבלה)","imp":1,"h":"משאבים מוחשיים ולא מוחשיים"},{"ref":"סיכום · עמ׳ 5","x":"יכולת ליבה ויכולת ייחודית","imp":1,"h":"יכולת ליבה מול יכולת ייחודית"},{"ref":"סיכום · עמ׳ 5","x":"מודל VRIN ותוצאות כל קריטריון","imp":2,"h":"מודל VRIN – האם היתרון בר-קיימא?"},{"ref":"סיכום · עמ׳ 6","x":"מודל SWOT ושקף היישום","imp":2,"h":"מודל SWOT"},{"ref":"סיכום · עמ׳ 6–7","x":"מודל TOWS ודוגמת הבנק","imp":2,"h":"מודל TOWS – מ-SWOT לאסטרטגיות"}],"outScope":[]},{"id":"m4","title":"אסטרטגיות תחרותיות גנריות","short":"אסטרטגיות גנריות","blurb":"מודל פורטר (1985): שני צירים – סוג היתרון והיקף השוק – וחמש אסטרטגיות, כולל המשולבת, הקשר לאוקיינוס כחול והסכנה להיתקע באמצע.","mnemonic":"שתי שאלות: “איך אני מנצח?” (זול / מיוחד) × “את מי אני משרת?” (כולם / “רק ל…”). זול + כולם = מנהיגות בעלות רחבה; מיוחד + כולם = בידול רחבה; זול + נישה = ממוקדת מנהיגות בעלות; מיוחד + נישה = ממוקדת בידול. “גם וגם” שמצליח = משולבת (אוקיינוס כחול); “גם וגם” שנכשל = תקוע באמצע.","blocks":[{"t":"h","x":"מה זו אסטרטגיה תחרותית גנרית?"},{"t":"p","x":"<b>אסטרטגיה תחרותית גנרית</b> היא התשובה של החברה לשאלה: <b>איך ננצח את המתחרים בענף?</b> “גנרית” = כללית: אותן אסטרטגיות מופיעות בכל ענף – מזון, תעופה, תוכנה או אופנה."},{"t":"p","x":"המודל פותח על ידי <b>מייקל פורטר ב-1985</b>. הוא צמח משלוש אסטרטגיות עיקריות: <b>מנהיגות בעלות, בידול ומיקוד (פוקוס)</b>. כשמפצלים את המיקוד לזול ולמבודל, ומוסיפים את האסטרטגיה המשולבת, מקבלים <b>חמש אסטרטגיות</b>."},{"t":"h","x":"שני צירים, חמש אסטרטגיות"},{"t":"steps","x":["<b>סוג היתרון התחרותי</b>: האם אנחנו מנצחים בזכות <b>עלות נמוכה</b>, או בזכות <b>ייחודיות</b> שהלקוח מוכן לשלם עליה?","<b>היקף שוק היעד</b>: האם אנחנו פונים ל<b>שוק רחב</b> (הרבה סוגי לקוחות), או ל<b>נישה ממוקדת</b> (קבוצה מוגדרת)?","מצליבים את שתי התשובות ומקבלים משבצת. באמצע המטריצה יושבת ה<b>משולבת</b>: גם עלות נמוכה וגם בידול."],"title":"שתי שאלות שקובעות את האסטרטגיה"},{"t":"table","head":["היקף שוק היעד","עלות נמוכה","ייחודיות"],"rows":[["<b>רחב</b>","<b>1. מנהיגות בעלות רחבה</b> (Broad Low Cost)","<b>2. בידול רחבה</b> (Broad Differentiation)"],["<b>ממוקד</b>","<b>3. ממוקדת מנהיגות בעלות</b> (Focused Low Cost)","<b>4. ממוקדת בידול</b> (Focused Differentiation)"],["<b>באמצע המטריצה</b>","<b>5. משולבת מנהיגות בעלות/בידול</b> (Best-Cost / Integrated): גם עלות נמוכה…","…וגם ייחודיות = יותר ערך עבור המחיר"]]},{"t":"trap","x":"המטריצה של פורטר היא <b>לא</b> מטריצת Ansoff (מוצר × שוק, יחידה 6) ו<b>לא</b> מיפוי קבוצות אסטרטגיות (יחידה 2). כאן שני הצירים הם תמיד: <b>סוג היתרון</b> (עלות מול ייחודיות) ו<b>היקף השוק</b> (רחב מול ממוקד)."},{"t":"h","x":"1. מנהיגות בעלות רחבה (Broad Low Cost)"},{"t":"p","x":"החברה מציעה מוצר או שירות ב<b>עלויות נמוכות משמעותית מהמתחרים</b>, ל<b>קהל רחב</b>. היתרון הוא מבנה העלויות: היא מייצרת זול יותר מכולם, ולכן יכולה למכור בזול ועדיין להרוויח."},{"t":"list","x":["<b>ייעול שרשרת הערך</b> – מורידים עלות בכל פעילות (מחסנים אוטומטיים, ייצור המוני, יתרון לגודל).","<b>מיקור חוץ</b> (Outsourcing) – מוציאים פעילויות לספקים זולים יותר.","<b>מוצר בסיסי, “חף מקישוטים”</b> (No-frills) – בלי תוספות שמייקרות.","<b>מכירה ישירה</b> – בלי מתווכים וחנויות יקרות, למשל באתר או באפליקציה."]},{"t":"example","x":"חברת התעופה SkyBasic טסה לכל אירופה עם סוג מטוס אחד, בלי ארוחות חינם, ומוכרת כרטיסים רק באתר שלה. כל אחד יכול לטוס איתה, והמחירים הכי נמוכים בשוק. ← <b>מנהיגות בעלות רחבה</b> (כמו ריינאייר). עוד דוגמאות מוכרות: וולמארט, רמי לוי.","title":"איך זה נראה"},{"t":"trap","x":"מנהיגות בעלות היא קודם כל <b>עלות</b> נמוכה, לא רק <b>מחיר</b> נמוך. חברה שמורידה מחיר בלי להוריד עלויות לא מנהיגה בעלות – היא פשוט מפסידה כסף."},{"t":"h","x":"2. בידול רחבה (Broad Differentiation)"},{"t":"p","x":"החברה מספקת מוצר או שירות ש<b>הלקוחות תופסים כבעל ערך ייחודי ושונה</b>, ב<b>שוק רחב</b>. הייחוד יכול לבוא מעיצוב, מותג, טכנולוגיה, איכות או שירות. בזכות הייחוד הלקוחות מוכנים לשלם <b>מחיר גבוה יותר</b> (פרימיום)."},{"t":"example","x":"חברת הטלפונים NovaPhone מוכרת בכל העולם, לסטודנטים, למשפחות ולאנשי עסקים. הטלפונים שלה ידועים בעיצוב, במצלמה המתקדמת ובמותג החזק, והם יקרים מהמתחרים. ← <b>בידול רחבה</b>. דוגמאות מוכרות: אפל, נייקי, BMW בשוק הרכב הכללי.","title":"איך זה נראה"},{"t":"trap","x":"בבידול מה שקובע הוא <b>התפיסה של הלקוח</b>: הוא צריך לראות בזה משהו מיוחד ולהיות מוכן לשלם עליו. מוצר “טוב יותר” שהלקוחות לא מעריכים הוא לא בידול."},{"t":"h","x":"3. ממוקדת מנהיגות בעלות (Focused Low Cost)"},{"t":"p","x":"החברה מתמקדת ב<b>נישת שוק מוגדרת</b> ושומרת על <b>עלויות מינימליות</b>. היא הזולה ביותר <b>בשביל הקהל המסוים הזה</b>. הנישה יכולה להיות קבוצת לקוחות (סטודנטים, משפחות גדולות, עסקים קטנים), אזור גאוגרפי או קו מוצרים צר."},{"t":"example","x":"StudentPrint מדפיסה עבודות <b>רק לסטודנטים</b> ליד הקמפוס, בהדפסה בסיסית ובמחיר הכי נמוך באזור. ← <b>ממוקדת מנהיגות בעלות</b>. דוגמאות מוכרות: רשתות מזון מוזלות שפונות לקהל מסוים (כמו יש חסד או אושר עד), ALDI.","title":"איך זה נראה"},{"t":"h","x":"4. ממוקדת בידול (Focused Differentiation)"},{"t":"p","x":"החברה מתמקדת ב<b>נישה ספציפית</b> ונותנת לה <b>מענה ייחודי ומותאם אישית</b>. הלקוחות בנישה מוכנים לשלם הרבה, כי המוצר בנוי בדיוק בשבילם."},{"t":"example","x":"VeloCraft בונה אופני מרוץ בעבודת יד, בהתאמה אישית לרוכבים מקצועיים בלבד, במחיר גבוה פי חמישה מאופניים רגילים. ← <b>ממוקדת בידול</b>. דוגמאות מוכרות: רולס רויס, פטק פיליפ, מלונות בוטיק יוקרתיים.","title":"איך זה נראה"},{"t":"trap","x":"בשתי אסטרטגיות המיקוד יש <b>נישה</b>. ההבדל ביניהן הוא רק ב<b>סוג היתרון</b>: נישה + זול ובסיסי = ממוקדת <b>מנהיגות בעלות</b>; נישה + ייחודי ומותאם = ממוקדת <b>בידול</b>. ומיקוד לא אומר “חברה קטנה” – אומר <b>קהל מוגדר</b>."},{"t":"h","x":"5. משולבת מנהיגות בעלות/בידול (Best-Cost / Integrated)"},{"t":"p","x":"האסטרטגיה המשולבת נותנת ללקוח <b>יותר ערך עבור המחיר</b>: איכות, עיצוב או תכונות טובות, במחיר נמוך מזה של המותגים המבודלים. היא <b>משלבת בידול ועלויות נמוכות</b> בו-זמנית. בתרשים בסיכום היא יושבת <b>באמצע המטריצה</b>, בין ארבע המשבצות."},{"t":"list","x":["<b>איך עושים את זה</b>: מוזילים עלויות בלי לפגוע באיכות (טכנולוגיה, אוטומציה, התייעלות חכמה), ובמקביל נותנים ערך ברור ללקוח.","<b>דוגמאות</b>: הונדה וטויוטה (מכוניות אמינות ומאובזרות במחיר נמוך ממותגי היוקרה), איקאה (עיצוב + מחיר נמוך), H&M (אופנה עדכנית במחיר נגיש).","<b>קשר לאוקיינוס כחול</b>: לפי הסיכום, האסטרטגיה המשולבת מתאימה יותר ל<b>“אוקיינוס כחול”</b>. באוקיינוס כחול (יחידה 2) <b>שוברים את הפשרה בין ערך לעלות</b> – בדיוק מה שהמשולבת עושה: גם יותר ערך וגם עלות נמוכה.","<b>הסיכון המרכזי</b>: <b>תת-מיצוב</b> – הלקוחות לא מבינים בבירור מה החברה מציעה – והילכדות במצב של <b>“תקוע באמצע”</b>."]},{"t":"example","x":"חברת הרכב Kaito מוכרת לכל הקהל מכוניות אמינות עם הרבה אבזור, במחיר נמוך ממותגי היוקרה. העלויות שלה נמוכות בזכות ייצור רזה ואוטומציה. ← <b>משולבת</b>: יותר ערך עבור המחיר.","title":"איך זה נראה"},{"t":"h","x":"תקוע באמצע (Stuck in the Middle)"},{"t":"p","x":"<b>תקוע באמצע</b> הוא מצב של חברה שלא הצליחה להשיג <b>אף אחד</b> מסוגי היתרון. היא לא הכי זולה, וגם לא נתפסת כמיוחדת. לכן היא מפסידה לקוחות לשני הכיוונים: מי שמחפש מחיר הולך למנהיג העלות, ומי שמחפש ייחוד הולך לחברה המבודלת."},{"t":"list","x":["<b>סימנים בסיפור</b>: “ניסתה גם להוריד מחירים וגם לשמור על יוקרה”, “אין לה זהות ברורה”, “הלקוחות עוזבים חלק לזולים וחלק ליוקרתיים”, “נתח השוק יורד”.","<b>למה זה קורה</b>: החברה רוצה “גם וגם” אבל לא בונה את היכולות לכך – לא מוזילה עלויות באמת ולא משקיעה מספיק בבידול.","<b>דוגמאות</b>: רשת סירס בארה״ב, רשתות אלקטרוניקה ותיקות שניסו להתחרות גם באמזון וגם בחנויות יוקרה."]},{"t":"trap","x":"<b>משולבת ≠ תקוע באמצע.</b> בשתיהן יש “גם וגם”. ההבדל: במשולבת החברה <b>מצליחה</b> לתת יותר ערך בעלות נמוכה (הונדה, איקאה). בתקוע באמצע היא <b>נכשלת</b> בשני הדברים. תקוע באמצע הוא <b>הסיכון</b> של המשולבת, לא אסטרטגיה שבוחרים בה."},{"t":"h","x":"איך מזהים את האסטרטגיה בסיפור"},{"t":"steps","x":["<b>מה מקור היתרון?</b> “עלויות נמוכות”, “ייעול”, “ייצור המוני”, “בלי תוספות”, “מיקור חוץ”, “מכירה ישירה” ← <b>עלות</b>. “ייחודי”, “יוקרתי”, “עיצוב”, “חדשני”, “מותג”, “התאמה אישית”, “מחיר פרימיום” ← <b>בידול</b>.","<b>מה היקף השוק?</b> “לכל הקהל”, “בכל העולם”, “כל הפלחים” ← <b>רחב</b>. “רק ל…”, “סטודנטים”, “אספנים”, “אזור מסוים”, “עסקים קטנים” ← <b>ממוקד</b>.","<b>יש גם וגם?</b> אם הסיפור מדגיש <b>במפורש</b> גם עלות נמוכה וגם ערך מיוחד, והחברה מצליחה ← <b>משולבת</b>. אם היא נכשלת ומאבדת לקוחות לשני הכיוונים ← <b>תקוע באמצע</b>."],"title":"שלוש שאלות לפי הסדר"},{"t":"table","head":["אסטרטגיה","מקור היתרון","היקף","מילים שמסגירות אותה"],"rows":[["מנהיגות בעלות רחבה","עלות","רחב","“הכי זול בשוק”, “לכולם”, “בלי תוספות”, “מיקור חוץ”, “מכירה ישירה”"],["בידול רחבה","ייחודיות","רחב","“בכל העולם”, “מותג”, “עיצוב ייחודי”, “מחיר גבוה מהמתחרים”"],["ממוקדת מנהיגות בעלות","עלות","ממוקד","“רק ל…” + “זול”, “בסיסי”, “הכי משתלם לקהל הזה”"],["ממוקדת בידול","ייחודיות","ממוקד","“רק ל…” + “יוקרה”, “עבודת יד”, “בהתאמה אישית”"],["משולבת","גם וגם","בדרך כלל רחב","“יותר ערך עבור המחיר”, “איכות במחיר נגיש”, “לא בוחרים בין מחיר לאיכות”"],["תקוע באמצע","אף אחד","—","“ניסתה הכול”, “איבדה זהות”, “לקוחות עוזבים לשני הכיוונים”"]]},{"t":"trap","x":"אל תסתמכו על שם החברה – הסתמכו על <b>מה שכתוב בסיפור</b>. אותה חברה יכולה להופיע בספרים שונים במשבצות שונות (איקאה: מנהיגות בעלות או משולבת). ואוקיינוס כחול הוא <b>לא</b> אחת מחמש האסטרטגיות הגנריות – הוא כלי מיחידה 2, שהמשולבת <b>מתאימה</b> לו."},{"t":"exam","x":"איך שואלים: סיפור קצר על חברה ← “איזו אסטרטגיה גנרית מתאימה?”; החמש מופיעות כמסיחים, לפעמים עם “תקוע באמצע” או “אוקיינוס כחול”. שאלות הגדרה: “לפי מה מסווג פורטר את האסטרטגיות?” (סוג היתרון × היקף השוק), “מה הסיכון של המשולבת?” (תת-מיצוב ותקוע באמצע), “לאיזה מצב מתאימה המשולבת?” (אוקיינוס כחול). בנימוק תמיד כתבו שתי מילים: <b>מקור היתרון</b> ו<b>היקף השוק</b>."}],"cheat":["פורטר 1985 = מודל האסטרטגיות התחרותיות הגנריות","שני הצירים = סוג היתרון (עלות נמוכה מול ייחודיות) × היקף שוק היעד (רחב מול ממוקד)","המודל צמח משלוש = מנהיגות בעלות, בידול, מיקוד","מנהיגות בעלות רחבה = עלויות נמוכות משמעותית מהמתחרים, לקהל רחב","איך משיגים מנהיגות בעלות = ייעול שרשרת הערך, מיקור חוץ, מוצר חף מקישוטים, מכירה ישירה","בידול רחבה = מוצר שנתפס כייחודי ושונה, בשוק רחב, במחיר פרימיום","ממוקדת מנהיגות בעלות = נישה מוגדרת + עלויות מינימליות","ממוקדת בידול = נישה ספציפית + מענה ייחודי ומותאם אישית","משולבת (Best-Cost / Integrated) = יותר ערך עבור המחיר: בידול + עלויות נמוכות","דוגמאות למשולבת = הונדה, טויוטה, איקאה, H&M","משולבת מתאימה ל = אוקיינוס כחול (שבירת הפשרה בין ערך לעלות)","סיכון המשולבת = תת-מיצוב והילכדות במצב “תקוע באמצע”","תקוע באמצע = לא זול ולא מיוחד; מאבד לקוחות לשני הכיוונים","משולבת מול תקוע באמצע = מצליחה בשניהם מול נכשלת בשניהם","שתי אסטרטגיות המיקוד = נבדלות רק בסוג היתרון (זול מול ייחודי)","רחב מול ממוקד = “לכולם” מול “רק ל…”","מנהיגות בעלות = עלות נמוכה, לא רק מחיר נמוך","בידול = מה שקובע הוא תפיסת הלקוח","אוקיינוס כחול = לא אחת מחמש האסטרטגיות הגנריות","פתרון שאלת סיפור = מקור היתרון ← היקף השוק ← גם וגם?"],"mcq":[{"id":"m4-1","q":"StudentPrint מדפיסה עבודות <b>רק לסטודנטים</b> ליד הקמפוס. ההדפסה בסיסית, אין שירות עיצוב, והמחירים הכי נמוכים באזור. איזו אסטרטגיה גנרית מתאימה?","o":["מנהיגות בעלות רחבה","ממוקדת מנהיגות בעלות","ממוקדת בידול","משולבת מנהיגות בעלות/בידול"],"a":1,"w":["החברה לא פונה לכל הקהל – רק לסטודנטים, כלומר נישה.","","יש נישה, אבל היתרון הוא מחיר נמוך ושירות בסיסי, לא ייחוד.","אין כאן בידול – ההדפסה בסיסית בלבד."],"why":"נישה (סטודנטים) + עלות נמוכה = ממוקדת מנהיגות בעלות."},{"id":"m4-2","q":"סדנת הכינורות Stradella בונה כינורות בעבודת יד, בהתאמה אישית לכל נגן, ומוכרת רק לסולנים מקצועיים. כינור עולה עשרות אלפי דולרים. איזו אסטרטגיה מתאימה?","o":["בידול רחבה","ממוקדת מנהיגות בעלות","תקוע באמצע","ממוקדת בידול"],"a":3,"w":["הסדנה לא פונה לשוק רחב – רק לסולנים מקצועיים.","יש נישה, אבל המחיר גבוה מאוד והיתרון הוא ייחוד.","הסדנה בחרה בבירור קהל ויתרון, ואין סימן לכישלון.",""],"why":"נישה (סולנים) + מענה ייחודי ומותאם אישית = ממוקדת בידול."},{"id":"m4-3","q":"חברת התעופה SkyBasic טסה לכל אירופה עם סוג מטוס אחד, בלי ארוחות חינם, ומוכרת כרטיסים רק באתר שלה. כל אחד יכול לטוס איתה, והעלויות שלה הכי נמוכות בענף. איזו אסטרטגיה מתאימה?","o":["מנהיגות בעלות רחבה","ממוקדת מנהיגות בעלות","משולבת מנהיגות בעלות/בידול","בידול רחבה"],"a":0,"w":["","החברה פונה לכל אחד, לא לנישה.","אין כאן ערך מיוחד – להפך, שירות בסיסי בלי תוספות.","היתרון הוא עלות, לא ייחוד שהלקוח משלם עליו יותר."],"why":"שוק רחב + עלות נמוכה (מוצר חף מקישוטים, מכירה ישירה, ייעול) = מנהיגות בעלות רחבה."},{"id":"m4-4","q":"חברת NovaPhone מוכרת טלפונים בכל העולם, לכל קבוצות הגיל. הטלפונים ידועים בעיצוב ייחודי, במצלמה החדשנית בשוק ובמותג חזק, ומחירם גבוה מהמתחרים. איזו אסטרטגיה מתאימה?","o":["ממוקדת בידול","מנהיגות בעלות רחבה","בידול רחבה","משולבת מנהיגות בעלות/בידול"],"a":2,"w":["החברה לא פונה לנישה – היא מוכרת לכל קבוצות הגיל בכל העולם.","המחיר גבוה מהמתחרים והיתרון הוא ייחוד, לא עלות.","","אין כאן עלות נמוכה או מחיר נגיש – רק פרימיום."],"why":"שוק רחב + ייחודיות שנתפסת אצל הלקוח = בידול רחבה."},{"id":"m4-5","q":"חברת הרכב Kaito מוכרת לכל הקהל מכוניות אמינות ומאובזרות, במחיר נמוך משמעותית ממותגי היוקרה. בזכות ייצור רזה ואוטומציה העלויות שלה נמוכות. איזו אסטרטגיה מתאימה?","o":["מנהיגות בעלות רחבה","בידול רחבה","משולבת מנהיגות בעלות/בידול","תקוע באמצע"],"a":2,"w":["הסיפור מדגיש גם ערך מיוחד (אמינות, אבזור), לא רק עלות.","הסיפור מדגיש גם עלות ומחיר נמוכים, לא רק ייחוד.","","החברה מצליחה בשני הדברים – זה ההפך מתקוע באמצע."],"why":"יותר ערך עבור המחיר: גם בידול וגם עלויות נמוכות, בהצלחה = משולבת (כמו הונדה וטויוטה)."},{"id":"m4-6","q":"רשת האלקטרוניקה ElectroMax ניסתה להוריד מחירים כדי להתחרות באתרי אינטרנט זולים, ובמקביל השקיעה בחנויות מפוארות ובשירות אישי. אחרי כמה שנים הלקוחות עזבו – חלק לאתרים הזולים וחלק לחנויות היוקרה. מה מצבה?","o":["תקועה באמצע","משולבת מנהיגות בעלות/בידול","ממוקדת בידול","מנהיגות בעלות רחבה"],"a":0,"w":["","במשולבת החברה מצליחה בשני הדברים. כאן היא נכשלה בשניהם.","אין כאן נישה, וגם לא בידול מוצלח.","החברה לא הצליחה להיות זולה מהמתחרים."],"why":"לא זולה ולא מיוחדת, ומאבדת לקוחות לשני הכיוונים = תקועה באמצע."},{"id":"m4-7","q":"לפי מה מסווג פורטר את האסטרטגיות התחרותיות הגנריות?","o":["לפי המוצר (קיים או חדש) והשוק (קיים או חדש)","לפי גודל החברה ושלב חיי המוצר","לפי חוזקות וחולשות מול הזדמנויות ואיומים","לפי סוג היתרון התחרותי (עלות נמוכה מול ייחודיות) והיקף שוק היעד (רחב מול ממוקד)"],"a":3,"w":["זו מטריצת Ansoff לאסטרטגיות צמיחה.","אלה לא הצירים של פורטר.","זה מודל TOWS.",""],"why":"שני הצירים של פורטר: סוג היתרון × היקף שוק היעד."},{"id":"m4-8","q":"מודל האסטרטגיות הגנריות של פורטר צמח משלוש אסטרטגיות עיקריות. מהן?","o":["חדירה לשוק, פיתוח מוצר וגיוון","מנהיגות בעלות, בידול ומיקוד","ביטול, צמצום והגבהה","SO, WO ו-ST"],"a":1,"w":["אלה אסטרטגיות צמיחה של Ansoff.","","אלה פעולות מתוך מטריצת ERRC של אוקיינוס כחול.","אלה תאים בטבלת TOWS."],"why":"שלוש האסטרטגיות הבסיסיות: מנהיגות בעלות, בידול, מיקוד (פוקוס)."},{"id":"m4-9","q":"איזה צעד <b>אינו</b> מאפיין אסטרטגיית מנהיגות בעלות רחבה לפי הסיכום?","o":["הוספת שירותי פרימיום מותאמים אישית לכל לקוח","מיקור חוץ של חלק מהפעילויות","הצעת מוצר בסיסי, “חף מקישוטים”","מכירה ישירה ללקוח בלי מתווכים"],"a":0,"w":["","מיקור חוץ הוא אחת הדרכים להוריד עלויות.","מוצר בסיסי בלי תוספות הוא סימן מובהק למנהיגות בעלות.","מכירה ישירה חוסכת עלויות ומאפיינת מנהיגות בעלות."],"why":"שירותי פרימיום מותאמים אישית מייקרים – זה כיוון של בידול, לא של עלות."},{"id":"m4-10","q":"מה מאפיין את האסטרטגיה המשולבת (Best-Cost / Integrated)?","o":["המחיר הנמוך ביותר בענף, בלי שום תוספות","מוצר יוקרה לנישה קטנה של לקוחות עשירים","יותר ערך עבור המחיר – שילוב של בידול ועלויות נמוכות","ויתור על כל סוגי היתרון כדי להתאים לכולם"],"a":2,"w":["זו מנהיגות בעלות, בלי בידול.","זו ממוקדת בידול.","","זה מתאר כישלון – תקוע באמצע – לא אסטרטגיה."],"why":"המשולבת נותנת ללקוח ערך גבוה במחיר נמוך מזה של המבודלים."},{"id":"m4-11","q":"לפי הסיכום, מהו הסיכון המרכזי של האסטרטגיה המשולבת?","o":["נישה קטנה מדי שלא מאפשרת רווח","תת-מיצוב והילכדות במצב של “תקוע באמצע”","מתחרים זולים שמעתיקים את המוצר הבסיסי","לקוחות שלא מוכנים לשלם מחיר פרימיום"],"a":1,"w":["זה סיכון של אסטרטגיות מיקוד.","","זה סיכון של מנהיגות בעלות.","זה סיכון של בידול."],"why":"מי שמנסה “גם וגם” ולא מצליח, נשאר עם מיצוב מטושטש – תקוע באמצע."},{"id":"m4-12","q":"לפי הסיכום, לאיזה מצב מתאימה יותר האסטרטגיה המשולבת?","o":["לאוקיינוס אדום שבו מתחרים רק על מחיר","לנישה קטנה של לקוחות עשירים מאוד","לענף שבו המוצר סטנדרטי וכולם מתחרים על עלות","ליצירת “אוקיינוס כחול”"],"a":3,"w":["באוקיינוס אדום התחרות קשה; המשולבת מתאימה דווקא ליצירת שוק חדש.","לזה מתאימה ממוקדת בידול.","לזה מתאימה מנהיגות בעלות.",""],"why":"אוקיינוס כחול שובר את הפשרה בין ערך לעלות – בדיוק מה שהמשולבת עושה."},{"id":"m4-13","q":"מה ההבדל בין <b>מנהיגות בעלות רחבה</b> לבין <b>ממוקדת מנהיגות בעלות</b>?","o":["סוג היתרון: עלות נמוכה מול ייחודיות","היקף שוק היעד: כל השוק מול נישה מוגדרת","גודל החברה: גדולה מול קטנה","אין הבדל – אלה שני שמות לאותה אסטרטגיה"],"a":1,"w":["בשתיהן סוג היתרון הוא עלות נמוכה.","","ההבדל הוא בקהל שהחברה פונה אליו, לא בגודל שלה.","אלה שתי משבצות שונות במטריצה."],"why":"שתיהן מבוססות על עלות נמוכה; ההבדל הוא ברוחב השוק."},{"id":"m4-14","q":"מה ההבדל בין <b>ממוקדת בידול</b> לבין <b>ממוקדת מנהיגות בעלות</b>?","o":["היקף השוק: רחב מול ממוקד","ממוקדת בידול פונה לכל השוק","ממוקדת מנהיגות בעלות לא דורשת נישה","סוג היתרון: ייחודיות מול עלות נמוכה"],"a":3,"w":["בשתיהן ההיקף ממוקד – נישה.","ממוקדת בידול פונה לנישה ספציפית.","גם היא מתמקדת בנישת שוק מוגדרת.",""],"why":"בשתיהן יש נישה; אחת מנצחת בייחוד והשנייה בעלות נמוכה."},{"id":"m4-15","q":"חברה מסוימת מנצחת בזכות ייחודיות שהלקוחות מעריכים, ופונה לשוק רחב. באיזו משבצת היא נמצאת?","o":["בידול רחבה","ממוקדת בידול","מנהיגות בעלות רחבה","משולבת מנהיגות בעלות/בידול"],"a":0,"w":["","ממוקדת בידול פונה לנישה, לא לשוק רחב.","מנהיגות בעלות מבוססת על עלות, לא על ייחודיות.","במשולבת יש גם עלות נמוכה, ולא נאמר כאן דבר על עלות."],"why":"ייחודיות + שוק רחב = בידול רחבה."},{"id":"m4-16","q":"מותג הקוסמטיקה VeganGlow מייצר קרמים טבעוניים מרכיבים נדירים, רק לנשים טבעוניות שמקפידות על מוצרים אתיים. המחיר כפול ממחיר קרם רגיל. איזו אסטרטגיה מתאימה?","o":["בידול רחבה","ממוקדת מנהיגות בעלות","ממוקדת בידול","מנהיגות בעלות רחבה"],"a":2,"w":["המותג לא פונה לכל השוק – רק לנשים טבעוניות.","המחיר גבוה והיתרון הוא ייחוד, לא עלות נמוכה.","","אין כאן לא שוק רחב ולא עלות נמוכה."],"why":"נישה מוגדרת + מוצר ייחודי במחיר גבוה = ממוקדת בידול."},{"id":"m4-17","q":"רשת המרכולים BigFamily פותחת סניפים רק בשכונות שבהן גרות משפחות גדולות. היא מוכרת אריזות ענק במחירים נמוכים מאוד, בלי פרסום ובלי עיצוב חנויות. איזו אסטרטגיה מתאימה?","o":["מנהיגות בעלות רחבה","ממוקדת בידול","ממוקדת מנהיגות בעלות","משולבת מנהיגות בעלות/בידול"],"a":2,"w":["הרשת פונה לקהל מוגדר (משפחות גדולות), לא לכל השוק.","אין כאן ייחוד – רק מחיר נמוך ושירות בסיסי.","","אין בידול שמצטרף לעלות הנמוכה."],"why":"נישה (משפחות גדולות) + עלויות מינימליות = ממוקדת מנהיגות בעלות."},{"id":"m4-18","q":"רשת הרהיטים HomeStyle מוכרת לכל הקהל רהיטים בעיצוב סקנדינבי מוקפד, במחיר נגיש, בזכות אריזות שטוחות ומחסנים אוטומטיים. המנכ״ל אומר: “אנחנו לא בוחרים בין מחיר לעיצוב – אנחנו נותנים את שניהם.” איזו אסטרטגיה מתאימה?","o":["משולבת מנהיגות בעלות/בידול","מנהיגות בעלות רחבה","בידול רחבה","ממוקדת בידול"],"a":0,"w":["","הסיפור מדגיש גם עיצוב מוקפד – זה בידול, לא רק עלות.","הסיפור מדגיש גם מחיר נגיש ועלויות נמוכות.","הרשת פונה לכל הקהל, לא לנישה."],"why":"גם עיצוב (בידול) וגם עלות נמוכה, לשוק רחב, בהצלחה = משולבת."},{"id":"m4-19","q":"הבנק הדיגיטלי EasyBank פועל בלי סניפים, מציע רק חשבון בסיסי בלי תוספות, ופונה לכל האוכלוסייה עם העמלות הנמוכות בשוק. איזו אסטרטגיה מתאימה?","o":["ממוקדת מנהיגות בעלות","בידול רחבה","תקוע באמצע","מנהיגות בעלות רחבה"],"a":3,"w":["הבנק פונה לכל האוכלוסייה, לא לנישה.","אין כאן ייחוד שהלקוח משלם עליו יותר – להפך, הכי זול.","הבנק בחר בבירור ביתרון עלות, ואין סימן לכישלון.",""],"why":"שוק רחב + עלות נמוכה (בלי סניפים, מוצר בסיסי, מכירה ישירה) = מנהיגות בעלות רחבה."},{"id":"m4-20","q":"מה ההבדל בין האסטרטגיה המשולבת לבין מצב של “תקוע באמצע”?","o":["אין הבדל – אלה שני שמות לאותו דבר","במשולבת החברה מצליחה לתת יותר ערך בעלות נמוכה; בתקוע באמצע היא לא נתפסת לא כזולה ולא כמיוחדת","משולבת מתאימה לנישה, ותקוע באמצע לשוק רחב","תקוע באמצע היא אסטרטגיה שפורטר המליץ עליה לחברות קטנות"],"a":1,"w":["אחד הוא אסטרטגיה מצליחה, השני הוא כישלון.","","ההבדל הוא הצלחה מול כישלון, לא היקף השוק.","פורטר הזהיר מפני המצב הזה; זה לא דבר שממליצים עליו."],"why":"בשתיהן יש “גם וגם”, אבל רק במשולבת זה עובד. תקוע באמצע הוא הסיכון של המשולבת."},{"id":"m4-21","q":"חברת התוכנה DentSoft מוכרת תוכנת ניהול בסיסית <b>רק למרפאות שיניים קטנות</b>, במחיר החודשי הנמוך ביותר בשוק, בלי התקנה ובלי הדרכה אישית. איזו אסטרטגיה מתאימה?","o":["ממוקדת מנהיגות בעלות","ממוקדת בידול","מנהיגות בעלות רחבה","בידול רחבה"],"a":0,"w":["","יש נישה, אבל המוצר בסיסי והיתרון הוא מחיר נמוך.","החברה פונה רק למרפאות שיניים קטנות – נישה.","אין כאן לא שוק רחב ולא ייחוד."],"why":"נישה (מרפאות שיניים קטנות) + עלות נמוכה = ממוקדת מנהיגות בעלות."},{"id":"m4-22","q":"איזה משפט בסיפור מעיד שהאסטרטגיה היא <b>ממוקדת</b> ולא רחבה?","o":["“החברה מוכרת בכל העולם ולכל הגילים”","“המחירים של החברה הכי נמוכים בענף”","“החברה מוכרת רק לבעלי כלבים בתל אביב”","“למוצרים של החברה יש עיצוב ייחודי”"],"a":2,"w":["זה תיאור של שוק רחב.","זה מעיד על סוג היתרון (עלות), לא על היקף השוק.","","זה מעיד על סוג היתרון (בידול), לא על היקף השוק."],"why":"“רק ל…” + קהל או אזור מוגדר = שוק יעד ממוקד."},{"id":"m4-23","q":"איזה מהבאים <b>אינו</b> אחת מחמש האסטרטגיות הגנריות בסיכום?","o":["אסטרטגיית בידול רחבה","אסטרטגיית אוקיינוס כחול","אסטרטגיה ממוקדת מנהיגות בעלות","אסטרטגיה משולבת (Best-Cost)"],"a":1,"w":["זו אסטרטגיה מספר 2 במודל.","","זו אסטרטגיה מספר 3 במודל.","זו אסטרטגיה מספר 5 במודל."],"why":"אוקיינוס כחול הוא כלי מיחידה 2. לפי הסיכום, המשולבת מתאימה לו – אבל הוא לא אחת מהחמש."},{"id":"m4-24","q":"למה חברה שתקועה באמצע מאבדת לקוחות?","o":["כי היא פונה לנישה קטנה מדי","כי המחירים שלה הכי נמוכים בענף","כי היא בחרה אסטרטגיה אחת ברורה מדי","לקוחות שמחפשים מחיר עוברים למנהיג העלות, ולקוחות שמחפשים ייחוד עוברים לחברה המבודלת"],"a":3,"w":["הבעיה של תקוע באמצע היא חוסר יתרון, לא גודל הנישה.","אם המחירים היו הכי נמוכים, היה לה יתרון עלות.","הבעיה היא ההפך – היא לא בחרה בבירור.",""],"why":"אין לה לא יתרון עלות ולא יתרון ייחוד, ולכן היא מפסידה לשני הכיוונים."},{"id":"m4-25","q":"מה הכוונה ב<b>“תת-מיצוב”</b> כסיכון של האסטרטגיה המשולבת?","o":["החברה מוכרת מתחת לעלות כדי לכבוש נתח שוק","הלקוחות לא מבינים בבירור מה החברה מציעה ובמה היא שונה – המיצוב שלה חלש ומטושטש","החברה מתמקדת בנישה קטנה מדי","לחברה יש יותר מדי סניפים"],"a":1,"w":["זה תמחור טורף, לא תת-מיצוב.","","זה סיכון של מיקוד, לא תת-מיצוב.","תת-מיצוב עוסק בתפיסה של הלקוח, לא במספר הסניפים."],"why":"מי שמנסה להיות “גם וגם” בלי הצלחה, לא נתפס לא כזול ולא כמיוחד – תת-מיצוב."}],"tf":[{"id":"m4-t1","s":"מודל האסטרטגיות התחרותיות הגנריות פותח על ידי פורטר ב-1985.","a":true,"why":"נכון. כך מופיע בסיכום."},{"id":"m4-t2","s":"המודל של פורטר מסווג אסטרטגיות לפי גודל החברה ושלב חיי המוצר.","a":false,"why":"לא נכון. הצירים הם סוג היתרון התחרותי (עלות מול ייחודיות) והיקף שוק היעד (רחב מול ממוקד)."},{"id":"m4-t3","s":"אסטרטגיה ממוקדת מנהיגות בעלות מתמקדת בנישת שוק מוגדרת ושומרת על עלויות מינימליות.","a":true,"why":"נכון. נישה + עלות נמוכה."},{"id":"m4-t4","s":"בידול רחבה פירושה מוצר בסיסי וזול לכל הקהל.","a":false,"why":"לא נכון. זו מנהיגות בעלות רחבה. בידול רחבה היא מוצר שנתפס כייחודי, בשוק רחב."},{"id":"m4-t5","s":"מיקור חוץ ומכירה ישירה הן דרכים להשיג מנהיגות בעלות רחבה.","a":true,"why":"נכון. לצד ייעול שרשרת הערך ומוצר חף מקישוטים."},{"id":"m4-t6","s":"ממוקדת בידול וממוקדת מנהיגות בעלות נבדלות זו מזו בהיקף שוק היעד.","a":false,"why":"לא נכון. בשתיהן ההיקף ממוקד. הן נבדלות בסוג היתרון: ייחודיות מול עלות."},{"id":"m4-t7","s":"האסטרטגיה המשולבת נותנת יותר ערך עבור המחיר, בשילוב של בידול ועלויות נמוכות.","a":true,"why":"נכון. זו ההגדרה של Best-Cost / Integrated."},{"id":"m4-t8","s":"הסיכון המרכזי של האסטרטגיה המשולבת הוא שהיא מוגבלת לנישה קטנה.","a":false,"why":"לא נכון. הסיכון המרכזי הוא תת-מיצוב והילכדות במצב של תקוע באמצע."},{"id":"m4-t9","s":"לפי הסיכום, האסטרטגיה המשולבת מתאימה יותר ל“אוקיינוס כחול”.","a":true,"why":"נכון. שתיהן שוברות את הפשרה בין ערך לעלות."},{"id":"m4-t10","s":"חברה תקועה באמצע היא חברה שבחרה במודע באסטרטגיה המשולבת והצליחה.","a":false,"why":"לא נכון. תקוע באמצע הוא כישלון: החברה לא זולה ולא מיוחדת."},{"id":"m4-t11","s":"מנהיגות בעלות פירושה עלויות נמוכות משמעותית מהמתחרים, ולא רק מחיר נמוך.","a":true,"why":"נכון. היתרון הוא מבנה העלויות; מחיר נמוך בלי עלות נמוכה הוא הפסד."},{"id":"m4-t12","s":"מוצר “חף מקישוטים” (No-frills) הוא סימן לאסטרטגיית בידול.","a":false,"why":"לא נכון. מוצר בסיסי בלי תוספות הוא סימן למנהיגות בעלות."},{"id":"m4-t13","s":"המודל של פורטר צמח משלוש אסטרטגיות עיקריות: מנהיגות בעלות, בידול ומיקוד.","a":true,"why":"נכון. מהן נבנו חמש האסטרטגיות."},{"id":"m4-t14","s":"אסטרטגיית מיקוד חייבת תמיד להיות זולה.","a":false,"why":"לא נכון. יש ממוקדת מנהיגות בעלות וגם ממוקדת בידול."},{"id":"m4-t15","s":"חברה שמוכרת שעוני יוקרה בעבודת יד לאספנים בלבד פועלת באסטרטגיה ממוקדת בידול.","a":true,"why":"נכון. נישה (אספנים) + ייחוד."},{"id":"m4-t16","s":"חברה שמוכרת לכל השוק מוצר יוקרתי במחיר פרימיום פועלת באסטרטגיה ממוקדת בידול.","a":false,"why":"לא נכון. כשהשוק רחב, זו בידול רחבה."},{"id":"m4-t17","s":"באסטרטגיית בידול, הדבר החשוב הוא שהלקוח תופס את המוצר כבעל ערך ייחודי.","a":true,"why":"נכון. בלי תפיסה של ייחוד אצל הלקוח אין בידול."},{"id":"m4-t18","s":"אוקיינוס כחול היא אחת מחמש האסטרטגיות הגנריות של פורטר.","a":false,"why":"לא נכון. אוקיינוס כחול הוא כלי מיחידה 2. המשולבת מתאימה לו, אבל הוא לא אחת מהחמש."},{"id":"m4-t19","s":"הציר של סוג היתרון במטריצה של פורטר מבחין בין עלות נמוכה לבין ייחודיות.","a":true,"why":"נכון. הציר השני הוא היקף שוק היעד."},{"id":"m4-t20","s":"חברה שתקועה באמצע נהנית משני היתרונות: עלות נמוכה וייחודיות.","a":false,"why":"לא נכון. היא לא משיגה אף אחד מהם, ולכן מאבדת לקוחות לשני הכיוונים."},{"id":"m4-t21","s":"כדי לזהות אסטרטגיה בסיפור, שואלים מה מקור היתרון ומה היקף השוק.","a":true,"why":"נכון. אלה שני הצירים של המטריצה."},{"id":"m4-t22","s":"פורטר המליץ ליישם במקביל כמה אסטרטגיות גנריות כדי לפזר סיכון.","a":false,"why":"לא נכון. פורטר הזהיר שמי שלא בוחר בבירור עלול להיתקע באמצע."}],"scope":[{"ref":"סיכום · עמ׳ 8","x":"מודל פורטר (1985): סוג היתרון × היקף שוק היעד","imp":2,"h":"שני צירים, חמש אסטרטגיות"},{"ref":"סיכום · עמ׳ 8","x":"מנהיגות בעלות רחבה","imp":2,"h":"1. מנהיגות בעלות רחבה (Broad Low Cost)"},{"ref":"סיכום · עמ׳ 8","x":"בידול רחבה","imp":2,"h":"2. בידול רחבה (Broad Differentiation)"},{"ref":"סיכום · עמ׳ 8","x":"ממוקדת מנהיגות בעלות","imp":2,"h":"3. ממוקדת מנהיגות בעלות (Focused Low Cost)"},{"ref":"סיכום · עמ׳ 8","x":"ממוקדת בידול","imp":2,"h":"4. ממוקדת בידול (Focused Differentiation)"},{"ref":"סיכום · עמ׳ 8","x":"משולבת (Best-Cost) ואוקיינוס כחול","imp":2,"h":"5. משולבת מנהיגות בעלות/בידול (Best-Cost / Integrated)"},{"ref":"סיכום · עמ׳ 8","x":"הסיכון: תקוע באמצע","imp":1,"h":"תקוע באמצע (Stuck in the Middle)"}],"outScope":[]},{"id":"m5","title":"חדשנות","short":"סוגי חדשנות","blurb":"חמשת סוגי החדשנות בקורס: הדרגתית, רדיקלית ופורצת דרך על מפת 2×2, חדשנות משבשת (כלל ה-50%) וחדשנות חסכנית.","mnemonic":"שתי שאלות למפה: ״כמה טכנולוגיה?״ ו״כמה מודל עסקי?״. נמוך-נמוך = הדרגתית, גבוה-גבוה = רדיקלית, ״גבוה באחד ונמוך בשני״ = פורצת דרך (על האלכסון, פעמיים). מחוץ למפה: משבשת = ״זול, פשוט, מספיק טוב ← חצי ועוד אחד עוברים״; חסכנית = ״יש מאין״ (הודו, Tata Nano).","blocks":[{"t":"h","x":"מהי חדשנות?"},{"t":"p","x":"<b>חדשנות</b> היא יצירת <b>ערך נוסף</b>. יש לה שתי דרכים: לתת <b>פתרון חדש לצורך שכבר קיים</b>, או ליצור <b>פתרון לצורך חדש</b> שלא היה קודם."},{"t":"list","x":["<b>צורך קיים, פתרון חדש</b>: אנשים תמיד רצו להגיע ליעד. Waze נתנה דרך חדשה לנווט.","<b>צורך חדש</b>: לפני הסמארטפון לא היה צורך ב״חנות אפליקציות״. הצורך נוצר יחד עם הפתרון.","חדשנות היא <b>לב העבודה היצירתית</b> ברוב הארגונים. היא לא שייכת רק למחלקת המו״פ."]},{"t":"p","x":"הקורס מבחין בין <b>חמישה סוגי חדשנות</b>: הדרגתית, רדיקלית, פורצת דרך, משבשת (קוטעת) וחסכנית. שלושת הראשונים מסודרים על מפה אחת (2×2). שני האחרונים מוגדרים בנפרד."},{"t":"table","head":["סוג","במשפט אחד","מילת מפתח בסיפור"],"rows":[["הדרגתית (Incremental)","שיפור קטן של מה שכבר קיים","״גרסה משופרת״, ״טעם חדש״, ״עוד תכונה״"],["רדיקלית (Radical)","מוצר חדש לגמרי, מאפס: טכנולוגיה חדשה <b>וגם</b> מודל עסקי חדש","״לא היה דבר כזה״, ״טכנולוגיה חדשה ודרך חדשה להרוויח״"],["פורצת דרך (Breakthrough)","חידוש גבוה ב<b>אחד</b> מהשניים: טכנולוגיה <b>או</b> מודל עסקי","״טכנולוגיה חדשה, נמכרת כרגיל״ או ״מודל עסקי חדש, טכנולוגיה פשוטה״"],["משבשת/קוטעת (Disruptive)","מוצר זול, פשוט, ״מספיק טוב״, שבסוף מוציא את הישנים מהשוק","״זול יותר״, ״פשוט יותר״, ״רוב הלקוחות עברו״"],["חסכנית (Frugal)","חדשנות ממשאבים מוגבלים, ״יש מאין״","״בתקציב זעום״, ״לכפרים בהודו״, ״במחיר נמוך מאוד״"]]},{"t":"exam","x":"כמעט כל שאלה ביחידה הזו היא <b>סיפור קצר על חברה ← איזה סוג חדשנות זה?</b> הדרך הבטוחה: לשאול שתי שאלות על המפה (כמה חידוש טכנולוגי? כמה חידוש במודל העסקי?), ואז לבדוק את הסימנים של משבשת ושל חסכנית."},{"t":"h","x":"מפת סוגי החדשנות: חידוש טכנולוגי × חדשנות במודל העסקי"},{"t":"p","x":"המפה מצליבה שני צירים: <b>הציר האנכי = רמת החידוש הטכנולוגי</b> (נמוכה/גבוהה). <b>הציר האופקי = רמת החדשנות במודל העסקי</b> (נמוכה/גבוהה). כך מתקבלות ארבע משבצות."},{"t":"table","head":["","מודל עסקי: חידוש <b>נמוך</b>","מודל עסקי: חידוש <b>גבוה</b>"],"rows":[["טכנולוגיה: חידוש <b>גבוה</b>","<b>פורצת דרך</b> (Breakthrough)","<b>רדיקלית</b> (Radical)"],["טכנולוגיה: חידוש <b>נמוך</b>","<b>הדרגתית</b> (Incremental)","<b>פורצת דרך</b> (Breakthrough)"]]},{"t":"p","x":"שימו לב: <b>פורצת דרך מופיעה בשתי משבצות</b>, על האלכסון. היא תמיד ״גבוה באחד, נמוך בשני״:"},{"t":"list","x":["טכנולוגיה <b>גבוהה</b> + מודל עסקי <b>קיים</b> ← פורצת דרך.","מודל עסקי <b>חדשני</b> + טכנולוגיה <b>ברמה נמוכה</b> (פשוטה, מוכרת) ← פורצת דרך.","נמוך + נמוך ← הדרגתית. גבוה + גבוה ← רדיקלית."]},{"t":"trap","x":"בספרים אחרים (למשל במטריצה של Satell) המשבצת ״מודל עסקי חדש + טכנולוגיה קיימת״ נקראת ״משבשת״. <b>בקורס הזה</b> היא נקראת <b>פורצת דרך</b>. במבחן עונים לפי הקורס. חדשנות משבשת מוגדרת בקורס בנפרד, לפי מה שקורה ללקוחות בשוק (מעל 50% עוברים)."},{"t":"trap","x":"טעות נפוצה: ״טכנולוגיה חדשה מאוד = רדיקלית״. לא בהכרח. אם המודל העסקי נשאר אותו דבר (מוכרים באותה דרך, לאותם לקוחות), זו <b>פורצת דרך</b>. רדיקלית דורשת <b>גם</b> וגם."},{"t":"exam","x":"כשמופיע סיפור, סמנו לעצמכם: טכנולוגיה – גבוה/נמוך? מודל עסקי – גבוה/נמוך? ואז קראו את התשובה מהטבלה. שאלה ישירה נפוצה: ״באילו משבצות מופיעה חדשנות פורצת דרך?״ ← בשתיים."},{"t":"h","x":"חדשנות הדרגתית (Incremental Innovation)"},{"t":"p","x":"<b>חדשנות הדרגתית</b> (נקראת גם <b>מצרפית</b>) היא <b>שיפור, ייעול והוספת פתרונות</b> על בסיס <b>ידע שכבר יש</b> לחברה. החידוש הטכנולוגי נמוך, והמודל העסקי כמעט לא משתנה."},{"t":"list","x":["זה הסוג הנפוץ ביותר. רוב החדשנות בחברות היא הדרגתית.","סיכון נמוך: החברה יודעת לייצר, יודעת למכור, ומכירה את הלקוחות.","מטרה: לשמור על הלקוחות הקיימים ולהישאר רלוונטיים מול המתחרים."]},{"t":"example","x":"חברת החטיפים CrunchCo מוסיפה לסדרת הצ׳יפסים שלה טעם חדש של צ׳ילי-לימון. אותו מפעל, אותן חנויות, אותם לקוחות. ← <b>הדרגתית</b>. כך גם אייפון חדש עם מצלמה טובה יותר וסוללה חזקה יותר.","title":"דוגמה"},{"t":"trap","x":"״חדשנות הדרגתית״ היא עדיין חדשנות. היגד כמו ״שיפור מוצר קיים אינו נחשב חדשנות״ הוא <b>לא נכון</b>."},{"t":"h","x":"חדשנות רדיקלית (Radical Innovation)"},{"t":"p","x":"<b>חדשנות רדיקלית</b> היא <b>פיתוח מוצר חדש לחלוטין, מאפס</b>. יש בה <b>חידוש טכנולוגי גבוה</b> וגם <b>שינוי רדיקלי במודל העסקי</b>: איך מרוויחים, למי מוכרים ואיך מספקים."},{"t":"list","x":["סיכון גבוה והשקעה גבוהה, אבל גם פוטנציאל לשוק חדש לגמרי.","לרוב יוצרת קטגוריה חדשה של מוצרים."]},{"t":"example","x":"חברת SkyHop מפתחת מונית אווירית חשמלית ללא טייס (טכנולוגיה חדשה). היא לא מוכרת את הכלי, אלא מוכרת נסיעות דרך אפליקציה במנוי חודשי (מודל עסקי חדש). ← <b>רדיקלית</b>: גבוה בשני הצירים.","title":"דוגמה"},{"t":"trap","x":"אם הסיפור מדגיש רק טכנולוגיה חדשה, ואין שינוי בדרך שבה מוכרים ומרוויחים, זו לא רדיקלית אלא פורצת דרך."},{"t":"h","x":"חדשנות פורצת דרך (Breakthrough Innovation)"},{"t":"p","x":"<b>חדשנות פורצת דרך</b> נוצרת כשיש חידוש גבוה ב<b>ציר אחד בלבד</b>. יש לה שתי צורות:"},{"t":"table","head":["צורה","טכנולוגיה","מודל עסקי","דוגמה"],"rows":[["1. טכנולוגיה מתקדמת במודל ישן","<b>גבוהה</b>","קיים (נמוך)","MediScan מפתחת מכשיר הדמיה חדש לגמרי, ומוכרת אותו לבתי חולים בדיוק כמו שמכרה מכשירים קודמים: מכירה + חוזה שירות"],["2. מודל עסקי חדש בטכנולוגיה פשוטה","נמוכה","<b>גבוה</b>","DressLoop מציעה השכרת שמלות ערב במנוי חודשי דרך אתר רגיל. אין טכנולוגיה חדשה, אבל הדרך להרוויח חדשה"]]},{"t":"example","x":"רשת חדרי כושר FitBox עוברת ממנוי שנתי יקר לתשלום לפי שימוש, ופותחת מועדונים קטנים ללא צוות. הציוד והמערכות רגילים. ← מודל עסקי חדשני + טכנולוגיה נמוכה ← <b>פורצת דרך</b>.","title":"סיפור"},{"t":"trap","x":"מסיח נפוץ: ״מודל עסקי חדש בלי טכנולוגיה חדשה = הדרגתית״. לא. הדרגתית היא נמוך <b>בשני</b> הצירים. כאן המודל העסקי השתנה מאוד."},{"t":"h","x":"חדשנות משבשת/קוטעת (Disruptive Innovation)"},{"t":"p","x":"<b>חדשנות משבשת</b> (נקראת גם <b>קוטעת</b>; Disruptive Innovation) היא תהליך שבו מוצר, שירות או טכנולוגיה חדשים <b>משנים את כללי המשחק</b> בשוק. הם יוצרים שוק חדש, ובסוף התהליך <b>דוחקים החוצה</b> את החברות של המוצרים המסורתיים. את המושג פיתח <b>קלייטון כריסטנסן (Christensen)</b> מהרווארד."},{"t":"p","x":"<b>הכלל של הקורס:</b> כאשר <b>מעל 50% מהלקוחות</b> עוברים לטכנולוגיה החדשה, המצב נחשב חדשנות משבשת."},{"t":"steps","x":["בהתחלה המוצר החדש <b>פחות מתוחכם</b> מהמוצר הקיים. החברות הוותיקות מזלזלות בו.","הוא <b>זול, פשוט, ידידותי ונגיש</b>, בלי ״קישוטים״ מיותרים. הוא פונה ללקוחות שהשוק הקיים זונח: לקוחות <b>בשולי השוק (Low-end)</b>, או לקוחות <b>חדשים</b> שלא קנו קודם בכלל.","עם הזמן הטכנולוגיה החדשה משתפרת ונעשית <b>״מספיק טובה״</b> לרוב הלקוחות.","הלקוחות עוברים בהמוניהם. כשמעל 50% עברו ← השוק התהפך, וגם ענקים יכולים ליפול."],"title":"איך זה קורה (הגרף של כריסטנסן: רמת טכנולוגיה × זמן)"},{"t":"list","x":["<b>בהתחלה</b>: פחות חדשני, זול, פשוט, נוח.","<b>קהל</b>: לקוחות חדשים או לקוחות בתחתית השוק.","<b>בסוף</b>: השוק הישן מאבד רלוונטיות."]},{"t":"example","x":"בהתחלה Waze הייתה אפליקציה חינמית, פשוטה, שמבוססת על נהגים שמדווחים. מכשירי ה-GPS הייעודיים היו מדויקים ויקרים. עם הזמן Waze השתפרה, ורוב הנהגים הפסיקו לקנות מכשיר GPS. ← <b>משבשת</b>.","title":"Waze"},{"t":"trap","x":"חדשנות משבשת היא <b>לא</b> ״הטכנולוגיה הכי מתקדמת״. בדרך כלל היא דווקא <b>פשוטה וזולה יותר</b> בהתחלה. מי שבוחר ״משבשת״ רק כי הטכנולוגיה מרשימה – טועה."},{"t":"trap","x":"מוצר זול ופשוט שרק 10%–20% מהלקוחות עברו אליו עדיין <b>לא</b> נחשב משבש לפי כלל הקורס. צריך <b>מעל 50%</b>."},{"t":"exam","x":"סימנים בסיפור: ״זול״, ״פשוט״, ״בהתחלה פחות טוב״, ״לקוחות שלא יכלו להרשות לעצמם״, ״החברות הוותיקות זלזלו״, ״רוב הלקוחות עברו״, ״החברה הוותיקה פשטה רגל״."},{"t":"h","x":"השוואה: חדשנות הדרגתית מול חדשנות משבשת"},{"t":"table","head":["מאפיין","חדשנות הדרגתית (Incremental)","חדשנות משבשת (Disruptive)"],"rows":[["מהות השינוי","שיפורים קטנים והמשכיות של מוצר קיים","מוצר חדש או מודל עסקי חדש לחלוטין"],["קהל היעד","הלקוחות הקיימים בשוק המרכזי","לקוחות חדשים או לקוחות בשולי השוק (Low-end)"],["רמת מחיר","דומה או יקרה יותר (תמורת איכות גבוהה יותר)","בדרך כלל זולה ונגישה מאוד בהתחלה"],["השפעה על השוק","שומרת על יציבות השוק ומחזקת את המובילים","הופכת את השוק הישן ללא רלוונטי ומפילה ענקים"]]},{"t":"example","x":"Kodak שיפרה כל שנה את הפילם שלה: צבעים טובים יותר, מחיר דומה, לאותם לקוחות ← <b>הדרגתית</b>. המצלמה הדיגיטלית הייתה בהתחלה באיכות נמוכה, אבל נוחה ובלי עלות פיתוח. כשרוב הצלמים עברו אליה, Kodak קרסה ← <b>משבשת</b>.","title":"אותו ענף, שני סוגים"},{"t":"trap","x":"שאלה נפוצה: ״מי מחזקת את מובילי השוק?״ ← הדרגתית. ״מי פונה ללקוחות Low-end?״ ← משבשת. אל תהפכו."},{"t":"h","x":"דוגמאות לחדשנות משבשת"},{"t":"table","head":["טכנולוגיה משבשת (החדשה)","טכנולוגיה משובשת (הישנה שנדחקה)"],"rows":[["טלפון נייד","טלפון קווי"],["ויקיפדיה","אנציקלופדיה מודפסת"],["מצלמה דיגיטלית (מצלמת סטילס)","מצלמת פילם"],["קנייה אינטרנטית","קנייה בספרים/בחנויות (בסימן שאלה)"]]},{"t":"p","x":"<b>משבשת</b> = החדשה שתוקפת. <b>משובשת</b> = הישנה שנפגעה. בזוג האחרון הסיכום שם <b>סימן שאלה</b>: עדיין לא ברור שרוב הקונים עזבו את החנויות הפיזיות, ולכן לפי כלל ה-50% זה שנוי במחלוקת."},{"t":"example","x":"בהתחלה ויקיפדיה נחשבה פחות אמינה מאנציקלופדיה בריטניקה. אבל היא חינמית, זמינה תמיד ומתעדכנת מהר. רוב האנשים עברו אליה, והאנציקלופדיה המודפסת הפסיקה לצאת. ← משבשת.","title":"ויקיפדיה"},{"t":"trap","x":"שימו לב לכיוון בשאלה: ״איזו טכנולוגיה <b>משובשת</b> בזוג נייד–קווי?״ ← הטלפון ה<b>קווי</b>."},{"t":"h","x":"חדשנות חסכנית (Frugal Innovation)"},{"t":"p","x":"<b>חדשנות חסכנית</b> (Frugal Innovation) היא חדשנות שנובעת מ<b>מקורות מוגבלים</b>: מעט כסף, מעט חומרים, מעט תשתיות. בקורס מכנים אותה <b>״יש מאין״</b>. המטרה: מוצר פשוט, עמיד וזול מאוד שמתאים ללקוחות עם הכנסה נמוכה."},{"t":"p","x":"המדינה המזוהה ביותר עם הסוג הזה היא <b>הודו</b>. במקור ההודי זה נקרא ״ג׳וגאד״ (Jugaad): פתרון יצירתי מאלתור."},{"t":"list","x":["<b>טאטא נאנו (Tata Nano)</b>: מכונית שתוכננה לעלות כ-2,500 דולר, למשפחות הודיות שנסעו עד אז ארבעה על קטנוע.","<b>טרקטור מאולתר מאופנוע</b> לחקלאים קטנים שלא יכולים לקנות טרקטור.","<b>מקרר חרס (MittiCool)</b> שמקרר בלי חשמל.","<b>מכשיר א.ק.ג. נייד וזול</b> (של GE) לכפרים בלי בית חולים."]},{"t":"example","x":"סטארטאפ בקניה מפתח מנורת לילה סולארית שעולה 5 דולר, מחלקים פשוטים, למשפחות בלי חיבור לחשמל. ← <b>חסכנית</b>: חדשנות ממשאבים מוגבלים, ללקוחות עניים.","title":"סיפור"},{"t":"trap","x":"חסכנית ומשבשת שתיהן ״זולות״. ההבדל: <b>חסכנית</b> מדגישה את ה<b>מחסור במשאבים</b> שממנו נולד הפתרון (״יש מאין״). <b>משבשת</b> מדגישה את ה<b>תוצאה בשוק</b>: הלקוחות עוברים (מעל 50%) והישנים נדחקים. אם הסיפור מדבר על ״מעט משאבים, תקציב זעום, כפר בהודו״ ← חסכנית."},{"t":"h","x":"איך מזהים את סוג החדשנות בשאלת סיפור"},{"t":"steps","x":["האם הסיפור מדגיש <b>משאבים מוגבלים</b> / ״יש מאין״ / שוק עני? ← <b>חסכנית</b>.","האם יש <b>מוצר זול ופשוט</b> שבסוף <b>רוב הלקוחות</b> עברו אליו והוותיקים נדחקו? ← <b>משבשת</b>.","אחרת, שאלו: חידוש טכנולוגי גבוה? חידוש במודל העסקי גבוה?","נמוך + נמוך ← <b>הדרגתית</b>. גבוה + גבוה ← <b>רדיקלית</b>. גבוה באחד בלבד ← <b>פורצת דרך</b>."],"title":"סדר עבודה"},{"t":"exam","x":"מסיחים קבועים: רדיקלית מול פורצת דרך (האם גם המודל העסקי השתנה?), הדרגתית מול פורצת דרך (מודל עסקי חדש בטכנולוגיה פשוטה הוא פורצת דרך), משבשת מול חסכנית (תוצאה בשוק מול מחסור במשאבים)."}],"cheat":["חדשנות = יצירת ערך נוסף: פתרון חדש לצורך קיים, או פתרון לצורך חדש","5 סוגים בקורס = הדרגתית, רדיקלית, פורצת דרך, משבשת (קוטעת), חסכנית","מפת החדשנות = ציר אנכי: חידוש טכנולוגי; ציר אופקי: חדשנות במודל העסקי","הדרגתית (מצרפית, Incremental) = טכנולוגיה נמוכה + מודל עסקי כמעט ללא שינוי","רדיקלית (Radical) = מוצר חדש מאפס: טכנולוגיה גבוהה + שינוי רדיקלי במודל העסקי","פורצת דרך (Breakthrough) = גבוה באחד בלבד; מופיעה בשתי משבצות","פורצת דרך צורה 1 = טכנולוגיה גבוהה על מודל עסקי קיים","פורצת דרך צורה 2 = מודל עסקי חדשני עם טכנולוגיה ברמה נמוכה","משבשת/קוטעת (Disruptive, כריסטנסן) = מוצר חדש שמשנה את כללי המשחק ודוחק את המסורתיים","כלל הקורס = מעל 50% מהלקוחות עברו לטכנולוגיה החדשה ← משבשת","משבשת בהתחלה = פחות חדשנית, זולה, פשוטה, ידידותית, נגישה","קהל משבשת = לקוחות חדשים או בשולי השוק (Low-end)","קהל הדרגתית = לקוחות קיימים בשוק המרכזי","מחיר הדרגתית = דומה או יקר יותר; מחיר משבשת = זול ונגיש","השפעה הדרגתית = מחזקת מובילים; משבשת = מפילה ענקים","דוגמאות משבשת = נייד/קווי, ויקיפדיה/אנציקלופדיה, דיגיטלית/פילם, Waze/GPS","קנייה אינטרנטית מול חנויות = בסימן שאלה בסיכום","משבשת = החדשה; משובשת = הישנה שנדחקה","חסכנית (Frugal) = חדשנות ממקורות מוגבלים, ״יש מאין״","המדינה המובילה בחסכנית = הודו; דוגמה: Tata Nano","חסכנית מול משבשת = מחסור במשאבים מול מעבר רוב הלקוחות"],"mcq":[{"id":"m5-1","q":"חברת החטיפים CrunchCo מוסיפה לסדרת הצ׳יפסים הקיימת טעם חדש. הייצור נעשה באותו מפעל, המוצר נמכר באותן חנויות ולאותם לקוחות. איזה סוג חדשנות זה?","o":["חדשנות רדיקלית","חדשנות משבשת","חדשנות הדרגתית","חדשנות פורצת דרך"],"a":2,"w":["רדיקלית היא מוצר חדש מאפס עם טכנולוגיה ומודל עסקי חדשים; כאן כמעט שום דבר לא השתנה.","אין כאן מוצר זול שמוציא את הוותיקים מהשוק; זה שיפור לאותם לקוחות.","","פורצת דרך דורשת חידוש גבוה בטכנולוגיה או במודל העסקי; כאן שניהם נמוכים."],"why":"טכנולוגיה נמוכה + מודל עסקי ללא שינוי = שיפור מתוך ידע קיים. זו חדשנות הדרגתית (מצרפית)."},{"id":"m5-2","q":"חברת SkyHop פיתחה מונית אווירית חשמלית ללא טייס, טכנולוגיה שלא הייתה קיימת. היא לא מוכרת את הכלים אלא מוכרת נסיעות במנוי חודשי דרך אפליקציה. איזה סוג חדשנות זה?","o":["חדשנות רדיקלית","חדשנות הדרגתית","חדשנות פורצת דרך","חדשנות חסכנית"],"a":0,"w":["","הדרגתית היא נמוכה בשני הצירים; כאן שניהם גבוהים.","פורצת דרך גבוהה בציר אחד בלבד; כאן גם הטכנולוגיה וגם המודל העסקי חדשים.","אין כאן מחסור במשאבים או ״יש מאין״; זו טכנולוגיה יקרה ומתקדמת."],"why":"חידוש טכנולוגי גבוה + שינוי רדיקלי במודל העסקי (מכירת נסיעות במנוי) = המשבצת העליונה-ימנית: רדיקלית."},{"id":"m5-3","q":"חברת MediScan פיתחה מכשיר הדמיה רפואי המבוסס על טכנולוגיה חדשה לגמרי. היא מוכרת אותו לבתי חולים בדיוק כמו את המכשירים הקודמים: מכירה חד-פעמית וחוזה שירות. לפי מפת החדשנות של הקורס, זו:","o":["חדשנות פורצת דרך","חדשנות רדיקלית","חדשנות הדרגתית","חדשנות משבשת"],"a":0,"w":["","ברדיקלית גם המודל העסקי משתנה באופן רדיקלי; כאן הוא נשאר אותו דבר.","הדרגתית היא חידוש טכנולוגי נמוך; כאן הטכנולוגיה חדשה לגמרי.","המכשיר לא זול ופשוט ולא פונה ללקוחות Low-end; ואין סימן שרוב השוק נדחק."],"why":"טכנולוגיה ברמה גבוהה על מודל עסקי קיים = אחת משתי המשבצות של פורצת דרך."},{"id":"m5-4","q":"חברת DressLoop מציעה השכרת שמלות ערב במנוי חודשי דרך אתר אינטרנט רגיל. אין בה שום טכנולוגיה חדשה, אבל הדרך להרוויח שונה לגמרי מחנות בגדים. לפי מפת החדשנות של הקורס, זו:","o":["חדשנות הדרגתית","חדשנות פורצת דרך","חדשנות רדיקלית","חדשנות חסכנית"],"a":1,"w":["בהדרגתית המודל העסקי כמעט לא משתנה; כאן הוא השתנה לגמרי.","","רדיקלית דורשת גם חידוש טכנולוגי גבוה; כאן הטכנולוגיה פשוטה.","החדשנות לא נולדה ממחסור במשאבים; היא שינוי בדרך להרוויח."],"why":"מודל עסקי חדשני + טכנולוגיה ברמה נמוכה = המשבצת השנייה של פורצת דרך (התחתונה-ימנית)."},{"id":"m5-5","q":"לפי הכלל שנלמד בקורס, מתי חדשנות נחשבת משבשת/קוטעת?","o":["כאשר הטכנולוגיה החדשה מתקדמת יותר מכל מה שקיים בשוק","כאשר מעל 50% מהלקוחות עוברים לטכנולוגיה החדשה","כאשר החברה משקיעה יותר מ-50% מהתקציב במו״פ","כאשר המוצר החדש יקר יותר מהמוצר הקיים"],"a":1,"w":["משבשת דווקא מתחילה כפשוטה ופחות מתקדמת; הקריטריון הוא מעבר הלקוחות.","","הכלל עוסק בלקוחות שעוברים, לא בתקציב החברה.","משבשת בדרך כלל זולה ונגישה בהתחלה."],"why":"הסיכום קובע במפורש: כשמעל 50% מהלקוחות עוברים לטכנולוגיה החדשה, המצב נחשב חדשנות משבשת/קוטעת."},{"id":"m5-6","q":"במפת סוגי החדשנות, מה נמצא במשבצת של חידוש טכנולוגי נמוך ושל חדשנות נמוכה במודל העסקי?","o":["חדשנות פורצת דרך","חדשנות חסכנית","חדשנות רדיקלית","חדשנות הדרגתית"],"a":3,"w":["פורצת דרך נמצאת במשבצות שבהן ציר אחד גבוה; כאן שניהם נמוכים.","חסכנית לא מופיעה במפה; היא מוגדרת בנפרד.","רדיקלית היא גבוה + גבוה, המשבצת ההפוכה.",""],"why":"נמוך + נמוך = שיפור מתוך ידע קיים = הדרגתית."},{"id":"m5-7","q":"באילו משבצות של מפת סוגי החדשנות מופיעה חדשנות פורצת דרך?","o":["רק במשבצת שבה שני הצירים גבוהים","רק במשבצת שבה הטכנולוגיה גבוהה","היא לא מופיעה במפה, כמו חדשנות משבשת","בשתי משבצות: טכנולוגיה גבוהה עם מודל עסקי קיים, ומודל עסקי חדשני עם טכנולוגיה נמוכה"],"a":3,"w":["משבצת גבוה-גבוה היא חדשנות רדיקלית.","זו רק אחת משתי המשבצות; פורצת דרך מופיעה גם במשבצת של מודל עסקי חדשני.","פורצת דרך מופיעה במפה, ואפילו פעמיים.",""],"why":"פורצת דרך = גבוה באחד ונמוך בשני, ולכן היא תופסת את שתי המשבצות שעל האלכסון."},{"id":"m5-8","q":"מי פיתח את המושג ״חדשנות משבשת״ (Disruptive Innovation)?","o":["מייקל פורטר (Porter)","איגור אנסוף (Ansoff)","ג׳יי בארני (Barney)","קלייטון כריסטנסן (Christensen)"],"a":3,"w":["פורטר ידוע בחמשת הכוחות, בשרשרת הערך ובאסטרטגיות הגנריות.","אנסוף פיתח את מטריצת אסטרטגיות הצמיחה (יחידה 6).","בארני קשור לגישת המשאבים ול-VRIN.",""],"why":"המושג Disruptive Innovation פותח על ידי קלייטון כריסטנסן מהרווארד."},{"id":"m5-9","q":"חברת NaviBuddy השיקה אפליקציית ניווט חינמית שמבוססת על דיווחי נהגים. בהתחלה היא הייתה פחות מדויקת ממכשירי GPS ייעודיים, אבל חינמית ופשוטה. אחרי כמה שנים כ-70% מהנהגים הפסיקו להשתמש במכשירי GPS, ויצרני המכשירים נקלעו לקשיים. איזה סוג חדשנות זה?","o":["חדשנות משבשת/קוטעת","חדשנות הדרגתית","חדשנות רדיקלית","חדשנות חסכנית"],"a":0,"w":["","הדרגתית מחזקת את מובילי השוק; כאן המובילים נדחקו.","הסיפור מדגיש מוצר פשוט וזול שכבש את רוב השוק, לא טכנולוגיה מתקדמת ומודל חדש מאפס.","אין כאן מחסור במשאבים כמקור לחדשנות; העיקר הוא מעבר רוב הלקוחות."],"why":"פשוט, זול, בהתחלה פחות טוב, ובסוף מעל 50% מהלקוחות עברו והוותיקים נדחקו = משבשת (כמו Waze)."},{"id":"m5-10","q":"סטארטאפ השיק מכונת קפה ביתית זולה ופשוטה. אחרי שלוש שנים רק כ-15% מהלקוחות בשוק עברו אליה, והמותגים הוותיקים ממשיכים להוביל. לפי כלל הקורס:","o":["עדיין לא מדובר בחדשנות משבשת, כי פחות מ-50% מהלקוחות עברו","זו חדשנות משבשת, כי המוצר זול ופשוט","זו חדשנות רדיקלית, כי המוצר זול","זו חדשנות הדרגתית, כי היא פונה ללקוחות Low-end"],"a":0,"w":["","זול ופשוט זה תנאי התחלה, אבל לפי הכלל צריך שמעל 50% מהלקוחות יעברו.","מחיר זול לא הופך מוצר לרדיקלי; רדיקלית היא חידוש גבוה בטכנולוגיה ובמודל העסקי.","פנייה ל-Low-end היא סימן של משבשת, לא של הדרגתית."],"why":"הכלל: רק כשמעל 50% מהלקוחות עוברים, זו חדשנות משבשת. 15% עוד לא מספיק."},{"id":"m5-11","q":"לפי טבלת ההשוואה, מי קהל היעד של חדשנות משבשת?","o":["הלקוחות הקיימים בשוק המרכזי","הלקוחות התובעניים ביותר בצמרת השוק","רק לקוחות עסקיים גדולים","לקוחות חדשים או לקוחות בשולי השוק (Low-end)"],"a":3,"w":["זה קהל היעד של חדשנות הדרגתית.","משבשת דווקא פונה לתחתית השוק או ללקוחות חדשים.","אין בהגדרה הגבלה כזו; היא פונה למי שהשוק הקיים זונח.",""],"why":"משבשת נכנסת מלמטה: לקוחות שלא קנו קודם או לקוחות שהסתפקו במוצר ״מספיק טוב״ וזול."},{"id":"m5-12","q":"לפי טבלת ההשוואה, מה רמת המחיר האופיינית לחדשנות הדרגתית?","o":["זולה ונגישה מאוד בהתחלה","חינמית תמיד","דומה או יקרה יותר, תמורת איכות גבוהה יותר","זולה בהרבה מהמוצר הקודם, כדי לכבוש לקוחות חדשים"],"a":2,"w":["זו רמת המחיר של חדשנות משבשת.","אין כלל כזה; הדרגתית בדרך כלל נמכרת במחיר דומה או גבוה יותר.","","כיבוש לקוחות חדשים במחיר זול מאפיין משבשת."],"why":"בהדרגתית מוסיפים שיפורים למוצר קיים, ולכן המחיר דומה או עולה."},{"id":"m5-13","q":"איזו השפעה על השוק מאפיינת חדשנות הדרגתית?","o":["הופכת את השוק הישן ללא רלוונטי","מפילה את החברות הגדולות בענף","יוצרת קטגוריית מוצר חדשה לגמרי מאפס","שומרת על יציבות השוק ומחזקת את המובילים"],"a":3,"w":["זו השפעה של חדשנות משבשת.","גם זו השפעה של משבשת.","זה תיאור של חדשנות רדיקלית.",""],"why":"שיפורים קטנים לאותם לקוחות מחזקים את מי שכבר מוביל."},{"id":"m5-14","q":"בזוג ״טלפון נייד – טלפון קווי״, מהי הטכנולוגיה המשובשת?","o":["הטלפון הקווי","הטלפון הנייד","שניהם משובשים באותה מידה","אף אחד, כי זו דוגמה לחדשנות הדרגתית"],"a":0,"w":["","הנייד הוא הטכנולוגיה המשבשת, החדשה שדחקה את הישנה.","בזוג כזה יש טכנולוגיה חדשה שמשבשת וטכנולוגיה ישנה שנדחקת.","הסיכום מציג את הזוג הזה כדוגמה לחדשנות משבשת."],"why":"משבשת = החדשה (נייד). משובשת = הישנה שנדחקה (קווי)."},{"id":"m5-15","q":"איזה מהבאים <b>אינו</b> מאפיין של מוצר משבש בתחילת דרכו?","o":["פחות חדשני מהמוצרים הקיימים","מתוחכם ויקר, ופונה ללקוחות התובעניים ביותר","זול","פשוט וידידותי לשימוש"],"a":1,"w":["זה בדיוק מאפיין של משבשת בהתחלה.","","מחיר נמוך הוא מאפיין מרכזי של משבשת.","פשטות וידידותיות הם מאפיינים של משבשת."],"why":"בהתחלה מוצר משבש פחות חדשני, זול, פשוט ונגיש. מוצר מתוחכם ויקר לצמרת השוק הוא ההפך."},{"id":"m5-16","q":"חברה הודית פיתחה מקרר מחרס שמקרר בלי חשמל ונמכר בכמה עשרות דולרים, למשפחות בכפרים ללא חיבור לרשת החשמל. איזה סוג חדשנות זה?","o":["חדשנות רדיקלית","חדשנות הדרגתית","חדשנות חסכנית","חדשנות משבשת"],"a":2,"w":["אין כאן טכנולוגיה מתקדמת; זה פתרון פשוט ממשאבים מוגבלים.","זה לא שיפור קטן למקרר קיים עבור אותם לקוחות; זה פתרון שנולד ממחסור.","","אין בסיפור מעבר של רוב הלקוחות בשוק ודחיקת המובילים; הדגש הוא על משאבים מוגבלים."],"why":"״יש מאין״: פתרון זול ופשוט ממשאבים מוגבלים לשוק עני, בהודו. זו חדשנות חסכנית (Frugal)."},{"id":"m5-17","q":"איזו מדינה מזוהה בקורס יותר מכל עם חדשנות חסכנית (Frugal Innovation)?","o":["יפן","הודו","ישראל","גרמניה"],"a":1,"w":["יפן מזוהה יותר עם חדשנות תהליך ואיכות (למשל טויוטה).","","ישראל מזוהה עם הייטק וסטארטאפים, לא עם חדשנות חסכנית בקורס.","גרמניה מזוהה עם הנדסה מדויקת ויקרה."],"why":"השקף של חדשנות חסכנית מציג את דגל הודו ודוגמאות כמו Tata Nano."},{"id":"m5-18","q":"מכונית ה-Tata Nano, שתוכננה להיות המכונית הזולה בעולם עבור משפחות הודיות, היא דוגמה בקורס ל:","o":["חדשנות רדיקלית","חדשנות חסכנית","חדשנות פורצת דרך","חדשנות הדרגתית"],"a":1,"w":["Tata Nano לא נבנתה על טכנולוגיה חדשה לגמרי; היא פישטה מכונית רגילה עד המינימום.","","הקורס מציג אותה תחת חדשנות חסכנית, ״יש מאין״.","זה לא שיפור קטן לדגם קיים עבור אותם לקוחות."],"why":"Tata Nano היא הדוגמה הקלאסית לחדשנות חסכנית מהודו: מוצר זול מאוד שנולד ממשאבים מוגבלים."},{"id":"m5-19","q":"איזו הגדרה מתאימה ביותר ל״חדשנות״ כפי שהיא מוגדרת בקורס?","o":["פיתוח טכנולוגיה חדשה במעבדת מו״פ","יצירת ערך נוסף באמצעות פתרונות חדשים לצרכים קיימים או יצירת פתרונות לצרכים חדשים","הורדת מחיר המוצר כדי למשוך לקוחות","כל רעיון חדש, גם אם לא יוצר ערך"],"a":1,"w":["חדשנות לא חייבת להיות טכנולוגית; גם מודל עסקי חדש הוא חדשנות.","","הורדת מחיר לבדה היא החלטת תמחור, לא בהכרח חדשנות.","ההגדרה מדגישה יצירת ערך נוסף."],"why":"חדשנות = יצירת ערך נוסף: פתרון חדש לצורך קיים, או פתרון לצורך חדש."},{"id":"m5-20","q":"בזוג ״מצלמה דיגיטלית – מצלמת פילם״, מה נכון לפי הקורס?","o":["המצלמה הדיגיטלית היא הטכנולוגיה המשבשת, ומצלמת הפילם היא המשובשת","מצלמת הפילם היא הטכנולוגיה המשבשת","זו דוגמה לחדשנות חסכנית","זו דוגמה לחדשנות הדרגתית, כי שתיהן מצלמות"],"a":0,"w":["","הפילם הוא הטכנולוגיה הישנה שנדחקה.","הקורס מציג את הזוג הזה כדוגמה לחדשנות משבשת.","המעבר לדיגיטל החליף את הטכנולוגיה כולה והפיל ענקים כמו Kodak."],"why":"הדיגיטלית התחילה באיכות נמוכה, השתפרה, רוב הצלמים עברו אליה, והפילם נדחק."},{"id":"m5-21","q":"GE פיתחה מכשיר א.ק.ג. קטן, עמיד וזול מאוד, שאפשר להפעיל על סוללה, בשביל מרפאות בכפרים בהודו שאין להן כסף לציוד רגיל. מה סוג החדשנות?","o":["חדשנות רדיקלית","חדשנות משבשת","חדשנות חסכנית","חדשנות הדרגתית"],"a":2,"w":["המכשיר מפשט טכנולוגיה קיימת; אין חידוש טכנולוגי גבוה ומודל עסקי חדש לגמרי.","הסיפור לא מתאר מעבר של רוב הלקוחות בשוק ודחיקת המכשירים הקיימים.","","זה לא שיפור למכשיר קיים לאותם לקוחות; זה מוצר בסיסי למי שאין לו משאבים."],"why":"מוצר פשוט וזול שנולד מתנאי מחסור, לשוק עני בהודו = חסכנית."},{"id":"m5-22","q":"ויקיפדיה הייתה בהתחלה פחות אמינה מהאנציקלופדיה המודפסת, אבל חינמית, זמינה ומתעדכנת מהר. היום רוב האנשים משתמשים רק בה. מה הדוגמה הזו ממחישה?","o":["חדשנות הדרגתית: שיפור קטן לאנציקלופדיה","חדשנות חסכנית: פתרון לכפרים בהודו","חדשנות משבשת: מוצר פשוט וזול שהשתפר ודחק את המוצר המסורתי","חדשנות רדיקלית: טכנולוגיה מתקדמת מאוד"],"a":2,"w":["ויקיפדיה לא שיפרה את האנציקלופדיה המודפסת; היא החליפה אותה.","הדגש כאן הוא מעבר רוב המשתמשים, לא מחסור במשאבים.","","ויקיפדיה התחילה דווקא כפשוטה ופחות אמינה."],"why":"ויקיפדיה מול אנציקלופדיה היא דוגמה מהסיכום לחדשנות משבשת."}],"tf":[{"id":"m5-t1","s":"חדשנות יכולה להיות גם יצירת פתרון לצורך חדש, ולא רק פתרון חדש לצורך קיים.","a":true,"why":"נכון. ההגדרה בקורס כוללת את שתי האפשרויות: פתרון חדש לצורך קיים, או פתרון לצורך חדש."},{"id":"m5-t2","s":"חדשנות הדרגתית מתאפיינת בחידוש טכנולוגי נמוך ובשינוי מינורי במודל העסקי.","a":true,"why":"נכון. זו המשבצת נמוך-נמוך במפה: שיפור וייעול מתוך ידע קיים."},{"id":"m5-t3","s":"חדשנות רדיקלית היא טכנולוגיה חדשה לחלוטין שנמכרת במודל העסקי הקיים.","a":false,"why":"לא נכון. טכנולוגיה גבוהה על מודל עסקי קיים היא פורצת דרך. רדיקלית דורשת גם שינוי רדיקלי במודל העסקי."},{"id":"m5-t4","s":"חדשנות פורצת דרך יכולה לנבוע ממודל עסקי חדשני שמשתמש בטכנולוגיה ברמה נמוכה.","a":true,"why":"נכון. זו אחת משתי הצורות של פורצת דרך לפי הקורס."},{"id":"m5-t5","s":"במפת סוגי החדשנות, חדשנות פורצת דרך מופיעה במשבצת אחת בלבד.","a":false,"why":"לא נכון. היא מופיעה בשתי משבצות: טכנולוגיה גבוהה + מודל קיים, ומודל חדשני + טכנולוגיה נמוכה."},{"id":"m5-t6","s":"חדשנות משבשת פונה בתחילת דרכה ללקוחות התובעניים ביותר בצמרת השוק.","a":false,"why":"לא נכון. היא פונה ללקוחות חדשים או ללקוחות בשולי השוק (Low-end)."},{"id":"m5-t7","s":"לפי הקורס, כאשר מעל 50% מהלקוחות עוברים לטכנולוגיה החדשה, המצב נחשב חדשנות משבשת.","a":true,"why":"נכון. זה הכלל המפורש שבסיכום."},{"id":"m5-t8","s":"מוצר משבש הוא בדרך כלל יקר יותר מהמוצר הקיים בתחילת דרכו.","a":false,"why":"לא נכון. בהתחלה הוא בדרך כלל זול ונגיש מאוד."},{"id":"m5-t9","s":"חדשנות הדרגתית שומרת על יציבות השוק ומחזקת את החברות המובילות.","a":true,"why":"נכון. היא משפרת מוצרים קיימים לאותם לקוחות, ולכן מחזקת את מי שכבר מוביל."},{"id":"m5-t10","s":"ויקיפדיה מול האנציקלופדיה המודפסת היא דוגמה בקורס לחדשנות משבשת.","a":true,"why":"נכון. היא מופיעה בטבלת הדוגמאות לצד נייד/קווי ודיגיטלית/פילם."},{"id":"m5-t11","s":"חדשנות חסכנית מחייבת תקציבי מחקר ופיתוח גדולים.","a":false,"why":"לא נכון. היא נובעת דווקא ממקורות מוגבלים, ״יש מאין״."},{"id":"m5-t12","s":"מכונית Tata Nano היא דוגמה לחדשנות חסכנית.","a":true,"why":"נכון. מכונית זולה מאוד מהודו, שנולדה מהצורך לתת פתרון במשאבים מוגבלים."},{"id":"m5-t13","s":"Waze מוצגת בקורס כדוגמה לחדשנות חסכנית.","a":false,"why":"לא נכון. Waze מוצגת בשקף של חדשנות משבשת: חינמית, פשוטה, ודחקה את מכשירי ה-GPS."},{"id":"m5-t14","s":"טכנולוגיה משבשת מתחילה לרוב ברמת ביצועים נמוכה מהטכנולוגיה הקיימת ומשתפרת עם הזמן.","a":true,"why":"נכון. זה הגרף של כריסטנסן: בהתחלה פחות חדשנית, ועם הזמן נעשית ״מספיק טובה״ לרוב הלקוחות."},{"id":"m5-t15","s":"חדשנות הדרגתית מכוונת בעיקר ללקוחות חדשים בשולי השוק.","a":false,"why":"לא נכון. הדרגתית מכוונת ללקוחות הקיימים בשוק המרכזי. לקוחות Low-end הם קהל של משבשת."},{"id":"m5-t16","s":"חדשנות רדיקלית היא פיתוח מוצר חדש לחלוטין, מאפס.","a":true,"why":"נכון. עם חידוש טכנולוגי גבוה ושינוי רדיקלי במודל העסקי."},{"id":"m5-t17","s":"מוצר שנוצר בחדשנות הדרגתית תמיד זול יותר מהגרסה הקודמת.","a":false,"why":"לא נכון. המחיר בהדרגתית דומה או יקר יותר, תמורת איכות גבוהה יותר."},{"id":"m5-t18","s":"חדשנות משבשת יכולה להוביל בסוף התהליך לנפילה של חברות ענק בענף.","a":true,"why":"נכון. היא הופכת את השוק הישן ללא רלוונטי ומפילה ענקים, כמו Kodak מול המצלמה הדיגיטלית."}],"scope":[{"ref":"סיכום · עמ׳ 9","x":"מהי חדשנות: יצירת ערך נוסף לצרכים קיימים או חדשים","imp":1,"h":"מהי חדשנות?"},{"ref":"סיכום · עמ׳ 9","x":"מפת סוגי החדשנות: חידוש טכנולוגי × חדשנות במודל העסקי","imp":2,"h":"מפת סוגי החדשנות: חידוש טכנולוגי × חדשנות במודל העסקי"},{"ref":"סיכום · עמ׳ 9","x":"חדשנות מצרפית/הדרגתית (Incremental)","imp":1,"h":"חדשנות הדרגתית (Incremental Innovation)"},{"ref":"סיכום · עמ׳ 9","x":"חדשנות רדיקלית (Radical)","imp":1,"h":"חדשנות רדיקלית (Radical Innovation)"},{"ref":"סיכום · עמ׳ 9","x":"חדשנות פורצת דרך (Breakthrough) – בשתי משבצות","imp":2,"h":"חדשנות פורצת דרך (Breakthrough Innovation)"},{"ref":"סיכום · עמ׳ 9","x":"חדשנות משבשת/קוטעת (Disruptive) וכלל ה-50%","imp":2,"h":"חדשנות משבשת/קוטעת (Disruptive Innovation)"},{"ref":"סיכום · עמ׳ 9","x":"טבלת השוואה: הדרגתית מול משבשת","imp":1,"h":"השוואה: חדשנות הדרגתית מול חדשנות משבשת"},{"ref":"סיכום · עמ׳ 10","x":"דוגמאות לחדשנות משבשת: נייד, ויקיפדיה, מצלמה דיגיטלית, קנייה אינטרנטית","imp":1,"h":"דוגמאות לחדשנות משבשת"},{"ref":"סיכום · עמ׳ 10","x":"חדשנות חסכנית (Frugal) – ״יש מאין״, הודו","imp":1,"h":"חדשנות חסכנית (Frugal Innovation)"}],"outScope":[]},{"id":"m6","title":"אסטרטגיות לשינוי מבני וצמיחה","short":"שינוי מבני וצמיחה","blurb":"מיקור חוץ, ברית אסטרטגית, מיזם משותף, מיזוגים ורכישות, אינטגרציה אופקית ואנכית, ומטריצת הצמיחה של אנסוף.","mnemonic":"סולם הקשר: ״נותנים החוצה״ (מיקור חוץ) ← ״עובדים יחד״ (ברית) ← ״בונים יחד ישות״ (מיזם משותף) ← ״נהיים אחד״ (מיזוג/רכישה). אינטגרציה: אופקית = לצד, למתחרה; אנכית = למעלה או למטה בשרשרת (אחורה לספק, קדימה ללקוח). אנסוף: ספרו כמה ״חדש״ – 0 = חדירה (הכי בטוח), 1 = פיתוח מוצרים/שווקים, 2 = הגוונה (הכי מסוכן).","blocks":[{"t":"h","x":"מפת היחידה: ארבע דרכים לשנות את מבנה החברה"},{"t":"p","x":"היחידה עוסקת בשאלה: <b>איך חברה גדלה או משנה את המבנה שלה?</b> אפשר לסדר את הכלים לפי <b>מידת הקשר</b> בין החברה לגורם החיצוני, מהקשר הרופף ביותר להדוק ביותר:"},{"t":"table","head":["כלי","מה קורה","עוצמת הקשר"],"rows":[["מיקור חוץ (Outsourcing)","נותנים פעילות לגורם חיצוני שמבצע אותה בשבילנו","חוזה ספק-לקוח"],["ברית אסטרטגית (Alliance)","שתי חברות עצמאיות עובדות יחד על מטרה משותפת","שיתוף פעולה רחב"],["מיזם משותף (Joint Venture)","שותפות ספציפית והדוקה, לרוב ישות משותפת חדשה","הדוק יותר"],["מיזוג / רכישה (M&A)","שתי חברות נהיות אחת, או אחת קונה את השנייה","הכי הדוק: בעלות"]]},{"t":"p","x":"אחר כך באים שני כלים שמסבירים <b>לאן</b> גדלים: <b>אינטגרציה</b> (אופקית או אנכית) ו<b>מטריצת אנסוף</b> (אילו מוצרים ובאילו שווקים)."},{"t":"h","x":"מיקור חוץ (Outsourcing)"},{"t":"p","x":"<b>מיקור חוץ</b> הוא העברת פעילות של החברה ל<b>גורם חיצוני</b> שהוא <b>מומחה</b> בתחום או <b>זול יותר</b>. המטרה: לפנות זמן, כסף ותשומת לב ל<b>עסקי הליבה</b>."},{"t":"p","x":"<b>תנאי הכרחי:</b> הפעילות שמוציאים החוצה <b>אינה קריטית</b> ליצירת <b>יתרון תחרותי בר-קיימא</b>. את מה שעושה אותנו מיוחדים לא מוציאים החוצה."},{"t":"table","head":["יתרונות","חסרונות"],"rows":[["התמקדות בליבה","<b>אובדן שליטה</b> על איכות, לוחות זמנים ומידע"],["חיסכון בעלויות (הספק זול יותר / יעיל יותר)","<b>תלות חיצונית</b> בספק: אם הוא נכשל, אנחנו נפגעים"],["גישה למומחיות שאין בבית","סיכון לדליפת ידע"]]},{"t":"example","x":"חברת התוכנה CodeNest מעבירה את הנהלת השכר, הניקיון ומוקד התמיכה הטכנית לחברות חיצוניות, ומשקיעה את כל המשאבים בפיתוח התוכנה. ← <b>מיקור חוץ</b>. Apple מוציאה את הרכבת האייפון ל-Foxconn, אבל שומרת אצלה את העיצוב והתוכנה – כי הם מקור היתרון שלה.","title":"דוגמה"},{"t":"trap","x":"אם בסיפור החברה מוציאה החוצה את <b>מקור היתרון התחרותי</b> שלה (האלגוריתם הסודי, המתכון, העיצוב), זו טעות אסטרטגית: התנאי ההכרחי לא מתקיים."},{"t":"exam","x":"מילים בסיפור: ״העבירה לחברה חיצונית״, ״קבלן משנה״, ״כדי להתמקד ב...״. שאלות נפוצות: מה התנאי ההכרחי? (הפעילות לא קריטית ליתרון) ומה החסרונות? (אובדן שליטה ותלות)."},{"t":"h","x":"ברית אסטרטגית / שיתוף פעולה אסטרטגי (Strategic Alliance)"},{"t":"p","x":"<b>ברית אסטרטגית</b> היא <b>שיתוף פעולה</b> בין חברות <b>שנשארות עצמאיות</b>. משתמשים בה כדי <b>לחדור לשווקים חדשים</b> או <b>לפתח טכנולוגיה</b>, במיוחד כשחסרה <b>יכולת כלכלית</b> או כשלכל צד יש <b>ידע שמשלים</b> את השני."},{"t":"steps","x":["כשרוצים <b>לחדור לשווקים חדשים ו/או גלובליים</b> (השותף המקומי מכיר את השוק).","כשרוצים <b>לפתח טכנולוגיות מתקדמות</b> (מחלקים עלות וידע)."],"title":"מתי נשקול ברית?"},{"t":"p","x":"<b>המטרה:</b> לעבוד יחד על <b>פרויקט מסוים</b>, כך שהתוצאה תהיה <b>טובה יותר לשני הצדדים</b> ממה שכל אחד היה משיג לבד."},{"t":"example","x":"חברות התעופה בברית Star Alliance משתפות טיסות (code-share), מועדון נוסע מתמיד וטרקלינים. כל חברה נשארת עצמאית, עם בעלות ומותג משלה. ← <b>ברית אסטרטגית</b>. גם Starbucks ו-PepsiCo חברו כדי למכור קפה קר בבקבוקים בסופרמרקטים.","title":"דוגמה"},{"t":"trap","x":"בברית <b>אין שינוי בבעלות</b>. אם חברה קונה את השנייה זו רכישה; אם נוצרת חברה משותפת חדשה עם בעלות משותפת זה לרוב מיזם משותף."},{"t":"h","x":"מיזם משותף (Joint Venture)"},{"t":"p","x":"<b>מיזם משותף</b> הוא גם שיתוף פעולה בין חברות לחדירה לשווקים או לפיתוח טכנולוגי, אבל <b>ספציפי והדוק יותר</b>. בדרך כלל החברות מקימות <b>ישות עסקית משותפת חדשה</b>, משקיעות בה הון, ומתחלקות בבעלות, ברווחים ובסיכון."},{"t":"steps","x":["כש<b>אין יכולת כלכלית</b> לכל אחת מהחברות לבד (הפרויקט גדול מדי).","ו/או כש<b>לכל אחת יש ידע מסוים</b> שהפרויקט צריך."],"title":"מתי נשקול מיזם משותף?"},{"t":"example","x":"Sony ו-Honda הקימו יחד את Sony Honda Mobility לפיתוח רכב חשמלי: ל-Sony ידע בתוכנה ובידור, ל-Honda ידע בייצור רכב. החברה החדשה בבעלות משותפת. ← <b>מיזם משותף</b>.","title":"דוגמה"},{"t":"example","x":"BatteryOne ו-VoltCar מקימות חברה חדשה, 50% לכל אחת, כדי לבנות מפעל סוללות. אף אחת לא יכולה לממן את המפעל לבד. ← <b>מיזם משותף</b>.","title":"סיפור"},{"t":"h","x":"ברית אסטרטגית מול מיזם משותף"},{"t":"p","x":"לפי הקורס, <b>שיתוף פעולה (ברית)</b> הוא <b>מושג רחב וכללי</b> לשילוב כוחות. <b>מיזם משותף</b> הוא <b>צורה ספציפית ומהודקת יותר</b> של שיתוף פעולה עסקי."},{"t":"table","head":["","ברית אסטרטגית","מיזם משותף"],"rows":[["רוחב המושג","רחב וכללי","ספציפי ומהודק"],["מבנה","הסכם בין חברות עצמאיות","לרוב ישות חדשה בבעלות משותפת"],["מתי","חדירה לשווקים חדשים/גלובליים, פיתוח טכנולוגיות מתקדמות","אין יכולת כלכלית לכל אחת לבד, ו/או לכל אחת ידע נחוץ"],["דוגמה","Star Alliance, Starbucks + PepsiCo",
