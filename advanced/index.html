<style>
/* Silas Academy. Modern study product: ink-blue structure, one highlighter-yellow signal (the marked answer), soft elevated cards on a cool paper ground. Display: Rubik. Text: IBM Plex Sans Hebrew. Numbers: Plex Mono. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#eceff7; --ink:#0f1430; --muted:#5d6482; --line:#e1e5f0;
  --accent:#2337b4; --accent-ink:#ffffff; --accent-soft:#e8ebfc; --gold:#8a6a00; --gold-soft:#fdf3c8;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#0c1234; --deep-2:#1a2580;
  --good:#16794a; --good-soft:#e1f3e9; --bad:#c0352b; --bad-soft:#fde6e3;
  --shadow:0 1px 2px rgb(15 20 48/.06),0 8px 24px rgb(15 20 48/.06);
  --display:"Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  --body:"IBM Plex Sans Hebrew", "Rubik", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e22; --surface:#121834; --sunk:#0d1229; --ink:#eceffa; --muted:#a0a7c6; --line:#232b52;
  --accent:#8e9cff; --accent-ink:#0a0e22; --accent-soft:#1c2452; --gold:#f5d547; --gold-soft:#2c2812;
  --hl:#f5d547; --hl-ink:#1a1a05; --deep:#070a1c; --deep-2:#18206a;
  --good:#5bd08f; --good-soft:#10301f; --bad:#ff8a7e; --bad-soft:#3a1714;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.25); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h3,h4{font-family:var(--body);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:2.1rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0}
b,strong{font-weight:700}
a{color:var(--accent);text-underline-offset:3px}
bdi{unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.note{color:var(--muted);font-size:.9rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;flex:none}
.brand .names{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.75rem;line-height:1.05}
.brand .sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.brand .cd{margin-inline-start:auto;font-size:.8rem;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:3px 12px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:.98rem}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:700;border-color:var(--gold)}

/* layout */
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
header.page{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
header.page p{color:var(--muted);max-width:62ch}
.sec-title{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.crumbs{display:flex;gap:8px;font-size:.9rem;color:var(--muted)}
.crumbs a{text-decoration:none;font-weight:600}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.field input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;font-size:1rem}
input[type="number"],input[type="date"]{font-family:var(--mono)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);padding:10px 14px;border-radius:10px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:400}
details.more[open] summary::after{content:"−"}
details.more[open]{padding-bottom:18px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center}

/* onboarding */
.welcome{background:linear-gradient(160deg,#0f6476,#082a33);color:#fff;border-radius:20px;padding:clamp(22px,5vw,40px);display:flex;flex-direction:column;gap:14px}
.welcome .eyebrow{color:rgba(255,255,255,.75)}
.welcome h2{font-size:clamp(2rem,6vw,2.7rem)}
.welcome p{max-width:52ch;color:rgba(255,255,255,.88)}
.wl-top{display:flex;align-items:center;gap:10px}.wl-logo{width:34px;height:34px}
.wl-feats{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wl-feats li{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wl-feats b{color:#f0cd87;font-size:1.02rem}.wl-feats span{color:rgba(255,255,255,.85);font-size:.92rem;line-height:1.6}
.wl-facts{display:flex;flex-wrap:wrap;gap:8px}.wl-facts span{font-size:.85rem;padding:4px 12px;border-radius:999px;background:rgba(240,205,135,.16);color:#f6dfae}
.wl-level{border:0;padding:0;margin:0;flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.wl-level legend{color:rgba(255,255,255,.85);font-size:.9rem;margin-bottom:6px;padding:0}
.wl-level label{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;cursor:pointer}
.wl-level label:has(input:checked){border-color:#f0cd87;background:rgba(240,205,135,.14)}
.wl-level input{accent-color:#c8963f;margin-top:5px}.wl-level span{display:flex;flex-direction:column;font-size:.86rem;color:rgba(255,255,255,.8)}.wl-level span b{color:#fff;font-size:.98rem}
.wl-note{font-size:.82rem;color:rgba(255,255,255,.65)!important;margin:0}
.onb{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.onb .field{color:rgba(255,255,255,.85);flex:1 1 180px}
.onb input{background:#fff;color:#0f2a33;border:0}
.onb .btn{background:#c8963f;border-color:#c8963f;color:#1d1406;padding:10px 26px}

/* home */
.hello h2{font-size:clamp(2rem,6vw,2.6rem)}
.hello p{color:var(--muted);margin-top:4px}
.today{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.today h3{font-size:1.45rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .acts{display:flex;gap:6px;flex-wrap:wrap}
.today .todo{font-weight:500}
.today .book{color:var(--muted);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.45rem;font-weight:500}
.stats span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:12px 16px}
ol.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
ol.plan li{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
ol.plan li:first-child{border-top:0}
ol.plan .pd{color:var(--muted);font-size:.85rem}
ol.plan .pdate{color:var(--muted);font-size:.82rem;white-space:nowrap}
ol.plan .ok{color:var(--good);font-weight:700}
ol.plan li.now{background:var(--gold-soft)}
ol.plan li.now .pt{font-weight:700}
ol.plan li.done .pt{color:var(--muted)}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.mastery .eyebrow{margin-top:10px}
@media (max-width:640px){.mastery{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 3rem;gap:10px;align-items:center;padding:6px 0;background:none;border:0;width:100%;text-align:start}
.mrow.static{cursor:default}
.mname{font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.lo{background:var(--bad)} .bar i.mid{background:var(--gold)}
.mpct{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:left}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:480px){.settings{grid-template-columns:1fr}}
.booklist{display:flex;flex-direction:column;margin-top:8px}
.bookrow{display:grid;grid-template-columns:1.6fr .6fr .6fr 1fr;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.bk-t{display:flex;flex-direction:column}
@media (max-width:640px){.bookrow{grid-template-columns:1fr 1fr}.bk-t,.bk-w{grid-column:1/-1}}

/* learn */
.vrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:start;scroll-snap-align:start}
.vcard:hover{border-color:var(--accent)}
.vcard .vt{font-weight:600;padding:0 4px 4px;font-size:.95rem}
.vcard .vdur{padding:0 4px 4px;margin-top:-6px;font-size:.8rem;direction:rtl}
.vthumb{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--bg);aspect-ratio:16/9}
.vthumb svg{width:100%;height:100%;display:block;opacity:.7}
.vplayico{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.05rem;padding-inline-start:3px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ch-h{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--sunk);font-size:.88rem;font-weight:700}
.lrow{display:grid;grid-template-columns:12px 1fr 1.4rem 3rem;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;text-align:start;font-size:1rem}
.ch-h + .lrow{border-top:0}
.lrow:hover .lt{color:var(--accent)}
.lrow .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.lrow .dot.on{background:var(--good);border-color:var(--good)}
.lrow .vid{color:var(--gold);font-size:.8rem}
.lrow .lp{font-size:.82rem;color:var(--muted);text-align:left}
.glsearch{max-width:280px;margin-bottom:12px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px}
.gloss div{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}

/* lesson */
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px}
article.lesson h2{font-size:clamp(2rem,6vw,2.6rem)}
article.lesson > h4{font-size:1.15rem;margin-top:14px}
article.lesson p,article.lesson li{max-width:66ch}
article.lesson ul,article.lesson ol{margin:0;padding-inline-start:22px}
article.lesson li{margin:4px 0}
.zero{background:var(--accent-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.zero .why{font-size:1.06rem;font-weight:500}
.zcols{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.zcols h4{margin-bottom:6px;font-size:.95rem;color:var(--accent)}
.zero dl{margin:0;display:flex;flex-direction:column;gap:2px}
.zero dt{font-weight:700}
.zero dd{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.zero ol{margin:0;padding-inline-start:20px}
@media (max-width:640px){.zcols{grid-template-columns:1fr}}
.fx{font-family:var(--mono);font-size:.92rem;background:var(--sunk);border-inline-start:3px solid var(--gold);padding:10px 14px;border-radius:6px;direction:ltr;text-align:left;overflow-x:auto;line-height:1.85;unicode-bidi:isolate}
span.fx{display:inline;padding:2px 6px;border:0;line-height:1.6}
.ex,.plain,.trap{border-radius:12px;padding:14px 18px;line-height:1.85}
.ex{background:var(--sunk)}
.plain{background:var(--gold-soft)}
.trap{background:var(--bad-soft)}
.trap ul{margin:6px 0 0}
.tbl-wrap{overflow-x:auto;background:linear-gradient(to left,var(--surface) 30%,transparent),linear-gradient(to left,transparent,var(--surface) 70%) 100% 0,radial-gradient(farthest-side at 0 50%,rgb(0 0 0/.14),transparent),radial-gradient(farthest-side at 100% 50%,rgb(0 0 0/.14),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
table.mini{border-collapse:collapse;font-size:.92rem}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.mini td{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
table.mini th{background:var(--sunk);font-weight:600}
.endrow{margin-top:10px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* questions */
.qcard{scroll-margin-top:calc(var(--hdr,150px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead .btn{margin-inline-start:auto}
.qcard>*,.review>*,.qtext{min-width:0;max-width:100%}.tbl-wrap{max-width:100%}
.qtext{font-size:1.1rem;font-weight:500;line-height:1.8}
.qn{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;line-height:1.6}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);min-width:1.1em}

#ad_q{flex:1 1 220px;border-radius:12px;padding:10px 12px;background:var(--sunk);border:1.5px solid transparent}

/* ===== UX polish layer: entry, course card, practice, explanations, lessons, footer ===== */
:root{--ease:cubic-bezier(.2,.7,.2,1);--lift:0 2px 4px rgb(15 20 48/.06),0 14px 34px rgb(15 20 48/.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lift:0 2px 4px rgb(0 0 0/.35),0 16px 40px rgb(0 0 0/.35)}}
:root[data-theme="dark"]{--lift:0 2px 4px rgb(0 0 0/.35),0 16px 40px rgb(0 0 0/.35)}
.btn{transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .15s,border-color .15s,color .15s}
.btn:hover:not([disabled]){transform:translateY(-1px)}
.btn:active:not([disabled]){transform:translateY(0) scale(.98)}
.btn.primary:hover{box-shadow:0 10px 22px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{padding:14px 18px;font-size:1.06rem}
/* entry */
.auth-value{margin:0;font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:10px 14px;line-height:1.55}
.auth h2{margin-top:4px}
.auth .hint{color:var(--muted);font-weight:400;font-size:.82rem}
.auth-pitch{display:flex;flex-direction:column;gap:12px}
.stage .lead{font-size:1.08rem;line-height:1.75;color:rgb(255 255 255/.9);max-width:34ch;margin:0}
.authf .field{gap:6px}
@media (max-width:760px){.authwrap .stage{gap:16px}.stage .lead{font-size:1rem}}
/* course card */
.course.open{cursor:pointer;transition:transform .2s var(--ease),box-shadow .25s var(--ease)}
.course.open:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.course.open:focus-visible{outline:3px solid var(--hl);outline-offset:3px}
.course.open:hover .cover svg path:first-of-type{stroke:#b9c3ff}
.myprog{display:flex;flex-direction:column;gap:7px;background:var(--sunk);border-radius:12px;padding:11px 13px}
.myprog b{font-family:var(--display);font-weight:600;font-size:.88rem}.myprog .cnt{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar2{height:8px;border-radius:99px;background:color-mix(in srgb,var(--line) 80%,transparent);overflow:hidden}
.pbar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--hl)));transition:width .5s var(--ease)}
/* practice */
.qprog{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.qprog b{font-family:var(--display);font-weight:600}
.qprog .note{font-size:.84rem}
.opts{gap:10px}
.opt{align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:54px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--ease),box-shadow .2s var(--ease);font-size:1.02rem}
.opt .k{display:grid;place-items:center;width:30px;height:30px;min-width:30px;border-radius:50%;background:var(--sunk);color:var(--ink);font-family:var(--display);font-weight:700;font-size:.9rem;transition:background .15s,color .15s}
.opt:hover:not([disabled]){border-color:var(--accent);box-shadow:0 6px 18px -10px color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-1px)}
.opt:hover:not([disabled]) .k{background:var(--accent);color:var(--accent-ink)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good)}.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad)}.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]:not(.right):not(.wrong){opacity:.6}
/* explanation */
.expl{background:transparent;padding:0;display:flex;flex-direction:column;gap:12px;line-height:1.85}
.expl .vd{margin:0;background:var(--sunk);border-radius:14px;padding:12px 16px;font-size:1.02rem}
.whywrong{margin:0;border-radius:14px;padding:14px 16px;border-inline-start:4px solid var(--bad)}
.whywrong b:first-child{display:block;color:var(--bad);font-family:var(--display);margin-bottom:2px}
.sol{display:flex;flex-direction:column;gap:10px}
.sb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;flex-direction:column;gap:6px}
.sb h5{margin:0;font-family:var(--display);font-size:.8rem;font-weight:700;letter-spacing:.01em;display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.sb h5::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.sb p{margin:0}
.s-ask h5{color:var(--accent)}
.s-way{background:var(--sunk);border-color:transparent}.s-way h5{color:var(--ink)}
.s-way .sf{background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:.92rem;overflow-x:auto}
.s-right h5{color:var(--good)}
.s-right .sres{background:var(--good-soft);border-radius:10px;padding:8px 12px;font-weight:600}
.s-tip{background:var(--gold-soft);border-color:transparent}.s-tip h5{color:var(--gold)}
.ssteps{margin:2px 0 0;padding-inline-start:1.5em;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.ssteps li{padding-inline-start:4px}
.ssteps li::marker{font-family:var(--display);font-weight:700;color:var(--accent)}
/* lessons: learning blocks */
article.lesson{background:transparent;border:0;box-shadow:none;padding:0;gap:16px}
article.lesson>h2{padding-inline:4px}
.lbody{display:flex;flex-direction:column;gap:14px}
.lsec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:10px}
.lsec h4{font-size:1.12rem;margin:0}
.lsec p{margin:0;line-height:1.9}
.lsec .fx{margin:4px 0}
.lcall{border-radius:var(--r);padding:16px clamp(16px,3vw,22px);line-height:1.9;display:block}
.lcall>.ltag{display:table;margin-bottom:8px}
.lcall>*{max-width:66ch}
.ltag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 11px;margin-bottom:2px}
.ltag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-short{background:var(--surface);color:var(--accent)}
.t-ex{background:var(--surface);color:var(--ink)}
.t-trap{background:var(--surface);color:var(--bad)}
.t-tip{background:var(--surface);color:var(--gold)}
.zero{border-radius:var(--r);padding:18px clamp(16px,3vw,24px)}
.lesson-nav{border-top:0;padding-top:4px}
.fx.fxd{display:flex;flex-direction:column;gap:6px;direction:ltr;text-align:left}
.fxr{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;gap:4px 10px;overflow-x:auto}
.fxlab{direction:rtl;font-family:var(--body);font-size:.84rem;color:var(--muted);order:2;white-space:nowrap}
.fxf{white-space:nowrap;order:1}
/* footer: quiet */
footer.site{border-top:1px solid var(--line);margin-top:28px}
footer.site div{justify-content:center;text-align:center;font-size:.76rem;padding:16px;gap:6px 14px}
/* mobile spacing */
@media (max-width:520px){
  .qprog,.lsec,.sb{border-radius:14px}
  .opt{padding:12px;font-size:1rem}
  .course .cbody{padding:16px}
  .ahero{padding:22px;border-radius:22px}
}
@media (prefers-reduced-motion:reduce){.btn,.opt,.course.open,.pbar2 i{transition:none}.btn:hover,.opt:hover,.course.open:hover{transform:none}}

/* QA round 2 */
bdi.mnw{white-space:nowrap}
.nobr{white-space:nowrap}.nobr>bdi.mlong{white-space:normal}
bdi.mlong{display:inline-block;max-width:100%;white-space:normal;text-align:left;vertical-align:bottom;overflow-wrap:anywhere}
.examgrid .panel{display:flex;flex-direction:column;gap:10px}.examgrid .panel .btn.primary{width:100%;justify-content:center;margin-top:auto}.examgrid .panel .btn.ghost{align-self:center}
.vrow{mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent);-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 40px),transparent);padding-inline-end:40px;margin-top:12px}
.vplayico{inset:auto;bottom:8px;inset-inline-start:8px;margin:0;width:34px;height:34px;font-size:.8rem;box-shadow:0 4px 12px rgb(0 0 0/.2)}
.vpill{display:inline-block;font-size:.72rem;font-weight:600;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle;white-space:nowrap}
nav.tabs{mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to left,#000 calc(100% - 28px),transparent);padding-inline-end:24px}
@media (min-width:640px){nav.tabs{mask-image:none;-webkit-mask-image:none}}
.vplayer{border-radius:var(--r);box-shadow:var(--shadow);border:0}
@media (max-width:520px){.vplayer{margin-inline:0;border-radius:18px}}
@media (max-width:520px){table.mini th,table.mini td{padding:5px 6px;font-size:.8rem}}
:root{--btn:#2337b4;--btn-ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--btn:#4256e6;--btn-ink:#ffffff}}
:root[data-theme="dark"]{--btn:#4256e6;--btn-ink:#ffffff}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.vbig{background:var(--btn);color:var(--btn-ink)}

/* password field, forgot link, toast */
.pw{position:relative;display:flex}.pw input{width:100%;padding-inline-end:46px}
.eye{position:absolute;inset-block:0;inset-inline-end:4px;margin:auto 0;width:38px;height:38px;border:0;background:none;border-radius:10px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{background:var(--surface);color:var(--ink)}.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.eye[aria-pressed="false"] .slash{display:none}
.forgot{align-self:flex-start;font-size:.88rem;margin-top:-4px}
.authwrap.single{grid-template-columns:1fr;max-width:460px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;box-shadow:var(--lift);z-index:20;font-weight:500;transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(8px)}
/* admin */
.user{display:flex;align-items:center;gap:8px}
.adbtn{font:600 .85rem var(--display);border:1.5px solid var(--hl);background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:5px 12px;cursor:pointer}
.adbtn[aria-current="true"]{background:var(--hl);color:var(--hl-ink)}
.kpis.six{grid-template-columns:repeat(6,1fr)}
@media (max-width:900px){.kpis.six{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kpis.six{grid-template-columns:repeat(2,1fr)}}
.adchart{width:100%;height:auto;margin-top:10px;direction:ltr}
.adchart .grid{stroke:var(--line);stroke-dasharray:3 4}.adchart .base{stroke:var(--line)}
.adchart .ax{font:500 10px var(--mono);fill:var(--muted)}
.adchart .b-act{fill:color-mix(in srgb,var(--accent) 55%,transparent)}.adchart .b-su{fill:var(--hl)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.lg-act::before{background:color-mix(in srgb,var(--accent) 55%,transparent)}.lg-su::before{background:var(--hl)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 .86rem var(--display);cursor:pointer}
.chipbtn .cnt{font:600 .75rem var(--mono);background:var(--sunk);border-radius:999px;padding:1px 7px;margin-inline-start:4px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chipbtn[aria-pressed="true"] .cnt{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.adtools{gap:10px}
.dotst{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-inline-end:8px;vertical-align:1px}.dotst.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.minibar{display:inline-block;width:52px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden;vertical-align:middle;margin-inline-end:4px}.minibar i{display:block;height:100%;background:var(--accent)}

/* date picker */
.dp{position:relative}
.dpwrap{position:relative;display:flex}.dpwrap input{width:100%;padding-inline-end:46px;text-align:right;font-family:var(--mono)}
.dpwrap input[aria-invalid="true"]{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.dpbtn{position:absolute;inset-block:0;inset-inline-end:4px;margin:auto 0;width:38px;height:38px;border:0;background:none;border-radius:10px;color:var(--accent);cursor:pointer;display:grid;place-items:center}
.dpbtn:hover{background:var(--accent-soft)}.dpbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.dphint{font-size:.76rem;color:var(--muted)}
.onb .dphint{color:rgb(255 255 255/.65)}
.dpop{position:absolute;top:calc(100% + 6px);inset-inline-start:0;z-index:15;width:288px;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:var(--lift);border:1px solid var(--line);padding:12px}
.dphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.dphead b{font-family:var(--display)}
.dphead button,.dpfoot button{border:0;background:var(--sunk);color:var(--ink);border-radius:10px;min-width:36px;height:34px;font:600 1rem var(--display);cursor:pointer}
.dpgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dpgrid .wd{font-size:.75rem;color:var(--muted);padding:4px 0}
.dpgrid button{border:0;background:none;color:var(--ink);border-radius:10px;height:34px;font:500 .92rem var(--body);cursor:pointer}
.dpgrid button:hover{background:var(--accent-soft)}
.dpgrid button.istoday{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dpgrid button.sel{background:var(--btn);color:var(--btn-ink);font-weight:700}
.dpfoot{display:flex;justify-content:space-between;margin-top:8px}.dpfoot button{padding:0 12px;font-size:.85rem}

/* blocked account + admin block controls */
.auth.blocked{text-align:center;align-items:center;gap:12px}
.lockic{width:64px;height:64px;border-radius:20px;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center}.lockic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:var(--sunk);border-radius:12px;padding:10px 14px}
.contact .sel{user-select:all}
.chip.blk{background:var(--bad-soft);color:var(--bad)}
.blockbox{margin-top:14px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.blockbox.on{border-color:var(--bad);background:var(--bad-soft)}
.blockbox textarea{width:100%;border-radius:10px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);font:inherit;color:var(--ink);resize:vertical}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--bg)}

/* polish round 3: password eye off the text, admin on phones */
.pw input{padding-inline-end:12px;padding-left:48px}
.eye{inset-inline-end:auto;left:4px}
.dpwrap input{padding-inline-end:12px;padding-left:48px}
.dpbtn{inset-inline-end:auto;left:4px}
.bars{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:3px;height:140px;margin-top:12px;padding:0 2px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 34px,var(--line) 34px,var(--line) 35px)}
.bcol{flex:1;height:100%;display:flex;flex-direction:row-reverse;align-items:flex-end;justify-content:center;gap:1px}
.bcol .ba{display:block;flex:1;max-width:14px;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--accent) 60%,transparent)}
.bcol .bs{display:block;flex:1;max-width:14px;border-radius:3px 3px 0 0;background:var(--hl)}
.bax{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:4px}
.bsum{margin:8px 0 0}
.page.row.between{flex-wrap:nowrap;align-items:center}
@media (max-width:640px){
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chipbtn{flex:none}
  .adtools{flex-direction:column;align-items:stretch}.adtools .row{justify-content:space-between}#ad_q{flex:none;width:100%}
  .admwrap{overflow:visible;background:none}
  table.users,table.users tbody{display:block}table.users thead{display:none}
  table.users tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  table.users td{border:0;padding:0;white-space:normal;font-size:.86rem}
  table.users td.c-name{grid-column:1/-1;font-size:1rem}
  table.users td.c-mail{grid-column:1/-1;text-align:right;color:var(--muted);margin-bottom:4px}
  table.users td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:.78rem}
}

/* WhatsApp support */
.wafab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;z-index:12;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 12px;border-radius:999px;background:#15803d;color:#fff;text-decoration:none;box-shadow:0 8px 22px rgb(0 0 0/.22);font:600 .92rem var(--display);transition:transform .15s var(--ease),box-shadow .2s}
.wafab svg{width:26px;height:26px;flex:none;color:#fff}
.wafab .walabel{white-space:nowrap;font-weight:500}.wafab .walabel b{font-weight:700}
.wafab:hover,.wafab:focus-visible{transform:translateY(-2px);box-shadow:0 12px 28px rgb(0 0 0/.26)}
/* phones: the support button is the round icon everywhere except the academy home, so it never hides a field, a number or an answer */
@media (max-width:640px){body:not([data-view="home"]) .wafab{width:52px;height:52px;padding:0;justify-content:center}body:not([data-view="home"]) .wafab .walabel{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}

.wafab[hidden]{display:none}
@media (max-width:720px){#main{padding-bottom:84px}} /* the last button on a phone page never sits under the WhatsApp button */
@media print{.wafab{display:none}}
/* admin: share a learner's place on WhatsApp */
.washare{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#15803d;color:#fff;vertical-align:middle;margin-inline-start:4px;flex:none}
.washare svg{width:17px;height:17px}
.wabtn{background:#15803d!important;border-color:#15803d!important;color:#fff!important;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.wabtn svg{width:18px;height:18px}
.ghost.sm[href]{text-decoration:none}
.placebox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft)}
.placebox .pl{font-weight:600}
.placebox .pl .acc{font-weight:400;font-size:.8rem;margin:0}

/* admin page layout: header, numbers, live + recent, chart, learners, side panel */
.adhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.adhead h2{margin:0}
.adhead .adlive{margin:4px 0 0;display:flex;align-items:center;gap:0;flex-wrap:wrap}
.adacts{display:flex;gap:8px}
.adkpis .kpi b{font-size:1.35rem;white-space:nowrap}
.adgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.adgrid .panel{margin:0}
.panel h4 .cnt,.adtitle .cnt{font:600 .75rem var(--mono);background:var(--good-soft);color:var(--good);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.adlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.adlist li{display:flex;align-items:center;gap:0;flex-wrap:wrap;padding:9px 8px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--line)}
.adlist li:last-child{border-bottom:0}
.adlist li:hover,.adlist li:focus-visible{background:var(--sunk)}
.adlist li b{margin-inline-end:10px}
.adlist li .note{margin:0;font-size:.82rem}
.adempty{margin:10px 0 0}
.adtitle{margin-bottom:10px}.adtitle h4{margin:0}.adtitle .note{margin:0;font-size:.8rem}
.adtools select{flex:none}
table.users td{vertical-align:middle}
@media (min-width:641px){table.users td{white-space:normal}table.users td:first-child{min-width:190px}.adtools{flex-wrap:nowrap}#ad_q{flex:1;min-width:0}.adtools select{width:auto;min-width:220px}}
table.users .minibar{width:44px}
table.users .who{display:flex;align-items:center;gap:4px}
table.users .sub{font-size:.78rem;color:var(--muted);margin-top:2px}

/* ===== motion layer: hovers and small effects. Only on devices with a mouse, and never for people who asked for less motion ===== */
@media (prefers-reduced-motion:no-preference){
  /* screens slide in softly when you move between them (not the admin page, which refreshes itself every minute) */
  body.vchange:not([data-view="admin"]) #main > *{animation:rise .38s var(--ease) both}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(2){animation-delay:.04s}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(3){animation-delay:.08s}
  body.vchange:not([data-view="admin"]) #main > *:nth-child(n+4){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* answers: the right one glows, a wrong one gives a small shake */
  .opt.right{animation:glow .7s var(--ease)}
  .opt.wrong.sel{animation:shake .38s ease}
  @keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
  @keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  /* progress bars fill instead of jumping */
  .bar i,.minibar i,.prog i,.pbar i{transition:width .7s var(--ease)}
  /* toast pops in */
  .toast{animation:pop .28s var(--ease)}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  /* buttons lift, and the main one gets a light sweep across it */
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgb(15 20 48/.45)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.primary,.btn.wabtn{position:relative;overflow:hidden}
  .btn.primary::after,.btn.wabtn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgb(255 255 255/.28) 50%,transparent 65%);transform:translateX(120%);transition:transform .6s var(--ease);pointer-events:none}
  .btn.primary:hover::after,.btn.wabtn:hover::after{transform:translateX(-120%)}
  /* cards rise toward the pointer */
  .course,.vcard,.adlist li,.mslist li,.advisits li{transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .2s,background .15s}
  .course:hover,.vcard:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgb(15 20 48/.45);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
  .kpi{transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 12px 26px -16px rgb(15 20 48/.4)}
  .vcard:hover img,.vcard:hover svg{transform:scale(1.03)}.vcard img,.vcard svg{transition:transform .35s var(--ease)}
  /* answer options lean in */
  .opt:not(.right):not(.wrong):hover{border-color:var(--accent);transform:translateX(-3px);box-shadow:0 8px 20px -14px color-mix(in srgb,var(--accent) 70%,transparent)}
  /* lesson rows and lists */
  .mrow{transition:background .15s,transform .2s var(--ease)}.mrow:hover{transform:translateX(-3px)}
  .adlist li:hover,.mslist li:hover{transform:translateX(-3px)}
  /* the logo winks */
  .brand .logo{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
  .brandlink:hover .logo{transform:rotate(-8deg) scale(1.08)}
  /* tabs and links */
  nav.tabs button:not([aria-current="true"]):hover{background:var(--sunk);color:var(--ink)}
  .flink,.crumbs a,.cbar a{text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .3s var(--ease)}
  .flink:hover,.crumbs a:hover,.cbar a:hover{background-size:100% 1.5px}
  .flink{text-decoration:none}
  /* the support button breathes a little when pointed at */
  .wafab:hover svg{animation:wiggle .5s ease}
  @keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(10deg)}}
  .washare{transition:transform .2s var(--ease)}.washare:hover{transform:scale(1.12)}
  table.adm tbody tr[data-uid]{transition:background .15s}
}

// One interface, two backends. Views only use: ready, user, mode, signup, login, logout, rename, remove,
// key, pullProgress, pushProgress, admin.users, admin.sessions.
const ACC = (() => {
  const LEGACY = 'fs-prep-v1', idOf = email => 'u' + [...norm(email)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7).toString(36);
  function norm(e) { return String(e || '').trim().toLowerCase(); }
  const check = (name, email, pw, signup) => {
    if (signup && !String(name || '').trim()) throw new Error('צריך למלא שם.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(norm(email))) throw new Error('כתובת האימייל לא תקינה.');
    if (signup) { const nm = nameProblem(name); if (nm) throw new Error(nm); const pp = pwProblem(pw, email); if (pp) throw new Error(pp); }
    else if (!String(pw || '')) throw new Error('צריך למלא סיסמה.');
  };
  // a password nobody guesses quickly: 8+ characters, a letter and a digit, not a famous one, not the email itself
  const COMMON = ['12345678', '123456789', '1234567890', '87654321', '11111111', '00000000', '12341234', '11223344', 'password', 'password1', 'password123', 'qwerty12', 'qwerty123', 'qwertyui', 'abc12345', 'abcd1234', 'a1234567', 'aa123456', '1q2w3e4r', '1qaz2wsx', 'asdf1234', 'zxcvbnm1', 'iloveyou', 'iloveyou1', 'admin123', 'admin1234', 'welcome1', 'shalom123', 'israel123'];
  function pwProblem(pw, email) {
    pw = String(pw || ''); const low = pw.toLowerCase(), user = norm(email).split('@')[0];
    if (pw.length < 8) return 'הסיסמה צריכה להיות באורך 8 תווים לפחות.';
    if (!/[A-Za-z\u05D0-\u05EA]/.test(pw) || !/\d/.test(pw)) return 'הסיסמה צריכה לכלול לפחות אות אחת ומספר אחד.';
    if (COMMON.includes(low) || /^(.)\1+$/.test(pw) || /^(0123456789|1234567890)/.test(pw)) return 'זו סיסמה נפוצה שקל לנחש. בחרו סיסמה אחרת.';
    if (user.length >= 4 && low.includes(user)) return 'הסיסמה לא יכולה לכלול את האימייל שלכם.';
    return '';
  }
  function nameProblem(name) {
    const n = String(name || '').trim();
    if (!n) return 'צריך למלא שם.';
    if (n.length > 30) return 'השם ארוך מדי (עד 30 תווים).';
    if (/https?:|www\.|[<>@]|\S\.(com|net|org|io|co|il|ru|xyz|info|me|ly)\b/i.test(n)) return 'בשם אפשר לכתוב רק שם, בלי קישורים או כתובות.';
    return '';
  }
  // after 5 wrong passwords in this browser: a short pause that doubles each time (the server has its own limits too)
  const LOCK = 'silas_lock';
  const lockGet = () => { try { return JSON.parse(localStorage.getItem(LOCK)) || {n: 0, until: 0}; } catch (e) { return {n: 0, until: 0}; } };
  const lockLeft = () => Math.max(0, Math.ceil((lockGet().until - Date.now()) / 1000));
  const lockFail = () => { const l = lockGet(); l.n++; if (l.n >= 5) l.until = Date.now() + 30000 * 2 ** Math.min(5, l.n - 5); try { localStorage.setItem(LOCK, JSON.stringify(l)); } catch (e) {} };
  const lockOk = () => { try { localStorage.removeItem(LOCK); } catch (e) {} };
  const lockCheck = () => { const t = lockLeft(); if (t) throw new Error(`יותר מדי ניסיונות כניסה. נסו שוב בעוד ${t > 90 ? Math.ceil(t / 60) + ' דקות' : t + ' שניות'}.`); };

  // ----- local backend: accounts on this device -----
  const K = 'silas-accounts-v1';
  let db = {users: {}, current: null};
  try { const s = JSON.parse(localStorage.getItem(K)); if (s && s.users) db = s; } catch (e) {}
  const store = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch (e) {} };
  async function hash(pw, salt) {
    const txt = salt + ':' + pw;
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
    catch (e) { let h = 5381; for (const c of txt) h = (h * 33 ^ c.charCodeAt(0)) >>> 0; return 'x' + h.toString(16); }
  }
  const local = {
    async ready() {},
    user: () => db.current && db.users[db.current] ? {id: db.current, name: db.users[db.current].name, email: db.users[db.current].email, isAdmin: false} : null,
    async signup(name, email, pw) {
      check(name, email, pw, true); email = norm(email);
      const id = idOf(email); if (db.users[id]) throw new Error('כבר יש חשבון עם האימייל הזה. אפשר להתחבר.');
      const salt = Math.random().toString(36).slice(2, 10);
      db.users[id] = {name: name.trim(), email, salt, pw: await hash(pw, salt), created: Date.now()};
      // the first account on a device inherits progress saved before accounts existed
      try { const old = localStorage.getItem(LEGACY); if (old && Object.keys(db.users).length === 1) { const s = JSON.parse(old); s.started = !!s.name; localStorage.setItem(`silas:${id}:stats-finance`, JSON.stringify(s)); } } catch (e) {}
      db.current = id; store();
    },
    async login(email, pw) {
      lockCheck(); const id = idOf(email), u = db.users[id];
      if (!u || u.pw !== await hash(String(pw || ''), u.salt)) { lockFail(); throw new Error('האימייל או הסיסמה לא נכונים.'); }
      lockOk(); db.current = id; store();
    },
    async logout() { db.current = null; store(); },
    async rename(name) { const u = db.users[db.current]; if (u && name.trim()) { u.name = name.trim(); store(); } },
    async remove() { const id = db.current; if (!id) return; Object.keys(localStorage).filter(k => k.startsWith(`silas:${id}:`)).forEach(k => localStorage.removeItem(k)); delete db.users[id]; db.current = null; store(); },
    async pullProgress() { return null; }, pushProgress() {},
    async resetPassword() { throw new Error('איפוס סיסמה במייל זמין רק בחשבון מחובר לשרת.'); },
    async updatePassword(pw) { const u = db.users[db.current]; if (!u) return; { const pp = pwProblem(pw, u.email); if (pp) throw new Error(pp); } u.salt = Math.random().toString(36).slice(2, 10); u.pw = await hash(pw, u.salt); store(); },

  };

  // ----- cloud backend: Supabase Auth + tables (see supabase-setup.sql) -----
  let sb = null, me = null, sid = null, beat = null, lastBeat = 0, pushT = null;
  // a password-reset link lands here with "type=recovery" in the address; remember it before the library cleans the URL
  let recovering = typeof location !== 'undefined' && /type=recovery/.test(location.hash + location.search);
  const loadLib = () => window.supabase ? Promise.resolve() : new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js';
    sc.onload = ok; sc.onerror = () => no(new Error('lib')); document.head.appendChild(sc);
  });
  const he = e => { // Supabase errors → plain Hebrew
    const m = String(e && e.message || e);
    if (/Invalid login credentials/i.test(m)) return 'האימייל או הסיסמה לא נכונים.';
    if (/already registered|already exists/i.test(m)) return 'כבר יש חשבון עם האימייל הזה. אפשר להתחבר.';
    if (/Email not confirmed/i.test(m)) return 'צריך לאשר את האימייל לפני הכניסה (בדקו את תיבת הדואר).';
    if (/rate limit|too many/i.test(m)) return 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.';
    if (/captcha/i.test(m)) return 'בדיקת האבטחה ("אני לא רובוט") לא הושלמה. סמנו אותה ונסו שוב.';
    if (/weak|password should|at least \d+ char/i.test(m)) return 'הסיסמה חלשה מדי: לפחות 8 תווים, עם אות ומספר.';
    if (/fetch|network|Failed/i.test(m)) return 'אין חיבור לשרת. בדקו את האינטרנט ונסו שוב.';
    return 'משהו השתבש: ' + m;
  };
  async function loadMe(user) {
    if (!user) { me = null; return; }
    let {data, error} = await sb.from('profiles').select('name,email,is_admin,blocked,block_message').eq('id', user.id).maybeSingle();
    if (error) ({data} = await sb.from('profiles').select('name,email,is_admin').eq('id', user.id).maybeSingle()); // before supabase-block.sql ran
    me = {id: user.id, name: (data && data.name) || (user.user_metadata && user.user_metadata.name) || user.email.split('@')[0], email: user.email, isAdmin: !!(data && data.is_admin), blocked: !!(data && data.blocked), blockMessage: (data && data.block_message) || ''};
  }
  const SID_KEY = 'silas_sid', GEO_KEY = 'silas_geo', VISITS = '_visits';
  // Visit notes (place, disconnect time) also go to the learner's own progress row "_visits", which the
  // basic setup already lets them write and the admin read, so they work even before supabase-live.sql runs.
  let vis = null; // {u, d: {s: {sessionId: {c, ci, f, lat, lng, e}}}}
  const loadVis = async () => {
    const uid = me && me.id; if (!uid) return null;
    if (vis && vis.u === uid) return vis;
    let d = {s: {}}; try { const {data} = await sb.from('progress').select('data').eq('user_id', uid).eq('course', VISITS).maybeSingle(); if (data && data.data && data.data.s) d = data.data; } catch (e) {}
    return (vis = {u: uid, d});
  };
  const noteVisit = (id, patch) => {
    if (!me || !id) return; const uid = me.id;
    const write = v => { if (!v || v.u !== uid) return; const s = v.d.s; s[id] = Object.assign(s[id] || {}, patch);
      Object.keys(s).sort((a, b) => b - a).slice(40).forEach(k => delete s[k]); // keep the latest 40 visits
      sb.from('progress').upsert({user_id: uid, course: VISITS, data: v.d, updated_at: new Date().toISOString()}).then(() => {}, () => {}); };
    if (vis && vis.u === uid) write(vis); else loadVis().then(write); // synchronous when loaded, so it still goes out while the page closes
  };
  const putGeo = (id, country, city, flag, lat, lng, acc) => {
    sb.rpc('set_session_geo', {p_session: id, p_country: country || '', p_city: city || '', p_flag: flag || ''}).then(() => {}, () => {});
    noteVisit(id, Object.assign({c: country || '', ci: city || '', f: flag || '', at: new Date().toISOString()}, lat != null ? {lat, lng, acc} : {}));
  };
  const endVisit = id => { if (!id) return; sb.rpc('end_session', {p_session: id}).then(() => {}, () => {}); noteVisit(id, {e: new Date().toISOString()}); };
  // where the visit comes from: the city of the internet connection right away,
  // then the exact city and neighborhood from the device once the learner allows location
  // the exact device point (the learner allowed it, and the sign-up screen says it is saved), named in Hebrew
  function devicePlace(id, done, fresh) {
    navigator.geolocation.getCurrentPosition(pos => {
      try { localStorage.setItem(GEO_KEY, 'ok'); } catch (e) {}
      const {latitude, longitude} = pos.coords;
      fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=he`).then(r => r.json()).then(g => {
        if (!g || !(g.city || g.locality)) return;
        const city = g.city || g.locality, place = g.locality && g.locality !== city ? `${city} · ${g.locality}` : city;
        const fl = g.countryCode && g.countryCode.length === 2 ? String.fromCodePoint(...[...g.countryCode.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '';
        if (done) done(); putGeo(id, g.countryName, place, fl, +latitude.toFixed(5), +longitude.toFixed(5), Math.round(pos.coords.accuracy || 0));
      }).catch(() => {});

גמאות","אופי"],"rows":[["<b>יעדים פיננסיים</b>","ביצועים כספיים","הגדלת <b>רווח למניה</b> (EPS), <b>תשואה על ההשקעה</b> (ROI), הגדלת הכנסות ורווח","תוצאה, לרוב טווח קצר"],["<b>יעדים אסטרטגיים</b>","המיקום התחרותי של החברה","הגדלת <b>נתח שוק</b>, שיפור <b>מוניטין</b>, <b>עליונות טכנולוגית</b>, שביעות רצון לקוחות","בונים את העתיד, טווח ארוך"]]},{"t":"p","x":"ההבחנה המקובלת בקורס: <b>יעדים אסטרטגיים חשובים יותר מיעדים פיננסיים</b>. הסיבה: היעדים האסטרטגיים בונים את <b>מעמד החברה מול המתחרים</b>, ומהמעמד הזה יגיעו הרווחים של מחר. חברה שרודפת רק אחרי רווח רבעוני עלולה לקצץ במו״פ ובשיווק – להרוויח היום ולהיחלש מחר."},{"t":"example","title":"SnapCore מול אמזון","x":"SnapCore קיצצה 40% מתקציב המו״פ כדי לעמוד ביעד רווח למניה. הרבעון נראה מצוין, אבל תוך שנתיים מתחרה עקף אותה טכנולוגית. אמזון, לעומת זאת, הרוויחה מעט מאוד במשך שנים והתמקדה בנתח שוק ובחוויית לקוח (יעדים אסטרטגיים) – וזה הפך אותה לאחת החברות החזקות בעולם."},{"t":"trap","x":"<b>נתח שוק הוא יעד אסטרטגי</b>, אף שהוא מספר באחוזים. ״רווח למניה״ ו״תשואה על ההשקעה״ – פיננסיים. והקורס לא אומר שיעדים פיננסיים לא חשובים, אלא שהאסטרטגיים חשובים <b>יותר</b>."},{"t":"exam","x":"״איזה מהבאים הוא יעד אסטרטגי?״ ← נתח שוק / מוניטין / עליונות טכנולוגית. ״לפי ההבחנה המקובלת בקורס, אילו יעדים חשובים יותר?״ ← <b>האסטרטגיים</b>."},{"t":"h","x":"מודל בנייה ושחיקה של יתרון תחרותי"},{"t":"p","x":"יתרון תחרותי לא נשאר לנצח. המודל מתאר את ״חיי היתרון״ בגרף: הציר האנכי הוא <b>גודל היתרון התחרותי</b> והציר האופקי הוא <b>הזמן</b>. העקומה עולה, מגיעה לשיא, ויורדת. יש <b>שלוש תקופות</b>:"},{"t":"table","head":["תקופה","מה קורה","מי פועל","סימנים בסיפור"],"rows":[["1. <b>תקופת הבנייה</b>","ביצוע <b>מהלכים אסטרטגיים ליצירת היתרון</b>: פיתוח, השקעה, בניית מותג","החברה","השקעות גדולות, עוד אין רווח מהיתרון"],["2. <b>תקופת התועלת</b>","<b>מימוש היתרון והפקת רווחים</b>. היתרון בגודל המקסימלי","החברה נהנית","רווחים גבוהים, מובילות בשוק"],["3. <b>תקופת השחיקה</b>","<b>מהלכי תגובה של יריבים</b> מכרסמים ביתרון: חיקוי, שיפור, הורדת מחיר","המתחרים","מתחרים מעתיקים, המחיר יורד, היתרון מצטמצם"]]},{"t":"p","x":"מה המסקנה למנהל? (1) להאריך את תקופת התועלת – בעזרת דברים שקשה לחקות (פטנט, מותג, ידע ייחודי). (2) להתחיל לבנות את <b>היתרון הבא</b> עוד לפני שהשחיקה נגמרת, כך שהיתרונות באים ״בגלים״."},{"t":"example","title":"האייפון","x":"<b>בנייה:</b> 2004–2007 אפל משקיעה בפיתוח מסך מגע ומערכת הפעלה – הוצאות בלי הכנסות מהמוצר. <b>תועלת:</b> 2007–2010 האייפון לבד בשוק, מחירים ורווחים גבוהים מאוד. <b>שחיקה:</b> סמסונג וגוגל (אנדרואיד) מגיבות עם מסכי מגע וחנויות אפליקציות, והיתרון של אפל מצטמצם. אפל עונה בבניית יתרון חדש (שעון, שירותים, שבבים)."},{"t":"trap","x":"השחיקה נגרמת בגלל <b>מהלכי תגובה של היריבים</b> – לא בגלל שהחברה ״התעייפה״. ובתקופת <b>הבנייה</b> עדיין אין רווחים מהיתרון; הרווחים מגיעים ב<b>תקופת התועלת</b>, שבה היתרון בשיאו."},{"t":"exam","x":"שאלת סיפור: ״החברה השקיעה 3 שנים בפיתוח ועוד לא מכרה״ ← <b>בנייה</b>. ״החברה מובילה ונהנית מרווחים גבוהים״ ← <b>תועלת</b>. ״מתחרים השיקו מוצר דומה והמחירים יורדים״ ← <b>שחיקה</b>."},{"t":"h","x":"מודל היהלום של פורטר (Porter's Diamond)"},{"t":"p","x":"מייקל פורטר (1990) שאל: למה <b>מדינות מסוימות</b> מצליחות במיוחד <b>בענפים מסוימים</b>? למה שעונים משווייץ, נעליים מאיטליה, רכבים מגרמניה וסייבר מישראל? התשובה שלו היא <b>מודל היהלום</b>: ארבעה ממדים שמחזקים זה את זה, ולצידם שני גורמים חיצוניים – <b>מזל</b> ו<b>מדיניות ממשלתית</b>."},{"t":"table","head":["ממד","באנגלית","מה זה","דוגמה"],"rows":[["1. <b>גורמי ייצור</b>","Factor Conditions","משאבים של המדינה: כוח אדם מיומן, ידע, תשתיות, הון, משאבי טבע","מהנדסים מיחידות טכנולוגיות בצבא ← תעשיית הסייבר בישראל"],["2. <b>תנאי הביקוש</b>","Demand Conditions","ביקוש מקומי, ובעיקר <b>לקוחות מקומיים תובעניים</b> שדוחפים את החברות להשתפר","הצרכן היפני התובעני ← אלקטרוניקה ומצלמות יפניות"],["3. <b>ענפים מקושרים ותומכים</b>","Related and Supporting Industries","ספקים ותעשיות קשורות חזקות באותה מדינה (״אשכול״)","עור, עיצוב ומכונות באיטליה ← נעליים ואופנה"],["4. <b>אסטרטגיית החברה, מבנה ויריבות</b>","Firm Strategy, Structure and Rivalry","איך החברות מנוהלות ומאורגנות, ועד כמה <b>התחרות המקומית</b> חזקה","יריבות קשה בין BMW, מרצדס ואאודי ← רכבים גרמניים מצוינים"],["<i>מזל</i>","Chance","אירוע לא צפוי: המצאה, מלחמה, משבר, מגפה","הקורונה ← זינוק לחברות תקשורת וידאו וביוטק"],["<i>מדיניות ממשלתית</i>","Government","מסים, מענקים, רגולציה, חינוך, תשתיות. משפיעה על כל ארבעת הממדים","תוכנית יוזמה (1993) ← תעשיית הון הסיכון בישראל"]]},{"t":"p","x":"בתרשים ארבעת הממדים מחוברים בחצים לכל הכיוונים – כל אחד מחזק את האחרים. <b>מזל</b> ו<b>מדיניות ממשלתית</b> נמצאים מחוץ ליהלום ומשפיעים עליו."},{"t":"example","title":"ההייטק הישראלי ביהלום","x":"<b>גורמי ייצור:</b> מהנדסים ואוניברסיטאות. <b>ביקוש:</b> צבא ומערכת ביטחון תובעניים שצריכים פתרונות מתקדמים. <b>ענפים תומכים:</b> קרנות הון סיכון, עורכי דין ורואי חשבון שמתמחים בסטארט-אפים. <b>יריבות:</b> אלפי סטארט-אפים מתחרים על עובדים ומשקיעים. <b>ממשלה:</b> רשות החדשנות ותוכנית יוזמה. <b>מזל:</b> העלייה הגדולה מברית המועצות בשנות ה-90 הביאה אלפי מהנדסים."},{"t":"trap","x":"<b>מזל ומדיניות ממשלתית אינם מארבעת הממדים</b> – הם שני גורמים משפיעים מבחוץ. ועוד: ביהלום, <b>יריבות מקומית חזקה היא דבר טוב</b> (היא מחשלת את החברות לשוק העולמי) – בניגוד לחמשת הכוחות, שם יריבות חזקה מורידה רווחיות. והיהלום מסביר תחרותיות של <b>מדינה בענף</b>, לא של חברה אחת."},{"t":"exam","x":"״למה דווקא מדינה X מצליחה בענף Y?״ ← מודל היהלום. ״לקוחות מקומיים תובעניים״ ← תנאי הביקוש. ״אשכול של ספקים באזור״ ← ענפים מקושרים ותומכים. ״כוח אדם מיומן / תשתיות״ ← גורמי ייצור. ״מענק / חוק / מס של המדינה״ ← מדיניות ממשלתית. ״אירוע לא צפוי״ ← מזל."},{"t":"h","x":"רמות אסטרטגיה: תאגיד, יחידה עסקית, פונקציה"},{"t":"p","x":"אסטרטגיה נכתבת בשלוש רמות בארגון. כל רמה עונה על שאלה אחרת, וכל רמה תומכת ברמה שמעליה."},{"t":"table","head":["רמה","השאלה","מי מחליט","דוגמאות להחלטות"],"rows":[["<b>תאגיד</b> (Corporate)","<b>באילו עסקים</b> נהיה?","הדירקטוריון ומנכ״ל התאגיד","רכישת חברה, כניסה לענף חדש, מכירת חטיבה, חלוקת כסף בין החטיבות"],["<b>יחידה עסקית</b> (Business Unit)","<b>איך ננצח</b> בענף הזה?","מנהל החטיבה / היחידה העסקית","מחיר נמוך או בידול, באיזה פלח להתמקד, איך להגיב למתחרה"],["<b>פונקציה</b> (Functional)","איך כל <b>מחלקה</b> תתמוך באסטרטגיה?","מנהלי מחלקות: שיווק, תפעול, משאבי אנוש, כספים, מו״פ","קמפיין פרסום, שיפור קו ייצור, גיוס והדרכת עובדים"]]},{"t":"example","title":"דיסני בשלוש רמות","x":"<b>תאגיד:</b> דיסני מחליטה לרכוש את פיקסאר, מארוול ולוקאספילם. <b>יחידה עסקית:</b> חטיבת הפארקים מחליטה להתחרות על חוויה פרימיום ולא על מחיר נמוך. <b>פונקציה:</b> מחלקת משאבי האנוש בפארקים מדריכה כל עובד איך לשמור על החוויה הקסומה."},{"t":"trap","x":"״רכישת חברה / כניסה לענף חדש״ = <b>תאגיד</b>, לא יחידה עסקית. ״איך מתחרים מול היריבים בענף״ = <b>יחידה עסקית</b>. החלטה של מחלקה אחת = <b>פונקציונלית</b>. בחברה שיש לה עסק אחד בלבד, רמת התאגיד ורמת היחידה העסקית כמעט מתאחדות."},{"t":"exam","x":"חפשו בסיפור מי מחליט ועל מה: ״באילו ענפים לפעול״ ← תאגיד. ״להתחרות במחיר או באיכות״ ← יחידה עסקית. ״מחלקת השיווק / הייצור / משאבי האנוש החליטה״ ← פונקציה."},{"t":"h","x":"כוחות מניעי שינוי בענף"},{"t":"p","x":"<b>כוחות מניעי שינוי</b> הם הגורמים הגדולים שמשנים את הענף ואת התחרות בו. לפי הקורס מסתכלים על טווח של <b>1–3 שנים</b> קדימה."},{"t":"steps","title":"ניתוח כוחות מניעי שינוי – 3 שלבים","x":["<b>לזהות</b> את הכוחות שישפיעו על הענף ב-1–3 השנים הקרובות.","<b>להעריך את ההשפעה</b> שלהם: לטובה או לרעה? חזקה או חלשה?","<b>לקבוע התאמות אסטרטגיות</b>: מה נשנה אצלנו כדי להיערך."]},{"t":"list","x":["שינויים טכנולוגיים ואינטרנט (למשל בינה מלאכותית)","חדשנות במוצר או בשיווק","שינויי רגולציה ומדיניות ממשלה","שינוי בהעדפות הלקוחות ובדמוגרפיה","כניסה או יציאה של שחקנים גדולים","גלובליזציה ושינוי בעלויות"]},{"t":"example","title":"ענף המוניות","x":"<b>זיהוי:</b> אפליקציות הזמנה (Gett, Uber) ותקנות חדשות של משרד התחבורה. <b>הערכה:</b> השפעה חזקה – לקוחות מזמינים רק באפליקציה, תחנות המוניות הקלאסיות מאבדות לקוחות. <b>התאמה:</b> התחנה מצטרפת לאפליקציה ומשקיעה בשירות לחברות."},{"t":"trap","x":"זה <b>לא רק רשימה</b> של שינויים – צריך גם להעריך את ההשפעה וגם לקבוע התאמות. והאופק בקורס הוא <b>1–3 שנים</b>, לא 10–20 שנה."},{"t":"exam","x":"״החברה זיהתה מגמות שישפיעו על הענף בשנתיים הקרובות, העריכה את השפעתן ושינתה את התוכנית״ ← <b>ניתוח כוחות מניעי שינוי</b>."},{"t":"h","x":"ניתוח מתחרים לפי אופק זמן"},{"t":"p","x":"מי המתחרים שלי? התשובה תלויה ב<b>אופק הזמן</b>. ככל שמסתכלים רחוק יותר, מעגל המתחרים גדל."},{"t":"table","head":["טווח","מי המתחרה","מבחן פשוט","דוגמה – בית קולנוע","רמת סכנה"],"rows":[["<b>קצר</b>","<b>מוצרים זהים או דומים</b>","אותו מוצר, אותו צורך","בית קולנוע אחר בעיר","גלוי, קל לזהות"],["<b>בינוני</b>","מוצרים שנצרכים ב<b>נסיבות צריכה דומות</b>","מוצר אחר, אותה סיטואציה","צפייה בסרט בבית בשירות סטרימינג","בינונית"],["<b>ארוך</b>","כל מה שמתחרה על <b>שימוש בזמן דומה</b> של הלקוח","פעילות שונה לגמרי, אותו זמן פנוי","ערב במסעדה, משחק מחשב, באולינג","<b>סכנה אסטרטגית</b> – קשה לראות אותה"]]},{"t":"example","title":"״אנחנו מתחרים בשינה״","x":"מנכ״ל נטפליקס אמר פעם שהמתחרה הגדול שלהם הוא לא HBO אלא <b>השינה</b> ומשחק המחשב Fortnite. בטווח קצר נטפליקס מתחרה בשירותי סטרימינג אחרים; בטווח בינוני – בערוצי טלוויזיה ובקולנוע (צפייה בתוכן); בטווח ארוך – בכל דבר שלוקח את שעות הערב של הצופה."},{"t":"trap","x":"הטווח הארוך הוא <b>הסכנה האסטרטגית</b> – דווקא כי המתחרה נראה ״לא קשור״. ושימו לב להבדל: <b>דומה</b> (אותו מוצר) = קצר; <b>נסיבות צריכה דומות</b> (מוצר אחר לאותה סיטואציה) = בינוני; <b>זמן דומה</b> (כל פעילות שמתחרה על הזמן) = ארוך."},{"t":"exam","x":"״קוקה-קולה מול פפסי״ ← קצר. ״קולה מול מיץ טבעי בארוחת צהריים״ ← בינוני (נסיבות צריכה דומות). ״אפליקציית כושר מול נטפליקס על שעות הערב״ ← ארוך."},{"t":"h","x":"איך פותרים שאלת סיפור ביחידה 1"},{"t":"steps","title":"מילות מפתח ← מודל","x":["״כללי התנהגות / יושרה, שקיפות״ ← ערכים.","״מה אנחנו מספקים היום, למי ובאיזה אזור״ ← מהות העסק.","״להיות... עד שנת...״ ← חזון.","יעד בלי מספר או בלי תאריך ← לא עומד ב-SMART.","נתח שוק / מוניטין / טכנולוגיה ← יעד אסטרטגי. רווח למניה / ROI ← פיננסי.","השקעה ← בנייה; רווחים ← תועלת; מתחרים מעתיקים ← שחיקה.","״למה מדינה מצליחה בענף״ ← מודל היהלום.","רכישה / ענף חדש ← תאגיד; איך מתחרים ← יחידה עסקית; מחלקה ← פונקציה.","שינויים ב-1–3 שנים ← כוחות מניעי שינוי.","מתחרה ״לא קשור״ על הזמן של הלקוח ← ניתוח מתחרים, טווח ארוך."]}],"cheat":["ניהול אסטרטגי = איזון בין ההנהלה הבכירה, הדירקטוריון ובעלי המניות","דירקטוריון = מפקח, מאשר אסטרטגיה, ממנה מנכ״ל","הנהלה בכירה = מנסחת ומיישמת את האסטרטגיה","ערכים (Values) = 4–8 התנהגויות רצויות, מסגרת שעוטפת חזון ומהות","מהות העסק (Mission) = מוצרים נוכחיים במונחי תועלת ללקוח + כיסוי גיאוגרפי (הווה)","חזון (Vision) = הנתיב העתידי של העסק (עתיד)","SMART = ספציפי, מדיד, בר השגה, ריאלי, מוגדר בזמן","יעד פיננסי = רווח למניה, תשואה על ההשקעה, הכנסות","יעד אסטרטגי = נתח שוק, מוניטין, עליונות טכנולוגית","לפי הקורס: יעדים אסטרטגיים חשובים יותר מפיננסיים","בנייה ושחיקה = בנייה ← תועלת ← שחיקה","תקופת הבנייה = מהלכים ליצירת היתרון (השקעה)","תקופת התועלת = מימוש היתרון והפקת רווחים (שיא)","תקופת השחיקה = מהלכי תגובה של יריבים מכרסמים ביתרון","מודל היהלום (1990) = למה מדינה מצליחה בענף מסוים","4 ממדי היהלום = גורמי ייצור, תנאי ביקוש, ענפים מקושרים ותומכים, אסטרטגיה מבנה ויריבות","מזל + מדיניות ממשלתית = גורמים חיצוניים, לא ממדים","יריבות מקומית חזקה ביהלום = טוב (מחשלת)","רמת תאגיד = באילו עסקים נהיה","רמת יחידה עסקית = איך ננצח בענף","רמה פונקציונלית = איך כל מחלקה תומכת","כוחות מניעי שינוי = לזהות (1–3 שנים), להעריך, להתאים","מתחרה בטווח קצר = מוצר זהה / דומה","מתחרה בטווח בינוני = נסיבות צריכה דומות","מתחרה בטווח ארוך = שימוש בזמן דומה – סכנה אסטרטגית"],"mcq":[{"id":"m1-1","q":"חברת NetWave כותבת באתר: ״אנחנו מספקים למשפחות ולעסקים קטנים בכל ישראל אינטרנט מהיר ויציב, עם תמיכה טכנית 24/7״. מה זה?","o":["חזון (Vision)","מהות העסק (Mission)","ערכים (Values)","יעד SMART"],"a":1,"w":["חזון מדבר על העתיד – לאן רוצים להגיע. כאן מתואר מה החברה עושה היום.","","ערכים הם כללי התנהגות כמו יושרה ושקיפות, לא תיאור של שירות.","אין כאן מספר מדיד ואין תאריך יעד."],"why":"המשפט מתאר שירות נוכחי במונחי תועלת ללקוח (מהיר, יציב, תמיכה) וכיסוי גיאוגרפי (כל ישראל) – זו מהות העסק."},{"id":"m1-2","q":"יצרנית הרכב VoltDrive מצהירה: ״להיות יצרנית הרכב החשמלי המובילה באירופה עד 2035״. לאיזה נדבך שייך המשפט?","o":["מהות העסק – המוצרים הנוכחיים","חזון – הנתיב העתידי של העסק","ערכים – מסגרת נורמטיבית","יעד פיננסי"],"a":1,"w":["מהות העסק מתארת את ההווה. כאן מדובר על מה שהחברה רוצה להיות בעתיד.","","אין כאן כללי התנהגות.","אין כאן רווח, תשואה או הכנסות."],"why":"״להיות... עד 2035״ הוא תיאור של היעד העתידי – זה חזון."},{"id":"m1-3","q":"בקיר הכניסה של חברת BrightPath כתוב: ״יושרה · שקיפות · כבוד לאדם · חדשנות · אחריות״. מה החברה הציגה?","o":["את החזון שלה","את מהות העסק","את היעדים האסטרטגיים","את ערכי החברה"],"a":3,"w":["חזון מתאר לאן החברה רוצה להגיע, לא רשימת התנהגויות.","מהות העסק מתארת מוצרים ושירותים, לקוחות ואזור.","יעד אסטרטגי הוא תוצאה כמו נתח שוק או מוניטין, לא כלל התנהגות.",""],"why":"רשימה קצרה (4–8) של התנהגויות רצויות היא ערכים – המסגרת שעוטפת את החזון ואת מהות העסק."},{"id":"m1-4","q":"מנהלת השיווק של CoffeeLab קבעה יעד: ״להגדיל את המכירות״. איזו בעיה עיקרית יש ביעד לפי SMART?","o":["הוא לא ריאלי, כי אי אפשר להגדיל מכירות","הוא יעד אסטרטגי ולכן לא יכול להיות SMART","אין בו מספר מדיד ואין מועד יעד (חסרים M ו-T)","הוא ארוך מדי ומפורט מדי"],"a":2,"w":["הגדלת מכירות אפשרית; הבעיה היא שאין מספר ואין תאריך.","גם יעד אסטרטגי יכול וצריך להיות SMART.","","ההפך – הוא קצר וכללי מדי."],"why":"״להגדיל מכירות״ לא אומר בכמה ועד מתי. יעד חכם: ״להגדיל מכירות ב-12% עד סוף 2027״."},{"id":"m1-5","q":"סטארט-אפ קטן קבע יעד: ״להגיע ל-90% נתח שוק בענף המשלוחים תוך חודש אחד״, בענף עם מתחרים ענקיים. איזה קריטריון של SMART נפגע בעיקר?","o":["בר השגה וריאלי (A ו-R)","ספציפי (S)","מדיד (M)","מוגדר בזמן (T)"],"a":0,"w":["","היעד ברור מאוד – נתח שוק בענף המשלוחים.","יש מספר ברור: 90%.","יש זמן ברור: חודש."],"why":"יש מספר ותאריך, אבל אין לחברה סיכוי אמיתי להשיג את זה מול ענקים – היעד לא בר השגה ולא ריאלי."},{"id":"m1-6","q":"איזה מהיעדים הבאים הוא <b>יעד אסטרטגי</b>?","o":["הגדלת נתח השוק מ-12% ל-18% עד 2028","הגדלת הרווח למניה (EPS) ב-10%","שיפור התשואה על ההשקעה (ROI) ל-15%","הגדלת הרווח הנקי ב-20 מיליון"],"a":0,"w":["","רווח למניה הוא יעד פיננסי.","תשואה על ההשקעה היא יעד פיננסי.","רווח נקי הוא יעד פיננסי."],"why":"נתח שוק מודד את המעמד התחרותי של החברה – יעד אסטרטגי, אף שהוא מספר."},{"id":"m1-7","q":"לפי ההבחנה המקובלת בקורס, מה נכון לגבי יעדים פיננסיים ויעדים אסטרטגיים?","o":["יעדים פיננסיים חשובים יותר, כי בעלי המניות מודדים רק רווח","שני הסוגים חשובים באותה מידה בדיוק","יעדים אסטרטגיים רלוונטיים רק לחברות ללא מטרות רווח","יעדים אסטרטגיים חשובים יותר, כי הם בונים את המעמד התחרותי שממנו יבואו הרווחים"],"a":3,"w":["הקורס קובע את ההפך.","הקורס מדרג – האסטרטגיים חשובים יותר.","כל חברה צריכה יעדים אסטרטגיים.",""],"why":"בקורס: יעדים אסטרטגיים (נתח שוק, מוניטין, טכנולוגיה) חשובים יותר מיעדים פיננסיים."},{"id":"m1-8","q":"חברת הביוטק GeneNova משקיעה כבר ארבע שנים בפיתוח תרופה חדשה ועוד לא מכרה אף מנה. באיזו תקופה של מודל בנייה ושחיקה היא נמצאת?","o":["תקופת התועלת","תקופת השחיקה","תקופת הבשלות","תקופת הבנייה"],"a":3,"w":["בתקופת התועלת החברה כבר מממשת את היתרון ומרוויחה.","בשחיקה מתחרים מגיבים ומכרסמים ביתרון קיים.","זו לא אחת משלוש התקופות של המודל.",""],"why":"ביצוע מהלכים ליצירת היתרון (השקעה, פיתוח) בלי רווח עדיין = תקופת הבנייה."},{"id":"m1-9","q":"לפני שלוש שנים SmartLock השיקה מנעול חכם ייחודי והרוויחה מאוד. השנה שתי חברות השיקו מנעולים דומים וזולים יותר, והמחיר שלה ירד. מה מתאר המצב?","o":["תקופת השחיקה – מהלכי תגובה של יריבים מכרסמים ביתרון","תקופת הבנייה – החברה בונה יתרון","תקופת התועלת – היתרון בשיאו","מודל היהלום – יריבות מקומית"],"a":0,"w":["","החברה כבר בנתה את היתרון ונהנתה ממנו.","היתרון כבר לא בשיאו – הוא נחלש.","מודל היהלום מסביר תחרותיות של מדינה, לא את מחזור החיים של יתרון."],"why":"מתחרים מעתיקים ומורידים מחיר – זו שחיקת היתרון."},{"id":"m1-10","q":"לפי מודל בנייה ושחיקה, מה הגורם העיקרי לשחיקת היתרון התחרותי?","o":["מהלכי תגובה של היריבים","עייפות של ההנהלה","החלטות הדירקטוריון","עלייה בהכנסות החברה"],"a":0,"w":["","המודל מסביר את השחיקה בתגובות המתחרים, לא בהנהלה.","הדירקטוריון לא מופיע כגורם השחיקה במודל.","עלייה בהכנסות אופיינית לתקופת התועלת."],"why":"בתקופת השחיקה המתחרים מחקים, משפרים או מורידים מחיר – וכך מכרסמים ביתרון."},{"id":"m1-11","q":"בבחינה מופיע הסיפור: ״יצרניות המצלמות ביפן התפתחו מהר כי הצרכנים היפנים דורשים איכות גבוהה מאוד ומתלוננים על כל פגם״. איזה ממד של מודל היהלום מתואר?","o":["גורמי ייצור","ענפים מקושרים ותומכים","תנאי הביקוש","מדיניות ממשלתית"],"a":2,"w":["גורמי ייצור הם משאבים כמו עובדים ותשתיות, לא לקוחות.","אין כאן ספקים או תעשיות קשורות.","","אין כאן מעורבות של הממשלה."],"why":"לקוחות מקומיים תובעניים שדוחפים את החברות להשתפר = תנאי הביקוש."},{"id":"m1-12","q":"ענף הנעליים באיטליה מצליח בין היתר כי באותו אזור פועלים בורסקאים, יצרני מכונות ובתי ספר לעיצוב. איזה ממד ביהלום זה?","o":["תנאי הביקוש","אסטרטגיה, מבנה ויריבות","ענפים מקושרים ותומכים","מזל"],"a":2,"w":["הסיפור לא מדבר על הלקוחות.","הסיפור לא מתאר תחרות בין יצרני הנעליים.","","אשכול ספקים אינו אירוע לא צפוי."],"why":"ספקים ותעשיות קשורות חזקים באותה מדינה (אשכול) = ענפים מקושרים ותומכים."},{"id":"m1-13","q":"בשנת 1993 ממשלת ישראל הקימה את תוכנית ״יוזמה״, שעודדה קרנות הון סיכון. לפי מודל היהלום זו דוגמה ל:","o":["מדיניות ממשלתית – גורם שמשפיע על ממדי היהלום","גורמי ייצור – אחד מארבעת הממדים","מזל – אירוע לא צפוי","תנאי הביקוש"],"a":0,"w":["","התוכנית אולי חיזקה את גורמי הייצור, אבל היא עצמה היא פעולה של הממשלה.","זו החלטה מתוכננת, לא אירוע מקרי.","התוכנית לא עוסקת בלקוחות."],"why":"החלטה של המדינה (מענק, חוק, מס, תוכנית) = מדיניות ממשלתית, גורם חיצוני שמשפיע על היהלום."},{"id":"m1-14","q":"איזה מהבאים <b>אינו</b> אחד מארבעת הממדים של מודל היהלום?","o":["גורמי ייצור","תנאי הביקוש","ענפים מקושרים ותומכים","מזל"],"a":3,"w":["זה אחד מארבעת הממדים.","זה אחד מארבעת הממדים.","זה אחד מארבעת הממדים.",""],"why":"מזל ומדיניות ממשלתית הם שני גורמים חיצוניים שמשפיעים על היהלום, לא ממדים שלו."},{"id":"m1-15","q":"BMW, מרצדס ואאודי מתחרות זו בזו בחריפות בגרמניה, ולכן כולן הפכו לחזקות מאוד בעולם. איזה ממד של היהלום זה, ומה השפעתו?","o":["אסטרטגיה, מבנה ויריבות – יריבות חזקה מחלישה את הענף","אסטרטגיה, מבנה ויריבות – יריבות מקומית חזקה מחזקת את התחרותיות","תנאי הביקוש – לקוחות תובעניים","יריבות פנימית בענף – כוח שמוריד רווחיות"],"a":1,"w":["ביהלום יריבות מקומית חזקה היא דבר טוב – היא מחשלת את החברות.","","הסיפור מדבר על המתחרים, לא על הלקוחות.","זה מונח מחמשת הכוחות; השאלה שואלת על מודל היהלום."],"why":"ביהלום, תחרות קשה בבית מכריחה את החברות להשתפר ולכן הן מצליחות בעולם."},{"id":"m1-16","q":"חברת ענק לבידור החליטה לרכוש אולפן אנימציה ולהיכנס לענף משחקי הווידאו. באיזו רמת אסטרטגיה מדובר?","o":["רמת התאגיד (Corporate)","רמת היחידה העסקית (Business Unit)","הרמה הפונקציונלית (Functional)","רמת השוק"],"a":0,"w":["","יחידה עסקית מחליטה איך להתחרות בענף אחד, לא לאילו ענפים להיכנס.","זו לא החלטה של מחלקה אחת.","אין רמה כזו בשלוש רמות האסטרטגיה."],"why":"באילו עסקים להיות (רכישות, כניסה לענף חדש) = החלטה ברמת התאגיד."},{"id":"m1-17","q":"מחלקת משאבי האנוש של רשת המלונות StayWell בנתה תוכנית הדרכה לעובדי הקבלה כדי לתמוך באסטרטגיית השירות. זו אסטרטגיה ברמה:","o":["תאגידית","של יחידה עסקית","גלובלית","פונקציונלית"],"a":3,"w":["לא מדובר בבחירת עסקים או רכישות.","לא מדובר בהחלטה איך המלונות מתחרים בענף, אלא בתמיכה של מחלקה.","זו לא אחת משלוש הרמות.",""],"why":"מחלקה אחת (משאבי אנוש) שתומכת באסטרטגיה = רמה פונקציונלית."},{"id":"m1-18","q":"מנהל חטיבת החטיפים בקבוצת מזון גדולה החליט שהחטיבה תתחרה במחיר נמוך מול מותגי הפרימיום. באיזו רמה מדובר?","o":["תאגיד","יחידה עסקית","פונקציה","דירקטוריון"],"a":1,"w":["התאגיד מחליט באילו עסקים להיות; כאן ההחלטה היא איך להתחרות בעסק קיים.","","לא מדובר במחלקה אחת אלא בכל החטיבה.","זה גוף, לא רמת אסטרטגיה."],"why":"איך לנצח בענף מסוים (מחיר או בידול) = אסטרטגיה ברמת היחידה העסקית."},{"id":"m1-19","q":"מי בארגון <b>מאשר</b> את האסטרטגיה וממנה את המנכ״ל?","o":["בעלי המניות, ישירות בכל החלטה","הדירקטוריון","מנהלי המחלקות","ההנהלה הבכירה"],"a":1,"w":["בעלי המניות בוחרים את הדירקטוריון; הם לא מאשרים כל החלטה.","","הם מיישמים ברמה הפונקציונלית.","ההנהלה מנסחת ומיישמת, אבל לא ממנה את עצמה."],"why":"הדירקטוריון מפקח על ההנהלה, מאשר את האסטרטגיה וממנה את המנכ״ל."},{"id":"m1-20","q":"לפי הקורס, באיזה טווח זמן בוחנים את הכוחות המניעים שינוי בענף?","o":["רבעון אחד","10–20 שנה","1–3 שנים","רק את העבר, 5 השנים האחרונות"],"a":2,"w":["קצר מדי; הקורס מדבר על 1–3 שנים.","ארוך מדי; הקורס מדבר על 1–3 שנים.","","מדובר בהסתכלות קדימה."],"why":"מזהים את הכוחות שישפיעו בטווח של 1–3 שנים, מעריכים את השפעתם וקובעים התאמות."},{"id":"m1-21","q":"רשת בתי הקולנוע CineMax מגלה שהרבה לקוחות מעדיפים לראות סרט חדש בבית בשירות סטרימינג. לפי ניתוח מתחרים לפי אופק זמן, זה מתחרה בטווח:","o":["קצר – מוצר זהה","ארוך – שימוש בזמן דומה","בינוני – נסיבות צריכה דומות","זה לא מתחרה בכלל"],"a":2,"w":["בטווח הקצר המתחרה הוא בית קולנוע אחר.","הטווח הארוך הוא פעילות שונה לגמרי שמתחרה על הזמן (מסעדה, כושר).","","זה בהחלט מתחרה – אותה סיטואציה של צפייה בסרט."],"why":"צפייה בסרט בבית היא מוצר אחר, אבל לאותה סיטואציה – נסיבות צריכה דומות = טווח בינוני."},{"id":"m1-22","q":"אפליקציית הכושר FitNow מגלה שהמשתמשים שלה מוותרים על אימון הערב כדי לצפות בסדרות. לפי ניתוח מתחרים, סדרות הטלוויזיה הן מתחרה בטווח:","o":["ארוך – שימוש בזמן דומה, והוא מהווה סכנה אסטרטגית","קצר – מוצר דומה","בינוני – נסיבות צריכה דומות","זה לא מתחרה כי זה ענף אחר"],"a":0,"w":["","סדרה אינה מוצר דומה לאפליקציית כושר.","אין כאן אותה סיטואציה; רק אותו זמן פנוי.","בטווח הארוך כל מה שמתחרה על הזמן של הלקוח הוא מתחרה."],"why":"פעילות שונה לגמרי שמתחרה על אותו זמן = טווח ארוך, ודווקא הוא הסכנה האסטרטגית."},{"id":"m1-23","q":"קוקה-קולה עוקבת אחרי מבצעי המחיר של פפסי. לפי ניתוח מתחרים לפי אופק זמן, פפסי היא מתחרה ב:","o":["טווח בינוני – נסיבות צריכה דומות","טווח ארוך – שימוש בזמן דומה","אף טווח – פפסי היא מוצר משלים","טווח קצר – מוצר זהה או דומה"],"a":3,"w":["פפסי היא מוצר כמעט זהה, לא רק אותה סיטואציה.","זה מתחרה ישיר, לא פעילות אחרת על אותו זמן.","פפסי מחליפה את קולה, לא משלימה אותה.",""],"why":"מוצרים זהים או דומים = מתחרים בטווח הקצר."},{"id":"m1-24","q":"איזה מהבאים מתאר נכון את תהליך ניתוח הכוחות המניעים שינוי?","o":["לרשום את חמשת הכוחות של פורטר ולדרג אותם","לזהות כוחות שישפיעו ב-1–3 שנים, להעריך את השפעתם ולקבוע התאמות אסטרטגיות","לחשב את הרווח למניה בשלוש השנים האחרונות","לבחור 4–8 ערכים לחברה"],"a":1,"w":["זה ניתוח מבנה הענף הנוכחי, לא כוחות מניעי שינוי.","","זה ניתוח פיננסי של העבר.","זה ניסוח ערכים, לא ניתוח שינוי בענף."],"why":"שלושה שלבים: זיהוי, הערכת השפעה, התאמות אסטרטגיות."},{"id":"m1-25","q":"איזה ניסוח של מהות עסק (Mission) עדיף לפי הקורס?","o":["״אנחנו רוצים להיות הכי גדולים בעולם״","״אנחנו עוזרים למשפחות במרכז הארץ לאכול בריא, עם ארוחות מוכנות שמגיעות עד הבית״","״אנחנו מאמינים ביושרה ובשקיפות״","״אנחנו מייצרים 3,000 מנות ביום במפעל בלוד״"],"a":1,"w":["זה חזון (עתיד), ולא מתאר מוצר, תועלת או אזור.","","אלה ערכים, לא מהות העסק.","זה תיאור ייצור, לא תועלת ללקוח."],"why":"מהות העסק מתארת מוצרים נוכחיים במונחי תועלת ללקוח (לאכול בריא) וכיסוי גיאוגרפי (מרכז הארץ)."},{"id":"m1-26","q":"בתרשים של מודל בנייה ושחיקה, מה מייצג הציר האנכי ומתי הוא בשיאו?","o":["את ההוצאות; הן בשיאן בתקופת השחיקה","את מספר המתחרים; הוא בשיאו בתקופת הבנייה","את גודל היתרון התחרותי; הוא בשיאו בתקופת התועלת","את גודל היתרון; הוא בשיאו בתקופת הבנייה"],"a":2,"w":["הציר האנכי הוא גודל היתרון, לא הוצאות.","הציר האנכי הוא גודל היתרון.","","בתקופת הבנייה היתרון רק עולה; השיא בתקופת התועלת."],"why":"העקומה עולה בבנייה, נמצאת בשיא בתועלת, ויורדת בשחיקה."}],"tf":[{"id":"m1-t1","s":"לפי הקורס, הניהול האסטרטגי עוסק במערכת היחסים והאיזונים בין ההנהלה הבכירה, הדירקטוריון ובעלי המניות.","a":true,"why":"זו ההגדרה בקורס: איזון בין שלושת הצדדים."},{"id":"m1-t2","s":"מהות העסק (Mission) מתארת את הנתיב העתידי שהחברה רוצה להגיע אליו.","a":false,"why":"זה החזון. מהות העסק מתארת את המוצרים והשירותים הנוכחיים במונחי תועלת ללקוח וכיסוי גיאוגרפי."},{"id":"m1-t3","s":"לרוב לחברה יש 4–8 ערכים שמגדירים התנהגויות רצויות.","a":true,"why":"ערכים הם מסגרת נורמטיבית קצרה, בדרך כלל 4–8 ערכים."},{"id":"m1-t4","s":"האות T במודל SMART אומרת שליעד צריך להיות מועד יעד ברור.","a":true,"why":"T = Time: היעד מוגדר בזמן (עד מתי)."},{"id":"m1-t5","s":"״להיות הכי טובים בשירות לקוחות״ הוא יעד שעומד בקריטריונים של SMART.","a":false,"why":"אין בו מספר מדיד ואין מועד – הוא לא ספציפי, לא מדיד ולא מוגדר בזמן."},{"id":"m1-t6","s":"הגדלת הרווח למניה (EPS) היא דוגמה ליעד אסטרטגי.","a":false,"why":"רווח למניה הוא יעד פיננסי. יעד אסטרטגי הוא למשל נתח שוק או מוניטין."},{"id":"m1-t7","s":"לפי ההבחנה המקובלת בקורס, יעדים פיננסיים חשובים יותר מיעדים אסטרטגיים.","a":false,"why":"ההפך: יעדים אסטרטגיים חשובים יותר."},{"id":"m1-t8","s":"הגדלת נתח שוק נחשבת ליעד אסטרטגי.","a":true,"why":"נתח שוק מודד את המעמד התחרותי – יעד אסטרטגי."},{"id":"m1-t9","s":"בתקופת התועלת היתרון התחרותי בגודלו המקסימלי והחברה מפיקה ממנו רווחים.","a":true,"why":"זו התקופה השנייה במודל – מימוש היתרון."},{"id":"m1-t10","s":"לפי מודל בנייה ושחיקה, השחיקה נגרמת בעיקר מכך שהחברה מפסיקה להשקיע.","a":false,"why":"השחיקה נגרמת ממהלכי תגובה של היריבים שמכרסמים ביתרון."},{"id":"m1-t11","s":"בתקופת הבנייה החברה מבצעת מהלכים אסטרטגיים כדי ליצור את היתרון התחרותי.","a":true,"why":"זו התקופה הראשונה – השקעה ויצירת היתרון."},{"id":"m1-t12","s":"מודל היהלום של פורטר מסביר מדוע מדינות מסוימות תחרותיות במיוחד בענפים מסוימים.","a":true,"why":"המודל מסביר תחרותיות לאומית וגלובלית."},{"id":"m1-t13","s":"מזל ומדיניות ממשלתית הם שניים מארבעת הממדים של מודל היהלום.","a":false,"why":"הם גורמים חיצוניים שמשפיעים על היהלום. ארבעת הממדים: גורמי ייצור, תנאי ביקוש, ענפים מקושרים ותומכים, אסטרטגיה מבנה ויריבות."},{"id":"m1-t14","s":"לפי מודל היהלום, יריבות מקומית חזקה מחלישה את התחרותיות של המדינה בענף.","a":false,"why":"ההפך: יריבות מקומית חזקה מחשלת את החברות ומחזקת אותן בעולם."},{"id":"m1-t15","s":"ההחלטה לרכוש חברה בענף חדש היא החלטה ברמת היחידה העסקית.","a":false,"why":"באילו עסקים להיות – זו רמת התאגיד."},{"id":"m1-t16","s":"אסטרטגיה ברמה הפונקציונלית עוסקת באופן שבו מחלקות כמו שיווק, תפעול ומשאבי אנוש תומכות באסטרטגיה.","a":true,"why":"זו הרמה השלישית – הפונקציה הארגונית."},{"id":"m1-t17","s":"ניתוח הכוחות המניעים שינוי בענף מסתכל בדרך כלל 10–20 שנה קדימה.","a":false,"why":"בקורס מדובר בטווח של 1–3 שנים."},{"id":"m1-t18","s":"מתחרים בטווח הארוך הם אלה שמתחרים על שימוש בזמן דומה של הלקוח, והם מהווים סכנה אסטרטגית.","a":true,"why":"כך מוגדר הטווח הארוך בניתוח המתחרים."},{"id":"m1-t19","s":"מתחרים בטווח הקצר הם מוצרים שונים שנצרכים בנסיבות צריכה דומות.","a":false,"why":"זה הטווח הבינוני. בטווח הקצר המתחרים הם מוצרים זהים או דומים."},{"id":"m1-t20","s":"מהות העסק צריכה לתאר את המוצרים והשירותים במונחי תועלת ללקוח ולציין כיסוי גיאוגרפי.","a":true,"why":"כך הקורס מגדיר את מהות העסק."},{"id":"m1-t21","s":"הדירקטוריון הוא הגוף שמנהל את הפעילות היומיומית של החברה.","a":false,"why":"את היום-יום מנהלת ההנהלה הבכירה. הדירקטוריון מפקח, מאשר וממנה."},{"id":"m1-t22","s":"במודל SMART האות A מייצגת Achievable – יעד בר השגה.","a":true,"why":"A = Achievable: יש לארגון את המשאבים והיכולות להשיג את היעד."}],"scope":[{"ref":"סיכום · עמ׳ 1","x":"הארגון האסטרטגי והצדדים לניהול האסטרטגי","imp":1,"h":"הארגון האסטרטגי והצדדים לניהול האסטרטגי"},{"ref":"סיכום · עמ׳ 1","x":"ערכים, מהות העסק וחזון","imp":2,"h":"ערכים, מהות העסק וחזון (Values, Mission, Vision)"},{"ref":"סיכום · עמ׳ 1","x":"הצבת יעדים – SMART","imp":2,"h":"הצבת יעדים: מודל SMART"},{"ref":"סיכום · עמ׳ 1","x":"יעדים פיננסיים מול אסטרטגיים","imp":1,"h":"יעדים פיננסיים מול יעדים אסטרטגיים"},{"ref":"סיכום · עמ׳ 1","x":"מודל בנייה ושחיקה של יתרון תחרותי","imp":2,"h":"מודל בנייה ושחיקה של יתרון תחרותי"},{"ref":"סיכום · עמ׳ 1","x":"מודל היהלום של פורטר","imp":2,"h":"מודל היהלום של פורטר (Porter's Diamond)"},{"ref":"סיכום · עמ׳ 2","x":"רמות אסטרטגיה","imp":1,"h":"רמות אסטרטגיה: תאגיד, יחידה עסקית, פונקציה"},{"ref":"סיכום · עמ׳ 2","x":"כוחות מניעי שינוי בענף","imp":1,"h":"כוחות מניעי שינוי בענף"},{"ref":"סיכום · עמ׳ 2","x":"ניתוח מתחרים לפי אופק זמן","imp":1,"h":"ניתוח מתחרים לפי אופק זמן"}],"outScope":[]},{"id":"m2","title":"ניתוח סביבת הענף","short":"סביבת הענף","blurb":"הגדרת ענף, PESTEL(G) והביקורת עליו, חמשת הכוחות של פורטר ומה מחזק כל כוח, אוקיינוס כחול ו-ERRC, מיפוי קבוצות אסטרטגיות ו-KSF.","mnemonic":"מבחוץ פנימה: <b>מאקרו = PESTEL</b> (העולם), <b>מיקרו = פורטר</b> (הזירה), ובמרכז הפירמה. בפורטר: <b>״כוח חזק = רווח חלש״</b>; אבל <b>חסם
