 זה, ולא נוצר חיבור בין העסקים. ב-2007 eBay מחקה חלק גדול משווי ההשקעה, וב-2009 מכרה את רוב Skype. ← דוגמה מהקורס ל<b>חיסרון</b>: מיזוגים ורכישות לא תמיד מצליחים.","title":"eBay–Skype (2005)"},{"t":"trap","x":"שאלה ״מה ממחיש מקרה eBay–Skype?״ ← שמיזוגים ורכישות <b>לעיתים נכשלים</b>. לא ״הצלחה של הגוונה״."},{"t":"h","x":"אינטגרציה אופקית ואינטגרציה אנכית"},{"t":"p","x":"אינטגרציה היא גדילה בעזרת <b>רכישה (או בנייה) של חוליה נוספת</b>. השאלה: מאיזה כיוון החוליה?"},{"t":"table","head":["סוג","מה קונים","דוגמה"],"rows":[["<b>אופקית</b> (Horizontal)","<b>מתחרה</b> שפועל <b>באותו שלב</b> בנתיב ההפצה","רשת סופרמרקטים קונה רשת סופרמרקטים אחרת; Facebook רכשה את Instagram"],["<b>אנכית לאחור</b> (Backward)","<b>ספק</b> (שלב קודם בשרשרת הערך)","יצרנית שוקולד קונה מטע קקאו"],["<b>אנכית לפנים</b> (Forward)","<b>מפיץ או לקוח</b> (שלב הבא בשרשרת)","מבשלת בירה קונה רשת פאבים; Apple פותחת חנויות משלה"]]},{"t":"p","x":"איך לזכור: דמיינו את השרשרת משמאל לימין: <b>ספק ← יצרן ← מפיץ ← לקוח</b>. אנכית = זזים <b>לאורך</b> השרשרת (אחורה לספק או קדימה ללקוח). אופקית = זזים <b>לצד</b>, למתחרה באותה חוליה."},{"t":"trap","x":"״חברה קונה את המפיץ שלה״ היא אנכית <b>לפנים</b>, לא לאחור. ״לאחור״ = לכיוון חומרי הגלם."},{"t":"exam","x":"שאלה טיפוסית: סיפור של רכישה ← ״איזה סוג אינטגרציה?״. בדקו: האם החברה הנרכשת עושה את <b>אותו דבר</b> (אופקית) או שהיא <b>ספק/מפיץ</b> (אנכית לאחור/לפנים)?"},{"t":"h","x":"מטריצת אנסוף: אסטרטגיות צמיחה (Ansoff Matrix)"},{"t":"p","x":"<b>מטריצת אנסוף</b> פותחה על ידי <b>איגור אנסוף (Igor Ansoff)</b>. היא מצליבה <b>מוצרים</b> (קיימים/חדשים) עם <b>שווקים</b> (קיימים/חדשים), ויוצרת <b>ארבע חלופות צמיחה</b>."},{"t":"table","head":["","מוצר <b>קיים</b>","מוצר <b>חדש</b>"],"rows":[["שוק <b>קיים</b>","<b>חדירה לשוק (העמקה)</b> – Market Penetration","<b>פיתוח מוצרים</b> – Product Development"],["שוק <b>חדש</b>","<b>פיתוח שווקים</b> – Market Development","<b>הגוונה (גיוון)</b> – Diversification"]]},{"t":"table","head":["אסטרטגיה","מה עושים","סיכון","דוגמה"],"rows":[["חדירה לשוק (העמקה)","מוכרים <b>יותר</b> מהמוצרים הקיימים <b>באותו שוק</b> כדי להגדיל נתח שוק: מבצעים, פרסום, הנחות","<b>הנמוך ביותר</b>","רשת פיצה מציעה ״1+1״ ומגבירה פרסום בעיר שבה היא כבר פועלת"],["פיתוח מוצרים","מפתחים ומשווקים <b>מוצרים חדשים</b> ל<b>לקוחות ולשווקים הקיימים</b>","בינוני","בנק מציע ללקוחות הקיימים שלו אפליקציית השקעות חדשה"],["פיתוח שווקים","לוקחים <b>מוצרים קיימים</b> ומחדירים אותם ל<b>שווקים חדשים</b>: קהל יעד חדש או סניפים בחו״ל","בינוני","רשת המבורגרים ישראלית פותחת סניפים בגרמניה, עם אותו תפריט"],["הגוונה (גיוון)","<b>מוצרים חדשים לחלוטין</b> ל<b>שווקים חדשים</b>","<b>הגבוה ביותר</b>, והמורכבת ביותר","חברת מזון נכנסת לתחום המלונאות"]]},{"t":"p","x":"כלל אצבע: ספרו כמה ״חדש״ יש. <b>0 חדש</b> ← חדירה לשוק (הכי בטוח). <b>1 חדש</b> ← פיתוח מוצרים או פיתוח שווקים. <b>2 חדשים</b> ← הגוונה (הכי מסוכן)."},{"t":"example","x":"רשת בתי הקפה BeanUp, שפונה תמיד לאנשי עסקים, משיקה קמפיין ופותחת סניפים ליד קמפוסים כדי למשוך <b>סטודנטים</b>, עם אותו תפריט. ← <b>פיתוח שווקים</b>: מוצר קיים, קהל יעד חדש.","title":"סיפור"},{"t":"trap","x":"״שוק חדש״ הוא לא רק מדינה חדשה. גם <b>קהל יעד חדש</b> (גיל, מגזר, סוג לקוח) הוא שוק חדש. ומבצעים ופרסום באותו שוק הם <b>חדירה</b>, לא פיתוח שווקים."},{"t":"trap","x":"הסיכום קובע רק את הקצוות: חדירה = הסיכון הנמוך ביותר, הגוונה = הסיכון הגבוה ביותר. פיתוח מוצרים ופיתוח שווקים נמצאים באמצע."},{"t":"exam","x":"השאלה הנפוצה ביותר ביחידה: סיפור קצר ← ״לפי מטריצת אנסוף, איזו אסטרטגיית צמיחה זו?״. שאלו שתי שאלות: המוצר קיים או חדש? השוק (או קהל היעד) קיים או חדש?"},{"t":"h","x":"איך מבחינים בין הכלים בשאלת סיפור"},{"t":"steps","x":["האם החברה <b>נותנת פעילות</b> לגורם חיצוני תמורת תשלום? ← <b>מיקור חוץ</b>.","האם שתי חברות <b>עצמאיות</b> עובדות יחד, בלי שינוי בעלות? ← <b>ברית אסטרטגית</b>.","האם הן מקימות <b>ישות משותפת</b>, כי לבד אין להן מספיק כסף או ידע? ← <b>מיזם משותף</b>.","האם שתי חברות דומות <b>מתאחדות</b> לאחת? ← <b>מיזוג</b>. האם אחת <b>קונה</b> את השנייה? ← <b>רכישה</b>.","את מי קנו? מתחרה ← <b>אופקית</b>. ספק ← <b>אנכית לאחור</b>. מפיץ/לקוח ← <b>אנכית לפנים</b>.","אם השאלה היא <b>לאן לצמוח</b> (מוצר/שוק) ← <b>אנסוף</b>."],"title":"סדר עבודה"}],"cheat":["מיקור חוץ (Outsourcing) = העברת פעילות לגורם חיצוני מומחה או זול יותר, כדי להתמקד בליבה","תנאי הכרחי למיקור חוץ = הפעילות אינה קריטית ליתרון תחרותי בר-קיימא","חסרונות מיקור חוץ = אובדן שליטה ותלות חיצונית","ברית אסטרטגית (Alliance) = שיתוף פעולה בין חברות עצמאיות לחדירה לשווקים או לפיתוח טכנולוגי","נשקול ברית כאשר = רוצים לחדור לשווקים חדשים/גלובליים או לפתח טכנולוגיות מתקדמות","מטרת הברית = פרויקט מסוים שתוצאתו טובה יותר לשני הצדדים","מיזם משותף (JV) = שיתוף פעולה ספציפי ומהודק, לרוב ישות חדשה בבעלות משותפת","נשקול מיזם משותף כאשר = אין יכולת כלכלית לכל אחת לבד, ו/או לכל אחת ידע נחוץ","ברית מול מיזם = ברית רחבה וכללית; מיזם ספציפי ומהודק יותר","M&A = השגת כוח שוק, מעבר חסמי כניסה, צמצום עלויות, הגוונה","חסרונות M&A = קשיי שילוב ארגוני/תרבותי, סיכון לכישלון, הקטנת התחרותיות","מיזוג = איחוד משפטי של שתי חברות שוות/דומות ליצירת כוח משותף","רכישה = הרוכשת קונה מניות ונכסים; הנרכשת יכולה להיות חברת בת; השליטה עוברת במלואה","eBay–Skype (2005, כ-2.6 מיליארד $) = דוגמה למיזוג/רכישה שלא הצליחו","אינטגרציה אופקית = רכישת מתחרה באותו שלב בנתיב ההפצה","אינטגרציה אנכית לאחור = רכישת ספקים","אינטגרציה אנכית לפנים = רכישת מפיצים/לקוחות","אנסוף = מוצרים (קיימים/חדשים) × שווקים (קיימים/חדשים)","חדירה לשוק (העמקה) = מוצר קיים, שוק קיים; מבצעים ופרסום; הסיכון הנמוך ביותר","פיתוח מוצרים = מוצר חדש, שוק קיים","פיתוח שווקים = מוצר קיים, שוק חדש (קהל יעד חדש, סניפים בחו״ל)","הגוונה (גיוון) = מוצר חדש, שוק חדש; המורכבת והמסוכנת ביותר","כלל אצבע אנסוף = 0 חדש ← חדירה; 1 חדש ← פיתוח; 2 חדשים ← הגוונה"],"mcq":[{"id":"m6-1","q":"חברת התוכנה CodeNest העבירה את הנהלת השכר ואת מוקד התמיכה הטכנית לחברות חיצוניות שמתמחות בכך, כדי שכל העובדים שלה יתמקדו בפיתוח התוכנה. מה החברה עשתה?","o":["ברית אסטרטגית","אינטגרציה אנכית לאחור","מיקור חוץ","מיזם משותף"],"a":2,"w":["בברית שתי חברות משתפות פעולה על פרויקט משותף; כאן CodeNest פשוט קונה שירות מספק.","באינטגרציה החברה קונה את הספק; כאן היא דווקא מוציאה פעילות החוצה.","","לא הוקמה ישות משותפת ואין שותפות בבעלות."],"why":"העברת פעילויות שאינן ליבה לגורם חיצוני מומחה, כדי להתמקד בעסקי הליבה = מיקור חוץ."},{"id":"m6-2","q":"מהו התנאי ההכרחי למיקור חוץ של פעילות, לפי הקורס?","o":["הפעילות אינה קריטית ליצירת יתרון תחרותי בר-קיימא","הספק החיצוני נמצא באותה מדינה","הפעילות היא מקור היתרון התחרותי של החברה","החברה רוכשת את הספק אחרי שנה"],"a":0,"w":["","אין תנאי כזה; ספקים יכולים להיות בכל מקום.","זה בדיוק ההפך: את מקור היתרון לא מוציאים החוצה.","רכישת ספק היא אינטגרציה אנכית, לא מיקור חוץ."],"why":"מוציאים החוצה רק פעילות שאינה קריטית ליתרון התחרותי בר-הקיימא."},{"id":"m6-3","q":"חברת הבשמים ScentCraft שוקלת להעביר לחברה חיצונית את פיתוח הנוסחאות הסודיות של הבשמים, שבזכותן הלקוחות מעדיפים אותה. מה הבעיה בצעד הזה?","o":["הפעילות היא מקור היתרון התחרותי, ולכן התנאי ההכרחי למיקור חוץ לא מתקיים","אין בעיה, מיקור חוץ תמיד חוסך כסף","הבעיה היא שזו אינטגרציה אופקית","הבעיה היא שמיקור חוץ מתאים רק לחברות קטנות"],"a":0,"w":["","חיסכון לא מצדיק הוצאה של מקור היתרון התחרותי.","זו לא רכישה של מתחרה; זה מיקור חוץ.","אין כלל כזה; גם חברות ענק עושות מיקור חוץ."],"why":"מוציאים החוצה רק את מה שאינו קריטי ליתרון. כאן החברה מסכנת את הלב שלה ומאבדת שליטה עליו."},{"id":"m6-4","q":"מה הם החסרונות של מיקור חוץ לפי הקורס?","o":["אובדן שליטה ותלות חיצונית","קשיים בשילוב התרבות הארגונית של שתי חברות","סיכון גבוה במיוחד, כמו בהגוונה","עלות גבוהה מאוד ושליטה גבוהה"],"a":0,"w":["","זה חיסרון של מיזוגים ורכישות.","הסיכון הגבוה ביותר שייך להגוונה במטריצת אנסוף.","זה תיאור של רכישה/גרינפילד בכניסה לשוק בינלאומי."],"why":"כשאחרים מבצעים את הפעילות, החברה שולטת בה פחות ותלויה בספק."},{"id":"m6-5","q":"חברות התעופה AirNord ו-SunJet, שכל אחת מהן נשארת עצמאית, חתמו על הסכם: הן ימכרו כרטיסים זו בטיסות של זו, יפעילו מועדון נוסע מתמיד משותף וישתפו טרקלינים. מה זה?","o":["ברית אסטרטגית","מיזוג","רכישה","מיזם משותף"],"a":0,"w":["","במיזוג שתי החברות מתאחדות לגוף אחד; כאן כל אחת נשארת עצמאית.","אף אחת לא קנתה את המניות של השנייה.","לא הוקמה ישות חדשה בבעלות משותפת; זה הסכם שיתוף פעולה רחב."],"why":"שיתוף פעולה בין חברות עצמאיות, בלי שינוי בעלות ובלי ישות חדשה = ברית אסטרטגית (כמו Star Alliance)."},{"id":"m6-6","q":"החברות BatteryOne ו-VoltCar הקימו חברה חדשה בבעלות של 50% לכל אחת, כדי לבנות מפעל סוללות. אף אחת לא יכלה לממן את המפעל לבד, ולכל אחת ידע שהשנייה צריכה. מה זה?","o":["מיקור חוץ","מיזם משותף","רכישה","אינטגרציה אופקית"],"a":1,"w":["אף אחת לא קונה שירות מהשנייה; הן שותפות בבעלות.","","אף אחת לא קנתה את השנייה; הן הקימו גוף משותף חדש.","אינטגרציה היא רכישה של מתחרה; כאן אין רכישה."],"why":"ישות משותפת חדשה, כי אין יכולת כלכלית לכל אחת לבד ולכל אחת ידע נחוץ = מיזם משותף."},{"id":"m6-7","q":"מה ההבדל בין שיתוף פעולה (ברית אסטרטגית) לבין מיזם משותף לפי הקורס?","o":["מיזם משותף הוא מושג רחב יותר, וברית היא מקרה פרטי שלו","בברית אחת החברות קונה את השנייה","שיתוף פעולה הוא מושג רחב וכללי, ומיזם משותף הוא צורה ספציפית ומהודקת יותר","אין ביניהם שום הבדל"],"a":2,"w":["ההפך: הברית היא המושג הרחב.","בברית אין שינוי בעלות; קנייה היא רכישה.","","הסיכום מדגיש במפורש שיש הבדל ברוחב ובהידוק."],"why":"לפי הסיכום: שיתוף פעולה = מושג רחב לשילוב כוחות; מיזם משותף = ספציפי ומהודק יותר."},{"id":"m6-8","q":"מתי נשקול מיזם משותף, לפי הקורס?","o":["כשהפעילות אינה קריטית ליתרון התחרותי","כשרוצים שליטה מלאה בחברה השנייה","כשאין יכולת כלכלית לכל אחת מהחברות בנפרד, ו/או לכל אחת יש ידע מסוים שנחוץ","כשרוצים למכור מוצרים קיימים יותר באותו שוק"],"a":2,"w":["זה התנאי למיקור חוץ.","שליטה מלאה מתקבלת ברכישה.","","זו חדירה לשוק במטריצת אנסוף."],"why":"מיזם משותף מתאים כשמשאבים כספיים או ידע חסרים לכל צד לבד."},{"id":"m6-9","q":"שני בנקים בגודל דומה, BankNord ו-CityTrust, החליטו להתאחד משפטית לבנק אחד, כדי ליצור גוף חזק יותר מול המתחרים. מה זה?","o":["רכישה","ברית אסטרטגית","מיזם משותף","מיזוג"],"a":3,"w":["ברכישה חברה אחת קונה את השנייה והשליטה עוברת אליה; כאן שתי חברות דומות מתאחדות.","בברית החברות נשארות עצמאיות.","לא הוקמה ישות צדדית לפרויקט; כל הבנקים התאחדו.",""],"why":"איחוד משפטי של שתי חברות שוות או דומות ליצירת כוח משותף חזק יותר = מיזוג."},{"id":"m6-10","q":"GiantSoft קנתה את כל המניות של הסטארטאפ AppLeaf. AppLeaf ממשיכה לפעול בשם שלה, אבל כל ההחלטות מתקבלות בהנהלת GiantSoft. מה זה?","o":["מיזוג","רכישה","ברית אסטרטגית","מיקור חוץ"],"a":1,"w":["במיזוג שתי חברות דומות מתאחדות; כאן אחת קנתה את השנייה והשליטה עברה אליה.","","בברית אין העברת בעלות ושליטה.","מיקור חוץ הוא קניית שירות, לא קניית חברה."],"why":"הרוכשת קנתה מניות ונכסים, הנרכשת ממשיכה כחברת בת, והשליטה עברה במלואה = רכישה."},{"id":"m6-11","q":"רשת הסופרמרקטים FreshMart קנתה את רשת הסופרמרקטים המתחרה GreenBasket. איזה סוג אינטגרציה זה?","o":["אינטגרציה אנכית לאחור","אינטגרציה אופקית","אינטגרציה אנכית לפנים","מיקור חוץ"],"a":1,"w":["לאחור = רכישת ספק; GreenBasket היא מתחרה, לא ספק.","","לפנים = רכישת מפיץ או לקוח; כאן נרכשה רשת באותו שלב.","זו רכישה של חברה, לא העברת פעילות לספק."],"why":"רכישת מתחרה שפועל באותו שלב בנתיב ההפצה = אינטגרציה אופקית."},{"id":"m6-12","q":"יצרנית השוקולד ChocoLux קנתה מטע קקאו בגאנה, שממנו היא קונה את חומר הגלם. איזה סוג אינטגרציה זה?","o":["אינטגרציה אנכית לפנים","אינטגרציה אופקית","הגוונה","אינטגרציה אנכית לאחור"],"a":3,"w":["לפנים היא לכיוון המפיצים והלקוחות; מטע הקקאו הוא ספק.","מטע הקקאו אינו מתחרה באותו שלב.","החברה נשארת בעסקי השוקולד; היא רק משתלטת על הספק שלה.",""],"why":"רכישת ספק, שלב קודם בשרשרת הערך = אינטגרציה אנכית לאחור."},{"id":"m6-13","q":"מבשלת הבירה HopHouse קנתה רשת של 40 פאבים שמוכרים את הבירה שלה. איזה סוג אינטגרציה זה?","o":["אינטגרציה אנכית לאחור","אינטגרציה אנכית לפנים","אינטגרציה אופקית","ברית אסטרטגית"],"a":1,"w":["לאחור היא לכיוון הספקים, למשל חוות שעורה.","","הפאבים אינם מבשלות מתחרות; הם הערוץ שמוכר ללקוח.","זו רכישה עם העברת בעלות, לא שיתוף פעולה בין חברות עצמאיות."],"why":"רכישת מפיץ/לקוח, השלב הבא בשרשרת הערך = אינטגרציה אנכית לפנים."},{"id":"m6-14","q":"ב-2005 eBay רכשה את Skype בכ-2.6 מיליארד דולר, ולא הצליחה לייצר חיבור בין שני העסקים. מה המקרה הזה ממחיש בקורס?","o":["חיסרון של M&A: לעיתים מיזוגים ורכישות לא מצליחים","יתרון של M&A: התגברות על חסמי כניסה","הצלחה של אסטרטגיית חדירה לשוק","דוגמה למיקור חוץ מוצלח"],"a":0,"w":["","הסיכום מציג את המקרה בצד החסרונות.","זו רכישה של חברה בתחום אחר, לא מכירה של מוצר קיים בשוק קיים.","eBay קנתה את Skype; היא לא העבירה אליה פעילות."],"why":"eBay–Skype מופיע בטבלת M&A תחת ״חסרונות״: לעיתים המיזוגים/הרכישות אינם מצליחים."},{"id":"m6-15","q":"איזה מהבאים <b>אינו</b> יתרון של מיזוגים ורכישות לפי הקורס?","o":["השגת כוח שוק מוגבר","התגברות על חסמי כניסה","צמצום עלויות","שילוב ארגוני ותרבותי קל ומובטח"],"a":3,"w":["זה יתרון מרכזי של M&A.","זה יתרון: קונים חברה שכבר נמצאת בשוק.","זה יתרון: חוסכים כפילויות.",""],"why":"השילוב הארגוני והתרבותי הוא דווקא אחד החסרונות של M&A: הוא קשה, ולפעמים מכשיל את העסקה."},{"id":"m6-16","q":"חברת המשקאות FizzUp מוכרת את המשקה שלה בישראל כבר עשר שנים. השנה היא מציעה מבצעי ״1+1״ בסופרמרקטים ומגדילה מאוד את תקציב הפרסום, כדי להגדיל את נתח השוק שלה בישראל. לפי מטריצת אנסוף, זו:","o":["פיתוח שווקים","פיתוח מוצרים","הגוונה","חדירה לשוק (העמקה)"],"a":3,"w":["השוק לא חדש: זו אותה ישראל ואותם לקוחות.","המוצר לא חדש: זה אותו משקה.","הגוונה היא מוצר חדש בשוק חדש; כאן שניהם קיימים.",""],"why":"מוצר קיים + שוק קיים + מבצעים ופרסום להגדלת נתח שוק = חדירה לשוק, האסטרטגיה בעלת הסיכון הנמוך ביותר."},{"id":"m6-17","q":"רשת ההמבורגרים הישראלית BurgerBros פותחת סניפים בגרמניה עם אותו תפריט בדיוק. לפי מטריצת אנסוף, זו:","o":["חדירה לשוק","פיתוח מוצרים","הגוונה","פיתוח שווקים"],"a":3,"w":["חדירה היא באותו שוק; גרמניה היא שוק חדש.","התפריט לא השתנה; המוצר קיים.","הגוונה דורשת גם מוצר חדש; כאן המוצר קיים.",""],"why":"מוצר קיים + שוק חדש (סניפים בחו״ל) = פיתוח שווקים."},{"id":"m6-18","q":"הבנק SafeBank משיק ללקוחות הקיימים שלו אפליקציית השקעות חדשה לגמרי, שלא הייתה לו קודם. לפי מטריצת אנסוף, זו:","o":["פיתוח מוצרים","פיתוח שווקים","חדירה לשוק","הגוונה"],"a":0,"w":["","הלקוחות והשוק קיימים; רק המוצר חדש.","בחדירה מוכרים מוצר קיים; כאן המוצר חדש.","בהגוונה גם השוק חדש; כאן הלקוחות הם הלקוחות הקיימים."],"why":"מוצר חדש + שוק (לקוחות) קיים = פיתוח מוצרים."},{"id":"m6-19","q":"חברת המזון TastyFoods, שעד היום ייצרה רק מוצרי חלב, נכנסת לתחום המלונאות ובונה רשת בתי מלון. לפי מטריצת אנסוף, זו:","o":["פיתוח מוצרים","פיתוח שווקים","הגוונה (גיוון)","חדירה לשוק"],"a":2,"w":["גם הלקוחות והשוק חדשים, לא רק המוצר.","המוצר לא קיים אצל החברה; בית מלון הוא מוצר חדש לגמרי.","","בחדירה גם המוצר וגם השוק קיימים."],"why":"מוצר חדש לחלוטין + שוק חדש = הגוונה, האסטרטגיה המורכבת והמסוכנת ביותר."},{"id":"m6-20","q":"איזו אסטרטגיה במטריצת אנסוף היא בעלת רמת הסיכון הנמוכה ביותר?","o":["הגוונה","פיתוח שווקים","חדירה לשוק (העמקה)","פיתוח מוצרים"],"a":2,"w":["הגוונה היא המסוכנת ביותר: גם מוצר וגם שוק חדשים.","יש בה שוק חדש ולכן יותר אי-ודאות מחדירה.","","יש בה מוצר חדש ולכן יותר אי-ודאות מחדירה."],"why":"בחדירה לשוק החברה מכירה גם את המוצר וגם את השוק, ולכן הסיכון הנמוך ביותר."},{"id":"m6-21","q":"איזו אסטרטגיה במטריצת אנסוף היא המורכבת והמסוכנת ביותר?","o":["חדירה לשוק","פיתוח מוצרים","פיתוח שווקים","הגוונה (גיוון)"],"a":3,"w":["חדירה היא הבטוחה ביותר.","בפיתוח מוצרים השוק מוכר לחברה.","בפיתוח שווקים המוצר מוכר לחברה.",""],"why":"בהגוונה גם המוצר וגם השוק חדשים, ולכן החברה פועלת בלי ידע קודם בשני המישורים."},{"id":"m6-22","q":"על אילו שני ממדים בנויה מטריצת אנסוף?","o":["עלות ושליטה","מוצרים (קיימים/חדשים) ושווקים (קיימים/חדשים)","חידוש טכנולוגי וחדשנות במודל העסקי","חיסכון בעלויות ותגובה מקומית"],"a":1,"w":["אלה ממדים של בחירת אופן כניסה לשוק בינלאומי (יחידה 7).","","אלה צירי מפת סוגי החדשנות (יחידה 5).","אלה צירי האסטרטגיות הבינלאומיות (יחידה 7)."],"why":"אנסוף מצליב מוצרים עם שווקים ומקבל ארבע חלופות צמיחה."},{"id":"m6-23","q":"רשת בתי הקפה BeanUp פנתה תמיד לאנשי עסקים. עכשיו היא פותחת סניפים ליד קמפוסים ומשיקה קמפיין שמכוון לסטודנטים, עם אותו תפריט. לפי מטריצת אנסוף, זו:","o":["חדירה לשוק","פיתוח שווקים","פיתוח מוצרים","הגוונה"],"a":1,"w":["קהל היעד חדש (סטודנטים), ולכן זה שוק חדש ולא העמקה בשוק הקיים.","","התפריט לא השתנה.","המוצר קיים, ולכן זו לא הגוונה."],"why":"פנייה לקהל יעד חדש עם מוצר קיים = פיתוח שווקים. שוק חדש הוא לא רק מדינה חדשה."},{"id":"m6-24","q":"שתי חברות תרופות עצמאיות מחליטות לעבוד יחד על פיתוח תרופה מסוימת, כל אחת עם הידע שלה, כדי שהתוצאה תהיה טובה יותר לשתיהן. מהי מטרת שיתוף פעולה כזה לפי הקורס?","o":["להעביר פעילות שאינה קריטית לגורם חיצוני","להעביר את השליטה המלאה לאחת החברות","לעבוד בשיתוף פעולה על פרויקט מסוים, כדי שהתוצאה תהיה טובה יותר לשני הצדדים","להוריד את נתח השוק של שתיהן"],"a":2,"w":["זו מטרת מיקור חוץ.","העברת שליטה מלאה היא רכישה.","","אין זו מטרה של שיתוף פעולה."],"why":"לפי הסיכום, מטרת הברית: פרויקט מסוים שתוצאתו טובה יותר לשני הצדדים."}],"tf":[{"id":"m6-t1","s":"מיקור חוץ הוא העברת פעילויות לגורם חיצוני מומחה או בעל עלויות נמוכות יותר, כדי להתמקד בעסקי הליבה.","a":true,"why":"נכון. זו ההגדרה בקורס."},{"id":"m6-t2","s":"מומלץ להעביר למיקור חוץ דווקא את הפעילות שמהווה את מקור היתרון התחרותי, כי ספק מומחה יבצע אותה טוב יותר.","a":false,"why":"לא נכון. התנאי ההכרחי הוא שהפעילות אינה קריטית ליתרון תחרותי בר-קיימא."},{"id":"m6-t3","s":"החסרונות של מיקור חוץ הם אובדן שליטה ותלות חיצונית.","a":true,"why":"נכון. הספק מבצע את הפעילות, ולכן החברה שולטת בה פחות ותלויה בו."},{"id":"m6-t4","s":"מיזם משותף הוא מושג רחב וכללי יותר מברית אסטרטגית.","a":false,"why":"לא נכון. ההפך: ברית (שיתוף פעולה) היא מושג רחב, ומיזם משותף הוא צורה ספציפית ומהודקת יותר."},{"id":"m6-t5","s":"נשקול ברית אסטרטגית כאשר נרצה לחדור לשווקים חדשים או גלובליים, או לפתח טכנולוגיות מתקדמות.","a":true,"why":"נכון. אלה שני המצבים שהסיכום מציין."},{"id":"m6-t6","s":"במיזוג, חברה אחת קונה את מניות החברה השנייה, וזו ממשיכה לפעול כחברת בת.","a":false,"why":"לא נכון. זה תיאור של רכישה. מיזוג הוא איחוד משפטי של שתי חברות שוות או דומות."},{"id":"m6-t7","s":"ברכישה, השליטה עוברת במלואה לחברה הרוכשת.","a":true,"why":"נכון. גם אם הנרכשת ממשיכה לפעול כחברת בת, השליטה כולה אצל הרוכשת."},{"id":"m6-t8","s":"אינטגרציה אופקית היא רכישה של ספק חומרי הגלם של החברה.","a":false,"why":"לא נכון. רכישת ספק היא אינטגרציה אנכית לאחור. אופקית היא רכישת מתחרה באותו שלב."},{"id":"m6-t9","s":"אינטגרציה אנכית לאחור היא רכישת ספקים.","a":true,"why":"נכון. ״לאחור״ = לכיוון חומרי הגלם בשרשרת הערך."},{"id":"m6-t10","s":"אינטגרציה אנכית לפנים היא רכישת מפיצים או לקוחות.","a":true,"why":"נכון. ״לפנים״ = לכיוון הלקוח הסופי בשרשרת הערך."},{"id":"m6-t11","s":"מיזוגים ורכישות תמיד מצליחים, כי הם יוצרים סינרגיה.","a":false,"why":"לא נכון. יש סיכון לכישלון המיזוג, כמו במקרה eBay–Skype."},{"id":"m6-t12","s":"רכישת Skype על ידי eBay ב-2005 מוצגת בקורס כדוגמה לרכישה שלא הצליחה.","a":true,"why":"נכון. היא מופיעה בצד החסרונות של M&A."},{"id":"m6-t13","s":"מטריצת אנסוף מצליבה מוצרים (קיימים/חדשים) עם שווקים (קיימים/חדשים).","a":true,"why":"נכון. כך מתקבלות ארבע חלופות צמיחה."},{"id":"m6-t14","s":"חדירה לשוק היא האסטרטגיה המסוכנת ביותר במטריצת אנסוף.","a":false,"why":"לא נכון. חדירה לשוק היא בעלת הסיכון הנמוך ביותר. המסוכנת ביותר היא הגוונה."},{"id":"m6-t15","s":"הגוונה היא פיתוח מוצרים חדשים לחלוטין לשווקים חדשים.","a":true,"why":"נכון. לכן היא המורכבת והמסוכנת ביותר."},{"id":"m6-t16","s":"פתיחת סניפים בחו״ל עם אותם מוצרים היא פיתוח מוצרים לפי אנסוף.","a":false,"why":"לא נכון. מוצר קיים בשוק חדש הוא פיתוח שווקים."},{"id":"m6-t17","s":"אחד החסרונות של מיזוגים ורכישות הוא הקושי בשילוב הארגוני והתרבותי.","a":true,"why":"נכון. שתי חברות עם תרבויות שונות צריכות לעבוד כגוף אחד, וזה עלול להכשיל את המהלך."},{"id":"m6-t18","s":"התגברות על חסמי כניסה היא אחד היתרונות של מיזוגים ורכישות.","a":true,"why":"נכון. קונים חברה שכבר נמצאת בשוק, וכך עוקפים את החסמים."}],"scope":[{"ref":"סיכום · עמ׳ 11","x":"מיקור חוץ: מתי (התנאי ההכרחי), יתרונות וחסרונות","imp":1,"h":"מיקור חוץ (Outsourcing)"},{"ref":"סיכום · עמ׳ 11","x":"ברית אסטרטגית / שיתוף פעולה: מתי לשקול ומה המטרה","imp":1,"h":"ברית אסטרטגית / שיתוף פעולה אסטרטגי (Strategic Alliance)"},{"ref":"סיכום · עמ׳ 11","x":"מיזם משותף (Joint Venture): מתי לשקול","imp":1,"h":"מיזם משותף (Joint Venture)"},{"ref":"סיכום · עמ׳ 11","x":"ההבדל בין שיתוף פעולה למיזם משותף","imp":1,"h":"ברית אסטרטגית מול מיזם משותף"},{"ref":"סיכום · עמ׳ 11","x":"מיזוגים ורכישות: מיזוג מול רכישה","imp":1,"h":"מיזוגים ורכישות (M&A)"},{"ref":"סיכום · עמ׳ 11","x":"יתרונות וחסרונות M&A ומקרה eBay–Skype","imp":1,"h":"יתרונות וחסרונות של M&A, ומקרה eBay–Skype"},{"ref":"סיכום · עמ׳ 12","x":"אינטגרציה אופקית ואנכית (לאחור/לפנים)","imp":1,"h":"אינטגרציה אופקית ואינטגרציה אנכית"},{"ref":"סיכום · עמ׳ 12","x":"מטריצת אנסוף: חדירה לשוק, פיתוח מוצרים, פיתוח שווקים, הגוונה","imp":2,"h":"מטריצת אנסוף: אסטרטגיות צמיחה (Ansoff Matrix)"}],"outScope":[]},{"id":"m7","title":"תחרות בשווקים בינלאומיים","short":"שווקים בינלאומיים","blurb":"יתרונות ואתגרים של גלובליזציה, ארבע האסטרטגיות הבינלאומיות לפי חיסכון בעלויות ותגובה מקומית, ואופני החדירה לפי עלות, שליטה וסיכון.","mnemonic":"ארבע האסטרטגיות: גלובלית = ״אותו דבר לכולם, הכי זול״; רב-מקומית = ״לכל מדינה משלה״; על-לאומית = ״גם וגם״; בינלאומית = ״לא זה ולא זה – מוכרים את מה שיש בבית״. אופני חדירה, מהזול לבעלות מלאה: זיכיון/רישיון (זול, בטוח) ← ייצוא וברית (בינוני) ← רכישה/Greenfield (יקר, שליטה מלאה, סיכון עולה).","blocks":[{"t":"h","x":"גלובליזציה: יתרונות ואתגרים"},{"t":"p","x":"<b>גלובליזציה</b> היא התהליך שבו שווקים, ייצור, הון וידע עוברים בין מדינות כמעט בלי גבולות. לחברה היא פותחת הזדמנויות, אבל גם מביאה אתגרים."},{"t":"table","head":["יתרונות (הזדמנויות)","אתגרים (קשיים)"],"rows":[["<b>הארכת חיי המוצר</b>: מוצר שנמצא בדעיכה בשוק אחד יכול להתחיל מחדש בשוק אחר","<b>התנהגות צרכנים</b> שונה: טעמים, הרגלים, ציפיות"],["<b>גישה לכוח עבודה זול</b>","<b>רגולציה</b>: חוקים ותקנים שונים בכל מדינה"],["<b>הבטחת משאבים</b>: גישה לחומרי גלם ולמקורות אנרגיה","<b>מיסוי</b> ומכסים"],["שוק גדול יותר ויתרון לגודל (ידע כללי)","<b>שפה ותרבות</b>"],["פיזור סיכון בין כמה שווקים (ידע כללי)","<b>סביבה פוליטית</b>: יציבות, יחסים בין מדינות"]]},{"t":"example","x":"יצרנית מכשירי הטלפון הקווי TeleOne כמעט לא מוכרת יותר באירופה, אבל באפריקה עדיין יש ביקוש. היא מעבירה את המכירות לשם ← <b>הארכת חיי המוצר</b>. במקביל היא מגלה שבכל מדינה יש תקן חשמל אחר ומכס אחר ← אתגרי <b>רגולציה ומיסוי</b>.","title":"דוגמה"},{"t":"trap","x":"״הבטחת משאבים״ ו״גישה לכוח עבודה זול״ הם <b>יתרונות</b> של גלובליזציה. ״שפה, תרבות, רגולציה, מיסוי ופוליטיקה״ הם <b>אתגרים</b>. מסיחים מחליפים ביניהם."},{"t":"h","x":"ארבע האסטרטגיות הבינלאומיות: לחץ לחיסכון בעלויות × לחץ לתגובה מקומית"},{"t":"p","x":"ברמת התאגיד, החברה בוחרת אסטרטגיה בינלאומית לפי שני לחצים:"},{"t":"list","x":["<b>הלחץ (הצורך) לחיסכון בעלויות</b>: עד כמה התחרות היא על מחיר? אם המוצר דומה אצל כולם, חייבים להיות זולים, ולכן מייצרים מוצר אחיד בכמויות ענק.","<b>הלחץ (הצורך) לתגובה מקומית</b>: עד כמה כל מדינה רוצה משהו אחר? טעמים, שפה, חוקים, ערוצי הפצה."]},{"t":"table","head":["","צורך <b>נמוך</b> בתגובה מקומית","צורך <b>גבוה</b> בתגובה מקומית"],"rows":[["צורך <b>גבוה</b> בחיסכון בעלויות","<b>גלובלית</b> (Global) – מוצר אחיד","<b>על-לאומית</b> (Transnational) – גם וגם"],["צורך <b>נמוך</b> בחיסכון בעלויות","<b>בינלאומית</b> (International) – נמוך בשניהם","<b>רב-מקומית</b> (Multi-domestic) – התאמה מלאה לכל מדינה"]]},{"t":"p","x":"זה המודל של <b>Bartlett & Ghoshal</b>, כפי שהוא מופיע אצל Hill & Jones."},{"t":"trap","x":"אל תתבלבלו בשמות: <b>גלובלית</b> = מוצר אחיד לכל העולם (חיסכון). <b>בינלאומית</b> = נמוך בשני הצירים. <b>על-לאומית</b> = גבוה בשני הצירים. <b>רב-מקומית</b> = התאמה מקומית מלאה. השם ״בינלאומית״ נשמע כללי, אבל במבחן הוא המשבצת נמוך-נמוך."},{"t":"exam","x":"שאלה ישירה: ״צורך גבוה בחיסכון ונמוך בתגובה מקומית?״ ← גלובלית. שאלת סיפור: מחפשים מילים כמו ״אותו מוצר בכל העולם״, ״כל מדינה מקבלת גרסה משלה״, ״גם זול וגם מותאם״."},{"t":"h","x":"כל אסטרטגיה בפירוט, עם דוגמאות"},{"t":"table","head":["אסטרטגיה","חיסכון בעלויות","תגובה מקומית","מה זה בפועל","דוגמה"],"rows":[["<b>גלובלית</b> (Global)","גבוה","נמוך","<b>מוצר אחיד</b> לכל העולם, מיוצר בכמה מפעלים גדולים כדי ליהנות מיתרון לגודל","Intel – אותו מעבד בכל מדינה; Bic"],["<b>רב-מקומית</b> (Multi-domestic)","נמוך","גבוה","<b>התאמה מלאה לכל מדינה</b>: מוצר, שיווק ולפעמים מותג. כל חברת בת פועלת כמעט כחברה מקומית","חברות מזון שמשנות מתכונים ומותגים לכל מדינה (Nestlé, Unilever)"],["<b>על-לאומית</b> (Transnational)","גבוה","גבוה","מנסים <b>גם להיות יעילים וגם להתאים</b>: פלטפורמה ותהליכים משותפים, ושכבה מקומית מעליהם. הכי קשה לנהל","McDonald׳s – מערכת תפעול גלובלית אחידה, ותפריט עם מנות מקומיות; Caterpillar"],["<b>בינלאומית</b> (International)","נמוך","נמוך","מוכרים בחו״ל את <b>המוצר שפותח בבית</b>, כמעט בלי התאמות. מתאים כשהמוצר ייחודי ואין לחץ מחיר","חברה עם מוצר ייחודי ומעט מתחרים, כמו Microsoft בשנים הראשונות"]]},{"t":"example","x":"חברת הצעצועים ToyNation מוכרת בכל מדינה את אותם משחקים. היא נלחמת על מחיר מול מתחרים מסין, ולכן מרכזת את כל הייצור בשני מפעלים ענקיים. ← צורך גבוה בחיסכון, נמוך בהתאמה ← <b>גלובלית</b>.","title":"סיפור"},{"t":"example","x":"רשת המזון QuickBite מחזיקה מערכת רכש, מטבחים ותוכנה אחידים בכל העולם, אבל בכל מדינה התפריט כולל מנות מקומיות. ← גם חיסכון וגם התאמה ← <b>על-לאומית</b>.","title":"סיפור"},{"t":"trap","x":"״המוצר מותאם לכל מדינה״ לבד מצביע על <b>רב-מקומית</b>. רק אם הסיפור מדגיש <b>גם</b> לחץ חזק על עלויות (תחרות מחיר, פלטפורמה משותפת, יתרון לגודל) – זו <b>על-לאומית</b>."},{"t":"h","x":"אופני חדירה לשווקים בינלאומיים: עלות, שליטה וסיכון"},{"t":"p","x":"כשחברה נכנסת לשוק זר, היא בוחרת <b>אופן חדירה</b> לפי שלושה ממדים: <b>עלות</b> (כמה צריך להשקיע), <b>שליטה</b> (כמה החברה שולטת במה שקורה בשוק הזר) ו<b>סיכון</b>."},{"t":"table","head":["אופן חדירה","מה זה","עלות","שליטה","סיכון"],"rows":[["<b>ייצוא</b> (Export)","מייצרים בבית ושולחים לשוק הזר, לרוב דרך מפיץ מקומי","בינונית","נמוכה","נמוך"],["<b>זיכיון / רישיון</b> (Franchising / Licensing)","נותנים לחברה מקומית את הזכות להשתמש במותג, בשיטה או בטכנולוגיה, תמורת תשלום או תמלוגים","נמוכה","משתנה","נמוך"],["<b>בריתות אסטרטגיות</b> (Strategic Alliances)","שיתוף פעולה עם שותף מקומי שמכיר את השוק","בינונית","בינונית","נמוך"],["<b>רכישה / הקמת חברת בת חדשה</b> (Acquisition / Greenfield)","קונים חברה מקומית, או בונים מאפס חברת בת בבעלות מלאה","גבוהה","גבוהה","בינוני עד גבוה"]]},{"t":"p","x":"כלל: ככל שהחברה <b>משקיעה יותר</b> ושולטת יותר, גם <b>הסיכון עולה</b>. בקצה אחד זיכיון/רישיון – זול ובטוח, אבל השליטה בידי השותף. בקצה השני רכישה/גרינפילד – שליטה מלאה, אבל השקעה גבוהה וסיכון בינוני עד גבוה."},{"t":"list","x":["<b>Greenfield</b> = ״שדה ירוק״: בונים חברת בת חדשה מאפס (מפעל, משרדים, עובדים), בבעלות מלאה.","<b>זיכיון</b> (Franchising) נפוץ בשירותים: רשתות מזון ומלונות. <b>רישיון</b> (Licensing) נפוץ בטכנולוגיה ובמותגים: מתירים לייצר לפי הפטנט או תחת השם.","<b>שליטה ״משתנה״</b> בזיכיון/רישיון: תלוי כמה הדוק החוזה. זכיין של McDonald׳s מחויב לכללים רבים; ברישיון פשוט השליטה קטנה."]},{"t":"example","x":"1) יצרנית היין VinoSol מייצרת בישראל ושולחת ארגזים למפיץ ביפן ← <b>ייצוא</b>. 2) רשת ההמבורגרים GrillTown נותנת ליזם בברזיל לפתוח סניפים תחת המותג שלה תמורת דמי זיכיון ← <b>זיכיון</b>. 3) יצרנית הבגדים FabriCo בונה מפעל חדש משלה בווייטנאם ← <b>Greenfield</b>.","title":"סיפורים"},{"t":"trap","x":"ייצוא הוא <b>לא</b> הזול ביותר בטבלה של הקורס: העלות שלו <b>בינונית</b>. הזול ביותר הוא <b>זיכיון/רישיון</b>. וגם: ייצוא = שליטה <b>נמוכה</b>, כי מפיץ זר מוכר את המוצר."},{"t":"trap","x":"רכישה/גרינפילד היא <b>לא</b> בעלת הסיכון הנמוך ביותר, למרות שהשליטה מלאה. ההשקעה הגבוהה הופכת את הסיכון לבינוני עד גבוה."},{"t":"exam","x":"שאלות טיפוסיות: ״איזה אופן חדירה נותן את השליטה הגבוהה ביותר?״ ← רכישה/גרינפילד. ״חברה עם תקציב קטן שרוצה להיכנס מהר בסיכון נמוך ומוכנה לוותר על שליטה?״ ← זיכיון/רישיון. ״עלות בינונית, שליטה נמוכה, סיכון נמוך?״ ← ייצוא."},{"t":"h","x":"איך פותרים שאלת סיפור ביחידה"},{"t":"steps","x":["אם השאלה היא <b>איך מנהלים את הפעילות בכל המדינות</b> ← אחת מארבע האסטרטגיות. בדקו: האם יש לחץ חזק על מחיר? האם כל מדינה דורשת התאמה?","גבוה/נמוך ← <b>גלובלית</b>. נמוך/גבוה ← <b>רב-מקומית</b>. גבוה/גבוה ← <b>על-לאומית</b>. נמוך/נמוך ← <b>בינלאומית</b>.","אם השאלה היא <b>איך נכנסים</b> למדינה מסוימת ← אופן חדירה. בדקו: מי מייצר? מי הבעלים בשוק הזר? כמה השקיעו?","מייצרים בבית ושולחים ← ייצוא. נותנים זכות לאחר ← זיכיון/רישיון. שותף מקומי ← ברית. בעלות מלאה ← רכישה/Greenfield."],"title":"סדר עבודה"}],"cheat":["יתרונות גלובליזציה = הארכת חיי מוצר, כוח עבודה זול, הבטחת משאבים","אתגרי גלובליזציה = התנהגות צרכנים, רגולציה, מיסוי, שפה, תרבות, סביבה פוליטית","שני הצירים = לחץ לחיסכון בעלויות × לחץ לתגובה מקומית","גלובלית = חיסכון גבוה, תגובה מקומית נמוכה; מוצר אחיד","רב-מקומית = חיסכון נמוך, תגובה מקומית גבוהה; התאמה מלאה לכל מדינה","על-לאומית (Transnational) = גבוה בשניהם; גם יעילות וגם התאמה","בינלאומית (International) = נמוך בשניהם; מוכרים את מוצר הבית כמעט בלי התאמה","אופני חדירה נבחרים לפי = עלות, שליטה, סיכון","ייצוא = עלות בינונית, שליטה נמוכה, סיכון נמוך","זיכיון/רישיון = עלות נמוכה, סיכון נמוך, שליטה משתנה","ברית אסטרטגית = עלות בינונית, שליטה בינונית, סיכון נמוך","רכישה/Greenfield = עלות גבוהה, שליטה גבוהה, סיכון בינוני עד גבוה","Greenfield = הקמת חברת בת חדשה מאפס בבעלות מלאה","הכי זול = זיכיון/רישיון; הכי הרבה שליטה = רכישה/Greenfield","מלכודת = ״בינלאומית״ היא המשבצת נמוך-נמוך, לא שם כללי"],"mcq":[{"id":"m7-1","q":"לפי הקורס, מה מאפיין אסטרטגיה גלובלית?","o":["צורך נמוך בחיסכון בעלויות וצורך גבוה בתגובה מקומית","צורך גבוה בחיסכון בעלויות וצורך נמוך בתגובה מקומית","צורך גבוה בשניהם","צורך נמוך בשניהם"],"a":1,"w":["זו אסטרטגיה רב-מקומית.","","זו אסטרטגיה על-לאומית.","זו אסטרטגיה בינלאומית."],"why":"גלובלית = מוצר אחיד לכל העולם כדי לחסוך בעלויות, כמעט בלי התאמות מקומיות."},{"id":"m7-2","q":"חברת השבבים ChipCore מוכרת את אותו מעבד בדיוק בכל מדינה. התחרות בענף היא בעיקר על מחיר, ולכן היא מייצרת בשני מפעלי ענק בלבד. איזו אסטרטגיה בינלאומית זו?","o":["אסטרטגיה רב-מקומית","אסטרטגיה גלובלית","אסטרטגיה על-לאומית","אסטרטגיה בינלאומית"],"a":1,"w":["אין כאן התאמה לכל מדינה; המוצר אחיד.","","אין לחץ לתגובה מקומית; רק לחץ על עלויות.","בבינלאומית אין לחץ חזק על עלויות; כאן התחרות היא על מחיר."],"why":"לחץ גבוה על עלויות + מוצר אחיד בלי התאמות = גלובלית."},{"id":"m7-3","q":"חברת המזון FoodLand משנה בכל מדינה את המתכונים, האריזות ואפילו את שם המותג. כל חברת בת מקבלת החלטות לבד, והחיסכון בעלויות אינו בראש סדרי העדיפויות. איזו אסטרטגיה זו?","o":["אסטרטגיה רב-מקומית","אסטרטגיה גלובלית","אסטרטגיה בינלאומית","אסטרטגיה על-לאומית"],"a":0,"w":["","בגלובלית המוצר אחיד; כאן הוא מותאם לכל מדינה.","בבינלאומית כמעט אין התאמה מקומית.","בעל-לאומית יש גם לחץ גבוה לחיסכון בעלויות; כאן הוא נמוך."],"why":"צורך גבוה בתגובה מקומית + צורך נמוך בחיסכון = רב-מקומית, התאמה מלאה לכל מדינה."},{"id":"m7-4","q":"רשת המזון QuickBite מפעילה מערכת רכש, מטבחים ותוכנה אחידים בכל העולם כדי להוזיל עלויות, ובכל מדינה מוסיפה לתפריט מנות מקומיות. איזו אסטרטגיה זו?","o":["אסטרטגיה גלובלית","אסטרטגיה רב-מקומית","אסטרטגיה בינלאומית","אסטרטגיה על-לאומית"],"a":3,"w":["בגלובלית אין התאמה מקומית; כאן יש מנות מקומיות.","ברב-מקומית אין לחץ חזק על עלויות ואין מערכת אחידה.","בבינלאומית הלחץ נמוך בשני הצירים.",""],"why":"גם חיסכון בעלויות (מערכות אחידות) וגם תגובה מקומית (מנות מקומיות) = על-לאומית."},{"id":"m7-5","q":"חברת התוכנה UniqueSoft מפתחת מוצר ייחודי שכמעט אין לו מתחרים. היא מוכרת אותו בכל העולם בדיוק כפי שפותח בבית, ואין עליה לחץ להוריד מחירים או להתאים את המוצר. איזו אסטרטגיה זו?","o":["אסטרטגיה גלובלית","אסטרטגיה רב-מקומית","אסטרטגיה בינלאומית","אסטרטגיה על-לאומית"],"a":2,"w":["בגלובלית יש לחץ גבוה על עלויות; כאן אין.","ברב-מקומית מתאימים לכל מדינה; כאן לא.","","בעל-לאומית הלחץ גבוה בשני הצירים."],"why":"צורך נמוך בחיסכון וצורך נמוך בתגובה מקומית = בינלאומית."},{"id":"m7-6","q":"איזו אסטרטגיה מתאימה למצב של צורך גבוה גם בחיסכון בעלויות וגם בתגובה מקומית?","o":["על-לאומית (Transnational)","גלובלית (Global)","רב-מקומית (Multi-domestic)","בינלאומית (International)"],"a":0,"w":["","גלובלית מתאימה לצורך נמוך בתגובה מקומית.","רב-מקומית מתאימה לצורך נמוך בחיסכון.","בינלאומית מתאימה לצורך נמוך בשניהם."],"why":"על-לאומית מנסה להשיג גם יעילות גלובלית וגם התאמה מקומית."},{"id":"m7-7","q":"על אילו שני לחצים מבוססת הבחירה בין האסטרטגיות הבינלאומיות ברמת התאגיד?","o":["עלות מול שליטה","הצורך בחיסכון בעלויות מול הצורך בתגובה מקומית","מוצרים קיימים/חדשים מול שווקים קיימים/חדשים","חידוש טכנולוגי מול חדשנות במודל העסקי"],"a":1,"w":["עלות ושליטה הם ממדים לבחירת אופן חדירה לשוק.","","אלה צירי מטריצת אנסוף.","אלה צירי מפת סוגי החדשנות."],"why":"ארבע האסטרטגיות נבנות מהצלבת הלחץ לחיסכון בעלויות עם הלחץ לתגובה מקומית."},{"id":"m7-8","q":"איזה מהבאים הוא <b>יתרון</b> של גלובליזציה לפי הקורס?","o":["הארכת חיי המוצר","הבדלים בשפה ובתרבות","רגולציה שונה בכל מדינה","סביבה פוליטית לא יציבה"],"a":0,"w":["","זה אתגר של גלובליזציה.","זה אתגר של גלובליזציה.","זה אתגר של גלובליזציה."],"why":"גלובליזציה מאפשרת למכור מוצר בשווקים חדשים אחרי שבשוק המקורי הוא כבר בדעיכה."},{"id":"m7-9","q":"איזה מהבאים הוא <b>אתגר</b> של גלובליזציה לפי הקורס?","o":["הבדלים במיסוי וברגולציה בין מדינות","גישה לכוח עבודה זול","הבטחת משאבים","הארכת חיי המוצר"],"a":0,"w":["","זה יתרון של גלובליזציה.","זה יתרון של גלובליזציה.","זה יתרון של גלובליזציה."],"why":"רגולציה, מיסוי, שפה, תרבות, התנהגות צרכנים וסביבה פוליטית הם האתגרים."},{"id":"m7-10","q":"איזה אופן חדירה לשוק בינלאומי מאופיין בעלות גבוהה, שליטה גבוהה וסיכון בינוני עד גבוה?","o":["ייצוא","רכישה / הקמת חברת בת חדשה (Greenfield)","זיכיון / רישיון","ברית אסטרטגית"],"a":1,"w":["ייצוא הוא עלות בינונית, שליטה נמוכה וסיכון נמוך.","","זיכיון הוא עלות נמוכה וסיכון נמוך.","ברית היא עלות ושליטה בינוניות וסיכון נמוך."],"why":"בעלות מלאה בשוק הזר = השקעה גבוהה, שליטה גבוהה וסיכון בינוני עד גבוה."},{"id":"m7-11","q":"איזה אופן חדירה מאופיין בעלות נמוכה, סיכון נמוך ושליטה משתנה?","o":["רכישה / Greenfield","ייצוא","זיכיון / רישיון","ברית אסטרטגית"],"a":2,"w":["שם העלות והשליטה גבוהות.","בייצוא העלות בינונית והשליטה נמוכה.","","בברית העלות והשליטה בינוניות."],"why":"בזיכיון/רישיון השותף המקומי משקיע, ולכן העלות והסיכון נמוכים. השליטה תלויה בחוזה."},{"id":"m7-12","q":"יצרנית היין VinoSol מייצרת את כל היין שלה בישראל ושולחת ארגזים למפיץ ביפן, שמוכר אותו לחנויות. איזה אופן חדירה זה, ומה מידת השליטה בו?","o":["ייצוא – שליטה נמוכה","זיכיון – שליטה גבוהה","Greenfield – שליטה גבוהה","ברית אסטרטגית – שליטה בינונית"],"a":0,"w":["","אין כאן מתן זכות להשתמש במותג או בשיטה; וגם השליטה בזיכיון משתנה.","VinoSol לא הקימה חברת בת ביפן.","המפיץ רק קונה ומוכר; אין שיתוף פעולה אסטרטגי."],"why":"מייצרים בבית ושולחים למפיץ זר = ייצוא: עלות בינונית, שליטה נמוכה, סיכון נמוך."},{"id":"m7-13","q":"רשת ההמבורגרים GrillTown מאפשרת ליזם בברזיל לפתוח סניפים תחת המותג והשיטה שלה, תמורת דמי זיכיון ואחוז מהמכירות. היזם משקיע את הכסף. איזה אופן חדירה זה?","o":["ייצוא","רכישה","Greenfield","זיכיון"],"a":3,"w":["GrillTown לא מייצרת ושולחת מוצרים; היא נותנת זכות להשתמש במותג.","GrillTown לא קנתה חברה בברזיל.","GrillTown לא הקימה חברת בת משלה; היזם המקומי הוא הבעלים.",""],"why":"מתן זכות להשתמש במותג ובשיטה תמורת תשלום = זיכיון (Franchising): עלות נמוכה וסיכון נמוך."},{"id":"m7-14","q":"יצרנית הבגדים FabriCo בונה בווייטנאם מפעל חדש לגמרי, בבעלותה המלאה, ומגייסת עובדים מקומיים. איזה אופן חדירה זה?","o":["רישיון","הקמת חברת בת חדשה (Greenfield)","ייצוא","ברית אסטרטגית"],"a":1,"w":["ברישיון חברה מקומית מייצרת תחת הזכויות של FabriCo; כאן FabriCo עצמה הבעלים.","","בייצוא מייצרים בבית ושולחים; כאן מייצרים במדינה הזרה.","אין שותף מקומי; הבעלות מלאה."],"why":"בנייה מאפס של חברת בת בבעלות מלאה = Greenfield: עלות גבוהה, שליטה גבוהה, סיכון בינוני עד גבוה."},{"id":"m7-15","q":"איזה אופן חדירה נותן לחברה את השליטה הגבוהה ביותר בפעילות בשוק הזר?","o":["ייצוא","זיכיון / רישיון","רכישה / הקמת חברת בת חדשה (Greenfield)","ברית אסטרטגית"],"a":2,"w":["בייצוא השליטה נמוכה, כי המפיץ הזר מוכר.","בזיכיון השליטה משתנה, והפעילות בידי השותף.","","בברית השליטה בינונית ומשותפת."],"why":"בבעלות מלאה החברה מחליטה על הכול, ולכן השליטה הגבוהה ביותר."},{"id":"m7-16","q":"לחברה צעירה יש תקציב קטן. היא רוצה להיכנס לשוק זר מהר, בסיכון ובעלות נמוכים, ומוכנה שהשותף המקומי ינהל את הפעילות. איזה אופן חדירה מתאים לה ביותר?","o":["רכישה / Greenfield","זיכיון / רישיון","ייצוא","ברית אסטרטגית"],"a":1,"w":["זה האופן היקר ביותר, עם סיכון בינוני עד גבוה.","","העלות בייצוא בינונית, והחברה עדיין צריכה לייצר ולשלוח בעצמה.","בברית העלות בינונית, לא נמוכה."],"why":"זיכיון/רישיון = עלות נמוכה וסיכון נמוך; המחיר הוא שליטה שתלויה בחוזה."},{"id":"m7-17","q":"חברת התרופות MedOne נכנסת להודו יחד עם חברה הודית: ההודים מביאים הפצה וקשרים עם הרגולטור, MedOne מביאה את התרופות. כל אחת משקיעה חלק, והשליטה משותפת. מה אופן החדירה ומה המאפיינים שלו לפי הקורס?","o":["ייצוא – עלות נמוכה, שליטה גבוהה, סיכון גבוה","רכישה – עלות גבוהה, שליטה גבוהה, סיכון בינוני עד גבוה","זיכיון – עלות גבוהה, שליטה נמוכה, סיכון גבוה","ברית אסטרטגית – עלות בינונית, שליטה בינונית, סיכון נמוך"],"a":3,"w":["זה לא ייצוא, וגם המאפיינים שגויים: לייצוא שליטה נמוכה וסיכון נמוך.","MedOne לא קנתה את החברה ההודית.","זה לא זיכיון, וגם לזיכיון עלות וסיכון נמוכים.",""],"why":"שותף מקומי שחולק השקעה ושליטה = ברית אסטרטגית: עלות בינונית, שליטה בינונית, סיכון נמוך."},{"id":"m7-18","q":"לפי הטבלה בקורס, מהי העלות של ייצוא כאופן חדירה?","o":["נמוכה – הזולה מכל האפשרויות","גבוהה – כמו רכישה","משתנה – תלויה בחוזה","בינונית"],"a":3,"w":["הזול ביותר הוא זיכיון/רישיון, לא ייצוא.","עלות גבוהה שייכת לרכישה/Greenfield.","״משתנה״ מתאר את השליטה בזיכיון/רישיון.",""],"why":"לפי הסיכום: ייצוא = עלות בינונית, שליטה נמוכה, סיכון נמוך."},{"id":"m7-19","q":"חברת המכשור MedTech מוכרת מכשיר אחיד בכל העולם, אבל המתחרים מאסיה מורידים מחירים, ובמקביל כל מדינה דורשת אישורי רגולציה, שפת תפעול ושירות מקומי שונים. החברה מחליטה לרכז את ייצור הרכיבים במפעל אחד ולהוסיף בכל מדינה התאמות תוכנה ושירות. לאיזו אסטרטגיה היא עוברת?","o":["גלובלית","רב-מקומית","בינלאומית","על-לאומית"],"a":3,"w":["גלובלית מתעלמת מהתאמות מקומיות; כאן החברה מוסיפה התאמות לכל מדינה.","ברב-מקומית אין ריכוז ייצור לחיסכון; כאן יש לחץ מחיר חזק.","בבינלאומית הלחץ נמוך בשני הצירים; כאן הוא גבוה בשניהם.",""],"why":"לחץ מחיר (ריכוז ייצור) + לחץ להתאמה (רגולציה, שפה, שירות) = על-לאומית."},{"id":"m7-20","q":"רשת הקמעונאות HomeStyle פועלת בעשר מדינות. בכל מדינה יש הנהלה מקומית עצמאית שבוחרת את המוצרים, המחירים והפרסום לפי טעם המקומיים. איזו אסטרטגיה זו?","o":["גלובלית","בינלאומית","רב-מקומית","על-לאומית"],"a":2,"w":["בגלובלית ההחלטות מרוכזות והמוצר אחיד.","בבינלאומית מוכרים את מוצר הבית כמעט בלי התאמות.","","הסיפור לא מזכיר לחץ לחיסכון בעלויות או מערכות משותפות."],"why":"הנהלה מקומית עצמאית והתאמה מלאה לטעם המקומי = רב-מקומית."},{"id":"m7-21","q":"מה המשמעות של המונח Greenfield באופני חדירה לשווקים בינלאומיים?","o":["מתן זכות לחברה מקומית להשתמש במותג","משלוח מוצרים מהבית למפיץ זר","הקמת חברת בת חדשה מאפס בשוק הזר, בבעלות מלאה","כניסה לשוק זר עם מוצרים ידידותיים לסביבה"],"a":2,"w":["זה זיכיון/רישיון.","זה ייצוא.","","המונח לא קשור לאיכות הסביבה; ״שדה ירוק״ = בנייה מאפס."],"why":"Greenfield (״שדה ירוק״) = בונים חברת בת חדשה מאפס, עם שליטה גבוהה, עלות גבוהה וסיכון בינוני עד גבוה."},{"id":"m7-22","q":"איזה אופן חדירה לשוק זר הוא הזול ביותר לפי הקורס?","o":["זיכיון / רישיון","ייצוא","ברית אסטרטגית","רכישה / Greenfield"],"a":0,"w":["","לייצוא עלות בינונית.","לברית עלות בינונית.","זה האופן היקר ביותר."],"why":"בזיכיון/רישיון השותף המקומי נושא בהשקעה, ולכן העלות נמוכה."}],"tf":[{"id":"m7-t1","s":"גלובליזציה מאפשרת לחברות גישה לכוח עבודה זול.","a":true,"why":"נכון. זה אחד היתרונות שהסיכום מציין, לצד הארכת חיי המוצר והבטחת משאבים."},{"id":"m7-t2","s":"אסטרטגיה גלובלית מתאימה כשיש צורך גבוה בתגובה מקומית.","a":false,"why":"לא נכון. גלובלית = צורך גבוה בחיסכון ונמוך בתגובה מקומית (מוצר אחיד)."},{"id":"m7-t3","s":"אסטרטגיה רב-מקומית מתאימה לצורך נמוך בחיסכון בעלויות וצורך גבוה בתגובה מקומית.","a":true,"why":"נכון. התאמה מלאה לכל מדינה."},{"id":"m7-t4","s":"אסטרטגיה על-לאומית מתאימה לצורך גבוה גם בחיסכון בעלויות וגם בתגובה מקומית.","a":true,"why":"נכון. היא מנסה להשיג גם יעילות וגם התאמה."},{"id":"m7-t5","s":"אסטרטגיה בינלאומית מתאימה לצורך גבוה בשני הצירים.","a":false,"why":"לא נכון. בינלאומית = צורך נמוך בשניהם. גבוה בשניהם = על-לאומית."},{"id":"m7-t6","s":"ייצוא נותן לחברה שליטה גבוהה בשיווק ובמכירה בשוק הזר.","a":false,"why":"לא נכון. בייצוא השליטה נמוכה, כי המפיץ הזר הוא שמוכר."},{"id":"m7-t7","s":"זיכיון ורישיון הם אופני חדירה בעלות נמוכה ובסיכון נמוך.","a":true,"why":"נכון. השותף המקומי משקיע. השליטה משתנה, לפי החוזה."},{"id":"m7-t8","s":"רכישה או הקמת חברת בת חדשה הם אופן החדירה בעל הסיכון הנמוך ביותר.","a":false,"why":"לא נכון. הסיכון שלהם בינוני עד גבוה, בגלל ההשקעה הגבוהה."},{"id":"m7-t9","s":"Greenfield הוא הקמה מאפס של חברת בת חדשה בשוק הזר.","a":true,"why":"נכון. בונים מפעל או חברה חדשה בבעלות מלאה."},{"id":"m7-t10","s":"ברית אסטרטגית ככניסה לשוק זר מאופיינת בעלות בינונית, שליטה בינונית וסיכון נמוך.","a":true,"why":"נכון. כך היא מופיעה בסיכום."},{"id":"m7-t11","s":"הבדלים בתרבות, בשפה, ברגולציה ובמיסוי הם חלק מהאתגרים של גלובליזציה.","a":true,"why":"נכון. לצד התנהגות צרכנים וסביבה פוליטית."},{"id":"m7-t12","s":"באסטרטגיה גלובלית כל מדינה מקבלת מוצר שמותאם לה באופן מלא.","a":false,"why":"לא נכון. התאמה מלאה לכל מדינה היא רב-מקומית. בגלובלית המוצר אחיד."},{"id":"m7-t13","s":"ככלל, אופן חדירה שנותן יותר שליטה דורש גם השקעה גבוהה יותר.","a":true,"why":"נכון. רכישה/Greenfield נותנים שליטה גבוהה בעלות גבוהה; זיכיון זול אבל השליטה משתנה."},{"id":"m7-t14","s":"הבטחת משאבים היא אחד האתגרים של גלובליזציה.","a":false,"why":"לא נכון. הבטחת משאבים היא יתרון של גלובליזציה."},{"id":"m7-t15","s":"אופני החדירה לשווקים בינלאומיים נבחרים לפי רמות העלות, השליטה והסיכון.","a":true,"why":"נכון. אלה שלושת הממדים בטבלה של הקורס."},{"id":"m7-t16","s":"לפי הקורס, ייצוא הוא אופן החדירה הזול ביותר.","a":false,"why":"לא נכון. לייצוא עלות בינונית. הזול ביותר הוא זיכיון/רישיון."},{"id":"m7-t17","s":"אסטרטגיה בינלאומית מתאימה לחברה עם מוצר ייחודי שאין עליה לחץ להוזיל או להתאים אותו.","a":true,"why":"נכון. זו המשבצת נמוך-נמוך: מוכרים את מוצר הבית כמעט בלי שינויים."},{"id":"m7-t18","s":"בזיכיון ורישיון השליטה של החברה בשוק הזר היא תמיד מלאה.","a":false,"why":"לא נכון. השליטה משתנה ותלויה בחוזה; הפעילות עצמה בידי השותף המקומי."}],"scope":[{"ref":"סיכום · עמ׳ 12","x":"גלובליזציה: יתרונות ואתגרים","imp":1,"h":"גלובליזציה: יתרונות ואתגרים"},{"ref":"סיכום · עמ׳ 12","x":"אסטרטגיות בינלאומיות ברמת התאגיד: גלובלית, רב-מקומית, על-לאומית, בינלאומית","imp":2,"h":"ארבע האסטרטגיות הבינלאומיות: לחץ לחיסכון בעלויות × לחץ לתגובה מקומית"},{"ref":"סיכום · עמ׳ 12","x":"אופני חדירה: ייצוא, זיכיון/רישיון, בריתות, רכישה/Greenfield","imp":2,"h":"אופני חדירה לשווקים בינלאומיים: עלות, שליטה וסיכון"}],"outScope":[]}],"exams":[],"talk":{},"aud":{}};
// ===== diagrams for the strategy course: hand-drawn inline SVG (sharp on every screen, themed by the page's colours) =====
// canvas 480 wide; text ≥14 units so it stays readable on a phone. Classes are styled in shell.html (.fig ...).
const FIG = (() => {
  const W = 480;
  const t = (x, y, s, cls = '') => `<text x="${x}" y="${y}" text-anchor="middle" direction="rtl" class="${cls}">${s}</text>`;
  // a rounded box with centred lines: first line bold unless plain
  const box = (x, y, w, h, cls, lines, o = {}) => {
    const n = lines.length, lh = o.lh || 19, y0 = y + h / 2 - (n - 1) * lh / 2 + 5;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 12}" class="${cls}"/>` + lines.map((s, i) => t(x + w / 2, y0 + i * lh, s, i === 0 && !o.plain ? 'tb' : 'ts')).join('');
  };
  const mk = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs>`;
  const ar = (id, x1, y1, x2, y2, cls = 'ln', both = false) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" marker-end="url(#${id})"${both ? ` marker-start="url(#${id})"` : ''}/>`;
  const svg = (h, label, body) => `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${label}">${body}</svg>`;
  const F = {};

  // ---- unit 1 ----

    box(100, 12, 280, 78, 'hi', ['אסטרטגיה תאגידית', 'איפה נתחרה? באילו עסקים,', 'וכמה משאבים לכל יחידה?']) +
    box(60, 108, 360, 78, 'bx', ['אסטרטגיה עסקית (תחרותית)', 'איך ננצח את המתחרים הישירים', 'בשוק מסוים?']) +
    box(20, 204, 440, 78, 'bx', ['אסטרטגיה פונקציונלית', 'איך כל מחלקה תממש את הכיוון?', 'משאבי אנוש, שיווק, IT, כספים']) +
    ar('a-lv', 470, 30, 470, 270) + t(458, 152, 'מתרגמים', 'ts vert'))};

  F.tasks = {cap: 'חמש משימות הניהול האסטרטגי הן מעגל: אחרי ההערכה מתקנים וחוזרים לשלבים הקודמים. זה לא תהליך חד פעמי.', svg: svg(330, 'חמש משימות הניהול האסטרטגי במעגל', mk('a-tk') + (() => {
    const L = [['1. חזון, ערכים', 'ומשימת הארגון'], ['2. הצבת יעדים', 'ומטרות (SMART)'], ['3. ניסוח', 'האסטרטגיה'], ['4. יישום', 'וביצוע'], ['5. הערכה', 'ותיקון']];
    const A = [-90, -18, 54, 126, 198].map(d => d * Math.PI / 180), RX = 168, RY = 116, cx = 240, cy = 166;
    let s = '';
    for (let i = 0; i < 5; i++) { const a1 = A[i] + 0.47, a2 = A[i] + 1.256 - 0.47; // arc between box i and i+1, clockwise
      s += `<path d="M${cx + RX * Math.cos(a1)} ${cy + RY * Math.sin(a1)} A${RX} ${RY} 0 0 1 ${cx + RX * Math.cos(a2)} ${cy + RY * Math.sin(a2)}" class="ln thick" marker-end="url(#a-tk)"/>`; }
    A.forEach((a, i) => { const x = Math.min(406, Math.max(74, cx + RX * Math.cos(a))), y = cy + RY * Math.sin(a); s += box(x - 62, y - 30, 124, 60, i === 4 ? 'hi' : 'bx', L[i]); });
    s += t(cx, cy - 4, 'מעגל', 'tb') + t(cx, cy + 17, 'שחוזר על עצמו', 'ts');
    return s; })())};

  F.vision = {cap: 'חזון מסתכל קדימה ומכוון בעיקר את העובדים וההנהלה. מהות העסק מתארת מה עושים היום ובשביל מי. ערכים הם איך מתנהגים בדרך.', svg: svg(150, 'חזון מול מהות העסק מול ערכים',
    box(326, 14, 144, 122, 'hi', ['חזון', 'לאן הולכים?', 'העתיד הרצוי', 'מכוון לעובדים']) +
    box(168, 14, 144, 122, 'bx', ['מהות העסק', 'מה עושים היום?', 'עבור מי?', 'תועלת ללקוח']) +
    box(10, 14, 144, 122, 'bx', ['ערכים', 'מה מנחה אותנו?', 'איך מתנהגים', '4 עד 8 ערכי ליבה']))};

  F.smart = {cap: 'יעד SMART חייב את כל חמש האותיות. "לשפר את השירות" נכשל: הוא לא מדיד ולא תחום בזמן.', svg: svg(184, 'חמש האותיות של מודל SMART', (() => {

    let s = '';
    L.forEach(([k, v], i) => { const x = 386 - i * 94; s += `<rect x="${x}" y="14" width="84" height="104" rx="12" class="${i === 4 || i === 1 ? 'hi' : 'bx'}"/>` + t(x + 42, 62, k, 'big') + (v.length > 9 ? t(x + 42, 92, v.split(' / ')[0], 'ts') + t(x + 42, 108, 'רלוונטי', 'ts') : t(x + 42, 98, v, 'ts')); });
    s += `<rect x="10" y="134" width="460" height="40" rx="10" class="gd"/>` + t(240, 159, '"להגדיל ב־15 אחוז את המכירות באתר עד סוף 2027" ✓', 'ts');
    return s; })())};

  F.topdown = {cap: 'ההבדל הוא כיוון הזרימה: ב־Top-down ההנהלה מכתיבה למטה; ב־Bottom-up הרעיונות עולים מהשטח להנהלה.', svg: svg(226, 'Top-down מול Bottom-up', mk('a-td') +
    box(250, 12, 220, 52, 'hi', ['הנהלה בכירה'], {plain: false}) + box(250, 160, 220, 52, 'bx', ['עובדים ומומחים בשטח']) +
    ar('a-td', 360, 70, 360, 152, 'ln thick') + t(400, 106, 'Top-down', 'tb') + t(400, 126, 'מכתיבים', 'ts') +
    box(10, 12, 220, 52, 'bx', ['הנהלה בכירה']) + box(10, 160, 220, 52, 'hi', ['עובדים ומומחים בשטח']) +
    ar('a-td', 120, 152, 120, 70, 'ln thick') + t(160, 106, 'Bottom-up', 'tb') + t(160, 126, 'מציעים', 'ts'))};

  // ---- unit 2 ----
  F.pestel = {cap: 'PESTEL בודק את המאקרו־סביבה: כוחות רחבים שהחברה לא שולטת בהם. שני ה־E שונים: כלכלי מול סביבתי.', svg: svg(360, 'מודל PESTEL סביב החברה', (() => {
    const L = [['P', 'פוליטי'], ['E', 'כלכלי'], ['S', 'חברתי'], ['T', 'טכנולוגי'], ['E', 'סביבתי'], ['L', 'משפטי']];
    let s = `<circle cx="240" cy="165" r="122" class="ln dash"/>` + box(180, 135, 120, 60, 'hi', ['הענף', 'והחברה']);
    L.forEach(([k, v], i) => { const a = -Math.PI / 2 + i * Math.PI / 3, x = 240 + 122 * Math.cos(a), y = 165 + 122 * Math.sin(a);
      s += `<circle cx="${x}" cy="${y}" r="38" class="${k === 'E' ? 'hi' : 'bx'}"/>` + t(x, y - 2, k, 'big') + t(x, y + 18, v, 'ts'); });
    s += t(240, 352, 'ועוד G = גלובלי', 'tb');
    return s; })())};

  F.forces = {cap: 'חמשת הכוחות של פורטר: ככל שהכוחות חזקים יותר, הענף פחות רווחי. חסמי כניסה גבוהים (למשל יתרון לגודל) מחלישים את איום הכניסה, ולכן מגדילים את הרווחיות.', svg: svg(380, 'חמשת הכוחות של פורטר', mk('a-ff') +

  m.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { const [k, v] = b.dataset.tf.split(':'); const n = +k.slice(1); X.tf[n] = v === 'true'; keepX(); m.querySelectorAll(`[data-tf^="${k}:"]`).forEach(x => x.classList.toggle('sel', x === b)); count(); });
  m.querySelectorAll('[data-xw]').forEach(t => t.oninput = () => { X.why[t.dataset.xw] = t.value; clearTimeout(t.kt); t.kt = setTimeout(keepX, 400); });
  const end = () => { const miss = total - answered(); if (!confirm(miss ? `נשארו ${miss} שאלות בלי תשובה. להגיש בכל זאת?` : 'להגיש את המבחן?')) return; finish(); };
  $('#xend').onclick = end; $('#xend2').onclick = end;
}
// points: 4 per right answer in part A, 3 per right mark in part B, and 3 more for each reasoning the student checks against the model one
function points() {
  const ex = X.ex, a = ex.mc.filter((q, k) => X.ans[k] === q.a).length, b = ex.tf.filter((q, k) => X.tf[k] === q.a).length, w = ex.tf.filter((q, k) => X.tf[k] === q.a && X.self[k]).length;
  return {a, b, w, score: Math.round((a * 4 + b * 3 + w * 3) * 100 / (ex.mc.length * 4 + ex.tf.length * 6))};
}
// time ran out while the student was elsewhere on the site: the exam is handed in, and they are told so
function doneMsg() { if (view === 'exam') { render(); window.scrollTo(0, 0); } else { nav(); toast('הזמן נגמר והמבחן הוגש. התוצאות מחכות בלשונית מבחנים.'); } }
function finish() {
  X.done = true; clearInterval(X.t);
  const ex = X.ex, p = points();
  ex.mc.forEach((q, k) => { if (X.ans[k] != null) S.mcq[q.id] = {ok: X.ans[k] === q.a, n: ((S.mcq[q.id] || {}).n || 0) + 1}; });
  ex.tf.forEach((q, k) => { if (X.tf[k] != null) S.mcq[q.id] = {ok: X.tf[k] === q.a, n: ((S.mcq[q.id] || {}).n || 0) + 1}; });
  S.exams.push({id: X.id, ts: Date.now(), score: p.score, right: p.a + p.b, sec: Math.round((Date.now() - X.start) / 1000)}); X.rec = S.exams.length - 1; save(); keepX(); doneMsg();
}
function drawResult(m) {
  X.shown = true;
  const ex = X.ex, p = points();
  const byUnit = {}; ex.mc.forEach((q, k) => { if (X.ans[k] !== q.a && q.unit !== 'exam') byUnit[q.unit] = (byUnit[q.unit] || 0) + 1; }); ex.tf.forEach((q, k) => { if (X.tf[k] !== q.a && q.unit !== 'exam') byUnit[q.unit] = (byUnit[q.unit] || 0) + 1; });
  const weak = Object.entries(byUnit).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([u]) => U[u]).filter(Boolean);
  m.innerHTML = crumbs(['מבחנים', 'exam'], ['תוצאות']) + `<header class="page"><h2>ציון: <span id="xscore">${p.score}</span></h2>
    <p class="lead">חלק א׳: ${p.a}/${ex.mc.length} נכונות. חלק ב׳: ${p.b}/${ex.tf.length} סימונים נכונים. <span id="xself">${p.w ? `ועוד ${p.w} נימוקים שסימנתם כטובים.` : ''}</span></p>
    <p class="note">בחלק ב׳ הנימוק שווה חצי מהנקודות. השוו את הנימוק שלכם לנימוק לדוגמה, וסמנו ✓ אם אמרתם את אותו דבר: הציון יתעדכן.</p>
    ${weak.length ? `<p class="note">כדאי לחזור על: ${weak.map(u => `<a href="#unit/${u.id}" data-go="unit" data-arg="${u.id}">${esc(u.title)}</a>`).join(' · ')}</p>` : ''}</header>
    <h3 class="lh">חלק א׳</h3>
    ${ex.mc.map((q, k) => `<div class="qcard"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.q)}</div><div class="opts">${q.o.map((o, i) => `<button class="opt ${i === q.a ? 'right' : i === X.ans[k] ? 'wrong' : ''}" disabled><span class="k">${HEB[i]}</span><span>${rich(o)}</span></button>`).join('')}</div><div class="expl">${explain(q, X.ans[k] ?? null)}</div></div>`).join('')}
    <h3 class="lh">חלק ב׳</h3>
    ${ex.tf.map((q, k) => `<div class="qcard"><div class="qtext"><span class="qn num">${k + 1}.</span> ${rich(q.s)}</div><div class="opts tfopts">${tfButtons('r' + k, X.tf[k], true, q.a)}</div><div class="expl">${explainTF(q, X.tf[k] ?? null, X.why[k] || '')}</div>
      ${X.tf[k] === q.a ? ((X.why[k] || '').trim() ? `<label class="selfchk"><input type="checkbox" data-self="${k}" ${X.self[k] ? 'checked' : ''}> הנימוק שלי אומר את אותו דבר (+3 נק׳)</label>` : '<p class="note">לא נכתב נימוק, ולכן 3 מתוך 6 נקודות. במבחן האמיתי תמיד כותבים נימוק.</p>') : ''}</div>`).join('')}
    <div class="row"><button class="btn primary" id="xback">חזרה למבחנים</button></div>`;
  m.querySelectorAll('[data-self]').forEach(c => c.onchange = () => {
    X.self[c.dataset.self] = c.checked; const p2 = points(); $('#xscore').textContent = p2.score; $('#xself').textContent = p2.w ? `ועוד ${p2.w} נימוקים שסימנתם כטובים.` : '';
    if (S.exams[X.rec]) { S.exams[X.rec].score = p2.score; save(); }
  });
  $('#xback').onclick = () => { X.id = null; X.done = false; go('exam'); };
}

// another tab or device may have moved on: take its newer progress when this tab comes back (not during an exam or while listening)
async function resyncC() {
  if (!ACC.user() || (X.id && !X.done) || resyncC.busy) return; resyncC.busy = true;
  try { const b = S._at; await sync(); if (S._at !== b && view !== 'listen') { nav(); render(); } } finally { resyncC.busy = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resyncC(); });
window.addEventListener('storage', e => { if (ACC.user() && e.key === ACC.key(CCOURSE) && !(X.id && !X.done) && view !== 'listen') { loadS(); nav(); render(); } });
// ---------- boot ----------
$('#main').innerHTML = '<p class="note" style="text-align:center;padding:40px 0">טוען…</p>';
(function () { const b = $('#cbar b'); if (b) b.textContent = 'ניהול אסטרטגי מתקדם'; const a = $('#cbar a'); if (a) { a.href = '/'; a.removeAttribute('data-go'); } const bl = $('.brandlink'); if (bl) { bl.href = '/'; bl.removeAttribute('data-go'); } })();
ACC.ready().catch(() => {}).then(async () => {
  if (!ACC.user()) { try { sessionStorage.setItem('silas_return', location.pathname + location.hash); } catch (e) {} location.replace('/'); return; }
  if (ACC.user().blocked) { location.replace('/'); return; }
  ACC.onBlocked = () => location.replace('/');
  loadS(); await sync();
  const p = parseHash(); view = p.v; arg = p.a; if (!VIEWS.some(v => v[0] === view) && !PARENT[view]) view = 'dash';
  if (restoreX() && !X.done) { view = 'exam'; arg = null; try { history.replaceState(null, '', '#exam'); } catch (e) {} }
  nav(); render();
});
</script>
